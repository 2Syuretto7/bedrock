concept: s0.printing
minutes: 15
claim: You can make Python print a number, a piece of text and a sum.
recalls: [f0.adding]
uses: [f0.counting]
leads: [d1.later]
bridges:
  f0.adding: |
    Adding by hand gave you $3 + 4 = 7$. Python does the same sum when you write it inside `print`.
parts:
  recall:
    - text: In [[f0.adding]] you added counts by hand.
  puzzle:
    - text: What does a machine need to be told in order to add?
  intuition:
    - text: |
        It needs the two numbers and the word for showing the result.

        ```python
        print(3 + 4)
        ```
  derivation:
    - text: Python works out `3 + 4` first, then `print` shows it.
    - question:
        id: predict-sum
        type: predict
        system: s2
        prompt: What does this print?
        code: |
          a = 2
          print(a + 5)
          print("a + 5")
        output: |
          7
          a + 5
        explanation: The first line adds. The second prints the text between the quotes exactly.
  formal:
    - text: "`print(x)` writes the value of `x` and then starts a new line."
  drill:
    - question:
        id: predict-fast
        type: predict
        system: s1
        prompt: What does this print?
        code: print(1 + 1)
        output: "2"
        explanation: One and one more.
  work:
    - question:
        id: write-sum
        type: code
        mode: write
        system: s2
        prompt: Set `total` to the sum of 19 and 23, then print it.
        starter: |
          total = 0
        solution: |
          total = 19 + 23
          print(total)
        tests: |
          assert total == 19 + 23, "total is not the sum of 19 and 23 yet"
          assert output.strip() == str(total), "print total, and nothing else"
        wrong:
          - "total = 19 + 23\n"
          - "total = 1923\nprint(total)\n"
        explanation: "`total = 19 + 23` stores 42 and `print(total)` shows it."
    - question:
        id: write-hello
        type: code
        mode: write
        system: s1
        prompt: Print the word `pebble`.
        starter: ""
        solution: |
          print("pebble")
        tests: |
          assert output.strip() == "pebble", "print exactly the word pebble"
        wrong:
          - "print(\"Pebble\")\n"
        explanation: Text goes between quotes.
    - question:
        id: fix-sum
        type: code
        mode: find-bug
        system: s2
        prompt: This should print 9 but prints something else. Fix it.
        starter: |
          print("4 + 5")
        solution: |
          print(4 + 5)
        tests: |
          assert output.strip() == "9", "it should print 9"
        wrong:
          - "print(\"9 \" + \"9\")\n"
        explanation: The quotes turned the sum into text.
  connections:
    - text: Printing is how every later program reports what it found.
