concept: f0.adding
minutes: 10
claim: You can add two small counts.
recalls: [f0.counting]
uses: []
leads: [s0.printing]
parts:
  recall:
    - text: In [[f0.counting]] a count was the last number said.
  puzzle:
    - text: Two bags of pebbles are poured together. Must you count again from one?
  intuition:
    - text: No. Start from the first count and count on.
  derivation:
    - text: "Counting on four times from three: $3 + 4 = 7$."
  formal:
    - text: Adding $a$ and $b$ is counting on $b$ times from $a$.
  drill:
    - question:
        id: sum-fast
        type: numeric
        system: s1
        prompt: "$2 + 5$"
        answer: "7"
        explanation: Count on five times from two.
  work:
    - question:
        id: sum-slow
        type: numeric
        system: s2
        prompt: A bag holds 8 pebbles and another holds half as many. How many are there together?
        answer: "12"
        explanation: Half of 8 is 4, and $8 + 4 = 12$.
  connections:
    - text: Soon a machine will do the adding, in [[s0.printing]].
