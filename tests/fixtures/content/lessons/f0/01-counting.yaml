concept: f0.counting
minutes: 10
claim: You can count a small collection and say which of two counts is larger.
recalls: []
uses: []
leads: [f0.adding]
parts:
  recall:
    - text: This is the first lesson, so there is nothing to recall yet.
  puzzle:
    - text: A shepherd has no words for numbers. How can she tell whether every sheep came home?
  intuition:
    - text: She drops one pebble in a bag for each sheep. Matching **one to one** is counting. Next comes [[f0.adding]].
  derivation:
    - text: "If the pebbles and the sheep pair off exactly, the two collections have the same count: $n = n$."
    - question:
        id: pebbles
        type: numeric
        system: s2
        prompt: Twelve sheep leave and one pebble is dropped for each. Three pebbles are left over at night. How many sheep came home?
        answer: "9"
        unit: sheep
        explanation: Each sheep that returns removes one pebble. $12 - 3 = 9$.
