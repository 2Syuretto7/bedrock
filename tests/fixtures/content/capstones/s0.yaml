cluster: S0
title: A sum, shown
minutes: 15
claim: You will have added by hand and made a program show the same sum.
brief: Add once by hand, then make the machine do it, as in [[s0.printing]].
stages:
  - title: By hand
    blocks:
      - text: Count on, as in [[f0.adding]].
      - question:
          id: by-hand
          type: numeric
          system: s1
          concepts: [f0.adding]
          prompt: "$5 + 6$"
          answer: "11"
          explanation: Count on six times from five.
  - title: Read it
    blocks:
      - question:
          id: read-it
          type: predict
          system: s2
          concepts: [s0.printing]
          prompt: What does this print?
          code: print(5 + 6)
          output: "11"
          explanation: Python adds first and then shows the result.
  - title: Write it
    blocks:
      - question:
          id: write-it
          type: code
          mode: write
          system: s2
          concepts: [s0.printing, f0.adding]
          prompt: Set `total` to the sum of 5 and 6, then print it.
          starter: |
            total = 0
          solution: |
            total = 5 + 6
            print(total)
          tests: |
            assert total == 5 + 6, "total is not the sum of 5 and 6 yet"
            assert output.strip() == str(total), "print total, and nothing else"
          wrong:
            - "total = 5 + 6\n"
          explanation: The name holds the sum and print shows it.
review: You added by hand in [[f0.adding]] and by machine in [[s0.printing]].
