# Track Q: Data engineering. Each cluster lists the clusters it requires and its
# concepts in teaching order. Unless a concept says otherwise, it requires the
# concept before it and the final concepts of the required clusters. A concept
# with its own `requires` keeps those defaults and adds a link to an earlier idea.
track: Q
title: Data engineering
clusters:
  - id: Q0
    title: Relational model and SQL
    # Cluster 12 of 65 on the route Learn walks.
    requires: [S3, F2]
    nodes:
      - Tables, rows and keys
      - Relational algebra
      - Selecting and filtering
      - title: Joins
        requires: [q0.selecting-and-filtering, f2.sets-and-set-operations]
      - Grouping and aggregation
      - Subqueries and common table expressions
      - Window functions
      - title: NULL and three-valued logic
        requires: [q0.window-functions, f2.propositions-and-connectives]
      - Writes, constraints and transactions
      - Indexes from the outside
  - id: Q1
    title: Data modelling
    # Cluster 13 of 65 on the route Learn walks.
    requires: [Q0]
    nodes:
      - Entities and relationships
      - Keys and functional dependencies
      - Normal forms
      - Denormalisation and its costs
      - Document models
      - Graph models
      - Schema evolution and compatibility
  - id: Q2
    title: Storage engines
    # Cluster 25 of 65 on the route Learn walks.
    requires: [F7, Q1, H2]
    nodes:
      - Pages, records and the buffer pool
      - Heap files and slotted pages
      - title: B-trees
        requires: [q2.heap-files-and-slotted-pages, s2.balanced-search-trees]
      - title: Write-ahead logging
        requires: [q2.b-trees, h2.files-and-file-systems]
      - Crash recovery
      - Log-structured merge trees
      - title: Bloom filters
        requires: [q2.log-structured-merge-trees, f4.the-birthday-problem-and-collisions]
      - Row and column storage
      - Compression and encodings
  - id: Q3
    title: Query processing
    # Cluster 26 of 65 on the route Learn walks.
    requires: [Q2, S7]
    nodes:
      - From SQL to a plan
      - The iterator model
      - Scans and selections
      - Nested loop joins
      - title: Hash joins
        requires: [q3.nested-loop-joins, s2.hash-tables]
      - title: Sort-merge joins and external sorting
        requires: [q3.hash-joins, s3.sorting]
      - Aggregation
      - Vectorised execution
      - Cardinality estimation
      - title: Cost-based optimisation and join ordering
        requires: [q3.cardinality-estimation, s3.dynamic-programming]
  - id: Q4
    title: Transactions and concurrency control
    # Cluster 27 of 65 on the route Learn walks.
    requires: [Q3, D0]
    nodes:
      - ACID precisely
      - Isolation anomalies
      - Two-phase locking
      - Multiversion concurrency control
      - Snapshot isolation and write skew
      - Serialisable snapshot isolation
      - Deadlock detection
      - Recovery with ARIES
  - id: Q5
    title: Batch processing
    # Cluster 56 of 65 on the route Learn walks.
    requires: [D9, D5, Q3]
    nodes:
      - Columnar file formats
      - MapReduce
      - Shuffles and partitioning
      - Joins at scale
      - Dataflow engines
      - Skew and stragglers
      - Fault tolerance by lineage
      - Incremental batch jobs
  - id: Q6
    title: Stream processing
    # Cluster 57 of 65 on the route Learn walks.
    requires: [Q5, D2]
    nodes:
      - Events and logs
      - title: Partitioned logs and consumer groups
        requires: [q6.events-and-logs, d4.raft-log-replication]
      - Event time and processing time
      - Windows
      - Watermarks and late data
      - Stateful operators and checkpoints
      - title: Exactly-once processing
        requires: [q6.stateful-operators-and-checkpoints, d2.idempotency-and-retries]
      - Stream joins
      - Change data capture
  - id: Q7
    title: Pipelines and orchestration
    # Cluster 58 of 65 on the route Learn walks.
    requires: [Q6, S3]
    nodes:
      - Pipelines as graphs
      - Scheduling and backfills
      - Idempotent tasks
      - Data quality and contracts
      - Lineage and metadata
      - Warehouses and ELT
      - title: Table formats and snapshots
        requires: [q7.warehouses-and-elt, q4.multiversion-concurrency-control]
      - Privacy and retention
  - id: Q8
    title: Analytical systems
    # Cluster 59 of 65 on the route Learn walks.
    requires: [Q7, Q3, F4]
    nodes:
      - OLTP and OLAP
      - Facts, dimensions and star schemas
      - Massively parallel query execution
      - Materialised views
      - title: "Sketches: HyperLogLog and count-min"
        requires: [q8.materialised-views, f4.the-birthday-problem-and-collisions]
      - Inverted indexes and search
      - Vector indexes and similarity search
