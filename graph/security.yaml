# Track R: Security and reliability. Each cluster lists the clusters it requires and its
# concepts in teaching order. Unless a concept says otherwise, it requires the
# concept before it and the final concepts of the required clusters. A concept
# with its own `requires` keeps those defaults and adds a link to an earlier idea.
track: R
title: Security and reliability
clusters:
  - id: R0
    title: Cryptography fundamentals
    # Cluster 33 of 65 on the route Learn walks.
    requires: [F8, D1]
    nodes:
      - Security goals and adversaries
      - Symmetric ciphers
      - Block cipher modes
      - title: Cryptographic hash functions
        requires: [r0.block-cipher-modes, f7.fingerprints-and-content-hashes]
      - Message authentication codes
      - Authenticated encryption
      - Key exchange
      - Public-key encryption and signatures
      - Certificates and trust
      - title: TLS
        requires: [r0.certificates-and-trust, d1.tcp-reliable-delivery]
      - Password hashing
      - Randomness and key management
  - id: R1
    title: Threat modelling
    # Cluster 34 of 65 on the route Learn walks.
    requires: [R0]
    nodes:
      - Assets, adversaries and trust boundaries
      - Data flow diagrams
      - STRIDE
      - title: Attack trees and attack paths
        requires: [r1.stride, s3.breadth-first-and-depth-first-search]
      - Rating and ranking risks
      - Mitigations and residual risk
  - id: R2
    title: Secure coding
    # Cluster 35 of 65 on the route Learn walks.
    requires: [R1, Q0, S6]
    nodes:
      - Validating input
      - title: Injection
        requires: [r2.validating-input, q0.selecting-and-filtering]
      - Cross-site scripting and output encoding
      - Cross-site request forgery and cookies
      - Authentication and sessions
      - Authorisation and access control
      - Secrets management
      - Dependencies and the supply chain
      - Security testing
      - Audit logging and detection
  - id: R3
    title: Observability
    # Cluster 36 of 65 on the route Learn walks.
    requires: [R2, F5, D2]
    nodes:
      - Logs, metrics and traces
      - Structured logging
      - Counters, gauges and histograms
      - title: Percentiles from histograms
        requires: [r3.counters-gauges-and-histograms, f5.summaries-mean-median-and-percentiles]
      - title: Distributed tracing and context propagation
        requires: [r3.percentiles-from-histograms, d1.sockets-and-rpc]
      - Dashboards that answer questions
      - Alerting on symptoms
      - Cardinality and cost
  - id: R4
    title: Reliability engineering
    # Cluster 37 of 65 on the route Learn walks.
    requires: [R3, F6]
    nodes:
      - SLIs, SLOs and error budgets
      - title: Availability arithmetic
        requires: [r4.slis-slos-and-error-budgets, f4.independence]
      - Redundancy and failover
      - title: Timeouts, retries and backoff
        requires: [r4.redundancy-and-failover, d2.idempotency-and-retries]
      - Circuit breakers and bulkheads
      - title: Load shedding and backpressure
        requires: [r4.circuit-breakers-and-bulkheads, f6.response-time-against-load]
      - Graceful degradation
      - "Safe deployment: canaries and progressive delivery"
      - Overload and metastable failures
  - id: R5
    title: Incident response
    # Cluster 38 of 65 on the route Learn walks.
    requires: [R4]
    nodes:
      - Detecting and declaring incidents
      - Roles and communication
      - Mitigate first
      - Debugging under pressure
      - Blameless postmortems
      - Learning from incidents
  - id: R6
    title: Chaos engineering and verification
    # Cluster 39 of 65 on the route Learn walks.
    requires: [R5, D4]
    nodes:
      - Steady state and hypotheses
      - Fault injection
      - Game days
      - title: Deterministic simulation testing
        requires: [r6.game-days, d0.testing-concurrent-code-deterministically]
      - title: Checking histories for linearisability
        requires: [r6.deterministic-simulation-testing, d3.linearisability]
      - Model checking by state exploration
      - What simulation cannot catch
  - id: R7
    title: Systems and network security
    # Cluster 64 of 65 on the route Learn walks.
    requires: [M6, D7, R2]
    nodes:
      - Network attacks
      - Segmentation and firewalls
      - Zero trust and mutual TLS
      - Sandboxing and least privilege
      - Container and cloud security
      - Rate limiting and abuse
      - Securing ML systems
