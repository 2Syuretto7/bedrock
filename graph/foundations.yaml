# Track F: Foundations. Each cluster lists the clusters it requires and its
# concepts in teaching order. Unless a concept says otherwise, it requires the
# concept before it and the final concepts of the required clusters. A concept
# with its own `requires` keeps those defaults and adds a link to an earlier idea.
track: F
title: Foundations
clusters:
  - id: F0
    title: Number sense for engineers
    # Cluster 1 of 65 on the route Learn walks.
    requires: []
    nodes:
      - Whole numbers and place value
      - The four operations and order of operations
      - Fractions, decimals and percentages
      - Negative numbers
      - Powers and roots
      - Powers of two
      - Ratio, rate and proportion
      - Units, prefixes and orders of magnitude
      - Estimation and back-of-the-envelope reasoning
  - id: F1
    title: Algebra and functions
    # Cluster 4 of 65 on the route Learn walks.
    requires: [H0]
    nodes:
      - Variables and expressions
      - Linear equations
      - Inequalities
      - Coordinates, lines and slope
      - Functions as machines
      - Composition and inverses
      - Exponents and exponential growth
      - Logarithms
      - Arithmetic and geometric series
      - Summation notation
  - id: F2
    title: Logic, sets and proof
    # Cluster 6 of 65 on the route Learn walks.
    requires: [F1, S1]
    nodes:
      - Propositions and connectives
      - Boolean algebra
      - Quantifiers and their negation
      - Sets and set operations
      - Relations and functions between sets
      - Direct proof
      - Contrapositive and contradiction
      - Induction and strong induction
      - Loop invariants
      - Equivalence relations and partial orders
  - id: F3
    title: Discrete mathematics
    # Cluster 8 of 65 on the route Learn walks.
    requires: [F2, S2]
    nodes:
      - Counting with products and sums
      - Permutations and combinations
      - The pigeonhole principle
      - Inclusion and exclusion
      - title: Modular arithmetic
        requires: [f3.inclusion-and-exclusion, h0.twos-complement-and-overflow]
      - Divisibility and Euclid's algorithm
      - Recurrences
      - Asymptotic notation
      - Graph theory basics
      - Trees and their properties
  - id: F4
    title: Probability
    # Cluster 9 of 65 on the route Learn walks.
    requires: [F3]
    nodes:
      - Sample spaces and events
      - Conditional probability
      - Bayes' rule
      - Independence
      - Random variables
      - Expectation and linearity
      - Variance
      - Common discrete distributions
      - Continuous distributions and densities
      - title: The birthday problem and collisions
        requires: [f4.continuous-distributions-and-densities, s2.hash-tables]
      - Tail bounds
      - The law of large numbers and the central limit theorem
      - Simulation and pseudo-random numbers
  - id: F5
    title: Statistics for engineers
    # Cluster 10 of 65 on the route Learn walks.
    requires: [F4]
    nodes:
      - "Summaries: mean, median and percentiles"
      - Distributions of latency and heavy tails
      - Histograms
      - Sampling and estimators
      - Confidence intervals
      - Hypothesis tests
      - The bootstrap
      - "Comparing two systems: A/B tests"
      - Noise in measurements and benchmarks
  - id: F6
    title: Queueing and performance modelling
    # Cluster 21 of 65 on the route Learn walks.
    requires: [D0, F5]
    nodes:
      - Arrivals and the Poisson process
      - Little's law
      - Utilisation
      - The single-server queue
      - Response time against load
      - Many servers and pooling
      - Open and closed systems
      - Fan-out and tail latency
      - Amdahl's law and the universal scalability law
      - Capacity planning
  - id: F7
    title: Information, coding and compression
    # Cluster 24 of 65 on the route Learn walks.
    requires: [D2, F4]
    nodes:
      - title: Checksums and error detection
        requires: [d2.impossibility-of-consensus-with-one-faulty-process, f4.simulation-and-pseudo-random-numbers, d1.packets-loss-and-checksums]
      - Cyclic redundancy checks
      - Error-correcting codes
      - Bits and entropy
      - Prefix codes and Huffman coding
      - Dictionary compression
      - Erasure codes
      - Fingerprints and content hashes
  - id: F8
    title: Number theory for cryptography
    # Cluster 32 of 65 on the route Learn walks.
    requires: [D6, F3]
    nodes:
      - Fast modular exponentiation
      - Modular inverses
      - Fermat's and Euler's theorems
      - The Chinese remainder theorem
      - Groups and generators
      - Finite fields
      - The discrete logarithm problem
      - Elliptic curve groups
  - id: F9
    title: Linear algebra for computing
    # Cluster 44 of 65 on the route Learn walks.
    requires: [S8, F1]
    nodes:
      - Vectors
      - Dot products and norms
      - Matrices as maps
      - title: Matrix multiplication and its cost
        requires: [f9.matrices-as-maps, h4.loop-order-and-blocking]
      - Solving linear systems
      - Least squares
      - Eigenvectors and power iteration
      - Floating point in linear algebra
  - id: F10
    title: Calculus and optimisation
    # Cluster 45 of 65 on the route Learn walks.
    requires: [F9]
    nodes:
      - Rates of change and the derivative
      - Rules of differentiation
      - The chain rule
      - Integrals as accumulation
      - Partial derivatives and the gradient
      - Convexity
      - Gradient descent
      - Stochastic gradient descent
