# Track H: Hardware and HPC. Each cluster lists the clusters it requires and its
# concepts in teaching order. Unless a concept says otherwise, it requires the
# concept before it and the final concepts of the required clusters. A concept
# with its own `requires` keeps those defaults and adds a link to an earlier idea.
track: H
title: Hardware and HPC
clusters:
  - id: H0
    title: Bits and data representation
    # Cluster 3 of 65 on the route Learn walks.
    requires: [S0]
    nodes:
      - Binary and hexadecimal
      - Unsigned integers and fixed widths
      - Two's complement and overflow
      - Bitwise operations and masks
      - Characters, Unicode and UTF-8
      - Floating point and IEEE 754
      - Endianness and byte order
      - Alignment and the size of things
  - id: H1
    title: Computer architecture
    # Cluster 18 of 65 on the route Learn walks.
    requires: [S7, H0, F2]
    nodes:
      - Logic gates
      - Adders and the ALU
      - Latches, registers and memory
      - The fetch-decode-execute cycle
      - "An instruction set: RISC-V"
      - Assembly programming
      - Calling conventions and the stack
      - Pipelining
      - Hazards and branch prediction
      - Superscalar and out-of-order execution
  - id: H2
    title: Operating systems
    # Cluster 19 of 65 on the route Learn walks.
    requires: [H1]
    nodes:
      - What an operating system does
      - Processes and system calls
      - title: Scheduling
        requires: [h2.processes-and-system-calls, s2.heaps-and-priority-queues]
      - Virtual memory and page tables
      - The TLB and address translation
      - Interrupts and I/O
      - Files and file systems
      - Threads in the kernel
      - Signals and the life of a process
  - id: H3
    title: Linux and C
    # Cluster 40 of 65 on the route Learn walks.
    requires: [R6, H2]
    nodes:
      - The shell and the file system
      - Processes, pipes and redirection
      - Permissions and users
      - "From Python to C: compiling and linking"
      - Types, sizes and integer promotion
      - Pointers and addresses
      - Arrays and pointer arithmetic
      - Strings in C
      - Structs and memory layout
      - Stack and heap allocation
      - Undefined behaviour
      - title: Memory errors and sanitisers
        requires: [h3.undefined-behaviour, r2.validating-input]
      - "Build tools: make and compiler flags"
  - id: H4
    title: Memory hierarchy and caches
    # Cluster 41 of 65 on the route Learn walks.
    requires: [H3]
    nodes:
      - The memory wall
      - title: Cache lines, sets and associativity
        requires: [h4.the-memory-wall, s2.hash-tables]
      - Locality
      - The three kinds of miss
      - Loop order and blocking
      - title: Cache coherence and false sharing
        requires: [h4.loop-order-and-blocking, d0.atomic-operations-and-compare-and-swap]
      - Prefetching
      - NUMA
      - Measuring with hardware counters
  - id: H5
    title: Performance engineering
    # Cluster 42 of 65 on the route Learn walks.
    requires: [H4, F5]
    nodes:
      - title: Measuring performance honestly
        requires: [h4.measuring-with-hardware-counters, f5.noise-in-measurements-and-benchmarks, f5.noise-in-measurements-and-benchmarks]
      - "Profilers: sampling and instrumentation"
      - Arithmetic intensity and the roofline
      - Branches and branch-free code
      - The cost of allocation
      - Algorithmic and constant-factor gains
      - Performance regression testing
  - id: H6
    title: SIMD and vector processing
    # Cluster 46 of 65 on the route Learn walks.
    requires: [F10, H4]
    nodes:
      - SIMD lanes
      - Vector instructions and intrinsics
      - Auto-vectorisation and what blocks it
      - title: Arrays of structures and structures of arrays
        requires: [h6.auto-vectorisation-and-what-blocks-it, h0.alignment-and-the-size-of-things]
      - Masks and predication
      - Reductions and shuffles
  - id: H7
    title: Parallel programming
    # Cluster 47 of 65 on the route Learn walks.
    requires: [H6, D0]
    nodes:
      - Parallelism and concurrency
      - Partitioning work across threads
      - Fork-join and work stealing
      - Parallel reductions and prefix sums
      - Synchronisation costs
      - "Parallel patterns: map, stencil, gather and scatter"
      - Message passing and collectives
  - id: H8
    title: GPUs and CUDA
    # Cluster 48 of 65 on the route Learn walks.
    requires: [H7, F9]
    nodes:
      - Throughput machines
      - Threads, warps, blocks and grids
      - The GPU memory hierarchy
      - title: Memory coalescing
        requires: [h8.the-gpu-memory-hierarchy, h4.cache-lines-sets-and-associativity]
      - Shared memory and bank conflicts
      - Occupancy and latency hiding
      - "Writing kernels: map and reduce"
      - Scan on the GPU
      - title: Tiled matrix multiplication
        requires: [h8.scan-on-the-gpu, f9.matrix-multiplication-and-its-cost]
      - Streams and overlapping transfers
      - Tensor cores and low precision
  - id: H9
    title: Accelerators and interconnects
    # Cluster 54 of 65 on the route Learn walks.
    requires: [M2]
    nodes:
      - Interconnects and topology
      - Collective algorithms and their cost
      - Systolic arrays and TPUs
      - Memory capacity and bandwidth planning
      - Power and cooling
      - The datacentre
