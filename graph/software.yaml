# Track S: Software engineering. Each cluster lists the clusters it requires and its
# concepts in teaching order. Unless a concept says otherwise, it requires the
# concept before it and the final concepts of the required clusters. A concept
# with its own `requires` keeps those defaults and adds a link to an earlier idea.
track: S
title: Software engineering
clusters:
  - id: S0
    title: First programs
    # Cluster 2 of 65 on the route Learn walks.
    requires: [F0]
    nodes:
      - What a program is
      - Values, types and variables
      - Expressions
      - Strings
      - Booleans and conditionals
      - Loops
      - Functions
      - Lists and tuples
      - Dictionaries and sets
      - Reading errors and debugging
  - id: S1
    title: Python proper
    # Cluster 5 of 65 on the route Learn walks.
    requires: [S0, F1]
    nodes:
      - Comprehensions and iterators
      - Modules and imports
      - Classes and objects
      - Special methods
      - Exceptions
      - Files and data formats
      - Recursion
      - Generators and context managers
      - Type hints and dataclasses
      - Testing with pytest
  - id: S2
    title: Data structures
    # Cluster 7 of 65 on the route Learn walks.
    requires: [S1, F2]
    nodes:
      - Arrays and dynamic arrays
      - Linked lists
      - Stacks and queues
      - Hash tables
      - Binary search trees
      - Balanced search trees
      - Heaps and priority queues
      - Tries
      - Graphs and their representations
      - Union-find
  - id: S3
    title: Algorithms
    # Cluster 11 of 65 on the route Learn walks.
    requires: [S2, F3, F5]
    nodes:
      - Measuring and predicting running time
      - Sorting
      - Binary search
      - Divide and conquer and the master theorem
      - Breadth-first and depth-first search
      - Topological sort
      - Shortest paths
      - Minimum spanning trees
      - Greedy algorithms
      - Dynamic programming
      - Amortised analysis
      - title: Randomised algorithms
        requires: [s3.amortised-analysis, f4.expectation-and-linearity]
      - "Intractability: P, NP and heuristics"
  - id: S4
    title: Software design
    # Cluster 14 of 65 on the route Learn walks.
    requires: [Q1, S3]
    nodes:
      - Abstraction and interfaces
      - Modules, coupling and cohesion
      - Designing with types and invariants
      - Errors as part of the design
      - Dependency injection and testable code
      - Design patterns that earn their place
      - Refactoring
      - Designing APIs
      - Writing design documents
  - id: S5
    title: Tools of the trade
    # Cluster 15 of 65 on the route Learn walks.
    requires: [S4]
    nodes:
      - title: Version control as a content-addressed store
        requires: [s4.writing-design-documents, s2.hash-tables]
      - Branches, merges and rebases
      - Code review
      - title: Build systems and dependency graphs
        requires: [s5.code-review, s3.topological-sort]
      - Packages and reproducible environments
      - Debugging methodically
      - Profiling programs
      - Continuous integration
  - id: S6
    title: Testing
    # Cluster 16 of 65 on the route Learn walks.
    requires: [S5, F4]
    nodes:
      - What a test can prove
      - Unit tests and fixtures
      - Fakes, stubs and mocks
      - Property-based testing
      - Oracles and invariants
      - Integration and end-to-end tests
      - Coverage and mutation testing
      - Flaky tests and their causes
      - "Deterministic tests: seeds, clocks and fakes"
      - Fuzzing
  - id: S7
    title: Languages and interpreters
    # Cluster 17 of 65 on the route Learn walks.
    requires: [S6, S3]
    nodes:
      - Tokenising
      - Regular expressions and finite automata
      - Grammars and parsing
      - Syntax trees and evaluation
      - "How Python runs: bytecode and the interpreter loop"
      - Scope, closures and higher-order functions
      - Static and dynamic types
      - Memory management and garbage collection
  - id: S8
    title: Arrays and vectorised computing
    # Cluster 43 of 65 on the route Learn walks.
    requires: [H5, S3]
    nodes:
      - Arrays, dtypes and shapes
      - Indexing and slicing
      - Broadcasting
      - Vectorisation
      - Reductions along axes
      - title: Views, copies and strides
        requires: [s8.reductions-along-axes, h4.locality]
      - Data frames
      - Random generators and seeds
