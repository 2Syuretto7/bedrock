# Track M: MLOps. Each cluster lists the clusters it requires and its
# concepts in teaching order. Unless a concept says otherwise, it requires the
# concept before it and the final concepts of the required clusters. A concept
# with its own `requires` keeps those defaults and adds a link to an earlier idea.
track: M
title: MLOps
clusters:
  - id: M0
    title: Machine learning essentials
    # Cluster 49 of 65 on the route Learn walks.
    requires: [H8, F10, F5]
    nodes:
      - What a model is
      - Training as optimisation
      - Loss functions
      - Generalisation and data splits
      - Evaluation metrics
      - Linear and logistic regression
      - Neural networks
      - Training loops
      - Embeddings
  - id: M1
    title: Experiment tracking and reproducibility
    # Cluster 50 of 65 on the route Learn walks.
    requires: [M0, S6]
    nodes:
      - Experiments as data
      - Tracking parameters, metrics and artefacts
      - Seeds and determinism in training
      - title: Versioning data and models
        requires: [m1.seeds-and-determinism-in-training, f7.fingerprints-and-content-hashes]
      - Hyperparameter search
      - title: Comparing runs statistically
        requires: [m1.hyperparameter-search, f5.hypothesis-tests]
      - Model registries
      - Reproducible environments
  - id: M2
    title: Training infrastructure
    # Cluster 53 of 65 on the route Learn walks.
    requires: [D8, M1, H8]
    nodes:
      - The anatomy of a training job
      - Input pipelines
      - Memory budgets for training
      - title: Mixed precision
        requires: [m2.memory-budgets-for-training, h0.floating-point-and-ieee-754]
      - title: Data parallelism and all-reduce
        requires: [m2.mixed-precision, h7.message-passing-and-collectives]
      - Model and pipeline parallelism
      - Checkpointing and resumption
      - Scheduling jobs on a cluster
      - Failures in long runs
      - Estimating compute and cost
  - id: M3
    title: Model serving
    # Cluster 60 of 65 on the route Learn walks.
    requires: [Q8, M2, F6]
    nodes:
      - Inference workloads
      - Serving architectures
      - title: Dynamic batching
        requires: [m3.serving-architectures, f6.the-single-server-queue]
      - Latency budgets
      - Model formats and runtimes
      - Quantisation
      - Caching and the KV cache
      - Continuous batching
      - Autoscaling inference
      - Shadow and canary releases
  - id: M4
    title: Monitoring models
    # Cluster 61 of 65 on the route Learn walks.
    requires: [M3, R3]
    nodes:
      - What to monitor
      - Data drift and concept drift
      - title: Drift tests
        requires: [m4.data-drift-and-concept-drift, f5.hypothesis-tests]
      - Delayed labels
      - Alerting on model health
      - Feedback loops
      - Debugging a model in production
  - id: M5
    title: Evaluation in production
    # Cluster 62 of 65 on the route Learn walks.
    requires: [M4, F5]
    nodes:
      - Offline and online evaluation
      - title: A/B tests for models and statistical power
        requires: [m5.offline-and-online-evaluation, f5.comparing-two-systems-a-b-tests]
      - Interleaving and bandits
      - Evaluating language model systems
      - Guardrails
      - Regression tests for models
      - Slices and fairness
  - id: M6
    title: ML platforms
    # Cluster 63 of 65 on the route Learn walks.
    requires: [M5, Q7]
    nodes:
      - Feature stores
      - Training-serving skew
      - Continuous training pipelines
      - Platform design and self-service
      - Cost management
      - Governance and model cards
