# Track D: Distributed systems and cloud. Each cluster lists the clusters it requires and its
# concepts in teaching order. Unless a concept says otherwise, it requires the
# concept before it and the final concepts of the required clusters. A concept
# with its own `requires` keeps those defaults and adds a link to an earlier idea.
track: D
title: Distributed systems and cloud
clusters:
  - id: D0
    title: Concurrency
    # Cluster 20 of 65 on the route Learn walks.
    requires: [H2, S6]
    nodes:
      - title: Interleavings and race conditions
        requires: [h2.signals-and-the-life-of-a-process, s6.fuzzing, s6.deterministic-tests-seeds-clocks-and-fakes]
      - Locks and mutual exclusion
      - Deadlock
      - Condition variables and semaphores
      - Atomic operations and compare-and-swap
      - Memory models and happens-before
      - title: Thread pools and work queues
        requires: [d0.memory-models-and-happens-before, s2.stacks-and-queues]
      - Event loops and asynchronous I/O
      - Actors and message passing
      - Testing concurrent code deterministically
  - id: D1
    title: Networking
    # Cluster 22 of 65 on the route Learn walks.
    requires: [F6, H2]
    nodes:
      - Layers and encapsulation
      - Links, frames and switches
      - IP addresses and routing
      - Packets, loss and checksums
      - UDP
      - "TCP: reliable delivery"
      - title: "TCP: flow and congestion control"
        requires: [d1.tcp-reliable-delivery, f6.response-time-against-load]
      - DNS
      - HTTP
      - Sockets and RPC
      - Load balancers and proxies
      - Latency, bandwidth and the bandwidth-delay product
  - id: D2
    title: Time, order and failure
    # Cluster 23 of 65 on the route Learn walks.
    requires: [D1, D0]
    nodes:
      - Failure models
      - Timeouts and failure detectors
      - Physical clocks and skew
      - Lamport clocks
      - Vector clocks
      - Idempotency and retries
      - Delivery guarantees
      - The two generals problem
      - Impossibility of consensus with one faulty process
  - id: D3
    title: Replication
    # Cluster 28 of 65 on the route Learn walks.
    requires: [Q4, D2]
    nodes:
      - Why replicate
      - Leader and followers
      - Synchronous and asynchronous replication
      - Replication lag and read-your-writes
      - Multi-leader replication and conflicts
      - Leaderless replication and quorums
      - title: Anti-entropy and Merkle trees
        requires: [d3.leaderless-replication-and-quorums, f7.fingerprints-and-content-hashes]
      - CRDTs
      - Linearisability
      - Weaker consistency models
      - CAP and PACELC
  - id: D4
    title: Consensus
    # Cluster 29 of 65 on the route Learn walks.
    requires: [D3]
    nodes:
      - The consensus problem
      - Two-phase commit
      - Paxos
      - "Raft: leader election"
      - title: "Raft: log replication"
        requires: [d4.raft-leader-election, q2.write-ahead-logging]
      - "Raft: safety"
      - Membership changes
      - Snapshots and log compaction
      - Linearisable reads and leases
      - Byzantine faults
  - id: D5
    title: Partitioning and distributed data
    # Cluster 30 of 65 on the route Learn walks.
    requires: [D4, S2]
    nodes:
      - Partitioning by key range
      - Partitioning by hash
      - title: Consistent hashing
        requires: [d5.partitioning-by-hash, s2.hash-tables]
      - Rendezvous hashing
      - Rebalancing
      - Secondary indexes across partitions
      - Request routing and service discovery
      - Distributed transactions and sagas
      - "Global time: TrueTime and hybrid clocks"
      - Distributed locks and fencing tokens
  - id: D6
    title: Distributed storage
    # Cluster 31 of 65 on the route Learn walks.
    requires: [D5, F7]
    nodes:
      - Blocks, files and objects
      - Durability and fsync
      - Distributed file systems
      - Chain replication
      - Object stores and their consistency
      - Erasure coding in storage
      - Tiered storage and caching
      - Backups, snapshots and restore
      - Integrity and tamper evidence
  - id: D7
    title: Containers and virtualisation
    # Cluster 51 of 65 on the route Learn walks.
    requires: [M1, H3]
    nodes:
      - Isolation and the kernel
      - Namespaces
      - Control groups
      - title: Images and layers
        requires: [d7.control-groups, s5.version-control-as-a-content-addressed-store]
      - Building images
      - Container runtimes
      - Virtual machines and hypervisors
      - Container networking
      - Volumes and state
  - id: D8
    title: Orchestration
    # Cluster 52 of 65 on the route Learn walks.
    requires: [D7, S3]
    nodes:
      - Desired state and reconciliation
      - title: Scheduling as bin packing
        requires: [d8.desired-state-and-reconciliation, s3.greedy-algorithms]
      - Services and discovery
      - Health checks and self-healing
      - Rolling updates and rollbacks
      - title: Autoscaling
        requires: [d8.rolling-updates-and-rollbacks, f6.capacity-planning]
      - Configuration and secrets
      - Stateful workloads and operators
      - Quotas and multi-tenancy
  - id: D9
    title: Cloud architecture
    # Cluster 55 of 65 on the route Learn walks.
    requires: [H9, D8, D6]
    nodes:
      - Regions, zones and failure domains
      - "Compute: machines, containers and functions"
      - Cloud networks
      - Load balancing and content delivery
      - Caching layers
      - Queues and publish-subscribe
      - Managed databases
      - Infrastructure as code
      - Cost modelling
      - Designing for availability
      - Disaster recovery
      - Object storage and data lakes
  - id: D10
    title: Large-scale system design
    # Cluster 65 of 65 on the route Learn walks.
    requires: [R7, D9, F6]
    nodes:
      - Requirements and estimates
      - A URL shortener
      - A rate limiter
      - A news feed
      - A distributed cache
      - A chat service
      - A search service
      - A model-serving platform
      - Reviewing a design
