          Every lambda captures the same variable `name`, and by the time any of them runs the loop has left it at "Meera". Give each lambda its own copy with a default argument, `lambda name=name: ...`, which is evaluated as each lambda is made. A default under another name does nothing while the body still reads `name`; building the message first just moves the problem to the variable `message`; and a default of `names[0]` gives every passenger Asha's message.
    - question:
        id: write-retry
        type: code
        mode: write
        system: s2
        prompt: |
          Write `retry`, a decorator factory that retries a function on `ConnectionError`. The program should print two lines: `PNR 4521367890 confirmed after 3 attempts`, then `gave up: timeout on attempt 3`.
        starter: |
          def retry(times):
              # A decorator factory. @retry(times) wraps a function so that each call
              # tries it up to `times` times in all: if an attempt raises
              # ConnectionError, try again; return the first result that comes back.
              # If every attempt fails, raise the last ConnectionError. Any other
              # exception is raised at once. Each call starts with a full set of
              # attempts.
              def decorate(f):
                  return f
              return decorate


          def make_flaky(failures):
              # A stand-in for a booking server that times out `failures` times.
              count = 0

              def fetch(pnr):
                  nonlocal count
                  count += 1
                  if count <= failures:
                      raise ConnectionError("timeout on attempt " + str(count))
                  return "PNR " + pnr + " confirmed after " + str(count) + " attempts"

              return fetch


          for failures in [2, 5]:
              try:
                  print(retry(3)(make_flaky(failures))("4521367890"))
              except ConnectionError as error:
                  print("gave up:", error)
        solution: |
          def retry(times):
              # A decorator factory. @retry(times) wraps a function so that each call
              # tries it up to `times` times in all: if an attempt raises
              # ConnectionError, try again; return the first result that comes back.
              # If every attempt fails, raise the last ConnectionError. Any other
              # exception is raised at once. Each call starts with a full set of
              # attempts.
              def decorate(f):
                  def wrapper(*args):
                      last = None
                      for attempt in range(times):
                          try:
                              return f(*args)
                          except ConnectionError as error:
                              last = error
                      raise last
                  return wrapper
              return decorate


          def make_flaky(failures):
              # A stand-in for a booking server that times out `failures` times.
              count = 0

              def fetch(pnr):
                  nonlocal count
                  count += 1
                  if count <= failures:
                      raise ConnectionError("timeout on attempt " + str(count))
                  return "PNR " + pnr + " confirmed after " + str(count) + " attempts"

              return fetch


          for failures in [2, 5]:
              try:
                  print(retry(3)(make_flaky(failures))("4521367890"))
              except ConnectionError as error:
                  print("gave up:", error)
        tests: |
          _log = []


          def _make(_fail, _exc=ConnectionError):
              _box = [0]

              def _f(_x):
                  _box[0] += 1
                  _log.append(_box[0])
                  if _box[0] <= _fail:
                      raise _exc("attempt " + str(_box[0]))
                  return _x * 2

              return _f


          def _call(_wrapped, _x, _what):
              try:
                  return _wrapped(_x)
              except (ConnectionError, TypeError) as _e:
                  raise AssertionError(_what + ", but it raised " + type(_e).__name__ + ": " + str(_e))


          assert _call(retry(1)(_make(0)), 4, "With 1 attempt and no failures, the result should come back") == 8, "With no failures, the first attempt's result should come back"
          assert _call(retry(4)(_make(3)), 5, "Three failures then success should succeed with 4 attempts") == 10, "Three failures then success should give the result"
          try:
              retry(3)(_make(3))(1)
              raise AssertionError("Three failures with 3 attempts should raise ConnectionError")
          except TypeError as _e:
              raise AssertionError("When every attempt fails, the last ConnectionError should be raised, not TypeError: " + str(_e))
          except ConnectionError as _e:
              assert str(_e) == "attempt 3", "The last ConnectionError should be raised, not " + repr(str(_e))
          _log.clear()
          try:
              retry(5)(_make(1, ValueError))(1)
              raise AssertionError("A ValueError should not be retried")
          except ValueError:
              assert _log == [1], "A ValueError should be raised at once, after 1 attempt, not " + str(len(_log))
          _box2 = [0]


          def _every_other(_x):
              _box2[0] += 1
              if _box2[0] % 2 == 1:
                  raise ConnectionError("odd")
              return _x


          _w = retry(2)(_every_other)
          assert [_call(_w, 1, "Each call should get its own two attempts"), _call(_w, 2, "Each call should get its own two attempts"), _call(_w, 3, "Each call should get its own two attempts")] == [1, 2, 3], "Each call should get its own two attempts, so every call here should succeed"
          assert output.splitlines() == ["PNR 4521367890 confirmed after 3 attempts", "gave up: timeout on attempt 3"], "The program should print two lines: the PNR confirmed after 3 attempts, then gave up: timeout on attempt 3"
