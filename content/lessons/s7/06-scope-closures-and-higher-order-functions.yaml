            def retry(times):
                # A decorator factory. @retry(times) wraps a function so that each call
                # tries it up to `times` times in all: if an attempt raises
                # ConnectionError, try again; return the first result that comes back.
                # If every attempt fails, raise the last ConnectionError. Any other
                # exception is raised at once. Each call starts with a full set of
                # attempts.
                def decorate(f):
                    left = [times]

                    def wrapper(*args):
                        last = None
                        while left[0] > 0:
                            left[0] -= 1
                            try:
                                return f(*args)
                            except ConnectionError as error:
                                last = error
                        raise last
                    return wrapper
                return decorate


            def make_flaky(failures):
                # A stand-in for a booking server that times out `failures` times.
                count = 0

                def fetch(pnr):
                    nonlocal count
                    count += 1
                    if count <= failures:
                        raise ConnectionError("timeout on attempt " + str(count))
                    return "PNR " + pnr + " confirmed after " + str(count) + " attempts"

                return fetch


            for failures in [2, 5]:
                try:
                    print(retry(3)(make_flaky(failures))("4521367890"))
                except ConnectionError as error:
                    print("gave up:", error)
        explanation: |
          Three levels: `retry(times)` returns `decorate`, which returns `wrapper`, which loops `times` times, returning the first result and remembering each `ConnectionError`, then raises the last one. Looping `times - 1` times gives one attempt too few; returning `None` after the last failure hides it from the caller; and a count of attempts kept in `decorate` is shared by every call, so later calls start with none left.
