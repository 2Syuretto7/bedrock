    - text: |
        2. The three lambdas share one variable, `i`, which the loop leaves at 2, and a closure reads its variables when it runs, not when it was made. Capturing the variable is exactly what makes a counter work; here it makes every button the last one.

        Closures, decorators and higher-order functions all pass functions around as values, and nothing in Python checks in advance that a value passed in is the kind the function expects; a mistake shows up only when the line runs. [[s7.static-and-dynamic-types]] looks at that choice: what a type is, when it is checked, and what a checker that runs before the program can and cannot promise.
