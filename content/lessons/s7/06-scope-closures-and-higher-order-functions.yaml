          _h = make_handlers(_names)
          for _n in _names:
              assert _h[_n]() == "Booking confirmed for " + _n, "Each handler should remember its own name; " + _n + "'s says " + repr(_h[_n]())
          assert make_handlers([]) == {}, "No names should give no handlers"
          assert output.splitlines() == ["Booking confirmed for Asha", "Booking confirmed for Ravi", "Booking confirmed for Meera"], "The program should print three lines, one for each of Asha, Ravi and Meera"
