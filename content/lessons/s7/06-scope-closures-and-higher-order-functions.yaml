    - question:
        id: fix-late-binding
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `make_handlers` should give each passenger a function that confirms their own booking. The program should print three lines, for Asha, Ravi and Meera. Instead, all three lines confirm Meera. Find the fault and fix it.
        starter: |
          def make_handlers(names):
              # Return a dict from each passenger's name to a function that, when
              # called later, returns the confirmation message for that passenger.
              handlers = {}
              for name in names:
                  handlers[name] = lambda: "Booking confirmed for " + name
              return handlers


          handlers = make_handlers(["Asha", "Ravi", "Meera"])
          for passenger in ["Asha", "Ravi", "Meera"]:
              print(handlers[passenger]())
        solution: |
          def make_handlers(names):
              # Return a dict from each passenger's name to a function that, when
              # called later, returns the confirmation message for that passenger.
              handlers = {}
              for name in names:
                  handlers[name] = lambda name=name: "Booking confirmed for " + name
              return handlers


          handlers = make_handlers(["Asha", "Ravi", "Meera"])
          for passenger in ["Asha", "Ravi", "Meera"]:
              print(handlers[passenger]())
        tests: |
          _h = make_handlers(["Kiran", "Zoya"])
          assert sorted(_h) == ["Kiran", "Zoya"], "There should be one handler per name"
          assert _h["Kiran"]() == "Booking confirmed for Kiran", "Kiran's handler should confirm Kiran's booking, not say " + repr(_h["Kiran"]())
          assert _h["Zoya"]() == "Booking confirmed for Zoya", "Zoya's handler should confirm Zoya's booking, not say " + repr(_h["Zoya"]())
