concept: s7.syntax-trees-and-evaluation
minutes: 80
claim: You can turn a parse into an abstract syntax tree that keeps only what matters, read the trees Python's ast module builds, and write a tree-walking evaluator with one case per kind of node, an environment for variables and a fresh scope for local bindings; evaluate children before parents but let `and`, `or` and conditionals skip what they do not need; transform trees, such as folding constants, without changing what a program does; and say why walking a tree is simple but slow.
recalls: [s7.grammars-and-parsing]
uses: [s7.tokenising, s1.recursion, s0.dictionaries-and-sets, s3.breadth-first-and-depth-first-search, f3.trees-and-their-properties, s1.exceptions, s0.booleans-and-conditionals]
leads: [s7.how-python-runs-bytecode-and-the-interpreter-loop, s7.scope-closures-and-higher-order-functions, s7.static-and-dynamic-types]
starter: |
  # Scratch space. Python will show you the tree it builds.
  import ast

  tree = ast.parse("(1 + 2) * (3 + 4)", mode="eval")
  print(ast.dump(tree.body))
parts:
  recall:
    - text: |
        [[s7.grammars-and-parsing]] built trees from tokens, with the grammar deciding which operator sits lower and so runs first. This lesson trims those trees to their essentials and then does the thing an interpreter exists for: works out what a program means by walking its tree. Three quick pulls first.
  puzzle:
    - text: |
        Python's parser turns the line `(1 + 2) * (3 + 4)` into a tree. The brackets tell the parser which shape to build, but once the shape is built they are no longer needed, so the tree does not keep them.

        **Counting each operation and each number as one node, how many nodes does the tree have?**
  intuition:
    - text: |
        At the end of term, a school adds up its marks in layers. Each section teacher totals the marks for their section; each class teacher adds the section totals; the principal adds the class totals. Nobody can report until everyone below them has, and the principal's number, at the top, is the answer for the whole school.

        Evaluating a syntax tree works the same way: every node waits for its children's values, then combines them and reports upwards. The figure walks two trees one step at a time. Watch the order, and in the second tree watch what `and` does with a false left side.
    - figure: ast-eval
      props: { tree: arith, step: 0 }
    - text: |
        In the first tree every node is visited once, children before parents, and the root ends with 30. In the second, `and` gets False from its left side and stops: the division by `x`, which would have divided by zero, is never evaluated at all. An evaluator is not only arithmetic on trees; it also decides what to evaluate and when, and that decision is part of what a language means.
  derivation:
    - text: |
        **Abstract syntax trees.** A parse tree records every grammar rule used, including the levels for precedence and the brackets. Once the shape is fixed, most of that is noise. An **abstract syntax tree**, or AST, keeps only what the program says: an operation node with its operator and operands, a number, a name, a call with its function and arguments, a conditional with its test and branches. Brackets disappear, because the tree's shape already says what they said.

        Python shows you its ASTs. `ast.parse("(1 + 2) * 3", mode="eval")` returns a tree whose `body` is `BinOp(left=BinOp(left=Constant(1), op=Add(), right=Constant(2)), op=Mult(), right=Constant(3))`. Every tool that understands Python code without running it, from linters to formatters to the editor that colours your code, works on trees like this one.
    - question:
        id: derivation-ast
        type: choice
        system: s2
        prompt: |
          Python parses `(price + tip) * qty`. What does the AST record that tells it to add before multiplying?
        options:
          - "The addition is a child of the multiplication, so it must be evaluated first"
          - "A node for the brackets around price + tip"
          - "A precedence number stored on each operator"
          - "The order of the tokens in the source"
        answer: 0
        explanation: |
          The tree's shape carries the grouping: the multiplication needs its left child's value, which is the sum. The brackets themselves are dropped, and no precedence numbers are stored.
    - text: |
        **Walking the tree.** A **tree-walking evaluator** is a recursive function with one case per kind of node, the recursion of [[s1.recursion]] following the tree's shape. A number evaluates to itself. A binary operation evaluates its left child, then its right child, then applies its operator. A name is looked up in an **environment**, a dictionary from names to values, and a name that is not there is an error the evaluator must report, as Python reports `NameError`. This visiting order, children before their parent, is the post-order traversal of a depth-first search, as in [[s3.breadth-first-and-depth-first-search]].

        A construct that introduces a name, such as `let base = 450 in base * 2`, evaluates its value, then evaluates its body in a **new** environment: a copy of the current one with the extra name added. The copy matters. If the evaluator wrote the new name into the existing environment, the name would leak out after the body finished, and an outer variable with the same name would be overwritten for everyone. Scopes are how a language keeps names from colliding, and the next lessons build on exactly this.
    - question:
        id: derivation-let
        type: numeric
        system: s2
        prompt: |
          With `x` equal to 10 in the environment, what is the value of `(let x = 2 in x * x) + x`, evaluated with a fresh scope for the `let`?
        answer: "14"
        explanation: |
          Inside the `let`, `x` is 2, so the left side is 4. The `let` does not change the outer environment, so the `x` on the right is still 10: $4 + 10 = 14$. An evaluator that wrote into the outer environment would give $4 + 2 = 6$.
    - text: |
        **Order and laziness.** Post-order is the default, but some constructs must not evaluate all their children. `a and b` evaluates `a`, and only if it is true evaluates `b`; `a or b` evaluates `b` only if `a` is false. Both give back the value that decided, which is why `0 and anything` is `0` in Python and `name or "guest"` supplies a default. A conditional evaluates its test and then only the chosen branch; evaluating both would run code the programmer said not to run, such as a division the test was there to prevent. Function calls, by contrast, usually evaluate every argument first, so `f(a, 1 / 0)` fails before `f` starts.

        Getting this wrong is not a matter of speed. `x != 0 and 10 / x > 2` is a correct, safe expression in Python only because the evaluator skips the division when `x` is 0.
    - question:
        id: derivation-skip
        type: choice
        system: s2
        prompt: |
          An evaluator handles `ticket if seats > 0 else refund()` correctly. With `seats` equal to 3, which of these does it evaluate?
        options:
          - "seats > 0, then ticket"
          - "seats > 0, ticket and refund()"
          - "ticket and refund(), then seats > 0"
          - "Only ticket"
        answer: 0
        explanation: |
          A conditional evaluates its test first and then only the chosen branch. Calling `refund()` as well would run a side effect the program never asked for.
    - text: |
        **Transforming trees.** Because an AST is just data, programs can rewrite it. **Constant folding** replaces any operation whose operands are known numbers by its result, so `18 * 100 / 2` becomes `900.0` before the program runs, working from the leaves up so that folded children can make their parents foldable too. A transformation must never change what the program does: a division by zero must stay in the tree, to fail when it runs, rather than crash the tool that was only tidying up. Python's own compiler folds constants this way, and other passes remove code that can never run or simplify patterns.

        **Why walking is slow.** A tree-walking interpreter is the easiest kind to write, and many small languages stop there. But every step follows pointers between scattered nodes, decides afresh what kind of node it is looking at, and looks names up in dictionaries. Doing that work again every time a loop goes round is wasteful. Python instead translates the tree once into a compact list of instructions and runs those, which is the subject of the next lesson.
    - question:
        id: derivation-pipeline
        type: order
        system: s2
        prompt: |
          Put the stages of a small tree-walking interpreter in order, from source text to value.
        steps:
          - "Split the source text into tokens."
          - "Parse the tokens into an abstract syntax tree."
          - "Fold constant subtrees into numbers."
          - "Walk the tree, evaluating children before parents."
          - "Return the value computed at the root."
        explanation: |
          Each stage needs the output of the one before: tokens for the parser, a tree for folding, and a folded tree for the walk, which ends with the root's value.
  formal:
    - text: |
        **Abstract syntax tree.** A tree with one node per construct, operations, literals, names, calls, conditionals, and no nodes for brackets or precedence levels. Python: `ast.parse(source, mode="eval")`.

        **Tree-walking evaluation.** A recursive function with one case per node kind; by default children are evaluated before their parent, left to right.

        **Environment.** A mapping from names to values. A binding construct evaluates its body in a new environment extending the current one, leaving the current one unchanged.

        **Short-circuit evaluation.** `and`, `or` and conditionals evaluate a child only when its value is needed, and `and` and `or` return the value that decided.

        **Tree transformation.** A function from trees to trees that preserves meaning, such as constant folding, applied from the leaves up.
  drill:
    - text: Seconds each. Picture the tree, then walk it.
    - question:
        id: drill-nodes
        type: numeric
        system: s1
        prompt: |
          How many nodes does the AST of `a * b + c` have, counting each name and each operation?
        answer: "5"
        explanation: Three names and two operations; the multiplication is the left child of the addition.
    - question:
        id: drill-or
        type: choice
        system: s1
        prompt: |
          What does `"" or "guest"` give in Python?
        options:
          - "'guest'"
          - "True"
          - "''"
          - "False"
        answer: 0
        explanation: The empty string is false, so `or` evaluates and returns its right side.
    - question:
        id: predict-ast-op
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import ast
          tree = ast.parse("2 + 3 * 4", mode="eval")
          print(type(tree.body.op).__name__)
        output: "Add"
        explanation: The addition is the root, because the multiplication binds tighter and sits below it as its right child.
    - question:
        id: predict-literal-eval
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import ast
          print(ast.literal_eval("(1, [2, 3])"))
        output: "(1, [2, 3])"
        explanation: literal_eval walks the tree but accepts only literals, so it can safely read data that someone else typed.
  work:
    - text: Slower now. Write the walker, then make it skip and simplify.
    - question:
        id: write-evaluate
        type: code
        mode: write
        system: s2
        prompt: |
          Write `evaluate`, a tree-walking evaluator for numbers, variables, arithmetic and `let`. The program should print two lines: `531.0`, the fare with GST, and then `{'seats': 2}`, the environment unchanged.
        starter: |
          def evaluate(node, env):
              # Nodes are tuples:
              #   ("num", value)                  a number
              #   ("var", name)                   look the name up in env, a dict;
              #                                   if it is missing, raise ValueError
              #   ("bin", op, left, right)        op is "+", "-", "*" or "/"
              #   ("let", name, value, body)      evaluate value, then evaluate body
              #                                   with name bound to it; env itself
              #                                   must not change
              return 0


          # let base = 450 in base + base * 18 / 100
          tree = ("let", "base", ("num", 450),
                  ("bin", "+", ("var", "base"),
                   ("bin", "/", ("bin", "*", ("var", "base"), ("num", 18)), ("num", 100))))
          env = {"seats": 2}
          print(evaluate(tree, env))
          print(env)
        solution: |
          def evaluate(node, env):
              # Nodes are tuples:
              #   ("num", value)                  a number
              #   ("var", name)                   look the name up in env, a dict;
              #                                   if it is missing, raise ValueError
              #   ("bin", op, left, right)        op is "+", "-", "*" or "/"
              #   ("let", name, value, body)      evaluate value, then evaluate body
              #                                   with name bound to it; env itself
              #                                   must not change
              kind = node[0]
              if kind == "num":
                  return node[1]
              if kind == "var":
                  if node[1] not in env:
                      raise ValueError("unknown variable " + node[1])
                  return env[node[1]]
              if kind == "bin":
                  a = evaluate(node[2], env)
                  b = evaluate(node[3], env)
                  op = node[1]
                  if op == "+":
                      return a + b
                  if op == "-":
                      return a - b
                  if op == "*":
                      return a * b
                  return a / b
              if kind == "let":
                  inner = dict(env)
                  inner[node[1]] = evaluate(node[2], env)
                  return evaluate(node[3], inner)
              raise ValueError("unknown node " + str(kind))


          # let base = 450 in base + base * 18 / 100
          tree = ("let", "base", ("num", 450),
                  ("bin", "+", ("var", "base"),
                   ("bin", "/", ("bin", "*", ("var", "base"), ("num", 18)), ("num", 100))))
          env = {"seats": 2}
          print(evaluate(tree, env))
          print(env)
        tests: |
          _e = {"x": 10, "y": 4}
          for _tree, _want in [
              (("num", 7), 7),
              (("var", "x"), 10),
              (("bin", "-", ("var", "x"), ("var", "y")), 6),
              (("bin", "/", ("num", 9), ("num", 2)), 4.5),
              (("bin", "*", ("bin", "+", ("num", 2), ("num", 3)), ("bin", "-", ("num", 10), ("num", 4))), 30),
              (("let", "z", ("num", 5), ("bin", "+", ("var", "z"), ("var", "x"))), 15),
              (("let", "x", ("num", 1), ("var", "x")), 1),
              (("let", "a", ("var", "x"), ("let", "x", ("num", 0), ("bin", "-", ("var", "a"), ("var", "x")))), 10),
              (("bin", "+", ("let", "x", ("num", 1), ("var", "x")), ("var", "x")), 11),
          ]:
              _before = dict(_e)
              try:
                  _got = evaluate(_tree, _e)
              except ValueError as _err:
                  raise AssertionError("evaluate(" + repr(_tree) + ") should give " + repr(_want) + ", but it raised ValueError: " + str(_err))
              assert _got == _want, "evaluate(" + repr(_tree) + ") with x = 10 and y = 4 should give " + repr(_want) + ", not " + repr(_got)
              assert _e == _before, "Evaluating " + repr(_tree) + " must not change env, but it became " + repr(_e)
          try:
              evaluate(("var", "q"), {})
              raise AssertionError("An unknown variable should raise ValueError")
          except ValueError:
              pass
          try:
              evaluate(("let", "t", ("num", 1), ("var", "u")), {"x": 1})
              raise AssertionError("A let body that uses an unknown variable should raise ValueError")
          except ValueError:
              pass
          assert output.splitlines() == ["531.0", "{'seats': 2}"], "The program should print two lines: 531.0, then {'seats': 2}"
