        explanation: |
          One case per node kind: a number is itself, a variable is looked up, an operation evaluates both children and applies its operator, and `let` evaluates its value and then its body in a copy of the environment with the new name added. Writing the name into `env` itself leaks it out of the `let`; swapping the operands of `-` gives `-6` for `10 - 4`; and a new environment holding only the bound name loses every outer variable.
    - question:
        id: fix-short-circuit
        type: code
        mode: find-bug
        system: s2
        prompt: |
          This evaluator should treat `and` and `or` as Python does. The program should print two lines: `4 True`, then `0 False`. Instead, its second line is `0 crashed: division by zero`. Find the fault and fix it.
        starter: |
          def evaluate(node, env):
              # Nodes: ("num", v), ("var", name), ("bin", op, left, right) for + - * /,
              # ("cmp", op, left, right) for > and !=, and ("and", left, right) and
              # ("or", left, right), which behave as in Python: they evaluate the
              # right side only if the left side does not settle the answer, and
              # they give back the value of the side that decided.
              kind = node[0]
              if kind == "num":
                  return node[1]
              if kind == "var":
                  return env[node[1]]
              if kind in ("and", "or"):
                  left = evaluate(node[1], env)
                  right = evaluate(node[2], env)
                  if kind == "and":
                      return left and right
                  return left or right
              a = evaluate(node[2], env)
              b = evaluate(node[3], env)
              op = node[1]
              if op == "+":
                  return a + b
              if op == "-":
                  return a - b
              if op == "*":
                  return a * b
              if op == "/":
                  return a / b
              if op == ">":
                  return a > b
              return a != b


          # x != 0 and 10 / x > 2
          check = ("and", ("cmp", "!=", ("var", "x"), ("num", 0)),
                   ("cmp", ">", ("bin", "/", ("num", 10), ("var", "x")), ("num", 2)))
          for x in [4, 0]:
              try:
                  print(x, evaluate(check, {"x": x}))
              except ZeroDivisionError:
                  print(x, "crashed: division by zero")
        solution: |
          def evaluate(node, env):
              # Nodes: ("num", v), ("var", name), ("bin", op, left, right) for + - * /,
              # ("cmp", op, left, right) for > and !=, and ("and", left, right) and
              # ("or", left, right), which behave as in Python: they evaluate the
              # right side only if the left side does not settle the answer, and
              # they give back the value of the side that decided.
              kind = node[0]
              if kind == "num":
                  return node[1]
              if kind == "var":
                  return env[node[1]]
              if kind in ("and", "or"):
                  left = evaluate(node[1], env)
                  if kind == "and" and not left:
                      return left
                  if kind == "or" and left:
                      return left
                  return evaluate(node[2], env)
              a = evaluate(node[2], env)
              b = evaluate(node[3], env)
              op = node[1]
              if op == "+":
                  return a + b
              if op == "-":
                  return a - b
              if op == "*":
                  return a * b
              if op == "/":
                  return a / b
              if op == ">":
                  return a > b
              return a != b


          # x != 0 and 10 / x > 2
          check = ("and", ("cmp", "!=", ("var", "x"), ("num", 0)),
                   ("cmp", ">", ("bin", "/", ("num", 10), ("var", "x")), ("num", 2)))
          for x in [4, 0]:
              try:
                  print(x, evaluate(check, {"x": x}))
              except ZeroDivisionError:
                  print(x, "crashed: division by zero")
        tests: |
          _boom = ("bin", "/", ("num", 1), ("num", 0))
          for _tree, _want in [
              (("and", ("num", 0), _boom), 0),
              (("or", ("num", 5), _boom), 5),
              (("and", ("num", 3), ("num", 7)), 7),
              (("or", ("num", 0), ("num", 9)), 9),
              (("or", ("num", 0), ("num", 0)), 0),
              (("and", ("num", 2), ("and", ("num", 0), _boom)), 0),
              (("or", ("and", ("num", 0), _boom), ("num", 8)), 8),
              (("and", ("cmp", ">", ("num", 1), ("num", 2)), _boom), False),
          ]:
              try:
                  _got = evaluate(_tree, {})
              except ZeroDivisionError:
                  raise AssertionError("Evaluating " + repr(_tree) + " divided by zero: the right side should not have been evaluated")
              assert _got == _want and type(_got) == type(_want), "Evaluating " + repr(_tree) + " should give " + repr(_want) + ", as Python would, not " + repr(_got)
          assert output.splitlines() == ["4 True", "0 False"], "The program should print two lines: 4 True, then 0 False"
