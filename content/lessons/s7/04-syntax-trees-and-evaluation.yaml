          def fold(node):
              # Constant folding. Nodes are ("num", v), ("var", name) and
              # ("bin", op, left, right) with op one of + - * /. Return a new tree in
              # which every operation whose operands are both numbers, after folding
              # them, is replaced by ("num", result). A division by zero is left
              # unfolded, so that it fails when the program runs, as it would have.
              if node[0] != "bin":
                  return node
              op = node[1]
              left = fold(node[2])
              right = fold(node[3])
              if left[0] == "num" and right[0] == "num":
                  a = left[1]
                  b = right[1]
                  if op == "+":
                      return ("num", a + b)
                  if op == "-":
                      return ("num", a - b)
                  if op == "*":
                      return ("num", a * b)
                  if b != 0:
                      return ("num", a / b)
              return ("bin", op, left, right)


