                return a != b


            # x != 0 and 10 / x > 2
            check = ("and", ("cmp", "!=", ("var", "x"), ("num", 0)),
                     ("cmp", ">", ("bin", "/", ("num", 10), ("var", "x")), ("num", 2)))
