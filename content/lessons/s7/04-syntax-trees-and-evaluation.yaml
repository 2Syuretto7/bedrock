            def evaluate(node, env):
                # Nodes: ("num", v), ("var", name), ("bin", op, left, right) for + - * /,
                # ("cmp", op, left, right) for > and !=, and ("and", left, right) and
                # ("or", left, right), which behave as in Python: they evaluate the
                # right side only if the left side does not settle the answer, and
                # they give back the value of the side that decided.
                kind = node[0]
                if kind == "num":
                    return node[1]
                if kind == "var":
                    return env[node[1]]
                if kind in ("and", "or"):
                    left = evaluate(node[1], env)
