    - question:
        id: work-formulas
        type: choice
        system: s2
        prompt: |
          Deepak's app lets restaurant owners type pricing formulas such as `base * 1.18 + 40`. How should the app work out a formula's value?
        options:
          - "Parse it into a tree and evaluate it with its own walker that allows only numbers, the names it supplies and arithmetic."
          - "Pass the formula to Python's eval, since it already understands arithmetic."
          - "Pass it to eval after checking that it contains no letters other than base."
          - "Store the formula and ask a developer to code each one by hand."
        answer: 0
        explanation: |
          A walker that knows only a few node kinds cannot be made to do anything else, so a hostile formula can at worst be rejected. `eval` runs any Python at all, including code that deletes files, and filtering characters is a race against every trick attackers know.
  connections:
    - text: |
        7. The tree has the multiplication at its root, two additions below and four numbers as leaves. The brackets shaped the tree and then disappeared, because the tree itself now says that both sums come first.

        Tree-walkers are not only for toy languages. Spreadsheet formulas, template engines, configuration languages and the filter expressions in many databases are evaluated this way, because a tree-walker is short, easy to check against the definition of the language, and fast enough when each node does a lot of work. It becomes slow when each node does very little, as in a tight loop over numbers, because then the cost of visiting a node, a function call and a check on its kind, is larger than the work the node stands for.

        A tree-walker is the clearest statement of what a program means, and a fine way to build a small language. Python itself goes one step further: it compiles each tree once into a flat list of simple instructions for a machine with a stack, and its interpreter loop runs those instead. [[s7.how-python-runs-bytecode-and-the-interpreter-loop]] looks inside, at the instructions Python actually executes.
