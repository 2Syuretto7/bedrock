concept: s7.memory-management-and-garbage-collection
minutes: 85
claim: You can say where a program's values live, in frames on the call stack or as objects on the heap, and why heap memory must be given back; name the two classic bugs of freeing by hand, the leak and the use after free; implement reference counting with its cascade of frees, and show why a cycle defeats it; implement mark and sweep from the roots; explain generational collection and the write barrier and remembered set that keep it correct; describe how CPython combines counting with a cycle collector and what a weak reference is for; and find the leaks a collector cannot fix, objects still reachable but never used again.
recalls: [s7.static-and-dynamic-types]
uses: [s7.how-python-runs-bytecode-and-the-interpreter-loop, s7.scope-closures-and-higher-order-functions, s3.breadth-first-and-depth-first-search, s2.graphs-and-their-representations, s2.linked-lists, s3.amortised-analysis]
leads: [q3.from-sql-to-a-plan, h1.logic-gates]
starter: |
  # Scratch space. sys.getrefcount counts the references to an object,
  # plus one for the argument it is handed.
  import sys

  ticket = ["PNR", 4521367890]
  print(sys.getrefcount(ticket))
  alias = ticket
  print(sys.getrefcount(ticket))
  del alias
  print(sys.getrefcount(ticket))
parts:
  recall:
    - text: |
        [[s7.static-and-dynamic-types]] ended with Python's values as objects that carry their own type, made and abandoned by the million while a program runs. Nobody writes the code that gives their memory back, so something else must decide when an object is finished with. This last lesson of the cluster looks at how. Three quick pulls first.
  puzzle:
    - text: |
        A messaging app keeps three objects that refer to each other in a ring: a chat refers to its latest message, the message refers to its sender's profile, and the profile refers back to the chat. Then the app drops its only variable that pointed at the chat.

        Reference counting frees an object as soon as the number of references to it falls to 0. **With reference counting alone, how many of the three objects are freed?**
  intuition:
    - text: |
        At the end of term a hostel warden wants to clear out rooms that nobody uses any more. Counting the keys still handed out does not work: two students who left months ago swapped spare keys to each other's rooms, so each of their rooms still has a key out, and both would be kept for ever. A better warden starts from the register of current students, walks to each one's room, follows any note saying "sharing with" to the next room, and marks every room reached that way. Every room left unmarked is cleared, keys or no keys.

        A garbage collector faces the same question about memory. The figure shows a small heap of objects with arrows for references. Step through the marking that starts from the program's variables, and then switch to counting references instead.
    - figure: mark-sweep
      props: { step: 0 }
    - text: |
        Being referred to is not what makes an object worth keeping; being **reachable** from the program is. The pair old_cart and old_item point at each other, so each has a count of 1, but no chain of references from the variables reaches either. Marking from the roots finds every live object and none of the garbage, cycles included, which is why tracing collectors are the backbone of most language runtimes.
  derivation:
    - text: |
        **Stack and heap.** Every function call gets a frame, as in [[s7.how-python-runs-bytecode-and-the-interpreter-loop]], and frames are freed in strict order as calls return. That region, the **stack**, manages itself. But many values must outlive the call that made them: a list a function returns, or the cells a closure keeps alive in [[s7.scope-closures-and-higher-order-functions]]. Those live on the **heap**, a large region where blocks of memory are handed out on request and must be handed back when finished with. In Python every value is a heap object, and a frame holds only references to them.

        In C the programmer hands memory back by hand, calling `free`, and gets two famous bugs. A **leak** forgets to free, so memory use grows until the program is restarted or killed. A **use after free** frees too early: the block is handed out again for something else, and the old reference now reads or overwrites that something else, which is behind a large share of serious security holes. Freeing the same block twice is a close cousin. **Garbage collection** takes the job away from the programmer. An object is garbage when no chain of references from the **roots**, the variables in live frames and the module globals, can reach it, and the runtime frees garbage on its own.
    - question:
        id: derivation-bug
        type: choice
        system: s2
        prompt: |
          A C program frees a buffer, then later writes through its old pointer to that buffer, after the same memory has been handed out again to hold a password. What is this bug called?
        options:
          - "A use after free"
          - "A memory leak"
          - "A stack overflow"
          - "A type error"
        answer: 0
        explanation: |
          The pointer outlived the memory it pointed to, so the write lands on whatever was put there next, here a password. A leak is the opposite mistake, memory never freed.
    - text: |
        **Reference counting.** Keep, in each object's header, a count of the references to it. Storing a reference adds 1 to the count, dropping one subtracts 1, and when a count reaches 0 the object is freed on the spot. Freeing an object drops the references it held, which can bring other counts to 0 in turn, a cascade that frees a whole structure at once. Memory comes back the moment it is finished with, pauses are short and predictable, and the idea is simple.

        It has two costs. Every assignment of a reference becomes a little more work, two count updates, and in a program with several threads those updates must be made safe from each other, which costs more. And it cannot free a **cycle**: objects that refer to each other in a ring keep each other's counts at 1 or more even after nothing else can reach them. Cycles are common in real programs: a doubly linked list from [[s2.linked-lists]], a tree whose children point back to their parents, an object that registers itself in a list it also holds.
    - question:
        id: derivation-cascade
        type: numeric
        system: s2
        prompt: |
          A booking refers to a ticket and to a passenger, and neither of those refers to anything. A single variable holds the only reference to the booking, and nothing else refers to the ticket or the passenger. When that variable is set to None, how many objects does reference counting free?
        answer: "3"
        explanation: |
          The booking's count falls to 0 and it is freed. Freeing it drops its references, so the ticket's and the passenger's counts fall to 0 as well, and both are freed in the cascade.
    - text: |
        **Tracing: mark and sweep.** A tracing collector starts from the roots and follows references, a depth-first or breadth-first search from [[s3.breadth-first-and-depth-first-search]] over the object graph of [[s2.graphs-and-their-representations]], marking every object it reaches. Then it **sweeps** the heap, freeing every object left unmarked and clearing the marks for next time. Cycles are no problem, because reachability is all it asks about. The cost is that marking takes time in proportion to the live objects and sweeping to the whole heap, all at once, so the program may **pause** while it happens. Modern collectors shrink the pause by marking in small slices, or alongside the running program, and many also **compact**, moving survivors together so that new objects can be handed out by bumping a pointer, the cheapest allocation there is.
    - question:
        id: derivation-mark
        type: order
        system: s2
        prompt: |
          Put the steps of one mark-and-sweep collection in order.
        steps:
          - "Pause the program."
          - "Push every root onto a stack."
          - "Pop an object; if it is unmarked, mark it and push every object it refers to."
          - "Repeat until the stack is empty."
          - "Walk the whole heap, freeing every unmarked object and clearing the other marks."
          - "Resume the program."
        explanation: |
          Marking must finish before sweeping starts, or a live object not yet reached would be freed; and the program must not change references while the collector is looking, unless the collector is designed to cope with that.
    - text: |
        **Generations.** Most objects die young: the temporary list in a comprehension, the string built for one line of output, the iterator of a loop. That observation, the **generational hypothesis**, suggests splitting the heap. New objects go into a small **young generation** that is collected often and cheaply, since most of it is garbage; the few survivors are promoted to an **old generation** that is collected rarely. The cost per object, averaged over many collections as in [[s3.amortised-analysis]], falls sharply.

        There is a catch. A minor collection traces only the young generation, so it never looks inside old objects. If an old object comes to refer to a young one, that young object may be reachable only through the old one, and a minor collection would free it while it is still in use. The fix is a **write barrier**: a few extra instructions run on every store of a reference, which notice an old object being made to point at a young one and record it in a **remembered set**. A minor collection treats the remembered objects as extra roots. The Java, .NET and JavaScript runtimes all work this way.

        **CPython** combines both ideas. Reference counting does most of the work, so most objects are freed the moment their last reference goes. A separate **cycle collector**, the `gc` module, runs now and then to find groups of container objects referred to only by each other, and frees them; it too gives younger objects more attention than old ones, and `gc.collect()` runs it on demand. A **weak reference**, `weakref.ref(obj)`, refers to an object without counting, and returns `None` once the object has gone, which is how caches and lists of listeners avoid keeping things alive.
    - question:
        id: derivation-barrier
        type: choice
        system: s2
        prompt: |
          A minor collection traces only the young generation. Why does it need the remembered set?
        options:
          - "To find young objects reachable only through an old object, which it would otherwise free while they are in use"
          - "To find old objects that have become garbage"
          - "To count the references to each young object"
          - "To decide which old objects to move back into the young generation"
        answer: 0
        explanation: |
          The minor collection never looks inside old objects, so a reference from old to young would be invisible. The write barrier records such old objects, and their references are treated as roots.
    - text: |
        **Leaks a collector cannot fix.** A collector frees what cannot be reached. It cannot free what can still be reached but will never be used again, and that is how programs in collected languages leak. A module-level dictionary used as a cache, keyed by user and never trimmed, grows for as long as the server runs. A list of callbacks to which screens are added but never removed keeps every old screen alive. A closure that captured a large list keeps all of it. The fixes are to bound what grows, with `functools.lru_cache(maxsize=1000)` or an expiry time; to unregister what is finished; or to hold such references weakly. A memory graph that climbs steadily under a steady load is the sign to look for, and Python's `tracemalloc` shows which lines allocated what is still held.
  formal:
    - text: |
        **Heap and roots.** The heap holds objects whose lifetime is not tied to one call. The roots are the references the program holds directly: variables in live frames and globals. An object is live if a chain of references from a root reaches it, and garbage otherwise.

        **Reference counting.** Each object stores the number of references to it; at 0 it is freed at once, and its own references are dropped, possibly in a cascade. It cannot free cycles.

        **Mark and sweep.** Mark every object reachable from the roots by a graph search, then free every unmarked object. Time is proportional to the live objects plus the heap.

        **Generational collection.** Collect a young generation often and promote survivors to an old one collected rarely. A write barrier records old objects that refer to young ones in a remembered set, whose references are roots for a minor collection.

        **CPython.** Reference counting plus a cycle collector, `gc`; `weakref.ref` refers without counting.
  drill:
    - text: Seconds each. Ask what can still be reached from the roots.
    - question:
        id: drill-reach
        type: choice
        system: s1
        prompt: |
          An object is referred to by two other objects, but none of the three can be reached from any variable or global. What does a tracing collector do with it?
        options:
          - "Frees it, along with the two objects referring to it"
          - "Keeps it, because two objects refer to it"
          - "Keeps it until both of the other objects are freed one by one"
          - "Moves it to the old generation"
        answer: 0
        explanation: Only reachability from the roots counts, and none of the three is reachable.
    - question:
        id: drill-leak
        type: choice
        system: s1
        prompt: |
          A server's memory climbs steadily for days, although Python's collector is running. What is the most likely cause?
        options:
          - "Something reachable, such as a cache or a list, keeps growing"
          - "The collector cannot free cycles"
          - "Reference counts have overflowed"
          - "The stack is too small"
        answer: 0
        explanation: A collector frees only unreachable objects, and CPython's cycle collector does free cycles; a structure that keeps growing stays reachable.
    - question:
        id: predict-del
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          fares = [450, 990]
          alias = fares
          del fares
          print(alias)
        output: "[450, 990]"
        explanation: del removes a name, not the object. The list still has a reference, alias, so it survives.
    - question:
        id: predict-weakref
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import weakref


          class Booking:
              pass


          booking = Booking()
          ref = weakref.ref(booking)
          print(ref() is booking)
          booking = None
          print(ref())
        output: |
          True
          None
        explanation: The weak reference does not count, so when the only real reference goes, the object is freed at once and the weak reference returns None.
  work:
    - text: Slower now. Each answer frees memory, or decides what must not be freed.
    - question:
        id: write-mark-sweep
        type: code
        mode: write
        system: s2
        prompt: |
          Write `collect`, a mark-and-sweep collector for a heap stored as a dictionary of references. The program should print two lines: the freed objects, `['log', 'old_cart', 'old_item']`, then the five that survive.
        starter: |
          def collect(heap, roots):
              # heap maps each object's name to the list of names it refers to.
              # Mark every object that can be reached from the roots by following
              # references, however many steps away; then sweep: delete every
              # unmarked object from heap and return their names, sorted.
              return []


          heap = {
              "session": ["cart", "user"],
              "cart": ["item1", "item2"],
              "item1": ["cart"],
              "item2": [],
              "user": [],
              "old_cart": ["old_item"],
              "old_item": ["old_cart"],
              "log": ["log"],
          }
          print(collect(heap, ["session"]))
          print(sorted(heap))
        solution: |
          def collect(heap, roots):
              # heap maps each object's name to the list of names it refers to.
              # Mark every object that can be reached from the roots by following
              # references, however many steps away; then sweep: delete every
              # unmarked object from heap and return their names, sorted.
              marked = set()
              stack = list(roots)
              while stack:
                  name = stack.pop()
                  if name in marked:
                      continue
                  marked.add(name)
                  stack.extend(heap[name])
              freed = sorted(name for name in heap if name not in marked)
              for name in freed:
                  del heap[name]
              return freed


          heap = {
              "session": ["cart", "user"],
              "cart": ["item1", "item2"],
              "item1": ["cart"],
              "item2": [],
              "user": [],
              "old_cart": ["old_item"],
              "old_item": ["old_cart"],
              "log": ["log"],
          }
          print(collect(heap, ["session"]))
          print(sorted(heap))
        tests: |
          def _run(_heap, _roots):
              _h = {_k: list(_v) for _k, _v in _heap.items()}
              _freed = collect(_h, _roots)
              return _freed, sorted(_h)


          _got = _run({"a": ["b"], "b": ["c"], "c": ["d"], "d": []}, ["a"])
          assert _got == ([], ["a", "b", "c", "d"]), "In a chain a -> b -> c -> d with root a, every object is reachable, so nothing should be freed; got " + repr(_got)
          _got = _run({"a": ["b"], "b": ["a"], "c": []}, [])
          assert _got == (["a", "b", "c"], []), "With no roots at all, every object should be freed; got " + repr(_got)
          _got = _run({"r": [], "x": ["y"], "y": ["z"], "z": ["x"]}, ["r"])
          assert _got == (["x", "y", "z"], ["r"]), "A cycle x -> y -> z -> x that no root reaches should be freed; got " + repr(_got)
          _got = _run({"p": ["q"], "q": [], "s": ["t"], "t": ["s"], "u": []}, ["p", "s"])
          assert _got == (["u"], ["p", "q", "s", "t"]), "With two roots p and s, only u is unreachable; got " + repr(_got)
          _got = _run({"z": [], "m": [], "a": [], "root": []}, ["root"])
          assert _got[0] == ["a", "m", "z"], "The freed names should be returned sorted; got " + repr(_got[0])
          _h = {"keep": [], "drop": []}
          collect(_h, ["keep"])
          assert "drop" not in _h, "The sweep should delete freed objects from the heap itself"
          assert output.splitlines() == ["['log', 'old_cart', 'old_item']", "['cart', 'item1', 'item2', 'session', 'user']"], "The program should print the three freed objects, then the five that survive"
        wrong:
