                    stack.extend(heap[root])
                while stack:
                    name = stack.pop()
                    if name in marked:
                        continue
                    marked.add(name)
                    stack.extend(heap[name])
                freed = sorted(name for name in heap if name not in marked)
                for name in freed:
                    del heap[name]
                return freed


            heap = {
                "session": ["cart", "user"],
                "cart": ["item1", "item2"],
                "item1": ["cart"],
                "item2": [],
                "user": [],
                "old_cart": ["old_item"],
                "old_item": ["old_cart"],
                "log": ["log"],
            }
            print(collect(heap, ["session"]))
            print(sorted(heap))
        explanation: |
          Mark with a stack and a set: pop a name, skip it if already marked, otherwise mark it and push everything it refers to; the set is what stops a cycle looping for ever. Then sweep the unmarked names out of the dictionary. Marking only the roots' direct references misses objects two steps away; keeping every object that something refers to is reference counting, which cannot free a cycle or a self-reference; and starting from the roots' references instead of the roots themselves frees the roots.
    - question:
        id: write-refcount
        type: code
        mode: write
        system: s2
        prompt: |
          Write `decref`, which drops one reference to an object and frees it, and whatever it alone kept alive, when no references are left. The program should print two lines: `freed: ['booking', 'ticket', 'passenger']`, then the two coaches that a cycle keeps alive.
        starter: |
          class Heap:
              def __init__(self):
                  self.refs = {}
                  self.count = {}
                  self.freed = []

              def new(self, name):
                  self.refs[name] = []
                  self.count[name] = 0

              def incref(self, name):
                  self.count[name] += 1

              def link(self, source, target):
                  # source now holds a reference to target.
                  self.refs[source].append(target)
                  self.incref(target)

              def decref(self, name):
                  # Drop one reference to name. If no references are left, free it:
                  # append name to self.freed, delete it from self.refs and
                  # self.count, and then drop the reference it held to each object
                  # in its refs list, which may free those in turn.
                  self.count[name] -= 1


          h = Heap()
          for name in ["booking", "ticket", "passenger", "coach_a", "coach_b"]:
              h.new(name)
          h.link("booking", "ticket")
          h.link("booking", "passenger")
          h.incref("booking")
          h.link("coach_a", "coach_b")
          h.link("coach_b", "coach_a")
          h.incref("coach_a")
          try:
              h.decref("booking")
              h.decref("coach_a")
          except KeyError as error:
              print("dropped a reference to an object already freed:", error)
          print("freed:", h.freed)
          print("still counted:", sorted(h.count))
        solution: |
          class Heap:
              def __init__(self):
                  self.refs = {}
                  self.count = {}
                  self.freed = []

              def new(self, name):
                  self.refs[name] = []
                  self.count[name] = 0

              def incref(self, name):
                  self.count[name] += 1

              def link(self, source, target):
                  # source now holds a reference to target.
                  self.refs[source].append(target)
                  self.incref(target)

              def decref(self, name):
                  # Drop one reference to name. If no references are left, free it:
                  # append name to self.freed, delete it from self.refs and
                  # self.count, and then drop the reference it held to each object
                  # in its refs list, which may free those in turn.
                  self.count[name] -= 1
                  if self.count[name] > 0:
                      return
                  self.freed.append(name)
                  held = self.refs[name]
                  del self.refs[name]
                  del self.count[name]
                  for target in held:
                      self.decref(target)


          h = Heap()
          for name in ["booking", "ticket", "passenger", "coach_a", "coach_b"]:
              h.new(name)
          h.link("booking", "ticket")
          h.link("booking", "passenger")
          h.incref("booking")
          h.link("coach_a", "coach_b")
          h.link("coach_b", "coach_a")
          h.incref("coach_a")
          try:
              h.decref("booking")
              h.decref("coach_a")
          except KeyError as error:
              print("dropped a reference to an object already freed:", error)
          print("freed:", h.freed)
          print("still counted:", sorted(h.count))
        tests: |
          def _fresh(_names):
              _h = Heap()
              for _n in _names:
                  _h.new(_n)
              return _h


          def _drop(_h, _name):
              try:
                  _h.decref(_name)
              except (KeyError, RecursionError) as _e:
                  raise AssertionError("decref(" + repr(_name) + ") raised " + type(_e).__name__ + ": " + str(_e))


          _h = _fresh(["a"])
          _h.incref("a")
          _h.incref("a")
          _drop(_h, "a")
          assert _h.freed == [] and _h.count.get("a") == 1, "An object with two references should survive losing one, with a count of 1; freed " + repr(_h.freed)
          _drop(_h, "a")
          assert _h.freed == ["a"], "An object should be freed when its last reference is dropped; freed " + repr(_h.freed)
          assert "a" not in _h.count and "a" not in _h.refs, "A freed object should be deleted from refs and count"
          _h = _fresh(["a", "b", "c", "d"])
          _h.link("a", "b")
          _h.link("b", "c")
          _h.link("c", "d")
          _h.incref("a")
          _drop(_h, "a")
          assert _h.freed == ["a", "b", "c", "d"], "Freeing the head of a chain a -> b -> c -> d should free the whole chain in order; freed " + repr(_h.freed)
          _h = _fresh(["a", "b", "shared"])
          _h.link("a", "shared")
          _h.link("b", "shared")
          _h.incref("a")
          _h.incref("b")
          _drop(_h, "a")
          assert _h.freed == ["a"], "An object still referred to by b should not be freed when a goes; freed " + repr(_h.freed)
          assert _h.count.get("shared") == 1, "shared should have a count of 1 once a is freed, not " + repr(_h.count.get("shared"))
          _drop(_h, "b")
          assert _h.freed == ["a", "b", "shared"], "Freeing b should then free shared; freed " + repr(_h.freed)
          _h = _fresh(["x", "y"])
          _h.link("x", "y")
          _h.link("y", "x")
          _h.incref("x")
          _drop(_h, "x")
          assert _h.freed == [] and _h.count == {"x": 1, "y": 1}, "A cycle keeps both counts at 1 once the outside reference goes, and nothing is freed"
          assert output.splitlines() == ["freed: ['booking', 'ticket', 'passenger']", "still counted: ['coach_a', 'coach_b']"], "The program should print the three freed objects, then the two coaches that a cycle keeps alive"
        wrong:
          - |
            class Heap:
                def __init__(self):
                    self.refs = {}
                    self.count = {}
                    self.freed = []

                def new(self, name):
                    self.refs[name] = []
                    self.count[name] = 0

                def incref(self, name):
                    self.count[name] += 1

                def link(self, source, target):
                    # source now holds a reference to target.
                    self.refs[source].append(target)
                    self.incref(target)

                def decref(self, name):
                    # Drop one reference to name. If no references are left, free it:
                    # append name to self.freed, delete it from self.refs and
                    # self.count, and then drop the reference it held to each object
                    # in its refs list, which may free those in turn.
