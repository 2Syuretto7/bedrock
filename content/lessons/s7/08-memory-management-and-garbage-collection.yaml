    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          A chat, a message and a profile refer to each other in a ring, and the app drops its only variable pointing at the chat. With reference counting alone, how many of the three objects are freed?
        answer: "0"
        explanation: |
          Each object still has one reference, from the one before it in the ring, so no count reaches 0 and nothing is freed, although none of them can be reached. A tracing collector, or CPython's cycle collector, would free all three.
    - question:
        id: work-leak
        type: choice
        system: s2
        prompt: |
          Meera's Python web service grows by about 50 MB an hour until it is restarted. A module-level dictionary caches each user's rendered dashboard by user id and is never cleared. What is the best fix?
        options:
          - "Bound the cache, for example with functools.lru_cache(maxsize=...) or an expiry time"
          - "Call gc.collect() every minute"
          - "Restart the service every night"
          - "Delete each request's local variables at the end of the request"
        answer: 0
        explanation: |
          Every cached dashboard is still reachable from the dictionary, so no collector may free it; only removing entries helps. Running the collector more often frees nothing new, nightly restarts hide the leak, and local variables are not what holds the memory.
  connections:
    - text: |
        0. Each object in the ring has exactly one reference, from the one before it, so no count ever reaches 0, although nothing outside the ring can reach any of them. Counting asks the wrong question; reachability from the roots asks the right one, which is why CPython backs its counts with a cycle collector.

        That completes the cluster: text becomes tokens, tokens become a tree, a tree becomes instructions that a loop runs, and the runtime manages names, types and memory underneath. The same pattern returns in databases, where [[q3.from-sql-to-a-plan]] turns a SQL query into a tree of operators that a loop runs; and the machine underneath every interpreter, built up from single gates to a processor that fetches and runs instructions of its own, begins in [[h1.logic-gates]].
