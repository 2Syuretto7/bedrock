          def parse_list(text):
              # Grammar, with no spaces allowed:
              #   value -> NUMBER | "[" items? "]"
              #   items -> value ("," value)*
              # where NUMBER is one or more digits. Return the value as Python ints
              # and lists, such as [1, [2, 3], []]. Anything that does not fit the
              # grammar, including text left over at the end, raises ValueError.
              reader = Reader(text)
              result = reader.value()
              if reader.pos != len(text):
                  raise ValueError("unexpected " + text[reader.pos] + " at " + str(reader.pos))
              return result


          class Reader:
              def __init__(self, text):
                  self.text = text
                  self.pos = 0

              def peek(self):
                  return self.text[self.pos] if self.pos < len(self.text) else ""

              def value(self):
                  c = self.peek()
                  if c.isdigit():
                      start = self.pos
                      while self.peek().isdigit():
                          self.pos += 1
                      return int(self.text[start:self.pos])
                  if c == "[":
                      self.pos += 1
                      items = []
                      if self.peek() == "]":
                          self.pos += 1
                          return items
                      items.append(self.value())
                      while self.peek() == ",":
                          self.pos += 1
                          items.append(self.value())
                      if self.peek() != "]":
                          raise ValueError("expected , or ] at " + str(self.pos))
                      self.pos += 1
                      return items
                  raise ValueError("expected a number or [ at " + str(self.pos))


          for text in ["[1,[2,3],[],[[45]]]", "[1,]", "[1,2", "[1]]", "[,1]"]:
              try:
                  print(text, "->", parse_list(text))
              except ValueError:
                  print(text, "-> rejected")
