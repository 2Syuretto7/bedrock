        explanation: |
          Write `expr`, `term` and `factor` as the grammar says, each loop folding the next operand onto the tree so far, and have `parse` call `expr` and then insist that no tokens remain. Treating all four operators at one level loses precedence, so `2 + 3 * 4` adds first; recursing on the right of a minus groups `8 - 4 - 2` as `8 - (4 - 2)`; and skipping the final check accepts `1 2` as just `1`.
    - question:
        id: fix-power
        type: code
        mode: find-bug
        system: s2
        prompt: |
          This parser for powers and minus signs should follow Python's rules. The program should print four lines, giving 512, -4, 0.5 and 64. It prints 64 for `2 ** 3 ** 2` and an error for `2 ** - 1`. Find the fault and fix it.
        starter: |
          class Parser:
              # Grammar, as in Python:
              #   unary -> "-" unary | power
              #   power -> atom ("**" unary)?
              #   atom  -> NUMBER | "(" unary ")"
              # So ** groups from the right, 2 ** 3 ** 2 meaning 2 ** (3 ** 2), and
              # binds tighter than a minus on its left but not one on its right:
              # -2 ** 2 is -(2 ** 2), and 2 ** -1 is allowed.
              def __init__(self, tokens):
                  self.tokens = tokens
                  self.pos = 0

              def peek(self):
                  return self.tokens[self.pos] if self.pos < len(self.tokens) else None

              def take(self):
                  token = self.peek()
                  self.pos += 1
                  return token

              def parse(self):
                  tree = self.unary()
                  if self.peek() is not None:
                      raise ValueError("unexpected " + self.peek())
                  return tree

              def unary(self):
                  if self.peek() == "-":
                      self.take()
                      return ("neg", self.unary())
                  return self.power()

              def power(self):
                  left = self.atom()
                  while self.peek() == "**":
                      self.take()
                      left = ("**", left, self.atom())
                  return left

              def atom(self):
                  token = self.take()
                  if token is not None and token.isdigit():
                      return int(token)
                  if token == "(":
                      tree = self.unary()
                      if self.take() != ")":
                          raise ValueError("expected )")
                      return tree
                  raise ValueError("unexpected " + str(token))


          def calc(tree):
              if isinstance(tree, int):
                  return tree
              if tree[0] == "neg":
                  return -calc(tree[1])
              return calc(tree[1]) ** calc(tree[2])


          for text in ["2 ** 3 ** 2", "- 2 ** 2", "2 ** - 1", "( 2 ** 3 ) ** 2"]:
              try:
                  print(text, "=", calc(Parser(text.split()).parse()))
              except ValueError:
                  print(text, "= error")
        solution: |
          class Parser:
              # Grammar, as in Python:
              #   unary -> "-" unary | power
              #   power -> atom ("**" unary)?
              #   atom  -> NUMBER | "(" unary ")"
              # So ** groups from the right, 2 ** 3 ** 2 meaning 2 ** (3 ** 2), and
              # binds tighter than a minus on its left but not one on its right:
              # -2 ** 2 is -(2 ** 2), and 2 ** -1 is allowed.
              def __init__(self, tokens):
                  self.tokens = tokens
                  self.pos = 0

              def peek(self):
                  return self.tokens[self.pos] if self.pos < len(self.tokens) else None

              def take(self):
                  token = self.peek()
                  self.pos += 1
                  return token

              def parse(self):
                  tree = self.unary()
                  if self.peek() is not None:
                      raise ValueError("unexpected " + self.peek())
                  return tree

              def unary(self):
                  if self.peek() == "-":
                      self.take()
                      return ("neg", self.unary())
                  return self.power()

              def power(self):
                  left = self.atom()
                  if self.peek() == "**":
                      self.take()
                      return ("**", left, self.unary())
                  return left

              def atom(self):
                  token = self.take()
                  if token is not None and token.isdigit():
                      return int(token)
                  if token == "(":
                      tree = self.unary()
                      if self.take() != ")":
                          raise ValueError("expected )")
                      return tree
                  raise ValueError("unexpected " + str(token))


          def calc(tree):
              if isinstance(tree, int):
                  return tree
              if tree[0] == "neg":
                  return -calc(tree[1])
              return calc(tree[1]) ** calc(tree[2])


          for text in ["2 ** 3 ** 2", "- 2 ** 2", "2 ** - 1", "( 2 ** 3 ) ** 2"]:
              try:
                  print(text, "=", calc(Parser(text.split()).parse()))
              except ValueError:
                  print(text, "= error")
