                # with numbers as ints. Operators of the same level group from the left.
                # Any token out of place, or left over at the end, raises ValueError.
                def __init__(self, tokens):
                    self.tokens = tokens
                    self.pos = 0

                def peek(self):
                    return self.tokens[self.pos] if self.pos < len(self.tokens) else None

                def take(self):
                    token = self.peek()
                    self.pos += 1
                    return token

                def parse(self):
                    return self.expr()

                def expr(self):
                    left = self.term()
                    while self.peek() in ("+", "-"):
                        op = self.take()
                        left = (op, left, self.term())
                    return left

                def term(self):
                    left = self.factor()
                    while self.peek() in ("*", "/"):
                        op = self.take()
                        left = (op, left, self.factor())
                    return left

                def factor(self):
                    token = self.take()
                    if token is not None and token.isdigit():
                        return int(token)
                    if token == "(":
                        tree = self.expr()
                        if self.take() != ")":
