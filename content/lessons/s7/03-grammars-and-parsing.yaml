    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          In the puzzle, how many parse trees does `8 - 4 - 2 - 1` have under the grammar `E -> E "-" E | NUMBER`?
        answer: "5"
        explanation: |
          The last subtraction to happen splits the line. Split after 8: the right part `4 - 2 - 1` has 2 trees. Split after 4: 1 tree on each side. Split after 2: the left part `8 - 4 - 2` has 2 trees. That is $2 + 1 + 2 = 5$.
    - question:
        id: work-design
        type: choice
        system: s2
        prompt: |
          Ananya is designing a small language for fare rules and wants `a - b - c` to mean `(a - b) - c` and `a * b + c` to mean `(a * b) + c`. Which grammar should she use?
        options:
          - "`expr -> term (\"-\" term | \"+\" term)*` and `term -> NUMBER (\"*\" NUMBER)*`"
          - "`expr -> expr \"-\" expr | expr \"*\" expr | expr \"+\" expr | NUMBER`"
          - "`expr -> NUMBER (\"-\" expr | \"+\" expr | \"*\" expr)?`"
          - "`expr -> term (\"*\" term)*` and `term -> NUMBER (\"-\" NUMBER | \"+\" NUMBER)*`"
        answer: 0
        explanation: |
          Levels put `*` lower, so it groups first, and loops fold from the left. The second grammar is ambiguous; the third recurses on the right, so `a - b - c` becomes `a - (b - c)`; and the fourth puts `+` and `-` below `*`, so `a * b + c` becomes `a * (b + c)`.
  connections:
    - text: |
        5. Whichever subtraction happens last splits the line in two, and each side is grouped in its own ways: 2 trees, 1 and 2 more, as the recurrence counts. Four numbers already give five meanings, and the count grows quickly with length, which is why a grammar for a real language is written so that each line has exactly one tree.

        A parser's output is a tree, but the parse tree records every rule used, including brackets and levels that no longer matter once the grouping is known. [[s7.syntax-trees-and-evaluation]] keeps only what matters, an abstract syntax tree, and walks it to compute an answer: the heart of an interpreter.
