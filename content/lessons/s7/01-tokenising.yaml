          def read_string(text, i):
              # text[i] is a double quote that opens a string literal. Read up to the
              # matching closing quote and return (value, index just after it). Inside
              # the literal, a backslash escapes the next character: \" is a quote,
              # \\ is a backslash and \n is a newline. If the text ends before the
              # closing quote, raise ValueError("unterminated string at position i").
              start = i
              i += 1
              chars = []
              while i < len(text):
                  c = text[i]
                  if c == '"':
                      return "".join(chars), i + 1
                  if c == "\\" and i + 1 < len(text):
                      nxt = text[i + 1]
                      chars.append("\n" if nxt == "n" else nxt)
                      i += 2
                  else:
                      chars.append(c)
                      i += 1
              raise ValueError("unterminated string at position " + str(start))


          source = r'say "He said \"chalo\" and left" twice'
          value, end = read_string(source, 4)
          print(value)
          print(repr(source[end:]))
