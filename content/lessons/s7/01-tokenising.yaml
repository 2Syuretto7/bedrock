            source = r'say "He said \"chalo\" and left" twice'
            value, end = read_string(source, 4)
            print(value)
            print(repr(source[end:]))
        explanation: |
          Walk forward from just after the opening quote. A backslash means the next character is taken as it is, or as a newline for `n`, and both are consumed together; an unescaped quote ends the string. Checking whether the character before a quote is a backslash fails on an escaped backslash just before the closing quote; keeping the backslashes leaves `\"` in the value; and returning quietly at the end of the text hides an unterminated string that the user needs to hear about.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          In the puzzle, how many tokens does the calculator find in `12+3.5*(4-1)`?
        answer: "9"
        explanation: |
          `12`, `+`, `3.5`, `*`, `(`, `4`, `-`, `1` and `)`. The digits of `12` and of `3.5` each make a single number, by the longest match.
    - question:
        id: work-terminates
        type: choice
        system: s2
        prompt: |
          A fuzzer finds an input on which Kavya's tokeniser runs for ever. Which rule, applied to every turn of the main loop, would have prevented it?
        options:
          - "Each turn either moves the cursor forward by at least one character or stops with an error."
          - "Each turn produces exactly one token."
          - "Each turn looks at no more than two characters."
          - "The loop runs at most 1,000 times."
        answer: 0
        explanation: |
          If the cursor always advances, the loop can run at most as many times as there are characters. Turns that skip a space produce no token, so one token per turn is not a rule a tokeniser can follow; looking at few characters does not stop a turn from going nowhere; and a fixed limit wrongly fails on long, valid files.
  connections:
    - text: |
        9. The scanner reads `12` as one number, `+`, `3.5` as one number, `*`, `(`, `4`, `-`, `1` and `)`. Each digit run becomes a single token because the scanner takes the longest match, and the brackets and operators are tokens of their own.

        Every rule in this lesson had the same shape: a pattern of characters that makes one kind of token, such as digits, then optionally a dot and more digits. Patterns like that have their own notation, regular expressions, and their own machine, the finite automaton, which reads one character at a time and remembers only which state it is in. [[s7.regular-expressions-and-finite-automata]] shows how the two fit together, and why they can describe tokens but not the nested brackets that [[s7.grammars-and-parsing]] will need.
