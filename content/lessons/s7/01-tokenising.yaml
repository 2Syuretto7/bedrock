        explanation: |
          Choose by the first character: a space moves on, a digit starts a number, a letter or underscore starts a name, and one of the operator characters is a token by itself; anything else raises the error with its position. A number takes its digits, then a dot only if a digit follows it. Letting dots run freely accepts `1.2.3` as a number; stopping names at a digit splits `gst2` in two; and skipping unknown characters silently turns `a $ b` into a different, valid formula.
    - question:
        id: fix-longest-match
        type: code
        mode: find-bug
        system: s2
        prompt: |
          This tokeniser should take the longest operator at each position. The program should print `['age', '>=', '18', 'and', 'fare', '!=', '0']`. It prints `['age', '>', '=', '18', 'and', 'fare', '!=', '0']`. Find the fault and fix it.
        starter: |
          OPERATORS = ["<", ">", "=", "<=", ">=", "==", "!="]


          def tokenise(text):
              # Split text into numbers, names and operators, skipping spaces. When
              # more than one operator matches at a position, take the longest, so
              # "<=" is one token, not "<" followed by "=".
              tokens = []
              i = 0
              while i < len(text):
                  c = text[i]
                  if c == " ":
                      i += 1
                  elif c.isdigit() or c.isalpha():
                      j = i
                      while j < len(text) and text[j].isalnum():
                          j += 1
                      tokens.append(text[i:j])
                      i = j
                  else:
                      found = None
                      for op in OPERATORS:
                          if found is None and text.startswith(op, i):
                              found = op
                      if found is None:
                          raise ValueError("unexpected " + c + " at position " + str(i))
                      tokens.append(found)
                      i += len(found)
              return tokens


          print(tokenise("age>=18 and fare!=0"))
        solution: |
          OPERATORS = ["<=", ">=", "==", "!=", "<", ">", "="]


          def tokenise(text):
              # Split text into numbers, names and operators, skipping spaces. When
              # more than one operator matches at a position, take the longest, so
              # "<=" is one token, not "<" followed by "=".
              tokens = []
              i = 0
              while i < len(text):
                  c = text[i]
                  if c == " ":
                      i += 1
                  elif c.isdigit() or c.isalpha():
                      j = i
                      while j < len(text) and text[j].isalnum():
                          j += 1
                      tokens.append(text[i:j])
                      i = j
                  else:
                      found = None
                      for op in OPERATORS:
                          if found is None and text.startswith(op, i):
                              found = op
                      if found is None:
                          raise ValueError("unexpected " + c + " at position " + str(i))
                      tokens.append(found)
                      i += len(found)
              return tokens


          print(tokenise("age>=18 and fare!=0"))
        tests: |
          for _text, _want in [
              ("a<b", ["a", "<", "b"]),
              ("a<=b", ["a", "<=", "b"]),
              ("a >= 10", ["a", ">=", "10"]),
              ("x==y", ["x", "==", "y"]),
              ("x=y", ["x", "=", "y"]),
              ("x!=1", ["x", "!=", "1"]),
              ("p<=q>r", ["p", "<=", "q", ">", "r"]),
              ("a===b", ["a", "==", "=", "b"]),
              ("a<==b", ["a", "<=", "=", "b"]),
              ("", []),
          ]:
              try:
                  _got = tokenise(_text)
              except ValueError as _e:
                  raise AssertionError("tokenise(" + repr(_text) + ") should give " + repr(_want) + ", but it raised ValueError: " + str(_e))
              assert _got == _want, "tokenise(" + repr(_text) + ") should give " + repr(_want) + ", not " + repr(_got)
          try:
              tokenise("a ! b")
              raise AssertionError("A lone ! is not an operator, so tokenise('a ! b') should raise ValueError")
          except ValueError:
              pass
          assert output.strip() == "['age', '>=', '18', 'and', 'fare', '!=', '0']", "The program should print ['age', '>=', '18', 'and', 'fare', '!=', '0']"
