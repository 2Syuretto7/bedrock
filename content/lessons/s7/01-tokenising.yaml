                        tokens.append(found)
                        i += len(found)
                return tokens


            print(tokenise("age>=18 and fare!=0"))
        explanation: |
          The loop keeps the first operator in the list that matches, and the one-character operators come first, so `>` wins before `>=` is tried. Put the two-character operators first. Dropping the one-character operators makes `a<b` an error; advancing the cursor by one whatever matched reads the `=` of `>=` a second time; and sorting the list alphabetically still puts `<` before `<=`.
