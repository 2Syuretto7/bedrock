    - question:
        id: fix-pop-order
        type: code
        mode: find-bug
        system: s2
        prompt: |
          This stack machine should sum 5 + 4 + 3 + 2 + 1 with a loop. The program should print `{'n': 0, 'total': 15}`. It prints `{'n': 5, 'total': 0}`: the loop never runs. Find the fault and fix it.
        starter: |
          def run(code, env):
              # A stack machine. pc is the index of the next instruction.
              #   ("PUSH", v)            push v
              #   ("LOAD", name)         push env[name]
              #   ("STORE", name)        pop a value into env[name]
              #   ("ADD",) ("SUB",) ("MUL",) ("LT",)
              #                          pop the right operand, then the left one, and
              #                          push left + right, left - right, left * right
              #                          or left < right
              #   ("JUMP_IF_FALSE", t)   pop a value; if it is false, go to index t
              #   ("JUMP", t)            go to index t
              # Run until pc passes the end, then return env.
              stack = []
              pc = 0
              while pc < len(code):
                  ins = code[pc]
                  pc += 1
                  op = ins[0]
                  if op == "PUSH":
                      stack.append(ins[1])
                  elif op == "LOAD":
                      stack.append(env[ins[1]])
                  elif op == "STORE":
                      env[ins[1]] = stack.pop()
                  elif op == "JUMP_IF_FALSE":
                      if not stack.pop():
                          pc = ins[1]
                  elif op == "JUMP":
                      pc = ins[1]
                  else:
                      left = stack.pop()
                      right = stack.pop()
                      if op == "ADD":
                          stack.append(left + right)
                      elif op == "SUB":
                          stack.append(left - right)
                      elif op == "MUL":
                          stack.append(left * right)
                      else:
                          stack.append(left < right)
              return env


          # total = 0
          # while 0 < n:
          #     total = total + n
          #     n = n - 1
          code = [
              ("PUSH", 0), ("STORE", "total"),                         # 0, 1
              ("PUSH", 0), ("LOAD", "n"), ("LT",),                      # 2, 3, 4
              ("JUMP_IF_FALSE", 15),                                    # 5
              ("LOAD", "total"), ("LOAD", "n"), ("ADD",), ("STORE", "total"),  # 6 to 9
              ("LOAD", "n"), ("PUSH", 1), ("SUB",), ("STORE", "n"),     # 10 to 13
              ("JUMP", 2),                                              # 14
          ]
          print(run(code, {"n": 5}))
        solution: |
          def run(code, env):
              # A stack machine. pc is the index of the next instruction.
              #   ("PUSH", v)            push v
              #   ("LOAD", name)         push env[name]
              #   ("STORE", name)        pop a value into env[name]
              #   ("ADD",) ("SUB",) ("MUL",) ("LT",)
              #                          pop the right operand, then the left one, and
              #                          push left + right, left - right, left * right
              #                          or left < right
              #   ("JUMP_IF_FALSE", t)   pop a value; if it is false, go to index t
              #   ("JUMP", t)            go to index t
              # Run until pc passes the end, then return env.
              stack = []
              pc = 0
              while pc < len(code):
                  ins = code[pc]
                  pc += 1
                  op = ins[0]
                  if op == "PUSH":
                      stack.append(ins[1])
                  elif op == "LOAD":
                      stack.append(env[ins[1]])
                  elif op == "STORE":
                      env[ins[1]] = stack.pop()
                  elif op == "JUMP_IF_FALSE":
                      if not stack.pop():
                          pc = ins[1]
                  elif op == "JUMP":
                      pc = ins[1]
                  else:
                      right = stack.pop()
                      left = stack.pop()
                      if op == "ADD":
                          stack.append(left + right)
                      elif op == "SUB":
                          stack.append(left - right)
                      elif op == "MUL":
                          stack.append(left * right)
                      else:
                          stack.append(left < right)
              return env


