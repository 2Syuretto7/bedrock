          def peephole(code):
              # Straight-line stack code, with no jumps. Wherever two PUSH
              # instructions are followed by ADD, SUB or MUL, replace the three by a
              # single PUSH of the result, computed as left op right with the first
              # PUSH as the left operand. Keep going until no such window remains,
              # and return the new list. Leave every other instruction as it is.
              code = list(code)
              changed = True
              while changed:
                  changed = False
                  i = 0
                  while i + 2 < len(code):
                      a, b, op = code[i], code[i + 1], code[i + 2]
                      if a[0] == "PUSH" and b[0] == "PUSH" and op[0] in ("ADD", "SUB", "MUL"):
                          x, y = a[1], b[1]
                          value = x + y if op[0] == "ADD" else x - y if op[0] == "SUB" else x * y
                          code[i:i + 3] = [("PUSH", value)]
                          changed = True
                      else:
                          i += 1
              return code


