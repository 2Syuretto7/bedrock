concept: s7.how-python-runs-bytecode-and-the-interpreter-loop
minutes: 80
claim: You can follow Python from source to running program, through tokens, a syntax tree and bytecode in a code object, to the interpreter loop that fetches, decodes and executes one instruction at a time; compile an expression tree into code for a stack machine and run it with a program counter, a stack and jumps for loops and conditions; tidy bytecode with a peephole pass; inspect real bytecode with the dis module; and explain where an interpreter's time goes and why moving loops into built-ins or compiled libraries makes Python code faster.
recalls: [s7.syntax-trees-and-evaluation]
uses: [s7.tokenising, s7.grammars-and-parsing, s2.stacks-and-queues, s3.measuring-and-predicting-running-time, s5.profiling-programs, s0.functions, s0.loops]
leads: [s7.scope-closures-and-higher-order-functions, s7.memory-management-and-garbage-collection]
starter: |
  # Scratch space. dis shows the instructions Python compiled a function into.
  # The exact names differ between Python versions.
  import dis


  def fare(price, tip, qty):
      return (price + tip) * qty


  dis.dis(fare)
parts:
  recall:
    - text: |
        [[s7.syntax-trees-and-evaluation]] worked out a program's value by walking its tree, and ended by noting that walking is slow: every visit chases pointers and decides afresh what kind of node it has reached. Python avoids that by translating each tree once into a flat list of simple instructions. Three quick pulls first.
  puzzle:
    - text: |
        A stack machine evaluates `(a + b) * (c + d)` by pushing values onto a stack and letting each operator pop its two operands and push the result. The instructions are: push a, push b, add, push c, push d, add, multiply.

        **What is the largest number of values on the stack at any moment during the run?**
  intuition:
    - text: |
        A clerk at a ration shop totals bills with a pile of paper slips. Reading the instruction card from top to bottom, he either writes a number on a new slip and puts it on the pile, or takes the top two slips, combines them, and puts one slip with the result back. He never needs to look anywhere but the top of the pile, and the card never says "first work out the bracket": the order of the instructions already took care of that.

        Python's interpreter works the same way. The figure runs two small programs on a stack machine, one instruction per step. Watch the stack, and in the loop, watch the highlighted instruction jump backwards.
    - figure: stack-machine
      props: { program: fare, step: 0 }
    - text: |
        The tree has gone. What is left is a list of instructions, a **program counter** saying which one runs next, a stack for values in flight, and a table of variables. A loop is nothing special to the machine: an instruction that jumps back to an earlier index. This is the shape of Python's own interpreter, with more instructions, more types of value and much more care.
  derivation:
    - text: |
        **From tree to bytecode.** When Python runs a file, it tokenises it as in [[s7.tokenising]], parses it into a syntax tree, and then **compiles** the tree into **bytecode**: a list of instructions for an imaginary machine, stored with the constants and names it uses in a **code object**. Every function has one, reachable as `f.__code__`, and the `dis` module prints its instructions. Python saves compiled bytecode in `.pyc` files inside `__pycache__` folders, so a module that has not changed is not compiled again.

        Compiling an expression for a stack machine is a post-order walk of its tree: emit the code for the left operand, then the right operand, then the operator. Each operand's code leaves exactly one value on the stack, so by the time the operator runs, its two operands are the top two values. For `a - b` the code is push `a`, push `b`, subtract, and the subtract must pop `b` first, because it is on top, and then `a`.
    - question:
        id: derivation-compile
        type: choice
        system: s2
        prompt: |
          Which instruction sequence evaluates `x - y * 2` on a stack machine?
        options:
          - "LOAD x, LOAD y, PUSH 2, MUL, SUB"
          - "LOAD x, LOAD y, SUB, PUSH 2, MUL"
          - "SUB, LOAD x, MUL, LOAD y, PUSH 2"
          - "LOAD y, PUSH 2, MUL, LOAD x, SUB"
        answer: 0
        explanation: |
          The multiplication is below the subtraction in the tree, so its code comes first, inside the subtraction's right operand: x, then y * 2, then SUB. The last option computes the product first but then subtracts in the wrong order, giving y * 2 - x.
    - text: |
        **The interpreter loop.** At the heart of Python is a loop that does the same three things millions of times a second. It **fetches** the instruction at the program counter and moves the counter on; it **decodes** it, choosing what to do from the instruction's code, in effect one large branch; and it **executes** it, pushing, popping, looking up names or calling functions. Then it goes round again.

        Control flow turns into jumps. A `while` loop becomes the test's code, an instruction that pops the test's value and jumps past the loop if it is false, the body's code, and an unconditional jump back to the test. An `if` becomes a conditional jump over the branch not taken.

        Each function call gets a **frame**: its own program counter, its own value stack, and its own local variables, which Python keeps in an array indexed by position rather than a dictionary, so reading a local is fast. Calling a function pushes a new frame, and returning pops it, which is the call stack that a traceback prints, frame by frame.
    - question:
        id: derivation-count
        type: numeric
        system: s2
        prompt: |
          In the figure's loop program, two instructions set total to 0, each round runs the 4 test instructions, 8 body instructions and the jump back, and the final failed test runs 4 more. With n = 3, how many instructions run in all?
        answer: "45"
        explanation: |
          $2 + 3 \times (4 + 8 + 1) + 4 = 45$. The loop adds three numbers, but the machine runs 45 instructions to do it, which is where an interpreter's time goes.
    - text: |
        **Where the time goes.** Adding two numbers in compiled C is roughly one machine instruction. In Python, the same `+` costs a trip round the interpreter loop: fetch, decode, pop two objects, check what types they are, find the right addition for those types, create a new integer object for the result, push it, and adjust reference counts. Values are **boxed**: even an integer is an object with a type and a count of references, which [[s7.memory-management-and-garbage-collection]] will explain. Global names are looked up in dictionaries on every use.

        The cure is rarely to tune each instruction by hand. Recent versions of Python watch which types an instruction actually meets and replace it with a specialised version, an adding instruction that assumes two integers and checks only that, which removes much of the decoding work. Just-in-time compilers such as PyPy go further, turning hot loops into machine code. And the simplest speed-up is to run fewer Python instructions: `sum(prices)` loops in C, one Python instruction for the whole list, where a `for` loop runs several per element. Profiling, as in [[s5.profiling-programs]], tells you which loops deserve it.
    - question:
        id: derivation-steps
        type: order
        system: s2
        prompt: |
          Put the stages of running a Python file in order.
        steps:
          - "Read the source text from the file."
          - "Split it into tokens."
          - "Parse the tokens into a syntax tree."
          - "Compile the tree into bytecode in a code object."
          - "Run the bytecode in the interpreter loop, one instruction at a time."
        explanation: |
          Each stage consumes the previous stage's output. A cached `.pyc` file lets Python skip the middle three for a module that has not changed.
  formal:
    - text: |
        **Bytecode.** A list of simple instructions for a virtual machine, produced by compiling a syntax tree; Python keeps it in a code object with its constants and names, and `dis` lists it.

        **Stack machine.** Operands are pushed on a stack; an operator pops its operands, right one first, and pushes its result. Compiling an expression is a post-order walk: left code, right code, operator.

        **Interpreter loop.** Repeat: fetch the instruction at the program counter, advance the counter, decode it, execute it. Jumps set the counter; loops and conditionals compile to jumps.

        **Frame.** Per call: program counter, value stack and local variables.

        **Peephole optimisation.** A pass that looks at a few neighbouring instructions at a time and replaces a pattern with a cheaper one with the same effect, such as two constant pushes followed by an operator, which become one push of the result.

        **Costs.** Dispatch per instruction, boxed values, dynamic type checks and dictionary lookups; reduced by specialised instructions, just-in-time compilation and loops that run inside built-ins.
  drill:
    - text: Seconds each. Think like the machine.
    - question:
        id: drill-instructions
        type: numeric
        system: s1
        prompt: |
          How many stack-machine instructions does `a * b + c` compile to, one per name and one per operator?
        answer: "5"
        explanation: LOAD a, LOAD b, MUL, LOAD c, ADD.
    - question:
        id: drill-pc
        type: choice
        system: s1
        prompt: |
          What does the program counter hold?
        options:
          - "The position of the next instruction to run"
          - "The number of instructions run so far"
          - "The value on top of the stack"
          - "The number of the current line of source"
        answer: 0
        explanation: Fetching reads the instruction at the counter, and a jump works by setting it.
    - question:
        id: predict-varnames
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def fare(price, qty):
              total = price * qty
              return total
          print(fare.__code__.co_varnames)
        output: "('price', 'qty', 'total')"
        explanation: The code object lists the function's local variables, parameters first; the interpreter keeps their values in an array in that order.
    - question:
        id: predict-compile
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          code = compile("1 + 2", "<sum>", "eval")
          print(type(code).__name__)
        output: "code"
        explanation: compile turns source text into a code object holding bytecode, without running it.
  work:
    - text: Slower now. Build the compiler, the machine and a tidy-up pass.
    - question:
        id: write-compile
        type: code
        mode: write
        system: s2
        prompt: |
          Write `compile_expr`, which turns an expression tree into stack-machine instructions. The program should print seven instructions for `(price + tip) * qty - 10`, from `('LOAD', 'price')` to `('SUB',)`.
        starter: |
          def compile_expr(node):
              # Turn an expression tree into instructions for a stack machine:
              #   ("num", v)               ->  ("PUSH", v)
              #   ("var", name)            ->  ("LOAD", name)
              #   ("bin", op, left, right) ->  the left operand's code, the right
              #                                operand's code, then ("ADD",), ("SUB",),
              #                                ("MUL",) or ("DIV",) for + - * /
              # Return a list of instruction tuples.
              return []


          # (price + tip) * qty - 10
          tree = ("bin", "-",
                  ("bin", "*", ("bin", "+", ("var", "price"), ("var", "tip")), ("var", "qty")),
                  ("num", 10))
          for instruction in compile_expr(tree):
              print(instruction)
        solution: |
          def compile_expr(node):
              # Turn an expression tree into instructions for a stack machine:
              #   ("num", v)               ->  ("PUSH", v)
              #   ("var", name)            ->  ("LOAD", name)
              #   ("bin", op, left, right) ->  the left operand's code, the right
              #                                operand's code, then ("ADD",), ("SUB",),
              #                                ("MUL",) or ("DIV",) for + - * /
              # Return a list of instruction tuples.
              kind = node[0]
              if kind == "num":
                  return [("PUSH", node[1])]
              if kind == "var":
                  return [("LOAD", node[1])]
              names = {"+": "ADD", "-": "SUB", "*": "MUL", "/": "DIV"}
              return compile_expr(node[2]) + compile_expr(node[3]) + [(names[node[1]],)]


          # (price + tip) * qty - 10
          tree = ("bin", "-",
                  ("bin", "*", ("bin", "+", ("var", "price"), ("var", "tip")), ("var", "qty")),
                  ("num", 10))
          for instruction in compile_expr(tree):
              print(instruction)
        tests: |
          def _run(_code, _env):
              _st = []
              for _ins in _code:
                  if _ins[0] == "PUSH":
                      _st.append(_ins[1])
                  elif _ins[0] == "LOAD":
                      if not isinstance(_ins[1], str) or _ins[1] not in _env:
                          raise AssertionError("LOAD should name a variable, but got " + repr(_ins))
                      _st.append(_env[_ins[1]])
                  else:
                      _b = _st.pop()
                      _a = _st.pop()
                      _st.append({"ADD": _a + _b, "SUB": _a - _b, "MUL": _a * _b, "DIV": _a / _b if _b else None}[_ins[0]])
              return _st


          assert compile_expr(("num", 7)) == [("PUSH", 7)], "A number should compile to a single PUSH"
          assert compile_expr(("var", "x")) == [("LOAD", "x")], "A variable should compile to a single LOAD"
          _want = [("PUSH", 8), ("PUSH", 3), ("SUB",)]
          _got = compile_expr(("bin", "-", ("num", 8), ("num", 3)))
          assert _got == _want, "8 - 3 should compile to " + repr(_want) + ", not " + repr(_got)
          _env = {"a": 7, "b": 2, "c": 5, "d": 4}
          for _tree, _value in [
              (("bin", "-", ("var", "a"), ("var", "b")), 5),
              (("bin", "/", ("var", "c"), ("var", "b")), 2.5),
              (("bin", "-", ("bin", "-", ("var", "a"), ("var", "b")), ("var", "c")), 0),
              (("bin", "-", ("var", "a"), ("bin", "-", ("var", "b"), ("var", "c"))), 10),
              (("bin", "*", ("bin", "+", ("var", "a"), ("num", 1)), ("bin", "-", ("var", "d"), ("var", "b"))), 16),
          ]:
              _code = compile_expr(_tree)
              try:
                  _st = _run(_code, _env)
              except IndexError:
                  raise AssertionError("The code for " + repr(_tree) + " pops from an empty stack: " + repr(_code))
              assert _st == [_value], "Running the code for " + repr(_tree) + " should leave just " + repr(_value) + " on the stack, not " + repr(_st)
          assert output.splitlines()[0] == "('LOAD', 'price')", "The program's first line should be ('LOAD', 'price')"
          assert len(output.splitlines()) == 7, "The program should print seven instructions"
