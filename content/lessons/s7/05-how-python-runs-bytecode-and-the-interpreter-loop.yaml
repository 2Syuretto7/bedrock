    - text: |
        3. The first sum is folded down to one value before c and d arrive, so the stack never holds more than that value plus the two operands of the second sum. The order of the instructions, fixed by the tree, is what keeps the stack small.

        The design you have seen is not special to Python. Java compiles to bytecode for its virtual machine, C# to bytecode for .NET, and the JavaScript engine in every browser starts with a bytecode interpreter before it compiles the functions that run most often to machine code. The pattern repeats because it divides the work cleanly: a compiler that runs once and can afford to think, and a small loop that runs all the time and must be quick. When you next see a program that is slow in a loop and fast in a library call, the explanation is the one this lesson gave: the loop pays for every instruction it dispatches, and the library call dispatches one.

        Bytecode refers to variables by name or by position in a frame, but which variable does a name mean? A function can read names from the function around it, from the module, or from the built-ins, and an inner function can keep using a variable after the outer function has returned. [[s7.scope-closures-and-higher-order-functions]] sorts out those rules, and shows what they make possible.
