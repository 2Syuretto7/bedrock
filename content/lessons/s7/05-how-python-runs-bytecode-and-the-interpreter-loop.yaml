          ]
          print(run(code, {"n": 5}))
        tests: |
          def _try(_code, _env):
              try:
                  return run(_code, _env)
              except (IndexError, KeyError) as _e:
                  raise AssertionError("Running " + repr(_code) + " failed with " + type(_e).__name__ + "; the stack or the jumps are off")


          _got = _try([("PUSH", 10), ("PUSH", 3), ("SUB",), ("STORE", "d")], {})
          assert _got == {"d": 7}, "10 - 3 should store 7, not " + repr(_got)
          _got = _try([("PUSH", 2), ("PUSH", 5), ("LT",), ("STORE", "t"), ("PUSH", 5), ("PUSH", 2), ("LT",), ("STORE", "f"), ("PUSH", 4), ("PUSH", 4), ("LT",), ("STORE", "e")], {})
          assert _got == {"t": True, "f": False, "e": False}, "2 < 5, 5 < 2 and 4 < 4 should store True, False and False, not " + repr(_got)
