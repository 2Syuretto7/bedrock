    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          In the puzzle, what is the largest number of values on the stack while the machine evaluates `(a + b) * (c + d)`?
        answer: "3"
        explanation: |
          After `a + b` the stack holds one value. Pushing c and d makes three, the maximum; then the addition leaves two and the multiplication one. A compiler works out this maximum for each code object, so the frame can be given exactly enough room.
    - question:
        id: work-speed
        type: choice
        system: s2
        prompt: |
          Sneha's Python function adds up 1 crore prices with a `for` loop and takes about half a second. What change is most likely to make it several times faster, staying in Python?
        options:
          - "Replace the loop with sum(prices), so the loop runs inside a built-in written in C."
          - "Rename the variables to shorter names so they are looked up faster."
          - "Put the loop body on one line."
          - "Add type hints to the loop variable."
        answer: 0
        explanation: |
          Each turn of a Python loop costs several trips round the interpreter loop; `sum` makes one call and loops in C. Name length and line layout do not change the bytecode's work, and type hints are not checked or used by the interpreter when it runs.
