        prompt: |
          Rohan must validate millions of user-supplied search filters against patterns that other users write. Which approach keeps every check fast whatever the patterns and inputs?
        options:
          - "An engine that compiles each pattern to an automaton and matches in time linear in the input, refusing features such as backreferences."
          - "Python's re module, with a rule that patterns must be short."
          - "Python's re module, retrying a match that takes too long."
          - "Trying each pattern on a few sample inputs before accepting it."
        answer: 0
        explanation: |
          Only an automaton-based engine guarantees linear time for every pattern and input. Short patterns can still be exponential, as `(a+)+$` shows; retrying repeats the slow work; and a few samples will not find the input an attacker picks.
  connections:
    - text: |
        5,24,288, which is $2^{19}$. Each of the nineteen gaps between the a's is either a cut or not, so every extra a doubles the ways, and a backtracking engine that tries them all before failing slows down exponentially. An automaton reads the twenty-one characters once and says no.

        Regular expressions describe tokens perfectly: digits, names, operators, plate numbers. But a finite automaton cannot count, so it cannot check that every opening bracket is closed, and programs are full of nesting: brackets in expressions, blocks inside blocks, calls inside calls. [[s7.grammars-and-parsing]] adds the missing ingredient, rules that may refer to themselves, and builds a parser that turns a list of tokens into a tree.
