        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          In the puzzle, a run of twenty a's is cut into one or more non-empty pieces. How many ways are there?
        answer: "524288"
        explanation: |
          Between the twenty a's there are nineteen gaps, and each cut is a choice of which gaps to cut at: $2^{19} = 5{,}24{,}288$ ways. Each extra a doubles the count, which is why a backtracking engine that tries them all slows down exponentially.
