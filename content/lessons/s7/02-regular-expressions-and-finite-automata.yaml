    - question:
        id: write-plate
        type: code
        mode: write
        system: s2
        prompt: |
          Write `PATTERN` and `normalise`, which check Indian vehicle registration numbers and remove their separators. The program should print six lines: the first three plates normalised, such as `KA 01 AB 1234 -> KA01AB1234`, and `None` for the other three.
        starter: |
          import re

          # An Indian registration number: two capital letters for the state, two
          # digits for the district, one to three capital letters for the series and
          # four digits for the vehicle. Each gap between the four parts may hold one
          # space, one hyphen or nothing.
          PATTERN = r""


          def normalise(plate):
              # Return the four parts joined with no separators, such as
              # "KA01AB1234", if the whole of plate matches PATTERN; otherwise None.
              return None


          for plate in ["KA 01 AB 1234", "MH12DE1433", "TN-22-K-0007", "KA 1 AB 1234", "MH12DE14335", "ka 01 ab 1234"]:
              print(plate, "->", normalise(plate))
        solution: |
          import re

          # An Indian registration number: two capital letters for the state, two
          # digits for the district, one to three capital letters for the series and
          # four digits for the vehicle. Each gap between the four parts may hold one
          # space, one hyphen or nothing.
          PATTERN = r"([A-Z]{2})[ -]?([0-9]{2})[ -]?([A-Z]{1,3})[ -]?([0-9]{4})"


          def normalise(plate):
              # Return the four parts joined with no separators, such as
              # "KA01AB1234", if the whole of plate matches PATTERN; otherwise None.
              m = re.fullmatch(PATTERN, plate)
              if m is None:
                  return None
              return "".join(m.groups())


          for plate in ["KA 01 AB 1234", "MH12DE1433", "TN-22-K-0007", "KA 1 AB 1234", "MH12DE14335", "ka 01 ab 1234"]:
              print(plate, "->", normalise(plate))
        tests: |
          for _p, _want in [
              ("KA01AB1234", "KA01AB1234"),
              ("KA 01 AB 1234", "KA01AB1234"),
              ("KA-01-AB-1234", "KA01AB1234"),
              ("KA 01-AB1234", "KA01AB1234"),
              ("DL 08 CAF 5030", "DL08CAF5030"),
              ("TN22K0007", "TN22K0007"),
              ("KA  01 AB 1234", None),
              ("KA 01 AB 123", None),
              ("KA 01 AB 12345", None),
              ("KA 01 ABCD 1234", None),
              ("K 01 AB 1234", None),
              ("KA 01 AB 1234 ", None),
              (" KA 01 AB 1234", None),
              ("KA 01 AB", None),
              ("KA 01 1234", None),
              ("ka 01 ab 1234", None),
              ("KA_01_AB_1234", None),
          ]:
              _got = normalise(_p)
              assert _got == _want, "normalise(" + repr(_p) + ") should give " + repr(_want) + ", not " + repr(_got)
          assert output.splitlines()[0] == "KA 01 AB 1234 -> KA01AB1234", "The program's first line should be KA 01 AB 1234 -> KA01AB1234"
