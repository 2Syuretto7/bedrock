                if c.isdigit():
                    return "digit"
                if c == ".":
                    return "dot"
                return "other"


            TABLE = {
                ("start", "digit"): "int",
                ("int", "digit"): "int",
                ("int", "dot"): "dot",
                ("dot", "digit"): "frac",
