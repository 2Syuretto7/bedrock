        explanation: |
          The inner loop replaces `nxt` with each state's moves in turn, so only the last state's moves survive, and the automaton silently commits to one guess. Collect the union: `nxt = nxt | trans.get((s, c), set())`. Keeping the old states as well never forgets a state, so words accepted midway stay accepted; requiring every state to accept rejects nearly everything; and accepting if an accepting state was reached at any point accepts words whose third-from-last letter is a b.
