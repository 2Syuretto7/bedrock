    - question:
        id: fix-checked
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `checked` should reject arguments and results whose class does not match the annotation, while accepting instances of subclasses. The program should print three lines: `Train 450.0`, `Express 750.0` and `Train rejected: km should be int, not str`. Instead, the second line rejects the Express. Find the fault and fix it.
        starter: |
          def checked(f):
              # Wrap f, whose parameters are all annotated with classes, so that each
              # call checks the positional arguments and the result against the
              # annotations and raises TypeError on a mismatch. A value matches a
              # class if it is an instance of that class or of any subclass of it.
              hints = f.__annotations__
              params = [name for name in hints if name != "return"]

              def wrapper(*args):
                  for name, value in zip(params, args):
                      if type(value) != hints[name]:
