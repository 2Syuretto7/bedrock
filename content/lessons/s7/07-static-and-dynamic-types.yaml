        solution: |
          def to_number(v):
              # How a weakly typed language turns a value into a number for "-":
              # an int stays as it is; a string of digits, perhaps with a leading
              # "-", becomes that int; the empty string becomes 0; any other string
              # becomes None, standing for "not a number".
              if isinstance(v, int):
                  return v
              if v == "":
                  return 0
              digits = v[1:] if v.startswith("-") else v
              if digits.isdigit():
                  return int(v)
              return None


          def weak_add(a, b):
              # "+": if either value is a string, join both as strings; otherwise add
              # the numbers.
              if isinstance(a, str) or isinstance(b, str):
                  return str(a) + str(b)
              return a + b


          def weak_sub(a, b):
              # "-": convert both values with to_number and subtract; if either is
              # None, the result is None.
              x = to_number(a)
              y = to_number(b)
              if x is None or y is None:
                  return None
              return x - y


          print(weak_sub(weak_add("1", 2), 1))
          print(weak_add(weak_sub("5", 2), "0"))
          print(weak_sub("ten", 1), weak_sub("", 1))
        tests: |
