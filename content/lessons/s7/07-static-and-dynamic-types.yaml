concept: s7.static-and-dynamic-types
minutes: 80
claim: You can say what a type is and what a type error is; tell static checking, before a program runs, from dynamic checking, as each operation runs, and strong typing, which refuses a mismatch, from weak typing, which converts and carries on; place Python, JavaScript, C and Rust on those two axes; write a static checker that gives every node of a syntax tree a type from its children; explain why a sound checker must reject some programs that would never fail; and use isinstance, type hints and a checker such as mypy, knowing what each one checks and when.
recalls: [s7.scope-closures-and-higher-order-functions]
uses: [s7.syntax-trees-and-evaluation, s7.how-python-runs-bytecode-and-the-interpreter-loop, s1.type-hints-and-dataclasses, s1.classes-and-objects, s4.designing-with-types-and-invariants, s6.what-a-test-can-prove]
leads: [s7.memory-management-and-garbage-collection]
starter: |
  # Scratch space. Python checks a type only when the line runs.
  def total(fare, seats):
      return fare * seats


  print(total(450, 3))
  print(total("450", 3))
parts:
  recall:
    - text: |
        [[s7.scope-closures-and-higher-order-functions]] passed functions around as values and wrapped them in decorators, and nothing in Python checked in advance that the values passed in were the kind each function expected. This lesson asks what a type is, when a language checks it, and what it does when the check fails. Three quick pulls first.
  puzzle:
    - text: |
        In JavaScript, `+` joins two values as text when either of them is a string, and `-` always converts both of its values to numbers before subtracting. A web form adds `"1" + 2` and then subtracts 1, all in one expression: `"1" + 2 - 1`.

        **What number does the expression give?**
  intuition:
    - text: |
        At a railway reservation counter, the clerk reads your form before printing anything. An age written as "twenty-five" in the box for a number, or a journey date of 31 November, is handed back at the window, before any ticket exists. Other mistakes are found only on the train, when the ticket examiner compares the name on the ticket with your identity card. Both catch errors; they differ in **when**. A third kind of clerk is worse than either: one who, seeing "twenty-five" in the age box, quietly writes 0 and prints the ticket, and the mistake surfaces weeks later as a child's concession nobody asked for.

        Programming languages make the same choices about **types**. The figure takes three small expressions and treats each two ways: checked before running, as the clerk does, and simply run with real values, as Python does. Try each expression both ways.
    - figure: type-check
      props: { program: ok, mode: check }
    - text: |
        The checker works on the syntax tree, bottom up: a leaf's type is known, and each operation's type follows from its children's, the same walk as an evaluator but with types in place of values. If some node has no type, the program is rejected before it runs. Python instead checks each operation as it happens. The third expression shows the price of checking early: the checker rejects it, although the run with three seats works perfectly, while the run with zero seats does not fail at that line at all.
  derivation:
    - text: |
        **What a type is.** A type is a set of values together with the operations that make sense on them. Integers can be added, multiplied and compared; strings can be joined, sliced and searched. A **type error** is an operation applied to values it was not meant for: adding a string to a number, calling a number as if it were a function, asking for the length of a date. Every language catches some type errors. The questions that separate languages are **when** the check happens and **what** the language does when it finds a mismatch.

        **Static and dynamic.** In a **statically** typed language, such as Java, C, Go, Rust or TypeScript, types belong to variables and expressions, and a checker assigns and verifies them before the program runs, usually as part of compiling it. In a **dynamically** typed language, such as Python, JavaScript or Ruby, types belong to values. A Python variable is a name that can refer to any value, the value carries its type with it, and `a + b` asks at the moment it runs what `a` and `b` actually are. That question is part of the work the interpreter loop of [[s7.how-python-runs-bytecode-and-the-interpreter-loop]] does on every addition, one reason Python is slower than a language that settled the types before it started.
    - question:
        id: derivation-static
        type: choice
        system: s2
        prompt: |
          A strict checker, like Rust's, requires both branches of a conditional to have the same type. Which line does it reject, though Python runs it without any error?
        options:
          - "seats = 3; label = seats if seats > 0 else 'sold out'; print(label)"
          - "print(len(450))"
          - "print('Rs ' + 450)"
          - "print(450 * 3 + 40)"
        answer: 0
        explanation: |
          With seats at 3 only the int branch runs, so Python prints 3; the checker sees an int branch and a str branch and rejects the line. Python raises TypeError on the second and third lines when they run, and the last is fine for both.
    - text: |
        **Why a checker must say no to some good programs.** A checker is **sound** if every program it accepts is free of the errors it looks for. To be sound and still finish in reasonable time, it has to judge a program without running it, and in general no method can tell which branch a program will take on every possible input. So a sound checker reasons about every path, including paths that never actually run, and rejects some programs that would never fail: the conditional above is one. That is the bargain of static typing. In return for writing annotations and occasionally rephrasing a correct program, you get errors reported at the line that causes them, before the program reaches a user, plus documentation that cannot go out of date. A test, as [[s6.what-a-test-can-prove]] put it, checks particular runs for any kind of mistake; a type checker checks every run, but for one kind of mistake only.
    - question:
        id: derivation-runs
        type: numeric
        system: s2
        prompt: |
          The checker rejects `fare if seats > 0 else 'sold out'`, where fare is an int. If seats can be any whole number from 0 to 9, for how many of those ten values does the expression give an int?
        answer: "9"
        explanation: |
          Every seats value from 1 to 9 takes the first branch and gives fare, an int; only 0 gives the string. The checker rejects all ten runs because one of them has the wrong type.
    - text: |
        **Strong and weak.** A separate question is what happens when an operation does meet values of the wrong type. A **strongly** typed language refuses: Python raises `TypeError` for `"Rs " + 450` instead of guessing what you meant. A **weakly** typed language converts, or **coerces**, one value to fit and carries on: in JavaScript `"1" + 2` is the string `"12"` and `"5" - 2` is the number 3, and C will treat a character as a small integer without complaint. Coercion saves keystrokes and costs clarity, because a wrong value produced by a guess travels on through the program and surfaces far from its cause, like the clerk's quiet 0.

        The two questions are independent, which gives four combinations. Python is dynamic and strong. JavaScript is dynamic and weak. C is static and fairly weak. Rust and Haskell are static and strong. "Strong" and "weak" are looser terms than "static" and "dynamic", and languages sit at different points between them, but asking both questions separately clears up most arguments about which language is "more typed".
    - question:
        id: derivation-quadrant
        type: choice
        system: s2
        prompt: |
          Python refuses `'Rs ' + 450` only when the line runs, and then raises TypeError rather than converting either value. Which description fits Python?
        options:
          - "Dynamic and strong"
          - "Static and strong"
          - "Dynamic and weak"
          - "Static and weak"
        answer: 0
        explanation: |
          The check happens at run time, which makes it dynamic, and the mismatch is refused rather than coerced, which makes it strong.
    - text: |
        **Classes, ducks and hints.** In Python a class is a type, and `isinstance(x, Train)` is true when `x` was made from `Train` or from any subclass of it, as in [[s1.classes-and-objects]]: an Express is a Train. Comparing `type(x) == Train` exactly is almost always a mistake, because it rejects subclasses. Most Python code checks nothing at all, though. It calls `train.rate` and works with any object that has a `rate`, a habit called **duck typing**: if it walks like a duck and quacks like a duck, treat it as a duck.

        The type hints of [[s1.type-hints-and-dataclasses]] add a static layer on top. Python itself ignores them when running, apart from storing them in `__annotations__`; separate checkers such as mypy and pyright read them and check the program before it runs. This is **gradual typing**: annotated code is checked, and code without annotations is treated as `Any`, a type that fits everything, so a project can add types one module at a time. A decorator can also enforce the hints while the program runs, by checking every call with `isinstance`, which catches mismatches as they happen at the cost of a check on every call. The deepest use of types is the one from [[s4.designing-with-types-and-invariants]]: shape the types so that a wrong state cannot even be written down, and the checker then enforces your design for free.
    - question:
        id: derivation-pipeline
        type: order
        system: s2
        prompt: |
          Put in order what happens to a Python file with type hints, from a pull request whose CI runs mypy to the code running in production.
        steps:
          - "mypy parses the file into a syntax tree."
          - "mypy gives each expression a type from the annotations and the types of its parts."
          - "mypy reports any mismatch, and the CI job fails until it is fixed."
          - "Python compiles the merged file to bytecode, storing the hints but not checking them."
          - "Each operation checks the types of the actual values as it runs."
        explanation: |
          The static check happens first, on the tree, before any code runs. Python then compiles and runs the program as usual, and its own dynamic checks still guard every operation.
  formal:
    - text: |
        **Type.** A set of values with the operations defined on them. A type error applies an operation to values outside its domain.

        **Static typing.** Types belong to expressions and variables and are checked before running, by giving each node of the syntax tree a type computed from its children's.

        **Dynamic typing.** Types belong to values and are checked by each operation as it runs.

        **Strong and weak typing.** Whether a mismatch is refused with an error or coerced into some value of the expected type.

        **Soundness.** A checker is sound if no program it accepts has a type error at run time; a sound checker must reject some programs that would never fail.

        **Gradual typing.** Annotations are checked where present, and unannotated code has type `Any`; in Python, `isinstance` checks a class including its subclasses.
  drill:
    - text: Seconds each. Ask when the check happens, and what it does with a mismatch.
    - question:
        id: drill-when
        type: choice
        system: s1
        prompt: |
          A Java compiler refuses to build a program because a method that should return an int returns a String on one path. What kind of checking is this?
        options:
          - "Static checking"
          - "Dynamic checking"
          - "Weak typing"
          - "Duck typing"
        answer: 0
        explanation: The error is found before the program runs, by checking types on every path.
    - question:
        id: drill-coerce
        type: choice
        system: s1
        prompt: |
          In JavaScript, `"5" * 2` gives 10. What does this show?
        options:
          - "Weak typing: the string is converted to a number"
          - "Static typing: the types were checked before running"
          - "Strong typing: the mismatch was refused"
          - "A type error: the expression has no value"
        answer: 0
        explanation: The language converts the string to fit the operation instead of refusing it.
    - question:
        id: predict-hint
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def double(n: int) -> int:
              return n * 2


          print(double("ab"))
        output: "abab"
        explanation: Python stores the hints but does not check them when running, and a str times 2 repeats it.
    - question:
        id: predict-bool
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(isinstance(True, int), type(True) == int)
        output: "True False"
        explanation: bool is a subclass of int, so isinstance accepts it, but its exact type is bool, not int.
  work:
    - text: Slower now. Each answer checks types, before running, while running, or by guessing.
    - question:
        id: write-type-checker
        type: code
        mode: write
        system: s2
        prompt: |
          Write `type_of`, a static type checker for a tiny language whose programs are trees of tuples. The program should print four lines: `fare * seats + 40 -> int`, then two lines that report a TypeError, then `'Rs ' + name -> str`.
        starter: |
          def type_of(node, env):
              # A type checker for a tiny language. Types are "int", "str" and "bool".
              #   ("num", 4) is int, ("str", "Rs") is str, ("bool", True) is bool
              #   ("var", name) has the type env[name]
              #   ("bin", op, a, b): "+" takes two ints giving int, or two strs giving
              #       str; "-" and "*" take two ints giving int
              #   ("cmp", op, a, b): two ints giving bool
              #   ("if", test, then, other): test must be bool, and both branches must
              #       have the same type, which is the type of the whole expression
              # Anything else raises TypeError with a message saying what is wrong.
              return "int"


          env = {"fare": "int", "seats": "int", "name": "str"}
          programs = {
              "fare * seats + 40": ("bin", "+", ("bin", "*", ("var", "fare"), ("var", "seats")), ("num", 40)),
              "name + fare": ("bin", "+", ("var", "name"), ("var", "fare")),
              "fare if seats > 0 else 'sold out'": ("if", ("cmp", ">", ("var", "seats"), ("num", 0)), ("var", "fare"), ("str", "sold out")),
              "'Rs ' + name": ("bin", "+", ("str", "Rs "), ("var", "name")),
          }
          for text, tree in programs.items():
              try:
                  print(text, "->", type_of(tree, env))
              except TypeError as error:
                  print(text, "-> TypeError:", error)
        solution: |
          def type_of(node, env):
              # A type checker for a tiny language. Types are "int", "str" and "bool".
              #   ("num", 4) is int, ("str", "Rs") is str, ("bool", True) is bool
              #   ("var", name) has the type env[name]
              #   ("bin", op, a, b): "+" takes two ints giving int, or two strs giving
              #       str; "-" and "*" take two ints giving int
              #   ("cmp", op, a, b): two ints giving bool
              #   ("if", test, then, other): test must be bool, and both branches must
              #       have the same type, which is the type of the whole expression
              # Anything else raises TypeError with a message saying what is wrong.
              kind = node[0]
              if kind == "num":
                  return "int"
              if kind == "str":
                  return "str"
              if kind == "bool":
                  return "bool"
              if kind == "var":
                  return env[node[1]]
              if kind == "if":
                  if type_of(node[1], env) != "bool":
                      raise TypeError("the test of an if must be bool")
                  a = type_of(node[2], env)
                  b = type_of(node[3], env)
                  if a != b:
                      raise TypeError("the branches of an if have types " + a + " and " + b)
                  return a
              op = node[1]
              a = type_of(node[2], env)
              b = type_of(node[3], env)
              if kind == "cmp":
                  if a == "int" and b == "int":
                      return "bool"
                  raise TypeError("cannot compare " + a + " with " + b)
              if a == "int" and b == "int":
                  return "int"
              if op == "+" and a == "str" and b == "str":
                  return "str"
              raise TypeError("cannot apply " + op + " to " + a + " and " + b)


          env = {"fare": "int", "seats": "int", "name": "str"}
          programs = {
              "fare * seats + 40": ("bin", "+", ("bin", "*", ("var", "fare"), ("var", "seats")), ("num", 40)),
              "name + fare": ("bin", "+", ("var", "name"), ("var", "fare")),
              "fare if seats > 0 else 'sold out'": ("if", ("cmp", ">", ("var", "seats"), ("num", 0)), ("var", "fare"), ("str", "sold out")),
              "'Rs ' + name": ("bin", "+", ("str", "Rs "), ("var", "name")),
          }
          for text, tree in programs.items():
              try:
                  print(text, "->", type_of(tree, env))
              except TypeError as error:
                  print(text, "-> TypeError:", error)
        tests: |
