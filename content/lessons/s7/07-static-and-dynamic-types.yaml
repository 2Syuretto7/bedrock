          ]:
              try:
                  _got = type_of(_tree, _env)
              except TypeError as _e:
                  raise AssertionError("type_of(" + repr(_tree) + ") should be " + _want + ", but it raised TypeError: " + str(_e))
              assert _got == _want, "type_of(" + repr(_tree) + ") should be " + _want + ", not " + repr(_got)
          for _tree in [
              ("bin", "+", ("var", "s"), ("num", 1)),
