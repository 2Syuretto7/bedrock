        explanation: |
          `to_number` keeps ints, turns the empty string into 0 and a string of digits, with an optional leading minus, into an int, and gives None for anything else. `weak_add` joins as strings if either side is a string, and `weak_sub` converts both sides. Converting both sides for `+` turns `"1" + 2` into 3 instead of `"12"`; treating the empty string as not a number breaks `"" - 1`; and checking `isdigit` on the whole string misses negative numbers.
