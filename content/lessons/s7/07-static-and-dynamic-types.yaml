        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          In JavaScript, `+` joins when either value is a string and `-` converts both values to numbers. What number does `"1" + 2 - 1` give?
        answer: "11"
        explanation: |
          The expression runs left to right. `"1" + 2` joins to the string `"12"`, and `"12" - 1` converts it back to the number 12 and subtracts, giving 11, not the 2 that the digits suggest.
    - question:
        id: work-boundary
        type: choice
        system: s2
        prompt: |
          Priya's team runs a large Python payments service. Now and then an amount arrives from a web form as the string "500", is multiplied by a quantity of 2, and a customer is charged for "500500". What change catches this kind of mistake earliest and with least disruption?
        options:
          - "Convert form input to int where it enters the service, annotate the payment functions, and run mypy in CI"
          - "Rewrite the service in a statically typed language"
          - "Add more unit tests that call the payment functions with int amounts"
          - "Catch every TypeError in the payment code and charge 0 instead"
        answer: 0
        explanation: |
          Converting at the boundary means the rest of the code only ever sees ints, and the annotations let mypy flag any path that passes a str, before the code ships. A rewrite costs months; tests that only use ints never meet the string; and turning errors into a charge of 0 is weak typing at its worst.
  connections:
    - text: |
        11. The `+` comes first and meets a string, so it joins: `"12"`. The `-` then converts that string back into the number 12 and subtracts 1. Two guesses in one line, each reasonable on its own, give an answer nobody would have written down.

        Because Python's values carry their types, every value is an object somewhere in memory with a header saying what it is, and a program makes and abandons such objects by the million. Nobody writes code to free them, so something must decide when an object can no longer be reached and give its memory back. [[s7.memory-management-and-garbage-collection]] finishes the cluster by looking at how that is done.
