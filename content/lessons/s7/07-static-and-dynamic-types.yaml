              except TypeError:
                  continue
              raise AssertionError("type_of(" + repr(_tree) + ") should raise TypeError, not give " + repr(_got))
          assert output.splitlines()[0] == "fare * seats + 40 -> int", "The program's first line should be fare * seats + 40 -> int"
          assert output.splitlines()[3] == "'Rs ' + name -> str", "The program's last line should be 'Rs ' + name -> str"
