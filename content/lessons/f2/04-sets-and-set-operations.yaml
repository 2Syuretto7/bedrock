concept: f2.sets-and-set-operations
minutes: 95
claim: You can read and write sets in roster and set-builder notation, decide membership and inclusion, combine sets with union, intersection, difference and product, see every law of sets as a law of Boolean algebra about membership, and count the members of a union without counting anything twice.
recalls: [f2.quantifiers-and-their-negation, f1.functions-as-machines]
uses: [f2.propositions-and-connectives, f2.boolean-algebra, f0.whole-numbers-and-place-value, f0.fractions-decimals-and-percentages, f0.negative-numbers, f0.powers-and-roots, f0.powers-of-two, f1.variables-and-expressions, f1.linear-equations, f1.inequalities, f1.coordinates-lines-and-slope, f1.exponents-and-exponential-growth, s0.booleans-and-conditionals, s0.loops, s0.functions, s0.lists-and-tuples, s0.dictionaries-and-sets, s0.reading-errors-and-debugging]
leads: [f2.relations-and-functions-between-sets, f3.inclusion-and-exclusion]
starter: |
  # Scratch space. Python's sets obey the mathematics of this lesson.
  a = {2, 4, 6, 8, 10, 12}
  b = {3, 6, 9, 12}
  print(sorted(a | b))
  print(sorted(a & b))
  print(sorted(a - b))
parts:
  recall:
    - text: |
        [[f1.functions-as-machines]] borrowed a little notation for collections, curly brackets and the sign $\in$, and promised that sets would be built properly later. [[f2.quantifiers-and-their-negation]] then used the same notation for the domain of every quantifier, on trust. Today sets get their own language, and you will find that you already know its laws. Three quick pulls first.
  puzzle:
    - text: |
        A spam filter is being built from 1,000 emails. Someone has counted for you:

        - 320 of the emails contain the word "free",
        - 210 contain the word "winner",
        - 90 contain both words.

        **How many emails contain neither word?**

        The first instinct is to add: 320 with "free" and 210 with "winner" make 530 with at least one of the words, so 470 have neither. Try it on a tiny case before trusting it. Suppose there were five emails, three containing "free", three containing "winner", and two containing both. Adding gives six emails with at least one of the words. Out of five.

        The sum has counted something twice. To say exactly what, and to fix it without ever fumbling again, you need to be able to talk about a **collection** as a single object: the collection of emails containing "free", the collection containing "winner", the collection in both, the collection in at least one. You need names for these, and rules for how their sizes are related.

        This is not only about emails. "The real numbers", "the solutions of this equation", "the points of this line", "the training examples", "the words the model knows": every one of these is a collection treated as a single thing. Mathematics is written in the language of such collections. The language is small, and it is worth learning exactly.
  intuition:
    - text: |
        A **set** is a collection of things in which exactly one question can be asked of any thing: **are you in it, or not?**

        Nothing else about the collection is recorded. In particular:

        - **There is no order.** A set has no first member and no last.
        - **There are no repeats.** A thing is in, or it is not. It cannot be in twice.

        Compare the collections you know from Python. A list remembers order and repeats: `[1, 2, 2]` and `[2, 1]` are different lists. A set forgets both: `{1, 2, 2}` and `{2, 1}` are the same set, the one whose members are 1 and 2. You met this as a convenience for removing duplicates. It is in fact the oldest and simplest idea in mathematics, and lists, pairs, functions and numbers themselves can all be built from it.

        A good picture is a fence drawn in a field. Things are inside the fence or outside it. Two fences divide the field into four regions: inside both, inside the first only, inside the second only, and outside both. Every question about two sets is a question about those four regions.

        In the figure below the field holds the numbers 1 to 12. $A$ fences in the multiples of one number and $B$ the multiples of another. Change the two numbers. Watch which numbers sit in the overlap, and find a pair of choices for which the overlap is a single number, and a pair for which $B$ lies entirely inside $A$.
    - figure: venn
      props: { a: 2, b: 3 }
    - text: |
        Now look at the puzzle through the fences. The 320 emails with "free" are everything inside the first fence, **including the overlap**. The 210 with "winner" are everything inside the second fence, again including the overlap. Add them and the overlap, the 90 emails with both words, has been counted twice. That is the whole mistake, and the cure is to take the overlap away once.
  derivation:
    - text: |
        **Members.** The things in a set are its **members** or **elements**. "$x$ is a member of $S$" is written

        $$x \in S,$$

        and "$x$ is not a member of $S$" is written $x \notin S$. The symbol $\in$ is a stylised Greek e, for "element". In Python it is the word `in`.

        **Writing a set down.** There are two ways.

        The **roster** lists the members between braces, separated by commas:

        $$A = \{2, 4, 6, 8\}.$$

        The order of the list does not matter and neither do repeats, so $\{2, 4, 6, 8\}$, $\{8, 2, 6, 4\}$ and $\{2, 2, 4, 6, 8\}$ are three ways of writing one set. A roster may trail off with dots when the pattern is beyond doubt: $\{1, 2, 3, \dots, 100\}$, or $\{2, 4, 6, \dots\}$ going on for ever.

        The **set-builder** describes the members by a condition:

        $$A = \{x \in \mathbb{Z} : 0 < x < 10 \text{ and } x \text{ is even}\}.$$

        Read the colon as "such that": "the set of all $x$ in $\mathbb{Z}$ such that $x$ is between 0 and 10 and even". Some books write a vertical bar in place of the colon. The part before the colon says where $x$ is drawn from, and the part after it is a predicate, in the sense of the last lesson: a test that each candidate passes or fails. You have written this in Python already, as a loop with an `if` that adds the survivors to a set.

        **Two sets are equal when they have the same members.** Nothing else counts: not how they were described, not in which order they were written. So

        $$\{x \in \mathbb{R} : x^2 = 4\} = \{-2, 2\},$$

        although one side is a condition and the other a list.

        **The empty set.** The set with no members at all is written $\emptyset$, or $\{\}$. It is a perfectly good set, and there is only one of it, since any two sets with no members have the same members. It is the answer to "which real numbers satisfy $x^2 = -1$?". Do not confuse $\emptyset$ with $\{0\}$, which has one member, the number zero, nor with $\{\emptyset\}$, which has one member, the empty set. A box containing an empty box is not an empty box. In Python the empty set is `set()`, because `{}` was already taken by the empty dictionary.

        **The sets of numbers.** [[f1.functions-as-machines]] named three sets of numbers. With the fractions added, they make the standard list, each written in a double-struck capital:

        | Symbol | Name | Members |
        | --- | --- | --- |
        | $\mathbb{N}$ | natural numbers | $0, 1, 2, 3, \dots$ |
        | $\mathbb{Z}$ | integers | $\dots, -2, -1, 0, 1, 2, \dots$ |
        | $\mathbb{Q}$ | rational numbers | all fractions $p/q$ of integers with $q \neq 0$ |
        | $\mathbb{R}$ | real numbers | every point of the number line |

        $\mathbb{Z}$ is from the German *Zahlen*, numbers, and $\mathbb{Q}$ is for quotient. A warning: some authors start $\mathbb{N}$ at 1. This course starts it at 0, as Python starts counting at 0. So $-3 \in \mathbb{Z}$ but $-3 \notin \mathbb{N}$, and $\sqrt{2} \in \mathbb{R}$ but $\sqrt{2} \notin \mathbb{Q}$, a fact you will prove in a few lessons.

        **Subsets.** $A$ is a **subset** of $B$, written $A \subseteq B$, when every member of $A$ is also a member of $B$: the fence of $A$ lies inside the fence of $B$. In the language of the last lesson,

        $$A \subseteq B \quad\text{means}\quad \forall x,\; (x \in A \Rightarrow x \in B).$$

        The way the number line was filled in, in the first cluster, is one line:

        $$\mathbb{N} \subseteq \mathbb{Z} \subseteq \mathbb{Q} \subseteq \mathbb{R}.$$

        Three consequences of the definition deserve a moment each.

        *Every set is a subset of itself*, $A \subseteq A$, because every member of $A$ is certainly a member of $A$. When $A \subseteq B$ and $A \neq B$, $A$ is called a **proper** subset.

        *The empty set is a subset of every set.* To show that $\emptyset \subseteq B$ fails, you would have to produce a member of $\emptyset$ that is not in $B$, and there is no member of $\emptyset$ to produce. A promise about every member of an empty collection cannot be broken: it is vacuously true, exactly as in the last lesson. It is the same reason that `for x in []:` never fails: the body never runs.

        *$A = B$ exactly when $A \subseteq B$ and $B \subseteq A$.* This is how equality of two sets is proved in practice: show that each member of the first is in the second, and then the reverse.

        Keep $\in$ and $\subseteq$ apart. $3 \in \{1, 2, 3\}$ is true: 3 is a member. $\{3\} \subseteq \{1, 2, 3\}$ is true: the set containing 3 is inside. But $\{3\} \in \{1, 2, 3\}$ is false, since the members of the right-hand set are three numbers and $\{3\}$ is not a number.
    - question:
        id: member-or-subset
        type: choice
        system: s2
        prompt: |
          Let $S = \{1, \{2, 3\}, 4\}$. Which statement is true?
        options: ["$2 \\in S$", "$\\{2, 3\\} \\in S$", "$\\{2, 3\\} \\subseteq S$", "$S$ has four members"]
        answer: 1
        explanation: |
          $S$ has three members: the number 1, the set $\{2, 3\}$ and the number 4. The set $\{2, 3\}$ is itself one of the members. The numbers 2 and 3 are members of that member, not of $S$, so $\{2, 3\} \subseteq S$ is false.
    - text: |
        **Intervals.** The solution of an inequality is a set, and the commonest kind has its own notation. For real numbers $a < b$:

        | Interval | Set | Ends |
        | --- | --- | --- |
        | $[a, b]$ | $\{x \in \mathbb{R} : a \le x \le b\}$ | both included |
        | $(a, b)$ | $\{x \in \mathbb{R} : a < x < b\}$ | both excluded |
        | $[a, b)$ | $\{x \in \mathbb{R} : a \le x < b\}$ | left included only |
        | $[a, \infty)$ | $\{x \in \mathbb{R} : x \ge a\}$ | no right end |

        A square bracket includes its end and a round one excludes it. $\infty$ is not a number and is never included. Python's `range(a, b)` is the integer cousin of $[a, b)$: it starts at `a` and stops before `b`. And yes, $(2, 5)$ is also how a point of the plane is written. Context decides, and it almost always does so without trouble.

        **Combining sets.** There are four operations, one for each way of picking regions inside two fences.

        The **union** $A \cup B$ is everything in at least one of the two:

        $$A \cup B = \{x : x \in A \text{ or } x \in B\}.$$

        The mathematical "or" is always inclusive, like Python's `or`. A thing in both is in the union, once.

        The **intersection** $A \cap B$ is everything in both:

        $$A \cap B = \{x : x \in A \text{ and } x \in B\}.$$

        If $A \cap B = \emptyset$ the two sets are **disjoint**: the fences do not overlap.

        The **difference** $A \setminus B$ is everything in $A$ that is not in $B$:

        $$A \setminus B = \{x : x \in A \text{ and } x \notin B\}.$$

        Unlike the first two, the order matters: $A \setminus B$ and $B \setminus A$ are the two outer crescents of the picture, and they are different sets.

        The **complement** $A^c$ is everything not in $A$. "Everything" must mean something, so a complement is always taken inside an agreed **universe** $U$, the field in which the fences are drawn: $A^c = U \setminus A$.

        With $A = \{2, 4, 6, 8, 10, 12\}$ and $B = \{3, 6, 9, 12\}$ in the universe $\{1, \dots, 12\}$:

        $$A \cup B = \{2, 3, 4, 6, 8, 9, 10, 12\}, \quad A \cap B = \{6, 12\}, \quad A \setminus B = \{2, 4, 8, 10\}, \quad A^c = \{1, 3, 5, 7, 9, 11\}.$$

        The symbols are easy to keep apart: $\cup$ is a cup, the U of union, and it holds more. $\cap$ is the cup overturned.

        In Python the four are written `a | b`, `a & b`, `a - b` and `u - a`, and `a <= b` asks whether `a` is a subset of `b`. One more is sometimes handy: `a ^ b`, the **symmetric difference**, is everything in exactly one of the two, the two crescents together.

        **The laws, for free.** Look at the definitions again. "$x \in A \cup B$" is the proposition $(x \in A) \lor (x \in B)$. "$x \in A \cap B$" is $(x \in A) \land (x \in B)$, and "$x \in A^c$" is $\neg(x \in A)$. Each set operation is a connective applied to membership. So every law of [[f2.boolean-algebra]] becomes a law of sets, with $\cup$ for $+$, $\cap$ for the product, the complement for the bar, $\emptyset$ for 0 and the universe $U$ for 1:

        | Boolean algebra | Sets |
        | --- | --- |
        | $x + 0 = x$ | $A \cup \emptyset = A$ |
        | $x \cdot 0 = 0$ | $A \cap \emptyset = \emptyset$ |
        | $x + 1 = 1$ | $A \cup U = U$ |
        | $xx = x$ | $A \cap A = A$ |
        | $x\overline{x} = 0$ | $A \cap A^c = \emptyset$ |
        | $x(y + z) = xy + xz$ | $A \cap (B \cup C) = (A \cap B) \cup (A \cap C)$ |
        | $x + yz = (x + y)(x + z)$ | $A \cup (B \cap C) = (A \cup B) \cap (A \cup C)$ |
        | $x + xy = x$ | $A \cup (A \cap B) = A$ |

        Here is why each holds. Pick any thing $t$ and let $a$ be the truth value of $t \in A$, $b$ that of $t \in B$, and so on. Then $t$ is in the left side of a set law exactly when the left side of the Boolean law is 1, and in the right side exactly when the right side is 1. The Boolean law says those agree for every $a$, $b$ and $c$, so the two sets have the same members, and sets with the same members are equal. Every law in the last lesson's table, and every law you could derive there, holds for sets. The second distributive law, so strange for numbers, is plain for fences: to be in $A$ or in both $B$ and $C$ is to be in $A$ or $B$, and also in $A$ or $C$.

        The most useful laws are again the two named after **De Morgan**. What is outside "A or B"? To be outside the union you must be outside $A$ **and** outside $B$:

        $$(A \cup B)^c = A^c \cap B^c.$$

        And what is outside "A and B"? You fail to be in both exactly when you miss at least one of them:

        $$(A \cap B)^c = A^c \cup B^c.$$

        Taking the complement turns cups into caps and caps into cups. You know this law in two other dresses already: $\overline{x + y} = \overline{x}\,\overline{y}$, and in Python `not (p or q)` is the same as `(not p) and (not q)`. It is one fact, because a set is nothing but the collection of things that pass a test.
    - question:
        id: de-morgan-emails
        type: choice
        system: s2
        prompt: |
          Let $F$ be the set of emails containing "free" and $W$ the set containing "winner". The emails containing **neither** word are which set?
        options: ["$F^c \\cup W^c$", "$(F \\cap W)^c$", "$F^c \\cap W^c$", "$F \\setminus W$"]
        answer: 2
        explanation: |
          Neither means not in $F$ **and** not in $W$, which is $F^c \cap W^c$, and by De Morgan that is $(F \cup W)^c$: everything outside the union. The first two options are equal to each other and describe the emails that do not contain both words, a much larger set.
    - text: |
        **Counting.** The number of members of a finite set $A$ is its **cardinality**, written $|A|$. So $|\{2, 4, 6\}| = 3$ and $|\emptyset| = 0$. The bars are the ones used for absolute value and for the modulus. Each measures a size, and the kind of object between the bars tells you which is meant. In Python it is `len`.

        Now the puzzle can be solved properly. Adding $|A|$ and $|B|$ counts the members of the overlap twice, once as members of $A$ and once as members of $B$. Subtract the overlap once:

        $$|A \cup B| = |A| + |B| - |A \cap B|.$$

        This is the **inclusion-exclusion principle**: include both, exclude what was included twice. For the emails,

        $$|F \cup W| = 320 + 210 - 90 = 440,$$

        so 440 emails contain at least one of the words and $1000 - 440 = 560$ contain neither. The naive answer, 470, was wrong by exactly the 90 emails counted twice. And the tiny case comes out right: $3 + 3 - 2 = 4$ emails out of five.

        When the sets are disjoint the correction vanishes, and sizes simply add. That special case is the one people silently assume, and the puzzle is what happens when they should not have. With three or more sets the corrections pile up in a pattern of their own, which the discrete mathematics cluster takes apart in [[f3.inclusion-and-exclusion]].

        **Pairs.** One operation builds something new in kind. The **Cartesian product** $A \times B$ is the set of all ordered pairs with the first entry from $A$ and the second from $B$:

        $$A \times B = \{(a, b) : a \in A \text{ and } b \in B\}.$$

        For $A = \{1, 2\}$ and $B = \{x, y, z\}$ it has the six members $(1, x), (1, y), (1, z), (2, x), (2, y), (2, z)$. In a pair, order matters and repeats are allowed: $(1, 2) \neq (2, 1)$, and $(1, 1)$ is a fine pair. A pair is a Python tuple. Each of the $|A|$ first entries goes with each of the $|B|$ second entries, so

        $$|A \times B| = |A| \times |B|,$$

        which is where the name and the cross come from, and it is a loop inside a loop. The coordinate plane is the product $\mathbb{R} \times \mathbb{R}$, written $\mathbb{R}^2$: all pairs of real numbers. It is named after Descartes, who thought of it.

        **The set of all subsets.** The subsets of a set $S$ are themselves things, and can be collected. The set of all of them is the **power set** $\mathcal{P}(S)$. For $S = \{a, b, c\}$:

        $$\mathcal{P}(S) = \{\emptyset, \{a\}, \{b\}, \{c\}, \{a, b\}, \{a, c\}, \{b, c\}, \{a, b, c\}\}.$$

        Eight subsets from three members. Why eight? To build a subset, go through the members one at a time and decide for each: in, or out. Three independent decisions with two choices each make $2 \times 2 \times 2 = 2^3$ outcomes. In general a set with $n$ members has

        $$|\mathcal{P}(S)| = 2^n$$

        subsets, which explains the name. This is the same count as the number of strings of $n$ bits, and for the same reason: a subset is a row of yes-or-no answers.
    - question:
        id: fix-inclusion-exclusion
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `union_size(a, b)` should return the number of members of the union of two sets, computed from sizes only, by the inclusion-exclusion principle. For `{1, 2, 3}` and `{3, 4}` the union is `{1, 2, 3, 4}`, so the answer should be 4, but the function returns 5. Fix it without using `|` or building the union.
        starter: |
          def union_size(a, b):
              return len(a) + len(b)

          print(union_size({1, 2, 3}, {3, 4}))
        solution: |
          def union_size(a, b):
              return len(a) + len(b) - len(a & b)

          print(union_size({1, 2, 3}, {3, 4}))
        tests: |
          assert "|" not in source and "union(" not in source, "Use sizes only: do not build the union"
          assert union_size({1, 2, 3}, {3, 4}) == 4, "The union of {1, 2, 3} and {3, 4} has 4 members. Which member was counted twice?"
          assert union_size({1, 2}, {3, 4}) == 4, "Disjoint sets: the sizes simply add"
          assert union_size({1, 2, 3}, {1, 2, 3}) == 3, "The union of a set with itself is that set"
          assert union_size(set(), {5}) == 1, "The union with the empty set"
          assert union_size({1, 2, 3, 4}, {2, 3}) == 4, "When one set is inside the other, the union is the larger one"
        wrong:
          - "def union_size(a, b):\n    return len(a) + len(b) - 1\n\nprint(union_size({1, 2, 3}, {3, 4}))\n"
          - "def union_size(a, b):\n    return len(a) + len(b) - 2 * len(a & b)\n\nprint(union_size({1, 2, 3}, {3, 4}))\n"
          - "def union_size(a, b):\n    return max(len(a), len(b))\n\nprint(union_size({1, 2, 3}, {3, 4}))\n"
        explanation: |
          The sum of the sizes counts each member of the intersection twice, so the size of the intersection is subtracted once. Subtracting it twice gives the size of the symmetric difference instead.
  formal:
    - text: |
        A **set** is determined by its members: $A = B$ if and only if every member of $A$ is a member of $B$ and every member of $B$ is a member of $A$. $x \in A$ means that $x$ is a member of $A$. The **empty set** $\emptyset$ has no members.

        $A \subseteq B$ means that every member of $A$ is a member of $B$. For all sets, $\emptyset \subseteq A$ and $A \subseteq A$, and $A = B$ if and only if $A \subseteq B$ and $B \subseteq A$.

        For subsets $A$ and $B$ of a universe $U$:

        | Operation | Definition | Python |
        | --- | --- | --- |
        | Union | $A \cup B = \{x : x \in A \text{ or } x \in B\}$ | `a \| b` |
        | Intersection | $A \cap B = \{x : x \in A \text{ and } x \in B\}$ | `a & b` |
        | Difference | $A \setminus B = \{x : x \in A \text{ and } x \notin B\}$ | `a - b` |
        | Complement | $A^c = U \setminus A$ | `u - a` |
        | Product | $A \times B = \{(a, b) : a \in A \text{ and } b \in B\}$ | two nested loops |
        | Power set | $\mathcal{P}(A) = \{S : S \subseteq A\}$ | |

        **Laws.** Every law of Boolean algebra holds for the subsets of $U$, reading $\cup$ for $+$, $\cap$ for the product, $A^c$ for $\overline{x}$, $\emptyset$ for 0 and $U$ for 1. In particular union and intersection are commutative and associative, and each distributes over the other. **De Morgan's laws:** $(A \cup B)^c = A^c \cap B^c$ and $(A \cap B)^c = A^c \cup B^c$.

        **Counting.** For finite sets:

        | Fact | Statement |
        | --- | --- |
        | Inclusion-exclusion | $\lvert A \cup B \rvert = \lvert A \rvert + \lvert B \rvert - \lvert A \cap B \rvert$ |
        | Disjoint union | if $A \cap B = \emptyset$ then $\lvert A \cup B \rvert = \lvert A \rvert + \lvert B \rvert$ |
        | Complement | $\lvert A^c \rvert = \lvert U \rvert - \lvert A \rvert$ |
        | Product | $\lvert A \times B \rvert = \lvert A \rvert \, \lvert B \rvert$ |
        | Power set | $\lvert \mathcal{P}(A) \rvert = 2^{\lvert A \rvert}$ |

        **Number sets.** $\mathbb{N} = \{0, 1, 2, \dots\}$, $\mathbb{Z}$ the integers, $\mathbb{Q}$ the rationals, $\mathbb{R}$ the reals, with $\mathbb{N} \subseteq \mathbb{Z} \subseteq \mathbb{Q} \subseteq \mathbb{R}$. For reals $a < b$, $[a, b] = \{x \in \mathbb{R} : a \le x \le b\}$ and $(a, b) = \{x \in \mathbb{R} : a < x < b\}$, with the mixed forms defined likewise.
  drill:
    - text: Seconds each. For every one, picture the two fences.
    - question:
        id: drill-member
        type: choice
        system: s1
        prompt: |
          Which statement is true?
        options: ["$-3 \\in \\mathbb{N}$", "$\\frac{1}{2} \\in \\mathbb{Z}$", "$\\sqrt{2} \\in \\mathbb{Q}$", "$-3 \\in \\mathbb{Q}$"]
        answer: 3
        explanation: |
          $-3 = \frac{-3}{1}$ is a fraction of integers, so it is rational. It is not natural, a half is not an integer, and $\sqrt{2}$ is not a fraction of integers.
    - question:
        id: drill-same-set
        type: choice
        system: s1
        prompt: |
          Which of these is **not** the same set as $\{1, 2, 3\}$?
        options: ["$\\{3, 2, 1\\}$", "$\\{1, 1, 2, 3\\}$", "$\\{x \\in \\mathbb{N} : 1 \\le x \\le 3\\}$", "$\\{1, 2, \\{3\\}\\}$"]
        answer: 3
        explanation: |
          Order and repeats do not matter, and a condition is as good as a list. But $\{3\}$ is a set, not the number 3, so the last one has a different member.
    - question:
        id: drill-union
        type: numeric
        system: s1
        prompt: |
          Let $A = \{1, 2, 3, 4\}$ and $B = \{3, 4, 5\}$. What is $|A \cup B|$?
        answer: "5"
        explanation: |
          $A \cup B = \{1, 2, 3, 4, 5\}$. By inclusion-exclusion, $4 + 3 - 2$.
    - question:
        id: drill-difference
        type: choice
        system: s1
        prompt: |
          Let $A = \{1, 2, 3, 4\}$ and $B = \{3, 4, 5\}$. What is $B \setminus A$?
        options: ["$\\{1, 2\\}$", "$\\{5\\}$", "$\\{3, 4\\}$", "$\\{1, 2, 5\\}$"]
        answer: 1
        explanation: Start from the members of B and remove those that are also in A.
    - question:
        id: drill-interval
        type: choice
        system: s1
        prompt: |
          Which numbers belong to the interval $[2, 5)$?
        options: ["2 and 5 but not 3.5", "2 and 3.5 but not 5", "3.5 and 5 but not 2", "2, 3.5 and 5"]
        answer: 1
        explanation: The square bracket includes 2, and the round bracket excludes 5. Everything between is in.
    - question:
        id: drill-product-size
        type: numeric
        system: s1
        prompt: |
          $A$ has 4 members and $B$ has 6. How many members has $A \times B$?
        answer: "24"
        explanation: Each of the 4 first entries pairs with each of the 6 second entries.
    - question:
        id: drill-power-set
        type: numeric
        system: s1
        prompt: |
          How many subsets has a set with 5 members, counting the empty set and the set itself?
        answer: "32"
        explanation: |
          Each member is in or out: $2^5$.
    - question:
        id: drill-empty-subset
        type: choice
        system: s1
        prompt: |
          Which statement is **false**?
        options: ["$\\emptyset \\subseteq \\{1, 2\\}$", "$\\{1, 2\\} \\subseteq \\{1, 2\\}$", "$\\emptyset \\in \\{1, 2\\}$", "$\\lvert \\emptyset \\rvert = 0$"]
        answer: 2
        explanation: |
          The empty set is a subset of every set, but it is a member only of sets that list it. The members of $\{1, 2\}$ are two numbers.
    - question:
        id: predict-ops
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          a = {1, 2, 3, 4}
          b = {3, 4, 5}
          print(sorted(a & b), sorted(a - b), sorted(a ^ b))
        output: "[3, 4] [1, 2] [1, 2, 5]"
        explanation: The intersection, then what is in a but not b, then what is in exactly one of the two.
    - question:
        id: predict-subset
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          a = {2, 4}
          b = {1, 2, 3, 4}
          print(a <= b, b <= a, set() <= a, len({1, 1, 2}))
        output: "True False True 2"
        explanation: Every member of a is in b, but not the reverse. The empty set is a subset of everything. A set keeps one copy of each member.
  work:
    - text: Slower now. Name the sets with letters before you count anything.
    - question:
        id: work-survey
        type: numeric
        system: s2
        prompt: |
          In a class of 40 students, 25 have used Python before, 18 have used a spreadsheet before, and 6 have used neither. How many have used **both**?
        answer: "9"
        explanation: |
          $40 - 6 = 34$ have used at least one, so $|P \cup S| = 34$. Then $34 = 25 + 18 - |P \cap S|$ gives $|P \cap S| = 9$. Check the four regions: 16 Python only, 9 both, 9 spreadsheet only, 6 neither, total 40.
    - question:
        id: work-solution-sets
        type: choice
        system: s2
        prompt: |
          Let $A = \{x \in \mathbb{N} : 3x - 2 < 10\}$ and $B = \{x \in \mathbb{R} : |x - 3| < 1\}$. What is $A \cap B$?
        options: ['$\{3\}$', '$\{2, 3\}$', '$(2, 4)$', '$\{0, 1, 2, 3\}$']
        answer: 0
        explanation: |
          $3x - 2 < 10$ means $x < 4$, and the natural numbers below 4 are 0, 1, 2 and 3, so $A = \{0, 1, 2, 3\}$. The inequality $|x - 3| < 1$ says $x$ is within 1 of 3, so $B = (2, 4)$, which leaves out both ends. Of the members of $A$, only 3 lies strictly between 2 and 4. The intersection of a set of four numbers with an interval is a set of numbers, never larger than the first.
    - question:
        id: write-product
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `product(a, b)` that returns the Cartesian product of two sets as a set of tuples: every pair `(x, y)` with `x` from `a` and `y` from `b`.
        starter: |
          def product(a, b):
              # Replace the next line with your own.
              return set()

          print(sorted(product({1, 2}, {5, 6, 7})))
        solution: |
          def product(a, b):
              pairs = set()
              for x in a:
                  for y in b:
                      pairs.add((x, y))
              return pairs

          print(sorted(product({1, 2}, {5, 6, 7})))
        tests: |
          assert product({1, 2}, {5, 6, 7}) == {(1, 5), (1, 6), (1, 7), (2, 5), (2, 6), (2, 7)}, "The product of {1, 2} and {5, 6, 7} has six pairs, first entry from the first set"
          assert product({1}, {1}) == {(1, 1)}, "A pair may repeat an entry: the product of {1} with itself is {(1, 1)}"
          assert product(set(), {1, 2}) == set(), "There are no pairs when one set is empty"
          assert product({1, 2}, {1, 2}) == {(1, 1), (1, 2), (2, 1), (2, 2)}, "Order matters in a pair: (1, 2) and (2, 1) are both needed"
          _a, _b = {0, 1, 2, 3}, {"x", "y", "z"}
          assert len(product(_a, _b)) == len(_a) * len(_b), "The size of the product is the product of the sizes"
        wrong:
          - "def product(a, b):\n    pairs = set()\n    for x in a:\n        for y in b:\n            pairs.add((y, x))\n    return pairs\n"
          - "def product(a, b):\n    pairs = set()\n    for x in a:\n        for y in b:\n            if x != y:\n                pairs.add((x, y))\n    return pairs\n"
          - "def product(a, b):\n    pairs = set()\n    for x in a:\n        for y in b:\n            pairs.add(x * y)\n    return pairs\n"
        explanation: A loop inside a loop meets every combination once, and each combination is added as a tuple, first entry from the first set. Tuples can be members of a set where lists cannot.
    - question:
        id: write-subsets
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `subsets(items)` that takes a list of distinct items and returns a list of all its subsets, each subset given as a list. The order of the subsets and the order inside each one do not matter. Use the idea from the lesson: every subset of the first $k + 1$ items is either a subset of the first $k$ items, or one of those with the new item added. Start from the single subset of nothing.
        starter: |
          def subsets(items):
              # Replace the next line with your own.
              return []

          print(subsets(["a", "b", "c"]))
        solution: |
          def subsets(items):
              found = [[]]
              for item in items:
                  bigger = []
                  for s in found:
                      bigger.append(s + [item])
                  found = found + bigger
              return found

          print(subsets(["a", "b", "c"]))
        tests: |
          def _norm(result):
              return sorted(sorted(s) for s in result)
          assert _norm(subsets([])) == [[]], "The empty set has exactly one subset: itself. The result should be a list containing one empty list."
          assert _norm(subsets([1])) == [[], [1]], "A set with one member has two subsets"
          assert _norm(subsets(["a", "b", "c"])) == [[], ["a"], ["a", "b"], ["a", "b", "c"], ["a", "c"], ["b"], ["b", "c"], ["c"]], "The eight subsets of a, b, c"
          _five = subsets([1, 2, 3, 4, 5])
          assert len(_five) == 32, "A set with 5 members has 2 to the power 5 subsets"
          assert len(set(tuple(sorted(s)) for s in _five)) == 32, "No subset should appear twice"
        wrong:
          - "def subsets(items):\n    found = []\n    for item in items:\n        bigger = []\n        for s in found:\n            bigger.append(s + [item])\n        found = found + bigger\n    return found\n"
          - "def subsets(items):\n    found = [[]]\n    for item in items:\n        found.append([item])\n    return found\n"
          - "def subsets(items):\n    found = [[]]\n    for item in items:\n        bigger = []\n        for s in found:\n            bigger.append(s + [item])\n        found = bigger\n    return found\n"
        explanation: |
          Each new item doubles the collection: every subset found so far is kept, and a copy of each with the new item added joins them. Starting from the one subset of the empty set, $n$ doublings give $2^n$. Starting from an empty list instead gives nothing to double.
    - question:
        id: fix-complement
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `neither(universe, a, b)` should return the set of members of `universe` that are in neither `a` nor `b`. For the universe `{1, ..., 6}`, `a = {1, 2, 3}` and `b = {3, 4}` it should return `{5, 6}`, but it returns `{1, 2, 4, 5, 6}`. Use De Morgan's laws to see which set the function really computes, and fix it.
        starter: |
          def neither(universe, a, b):
              return (universe - a) | (universe - b)

          print(sorted(neither({1, 2, 3, 4, 5, 6}, {1, 2, 3}, {3, 4})))
        solution: |
          def neither(universe, a, b):
              return (universe - a) & (universe - b)

          print(sorted(neither({1, 2, 3, 4, 5, 6}, {1, 2, 3}, {3, 4})))
        tests: |
          _u = {1, 2, 3, 4, 5, 6}
          assert neither(_u, {1, 2, 3}, {3, 4}) == {5, 6}, "Only 5 and 6 are in neither set. Outside a AND outside b."
          assert neither(_u, set(), set()) == _u, "With two empty sets, everything is in neither"
          assert neither(_u, {1, 2}, {1, 2}) == {3, 4, 5, 6}, "With the same set twice, the answer is its complement"
          assert neither(_u, _u, {1}) == set(), "Nothing is outside the whole universe"
          assert neither(_u, {1, 2}, {5, 6}) == {3, 4}, "Disjoint sets"
        wrong:
          - "def neither(universe, a, b):\n    return universe - (a & b)\n\nprint(sorted(neither({1, 2, 3, 4, 5, 6}, {1, 2, 3}, {3, 4})))\n"
          - "def neither(universe, a, b):\n    return (universe - a) - (universe - b)\n\nprint(sorted(neither({1, 2, 3, 4, 5, 6}, {1, 2, 3}, {3, 4})))\n"
        explanation: |
          The starter computed $A^c \cup B^c$, which by De Morgan is $(A \cap B)^c$: everything not in both. Neither means outside $A$ and outside $B$, $A^c \cap B^c = (A \cup B)^c$. `universe - (a | b)` is an equally good repair.
    - question:
        id: work-three-sets
        type: numeric
        system: s2
        prompt: |
          Among the whole numbers from 1 to 100, how many are divisible by 2 or by 5 (or both)?
        answer: "60"
        explanation: |
          50 are divisible by 2 and 20 by 5. Those divisible by both are the multiples of 10, of which there are 10. So $50 + 20 - 10 = 60$.
    - question:
        id: work-train-test
        type: choice
        system: s2
        prompt: |
          A data set $D$ of 10,000 examples is split into a training set $T$ and a test set $E$ with $T \cup E = D$. A check finds $|T| = 8{,}200$ and $|E| = 2{,}000$. What can you conclude?
        options:
          - "Nothing is wrong: the sizes need not add up."
          - "200 examples are missing from the split."
          - "$\\lvert T \\cap E \\rvert = 200$: two hundred examples are in both, so the test set is not independent of the training set."
          - "$T \\subseteq E$."
        answer: 2
        explanation: |
          $|T \cup E| = |T| + |E| - |T \cap E|$ gives $10{,}000 = 10{,}200 - |T \cap E|$. The two sets overlap in 200 examples. A model tested on examples it was trained on looks better than it is. Checking that the intersection is empty is one of the cheapest and most valuable checks in machine learning.
  connections:
    - text: |
        You now have the nouns of mathematics. From here on, whenever a new kind of object appears, the first questions will be: which set does it live in, and which set does it produce? A statement such as "$x^2 \ge x$" is neither true nor false until a set is named. It is true for every $x \in \mathbb{N}$ and false for $x = \tfrac{1}{2} \in \mathbb{Q}$.

        Sets will follow you into every later subject. An **event** in probability is a set of outcomes, the probability of "A or B" is governed by exactly the inclusion-exclusion rule you used on the emails, and the rule for "not" is the complement. A **data set** is a set of examples, and the first discipline of machine learning is to keep the training set and the test set disjoint. A model's **vocabulary** is a set of tokens, and a sentence is a list of members of it. The space in which a neural network's numbers live, $\mathbb{R}^n$, is a Cartesian product of $n$ copies of the real line: the plane $\mathbb{R}^2$ taken further.

        And the power set gave a first taste of a number that will come back often: $2^n$. A set of only 300 members has more subsets than there are atoms in the observable universe. Whenever a problem asks you to search through all subsets, it is asking for the impossible, and the art will be to avoid the search.

        One thing has been missing all along. The sets in this lesson sit side by side. Nothing yet connects a member of one set to a member of another, and connecting them is what almost all of mathematics and all of programming is about: an input goes in, an output comes out. You met that connection as a machine. It can be built from sets alone, from the pairs of a Cartesian product, and so can the wider idea of a relation, such as "is less than" or "follows on Instagram". That is the next lesson: [[f2.relations-and-functions-between-sets]].
