  work:
    - text: Slower now. To prove a property, take arbitrary elements. To refute it, find particular ones.
    - question:
        id: work-integer-difference
        type: choice
        system: s2
        prompt: |
          On the real numbers, define $x \sim y$ to mean that $x - y$ is an integer. It is an equivalence relation. Which description of the class of $0.25$ is right?
        options:
          - "All real numbers between 0 and 1."
          - "$\\{\\dots, -1.75, -0.75, 0.25, 1.25, 2.25, \\dots\\}$, all numbers that differ from $0.25$ by a whole number."
          - "All numbers that round to 0."
          - "Only $0.25$ itself."
        answer: 1
        explanation: |
          $x \sim 0.25$ means $x = 0.25 + n$ for an integer $n$. Every class has exactly one representative in the interval from 0 up to but not including 1, the "fractional part", and that is its canonical form. This relation wraps the number line round a circle of circumference 1, which is how an angle or a phase is represented.
    - question:
        id: work-biryani
        type: choice
        system: s2
        prompt: |
          A biryani recipe has six steps. Some must come before others: soak the rice before boiling it, marinate the chicken before cooking it, boil the rice and cook the chicken before layering, and layer before the final slow cooking, the dum. Which order respects every one of these?
        options:
          - 'Marinate, soak, cook chicken, boil rice, layer, dum'
          - 'Soak, boil rice, layer, marinate, cook chicken, dum'
          - 'Marinate, cook chicken, layer, soak, boil rice, dum'
          - 'Soak, marinate, boil rice, layer, cook chicken, dum'
        answer: 0
        explanation: |
          "Must come before" is a partial order on the six steps, and soaking and marinating are incomparable, so either may go first. The first option does every step after everything that must precede it: it is a topological sort. The second layers before the chicken is cooked, the third layers before the rice is boiled, and the fourth layers before the chicken is cooked. Several other orders would also be correct, one for each way of interleaving the rice steps with the chicken steps.
    - question:
        id: write-classes
        type: code
        mode: write
        system: s2
        prompt: |
          Write `classes(items, key)`. It returns the equivalence classes of `items` under "has the same key": a list of lists. The classes come in the order in which their first member appears in `items`, and inside each class the members keep their original order.

          The program groups the numbers 0 to 9 by their remainder on division by 3.
        starter: |
          def classes(items, key):
              # Replace the next line with your own.
              return []

          print(classes(range(10), lambda n: n % 3))
        solution: |
          def classes(items, key):
              groups = {}
              for item in items:
                  k = key(item)
                  if k not in groups:
                      groups[k] = []
                  groups[k].append(item)
              return list(groups.values())

          print(classes(range(10), lambda n: n % 3))
        tests: |
          assert classes(range(10), lambda n: n % 3) == [[0, 3, 6, 9], [1, 4, 7], [2, 5, 8]], "0 to 9 by remainder on division by 3"
          assert classes(["tea", "eat", "tan", "ate", "nat", "bat"], lambda w: "".join(sorted(w))) == [["tea", "eat", "ate"], ["tan", "nat"], ["bat"]], "Anagrams, in order of first appearance"
          assert classes([5, 3, 5, 1, 3], lambda n: n) == [[5, 5], [3, 3], [1]], "With the identity as key, equal values are grouped, in order of first appearance"
          assert classes([], lambda n: n) == [], "No items, no classes"
          assert classes(["a", "bb", "cc", "d", "eee"], len) == [["a", "d"], ["bb", "cc"], ["eee"]], "Strings by length"
          assert classes([3, -3, 2, -2, 0], abs) == [[3, -3], [2, -2], [0]], "Numbers by absolute value"
          assert classes([1, 2, 3], lambda n: 0) == [[1, 2, 3]], "A constant key puts everything in one class"
          _c = classes(list(range(20)), lambda n: (n * n) % 7)
          assert sorted(sum(_c, [])) == list(range(20)), "Every item must be in exactly one class"
          assert all(len(_block) > 0 for _block in _c), "No class may be empty"
          assert output.strip() == "[[0, 3, 6, 9], [1, 4, 7], [2, 5, 8]]", "The program should print the three classes of 0 to 9 modulo 3"
        wrong:
          - "def classes(items, key):\n    groups = {}\n    for item in items:\n        groups[key(item)] = [item]\n    return list(groups.values())\n\nprint([[0, 3, 6, 9], [1, 4, 7], [2, 5, 8]])\n"
          - "def classes(items, key):\n    groups = {}\n    for item in items:\n        k = key(item)\n        if k not in groups:\n            groups[k] = []\n        groups[k].append(item)\n    return [groups[k] for k in sorted(groups)]\n\nprint([[0, 3, 6, 9], [1, 4, 7], [2, 5, 8]])\n"
          - "def classes(items, key):\n    result = []\n    for item in items:\n        if len(result) > 0 and key(result[-1][0]) == key(item):\n            result[-1].append(item)\n        else:\n            result.append([item])\n    return result\n\nprint([[0, 3, 6, 9], [1, 4, 7], [2, 5, 8]])\n"
          - "def classes(items, key):\n    groups = {}\n    for item in items:\n        k = key(item)\n        if k not in groups:\n            groups[k] = []\n        groups[k].append(k)\n    return list(groups.values())\n\nprint([[0, 3, 6, 9], [1, 4, 7], [2, 5, 8]])\n"
        explanation: |
          A dictionary from key to list is the partition: each item is appended to the one list its key selects, so it lands in exactly one class, and a class is created only when it has a first member, so none is empty. Python dictionaries remember the order in which keys were first inserted, which gives the order asked for. One pass over the data is enough, and it is enough **because** "same key" is transitive: an item is compared with nothing but its own key. Grouping by a relation that is not an equivalence would need every pair compared, and would still not produce classes.
    - question:
        id: write-properties
        type: code
        mode: write
        system: s2
        prompt: |
          Write `properties(rel, items)` for a relation `rel(a, b)` and a finite list `items`. It returns a tuple of three Booleans, `(reflexive, symmetric, transitive)`, each decided by checking every case.

          The program tests the starter's "differs by at most 1" on three readings.
        starter: |
          def properties(rel, items):
              # Replace the next line with your own.
              return (False, False, False)

          print(properties(lambda x, y: abs(x - y) <= 1, [1.0, 1.8, 2.6]))
        solution: |
          def properties(rel, items):
              reflexive = all(rel(a, a) for a in items)
              symmetric = all(rel(b, a) for a in items for b in items if rel(a, b))
              transitive = all(rel(a, c) for a in items for b in items for c in items if rel(a, b) and rel(b, c))
              return (reflexive, symmetric, transitive)

          print(properties(lambda x, y: abs(x - y) <= 1, [1.0, 1.8, 2.6]))
        tests: |
          _n = [0, 1, 2, 3, 4, 5]
          assert properties(lambda a, b: a == b, _n) == (True, True, True), "Equality has all three properties"
          assert properties(lambda a, b: a < b, _n) == (False, False, True), "Less than is only transitive"
          assert properties(lambda a, b: a <= b, _n) == (True, False, True), "Less than or equal is reflexive and transitive, not symmetric"
          assert properties(lambda a, b: a % 3 == b % 3, _n) == (True, True, True), "Congruence modulo 3 is an equivalence relation"
          assert properties(lambda a, b: abs(a - b) <= 1, [1.0, 1.8, 2.6]) == (True, True, False), "Differs by at most 1 is not transitive: 1.0, 1.8, 2.6"
          assert properties(lambda a, b: a != b, _n) == (False, True, False), "Not equal is symmetric only. It fails transitivity with c equal to a."
          assert properties(lambda a, b: False, _n) == (False, True, True), "The relation that never holds is symmetric and transitive vacuously, and not reflexive"
          assert properties(lambda a, b: a * b > 0, [-2, -1, 0, 1, 2]) == (False, True, True), "xy > 0 fails reflexivity at 0 only"
          assert properties(lambda a, b: a * b > 0, [-2, -1, 1, 2]) == (True, True, True), "xy > 0 is an equivalence relation on non-zero numbers"
          assert properties(lambda a, b: b == a + 1, _n) == (False, False, False), "Is one more than has none of the three"
          assert properties(lambda a, b: True, []) == (True, True, True), "On an empty set every universal statement is true"
          assert properties(lambda a, b: a == 0 or a == b, [0, 1, 2]) == (True, False, True), "A relation that is reflexive and transitive without being symmetric"
          assert output.strip() == "(True, True, False)", "The program should print (True, True, False)"
        wrong:
          - "def properties(rel, items):\n    reflexive = all(rel(a, a) for a in items)\n    symmetric = all(rel(b, a) for a in items for b in items if rel(a, b))\n    transitive = all(rel(items[i], items[i + 2]) for i in range(len(items) - 2) if rel(items[i], items[i + 1]) and rel(items[i + 1], items[i + 2]))\n    return (reflexive, symmetric, transitive)\n\nprint((True, True, False))\n"
          - "def properties(rel, items):\n    reflexive = any(rel(a, a) for a in items)\n    symmetric = all(rel(b, a) for a in items for b in items if rel(a, b))\n    transitive = all(rel(a, c) for a in items for b in items for c in items if rel(a, b) and rel(b, c))\n    return (reflexive, symmetric, transitive)\n\nprint((True, True, False))\n"
          - "def properties(rel, items):\n    reflexive = all(rel(a, a) for a in items)\n    symmetric = all(rel(a, b) and rel(b, a) for a in items for b in items)\n    transitive = all(rel(a, c) for a in items for b in items for c in items if rel(a, b) and rel(b, c))\n    return (reflexive, symmetric, transitive)\n\nprint((True, True, False))\n"
          - "def properties(rel, items):\n    reflexive = all(rel(a, a) for a in items)\n    symmetric = all(rel(b, a) for a in items for b in items if rel(a, b))\n    transitive = all(rel(a, c) for a in items for b in items for c in items if a != b and b != c and a != c and rel(a, b) and rel(b, c))\n    return (reflexive, symmetric, transitive)\n\nprint((True, True, False))\n"
        explanation: |
          Each property is a universal statement, so each is an `all`. Symmetry and transitivity are universal **implications**, and the `if` clause of the generator plays the part of the hypothesis: only the pairs and triples that satisfy it are examined, and when there are none the answer is `True`, vacuously. Notice that the triples must include those in which two of the three elements coincide. "Not equal" fails transitivity only through $a \ne b$, $b \ne a$, and yet $a = a$. On a finite set this exhaustive check is a proof. For congruence on all the integers, only the three short arguments in the lesson will do.
    - question:
        id: fix-partition
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `is_partition(blocks, items)` should decide whether the list of lists `blocks` is a partition of the list of different values `items`: no block empty, no value in two blocks, and every value of `items` in some block, with nothing extra.

          It is used to check that a data set has been split properly into training, validation and test parts. It has just approved a split in which one example appears in both the training part and the test part. Fix it so that all three conditions are checked.
        starter: |
          def is_partition(blocks, items):
              covered = set()
              for block in blocks:
                  covered = covered | set(block)
              return covered == set(items)

          print(is_partition([[1, 2], [2, 3]], [1, 2, 3]))
        solution: |
          def is_partition(blocks, items):
              seen = set()
              for block in blocks:
                  if len(block) == 0:
                      return False
                  for value in block:
                      if value in seen:
                          return False
                      seen.add(value)
              return seen == set(items)

          print(is_partition([[1, 2], [2, 3]], [1, 2, 3]))
        tests: |
          assert is_partition([[1, 2], [3]], [1, 2, 3]) is True, "A proper partition into two blocks"
          assert is_partition([[1, 2], [2, 3]], [1, 2, 3]) is False, "2 is in two blocks"
          assert is_partition([[1], [3]], [1, 2, 3]) is False, "2 is in no block"
          assert is_partition([[1, 2, 3], []], [1, 2, 3]) is False, "A block is empty"
          assert is_partition([[1, 2], [3, 4]], [1, 2, 3]) is False, "4 is not one of the items"
          assert is_partition([[1, 2], [3], [1]], [1, 2, 3]) is False, "1 is in the first block and the third"
          assert is_partition([[3], [1], [2]], [1, 2, 3]) is True, "Three blocks of one, in any order"
          assert is_partition([[1, 2, 3]], [1, 2, 3]) is True, "One block holding everything"
          assert is_partition([], []) is True, "The empty set is partitioned by no blocks at all"
          assert is_partition([], [1]) is False, "With no blocks, 1 is not covered"
          assert is_partition([["a", "b"], ["c"]], ["c", "a", "b"]) is True, "The order of the items does not matter"
          assert output.strip() == "False", "The program should print False"
        wrong:
          - "def is_partition(blocks, items):\n    covered = set()\n    total = 0\n    for block in blocks:\n        covered = covered | set(block)\n        total += len(block)\n    return covered == set(items) and total == len(items)\n\nprint(False)\n"
          - "def is_partition(blocks, items):\n    seen = set()\n    for block in blocks:\n        if len(block) == 0:\n            return False\n        for value in block:\n            if value in seen:\n                return False\n            seen.add(value)\n    return True\n\nprint(False)\n"
          - "def is_partition(blocks, items):\n    for i in range(len(blocks) - 1):\n        if len(set(blocks[i]) & set(blocks[i + 1])) > 0:\n            return False\n    covered = set()\n    for block in blocks:\n        if len(block) == 0:\n            return False\n        covered = covered | set(block)\n    return covered == set(items)\n\nprint(False)\n"
        explanation: |
          The starter checked one of the three conditions, that the union of the blocks is the whole set. A union forgets how many times a value occurred, so overlapping blocks went unnoticed, and an empty block adds nothing to a union. The repair walks through the blocks keeping the set of values seen so far: a value met twice means two blocks overlap. The practical case is serious. An example that sits in both the training part and the test part is called **leakage**, and it makes a model's test score better than its real performance, since the model is partly being examined on questions it has already seen. A correct split is exactly a partition.
    - question:
        id: work-well-defined
        type: choice
        system: s2
        prompt: |
          Someone defines a function on the integers modulo 6 by $g([a]) = [a \bmod 4]$, "take any representative, and return the class of its remainder on division by 4". Is $g$ well defined?
        options:
          - "Yes, because every integer has a remainder on division by 4."
          - "No. $[1] = [7]$ modulo 6, but $1 \\bmod 4 = 1$ and $7 \\bmod 4 = 3$, and $[1] \\ne [3]$ modulo 6."
          - "Yes, because $[a \\bmod 4]$ is always one of the six classes."
          - "No, because 4 is smaller than 6."
        answer: 1
        explanation: |
          A function on classes must give the same result for every representative of a class. Here two representatives of one class, 1 and 7, give different results, so the rule does not define a function at all. It is the "numerator of a fraction" problem again. To show that an operation is well defined needs a proof for all representatives. To show that it is not, one class with two disagreeing representatives is enough.
    - question:
        id: work-key-or-not
        type: choice
        system: s2
        prompt: |
          A team wants to remove near-duplicate sentences from a data set. Two sentences are near-duplicates if they differ in at most two words. They plan to put each sentence into a dictionary keyed by "its near-duplicate group". What is the difficulty?
        options:
          - "Dictionaries cannot hold sentences."
          - "\"Differs in at most two words\" is not transitive, so there are no well-defined groups and no key function that produces them."
          - "The relation is not symmetric."
          - "There is no difficulty."
        answer: 1
        explanation: |
          Sentence A may differ from B in two words and B from C in two other words, so that A and C differ in four. The relation is reflexive and symmetric and not transitive, exactly like "differs by at most 1" for numbers. A dictionary key requires an equivalence relation, because a key **is** a function and "same key" is transitive. In practice one must either choose a true key, such as the sentence in lower case with punctuation removed, and accept that it captures only some near-duplicates, or else compare pairs and decide by some separate rule how chains are to be cut.
    - question:
        id: write-minimal
        type: code
        mode: write
        system: s2
        prompt: |
          `below(a, b)` is a partial order on the list `items`, whose members are all different. Write `minimal(items, below)`, which returns the list of minimal elements in their order in `items`: those `m` for which no **other** item `x` has `below(x, m)`. The program finds the minimal elements of a set of numbers ordered by "divides".
        starter: |
          def minimal(items, below):
              # Replace the next line with your own.
              return []

          divides = lambda a, b: b % a == 0
          print(minimal([2, 3, 4, 6, 9, 12, 18], divides))
        solution: |
          def minimal(items, below):
              return [m for m in items if not any(below(x, m) for x in items if x != m)]

          divides = lambda a, b: b % a == 0
          print(minimal([2, 3, 4, 6, 9, 12, 18], divides))
        tests: |
          _divides = lambda a, b: b % a == 0
          assert minimal([2, 3, 4, 6, 9, 12, 18], _divides) == [2, 3], "Under divides, 2 and 3 are minimal: nothing else in the list divides them"
          assert minimal([5, 3, 8], lambda a, b: a <= b) == [3], "In a total order there is one minimal element, the least"
          assert minimal([{1, 2}, {1}, {2}, {1, 2, 3}], lambda a, b: a <= b) == [{1}, {2}], "Under the subset order, {1} and {2} are both minimal"
          assert minimal([7, 11, 13], _divides) == [7, 11, 13], "When no two are comparable, every element is minimal"
          assert minimal([12, 6, 4, 3, 2], _divides) == [3, 2], "Keep the order of the list"
          assert minimal([4], _divides) == [4], "A single element is minimal"
          assert minimal([], _divides) == [], "No elements, no minimal elements"
          assert output.strip() == "[2, 3]", "The program should print [2, 3]"
        wrong:
          - |
            def minimal(items, below):
                return [m for m in items if not any(below(x, m) for x in items)]

            divides = lambda a, b: b % a == 0
            print(minimal([2, 3, 4, 6, 9, 12, 18], divides))
          - |
            def minimal(items, below):
                return [m for m in items if all(below(m, x) for x in items)]

            divides = lambda a, b: b % a == 0
            print(minimal([2, 3, 4, 6, 9, 12, 18], divides))
          - |
            def minimal(items, below):
                return [m for m in items if not any(below(m, x) for x in items if x != m)]

            divides = lambda a, b: b % a == 0
            print(minimal([2, 3, 4, 6, 9, 12, 18], divides))
        explanation: |
          "Minimal" is a negated existential: there is no other $x$ below $m$. In code that is `not any(...)` over the other items. Leaving out `x != m` makes every element fail, because a partial order is reflexive and each element lies below itself. Testing `all(below(m, x) ...)` asks for a **least** element, which a partial order need not have: under "divides", neither 2 nor 3 divides the other. And swapping the arguments finds the **maximal** elements instead, here 12 and 18.
  connections:
    - text: |
        Equivalence relations are how mathematics makes new objects out of old ones, and how it says precisely that two descriptions describe the same thing. A rational number is a class of fractions. The classes of remainders become an arithmetic of their own, the arithmetic of the clock, in [[f3.modular-arithmetic]]. Two neural networks whose hidden units have been reordered compute the same function, so the possible weight settings fall into large classes of equivalent models, a fact that shapes the landscape that training has to cross. In every case the questions are the two of this lesson: is the relation an equivalence, and is the thing I want to compute well defined on its classes?

        In engineering the idea is everywhere under other names. A dictionary works because "has the same key" is an equivalence relation. Grouping in a data frame, `GROUP BY` in a database and removing duplicates all compute a partition from a key function. A train, validation and test split is a partition, and leakage is the failure of disjointness. Normalising text before comparing it is choosing canonical forms. And when pairs are declared equivalent one at a time, as when a payments company discovers that two accounts belong to the same person, keeping the classes up to date is the job of a data structure built for exactly that: [[s2.union-find]].

        Partial orders are as common. A build system compiles each file after the files it depends on, a spreadsheet recalculates each cell after the cells it reads, and a package manager installs each library after its dependencies. Each starts from "must come before" and produces a listing that respects it. Version histories are partial orders of changes, and two changes that are incomparable are exactly the ones that may conflict. Sorting needs the stronger kind, a total order, in which every two items can be compared.

        That ends the logic cluster. You now have the language in which data structures are specified and proved correct: a structure is a set of values with operations on it, its promises are invariants, and its correctness is an induction over the operations performed on it. The next cluster builds them, beginning with the simplest of all, a row of values side by side in memory. It is a function from the positions $0, 1, \dots, n - 1$ to values, and it can be made to grow when it is full without the cost of growing ever being felt: [[s2.arrays-and-dynamic-arrays]].
