concept: f2.equivalence-relations-and-partial-orders
minutes: 105
claim: You can test a relation on a set for reflexivity, symmetry, antisymmetry and transitivity, prove that a relation is an equivalence relation, describe its classes, explain why equivalence relations and partitions are the same thing, group data by a key, say what it means for an operation on classes to be well defined, recognise a partial order, tell comparable elements from incomparable ones, and find minimal elements and an order that respects them all.
recalls: [f2.loop-invariants, f2.relations-and-functions-between-sets]
uses: [f2.propositions-and-connectives, f2.quantifiers-and-their-negation, f2.direct-proof, f2.contrapositive-and-contradiction, f2.sets-and-set-operations, f1.functions-as-machines, f0.fractions-decimals-and-percentages, s0.strings, s0.functions, s0.lists-and-tuples, s0.dictionaries-and-sets, s1.comprehensions-and-iterators]
leads: [s2.arrays-and-dynamic-arrays, s2.union-find, f3.modular-arithmetic, s3.topological-sort]
starter: |
  # Scratch space. Three numbers, each "close" to the next. Is the first close to the last?
  def close(x, y):
      return abs(x - y) <= 1

  print(close(1.0, 1.8), close(1.8, 2.6), close(1.0, 2.6))
parts:
  recall:
    - text: |
        [[f2.relations-and-functions-between-sets]] defined a relation as a set of pairs, and promised that some relations on a single set behave like equality while others behave like "is at most". [[f2.loop-invariants]] leaned on the second kind without naming it: binary search needs a sorted list, and "sorted" means something only when any two items can be compared. Three quick pulls first.
  puzzle:
    - text: |
        When are two things the same?

        $\tfrac{1}{2}$ and $\tfrac{2}{4}$ are written with different numerals, and everybody agrees they are the same number. Three o'clock and fifteen o'clock are the same position of the hands. In Python, `{1, 2} == {2, 1}` is `True`, though the two were typed differently, and `"Delhi".lower() == "DELHI".lower()` treats two different strings as the same city. In each case, objects that are plainly different are being **regarded as equal**, because they agree in the respect that matters.

        Much of mathematics, and much of data cleaning, consists of deciding what to regard as the same. So here is a harmless-looking proposal from an engineer whose sensor readings are noisy:

        > Two readings are "the same" if they differ by at most 1.

        The plan is to merge readings that are the same, and so reduce a long list of measurements to a short list of distinct values. Try it on $1.0,\ 1.8,\ 2.6$.

        - $1.0$ and $1.8$ differ by $0.8$. The same. Merge them.
        - $1.8$ and $2.6$ differ by $0.8$. The same. Merge them.
        - So all three are one value. But $1.0$ and $2.6$ differ by $1.6$. **Not** the same.

        The starter prints exactly this: `True True False`. The merged group contains two readings that are not "the same" as each other. And it gets worse. Carry on with $3.4, 4.2, 5.0, \dots$ and the chain swallows every reading there is, so that "the same" has come to mean nothing. Group them in a different order and you get different groups.

        Compare the remainders from [[f2.direct-proof]]. Sorting integers by "leaves the same remainder on division by 3" never misbehaved. Every number went into exactly one class, any two numbers in a class were alike, and the order of sorting made no difference.

        **What does "leaves the same remainder" have that "differs by at most 1" lacks?** What exactly must a notion of sameness satisfy in order to divide a set cleanly into groups?
  intuition:
    - text: |
        Think about what you take for granted whenever you sort things into piles: socks by colour, files by type, people by the month of their birth.

        First, **everything goes in the pile of things like itself**. A sock is the same colour as itself. That sounds too obvious to say, and it is one of the three things that must be said.

        Second, **likeness is mutual**. If this sock matches that one, then that one matches this one. You never have to ask in which order to compare.

        Third, **likeness chains**. If sock A matches sock B, and B matches C, then A matches C. This is what lets you sort without comparing every pair. To place a new sock, you compare it with **one** sock from each pile, any one, and that settles its relation to the whole pile.

        The third is what the engineer's rule lacked. $1.0$ was like $1.8$, and $1.8$ like $2.6$, and the chain did not close. So piles could not be formed: $1.8$ belonged with $1.0$ and with $2.6$, which did not belong with each other.

        The figure shows the numbers from 0 to 17 sorted by remainder, now for the modulus 4. Pick a number and look at its column, its **class**. Then pick another number from the same column. The class shown is the same one. Whichever member you start from, you get the same class.
    - figure: remainder-classes
      props: { modulus: 4, number: 6 }
    - text: |
        That last observation matters more than it looks. A class has no boss. The column containing 6 is the class of 6, and equally the class of 2, of 10 and of 14. Any member will do to **name** it, and the name usually chosen is the smallest, the remainder itself. This is the same convenience as writing $\tfrac{1}{2}$ for the number that is also $\tfrac{2}{4}$ and $\tfrac{50}{100}$.

        So the picture to hold is this. A good notion of sameness and a division of a set into non-overlapping piles are **one thing seen from two sides**. Give me the notion, and I form the piles. Give me the piles, and I define "the same" as "in the same pile". The three conditions above are exactly what makes the passage from the first to the second work. The rest of the lesson makes them precise and proves that.
  derivation:
    - text: |
        **Relations on one set.** [[f2.relations-and-functions-between-sets]] defined a relation from $A$ to $B$ as a set of pairs. When both entries come from the same set, it is a **relation on** $A$, a subset of $A \times A$. We write $a \sim b$ when the pair $(a, b)$ belongs to it, and say "$a$ is related to $b$". Equally, a relation on $A$ is a predicate with two variables, both ranging over $A$, true for the pairs in the set and false for the rest. In Python it can be stored as a set of pairs, or given as a function of two arguments that returns a Boolean, like `close` in the starter.

        You know many relations already. On numbers there are $=$, $<$, $\le$ and "divides". On sets there is $\subseteq$. On people, "is a parent of" and "has the same birthday as". Most of them are not functions: an element may be related to many others, or to none.

        **Three properties.** A relation $\sim$ on $A$ is

        - **reflexive** if $\ \forall a \in A,\ a \sim a$;
        - **symmetric** if $\ \forall a, b \in A,\ a \sim b \Rightarrow b \sim a$;
        - **transitive** if $\ \forall a, b, c \in A,\ (a \sim b \land b \sim c) \Rightarrow a \sim c$.

        Each is a universal statement, so each is **proved** by an argument about arbitrary elements and **refuted** by one counterexample. For transitivity that is a triple with $a \sim b$ and $b \sim c$ true and $a \sim c$ false. In the definition, $a$, $b$ and $c$ need not be different.

        | Relation | Reflexive | Symmetric | Transitive |
        | --- | --- | --- | --- |
        | $a = b$ on numbers | yes | yes | yes |
        | $a < b$ on numbers | no: $1 < 1$ is false | no: $1 < 2$, not $2 < 1$ | yes |
        | $a \le b$ on numbers | yes | no: $1 \le 2$, not $2 \le 1$ | yes |
        | $a$ divides $b$ on positive integers | yes | no: 2 divides 4 | yes |
        | $a$ and $b$ differ by at most 1 | yes | yes | no: $1,\ 1.8,\ 2.6$ |
        | $a$ and $b$ have the same remainder on division by 3 | yes | yes | yes |
        | $a$ is a sibling of $b$ on people | no | yes | no: take $c = a$ |

        Work through a few rows until each "no" is clear. The three properties are independent of one another: a relation can have any combination of them.

        **Equivalence relations.** A relation that is reflexive, symmetric **and** transitive is an **equivalence relation**. These are the well-behaved notions of sameness. Equality is the model, and the three properties are exactly the features of equality that all reasoning about "the same" depends on. The relations $<$ and $\le$ and "divides" are useful for another purpose, putting things in **order**, and they fail symmetry, as an order must. They get a section of their own at the end of the lesson.

        **Congruence.** The most important example after equality deserves its own notation. Fix an integer $m \ge 1$, the **modulus**. For integers $a$ and $b$ we say that $a$ is **congruent** to $b$ modulo $m$, and write

        $$a \equiv b \pmod{m}, \qquad\text{when}\qquad m \mid (a - b).$$

        So $17 \equiv 5 \pmod{12}$, because $17 - 5 = 12$, and that is the clock: seventeen o'clock is five o'clock. Also $-1 \equiv 4 \pmod{5}$, since $-1 - 4 = -5$.

        Congruent numbers are exactly the numbers with the same remainder. If $a = mq + r$ and $b = mq' + r$, then $a - b = m(q - q')$. And conversely, if $m \mid (a - b)$, the two remainders differ by a multiple of $m$ while both lying between 0 and $m - 1$, which forces them to be equal. The definition by divisibility is the easier one to prove things with, because it unpacks into an equation.

        > **Theorem.** Congruence modulo $m$ is an equivalence relation on $\mathbb{Z}$.
        >
        > **Proof.** *Reflexive.* Let $a$ be an integer. Then $a - a = 0 = m \times 0$, so $m \mid (a - a)$, that is, $a \equiv a$.
        >
        > *Symmetric.* Let $a \equiv b$. Then $a - b = mk$ for some integer $k$, so $b - a = m(-k)$, and $-k$ is an integer. Hence $b \equiv a$.
        >
        > *Transitive.* Let $a \equiv b$ and $b \equiv c$. Then $a - b = mk$ and $b - c = ml$ for some integers $k$ and $l$. Adding, $a - c = m(k + l)$, and $k + l$ is an integer. Hence $a \equiv c$. $\blacksquare$

        Three direct proofs, each a few symbols long, in the style of [[f2.direct-proof]]: unpack "divides", compute, pack.

        **Equivalence classes.** Let $\sim$ be an equivalence relation on $A$. The **equivalence class** of an element $a$ is the set of everything related to it:

        $$[a] = \{\, x \in A : x \sim a \,\}.$$

        For congruence modulo 3 there are three classes:

        $$[0] = \{\dots, -6, -3, 0, 3, 6, \dots\}, \quad [1] = \{\dots, -5, -2, 1, 4, 7, \dots\}, \quad [2] = \{\dots, -4, -1, 2, 5, 8, \dots\}.$$

        And $[3]$ is not a fourth class. It is $[0]$ again, under another name. Any member of a class is called a **representative** of it.

        Here is the central theorem. It says that the classes behave as piles should.

        > **Theorem.** Let $\sim$ be an equivalence relation on $A$, and let $a, b \in A$.
        >
        > 1. $a \in [a]$. So every element is in some class, and no class is empty.
        > 2. If $a \sim b$, then $[a] = [b]$.
        > 3. If $a \not\sim b$, then $[a]$ and $[b]$ have no element in common.
        >
        > **Proof.** (1) By reflexivity $a \sim a$, so $a \in [a]$.
        >
        > (2) Suppose $a \sim b$. To prove that two sets are equal, we show that each is a subset of the other. Let $x \in [a]$. Then $x \sim a$, and with $a \sim b$, transitivity gives $x \sim b$, so $x \in [b]$. Thus $[a] \subseteq [b]$. For the other inclusion, symmetry gives $b \sim a$, and the same argument with the letters exchanged shows $[b] \subseteq [a]$.
        >
        > (3) We prove the contrapositive: if $[a]$ and $[b]$ have a common element, then $a \sim b$. Let $x$ be in both. Then $x \sim a$ and $x \sim b$. By symmetry $a \sim x$, and by transitivity $a \sim x \sim b$ gives $a \sim b$. $\blacksquare$

        Read the proof again and mark where each of the three properties was used. Reflexivity put every element into a class. Symmetry and transitivity together made two classes that touch collapse into one. Drop any one of the three and some part of the theorem fails. With "differs by at most 1" the classes $[1.0]$ and $[2.6]$ are different and both contain $1.8$.

        Parts 2 and 3 together say: **two classes are either identical or disjoint. They never partly overlap.**

        **Partitions.** A **partition** of a set $A$ is a collection of subsets of $A$, called **blocks**, such that

        - no block is empty,
        - any two different blocks are disjoint,
        - and every element of $A$ is in some block.

        In short: every element is in **exactly one** block. The theorem just proved says that **the equivalence classes of an equivalence relation form a partition**.

        The converse is true as well, and easier. Given a partition of $A$, define $a \sim b$ to mean "$a$ and $b$ are in the same block". This is reflexive, since $a$ is in the same block as itself. It is symmetric, obviously. And it is transitive: if $a$, $b$ share a block and $b$, $c$ share a block, those are the same block, namely the one block containing $b$. Its classes are the blocks you started with.

        So an equivalence relation on a set and a partition of the set carry exactly the same information. To specify one is to specify the other.

        **Sameness from a function.** Where do equivalence relations come from in practice? Nearly always from a **function**. Let $f : A \to B$ be any function, and define

        $$a \sim b \quad\text{when}\quad f(a) = f(b).$$

        This is always an equivalence relation, and the three proofs take one line each, because they are inherited from equality: $f(a) = f(a)$. If $f(a) = f(b)$ then $f(b) = f(a)$. If $f(a) = f(b)$ and $f(b) = f(c)$ then $f(a) = f(c)$. The class of $a$ is the set of all inputs that $f$ sends where it sends $a$.

        "Same remainder" is this with $f(n) = n \bmod m$. "Same length" for strings has $f = $ `len`. "Equal ignoring case" has $f = $ `str.lower`. "Anagrams of each other" has $f(w) = $ the letters of $w$ in sorted order. In code, the function is called a **key**, and forming the classes is the most common operation in all of data processing, **group by**:

        ```python
        words = ["tea", "eat", "tan", "ate", "nat", "bat"]
        groups = {}
        for word in words:
            key = "".join(sorted(word))
            if key not in groups:
                groups[key] = []
            groups[key].append(word)
        print(len(groups))
        ```

        This prints 3. The dictionary's keys are the values of $f$, and its values are the classes. Because "same key" is an equivalence relation, the result is a partition: every word is in exactly one list. You cannot write this loop for "differs by at most 1". There is no key function for it, and the absence of a key is the same fact as the failure of transitivity.

        The value $f(a)$ serves as a **canonical form** for the class of $a$: a standard representative, computed from any member, such that two things are equivalent exactly when their canonical forms are **equal**. The remainder is the canonical form of an integer modulo $m$. A fraction in lowest terms with a positive denominator is the canonical form of a fraction. Lower case is a canonical form for text. Turning a messy test of equivalence into a plain test of equality, by putting both sides into canonical form first, is what programmers call **normalising**.
    - question:
        id: order-transitive
        type: order
        system: s2
        prompt: Put the lines of this proof in order. It shows that congruence modulo $m$ is transitive.
        steps:
          - "Suppose $a \\equiv b$ and $b \\equiv c$ modulo $m$."
          - "By the definition, $a - b = mk$ and $b - c = ml$ for some integers $k$ and $l$."
          - "Adding the two equations, $a - c = mk + ml$."
          - "So $a - c = m(k + l)$, where $k + l$ is an integer."
          - "Hence $m$ divides $a - c$, that is, $a \\equiv c$ modulo $m$."
        explanation: Assume the hypothesis of transitivity, unpack both congruences with their own letters, add so that $b$ cancels, and pack the result back into the definition of congruence.
    - text: |
        **Arithmetic on classes.** Classes modulo $m$ can be added and multiplied, as a clock adds hours: 9 o'clock plus 5 hours is 2 o'clock, and $[9] + [5] = [14] = [2]$ modulo 12. That arithmetic, on which a processor's integers and all of modern cryptography rest, has a lesson of its own in the discrete mathematics cluster, [[f3.modular-arithmetic]]. One idea from it is needed here. The class $[9]$ is also $[21]$, and $[5]$ is also $[-7]$, so a rule that works on classes by way of representatives must give the same answer whichever representatives are picked. A rule with that property is called **well defined**, and the property has to be proved.

        Not every operation on classes is well defined. Try to define "the numerator" of a rational number. $\tfrac{1}{2}$ and $\tfrac{2}{4}$ are the same number and have different numerators. So "the numerator of a rational number" means nothing until a canonical form, lowest terms, has been fixed. Whenever a function is defined on things that have many names, ask whether its value depends on the name.

        **Fractions, properly.** You can now say what a rational number **is**. Take all pairs $(p, q)$ of integers with $q \ne 0$, and call $(p, q)$ and $(r, s)$ equivalent when $ps = qr$. That is the cross-multiplication test for $\tfrac{p}{q} = \tfrac{r}{s}$, written without division. It is an equivalence relation, and a rational number is an equivalence **class**: the fraction $\tfrac{1}{2}$ is the whole pile $\{(1, 2), (2, 4), (3, 6), (-1, -2), \dots\}$. The rules you learned for adding and multiplying fractions are well-defined operations on these classes. That is why $\tfrac{1}{2} + \tfrac{1}{3}$ and $\tfrac{2}{4} + \tfrac{3}{9}$ come to the same thing.

        This way of building new objects, taking a set, declaring some of its members equivalent, and treating each class as a single thing, is one of the main construction methods of mathematics. The integers modulo $m$, the rationals and the real numbers are all made this way, and so are the hours on a clock face.

        **When sameness fails.** Return to the sensor readings. "Differs by at most 1" is reflexive and symmetric and not transitive, so it has no classes, and no amount of care in the code will produce a consistent grouping. The same holds for every "approximately equal": `math.isclose`, "within a tolerance", "similar enough". These are fine for comparing two given values. They cannot be used as a key for grouping, for removing duplicates, or for looking things up in a dictionary. To group noisy readings you must first **choose a key function**, such as rounding to the nearest whole number, and group by that. Rounding gives a true equivalence relation. It also has the cost you would expect: 1.49 and 1.51 fall into different classes, although they are closer than 1.51 and 2.49, which fall into the same one. There is no way round that. It is the price of transitivity.
    - question:
        id: which-fails
        type: choice
        system: s2
        prompt: |
          On the set of all real numbers, define $x \sim y$ to mean $xy > 0$. Is it an equivalence relation?
        options:
          - "Yes."
          - "No. It is not reflexive, because $0 \\sim 0$ is false."
          - "No. It is not symmetric."
          - "No. It is not transitive."
        answer: 1
        explanation: |
          $0 \times 0 = 0$, which is not greater than 0, so 0 is not related to itself. It is symmetric, since $xy = yx$, and transitive: if $xy > 0$ and $yz > 0$ then $x$, $y$, $z$ are all non-zero with the same sign. One element spoils it, and the degenerate element at that. On the **non-zero** reals it is an equivalence relation, with two classes, the positive numbers and the negative numbers.
    - text: |
        **Order.** The relations that failed symmetry in the table, $\le$ and "divides", are not failed notions of sameness. They are the other great kind of relation: they put things in order. What they have in place of symmetry is its opposite. A relation $\preceq$ on $A$ is **antisymmetric** if

        $$\forall a, b \in A,\; (a \preceq b \land b \preceq a) \Rightarrow a = b.$$

        Two different things never come before each other. A relation that is reflexive, antisymmetric and transitive is a **partial order**, and a set together with a partial order is a **partially ordered set**, or **poset**.

        - $\le$ on numbers is a partial order: if $a \le b$ and $b \le a$, then $a = b$.
        - $\subseteq$ on the subsets of a set is a partial order. That $A \subseteq B$ and $B \subseteq A$ give $A = B$ is exactly how [[f2.sets-and-set-operations]] proved two sets equal.
        - "Divides" on the positive integers is a partial order. If $a \mid b$ and $b \mid a$, then $b = ak$ and $a = bl$ for positive integers $k$ and $l$, so $a = akl$, so $kl = 1$, and both are 1. On all the integers it is **not** antisymmetric: $2 \mid -2$ and $-2 \mid 2$, but $2 \ne -2$.
        - "Must be done before, or is the same task as" on the tasks of a project. This course is ordered in that way: a concept comes before every concept that needs it, and the route you are following is one listing of that order.

        Equality is the only relation that is both an equivalence relation and a partial order, since symmetry and antisymmetry together allow $a \sim b$ only when $a = b$.

        **Partial, because some pairs are never compared.** Two elements are **comparable** if $a \preceq b$ or $b \preceq a$. Under $\le$ every two numbers are comparable, and an order like that is called a **total order**: it lines the whole set up in a single row. Under $\subseteq$, the sets $\{1\}$ and $\{2\}$ are **incomparable**, since neither is inside the other. Under "divides", 2 and 3 are incomparable. That is what "partial" means, and a total order is simply a partial order with no incomparable pairs.

        Python shows the difference. For numbers, `a <= b or b <= a` is always `True`. For sets, `<=` means $\subseteq$, and `{1} <= {2}` and `{2} <= {1}` are both `False`. Sorting assumes a total order. Ask Python to sort a list of sets and it returns some arrangement without complaint, but the arrangement depends on the order you started with, because a list of sets has no sorted order to find.

        **Least and minimal.** In a poset an element $m$ is **minimal** if nothing else lies below it: there is no $x \ne m$ with $x \preceq m$. It is the **least** element if it lies below everything: $m \preceq x$ for every $x$. In a total order the two ideas are the same. In a partial order they come apart. Take $\{2, 3, 4, 6, 12\}$ under "divides". Both 2 and 3 are minimal, since nothing else in the set divides either of them, and neither is least, since 2 does not divide 3. A least element, when there is one, is the only minimal element. And 12 is the **greatest** element, since everything in the set divides it.

        **Listing a partial order.** Can the elements of a finite poset always be written in one row, so that whenever $a \preceq b$ with $a \ne b$, $a$ comes first? They can. A finite poset always has a minimal element: start anywhere and keep stepping to something strictly below, and since nothing can be met twice, the steps run out. So write down a minimal element, remove it, and repeat with what is left. Each element is written only after everything below it has gone. For the tasks of a project this is a schedule that never starts a task before its prerequisites, and for this course it is a route. There are usually many such listings, one for each way of breaking ties between incomparable elements. The procedure is called a **topological sort**, and the algorithms cluster makes it fast: [[s3.topological-sort]].
    - question:
        id: which-is-a-partial-order
        type: choice
        system: s2
        prompt: |
          Which of these is a partial order?
        options:
          - '"Divides" on the positive integers'
          - '"Divides" on all the integers'
          - '$<$ on the real numbers'
          - '"Differs by at most 1" on the real numbers'
        answer: 0
        explanation: |
          A partial order must be reflexive, antisymmetric and transitive. "Divides" on the positive integers is all three. On all the integers it fails antisymmetry, because $2$ and $-2$ divide each other. $<$ is transitive and antisymmetric (vacuously, since $a < b$ and $b < a$ never both hold) but not reflexive: $1 < 1$ is false. "Differs by at most 1" is symmetric, which an order cannot be unless it is equality, and it is not even transitive.
  formal:
    - text: |
        A **relation** on a set $A$ is a predicate on ordered pairs of elements of $A$, written $a \sim b$.

        | Property | Definition |
        | --- | --- |
        | reflexive | $\forall a \in A,\ a \sim a$ |
        | symmetric | $\forall a, b \in A,\ a \sim b \Rightarrow b \sim a$ |
        | transitive | $\forall a, b, c \in A,\ (a \sim b \land b \sim c) \Rightarrow a \sim c$ |

        An **equivalence relation** is a relation with all three properties. The **equivalence class** of $a$ is $[a] = \{x \in A : x \sim a\}$, and any element of a class is a **representative** of it.

        A **partition** of $A$ is a collection of non-empty subsets of $A$, pairwise disjoint, whose union is $A$.

        **Theorem.** The equivalence classes of an equivalence relation on $A$ form a partition of $A$, and $[a] = [b]$ exactly when $a \sim b$. Conversely, for any partition of $A$, "lies in the same block as" is an equivalence relation whose classes are the blocks.

        **Kernel of a function.** For any function $f : A \to B$, the relation "$f(a) = f(b)$" is an equivalence relation on $A$.

        **Congruence.** For an integer $m \ge 1$: $\ a \equiv b \pmod{m}$ means $m \mid (a - b)$, equivalently that $a$ and $b$ leave the same remainder on division by $m$. It is an equivalence relation with exactly $m$ classes, $[0], [1], \dots, [m - 1]$.

        An operation defined on classes by means of representatives is **well defined** if its result does not depend on the representatives chosen.

        **Order.** A relation $\preceq$ on $A$ is **antisymmetric** if $\forall a, b \in A,\ (a \preceq b \land b \preceq a) \Rightarrow a = b$. A **partial order** is reflexive, antisymmetric and transitive. Elements $a$ and $b$ are **comparable** if $a \preceq b$ or $b \preceq a$, and a **total order** is a partial order in which every two elements are comparable.

        $m$ is **minimal** if no $x \ne m$ has $x \preceq m$, and **least** if $m \preceq x$ for every $x \in A$. A least element is unique and is the only minimal element. Every finite non-empty poset has a minimal element, and its elements can be listed so that each comes after every element below it: a **topological sort**.
  drill:
    - text: Seconds each. For each property, look for the counterexample before you believe it.
    - question:
        id: drill-less-than
        type: choice
        system: s1
        prompt: |
          Which of the three properties does "$<$" on the real numbers have?
        options: ["Reflexive only", "Symmetric only", "Transitive only", "All three"]
        answer: 2
        explanation: |
          $1 < 1$ is false, and $1 < 2$ does not give $2 < 1$. But $a < b$ and $b < c$ do give $a < c$.
    - question:
        id: drill-birthday
        type: choice
        system: s1
        prompt: |
          Is "has the same birthday as" an equivalence relation on a group of people?
        options: ["Yes", "No, it is not reflexive", "No, it is not symmetric", "No, it is not transitive"]
        answer: 0
        explanation: It is "same value of a function", the function that gives each person a birthday. Any relation of that form is an equivalence relation.
    - question:
        id: drill-near
        type: choice
        system: s1
        prompt: |
          "Lives within 10 km of" on a set of people. Which property fails?
        options: ["Reflexivity", "Symmetry", "Transitivity", "None"]
        answer: 2
        explanation: A may live 8 km from B and B 8 km from C, with A and C 16 km apart. Every "is near" relation fails in this way.
    - question:
        id: drill-congruent
        type: choice
        system: s1
        prompt: |
          Which statement is true?
        options: ["$17 \\equiv 3 \\pmod{5}$", "$17 \\equiv 2 \\pmod{5}$", "$17 \\equiv 5 \\pmod{2}$", "Both the second and the third"]
        answer: 3
        explanation: |
