concept: f2.propositions-and-connectives
minutes: 100
claim: You can tell a proposition from other sentences, combine propositions with not, and, or, implies and if-and-only-if, work out any truth table, say exactly when an implication is false, tell an implication from its converse and its contrapositive, and use De Morgan's laws to negate a compound statement.
recalls: [f1.summation-notation, s1.testing-with-pytest]
uses: [f1.arithmetic-and-geometric-series, f1.exponents-and-exponential-growth, f1.inequalities, s0.booleans-and-conditionals, s0.loops, s0.functions, s0.lists-and-tuples, s0.reading-errors-and-debugging, s1.comprehensions-and-iterators, s1.generators-and-context-managers]
leads: [f2.boolean-algebra, f2.quantifiers-and-their-negation, f2.direct-proof, f2.contrapositive-and-contradiction]
bridges:
  s1.testing-with-pytest: |
    You have written `and`, `or` and `not` in conditions since your first `if`, and in the last lesson every test was an `assert` of a condition. Until now they were tools. Here they become the subject: exactly what makes a compound statement true or false. The last lesson also ended at the limit of testing. A program can check a claim on as many cases as you like, and never on all of them. Settling a claim about every case takes an argument, and logic is the grammar that arguments are written in.
starter: |
  # Scratch space. Every combination of two truth values, and what "and" and "or" make of them.
  for p in [True, False]:
      for q in [True, False]:
          print(p, q, p and q, p or q)
parts:
  recall:
    - text: |
        Two lessons point here. [[f1.summation-notation]] ended the algebra cluster with a definition that no program could check: a sequence converges to $L$ if **for every** tolerance **there is** a point from which all the terms stay within that tolerance of $L$. And [[s1.testing-with-pytest]] ended the Python cluster at the edge of testing, with a formula that gave a prime forty times and then failed. Three quick pulls, and then the question that joins them.
  puzzle:
    - text: |
        Four cards lie on a table. Every card has a **number** on one side and a **colour** on the other. You can see only the upper sides:

        $$\boxed{\;8\;} \qquad \boxed{\;3\;} \qquad \boxed{\text{blue}} \qquad \boxed{\text{red}}$$

        Somebody makes a claim about these four cards:

        > If a card has an even number on one side, then its other side is blue.

        **Which cards must you turn over to find out whether the claim is true?** Turn over as few as possible. Decide before reading on.

        This puzzle was set by the psychologist Peter Wason in 1966, and it has been given to many thousands of people since. Most choose the 8 and the blue card. Fewer than one person in ten gets it right, and that holds for university students as well as for everyone else.

        The right answer is the **8 and the red card**. The 8 is clear enough: if its back is not blue, the claim is broken. The blue card is the trap. Suppose you turn it over and find a 3. Has the claim been broken? No. The claim says what even cards must have on the back. It says nothing at all about what odd cards have, and nothing that forbids a blue card from carrying an odd number. Whatever is behind the blue card, the claim survives. So turning it over is a waste.

        The red card is the one almost everybody leaves alone. But if there is an even number behind it, then here is a card with an even number whose other side is not blue, and the claim is false.

        Now the same puzzle in different clothes. You are checking a bar for people who are breaking the rule "if you are drinking beer, you must be over 18". You see four people: one drinking beer, one drinking lemonade, one who is 40, one who is 16. Whom do you check? Everyone gets this right: the beer drinker and the 16-year-old. Nobody bothers the 40-year-old to see what is in the glass.

        The two puzzles have exactly the same shape. Something in the first wording leads the mind astray, and it leads the same way every time: we quietly read "if even then blue" as though it also said "if blue then even". **What exactly does "if … then …" claim? When is such a claim false?** Almost every theorem in mathematics is an if-then statement, and so is almost every guarantee a program gives. If nine people in ten misread the form, the form needs a precise definition.
  intuition:
    - text: |
        Think of "if $P$ then $Q$" as a **promise**. A mother says to her son: "If you score 90 in the examination, I will buy you a bicycle." There are four ways things can turn out.

        | He scores 90 | She buys the bicycle | Was the promise broken? |
        | --- | --- | --- |
        | yes | yes | no, it was kept |
        | yes | no | **yes** |
        | no | yes | no |
        | no | no | no |

        Only the second row makes her a liar. In the third row he scored 70 and she bought the bicycle anyway: generous, but no promise was broken, since she never said what she would do if he fell short. In the fourth row he fell short and got nothing, and again nobody can complain.

        So a promise is broken in exactly one situation: **the condition was met and the consequence did not follow**. In every other situation the promise stands. That is all "if $P$ then $Q$" will mean. It is false when $P$ is true and $Q$ is false, and true otherwise.

        The figure shows this for two statements $P$ and $Q$, along with the other ways of combining them that this lesson builds. Switch $P$ and $Q$ between true and false, and watch the column headed $P \Rightarrow Q$, which is the symbol for "if $P$ then $Q$". Find the one setting that makes it false. Then set $P$ to false and try both values of $Q$.
    - figure: truth-table
      props: { p: true, q: true }
    - text: |
        Go back to the cards with this in hand. The claim is broken only by a card that is **even and not blue**. Which of the four cards could turn out to be such a card? The 8 could: it is even, and its back might not be blue. The red card could: it is not blue, and its back might be even. The 3 cannot, whatever is behind it, because it is not even. The blue card cannot, whatever is behind it, because it is blue. You check exactly the cards that could be the breaking case.

        The rest of the lesson builds this up from the beginning: what kind of sentence can be true or false at all, the five ways of combining such sentences, and a mechanical method, the truth table, that settles any question about them by trying every case. That method is one you already own. It is exhaustive testing.
  derivation:
    - text: |
        **Propositions.** A **proposition** is a sentence that is either true or false. Not both, and not neither.

        | Sentence | Proposition? |
        | --- | --- |
        | $2 + 2 = 4$ | yes, and true |
        | $2 + 2 = 5$ | yes, and false |
        | Every even number greater than 2 is a sum of two primes | yes, though nobody knows which |
        | Is 7 prime? | no: a question |
        | Add the two numbers | no: a command |
        | $x > 3$ | not yet: it depends on $x$ |

        Two rows deserve a comment. A false sentence is still a proposition. Being a proposition is about having a truth value, not about the value being "true". And the third row, Goldbach's conjecture, has been open since 1742. It is certainly either true or false, which makes it a proposition, although no person can yet say which.

        The last row is the interesting one. "$x > 3$" becomes a proposition as soon as $x$ is given a value: with $x = 5$ it is true, with $x = 1$ false. It is really a **function** that takes a number and returns a truth value. Such a thing is called a **predicate**, and in Python you have written many: `def is_big(x): return x > 3`. Predicates are the subject of the lesson after next. This lesson deals with whole propositions, named by letters such as $P$ and $Q$.

        The two **truth values** are written T and F here. In Python they are `True` and `False`, and a proposition is a Boolean expression.

        **Not.** The **negation** of $P$, written $\neg P$ and read "not $P$", is true exactly when $P$ is false.

        | $P$ | $\neg P$ |
        | --- | --- |
        | T | F |
        | F | T |

        Negating twice brings you back: $\neg\neg P$ has the same truth value as $P$. In Python, `not p`.

        **And.** The **conjunction** $P \land Q$, read "$P$ and $Q$", is true exactly when both are true. One false part spoils it.

        **Or.** The **disjunction** $P \lor Q$, read "$P$ or $Q$", is true when **at least one** is true. This is the **inclusive** or: it is true when both are true as well. Everyday speech often means the other kind. "Tea or coffee?" expects one answer, not both. Mathematics always means the inclusive kind, and so does Python's `or`. A requirement that reads "the applicant has a degree or five years of experience" is not failed by somebody who has both. When exactly one is wanted, the word is **exclusive or**, and it has to be said aloud.

        | $P$ | $Q$ | $P \land Q$ | $P \lor Q$ |
        | --- | --- | --- | --- |
        | T | T | T | T |
        | T | F | F | T |
        | F | T | F | T |
        | F | F | F | F |

        A table like this is a **truth table**. It lists every possible combination of truth values of the letters, one per row, and gives the value of the compound statement in each. With two letters there are $2 \times 2 = 4$ rows. With three there are 8, and with $n$ there are $2^n$: each new letter doubles the table. A truth table is a test suite that leaves nothing out. Where a test of a numerical function can only ever sample its inputs, a statement built from $n$ propositions has finitely many inputs, and all of them can be tried. Two nested loops over `[True, False]`, as in the starter, print a truth table.

        The two symbols are easy to mix up. $\land$ points up like the letter A of **a**nd without its bar, and $\lor$ opens up like a cup that catches whatever either side pours in. In a few lessons you will meet two symbols for sets, $\cap$ and $\cup$, shaped the same way for the same reason.

        **Implies.** The **implication** $P \Rightarrow Q$ is read "if $P$ then $Q$" or "$P$ implies $Q$". $P$ is its **hypothesis** and $Q$ its **conclusion**. By the promise:

        | $P$ | $Q$ | $P \Rightarrow Q$ |
        | --- | --- | --- |
        | T | T | T |
        | T | F | **F** |
        | F | T | T |
        | F | F | T |

        The last two rows trouble everybody at first. Why should "if $P$ then $Q$" be called **true** when $P$ is false? Would "unknown" or "not applicable" not be more honest?

        Here is the argument that settles it. Take a statement that everyone agrees is true for every whole number $n$:

        $$\text{if } n \text{ is divisible by 4, then } n \text{ is even.}$$

        If it is true for every $n$, it must be true for each particular $n$. Try $n = 8$: divisible by 4, and even. That is row one. Try $n = 6$: not divisible by 4, but even. That is row three, false hypothesis and true conclusion, and the statement had better count as true here, or it would not be true for every $n$. Try $n = 7$: not divisible by 4 and not even, row four. Again it must count as true. The only thing that could ever make the statement false is a number that is divisible by 4 and yet odd, which is row two, and there is no such number.

        So the table is forced on us. If implications with a false hypothesis were anything but true, no general statement of the form "for every $n$, if … then …" could be true, and those are the statements mathematics is made of. An implication with a false hypothesis is called **vacuously true**: true because it was never put to the test. You have met this before: `all([])` is `True` in Python for exactly this reason. A promise about every member of an empty list has no member to break it.

        Notice what an implication does **not** say. It does not say that $P$ is true. It does not say that $Q$ is true. It does not say that $P$ causes $Q$, or that the two have anything to do with each other: "if $2 + 2 = 5$ then Delhi is in India" is a true implication, by row three. An implication only rules out one combination, $P$ true with $Q$ false.

        Python has no operator for implication, and does not need one. Look at the table: $P \Rightarrow Q$ is false only when $P$ is true and $Q$ false, so it is true exactly when $P$ is false **or** $Q$ is true. That gives

        $$P \Rightarrow Q \quad\text{has the same table as}\quad \neg P \lor Q,$$

        and in Python you write `(not p) or q`.
    - question:
        id: implication-false-when
        type: choice
        system: s2
        prompt: |
          A library promises: "If you return the book late, you pay a fine." Which of these would show that the promise, as a statement, was **false**?
        options:
          - "A reader returns a book on time and pays no fine."
          - "A reader returns a book on time and is made to pay a fine all the same."
          - "A reader returns a book late and pays no fine."
          - "A reader returns a book late and pays a fine."
        answer: 2
        explanation: |
          $P$ is "the book is late" and $Q$ is "a fine is paid". The implication is false only when $P$ is true and $Q$ is false: late, and no fine. The second option may be unfair, but it does not contradict the statement, which says nothing about books returned on time. Feeling that it does is the same mistake as turning over the blue card.
    - text: |
        **If and only if.** The **biconditional** $P \Leftrightarrow Q$, read "$P$ if and only if $Q$", is true when $P$ and $Q$ have the **same** truth value: both true, or both false. It says the implication runs both ways, $(P \Rightarrow Q) \land (Q \Rightarrow P)$. In Python, for Booleans, it is `p == q`. Mathematicians abbreviate it to "iff".

        | $P$ | $Q$ | $P \Rightarrow Q$ | $Q \Rightarrow P$ | $P \Leftrightarrow Q$ |
        | --- | --- | --- | --- | --- |
        | T | T | T | T | T |
        | T | F | F | T | F |
        | F | T | T | F | F |
        | F | F | T | T | T |

        Look at the middle two columns. They differ, in rows two and three. This is the fact the card puzzle turns on.

        **Converse and contrapositive.** From the implication $P \Rightarrow Q$, three others can be made by swapping and negating.

        | Name | Form | For "if it is a square, it is a rectangle" |
        | --- | --- | --- |
        | the implication | $P \Rightarrow Q$ | if it is a square, it is a rectangle |
        | its **converse** | $Q \Rightarrow P$ | if it is a rectangle, it is a square |
        | its **inverse** | $\neg P \Rightarrow \neg Q$ | if it is not a square, it is not a rectangle |
        | its **contrapositive** | $\neg Q \Rightarrow \neg P$ | if it is not a rectangle, it is not a square |

        The first is true and the second is false: a 2 by 3 rectangle is no square. So **an implication and its converse are different statements**, and the truth of one tells you nothing about the other. "If a series converges, its terms shrink to 0" is true, and its converse is false, as the harmonic series showed. Confusing the two is the commonest error in all of reasoning, and it is what sends people to the blue card.

        The fourth row is true, and that is not luck. Work out the table of $\neg Q \Rightarrow \neg P$. It is false only when its hypothesis $\neg Q$ is true and its conclusion $\neg P$ is false, which means $Q$ false and $P$ true. That is the very same row in which $P \Rightarrow Q$ is false. The two tables agree in all four rows:

        $$P \Rightarrow Q \quad\text{has the same table as}\quad \neg Q \Rightarrow \neg P.$$

        **An implication and its contrapositive always stand or fall together.** The card claim "if even then blue" is the same claim as "if not blue then not even", and read that way, turning over the red card is obvious. The bar rule "if beer then over 18" is the same as "if not over 18 then not beer", which is why everybody checks the 16-year-old. You will use this constantly: when a statement is hard to prove as it stands, prove its contrapositive.

        The inverse, in turn, is the contrapositive of the converse, so those two stand or fall together as well. The four statements come in two pairs.

        **Necessary and sufficient.** There are many ways to say $P \Rightarrow Q$ in English, and proofs use them all.

        | Phrase | Means |
        | --- | --- |
        | if $P$ then $Q$ | $P \Rightarrow Q$ |
        | $P$ is **sufficient** for $Q$ | $P \Rightarrow Q$ |
        | $Q$ is **necessary** for $P$ | $P \Rightarrow Q$ |
        | $P$ **only if** $Q$ | $P \Rightarrow Q$ |
        | $Q$ if $P$ | $P \Rightarrow Q$ |
        | $Q$ whenever $P$ | $P \Rightarrow Q$ |
        | $P$ is necessary and sufficient for $Q$ | $P \Leftrightarrow Q$ |

        "Sufficient" means enough: being divisible by 4 is enough to make a number even. "Necessary" means cannot be done without: being even is necessary for being divisible by 4, since a number that is not even has no chance. Shrinking terms are necessary for a series to converge and not sufficient. That one sentence is the whole of the divergence test and its limits.

        "Only if" is the phrase that trips people. "You can vote only if you are 18" does not promise every 18-year-old a vote. It says that if you can vote then you are 18. The word "if" by itself introduces the hypothesis, and "only if" introduces the conclusion.

        **Logical equivalence.** Two compound statements are **logically equivalent**, written $\equiv$, when they have the same truth value in every row of the truth table: whatever the letters stand for, the two are true together and false together. You have just seen two equivalences:

        $$P \Rightarrow Q \;\equiv\; \neg P \lor Q, \qquad P \Rightarrow Q \;\equiv\; \neg Q \Rightarrow \neg P.$$

        An equivalence is to logic what an identity such as $(a + b)^2 = a^2 + 2ab + b^2$ is to algebra: a licence to replace one form by the other anywhere. And it can be checked completely, by comparing two columns.

        **De Morgan's laws.** How do you negate an "and"? Say a form is accepted when "the name is filled in **and** the age is filled in". When is it rejected? Not only when both are missing. It is rejected as soon as **either** is missing:

        $$\neg(P \land Q) \;\equiv\; \neg P \lor \neg Q.$$

        And the negation of "it is raining **or** it is cold" is "it is not raining **and** it is not cold":

        $$\neg(P \lor Q) \;\equiv\; \neg P \land \neg Q.$$

        These are **De Morgan's laws**: to negate, negate each part **and swap** the connective. Check the first by table.

        | $P$ | $Q$ | $P \land Q$ | $\neg(P \land Q)$ | $\neg P$ | $\neg Q$ | $\neg P \lor \neg Q$ |
        | --- | --- | --- | --- | --- | --- | --- |
        | T | T | T | F | F | F | F |
        | T | F | F | T | F | T | T |
        | F | T | F | T | T | F | T |
        | F | F | F | T | T | T | T |

        The fourth and seventh columns agree. You will meet these laws again in a few lessons, for sets, where "and" becomes the members two sets share, "or" the members of either, and "not" the members left out. The algebra of sets and the algebra of propositions will turn out to be one algebra in two notations.

        In code this is a daily matter. `not (a and b)` may be rewritten `(not a) or (not b)`, and **never** `(not a) and (not b)`. Getting this wrong while tidying a condition is a classic bug, and you will repair one below.

        **Negating an implication.** What is the negation of "if $P$ then $Q$"? Not another implication. An implication fails in one way, so

        $$\neg(P \Rightarrow Q) \;\equiv\; P \land \neg Q.$$

        You can also get there by algebra: $\neg(\neg P \lor Q) \equiv \neg\neg P \land \neg Q \equiv P \land \neg Q$, using De Morgan and then the double negation. To deny "if you work hard you will pass", you do not say "if you work hard you will fail". You point to somebody who worked hard **and** did not pass. The denial of a promise is a broken case. This is why one counterexample is enough to refute a general claim, and why the card puzzle asks you to hunt for a card that is even and not blue.

        **Always true, never true.** A compound statement that is true in every row is a **tautology**. $P \lor \neg P$ is one: either it is raining or it is not. A statement that is false in every row is a **contradiction**. $P \land \neg P$ is one. Two statements are equivalent exactly when joining them with $\Leftrightarrow$ gives a tautology.

        **Valid steps.** Logic exists so that from statements known to be true, new ones can be drawn that are certain to be true. Two steps do nearly all the work.

        - **Modus ponens.** From $P \Rightarrow Q$ and $P$, conclude $Q$. The promise was made and the condition was met.
        - **Modus tollens.** From $P \Rightarrow Q$ and $\neg Q$, conclude $\neg P$. This is modus ponens applied to the contrapositive.

        And two steps that look just like them are **invalid**, however natural they feel.

        - **Affirming the consequent.** From $P \Rightarrow Q$ and $Q$, concluding $P$. "If it rained, the road is wet. The road is wet. So it rained." A burst pipe wets roads too. This uses the converse.
        - **Denying the antecedent.** From $P \Rightarrow Q$ and $\neg P$, concluding $\neg Q$. "If it rained, the road is wet. It did not rain. So the road is dry." This uses the inverse.

        The names are Latin and old, and you need not remember them. What matters is the test that tells a valid step from an invalid one: a step is valid when there is **no row** of the truth table in which everything you started from is true and your conclusion is false. For affirming the consequent there is such a row, $P$ false and $Q$ true. The road is wet and it did not rain.

        A program that fails a test tells you by modus tollens that it has a bug: if the program were correct the test would pass, and it did not pass. A program that passes its tests tells you much less. To conclude "so it is correct" is to affirm the consequent.
    - question:
        id: fix-de-morgan
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `can_ship(order)` decides whether an order may be sent. An order may be sent when it is paid **and** in stock. A colleague found `not (not paid or not in_stock)` hard to read and rewrote the function to return early when the order is **not** allowed to go. The rewrite now blocks only the orders that are both unpaid and out of stock, and lets through an order that is paid but out of stock. Fix the condition.
        starter: |
          def can_ship(order):
              paid = order["paid"]
              in_stock = order["in_stock"]
              if not paid and not in_stock:
                  return False
              return True

          print(can_ship({"paid": True, "in_stock": False}))
        solution: |
          def can_ship(order):
              paid = order["paid"]
              in_stock = order["in_stock"]
              if not paid or not in_stock:
                  return False
              return True

          print(can_ship({"paid": True, "in_stock": False}))
        tests: |
          assert can_ship({"paid": True, "in_stock": True}) is True, "Paid and in stock: it may be sent"
          assert can_ship({"paid": True, "in_stock": False}) is False, "Paid but out of stock: it may not be sent. The negation of 'paid and in stock' is 'not paid OR not in stock'."
          assert can_ship({"paid": False, "in_stock": True}) is False, "In stock but unpaid: it may not be sent"
          assert can_ship({"paid": False, "in_stock": False}) is False, "Unpaid and out of stock: it may not be sent"
        wrong:
          - "def can_ship(order):\n    paid = order[\"paid\"]\n    in_stock = order[\"in_stock\"]\n    if not paid:\n        return False\n    return True\n\nprint(can_ship({\"paid\": True, \"in_stock\": False}))\n"
          - "def can_ship(order):\n    paid = order[\"paid\"]\n    in_stock = order[\"in_stock\"]\n    if not (paid or in_stock):\n        return False\n    return True\n\nprint(can_ship({\"paid\": True, \"in_stock\": False}))\n"
          - "def can_ship(order):\n    paid = order[\"paid\"]\n    in_stock = order[\"in_stock\"]\n    if paid or in_stock:\n        return True\n    return False\n\nprint(can_ship({\"paid\": True, \"in_stock\": False}))\n"
        explanation: |
          The order is blocked when it is **not** the case that it is paid and in stock. By De Morgan, $\neg(P \land Q) \equiv \neg P \lor \neg Q$: not paid **or** not in stock. The rewrite negated each part and forgot to swap the connective, which gives $\neg P \land \neg Q$, the negation of "paid **or** in stock", a different rule. The four tests are the four rows of the truth table. For a condition on two Booleans, four tests are a proof.
  formal:
    - text: |
        A **proposition** is a sentence that is either true (T) or false (F). The **connectives** build compound propositions from simpler ones.

        | Name | Symbol | True exactly when | Python |
        | --- | --- | --- | --- |
        | negation | $\neg P$ | $P$ is false | `not p` |
        | conjunction | $P \land Q$ | both are true | `p and q` |
        | disjunction | $P \lor Q$ | at least one is true | `p or q` |
        | implication | $P \Rightarrow Q$ | $P$ is false or $Q$ is true | `(not p) or q` |
        | biconditional | $P \Leftrightarrow Q$ | $P$ and $Q$ have the same value | `p == q` |

        | $P$ | $Q$ | $\neg P$ | $P \land Q$ | $P \lor Q$ | $P \Rightarrow Q$ | $P \Leftrightarrow Q$ |
        | --- | --- | --- | --- | --- | --- | --- |
        | T | T | F | T | T | T | T |
        | T | F | F | F | T | F | F |
        | F | T | T | F | T | T | F |
        | F | F | T | F | F | T | T |

        A compound of $n$ propositions has a truth table of $2^n$ rows. Two compounds are **logically equivalent** ($\equiv$) if they agree in every row. A **tautology** is true in every row, and a **contradiction** is false in every row.

        | Law | Statement |
        | --- | --- |
        | Double negation | $\neg\neg P \equiv P$ |
        | De Morgan | $\neg(P \land Q) \equiv \neg P \lor \neg Q$ and $\neg(P \lor Q) \equiv \neg P \land \neg Q$ |
        | Implication as a disjunction | $P \Rightarrow Q \equiv \neg P \lor Q$ |
        | Contrapositive | $P \Rightarrow Q \equiv \neg Q \Rightarrow \neg P$ |
        | Negated implication | $\neg(P \Rightarrow Q) \equiv P \land \neg Q$ |
        | Biconditional | $P \Leftrightarrow Q \equiv (P \Rightarrow Q) \land (Q \Rightarrow P)$ |
        | Distribution | $P \land (Q \lor R) \equiv (P \land Q) \lor (P \land R)$ and $P \lor (Q \land R) \equiv (P \lor Q) \land (P \lor R)$ |

        The **converse** of $P \Rightarrow Q$ is $Q \Rightarrow P$, and its **inverse** is $\neg P \Rightarrow \neg Q$. Neither is equivalent to $P \Rightarrow Q$. They are equivalent to each other.

        "$P$ is **sufficient** for $Q$", "$Q$ is **necessary** for $P$" and "$P$ **only if** $Q$" all mean $P \Rightarrow Q$.

        **Valid inferences.** Modus ponens: from $P \Rightarrow Q$ and $P$, infer $Q$. Modus tollens: from $P \Rightarrow Q$ and $\neg Q$, infer $\neg P$. An inference is valid when no assignment of truth values makes all its premises true and its conclusion false.
  drill:
    - text: Seconds each. For an implication, look for the one broken row, true then false.
    - question:
        id: drill-and
        type: choice
        system: s1
        prompt: |
          $P$ is true and $Q$ is false. What is $P \land Q$?
        options: ["True", "False", "It depends on what P and Q say"]
        answer: 1
        explanation: A conjunction needs both parts true.
    - question:
        id: drill-or
        type: choice
        system: s1
        prompt: |
          $P$ is true and $Q$ is true. What is $P \lor Q$?
        options: ["True", "False", "It depends on what P and Q say"]
        answer: 0
        explanation: The mathematical "or" is inclusive. It is true when at least one part is true, and both is at least one.
    - question:
        id: drill-implies-ff
        type: choice
        system: s1
        prompt: |
          $P$ is false and $Q$ is false. What is $P \Rightarrow Q$?
        options: ["True", "False", "Neither"]
        answer: 0
