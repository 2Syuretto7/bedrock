  work:
    - text: Slower now. When a statement confuses you, name its parts with letters and find the row that would break it.
    - question:
        id: work-cards
        type: choice
        system: s2
        prompt: |
          Every card has a letter on one side and a number on the other. The claim is: "If a card has a vowel on one side, then it has an odd number on the other." You see four cards showing **A**, **K**, **7** and **4**. Which must you turn over to test the claim?
        options: ["A and 7", "A and 4", "A only", "All four"]
        answer: 1
        explanation: |
          The claim is broken only by a card with a vowel **and** a number that is not odd. The A might be such a card, and so might the 4. The K cannot be, whatever its number, and the 7 cannot be, whatever its letter. The contrapositive says it directly: if the number is even, the letter is not a vowel, so check the even card. Turning over the 7 is affirming the consequent.
    - question:
        id: work-necessary-sufficient
        type: choice
        system: s2
        prompt: |
          For a whole number $n$, how is "$n$ is divisible by 10" related to "$n$ is even"?
        options:
          - "It is necessary but not sufficient."
          - "It is sufficient but not necessary."
          - "It is necessary and sufficient."
          - "It is neither."
        answer: 1
        explanation: |
          Divisible by 10 implies even, so it is sufficient: it is enough. It is not necessary, because 4 is even without being divisible by 10. Turned round, being even is necessary for being divisible by 10 and not sufficient.
    - question:
        id: work-which-inference
        type: choice
        system: s2
        prompt: |
          "If the model has overfitted, then its training loss is much lower than its validation loss." You observe that the training loss **is** much lower than the validation loss. What follows by logic alone?
        options:
          - "The model has overfitted."
          - "The model has not overfitted."
          - "Nothing about overfitting follows. Concluding that it has overfitted would affirm the consequent."
          - "The statement is false."
        answer: 2
        explanation: |
          You have $P \Rightarrow Q$ and $Q$. That is the form of the invalid inference. Other things can open a gap between the two losses, such as validation data drawn from a different source. What would follow validly is the other direction: if the gap were **not** there, modus tollens would give "it has not overfitted". Much sloppy diagnosis in machine learning is this one fallacy.
    - question:
        id: write-implies-table
        type: code
        mode: write
        system: s2
        prompt: |
          Write `truth_table(f)`. It takes a function `f` of two Booleans and returns the list of its four rows as tuples `(p, q, f(p, q))`, in the usual order: `(True, True)`, `(True, False)`, `(False, True)`, `(False, False)`. Also write `implies(p, q)`, the implication $p \Rightarrow q$. The program then prints the table of `implies`, one row per line.
        starter: |
          def implies(p, q):
              # Replace the next line with your own.
              return True

          def truth_table(f):
              # Replace the next line with your own.
              return []

          for row in truth_table(implies):
              print(row)
        solution: |
          def implies(p, q):
              return (not p) or q

          def truth_table(f):
              values = [True, False]
              return [(p, q, f(p, q)) for p in values for q in values]

          for row in truth_table(implies):
              print(row)
        tests: |
          assert implies(True, True) is True, "True implies True is True"
          assert implies(True, False) is False, "True implies False is the one false row"
          assert implies(False, True) is True, "A false hypothesis makes the implication true"
          assert implies(False, False) is True, "A false hypothesis makes the implication true"
          assert truth_table(implies) == [(True, True, True), (True, False, False), (False, True, True), (False, False, True)], "The table of implies, in the order TT, TF, FT, FF"
          assert truth_table(lambda p, q: p and q) == [(True, True, True), (True, False, False), (False, True, False), (False, False, False)], "truth_table should work for any function of two Booleans, here 'and'"
          assert truth_table(lambda p, q: p != q) == [(True, True, False), (True, False, True), (False, True, True), (False, False, False)], "truth_table should work for exclusive or"
          assert output.splitlines() == ["(True, True, True)", "(True, False, False)", "(False, True, True)", "(False, False, True)"], "The program should print the four rows of implies"
        wrong:
          - "def implies(p, q):\n    return p and q\n\ndef truth_table(f):\n    values = [True, False]\n    return [(p, q, f(p, q)) for p in values for q in values]\n\nfor row in truth_table(implies):\n    print(row)\n"
          - "def implies(p, q):\n    return (not p) or q\n\ndef truth_table(f):\n    values = [False, True]\n    return [(p, q, f(p, q)) for p in values for q in values]\n\nfor row in truth_table(implies):\n    print(row)\n"
          - "def implies(p, q):\n    return (not q) or p\n\ndef truth_table(f):\n    values = [True, False]\n    return [(p, q, f(p, q)) for p in values for q in values]\n\nfor row in truth_table(implies):\n    print(row)\n"
          - "def implies(p, q):\n    return (not p) or q\n\ndef truth_table(f):\n    values = [True, False]\n    return [(p, q, implies(p, q)) for p in values for q in values]\n\nfor row in truth_table(implies):\n    print(row)\n"
        explanation: |
          `implies` is the equivalence $P \Rightarrow Q \equiv \neg P \lor Q$ written in Python. `truth_table` is a comprehension with two `for` clauses, which runs through the pairs in exactly the order of two nested loops. Because it takes the function as an argument, the same four lines tabulate any connective at all.
    - question:
        id: write-equivalent
        type: code
        mode: write
        system: s2
        prompt: |
          Write `equivalent(f, g)` for two functions of **three** Booleans. It returns `True` if `f` and `g` give the same value for every one of the eight combinations of inputs, and `False` otherwise. The program uses it to check one of the distributive laws and to test a tempting false one.
        starter: |
          def equivalent(f, g):
              # Replace the next line with your own.
              return True

          left = lambda p, q, r: p and (q or r)
          right = lambda p, q, r: (p and q) or (p and r)
          tempting = lambda p, q, r: (p and q) or r
          print(equivalent(left, right), equivalent(left, tempting))
        solution: |
          def equivalent(f, g):
              values = [True, False]
              return all(f(p, q, r) == g(p, q, r) for p in values for q in values for r in values)

          left = lambda p, q, r: p and (q or r)
          right = lambda p, q, r: (p and q) or (p and r)
          tempting = lambda p, q, r: (p and q) or r
          print(equivalent(left, right), equivalent(left, tempting))
        tests: |
          assert equivalent(lambda p, q, r: p and (q or r), lambda p, q, r: (p and q) or (p and r)) is True, "and distributes over or"
          assert equivalent(lambda p, q, r: p or (q and r), lambda p, q, r: (p or q) and (p or r)) is True, "or distributes over and"
          assert equivalent(lambda p, q, r: p and (q or r), lambda p, q, r: (p and q) or r) is False, "p and (q or r) differs from (p and q) or r when p is False and r is True"
          assert equivalent(lambda p, q, r: not (p and q), lambda p, q, r: (not p) or (not q)) is True, "De Morgan's law holds whatever r is"
          assert equivalent(lambda p, q, r: True, lambda p, q, r: not (p and q and r)) is False, "These differ in exactly one row, all three True. Every row must be checked."
          assert equivalent(lambda p, q, r: False, lambda p, q, r: not (p or q or r)) is False, "These differ in exactly one row, all three False. Every row must be checked."
          assert equivalent(lambda p, q, r: r, lambda p, q, r: r) is True, "A function is equivalent to itself"
          assert equivalent(lambda p, q, r: r, lambda p, q, r: q) is False, "The third input must be varied as well as the second"
          assert output.strip() == "True False", "The program should print True False"
        wrong:
          - "def equivalent(f, g):\n    values = [True, False]\n    return any(f(p, q, r) == g(p, q, r) for p in values for q in values for r in values)\n\nprint(True, False)\n"
          - "def equivalent(f, g):\n    values = [True, False]\n    return all(f(p, q, True) == g(p, q, True) for p in values for q in values)\n\nprint(True, False)\n"
          - "def equivalent(f, g):\n    return f(True, True, True) == g(True, True, True) and f(False, False, False) == g(False, False, False)\n\nprint(True, False)\n"
          - "def equivalent(f, g):\n    values = [True, False]\n    for p in values:\n        for q in values:\n            for r in values:\n                return f(p, q, r) == g(p, q, r)\n\nprint(True, False)\n"
        explanation: |
          Logical equivalence means agreement in **every** row, which is exactly what `all` over the eight combinations says. Using `any` would accept two statements that agree somewhere, and nearly any two do. The program prints `True False`: the distributive law holds, and the tempting form without the second `p` fails, in the rows where `p` is false and `r` is true. Eight rows are few. For a statement of 40 propositions the table has about a million million rows, and exhaustive checking stops being possible. That wall is where proof takes over from testing.
    - question:
        id: fix-valid-inference
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `valid(premises, conclusion)` is meant to decide whether an inference about two propositions is valid. `premises` is a list of functions of `(p, q)` and `conclusion` is one such function. The inference is valid when the conclusion is true in **every** row in which **all** the premises are true. The function wrongly reports that affirming the consequent is valid. Find the mistake and fix it.
        starter: |
          def valid(premises, conclusion):
              values = [True, False]
              for p in values:
                  for q in values:
                      if any(premise(p, q) for premise in premises) and not conclusion(p, q):
                          return False
              return True

          implication = lambda p, q: (not p) or q
          print(valid([implication, lambda p, q: p], lambda p, q: q))
          print(valid([implication, lambda p, q: q], lambda p, q: p))
        solution: |
          def valid(premises, conclusion):
              values = [True, False]
              for p in values:
                  for q in values:
                      if all(premise(p, q) for premise in premises) and not conclusion(p, q):
                          return False
              return True

          implication = lambda p, q: (not p) or q
          print(valid([implication, lambda p, q: p], lambda p, q: q))
          print(valid([implication, lambda p, q: q], lambda p, q: p))
        tests: |
          _imp = lambda p, q: (not p) or q
          assert valid([_imp, lambda p, q: p], lambda p, q: q) is True, "Modus ponens is valid: from P implies Q and P, infer Q"
          assert valid([_imp, lambda p, q: not q], lambda p, q: not p) is True, "Modus tollens is valid: from P implies Q and not Q, infer not P"
          assert valid([_imp, lambda p, q: q], lambda p, q: p) is False, "Affirming the consequent is invalid: P false and Q true makes both premises true and the conclusion false"
          assert valid([_imp, lambda p, q: not p], lambda p, q: not q) is False, "Denying the antecedent is invalid"
          assert valid([lambda p, q: p and q], lambda p, q: p) is True, "From P and Q, P follows"
          assert valid([lambda p, q: p or q], lambda p, q: p) is False, "From P or Q, P does not follow"
          assert valid([lambda p, q: p or q, lambda p, q: not p], lambda p, q: q) is True, "From P or Q and not P, Q follows"
          assert valid([], lambda p, q: p or not p) is True, "With no premises, a tautology still follows"
          assert output.split() == ["True", "False"], "The program should print True for modus ponens and False for affirming the consequent"
        wrong:
          - "def valid(premises, conclusion):\n    values = [True, False]\n    for p in values:\n        for q in values:\n            if all(premise(p, q) for premise in premises) and conclusion(p, q):\n                return True\n    return False\n\nprint(True)\nprint(False)\n"
          - "def valid(premises, conclusion):\n    values = [True, False]\n    for p in values:\n        for q in values:\n            if all(premise(p, q) for premise in premises) or not conclusion(p, q):\n                return False\n    return True\n\nprint(True)\nprint(False)\n"
          - "def valid(premises, conclusion):\n    values = [True, False]\n    for p in values:\n        for q in values:\n            if not conclusion(p, q):\n                return False\n    return True\n\nprint(True)\nprint(False)\n"
        explanation: |
          A row refutes an inference when **all** the premises hold in it and the conclusion does not. The starter used `any`, so a row with just one true premise was enough to count against an inference, and the answers came out wrong in both directions: for modus ponens the row $P$ true, $Q$ false has one true premise and a false conclusion, so the starter called a valid inference invalid. Note the shape of the function. It hunts for a counterexample and returns `True` only if none exists among all four rows. Validity is itself an implication, "if all the premises are true then the conclusion is true", checked in every row.
    - question:
        id: work-negate-compound
        type: choice
        system: s2
        prompt: |
          A request is accepted when "the user is logged in **and** (the user is an admin **or** the user owns the file)". Which describes exactly the requests that are **rejected**?
        options:
          - "The user is not logged in and is not an admin and does not own the file."
          - "The user is not logged in, or else is neither an admin nor the owner of the file."
          - "The user is not logged in or is not an admin or does not own the file."
          - "The user is not logged in and is either not an admin or not the owner."
        answer: 1
        explanation: |
          With $L$, $A$, $O$ for the three parts, the rule is $L \land (A \lor O)$. Negate from the outside in. De Morgan on the "and" gives $\neg L \lor \neg(A \lor O)$, and De Morgan on the inner "or" gives $\neg L \lor (\neg A \land \neg O)$. The first option would let an anonymous admin through, and the third would reject an admin who does not own the file.
    - question:
        id: work-tautology
        type: choice
        system: s2
        prompt: |
          Which of these is a tautology, true whatever $P$ and $Q$ are?
        options:
          - "$(P \\Rightarrow Q) \\Rightarrow (Q \\Rightarrow P)$"
          - "$(P \\land (P \\Rightarrow Q)) \\Rightarrow Q$"
          - "$(P \\lor Q) \\Rightarrow P$"
          - "$(P \\Rightarrow Q) \\land (P \\land \\neg Q)$"
        answer: 1
        explanation: |
          The second is modus ponens written as a single statement. It could only be false if $P$ and $P \Rightarrow Q$ were both true and $Q$ false, and those three cannot happen together. The first fails when $P$ is false and $Q$ true. The third fails in the same row. The fourth joins an implication with its own negation, so it is a contradiction, false in every row.
  connections:
    - text: |
        Every statement you will ever prove is built with these five connectives, and every proof is a chain of steps each of which is valid in the sense you just programmed: no way for the premises to hold and the conclusion to fail. The equivalences are the working tools. To prove an implication, you may prove its contrapositive. To disprove one, you exhibit a case with the hypothesis true and the conclusion false. To show an "if and only if", you prove two implications, one each way. Each of these moves gets a lesson of its own shortly: [[f2.direct-proof]], then [[f2.contrapositive-and-contradiction]].

        The same algebra runs through the engineering. Every `if` in a program evaluates a proposition, and De Morgan's laws are what let you rewrite a condition without changing what it does. A test is an implication, "if the code is correct, this assertion holds", used by modus tollens. A type hint is a promise of the same kind. The circuits inside a processor are built from gates that compute "and", "or" and "not" on voltages, and a neuron with suitable weights can compute any one of them, which was one of the first things ever shown about neural networks. The one connective a single neuron cannot compute is exclusive or. That discovery stalled the field for a decade, and layers were the way out.

        The equivalences you checked with truth tables, De Morgan's laws among them, are only a few of many. Taken together they form an algebra with laws as plain as those of arithmetic, in which a condition can be simplified the way an expression is, and in which every circuit in a computer is designed. That is the next lesson, [[f2.boolean-algebra]].

        Truth tables have a limit, though, and you hit it in the first table of this lesson. "$x > 3$" is not a proposition. Nor is "the term $a_n$ is within the tolerance of $L$". They are predicates, with a variable left open, and the statements that matter most say something about **all** values of the variable, or about the **existence** of one: for every tolerance, there is a point from which every term is close. No table can list infinitely many rows. The words "for every" and "there is" need their own symbols and their own rules, above all for negation, where De Morgan's laws return in a larger form. That is the lesson after next: [[f2.quantifiers-and-their-negation]].
