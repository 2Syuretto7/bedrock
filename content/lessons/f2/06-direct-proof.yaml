concept: f2.direct-proof
minutes: 100
claim: You can prove a statement of the form "for every x, if P(x) then Q(x)" directly, by taking an arbitrary x, assuming P(x), unpacking the definitions, computing, and packing the result back into Q(x), split such a proof into cases that cover everything, and spot the standard ways in which an attempted proof goes wrong.
recalls: [f2.relations-and-functions-between-sets, f2.quantifiers-and-their-negation]
uses: [f2.propositions-and-connectives, f2.sets-and-set-operations, f0.the-four-operations-and-order-of-operations, f0.powers-and-roots, f0.whole-numbers-and-place-value, f1.variables-and-expressions, f1.inequalities, s0.booleans-and-conditionals, s0.loops, s0.functions, s1.comprehensions-and-iterators, s1.testing-with-pytest]
leads: [f2.contrapositive-and-contradiction, f2.induction-and-strong-induction, f2.equivalence-relations-and-partial-orders]
starter: |
  # Scratch space. Square an odd number, take away 1, and divide by 8. Is anything ever left over?
  for n in range(1, 30, 2):
      print(n, n * n - 1, (n * n - 1) % 8)
parts:
  recall:
    - text: |
        [[f2.quantifiers-and-their-negation]] gave you $\forall$ and $\exists$, and one hard fact about them: a statement that begins "for every" cannot be established by trying cases when there are infinitely many, and Euler's formula showed that forty successes in a row can be followed by a failure. Then [[f2.relations-and-functions-between-sets]] asked you to follow several short proofs, that $3x - 4$ is injective and that a bijection has an inverse, without ever saying what a proof is. Three quick pulls before we do what testing cannot.
  puzzle:
    - text: |
        Here is a trick to try on a friend. "Think of any odd number. Square it. Take away 1. I have not seen your number, and I can tell you that what you have now is a multiple of 8."

        | Odd number | Squared | Minus 1 | Divided by 8 |
        | --- | --- | --- | --- |
        | 1 | 1 | 0 | 0 |
        | 3 | 9 | 8 | 1 |
        | 5 | 25 | 24 | 3 |
        | 7 | 49 | 48 | 6 |
        | 9 | 81 | 80 | 10 |
        | 11 | 121 | 120 | 15 |

        It works for these six. The starter program tries the first fifteen, and you could change the range and try the first million in a second or so. Every one of them works.

        Does that mean it **always** works? After the lesson on quantifiers you know to be careful. There are infinitely many odd numbers. A program that checks a million of them has left infinitely many unchecked, the same number as before it started. And a pattern that holds for a long time can break: $n^2 + n + 41$ was prime forty times in a row.

        Yet a mathematician will tell you, flatly, that the trick never fails. Not "has never been seen to fail". Never fails, for any odd number of any size, including numbers with more digits than there are atoms in the universe, which no computer will ever square. And she will not have checked any more cases than you have.

        **How can anyone be certain about infinitely many cases without looking at all of them?** What is this other way of knowing, and how is it done?
  intuition:
    - text: |
        You have had the answer in your hands since you first met algebra. When you wrote

        $$(a + b)^2 = a^2 + 2ab + b^2,$$

        you did not check it for $a = 1$, $b = 2$, and then for $a = 3$, $b = 7$, and so on. You multiplied out the brackets **with the letters still in**. The calculation never asked what $a$ and $b$ were, so it holds whatever they are. One calculation with letters did the work of infinitely many with numbers.

        A proof of a "for every" statement works the same way. It reasons about one object, called by a letter, about which **nothing is assumed except what the statement grants**. If the statement is about odd numbers, the letter stands for an odd number, and the only fact you may use about it is that it is odd. You may not use that it is 7, or that it is positive, or that it is small. Then whatever you manage to conclude holds for every odd number, because every odd number could have been the one the letter stood for.

        A program gives the same guarantee in its own way. The body of a function is written once, for a parameter `n` whose value is unknown while you write. If the body is right for an arbitrary `n`, the function is right for every call. A test checks one call. Reading the code and reasoning about `n` checks them all.

        So everything turns on that one question: **what exactly do you know about a number when all you know is that it is odd?** The feeling of "odd" is not enough to calculate with. What you need is the **definition**, and it hands you something concrete. An integer is odd when it is twice some integer, plus one:

        $$n = 2k + 1.$$

        Now there is a letter $k$ to do algebra on. Square it and take away 1:

        $$n^2 - 1 = (2k + 1)^2 - 1 = 4k^2 + 4k = 4k(k + 1).$$

        The trick is half explained already: the result is always a multiple of 4. And $k(k + 1)$ is the product of two neighbouring integers, one of which must be even, so that product carries another factor of 2. Four times an even number is a multiple of 8. That is the whole reason the trick works, and nothing in it depended on which odd number was chosen.

        This pattern, **unpack the definition, compute, pack it back up**, is called a direct proof. The rest of the lesson is about doing it carefully enough that nobody can doubt it.
  derivation:
    - text: |
        **Definitions are the raw material.** A proof can only use what words mean exactly. Here are the definitions this lesson works with. Each one is an existential statement, and that is what makes them usable: each hands you a new letter to calculate with.

        | Word | Definition |
        | --- | --- |
        | $n$ is **even** | there is an integer $k$ with $n = 2k$ |
        | $n$ is **odd** | there is an integer $k$ with $n = 2k + 1$ |
        | $a$ **divides** $b$, written $a \mid b$ | there is an integer $c$ with $b = ac$ |
        | $x$ is **rational** | there are integers $p$ and $q$, with $q \ne 0$, such that $x = \dfrac{p}{q}$ |

        Some remarks. By these definitions 0 is even, since $0 = 2 \times 0$, and $-3$ is odd, since $-3 = 2 \times (-2) + 1$. "$a$ divides $b$" says the same as "$b$ is a multiple of $a$" and "$a$ is a factor of $b$": $3 \mid 12$ because $12 = 3 \times 4$. Do not confuse the statement $3 \mid 12$, which is true or false, with the number $12 \div 3$. And "even" is just "$2 \mid n$".

        We also take as known one fact about the integers, which is division with remainder from the very first cluster: **every integer is either even or odd, and never both**. Dividing by 2 leaves a remainder of 0 or of 1.

        **The shape of a direct proof.** Nearly every theorem has the form

        $$\forall x \in D,\quad P(x) \Rightarrow Q(x).$$

        A **direct proof** of it has four moves.

        1. **Let $x$ be an arbitrary member of $D$, and assume $P(x)$.** The word "arbitrary" is a promise that you will use nothing about $x$ beyond the hypothesis. You do not need to consider the $x$ for which $P(x)$ is false: for those the implication is vacuously true.
        2. **Unpack.** Rewrite the hypothesis using the definitions. This gives you letters and equations.
        3. **Compute.** Use algebra and facts already proved to move towards the conclusion.
        4. **Pack.** Show that what you have reached matches the definition in $Q(x)$, and say so.

        **A first proof.** Read this one slowly. It is short, and every phrase in it is there for a reason.

        > **Theorem.** The sum of two even integers is even.
        >
        > **Proof.** Let $a$ and $b$ be even integers. By the definition of even, there are integers $k$ and $m$ with $a = 2k$ and $b = 2m$. Then
        >
        > $$a + b = 2k + 2m = 2(k + m).$$
        >
        > Since $k + m$ is an integer, $a + b$ is twice an integer. So $a + b$ is even, by the definition of even. $\blacksquare$

        First, the theorem has hidden quantifiers. In full it reads: for all integers $a$ and $b$, if $a$ is even and $b$ is even, then $a + b$ is even. "Let $a$ and $b$ be even integers" takes care of the "for all" and the hypothesis in one breath.

        Second, **two different letters**, $k$ and $m$. This is the commonest mistake in a first proof. The definition says that for $a$ there is *some* integer, and for $b$ there is *some* integer. Nothing says they are the same one. Write $a = 2k$ and $b = 2k$, and you have quietly assumed $a = b$, and proved only that the sum of an even number with itself is even. Each use of a "there is" gets a fresh letter.

        Third, the line "since $k + m$ is an integer". The definition of even demands twice **an integer**. $7 = 2 \times 3.5$ does not make 7 even. That the integers are closed under addition and multiplication is being used here, and a careful proof says so.

        Fourth, the last line returns to the definition. The proof ends when the conclusion has been reached in the exact form its definition requires. The square $\blacksquare$ marks the end. Older books write QED.

        Look at what the proof gives you beyond certainty. It is a **recipe**: hand it the witnesses $k$ and $m$ for $a$ and $b$, and it hands back the witness $k + m$ for $a + b$. For $a = 6 = 2 \times 3$ and $b = 10 = 2 \times 5$ it produces $16 = 2 \times 8$. A direct proof of this kind is a function from evidence for the hypothesis to evidence for the conclusion, and you could write it in Python.

        **Two more of the same shape.**

        > **Theorem.** The product of two odd integers is odd.
        >
        > **Proof.** Let $a$ and $b$ be odd integers. Then $a = 2j + 1$ and $b = 2k + 1$ for some integers $j$ and $k$. So
        >
        > $$ab = (2j + 1)(2k + 1) = 4jk + 2j + 2k + 1 = 2(2jk + j + k) + 1.$$
        >
        > Since $2jk + j + k$ is an integer, $ab$ is odd. $\blacksquare$

        Taking $b = a$ gives a fact we shall want in the next lesson: **if $n$ is odd, then $n^2$ is odd**.

        > **Theorem.** For all integers $a$, $b$ and $c$: if $a \mid b$ and $b \mid c$, then $a \mid c$.
        >
        > **Proof.** Let $a$, $b$, $c$ be integers with $a \mid b$ and $b \mid c$. By the definition of divides, there are integers $s$ and $t$ with $b = as$ and $c = bt$. Substituting the first into the second,
        >
        > $$c = bt = (as)t = a(st).$$
        >
        > Since $st$ is an integer, $a \mid c$. $\blacksquare$

        In each proof the hard thinking is done by the definition. Students often stare at "prove that $a \mid c$" with no idea where to begin. The way to begin is always the same: write down what the hypotheses **mean**, write down what the conclusion **means**, and look at the gap between them. Here the gap is "find an integer that multiplies $a$ to give $c$", and with $b = as$ and $c = bt$ on the page it is hard to miss.
    - question:
        id: order-even-plus-odd
        type: order
        system: s2
        prompt: Put the lines of this proof that the sum of an even integer and an odd integer is odd in order.
        steps:
          - "Let $a$ be an even integer and $b$ an odd integer."
          - "By the definitions, $a = 2k$ and $b = 2m + 1$ for some integers $k$ and $m$."
          - "Then $a + b = 2k + 2m + 1$."
          - "Factoring, $a + b = 2(k + m) + 1$."
          - "Since $k + m$ is an integer, $a + b$ is twice an integer, plus one."
          - "Therefore $a + b$ is odd, by the definition of odd."
        explanation: The proof names its objects and states the hypothesis, unpacks both definitions with different letters, computes, and then packs the result into the definition of the conclusion. The remark that $k + m$ is an integer must come before the conclusion that depends on it.
    - text: |
        **The trick, proved.** Now the puzzle, written out in full.

        > **Theorem.** If $n$ is an odd integer, then $8 \mid n^2 - 1$.
        >
        > **Proof.** Let $n$ be an odd integer, so $n = 2k + 1$ for some integer $k$. Then
        >
        > $$n^2 - 1 = (2k + 1)^2 - 1 = 4k^2 + 4k = 4k(k + 1).$$
        >
        > The integer $k$ is either even or odd. If $k$ is even, say $k = 2m$, then $4k(k + 1) = 8m(k + 1)$. If $k$ is odd, say $k = 2m + 1$, then $k + 1 = 2(m + 1)$ and $4k(k + 1) = 8k(m + 1)$. In both cases $n^2 - 1$ is 8 times an integer. So $8 \mid n^2 - 1$. $\blacksquare$

        The proof splits into two cases in the middle, and both arrive at the same place. That is allowed as long as the cases cover every possibility, and here they do, because every integer is even or odd. Notice also that the proof tells you **more** than the trick claimed. It gives the quotient: $\dfrac{n^2 - 1}{8} = \dfrac{k(k + 1)}{2}$. Look at the last column of the table in the puzzle: 0, 1, 3, 6, 10, 15. Those are the triangular numbers, $1 + 2 + \dots + k$. The proof explains the table, where the table could never have explained itself.

        **The logic of cases.** Suppose you want to prove $Q$, and you know that at least one of $P_1, P_2, \dots, P_m$ must hold. If you can prove each of

        $$P_1 \Rightarrow Q, \qquad P_2 \Rightarrow Q, \qquad \dots, \qquad P_m \Rightarrow Q,$$

        then $Q$ is proved. Whichever case is the true one, it leads to $Q$. A truth table confirms that $\bigl((P_1 \lor P_2) \land (P_1 \Rightarrow Q) \land (P_2 \Rightarrow Q)\bigr) \Rightarrow Q$ is a tautology.

        Two conditions, then. The cases must be **exhaustive**: $P_1 \lor P_2 \lor \dots \lor P_m$ must be known to be true. And **every** case must be proved. One unproved case and there is no proof. The cases need not exclude each other.

        > **Theorem.** For every integer $n$, the number $n^2 + n$ is even.
        >
        > **Proof.** Let $n$ be an integer. Then $n$ is even or $n$ is odd.
        >
        > *Case 1: $n$ is even.* Then $n = 2k$ for some integer $k$, and $n^2 + n = 4k^2 + 2k = 2(2k^2 + k)$, which is even.
        >
        > *Case 2: $n$ is odd.* Then $n = 2k + 1$ for some integer $k$, and $n^2 + n = (4k^2 + 4k + 1) + (2k + 1) = 2(2k^2 + 3k + 1)$, which is even.
        >
        > In both cases $n^2 + n$ is even. $\blacksquare$

        The format is worth copying exactly: say what the cases are and why they cover everything, label each, finish each, and close by saying that all are done. (There is a neater proof here: $n^2 + n = n(n + 1)$ is a product of two neighbours, one of which is even. That is also a proof by cases, lightly disguised.)

        **Division with remainder.** The general source of cases for integers is this fact, which you have used since the first cluster and which Python's `//` and `%` compute. The figure sorts the numbers from 0 to 17 by their remainder. Set the divisor to 3, and then to 4, and notice two things: every number is in some column, and no number is in two.

    - figure: remainder-classes
      props: { modulus: 3, number: 14 }
    - text: |
        > For every integer $n$ and every integer $d \ge 1$, there are **unique** integers $q$ and $r$ with
        >
        > $$n = dq + r \qquad\text{and}\qquad 0 \le r < d.$$

        $q$ is the quotient and $r$ the remainder. The statement has an existence part and a uniqueness part, and together they say that every integer falls into **exactly one** of the $d$ cases $r = 0, 1, \dots, d - 1$. For $d = 2$ these are "even" and "odd". For negative $n$ the remainder is still taken to be at least 0: $-7 = 3 \times (-3) + 2$, and Python agrees that `-7 % 3` is 2.

        > **Theorem.** The square of an integer leaves the remainder 0 or 1 on division by 3. It never leaves 2.
        >
        > **Proof.** Let $n$ be an integer. By division with remainder, $n = 3q$, $n = 3q + 1$ or $n = 3q + 2$ for some integer $q$.
        >
        > *Case 1: $n = 3q$.* Then $n^2 = 9q^2 = 3(3q^2)$, with remainder 0.
        >
        > *Case 2: $n = 3q + 1$.* Then $n^2 = 9q^2 + 6q + 1 = 3(3q^2 + 2q) + 1$, with remainder 1.
        >
        > *Case 3: $n = 3q + 2$.* Then $n^2 = 9q^2 + 12q + 4 = 3(3q^2 + 4q + 1) + 1$, with remainder 1.
        >
        > These cases cover every integer. $\blacksquare$

        Look at what this little theorem lets you say. The number 1,000,001 leaves the remainder 2 on division by 3, since its digits add up to 2. So it is **not a perfect square**, and you know that without computing any square root. A statement about infinitely many squares was settled by three calculations, each with a letter in it.

        The same game with 4 gives: a square leaves the remainder 0 or 1 on division by 4. So a sum of two squares leaves $0 + 0$, $0 + 1$ or $1 + 1$, that is, 0, 1 or 2, and **never 3**. No number of the form $4q + 3$, such as 7, 11, 19 or 1,000,003, is a sum of two squares. You can check a few by hand and feel how unobvious that was.

        **Working backwards, writing forwards.** How does one find a proof? Rarely in the order in which it is finally written. Here is an inequality that matters a great deal later on.

        > **Theorem.** For all real numbers $x \ge 0$ and $y \ge 0$, $\quad \dfrac{x + y}{2} \ge \sqrt{xy}$.

        The left side is the ordinary average of $x$ and $y$, the **arithmetic mean**. The right side is their **geometric mean**. Try $x = 2$ and $y = 8$: the left is 5 and the right is 4.

        On scratch paper, start from what is wanted and simplify it, to see what it rests on:

        $$\frac{x + y}{2} \ge \sqrt{xy} \quad\text{would follow from}\quad x + y - 2\sqrt{xy} \ge 0 \quad\text{which is}\quad \bigl(\sqrt{x} - \sqrt{y}\bigr)^2 \ge 0.$$

        And that last statement is certainly true, because the square of any real number is at least 0. So the path is found. But the scratch work is **not** the proof. It runs from the conclusion to a known truth, and the proof must run from known truths to the conclusion. Turn it round:

        > **Proof.** Let $x \ge 0$ and $y \ge 0$ be real numbers. Then $\sqrt{x}$ and $\sqrt{y}$ are real, and the square of a real number is never negative, so
        >
        > $$0 \le \bigl(\sqrt{x} - \sqrt{y}\bigr)^2 = x - 2\sqrt{x}\sqrt{y} + y = x + y - 2\sqrt{xy}.$$
        >
        > Adding $2\sqrt{xy}$ to both sides gives $2\sqrt{xy} \le x + y$, and dividing by 2 gives $\sqrt{xy} \le \dfrac{x + y}{2}$. $\blacksquare$

        Why insist on the direction? Because deriving something true from a statement proves nothing about the statement. Watch:

        $$1 = -1 \quad\Longrightarrow\quad 1^2 = (-1)^2 \quad\Longrightarrow\quad 1 = 1.$$

        Each step is valid, and the end is true. The start is still false. From a false statement, true ones can follow. That is row three of the truth table of implication. An argument that begins with the conclusion and reaches a truth has shown "conclusion $\Rightarrow$ truth", and passing that off as a proof of the conclusion is **affirming the consequent**. The scratch work for the inequality could be turned round only because each of its steps happened to be reversible, and it is the reversed version that must be written, with each step checked in the forward direction.

        The proof also shows something the statement did not mention. The two means are equal exactly when $\bigl(\sqrt{x} - \sqrt{y}\bigr)^2 = 0$, which is when $x = y$.

        **Existence, directly.** A statement that begins $\exists$ is proved directly by producing a witness and checking it.

        > **Theorem.** There is an integer $n$ with $n^2 = n + 6$.
        >
        > **Proof.** Take $n = 3$. Then $n^2 = 9$ and $n + 6 = 9$. $\blacksquare$

        Nobody has to be told how the 3 was found. A proof must convince. It need not confess. For a universal statement a single example proves nothing, and for an existential statement it proves everything. Look at the first quantifier before you decide which kind of work is needed.

        **If and only if.** A statement $P \Leftrightarrow Q$ is two implications, and its proof has two parts, usually marked $(\Rightarrow)$ and $(\Leftarrow)$. Proving one direction and stopping is a common way to lose half the marks.

        **What a proof may use.** At each step, exactly four things: the hypotheses of the statement, the definitions of the words in it, results already proved, and the rules of logic and algebra. If you cannot say which of the four justifies a line, the line is a gap.

        **How proofs go wrong.** These are the standard failures, and you should learn to look for them in your own work first.

        | Failure | What it looks like |
        | --- | --- |
        | Proof by example | "It works for 3, 5 and 7, so it works for all odd numbers." |
        | Assuming the conclusion | The first line is the thing to be proved, and the last line is $0 = 0$. |
        | One letter for two things | $a = 2k$ and $b = 2k$ |
        | Proving the converse | Asked for $P \Rightarrow Q$, the argument starts from $Q$ and arrives at $P$. |
        | An unjustified step | Dividing by a quantity that might be 0. Taking a square root without thinking of the sign. |
        | Forgetting the domain | Calling $2 \times 3.5$ "twice an integer". |
    - question:
        id: flaw-same-letter
        type: choice
        system: s2
        prompt: |
          **Claim.** The sum of two odd integers is divisible by 4.

          **"Proof."** Let $a$ and $b$ be odd integers. Then $a = 2k + 1$ and $b = 2k + 1$ for some integer $k$. So $a + b = 4k + 2$, and … the writer then makes an arithmetic slip and concludes that 4 divides the sum.

          The claim is false: $1 + 5 = 6$. Leaving the slip aside, what is the first error in the argument?
        options:
          - "Odd integers do not have the form 2k + 1."
          - "The same letter k is used for both numbers, which assumes that a = b."
          - "The proof should have started from the conclusion."
          - "Letters cannot be used for arbitrary integers."
        answer: 1
        explanation: |
          Each "there is an integer" in a definition gives its own integer, which needs its own letter: $a = 2j + 1$ and $b = 2k + 1$. Then $a + b = 2(j + k + 1)$, which shows the sum is even, and that is all that is true. Using $k$ twice restricts the argument to the case $a = b$.
  formal:
    - text: |
        **Definitions.** For integers $n$, $a$, $b$ and a real number $x$:

        | Statement | Meaning |
        | --- | --- |
        | $n$ is even | $\exists k \in \mathbb{Z},\ n = 2k$ |
        | $n$ is odd | $\exists k \in \mathbb{Z},\ n = 2k + 1$ |
        | $a \mid b$ | $\exists c \in \mathbb{Z},\ b = ac$ |
        | $x$ is rational | $\exists p, q \in \mathbb{Z},\ q \ne 0 \text{ and } x = \dfrac{p}{q}$ |

        Every integer is even or odd, and none is both.

        **Direct proof of $\forall x \in D,\ P(x) \Rightarrow Q(x)$.** Let $x \in D$ be arbitrary and assume $P(x)$. Using only this assumption, definitions, earlier results and valid inferences, deduce $Q(x)$.

        **Direct proof of $\exists x \in D,\ P(x)$.** Name a particular $x \in D$ and verify $P(x)$.

        **Proof of $P \Leftrightarrow Q$.** Prove $P \Rightarrow Q$ and prove $Q \Rightarrow P$.

        **Proof by cases.** If $P_1 \lor P_2 \lor \dots \lor P_m$ holds and $P_i \Rightarrow Q$ for each $i$, then $Q$. The cases must be exhaustive and need not be exclusive.

        **Division with remainder.** For every integer $n$ and every integer $d \ge 1$ there are unique integers $q$, $r$ with $n = dq + r$ and $0 \le r < d$. So every integer has exactly one of the forms $dq, dq + 1, \dots, dq + (d - 1)$.

        **Results proved in this lesson.** For all integers:

        | Result | Witness given by the proof |
        | --- | --- |
        | even + even is even | $2k + 2m = 2(k + m)$ |
        | even + odd is odd | $2k + (2m + 1) = 2(k + m) + 1$ |
        | odd × odd is odd | $(2j + 1)(2k + 1) = 2(2jk + j + k) + 1$ |
        | $n$ odd $\Rightarrow$ $n^2$ odd | the case $j = k$ of the line above |
        | $a \mid b$ and $b \mid c$ $\Rightarrow$ $a \mid c$ | $b = as$, $c = bt$ give $c = a(st)$ |
        | $n$ odd $\Rightarrow$ $8 \mid n^2 - 1$ | $n^2 - 1 = 4k(k + 1)$ |

        **Arithmetic and geometric means.** For all real $x, y \ge 0$, $\ \dfrac{x + y}{2} \ge \sqrt{xy}$, with equality exactly when $x = y$.
  drill:
    - text: Seconds each. Most ask you to unpack a definition or to find the witness.
    - question:
        id: drill-odd-form
        type: numeric
        system: s1
        prompt: |
          $n = 2k + 1$ with $k = 7$. What is $n$?
        answer: "15"
        explanation: Twice 7, plus 1.
    - question:
        id: drill-odd-witness
        type: numeric
        system: s1
        prompt: |
          $-7$ is odd because $-7 = 2k + 1$ for some integer $k$. Which $k$?
        answer: "-4"
        explanation: |
          $2 \times (-4) + 1 = -7$. The definition works for negative numbers without change.
    - question:
        id: drill-divides-witness
        type: numeric
        system: s1
        prompt: |
          $7 \mid 91$ because $91 = 7c$ for some integer $c$. Which $c$?
        answer: "13"
        explanation: |
          $7 \times 13 = 91$.
    - question:
        id: drill-divides-direction
        type: choice
        system: s1
        prompt: |
          Which statement is true?
        options: ["$12 \\mid 3$", "$3 \\mid 12$", "$5 \\mid 12$", "$0 \\mid 12$"]
        answer: 1
        explanation: |
          $a \mid b$ means $b$ is a multiple of $a$: $12 = 3 \times 4$. The smaller number is usually on the left.
    - question:
        id: drill-zero-even
        type: choice
        system: s1
        prompt: |
          Is 0 even, by the definition?
        options: ["Yes, because 0 = 2 × 0", "No, 0 is neither even nor odd", "No, 0 is odd", "The definition does not apply to 0"]
        answer: 0
        explanation: 0 is twice the integer 0. A definition settles such questions without any appeal to feeling.
    - question:
        id: drill-first-line
        type: choice
        system: s1
        prompt: |
          What is the right first line of a direct proof of "if $n$ is even, then $n^2$ is even"?
        options:
          - "Suppose $n^2$ is even."
          - "Let $n = 4$, so that $n^2 = 16$."
          - "Let $n$ be an even integer, so $n = 2k$ for some integer $k$."
          - "Suppose $n$ is odd."
        answer: 2
        explanation: A direct proof takes an arbitrary object, assumes the hypothesis, and unpacks its definition. The first option assumes the conclusion, and the second is an example.
    - question:
        id: drill-square-even-witness
        type: choice
        system: s1
        prompt: |
          If $n = 2k$, then $n^2 = 4k^2$. To show that $n^2$ is even, it must be written as $2 \times (\text{an integer})$. Which integer?
        options: ["$k^2$", "$2k^2$", "$4k^2$", "$2k$"]
        answer: 1
        explanation: |
          $4k^2 = 2(2k^2)$, and $2k^2$ is an integer.
    - question:
        id: drill-is-it-proof
        type: choice
        system: s1
        prompt: |
          A program confirms that $n^2 - 1$ is divisible by 8 for every odd $n$ up to ten million. Has it proved the statement for all odd integers?
        options: ["Yes", "No: infinitely many cases remain unchecked", "Yes, if it also checks the negative ones", "Only if it ran without errors"]
        answer: 1
        explanation: Any finite check leaves infinitely many cases. It is good evidence, and a good reason to look for a proof, and it is not one.
    - question:
        id: drill-exists-proof
        type: choice
        system: s1
        prompt: |
          Which is a complete proof of "there is an integer $n$ with $n^2 - 5n + 6 = 0$"?
        options:
          - "Take $n = 2$: $4 - 10 + 6 = 0$."
          - "Let $n$ be an arbitrary integer."
          - "Take $n = 1$: $1 - 5 + 6 = 2$."
          - "It works for most values that have been tried."
        answer: 0
        explanation: An existential statement is proved by exhibiting one witness and checking it.
    - question:
        id: drill-means
        type: numeric
        system: s1
        prompt: |
          What is the geometric mean $\sqrt{xy}$ of $x = 4$ and $y = 9$?
        answer: "6"
        explanation: |
          $\sqrt{36}$. The arithmetic mean is 6.5, which is larger, as the theorem says.
    - question:
        id: predict-odd-witness
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def witness(j, k):
              return 2 * j * k + j + k

          j, k = 3, 5
          print((2 * j + 1) * (2 * k + 1), 2 * witness(j, k) + 1)
        output: "77 77"
        explanation: The two odd numbers are 7 and 11. The proof that odd times odd is odd says that the product is twice the witness, plus one, and the function computes that witness.
    - question:
        id: predict-check-many
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(all(((2 * k + 1) ** 2 - 1) % 8 == 0 for k in range(-50, 50)))
        output: "True"
        explanation: A hundred odd numbers, negative ones included, all pass. The proof already said they would.
  work:
    - text: Slower now. Write what the hypothesis means and what the conclusion means before anything else.
    - question:
        id: order-divides-sum
        type: order
        system: s2
        prompt: Put the lines of this proof in order. The theorem is that for all integers $a$, $b$, $c$, if $a \mid b$ and $a \mid c$ then $a \mid (b + c)$.
        steps:
          - "Let $a$, $b$ and $c$ be integers with $a \\mid b$ and $a \\mid c$."
          - "By the definition of divides, there are integers $s$ and $t$ with $b = as$ and $c = at$."
          - "Adding, $b + c = as + at$."
          - "Factoring out $a$, $b + c = a(s + t)$."
          - "Since $s + t$ is an integer, $a \\mid (b + c)$ by the definition of divides."
        explanation: Assume the hypotheses, unpack each with its own letter, compute, and pack the result back into the definition. The witness for the conclusion is $s + t$.
    - question:
        id: write-divides
        type: code
        mode: write
        system: s2
        prompt: |
          Write `divides(a, b)` for integers `a` and `b` by translating the **definition** literally: $a \mid b$ when there is an integer $c$ with $b = a \times c$. Search for the witness $c$ among the integers from $-\lvert b \rvert$ to $\lvert b \rvert$ inclusive, which is always enough. Do not use `%` or `/`.

          The definition gives a definite answer even when zero is involved, where the remainder operator would crash.
        starter: |
          def divides(a, b):
              # Replace the next line with your own.
              return False

          print(divides(3, 12), divides(12, 3), divides(0, 0), divides(0, 5))
        solution: |
          def divides(a, b):
              return any(a * c == b for c in range(-abs(b), abs(b) + 1))

          print(divides(3, 12), divides(12, 3), divides(0, 0), divides(0, 5))
        tests: |
          assert "%" not in source and "/" not in source, "Translate the definition: search for c. Do not use % or /."
          assert divides(3, 12) is True, "12 = 3 * 4"
          assert divides(12, 3) is False, "3 is not a multiple of 12"
          assert divides(3, -12) is True, "-12 = 3 * (-4). The witness may be negative."
          assert divides(-4, 12) is True, "12 = (-4) * (-3)"
          assert divides(5, 0) is True, "0 = 5 * 0, so every integer divides 0"
          assert divides(0, 0) is True, "0 = 0 * c for any c, so 0 divides 0 by the definition"
          assert divides(0, 5) is False, "0 * c is never 5"
          assert divides(1, 7) is True, "7 = 1 * 7. The witness may be as large as b itself."
          assert divides(7, 7) is True, "7 = 7 * 1"
          assert divides(-1, -9) is True, "-9 = (-1) * 9"
          assert divides(4, 6) is False, "6 is not a multiple of 4"
          assert output.strip() == "True False True False", "The program should print True False True False"
        wrong:
          - "def divides(a, b):\n    return any(a * c == b for c in range(0, abs(b) + 1))\n\nprint(True, False, True, False)\n"
          - "def divides(a, b):\n    return any(a * c == b for c in range(1, abs(b) + 1))\n\nprint(True, False, True, False)\n"
          - "def divides(a, b):\n    return any(a * c == b for c in range(-abs(b), abs(b)))\n\nprint(True, False, True, False)\n"
          - "def divides(a, b):\n    return any(b * c == a for c in range(-abs(a), abs(a) + 1))\n\nprint(True, False, True, False)\n"
        explanation: |
          The definition is an existential statement, so the code is `any` over candidate witnesses. Why is the range enough? If $b = ac$ with $b \ne 0$, then $c \ne 0$ and $a \ne 0$, so $\lvert a \rvert \ge 1$ and $\lvert c \rvert \le \lvert a \rvert \lvert c \rvert = \lvert b \rvert$. And if $b = 0$, then $c = 0$ is a witness. That little argument is itself a direct proof, and it is what entitles a finite search to decide a question about all integers. The usual shortcut `b % a == 0` is faster, and it raises an error for $a = 0$, a case in which the definition has a perfectly clear answer.
    - question:
        id: write-witness-functions
        type: code
        mode: write
        system: s2
        prompt: |
          A direct proof is a recipe for turning witnesses into a witness. Write the two recipes.

          - `odd_product(j, k)`: the two odd numbers are $2j + 1$ and $2k + 1$. Return the integer $q$ for which their product is $2q + 1$.
          - `eight_quotient(k)`: the odd number is $n = 2k + 1$. Return the integer $q$ for which $n^2 - 1 = 8q$.

          Each must be a formula in the witnesses it is given, taken from the proofs in this lesson. Do not multiply the odd numbers out and work backwards with division by 2 or by 8.
        starter: |
          def odd_product(j, k):
              # Replace the next line with your own.
              return 0

          def eight_quotient(k):
              # Replace the next line with your own.
              return 0

          print(odd_product(3, 5), eight_quotient(5))
        solution: |
          def odd_product(j, k):
              return 2 * j * k + j + k

          def eight_quotient(k):
              return k * (k + 1) // 2

          print(odd_product(3, 5), eight_quotient(5))
        tests: |
          assert "8" not in source.split("def eight_quotient")[1].split("print")[0], "eight_quotient should come from the proof, k(k + 1) / 2, not from dividing by 8"
          for _j in range(-6, 7):
              for _k in range(-6, 7):
                  assert (2 * _j + 1) * (2 * _k + 1) == 2 * odd_product(_j, _k) + 1, "For j = " + str(_j) + " and k = " + str(_k) + ", (2j + 1)(2k + 1) should equal 2q + 1. Expand the brackets and take out a factor of 2."
          for _k in range(-20, 21):
              _n = 2 * _k + 1
              assert _n * _n - 1 == 8 * eight_quotient(_k), "For k = " + str(_k) + ", n squared minus 1 should equal 8q, where n = 2k + 1. The proof gives n squared minus 1 = 4k(k + 1)."
              assert type(eight_quotient(_k)) is int, "The quotient must be an integer, not a float. Use // for the halving."
          assert output.strip() == "38 15", "The program should print 38 15"
        wrong:
          - "def odd_product(j, k):\n    return 2 * j * k + j + k\n\ndef eight_quotient(k):\n    return k * (k + 1)\n\nprint(38, 15)\n"
          - "def odd_product(j, k):\n    return 4 * j * k + 2 * j + 2 * k\n\ndef eight_quotient(k):\n    return k * (k + 1) // 2\n\nprint(38, 15)\n"
          - "def odd_product(j, k):\n    return 2 * j * k + j + k\n\ndef eight_quotient(k):\n    return k * (k + 1) / 2\n\nprint(38, 15)\n"
          - "def odd_product(j, k):\n    return j * k\n\ndef eight_quotient(k):\n    return k * (k + 1) // 2\n\nprint(38, 15)\n"
        explanation: |
          $(2j + 1)(2k + 1) = 2(2jk + j + k) + 1$, so the witness is $2jk + j + k$. And $n^2 - 1 = 4k(k + 1) = 8 \cdot \dfrac{k(k + 1)}{2}$, where the halving is exact because one of two neighbouring integers is even. The tests can only try a few hundred pairs. They are evidence that you copied the formulas correctly. The reason the formulas are right for every pair of integers is on the page above, and no test could supply it.
    - question:
        id: fix-chain-witness
        type: code
        mode: find-bug
        system: s2
        prompt: |
          The theorem says: if $a \mid b$ and $b \mid c$, then $a \mid c$. `chain_witness(a, b, c)` is given three integers with $a \mid b$ and $b \mid c$, with $a$ and $b$ not zero, and should return the integer $w$ with $c = a \times w$, built from the two witnesses as in the proof. For 3, 12 and 60 it should return 20. It returns 9. Fix it.
        starter: |
          def chain_witness(a, b, c):
              s = b // a
              t = c // b
              return s + t

          print(chain_witness(3, 12, 60))
        solution: |
          def chain_witness(a, b, c):
              s = b // a
              t = c // b
              return s * t

          print(chain_witness(3, 12, 60))
        tests: |
          assert chain_witness(3, 12, 60) == 20, "12 = 3 * 4 and 60 = 12 * 5, so 60 = 3 * (4 * 5)"
          assert chain_witness(2, 2, 2) == 1, "2 = 2 * 1 and 2 = 2 * 1, so the witness is 1 * 1"
          assert chain_witness(5, -10, 30) == 6, "-10 = 5 * (-2) and 30 = (-10) * (-3), so the witness is 6"
          assert chain_witness(5, -10, -30) == -6, "The witness may be negative"
          assert chain_witness(7, 7, 0) == 0, "0 = 7 * 0"
          for _a, _s, _t in [(4, 3, 5), (-2, 7, 1), (9, 1, -8), (1, 1, 1)]:
              assert _a * _s * _t == _a * chain_witness(_a, _a * _s, _a * _s * _t), "c should equal a times the witness"
        wrong:
          - "def chain_witness(a, b, c):\n    s = b // a\n    t = c // b\n    return t\n\nprint(chain_witness(3, 12, 60))\n"
          - "def chain_witness(a, b, c):\n    s = b // a\n    t = c // b\n    return abs(s * t)\n\nprint(chain_witness(3, 12, 60))\n"
          - "def chain_witness(a, b, c):\n    s = b // a\n    t = c // b\n    return s * t + 1\n\nprint(chain_witness(3, 12, 60))\n"
        explanation: |
          The proof substitutes $b = as$ into $c = bt$ and gets $c = (as)t = a(st)$. The witness is the **product** of the two witnesses. The starter added them. A proof read carefully tells you what the code should be, line by line: every "there is an integer" in the conclusion is produced by an explicit expression, and that expression is the return value.
    - question:
        id: flaw-assume-conclusion
        type: choice
        system: s2
        prompt: |
          **Claim.** For every real number $x$, $\ x^2 + 1 \ge 2x$.

          **Attempt.** "Suppose $x^2 + 1 \ge 2x$. Subtracting $2x$ gives $x^2 - 2x + 1 \ge 0$, that is, $(x - 1)^2 \ge 0$, which is true. Hence the claim holds."

          The claim is true. What is wrong with the attempt, and how is it repaired?
        options:
          - "Nothing is wrong. Reaching a true statement proves the claim."
          - "It starts by assuming what is to be proved. It is repaired by running it the other way: start from the true statement $(x - 1)^2 \\ge 0$, expand, and add $2x$ to both sides."
          - "It should have tried some values of x first."
          - "The claim cannot be proved, because x is not known."
        answer: 1
        explanation: |
          The attempt shows "claim $\Rightarrow$ something true", which proves nothing: $1 = -1$ also leads to the true statement $1 = 1$ after squaring. A proof must run from what is known to what is claimed. Here every step is reversible, so the repair is to write the steps in the opposite order: $(x - 1)^2 \ge 0$ for every real $x$, so $x^2 - 2x + 1 \ge 0$, so $x^2 + 1 \ge 2x$. The attempt is good scratch work and a bad proof.
    - question:
        id: work-rational-sum
        type: choice
        system: s2
        prompt: |
          To prove that the sum of two rational numbers is rational, you let $x = \dfrac{p}{q}$ and $y = \dfrac{r}{s}$ with $p, q, r, s$ integers and $q, s \ne 0$. Which line completes the proof correctly?
        options:
          - "$x + y = \\dfrac{p + r}{q + s}$, a ratio of integers."
          - "$x + y = \\dfrac{ps + rq}{qs}$, where $ps + rq$ and $qs$ are integers and $qs \\ne 0$ because neither $q$ nor $s$ is 0."
          - "$x + y = \\dfrac{ps + rq}{qs}$, which is a fraction."
          - "$x + y$ is rational because $x$ and $y$ are."
        answer: 1
        explanation: |
          The definition of rational asks for three things: an integer on top, an integer underneath, and the one underneath not zero. The second option delivers all three and says why. The first adds fractions wrongly. The third gets the algebra right and leaves the definition unchecked: the remark that $qs \ne 0$ is the step most often forgotten. The fourth restates the claim.
    - question:
        id: work-am-gm-use
        type: numeric
        system: s2
        prompt: |
          A rectangle has area 36. By the inequality of the arithmetic and geometric means applied to its two sides $x$ and $y$, what is the **smallest** possible perimeter $2(x + y)$?
        answer: "24"
        explanation: |
          $\dfrac{x + y}{2} \ge \sqrt{xy} = \sqrt{36} = 6$, so $x + y \ge 12$ and the perimeter is at least twice that. Equality holds exactly when $x = y = 6$: among rectangles of a given area, the square has the least perimeter. A proved inequality, together with its case of equality, solves an optimisation problem without any calculus.
    - question:
        id: write-residues
        type: code
        mode: write
        system: s2
        prompt: |
          For a formula `f` built from whole-number additions and multiplications of `n`, the remainder of `f(n)` on division by `m` depends only on the remainder of `n`. So the `m` cases $n = 0, 1, \dots, m - 1$ stand for all integers.

          Write `residues(f, m)`. It returns the **sorted list**, without repeats, of the remainders that `f(n)` leaves on division by `m` across those `m` cases. The program uses it to find which remainders a square can leave on division by 8.
        starter: |
          def residues(f, m):
              # Replace the next line with your own.
              return []

          print(residues(lambda n: n * n, 8))
        solution: |
          def residues(f, m):
              return sorted({f(n) % m for n in range(m)})

          print(residues(lambda n: n * n, 8))
        tests: |
          assert residues(lambda n: n * n, 3) == [0, 1], "A square leaves 0 or 1 on division by 3"
          assert residues(lambda n: n * n, 4) == [0, 1], "A square leaves 0 or 1 on division by 4"
          assert residues(lambda n: n * n, 8) == [0, 1, 4], "A square leaves 0, 1 or 4 on division by 8"
          assert residues(lambda n: n * n + n, 2) == [0], "n squared plus n is always even"
          assert residues(lambda n: n ** 3 - n, 6) == [0], "n cubed minus n is always a multiple of 6"
          assert residues(lambda n: n, 5) == [0, 1, 2, 3, 4], "n itself leaves every remainder"
          assert residues(lambda n: 2 * n + 1, 2) == [1], "2n + 1 is always odd"
          assert residues(lambda n: n * n * n, 7) == [0, 1, 6], "A cube leaves 0, 1 or 6 on division by 7"
          assert residues(lambda n: 7, 1) == [0], "Everything leaves the remainder 0 on division by 1"
          assert isinstance(residues(lambda n: n, 3), list), "Return a list"
          assert output.strip() == "[0, 1, 4]", "The program should print [0, 1, 4]"
        wrong:
          - "def residues(f, m):\n    return sorted({f(n) % m for n in range(1, m)})\n\nprint([0, 1, 4])\n"
          - "def residues(f, m):\n    return sorted(f(n) % m for n in range(m))\n\nprint([0, 1, 4])\n"
          - "def residues(f, m):\n    return sorted({f(n) for n in range(m)})\n\nprint([0, 1, 4])\n"
          - "def residues(f, m):\n    return sorted({f(n % m) for n in range(m)})\n\nprint([0, 1, 4])\n"
        explanation: |
          The set comprehension runs through the $m$ cases and keeps each remainder once, and `sorted` turns the set into an ordered list. This is a proof by cases carried out by machine, and it **is** a proof, given the argument that only the remainder of $n$ matters, because then the $m$ cases are all the cases there are. The output `[0, 1, 4]` says that a square never leaves 2, 3, 5, 6 or 7 on division by 8. One consequence: a sum of three squares never leaves 7, so numbers such as 7, 15, 23 and 31 are not sums of three squares.
  connections:
    - text: |
        A direct proof is the plainest kind there is, and it is the model for all the others: begin with what is given, unpack, compute, pack. It rests on an idea you will meet in every later part of this course, that to prove something for all objects of a kind you reason about one of them through its **definition** and nothing else. When linear algebra says "let $v$ be a vector in the null space", or analysis says "let $\varepsilon > 0$ be given", it is the same first move as "let $n$ be an odd integer".

        It is also how careful engineers read code. A test tells you what a function did on one input. Reading the body with the argument left as a letter tells you what it does on all of them, and that is what a code review is for. The claims that matter most about a learning system are universal ones: this update never increases the loss, this layer preserves the norm of its input, this estimator is unbiased for every distribution. Each is established by a calculation with the letters left in. The inequality of the means that you proved here is the two-number case of the inequality behind the cross-entropy loss, and the trick that proved it, "a square is never negative", is the most used single fact in the analysis of optimisation.

        Direct proof has a weakness, though, and you can feel it by trying this: prove that **if $n^2$ is even, then $n$ is even**. Start as taught: let $n^2$ be even, so $n^2 = 2k$. Now what? You want to say something about $n$, and all you can write is $n = \sqrt{2k}$, which leads nowhere. The hypothesis gives you too little to compute with. Yet the statement is certainly true. The way out is to stop pushing forwards and turn the statement round, using an equivalence you verified by truth table in the first lesson of this cluster. That is [[f2.contrapositive-and-contradiction]].
