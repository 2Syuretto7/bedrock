        options: ['$a\overline{b}c$', '$\overline{a}b\overline{c}$', '$ac$', '$a + \overline{b} + c$']
        answer: 0
        explanation: A minterm takes each input plain where it is 1 and barred where it is 0. $ac$ is also 1 in the row $a = b = c = 1$, so it picks out two rows.
