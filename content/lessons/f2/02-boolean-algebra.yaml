          - |
            uses = []

            def nand(x, y):
                uses.append((x, y))
                return not (x and y)

            def not_(x):
                return nand(x, x)

            def and_(x, y):
                return nand(nand(x, y), nand(x, y))

            def or_(x, y):
                return nand(not_(x), not_(y))

            for x in [False, True]:
                for y in [False, True]:
                    print(x, y, or_(x, y))
          - |
            uses = []

            def nand(x, y):
                uses.append((x, y))
                return not (x and y)

            def not_(x):
                return nand(x, x)

            def and_(x, y):
                return not_(nand(x, y))

            def or_(x, y):
                return not_(and_(not_(x), not_(y)))

            for x in [False, True]:
                for y in [False, True]:
                    print(x, y, or_(x, y))
          - |
            uses = []

            def nand(x, y):
                uses.append((x, y))
                return not (x and y)

            def not_(x):
                return nand(x, x)

            def and_(x, y):
                return nand(not_(x), not_(y))

            def or_(x, y):
                return not_(nand(x, y))

            for x in [False, True]:
                for y in [False, True]:
                    print(x, y, or_(x, y))
        explanation: |
          NOT is a NAND with both inputs tied together, because $\overline{xx} = \overline{x}$. AND is a NAND whose output is flipped back by that NOT. OR comes from De Morgan: $x + y = \overline{\overline{x}\,\overline{y}}$, so flip both inputs and NAND them. Writing `nand(nand(x, y), nand(x, y))` for AND gives the right answers with three gates, because it builds the same NAND twice. Building OR as NOT of the AND of the two NOTs is also correct, and costs five.
    - question:
        id: write-ripple-add
        type: code
        mode: write
        system: s2
        prompt: |
          `full_adder(a, b, c)` below is correct: it adds three bits and returns `(sum_bit, carry)`, and it records each use, as a chip has one adder for each bit. Write `add(x, y, width)`, which adds two whole numbers of `width` bits the way a processor does. Go bit by bit from the least significant, feeding bit `i` of `x`, bit `i` of `y` and the carry so far into a full adder, with a carry of 0 into the first. Return `(total, carry_out)`, where `total` is the number made of the `width` sum bits and `carry_out` is the carry out of the last adder. It must call `full_adder` exactly `width` times.
        starter: |
          adders = []

          def full_adder(a, b, c):
              adders.append((a, b, c))
              return a ^ b ^ c, (a & b) | (b & c) | (c & a)

          def add(x, y, width):
              # Replace the next line with your own.
              return 0, 0

          print(add(200, 100, 8))
        solution: |
          adders = []

          def full_adder(a, b, c):
              adders.append((a, b, c))
              return a ^ b ^ c, (a & b) | (b & c) | (c & a)

          def add(x, y, width):
              total = 0
              carry = 0
              for i in range(width):
                  s, carry = full_adder((x >> i) & 1, (y >> i) & 1, carry)
                  total |= s << i
              return total, carry

          print(add(200, 100, 8))
        tests: |
          assert add(5, 3, 4) == (8, 0), "0101 + 0011 = 1000, with no carry out of four bits"
          assert add(200, 100, 8) == (44, 1), "200 + 100 = 300 does not fit in 8 bits: the sum bits make 44 and the carry out, worth 256, is 1"
          assert add(255, 1, 8) == (0, 1), "255 + 1 carries through all eight columns and out of the top"
          assert add(0, 0, 8) == (0, 0), "0 + 0 = 0"
          assert add(1, 1, 1) == (0, 1), "One bit: 1 + 1 = binary 10"
          assert all(add(x, y, 4) == ((x + y) % 16, (x + y) // 16) for x in range(16) for y in range(16)), "Every pair of 4-bit numbers should add correctly"
          _start = len(adders)
          add(6, 3, 4)
          assert adders[_start] == (0, 1, 0), "The first adder gets bit 0 of each number, 0 and 1, and a carry in of 0"
          assert adders[_start + 1] == (1, 1, 0), "The second adder gets bit 1 of each number, 1 and 1, and the carry from the first, 0"
          _start = len(adders)
          add(12345, 54321, 16)
          assert len(adders) - _start == 16, "A 16-bit add should use exactly 16 full adders"
          assert output.strip() == "(44, 1)", "The program should print (44, 1)"
        wrong:
          - |
            adders = []

            def full_adder(a, b, c):
                adders.append((a, b, c))
                return a ^ b ^ c, (a & b) | (b & c) | (c & a)

            def add(x, y, width):
                total = 0
                carry = 0
                for i in range(width):
                    s, carry = full_adder((x >> i) & 1, (y >> i) & 1, 0)
                    total |= s << i
                return total, carry

            print(add(200, 100, 8))
          - |
            adders = []

            def full_adder(a, b, c):
                adders.append((a, b, c))
                return a ^ b ^ c, (a & b) | (b & c) | (c & a)

            def add(x, y, width):
                total = 0
                carry = 0
                for i in range(width):
                    s, carry = full_adder((x >> i) & 1, (y >> i) & 1, carry)
                    total |= s << (width - 1 - i)
                return total, carry

            print(add(200, 100, 8))
          - |
            adders = []

            def full_adder(a, b, c):
                adders.append((a, b, c))
                return a ^ b ^ c, (a & b) | (b & c) | (c & a)

            def add(x, y, width):
                return (x + y) % 2 ** width, (x + y) >> width

            print(add(200, 100, 8))
          - |
            adders = []

            def full_adder(a, b, c):
                adders.append((a, b, c))
                return a ^ b ^ c, (a & b) | (b & c) | (c & a)

            def add(x, y, width):
                total = 0
                carry = 0
                for i in range(width - 1):
                    s, carry = full_adder((x >> i) & 1, (y >> i) & 1, carry)
                    total |= s << i
                return total, carry

            print(add(200, 100, 8))
        explanation: |
          Each pass of the loop is one column of written addition. `(x >> i) & 1` picks out bit `i`, the full adder produces that column's sum bit and the carry for the next column, and `total |= s << i` puts the sum bit back in place `i`. The carry is the only thing passed from one column to the next. That is why the columns must be done in order, and why a long addition built this way is slow: the top bit cannot be known until a carry has had the chance to ripple all the way up. Using Python's own `+` gives the right numbers, but it is not the circuit, and the count of adders shows it.
  connections:
    - text: |
        Boolean algebra is the working mathematics of digital hardware. Every gate in a processor computes one of the functions of this lesson, and the software that turns a hardware design into a chip spends much of its effort on what you did by hand in the puzzle: finding a smaller formula with the same truth table, since every term saved is circuitry, power and delay saved. You will build gates from transistors in [[h1.logic-gates]]. In [[h1.adders-and-the-alu]] the full adder grows into the arithmetic unit of a processor, with a cleverer way of finding the carries than waiting for them to ripple.

        It is also the mathematics of the operators in [[h0.bitwise-operations-and-masks]]. `x & y`, `x | y`, `x ^ y` and `~x` apply this lesson's operations to every bit position at once, so a single instruction does 64 of them. Every law here is a law about masks: `x & ~x` is 0, `x | (x & y)` is `x`, and `x ^ x` is 0, which is why compilers often clear a register by taking its exclusive or with itself.

        The same laws will return in a third notation. In [[f2.sets-and-set-operations]], "and" becomes the members two sets share, "or" the members of either, "not" the members left out, 0 the empty set and 1 everything, and every law in the table above stays true. Machine learning has its own echo. A single artificial neuron is a threshold gate: it outputs 1 when a weighted sum of its inputs passes a threshold. With weights 1, 1 and 1 and threshold 2, it computes the majority function, the carry of a full adder. No choice of weights makes a single neuron compute exclusive or, the sum bit.

        The algebra has a limit, and it is the same as the truth table's. It handles statements built from a fixed, finite list of propositions. "Every term of the sequence is positive" speaks about infinitely many terms at once, and no finite product can say it. The next lesson adds the two symbols that can, "for all" and "there exists", and De Morgan's laws are waiting there in a larger form: [[f2.quantifiers-and-their-negation]].
