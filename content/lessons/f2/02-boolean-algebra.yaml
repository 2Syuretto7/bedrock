  work:
    - text: Slower now. Before you simplify, name each part with a letter. Before you trust a simplification, check it on every row.
    - question:
        id: work-simplify-implication
        type: choice
        system: s2
        prompt: |
          Simplify the sum of products $\overline{a}\,\overline{b} + \overline{a}b + ab$.
        options: ['$\overline{a} + b$', '$a + b$', '$\overline{a}$', '$\overline{a}b$']
        answer: 0
        explanation: |
          The first two minterms share $\overline{a}$: $\overline{a}(\overline{b} + b) = \overline{a} \cdot 1 = \overline{a}$. Then $\overline{a} + ab = \overline{a} + b$ by redundancy. The three minterms are the rows 00, 01 and 11, which are the rows where $a \Rightarrow b$ is true. So you have re-derived the last lesson's $P \Rightarrow Q \equiv \neg P \lor Q$ by algebra.
    - question:
        id: work-majority
        type: choice
        system: s2
        prompt: |
          A committee of three, $a$, $b$ and $c$, passes a motion when at least two vote yes. Which formula is 1 exactly when the motion passes?
        options: ['$ab + bc + ca$', '$a \oplus b \oplus c$', '$abc$', '$a + b + c$']
        answer: 0
        explanation: |
          "At least two" means some pair both voted yes, and there are three pairs. This is the majority function, the same formula as the carry of a full adder. $a \oplus b \oplus c$ is 1 for one yes vote, $abc$ needs all three, and $a + b + c$ needs only one.
    - question:
        id: work-parity-minterms
        type: numeric
        system: s2
        prompt: |
          Write $a \oplus b \oplus c$ as a sum of products, one minterm for each row in which it is 1. How many minterms are there?
        answer: "4"
        explanation: |
          It is 1 when an odd number of inputs are 1. Three rows have exactly one 1, and one row has all three, so there are 4 minterms: $a\overline{b}\,\overline{c} + \overline{a}b\overline{c} + \overline{a}\,\overline{b}c + abc$. Parity has no shorter sum of products. No two of its 1-rows differ in a single input, so no pair of minterms combines, and that is part of why exclusive or is expensive to build.
