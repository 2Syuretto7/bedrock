concept: f2.quantifiers-and-their-negation
minutes: 100
claim: You can read and write statements with "for every" and "there exists", decide them over a finite domain with all and any, negate any quantified statement mechanically, explain why the order of two different quantifiers matters, and write out exactly what it means for a sequence not to converge.
recalls: [f2.propositions-and-connectives, f2.boolean-algebra]
uses: [f1.functions-as-machines, f1.summation-notation, f1.arithmetic-and-geometric-series, f1.inequalities, s0.booleans-and-conditionals, s0.loops, s0.functions, s0.lists-and-tuples, s1.comprehensions-and-iterators, s1.generators-and-context-managers, s1.testing-with-pytest]
leads: [f2.sets-and-set-operations, f2.direct-proof]
starter: |
  # Scratch space. Is every number in the list positive? Is some number in it even?
  numbers = [3, 8, 5, 11]
  print(all(n > 0 for n in numbers))
  print(any(n % 2 == 0 for n in numbers))
parts:
  recall:
    - text: |
        [[f2.propositions-and-connectives]] gave you five connectives and the truth table, and [[f2.boolean-algebra]] turned the laws for rewriting and negating them into an algebra. Both stopped at the same wall. They handle statements built from a fixed, finite list of propositions, and "$x > 3$" is not one of those: it is true or false only once $x$ is known. Three quick pulls on the laws you will need again within minutes, in a larger form.
  puzzle:
    - text: |
        Here are two sentences about a building full of locks and a bunch of keys.

        > **(1)** For every lock there is a key that opens it.
        >
        > **(2)** There is a key that opens every lock.

        They use the same words: "every lock", "there is a key", "opens". Do they say the same thing?

        They do not. Sentence (1) is what any sensible building satisfies: no lock is without a key, though each lock may well have its own. Sentence (2) says that the building has a **master key**: one single key that opens the lot. A burglar cares a great deal about the difference.

        The only thing that changed between the two is the **order** of "for every" and "there is". In (1) the lock is named first and the key may then depend on it. In (2) the key is named first, and that one key must then cope with every lock.

        Now a second puzzle. What is the **opposite** of sentence (1)? Suppose a caretaker says (1) and you want to call him wrong. Which of these do you have to show?

        - (a) For every lock there is no key that opens it.
        - (b) For every lock there is a key that does not open it.
        - (c) There is a lock that no key opens.
        - (d) There is a lock and there is a key that does not open it.

        Only (c) is the denial. One lock with no key at all, and the caretaker is wrong. Statement (a) says far too much, that nothing opens anything. Statements (b) and (d) can be true while the caretaker is perfectly right: of course there are keys that do not fit a given lock.

        These are not word games. In [[f1.arithmetic-and-geometric-series]] you met this definition: a sequence converges to $L$ if **for every** tolerance **there is** a point from which **every** later term is within that tolerance of $L$. That is three of these phrases, stacked. To prove that a sequence converges you must know what the sentence demands. To prove that a sequence does **not** converge, as you will want to for $1, -1, 1, -1, \dots$, you must know exactly what the opposite of that sentence is. And if you swap the order of the first two phrases, you get a statement so strong that almost no sequence satisfies it.

        **How can "for every" and "there is" be handled with the same certainty as "and" and "or"?**
  intuition:
    - text: |
        Make a grid. Give each lock a row and each key a column, and put a mark where the key opens the lock.

        Sentence (1), "for every lock there is a key that opens it", is a statement about **rows**: every row must contain at least one mark. The marks may sit in different columns. You check it row by row, and for each row you are allowed a fresh search.

        Sentence (2), "there is a key that opens every lock", is a statement about a **column**: some one column must be marked all the way down. You have to commit to a column first, and then it has to survive every row.

        The figure has five patterns of marks. Step through them and, before reading the description, decide for each whether (1) is true and whether (2) is true.
    - figure: quantifier-grid
      props: { pattern: 1 }
    - text: |
        Three things are worth noticing.

        Whenever (2) is true, (1) is true as well: a master key is, in particular, a key for each lock. The reverse fails, as the very first pattern shows. So "there is … for every" is the **stronger** claim, and "for every … there is" the weaker.

        When (1) is false, the description points at **one bare row**. It does not say that all rows are bare. To defeat a claim about every row, a single row is enough.

        And when (2) is false, the description has to say something about **every** column: none of them is full. To defeat a claim that something exists, you must rule out all the candidates.

        That swap, "every" turning into "some" under negation and "some" into "every", is the main law of this lesson. You have already met it in small: it is De Morgan's law, grown up. And the two phrases themselves are old friends in Python, where they are called `all` and `any`.
  derivation:
    - text: |
        **Predicates.** A **predicate** is a sentence with one or more variables in it that becomes a proposition when the variables are given values. "$x > 3$" is a predicate in $x$. Write it $P(x)$, as you would write a function: $P(5)$ is the true proposition $5 > 3$, and $P(1)$ is the false proposition $1 > 3$. A predicate **is** a function, from some set of values to the truth values. In Python:

        ```python
        def P(x):
            return x > 3
        ```

        The set of values the variable may take is the **domain** of the predicate. It matters. "$x^2 \ge x$" holds for every whole number and fails for $x = \tfrac{1}{2}$, so whether "it always holds" depends on where $x$ lives. A careful statement always says, or makes plain from the context, what the domain is.

        There are two ways to turn a predicate into a proposition. One is to plug in a value. The other, far more important, is to **quantify**: to say for how many values in the domain the predicate holds.

        Domains are written the way Python writes a collection of values, in braces: $D = \{1, 2, 3, 4\}$. And $x \in D$, read "$x$ is in $D$", says what Python's `x in D` says. Such collections, and what can be done with them, are the subject of the next lesson. Here they are only the places where variables live.

        **For every.** The statement

        $$\forall x \in D,\; P(x)$$

        is read "for every $x$ in $D$, $P(x)$" or "for all $x$ in $D$". It is true when $P(x)$ is true for **each** member of the domain, without exception. The symbol $\forall$, an upturned A for "all", is the **universal quantifier**.

        **There exists.** The statement

        $$\exists x \in D,\; P(x)$$

        is read "there exists an $x$ in $D$ such that $P(x)$" or "for some $x$". It is true when $P(x)$ is true for **at least one** member of the domain. One is enough, and more than one is fine. The symbol $\exists$, a reversed E for "exists", is the **existential quantifier**. A value that makes it true is called a **witness**.

        With the domain $D = \{1, 2, 3, 4\}$:

        | Statement | True? | Why |
        | --- | --- | --- |
        | $\forall x \in D,\; x < 5$ | yes | all four pass |
        | $\forall x \in D,\; x < 4$ | no | 4 fails |
        | $\exists x \in D,\; x^2 = 9$ | yes | 3 is a witness |
        | $\exists x \in D,\; x > 4$ | no | none of the four passes |

        Notice how each is settled. A "for every" is **refuted** by a single failing value, a **counterexample**, but **established** only by going through everything. A "there exists" is the other way about: **established** by a single witness, and **refuted** only by going through everything.

        **Quantifiers are big connectives.** Over that domain of four values, the universal statement says no more and no less than

        $$P(1) \land P(2) \land P(3) \land P(4),$$

        and the existential statement says

        $$P(1) \lor P(2) \lor P(3) \lor P(4).$$

        "For every" is a long **and**. "There exists" is a long **or**. This is the same step as from $a_1 + a_2 + a_3 + a_4$ to $\sum a_i$: the quantifier is to $\land$ what sigma is to $+$. Python has both built in, and you have used them since the lesson on comprehensions:

        ```python
        D = [1, 2, 3, 4]
        print(all(x < 5 for x in D))
        print(any(x * x == 9 for x in D))
        ```

        `all` is $\forall$ and `any` is $\exists$. The generator expression inside is the predicate, applied across the domain. And both are lazy in the way you would hope: `all` stops at the first counterexample, and `any` stops at the first witness.

        When the domain is infinite, as $\mathbb{N}$ or $\mathbb{R}$ is, the "and" has infinitely many parts and no loop can finish it. `all` over an endless generator would run for ever if the statement were true. The **meaning** of the quantifier is unchanged. What changes is that checking is no longer possible, and proof has to take its place.

        **The empty domain.** What if there is nothing in the domain at all? Then "for every $x$ in it, $P(x)$" is **true**, whatever $P$ is, because there is no member to be a counterexample. This is vacuous truth again. And "there exists an $x$ in it with $P(x)$" is **false**, because there is no member to be a witness. Python agrees: `all([])` is `True` and `any([])` is `False`. "Every unicorn in this room can fly" is true. It is the empty sum being 0 and the empty product being 1, once more: the value that makes the pattern go on working when one more item is included.

        **Negation.** Here is the law. To deny that **everything** has a property is to say that **something** lacks it. To deny that **something** has a property is to say that **everything** lacks it.

        $$\neg\,\bigl(\forall x,\; P(x)\bigr) \;\equiv\; \exists x,\; \neg P(x)$$

        $$\neg\,\bigl(\exists x,\; P(x)\bigr) \;\equiv\; \forall x,\; \neg P(x)$$

        The negation sign moves inwards past the quantifier and **flips** it on the way. Over a finite domain these are exactly De Morgan's laws: the negation of $P(1) \land P(2) \land P(3) \land P(4)$ is $\neg P(1) \lor \neg P(2) \lor \neg P(3) \lor \neg P(4)$. Negate each part, swap the connective. In the notation of the last lesson, "for every" is a long product and "there exists" a long sum, and this is $\overline{x_1 x_2 x_3 x_4} = \overline{x_1} + \overline{x_2} + \overline{x_3} + \overline{x_4}$.

        The standard example is "all swans are white". Its negation is **not** "all swans are not white", which is to say "no swan is white". Both of those can be false together, and in fact they are, since there are white swans and black swans. The negation is "**some** swan is not white": one black swan. A statement and its negation must have opposite truth values in every possible world. That is the test to apply whenever you are unsure whether you have negated correctly.

        In Python the law reads: `not all(P(x) for x in D)` is the same as `any(not P(x) for x in D)`.
    - question:
        id: negate-universal
        type: choice
        system: s2
        prompt: |
          A release note claims: "Every test in the suite passes." Which statement is its exact negation?
        options:
          - "Every test in the suite fails."
          - "No test in the suite passes."
          - "At least one test in the suite fails."
          - "Most tests in the suite fail."
        answer: 2
        explanation: |
          $\neg\,\forall t,\ \text{passes}(t)$ is $\exists t,\ \neg\,\text{passes}(t)$. One failing test is enough to make the claim false, and without one the claim is true. The first two options say the same thing as each other, and both are much stronger than the negation: with 99 passing tests and 1 failing, the claim is false and so are they.
    - text: |
        **Quantifiers with a condition.** Most quantified statements carry a condition. "Every prime greater than 2 is odd." "Some multiple of 7 ends in the digit 3." How are these built from the pieces?

        "Every prime greater than 2 is odd" is a statement about all whole numbers $n$, and the condition goes in as the **hypothesis of an implication**:

        $$\forall n,\; \bigl(n \text{ is a prime greater than 2} \;\Rightarrow\; n \text{ is odd}\bigr).$$

        For the numbers that do not meet the condition, such as 9 or 2, the implication is vacuously true, so they pass without being looked at. That is exactly the behaviour wanted, and it is the reason the truth table of $\Rightarrow$ had to be the way it is.

        "Some multiple of 7 ends in 3" has its condition joined with **and**:

        $$\exists n,\; \bigl(n \text{ is a multiple of 7} \;\land\; n \text{ ends in 3}\bigr).$$

        The witness must meet the condition and have the property as well. Here 63 will do.

        So **"every" goes with "implies"** and **"some" goes with "and"**. Getting these the wrong way round is a common beginner's error. Write "$\exists n,\ (n \text{ is a multiple of 7} \Rightarrow n \text{ ends in 3})$" and you have a statement that is true for a silly reason: $n = 1$ is a witness, because 1 is not a multiple of 7 and the implication is vacuous.

        The shorthand $\forall x \in D,\ P(x)$ is this same pattern, with "$x \in D$" as the condition: it abbreviates $\forall x,\ (x \in D \Rightarrow P(x))$. Likewise $\exists x \in D,\ P(x)$ abbreviates $\exists x,\ (x \in D \land P(x))$. So does $\forall \varepsilon > 0$, which you are about to need.

        Now negate "every $P$ is a $Q$", using the two laws you have:

        $$\neg\,\forall x,\; \bigl(P(x) \Rightarrow Q(x)\bigr) \;\equiv\; \exists x,\; \neg\bigl(P(x) \Rightarrow Q(x)\bigr) \;\equiv\; \exists x,\; \bigl(P(x) \land \neg Q(x)\bigr).$$

        The opposite of "every prime greater than 2 is odd" would be "there is a prime greater than 2 that is not odd". A counterexample to a general claim is something that **meets the condition and lacks the property**. That is the even card with a back that is not blue. In shorthand the rule is pleasantly simple: the condition stays where it is, the quantifier flips, and the property is negated.

        $$\neg\,\bigl(\forall x \in D,\; Q(x)\bigr) \;\equiv\; \exists x \in D,\; \neg Q(x).$$

        **Two quantifiers.** A predicate can have two variables. Let $O(k, l)$ mean "key $k$ opens lock $l$". The sentences of the puzzle are

        $$\text{(1)}\quad \forall l,\; \exists k,\; O(k, l) \qquad\qquad \text{(2)}\quad \exists k,\; \forall l,\; O(k, l).$$

        Read a quantified statement from left to right, as a game. In (1) an opponent picks any lock, and **then** you must find a key. Your key may depend on the lock. In (2) you must name a key **first**, and then the opponent picks any lock to try it on. Whoever moves later has the advantage of knowing what was chosen before. A variable bound by $\exists$ may depend on every variable quantified to its **left**, and on nothing to its right.

        With numbers: over the real numbers,

        $$\forall x,\; \exists y,\; x + y = 0$$

        is true, since for any $x$ you can answer with $y = -x$. But

        $$\exists y,\; \forall x,\; x + y = 0$$

        is false. It asks for one number $y$ that cancels every $x$ at once.

        **The order of two different quantifiers cannot be changed.** $\exists\forall$ implies $\forall\exists$, and not the other way. Two quantifiers of the **same** kind may be swapped freely: "for every $x$ and for every $y$" is one long "and" over all pairs, and "there exist $x$ and $y$" is one long "or".

        In Python a nested quantifier is a nested `all` or `any`, and the order of nesting is the order of the quantifiers:

        ```python
        locks = [1, 2, 3]
        keys = [1, 2, 3]

        def opens(k, l):
            return k == l

        each_has_a_key = all(any(opens(k, l) for k in keys) for l in locks)
        master_key = any(all(opens(k, l) for l in locks) for k in keys)
        print(each_has_a_key, master_key)
        ```

        This prints `True False`. In the first line the outermost call is `all`, over locks: for every lock. Inside it, for that lock, `any` searches the keys.

        **Negating several quantifiers.** Push the negation inwards one quantifier at a time. Each one it passes flips. When it reaches the predicate, it negates that.

        $$\neg\,\forall l,\; \exists k,\; O(k, l) \;\equiv\; \exists l,\; \neg\,\exists k,\; O(k, l) \;\equiv\; \exists l,\; \forall k,\; \neg O(k, l).$$

        "There is a lock that every key fails to open." That was answer (c) of the puzzle. The order of the variables does not change. Only the symbols flip, and the final predicate is negated. It is a completely mechanical procedure, and you should trust it over your ear, which is easily fooled by English.

        **What it means not to converge.** Here is the definition of convergence from the algebra cluster, in symbols. The sequence $(a_n)$ converges to $L$ when

        $$\forall \varepsilon > 0,\;\; \exists N,\;\; \forall n \ge N,\;\; \lvert a_n - L \rvert < \varepsilon.$$

        As a game: an opponent names a tolerance $\varepsilon$. You answer with an index $N$, which may depend on $\varepsilon$, and a smaller tolerance will generally need a larger $N$. Then the opponent may test any term from $N$ onwards, and it must be within the tolerance.

        Negate it, one quantifier at a time. The conditions "$> 0$" and "$\ge N$" stay, and $<$ becomes $\ge$:

        $$\exists \varepsilon > 0,\;\; \forall N,\;\; \exists n \ge N,\;\; \lvert a_n - L \rvert \ge \varepsilon.$$

        In words: there is some fixed tolerance such that, however far out you go, there is always a later term that lies outside it. The sequence keeps escaping.

        Try it on $a_n = (-1)^n$ with $L = 1$. Take $\varepsilon = 1$. Whatever $N$ is proposed, there is an odd $n \ge N$, and for it $\lvert a_n - 1 \rvert = \lvert -1 - 1 \rvert = 2 \ge 1$. So the sequence does not converge to 1, and now that is a statement with an exact meaning and a complete argument behind it. The same works against any other proposed limit.

        And what would happen if the first two quantifiers of the definition were swapped?

        $$\exists N,\;\; \forall \varepsilon > 0,\;\; \forall n \ge N,\;\; \lvert a_n - L \rvert < \varepsilon.$$

        Now one $N$ must serve every tolerance, however small. A term that is within **every** positive distance of $L$ is at distance 0 from it, so this says that from $N$ onwards every term **equals** $L$. The sequence $\tfrac{1}{n}$ converges to 0 and fails this test completely. The whole idea of a limit lives in the order "$\forall\varepsilon\ \exists N$".

        **Exactly one.** Sometimes a statement claims that there is one and only one thing with a property. This is written $\exists!\,x,\ P(x)$. It is not a new idea, just an abbreviation for two claims joined by "and": there **is** an $x$ with $P(x)$, and any two things with the property are the **same**, $\forall x, \forall y,\ (P(x) \land P(y)) \Rightarrow x = y$. Proofs of uniqueness always have these two parts.

        **Bound and free variables.** In $\forall x,\ x^2 \ge 0$ the letter $x$ is **bound**: the statement is not about any particular $x$, and it means exactly the same if every $x$ is renamed to $t$. It is the index $i$ of a sum, or the loop variable of a comprehension. In "$x > 3$" the letter is **free**, and the sentence is a predicate, waiting for a value. A sentence is a proposition exactly when it has no free variables.

        **Hidden quantifiers.** Ordinary mathematical English leaves quantifiers out, and you are expected to put them back.

        | Written | Meant |
        | --- | --- |
        | A prime greater than 2 is odd. | **Every** prime greater than 2 is odd. |
        | $x^2 \ge 0$ | **For every** real $x$, $x^2 \ge 0$. |
        | $(a + b)^2 = a^2 + 2ab + b^2$ | **For all** numbers $a$ and $b$. |
        | The equation $x^2 = 2$ has a solution. | **There is** a real $x$ with $x^2 = 2$. |
        | If $n$ is even then $n^2$ is even. | **For every** whole number $n$: if … then … |

        A free variable in a statement that is put forward as true is almost always meant universally. The word "a" is treacherous: "a prime is odd" means every one, and "there is a prime" means some one. Before you prove, test or negate a statement, write its quantifiers out in full.
    - question:
        id: fix-has-failure
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `has_failure(results)` takes a list of Booleans, one per test, `True` for a pass. It should return `True` when it is **not** the case that every test passed. Somebody rewrote `not all(results)` by "moving the not inside", and now a run with one failure among many passes is reported as clean. Fix it.
        starter: |
          def has_failure(results):
              return all(not passed for passed in results)

          print(has_failure([True, False, True]))
        solution: |
          def has_failure(results):
              return any(not passed for passed in results)

          print(has_failure([True, False, True]))
        tests: |
          assert has_failure([True, False, True]) is True, "One failure among passes is a failure. The negation of 'every test passed' is 'some test did not pass'."
          assert has_failure([True, True, True]) is False, "All passed: no failure"
          assert has_failure([False, False]) is True, "All failed: certainly a failure"
          assert has_failure([]) is False, "With no tests there is no failing test"
          assert has_failure([False]) is True, "A single failing test"
          assert has_failure([True]) is False, "A single passing test"
        wrong:
          - "def has_failure(results):\n    return not any(passed for passed in results)\n\nprint(has_failure([True, False, True]))\n"
          - "def has_failure(results):\n    return any(passed for passed in results)\n\nprint(has_failure([True, False, True]))\n"
          - "def has_failure(results):\n    return len(results) > 0 and all(not passed for passed in results)\n\nprint(has_failure([True, False, True]))\n"
          - "def has_failure(results):\n    return not all(not passed for passed in results)\n\nprint(has_failure([True, False, True]))\n"
        explanation: |
          $\neg\,\forall t,\ \text{passed}(t) \equiv \exists t,\ \neg\,\text{passed}(t)$. When a negation moves inside a quantifier, the quantifier flips: `not all(...)` becomes `any(not ...)`. The rewrite moved the `not` and kept the `all`, which says "every test failed", a far stronger statement that is false for almost every broken build. The empty list is worth a look as well. The starter returned `True` for it, by vacuous truth: every one of no tests failed.
  formal:
    - text: |
        A **predicate** on a domain $D$ is a function $P : D \to \{\text{T}, \text{F}\}$.

        | Name | Statement | True exactly when | Python, finite $D$ |
        | --- | --- | --- | --- |
        | universal | $\forall x \in D,\; P(x)$ | $P(x)$ holds for each $x$ in $D$ | `all(P(x) for x in D)` |
        | existential | $\exists x \in D,\; P(x)$ | $P(x)$ holds for at least one $x$ in $D$ | `any(P(x) for x in D)` |
        | unique existence | $\exists!\, x \in D,\; P(x)$ | $P(x)$ holds for exactly one $x$ in $D$ | |

        If $D$ is empty, every universal statement over $D$ is true and every existential statement over $D$ is false.

        **Conditions.** $\forall x \in D,\ P(x)$ abbreviates $\forall x,\ (x \in D \Rightarrow P(x))$, and $\exists x \in D,\ P(x)$ abbreviates $\exists x,\ (x \in D \land P(x))$.

        **Negation.**

        | Statement | Negation |
        | --- | --- |
        | $\forall x \in D,\; P(x)$ | $\exists x \in D,\; \neg P(x)$ |
        | $\exists x \in D,\; P(x)$ | $\forall x \in D,\; \neg P(x)$ |
        | $\forall x,\; (P(x) \Rightarrow Q(x))$ | $\exists x,\; (P(x) \land \neg Q(x))$ |
        | $\forall x,\; \exists y,\; R(x, y)$ | $\exists x,\; \forall y,\; \neg R(x, y)$ |
        | $\exists x,\; \forall y,\; R(x, y)$ | $\forall x,\; \exists y,\; \neg R(x, y)$ |

        To negate any quantified statement, flip every quantifier, keep the conditions attached to the quantifiers, and negate the innermost predicate.

        **Order.** $\exists y,\ \forall x,\ R(x, y)$ implies $\forall x,\ \exists y,\ R(x, y)$. The converse fails in general. Adjacent quantifiers of the same kind may be exchanged.

        **Convergence and its negation.** $(a_n)$ converges to $L$ iff $\forall \varepsilon > 0,\ \exists N,\ \forall n \ge N,\ \lvert a_n - L \rvert < \varepsilon$. It does not converge to $L$ iff $\exists \varepsilon > 0,\ \forall N,\ \exists n \ge N,\ \lvert a_n - L \rvert \ge \varepsilon$.

        A variable is **bound** if it is governed by a quantifier, and **free** otherwise. A sentence with no free variables is a proposition.
  drill:
    - text: Seconds each. Ask of each statement what single thing would establish it, or what single thing would refute it.
    - question:
        id: drill-forall-small
        type: choice
        system: s1
        prompt: |
          With $D = \{2, 4, 6, 9\}$, is "$\forall x \in D$, $x$ is even" true?
        options: ["True", "False, because of 9", "False, because of 2", "It cannot be decided"]
        answer: 1
        explanation: One counterexample refutes a universal statement, and 9 is odd.
    - question:
        id: drill-exists-small
        type: choice
        system: s1
        prompt: |
          With $D = \{2, 4, 6, 9\}$, is "$\exists x \in D$, $x$ is odd" true?
        options: ["True, with the witness 9", "False, because most members are even", "False, because 2 is even", "It cannot be decided"]
        answer: 0
        explanation: One witness establishes an existential statement. How many members fail is beside the point.
    - question:
        id: drill-negate-forall
        type: choice
        system: s1
        prompt: |
          What is the negation of "$\forall x,\ P(x)$"?
        options: ["$\\forall x,\\ \\neg P(x)$", "$\\exists x,\\ \\neg P(x)$", "$\\exists x,\\ P(x)$", "$\\neg \\exists x,\\ \\neg P(x)$"]
        answer: 1
        explanation: The negation flips the quantifier and negates the predicate. Not everything has the property means something lacks it.
    - question:
        id: drill-negate-exists
        type: choice
        system: s1
        prompt: |
          What is the negation of "there is a student who scored full marks"?
        options:
          - "There is a student who did not score full marks."
          - "Every student scored full marks."
          - "Every student scored less than full marks."
          - "Some students scored full marks and some did not."
        answer: 2
        explanation: To deny that something exists, you must say that every candidate fails. The first option can be true together with the original statement, so it cannot be the negation.
    - question:
        id: drill-empty-all
        type: choice
        system: s1
        prompt: |
          A project has no open bugs. Is "every open bug in the project is assigned to somebody" true or false?
        options: ["True", "False", "Neither"]
        answer: 0
        explanation: A universal statement over an empty domain is vacuously true. There is no open bug to be a counterexample.
    - question:
        id: drill-witness
        type: numeric
        system: s1
        prompt: |
