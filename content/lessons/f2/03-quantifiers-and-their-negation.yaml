  work:
    - text: Slower now. Write the quantifiers out before you decide anything.
    - question:
        id: work-order-english
        type: choice
        system: s2
        prompt: |
          Let $C(t, b)$ mean "test $t$ catches bug $b$". A team lead says: "We are safe as long as $\forall b,\ \exists t,\ C(t, b)$." Which sentence says the same?
        options:
          - "There is one test that catches every bug."
          - "Every bug is caught by at least one test, possibly a different test for each bug."
          - "Every test catches at least one bug."
          - "There is a bug that every test catches."
        answer: 1
        explanation: |
          Read from the left: for every bug, there is a test, which may depend on the bug. The first option is $\exists t,\ \forall b$, the master-key form, and is far stronger. The third is $\forall t,\ \exists b$, with the roles of the two variables exchanged: it would be satisfied by a thousand tests that all catch the same single bug.
    - question:
        id: work-negate-statement
        type: choice
        system: s2
        prompt: |
          Negate: "For every real number $x$, if $x > 0$ then there is a real number $y$ with $y^2 = x$."
        options:
          - "For every real $x$, if $x > 0$ then there is no real $y$ with $y^2 = x$."
          - "There is a real $x$ with $x \\le 0$ such that every real $y$ has $y^2 \\ne x$."
          - "There is a real $x > 0$ such that every real $y$ has $y^2 \\ne x$."
          - "There is a real $x > 0$ and a real $y$ with $y^2 \\ne x$."
        answer: 2
        explanation: |
          The statement is $\forall x,\ (x > 0 \Rightarrow \exists y,\ y^2 = x)$. Flip $\forall$ to $\exists$. The negated implication is its hypothesis **and** the negation of its conclusion: $x > 0 \land \neg\exists y,\ y^2 = x$. Flip the inner quantifier: $\forall y,\ y^2 \ne x$. The condition $x > 0$ is kept, not negated. The last option fails to flip the inner quantifier and is trivially true.
    - question:
        id: work-not-converge
        type: choice
        system: s2
        prompt: |
          Take $a_n = (-1)^n$, the sequence $-1, 1, -1, 1, \dots$ To show from the definition that it does **not** converge to $0$, which choice of $\varepsilon$ works, and why?
        options:
          - "$\\varepsilon = 2$, because every term is within 2 of 0."
          - "$\\varepsilon = \\tfrac{1}{2}$, because every term is at distance 1 from 0, so beyond any $N$ there is a term at least $\\tfrac{1}{2}$ away."
          - "No single $\\varepsilon$ works. One has to show it for every $\\varepsilon$."
          - "$\\varepsilon = \\tfrac{1}{2}$, because some term is within $\\tfrac{1}{2}$ of 0."
        answer: 1
        explanation: |
          Not converging to 0 means $\exists \varepsilon > 0,\ \forall N,\ \exists n \ge N,\ \lvert a_n - 0 \rvert \ge \varepsilon$. It begins with $\exists$, so one well-chosen tolerance is enough. With $\varepsilon = \tfrac{1}{2}$ every term has $\lvert a_n \rvert = 1 \ge \tfrac{1}{2}$, so any $n \ge N$ will do. A large tolerance such as 2 is useless: the terms never escape it.
    - question:
        id: write-counterexample
        type: code
        mode: write
        system: s2
        prompt: |
          Write `counterexample(pred, domain)`. It returns the **first** value in `domain` for which the predicate `pred` is false, or `None` if `pred` holds for every value. It must stop looking as soon as it has found one.

          The program then tests a famous claim: "$n^2 + n + 41$ is prime for every natural number $n$".
        starter: |
          def is_prime(n):
              if n < 2:
                  return False
              d = 2
              while d * d <= n:
                  if n % d == 0:
                      return False
                  d += 1
              return True

          def counterexample(pred, domain):
              # Replace the next line with your own.
              return None

          print(counterexample(lambda n: is_prime(n * n + n + 41), range(100)))
        solution: |
          def is_prime(n):
              if n < 2:
                  return False
              d = 2
              while d * d <= n:
                  if n % d == 0:
                      return False
                  d += 1
              return True

          def counterexample(pred, domain):
              for x in domain:
                  if not pred(x):
                      return x
              return None

          print(counterexample(lambda n: is_prime(n * n + n + 41), range(100)))
        tests: |
          assert counterexample(lambda x: x < 5, [1, 2, 7, 3, 9]) == 7, "The first value that fails x < 5 is 7"
          assert counterexample(lambda x: x < 5, [1, 2, 3]) is None, "When the predicate holds for every value, return None"
          assert counterexample(lambda x: x > 100, []) is None, "An empty domain has no counterexample"
          assert counterexample(lambda x: x > 0, [3, 0, -2]) == 0, "The counterexample may be 0. It should be returned, not mistaken for None."
          assert counterexample(lambda x: x % 2 == 0, [1, 3]) == 1, "The very first value may be the counterexample"
          _seen = []
          def _domain():
              for _i in range(10):
                  _seen.append(_i)
                  yield _i
          assert counterexample(lambda x: x < 3, _domain()) == 3, "It should work on a generator"
          assert _seen == [0, 1, 2, 3], "It should stop as soon as the first counterexample is found, without looking at later values"
          assert output.strip() == "40", "The program should print 40: the formula gives a prime for n = 0 to 39 and fails at 40"
        wrong:
          - "def counterexample(pred, domain):\n    found = None\n    for x in domain:\n        if not pred(x):\n            found = x\n    return found\n\nprint(40)\n"
          - "def counterexample(pred, domain):\n    for x in domain:\n        if pred(x):\n            return x\n    return None\n\nprint(40)\n"
          - "def counterexample(pred, domain):\n    for x in domain:\n        if not pred(x):\n            return x or None\n    return None\n\nprint(40)\n"
          - "def counterexample(pred, domain):\n    bad = [x for x in domain if not pred(x)]\n    if bad:\n        return bad[0]\n    return None\n\nprint(40)\n"
        explanation: |
          A universal claim is refuted by one counterexample, so the search can return the moment it finds one. If the loop ends without finding any, the claim holds on that domain. The program prints 40. Euler's formula $n^2 + n + 41$ gives a prime for $n = 0, 1, 2, \dots, 39$, forty cases in a row, and then $40^2 + 40 + 41 = 1681 = 41^2$. Forty passing tests were no proof. With hindsight the failure was certain: put $n = 41$ and every term is a multiple of 41. Any number of confirming cases leaves a "for every" statement unproved, and one failing case destroys it.
    - question:
        id: write-two-quantifiers
        type: code
        mode: write
        system: s2
        prompt: |
          Write two functions for a relation `rel(x, y)` and two finite lists `xs` and `ys`.

          - `each_has_some(rel, xs, ys)` decides $\forall x \in xs,\ \exists y \in ys,\ rel(x, y)$.
          - `some_for_each(rel, xs, ys)` decides $\exists y \in ys,\ \forall x \in xs,\ rel(x, y)$.

          The program tries both on "x + y = 0" over the whole numbers from −3 to 3.
        starter: |
          def each_has_some(rel, xs, ys):
              # Replace the next line with your own.
              return False

          def some_for_each(rel, xs, ys):
              # Replace the next line with your own.
              return False

          numbers = list(range(-3, 4))
          cancel = lambda x, y: x + y == 0
          print(each_has_some(cancel, numbers, numbers), some_for_each(cancel, numbers, numbers))
        solution: |
          def each_has_some(rel, xs, ys):
              return all(any(rel(x, y) for y in ys) for x in xs)

          def some_for_each(rel, xs, ys):
              return any(all(rel(x, y) for x in xs) for y in ys)

          numbers = list(range(-3, 4))
          cancel = lambda x, y: x + y == 0
          print(each_has_some(cancel, numbers, numbers), some_for_each(cancel, numbers, numbers))
        tests: |
          _n = list(range(-3, 4))
          assert each_has_some(lambda x, y: x + y == 0, _n, _n) is True, "Every x from -3 to 3 has a y in the same range with x + y = 0"
          assert some_for_each(lambda x, y: x + y == 0, _n, _n) is False, "No single y cancels every x"
          assert each_has_some(lambda x, y: x * y == 0, _n, _n) is True, "Every x has a y with x * y = 0"
          assert some_for_each(lambda x, y: x * y == 0, _n, _n) is True, "y = 0 makes x * y = 0 for every x"
          assert each_has_some(lambda x, y: y > x, [1, 2, 3], [1, 2, 3]) is False, "3 has no larger partner in the list"
          assert each_has_some(lambda x, y: y > x, [1, 2], [1, 2, 3]) is True, "The lists may differ"
          assert some_for_each(lambda x, y: y > x, [1, 2], [1, 2, 3]) is True, "y = 3 is larger than every x in [1, 2]"
          assert some_for_each(lambda x, y: x > y, [1, 2], [1, 2, 3]) is False, "The relation is applied as rel(x, y), with x from xs and y from ys"
          assert each_has_some(lambda x, y: True, [], [1]) is True, "With no x there is no counterexample"
          assert each_has_some(lambda x, y: True, [1], []) is False, "With no y there is no witness"
          assert some_for_each(lambda x, y: False, [], [1]) is True, "With no x, any y works vacuously"
          assert some_for_each(lambda x, y: True, [1], []) is False, "With no y there is no witness"
          assert output.strip() == "True False", "The program should print True False"
        wrong:
          - "def each_has_some(rel, xs, ys):\n    return all(any(rel(x, y) for y in ys) for x in xs)\n\ndef some_for_each(rel, xs, ys):\n    return all(any(rel(x, y) for y in ys) for x in xs)\n\nprint(True, False)\n"
          - "def each_has_some(rel, xs, ys):\n    return any(any(rel(x, y) for y in ys) for x in xs)\n\ndef some_for_each(rel, xs, ys):\n    return any(all(rel(x, y) for x in xs) for y in ys)\n\nprint(True, False)\n"
          - "def each_has_some(rel, xs, ys):\n    return all(any(rel(x, y) for y in ys) for x in xs)\n\ndef some_for_each(rel, xs, ys):\n    return any(all(rel(x, y) for y in ys) for x in xs)\n\nprint(True, False)\n"
          - "def each_has_some(rel, xs, ys):\n    return all(all(rel(x, y) for y in ys) for x in xs)\n\ndef some_for_each(rel, xs, ys):\n    return any(all(rel(x, y) for x in xs) for y in ys)\n\nprint(True, False)\n"
        explanation: |
          The nesting of the calls is the order of the quantifiers. The outer call is the quantifier written first, and its loop variable is the one named first. In `some_for_each` the outer `any` runs over `ys`, because the $y$ has to be fixed before the $x$ varies. The four tests with an empty list are the two vacuous cases from the lesson: `all` over nothing is `True`, and `any` over nothing is `False`.
    - question:
        id: fix-settles-from
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `settles_from(terms, limit, eps)` looks at a finite list of terms of a sequence. It should return the smallest index `N` such that **every** term from index `N` onwards is within `eps` of `limit`, that is, `abs(term - limit) < eps`. If there is no such index, it returns `None`. For the terms $1, \tfrac{1}{2}, \tfrac{1}{3}, \dots, \tfrac{1}{49}$ with limit 0 and tolerance 0.1 it correctly prints 10. But for a sequence that dips inside the tolerance and comes out again, it reports the dip. Fix it.
        starter: |
          def settles_from(terms, limit, eps):
              for start in range(len(terms)):
                  if abs(terms[start] - limit) < eps:
                      return start
              return None

          print(settles_from([1 / n for n in range(1, 50)], 0, 0.1))
        solution: |
          def settles_from(terms, limit, eps):
              for start in range(len(terms)):
                  if all(abs(term - limit) < eps for term in terms[start:]):
                      return start
              return None

          print(settles_from([1 / n for n in range(1, 50)], 0, 0.1))
        tests: |
          assert settles_from([1 / n for n in range(1, 50)], 0, 0.1) == 10, "1/n is below 0.1 from n = 11, which is index 10"
          assert settles_from([0.05, 3, 0.5, 0.05, 0.01], 0, 0.1) == 3, "The first term is inside the tolerance but the next is not. Every term from the index onwards must be inside."
          assert settles_from([2, 2, 2], 2, 0.5) == 0, "A constant sequence at its limit settles from the start"
          assert settles_from([0.01, 0.01, 5], 0, 0.1) is None, "The last term is outside, so no index works"
          assert settles_from([], 0, 0.1) is None, "With no terms there is no index to return"
          assert settles_from([5, 0.01], 0, 0.1) == 1, "Only the last term is inside"
          assert settles_from([1, -1, 1, -1, 1, -1], 1, 0.5) is None, "The alternating sequence keeps leaving the tolerance about 1"
          assert settles_from([3.2, 2.9, 3.05, 2.99], 3, 0.1) == 2, "It should work for a limit other than 0, with terms on both sides"
        wrong:
          - "def settles_from(terms, limit, eps):\n    for start in range(len(terms)):\n        if any(abs(term - limit) < eps for term in terms[start:]):\n            return start\n    return None\n\nprint(10)\n"
          - "def settles_from(terms, limit, eps):\n    for start in range(len(terms)):\n        if all(abs(term - limit) < eps for term in terms[start + 1:]):\n            return start\n    return None\n\nprint(10)\n"
          - "def settles_from(terms, limit, eps):\n    for start in range(len(terms)):\n        if all(term - limit < eps for term in terms[start:]):\n            return start\n    return None\n\nprint(10)\n"
          - "def settles_from(terms, limit, eps):\n    last = None\n    for start in range(len(terms)):\n        if abs(terms[start] - limit) >= eps:\n            last = start\n    return last\n\nprint(10)\n"
        explanation: |
          The definition says $\forall n \ge N$: every term from $N$ on. The starter tested only the term **at** `start`, which is the difference between visiting the tolerance band and staying in it. The fix puts the universal quantifier into the code as `all` over the rest of the list. One caution belongs here. On a finite list this function can only report what the listed terms do. The real definition quantifies over all $n \ge N$, infinitely many of them, and no finite list can settle that. The harmonic partial sums look settled over any stretch you care to print.
    - question:
        id: work-swap-quantifiers
        type: choice
        system: s2
        prompt: |
          A function $f$ from $\mathbb{R}$ to $\mathbb{R}$ is called **bounded** if $\exists M,\ \forall x,\ \lvert f(x) \rvert \le M$. A student writes instead: $\forall x,\ \exists M,\ \lvert f(x) \rvert \le M$. What does the student's version say?
        options:
          - "The same thing. The order of quantifiers does not matter."
          - "Something true of every function whatever: for each x, take M to be the size of f(x). It no longer describes boundedness at all."
          - "Something stronger than boundedness."
          - "That f is constant."
        answer: 1
        explanation: |
          With $M$ chosen after $x$, it may depend on $x$, and $M = \lvert f(x) \rvert$ always works. The statement is true even of $f(x) = x^2$, which is as unbounded as can be. Boundedness needs one $M$ fixed in advance that serves every $x$: the master-key order. A definition with its quantifiers in the wrong order is usually either impossible to satisfy or satisfied by everything.
    - question:
        id: work-hidden-quantifier
        type: choice
        system: s2
        prompt: |
          A textbook states: "A list sorted into increasing order has its smallest item first." To show the statement false, what would you need?
        options:
          - "A sorted list whose smallest item is first."
          - "A list that is not sorted and whose smallest item is last."
          - "One sorted list whose first item is not its smallest."
          - "A proof that every sorted list has its smallest item last."
        answer: 2
        explanation: |
          The "a" hides a universal quantifier: **every** list sorted into increasing order has its smallest item first, or $\forall L,\ (\text{sorted}(L) \Rightarrow \text{smallest first}(L))$. Its negation is $\exists L,\ (\text{sorted}(L) \land \neg\,\text{smallest first}(L))$: a single list that meets the condition and lacks the property. An unsorted list proves nothing either way, because the claim says nothing about unsorted lists. No such counterexample exists, as it happens: the statement is true. But that has to be shown by an argument about every sorted list, not by trying some.
  connections:
    - text: |
        You now have the full language in which mathematics is written: propositions, five connectives and two quantifiers. Every definition and every theorem from here to the end of the course can be spelt out in it, and when a statement in a paper puzzles you, spelling it out is the first thing to do. Continuity, convergence, linear independence, the convexity of a loss, the guarantee that an algorithm learns: each is a short stack of $\forall$ and $\exists$, and each has a negation you can now write down without thinking.

        The language also tells you what a proof has to do. A statement that begins $\forall$ cannot be established by examples, however many, as Euler's formula showed with forty in a row. It needs an argument about an **arbitrary** member of the domain. A statement that begins $\exists$ can be established by handing over a witness. A false universal statement is brought down by one counterexample. And a statement with $\forall \varepsilon\ \exists N$ is proved by saying how to find the $N$ from the $\varepsilon$, a skill that calculus will make routine.

        In engineering the same two words decide what a claim is worth. "The model is robust: for every input within a small distance of this one, the prediction is unchanged" is a universal statement, and testing it on a thousand nearby inputs proves nothing, while one adversarial example refutes it. "There is a setting of the weights that fits the data" is existential. Property-based testing tools hunt for counterexamples in exactly the way your `counterexample` function does, and `assert all(...)` is the commonest line in any test suite.

        Two things come next. Throughout this lesson, domains were written in braces and searched with `in`, on trust. They are sets, and sets have an algebra of their own, which turns out to be the algebra of the last lesson in a third notation: [[f2.sets-and-set-operations]].

        And so far you have only learned to **state** things, and to check them when the domain is small. Soon comes the real task: to establish a universal statement over an infinite domain with complete certainty. The simplest way of doing so starts from the hypothesis and walks, one justified step at a time, to the conclusion: [[f2.direct-proof]].
