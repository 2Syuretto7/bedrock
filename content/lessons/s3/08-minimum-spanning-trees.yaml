                      _cost = sum(_km for _km, _a, _b in _chosen)
                      if _best is None or _cost < _best:
                          _best = _cost
              return _best


          _rng = _random.Random(41)
          _cases = [
              (6, [(1, 0, 2), (2, 2, 1), (2, 3, 4), (3, 4, 5), (4, 0, 1), (5, 1, 3), (6, 3, 5), (8, 2, 3), (10, 2, 4)]),
