            import heapq


            def prim_cost(graph):
                # graph maps each village to a list of (neighbour, cost) pairs, listed in both directions.
                # Return the least total cost of links that join every village, or None if some village
                # cannot be joined at all.
                if len(graph) == 0:
                    return 0
                start = list(graph)[0]
                in_tree = {start}
                heap = [(0, start)]
                total = 0
                while heap:
                    cost, village = heapq.heappop(heap)
                    total += cost
                    for other, link in graph[village]:
                        if other not in in_tree:
                            in_tree.add(other)
                            heapq.heappush(heap, (link, other))
                if len(in_tree) < len(graph):
                    return None
                return total


            links = [("P", "Q", 7), ("P", "R", 5), ("P", "S", 9), ("Q", "R", 4), ("Q", "T", 6), ("R", "S", 8), ("R", "T", 3), ("S", "T", 2)]
            graph = {v: [] for v in "PQRST"}
            for a, b, cost in links:
                graph[a].append((b, cost))
                graph[b].append((a, cost))
            print(prim_cost(graph), prim_cost({"X": [], "Y": []}))
        explanation: |
          The heap holds `(cost of the link, village)`, and a popped village not yet in the tree joins it along that link. Keying the heap on the cost so far, as Dijkstra does, adds up route lengths instead of link costs; forgetting the final check returns a total for only part of the villages; and putting a village in the tree when it is first reached fixes the first link found to it, even if a cheaper one turns up later.
