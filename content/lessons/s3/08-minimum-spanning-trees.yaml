        mode: write
        system: s2
        prompt: |
          Write `prim_cost(graph)` by Prim's method. `graph` maps each village to a list of `(neighbour, cost)` pairs, with every link listed in both directions. Return the least total cost of links that join every village, `0` for an empty graph, or `None` if some village cannot be joined at all.
