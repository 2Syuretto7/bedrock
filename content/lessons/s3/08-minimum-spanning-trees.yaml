            def mst_cost(n, roads):
                # Towns are numbered 0 to n - 1, and roads is a list of (km, a, b). Return the total
                # length of the cheapest set of roads that joins every town, assuming one exists.
                parent = list(range(n))

                def find(x):
                    while parent[x] != x:
                        x = parent[x]
                    return x

                total = 0
                for km, a, b in sorted(roads)[:n - 1]:
                    ra = find(a)
                    rb = find(b)
                    if ra != rb:
                        parent[ra] = rb
                        total += km
                return total


            roads = [(1, 0, 2), (2, 2, 1), (2, 3, 4), (3, 4, 5), (4, 0, 1), (5, 1, 3), (6, 3, 5), (8, 2, 3), (10, 2, 4)]
            print(mst_cost(6, roads), mst_cost(4, [(1, 0, 1), (1, 2, 3), (9, 1, 2), (2, 0, 1), (2, 3, 2), (3, 0, 3)]))
        explanation: |
          Joining two groups means linking one group's root to the other's: `parent[ra] = rb`. Linking the towns themselves, `parent[a] = b`, moves `a` out of its old group and leaves the rest of that group behind, so groups that should be joined stay apart and a later, longer road is kept. Taking the $n - 1$ shortest roads ignores loops; leaving the roads unsorted keeps whatever comes first; and looking only at the first $n - 1$ roads in sorted order misses later roads that are needed when earlier ones were skipped.
