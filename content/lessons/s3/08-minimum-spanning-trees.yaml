concept: s3.minimum-spanning-trees
minutes: 90
claim: You can find the cheapest set of links that joins every node of a weighted graph, by Kruskal's method of taking links shortest first unless they close a loop, using union-find, or by Prim's method of growing one tree with a heap, explain why both are right with the cut property, tell a spanning tree apart from a tree of shortest routes, and stop Kruskal's method early to group nearby points into clusters.
recalls: [s3.shortest-paths]
uses: [s2.union-find, s2.heaps-and-priority-queues, s3.sorting, f3.trees-and-their-properties, f3.graph-theory-basics, f2.contrapositive-and-contradiction, s3.breadth-first-and-depth-first-search]
leads: [s3.greedy-algorithms, s3.intractability-p-np-and-heuristics]
starter: |
  # Scratch space. Union-find answers "are these two towns already joined?"
  parent = list(range(6))

  def find(x):
      while parent[x] != x:
          x = parent[x]
      return x

  parent[find(0)] = find(2)
  parent[find(2)] = find(1)
  print(find(0) == find(1), find(0) == find(3))
parts:
  recall:
    - text: |
        [[s3.shortest-paths]] found the quickest route from one place to each of the others. A different question comes up just as often: not how to travel, but what to build. A telecom company laying fibre between villages, or an engineer joining the machines of a data centre, wants every point connected to every other, by some route, at the least total cost. Three quick pulls first.
  puzzle:
    - text: |
        Five villages, P, Q, R, S and T, are to be joined by optical fibre so that every village can reach every other, possibly through others. Laying fibre between two villages costs, in lakh rupees:

        | | Q | R | S | T |
        | --- | --- | --- | --- | --- |
        | **P** | 7 | 5 | 9 | – |
        | **Q** | | 4 | – | 6 |
        | **R** | | | 8 | 3 |
        | **S** | | | | 2 |

        A dash means no fibre can be laid between those two. **What is the least total cost, in lakh rupees, of joining all five villages?**
  intuition:
    - text: |
        A set of links that joins all $n$ places with no loops is a **spanning tree**: a tree, in the sense of [[f3.trees-and-their-properties]], that reaches every node, so it has exactly $n - 1$ links. A loop would be wasted money, since dropping any one link of a loop leaves everything still joined. The cheapest spanning tree is the **minimum spanning tree**.

        The obvious idea is greedy: buy the cheapest link first, then the next cheapest, and so on, skipping any link whose two ends are already joined, since it would only close a loop. Remarkably, that obvious idea is exactly right. The figure runs it on six towns, then shows a second method that grows one tree outwards from A, adding the cheapest link that reaches a new town.
    - figure: spanning-tree
      props: { method: kruskal, step: 0 }
    - text: |
        Shortest first, the method takes A–C 1, C–B 2, D–E 2 and E–F 3, skips A–B 4 because A and B are already joined through C, and takes B–D 5. Five roads now join all six towns for 13 in all, and every road after that would close a loop. Growing from A takes the same five roads in a different order, A–C, C–B, B–D, D–E, E–F. Both methods find the same cheapest tree.
  derivation:
    - text: |
        **Not the shortest routes.** A spanning tree minimises the total length of road built, not the length of any one journey. With three towns where A–B and A–C have length 2 and B–C has length 1, the shortest routes from A use A–B and A–C, 4 in all, while the minimum spanning tree uses B–C and one of the others, 3 in all, and the journey from A to one town becomes 3 instead of 2. On the figure's towns the two trees happen to coincide; usually they do not.

        **The cut property.** Why is taking the cheapest safe link right? Split the nodes into any two groups, a **cut**. Some link must cross the cut, or the two groups could not be joined. The claim: the cheapest link crossing a cut belongs to some minimum spanning tree.

        The argument swaps one link for another, a proof by contradiction in the style of [[f2.contrapositive-and-contradiction]]. Let $e$ be the cheapest crossing link, and suppose a minimum spanning tree $T$ does not contain it. Adding $e$ to $T$ creates exactly one loop. The loop crosses the cut along $e$, and to come back it must cross again along some other link $e'$ of $T$. Removing $e'$ breaks the loop and leaves a spanning tree again. Since $e$ is the cheapest crossing link, $e$ costs no more than $e'$, so the new tree costs no more than $T$: it is also a minimum spanning tree, and it contains $e$. When all lengths differ, the swap would make $T$ strictly cheaper, so every minimum spanning tree contains $e$, and the minimum spanning tree is unique.
    - question:
        id: derivation-cut
        type: numeric
        system: s2
        prompt: |
          Four towns are split into the groups {A, B} and {C, D}. The roads crossing between the groups have lengths A–C 7, B–C 3 and B–D 5, and all road lengths in the graph are different. What is the length of the crossing road that every minimum spanning tree must contain?
        answer: "3"
        explanation: |
          By the cut property, the cheapest road across any cut is in every minimum spanning tree when lengths are distinct: B–C, of length 3.
    - text: |
        **Kruskal's method.** Sort the links by length, as in [[s3.sorting]], and take each in turn unless its two ends are already joined. Each link taken is the cheapest crossing the cut between the group containing one of its ends and everything else, so the cut property says it is safe. The question "are these two ends already joined?" is exactly what union-find, from [[s2.union-find]], answers: `find` each end, and if the roots differ, take the link and join the two groups by linking one root to the other. The sort costs $O(E \log E)$, and the union-find work is nearly linear, so sorting dominates. The method stops once $n - 1$ links are taken.

        **Prim's method.** Start from any node and grow one tree. Each step adds the cheapest link with exactly one end in the tree, which is the cheapest link crossing the cut between the tree and the rest, so it is safe too. A heap, from [[s2.heaps-and-priority-queues]], finds that link quickly: push `(length, node)` for every link out of each node added, pop the cheapest, and skip it if its node is already in the tree. It looks almost exactly like Dijkstra's algorithm, with one difference: the heap holds the length of the **last link**, not the distance from the start. Its cost is $O(E \log V)$.
    - question:
        id: derivation-tree-edges
        type: numeric
        system: s2
        prompt: |
          A data centre's 50 racks are to be joined by a minimum spanning tree of cables. How many cables does the tree have?
        answer: "49"
        explanation: |
          A tree on $n$ nodes has $n - 1$ edges: 49 cables join 50 racks, whatever the costs.
    - text: |
        **Clustering.** Stopping Kruskal's method early is useful in itself. With $k$ groups left, the shops, customers or data points in each group are those joined by the cheapest links, and the shortest link between two different groups, called the **spacing**, is as large as any grouping into $k$ groups can make it. This is called **single-linkage clustering**: a delivery company can split its shops into $k$ zones so that shops in different zones are as far apart as possible.

        **Greedy and right.** Both methods make the choice that looks best now and never undo it, the same short-sighted style as Dijkstra's algorithm. For spanning trees the cut property guarantees that short-sightedness costs nothing. That is unusual, and the next lesson asks when such greedy choices are safe in general.
    - question:
        id: order-kruskal
        type: order
        system: s2
        prompt: |
          Put the steps of Kruskal's method in order.
        steps:
          - "Sort the links from shortest to longest."
          - "Take the next link in sorted order and find the group of each of its ends."
          - "If the groups differ, keep the link and join the two groups."
          - "Stop once $n - 1$ links have been kept."
        explanation: |
          The links must be sorted before the next one can be taken, a link's groups must be found before deciding to keep it, and links are counted only as they are kept.
  formal:
    - text: |
        **Spanning tree.** A set of $n - 1$ edges joining all $n$ nodes of a connected graph with no cycle. **Minimum spanning tree**: one of least total weight.

        **Cut property.** For any partition of the nodes into two non-empty sets, a lightest edge crossing it lies in some minimum spanning tree; with distinct weights, the lightest crossing edge lies in every one, and the minimum spanning tree is unique.

        **Kruskal.** Edges in increasing weight; keep an edge when its ends are in different union-find groups. $O(E \log E)$.

        **Prim.** Grow from one node; repeatedly add the lightest edge leaving the tree, with a heap keyed on edge weight. $O(E \log V)$.

        **Single-linkage clustering.** Kruskal stopped at $k$ components; the lightest edge between components, the spacing, is the largest possible over all partitions into $k$ groups.
  drill:
    - text: Seconds each. Count links, find cuts, spot loops.
    - question:
        id: drill-edges
        type: numeric
        system: s1
        prompt: |
          How many links does a spanning tree of 12 towns have?
        answer: "11"
        explanation: A tree on $n$ nodes has $n - 1$ edges.
    - question:
        id: drill-skip
        type: choice
        system: s1
        prompt: |
          Kruskal's method reaches a link whose two ends are already joined by links it has kept. What does it do?
        options:
          - "Skips it, because it would close a loop"
          - "Keeps it, because it is the shortest left"
          - "Keeps it and drops the longest link kept so far"
          - "Stops"
        answer: 0
        explanation: Its ends are already joined, so adding it would only make a loop.
    - question:
        id: drill-triangle
        type: numeric
        system: s1
        prompt: |
          Three towns are joined by roads of lengths 2, 2 and 1. What is the total length of a minimum spanning tree?
        answer: "3"
        explanation: Keep the road of length 1 and one road of length 2; the other 2 would close the loop.
    - question:
        id: drill-heap-key
        type: choice
        system: s1
        prompt: |
          What does Prim's method store as the key of a node in its heap?
        options:
          - "The length of the link that would join the node to the tree"
          - "The node's distance from the start"
          - "The number of links out of the node"
          - "The node's name"
        answer: 0
        explanation: Prim adds the cheapest link leaving the tree. The distance from the start is Dijkstra's key, not Prim's.
    - question:
        id: drill-unique
        type: choice
        system: s1
        prompt: |
          A connected graph's link lengths are all different. How many minimum spanning trees does it have?
        options:
          - "Exactly one"
          - "Exactly two"
          - "As many as it has nodes"
          - "It depends on where Prim's method starts"
        answer: 0
        explanation: With distinct lengths, the cheapest link across every cut is in every minimum spanning tree, which pins down a single tree.
    - question:
        id: predict-sorted-links
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          links = [(4, "A", "B"), (1, "A", "C"), (2, "C", "B")]
          print(sorted(links)[0], sorted(links)[-1])
        output: "(1, 'A', 'C') (4, 'A', 'B')"
        explanation: Tuples sort by their first part, the length, so A–C of length 1 comes first and A–B of length 4 last. Putting the length first is what lets Kruskal's method sort links with a plain `sorted`.
    - question:
        id: predict-find
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          parent = [0, 1, 2, 3]

          def find(x):
              while parent[x] != x:
                  x = parent[x]
              return x

          parent[find(0)] = find(1)
          parent[find(2)] = find(3)
          print(find(0) == find(1), find(1) == find(2))
        output: "True False"
        explanation: 0 and 1 are joined, and 2 and 3 are joined, but nothing joins the two pairs yet.
  work:
    - text: Slower now. For each method, say which cut each kept link crosses, and what makes a link unsafe to keep.
    - question:
