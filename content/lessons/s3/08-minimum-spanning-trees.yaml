            def zone_spacing(n, roads, k):
                # Shops are numbered 0 to n - 1 and roads is a list of (km, a, b) that joins every shop.
                # Zones are formed by joining the two closest shops in different zones, again and
                # again, until k zones remain (k >= 2). Return the shortest road between two
                # different zones at that point.
                parent = list(range(n))

                def find(x):
                    while parent[x] != x:
                        x = parent[x]
                    return x

                zones = n
                for km, a, b in sorted(roads):
                    if zones == k:
                        return km
                    parent[find(a)] = find(b)
                    zones -= 1
                return None


            roads = [(1, 0, 2), (2, 2, 1), (2, 3, 4), (3, 4, 5), (4, 0, 1), (5, 1, 3), (6, 3, 5), (8, 2, 3), (10, 2, 4)]
            print(zone_spacing(6, roads, 2), zone_spacing(6, roads, 3))
        explanation: |
          This is Kruskal's method stopped early: join zones along roads shortest first, and once `k` zones remain, the next road between two different zones is the spacing. Returning the last road used to join is the longest join inside a zone, not the gap between zones; stopping at `k + 1` zones answers for one zone too many; and counting every road as a join, without checking that its ends lie in different zones, stops too soon.
