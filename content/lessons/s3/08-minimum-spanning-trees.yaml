          def zone_spacing(n, roads, k):
              # Shops are numbered 0 to n - 1 and roads is a list of (km, a, b) that joins every shop.
              # Zones are formed by joining the two closest shops in different zones, again and
              # again, until k zones remain (k >= 2). Return the shortest road between two
              # different zones at that point.
              parent = list(range(n))

              def find(x):
                  while parent[x] != x:
                      x = parent[x]
                  return x

              zones = n
              for km, a, b in sorted(roads):
                  ra = find(a)
                  rb = find(b)
                  if ra != rb:
                      if zones == k:
                          return km
                      parent[ra] = rb
                      zones -= 1
              return None


