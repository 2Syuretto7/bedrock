        solution: |
          def mst_cost(n, roads):
              # Towns are numbered 0 to n - 1, and roads is a list of (km, a, b). Return the total
              # length of the cheapest set of roads that joins every town, assuming one exists.
              parent = list(range(n))

              def find(x):
                  while parent[x] != x:
                      x = parent[x]
                  return x

              total = 0
              for km, a, b in sorted(roads):
                  ra = find(a)
                  rb = find(b)
                  if ra != rb:
                      parent[ra] = rb
                      total += km
              return total


          roads = [(1, 0, 2), (2, 2, 1), (2, 3, 4), (3, 4, 5), (4, 0, 1), (5, 1, 3), (6, 3, 5), (8, 2, 3), (10, 2, 4)]
          print(mst_cost(6, roads), mst_cost(4, [(1, 0, 1), (1, 2, 3), (9, 1, 2), (2, 0, 1), (2, 3, 2), (3, 0, 3)]))
