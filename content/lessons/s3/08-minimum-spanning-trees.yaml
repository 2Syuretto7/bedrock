    - question:
        id: work-tour
        type: choice
        system: s2
        prompt: |
          A salesperson must visit 30 towns and return home, and wants the shortest tour. Someone suggests building a minimum spanning tree of the towns. What is true?
        options:
          - "Its total length is a lower limit on the shortest tour, because removing one road from any tour leaves a spanning tree."
          - "The minimum spanning tree is the shortest tour."
          - "The shortest tour is always exactly twice the tree's length."
          - "The two problems have nothing to do with each other."
        answer: 0
        explanation: |
          A tour with one road removed is a path through every town, which is a spanning tree, so it is at least as long as the minimum spanning tree, and so is the tour. A tree is not a tour, since it branches and does not return home. Walking round the tree visits every town in at most twice its length, which is why the tree is a useful start for the tour problem rather than an answer to it.
  connections:
    - text: |
        14 lakh rupees. Taking links shortest first gives S–T 2, R–T 3, Q–R 4, and then P–R 5, which brings in the last village; every remaining link joins villages already joined. The cut property guarantees nothing cheaper exists: each of those four links was the cheapest way across some division of the villages.

        Kruskal's and Prim's methods are greedy, and here greed is provably right. [[s3.greedy-algorithms]] collects other problems where a simple rule of "take the best-looking choice now" is right, and shows the exchange argument that proves it, the same swap used for the cut property, along with problems where greed fails. And the last question's tour problem returns in [[s3.intractability-p-np-and-heuristics]]: no fast method is known for the shortest tour, but a tour built by walking round a minimum spanning tree is guaranteed to be at most twice the best when distances obey the triangle inequality.
