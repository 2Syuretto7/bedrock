          def _reference(_n, _roads):
              _best = None
              _m = len(_roads)
              for _mask in range(1 << _m):
                  _chosen = [_roads[_i] for _i in range(_m) if _mask >> _i & 1]
                  if len(_chosen) != _n - 1:
                      continue
                  _label = list(range(_n))
                  for _km, _a, _b in _chosen:
                      _la = _label[_a]
                      _lb = _label[_b]
                      _label = [_lb if _x == _la else _x for _x in _label]
