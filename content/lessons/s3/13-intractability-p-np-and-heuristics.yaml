        explanation: |
          The loop measures every town's distance from the start, town 0, rather than from `here`, the town the van has just reached, so it visits towns in order of distance from the depot. From the marker at 30, the closest new town is 45, not −40. Choosing `best` once, before the loop, leaves it pointing at a town already visited; `>` builds the farthest-neighbour tour; and `<=` breaks ties towards the highest-numbered town.
    - question:
        id: write-check
        type: code
        mode: write
        system: s2
        prompt: |
          A courier claims that some parcels weigh exactly `target` kg together, and lists their positions in `weights`. Write `check(weights, target, chosen)`, which returns `True` exactly when `chosen` names different parcels, each a valid position from 0 to `len(weights) - 1`, whose weights add up to `target`. It must be fast enough for 2,00,000 parcels.
        starter: |
          def check(weights, target, chosen):
              # True when chosen lists different parcels whose weights add up to target.
              return False


          weights = [120, 340, 90, 410, 250, 75]
          print(check(weights, 500, [2, 3]), check(weights, 500, [4, 4]), check(weights, 500, [1, 6]))
        solution: |
          def check(weights, target, chosen):
              # True when chosen lists different parcels whose weights add up to target.
              if len(set(chosen)) != len(chosen):
                  return False
              total = 0
              for i in chosen:
                  if i < 0 or i >= len(weights):
                      return False
                  total += weights[i]
              return total == target


          weights = [120, 340, 90, 410, 250, 75]
          print(check(weights, 500, [2, 3]), check(weights, 500, [4, 4]), check(weights, 500, [1, 6]))
        tests: |
          _w = [120, 340, 90, 410, 250, 75]
          _cases = [
              ([2, 3], 500, True),
              ([3, 2], 500, True),
              ([4, 4], 500, False),
              ([1, 6], 340, False),
              ([0, -1], 195, False),
              ([3, -2], 660, False),
              ([0, 1, 2], 550, True),
              ([0, 1, 2], 549, False),
              ([0, 1, 2], 551, False),
              ([], 0, True),
              ([], 5, False),
              ([0, 1, 2, 3, 4, 5], 1285, True),
              ([5, 5, 0], 270, False),
          ]
          for _chosen, _target, _want in _cases:
              _got = check(_w, _target, list(_chosen))
              assert _got == _want, "check(" + str(_w) + ", " + str(_target) + ", " + str(_chosen) + ") should be " + str(_want) + ", not " + str(_got)
          _big = list(range(1, 200001))
          _got = check(_big, 200000 * 200001 // 2, list(range(200000)))
          assert _got is True, "Choosing every parcel of weights 1 to 2,00,000 should add up to 20,00,01,00,000, so check should be True"
          assert output.strip() == "True False False", "The program should print True False False"
        wrong:
          - |
            def check(weights, target, chosen):
                # True when chosen lists different parcels whose weights add up to target.
                total = 0
                for i in chosen:
                    if i < 0 or i >= len(weights):
                        return False
                    total += weights[i]
                return total == target


            weights = [120, 340, 90, 410, 250, 75]
            print(check(weights, 500, [2, 3]), check(weights, 500, [4, 4]), check(weights, 500, [1, 6]))
          - |
