        explanation: |
          Each improving reversal can make another reversal worthwhile that was not before, so one pass is not enough: the loop must run until a whole pass finds nothing, which is what makes the result a local minimum. It always ends, because the tour gets strictly shorter each time and there are finitely many tours. Stopping after one pass, or after the first improvement, can leave a shortening reversal untried; and starting `i` at 0 moves the first town. The small tolerance stops rounding errors from swapping two tours of equal length forever.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          A van leaves its depot, visits 24 shops in any order and returns. Checking a billion routes a second, counting each route and its reverse as one, about how many million years does it take to check them all?
        answer: "9.8"
        tolerance: "0.3"
        explanation: |
          There are $24!/2 \approx 3.1 \times 10^{23}$ routes. At $10^9$ a second that is $3.1 \times 10^{14}$ seconds, and a year has about $3.16 \times 10^7$ seconds, so about $9.8$ million years.
    - question:
        id: work-timetable
        type: choice
        system: s2
        prompt: |
          A university must fit 400 exams into as few slots as possible so that no student has two at once. A colleague proposes a program that tries every way of assigning exams to slots, to be sure of the true minimum. What should you do?
        options:
          - "Recognise it as graph colouring, which is NP-hard; use a good heuristic or a solver, accept a number of slots near the minimum, and check that the timetable has no clashes."
          - "Try every assignment, since 400 exams is a small input for a modern computer."
          - "Keep searching for a polynomial-time algorithm that always finds the minimum, since one surely exists."
          - "Give every exam its own slot, which is guaranteed to be correct."
        answer: 0
        explanation: |
          With even 10 slots there are $10^{400}$ assignments. Colouring is NP-hard, so no known method finds the minimum fast for every input, and finding one would settle P against NP. Good heuristics and solvers handle real timetables well, and the result is cheap to check. 400 slots is correct but useless.
