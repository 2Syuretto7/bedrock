concept: s3.intractability-p-np-and-heuristics
minutes: 90
claim: You can tell polynomial from exponential running time in practice, say what P, NP, reductions and NP-completeness mean and why no fast algorithm is expected for problems such as the shortest tour, graph colouring and subset sum, and respond to one sensibly, by checking proposed answers quickly, solving small cases exactly, exploiting special structure, using an approximation with a guarantee, or improving a tour with nearest neighbour and 2-opt.
recalls: [s3.randomised-algorithms]
uses: [s3.dynamic-programming, s3.minimum-spanning-trees, s3.greedy-algorithms, s3.measuring-and-predicting-running-time, f3.permutations-and-combinations, f3.graph-theory-basics]
leads: [q0.tables-rows-and-keys, d8.scheduling-as-bin-packing, q3.cost-based-optimisation-and-join-ordering]
starter: |
  # Scratch space. How long would checking every tour take?
  tours = 1
  for k in range(1, 25):
      tours *= k
  tours //= 2
  seconds = tours / 10 ** 9
  print(tours, seconds / (365 * 24 * 3600))
parts:
  recall:
    - text: |
        [[s3.randomised-algorithms]] closed a run of problems that all had fast algorithms: sorting, searching, shortest paths, spanning trees, and dynamic programmes, with or without coins. Every one ran in time a modest power of $n$. This lesson meets problems for which nobody has found such an algorithm in more than fifty years of trying, and asks what an engineer should do when one turns up at work. Three quick pulls first.
  puzzle:
    - text: |
        A delivery van leaves its depot, visits 24 shops, and returns to the depot. It may visit the shops in any order. A computer works out the length of a billion possible routes every second, and tries every route to find the shortest. A route and the same route driven backwards count as one.

        **Roughly how many million years does the computer need?**
  intuition:
    - text: |
        Some problems look innocent and turn out to be monsters. A distributor in Pune plans the day's route for a van through two dozen kirana shops. A university places 400 exams into as few slots as possible so that no student sits two at once. A courier packs parcels into a truck so their weights come as close as possible to its limit. Each is easy to state, and for each the only method known to be exact in every case is, at heart, trying an enormous number of possibilities.

        The route problem is the **travelling salesperson problem**: the shortest **tour** that visits every town once and returns to the start. The obvious greedy idea, from [[s3.greedy-algorithms]], is **nearest neighbour**: from wherever you are, drive to the closest town not yet visited. It is fast, but greedy choices can paint a tour into a corner. A better idea is to take any tour and improve it: if reversing a stretch of it makes it shorter, do so, and repeat. This is **2-opt**, named after the two roads each reversal replaces. The figure starts from the nearest-neighbour tour through nine towns, with distances in km. Step through the improvements.
    - figure: tour-heuristic
      props: { step: 0 }
    - text: |
        Nearest neighbour gives 312.7 km. It leaves H, alone at the far right, until last, and then pays 87.3 km to reach it from G and 71.6 km to come home. Three reversals bring the tour down to 213.9 km, 32% shorter, and here that happens to be the best of all 20,160 tours. Neither method promises that. Each is a **heuristic**: a method that usually does well, with no guarantee for every input.
  derivation:
    - text: |
        **Polynomial and exponential.** With $n$ towns and the start fixed, the other $n - 1$ can come in any order, $(n-1)!$ orders by [[f3.permutations-and-combinations]], and each tour is counted twice, once in each direction: $(n-1)!/2$ tours. Even an algorithm taking $2^n$ steps, far better than that, is hopeless at a few hundred. Here is the time for $n^3$, $2^n$ and $n!$ steps at a billion steps a second:

        | $n$ | $n^3$ steps | $2^n$ steps | $n!$ steps |
        | --- | --- | --- | --- |
        | 10 | 1 microsecond | 1 microsecond | 3.6 milliseconds |
        | 20 | 8 microseconds | 1 millisecond | 77 years |
        | 30 | 27 microseconds | 1.1 seconds | $8 \times 10^{15}$ years |
        | 50 | 125 microseconds | 13 days | $10^{48}$ years |
        | 100 | 1 millisecond | $4 \times 10^{13}$ years | $3 \times 10^{141}$ years |

        The universe is about $1.4 \times 10^{10}$ years old. A faster computer barely helps: a machine a thousand times faster lets a $2^n$ algorithm handle only 10 more towns in the same time, since $2^{10} = 1{,}024$. So the line that matters, as [[s3.measuring-and-predicting-running-time]] suggested, is between running times that are a **polynomial** in $n$, such as $n \log n$ or $n^3$, and those that are **exponential**, such as $2^n$ or $n!$.
    - question:
        id: derivation-tours
        type: numeric
        system: s2
        prompt: |
          How many different tours pass through 6 towns, counting a tour and the same tour driven backwards as one?
        answer: "60"
        explanation: |
          Fix the start. The other five towns can come in $5! = 120$ orders, and each tour appears twice among them, once in each direction: $120 / 2 = 60$.
    - text: |
        **P and NP.** Phrase each problem as a yes-or-no question: is there a tour of at most 2,000 km? Can these exams fit in 12 slots? Is there a set of parcels weighing exactly 1,000 kg? **P** is the class of such questions that some algorithm answers in polynomial time. **NP** is the class where every yes has a **certificate** that can be checked in polynomial time: show the tour, and anyone can add up its roads and compare with 2,000; show the slots, and anyone can check that no student has a clash. Finding the certificate may be the hard part. Every problem in P is in NP, since a fast algorithm can check a yes by solving the problem itself. Whether $\text{P} = \text{NP}$, whether every problem whose answers are easy to check is also easy to solve, has been open since 1971, and the Clay Mathematics Institute offers a million dollars to whoever settles it.

        **Reductions.** Problem A **reduces** to problem B if every case of A can be turned, in polynomial time, into a case of B with the same answer. Then a fast algorithm for B gives one for A. Exam timetabling is the colouring problem of [[f3.graph-theory-basics]] in disguise: make each exam a node, join two exams that share a student, and give each slot a colour; a timetable without clashes is a colouring in which joined nodes differ. It works the other way too. Any graph can be written as a timetabling problem, with an exam for each node and, for each edge, a student who sits both of its exams, so a fast timetabler would colour any graph fast.

        **NP-complete.** A problem is **NP-complete** if it is in NP and every problem in NP reduces to it. In 1971 Stephen Cook showed that satisfiability, whether some assignment of true and false to the variables makes a given logical formula true, is NP-complete. In 1972 Richard Karp used it to show that 21 well-known problems are NP-complete, and thousands are now known: the tour question, graph colouring with three or more colours, subset sum, packing, many kinds of scheduling, and large Sudoku. A fast algorithm for any one of them would give fast algorithms for all of NP. Since none has been found, despite enormous effort by people who very much wanted one, most researchers believe that $\text{P} \ne \text{NP}$, though nobody can prove it. A problem at least that hard, whether or not it is in NP, is called **NP-hard**; finding the shortest tour, rather than answering yes or no, is one.
    - question:
        id: derivation-held-karp
        type: numeric
        system: s2
        prompt: |
          A dynamic programme for the shortest tour takes about $n^2 2^n$ steps for $n$ towns. At a billion steps a second, about how many seconds does it need for 25 towns?
        answer: "21"
        tolerance: "1"
        explanation: |
          $25^2 \times 2^{25} = 625 \times 3{,}35{,}54{,}432 \approx 2.1 \times 10^{10}$ steps, about 21 seconds. Trying every one of the $24!/2$ tours would take about ten million years.
    - text: |
        **What to do instead.** Being NP-hard says that no known algorithm is fast on every input. It says nothing against the inputs you actually have, and it leaves several honest ways forward.

        *Small cases, exactly.* Brute force is not the only exact method. Recording, for each set of towns visited and each town to end at, the shortest path doing so, as [[s3.dynamic-programming]] did with its tables, takes about $n^2 2^n$ steps: still exponential, but 25 towns now take seconds. Branch and bound, which abandons any partial tour already longer than the best complete one found, often does far better in practice.

        *Special structure.* Many hard problems are easy in special cases. Towns along a single highway are visited in order. Subset sum and packing with small whole-number weights fall to a table indexed by weight, in steps proportional to $n$ times the capacity, as in [[s3.dynamic-programming]]; that is fast when the capacity is small, though exponential in the number of digits needed to write it.

        *Approximation with a guarantee.* If no road is longer than a detour through another town, a tour at most twice the best one can be built from the cheapest spanning tree of [[s3.minimum-spanning-trees]]. Deleting one road from the best tour leaves a path through every town, which is a spanning tree, so the cheapest tree is no longer than the best tour. Walking around the tree, along each of its roads once in each direction, visits every town at a cost of twice the tree. Then skip each town already visited, driving straight to the next new one, which never adds length. The result is at most twice the best tour, guaranteed. In 1976 Nicos Christofides improved the factor to $1.5$.
    - question:
        id: order-twice
        type: order
        system: s2
        prompt: |
          Put the steps of the method that builds a tour at most twice the best one in order.
        steps:
          - "Find the cheapest spanning tree of the towns."
          - "Walk around the tree, along each of its roads once in each direction."
          - "Skip every town already visited, driving straight to the next new one."
          - "The result is a tour at most twice the tree's length, so at most twice the best tour."
        explanation: |
          The walk follows the tree, the shortcuts need the walk, and the bound on the final tour rests on the shortcuts never adding length and the tree being no longer than the best tour.
    - text: |
        *Heuristics.* When no guarantee is good enough to matter, practice wins. On towns scattered at random, nearest-neighbour tours typically come out about 25% longer than the best, and 2-opt brings them to within about 5%. Restarting 2-opt from many random tours, and keeping the best result, uses the coins of [[s3.randomised-algorithms]] to escape poor local minima, where no single reversal helps but the tour is still far from the best. **Simulated annealing** goes further by sometimes accepting a change for the worse, less often as the search goes on. Delivery firms plan millions of stops a day with such methods, and exact solvers built on bounds and pruning have found the provably shortest tour through 85,900 points.

        *Solvers.* Satisfiability, though NP-complete, is solved routinely in practice: modern SAT solvers handle industrial formulas with millions of variables, checking chips and scheduling factories. Often the best engineering answer to an NP-hard problem is to write it in a form such a solver accepts and let decades of tuning do the work.
  formal:
    - text: |
        **Polynomial time.** At most $c\,n^k$ steps on inputs of size $n$, for some constants $c$ and $k$.

        **P.** Yes-or-no problems solvable in polynomial time. **NP.** Yes-or-no problems whose yes-answers have certificates checkable in polynomial time. $\text{P} \subseteq \text{NP}$; whether they are equal is open.

        **Reduction.** A reduces to B if a polynomial-time translation turns each case of A into a case of B with the same answer. Then a polynomial-time algorithm for B gives one for A.

        **NP-complete.** In NP, and every problem in NP reduces to it: satisfiability, the tour decision problem, graph colouring with $k \ge 3$ colours, subset sum, and thousands more. **NP-hard.** At least as hard: every problem in NP reduces to it.

        **Travelling salesperson.** $(n-1)!/2$ tours through $n$ towns; exact by dynamic programming in $O(n^2 2^n)$ time. With the triangle inequality, the spanning-tree tour is at most $2 \times$ the best; Christofides', at most $1.5 \times$.

        **Heuristic.** A method without a guarantee for every input. **Local search** such as 2-opt repeatedly makes an improving change until none is left, reaching a **local minimum**, which need not be the best overall.
  drill:
    - text: Seconds each. Check, do not search.
    - question:
        id: drill-five
        type: numeric
        system: s1
        prompt: |
          How many different tours pass through 5 towns, counting a tour and its reverse as one?
        answer: "12"
        explanation: $4!/2 = 24/2 = 12$.
    - question:
        id: drill-ten-more
        type: numeric
        system: s1
        prompt: |
          An algorithm takes $2^n$ steps. How many times longer does it take for $n + 10$ items than for $n$?
        answer: "1024"
        explanation: $2^{n+10} / 2^n = 2^{10} = 1{,}024$.
    - question:
        id: drill-np
        type: choice
        system: s1
        prompt: |
          What puts a yes-or-no problem in NP?
        options:
          - "Every yes-answer has a certificate that can be checked in polynomial time."
          - "It cannot be solved in polynomial time."
          - "Its answers can be found in polynomial time."
          - "It has no algorithm at all."
        answer: 0
        explanation: NP is about checking. Problems in P are in NP too, and nobody has proved that any problem in NP is outside P.
    - question:
        id: drill-direction
        type: choice
        system: s1
        prompt: |
          Problem A reduces to problem B, and B has a polynomial-time algorithm. What follows?
        options:
          - "A has a polynomial-time algorithm."
          - "B is NP-complete."
          - "A is NP-hard."
          - "Nothing about A."
        answer: 0
        explanation: Translate A's case into B's in polynomial time, then solve it with B's algorithm.
    - question:
        id: drill-twice
        type: numeric
        system: s1
        prompt: |
          A method guarantees a tour at most twice the best. It returns a tour of 300 km. What is the least the best tour can be, in km?
        answer: "150"
        explanation: $300 \le 2 \times \text{best}$, so the best is at least 150 km.
    - question:
        id: predict-certificate
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          weights = [7, 3, 9, 4]
          chosen = [0, 3]
          total = 0
          for i in chosen:
              total += weights[i]
          print(total, total == 11)
        output: "11 True"
        explanation: Checking the proposed parcels takes one pass over them, $7 + 4 = 11$; finding them could mean trying many subsets.
    - question:
        id: predict-orders
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          count = 1
          for k in range(1, 6):
              count *= k
          print(count, count // 2)
        output: "120 60"
        explanation: $5! = 120$ orders of the five towns after a fixed start, and 60 tours once each is paired with its reverse.
  work:
    - text: Slower now. Check answers quickly, build tours greedily, then improve them.
    - question:
        id: fix-nearest
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `nearest_tour` should start at town 0 and repeatedly move to the closest town not yet visited, the lowest-numbered if two are equally close. On a highway with towns at the km markers 0, 30, −40, 45 and −50, the program should print `[0, 1, 3, 2, 4]`. It prints `[0, 1, 2, 3, 4]`. Find the fault and fix it.
        starter: |
          def distance(p, q):
              return ((p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2) ** 0.5


          def nearest_tour(points):
              # Start at town 0; repeatedly go to the closest town not yet visited.
              tour = [0]
              left = list(range(1, len(points)))
              while left:
                  here = tour[-1]
                  best = left[0]
                  for t in left:
                      if distance(points[0], points[t]) < distance(points[0], points[best]):
                          best = t
                  tour.append(best)
                  left.remove(best)
              return tour


          highway = [(0, 0), (30, 0), (-40, 0), (45, 0), (-50, 0)]
          print(nearest_tour(highway))
        solution: |
          def distance(p, q):
              return ((p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2) ** 0.5


          def nearest_tour(points):
              # Start at town 0; repeatedly go to the closest town not yet visited.
              tour = [0]
              left = list(range(1, len(points)))
              while left:
                  here = tour[-1]
                  best = left[0]
                  for t in left:
                      if distance(points[here], points[t]) < distance(points[here], points[best]):
                          best = t
                  tour.append(best)
                  left.remove(best)
              return tour


          highway = [(0, 0), (30, 0), (-40, 0), (45, 0), (-50, 0)]
          print(nearest_tour(highway))
        tests: |
          import random as _random


          def _reference(points):
              _d = lambda p, q: ((p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2) ** 0.5
              _tour = [0]
              _left = list(range(1, len(points)))
              while _left:
                  _here = points[_tour[-1]]
                  _best = _left[0]
                  for _t in _left:
                      if _d(_here, points[_t]) < _d(_here, points[_best]):
                          _best = _t
                  _tour.append(_best)
                  _left.remove(_best)
              return _tour


          _rng = _random.Random(29)
          _cases = [[(0, 0)], [(0, 0), (5, 5)], [(0, 0), (1, 0), (-1, 0)], [(0, 0), (0, 2), (2, 0), (1, 1)], [(0, 0), (30, 0), (-40, 0), (45, 0), (-50, 0)]]
          for _ in range(40):
              _cases.append([(_rng.randint(0, 9), _rng.randint(0, 9)) for _ in range(_rng.randint(2, 9))])
          for _points in _cases:
              _want = _reference(_points)
              _got = nearest_tour(list(_points))
              assert _got == _want, "nearest_tour(" + str(_points) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "[0, 1, 3, 2, 4]", "The program should print [0, 1, 3, 2, 4]"
