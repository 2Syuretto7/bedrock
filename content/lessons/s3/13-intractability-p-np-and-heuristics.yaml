                        return False
                    total += weights[i]
                return total == target


            weights = [120, 340, 90, 410, 250, 75]
            print(check(weights, 500, [2, 3]), check(weights, 500, [4, 4]), check(weights, 500, [1, 6]))
          - |
            def check(weights, target, chosen):
                # True when chosen lists different parcels whose weights add up to target.
                if len(set(chosen)) != len(chosen):
                    return False
                total = 0
                for i in chosen:
                    if i < 0 or i >= len(weights):
                        return False
                    total += weights[i]
                return total >= target


            weights = [120, 340, 90, 410, 250, 75]
            print(check(weights, 500, [2, 3]), check(weights, 500, [4, 4]), check(weights, 500, [1, 6]))
        explanation: |
          A set holds each position once, so comparing its size with the list's catches a parcel named twice; each position must be checked before it is used; and the total must equal the target exactly. The whole check is one pass, linear time, while finding such parcels could mean trying all $2^n$ subsets. That gap is NP in miniature. Without the repeat check, `[4, 4]` counts one 250 kg parcel twice; without the lower bound, Python reads `-1` as the last parcel; and `>=` accepts any heavier set.
    - question:
        id: write-two-opt
        type: code
        mode: write
        system: s2
        prompt: |
          Complete `two_opt(points, tour)`. For every pair of places `i < j`, with `i` at least 1 so the first town stays first, try reversing the stretch of the tour from place `i` to place `j`, and keep the change if the tour becomes shorter by more than `1e-9`. Repeat until no such reversal shortens the tour, and return it, without changing `tour`.
        starter: |
          def distance(p, q):
              return ((p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2) ** 0.5


          def length(points, tour):
              total = 0
              for k in range(len(tour)):
                  total += distance(points[tour[k]], points[tour[(k + 1) % len(tour)]])
              return total


          def two_opt(points, tour):
              # Return a tour that no reversal of a stretch can shorten, keeping tour[0] first.
              best = list(tour)
              return best


          square = [(0, 0), (1, 1), (1, 0), (0, 1)]
          print(round(length(square, [0, 1, 2, 3]), 2), round(length(square, two_opt(square, [0, 1, 2, 3])), 2))
        solution: |
          def distance(p, q):
              return ((p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2) ** 0.5


          def length(points, tour):
              total = 0
              for k in range(len(tour)):
                  total += distance(points[tour[k]], points[tour[(k + 1) % len(tour)]])
              return total


          def two_opt(points, tour):
              # Return a tour that no reversal of a stretch can shorten, keeping tour[0] first.
              best = list(tour)
              improved = True
              while improved:
                  improved = False
                  for i in range(1, len(best) - 1):
                      for j in range(i + 1, len(best)):
                          trial = best[:i] + best[i:j + 1][::-1] + best[j + 1:]
                          if length(points, trial) < length(points, best) - 1e-9:
                              best = trial
