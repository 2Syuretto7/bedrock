    - text: |
        About 9.8 million years: $24!/2$ is roughly $3.1 \times 10^{23}$ routes. The dynamic programme over sets of towns needs about 21 seconds for the same van, and nearest neighbour followed by 2-opt gives a route within a few per cent of the best in well under a millisecond. Knowing that a problem is NP-hard does not end the work; it tells you which kind of answer to aim for.

        Hard problems of this kind recur throughout systems work. [[d8.scheduling-as-bin-packing]] places containers onto machines, a packing problem solved with greedy heuristics, and [[q3.cost-based-optimisation-and-join-ordering]] chooses the order of a database query's joins, where the number of orders grows like a factorial and optimisers use dynamic programming for small queries and heuristics for large ones.

        That closes the algorithms cluster. The next one turns from computing answers to keeping data. [[q0.tables-rows-and-keys]] starts with how a database organises facts as tables of rows, each identified by a key, the foundation under every query that follows.
