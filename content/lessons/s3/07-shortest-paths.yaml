          def cheapest(stops, fares, start):
              # fares is a list of (from_stop, to_stop, rupees); a fare can be negative when a
              # cashback offer pays more than the ticket costs. Return a dictionary of the cheapest
              # total from start to every stop it can reach, or None if some reachable loop of
              # fares adds up to less than zero, so that riding round it forever gets ever cheaper.
              cost = {start: 0}
              for _ in range(len(stops) - 1):
                  for a, b, rupees in fares:
                      if a in cost and (b not in cost or cost[a] + rupees < cost[b]):
                          cost[b] = cost[a] + rupees
              for a, b, rupees in fares:
                  if a in cost and (b not in cost or cost[a] + rupees < cost[b]):
                      return None
              return cost


