                return cost


            stops = ["P", "Q", "R", "S"]
            fares = [("P", "Q", 40), ("P", "R", 100), ("Q", "R", 50), ("R", "S", -70), ("Q", "S", 30)]
            print(cheapest(stops, fares, "P"), cheapest(stops, fares + [("S", "Q", 10)], "P"))
        explanation: |
          Bellman and Ford: relax every fare, and repeat $V - 1$ times, enough for the longest route that repeats no stop; if one more pass still finds an improvement, a negative loop is reachable. A single pass is enough only when the fares happen to be listed in route order; skipping the final check returns ever-shrinking totals instead of `None`; and keeping the first total found ignores cheaper routes found later, which is the same mistake as in the first question.
