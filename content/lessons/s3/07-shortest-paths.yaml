            import heapq


            def shortest(graph, start):
                # graph maps each town to a list of (neighbour, km) pairs, with every km >= 0.
                # Return a dictionary of the shortest distance from start to every town it can reach.
                dist = {}
                heap = [(0, start)]
                done = set()
                while heap:
                    d, here = heapq.heappop(heap)
                    if here not in done:
                        done.add(here)
                        for there, km in graph[here]:
                            if there not in dist or d + km < dist[there]:
                                dist[there] = d + km
                                heapq.heappush(heap, (d + km, there))
                return dist


            roads = [("A", "B", 4), ("A", "C", 1), ("C", "B", 2), ("B", "D", 5), ("C", "D", 8), ("C", "E", 10), ("D", "E", 2), ("D", "F", 6), ("E", "F", 3)]
            graph = {town: [] for town in "ABCDEF"}
            for a, b, km in roads:
                graph[a].append((b, km))
                graph[b].append((a, km))
            dist = shortest(graph, "A")
            print(dist["B"], dist["D"], dist["F"])
        explanation: |
          The first distance found for a town is not always the shortest: B is reached at 4 straight from A, and only later at 3 through C. A distance must be replaced whenever a shorter one turns up, which is relaxation. Taking pairs from the front of the list instead of the heap settles towns in the order they were found, not by distance; pushing the road's length instead of the total distance orders the heap by the wrong number; and leaving the start out of `dist` lets it be given a distance through its neighbours.
    - question:
        id: write-fastest-route
        type: code
        mode: write
        system: s2
        prompt: |
          Write `fastest_route(graph, start, goal)` for a graph whose links have travel times of at least 0, given as `(next stop, minutes)` pairs. Return `(minutes, route)` for a fastest route, where `route` lists the stops from `start` to `goal`, or `None` if `goal` cannot be reached.
        starter: |
          import heapq


          def fastest_route(graph, start, goal):
              # graph maps each stop to a list of (next stop, minutes) pairs, with minutes >= 0.
              # Return (minutes, route) for a fastest route from start to goal, where route is the
              # list of stops from start to goal, or None if goal cannot be reached.
              return None


          city = {
              "home": [("market", 10), ("station", 30), ("office", 50)],
              "market": [("station", 15), ("office", 40)],
              "station": [("office", 20)],
              "office": [],
          }
          print(fastest_route(city, "home", "office"), fastest_route(city, "office", "home"))
        solution: |
          import heapq


          def fastest_route(graph, start, goal):
              # graph maps each stop to a list of (next stop, minutes) pairs, with minutes >= 0.
              # Return (minutes, route) for a fastest route from start to goal, where route is the
              # list of stops from start to goal, or None if goal cannot be reached.
              best = {start: 0}
              parent = {start: None}
              heap = [(0, start)]
              done = set()
              while heap:
                  d, here = heapq.heappop(heap)
                  if here == goal:
                      route = []
                      while here is not None:
                          route.append(here)
                          here = parent[here]
                      route.reverse()
                      return d, route
                  if here not in done:
                      done.add(here)
                      for there, minutes in graph[here]:
                          if there not in best or d + minutes < best[there]:
                              best[there] = d + minutes
                              parent[there] = here
                              heapq.heappush(heap, (d + minutes, there))
              return None


          city = {
              "home": [("market", 10), ("station", 30), ("office", 50)],
              "market": [("station", 15), ("office", 40)],
              "station": [("office", 20)],
              "office": [],
          }
          print(fastest_route(city, "home", "office"), fastest_route(city, "office", "home"))
        tests: |
          import random as _random


          def _reference(_graph, _start):
              _dist = {_start: 0}
              for _ in range(len(_graph)):
                  for _u in list(_dist):
                      for _v, _w in _graph[_u]:
                          if _v not in _dist or _dist[_u] + _w < _dist[_v]:
                              _dist[_v] = _dist[_u] + _w
              return _dist


          _rng = _random.Random(23)
          _graphs = [
              {"home": [("market", 10), ("station", 30), ("office", 50)], "market": [("station", 15), ("office", 40)], "station": [("office", 20)], "office": []},
              {"a": [("b", 1), ("c", 5)], "b": [("c", 1)], "c": []},
              {"x": []},
          ]
          for _ in range(40):
              _n = _rng.randint(1, 7)
              _names = ["s" + str(_i) for _i in range(_n)]
              _g = {_x: [] for _x in _names}
              for _ in range(_rng.randint(0, 14)):
                  _a = _rng.choice(_names)
                  _b = _rng.choice(_names)
                  if _a != _b:
                      _g[_a].append((_b, _rng.randint(0, 9)))
              _graphs.append(_g)
          for _g in _graphs:
              for _start in _g:
                  _dist = _reference(_g, _start)
                  for _goal in _g:
                      _got = fastest_route(_g, _start, _goal)
                      _name = "fastest_route(" + str(_g) + ", " + repr(_start) + ", " + repr(_goal) + ")"
                      if _goal not in _dist:
                          assert _got is None, _name + " should be None, because the goal cannot be reached, not " + str(_got)
                          continue
                      assert _got is not None and len(_got) == 2, _name + " should be a pair (minutes, route), not " + str(_got)
                      _minutes, _route = _got
                      assert _minutes == _dist[_goal], _name + " should take " + str(_dist[_goal]) + " minutes, not " + str(_minutes)
                      assert len(_route) > 0 and _route[0] == _start and _route[-1] == _goal, _name + " should give a route from " + repr(_start) + " to " + repr(_goal) + ", not " + str(_route)
                      _total = 0
                      for _i in range(len(_route) - 1):
                          _legs = [_w for _v, _w in _g[_route[_i]] if _v == _route[_i + 1]]
                          assert _legs, _name + " gave the route " + str(_route) + ", but there is no direct link from " + repr(_route[_i]) + " to " + repr(_route[_i + 1])
                          _total += min(_legs)
                      assert _total == _dist[_goal], _name + " gave the route " + str(_route) + ", which takes " + str(_total) + " minutes, not " + str(_dist[_goal])
