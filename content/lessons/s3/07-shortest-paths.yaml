    - question:
        id: work-arbitrage
        type: choice
        system: s2
        prompt: |
          A trading desk has exchange rates between twenty currencies and wants to know whether some loop of exchanges turns ₹100 into more than ₹100. Which approach answers it?
        options:
          - "Give each exchange the length $-\\log(\\text{rate})$ and look for a negative cycle with Bellman and Ford's method."
          - "Give each exchange the length rate and run Dijkstra's algorithm."
          - "Run breadth-first search from rupees."
          - "Sort the rates and multiply the largest ones."
        answer: 0
        explanation: |
          A loop is profitable when its rates multiply to more than 1, which is when the sum of their logarithms is positive, so the sum of $-\log(\text{rate})$ is negative. Lengths of that kind can be negative, which rules out Dijkstra, and Bellman and Ford's extra pass finds exactly such loops. Breadth-first search ignores the rates, and the largest rates need not form a loop.
  connections:
    - text: |
        45 minutes: home, market, station, office. The direct bus takes 50, and so does the route through the market alone, but the two short hops to the station, 25 minutes in all, beat the 30-minute bus there, and the last 20 minutes finish it. Dijkstra's algorithm would settle the market at 10, the station at 25 and the office at 45, in that order.

        Dijkstra's algorithm makes the choice that looks best right now, the nearest unsettled node, and never revisits it. Algorithms that work that way are greedy, and [[s3.greedy-algorithms]] asks when such short-sighted choices are safe. [[s3.minimum-spanning-trees]] is the next case, where a greedy choice connects every town with the least total road rather than reaching each one by the shortest route. Bellman and Ford's passes, where each pass builds on the best routes of the one before, are a first example of [[s3.dynamic-programming]].
