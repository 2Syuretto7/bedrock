            import heapq


            def fastest_route(graph, start, goal):
                # graph maps each stop to a list of (next stop, minutes) pairs, with minutes >= 0.
                # Return (minutes, route) for a fastest route from start to goal, where route is the
                # list of stops from start to goal, or None if goal cannot be reached.
                best = {start: 0}
                parent = {start: None}
                heap = [(0, start)]
                done = set()
                if start == goal:
                    return 0, [start]
                while heap:
                    d, here = heapq.heappop(heap)
                    if here not in done:
                        done.add(here)
                        for there, minutes in graph[here]:
                            if there not in best or d + minutes < best[there]:
                                best[there] = d + minutes
                                parent[there] = here
                                heapq.heappush(heap, (d + minutes, there))
                                if there == goal:
                                    route = []
                                    stop = there
                                    while stop is not None:
                                        route.append(stop)
                                        stop = parent[stop]
                                    route.reverse()
                                    return best[there], route
                return None


            city = {
                "home": [("market", 10), ("station", 30), ("office", 50)],
                "market": [("station", 15), ("office", 40)],
                "station": [("office", 20)],
                "office": [],
            }
            print(fastest_route(city, "home", "office"), fastest_route(city, "office", "home"))
        explanation: |
          Dijkstra's algorithm with a parent recorded every time a distance improves; when the goal is popped its distance is final, and following parents back and reversing gives the route. Forgetting to reverse gives the route backwards; keeping the first parent found keeps the parent of a route that was later beaten; and returning as soon as the goal is pushed returns the direct 50-minute bus before the 45-minute route has been found.
