concept: s3.shortest-paths
minutes: 95
claim: You can find the shortest routes from one place to every other in a graph whose edges have lengths, by relaxing edges in topological order when there are no cycles, by Dijkstra's algorithm with a heap when no length is negative, and by Bellman and Ford's repeated passes when some are, which also detect a loop whose total is negative, and you can recover the route itself from the parents.
recalls: [s3.topological-sort]
uses: [s3.breadth-first-and-depth-first-search, s2.heaps-and-priority-queues, s2.graphs-and-their-representations, f3.graph-theory-basics, f2.loop-invariants, f2.contrapositive-and-contradiction, f1.logarithms, s0.dictionaries-and-sets]
leads: [s3.minimum-spanning-trees, s3.greedy-algorithms, s3.dynamic-programming]
starter: |
  # Scratch space. A heap always gives back its smallest item first.
  import heapq

  heap = []
  for item in [(30, "station"), (10, "market"), (50, "office")]:
      heapq.heappush(heap, item)
  while heap:
      print(heapq.heappop(heap))
parts:
  recall:
    - text: |
        [[s3.topological-sort]] put tasks in an order that respects every arrow, and computed a project's earliest finish in one pass along that order. A road map is a graph too, but its edges have lengths, travel times or fares, and it has cycles, since roads lead back to where they started. Finding the shortest route on such a map is the problem every navigation app solves millions of times a day. Three quick pulls first.
  puzzle:
    - text: |
        Buses in a small town take these times, in minutes, each in one direction only:

        - home to market 10, home to station 30, home to office 50;
        - market to station 15, market to office 40;
        - station to office 20.

        Changing buses takes no time. **What is the fewest minutes in which you can get from home to the office?**
  intuition:
    - text: |
        Breadth-first search, from [[s3.breadth-first-and-depth-first-search]], found routes with the fewest edges. With lengths on the edges, the fewest edges is no longer the shortest route: the direct bus to the office is one ride, but not the quickest.

        Imagine pouring water in at the start, with every road a pipe whose length is the time water takes to flow through it. The water reaches places in order of their true distance: the nearest place first, then the next nearest, and so on, and the moment it arrives somewhere, that arrival time is final. **Dijkstra's algorithm** simulates this. It keeps a best-known distance for every place, repeatedly takes the closest place not yet settled, declares its distance final, and checks whether going through it improves the best-known distance of its neighbours.

        The figure runs it on six towns from A. Step through it and watch the best-known distances shrink as towns are settled.
    - figure: shortest-path
      props: { step: 0 }
    - text: |
        A is settled first, at 0, and offers B 4 and C 1. C is nearer, so it is settled next, and through C, B improves from 4 to 3. The towns are settled in the order A, C, B, D, E, F, at distances 0, 1, 3, 8, 10 and 13, and none of those numbers changes after its town is settled. The shortest route to F winds through every other town, A, C, B, D, E, F, because the short roads add up to less than the direct long ones.
  derivation:
    - text: |
        **Relaxation.** Every algorithm in this lesson keeps a best-known distance $d(v)$ for each node, starting with 0 for the start and "not reached" for the rest, and improves it with one move. For an edge from $u$ to $v$ of length $w$:

        $$\text{if } d(u) + w < d(v), \text{ set } d(v) = d(u) + w \text{ and the parent of } v \text{ to } u.$$

        This is called **relaxing** the edge. A best-known distance is always the length of some real route, so it can only be too large, never too small. The algorithms differ in which edges they relax, and in what order. Following parents back from any node gives the route, as with breadth-first search.

        **Graphs without cycles.** If the graph is a DAG, relax the edges out of each node in a topological order. When a node's turn comes, every edge into it has already been relaxed, so its distance is final. One pass, $\Theta(V + E)$, and it works even when some lengths are negative. The earliest-finish calculation of the last lesson was this pass, with "longest" in place of "shortest".
    - question:
        id: derivation-dag
        type: numeric
        system: s2
        prompt: |
          A DAG has edges S → A of length 2, S → B of length 5, A → B of length 1, A → C of length 6, and B → C of length 2. Relaxing in the topological order S, A, B, C, what is the shortest distance from S to C?
        answer: "5"
        explanation: |
          S gives A 2 and B 5. A gives B $\min(5, 2 + 1) = 3$ and C 8. B gives C $\min(8, 3 + 2) = 5$. The route is S, A, B, C.
    - text: |
        **Dijkstra's algorithm.** When the graph has cycles but no negative lengths, settle nodes in order of distance. Keep every unsettled node's best-known distance; repeatedly settle the unsettled node with the smallest one, and relax the edges out of it.

        **Why a settled distance is final.** The invariant, in the sense of [[f2.loop-invariants]], is that every settled node has its true distance. Suppose $x$ is about to be settled with best-known distance $d(x)$, and suppose, for a contradiction as in [[f2.contrapositive-and-contradiction]], that some route to $x$ is shorter. That route starts in the settled set and must leave it somewhere, by an edge to some unsettled node $y$. Its length up to $y$ is at least $d(y)$, since the edge into $y$ was relaxed when its settled end was settled, and $d(y) \ge d(x)$, since $x$ was chosen as the smallest. The rest of the route, from $y$ to $x$, has no negative lengths, so the whole route is at least $d(x)$. The contradiction shows the invariant holds.

        **With a heap.** Finding the smallest unsettled distance by scanning every node costs $\Theta(V)$ each time. A heap from [[s2.heaps-and-priority-queues]] does better: push the pair `(distance, node)` whenever a distance improves, pop the smallest pair, and ignore a popped node that is already settled, since its pair was pushed before a later improvement. Each edge causes at most one push, so the total is $O((V + E) \log V)$. To find one route rather than all distances, stop when the goal is **popped**; when it is first pushed, a shorter route may still be on its way.
    - question:
        id: derivation-improved
        type: numeric
        system: s2
        prompt: |
          In the figure, roads A–B of length 4, A–C of length 1 and C–B of length 2 meet at B. B is first given the distance 4. What is its final distance from A?
        answer: "3"
        explanation: |
          After C is settled at 1, relaxing C–B gives $1 + 2 = 3 < 4$, so B's distance improves to 3 before B is settled.
    - text: |
        **Negative lengths.** A cashback offer can make a fare negative, and then Dijkstra's argument fails: the rest of a route may lower its total. With A → B of length 2, A → C of length 3 and C → B of length −2, Dijkstra settles B at 2, but A, C, B costs 1. Worse, a **negative cycle**, a loop whose lengths add to less than zero, makes "shortest" meaningless, since going round again is always cheaper.

        **Bellman and Ford's method** relaxes every edge, in any order, and repeats the whole pass $V - 1$ times. After pass $k$, every node whose shortest route has at most $k$ edges has its true distance, by induction on $k$. Without negative cycles, a shortest route never repeats a node, so it has at most $V - 1$ edges, and $V - 1$ passes suffice. One more pass that still improves something proves a negative cycle is reachable. The cost is $\Theta(VE)$, slower than Dijkstra's but correct for any lengths.

        A classic use: with currency exchange rates as edges, a loop of exchanges that turns ₹100 into more than ₹100 is a loop whose rates multiply to more than 1. Taking $-\log$ of each rate, as in [[f1.logarithms]], turns the product into a sum and "more than 1" into "less than 0", so the profitable loop is exactly a negative cycle.

        **Choosing.** All lengths equal: breadth-first search. No cycles: one pass in topological order. No negative lengths: Dijkstra. Negative lengths: Bellman and Ford. Shortest distances between every pair of nodes can be found by running one of these from each node, or by the Floyd and Warshall method in $\Theta(V^3)$.
    - question:
        id: order-dijkstra
        type: order
        system: s2
        prompt: |
          Put the steps of Dijkstra's algorithm with a heap in order.
        steps:
          - "Set the start's distance to 0 and push it on the heap."
          - "Pop the pair with the smallest distance, and skip it if its node is already settled."
          - "Mark the popped node as settled."
          - "Relax each edge out of it, pushing every neighbour whose distance improves."
        explanation: |
          Nothing can be popped until the start is pushed, a node must be popped before it is settled, and only a settled node's distance is final enough to relax its edges with.
  formal:
    - text: |
        **Shortest distance.** $\delta(s, v)$, the least total length of a route from $s$ to $v$.

        **Relax** $(u, v, w)$: if $d(u) + w < d(v)$, set $d(v) = d(u) + w$ and $\text{parent}(v) = u$. Always $d(v) \ge \delta(s, v)$.

        **DAG.** Relax the edges out of each node in topological order: $\Theta(V + E)$, any lengths.

        **Dijkstra.** Lengths $\ge 0$. Settle the unsettled node of least $d$, then relax its edges. Invariant: settled nodes have $d = \delta$. With a binary heap and skipped stale entries, $O((V + E) \log V)$.

        **Bellman and Ford.** Relax every edge, $V - 1$ passes: $\Theta(VE)$, any lengths. An improvement in pass $V$ means a negative cycle is reachable from $s$.
  drill:
    - text: Seconds each. Relax, and choose the right tool.
    - question:
        id: drill-relax
        type: numeric
        system: s1
        prompt: |
          $d(u) = 7$, the edge from $u$ to $v$ has length 3, and $d(v) = 12$. What is $d(v)$ after relaxing the edge?
        answer: "10"
        explanation: $7 + 3 = 10 < 12$, so $d(v)$ becomes 10.
    - question:
        id: drill-passes
        type: numeric
        system: s1
        prompt: |
          A graph has 10 nodes and no negative cycle. How many passes of Bellman and Ford's method guarantee every distance is right?
        answer: "9"
        explanation: A shortest route repeats no node, so it has at most $10 - 1 = 9$ edges, and each pass fixes one more edge's worth.
    - question:
        id: drill-choose-metro
        type: choice
        system: s1
        prompt: |
          A metro map gives each link a travel time in minutes. Which method finds the quickest journeys from one station?
        options:
          - "Dijkstra's algorithm"
          - "Breadth-first search"
          - "Depth-first search"
          - "Topological sort"
        answer: 0
        explanation: The times differ and none is negative, and the map has cycles. Breadth-first search would count stops, not minutes.
    - question:
        id: drill-negative
        type: choice
        system: s1
        prompt: |
          Some fares are negative because of cashback, and no loop of fares adds to less than zero. Which method is guaranteed correct?
        options:
          - "Bellman and Ford's method"
          - "Dijkstra's algorithm"
          - "Breadth-first search"
          - "None of them"
        answer: 0
        explanation: Dijkstra's argument needs lengths of at least zero; Bellman and Ford's passes do not.
    - question:
        id: drill-stop
        type: choice
        system: s1
        prompt: |
          Dijkstra's algorithm is searching for one goal. When can it stop?
        options:
          - "When the goal is popped from the heap"
          - "When the goal is first pushed on the heap"
          - "When the heap holds the goal twice"
          - "Only when the heap is empty"
        answer: 0
        explanation: Being popped means the goal is the nearest unsettled node, so its distance is final. When it is first pushed, a shorter route may still be found.
    - question:
        id: predict-heap-ties
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import heapq
          h = []
          heapq.heappush(h, (5, "D"))
          heapq.heappush(h, (2, "B"))
          heapq.heappush(h, (2, "A"))
          print(heapq.heappop(h), heapq.heappop(h))
        output: "(2, 'A') (2, 'B')"
        explanation: Tuples compare by their first parts, and a tie is broken by the second, so `(2, 'A')` comes before `(2, 'B')`, and `(5, 'D')` stays in the heap.
    - question:
        id: predict-relax
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          d = {"A": 0, "B": 4, "C": 1}
          for u, v, w in [("C", "B", 2), ("A", "B", 4)]:
              if d[u] + w < d[v]:
                  d[v] = d[u] + w
          print(d["B"])
        output: "3"
        explanation: Relaxing C to B gives $1 + 2 = 3 < 4$. Relaxing A to B then gives $0 + 4 = 4$, which is not less than 3, so 3 stays.
  work:
    - text: Slower now. For each method, say which distances can still change, and which are final.
    - question:
        id: fix-dijkstra
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `shortest(graph, start)` should return the shortest distance from `start` to every town it can reach, on the six towns of the figure. The program should print `3 8 13`. It prints `4 9 15`. Find the fault and fix it.
        starter: |
          import heapq


          def shortest(graph, start):
              # graph maps each town to a list of (neighbour, km) pairs, with every km >= 0.
              # Return a dictionary of the shortest distance from start to every town it can reach.
              dist = {start: 0}
              heap = [(0, start)]
              done = set()
              while heap:
                  d, here = heapq.heappop(heap)
                  if here not in done:
                      done.add(here)
                      for there, km in graph[here]:
                          if there not in dist:
                              dist[there] = d + km
                              heapq.heappush(heap, (d + km, there))
              return dist


          roads = [("A", "B", 4), ("A", "C", 1), ("C", "B", 2), ("B", "D", 5), ("C", "D", 8), ("C", "E", 10), ("D", "E", 2), ("D", "F", 6), ("E", "F", 3)]
          graph = {town: [] for town in "ABCDEF"}
          for a, b, km in roads:
              graph[a].append((b, km))
              graph[b].append((a, km))
          dist = shortest(graph, "A")
          print(dist["B"], dist["D"], dist["F"])
        solution: |
          import heapq


          def shortest(graph, start):
              # graph maps each town to a list of (neighbour, km) pairs, with every km >= 0.
              # Return a dictionary of the shortest distance from start to every town it can reach.
              dist = {start: 0}
              heap = [(0, start)]
              done = set()
              while heap:
                  d, here = heapq.heappop(heap)
                  if here not in done:
                      done.add(here)
                      for there, km in graph[here]:
                          if there not in dist or d + km < dist[there]:
                              dist[there] = d + km
                              heapq.heappush(heap, (d + km, there))
              return dist


          roads = [("A", "B", 4), ("A", "C", 1), ("C", "B", 2), ("B", "D", 5), ("C", "D", 8), ("C", "E", 10), ("D", "E", 2), ("D", "F", 6), ("E", "F", 3)]
          graph = {town: [] for town in "ABCDEF"}
          for a, b, km in roads:
              graph[a].append((b, km))
              graph[b].append((a, km))
          dist = shortest(graph, "A")
          print(dist["B"], dist["D"], dist["F"])
        tests: |
          import random as _random


          def _reference(_graph, _start):
              _dist = {_start: 0}
              for _ in range(len(_graph)):
                  for _u in list(_dist):
                      for _v, _w in _graph[_u]:
                          if _v not in _dist or _dist[_u] + _w < _dist[_v]:
                              _dist[_v] = _dist[_u] + _w
              return _dist


          _rng = _random.Random(21)
          _towns = {_x: [] for _x in "ABCDEF"}
          for _a, _b, _km in [("A", "B", 4), ("A", "C", 1), ("C", "B", 2), ("B", "D", 5), ("C", "D", 8), ("C", "E", 10), ("D", "E", 2), ("D", "F", 6), ("E", "F", 3)]:
              _towns[_a].append((_b, _km))
              _towns[_b].append((_a, _km))
          _graphs = [_towns, {"X": []}, {"P": [("Q", 0)], "Q": [("P", 0)], "R": []}]
          for _ in range(30):
              _n = _rng.randint(1, 7)
              _names = ["t" + str(_i) for _i in range(_n)]
              _g = {_x: [] for _x in _names}
              for _ in range(_rng.randint(0, 12)):
                  _a = _rng.choice(_names)
                  _b = _rng.choice(_names)
                  if _a != _b:
                      _w = _rng.randint(0, 9)
                      _g[_a].append((_b, _w))
                      _g[_b].append((_a, _w))
              _graphs.append(_g)
          for _g in _graphs:
              for _start in _g:
                  _want = _reference(_g, _start)
                  _got = shortest(_g, _start)
                  assert dict(_got) == _want, "shortest(" + str(_g) + ", " + repr(_start) + ") should be " + str(_want) + ", not " + str(dict(_got))
          assert output.strip() == "3 8 13", "The program should print 3 8 13"
