                    semesters += 1
                    passed += len(now)
                    nxt = []
                    for c in now:
                        for d in unlocks[c]:
                            waiting[d] -= 1
                            if waiting[d] == 0:
                                nxt.append(d)
                    now = nxt
                if passed < len(courses):
                    return None
                return semesters


            courses = ["maths", "python", "data", "stats", "ml", "project"]
            prereqs = [("maths", "stats"), ("python", "data"), ("data", "ml"), ("stats", "ml"), ("ml", "project")]
            print(min_semesters(courses, prereqs), min_semesters(["a"], []), min_semesters(["a", "b"], [("a", "b"), ("b", "a")]))
          - |
            def min_semesters(courses, prereqs):
                # prereqs is a list of pairs (first, then): first must be passed in an earlier semester
                # than then. Any number of courses can be taken in a semester. Return the fewest
                # semesters that cover every course, or None if no plan is possible.
                waiting = {c: 0 for c in courses}
                unlocks = {c: [] for c in courses}
