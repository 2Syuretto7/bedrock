                # prereqs is a list of pairs (first, then): first must be passed in an earlier semester
                # than then. Any number of courses can be taken in a semester. Return the fewest
                # semesters that cover every course, or None if no plan is possible.
                waiting = {c: 0 for c in courses}
                unlocks = {c: [] for c in courses}
