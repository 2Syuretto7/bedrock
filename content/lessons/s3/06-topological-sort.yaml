            def min_semesters(courses, prereqs):
                # prereqs is a list of pairs (first, then): first must be passed in an earlier semester
                # than then. Any number of courses can be taken in a semester. Return the fewest
                # semesters that cover every course, or None if no plan is possible.
                waiting = {c: 0 for c in courses}
                unlocks = {c: [] for c in courses}
                for first, then in prereqs:
                    waiting[then] += 1
                    unlocks[first].append(then)
                now = [c for c in courses if waiting[c] == 0]
                semesters = 0
                passed = 0
                while now:
                    semesters += 1
                    nxt = []
                    i = 0
                    while i < len(now):
                        c = now[i]
                        passed += 1
                        for d in unlocks[c]:
                            waiting[d] -= 1
                            if waiting[d] == 0:
                                now.append(d)
                        i += 1
                    now = nxt
                if passed < len(courses):
                    return None
                return semesters


            courses = ["maths", "python", "data", "stats", "ml", "project"]
            prereqs = [("maths", "stats"), ("python", "data"), ("data", "ml"), ("stats", "ml"), ("ml", "project")]
            print(min_semesters(courses, prereqs), min_semesters(["a"], []), min_semesters(["a", "b"], [("a", "b"), ("b", "a")]))
        explanation: |
          Run Kahn's method a whole round at a time: every course ready now is taken this semester, and only the courses they unlock form the next round. The number of rounds is the number of courses on the longest chain of prerequisites. Starting the count at −1 counts the arrows on that chain instead of its courses; taking one course per semester counts courses, not semesters; and adding newly ready courses to the current round lets a course share a semester with its own prerequisite.
