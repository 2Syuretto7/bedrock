    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Six chai steps: boil water; add tea leaves; add ginger; add milk; add sugar; strain. Leaves and ginger go in after boiling; milk after both leaves and ginger; sugar at any point before straining; straining after milk and sugar. How many orders follow every rule?
        answer: "10"
        explanation: |
          Without the sugar, the order must be boil, then leaves and ginger in either of 2 orders, then milk, then strain. The sugar can go into any of the 5 gaps before straining: first, or after any of the first four steps. $2 \times 5 = 10$.
    - question:
        id: work-spreadsheet
        type: choice
        system: s2
        prompt: |
          A spreadsheet with 50,000 formula cells recalculates by evaluating every cell, then evaluating every cell again, until nothing changes. It is slow. Which change fixes it, and what does it cost?
        options:
          - "Evaluate each cell once in a topological order of the cells it reads, found in time proportional to the cells plus the references."
          - "Evaluate the cells row by row from the top, which is always a valid order."
          - "Evaluate the cells in alphabetical order of their names."
          - "Keep repeating, but stop after ten passes."
        answer: 0
        explanation: |
          In topological order each cell's inputs are final before it is computed, so one pass suffices, and finding the order costs $\Theta(V + E)$. A cell near the top can read a cell further down, so row order can use stale values; names are no better; and a fixed number of passes is either wasteful or wrong.
  connections:
    - text: |
        Ten orders. Boiling must come first among the four steps that hang off it, tea leaves and ginger can swap, milk and straining are forced, and the sugar floats freely in any of the five places before straining. A topological sort finds one of these ten in a single pass; counting them all needed the argument above.

        Doing work in topological order, so that everything a step needs is ready when the step comes, is a pattern that returns often. [[s3.shortest-paths]] uses it on graphs without cycles to find the shortest route in one pass, and has to work harder when routes can go round in circles. [[s3.dynamic-programming]] solves a problem by breaking it into overlapping subproblems and solving them in an order where every subproblem's parts are already solved: a topological order of the subproblems, whether or not the graph is ever drawn.
