            from collections import deque


            def build_order(steps, needs):
                # needs is a list of pairs (before, after): before must finish before after starts.
                # Return an order of all the steps that respects every pair, or None if there is none.
                waiting = {s: 0 for s in steps}
                after = {s: [] for s in steps}
                for before, later in needs:
                    waiting[later] += 1
                    after[later].append(before)
                ready = deque([s for s in steps if waiting[s] == 0])
                order = []
                while ready:
                    s = ready.popleft()
                    order.append(s)
                    for t in after[s]:
                        waiting[t] -= 1
                        if waiting[t] == 0:
                            ready.append(t)
                if len(order) < len(steps):
                    return None
                return order


            steps = ["fetch", "install", "compile", "docs", "test"]
            needs = [("fetch", "compile"), ("install", "compile"), ("compile", "test"), ("fetch", "docs")]
            print(build_order(steps, needs), build_order(["a", "b"], [("a", "b"), ("b", "a")]))
        explanation: |
          A step waits for the steps it needs, so each pair adds one to the count of `later`, the step at the arrow's head. Counting at `before` makes steps with many dependants look blocked and steps at the end look ready, the order stalls, and every input looks like a cycle. Dropping the final check returns a short list instead of `None` for a cycle; making a step ready on every decrement adds it once per prerequisite; and recording arrows backwards frees the wrong steps.
    - question:
        id: write-min-semesters
        type: code
        mode: write
        system: s2
        prompt: |
          Write `min_semesters(courses, prereqs)`. Each pair `(first, then)` in `prereqs` means `first` must be passed in an earlier semester than `then`, and any number of courses can be taken in one semester. Return the fewest semesters that cover every course, or `None` if the prerequisites go round in a cycle.
        starter: |
          def min_semesters(courses, prereqs):
              # prereqs is a list of pairs (first, then): first must be passed in an earlier semester
              # than then. Any number of courses can be taken in a semester. Return the fewest
              # semesters that cover every course, or None if no plan is possible.
              return len(courses)


          courses = ["maths", "python", "data", "stats", "ml", "project"]
          prereqs = [("maths", "stats"), ("python", "data"), ("data", "ml"), ("stats", "ml"), ("ml", "project")]
          print(min_semesters(courses, prereqs), min_semesters(["a"], []), min_semesters(["a", "b"], [("a", "b"), ("b", "a")]))
        solution: |
          def min_semesters(courses, prereqs):
              # prereqs is a list of pairs (first, then): first must be passed in an earlier semester
              # than then. Any number of courses can be taken in a semester. Return the fewest
              # semesters that cover every course, or None if no plan is possible.
              waiting = {c: 0 for c in courses}
              unlocks = {c: [] for c in courses}
              for first, then in prereqs:
                  waiting[then] += 1
                  unlocks[first].append(then)
              now = [c for c in courses if waiting[c] == 0]
              semesters = 0
              passed = 0
              while now:
                  semesters += 1
                  passed += len(now)
                  nxt = []
                  for c in now:
                      for d in unlocks[c]:
                          waiting[d] -= 1
                          if waiting[d] == 0:
                              nxt.append(d)
                  now = nxt
              if passed < len(courses):
                  return None
              return semesters


          courses = ["maths", "python", "data", "stats", "ml", "project"]
          prereqs = [("maths", "stats"), ("python", "data"), ("data", "ml"), ("stats", "ml"), ("ml", "project")]
          print(min_semesters(courses, prereqs), min_semesters(["a"], []), min_semesters(["a", "b"], [("a", "b"), ("b", "a")]))
        tests: |
          import random as _random


          def _reference(_courses, _prereqs):
              _level = {}
              _left = list(_courses)
              _round = 0
              while _left:
                  _round += 1
                  _can = [_c for _c in _left if all(_f in _level and _level[_f] < _round for _f, _t in _prereqs if _t == _c)]
                  if not _can:
                      return None
                  for _c in _can:
                      _level[_c] = _round
                  _left = [_c for _c in _left if _c not in _level]
              return _round


          _rng = _random.Random(9)
          _cases = [
              (["maths", "python", "data", "stats", "ml", "project"], [("maths", "stats"), ("python", "data"), ("data", "ml"), ("stats", "ml"), ("ml", "project")]),
              (["a"], []),
              ([], []),
              (["a", "b"], [("a", "b"), ("b", "a")]),
              (["a", "b", "c"], [("a", "b"), ("b", "c"), ("a", "c")]),
              (["a", "b", "c", "d"], []),
          ]
          for _ in range(40):
              _n = _rng.randint(1, 7)
              _courses = ["c" + str(_i) for _i in range(_n)]
              _prereqs = []
              for _ in range(_rng.randint(0, 9)):
                  _a = _rng.randint(0, _n - 1)
                  _b = _rng.randint(0, _n - 1)
                  if _a != _b and (_a < _b or _rng.random() < 0.1) and ("c" + str(_a), "c" + str(_b)) not in _prereqs:
                      _prereqs.append(("c" + str(_a), "c" + str(_b)))
              _cases.append((_courses, _prereqs))
          for _courses, _prereqs in _cases:
              _want = _reference(_courses, _prereqs)
              _got = min_semesters(list(_courses), list(_prereqs))
              assert _got == _want, "min_semesters(" + str(_courses) + ", " + str(_prereqs) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "4 1 None", "The program should print 4 1 None"
        wrong:
