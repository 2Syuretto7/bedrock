          def has_cycle(graph):
              # graph maps each cell of a spreadsheet to the list of cells its formula reads.
              # Return True if some cell depends, directly or through others, on itself.
              state = {}  # missing: not started; "open": still being explored; "done": finished

              def explore(cell):
                  state[cell] = "open"
                  for other in graph[cell]:
                      if state.get(other) == "open":
                          return True
                      if other not in state and explore(other):
                          return True
                  state[cell] = "done"
                  return False

              for cell in graph:
                  if cell not in state and explore(cell):
                      return True
              return False


