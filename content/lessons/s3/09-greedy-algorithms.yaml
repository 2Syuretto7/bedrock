        explanation: |
          Earliest deadline first: if a job with a later deadline were done just before one with an earlier deadline, swapping them would not increase the worst lateness, so some best order has no such pair. Shortest first ignores deadlines; least slack first, deadline minus hours, sounds clever but fails on the example; and taking the maximum of the raw lateness gives a negative answer when every job is early, and fails on no jobs at all.
