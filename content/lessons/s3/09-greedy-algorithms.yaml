    - text: |
        Three tokens: ₹4, ₹4 and ₹1. Largest first hands over ₹6 and is then stuck paying ₹3 with three ₹1 tokens. The greedy habit works for rupee coins because their values were chosen so that it does; with ₹1, ₹4 and ₹6 there is no such luck.

        Problems where greed fails are not hopeless, only harder. The fewest tokens for every amount up to ₹9 can be found by building on the answers for smaller amounts, and that is the method of [[s3.dynamic-programming]], which also packs whole machines into a truck. Some problems resist both approaches, and [[s3.intractability-p-np-and-heuristics]] explains why, and why greedy rules remain useful there as fast approximations. One of the most elegant greedy algorithms, which builds the shortest codes for a message by repeatedly merging its two rarest symbols, is the subject of [[f7.prefix-codes-and-huffman-coding]].
