        explanation: |
          In order of start, a booking can reuse the room that frees earliest if that room is free by its start; otherwise it needs a new room. The heap's smallest end time is that room. Using `<` makes a booking wait for a room that is free at exactly its start; taking bookings in order of end can open a room before an earlier-starting booking has freed one; and checking only the most recently added end time, `ends[-1]`, misses rooms that are free.
    - question:
        id: write-max-lateness
        type: code
        mode: write
        system: s2
        prompt: |
          A printing press does jobs one after another from time 0. Each job is `(hours, deadline)`. Write `max_lateness(jobs)`, which orders the jobs greedily so that the worst lateness is as small as possible, and returns that worst lateness: the largest amount by which a job finishes after its deadline, or 0 if every job is on time.
        starter: |
          def max_lateness(jobs):
              # jobs is a list of (hours, deadline). One printing press does the jobs one after
              # another from time 0. Choose the order greedily, and return the largest amount by
              # which a job finishes after its deadline, or 0 if every job is on time.
              return 0


          print(max_lateness([(4, 5), (2, 3), (3, 9), (1, 6)]), max_lateness([(1, 1), (2, 4)]))
        solution: |
          def max_lateness(jobs):
              # jobs is a list of (hours, deadline). One printing press does the jobs one after
              # another from time 0. Choose the order greedily, and return the largest amount by
              # which a job finishes after its deadline, or 0 if every job is on time.
              time = 0
              worst = 0
              for hours, deadline in sorted(jobs, key=lambda j: j[1]):
                  time += hours
                  worst = max(worst, time - deadline)
              return worst


          print(max_lateness([(4, 5), (2, 3), (3, 9), (1, 6)]), max_lateness([(1, 1), (2, 4)]))
        tests: |
          import random as _random


          def _best(_jobs):
              def _go(_left, _time):
                  if not _left:
                      return 0
                  _m = None
                  for _i in range(len(_left)):
                      _h, _d = _left[_i]
                      _v = max(_time + _h - _d, _go(_left[:_i] + _left[_i + 1:], _time + _h))
                      if _m is None or _v < _m:
                          _m = _v
                  return _m

              return max(0, _go(list(_jobs), 0))


          _rng = _random.Random(61)
          _cases = [[(4, 5), (2, 3), (3, 9), (1, 6)], [(1, 1), (2, 4)], [], [(5, 2)], [(1, 10), (1, 10)], [(3, 3), (1, 2)], [(1, 4), (3, 3)], [(2, 2), (4, 6), (1, 4)]]
          for _ in range(50):
              _cases.append([(_rng.randint(1, 5), _rng.randint(1, 12)) for _ in range(_rng.randint(1, 6))])
          for _jobs in _cases:
              _want = _best(_jobs)
              _got = max_lateness(list(_jobs))
              assert _got == _want, "max_lateness(" + str(_jobs) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "1 0", "The program should print 1 0"
        wrong:
          - |
            def max_lateness(jobs):
                # jobs is a list of (hours, deadline). One printing press does the jobs one after
                # another from time 0. Choose the order greedily, and return the largest amount by
                # which a job finishes after its deadline, or 0 if every job is on time.
                time = 0
                worst = 0
