                return chosen


            hall = [("A", 8, 19), ("B", 9, 12), ("C", 11, 13), ("D", 12, 15), ("E", 14, 16), ("F", 15, 18), ("G", 17, 19), ("H", 18, 20)]
            print(most_bookings(hall))
        explanation: |
          The loop is right; the order is wrong. Sorting by start time takes A first, which blocks the whole day. Sorting by end time, `b[2]`, takes the booking that frees the hall soonest. Sorting by length takes C, which spoils B and D; requiring `start > free_from` rejects a booking that starts the moment the last one ends; and moving `free_from` to the start of the taken booking lets the next one overlap it.
    - question:
        id: write-rooms-needed
        type: code
        mode: write
        system: s2
        prompt: |
          Write `rooms_needed(bookings)`, the fewest rooms that can host every booking, where each booking is `(start, end)` and a room is free again at the moment its booking ends. Take bookings in order of start, and keep the end times of the rooms in use in a heap.
        starter: |
          import heapq


          def rooms_needed(bookings):
              # bookings is a list of (start, end) times. A room is free again at the moment its
              # booking ends. Return the fewest rooms that can host every booking.
              return len(bookings)


          day = [(9, 12), (11, 13), (12, 15), (14, 16), (8, 19)]
          print(rooms_needed(day), rooms_needed([]), rooms_needed([(1, 2), (2, 3)]))
        solution: |
          import heapq


          def rooms_needed(bookings):
              # bookings is a list of (start, end) times. A room is free again at the moment its
              # booking ends. Return the fewest rooms that can host every booking.
              ends = []
              for start, end in sorted(bookings):
                  if ends and ends[0] <= start:
                      heapq.heappop(ends)
                  heapq.heappush(ends, end)
              return len(ends)


          day = [(9, 12), (11, 13), (12, 15), (14, 16), (8, 19)]
          print(rooms_needed(day), rooms_needed([]), rooms_needed([(1, 2), (2, 3)]))
        tests: |
          import random as _random


          def _reference(_bookings):
              _most = 0
              for _s, _e in _bookings:
                  _most = max(_most, len([1 for _a, _b in _bookings if _a <= _s < _b]))
              return _most


          _rng = _random.Random(59)
          _cases = [[(9, 12), (11, 13), (12, 15), (14, 16), (8, 19)], [], [(1, 2), (2, 3)], [(1, 5), (2, 3), (4, 6)], [(1, 10), (2, 3), (3, 4), (4, 5)], [(5, 6), (1, 2), (1, 9)]]
          for _ in range(60):
              _list = []
              for _i in range(_rng.randint(1, 9)):
                  _s = _rng.randint(0, 12)
                  _list.append((_s, _s + _rng.randint(1, 6)))
              _cases.append(_list)
          for _bookings in _cases:
              _want = _reference(_bookings)
              _got = rooms_needed(list(_bookings))
              assert _got == _want, "rooms_needed(" + str(_bookings) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "3 0 1", "The program should print 3 0 1"
        wrong:
          - |
            import heapq


            def rooms_needed(bookings):
                # bookings is a list of (start, end) times. A room is free again at the moment its
                # booking ends. Return the fewest rooms that can host every booking.
                ends = []
                for start, end in sorted(bookings):
                    if ends and ends[0] < start:
                        heapq.heappop(ends)
                    heapq.heappush(ends, end)
                return len(ends)


            day = [(9, 12), (11, 13), (12, 15), (14, 16), (8, 19)]
            print(rooms_needed(day), rooms_needed([]), rooms_needed([(1, 2), (2, 3)]))
          - |
            import heapq


            def rooms_needed(bookings):
                # bookings is a list of (start, end) times. A room is free again at the moment its
                # booking ends. Return the fewest rooms that can host every booking.
                ends = []
                for start, end in sorted(bookings, key=lambda b: b[1]):
                    if ends and ends[0] <= start:
                        heapq.heappop(ends)
                    heapq.heappush(ends, end)
                return len(ends)


            day = [(9, 12), (11, 13), (12, 15), (14, 16), (8, 19)]
            print(rooms_needed(day), rooms_needed([]), rooms_needed([(1, 2), (2, 3)]))
          - |
            import heapq


            def rooms_needed(bookings):
                # bookings is a list of (start, end) times. A room is free again at the moment its
                # booking ends. Return the fewest rooms that can host every booking.
                ends = []
                for start, end in sorted(bookings):
                    if ends and ends[-1] <= start:
                        ends.pop()
                    ends.append(end)
                return len(ends)


