            from collections import deque


            def route(graph, start, goal):
                # Return a list of the stations from start to goal with the fewest stops, or None if
                # goal cannot be reached. When several routes tie, any one of them will do.
                parent = {start: None}
                queue = deque([start])
                while queue:
                    here = queue.popleft()
                    if here == goal:
                        path = []
                        while here is not None:
                            path.append(here)
                            here = parent[here]
                        return path[::-1]
                    for there in graph[here]:
                        if there not in parent:
                            parent[there] = here
                            queue.append(there)
                return []


            metro = {"A": ["B", "C"], "B": ["A", "D"], "C": ["A", "E"], "D": ["B", "E"], "E": ["C", "D", "F"], "F": ["E"]}
            print(route(metro, "A", "F"), route(metro, "F", "F"), route({"X": [], "Y": []}, "X", "Y"))
        explanation: |
          Breadth first reaches each station first along a route with the fewest stops, so the parent recorded then lies on such a route, and following parents from the goal back to the start, whose parent is `None`, retraces it backwards. Forgetting to reverse returns the route from goal to start; taking the newest node with `pop` explores depth first and can find a longer route first; and an empty list is not `None`, so a caller cannot tell "no route" from a route.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          A knight starts in one corner of an empty 8 × 8 chessboard. What is the fewest number of moves that takes it to the opposite corner?
        answer: "6"
        explanation: |
          Treat each square as a node and each knight's move as an edge, and run breadth-first search from the corner. The layers reach the opposite corner at distance 6. Each move changes the sum of the row and column numbers by an odd amount, so the corner, 14 away in that sum, needs an even number of moves, and 4 moves change the sum by at most 12.
    - question:
        id: work-recursion-limit
        type: choice
        system: s2
        prompt: |
          A recursive depth-first search works on small maps but crashes with `RecursionError` on a map of a long road with one lakh junctions in a line. What is the best fix?
        options:
          - "Rewrite it with an explicit list used as a stack, so the depth of the search no longer uses Python's call stack."
          - "Switch to an adjacency matrix."
          - "Start the search from the middle of the road."
          - "Use breadth-first search with a stack."
        answer: 0
        explanation: |
          Each step along the road is one more nested call, and Python stops at about a thousand. An explicit stack holds the same nodes in an ordinary list, which can grow as long as memory allows. An adjacency matrix would need $10^{10}$ entries, starting in the middle only halves the depth, and breadth-first search with a stack is depth-first search.
  connections:
    - text: |
        Six moves. Breadth-first search from the corner over the 64 squares finds the far corner in the sixth layer, and it is the only square on the board that needs six. A parity argument confirms it: every knight's move changes the sum of the row and column numbers by 1 or 3, an odd number, so reaching a sum 14 higher needs an even number of moves, and four moves add at most 12.

        Breadth-first search counts every edge as one step. When edges have lengths, travel times or fares, the fewest edges is no longer the shortest route, and [[s3.shortest-paths]] replaces the queue with a priority queue to handle them. Depth-first search's finishing order is the heart of [[s3.topological-sort]], which puts the tasks of a project in an order that respects every dependency. And the trees that a search leaves behind are one kind of spanning tree; [[s3.minimum-spanning-trees]] finds the cheapest one.
