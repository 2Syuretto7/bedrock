                    for c in range(len(grid[r])):
                        if grid[r][c] == "#" and (r, c) not in seen:
                            regions += 1
                            seen.add((r, c))
                            stack = [(r, c)]
                            while stack:
                                y, x = stack.pop()
                                for ny, nx in [(y - 1, x), (y + 1, x), (y, x - 1), (y, x + 1), (y - 1, x - 1), (y - 1, x + 1), (y + 1, x - 1), (y + 1, x + 1)]:
                                    if 0 <= ny < len(grid) and 0 <= nx < len(grid[ny]) and grid[ny][nx] == "#" and (ny, nx) not in seen:
                                        seen.add((ny, nx))
                                        stack.append((ny, nx))
                return regions


            town = ["##..#", "#...#", "..#..", "....#"]
            print(count_regions(town), count_regions(["..."]), count_regions(["#.#", ".#.", "#.#"]))
          - |
            def count_regions(grid):
                # grid is a list of equal-length strings of "#" (flooded) and "." (dry). Two flooded
                # cells are in the same region if they share a side. Return the number of regions.
                regions = 0
                for r in range(len(grid)):
                    for c in range(len(grid[r])):
                        # A region starts at a flooded cell with nothing flooded above it or to its left.
                        above = r > 0 and grid[r - 1][c] == "#"
                        left = c > 0 and grid[r][c - 1] == "#"
                        if grid[r][c] == "#" and not above and not left:
                            regions += 1
                return regions


            town = ["##..#", "#...#", "..#..", "....#"]
            print(count_regions(town), count_regions(["..."]), count_regions(["#.#", ".#.", "#.#"]))
        explanation: |
          Each flooded cell not yet seen starts a new region, and a depth-first search from it marks every flooded cell it can reach through shared sides, so none of them starts another. Counting flooded cells counts cells, not regions; adding the four diagonal neighbours joins cells that only touch at a corner; and counting cells with nothing flooded above or to the left counts a U-shaped region twice, because its two arms both look like starts. Each cell is examined a constant number of times, so the search is linear in the size of the map.
    - question:
        id: write-route
        type: code
        mode: write
        system: s2
        prompt: |
          Write `route(graph, start, goal)`, which returns a list of stations from `start` to `goal` with the fewest stops, or `None` if `goal` cannot be reached. Record each station's parent during a breadth-first search, then walk the parents back from the goal.
        starter: |
          from collections import deque


          def route(graph, start, goal):
              # Return a list of the stations from start to goal with the fewest stops, or None if
              # goal cannot be reached. When several routes tie, any one of them will do.
              return None


          metro = {"A": ["B", "C"], "B": ["A", "D"], "C": ["A", "E"], "D": ["B", "E"], "E": ["C", "D", "F"], "F": ["E"]}
          print(route(metro, "A", "F"), route(metro, "F", "F"), route({"X": [], "Y": []}, "X", "Y"))
        solution: |
          from collections import deque


          def route(graph, start, goal):
              # Return a list of the stations from start to goal with the fewest stops, or None if
              # goal cannot be reached. When several routes tie, any one of them will do.
              parent = {start: None}
              queue = deque([start])
              while queue:
                  here = queue.popleft()
                  if here == goal:
                      path = []
                      while here is not None:
                          path.append(here)
                          here = parent[here]
                      return path[::-1]
                  for there in graph[here]:
                      if there not in parent:
                          parent[there] = here
                          queue.append(there)
              return None


          metro = {"A": ["B", "C"], "B": ["A", "D"], "C": ["A", "E"], "D": ["B", "E"], "E": ["C", "D", "F"], "F": ["E"]}
          print(route(metro, "A", "F"), route(metro, "F", "F"), route({"X": [], "Y": []}, "X", "Y"))
        tests: |
          def _fewest(_graph, _start):
