            def quicksort(xs):
                # Return a new list of the items of xs in increasing order, with a random pivot.
                if len(xs) <= 1:
                    return list(xs)
                pivot = xs[0]
                smaller = [x for x in xs if x < pivot]
                equal = [x for x in xs if x == pivot]
                larger = [x for x in xs if x > pivot]
                return quicksort(smaller) + equal + quicksort(larger)


            random.seed(1)
            print(quicksort([5, 3, 8, 3, 1, 5, 5]))
          - |
