        explanation: |
          The program collects every copy of the pivot in `equal` and then puts back only one, so repeated values vanish. Returning `equal` keeps them all. Taking `xs[0]` as the pivot sorts correctly but makes 3,000 numbers already in order recurse 3,000 levels deep, past Python's limit; putting the pivot's copies in `smaller` with `<=` duplicates them and, when the pivot is the largest item, hands the whole list back to the same call forever; and leaving `larger` unsorted returns its items in whatever order they arrived.
    - question:
        id: write-quickselect
        type: code
        mode: write
        system: s2
        prompt: |
          Write `kth_smallest(xs, k)`, the `k`-th smallest item of a non-empty list `xs`, counting from 1, with `k` from 1 to `len(xs)`. Choose a pivot with `random.choice`, split the items into those smaller than, equal to and larger than it, and recurse only into the part that holds the answer. Do not change `xs`.
        starter: |
          import random


          def kth_smallest(xs, k):
              # Return the k-th smallest item of xs, counting from 1, with a random pivot.
              return None


          random.seed(4)
          minutes = [41, 18, 95, 27, 18, 63, 30, 52, 77]
          print(kth_smallest(minutes, 1), kth_smallest(minutes, 5), kth_smallest(minutes, 9))
        solution: |
          import random


          def kth_smallest(xs, k):
              # Return the k-th smallest item of xs, counting from 1, with a random pivot.
              pivot = random.choice(xs)
              smaller = [x for x in xs if x < pivot]
              equal = [x for x in xs if x == pivot]
              larger = [x for x in xs if x > pivot]
              if k <= len(smaller):
                  return kth_smallest(smaller, k)
              if k <= len(smaller) + len(equal):
                  return pivot
              return kth_smallest(larger, k - len(smaller) - len(equal))


          random.seed(4)
          minutes = [41, 18, 95, 27, 18, 63, 30, 52, 77]
          print(kth_smallest(minutes, 1), kth_smallest(minutes, 5), kth_smallest(minutes, 9))
        tests: |
          import random as _random

          _rng = _random.Random(83)
          _cases = [([7], 1), ([2, 1], 1), ([2, 1], 2), ([4, 4, 4, 4], 3), ([41, 18, 95, 27, 18, 63, 30, 52, 77], 2)]
          for _ in range(60):
              _xs = [_rng.randint(0, 9) for _ in range(_rng.randint(1, 15))]
              _cases.append((_xs, _rng.randint(1, len(_xs))))
          for _xs, _k in _cases:
              _copy = list(_xs)
              _want = sorted(_copy)[_k - 1]
              _got = kth_smallest(_xs, _k)
              assert _got == _want, "kth_smallest(" + str(_copy) + ", " + str(_k) + ") should be " + str(_want) + ", not " + str(_got)
              assert _xs == _copy, "kth_smallest should not change the list it is given"
          _big = list(range(3000))
          for _k in [1, 1500, 3000]:
              _got = kth_smallest(_big, _k)
              assert _got == _k - 1, "In the numbers 0 to 2,999 in order, item " + str(_k) + " should be " + str(_k - 1) + ", not " + str(_got)
          assert output.strip() == "18 41 95", "The program should print 18 41 95"
        wrong:
