    - question:
        id: drill-neighbours
        type: numeric
        system: s1
        prompt: |
          Quicksort with a random pivot sorts 1 to 100. What is the probability that 41 and 42 are compared?
        answer: "1"
        explanation: No rank lies between them, so whichever of the two is chosen first as a pivot is compared with the other.
    - question:
        id: drill-ends
        type: numeric
        system: s1
        prompt: |
          Quicksort with a random pivot sorts 1 to 10. What is the probability that 1 and 10 are compared?
        answer: "0.2"
        tolerance: "0.001"
        explanation: All ten ranks lie from 1 to 10, and the two are compared only if the very first pivot is 1 or 10, probability $2/10$.
    - question:
        id: drill-amplify
        type: numeric
        system: s1
        prompt: |
          A test errs with probability $1/10$, independently each run. What is the probability that three runs all err?
        answer: "0.001"
        tolerance: "0.00001"
        explanation: $(1/10)^3 = 0.001$.
    - question:
        id: drill-reservoir
        type: numeric
        system: s1
        prompt: |
          Reservoir sampling keeps 5 items. The 50th item of the stream has just arrived. With what probability is it kept?
        answer: "0.1"
        tolerance: "0.001"
        explanation: Item $t$ is kept with probability $k/t = 5/50$.
    - question:
        id: drill-kind
        type: choice
        system: s1
        prompt: |
          Quicksort with a random pivot is which kind of algorithm?
        options:
          - "Las Vegas: always sorted, with a running time that depends on the coins."
          - "Monte Carlo: a fixed running time, with a small chance of an unsorted list."
          - "Neither, because it is deterministic once the input is known."
          - "Both, depending on the input."
        answer: 0
        explanation: The output is always sorted; only the number of comparisons varies with the pivots chosen.
    - question:
        id: predict-seed
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import random
          random.seed(7)
          a = [random.randint(1, 6) for i in range(3)]
          random.seed(7)
          b = [random.randint(1, 6) for i in range(3)]
          print(a == b)
        output: "True"
        explanation: The same seed starts the generator in the same state, so it produces the same numbers again.
    - question:
        id: predict-partition
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          xs = [5, 3, 8, 3, 1]
          pivot = 3
          print([x for x in xs if x < pivot], [x for x in xs if x == pivot], [x for x in xs if x > pivot])
        output: "[1] [3, 3] [5, 8]"
        explanation: The three parts hold the items below, equal to and above the pivot, each in its original order.
  work:
    - text: Slower now. Each answer must be right for every input; only the time may depend on luck.
    - question:
        id: fix-quicksort
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `quicksort` should return a sorted copy of a list, choosing each pivot at random. The program should print `[1, 3, 3, 5, 5, 5, 8]`. It prints `[1, 3, 5, 8]`. Find the fault and fix it.
        starter: |
          import random


          def quicksort(xs):
              # Return a new list of the items of xs in increasing order, with a random pivot.
              if len(xs) <= 1:
                  return list(xs)
              pivot = random.choice(xs)
              smaller = [x for x in xs if x < pivot]
              equal = [x for x in xs if x == pivot]
              larger = [x for x in xs if x > pivot]
              return quicksort(smaller) + [pivot] + quicksort(larger)


          random.seed(1)
          print(quicksort([5, 3, 8, 3, 1, 5, 5]))
        solution: |
          import random


          def quicksort(xs):
              # Return a new list of the items of xs in increasing order, with a random pivot.
              if len(xs) <= 1:
                  return list(xs)
              pivot = random.choice(xs)
              smaller = [x for x in xs if x < pivot]
              equal = [x for x in xs if x == pivot]
              larger = [x for x in xs if x > pivot]
              return quicksort(smaller) + equal + quicksort(larger)


          random.seed(1)
          print(quicksort([5, 3, 8, 3, 1, 5, 5]))
        tests: |
          import random as _random

          _rng = _random.Random(79)
          _cases = [[], [1], [2, 1], [5, 3, 8, 3, 1, 5, 5], [4, 4, 4, 4], list(range(10, 0, -1))]
          for _ in range(40):
              _cases.append([_rng.randint(0, 9) for _ in range(_rng.randint(0, 15))])
          for _xs in _cases:
              _copy = list(_xs)
              _got = quicksort(_xs)
              assert _got == sorted(_copy), "quicksort(" + str(_copy) + ") should be " + str(sorted(_copy)) + ", not " + str(_got)
              assert _xs == _copy, "quicksort should not change the list it is given"
          _big = list(range(3000))
          _got = quicksort(_big)
          assert _got == _big, "quicksort should sort a list of 3,000 numbers already in order"
          assert output.strip() == "[1, 3, 3, 5, 5, 5, 8]", "The program should print [1, 3, 3, 5, 5, 5, 8]"
        wrong:
          - |
