            import random


            def kth_smallest(xs, k):
                # Return the k-th smallest item of xs, counting from 1, with a random pivot.
                pivot = random.choice(xs)
                smaller = [x for x in xs if x < pivot]
                equal = [x for x in xs if x == pivot]
                larger = [x for x in xs if x > pivot]
                if k <= len(smaller):
                    return kth_smallest(smaller, k)
                if k == len(smaller) + 1:
                    return pivot
                return kth_smallest(larger, k - len(smaller) - 1)


            random.seed(4)
            minutes = [41, 18, 95, 27, 18, 63, 30, 52, 77]
            print(kth_smallest(minutes, 1), kth_smallest(minutes, 5), kth_smallest(minutes, 9))
        explanation: |
          If `k` is at most the number of smaller items, the answer is among them, at the same position. If it is within the copies of the pivot, the pivot is the answer. Otherwise it is among the larger items, at position `k` minus everything smaller or equal. Taking the first item as pivot recurses once per item on a list already in order; subtracting only the smaller items puts `k` past the end of the larger part; and assuming the pivot occurs once fails when values repeat.
    - question:
        id: write-reservoir
        type: code
        mode: write
