    - text: |
        About 368 riders, more than a third, get no order. Each rider misses all 1,000 orders with probability $(999/1000)^{1000} \approx 1/e$, and linearity adds those chances over the riders without caring that they depend on one another, the same step that counted quicksort's comparisons pair by pair.

        Randomness also appears where an exact answer is too expensive to compute or store. [[f7.fingerprints-and-content-hashes]] compares huge files by short random-looking fingerprints, Monte Carlo style, and [[q8.sketches-hyperloglog-and-count-min]] counts distinct visitors in a few kilobytes by hashing. [[d1.load-balancers-and-proxies]] spreads requests across servers, where the power of two choices earns its keep.

        Every problem so far had an algorithm whose time grew as a modest power of $n$, with or without coins. [[s3.intractability-p-np-and-heuristics]] meets problems, such as finding the shortest tour through many towns, for which no such algorithm is known, and asks what to do when an exact answer would take longer than the age of the universe.
