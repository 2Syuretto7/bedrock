        solution: |
          import random


          def sample(stream, k):
              # Return k items chosen uniformly at random from stream, reading it once.
              chosen = []
              for i, item in enumerate(stream):
                  if i < k:
                      chosen.append(item)
                  else:
                      j = random.randint(0, i)
                      if j < k:
                          chosen[j] = item
              return chosen


          random.seed(2)
          pings = (n * n for n in range(100000))
          print(len(sample(pings, 5)), sorted(sample("ba", 5)))
        tests: |
          import random as _random

          assert sorted(sample("ba", 5)) == ["a", "b"], "With fewer than k items, sample should return them all"
          assert sample([], 3) == [], "sample([], 3) should be []"
          _random.seed(11)
          _counts = [0] * 10
          for _ in range(10000):
              _got = sample(iter(range(10)), 3)
              assert len(_got) == 3 and len(set(_got)) == 3, "sample(range(10), 3) should give 3 different items, not " + str(_got)
              for _x in _got:
                  _counts[_x] += 1
          for _x in range(10):
              assert 2700 <= _counts[_x] <= 3300, "Over 10,000 samples of 3 from 0 to 9, each number should be chosen about 3,000 times, but " + str(_x) + " was chosen " + str(_counts[_x]) + " times: " + str(_counts)
          _pairs = {}
          for _ in range(6000):
              _got = tuple(sorted(sample(iter(range(4)), 2)))
              _pairs[_got] = _pairs.get(_got, 0) + 1
          assert len(_pairs) == 6, "Every pair from 0 to 3 should be possible, but only " + str(sorted(_pairs)) + " appeared"
          for _p in _pairs:
              assert 850 <= _pairs[_p] <= 1150, "Over 6,000 samples of 2 from 0 to 3, each of the 6 pairs should appear about 1,000 times, but " + str(_p) + " appeared " + str(_pairs[_p]) + " times"
          assert output.strip() == "5 ['a', 'b']", "The program should print 5 ['a', 'b']"
