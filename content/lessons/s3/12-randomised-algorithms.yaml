        explanation: |
          Item `i` is the $(i+1)$-th seen, and `j` is below `k` with probability $k/(i+1)$, the chance it should be kept; when it is, `j` is also a uniformly random place to put it. Drawing from 0 to `i - 1` keeps late items too often; replacing a kept item on every arrival leaves mostly the last few; and drawing from 0 to `i + 1` keeps them too rarely. The tests count how often each item is chosen over thousands of samples, and only the fair rule comes out even.
    - question:
        id: work-four
        type: numeric
        system: s2
        prompt: |
          Quicksort with a random pivot sorts four different numbers. What is the expected number of comparisons, to two decimal places?
        answer: "4.83"
        tolerance: "0.01"
        explanation: |
          The three pairs of neighbours are always compared, $3 \times 1$; the two pairs with one rank between them are compared with probability $2/3$; and the smallest and largest with probability $2/4$. In all, $3 + \tfrac43 + \tfrac12 = 4.83$.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          1,000 orders are each given to one of 1,000 riders chosen at random, independently. On average, how many riders get no order?
        answer: "368"
        tolerance: "1"
        explanation: |
          A rider misses one order with probability $999/1000$, and all 1,000 orders with probability $(999/1000)^{1000} \approx 0.368$, close to $1/e$. Summing that indicator over the 1,000 riders gives an expected $1000 \times 0.368 \approx 368$ idle riders.
    - question:
        id: work-flood
        type: choice
        system: s2
        prompt: |
          A web service stores each request's parameters in a hash table, keyed by the parameter's name, with a hash function fixed in the code. An attacker sends requests with thousands of parameters whose names all hash to the same bucket, and the servers slow to a crawl. What is the best fix?
        options:
          - "Choose the hash function's seed at random when each server starts, so the attacker cannot know which names collide."
          - "Replace the hash function with a different fixed one that spreads names better."
          - "Make the table larger so that each bucket holds fewer names."
          - "Sort the parameter names before inserting them."
        answer: 0
        explanation: |
          Any fixed hash function has sets of names that collide, and an attacker who knows the function can find them; a better fixed function only moves the problem. A random seed chosen at start-up makes the collisions unpredictable, which is the randomised algorithm's defence against an adversary. A larger table does not help when every name lands in the same bucket, and sorting changes the order of insertions, not where they land.
