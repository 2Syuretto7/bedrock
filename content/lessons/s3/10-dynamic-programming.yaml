                        change = 0 if a[i - 1] == b[j - 1] else 1
                        d[i][j] = min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + change)
                return d[rows - 1][cols - 1]


            print(edit_distance("recieve", "receive"), edit_distance("mumbai", "bombay"), edit_distance("", "chai"))
          - |
