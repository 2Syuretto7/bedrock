        options:
          - "The fewest coins to pay every amount up to ₹1,000 with an unusual set of coins"
          - "Sorting a list of names"
          - "Finding the largest number in a list"
          - "Searching for a word in a sorted dictionary"
        answer: 0
        explanation: |
          Each amount's answer is built from the answers for smaller amounts, which are shared by many larger ones: overlapping subproblems. Sorting splits into independent halves, and the other two need one pass or one halving search with nothing to reuse.
  connections:
    - text: |
        89 ways. A slab across the first metre leaves a courtyard one metre shorter, and two slabs along the first two metres leave one two metres shorter, so the counts follow the Fibonacci pattern: 1, 2, 3, 5 and on to 89 for ten metres. Listing all 89 would be tedious; the table needs eight additions.

        Dynamic programming turns many exponential searches into polynomial ones, but not all. The knapsack table grows with the capacity's value, not its length, and [[s3.intractability-p-np-and-heuristics]] explains why no method is known that is fast for every packing problem, and what engineers do instead. Meanwhile, [[s3.amortised-analysis]] returns to counting cost, for operations such as appending to a list, which are usually cheap but occasionally expensive, and shows how to average the occasional cost over the many cheap ones.
