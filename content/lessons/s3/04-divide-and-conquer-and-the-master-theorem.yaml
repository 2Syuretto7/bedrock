concept: s3.divide-and-conquer-and-the-master-theorem
minutes: 95
claim: You can design an algorithm that splits a problem into smaller copies of itself, solves them recursively and combines the answers, write its running time as a recurrence, draw the recursion tree to see which levels do the work, read off the answer with the master theorem, and recognise the recurrences it does not cover.
recalls: [s3.binary-search]
uses: [s3.sorting, s3.measuring-and-predicting-running-time, f3.recurrences, f1.arithmetic-and-geometric-series, f1.logarithms, f3.asymptotic-notation, f2.induction-and-strong-induction, f3.modular-arithmetic, s1.recursion]
leads: [s3.breadth-first-and-depth-first-search, s3.dynamic-programming, f8.fast-modular-exponentiation, f9.matrix-multiplication-and-its-cost]
starter: |
  # Scratch space. Count the single-digit multiplications of the split-in-half method.
  def school(n):
      return n * n

  def karatsuba(n):
      if n == 1:
          return 1
      return 3 * karatsuba(n // 2)

  for n in [2, 16, 128, 1024]:
      print(n, school(n), karatsuba(n))
parts:
  recall:
    - text: |
        [[s3.binary-search]] threw away half of a sorted list with each comparison. Merge sort, from [[s3.sorting]], split a list in half too, but kept both halves, sorted each, and merged them. Both are cases of one pattern, and this lesson gives it a name and a way to count its cost without tracing every call. Three quick pulls first.
  puzzle:
    - text: |
        Multiplying two numbers of 1,024 digits the way it is taught in school takes 1,024 × 1,024 = 10,48,576 multiplications of single digits.

        There is a trick: two numbers of $2k$ digits can be multiplied using just three multiplications of $k$-digit numbers, plus some additions and shifts. Apply the trick to each of those three multiplications, then again to each of theirs, all the way down to single digits. **How many single-digit multiplications does that take for two numbers of 1,024 digits?**
  intuition:
    - text: |
        On counting day after an election, nobody counts every vote in a state at one table. Each booth's votes are counted separately, each constituency adds up its booths, and the state adds up its constituencies. The big job is split into smaller jobs of the same kind, those are split again, and the answers are combined on the way back up.

        That is **divide and conquer**: **divide** the problem into smaller problems of the same kind, **conquer** each by the same method, recursively as in [[s1.recursion]], until the pieces are small enough to solve directly, and **combine** their answers. Merge sort divides a list into halves, sorts each, and combines by merging. Binary search divides, then conquers only one half and needs no combining.

        The cost of such an algorithm is a **recurrence**, from [[f3.recurrences]]. If a problem of size $n$ makes $a$ subproblems of size $n/b$ and spends $f(n)$ dividing and combining, then $T(n) = a\,T(n/b) + f(n)$. The figure draws the tree of calls for $b = 2$ and $f(n) = n^d$, level by level, with each level's total work as a bar. Start from merge sort, $a = 2$ and $d = 1$, then change the number of subproblems and the work exponent.
    - figure: recursion-tree
      props: { a: 2, d: 1 }
    - text: |
        For merge sort every level does 16 steps: one problem of size 16, two of size 8, four of size 4, and so on. Five levels make 80. With three subproblems instead of two, each level does one and a half times the work of the level above, and the 81 leaves at the bottom outweigh everything else. With one subproblem and squared work, the top level dominates. Which of the three shapes appears, the work spread evenly, piled at the bottom, or piled at the top, decides the running time.
  derivation:
    - text: |
        **The recursion tree.** Take $T(n) = a\,T(n/b) + n^d$, with $a \ge 1$ subproblems, each $b > 1$ times smaller, and $n^d$ steps of dividing and combining. At depth $k$ of the tree there are $a^k$ subproblems, each of size $n/b^k$, so depth $k$ does

        $$a^k \left(\frac{n}{b^k}\right)^d = n^d \left(\frac{a}{b^d}\right)^k$$

        steps. The sizes reach 1 at depth $\log_b n$, by [[f1.logarithms]], so there are $\log_b n + 1$ levels. The level totals form a geometric series with ratio $r = a/b^d$, and [[f1.arithmetic-and-geometric-series]] says what such a sum is.

        - If $r < 1$, the terms shrink, and the sum is at most $1/(1 - r)$ times the first term. The top level dominates: $T(n) = \Theta(n^d)$.
        - If $r = 1$, all $\log_b n + 1$ terms equal $n^d$: $T(n) = \Theta(n^d \log n)$.
        - If $r > 1$, the terms grow, and the sum is within a constant factor of the last term, the leaves. There are $a^{\log_b n} = n^{\log_b a}$ leaves, each doing constant work: $T(n) = \Theta(n^{\log_b a})$.
    - question:
        id: derivation-four-halves
        type: numeric
        system: s2
        prompt: |
          $T(n) = 4\,T(n/2) + n$. For which $k$ is $T(n) = \Theta(n^k)$?
        answer: "2"
        explanation: |
          $a = 4$, $b = 2$, $d = 1$, so $r = 4/2 = 2 > 1$: the leaves dominate, and there are $n^{\log_2 4} = n^2$ of them. Splitting into four half-size problems with linear combining is no faster than the quadratic method it splits.
    - text: |
        **The master theorem.** Comparing $r = a/b^d$ with 1 is the same as comparing $d$ with $\log_b a$. For $T(n) = a\,T(n/b) + \Theta(n^d)$ with $a \ge 1$, $b > 1$ and $d \ge 0$:

        $$T(n) = \begin{cases} \Theta(n^d) & \text{if } d > \log_b a, \\ \Theta(n^d \log n) & \text{if } d = \log_b a, \\ \Theta(n^{\log_b a}) & \text{if } d < \log_b a. \end{cases}$$

        Read it as a contest between the work at the top, $n^d$, and the number of leaves, $n^{\log_b a}$. Whichever grows faster wins; a tie costs an extra factor of $\log n$, one for each level.

        | Algorithm | $a$ | $b$ | $d$ | Result |
        | --- | --- | --- | --- | --- |
        | Binary search | 1 | 2 | 0 | $\Theta(\log n)$ |
        | Merge sort | 2 | 2 | 1 | $\Theta(n \log n)$ |
        | Visiting every node of a balanced tree | 2 | 2 | 0 | $\Theta(n)$ |
        | Multiplying with four half-size products | 4 | 2 | 1 | $\Theta(n^2)$ |
        | Karatsuba multiplication | 3 | 2 | 1 | $\Theta(n^{\log_2 3}) \approx \Theta(n^{1.585})$ |
        | Strassen's matrix multiplication | 7 | 2 | 2 | $\Theta(n^{\log_2 7}) \approx \Theta(n^{2.807})$ |

        The fourth and fifth rows are the puzzle. Splitting each number into a high half and a low half, $x = x_1 \cdot 10^k + x_0$ and $y = y_1 \cdot 10^k + y_0$, gives

        $$xy = x_1 y_1 \cdot 10^{2k} + (x_1 y_0 + x_0 y_1) \cdot 10^k + x_0 y_0,$$

        four half-size products, which gains nothing over the school method. Karatsuba noticed that the middle term is $(x_1 + x_0)(y_1 + y_0) - x_1 y_1 - x_0 y_0$, so three products suffice. Saving one multiplication at each level changes the exponent, because the saving compounds down every level of the tree.
    - question:
        id: derivation-karatsuba
        type: numeric
        system: s2
        prompt: |
          Karatsuba multiplication satisfies $T(n) = 3\,T(n/2) + n$. Its running time is $\Theta(n^k)$. What is $k$, to two decimal places?
        answer: "1.58"
        tolerance: "0.01"
        explanation: |
          $r = 3/2 > 1$, so the leaves dominate: $k = \log_2 3 = \ln 3/\ln 2 \approx 1.585$. For 1,024 digits that is about 59 thousand multiplications against the school method's ten lakh.
    - text: |
        **Where the cleverness goes.** The theorem counts; it does not design. The design work is usually in the combine step. Counting the **inversions** of a list, the pairs out of order that [[s3.sorting]] used to measure how unsorted a list is, takes $n(n - 1)/2$ checks done naively. Done inside merge sort, it costs almost nothing extra: when an item from the right half is merged ahead of the items still waiting in the left half, it is smaller than every one of them, so it forms an inversion with each. The count rides along with the merge, and the whole thing is $\Theta(n \log n)$.

        Raising $x$ to a large power $n$ by multiplying $x$ by itself $n - 1$ times is linear in $n$, hopeless for an exponent of $10^{18}$. But $x^n = (x^{n/2})^2$ when $n$ is even, and $x \cdot (x^{\lfloor n/2 \rfloor})^2$ when it is odd: one subproblem of half the size and a constant amount of work, $a = 1$, $b = 2$, $d = 0$, so about $2\log_2 n$ multiplications. Working modulo $m$, as in [[f3.modular-arithmetic]], keeps the numbers small, and the method is the heart of the cryptography still to come.

        **When the theorem does not apply.** The theorem needs subproblems that are a fixed fraction of $n$. $T(n) = T(n - 1) + n$ removes one item at a time, as a sort that repeatedly picks out the smallest item does, and adds $n + (n - 1) + \cdots + 1 = \Theta(n^2)$. Quicksort with a terrible pivot every time is exactly this case. Uneven splits, such as $T(n) = T(n/3) + T(2n/3) + n$, and combine costs that are not a power of $n$, such as $T(n) = 2\,T(n/2) + n \log n$, need the recursion tree drawn by hand; that last one comes to $\Theta(n \log^2 n)$. A guess from the tree can then be proved by strong induction, as in [[f2.induction-and-strong-induction]].
    - question:
        id: order-recursion-tree
        type: order
        system: s2
        prompt: |
          Put the steps of solving a recurrence $T(n) = a\,T(n/b) + n^d$ with a recursion tree in order.
        steps:
          - "Write the size of each subproblem at depth $k$, which is $n/b^k$."
          - "Multiply the work of one such subproblem by the $a^k$ subproblems at depth $k$ to get the level's total."
          - "Divide neighbouring level totals to find the ratio $a/b^d$."
          - "Sum the geometric series of level totals to see whether the top, every level or the leaves dominate."
        explanation: |
          A level's total needs the size of its subproblems, the ratio needs the level totals, and the sum of a geometric series needs its ratio.
  formal:
    - text: |
        **Divide and conquer.** Divide a problem of size $n$ into $a$ subproblems of size $n/b$, solve them recursively, and combine their answers. Cost: $T(n) = a\,T(n/b) + f(n)$, with $T(1)$ constant.

        **Recursion tree.** Depth $k$ has $a^k$ subproblems of size $n/b^k$. With $f(n) = n^d$, depth $k$ costs $n^d (a/b^d)^k$. Depth $\log_b n$; $n^{\log_b a}$ leaves.

        **Master theorem.** For $a \ge 1$, $b > 1$, $d \ge 0$ and $f(n) = \Theta(n^d)$: $T(n) = \Theta(n^d)$ if $d > \log_b a$; $\Theta(n^d \log n)$ if $d = \log_b a$; $\Theta(n^{\log_b a})$ if $d < \log_b a$.

        **Not covered.** Subtractive recurrences such as $T(n) = T(n - 1) + n = \Theta(n^2)$, uneven splits, and $f(n)$ not of the form $n^d$; solve these by the recursion tree and prove by induction.

        **Examples.** Binary search $\Theta(\log n)$; merge sort and inversion counting $\Theta(n \log n)$; Karatsuba $\Theta(n^{\log_2 3})$; fast powering $\Theta(\log n)$ multiplications.
  drill:
    - text: Seconds each. Find $a$, $b$ and $d$, then compare $d$ with $\log_b a$.
    - question:
        id: drill-halving-one
        type: choice
        system: s1
        prompt: |
          $T(n) = T(n/2) + 1$. What is $T(n)$?
        options:
          - "$\\Theta(\\log n)$"
          - "$\\Theta(n)$"
          - "$\\Theta(n \\log n)$"
          - "$\\Theta(1)$"
        answer: 0
        explanation: $a = 1$, $b = 2$, $d = 0 = \log_2 1$, a tie, so $\Theta(n^0 \log n) = \Theta(\log n)$. This is binary search.
    - question:
        id: drill-two-halves-constant
        type: choice
        system: s1
        prompt: |
          $T(n) = 2\,T(n/2) + 1$. What is $T(n)$?
        options:
          - "$\\Theta(n)$"
          - "$\\Theta(\\log n)$"
          - "$\\Theta(n \\log n)$"
          - "$\\Theta(n^2)$"
        answer: 0
        explanation: '$d = 0 < \log_2 2 = 1$, so the $n$ leaves dominate: $\Theta(n)$, as for visiting every node of a tree.'
    - question:
        id: drill-subtract
        type: choice
        system: s1
        prompt: |
          $T(n) = T(n - 1) + n$. What is $T(n)$?
        options:
          - "$\\Theta(n^2)$"
          - "$\\Theta(n \\log n)$"
          - "$\\Theta(n)$"
          - "The master theorem gives $\\Theta(n)$."
        answer: 0
        explanation: The subproblem is one smaller, not a fraction, so the master theorem does not apply. Adding up gives $n + (n - 1) + \cdots + 1 = \Theta(n^2)$.
    - question:
        id: drill-depth
        type: numeric
        system: s1
        prompt: |
          How many times can 81 be divided by 3 before reaching 1?
        answer: "4"
        explanation: '$81 \to 27 \to 9 \to 3 \to 1$: $\log_3 81 = 4$, the depth of a recursion tree with $b = 3$ on $n = 81$.'
    - question:
        id: drill-leaves
        type: numeric
        system: s1
        prompt: |
          $T(n) = 2\,T(n/2) + n$ on $n = 64$, down to size 1. How many leaves does the recursion tree have?
        answer: "64"
        explanation: $a^{\log_b n} = 2^{\log_2 64} = 2^6 = 64$, one leaf for each item, as in merge sort.
    - question:
        id: predict-calls
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def calls(n):
              if n <= 1:
                  return 1
              return 1 + calls(n // 2) + calls(n // 2)

          print(calls(8))
        output: "15"
        explanation: calls(1) is 1, calls(2) is 1 + 1 + 1 = 3, calls(4) is 1 + 3 + 3 = 7, and calls(8) is 1 + 7 + 7 = 15, the number of nodes in a tree with 8 leaves.
    - question:
        id: predict-depth
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def depth(n):
              if n <= 1:
                  return 0
              return 1 + depth(n // 3)

          print(depth(81), depth(100))
        output: "4 4"
        explanation: "81 goes to 27, 9, 3 and 1 in four steps. 100 goes to 33, 11, 3 and 1, also four, because `//` rounds down."
  work:
    - text: Slower now. For each algorithm, say what the subproblems are and what the combine step must add, then write the recurrence before the code.
    - question:
        id: fix-inversions
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `count_inversions(xs)` should return the number of pairs $i < j$ with `xs[i] > xs[j]`, together with the items of `xs` in sorted order, by counting inside a merge sort. The program should print `2 10 3`. It prints `2 7 2`. Find the fault and fix it.
        starter: |
          def count_inversions(xs):
              # Return (the number of pairs i < j with xs[i] > xs[j], the items of xs in sorted order).
              if len(xs) <= 1:
                  return 0, list(xs)
              mid = len(xs) // 2
              left_count, left = count_inversions(xs[:mid])
              right_count, right = count_inversions(xs[mid:])
              count = left_count + right_count
              merged = []
              i = 0
              j = 0
              while i < len(left) and j < len(right):
                  if left[i] <= right[j]:
                      merged.append(left[i])
                      i += 1
                  else:
                      merged.append(right[j])
                      j += 1
                      count += 1
              return count, merged + left[i:] + right[j:]


          print(count_inversions([3, 1, 2])[0], count_inversions([5, 4, 3, 2, 1])[0], count_inversions([2, 4, 1, 3, 5])[0])
        solution: |
          def count_inversions(xs):
              # Return (the number of pairs i < j with xs[i] > xs[j], the items of xs in sorted order).
              if len(xs) <= 1:
                  return 0, list(xs)
              mid = len(xs) // 2
              left_count, left = count_inversions(xs[:mid])
              right_count, right = count_inversions(xs[mid:])
              count = left_count + right_count
              merged = []
              i = 0
              j = 0
              while i < len(left) and j < len(right):
                  if left[i] <= right[j]:
                      merged.append(left[i])
                      i += 1
                  else:
                      merged.append(right[j])
                      j += 1
                      count += len(left) - i
              return count, merged + left[i:] + right[j:]


          print(count_inversions([3, 1, 2])[0], count_inversions([5, 4, 3, 2, 1])[0], count_inversions([2, 4, 1, 3, 5])[0])
        tests: |
          import random as _random
          _rng = _random.Random(4)
          _cases = [[], [1], [2, 1], [3, 1, 2], [5, 4, 3, 2, 1], [2, 4, 1, 3, 5], [2, 2, 1], [1, 1, 1], [3, 3, 1, 1]]
          for _ in range(30):
              _cases.append([_rng.randint(0, 6) for _ in range(_rng.randint(0, 12))])
          for _xs in _cases:
              _want = 0
              for _i in range(len(_xs)):
                  for _j in range(_i + 1, len(_xs)):
                      if _xs[_i] > _xs[_j]:
