            def count_inversions(xs):
                # Return (the number of pairs i < j with xs[i] > xs[j], the items of xs in sorted order).
                if len(xs) <= 1:
                    return 0, list(xs)
                mid = len(xs) // 2
                left_count, left = count_inversions(xs[:mid])
                right_count, right = count_inversions(xs[mid:])
                count = 0
                merged = []
                i = 0
                j = 0
                while i < len(left) and j < len(right):
                    if left[i] <= right[j]:
                        merged.append(left[i])
                        i += 1
                    else:
                        merged.append(right[j])
                        j += 1
                        count += len(left) - i
                return count, merged + left[i:] + right[j:]


            print(count_inversions([3, 1, 2])[0], count_inversions([5, 4, 3, 2, 1])[0], count_inversions([2, 4, 1, 3, 5])[0])
        explanation: |
          When `right[j]` is merged ahead of `left[i]`, it is smaller than `left[i]` and therefore smaller than every item after it in the sorted left half: `len(left) - i` inversions at once, not one. Adding all of `len(left)` counts items already merged, which were smaller; taking from the right on a tie counts equal items as inversions; and starting the count at zero throws away the inversions inside each half. $T(n) = 2\,T(n/2) + n$, so $\Theta(n \log n)$.
    - question:
        id: write-power-mod
        type: code
        mode: write
        system: s2
        prompt: |
          Write `power_mod(x, n, m)`, which returns $x^n$ modulo $m$ for whole numbers $x \ge 0$, $n \ge 0$ and $m \ge 2$, without `**` or `pow`. It must be fast even when $n$ is about $10^{18}$, so halve $n$ rather than multiplying $n$ times.
        starter: |
          def power_mod(x, n, m):
              # Return x to the power n, modulo m, for whole numbers x >= 0, n >= 0 and m >= 2,
              # by halving n. Do not use ** or pow.
              return 1


          print(power_mod(3, 13, 100), power_mod(2, 10, 1000), power_mod(7, 10 ** 18, 13))
        solution: |
          def power_mod(x, n, m):
              # Return x to the power n, modulo m, for whole numbers x >= 0, n >= 0 and m >= 2,
              # by halving n. Do not use ** or pow.
              if n == 0:
                  return 1
              half = power_mod(x, n // 2, m)
              result = half * half % m
              if n % 2 == 1:
                  result = result * x % m
              return result


          print(power_mod(3, 13, 100), power_mod(2, 10, 1000), power_mod(7, 10 ** 18, 13))
        tests: |
          for _x in [0, 1, 2, 3, 7, 10, 123]:
              for _n in [0, 1, 2, 3, 4, 5, 6, 7, 8, 13, 31, 64, 100]:
                  for _m in [2, 7, 13, 100, 1000, 999983]:
                      _want = _x ** _n % _m
                      _got = power_mod(_x, _n, _m)
                      assert _got == _want, "power_mod(" + str(_x) + ", " + str(_n) + ", " + str(_m) + ") should be " + str(_want) + ", not " + str(_got)
          for _x, _n, _m, _want in [(7, 10 ** 18, 13, 9), (2, 10 ** 18, 1000000007, 719476260), (12345, 98765432109876, 999983, 857575)]:
              _got = power_mod(_x, _n, _m)
              assert _got == _want, "power_mod(" + str(_x) + ", " + str(_n) + ", " + str(_m) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "23 24 9", "The program should print 23 24 9"
