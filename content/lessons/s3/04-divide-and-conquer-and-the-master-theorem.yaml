              _got = count_inversions(list(_xs))
              assert _got[0] == _want, "count_inversions(" + str(_xs) + ") should count " + str(_want) + " inversions, not " + str(_got[0])
              assert list(_got[1]) == sorted(_xs), "count_inversions(" + str(_xs) + ") should also return " + str(sorted(_xs)) + ", not " + str(_got[1])
          assert output.strip() == "2 10 3", "The program should print 2 10 3"
