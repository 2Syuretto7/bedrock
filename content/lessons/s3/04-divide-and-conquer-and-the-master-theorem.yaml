    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Karatsuba's trick multiplies two numbers of $2k$ digits with three multiplications of $k$-digit numbers. Applied all the way down, how many single-digit multiplications does it use for two numbers of 1,024 digits?
        answer: "59049"
        explanation: |
          Each level triples the number of multiplications and halves their size. 1,024 halves to 1 in 10 levels, so there are $3^{10} = 59{,}049$ single-digit multiplications, against $1{,}024^2 = 10{,}48{,}576$ for the school method. That is $n^{\log_2 3}$ with $n = 1{,}024$.
    - question:
        id: work-split-once
        type: choice
        system: s2
        prompt: |
          A quadratic algorithm takes 4 seconds on an input. A team splits the input into two halves, runs the old quadratic algorithm on each half, and combines the results in linear time, without splitting further. About how long does the new version take, and what is its growth rate?
        options:
          - "About 2 seconds, still $\\Theta(n^2)$"
          - "About 1 second, $\\Theta(n \\log n)$"
          - "About 2 seconds, $\\Theta(n \\log n)$"
          - "About 4 seconds, $\\Theta(n^2)$"
        answer: 0
        explanation: |
          Each half takes a quarter of the time, 1 second, so the two take 2 seconds, plus a little for combining. The growth rate is still quadratic, because the halves are solved the old way. Only splitting again and again, down to small pieces, turns $2\,T(n/2) + n$ into $\Theta(n \log n)$.
  connections:
    - text: |
        59,049. Each application of the trick turns one multiplication into three of half the size, and 1,024 digits halve down to single digits in ten steps, so the count is $3^{10}$, against the school method's 10,48,576. That is about eighteen times fewer, and the gap widens with the size: at a million digits it is over a hundred times. Python's own multiplication of very large integers switches to Karatsuba's method once the numbers are long enough.

        Divide and conquer is one of the main ways algorithms are designed, and the recursion tree is how they are counted. The same splitting appears in [[f9.matrix-multiplication-and-its-cost]], where Strassen's seven products beat the obvious eight, and fast powering is [[f8.fast-modular-exponentiation]], on which public-key cryptography rests. When the subproblems overlap, so that the same small problem is solved again and again, plain recursion wastes its effort, and [[s3.dynamic-programming]] stores each answer the first time it is found. Recursion also explores: [[s3.breadth-first-and-depth-first-search]] walks a graph by going deep along one path before backing up, the way a recursive call goes deep before it returns, and contrasts it with a search that spreads out level by level.
