            def power_mod(x, n, m):
                # Return x to the power n, modulo m, for whole numbers x >= 0, n >= 0 and m >= 2,
                # by halving n. Do not use ** or pow.
                if n == 1:
                    return x % m
                half = power_mod(x, n // 2, m)
                result = half * half % m
                if n % 2 == 1:
                    result = result * x % m
                return result


            print(power_mod(3, 13, 100), power_mod(2, 10, 1000), power_mod(7, 10 ** 18, 13))
        explanation: |
          $x^n = (x^{\lfloor n/2 \rfloor})^2$ when $n$ is even, and $x$ times that when $n$ is odd, so one recursive call on half the exponent and at most two multiplications: $T(n) = T(n/2) + 1 = \Theta(\log n)$, about 60 calls for $10^{18}$. Dropping the odd case loses a factor of $x$ at every odd step; multiplying `half` by `x` drops one square; and stopping only at $n = 1$ never stops for $n = 0$. Reducing modulo $m$ after each multiplication keeps the numbers from growing with $n$.
    - question:
