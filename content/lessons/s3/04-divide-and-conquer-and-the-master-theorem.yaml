        solution: |
          def best_stretch(changes):
              # changes is a non-empty list of daily changes in a shop's footfall. Return the largest
              # total of a stretch of one or more consecutive days, by splitting the list in half.
              if len(changes) == 1:
                  return changes[0]
              mid = len(changes) // 2
              best_left = best_stretch(changes[:mid])
              best_right = best_stretch(changes[mid:])
              # The best stretch crossing the middle is the best one ending at mid - 1
              # joined to the best one starting at mid.
              total = 0
              left_part = changes[mid - 1]
              for i in range(mid - 1, -1, -1):
                  total += changes[i]
                  left_part = max(left_part, total)
              total = 0
              right_part = changes[mid]
              for i in range(mid, len(changes)):
                  total += changes[i]
                  right_part = max(right_part, total)
              return max(best_left, best_right, left_part + right_part)


          print(best_stretch([2, -5, 3, 4, -1, 2, -6, 1]), best_stretch([-3, -1, -2]), best_stretch([4, -1, 4]))
