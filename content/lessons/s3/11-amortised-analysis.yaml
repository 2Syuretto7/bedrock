        explanation: |
          Appends are constant amortised, so the total cost is fine, but each move to a larger block copies the whole list in one frame. The moves come at sizes doubling or growing by a fixed fraction, so they get rarer and longer, exactly as observed. Amortised bounds say nothing about a single frame's deadline.
