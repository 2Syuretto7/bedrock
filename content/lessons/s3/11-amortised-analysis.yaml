    - text: |
        1,994 flips. The last bit flips all 1,000 times, the next 500 times, the next 250, and so on, so the total is just under twice the number of increases, although a single increase, such as 511 to 512, can flip ten bits at once. The few expensive increases are paid for by the many cheap ones.

        Amortised analysis guarantees a total without any chance involved. [[s3.randomised-algorithms]] takes the other route: let the algorithm itself flip coins, and bound its expected cost over its own random choices, which can be guaranteed for every input. Quicksort with a random pivot and hash functions chosen at random are the classic cases.
