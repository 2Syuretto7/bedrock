            class DynamicArray:
                def __init__(self):
                    self.block = [None]
                    self.size = 0
                    self.copies = 0

                def resize(self, room):
                    new = [None] * room
                    for i in range(self.size):
                        new[i] = self.block[i]
                        self.copies += 1
                    self.block = new

                def append(self, x):
                    # When the block is full, move to a block twice as large.
                    if self.size > len(self.block):
                        self.resize(2 * len(self.block))
                    self.block[self.size] = x
                    self.size += 1


            a = DynamicArray()
            for i in range(1000):
                a.append(i)
            print(a.size, len(a.block), a.copies)
        explanation: |
          Growing by one place means every append after the first is a full block, so the $k$-th append copies $k - 1$ items and 1,000 appends copy $0 + 1 + \cdots + 999 = 4{,}99{,}500$. Doubling makes the moves exponentially rarer, and the copies add to $1 + 2 + \cdots + 512 = 1{,}023$. Growing by 10 places is still quadratic, only ten times slower to show it; counting copies without making them leaves the new block empty; and checking `size > len(block)` lets an append write past the end.
    - question:
        id: write-two-stack-queue
        type: code
        mode: write
        system: s2
        prompt: |
          Complete `dequeue` in `TwoStackQueue`. New items are pushed on `inbox`, and items leave from `outbox`. When `outbox` is empty, carry every item from `inbox` onto it, counting each carried item in `moves`; then remove and return the item on top of `outbox`, which is the oldest. The queue is never empty when `dequeue` is called.
        starter: |
          class TwoStackQueue:
              # A queue built from two lists used as stacks. New items go on inbox; items leave from
              # outbox. moves counts the items carried from inbox to outbox.
              def __init__(self):
                  self.inbox = []
                  self.outbox = []
                  self.moves = 0

              def enqueue(self, x):
                  self.inbox.append(x)

              def dequeue(self):
                  # Return and remove the oldest item. The queue is never empty when this is called.
                  return self.inbox.pop()


          q = TwoStackQueue()
          for i in range(5):
              q.enqueue(i)
          print(q.dequeue(), q.dequeue())
          q.enqueue(5)
          print([q.dequeue() for _ in range(4)], q.moves)
        solution: |
          class TwoStackQueue:
              # A queue built from two lists used as stacks. New items go on inbox; items leave from
              # outbox. moves counts the items carried from inbox to outbox.
              def __init__(self):
                  self.inbox = []
                  self.outbox = []
                  self.moves = 0

              def enqueue(self, x):
                  self.inbox.append(x)

              def dequeue(self):
                  # Return and remove the oldest item. The queue is never empty when this is called.
                  if len(self.outbox) == 0:
                      while len(self.inbox) > 0:
                          self.outbox.append(self.inbox.pop())
                          self.moves += 1
                  return self.outbox.pop()


          q = TwoStackQueue()
          for i in range(5):
              q.enqueue(i)
          print(q.dequeue(), q.dequeue())
          q.enqueue(5)
          print([q.dequeue() for _ in range(4)], q.moves)
        tests: |
          import random as _random

          _rng = _random.Random(73)
          for _round in range(40):
              _q = TwoStackQueue()
              _model = []
              _expected_moves = 0
              _in = []
              _out = []
              _next = 0
              for _step in range(_rng.randint(1, 30)):
                  if _model and _rng.random() < 0.45:
                      if not _out:
                          _expected_moves += len(_in)
                          _out = _in[::-1]
                          _in = []
                      _out.pop()
                      _want = _model.pop(0)
                      _got = _q.dequeue()
                      assert _got == _want, "dequeue() should return the oldest item, " + str(_want) + ", not " + str(_got)
                  else:
                      _q.enqueue(_next)
                      _model.append(_next)
                      _in.append(_next)
                      _next += 1
              assert _q.moves == _expected_moves, "moves should count each item carried from inbox to outbox, " + str(_expected_moves) + " here, not " + str(_q.moves)
              assert _q.moves <= _next, "No item should be carried more than once, but " + str(_next) + " items took " + str(_q.moves) + " moves"
          assert output.strip() == "0 1\n[2, 3, 4, 5] 6", "The program should print 0 1 and then [2, 3, 4, 5] 6"
        wrong:
          - |
