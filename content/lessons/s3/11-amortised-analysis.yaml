                    if len(self.outbox) == 0:
                        self.outbox.append(self.inbox.pop())
                        self.moves += 1
                    return self.outbox.pop()


            q = TwoStackQueue()
            for i in range(5):
                q.enqueue(i)
            print(q.dequeue(), q.dequeue())
            q.enqueue(5)
            print([q.dequeue() for _ in range(4)], q.moves)
          - |
            class TwoStackQueue:
                # A queue built from two lists used as stacks. New items go on inbox; items leave from
                # outbox. moves counts the items carried from inbox to outbox.
                def __init__(self):
                    self.inbox = []
                    self.outbox = []
                    self.moves = 0

