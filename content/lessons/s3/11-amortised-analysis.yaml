concept: s3.amortised-analysis
minutes: 85
claim: You can bound the total cost of a sequence of operations when a few are expensive and most are cheap, by adding up the whole sequence, by charging each operation a fixed fee and saving the surplus, or with a potential function, and use it to show that appending to a doubling array, a queue built from two stacks and a binary counter each cost a constant per operation over any sequence, while knowing what an amortised bound does not promise.
recalls: [s3.dynamic-programming]
uses: [s2.arrays-and-dynamic-arrays, s2.stacks-and-queues, s2.hash-tables, s2.union-find, f1.arithmetic-and-geometric-series, s1.classes-and-objects, s3.measuring-and-predicting-running-time, f5.summaries-mean-median-and-percentiles]
leads: [s3.randomised-algorithms]
starter: |
  # Scratch space. Count the copies a doubling list makes.
  room = 1
  size = 0
  copies = 0
  for i in range(1000):
      if size == room:
          copies += size
          room *= 2
      size += 1
  print(size, room, copies, (size + copies) / size)
parts:
  recall:
    - text: |
        [[s3.dynamic-programming]] counted its cost as the number of table entries times the work for each, the same for every entry. Some operations are not like that. Appending to a Python list is usually one write, but now and then the list runs out of room and copies everything it holds. Judging such an operation by its worst single call is too pessimistic, and this lesson shows how to count it fairly. Three quick pulls first.
  puzzle:
    - text: |
        A binary counter starts at 0 and is increased by 1, one thousand times, ending at 1,000. Each increase turns the trailing 1s at the right end to 0 and the next 0 to 1: from 0111 to 1000 flips four bits, while from 1000 to 1001 flips one.

        **How many bit flips do the thousand increases make in all?**
  intuition:
    - text: |
        A family pays a big annual insurance premium once a year and small grocery bills every week. Judging the household by its most expensive day would make it look ruinous; judging it by the total over the year, divided by the days, gives a fair daily cost. **Amortised analysis** does the same for operations: it bounds the total cost of any sequence of $n$ operations, and divides by $n$.

        The textbook case is the dynamic array from [[s2.arrays-and-dynamic-arrays]]. It keeps its items in a block with spare room. An append writes into the next free place, one step. When the block is full, it moves to a new block twice the size, copying every item, a step for each. The figure counts the work of each append. Step through the appends and watch where the expensive ones fall.
    - figure: doubling-array
      props: { appends: 9 }
    - text: |
        After 9 appends, the block has moved four times, copying 1, 2, 4 and 8 items, 15 copies in all, plus 9 writes: 24 steps, under 3 per append. The expensive appends grow, but they come exponentially further apart, so their cost spread over the cheap appends between them stays constant.
  derivation:
    - text: |
        **Adding it all up.** Starting from a block of 1, $n$ appends move the block whenever the count reaches 1, 2, 4, …, up to the largest power of 2 below $n$, copying that many items each time. By [[f1.arithmetic-and-geometric-series]], $1 + 2 + 4 + \cdots + 2^k = 2^{k+1} - 1 < 2n$, since $2^k < n$. With the $n$ writes, the total is less than $3n$, so each append costs less than 3 **amortised**, even though one append can cost $n$. This is the **aggregate method**: bound the whole sequence and divide.
    - question:
        id: derivation-copies
        type: numeric
        system: s2
        prompt: |
          A dynamic array starts with room for 1 and doubles when full. How many items are copied in all during 17 appends?
        answer: "31"
        explanation: |
          The block is full at sizes 1, 2, 4, 8 and 16, each time before the next append, copying $1 + 2 + 4 + 8 + 16 = 31$ items. That is less than $2 \times 17 = 34$.
    - text: |
        **Why doubling, and not adding room.** Suppose the block grows by a fixed 4 places each time it fills. Then it moves at sizes 4, 8, 12, …, and $n$ appends copy about $4 + 8 + 12 + \cdots \approx n^2/8$ items: quadratic, as in [[s3.measuring-and-predicting-running-time]]. Any constant growth factor above 1 keeps the copies linear; Python's lists grow by about an eighth each time, trading a few more moves for less unused room. The hash tables of [[s2.hash-tables]] grow their bucket arrays the same way, for the same reason.

        **The accounting method.** Charge every append a fixed fee of 3 steps. One pays for its own write; two are saved with the item. When the block of size $m$ fills, the $m/2$ items added since the last move have saved $m$ steps between them, exactly enough to copy all $m$ items. Since the savings never go negative, the real total never exceeds the fees, $3n$.

        **The potential method.** Define a quantity of the data structure, its **potential** $\Phi$, that is never negative, here $\Phi = 2 \times \text{size} - \text{room}$, once the block has moved at least once. The amortised cost of an operation is its actual cost plus the change in $\Phi$. An ordinary append costs 1 and raises $\Phi$ by 2: amortised 3. An append that moves a full block of $m$ costs $m + 1$, and $\Phi$ falls from $2m - m = m$ to $2(m + 1) - 2m = 2$: amortised $(m + 1) + (2 - m) = 3$. The amortised costs add to the actual total plus the final $\Phi$ minus the first, so the actual total is at most $3n$.
    - question:
        id: derivation-constant-growth
        type: numeric
        system: s2
        prompt: |
          A block starts with room for 4 and grows by 4 places each time it is full. How many items are copied in all during 20 appends?
        answer: "40"
        explanation: |
          The block is full, before the next append, at sizes 4, 8, 12 and 16, copying $4 + 8 + 12 + 16 = 40$ items: already twice the number of appends, and growing with the square of $n$.
    - text: |
        **A queue from two stacks.** A queue can be built from two lists used as stacks, as in [[s2.stacks-and-queues]]: new items are pushed on an **inbox**, and items leave from an **outbox**. When the outbox is empty and an item must leave, every item in the inbox is popped and pushed onto the outbox, which reverses them, putting the oldest on top. One such dequeue can carry $n$ items. But each item is pushed on the inbox once, carried once, and popped from the outbox once, so any sequence of $n$ operations does at most $3n$ steps: constant amortised time.

        **The binary counter.** The last bit flips on every increase, the next bit on every second increase, the next on every fourth. Over $n$ increases from 0, bit $i$ flips $\lfloor n/2^i \rfloor$ times, and the total is less than $n + n/2 + n/4 + \cdots = 2n$.

        **What amortised does not promise.** An amortised bound holds for every sequence, with no probability involved: it is a worst-case guarantee for the total, not an average over random inputs. It does not make any single operation cheap. The append that copies a million items still takes a million steps, and in a system that must answer every request within a few milliseconds, that one slow call shows up in the tail of the latency, the p99 of [[f5.summaries-mean-median-and-percentiles]]. Union-find with path compression, from [[s2.union-find]], is another structure whose good bound is amortised: a single `find` can be slow, but it shortens the paths for every later one.
    - question:
        id: order-potential
        type: order
        system: s2
        prompt: |
          Put the steps of an amortised analysis by the potential method in order.
        steps:
          - "Choose a potential that is zero at the start and never negative."
          - "For each kind of operation, add its actual cost to the change in potential it causes."
          - "Show that every operation's amortised cost is at most some constant."
          - "Conclude that the actual cost of any sequence of n operations is at most that constant times n."
        explanation: |
          The amortised costs are defined by the potential, the constant bound is about the amortised costs, and the conclusion needs the bound together with a potential that never goes negative.
  formal:
    - text: |
        **Amortised cost.** A bound $c$ such that every sequence of $n$ operations, from the empty structure, costs at most $c\,n$ in total. It is a guarantee for every sequence, not an average over inputs.

        **Aggregate method.** Bound the total of any sequence directly, then divide by $n$.

        **Accounting method.** Charge each operation a fee; the surplus saved by cheap operations must always cover the expensive ones.

        **Potential method.** $\Phi \ge 0$, with $\Phi_0 = 0$; amortised cost $\hat{c}_i = c_i + \Phi_i - \Phi_{i-1}$; then $\sum c_i = \sum \hat{c}_i - \Phi_n \le \sum \hat{c}_i$.

        **Results.** Doubling array: append $< 3$ amortised, $n$ worst case. Growth by a constant amount: $\Theta(n)$ amortised. Two-stack queue: $O(1)$ amortised per operation. Binary counter: fewer than $2n$ flips for $n$ increases; exactly $2n$ minus the number of 1s in $n$.
  drill:
    - text: Seconds each. Add up the whole sequence, not one step.
    - question:
        id: drill-eight
        type: numeric
        system: s1
        prompt: |
          A doubling array starting with room for 1 receives 8 appends. How many steps of work in all, counting each write and each copy as one?
        answer: "15"
        explanation: 8 writes, and copies of $1 + 2 + 4 = 7$ items when the block fills at sizes 1, 2 and 4.
    - question:
        id: drill-last-bit
        type: numeric
        system: s1
        prompt: |
          A binary counter is increased 8 times from 0. How many times does its rightmost bit flip?
        answer: "8"
        explanation: The rightmost bit flips on every increase.
    - question:
        id: drill-queue-moves
        type: numeric
        system: s1
        prompt: |
          Ten items are put into a two-stack queue, then all ten are taken out. How many items are carried from the inbox to the outbox?
        answer: "10"
        explanation: The first dequeue carries all ten at once; the other nine dequeues carry nothing.
    - question:
        id: drill-amortised-meaning
        type: choice
        system: s1
        prompt: |
          An operation takes 3 steps amortised. What is guaranteed?
        options:
          - "Any sequence of n such operations takes at most 3n steps."
          - "Every single operation takes at most 3 steps."
          - "On random inputs, operations take 3 steps on average."
          - "Most operations take exactly 3 steps."
        answer: 0
        explanation: Amortised bounds the total of every sequence; a single operation can still be expensive, and no randomness is assumed.
    - question:
        id: drill-growth
        type: choice
        system: s1
        prompt: |
          A list grows by 100 places each time it fills. What is the total cost of n appends?
        options:
          - "$\\Theta(n^2)$"
          - "$\\Theta(n)$"
          - "$\\Theta(n \\log n)$"
          - "$\\Theta(100n)$"
        answer: 0
        explanation: It moves about $n/100$ times, copying on average about $n/2$ items each time, about $n^2/200$ copies.
    - question:
        id: predict-room
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          room = 1
          size = 0
          copies = 0
          for i in range(10):
              if size == room:
                  copies += size
                  room *= 2
              size += 1
          print(room, copies)
        output: "16 15"
        explanation: The block fills at sizes 1, 2, 4 and 8, copying $1 + 2 + 4 + 8 = 15$ items and ending with room for 16.
    - question:
        id: predict-bits
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          x = 7
          print(bin(x), bin(x + 1))
        output: "0b111 0b1000"
        explanation: Going from 7 to 8 turns three trailing 1s to 0 and sets the next bit, four flips in one increase.
  work:
    - text: Slower now. For each structure, find the expensive operation, and count how often it can happen.
    - question:
        id: fix-doubling
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `DynamicArray` should keep its items in a block that doubles when full, so that appends cost a constant amortised. The program should print `1000 1024 1023`. It prints `1000 1000 499500`. Find the fault and fix it.
        starter: |
          class DynamicArray:
              def __init__(self):
                  self.block = [None]
                  self.size = 0
                  self.copies = 0

              def resize(self, room):
                  new = [None] * room
                  for i in range(self.size):
                      new[i] = self.block[i]
                      self.copies += 1
                  self.block = new

              def append(self, x):
                  # When the block is full, move to a block twice as large.
                  if self.size == len(self.block):
                      self.resize(len(self.block) + 1)
                  self.block[self.size] = x
                  self.size += 1


          a = DynamicArray()
          for i in range(1000):
              a.append(i)
          print(a.size, len(a.block), a.copies)
        solution: |
          class DynamicArray:
              def __init__(self):
                  self.block = [None]
                  self.size = 0
                  self.copies = 0

              def resize(self, room):
                  new = [None] * room
                  for i in range(self.size):
                      new[i] = self.block[i]
                      self.copies += 1
                  self.block = new

              def append(self, x):
                  # When the block is full, move to a block twice as large.
                  if self.size == len(self.block):
                      self.resize(2 * len(self.block))
                  self.block[self.size] = x
                  self.size += 1


          a = DynamicArray()
          for i in range(1000):
              a.append(i)
          print(a.size, len(a.block), a.copies)
        tests: |
          for _n in [0, 1, 2, 3, 5, 8, 9, 100, 1000, 4097]:
              _a = DynamicArray()
              for _i in range(_n):
                  _a.append(_i * 7)
              assert _a.size == _n, "After " + str(_n) + " appends, size should be " + str(_n) + ", not " + str(_a.size)
              assert list(_a.block[:_n]) == [_i * 7 for _i in range(_n)], "After " + str(_n) + " appends, the block should start with the items appended, in order"
              _room = 1
              while _room < _n:
                  _room *= 2
              assert len(_a.block) == _room, "After " + str(_n) + " appends, the block should have room for " + str(_room) + ", not " + str(len(_a.block))
              assert _a.copies == _room - 1 if _n > 0 else _a.copies == 0, "After " + str(_n) + " appends, " + str(_room - 1 if _n > 0 else 0) + " copies should have been made, not " + str(_a.copies)
              assert _a.copies <= 2 * _n, "After " + str(_n) + " appends, there were " + str(_a.copies) + " copies, more than two for each append"
          assert output.strip() == "1000 1024 1023", "The program should print 1000 1024 1023"
        wrong:
          - |
