            q = TwoStackQueue()
            for i in range(5):
                q.enqueue(i)
            print(q.dequeue(), q.dequeue())
            q.enqueue(5)
            print([q.dequeue() for _ in range(4)], q.moves)
          - |
            class TwoStackQueue:
                # A queue built from two lists used as stacks. New items go on inbox; items leave from
                # outbox. moves counts the items carried from inbox to outbox.
                def __init__(self):
                    self.inbox = []
                    self.outbox = []
                    self.moves = 0

                def enqueue(self, x):
                    self.inbox.append(x)

                def dequeue(self):
                    # Return and remove the oldest item. The queue is never empty when this is called.
                    if len(self.outbox) == 0:
                        while len(self.inbox) > 0:
                            self.outbox.append(self.inbox.pop(0))
                            self.moves += 1
                    return self.outbox.pop()


            q = TwoStackQueue()
            for i in range(5):
                q.enqueue(i)
            print(q.dequeue(), q.dequeue())
            q.enqueue(5)
            print([q.dequeue() for _ in range(4)], q.moves)
        explanation: |
          Popping the inbox item by item and pushing onto the outbox reverses the inbox, so the oldest item ends on top. Carrying only when the outbox is empty keeps the outbox's items, which are older than anything in the inbox, in front. Carrying one item at a time leaves the order wrong; carrying even when the outbox has items buries older items under newer ones; and taking from the front of the inbox reverses the order twice. Each item is carried at most once, so `moves` never exceeds the number of items enqueued.
    - question:
        id: write-flips
        type: code
        mode: write
        system: s2
        prompt: |
          A binary counter starts at 0 and is increased by 1, `n` times. Write `flips(n)`, the total number of bits flipped, for `n` up to about $10^{18}$, without simulating every increase.
        starter: |
          def flips(n):
              # A binary counter starts at 0 and is increased by 1, n times. Each increase turns the
              # trailing 1s to 0 and the next 0 to 1. Return the total number of bits flipped, for n
              # up to about 10 ** 18, without simulating every increase.
              return n


          print(flips(1), flips(8), flips(100))
        solution: |
          def flips(n):
              # A binary counter starts at 0 and is increased by 1, n times. Each increase turns the
              # trailing 1s to 0 and the next 0 to 1. Return the total number of bits flipped, for n
              # up to about 10 ** 18, without simulating every increase.
              total = 0
              while n > 0:
                  total += n
                  n = n // 2
              return total


          print(flips(1), flips(8), flips(100))
        tests: |
          def _simulate(_n):
              _bits = []
              _total = 0
              for _ in range(_n):
                  _i = 0
                  while _i < len(_bits) and _bits[_i] == 1:
                      _bits[_i] = 0
                      _total += 1
                      _i += 1
                  if _i == len(_bits):
                      _bits.append(1)
                  else:
                      _bits[_i] = 1
                  _total += 1
              return _total


          for _n in list(range(0, 70)) + [100, 1000, 1023, 1024]:
              _want = _simulate(_n)
              _got = flips(_n)
              assert _got == _want, "flips(" + str(_n) + ") should be " + str(_want) + ", not " + str(_got)
          for _n, _want in [(10 ** 12, 1999999999987), (10 ** 18, 1999999999999999976)]:
              _got = flips(_n)
              assert _got == _want, "flips(" + str(_n) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "1 15 197", "The program should print 1 15 197"
        wrong:
          - |
            def flips(n):
                # A binary counter starts at 0 and is increased by 1, n times. Each increase turns the
                # trailing 1s to 0 and the next 0 to 1. Return the total number of bits flipped, for n
                # up to about 10 ** 18, without simulating every increase.
                return 2 * n


            print(flips(1), flips(8), flips(100))
          - |
            def flips(n):
                # A binary counter starts at 0 and is increased by 1, n times. Each increase turns the
                # trailing 1s to 0 and the next 0 to 1. Return the total number of bits flipped, for n
                # up to about 10 ** 18, without simulating every increase.
                total = 0
                n = n // 2
                while n > 0:
                    total += n
                    n = n // 2
                return total


