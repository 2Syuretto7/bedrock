          - |
            def flips(n):
                # A binary counter starts at 0 and is increased by 1, n times. Each increase turns the
                # trailing 1s to 0 and the next 0 to 1. Return the total number of bits flipped, for n
                # up to about 10 ** 18, without simulating every increase.
                total = 0
                for value in range(n + 1):
                    total += bin(value).count("1")
                return total


            print(flips(1), flips(8), flips(100))
        explanation: |
          Bit $i$ flips once every $2^i$ increases, so $\lfloor n/2^i \rfloor$ times in all, and the total is $n + \lfloor n/2 \rfloor + \lfloor n/4 \rfloor + \cdots$, which halving `n` until it reaches 0 adds up in about 60 steps. $2n$ is only an upper bound; starting at $\lfloor n/2 \rfloor$ leaves out the last bit's flips; and adding up the 1s in every value counts bits that are set, not bits that change.
