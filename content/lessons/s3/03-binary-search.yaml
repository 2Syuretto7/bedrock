                load = 0
                for w in parcels:
                    if load + w > capacity:
                        days += 1
                        load = 0
                    load += w
                return days


            def min_capacity(parcels, days):
                # The smallest whole-number capacity that ships every parcel, in order, within days days.
                lo = max(parcels)
                hi = sum(parcels)
                while lo <= hi:
                    mid = (lo + hi) // 2
                    if days_needed(parcels, mid) <= days:
                        hi = mid - 1
                    else:
                        lo = mid + 1
                return hi


            print(min_capacity([3, 2, 2, 4, 1, 4], 3), min_capacity([3, 2, 2, 4, 1, 4], 1), min_capacity([5], 4))
        explanation: |
          No capacity below the heaviest parcel can carry it, and a capacity equal to the total weight ships everything in one day, so the answer lies from `max(parcels)` to `sum(parcels)`. A bigger van never needs more days, so "fits within `days`" switches once from false to true, and the search keeps `hi` on a capacity that works and `lo` below or on the first that does. Testing `< days` demands finishing a day early; capping the range at the heaviest parcel cannot answer when one day is allowed; and the closed-interval version returns `hi`, which ends one below the answer.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Commit 0 works and commit 1,000 is broken; exactly one commit in between broke it, and every later commit is broken too. Each test of a commit takes 6 minutes. In the worst case, how many minutes does a binary search take to find the breaking commit?
        answer: "60"
        explanation: |
          The breaking commit is one of commits 1 to 1,000, so there are 1,000 possibilities. Each test halves them, and $2^{10} = 1{,}024 \ge 1{,}000$, so 10 tests always suffice and 9 do not, since $2^9 = 512$. $10 \times 6 = 60$ minutes.
    - question:
        id: work-few-lookups
        type: choice
        system: s2
        prompt: |
          A script gets an unsorted list of 10 lakh phone numbers and must check whether 5 particular numbers are in it, once. Which approach does the least work?
        options:
          - "Scan the list once for each of the 5 numbers, about 50 lakh comparisons at most."
          - "Sort the list, then binary search 5 times."
          - "Sort the list, then scan it."
          - "Binary search the unsorted list 5 times."
        answer: 0
        explanation: |
          Sorting 10 lakh items costs about $n \log_2 n \approx 2$ crore comparisons before the first search starts, four times the cost of five scans. Sorting pays off only when the lookups are many, roughly more than $\log_2 n$ of them. Binary search on an unsorted list gives wrong answers.
  connections:
    - text: |
        60 minutes. The breaking commit is one of 1,000, and each test halves the commits still suspected: 500, 250, 125, 63, 32, 16, 8, 4, 2, 1. Ten tests of 6 minutes each, where testing every commit in turn could take 100 hours. This is what `git bisect` does, and it works because "is this commit broken?" switches only once along the history.

        Binary search halves a problem and keeps one half. [[s3.divide-and-conquer-and-the-master-theorem]] studies algorithms that split a problem, solve some or all of the parts, and combine the results, and gives one rule for counting the cost of all of them, binary search and merge sort included. Searching for the smallest answer that works is a tool that returns among [[s3.greedy-algorithms]], whose quick yes-or-no checks it often uses. And the database indexes of [[q0.indexes-from-the-outside]] are, at heart, sorted structures that let a query find a row or a range of rows with a binary search instead of reading the whole table.
