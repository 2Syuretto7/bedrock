concept: s3.binary-search
minutes: 90
claim: You can find an item in a sorted list of n items in about log₂ n comparisons, keep a binary search correct with a half-open interval and a loop invariant, find the first and last positions of a value with bisect_left and bisect_right, count the items in a range, and search for the smallest answer that works whenever a yes-or-no test switches only once.
recalls: [s3.sorting]
uses: [s3.measuring-and-predicting-running-time, f2.loop-invariants, f1.logarithms, f1.inequalities, s2.binary-search-trees, s2.hash-tables, s2.arrays-and-dynamic-arrays, s1.modules-and-imports, s0.loops]
leads: [s3.divide-and-conquer-and-the-master-theorem, s3.greedy-algorithms, q0.indexes-from-the-outside]
starter: |
  # Scratch space. Count the halvings a binary search makes.
  def search(xs, x):
      lo = 0
      hi = len(xs)
      looks = 0
      while lo < hi:
          mid = (lo + hi) // 2
          looks += 1
          if xs[mid] < x:
              lo = mid + 1
          else:
              hi = mid
      return lo, looks

  xs = list(range(0, 2000, 2))
  print(search(xs, 1234))
  print(search(xs, 1235))
parts:
  recall:
    - text: |
        [[s3.sorting]] promised that sorting is rarely the goal but the step that makes the next one easy. Here is the first payoff. In a list that is not sorted, deciding whether a value is present means looking at every item. In a sorted list, one look at the middle rules out half of the list, and the next look half of what remains. Three quick pulls first.
  puzzle:
    - text: |
        A food-delivery app worked at commit 0 and is broken at commit 1,000. Exactly one commit in between broke it, and every commit after that one is broken too. Checking out a commit, building it and testing it takes 6 minutes.

        **In the worst case, how many minutes does it take to find the commit that broke it?**
  intuition:
    - text: |
        Think of the guessing game where one person picks a number from 1 to 100 and the other guesses, hearing only "higher" or "lower". Guessing 1, 2, 3 in turn could take a hundred tries. Guessing 50 first, then 25 or 75, then halving again, never takes more than seven, because each answer throws away half of the numbers still possible, and $2^7 = 128$ is more than 100.

        A sorted list plays the same game. Compare the item you want with the middle item. If it is smaller, it can only be in the left half; if larger, only in the right half. Either way half the list is gone after one comparison. This is **binary search**, and it needs the list to be sorted, because the whole argument rests on everything left of the middle being no larger than the middle.

        The figure searches fifteen sorted numbers. Step through the search for 23, then move the target, or switch to searching for a number that is not there.
    - figure: binary-search
      props: { target: 5 }
    - text: |
        Finding 23 takes three comparisons: 42, then 12, then 23. No target among these fifteen takes more than four, because fifteen positions halve to seven, three, one and none. Searching for 50, which is absent, also takes four, and the search ends knowing exactly where 50 would go, between 42 and 56. That second result turns out to be the more useful one.
  derivation:
    - text: |
        **Counting the comparisons.** Each comparison with the middle leaves at most half of the remaining positions, rounded down. Starting from $n$, after $k$ comparisons at most $n/2^k$ remain, and the search must stop once none remain. So a binary search makes at most $\lfloor \log_2 n \rfloor + 1$ comparisons, by [[f1.logarithms]]: 10 for a thousand items, 20 for a million, 30 for a billion. A linear scan of the same billion items makes up to a billion comparisons. Doubling the list adds one comparison to a binary search and doubles a linear scan, exactly the difference between $\Theta(\log n)$ and $\Theta(n)$ from [[s3.measuring-and-predicting-running-time]].
    - question:
        id: derivation-million
        type: numeric
        system: s2
        prompt: |
          At most how many comparisons does a binary search make on a sorted list of 1,000,000 items?
        answer: "20"
        explanation: |
          $2^{19} = 5{,}24{,}288$ is less than a million and $2^{20} = 10{,}48{,}576$ is more, so $\lfloor \log_2 1{,}000{,}000 \rfloor + 1 = 19 + 1 = 20$. After 20 halvings no position can remain.
    - text: |
        **Getting it right.** Binary search is famous for being easy to describe and hard to write correctly. Most bugs are off by one: the search skips the item it wants, or loops for ever because the interval stops shrinking. The cure is to say exactly what the interval means and keep it true, a loop invariant in the sense of [[f2.loop-invariants]].

        Use a **half-open interval** `lo` to `hi`: positions `lo`, `lo + 1`, up to `hi - 1`, with `hi` itself excluded. Start with `lo = 0` and `hi = len(xs)`, the whole list. The invariant is about the first position whose item is at least `x`: everything before `lo` is smaller than `x`, and everything from `hi` on is at least `x`. Each round takes `mid = (lo + hi) // 2`. If `xs[mid] < x`, then `mid` and everything before it are smaller, so `lo = mid + 1`. Otherwise `xs[mid]` is at least `x`, so `hi = mid`. Both moves keep the invariant, and both shrink the interval, since `lo <= mid < hi`. When `lo == hi` the interval is empty, and `lo` is the answer: the first position whose item is at least `x`, or `len(xs)` if there is none.

        That answer does more than say yes or no. If `xs[lo] == x`, it is the first copy of `x`. If not, `lo` is where `x` would be inserted to keep the list sorted, and its neighbours are the nearest items below and above. Changing the test to `xs[mid] <= x` finds instead the first position whose item is greater than `x`, just past the last copy. The two positions differ by the number of copies of `x`.
    - question:
        id: derivation-copies
        type: numeric
        system: s2
        prompt: |
          In a sorted list, the first position whose item is at least 20 is 3, and the first position whose item is greater than 20 is 7. How many items equal 20?
        answer: "4"
        explanation: |
          Positions 3, 4, 5 and 6 hold items at least 20 but not greater than 20, so exactly 20: $7 - 3 = 4$ copies.
    - text: |
        **Python's `bisect`.** The `bisect` module, imported as in [[s1.modules-and-imports]], provides both searches. `bisect.bisect_left(xs, x)` returns the first position whose item is at least `x`, which is also the number of items smaller than `x`. `bisect.bisect_right(xs, x)` returns the first position whose item is greater than `x`, the number of items at most `x`. So the number of items between `a` and `b`, both included, is `bisect_right(xs, b) - bisect_left(xs, a)`. `bisect.insort(xs, x)` inserts `x` in its place, but the insertion shifts every later item along, as in [[s2.arrays-and-dynamic-arrays]], so it costs $\Theta(n)$ even though the search costs $\Theta(\log n)$. A list kept sorted under many insertions is better kept in a balanced tree, from [[s2.binary-search-trees]], which is a binary search frozen into a data structure.

        **Searching for an answer.** The idea needs less than a sorted list. It needs only a yes-or-no question that switches once: no, no, …, no, yes, yes, …, yes. Binary search finds the switch in $\log_2$ of the length of the range. The puzzle is one case, where the question is "is this commit broken?", and `git bisect` automates it. Another is searching for the smallest answer that works. A courier company must move parcels in a fixed order within a number of days, and asks for the smallest van that does it. A bigger van never needs more days, so "can a van of capacity $c$ finish in time?" switches once from no to yes as $c$ grows, as in [[f1.inequalities]]. Search $c$ between the heaviest parcel and the total weight, and each check is a single pass over the parcels.

        **Bisection on numbers.** The same halving finds where a continuous quantity crosses a threshold: the rate at which a server's latency passes 200 ms, or the root of an equation. Each halving of an interval adds one binary digit of precision, so about 50 halvings reach the limit of a floating-point number.

        **When not to.** A hash set from [[s2.hash-tables]] answers "is $x$ present?" in constant time on average, faster than $\log_2 n$, and needs no sorting. Binary search earns its place when the question is about order: the nearest item, the first item at least $x$, how many items lie in a range. And sorting costs $n \log_2 n$, so for a handful of lookups a single scan of the unsorted list is cheaper.
    - question:
        id: order-search-answer
        type: order
        system: s2
        prompt: |
          Put the steps of searching for the smallest van capacity that delivers every parcel in time in order.
        steps:
          - "Set the range of capacities from the heaviest parcel to the total weight of all parcels."
          - "Test the middle capacity of the range by loading the parcels in order and counting the days."
          - "Keep the half of the range where the first capacity that works must lie."
          - "Return the capacity left when the range has shrunk to a single value."
        explanation: |
          The range must exist before its middle can be tested, a test result is needed to choose which half to keep, and only repeated halving shrinks the range to one value. The search is valid because a bigger van never needs more days, so the answer to "does this capacity work?" switches only once.
  formal:
    - text: |
        **Binary search.** On a sorted list of $n$ items, at most $\lfloor \log_2 n \rfloor + 1$ comparisons: $\Theta(\log n)$.

        **Half-open interval.** `lo` to `hi` means positions `lo` to `hi - 1`. Invariant for the first position with an item at least $x$: `xs[i] < x` for `i < lo`, and `xs[i] >= x` for `i >= hi`. Update with `mid = (lo + hi) // 2`: `lo = mid + 1` if `xs[mid] < x`, else `hi = mid`. Stop when `lo == hi`.

        **`bisect_left(xs, x)`.** The number of items less than $x$; the first position with an item at least $x$.

        **`bisect_right(xs, x)`.** The number of items at most $x$; the first position with an item greater than $x$.

        **Counts.** Copies of $x$: `bisect_right(xs, x) - bisect_left(xs, x)`. Items in $[a, b]$: `bisect_right(xs, b) - bisect_left(xs, a)`.

        **Monotone predicate.** If $p$ is false then true along a range of $m$ values, the first true value is found with $\lceil \log_2 m \rceil$ evaluations of $p$.
