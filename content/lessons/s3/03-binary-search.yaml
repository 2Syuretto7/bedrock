    - question:
        id: predict-left-right
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import bisect
          xs = [10, 20, 20, 30]
          print(bisect.bisect_left(xs, 20), bisect.bisect_right(xs, 20))
        output: "1 3"
        explanation: One item, 10, is smaller than 20, so `bisect_left` gives 1. Three items are at most 20, so `bisect_right` gives 3. The two copies of 20 sit at positions 1 and 2.
    - question:
