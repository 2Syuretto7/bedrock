        explanation: |
          With `<=`, the loop moves `lo` past every copy of `x`, so it ends just after the last copy, where the item is never `x`. With `<` it moves past only the items smaller than `x` and stops at the first copy. Returning `lo` without checking it holds `x` reports positions for missing values; checking `lo <= len(xs)` reads past the end when `x` is larger than everything; and `hi = mid - 1` throws away `mid`, which may be the first copy.
    - question:
        id: write-count-in-range
        type: code
        mode: write
        system: s2
        prompt: |
          A toll plaza records the minute of the day, from 0 to 1,439, at which each FASTag is read, and keeps the minutes sorted. Write `count_in_range(times, start, end)`, which returns how many readings `t` have `start <= t <= end`, using `bisect` rather than looking at every reading.
        starter: |
          import bisect


          def count_in_range(times, start, end):
              # times is sorted. Return how many times t have start <= t <= end, using bisect.
              return 0


          reads = [540, 545, 545, 560, 600, 600, 610, 655]
          print(count_in_range(reads, 545, 600), count_in_range(reads, 601, 609), count_in_range(reads, 0, 1440))
        solution: |
          import bisect


          def count_in_range(times, start, end):
              # times is sorted. Return how many times t have start <= t <= end, using bisect.
              return bisect.bisect_right(times, end) - bisect.bisect_left(times, start)


          reads = [540, 545, 545, 560, 600, 600, 610, 655]
          print(count_in_range(reads, 545, 600), count_in_range(reads, 601, 609), count_in_range(reads, 0, 1440))
        tests: |
          for _times in [[], [5], [540, 545, 545, 560, 600, 600, 610, 655], [1, 1, 1, 2, 2, 3], [0, 10, 20, 30, 40]]:
              for _start in range(-1, 42, 3):
                  for _end in range(_start, 42, 4):
                      _want = len([_t for _t in _times if _start <= _t <= _end])
                      _got = count_in_range(_times, _start, _end)
                      assert _got == _want, "count_in_range(" + str(_times) + ", " + str(_start) + ", " + str(_end) + ") should be " + str(_want) + ", not " + str(_got)
          for _start, _end in [(545, 600), (540, 540), (600, 600), (601, 609), (655, 700)]:
              _times = [540, 545, 545, 560, 600, 600, 610, 655]
              _want = len([_t for _t in _times if _start <= _t <= _end])
              _got = count_in_range(_times, _start, _end)
              assert _got == _want, "count_in_range(" + str(_times) + ", " + str(_start) + ", " + str(_end) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "5 0 8", "The program should print 5 0 8"
        wrong:
          - |
            import bisect


            def count_in_range(times, start, end):
                # times is sorted. Return how many times t have start <= t <= end, using bisect.
                return bisect.bisect_left(times, end) - bisect.bisect_left(times, start)


            reads = [540, 545, 545, 560, 600, 600, 610, 655]
            print(count_in_range(reads, 545, 600), count_in_range(reads, 601, 609), count_in_range(reads, 0, 1440))
          - |
