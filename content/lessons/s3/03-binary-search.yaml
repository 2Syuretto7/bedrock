            def count_in_range(times, start, end):
                # times is sorted. Return how many times t have start <= t <= end, using bisect.
                return bisect.bisect_right(times, end) - bisect.bisect_right(times, start)


            reads = [540, 545, 545, 560, 600, 600, 610, 655]
            print(count_in_range(reads, 545, 600), count_in_range(reads, 601, 609), count_in_range(reads, 0, 1440))
          - |
            import bisect


            def count_in_range(times, start, end):
                # times is sorted. Return how many times t have start <= t <= end, using bisect.
                return bisect.bisect_left(times, end) - bisect.bisect_right(times, start)


            reads = [540, 545, 545, 560, 600, 600, 610, 655]
            print(count_in_range(reads, 545, 600), count_in_range(reads, 601, 609), count_in_range(reads, 0, 1440))
        explanation: |
          `bisect_right(times, end)` counts the readings at most `end`, and `bisect_left(times, start)` counts those less than `start`; the difference is the readings from `start` to `end`, both included. Using `bisect_left` for `end` drops readings exactly at `end`, using `bisect_right` for `start` drops readings exactly at `start`, and swapping both drops both and can even go negative. Each call costs about $\log_2 n$ comparisons, so a day of ten lakh readings answers any window in about 40.
    - question:
        id: write-min-capacity
        type: code
        mode: write
        system: s2
        prompt: |
          Parcels must be shipped in the order given, and each day a van takes parcels from the front of the line until the next one would push its load over its capacity. `days_needed(parcels, capacity)` counts the days. Write `min_capacity(parcels, days)`, the smallest whole-number capacity that ships every parcel within `days` days, by binary search on the capacity.
        starter: |
          def days_needed(parcels, capacity):
              # Parcels go into the van in the order given; a day ends when the next one will not fit.
              days = 1
              load = 0
              for w in parcels:
                  if load + w > capacity:
                      days += 1
                      load = 0
                  load += w
              return days


          def min_capacity(parcels, days):
              # The smallest whole-number capacity that ships every parcel, in order, within days days.
              return sum(parcels)


          print(min_capacity([3, 2, 2, 4, 1, 4], 3), min_capacity([3, 2, 2, 4, 1, 4], 1), min_capacity([5], 4))
        solution: |
          def days_needed(parcels, capacity):
              # Parcels go into the van in the order given; a day ends when the next one will not fit.
              days = 1
              load = 0
              for w in parcels:
                  if load + w > capacity:
                      days += 1
                      load = 0
                  load += w
              return days


          def min_capacity(parcels, days):
              # The smallest whole-number capacity that ships every parcel, in order, within days days.
              lo = max(parcels)
              hi = sum(parcels)
              while lo < hi:
                  mid = (lo + hi) // 2
                  if days_needed(parcels, mid) <= days:
                      hi = mid
                  else:
                      lo = mid + 1
              return lo


          print(min_capacity([3, 2, 2, 4, 1, 4], 3), min_capacity([3, 2, 2, 4, 1, 4], 1), min_capacity([5], 4))
