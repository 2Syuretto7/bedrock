            print([o[0] for o in sort_orders(orders)])
        explanation: |
          The key `(city, -amount)` sorts by city first and breaks ties by amount, with the minus sign making larger amounts come first; Python's sort is stable, so full ties keep their order. Sorting by `(city, amount)` puts small amounts first; reversing the whole sort reverses the cities as well; and putting the amount first in the key ignores the cities until amounts tie. Sorting twice also works: first by amount with `reverse=True`, then stably by city.
