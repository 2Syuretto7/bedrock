          Five parcels of different weights are to be ordered with a balance that compares two at a time. What is the smallest number of weighings a method must be ready to make so that it can always finish?
        answer: "7"
        explanation: |
          Five parcels can arrive in $5! = 120$ orders. Each weighing has two outcomes, so 6 weighings can tell apart at most $2^6 = 64$ orders, too few, while 7 allow 128. So no method can promise fewer than 7, and a careful method does manage it in 7.
