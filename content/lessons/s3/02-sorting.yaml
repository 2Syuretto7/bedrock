            def sort_orders(orders):
                # Each order is (order_id, city, amount). Return a new list sorted by city, A to Z,
                # and within a city by amount, largest first. Orders that tie on both keep their
                # original order.
                return sorted(orders, key=lambda o: (-o[2], o[1]))


