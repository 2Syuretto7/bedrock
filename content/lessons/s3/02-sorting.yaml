          A shop's list of 50,000 products is kept sorted by price. Each morning about 20 prices change by a rupee or two, so each of those products is only a few places from where it belongs, and the list must be sorted again. Which approach does the least work?
        options:
          - "Insertion sort, because the list has only a few inversions"
          - "Merge sort written from scratch, because it is always $n \\log n$"
          - "Counting sort, because prices are numbers"
          - "Heap sort, because it needs no extra list"
        answer: 0
        explanation: |
          With 20 items each a few places out, the list has only about a hundred inversions, so insertion sort does about $n$ plus a hundred steps, close to 50,000. A plain merge sort pays about $n \log_2 n$, nearly 8 lakh comparisons, whatever the input, and so does heap sort. Prices in paise span too wide a range for counting sort. Python's Timsort spots the long sorted stretches by itself and also finishes in close to linear time.
  connections:
    - text: |
        Seven weighings. Five parcels can arrive in 120 orders, and each weighing at best halves the orders still possible, so six weighings leave at least two orders that cannot be told apart. Seven is enough in principle, $2^7 = 128$, and a careful method does sort five items in seven comparisons. Merge sort would need up to eight here, so it is close to the limit but not at it.

        Sorting is rarely the goal. It is the step that makes the next one easy. Once the records of the opening example are sorted, duplicates sit side by side; once a list is sorted, [[s3.binary-search]] finds any item in it in $\log_2 n$ steps. Merge sort's split, solve and combine pattern is the first instance of [[s3.divide-and-conquer-and-the-master-theorem]], which gives a quick way to count the cost of every such algorithm. Many [[s3.greedy-algorithms]] begin by sorting their choices, by deadline or by size, and then take them in order. And quicksort's pivot, which can ruin it if chosen badly, is the classic case of an algorithm saved by randomness in [[s3.randomised-algorithms]].
