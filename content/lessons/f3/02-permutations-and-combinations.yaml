concept: f3.permutations-and-combinations
minutes: 95
claim: You can count arrangements of n things with n!, arrangements of k chosen from n with n!/(n − k)!, and selections where order does not matter with C(n, k), by dividing out the orderings each selection is counted with; prove Pascal's identity and the symmetry of C(n, k) by counting one set two ways; count arrangements with repeated letters and shares of identical items; and compute C(n, k) exactly with whole numbers.
recalls: [f3.counting-with-products-and-sums]
uses: [f2.equivalence-relations-and-partial-orders, f2.relations-and-functions-between-sets, f2.induction-and-strong-induction, f1.exponents-and-exponential-growth, f1.summation-notation, s1.recursion, s1.modules-and-imports, s1.generators-and-context-managers, s0.loops, s0.functions]
leads: [f3.the-pigeonhole-principle, f3.inclusion-and-exclusion, f3.recurrences, f4.sample-spaces-and-events, f4.common-discrete-distributions, s3.sorting, s3.dynamic-programming]
starter: |
  # Scratch space. Five friends sit in a row of five seats.
  # List every seating, then compare the count with a product.
  import itertools

  friends = ["Asha", "Bilal", "Chitra", "Dev", "Esha"]
  seatings = list(itertools.permutations(friends))
  print(len(seatings), 5 * 4 * 3 * 2 * 1)
  print(seatings[0])
  print(seatings[1])
parts:
  recall:
    - text: |
        [[f3.counting-with-products-and-sums]] counted the outcomes of a task in stages by multiplying, provided the number of options at each stage was fixed. Today the options shrink at each stage, because a thing once used cannot be used again, and sometimes the order of the stages stops mattering. Three quick pulls first.
  puzzle:
    - text: |
        A selection committee has a squad of 15 cricketers and must name a playing XI. How many different XIs could it name?

        A friend reasons with the product rule: the first player picked can be any of 15, the second any of the remaining 14, and so on down to the eleventh, any of the remaining 5. So

        $$15 \times 14 \times 13 \times \cdots \times 5 = 54{,}48{,}64{,}32{,}000,$$

        over 5,400 crore XIs. Yet the squad has only 15 players, and leaving out 4 of them is the same as choosing 11. Choosing which 4 sit out cannot possibly give thousands of crores of answers.

        The product rule itself is right. Something about how it was used counts each XI many times over. **What exactly is being overcounted, by how much, and how do you count selections where the order does not matter?**
  intuition:
    - text: |
        Ten relatives meet at a wedding, and everyone shakes hands with everyone else once. How many handshakes are there?

        Each of the 10 shakes 9 hands, which suggests $10 \times 9 = 90$. But a handshake has two people in it, and the count of 90 counted it once from each side: when Ravi shook Meena's hand, it was counted as one of Ravi's 9 and again as one of Meena's 9. Every handshake was counted exactly twice, so there are $90 / 2 = 45$.

        That is the whole trick. Counting in order, first person then second, is easy with the product rule. A handshake has no order, so each one appeared twice among the ordered pairs, once for each way of ordering its two people. Divide by 2.

        The friend's count of XIs did the same thing on a larger scale. Picking players one at a time produces an XI **in an order**, first pick, second pick, and so on. The same XI comes out of every one of the orders in which its 11 players could have been picked, and there are a great many such orders. Divide by that number and the overcounting disappears.

        The figure shows Pascal's triangle, in which row $n$ lists how many ways there are to choose $k$ things from $n$, for each $k$. Step through the rows and the entries, and look at how each entry relates to the two above it.
    - figure: pascal-triangle
      props: { n: 5, k: 2 }
    - text: |
        Row 5 reads 1, 5, 10, 10, 5, 1: one way to choose none of five, five ways to choose one, ten ways to choose two, and so on. The row is symmetric, because choosing two to include is the same as choosing three to leave out. Each entry is the sum of the two above it, and each row adds up to a power of 2. The derivation explains all three.
  derivation:
    - text: |
        **Arranging everything.** The number of orders of $n$ different things is

        $$n! = n \times (n - 1) \times \cdots \times 2 \times 1,$$

        read "$n$ factorial", by the product rule: $n$ choices for the first place, $n - 1$ for the second, whatever went first, and so on. By convention $0! = 1$, since there is exactly one way to arrange nothing. Factorials grow faster than any power: $10! = 36{,}28{,}800$, and $20! \approx 2.4 \times 10^{18}$. An order of $n$ things is also called a **permutation**, and in the language of [[f2.relations-and-functions-between-sets]] it is a bijection from the set to itself.

        **Arranging some.** The number of ways to choose $k$ of $n$ different things **in order** stops the product after $k$ factors:

        $$n (n - 1) \cdots (n - k + 1) = \frac{n!}{(n - k)!}.$$

        Gold, silver and bronze among 10 runners: $10 \times 9 \times 8 = 720$ podiums. The friend's count of XIs was this with $n = 15$, $k = 11$: an XI picked **in order**.

        **Choosing, with no order.** Now the key step. Let $C(n, k)$, also written $\binom{n}{k}$ and read "$n$ choose $k$", be the number of ways to choose $k$ of $n$ things when order does not matter: the number of $k$-element subsets. Count the ordered choices in two stages. First choose which $k$ things, in $C(n, k)$ ways; then put those $k$ in order, in $k!$ ways, whichever $k$ they were. By the product rule,

        $$\frac{n!}{(n - k)!} = C(n, k) \cdot k!, \qquad \text{so} \qquad C(n, k) = \frac{n!}{k!\,(n - k)!}.$$

        Put another way, call two ordered choices equivalent when they contain the same things. That is an equivalence relation, in the sense of [[f2.equivalence-relations-and-partial-orders]], and every class has exactly $k!$ members, the orders of one subset. The number of classes is the total divided by the size of a class. This **division rule** works only because the classes are all the same size.

        For the squad, $C(15, 11) = \dfrac{15!}{11!\,4!} = 1{,}365$ XIs. The friend's 5,448 crore was this times $11! = 3{,}99{,}16{,}800$, the number of orders in which any one XI can be picked.
    - question:
        id: derivation-division
        type: choice
        system: s2
        prompt: |
          The count $n!/(n - k)!$ of ordered choices is divided by $k!$ to give $C(n, k)$. Why exactly $k!$?
        options:
          - "Each set of $k$ chosen things appears among the ordered choices once for each of its orders, and $k$ things have $k!$ orders, the same number for every set."
          - "Because there are $k!$ sets of size $k$."
          - "Because the remaining $n - k$ things can be arranged in $k!$ ways."
          - "Dividing by $k!$ is a convention that makes the answer smaller."
        answer: 0
        explanation: |
          The ordered choices fall into groups, one group for each set of $k$ things, and a group holds all the orders of its set. Every group has $k!$ members, so the number of groups, which is the number of sets, is the total divided by $k!$. If the groups had different sizes, dividing would not work, and that is the condition to check whenever you divide to remove overcounting.
    - text: |
        **Symmetry.** $C(n, k) = C(n, n - k)$. The formula shows it, since swapping $k$ and $n - k$ leaves $k!\,(n - k)!$ unchanged. But a counting argument explains it: choosing the $k$ who play is the same as choosing the $n - k$ who sit out, so the two kinds of choice pair off one to one, a bijection. Choosing an XI from 15 is choosing 4 to drop: $C(15, 11) = C(15, 4) = 1{,}365$.

        **Pascal's identity.** For $0 < k < n$,

        $$C(n, k) = C(n - 1, k - 1) + C(n - 1, k).$$

        Fix one particular player, say the captain. Every team of $k$ either includes the captain or does not, never both, so by the sum rule add the two cases. Teams that include the captain need $k - 1$ more from the other $n - 1$: $C(n - 1, k - 1)$. Teams without the captain take all $k$ from the other $n - 1$: $C(n - 1, k)$. This is the rule by which each entry of the triangle in the figure is the sum of the two above it, and it computes $C(n, k)$ with additions alone, which is how [[s3.dynamic-programming]] will compute it, building each row from the last.

        The triangle has an Indian history. Pingala's work on poetic metres, over two thousand years old, counted the patterns of long and short syllables, and the commentator Halayudha in the tenth century described the triangle of these counts as a *meru prastara*, a staircase of Mount Meru, centuries before Pascal.

        **Each row adds to $2^n$.** The entries of row $n$ count the subsets of an $n$-set of each size, 0 to $n$, so together they count all subsets, which by the product rule number $2^n$:

        $$\sum_{k = 0}^{n} C(n, k) = 2^n.$$

        **The binomial theorem.** Multiply out $(x + y)^n$, a product of $n$ brackets. Each term of the result picks $x$ from some brackets and $y$ from the rest, and the terms with $x^k y^{n - k}$ come from choosing which $k$ brackets supply the $x$: $C(n, k)$ of them. So

        $$(x + y)^n = \sum_{k = 0}^{n} C(n, k)\, x^k y^{n - k},$$

        which is why $C(n, k)$ is also called a **binomial coefficient**. Setting $x = y = 1$ gives the row sum again. The same coefficients will count the heads in $n$ coin tosses in [[f4.common-discrete-distributions]].
    - question:
        id: order-pascal
        type: order
        system: s2
        prompt: |
          Put the steps of the counting proof that $C(n, k) = C(n - 1, k - 1) + C(n - 1, k)$ in order.
        steps:
          - "Fix one particular item among the $n$."
          - "Every set of $k$ items either contains that item or does not, and no set does both."
          - "Sets that contain it are completed by $k - 1$ items chosen from the other $n - 1$: there are $C(n - 1, k - 1)$ of them."
          - "Sets that do not contain it take all $k$ items from the other $n - 1$: there are $C(n - 1, k)$ of them."
          - "By the sum rule, the total $C(n, k)$ is the sum of the two counts."
        explanation: The proof counts one set, the $k$-element subsets, in two ways. The second step is what licenses adding, since the sum rule needs cases that do not overlap and together cover everything. Many identities about binomial coefficients have proofs of this shape, which explain why they hold rather than only checking the algebra.
    - text: |
        **Repeated letters.** How many different strings can be made by rearranging the letters of MALAYALAM? If the nine letters were all different, $9!$. But the 4 A's are interchangeable, and so are the 2 M's and the 2 L's. Every distinct string arises from $4!\,2!\,2!$ arrangements of labelled letters, since that many ways of shuffling the A's among themselves, the M's and the L's leave it unchanged. Divide:

        $$\frac{9!}{4!\,2!\,2!\,1!} = 3{,}780.$$

        **Sharing identical things.** Ten identical laddoos are shared among 4 children, and a child may get none. Lay the 10 laddoos in a row and place 3 dividers among them; the laddoos before the first divider go to the first child, those between the first and second to the second, and so on. Every share corresponds to exactly one row of 10 laddoos and 3 dividers, and such a row is fixed by choosing which 3 of the 13 positions hold dividers: $C(13, 3) = 286$ shares. In general, $k$ identical things among $n$ people can be shared in $C(k + n - 1, n - 1)$ ways. This is often called **stars and bars**.

        **Paths in a grid.** A delivery rider goes from one corner of a grid of streets to the opposite one, always east or north, 3 blocks east and 2 north. Every route is a string of 5 moves with exactly 2 N's, so there are $C(5, 2) = 10$ routes. Counting strings with a fixed number of each symbol is choosing their positions.

        **Computing.** Python has these counts built in: `math.factorial(n)`, `math.perm(n, k)` and `math.comb(n, k)`, all exact whole numbers however large. `itertools.permutations(xs, k)` and `itertools.combinations(xs, k)` list the arrangements and the selections, in order:

        ```python
        import itertools
        import math

        print(len(list(itertools.permutations("ABCD", 2))), math.perm(4, 2))
        print(len(list(itertools.combinations("ABCD", 2))), math.comb(4, 2))
        ```

        This shows `12 12` and then `6 6`. To compute $C(n, k)$ yourself, multiply up rather than computing three huge factorials and dividing. After step $i$ the running value is $C(n, i)$, and the next is

        $$C(n, i + 1) = C(n, i) \cdot \frac{n - i}{i + 1},$$

        which is always a whole number. Multiply first and then divide, using whole-number division, and every intermediate value is exact. Dividing first would throw away remainders that the multiplication needed.

        **Why sorting cannot be too fast.** A list of $n$ different items is in one of $n!$ orders, and a sorting method must tell them all apart. Each comparison has two outcomes, so $c$ comparisons tell at most $2^c$ orders apart, and sorting needs $2^c \ge n!$, that is $c \ge \log_2 n!$. That lower bound, about $n \log_2 n$, is proved in [[s3.sorting]].
  formal:
    - text: |
        **Factorial.** $n! = n (n - 1) \cdots 1$, with $0! = 1$: the number of orders of $n$ different things.

        **Arrangements.** The number of ordered choices of $k$ from $n$ different things is $n!/(n - k)!$.

        **Combinations.** The number of $k$-element subsets of an $n$-set is $C(n, k) = \dfrac{n!}{k!\,(n - k)!}$, obtained by dividing ordered choices by the $k!$ orders of each subset.

        **Identities.** $C(n, k) = C(n, n - k)$; $C(n, k) = C(n - 1, k - 1) + C(n - 1, k)$ for $0 < k < n$; $\sum_{k} C(n, k) = 2^n$; $(x + y)^n = \sum_k C(n, k) x^k y^{n - k}$.

        **Repeated items.** $n$ items with $n_1, n_2, \dots$ copies of each kind have $\dfrac{n!}{n_1!\,n_2! \cdots}$ distinct orders. $k$ identical items among $n$ people: $C(k + n - 1, n - 1)$ ways.
  drill:
    - text: Seconds each. Does order matter? Then divide or do not.
    - question:
        id: drill-five-factorial
        type: numeric
        system: s1
        prompt: |
          In how many orders can 5 different books stand on a shelf?
        answer: "120"
        explanation: $5! = 5 \times 4 \times 3 \times 2 \times 1 = 120$.
    - question:
        id: drill-zero-factorial
        type: numeric
        system: s1
        prompt: |
          What is $0!$?
        answer: "1"
        explanation: There is exactly one way to arrange nothing, and $0! = 1$ makes $n!/(n - k)!$ right when $k = n$.
    - question:
        id: drill-podium
        type: numeric
        system: s1
        prompt: |
          Ten runners race. In how many ways can gold, silver and bronze be awarded?
        answer: "720"
        explanation: 'Order matters: $10 \times 9 \times 8$.'
    - question:
        id: drill-handshakes
        type: numeric
        system: s1
        prompt: |
          Five people each shake hands with each of the others once. How many handshakes?
        answer: "10"
        explanation: $C(5, 2) = 5 \times 4 / 2 = 10$. Each handshake is an unordered pair.
    - question:
        id: drill-symmetry
        type: numeric
        system: s1
        prompt: |
          What is $C(10, 8)$?
        answer: "45"
        explanation: Choosing 8 to include is choosing 2 to leave out, $C(10, 2) = 10 \times 9 / 2 = 45$.
    - question:
        id: drill-row-sum
        type: numeric
        system: s1
        prompt: |
          What do the entries of row 6 of Pascal's triangle add up to?
        answer: "64"
        explanation: They count all the subsets of a 6-element set, $2^6$.
    - question:
        id: drill-order-matters
        type: choice
        system: s1
        prompt: |
          Which of these counts needs $C(n, k)$ rather than $n!/(n - k)!$?
        options: ["Choosing 3 members of a committee from 12 people", "Choosing a president, a secretary and a treasurer from 12 people", "Setting a 3-digit code with different digits", "Seating 3 of 12 guests in the front row, left to right"]
        answer: 0
        explanation: Committee members have no roles and no order. The other three assign distinct positions, so order matters.
    - question:
        id: predict-itertools
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import itertools

          pairs = list(itertools.combinations("PQRS", 2))
          orders = list(itertools.permutations("PQRS", 2))
          print(len(pairs), len(orders), pairs[0], orders[1])
        output: "6 12 ('P', 'Q') ('P', 'R')"
        explanation: There are $C(4, 2) = 6$ pairs and $4 \times 3 = 12$ ordered pairs, each pair appearing twice among the orders. Both lists come out in dictionary order of positions, so the first pair is P, Q and the second ordered pair is P, R.
    - question:
        id: predict-comb
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import math

          row = [math.comb(4, k) for k in range(5)]
          print(row, sum(row), math.comb(4, 1) + math.comb(4, 2) == math.comb(5, 2))
        output: "[1, 4, 6, 4, 1] 16 True"
        explanation: Row 4 of Pascal's triangle adds to $2^4 = 16$, and Pascal's identity gives $C(5, 2) = C(4, 1) + C(4, 2) = 4 + 6 = 10$.
  work:
    - text: Slower now. For every count, decide whether order matters, and if you divide, say why every group is the same size.
    - question:
        id: fix-choose
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `choose(n, k)` computes $C(n, k)$ by multiplying up, without factorials. It should print `1365 10`. It prints `1240 8`. Find the fault and fix it, keeping every value a whole number.
        starter: |
          def choose(n, k):
              value = 1
              for i in range(k):
                  value = value // (i + 1) * (n - i)
              return value

          print(choose(15, 11), choose(5, 2))
        solution: |
          def choose(n, k):
              value = 1
              for i in range(k):
                  value = value * (n - i) // (i + 1)
              return value

          print(choose(15, 11), choose(5, 2))
        tests: |
          import math as _m
          assert "comb" not in source and "factorial" not in source, "Multiply up step by step; do not use math.comb or factorials"
          for _n in range(0, 40):
              for _k in range(0, _n + 1):
                  _got = choose(_n, _k)
                  assert _got == _m.comb(_n, _k) and isinstance(_got, int), "choose(" + str(_n) + ", " + str(_k) + ") should be the whole number " + str(_m.comb(_n, _k)) + ", not " + repr(_got)
          assert choose(200, 100) == _m.comb(200, 100), "choose(200, 100) must be exact"
          assert output.strip() == "1365 10", "The program should print 1365 10"
        wrong:
          - |
            def choose(n, k):
                value = 1
                for i in range(k):
                    value = value * (n - i) / (i + 1)
                return value

            print(1365, 10)
          - |
            def choose(n, k):
                value = 1
                for i in range(k):
                    value = value * (n - i) // (i + 2)
                return value

            print(1365, 10)
        explanation: |
          After step $i$ the value is $C(n, i + 1)$, and $C(n, i) \cdot (n - i)$ is always divisible by $i + 1$, because the quotient is a count of subsets. But $C(n, i)$ alone need not be divisible by $i + 1$: $C(5, 1) = 5$ is not divisible by 2, so dividing first gave $5 // 2 = 2$ and lost the remainder. Multiply first, then divide. Using `/` instead gives a float, and floats cannot hold $C(200, 100)$, a 59-digit number, exactly.
    - question:
        id: write-pascal-row
        type: code
        mode: write
        system: s2
        prompt: |
          Write `pascal_row(n)`, which returns row `n` of Pascal's triangle as a list, `[C(n, 0), ..., C(n, n)]`. Build each row from the one before using Pascal's identity, additions only: no multiplication of large numbers, no factorials and no `math.comb`.
        starter: |
          def pascal_row(n):
              return [1]

          print(pascal_row(4), pascal_row(0))
          print(sum(pascal_row(20)), max(pascal_row(10)))
        solution: |
          def pascal_row(n):
              row = [1]
              for _ in range(n):
                  row = [1] + [row[j - 1] + row[j] for j in range(1, len(row))] + [1]
              return row

          print(pascal_row(4), pascal_row(0))
          print(sum(pascal_row(20)), max(pascal_row(10)))
        tests: |
          import math as _m
          assert "comb" not in source and "factorial" not in source, "Use additions only, not math.comb or factorials"
          for _n in range(0, 70):
              _want = [_m.comb(_n, _k) for _k in range(_n + 1)]
              _got = pascal_row(_n)
              assert _got == _want, "Row " + str(_n) + " should begin " + str(_want[:5]) + ", not " + str(_got[:5])
          assert output.strip() == "[1, 4, 6, 4, 1] [1]\n1048576 252", "The program should print [1, 4, 6, 4, 1] [1], then 1048576 252"
        wrong:
          - |
            def pascal_row(n):
                row = [1]
                for _ in range(n):
                    row = [row[j - 1] + row[j] for j in range(1, len(row))] + [1]
                return row

            print([1, 4, 6, 4, 1], [1])
            print(1048576, 252)
          - |
            def pascal_row(n):
                row = [1]
                for _ in range(n - 1):
                    row = [1] + [row[j - 1] + row[j] for j in range(1, len(row))] + [1]
                return row

            print([1, 4, 6, 4, 1], [1])
            print(1048576, 252)
        explanation: |
          Each inner entry of the new row is the sum of the two entries above it, $C(n, k) = C(n - 1, k - 1) + C(n - 1, k)$, and the two ends are always 1, since there is one way to choose nothing and one way to choose everything. Row 0 is `[1]`, and each pass of the loop makes the next row, so $n$ passes give row $n$. The row for 20 adds to $2^{20} = 10{,}48{,}576$, and the middle of row 10 is $C(10, 5) = 252$.
    - question:
        id: write-teams
        type: code
        mode: write
        system: s2
        prompt: |
          A coach must pick a team of `size` from `players`, and the team must include at least one of `keepers`, the wicket-keepers among the players. Write `teams(players, keepers, size)`, which returns how many such teams there are. Count; do not list. Use `math.comb`.
        starter: |
          import math

          def teams(players, keepers, size):
              return 0

          print(teams(15, 2, 11), teams(4, 1, 2), teams(5, 0, 2))
        solution: |
          import math

          def teams(players, keepers, size):
              return math.comb(players, size) - math.comb(players - keepers, size)

          print(teams(15, 2, 11), teams(4, 1, 2), teams(5, 0, 2))
        tests: |
          import itertools
          for _p in range(0, 9):
              for _kp in range(0, _p + 1):
                  for _s in range(0, _p + 1):
                      _want = sum(1 for _t in itertools.combinations(range(_p), _s) if any(_x < _kp for _x in _t))
                      _got = teams(_p, _kp, _s)
                      assert _got == _want, "teams(" + str(_p) + ", " + str(_kp) + ", " + str(_s) + ") should be " + str(_want) + ", not " + str(_got)
          assert teams(60, 5, 11) == math.comb(60, 11) - math.comb(55, 11), "teams(60, 5, 11) is wrong"
          assert output.strip() == "1287 3 0", "The program should print 1287 3 0"
        wrong:
          - |
            import math

            def teams(players, keepers, size):
                return keepers * math.comb(players - 1, size - 1)

            print(1287, 3, 0)
          - |
            import math

            def teams(players, keepers, size):
                return math.comb(players, size) - math.comb(players - keepers, size - 1)

            print(1287, 3, 0)
        explanation: |
          "At least one keeper" has overlapping cases, one keeper or two, so count the complement: all teams, $C(15, 11) = 1{,}365$, less the teams with no keeper, chosen from the 13 others, $C(13, 11) = 78$. That leaves $1{,}287$. Choosing a keeper first and then the other 10 from the remaining 14 counts a team with both keepers twice, once for each keeper chosen first, so it gives $2 \times 1{,}001 = 2{,}002$, more than all the teams there are.
    - question:
        id: work-xi
        type: numeric
        system: s2
        prompt: |
          A squad has 15 players, of whom 6 are bowlers. The XI must contain exactly 4 bowlers. How many XIs are there?
        answer: "540"
        explanation: |
          Two stages: choose the 4 bowlers from 6, $C(6, 4) = 15$, then the other 7 from the 9 non-bowlers, $C(9, 7) = 36$. The number of non-bowlers chosen does not depend on which bowlers were chosen, so multiply: $15 \times 36 = 540$.
    - question:
        id: work-kannada
        type: numeric
        system: s2
        prompt: |
          How many different strings can be made by rearranging all the letters of KANNADA?
        answer: "420"
        explanation: |
          Seven letters, with A three times and N twice: $\dfrac{7!}{3!\,2!} = \dfrac{5040}{12} = 420$. Each distinct string arises from the $3!$ orders of its A's times the $2!$ orders of its N's, if the copies were labelled.
    - question:
        id: work-laddoos
        type: numeric
        system: s2
        prompt: |
          Ten identical laddoos are shared among 4 children, and each child must get **at least one**. In how many ways?
        answer: "84"
        explanation: |
          Give each child one laddoo first, which can be done in one way. That leaves 6 identical laddoos for 4 children with no minimum, which stars and bars counts as $C(6 + 4 - 1, 3) = C(9, 3) = 84$. Removing the condition by handing out the minimum first turns the problem into one you can already count.
    - question:
        id: work-routes
        type: numeric
        system: s2
        prompt: |
          A rider crosses a grid of streets from one corner to the opposite one, 4 blocks east and 4 blocks north, always moving east or north. How many routes are there?
        answer: "70"
        explanation: |
          A route is a string of 8 moves with 4 of them north, fixed by choosing the positions of the north moves: $C(8, 4) = 70$.
  connections:
    - text: |
        The puzzle asked what the friend's product of 5,448 crore XIs overcounted. Picking players one at a time produces each XI in an order, and every XI came out once for each of its $11!$ orders. Dividing removes the overcount and leaves $C(15, 11) = 1{,}365$. That is the method of the lesson: count in an order, where the product rule applies, then divide by the number of times each unordered result was counted, which must be the same for every result. Arrangements with repeated letters and shares of identical laddoos yield to the same idea or to a clever bijection, and Pascal's identity and the symmetry $C(n, k) = C(n, n - k)$ come from counting one set in two ways.

        Binomial coefficients are everywhere from here on. They give the probabilities of $k$ heads in $n$ tosses in [[f4.common-discrete-distributions]], the number of comparisons a sort needs in [[s3.sorting]], and a first example of filling a table from smaller answers in [[s3.dynamic-programming]].

        Counting can also prove that something **must** happen, without finding it. If 13 people are in a room, two of them were born in the same month, because there are only 12 months. That simple argument, and the surprising things it proves, is next: [[f3.the-pigeonhole-principle]].
