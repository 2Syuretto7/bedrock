            def prufer(n, edges):
                neighbours = {v: set() for v in range(1, n + 1)}
                for u, v in edges:
                    neighbours[u].add(v)
                    neighbours[v].add(u)
                code = []
                leaves = sorted(v for v in neighbours if len(neighbours[v]) == 1)
                for leaf in leaves:
                    if len(code) < n - 2:
                        code.append(neighbours[leaf].pop())
                return code

            print([4, 4, 4, 5, 6, 6])
            print([8, 8, 8, 8, 8, 8], [])
        explanation: |
          The code records neighbours, not leaves: the leaves are what the decoder works out for itself, as the smallest numbers not yet accounted for, so recording them throws away the information. Always taking the smallest leaf is what makes the code unique and reversible; the largest would also give a code, but a different one from the standard. And the leaves must be found afresh after each removal, because removing a leaf can turn its neighbour into a new leaf, as vertex 4 became after 1, 2 and 3 were gone. Each step scans all the vertices, so this simple version takes $\Theta(n^2)$ time.
    - question:
        id: work-cayley
        type: numeric
        system: s2
        prompt: |
          How many different trees are there on 6 labelled vertices?
        answer: "1296"
        explanation: |
          By Cayley's formula, $6^{6 - 2} = 6^4 = 1{,}296$, one for each Prüfer code of length 4 with entries from 1 to 6.
    - question:
        id: work-min-height
        type: numeric
        system: s2
        prompt: |
          What is the smallest possible height of a binary tree with 1,000 vertices, with the root at depth 0?
        answer: "9"
        explanation: |
          A binary tree of height $h$ holds at most $2^{h + 1} - 1$ vertices. Height 8 holds at most 511, too few; height 9 holds up to 1,023. So the height is at least 9, and a tree filled level by level achieves it.
    - question:
        id: work-leaves
        type: numeric
        system: s2
        prompt: |
          A tree has 4 vertices of degree 3, 2 vertices of degree 2, and every other vertex is a leaf. How many leaves does it have?
        answer: "6"
        explanation: |
          With $\ell$ leaves there are $6 + \ell$ vertices and so $5 + \ell$ edges. By the handshake lemma, the degrees add up to twice that: $4 \cdot 3 + 2 \cdot 2 + \ell = 2(5 + \ell)$, so $16 + \ell = 10 + 2\ell$ and $\ell = 6$.
  connections:
    - text: |
        The tournament needs 36 matches, because every match sends one team home; the villages need 11 lines, because a connected network with no spare line is a tree, and a tree on 12 vertices has 11 edges; and there are $12^{10}$, about 62 billion, such networks, one for each Prüfer code.

        A tree is connected with no cycles, and that one definition has many faces: $n - 1$ edges, a unique path between any two vertices, every edge a bridge, at least two leaves. Leaves make induction on trees easy. Every connected graph contains a spanning tree, found edge by edge with union-find. Binary trees of height $h$ hold at most $2^{h + 1} - 1$ vertices, so their height is at least logarithmic in their size, and full binary trees have one more leaf than internal vertex.

        This closes discrete mathematics. You can now count outcomes, arrangements, overlaps, remainders, steps and structures. Counting leads directly to chance. If a network of lines were chosen at random from those 62 billion, how likely is it to be a single path? If 23 people are in a room, how likely is it that two share a birthday? Each is a count of favourable outcomes against a count of all outcomes, and making that precise, for situations where outcomes are not all equally likely too, starts with [[f4.sample-spaces-and-events]].
