concept: f3.the-pigeonhole-principle
minutes: 85
claim: You can prove that when more than k times as many items are placed in k boxes some box holds more than k, choose the items and the boxes that make a problem yield to this argument, use it to show that collisions are unavoidable in hashing and that no compressor can shorten every file, and turn the existence proof about remainders into a program that finds what it promises.
recalls: [f3.permutations-and-combinations]
uses: [f3.counting-with-products-and-sums, f2.contrapositive-and-contradiction, f2.relations-and-functions-between-sets, f2.direct-proof, s2.hash-tables, s0.dictionaries-and-sets, s0.loops, s0.functions]
leads: [f3.inclusion-and-exclusion, f3.modular-arithmetic, f3.graph-theory-basics, f4.the-birthday-problem-and-collisions]
starter: |
  # Scratch space. 13 people, 12 months of birth.
  # Try to give everyone a different month. What goes wrong?
  months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
  people = 13
  taken = {}
  for person in range(people):
      month = months[person % 12]
      if month in taken:
          print("person", person, "shares", month, "with person", taken[month])
      taken[month] = person
parts:
  recall:
    - text: |
        [[f3.permutations-and-combinations]] counted exactly how many arrangements and selections there are. Today counting proves that something must happen, without saying where. Three quick pulls first.
  puzzle:
    - text: |
        A message service stores files by their hash, a 256-bit fingerprint, and promises that two different files never get the same fingerprint. A compression tool promises to make **every** file smaller, at least by a byte. A teacher with any 6 numbers chosen from 1 to 10 claims that two of them will always add up to 11.

        Two of these claims are impossible and one is a certainty, and a single idea settles all three. It also settles odder questions. Are there two people in Mumbai with exactly the same number of hairs on their heads? Given any five whole numbers, must some run of them in a row add up to a multiple of 5?

        Nobody can check such claims by trying every case: there are too many files, too many people, too many lists of numbers. **How can a count prove that something must exist, or cannot, without finding it?**
  intuition:
    - text: |
        A post office has 12 pigeonholes for letters, and 13 letters arrive. However the clerk sorts them, some pigeonhole ends up with at least two letters. If every pigeonhole held at most one, the pigeonholes together would hold at most 12 letters, and there are 13.

        That is the whole of the **pigeonhole principle**, and it is almost too obvious to say. Its power lies in what you choose to call the letters and the pigeonholes. Thirteen people and twelve months: two people share a birth month. Three socks drawn in the dark from a drawer of black and white ones: two are the same colour, since there are only two colours. The trick in every application is to spot the boxes.

        It has a stronger form. Put 25 letters in 12 pigeonholes, and spreading them as evenly as possible gives some pigeonholes 3 letters, since $12 \times 2 = 24$ is not enough. Any other arrangement is less even, and only makes the fullest box fuller.

        The figure drops items into boxes. Spread them evenly, then drop them at random again and again, and see whether the fullest box ever holds fewer than the items divided by the boxes, rounded up.
    - figure: pigeonholes
      props: { items: 13, boxes: 12 }
    - text: |
        Thirteen items in twelve boxes always leave some box with two, whether they are spread evenly or dropped at random. Random dropping usually does far worse than the guarantee, with three or four in one box. The principle gives the least that can happen, which is exactly what a proof that something **must** happen needs.
  derivation:
    - text: |
        **The pigeonhole principle.** If more than $k$ items are placed in $k$ boxes, some box holds at least two items.

        *Proof*, by contradiction, as in [[f2.contrapositive-and-contradiction]]. Suppose every box holds at most one item. Then the boxes hold at most $k \times 1 = k$ items in all, but there are more than $k$. That is impossible, so some box holds at least two.

        **The general form.** If $N$ items are placed in $k$ boxes, some box holds at least $\lceil N / k \rceil$ items, where $\lceil x \rceil$, the **ceiling** of $x$, is the least whole number at least $x$.

        *Proof.* Suppose every box holds at most $\lceil N / k \rceil - 1$ items. Since $\lceil N / k \rceil < N / k + 1$, each box holds fewer than $N / k$, so the $k$ boxes together hold fewer than $k \cdot N / k = N$ items. That contradicts there being $N$. So some box holds at least $\lceil N / k \rceil$.

        The bound is the best possible: dealing the items round the boxes like cards puts $\lceil N / k \rceil$ in the fullest box and no more. In Python, $\lceil N / k \rceil$ for whole numbers is `(N + k - 1) // k`, or `-(-N // k)`.

        **As a statement about functions.** Placing items in boxes is a function from items to boxes, in the sense of [[f2.relations-and-functions-between-sets]], and "two items share a box" says the function is not injective. So the principle says: **there is no injective function from a finite set to a smaller one.** Read this way it explains some hard limits.

        - **Hashing.** A hash function maps the endless supply of possible keys to a fixed number of buckets, or a 256-bit fingerprint to $2^{256}$ values. There are more possible inputs than outputs, so some two different inputs share an output. Collisions cannot be designed away, as [[s2.hash-tables]] assumed; they can only be made rare and handled. How soon they become likely is a question for [[f4.the-birthday-problem-and-collisions]].
        - **Compression.** There are $2^n$ files of exactly $n$ bits, but only $2^0 + 2^1 + \cdots + 2^{n - 1} = 2^n - 1$ files shorter than $n$ bits. A compressor must be injective, or two files would compress to the same thing and could not both be recovered. So it cannot map all $2^n$ files of $n$ bits to shorter ones. Every compressor makes some files no smaller, and in practice it makes most random files slightly larger.
    - question:
        id: derivation-general
        type: choice
        system: s2
        prompt: |
          In the proof of the general form, why does every box holding at most $\lceil N / k \rceil - 1$ items lead to a contradiction?
        options:
          - "Because $\\lceil N / k \\rceil - 1 < N / k$, so the $k$ boxes would together hold fewer than $N$ items."
          - "Because $\\lceil N / k \\rceil - 1$ is always negative."
          - "Because some box must be empty."
          - "Because $N / k$ is always a whole number."
        answer: 0
        explanation: |
          The ceiling of $N / k$ is less than $N / k + 1$, so one less than it is less than $N / k$. If every box held fewer than $N / k$ items, all $k$ boxes would hold fewer than $N$ between them, but all $N$ items are somewhere. The contradiction shows the assumption was false.
    - text: |
        **Choosing the boxes.** Most of the skill is in seeing what the boxes are.

        *Two numbers adding to 11.* Pick any 6 numbers from 1 to 10. Make 5 boxes, the pairs $\{1, 10\}$, $\{2, 9\}$, $\{3, 8\}$, $\{4, 7\}$, $\{5, 6\}$, each adding to 11. Every number from 1 to 10 is in exactly one box. Six numbers in five boxes: two land in the same box, and they add to 11. Five numbers are not enough, as 1, 2, 3, 4, 5 shows.

        *Hairs in Mumbai.* Nobody has more than about two lakh hairs on their head, and Mumbai has well over a crore of people. Make one box for each possible count, 0 to 2,00,000. That is 2,00,001 boxes for more than 1,20,00,000 people, so some box holds at least $\lceil 1{,}20{,}00{,}000 / 2{,}00{,}001 \rceil = 60$ people with exactly the same number of hairs. Nobody needs to count anyone's hair.

        *Friends at a party.* In any group of $n \ge 2$ people, two have the same number of friends within the group. Each person's count is one of $0, 1, \dots, n - 1$, which is $n$ boxes for $n$ people, not enough on its own. But the boxes 0 and $n - 1$ cannot both be used: someone with $n - 1$ friends is friends with everyone, so nobody has 0. So at most $n - 1$ boxes are used, by $n$ people. This is a fact about graphs, which you will meet again in [[f3.graph-theory-basics]].

        **Remainders.** Every whole number leaves one of the $n$ remainders $0, 1, \dots, n - 1$ when divided by $n$. So among any $n + 1$ whole numbers, two have the same remainder, and their difference is a multiple of $n$. This pairing of numbers by remainder is the start of [[f3.modular-arithmetic]].

        **A run that adds to a multiple of $n$.** Here is a less obvious consequence. Given any $n$ whole numbers in a row, $a_1, \dots, a_n$, some run of consecutive ones, $a_{i+1} + \cdots + a_j$, adds up to a multiple of $n$.

        Look at the running totals, $s_0 = 0$, $s_1 = a_1$, $s_2 = a_1 + a_2$, up to $s_n$. That is $n + 1$ totals, and only $n$ remainders modulo $n$, so two of them, $s_i$ and $s_j$ with $i < j$, have the same remainder. Their difference $s_j - s_i = a_{i+1} + \cdots + a_j$ is then a multiple of $n$.

        This proof is constructive in a useful way: it says exactly where to look. Walk along the list keeping the running total's remainder, and record in a dictionary the first place each remainder appeared. The first remainder seen twice gives the run. One pass, with a constant number of steps for each number.
    - question:
        id: order-run
        type: order
        system: s2
        prompt: |
          Put the steps of the proof that any $n$ whole numbers in a row contain a run adding to a multiple of $n$ in order.
        steps:
          - "Form the $n + 1$ running totals $s_0 = 0, s_1, \\dots, s_n$."
          - "Each running total leaves one of only $n$ remainders when divided by $n$."
          - "By the pigeonhole principle, two running totals $s_i$ and $s_j$ with $i < j$ leave the same remainder."
          - "Their difference $s_j - s_i$, which is the sum $a_{i+1} + \\dots + a_j$, leaves remainder 0: it is a multiple of $n$."
        explanation: The items are the running totals and the boxes are the remainders. Including $s_0 = 0$ is what makes $n + 1$ items for $n$ boxes; without it there would be only $n$ totals, and the argument would fail. The run found is non-empty because $i < j$.
    - text: |
        **Existence is not location.** The pigeonhole principle proves that a shared box exists, and usually says nothing about which box. For the hairs of Mumbai that is fine. For a hash function it is the whole point: collisions exist, yet finding one for a good 256-bit hash is so hard that nobody ever has. "It exists" and "it can be found quickly" are different claims, and much of cryptography lives in the gap between them. In the run problem the proof happened to come with a fast search; often none is known.
  formal:
    - text: |
        **Pigeonhole principle.** If $N > k$ items are placed in $k$ boxes, some box holds at least 2.

        **General form.** If $N$ items are placed in $k$ boxes, some box holds at least $\lceil N / k \rceil$, and an even spread shows this is best possible.

        **As functions.** No function from a finite set $A$ to a finite set $B$ with $\lvert A \rvert > \lvert B \rvert$ is injective.

        **Consequences.** Any $n + 1$ integers include two with the same remainder modulo $n$. Any $n$ integers in a row contain a non-empty run whose sum is a multiple of $n$. Every hash function from a larger set of inputs to a smaller set of outputs has collisions, and no lossless compressor shortens every file.
  drill:
    - text: Seconds each. Name the items, name the boxes, then divide and round up.
    - question:
        id: drill-socks
        type: numeric
        system: s1
        prompt: |
          A drawer holds black socks and white socks, mixed. How many must you take out in the dark to be sure of two the same colour?
        answer: "3"
        explanation: Two colours are two boxes, so three socks force two into one box.
    - question:
        id: drill-months
        type: numeric
        system: s1
        prompt: |
          What is the fewest people that guarantees two share a birth month?
        answer: "13"
        explanation: Twelve months are twelve boxes; 12 people could all differ.
    - question:
        id: drill-ceiling
        type: numeric
        system: s1
        prompt: |
          100 letters go into 7 pigeonholes. At least how many letters must the fullest pigeonhole hold?
        answer: "15"
        explanation: $\lceil 100 / 7 \rceil = \lceil 14.28\ldots \rceil = 15$, since $7 \times 14 = 98$ is not enough.
    - question:
        id: drill-birthdays
        type: numeric
        system: s1
        prompt: |
          What is the fewest people that **guarantees** two share a birthday, counting 29 February?
        answer: "367"
        explanation: There are 366 possible birthdays. In practice a shared birthday becomes likely with far fewer people, a question of probability, not of certainty.
    - question:
        id: drill-remainders
        type: numeric
        system: s1
        prompt: |
          How many whole numbers must you pick to be sure two of them leave the same remainder when divided by 5?
        answer: "6"
        explanation: There are 5 possible remainders, 0 to 4.
    - question:
        id: drill-injective
        type: choice
        system: s1
        prompt: |
          A function maps a set of 10 elements to a set of 9 elements. What must be true?
        options: ["Two elements map to the same element", "Some element of the 9 is not hit", "The function is injective", "The function cannot exist"]
        answer: 0
        explanation: Ten items in nine boxes. Nothing forces an element of the 9 to be missed; all 9 can be hit.
    - question:
        id: predict-spread
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          counts = [0] * 4
          for item in range(10):
              counts[item % 4] += 1
          print(counts, max(counts))
        output: "[3, 3, 2, 2] 3"
        explanation: Dealing 10 items round 4 boxes gives 3, 3, 2 and 2. The fullest holds $\lceil 10 / 4 \rceil = 3$, and no placement can do better.
    - question:
        id: predict-run
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          nums = [3, 4, 1, 5, 2]
          total = 0
          first = {0: 0}
          for i in range(len(nums)):
              total = (total + nums[i]) % 5
              if total in first:
                  print(first[total], i + 1)
                  break
              first[total] = i + 1
        output: "1 3"
        explanation: The running remainders are 0, then 3, 2, 3. The remainder 3 first appeared after 1 number and appears again after 3, so the run `nums[1:3]`, 4 and 1, adds to 5.
  work:
    - text: Slower now. For every claim, write down the items and the boxes before you count anything.
    - question:
        id: fix-guarantee
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `guaranteed(items, boxes)` should return the number that the fullest box is sure to hold, however the items are placed. It should print `2 15 1`. It prints `1 14 1`. Find the fault and fix it.
        starter: |
          def guaranteed(items, boxes):
              return items // boxes

          print(guaranteed(13, 12), guaranteed(100, 7), guaranteed(5, 5))
        solution: |
          def guaranteed(items, boxes):
              return (items + boxes - 1) // boxes

          print(guaranteed(13, 12), guaranteed(100, 7), guaranteed(5, 5))
        tests: |
          import itertools
          for _n in range(1, 8):
              for _k in range(1, 5):
                  _least = min(max(_p.count(_b) for _b in range(_k)) for _p in itertools.product(range(_k), repeat=_n))
                  _got = guaranteed(_n, _k)
                  assert _got == _least, "With " + str(_n) + " items in " + str(_k) + " boxes the fullest box always holds at least " + str(_least) + ", not " + str(_got)
          assert guaranteed(10 ** 20 + 1, 10 ** 10) == 10 ** 10 + 1, "Use whole-number arithmetic so that very large counts are exact"
          assert output.strip() == "2 15 1", "The program should print 2 15 1"
        wrong:
          - |
            def guaranteed(items, boxes):
                return items // boxes + 1

            print(2, 15, 1)
          - |
            import math

            def guaranteed(items, boxes):
                return math.ceil(items / boxes)

            print(2, 15, 1)
        explanation: |
          `//` rounds down, but the guarantee is $N / k$ rounded **up**: 13 letters in 12 pigeonholes is $1.08\ldots$, and some pigeonhole has 2. Adding $k - 1$ before dividing rounds up exactly. Adding 1 after rounding down is wrong when $k$ divides $N$: 5 items in 5 boxes can sit one to a box. And `math.ceil(items / boxes)` divides in floating point, which cannot represent $10^{20} + 1$ exactly and so gets the answer wrong for very large counts.
    - question:
        id: write-same-remainder
        type: code
        mode: write
        system: s2
        prompt: |
          Write `same_remainder(nums, n)`. `nums` holds at least `n + 1` whole numbers, so by the pigeonhole principle two of them leave the same remainder when divided by `n`. Return the positions `(i, j)`, with `i < j`, of the first such pair to complete: the smallest possible `j`, and for that `j` the `i` where the remainder first appeared. Make one pass with a dictionary.
        starter: |
          def same_remainder(nums, n):
              return None

          print(same_remainder([11, 2, 7, 16, 9, 3], 5))
          print(same_remainder([3, 10, 4], 2))
        solution: |
          def same_remainder(nums, n):
              first = {}
              for j in range(len(nums)):
                  r = nums[j] % n
                  if r in first:
                      return (first[r], j)
                  first[r] = j
              return None

          print(same_remainder([11, 2, 7, 16, 9, 3], 5))
          print(same_remainder([3, 10, 4], 2))
        tests: |
          import random
          random.seed(67)
          for _trial in range(300):
              _n = random.randint(1, 12)
              _nums = [random.randint(-50, 200) for _ in range(random.randint(_n + 1, _n + 6))]
              _want = None
              for _j in range(len(_nums)):
                  for _i in range(_j):
                      if _nums[_i] % _n == _nums[_j] % _n:
                          _want = (_i, _j)
                          break
                  if _want is not None:
                      break
              _got = same_remainder(_nums, _n)
              assert _got is not None and tuple(_got) == _want, "same_remainder(" + str(_nums) + ", " + str(_n) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "(1, 2)\n(1, 2)", "The program should print (1, 2), then (1, 2)"
        wrong:
          - |
            def same_remainder(nums, n):
                first = {}
                for j in range(len(nums)):
                    r = nums[j] // n
                    if r in first:
                        return (first[r], j)
                    first[r] = j
                return None

            print((1, 2))
            print((1, 2))
          - |
            def same_remainder(nums, n):
                for i in range(len(nums)):
                    for j in range(i + 1, len(nums)):
                        if nums[i] % n == nums[j] % n:
                            return (i, j)
                return None

            print((1, 2))
            print((1, 2))
        explanation: |
          The boxes are the remainders, and the dictionary records which position first used each box. The moment a box is used a second time, the pair is complete: that is the smallest $j$, and the stored position is the $i$. Since there are only $n$ boxes, this happens by position $n$ at the latest. The box is the remainder, `%`, not the quotient, `//`. Checking pairs in the order "each $i$, then every later $j$" finds a pair, but not necessarily the one that completes first: for 11, 2, 7 and 16 modulo 5 it pairs 11 with 16, at positions 0 and 3, although 2 and 7, at positions 1 and 2, completed sooner. It also looks at up to about $n^2 / 2$ pairs where one pass suffices.
    - question:
        id: write-divisible-run
        type: code
        mode: write
        system: s2
        prompt: |
          Write `divisible_run(nums)`. For a list of `n` whole numbers, `n` at least 1, return `(i, j)` with `i < j` such that `sum(nums[i:j])` is a multiple of `n`. The lesson proves such a run always exists. Find one in a single pass with running remainders and a dictionary, as in the proof.
        starter: |
          def divisible_run(nums):
              return (0, 0)

          i, j = divisible_run([3, 4, 1, 5, 2])
          print(i, j, sum([3, 4, 1, 5, 2][i:j]))
        solution: |
          def divisible_run(nums):
              n = len(nums)
              first = {0: 0}
              total = 0
              for j in range(1, n + 1):
                  total = (total + nums[j - 1]) % n
                  if total in first:
                      return (first[total], j)
                  first[total] = j
              return None

          i, j = divisible_run([3, 4, 1, 5, 2])
          print(i, j, sum([3, 4, 1, 5, 2][i:j]))
        tests: |
          import random
          random.seed(71)
          for _trial in range(400):
              _n = random.randint(1, 30)
              _nums = [random.randint(-100, 1000) for _ in range(_n)]
              _got = divisible_run(_nums)
              assert _got is not None, "divisible_run(" + str(_nums) + ") returned None, but a run always exists"
              _i, _j = _got
              assert 0 <= _i < _j <= _n, "The run must be non-empty and inside the list: got " + str(_got) + " for a list of " + str(_n)
              assert sum(_nums[_i:_j]) % _n == 0, "The run " + str(_nums[_i:_j]) + " adds to " + str(sum(_nums[_i:_j])) + ", not a multiple of " + str(_n)
          assert output.strip() == "1 3 5", "The program should print 1 3 5"
        wrong:
          - |
            def divisible_run(nums):
                n = len(nums)
                first = {}
                total = 0
                for j in range(1, n + 1):
                    total = (total + nums[j - 1]) % n
                    if total in first:
                        return (first[total], j)
                    first[total] = j
                return None

            print(1, 3, 5)
          - |
            def divisible_run(nums):
                n = len(nums)
                for i in range(n):
                    if nums[i] % n == 0:
                        return (i, i + 1)
                return (0, n)

            print(1, 3, 5)
        explanation: |
          The dictionary must start with the empty prefix, remainder 0 at position 0. Without it there are only $n$ running totals for $n$ remainders, so the pigeonhole principle promises nothing, and when the run that works starts at the very beginning, as for `[5, 1]`, or when only the whole list works, the search finds nothing. With it there are $n + 1$ totals, two must share a remainder, and the numbers between them form the run. Looking only for single numbers divisible by $n$, or falling back to the whole list, fails whenever neither happens to work.
    - question:
        id: work-hairs
        type: numeric
        system: s2
        prompt: |
          Suppose nobody has more than 2,00,000 hairs on their head, and a city has 1,20,00,000 people. At least how many people in the city must have exactly the same number of hairs?
        answer: "60"
        explanation: |
          The boxes are the possible counts, 0 to 2,00,000, which is 2,00,001 boxes. $1{,}20{,}00{,}000 / 2{,}00{,}001 = 59.9997\ldots$, so some box holds at least 60 people. Notice the box count is 2,00,001, not 2,00,000: forgetting the count of 0 hairs would give exactly 60 as well here, but only by luck.
    - question:
        id: work-compress
        type: choice
        system: s2
        prompt: |
          A start-up claims its compressor makes every file of 1 megabyte or less at least one byte shorter, and that it can always restore the original. What is wrong?
        options:
          - "There are more files of a given length than there are shorter files, so two files would have to compress to the same output, and both could not be restored."
          - "Nothing: modern compressors can do this."
          - "Compression only works on text files."
          - "It would take too long to compress a megabyte."
        answer: 0
        explanation: |
          A compressor that can always restore the original must be injective. Files of at most 1 megabyte all being mapped to strictly shorter files means mapping a set into a smaller one, since the shorter files are fewer than the files themselves. Two inputs must then share an output. Real compressors succeed on files with patterns, text, images, logs, and leave random-looking files, such as already compressed ones, no smaller.
    - question:
        id: work-eleven
        type: numeric
        system: s2
        prompt: |
          What is the fewest numbers you must pick from 1 to 20 to be sure that two of them add up to 21?
        answer: "11"
        explanation: |
          Make 10 boxes, the pairs $\{1, 20\}, \{2, 19\}, \dots, \{10, 11\}$, each adding to 21. Eleven numbers put two in one box. Ten numbers are not enough: 1 to 10 contains no such pair.
  connections:
    - text: |
        The puzzle's three claims all fall to one count. A hash function maps more possible files than it has fingerprints, so two files share a fingerprint, though finding them may be beyond anyone. A compressor that shortens every file would have to fit more files into fewer, so it cannot exist. And any 6 numbers from 1 to 10 fill five pairs that each add to 11, so two share a pair. Mumbai has more people than possible hair counts, many times over, and any 5 numbers in a row hold a run adding to a multiple of 5, because 6 running totals share 5 remainders.

        The method is always the same: decide what the items are, decide what the boxes are, and compare the counts. The general form, $\lceil N / k \rceil$, says how full the fullest box must be, and dealing items like cards shows it can be no fuller. The principle proves existence; whether you can also find what exists is a separate question, sometimes answered by the proof, as with running remainders, and sometimes not at all.

        The sum rule counted the union of sets that do not overlap. The question you avoided twice now, in counting numbers divisible by 2 or by 5, and passwords with at least one digit, is what to do when they do overlap. That is next: [[f3.inclusion-and-exclusion]].
