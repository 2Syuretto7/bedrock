        answer: "1500000"
        explanation: |
          The fixed point solves $L = 1.01L - 15{,}000$, so $0.01L = 15{,}000$ and $L = 15{,}00{,}000$ rupees. A balance of ₹15 lakh earns exactly ₹15,000 interest a month, which the EMI just covers; a larger loan would never be repaid.
  connections:
    - text: |
        The priests need $2^{64} - 1$ moves, about 585 billion years at one a second. The recurrence $T(n) = 2T(n - 1) + 1$ came from one observation about the largest disc, unrolling turned it into a geometric series, and induction proved the formula.

        A recurrence and its initial conditions define a sequence. A loop computes it in as many steps as terms, while a recursive function that copies the definition can take exponentially many calls. First-order linear recurrences are solved through their fixed point, second-order ones through the roots of a characteristic equation, which for Fibonacci gives growth by the factor $\varphi \approx 1.618$ and bounds Euclid's algorithm at under five steps a digit. Halving recurrences unroll into logarithms.

        Notice what the answers have in common: $2^n - 1$, $\varphi^n / \sqrt 5$, $n \log_2 n + n$. In each, one part dominates as $n$ grows and the rest hardly matters. Saying exactly what "hardly matters" means, so that you can compare $n \log_2 n$ with $n^2$ without fussing over constants, is the language of [[f3.asymptotic-notation]].
