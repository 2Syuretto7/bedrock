        explanation: |
          A string of length $n$ ending in 0 is any allowed string of length $n - 1$ followed by 0, and one ending in 1 must end in 01, after any allowed string of length $n - 2$. These cases do not overlap, so by the sum rule $S(n) = S(n - 1) + S(n - 2)$. The initial conditions are $S(0) = 1$, the empty string, and $S(1) = 2$, the strings 0 and 1, so $S(n) = F(n + 2)$. Counting all $2^n$ strings ignores the rule, and starting from $S(1) = 1$ forgets that a single 1 is allowed.
