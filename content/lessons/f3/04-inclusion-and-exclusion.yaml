concept: f3.inclusion-and-exclusion
minutes: 90
claim: You can count the union of overlapping sets by adding the sizes of the sets, subtracting the overlaps of each two, adding back the overlaps of each three and so on, prove that this counts every element exactly once, and use it to count numbers with divisibility conditions, arrangements in which nothing is in its own place, and ways to share work so that nobody is left out.
recalls: [f3.the-pigeonhole-principle]
uses: [f3.counting-with-products-and-sums, f3.permutations-and-combinations, f2.sets-and-set-operations, f1.exponents-and-exponential-growth, f1.summation-notation, s1.modules-and-imports, s1.generators-and-context-managers, s0.dictionaries-and-sets, s0.loops, s0.functions]
leads: [f3.modular-arithmetic, f3.divisibility-and-euclids-algorithm, f4.sample-spaces-and-events]
starter: |
  # Scratch space. How many of the numbers 1 to 100 are even or multiples of 5?
  evens = set(range(2, 101, 2))
  fives = set(range(5, 101, 5))
  print(len(evens), len(fives), len(evens) + len(fives))
  print(len(evens | fives), len(evens & fives))
parts:
  recall:
    - text: |
        [[f3.the-pigeonhole-principle]] proved that boxes must overlap. Today you count exactly how much things overlap, and correct for it. Three quick pulls first.
  puzzle:
    - text: |
        An office of 5 colleagues holds a Diwali gift exchange. Each writes a name on a slip, the slips are shuffled, and each draws one. The exchange fails if anyone draws their own name. How likely is that? And how does the answer change for an office of 50, or 500?

        You can count the shuffles: $5! = 120$. You need the ones where **nobody** has their own slip. The opposite, "someone has their own slip", is a union of five events: colleague 1 has their own, or colleague 2 does, or colleague 3 does, and so on. These overlap heavily, since two colleagues can both have their own slips at once, and the sum rule only adds sets that do not overlap.

        You met the same difficulty twice already. Counting the numbers up to 100 that are even or multiples of 5 as $50 + 20$ counts 10, 20, 30 and the rest twice. And passwords with at least one digit had to be counted by their complement.

        **How do you count a union of sets that overlap, however many sets there are?**
  intuition:
    - text: |
        A school takes a register of which students learn which languages. 40 learn Hindi and 30 learn Tamil. That is not 70 students, because some learn both. If 12 learn both, then the 40 counted those 12 and so did the 30: they were counted twice. Subtract them once and every student is counted once: $40 + 30 - 12 = 58$.

        Now add a third language, Bengali. Add the three totals, and a student who learns two of the languages is counted twice, while one who learns all three is counted three times. Subtract the students in each pair of languages, and the two-language students are now right. But the three-language students were in all three pairs, so they were just subtracted three times, after being added three times: now they are not counted at all. Add them back once, and everyone is counted exactly once.

        Add, subtract, add: **inclusion and exclusion**. Each step corrects the one before, and each correction is smaller.

        The figure counts the numbers up to 30 that are multiples of 2, 3 or 5. Each region shows how many numbers lie in it, and how many times the running total has counted them so far. Step through the three corrections.
    - figure: inclusion-exclusion
      props: { n: 30, stage: 1 }
    - text: |
        After the first step the total is 31, though there are only 30 numbers. The regions in two sets show ×2, and the single number in all three, 30, shows ×3. Subtracting the pairs brings the two-set regions to ×1 and the centre to ×0, with a total of 21. Adding back the centre gives 22, every region ×1. Indeed 22 of the numbers up to 30 are multiples of 2, 3 or 5, leaving 8 that share no factor with 30.
  derivation:
    - text: |
        **Two sets.** For any finite sets $A$ and $B$, in the notation of [[f2.sets-and-set-operations]],

        $$\lvert A \cup B \rvert = \lvert A \rvert + \lvert B \rvert - \lvert A \cap B \rvert.$$

        Split $A \cup B$ into three parts that do not overlap: in $A$ only, in $B$ only, and in both. $\lvert A \rvert$ counts the first and third, $\lvert B \rvert$ the second and third, so their sum counts the third part twice. Subtracting $\lvert A \cap B \rvert$ once fixes it.

        **Three sets.**

        $$\lvert A \cup B \cup C \rvert = \lvert A \rvert + \lvert B \rvert + \lvert C \rvert - \lvert A \cap B \rvert - \lvert A \cap C \rvert - \lvert B \cap C \rvert + \lvert A \cap B \cap C \rvert.$$

        **Any number of sets.** For sets $A_1, \dots, A_n$, add the sizes of the sets, subtract the sizes of all intersections of two, add the sizes of all intersections of three, and so on, the sign alternating, ending with the intersection of all $n$ with sign $(-1)^{n + 1}$. In the notation of [[f1.summation-notation]],

        $$\Bigl\lvert \bigcup_{i} A_i \Bigr\rvert = \sum_{j = 1}^{n} (-1)^{j + 1} \sum_{\lvert S \rvert = j} \Bigl\lvert \bigcap_{i \in S} A_i \Bigr\rvert,$$

        where the inner sum runs over every choice $S$ of $j$ of the $n$ sets.

        *Why it is right.* Take any element $x$, and suppose it lies in exactly $m \ge 1$ of the sets. The terms of size $j$ count $x$ once for each choice of $j$ sets **among those $m$**, so $C(m, j)$ times. Its total count is

        $$C(m, 1) - C(m, 2) + C(m, 3) - \cdots \pm C(m, m).$$

        The binomial theorem of [[f3.permutations-and-combinations]] with $x = -1$ and $y = 1$ gives $0 = (1 - 1)^m = \sum_{j = 0}^{m} (-1)^j C(m, j) = 1 - \bigl[C(m, 1) - C(m, 2) + \cdots\bigr]$. So the bracket, the total count of $x$, is exactly 1. Every element of the union is counted once, and an element in none of the sets appears in no term at all.
    - question:
        id: derivation-twice
        type: choice
        system: s2
        prompt: |
          In the three-set formula, a number lies in $A$ and $B$ but not in $C$. How many times does the right-hand side count it?
        options:
          - "Once: it is added in $\\lvert A \\rvert$ and $\\lvert B \\rvert$, subtracted in $\\lvert A \\cap B \\rvert$, and appears in no other term."
          - "Twice: once for $A$ and once for $B$."
          - "Zero times, because it is subtracted."
          - "Three times, once for each set."
        answer: 0
        explanation: |
          With $m = 2$ the count is $C(2, 1) - C(2, 2) = 2 - 1 = 1$. It is not in $C$, so it appears in none of the terms involving $C$. Check each term in turn: inclusion and exclusion is designed so that every region of the picture comes out at exactly 1.
    - text: |
        **Counting by divisibility.** Among $1, 2, \dots, N$, the multiples of $d$ are $d, 2d, \dots$, and there are $\lfloor N / d \rfloor$ of them. A number is a multiple of both $a$ and $b$ exactly when it is a multiple of their **least common multiple**, which for 2 and 3 is 6, but for 4 and 6 is 12, not 24. So among 1 to 100, the multiples of 2, 3 or 5 number

        $$50 + 33 + 20 - 16 - 10 - 6 + 3 = 74.$$

        The other 26 share no factor with 30. The count of numbers up to $n$ sharing no factor with $n$ will matter a great deal in [[f3.modular-arithmetic]].
    - question:
        id: order-divisible
        type: order
        system: s2
        prompt: |
          Count the numbers from 1 to 1000 that are multiples of 3 or of 7. Put the steps in order.
        steps:
          - "Multiples of 3: $\\lfloor 1000 / 3 \\rfloor = 333$."
          - "Multiples of 7: $\\lfloor 1000 / 7 \\rfloor = 142$."
          - "Multiples of both are the multiples of their least common multiple, 21: $\\lfloor 1000 / 21 \\rfloor = 47$."
          - "Add the two sets and subtract the overlap once: $333 + 142 - 47 = 428$."
        explanation: The two-set formula needs the size of the overlap, and a number divisible by both 3 and 7 is divisible by 21. Because 3 and 7 share no factor, their least common multiple is their product; for numbers that share a factor it is smaller.
    - text: |
        **Arrangements with nothing in its place.** Back to the gift exchange. A shuffle of $n$ slips in which nobody draws their own name is called a **derangement**, and their number is written $D_n$. Let $A_i$ be the set of shuffles in which colleague $i$ draws their own slip. Then $D_n = n! - \lvert A_1 \cup \cdots \cup A_n \rvert$.

        Any $j$ chosen colleagues all drawing their own slips leaves the other $n - j$ slips free to fall in any order: $(n - j)!$ shuffles. There are $C(n, j)$ ways to choose the $j$ colleagues, and $C(n, j)(n - j)! = n!/j!$. So inclusion and exclusion gives

        $$D_n = n! - \frac{n!}{1!} + \frac{n!}{2!} - \frac{n!}{3!} + \cdots \pm \frac{n!}{n!} = n! \sum_{j = 0}^{n} \frac{(-1)^j}{j!}.$$

        For 5 colleagues, $D_5 = 120 - 120 + 60 - 20 + 5 - 1 = 44$, so the exchange succeeds with chance $44 / 120 \approx 0.37$. The sum $\sum (-1)^j / j!$ settles very quickly towards $1/e \approx 0.3679$, where $e$ is the number from [[f1.exponents-and-exponential-growth]]. So for 50 colleagues or 500, the chance that nobody draws their own name is still about 37 per cent, almost exactly. That is the surprising answer to the puzzle: the size of the office hardly matters. Probabilities like this one are the subject of [[f4.sample-spaces-and-events]].

        **Sharing work so nobody is idle.** Five jobs go to 3 servers, each job to one server. There are $3^5 = 243$ ways, by the product rule. How many leave no server idle? Let $A_i$ be the assignments that leave server $i$ idle. Leaving $j$ chosen servers idle sends all 5 jobs to the other $3 - j$: $(3 - j)^5$ ways. So

        $$3^5 - C(3, 1)\,2^5 + C(3, 2)\,1^5 - C(3, 3)\,0^5 = 243 - 96 + 3 - 0 = 150.$$

        These are the functions from a set of 5 onto a set of 3, the **surjections**.

        **Counting in code.** For a handful of sets, Python's sets give the union directly, and the formula checks it. For large ranges, listing is out of the question, and the formula, run over every choice of sets with `itertools.combinations`, is the only practical way. With $k$ conditions there are $2^k - 1$ terms, which is fine for a dozen conditions and hopeless for a hundred.
  formal:
    - text: |
        **Two sets.** $\lvert A \cup B \rvert = \lvert A \rvert + \lvert B \rvert - \lvert A \cap B \rvert$.

        **General form.** $\bigl\lvert \bigcup_{i = 1}^{n} A_i \bigr\rvert = \sum_{\varnothing \ne S \subseteq \{1, \dots, n\}} (-1)^{\lvert S \rvert + 1} \bigl\lvert \bigcap_{i \in S} A_i \bigr\rvert$. An element in exactly $m \ge 1$ sets is counted $\sum_{j = 1}^{m} (-1)^{j + 1} C(m, j) = 1$ time.

        **None of the properties.** The elements of a universe $U$ in none of the $A_i$ number $\lvert U \rvert - \bigl\lvert \bigcup A_i \bigr\rvert$.

        **Divisibility.** Among $1, \dots, N$ there are $\lfloor N / d \rfloor$ multiples of $d$, and the multiples of both $a$ and $b$ are the multiples of $\operatorname{lcm}(a, b)$.

        **Derangements.** $D_n = n! \sum_{j = 0}^{n} (-1)^j / j!$, close to $n!/e$. **Surjections** from an $n$-set onto a $k$-set: $\sum_{j = 0}^{k} (-1)^j C(k, j) (k - j)^n$.
  drill:
    - text: Seconds each. Add the sets, subtract what was counted twice.
    - question:
        id: drill-two-sets
        type: numeric
        system: s1
        prompt: |
          20 students play cricket, 15 play football, and 5 play both. How many play at least one?
        answer: "30"
        explanation: $20 + 15 - 5 = 30$.
    - question:
        id: drill-multiples
        type: numeric
        system: s1
        prompt: |
          How many of the numbers 1 to 100 are multiples of 3?
        answer: "33"
        explanation: $\lfloor 100 / 3 \rfloor = 33$; the last is 99.
    - question:
        id: drill-two-or-five
        type: numeric
        system: s1
        prompt: |
          How many of the numbers 1 to 100 are even or multiples of 5?
        answer: "60"
        explanation: $50 + 20 - 10 = 60$, subtracting the 10 multiples of 10.
    - question:
        id: drill-lcm
        type: numeric
        system: s1
        prompt: |
          How many of the numbers 1 to 100 are multiples of both 4 and 6?
        answer: "8"
        explanation: They are the multiples of 12, the least common multiple, not of 24. $\lfloor 100 / 12 \rfloor = 8$.
    - question:
        id: drill-terms
        type: numeric
        system: s1
        prompt: |
          How many terms does inclusion and exclusion have for 4 sets?
        answer: "15"
        explanation: 'One for each non-empty choice of sets, $2^4 - 1 = 15$: 4 singles, 6 pairs, 4 triples and 1 of all four.'
    - question:
        id: drill-derange-three
        type: numeric
        system: s1
        prompt: |
          Three people each draw one of their three name slips. In how many of the 6 shuffles does nobody draw their own name?
        answer: "2"
        explanation: The two rotations, each person passing to the next. Every other shuffle fixes someone.
    - question:
        id: drill-none
        type: numeric
        system: s1
        prompt: |
          74 of the numbers 1 to 100 are multiples of 2, 3 or 5. How many are multiples of none of them?
        answer: "26"
        explanation: 'The complement: $100 - 74 = 26$.'
    - question:
        id: predict-sets
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          hindi = {"Asha", "Bilal", "Chitra", "Dev"}
          tamil = {"Chitra", "Dev", "Esha"}
          print(len(hindi) + len(tamil), len(hindi | tamil), len(hindi & tamil))
        output: "7 5 2"
        explanation: Adding the sizes counts Chitra and Dev twice. The union has 5 people, which is $4 + 3 - 2$.
    - question:
        id: predict-derange
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import itertools

          count = 0
          for shuffle in itertools.permutations(range(4)):
              if all(shuffle[i] != i for i in range(4)):
                  count += 1
          print(count)
        output: "9"
        explanation: There are 24 shuffles of four slips, and $D_4 = 24 - 24 + 12 - 4 + 1 = 9$ leave nobody with their own.
  work:
    - text: Slower now. Before adding anything, say what the overlap is, and what each element in it has been counted so far.
    - question:
        id: fix-either
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `either(n, a, b)` should count the numbers from 1 to `n` that are multiples of `a` or of `b`. It should print `60 33`. It prints `60 37`. Find the fault and fix it.
        starter: |
          def either(n, a, b):
              return n // a + n // b - n // (a * b)

          print(either(100, 2, 5), either(100, 4, 6))
        solution: |
          import math

          def either(n, a, b):
              both = a * b // math.gcd(a, b)
              return n // a + n // b - n // both

          print(either(100, 2, 5), either(100, 4, 6))
        tests: |
          for _n in range(0, 80):
              for _a in range(1, 13):
                  for _b in range(1, 13):
                      _want = sum(1 for _x in range(1, _n + 1) if _x % _a == 0 or _x % _b == 0)
                      _got = either(_n, _a, _b)
                      assert _got == _want, "either(" + str(_n) + ", " + str(_a) + ", " + str(_b) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "60 33", "The program should print 60 33"
        wrong:
          - |
            def either(n, a, b):
                return n // a + n // b

            print(60, 33)
          - |
            import math

            def either(n, a, b):
                return n // a + n // b - n // math.gcd(a, b)

            print(60, 33)
        explanation: |
          The overlap is the numbers that are multiples of both $a$ and $b$, which are the multiples of their least common multiple. That is $ab$ only when $a$ and $b$ share no factor. For 4 and 6 it is 12, since $4 \cdot 6 = 24$ counts the shared factor 2 twice. The least common multiple is $ab / \gcd(a, b)$, using the greatest common divisor that `math.gcd` computes, and with it the 8 multiples of 12 up to 100 are subtracted, not the 4 multiples of 24.
    - question:
        id: write-any-of
        type: code
        mode: write
        system: s2
        prompt: |
          Write `any_of(n, divisors)`, which counts the numbers from 1 to `n` that are multiples of at least one number in `divisors`, a list of up to 10 whole numbers of at least 1. `n` may be as large as $10^{15}$, so do not look at the numbers one by one: use inclusion and exclusion over every non-empty choice of divisors, with `itertools.combinations` and least common multiples.
        starter: |
          import itertools
          import math

          def any_of(n, divisors):
              return 0

          print(any_of(100, [2, 3, 5]), any_of(1000, [3, 7]), any_of(10 ** 15, [4, 6, 10]))
        solution: |
          import itertools
          import math

          def any_of(n, divisors):
              total = 0
              for j in range(1, len(divisors) + 1):
                  for chosen in itertools.combinations(divisors, j):
                      common = 1
                      for d in chosen:
                          common = common * d // math.gcd(common, d)
                      if j % 2 == 1:
                          total += n // common
                      else:
                          total -= n // common
              return total

          print(any_of(100, [2, 3, 5]), any_of(1000, [3, 7]), any_of(10 ** 15, [4, 6, 10]))
        tests: |
          import random
          random.seed(73)
          for _trial in range(200):
              _n = random.randint(0, 300)
              _ds = [random.randint(1, 20) for _ in range(random.randint(1, 4))]
              _want = sum(1 for _x in range(1, _n + 1) if any(_x % _d == 0 for _d in _ds))
              _got = any_of(_n, _ds)
              assert _got == _want, "any_of(" + str(_n) + ", " + str(_ds) + ") should be " + str(_want) + ", not " + str(_got)
          _big = 10 ** 15
          assert any_of(_big, [4, 6, 10]) == _big // 4 + _big // 6 + _big // 10 - _big // 12 - _big // 20 - _big // 30 + _big // 60, "any_of(10 ** 15, [4, 6, 10]) is wrong"
          assert output.strip() == "74 428 366666666666666", "The program should print 74 428 366666666666666"
        wrong:
          - |
            import itertools
            import math

            def any_of(n, divisors):
                total = 0
                for j in range(1, len(divisors) + 1):
                    for chosen in itertools.combinations(divisors, j):
                        common = 1
                        for d in chosen:
                            common = common * d
                        if j % 2 == 1:
                            total += n // common
                        else:
                            total -= n // common
                return total

            print(74, 428, 366666666666666)
          - |
            import itertools
            import math

            def any_of(n, divisors):
                total = 0
                for j in range(1, len(divisors) + 1):
                    for chosen in itertools.combinations(divisors, j):
                        common = 1
                        for d in chosen:
                            common = common * d // math.gcd(common, d)
                        total += n // common
                return total

            print(74, 428, 366666666666666)
        explanation: |
          Each non-empty choice of divisors contributes the multiples of their least common multiple, built up one divisor at a time with $\operatorname{lcm}(c, d) = cd / \gcd(c, d)$. Choices of an odd number of divisors are added and choices of an even number subtracted. Multiplying the divisors instead of taking the least common multiple goes wrong as soon as two share a factor, as 4, 6 and 10 all do. Adding every term overcounts, since the corrections are what make each number count once. The work is $2^k - 1$ terms for $k$ divisors, whatever the size of $n$.
    - question:
        id: write-derangements
        type: code
        mode: write
        system: s2
        prompt: |
          Write `derangements(n)`, the number of shuffles of `n` name slips in which nobody draws their own, exactly, for `n` from 0 to 100. Use the inclusion and exclusion formula with whole numbers only: each term $n!/j!$ is a whole number, so compute it with `//`. ($D_0 = 1$: the one shuffle of no slips leaves nobody with their own.)
        starter: |
          import math

          def derangements(n):
              return 0

          print([derangements(n) for n in range(7)])
          print(derangements(5) / math.factorial(5))
        solution: |
          import math

          def derangements(n):
              total = 0
              for j in range(n + 1):
                  term = math.factorial(n) // math.factorial(j)
                  if j % 2 == 0:
                      total += term
                  else:
                      total -= term
              return total

          print([derangements(n) for n in range(7)])
          print(derangements(5) / math.factorial(5))
        tests: |
          import itertools
          for _n in range(0, 8):
              _want = sum(1 for _p in itertools.permutations(range(_n)) if all(_p[_i] != _i for _i in range(_n)))
              assert derangements(_n) == _want, "derangements(" + str(_n) + ") should be " + str(_want) + ", not " + str(derangements(_n))
          _d = [1, 0]
          for _n in range(2, 101):
              _d.append((_n - 1) * (_d[-1] + _d[-2]))
          for _n in [20, 50, 100]:
              assert derangements(_n) == _d[_n], "derangements(" + str(_n) + ") must be exact"
          assert output.strip() == "[1, 0, 1, 2, 9, 44, 265]\n0.36666666666666664", "The program should print [1, 0, 1, 2, 9, 44, 265], then 0.36666666666666664"
        wrong:
          - |
            import math

            def derangements(n):
                return round(math.factorial(n) / math.e)

            print([1, 0, 1, 2, 9, 44, 265])
            print(0.36666666666666664)
          - |
            import math

            def derangements(n):
                total = 0
                for j in range(1, n + 1):
                    term = math.factorial(n) // math.factorial(j)
                    if j % 2 == 0:
                        total += term
                    else:
                        total -= term
                return total

            print([1, 0, 1, 2, 9, 44, 265])
            print(0.36666666666666664)
        explanation: |
          The term for $j$ counts the shuffles fixing $j$ chosen people, summed over all choices of them: $C(n, j)(n - j)! = n!/j!$, a whole number. The $j = 0$ term is all $n!$ shuffles, which is where the count starts before anything is subtracted; leaving it out gives the negative of the count of shuffles where someone has their own slip. Rounding $n!/e$ gives the right answer for small $n$, but floating point cannot hold $100!$, a number of 158 digits, exactly.
    - question:
        id: work-servers
        type: numeric
        system: s2
        prompt: |
          Six jobs are each sent to one of 4 servers. In how many ways can this be done so that every server gets at least one job?
        answer: "1560"
        explanation: |
          Let $A_i$ be the assignments that leave server $i$ idle. Then the answer is $4^6 - C(4, 1)\,3^6 + C(4, 2)\,2^6 - C(4, 3)\,1^6 + C(4, 4)\,0^6 = 4096 - 2916 + 384 - 4 + 0 = 1{,}560$.
    - question:
        id: work-gift
        type: choice
        system: s2
        prompt: |
          An office of 200 runs the name-slip gift exchange. About what is the chance that nobody draws their own name?
        options: ["About 37 per cent, the same as for an office of 10", "Almost certainly nobody, because each person's chance of their own slip is only 1 in 200", "Almost certainly someone, because there are so many people", "Exactly half"]
        answer: 0
        explanation: |
          $D_n / n! = \sum_{j = 0}^{n} (-1)^j / j!$, and the terms beyond the first few are tiny, so the sum is $1/e \approx 0.368$ to many decimal places for any $n$ beyond about 10. Each person's chance of their own slip falls as the office grows, but the number of people grows to match, and the two effects balance.
    - question:
        id: work-languages
        type: numeric
        system: s2
        prompt: |
          In a class, 40 learn Hindi, 30 learn Tamil and 25 learn Bengali. 12 learn Hindi and Tamil, 10 Hindi and Bengali, 8 Tamil and Bengali, and 5 learn all three. How many learn at least one of the three?
        answer: "70"
        explanation: |
          $40 + 30 + 25 - 12 - 10 - 8 + 5 = 70$. The 5 who learn all three were added three times, subtracted three times in the pairs, and added back once.
  connections:
    - text: |
        The puzzle asked how often a gift exchange fails, a union of heavily overlapping events. Inclusion and exclusion counts a union of any sets exactly: add the sets, subtract every overlap of two, add every overlap of three, and so on. The binomial theorem shows that an element in $m$ of the sets ends up counted $C(m, 1) - C(m, 2) + \cdots = 1$ time. Applied to shuffles, it gives the derangements, $D_n = n! \sum (-1)^j / j!$, and so the surprising answer that about 37 per cent of exchanges succeed whatever the size of the office. Applied to numbers, it counts multiples of any set of divisors without listing them, provided the overlaps are taken as least common multiples.

        These counts lead in two directions. In probability, a count of outcomes divided by the count of all outcomes is a chance, and the same addition and subtraction of overlaps gives the chance of "this or that", in [[f4.sample-spaces-and-events]]. In number theory, the numbers up to $n$ that share no factor with $n$, which you counted for 30, turn out to control arithmetic in which numbers wrap round, as hours do on a clock.

        That arithmetic, of remainders, is next. It is how computers add when their numbers have a fixed width, how hash functions spread keys, and how a credit card number catches a mistyped digit: [[f3.modular-arithmetic]].
