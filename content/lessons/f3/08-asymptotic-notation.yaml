                for (n1, t1), (n2, t2) in zip(timings, timings[1:]):
                    ratios.append(t2 / t1)
                return round(sum(ratios) / len(ratios))

            print(2, 1)
          - |
            import math

            def estimate_power(timings):
                first = timings[0][1]
                last = timings[-1][1]
                return round(math.log2(last / first))

            print(2, 1)
          - |
            import math

            def estimate_power(timings):
                logs = []
                for (n1, t1), (n2, t2) in zip(timings, timings[1:]):
                    logs.append(math.log10(t2 / t1))
                return round(sum(logs) / len(logs))

            print(2, 1)
        explanation: |
          If $t(n) \approx c\,n^k$, then $t(2n)/t(n) \approx 2^k$ whatever $c$ is, so $\log_2$ of each ratio estimates $k$, and averaging over the doublings smooths out noise in the measurements. The constant $c$, which depends on the machine, cancels in every ratio; that is the doubling test of the arrays lesson, made into a measurement. The ratio itself is $2^k$, not $k$, and $\log_2$ of the ratio from the first time to the last counts every doubling at once, so it must be divided by their number. A logarithm to base 10 measures in the wrong unit.
    - question:
