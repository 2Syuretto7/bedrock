        system: s2
        prompt: |
          Method A takes $50n$ steps and method B takes $n^2 / 2$ steps. What is the smallest whole $n$ for which A takes fewer steps than B?
        answer: "101"
        explanation: |
          $50n < n^2 / 2$ means $100n < n^2$, so $n > 100$. At $n = 100$ the two are equal, at 5,000 steps each.
    - question:
        id: work-false
        type: choice
        system: s2
        prompt: |
          Which statement is false?
        options:
          - "$4^n = O(2^n)$"
          - "$2^{n + 1} = O(2^n)$"
          - "$\\log_{10} n = \\Theta(\\log_2 n)$"
          - "$n \\log n = O(n^{1.5})$"
        answer: 0
        explanation: |
          $4^n / 2^n = 2^n$ grows without limit, so no constant $c$ gives $4^n \le c \cdot 2^n$ for ever. $2^{n + 1} = 2 \cdot 2^n$. Logarithms to different bases differ by a constant factor. And $n \log n / n^{1.5} = \log n / \sqrt n$ shrinks towards 0, because every power of $n$ outgrows the logarithm.
    - question:
        id: work-squares
        type: choice
        system: s2
        prompt: |
          What is $\sum_{i = 1}^{n} i^2$ in $\Theta$ notation?
        options: ["$\\Theta(n^3)$", "$\\Theta(n^2)$", "$\\Theta(n^2 \\log n)$", "$\\Theta(2^n)$"]
        answer: 0
        explanation: |
          Each of the $n$ terms is at most $n^2$, so the sum is at most $n^3$. The largest half of the terms are each at least $(n/2)^2$, so the sum is at least $\tfrac{n}{2} \cdot \tfrac{n^2}{4} = \tfrac{n^3}{8}$. The exact value is $\tfrac16 n(n + 1)(2n + 1)$.
    - question:
        id: work-cases
        type: choice
        system: s2
        prompt: |
          A function checks whether a value is in an unsorted list by looking at each item in turn, stopping as soon as it finds it. Which statement is true?
        options:
          - "Its worst case is $\\Theta(n)$ and its best case is $\\Theta(1)$, so its running time is $O(n)$ but not $\\Theta(n)$ on every input."
          - "It is $O(n)$, which means it always takes $n$ steps."
          - "It is $\\Omega(1)$, which means its best case is constant, so it is fast."
          - "Its order of growth is undefined because it depends on the input."
        answer: 0
        explanation: |
          $O(n)$ is an upper bound on the worst case: it never takes more than $cn$ steps. When the value is first, it takes one step, so the best case is $\Theta(1)$. Saying "$\Omega(1)$" adds nothing, since every function that takes at least a step is $\Omega(1)$. Order of growth is well defined once you say which cost, worst, best or average, you are describing.
  connections:
    - text: |
        Team B's method is better in exactly this sense: $400 n \log_2 n$ is $O(n^2)$ but $2n^2$ is not $O(n \log n)$. The constants 2 and 400 only decide where B overtakes, at about 2,224 requests, and after that B wins by more at every doubling. Likewise $n^{100}$ is $O(1.01^n)$, however unlikely that looks at first.

        Big-O gives an upper bound, $\Omega$ a lower bound, and $\Theta$ both, each up to a constant factor and from some size on. A witness $c$, $n_0$ proves a bound, and the negated definition disproves one. Sums are as big as their biggest part, products multiply, polynomials are as big as their leading term, logarithms of any base are the same size, exponentials of different bases are not, and the ladder runs from $\log n$ through powers of $n$ to $2^n$ and $n!$. Worst, best and average cases are separate questions, each answered in this language.

        So far the things being counted have been numbers, arrangements and steps. The rest of this cluster counts and reasons about connections: which towns a road network joins, which friends a social network links, which tasks wait on which. A graph was a data structure in the data structures cluster; next it becomes a mathematical object with theorems of its own, in [[f3.graph-theory-basics]].
