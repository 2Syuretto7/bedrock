        explanation: |
          Character `i`, counting from 0, has weight $10 - i$, and the code is valid when the weighted sum is a multiple of 11. The weights are what catch a swap of neighbouring digits: without them a swap leaves the sum unchanged. The modulus 11 is what catches every single wrong digit, because a change of $e$ at weight $w$ alters the sum by $we$, and 11, being prime, divides that only when it divides $w$ or $e$, which no weight from 1 to 10 or change from 1 to 9 does. Modulo 10, a change of 5 at an even weight would go unnoticed. And the final `X` must count as 10, or a quarter of the valid codes ending in it would be rejected.
    - question:
        id: work-power
        type: numeric
        system: s2
        prompt: |
          What is $2^{100} \bmod 7$?
        answer: "2"
        explanation: |
          $2^3 = 8 \equiv 1 \pmod 7$, and $100 = 3 \cdot 33 + 1$, so $2^{100} = (2^3)^{33} \cdot 2 \equiv 1 \cdot 2 = 2$.
    - question:
        id: work-cancel
        type: choice
        system: s2
        prompt: |
          Working modulo 12, which deduction is always valid?
        options:
          - "From $5x \\equiv 5y$, conclude $x \\equiv y$."
          - "From $4x \\equiv 4y$, conclude $x \\equiv y$."
          - "From $6x \\equiv 0$, conclude $x \\equiv 0$."
          - "From $x^2 \\equiv 1$, conclude $x \\equiv 1$."
        answer: 0
        explanation: |
          5 shares no factor with 12, so it may be cancelled: on the clock, jumps of 5 reach every position, so multiplying by 5 sends different numbers to different places. 4 does not: $4 \cdot 1 \equiv 4 \cdot 4 \pmod{12}$. $6 \cdot 2 = 12 \equiv 0$ though $2 \not\equiv 0$. And $5^2 = 25$, $7^2 = 49$ and $11^2 = 121$ are all $\equiv 1 \pmod{12}$.
    - question:
        id: work-register
        type: numeric
        system: s2
        prompt: |
          A signed 16-bit register computes $200 \times 200$. What value does it hold, read in two's complement?
        answer: "-25536"
        explanation: |
          $40{,}000 \bmod 2^{16} = 40{,}000$, since $2^{16} = 65{,}536$. That is at least $2^{15} = 32{,}768$, so the pattern reads as negative: $40{,}000 - 65{,}536 = -25{,}536$. Both numbers are in the same class modulo $2^{16}$.
  connections:
    - text: |
        The puzzle's answers come from one idea. 22:00 on Friday plus 75 hours is $22 + 75 = 97 \equiv 1 \pmod{24}$, and 97 hours from Friday's midnight is 4 days, so the train arrives at 01:00 on Tuesday. The last digit of $7^{2026}$ is 9, because $7^4 \equiv 1 \pmod{10}$. And C and Python are both right about $-7$: their remainders, $-1$ and 2, are two members of the same class modulo 3.

        Modular arithmetic replaces numbers by their classes of remainders. Sums, differences, products and powers respect the classes, so you can reduce at every step and keep the numbers small, which is what every fixed-width processor, every hash table and every check digit relies on. Division is the exception: cancelling $c$ modulo $m$ is safe only when $c$ shares no factor with $m$.

        That condition raises the questions of the next lesson. What exactly is the largest factor two numbers share, how can you find it for numbers with hundreds of digits, and why does sharing no factor make division possible? The answer is one of the oldest algorithms there is: [[f3.divisibility-and-euclids-algorithm]].
