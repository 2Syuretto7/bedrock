          Each vertex's colour is forced by the vertex it was reached from, so if any colouring exists, the search finds it; and an edge with both ends the same colour closes a walk of odd length, so no colouring exists. Colouring without checking edges to vertices already coloured never notices a triangle. Odd degrees have nothing to do with it: a path of three vertices has ends of degree 1 and is bipartite. And a graph may have several components, each of which needs its own starting vertex, or some vertices are never coloured.
