    - question:
        id: work-friends
        type: choice
        system: s2
        prompt: |
          In a hostel of 40 students, friendship is mutual. Which statement must be true?
        options:
          - "Two students have exactly the same number of friends in the hostel."
          - "Some student is friends with everyone."
          - "Every student has an even number of friends."
          - "Some student has no friends in the hostel."
        answer: 0
        explanation: |
          Friend counts lie between 0 and 39, but 0 and 39 cannot both occur, so there are at most 39 possible counts for 40 students, and by the pigeonhole principle two must share one. The other statements can all fail: everyone might have exactly one friend, in 20 pairs.
    - question:
        id: work-add-lanes
        type: numeric
        system: s2
        prompt: |
          A colony's lanes form a connected graph in which exactly 6 junctions have an odd number of lanes. An inspector must walk every lane in one continuous route, and may add new lanes, each joining two junctions. What is the fewest new lanes that make such a route possible, starting and ending anywhere?
        answer: "2"
        explanation: |
          A one-stroke route needs at most 2 odd junctions. Each new lane changes the degree of its two ends by 1. Joining two odd junctions makes both even, so two new lanes leave 2 odd junctions, and one lane can remove at most 2 of the 6, so 1 lane is not enough.
  connections:
    - text: |
        The kolam's secret is in the degrees. A connected figure can be drawn in one stroke exactly when at most two points have an odd number of lines, and the stroke returns home when none do. The square with diagonals has four odd corners, the house has two, and the star has none.

        Graphs are vertices and edges; the handshake lemma ties the degrees to the number of edges and makes odd vertices come in pairs. Walks contain paths, "is reachable from" splits a graph into connected components, and a search counts them in linear time. Euler's theorem settles one-stroke drawings, while the similar question for vertices is famously hard. Bipartite graphs are exactly those with no odd cycle, and a colouring search tests for them.

        One kind of graph deserves a lesson of its own: connected, but with no cycles at all. A family tree, a folder hierarchy, the tries and search trees of the data structures cluster, and the cheapest way to join every village to the power grid are all of this kind. They have exactly one path between any two vertices and exactly one edge fewer than vertices, as [[f3.trees-and-their-properties]] will prove.
