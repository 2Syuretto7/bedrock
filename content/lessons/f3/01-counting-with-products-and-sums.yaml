          How many two-letter strings over A to Z have two **different** letters?
        answer: "650"
        explanation: 26 choices for the first, then 25 for the second, whatever the first was.
    - question:
        id: drill-functions
        type: numeric
        system: s1
        prompt: |
          How many functions are there from a set of 3 elements to a set of 4 elements?
        answer: "64"
        explanation: Each of the 3 inputs chooses one of 4 outputs, $4^3$.
    - question:
        id: drill-rule
        type: choice
        system: s1
        prompt: |
          A form asks for a date of birth **or** an Aadhaar number, not both. To count the possible answers, do you add or multiply the counts of the two kinds?
        options: ["Add: each answer is one kind or the other", "Multiply: there are two parts", "Subtract the smaller from the larger", "Square the larger"]
        answer: 0
        explanation: The answers split into two separate cases, so the sum rule applies. You multiply when an answer is made of one choice **and then** another.
    - question:
        id: predict-product
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import itertools

          codes = list(itertools.product("AB", "123"))
          print(len(codes), codes[0], codes[-1])
        output: "6 ('A', '1') ('B', '3')"
        explanation: Two letters and then three digits make $2 \times 3 = 6$ pairs. They come in order with the last stage changing fastest, like a counter, so the first is A then 1 and the last is B then 3.
    - question:
        id: predict-restricted
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          count = 0
          for first in range(3):
              for second in range(4):
                  if first != second:
                      count += 1
          print(count)
        output: "9"
        explanation: There are $3 \times 4 = 12$ pairs, and three of them, (0, 0), (1, 1) and (2, 2), have equal parts. So 9 pass. Equally, each first value has exactly one equal partner among the four, so it has 3 others, and the product rule gives $3 \times 3 = 9$.
  work:
    - text: Slower now. For every count, name the stages or the cases, and say why the number of options at each stage is fixed.
    - question:
        id: fix-password-count
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `passwords(shortest, longest, symbols)` should count the passwords whose length is anywhere from `shortest` to `longest`, inclusive, each character one of `symbols`. For lengths 1 to 2 over 3 symbols it should print 12, and for 6 to 8 over 62 it should print 221918520426688. Find the fault and fix it.
        starter: |
          def passwords(shortest, longest, symbols):
              total = 1
              for length in range(shortest, longest + 1):
                  total *= symbols ** length
              return total

          print(passwords(1, 2, 3))
          print(passwords(6, 8, 62))
        solution: |
          def passwords(shortest, longest, symbols):
              total = 0
              for length in range(shortest, longest + 1):
                  total += symbols ** length
              return total

          print(passwords(1, 2, 3))
          print(passwords(6, 8, 62))
        tests: |
          import itertools
          for _lo in range(0, 4):
              for _hi in range(_lo, 5):
                  for _m in range(1, 5):
                      _want = sum(1 for _k in range(_lo, _hi + 1) for _ in itertools.product(range(_m), repeat=_k))
                      _got = passwords(_lo, _hi, _m)
                      assert _got == _want, "passwords(" + str(_lo) + ", " + str(_hi) + ", " + str(_m) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "12\n221918520426688", "The program should print 12, then 221918520426688"
        wrong:
          - |
            def passwords(shortest, longest, symbols):
                total = 0
                for length in range(shortest, longest):
                    total += symbols ** length
                return total

            print(12)
            print(221918520426688)
          - |
            def passwords(shortest, longest, symbols):
                return symbols ** longest

            print(12)
            print(221918520426688)
        explanation: |
          Every password has exactly one length, so the lengths are separate cases, and separate cases **add**. Multiplying would count ways to choose one password of every length at once, a password of length 1 **and** one of length 2, which is not the question. The total starts at 0, the count of no cases at all, and each length adds its own $m^k$. Over 3 symbols that is $3 + 9 = 12$.
    - question:
        id: write-all-strings
        type: code
        mode: write
        system: s2
        prompt: |
          Write `all_strings(symbols, k)`, which returns a list of every string of length `k` made from the characters of `symbols`, repeats allowed, in dictionary order for that order of symbols. Build it the way the product rule counts: the strings of length `k` are each string of length `k - 1` followed by each symbol in turn. Do not use `itertools`.
        starter: |
          def all_strings(symbols, k):
              return []

          print(all_strings("AB", 3))
          print(len(all_strings("0123456789", 4)), all_strings("xyz", 0))
        solution: |
          def all_strings(symbols, k):
              if k == 0:
                  return [""]
              shorter = all_strings(symbols, k - 1)
              return [start + symbol for start in shorter for symbol in symbols]

          print(all_strings("AB", 3))
          print(len(all_strings("0123456789", 4)), all_strings("xyz", 0))
        tests: |
          import itertools as _it
          assert "itertools" not in source.split("def all_strings")[1], "Build the strings yourself, without itertools"
          for _syms in ["A", "AB", "xyz", "0123"]:
              for _k in range(0, 5):
                  _want = ["".join(_p) for _p in _it.product(_syms, repeat=_k)]
                  _got = all_strings(_syms, _k)
                  assert _got == _want, "all_strings(" + repr(_syms) + ", " + str(_k) + ") should be " + str(_want[:6]) + ("..." if len(_want) > 6 else "") + ", not " + str(_got[:6])
          assert output.strip() == "['AAA', 'AAB', 'ABA', 'ABB', 'BAA', 'BAB', 'BBA', 'BBB']\n10000 ['']", "The program should print the eight strings over AB, then 10000 ['']"
        wrong:
          - |
            def all_strings(symbols, k):
                if k == 0:
                    return []
                if k == 1:
                    return list(symbols)
                shorter = all_strings(symbols, k - 1)
                return [start + symbol for start in shorter for symbol in symbols]

            print(['AAA', 'AAB', 'ABA', 'ABB', 'BAA', 'BAB', 'BBA', 'BBB'])
            print(10000, [''])
          - |
            def all_strings(symbols, k):
                if k == 0:
                    return [""]
                shorter = all_strings(symbols, k - 1)
                return [symbol + start for start in shorter for symbol in symbols]

            print(['AAA', 'AAB', 'ABA', 'ABB', 'BAA', 'BAB', 'BBA', 'BBB'])
            print(10000, [''])
        explanation: |
          There is exactly one string of length 0, the empty string, so the list for $k = 0$ is `[""]`, not `[]`: a list with no strings would make every longer list empty too, since multiplying by 0 gives 0. Each string of length $k - 1$ is then extended by each symbol, $m$ ways each, which is the product rule's $m^{k - 1} \times m = m^k$. Extending at the end, with the outer loop over the shorter strings, keeps dictionary order: all strings beginning AA come before those beginning AB. Putting the new symbol in front gives the same strings in a different order.
    - question:
        id: write-count-codes
        type: code
        mode: write
        system: s2
        prompt: |
          A machine code is `k` symbols long, each one of `m` symbols, and no two neighbouring symbols may be equal. Write `count_codes(m, k)`, the number of such codes, for `k` at least 1. The tests ask for `k` up to 40, far too many codes to list, so count them with the product rule.
        starter: |
          def count_codes(m, k):
              return 0

          print(count_codes(3, 4), count_codes(10, 4), count_codes(2, 40))
        solution: |
          def count_codes(m, k):
              return m * (m - 1) ** (k - 1)

          print(count_codes(3, 4), count_codes(10, 4), count_codes(2, 40))
        tests: |
          import itertools
          for _m in range(1, 5):
              for _k in range(1, 6):
                  _want = sum(1 for _c in itertools.product(range(_m), repeat=_k) if all(_c[_i] != _c[_i + 1] for _i in range(_k - 1)))
                  _got = count_codes(_m, _k)
                  assert _got == _want, "count_codes(" + str(_m) + ", " + str(_k) + ") should be " + str(_want) + ", not " + str(_got)
          assert count_codes(62, 40) == 62 * 61 ** 39, "count_codes(62, 40) should be 62 * 61 ** 39"
          assert count_codes(7, 1) == 7, "A code of length 1 has no neighbours, so any of the 7 symbols will do"
          assert output.strip() == "24 7290 2", "The program should print 24 7290 2"
        wrong:
          - |
            def count_codes(m, k):
                return m ** k

            print(24, 7290, 2)
          - |
            def count_codes(m, k):
                return m * (m - 1) ** k

            print(24, 7290, 2)
          - |
            def count_codes(m, k):
                return (m - 1) ** k

            print(24, 7290, 2)
        explanation: |
          The first symbol can be any of the $m$. Each later symbol can be anything except its left neighbour, which leaves $m - 1$ choices, whatever that neighbour was. That is one stage of $m$ and $k - 1$ stages of $m - 1$, so $m (m - 1)^{k - 1}$. Over 2 symbols there are just 2 codes of any length, the two alternating ones, and the formula agrees: $2 \cdot 1^{39} = 2$.
    - question:
        id: work-plates
        type: numeric
        system: s2
        prompt: |
          A regional transport office's plates carry a series of two letters, AA to ZZ, and a number from 0001 to 9999. How many plates can it issue?
        answer: "6759324"
        explanation: |
          Four stages: 26 letters, 26 letters and 9,999 numbers, $26 \times 26 \times 9{,}999 = 67{,}59{,}324$. A three-letter series would give 26 times as many, $17{,}57{,}42{,}424$.
    - question:
        id: work-mobile
        type: numeric
        system: s2
        prompt: |
          An Indian mobile number has ten digits, and its first digit is 6, 7, 8 or 9. How many such numbers are there?
        answer: "4000000000"
        explanation: |
          Four choices for the first digit and ten for each of the other nine: $4 \times 10^9$, 400 crore. Equivalently, four separate cases by first digit, each with $10^9$ numbers, added.
    - question:
        id: work-at-least-one
        type: numeric
        system: s2
        prompt: |
          How many four-digit PINs, 0000 to 9999, contain at least one 7?
        answer: "3439"
        explanation: |
          Count the complement. All PINs: $10^4 = 10{,}000$. PINs with no 7 have 9 choices in each place: $9^4 = 6{,}561$. So $10{,}000 - 6{,}561 = 3{,}439$ contain a 7. Counting directly would mean juggling overlapping cases: a 7 first, a 7 second, both, and so on.
    - question:
        id: work-tests
        type: choice
        system: s2
        prompt: |
          A web form has four settings: a language from 12, a theme from 3, a font size from 5, and notifications on or off. A tester wants to try every combination once, at 30 seconds a test. Roughly how long is that?
        options: ["About 3 hours: $12 \\times 3 \\times 5 \\times 2 = 360$ tests", "About 11 minutes: $12 + 3 + 5 + 2 = 22$ tests", "About 6 days: $12^4$ tests", "About 30 seconds, since the settings are independent"]
        answer: 0
        explanation: |
          A combination is one choice at each of four stages, so the product rule gives 360 combinations, and 360 half-minutes are 3 hours. Adding would count the settings, not the combinations. Every new setting multiplies the total, which is why testers rarely try every combination and instead choose a smaller set that covers every pair of settings.
  connections:
    - text: |
        The puzzle asked how to count possibilities without listing them. A task made of successive stages, with a fixed number of options at each stage whatever went before, has the product of those numbers as its count: a regional transport office can issue $26 \times 26 \times 9{,}999$ plates, and a third letter multiplies that by 26. A task that splits into separate cases has the sum of their counts. Most counts mix the two, and when the outcomes you want are awkward, counting the rest and subtracting often is not. Listing a small case in code, with `itertools.product` or a recursion that follows the product rule, is how to check a formula before trusting it on cases far too large to list.

        These counts are everywhere in computing. A key of $n$ bits has $2^n$ values, which is why each extra bit doubles the work of guessing it. A search that tries every combination of $k$ choices does $m^k$ things, and the exponential growth of that number is the reason such searches fail. A hash table, a trie or a test suite is sized by the same multiplication.

        The product rule needed the number of options at each stage to be fixed, and the cleanest case where options shrink as you go is arranging things without repeats: ten runners can finish in $10 \times 9 \times 8 \times \cdots \times 1$ orders. Counting arrangements, and then counting selections where the order does not matter, is next: [[f3.permutations-and-combinations]].
