concept: f3.counting-with-products-and-sums
minutes: 90
claim: You can count the outcomes of a task made of successive choices with the product rule, the outcomes of a task that splits into separate cases with the sum rule, combine the two, count the complement when it is easier, and check a small count by listing every outcome in code, so as to size a number plate series, a password space or a brute-force search before you start.
recalls: [f2.equivalence-relations-and-partial-orders, s2.union-find]
uses: [f2.sets-and-set-operations, f2.relations-and-functions-between-sets, f1.exponents-and-exponential-growth, f1.logarithms, f1.summation-notation, h0.unsigned-integers-and-fixed-widths, s2.tries, s1.recursion, s1.generators-and-context-managers, s0.loops, s0.functions]
leads: [f3.permutations-and-combinations, f3.the-pigeonhole-principle, f3.inclusion-and-exclusion, f4.sample-spaces-and-events, s3.intractability-p-np-and-heuristics]
bridges:
  s2.union-find: |
    The data structures cluster ended by noticing that every lesson raised a counting question you answered by hand: how many links, how many collisions, how many nodes. Here such questions get rules. A trie of six-digit PIN codes can hold at most $10^6$ of them, because each of six places takes one of ten digits. Union-find's list `parent` gives each of $n$ items one of $n$ values, so there are $n^n$ possible lists, most of them not forests at all. Counting the possibilities a structure, a password or a search can have, without listing them, is the skill of this cluster.
starter: |
  # Scratch space. Number plates with one letter and two digits, A00 to Z99.
  # Count them by listing every one, then compare with a multiplication.
  letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  plates = 0
  for letter in letters:
      for tens in range(10):
          for units in range(10):
              plates += 1
  print(plates, 26 * 10 * 10)
parts:
  recall:
    - text: |
        [[s2.union-find]] closed the data structures cluster, and with it a run of lessons in which you counted links, collisions and nodes by hand whenever a cost depended on them. This cluster turns that counting into mathematics. Three quick pulls first.
  puzzle:
    - text: |
        A car registered in Pune gets a number plate such as MH 12 AB 1234. MH is the state and 12 is the regional transport office, so every plate from that office has the same first part. What varies is the series, two letters from AA to ZZ, and the number, from 0001 to 9999.

        A busy office registers lakhs of vehicles a year. How many plates can it issue before every combination is used? Writing them all out is hopeless, and you would not trust the tally anyway. Yet the answer is one multiplication, and so is the answer to the next question: if the series grew to three letters, how many more plates would there be?

        The same questions arise everywhere in computing. How many six-digit one-time passwords are there, and so what chance has a guess? How many test cases does it take to try every combination of four settings? How long would a program take to try every eight-character password? Each is a count of possibilities too many to list.

        **How do you count a set of possibilities without listing them, and be sure the count is right?**
  intuition:
    - text: |
        A canteen offers a fixed meal: one main, then one drink, then one sweet. There are three mains, rajma, kadhi and paneer; two drinks, lassi and chaas; and two sweets, halwa and jalebi. How many different meals are there?

        Picture the choosing as a tree. From the start, three branches lead to the three mains. From **each** main, two branches lead to the drinks, and from each of those, two lead to the sweets. Every path from the top to the bottom is one meal, and every meal is one path. So count the bottom ends of the tree, its leaves: three groups of two groups of two, $3 \times 2 \times 2 = 12$.

        What made multiplication work is that the number of branches at each level was the same whatever had been chosen above. Every main could be followed by either drink. Had paneer come with lassi only, the tree would be lopsided and you would have to add its branches up instead.

        The figure draws the tree. Change the number of options at each stage, and step through the meals to see each as a path.
    - figure: choice-tree
      props: { mains: 3, drinks: 2, sweets: 2 }
    - text: |
        With three of each, the tree has 27 leaves, and meal 27 is the last path on the right, paneer, nimbu pani, barfi. Dropping to one drink halves nothing and doubles nothing: it removes a level of branching, multiplying by 1.
  derivation:
    - text: |
        **The product rule.** If a task is done in two stages, and the first can be done in $m$ ways, and **whatever happens in the first** the second can then be done in $n$ ways, the task can be done in $m \times n$ ways. With $k$ stages of $n_1, n_2, \dots, n_k$ ways each, it is $n_1 n_2 \cdots n_k$.

        In the language of [[f2.sets-and-set-operations]], the simplest case is the **Cartesian product** $A \times B$, the set of all pairs $(a, b)$ with $a$ from $A$ and $b$ from $B$:

        $$\lvert A \times B \rvert = \lvert A \rvert \cdot \lvert B \rvert.$$

        List the pairs in rows, one row for each $a$, and each row holds $\lvert B \rvert$ pairs, so there are $\lvert A \rvert$ rows of $\lvert B \rvert$.

        The number plates are a product of four stages: 26 letters, 26 letters, and 9,999 numbers, so

        $$26 \times 26 \times 9{,}999 = 67{,}59{,}324$$

        plates per office, under 68 lakh. A third letter multiplies that by 26, to over 17 crore.

        **Strings and powers.** When every stage has the same $m$ choices, $k$ stages give $m^k$, the exponential growth of [[f1.exponents-and-exponential-growth]]. Three letters make $26^3 = 17{,}576$ strings. Six digits make $10^6$ one-time passwords, so a single guess succeeds with chance one in ten lakh. An $n$-bit pattern has $2^n$ values, which is why a byte holds 256 and why [[h0.unsigned-integers-and-fixed-widths]] found that $n$ bits count from 0 to $2^n - 1$.

        Two more counts are products in disguise:

        - **Subsets.** A subset of an $n$-element set is decided by $n$ yes-or-no choices, one for each element: in or out. So an $n$-element set has $2^n$ subsets, including the empty set and the whole set.
        - **Functions.** A function from a set of $k$ elements to a set of $m$ elements, in the sense of [[f2.relations-and-functions-between-sets]], chooses an output for each of the $k$ inputs, $m$ ways each, so there are $m^k$ such functions. Union-find's `parent` list is a function from $n$ items to $n$ items: $n^n$ lists.

        **The condition matters.** The product rule needs the **number** of choices at each stage to be the same whatever was chosen before. The choices themselves may differ. Two different letters, the first anything and the second anything but the first, give $26 \times 25 = 650$: the second letter's options depend on the first, but there are always 25 of them. When even the number varies, as with a canteen where paneer comes only with lassi, the product rule does not apply, and you must split into cases.
    - question:
        id: derivation-condition
        type: choice
        system: s2
        prompt: |
          A four-digit PIN may not begin with 0, and may not have two equal digits side by side. Why does the product rule still apply?
        options:
          - "The first digit has 9 choices, and each later digit has exactly 9 choices whatever came before it, any digit except the one just used, so the count is $9^4$."
          - "Because every PIN has four digits."
          - "It does not apply, because the later choices depend on the earlier ones."
          - "Because the digits are independent of each other, so there are $10^4$ PINs."
        answer: 0
        explanation: |
          The product rule asks only that the **number** of options at each stage be fixed. The first digit is 1 to 9, 9 options. Each later digit is any of the ten except the previous one, again 9 options, though which 9 depends on the previous digit. So there are $9 \times 9 \times 9 \times 9 = 6{,}561$ such PINs. The options do depend on earlier choices; their number does not.
    - text: |
        **The sum rule.** If the outcomes of a task fall into separate cases, with no outcome in two cases, the total is the sum of the counts of the cases. For sets that do not overlap,

        $$\lvert A \cup B \rvert = \lvert A \rvert + \lvert B \rvert \quad \text{when } A \cap B = \varnothing.$$

        A Wi-Fi password of 6, 7 or 8 characters, each a letter in either case or a digit, 62 choices: every password has exactly one length, so the lengths are separate cases, and

        $$62^6 + 62^7 + 62^8 = \sum_{k = 6}^{8} 62^k$$

        in the notation of [[f1.summation-notation]], about $2.2 \times 10^{14}$. Notice how little the shorter lengths add: $62^8$ alone is 98 per cent of the total, because each length is 62 times the one before.

        The cases must not overlap. Count the numbers from 1 to 100 that are even **or** multiples of 5 as $50 + 20$ and you count 10, 20, 30 and the rest twice. Overlapping cases are the subject of [[f3.inclusion-and-exclusion]].

        **Products and sums together.** Most real counts mix the two: split into cases, and use the product rule inside each. Indian mobile numbers have ten digits, and the first is 6, 7, 8 or 9. Four cases for the first digit, and $10^9$ ways to finish each, so $4 \times 10^9$, 400 crore numbers. A canteen where paneer comes only with lassi but rajma and kadhi come with either drink has $2 \times 2 + 1 \times 1 = 5$ main and drink pairs: a sum over cases of products.

        **Counting the complement.** Sometimes the outcomes you want are awkward to count and the ones you do not want are easy. Then count everything and subtract. How many eight-character passwords over the 62 characters contain **at least one** digit? "At least one" means one digit, or two, or three, in any of several places: many overlapping cases. Its opposite, **no** digits at all, is simple, $52^8$, since each place is one of 52 letters. So the answer is

        $$62^8 - 52^8 \approx 1.6 \times 10^{14}.$$

        This is the sum rule read backwards: every password either has a digit or has none, never both.
    - question:
        id: order-complement
        type: order
        system: s2
        prompt: |
          Count the four-letter strings over A to Z that contain at least one vowel. Put the steps in order.
        steps:
          - "Every string either contains a vowel or contains none, and never both, so count all strings and subtract those with no vowel."
          - "All four-letter strings: $26^4 = 4{,}56{,}976$."
          - "Strings with no vowel use only the 21 consonants in each place: $21^4 = 1{,}94{,}481$."
          - "Subtract: $4{,}56{,}976 - 1{,}94{,}481 = 2{,}62{,}495$ strings contain at least one vowel."
        explanation: |
          "At least one" splits into overlapping cases, a vowel in the first place or the second or both, and so on. Its complement, "no vowel anywhere", is a single product. Counting everything and subtracting is the sum rule applied to two cases that cover everything without overlap.
    - text: |
        **Checking by listing.** A count is easy to get wrong, and a small case is easy to check. Python's `itertools.product` lists the outcomes of a product of stages:

        ```python
        import itertools

        meals = list(itertools.product(["rajma", "kadhi", "paneer"], ["lassi", "chaas"], ["halwa", "jalebi"]))
        print(len(meals), meals[0])
        ```

        This shows `12 ('rajma', 'lassi', 'halwa')`. The habit worth forming is to derive the formula, then list a small case and check that the two agree, and only then trust the formula on a case too large to list. Listing is the product rule done the slow way, one outcome per step, and the slow way is out of reach very quickly. All eight-character passwords over 62 characters number about $2.2 \times 10^{14}$; at a crore a second, trying them takes eight months. That is why a long password resists guessing, and why some problems are hopeless to solve by trying everything, a theme that ends in [[s3.intractability-p-np-and-heuristics]].

        **The size of a search, by logarithms.** Turn the question around: how many characters must a password have before guessing is hopeless? Over 62 characters, $k$ characters give $62^k$ passwords. For at least $10^{18}$ of them, $k \log_{10} 62 \ge 18$, and since $\log_{10} 62 \approx 1.79$, by [[f1.logarithms]], $k \ge 10.04$: eleven characters. The product rule gives the count, and a logarithm undoes the power.
  formal:
    - text: |
        **Product rule.** If a task has $k$ stages, and stage $i$ can be done in $n_i$ ways whatever was done in the earlier stages, the task can be done in $n_1 n_2 \cdots n_k$ ways. In particular $\lvert A_1 \times \cdots \times A_k \rvert = \lvert A_1 \rvert \cdots \lvert A_k \rvert$.

        **Powers.** There are $m^k$ strings of length $k$ over $m$ symbols, $m^k$ functions from a $k$-set to an $m$-set, and $2^n$ subsets of an $n$-set.

        **Sum rule.** If $A_1, \dots, A_k$ are pairwise disjoint, $\lvert A_1 \cup \cdots \cup A_k \rvert = \lvert A_1 \rvert + \cdots + \lvert A_k \rvert$.

        **Complement.** If $A \subseteq U$, then $\lvert A \rvert = \lvert U \rvert - \lvert U \setminus A \rvert$.
  drill:
