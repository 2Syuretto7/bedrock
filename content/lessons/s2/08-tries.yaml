        mode: write
        system: s2
        prompt: |
          Write `complete(trie, prefix)`, which returns every stored word beginning with `prefix`, in alphabetical order, and an empty list if there are none. Walk down to the node for `prefix` and collect only below it: the tests count the nodes you look inside, and a trie full of other words must not slow you down.
