        solution: |
          class TrieNode:
              def __init__(self):
                  self.children = {}
                  self.end = False

          class Trie:
              def __init__(self):
                  self.root = TrieNode()

              def insert(self, word):
                  node = self.root
                  for letter in word:
                      if letter not in node.children:
                          node.children[letter] = TrieNode()
                      node = node.children[letter]
                  node.end = True

          def longest_match(trie, text):
              node = trie.root
              best = 0
              read = 0
              for letter in text:
                  if letter not in node.children:
                      break
                  node = node.children[letter]
                  read += 1
                  if node.end:
                      best = read
              return text[:best]

          vocabulary = Trie()
          for piece in ["un", "under", "understand", "stand", "standing", "ing"]:
              vocabulary.insert(piece)
          print(longest_match(vocabulary, "understanding"), longest_match(vocabulary, "standings"))
          print(longest_match(vocabulary, "undo"), longest_match(vocabulary, "zebra") == "")
