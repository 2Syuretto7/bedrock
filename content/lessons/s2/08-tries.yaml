          _looks[0] = 0
          assert complete(_t, "MAN") == ["MANGO", "MANGROVE", "MANY"], "complete(trie, 'MAN') should be ['MANGO', 'MANGROVE', 'MANY']"
          assert _looks[0] <= 60, "complete looked inside " + str(_looks[0]) + " nodes to find three words among 3004; walk to the node for the beginning and collect only below it"
          assert output.strip() == "['NEW DELHI', 'NEW JALPAIGURI', 'NEW TINSUKIA']\n['NAGPUR', 'NANDED'] []", "The program should print the three NEW stations, then ['NAGPUR', 'NANDED'] []"
