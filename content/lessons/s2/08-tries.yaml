concept: s2.tries
minutes: 90
claim: You can store a set of words in a trie, with one node for each distinct beginning, look up a word or a beginning in steps proportional to its length however many words are stored, list every word with a given beginning in alphabetical order, and find the longest stored word at the start of a text, as autocomplete boxes and tokenisers do.
recalls: [s2.heaps-and-priority-queues]
uses: [s2.hash-tables, s2.binary-search-trees, s2.linked-lists, f2.induction-and-strong-induction, f2.loop-invariants, s1.recursion, s1.classes-and-objects, s0.dictionaries-and-sets, s0.strings, s0.loops, s0.functions]
leads: [s2.graphs-and-their-representations, f3.counting-with-products-and-sums, s3.binary-search, s7.tokenising, s7.regular-expressions-and-finite-automata]
starter: |
  # Scratch space. A booking site suggests station names as you type.
  # This version checks every name against what has been typed so far.
  stations = ["NEW DELHI", "NEW JALPAIGURI", "NAGPUR", "NASIK ROAD", "NELLORE",
              "NEW BONGAIGAON", "NAGERCOIL", "NANDED", "NEW TINSUKIA", "NARKATIAGANJ"]
  typed = "NEW"
  checked = 0
  matches = []

  for name in stations:
      checked += 1
      if name[:len(typed)] == typed:
          matches.append(name)

  print(matches)
  print("names checked:", checked)
parts:
  recall:
    - text: |
        [[s2.heaps-and-priority-queues]] made one question about order as cheap as possible, which is the smallest, by refusing to answer any other. Every structure so far has compared whole keys with each other. Today's structure never compares two keys at all: it reads a key one letter at a time. Three quick pulls first.
  puzzle:
    - text: |
        A railway booking site has a box marked "From". As you type, it lists every station whose name begins with what you have typed so far: type N, E, W and it offers New Delhi, New Jalpaiguri, New Bongaigaon and New Tinsukia. Indian Railways has more than 7,000 stations, and at busy times a lakh of people are typing at once, so the list must be ready after every keystroke.

        Run the starter. It checks all ten of its names on every keystroke, and the real site would check all 7,000. The cost grows in step with the number of stations, and most of the work is spent rejecting names that begin with B or K.

        What about the structures you have? A hash table finds an exact name in a few steps, but "NEW" is not a name, and hashing scatters New Delhi and New Jalpaiguri to unrelated buckets on purpose. A balanced search tree does better: the names beginning with NEW sit together in order, between "NEW" and "NEX", so a floor search and an in-order walk find them. But each of its $\log_2 n$ comparisons reads two names letter by letter from the start, and names that share a long beginning are compared over that beginning again and again.

        **Is there a structure in which finding everything that begins with what has been typed costs steps that depend only on the length of what was typed, and not at all on how many names are stored?**
  intuition:
    - text: |
        India Post solved this problem in 1972 with the PIN code. A PIN has six digits, and they are read from the left. The first digit names one of the large postal regions: 1 is the north, covering Delhi, Haryana, Punjab and the hill states. The first two digits name a sub-region, and 11 is Delhi. The first three name a sorting district, and the last three a single post office: 110001 is the head post office in New Delhi.

        A sorting office never compares one PIN with another. It reads the first digit and drops the letter into one of a few bags. The next office along reads the second digit and chooses among its bags, and so on. After six readings the letter is at its post office, whether India has a thousand post offices or a lakh and a half. And every letter for anywhere in Delhi passes through the same bag marked 11, so "everything that begins with 11" is simply the contents of one bag.

        Arrange words in the same way. Start at a root. Each letter of a word chooses a branch, so each word is a path from the root, and words that begin alike share the start of their paths. Mark the places where a word ends, because a path can pass through a word on its way to a longer one: IN lies on the way to INN. This arrangement is called a **trie**, from re**trie**val, and usually pronounced "try".

        The figure shows a trie of seven words. Type a beginning with the letter buttons, and add or remove words with the stepper.
    - figure: trie
      props: { prefix: "TE" }
    - text: |
        The seven words have 20 letters between them, but the trie has only 11 nodes, counting the root, because TEA, TEN and TENT share T and E, and IN, INN and INK share I and N. Typing T and E follows two links and reaches a node whose branches hold exactly the words beginning with TE. Typing T, O, N stops after TO, which has no branch for N: no word begins with TON, and the trie knew it after three steps.
  derivation:
    - text: |
        **A node.** Each node holds a dictionary, from [[s0.dictionaries-and-sets]], that maps a letter to the child reached by that letter, and a flag saying whether a word ends here.

        ```python
        class TrieNode:
            def __init__(self):
                self.children = {}
                self.end = False
        ```

        A node does not store its own letters. Its beginning is spelled by the letters on the path from the root to it, so the root stands for the empty beginning. The flag matters because a node exists for every beginning of every stored word, whether or not that beginning is a word itself. If the trie holds only INN, there is a node for IN, and its flag says that IN was never stored.

        **Insertion and lookup.** Both walk down from the root, one letter at a time.

        ```python
        class TrieNode:
            def __init__(self):
                self.children = {}
                self.end = False

        class Trie:
            def __init__(self):
                self.root = TrieNode()

            def insert(self, word):
                node = self.root
                for letter in word:
                    if letter not in node.children:
                        node.children[letter] = TrieNode()
                    node = node.children[letter]
                node.end = True

            def find(self, text):
                node = self.root
                for letter in text:
                    if letter not in node.children:
                        return None
                    node = node.children[letter]
                return node

            def contains(self, word):
                node = self.find(word)
                return node is not None and node.end
        ```

        The loop in `find` keeps an invariant in the sense of [[f2.loop-invariants]]: *after reading the first $k$ letters, `node` is the node for the first $k$ letters of `text`*. If some letter has no branch, no stored word begins with `text`, and `find` returns `None`. Otherwise it returns the node for `text`, and a beginning is present exactly when `find` returns a node. Whether it is a whole word is the flag's business.

        **What it costs.** A word of $L$ letters takes $L$ steps down, each a dictionary lookup, which costs a constant on average by [[s2.hash-tables]]. That is the whole cost. The number of words stored, $n$, does not appear: a trie of ten words and a trie of a crore words look up "TENT" in four steps each.

        | Question | Hash table | Balanced search tree | Trie |
        | --- | --- | --- | --- |
        | is this exact word stored? | about $L$, to compute the hash | about $\log_2 n$ comparisons, each up to $L$ letters | $L$ steps |
        | which words begin with this? | must look at every word | a floor search, then an in-order walk | $L$ steps, then the words below |
        | list all words alphabetically | must sort them | an in-order walk | a walk in letter order |

        **How many nodes.** Each node other than the root is the end of a path that spells some beginning of a stored word, and different nodes spell different beginnings. So the number of nodes is one more than the number of distinct non-empty beginnings, which is at most the total number of letters in all the words. The trie saves exactly the letters that words share at their starts. Strings over 26 letters can begin in $26^L$ ways at length $L$, and how such counts multiply is the subject of [[f3.counting-with-products-and-sums]].
    - question:
        id: derivation-count-nodes
        type: numeric
        system: s2
        prompt: |
          A trie holds CAT, CAR, CART and DOG. How many nodes does it have, counting the root?
        answer: "9"
        explanation: |
          Count the distinct beginnings: C, CA, CAT, CAR, CART, D, DO, DOG. That is 8, and the root makes 9. The 13 letters of the four words need only 8 nodes below the root, because CAT, CAR and CART share C and A, and CART also shares CAR.
    - question:
        id: order-insert
        type: order
        system: s2
        prompt: |
          A trie holds TEN. Put the steps of inserting TENT in order.
        steps:
          - "Start at the root."
          - "The root has a branch for T: follow it."
          - "That node has a branch for E: follow it."
          - "That node has a branch for N: follow it, reaching the node for TEN, whose flag is already set."
          - "That node has no branch for T, so make a new node and follow the new branch to it."
          - "The letters are used up, so set the new node's flag: TENT ends here."
        explanation: Insertion follows existing branches as long as they exist, and creates nodes only for the part of the word that is new. Here only one node is created. The flag on TEN is left alone, so TEN remains a word in its own right, now also a beginning of TENT.
    - text: |
        **Every word with a given beginning.** Walk down to the node for the beginning with `find`, and then collect every word below it. Collecting is recursion, as in [[s1.recursion]]: a node contributes its own word, if its flag is set, and then the words of each of its children, with the child's letter added.

        ```python
        def words_below(node, prefix, found):
            if node.end:
                found.append(prefix)
            for letter in sorted(node.children):
                words_below(node.children[letter], prefix + letter, found)
        ```

        Visiting a node before its children, and the children in alphabetical order of their letters, lists the words in **alphabetical order**. A word comes before its own extensions, TEN before TENT, as a dictionary has it. And everything below the branch for A comes before everything below the branch for N, so TEA comes before TEN. Induction on the height of the subtree, from [[f2.induction-and-strong-induction]], turns this into a proof, just as it did for the in-order walk of [[s2.binary-search-trees]].

        The cost is the walk down, $L$ steps, plus the nodes below, which number at most the letters of the words found. The other stations are never touched. A real autocomplete box usually wants only the few most popular matches, not all of them, and keeps at each node a short list of the best words below it, worked out when the words are inserted.

        **The longest word at the start of a text.** A different question turns up in two very different places. A compiler, reading program text, must split it into words, and a language model's tokeniser must split text into pieces from its vocabulary. Both usually take the **longest** vocabulary word that begins the remaining text. A router forwarding a packet looks up the longest stored beginning of the destination address. In a trie this is one walk. Follow the text's letters down from the root for as long as branches exist, and remember the last node passed whose flag was set. When the walk stops, that remembered node marks the longest stored word that begins the text. Then the tokeniser cuts that word off and starts again from the root.

        With the vocabulary un, under, understand, stand, standing and ing, the text "understanding" walks down u, n, d, e, r, s, t, a, n, d, passing flags at "un", "under" and "understand", and then finds no branch for i. So the first piece is "understand", the walk restarts at "ing", and the text splits as understand and ing. You will meet this in [[s7.tokenising]], and you will see there that a trie is the simplest of the machines of [[s7.regular-expressions-and-finite-automata]].

        **Variations.** A node with a single child is wasteful, and long words make long chains of them. A **compressed trie**, or radix tree, merges each such chain into one branch labelled with a whole string; routers and many databases use them. A trie can branch on digits, as the PIN code does, or on the bits of a number, two branches per node. And a sorted list of words offers a halving search for beginnings, met in [[s3.binary-search]], which uses far less memory than a trie when the words rarely change. In Python each trie node carries a whole dictionary, so a trie of a lakh of words can use many megabytes; tries win on speed and on questions about beginnings, not on memory.
  formal:
    - text: |
        **Trie.** A tree whose root stands for the empty string, in which each branch is labelled with a letter, the branches from one node have different letters, and each node stands for the string spelled on the path to it. A flag at each node marks whether that string is a stored word.

        **Lookup and insertion.** Follow, or create, the branch for each letter in turn: $L$ steps for a word of length $L$, independent of the number of words $n$.

        **Size.** One node for each distinct beginning of a stored word, plus the root: at most one more than the total number of letters.

        **Beginnings.** The words beginning with $p$ are exactly the flagged nodes below the node for $p$. Visiting a node before its children, and children in letter order, lists them alphabetically.

        **Longest match.** Walk the text's letters from the root, remembering the last flagged node; when no branch continues, that node is the longest stored word beginning the text.
