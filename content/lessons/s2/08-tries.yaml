        type: numeric
        system: s1
        prompt: |
          A trie holds 1 crore words. How many links does looking up a 7-letter word follow?
        answer: "7"
        explanation: One link for each letter. The number of words stored does not matter.
    - question:
        id: drill-nodes-tea-ten
        type: numeric
        system: s1
        prompt: |
          A trie holds TEA and TEN. How many nodes does it have, counting the root?
        answer: "5"
        explanation: The root, T, TE, TEA and TEN. The two words share T and E.
    - question:
        id: drill-new-nodes
        type: numeric
        system: s1
        prompt: |
          A trie holds TEN. How many new nodes does inserting TENT create?
        answer: "1"
        explanation: T, E and N are already there; only the final T is new.
    - question:
        id: drill-flag
        type: choice
        system: s1
        prompt: |
          A trie holds only INN. `find("IN")` returns a node. Is IN a stored word?
        options: ["No: the node exists because IN begins INN, but its flag is not set", "Yes: find returned a node", "Yes: every beginning of a stored word is stored", "It cannot be told from the trie"]
        answer: 0
        explanation: A node exists for every beginning of every stored word. Only the flag says whether the beginning was itself inserted.
    - question:
        id: drill-order
        type: choice
        system: s1
        prompt: |
          Visiting each node before its children, and the children in letter order, in what order are TO, TEA, TENT and TEN listed?
        options: ["TEA, TEN, TENT, TO", "TO, TEA, TEN, TENT", "TEN, TEA, TENT, TO", "TEA, TENT, TEN, TO"]
        answer: 0
        explanation: Everything below TE comes before TO, since E comes before O. Below TE, the A branch comes before the N branch, and TEN is listed at its own node before TENT, which is below it.
    - question:
        id: drill-children
        type: numeric
        system: s1
        prompt: |
          The words use only the 26 lowercase English letters. At most how many children can one node have?
        answer: "26"
        explanation: One branch for each letter that can come next.
    - question:
        id: drill-hash-prefix
        type: choice
        system: s1
        prompt: |
          Why can a hash table not list the stored words that begin with NEW without looking at all of them?
        options: ["A good hash function scatters keys, so words that begin alike land in unrelated buckets", "A hash table can hold only short keys", "A hash table keeps its keys sorted, but backwards", "Hashing NEW raises an error"]
        answer: 0
        explanation: A hash table is designed so that similar keys do not collide. That same design means nothing about a key's bucket reveals its beginning.
    - question:
        id: predict-trie
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          class TrieNode:
              def __init__(self):
                  self.children = {}
                  self.end = False

          root = TrieNode()
          for word in ["IN", "INN", "INK"]:
              node = root
              for letter in word:
                  if letter not in node.children:
                      node.children[letter] = TrieNode()
                  node = node.children[letter]
              node.end = True

          below_in = root.children["I"].children["N"]
          print(sorted(below_in.children), below_in.end, root.children["I"].end)
        output: "['K', 'N'] True False"
        explanation: The node for IN has branches for K and N, leading to INK and INN. IN was inserted, so its flag is set. I was never inserted, so the node for I has its flag clear.
    - question:
        id: predict-below
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          class TrieNode:
              def __init__(self):
                  self.children = {}
                  self.end = False

          def add(root, word):
              node = root
              for letter in word:
                  if letter not in node.children:
                      node.children[letter] = TrieNode()
                  node = node.children[letter]
              node.end = True

          def words_below(node, prefix, found):
              if node.end:
                  found.append(prefix)
              for letter in sorted(node.children):
                  words_below(node.children[letter], prefix + letter, found)

          root = TrieNode()
          for word in ["TO", "TENT", "TEA", "TEN"]:
              add(root, word)
          found = []
          words_below(root.children["T"].children["E"], "TE", found)
          print(found)
        output: "['TEA', 'TEN', 'TENT']"
        explanation: The walk starts at the node for TE, which is not a word. Its children are A and N, visited in that order. TEA is found below A. Below N, TEN is listed at its own node before its child gives TENT. TO is not below TE, so it is never reached.
