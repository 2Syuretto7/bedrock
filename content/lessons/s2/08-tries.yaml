          Where the walk stops is not the answer. In "undo" the walk gets through u, n and d, because "under" begins that way, but "und" is not a word, so the answer is the last place a flag was passed, "un". That is why the walk must remember the last flagged position and keep going, rather than returning at the first flag, which would give "un" for "understanding" too. Trying every beginning of the text from the longest down also finds the answer, but starts a new walk for each length, thousands of walks for a long text, where one walk of at most the longest word's length is enough.
    - question:
        id: work-pin-nodes
        type: numeric
        system: s2
        prompt: |
          A trie stores the 99 PIN codes from 110001 to 110099 as strings of six digits. How many nodes does it have, counting the root?
        answer: "114"
        explanation: |
          Count the distinct beginnings by length. Lengths 1 to 4 have one each, 1, 11, 110 and 1100, which makes 4. Length 5 has ten, 11000 to 11009. Length 6 has the 99 codes themselves. That is $4 + 10 + 99 = 113$ beginnings, and the root makes 114, against $6 \cdot 99 = 594$ digits written out separately.
    - question:
        id: work-which
        type: choice
        system: s2
        prompt: |
          A spelling checker only ever asks one question: is this exact word in a dictionary of 5 lakh words? Memory is tight. Which structure fits best?
        options:
          - "A hash table, such as a Python set: each lookup costs about the word's length, and it stores each word once without a dictionary in every node."
          - "A trie, because it is the only structure whose lookups do not depend on the number of words."
          - "A balanced search tree, because it keeps the words in alphabetical order."
          - "A min-heap of the words, since the smallest word is at the root."
        answer: 0
        explanation: |
          For exact lookups a hash table and a trie cost about the same, a number of steps proportional to the word's length, but the hash table needs far less memory than a trie whose every node carries its own dictionary. The trie earns its memory only when questions are about beginnings: suggestions as you type, the longest match, or listing words in order. Choose the structure for the questions you will ask.
  connections:
    - text: |
        The puzzle asked for a way to find every station beginning with what has been typed, at a cost that depends only on what was typed. A trie stores each word as a path of letters from a root, so words that begin alike share their beginnings. Typing walks one link per letter, whatever the number of stations, and the matching names are exactly the words below the node reached. Every step reads one letter and chooses a branch, as a PIN sorting office reads one digit and chooses a bag. Nothing is ever compared with a whole key.

        Two more uses came free. A walk that visits a node before its children, and children in letter order, lists the words alphabetically. And a walk that remembers the last flagged node finds the longest stored word at the start of a text, the question asked by compilers, by the tokenisers of language models, and by every router on the internet.

        Every structure in this cluster so far has been a list or a tree: one way in at the top, and exactly one route from there to each item. Much of the world is not shaped like that. Roads join towns in loops, friendships run in every direction, and web pages link back to pages that linked to them. Such a web of connections is a graph, and the first question about a graph is how to store it so that the questions you will ask are cheap: [[s2.graphs-and-their-representations]].
