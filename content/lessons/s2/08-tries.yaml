          print(complete(trie, "NEW"))
          print(complete(trie, "NA"), complete(trie, "X"))
        solution: |
          class TrieNode:
              def __init__(self):
                  self.children = {}
                  self.end = False

          class Trie:
              def __init__(self):
                  self.root = TrieNode()

              def insert(self, word):
                  node = self.root
                  for letter in word:
                      if letter not in node.children:
                          node.children[letter] = TrieNode()
                      node = node.children[letter]
                  node.end = True

          def collect(node, prefix, found):
              if node.end:
                  found.append(prefix)
              for letter in sorted(node.children):
                  collect(node.children[letter], prefix + letter, found)

          def complete(trie, prefix):
              node = trie.root
              for letter in prefix:
                  if letter not in node.children:
                      return []
                  node = node.children[letter]
              found = []
              collect(node, prefix, found)
              return found

          trie = Trie()
          for name in ["NEW DELHI", "NAGPUR", "NEW JALPAIGURI", "NELLORE", "NEW TINSUKIA", "NANDED"]:
              trie.insert(name)
          print(complete(trie, "NEW"))
          print(complete(trie, "NA"), complete(trie, "X"))
        tests: |
          import random
          random.seed(17)
          for _trial in range(80):
              _words = set("".join(random.choice("ABCD") for _ in range(random.randint(1, 6))) for _ in range(random.randint(1, 25)))
              _t = Trie()
              for _w in _words:
                  _t.insert(_w)
              for _p in ["", "A", "B", "AB", "CA", "DDD", "ABCD", "Z"]:
                  _want = sorted(_w for _w in _words if _w[:len(_p)] == _p)
                  _got = complete(_t, _p)
                  assert _got == _want, "With " + str(sorted(_words)) + " stored, complete(trie, " + repr(_p) + ") should be " + str(_want) + ", not " + str(_got)
          _looks = [0]
          class _Counted:
              def __init__(self):
                  self._kids = {}
                  self.end = False
              @property
              def children(self):
                  _looks[0] += 1
                  return self._kids
          _real = TrieNode
          TrieNode = _Counted
          _t = Trie()
          for _i in range(3000):
              _t.insert("Z" + str(_i))
          for _w in ["MANGO", "MANGROVE", "MANY", "MAP"]:
              _t.insert(_w)
