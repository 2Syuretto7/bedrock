            print(['Esha', 'Farhan', 'Gopal'], ['Asha', 'Esha'])
        explanation: |
          Walk two steps: for each friend, for each of that friend's friends. Every time you arrive at someone, one more of `person`'s friends knows them, so count arrivals in a dictionary. Skip `person`, whom every friend leads back to, and anyone already a friend. To rank, sort pairs whose first item is the **negated** count, so that larger counts come first, and whose second is the name, which breaks ties alphabetically. The work is the sum of the degrees of `person`'s friends, however large the whole network.
    - question:
        id: work-space
        type: numeric
        system: s2
        prompt: |
          A network has 1 crore users, and each has exactly 100 friends. The adjacency matrix has one entry for every ordered pair of users; the adjacency lists hold one name for each friend of each user. How many times more entries has the matrix than the lists?
        answer: "100000"
        explanation: |
          The matrix has $(10^7)^2 = 10^{14}$ entries. The lists hold $10^7 \times 100 = 10^9$ names. The matrix is larger by $10^{14} / 10^9 = 10^5$, a factor of a lakh, and all of the difference is entries saying that two people are not friends.
    - question:
        id: work-which-form
        type: choice
        system: s2
        prompt: |
          An airline's computer holds 200 airports, and there is a direct flight between almost every pair. Nearly every question it is asked is "is there a direct flight from X to Y?", millions of times a day. Which representation fits best?
        options:
          - "An adjacency matrix: with almost every pair joined it wastes little room, and each question is one look."
          - "An edge list, because it is the simplest."
          - "Adjacency lists, because they are always the better choice."
          - "No stored representation: work out the flights each time from a function."
        answer: 0
        explanation: |
          This graph is dense, with close to $200 \cdot 199 / 2 = 19{,}900$ edges, so the matrix's $40{,}000$ entries are mostly 1s and waste little room. And the question asked is exactly the one a matrix answers in one look. Adjacency sets would also answer it quickly, but lists would need a scan, and an edge list would need a scan of everything. Adjacency lists are the usual choice for sparse graphs, not for every graph.
    - question:
        id: work-followers
        type: choice
        system: s2
        prompt: |
          A photo-sharing site stores, for each user, the set of accounts that user follows. A new feature must show any user, instantly, who follows them. What should the site do?
        options:
          - "Also store, for each user, the set of their followers, the reverse graph, and update both sets whenever someone follows or unfollows."
          - "Read every user's set of follows each time the feature is used."
          - "Switch to an adjacency matrix of all users."
          - "Make the graph undirected, so that following becomes mutual."
        answer: 0
        explanation: |
          With out-sets only, finding followers means reading every user's set, which touches the whole network for one question. Keeping the in-sets as well doubles the room, $2\lvert E \rvert$ names in all, and makes each follow or unfollow two updates, but answers the question in steps proportional to the number of followers. A matrix of every user would be impossibly large for a sparse graph, and making following mutual would change what the site means.
  connections:
    - text: |
        The puzzle asked how to store a network so that its questions are cheap without paying for every unconnected pair. A graph can be stored three ways. An edge list is the plainest and answers nothing quickly. An adjacency matrix answers "are these two joined?" in one look but takes room for every pair, $n^2$, and needs $n$ steps to list anyone's neighbours. Adjacency lists, a dictionary from each node to the set of its neighbours, take room in proportion to $n + \lvert E \rvert$ and list a node's neighbours in steps proportional to its degree; with sets they answer "joined?" in one look on average too. For the messaging app's sparse network of 50 crore users the lists are the only sensible choice, and "people you may know" is a walk of two steps through them.

        The handshake lemma, that the degrees add up to twice the number of edges, is the first theorem of graph theory, and the reason adjacency lists hold $2\lvert E \rvert$ names. Graphs model roads and railways, friendships and followers, web pages and their links, tasks and what they depend on, molecules, circuits, and the layers of a neural network. Most of the algorithms cluster is about searching them, which [[s3.breadth-first-and-depth-first-search]] begins.

        One question about a graph can be answered without any search, if the graph only ever gains edges. Villages are linked by new roads one at a time, and after each new road someone asks: can these two villages now reach each other? Searching the whole road network after every new road is far too slow. The next lesson keeps, for each village, a pointer towards a representative of its connected piece, and answers in a few steps: [[s2.union-find]].
