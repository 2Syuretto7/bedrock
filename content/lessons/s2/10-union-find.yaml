  work:
    - text: Slower now. After every operation, say which pointers changed, and which roots the items now lead to.
    - question:
        id: write-disjoint-sets
        type: code
        mode: write
        system: s2
        prompt: |
          Complete `find` and `union`. `find(x)` returns the root of `x`'s tree and points every item on the path directly at it. `union(a, b)` merges the two classes by pointing the root of the smaller tree at the root of the larger, keeps `tree_size` right at the roots, takes one off `sets`, and returns `True`; if `a` and `b` already share a root it changes nothing and returns `False`. The tests check the heights of the trees, so a plain union that ignores size will not pass.
        starter: |
