              _n = random.randint(1, 15)
              _roads = [(random.randrange(_n), random.randrange(_n)) for _ in range(random.randint(0, 25))]
              _label = list(range(_n))
              _want = []
              for _i, (_a, _b) in enumerate(_roads):
                  if _label[_a] == _label[_b]:
                      _want.append(_i)
                  else:
                      _old = _label[_a]
                      _label = [_label[_b] if _l == _old else _l for _l in _label]
              _got = extra_roads(_n, _roads)
              assert _got == _want, "For " + str(_n) + " villages and roads " + str(_roads) + ", the extra roads are at " + str(_want) + ", not " + str(_got)
          assert extra_roads(3, []) == [], "With no roads there are no extra roads"
          assert output.strip() == "[2, 6]", "The program should print [2, 6]"
