        solution: |
          class DisjointSets:
              def __init__(self, n):
                  self.parent = list(range(n))
                  self.tree_size = [1] * n
                  self.sets = n

              def find(self, x):
                  root = x
                  while self.parent[root] != root:
                      root = self.parent[root]
                  while self.parent[x] != root:
                      following = self.parent[x]
                      self.parent[x] = root
                      x = following
                  return root

              def union(self, a, b):
                  ra = self.find(a)
                  rb = self.find(b)
                  if ra == rb:
                      return False
                  if self.tree_size[ra] > self.tree_size[rb]:
                      ra, rb = rb, ra
                  self.parent[ra] = rb
                  self.tree_size[rb] += self.tree_size[ra]
                  self.sets -= 1
                  return True

          villages = DisjointSets(8)
          for a, b in [(0, 1), (1, 2), (2, 3), (4, 5), (5, 6), (3, 6), (6, 7)]:
              villages.union(a, b)
          print(villages.sets, villages.find(0) == villages.find(7), villages.union(2, 5))
        tests: |
          import random
          def _depth(ds, x):
              _d = 0
              while ds.parent[x] != x:
                  x = ds.parent[x]
                  _d += 1
              return _d
          random.seed(37)
          for _trial in range(120):
              _n = random.randint(1, 30)
              _ds = DisjointSets(_n)
              _label = list(range(_n))
              for _step in range(random.randint(0, 40)):
                  _a = random.randrange(_n)
                  _b = random.randrange(_n)
                  if random.random() < 0.5:
                      _want = _label[_a] != _label[_b]
                      _got = _ds.union(_a, _b)
                      assert _got == _want, "union(" + str(_a) + ", " + str(_b) + ") should return " + str(_want)
                      if _want:
                          _old = _label[_a]
                          _label = [_label[_b] if _l == _old else _l for _l in _label]
                  else:
                      assert (_ds.find(_a) == _ds.find(_b)) == (_label[_a] == _label[_b]), "find(" + str(_a) + ") and find(" + str(_b) + ") should " + ("" if _label[_a] == _label[_b] else "not ") + "be equal"
                  assert _ds.sets == len(set(_label)), "sets should be " + str(len(set(_label))) + ", not " + str(_ds.sets)
              for _x in range(_n):
                  _r = _ds.find(_x)
                  assert _ds.parent[_r] == _r, "find should return a root, an item that points to itself"
                  assert _ds.tree_size[_r] == _label.count(_label[_x]), "tree_size at a root should be the number of items in its class"
          _ds = DisjointSets(1024)
          for _i in range(1023):
              _ds.union(_i, _i + 1)
          _tallest = max(_depth(_ds, _x) for _x in range(1024))
          assert _tallest <= 10, "After joining 0 to 1, 1 to 2, and so on up to 1023, a tree is " + str(_tallest) + " links tall; joining the smaller tree under the larger keeps it at most 10"
          _ds = DisjointSets(8)
          for _a, _b in [(0, 1), (2, 3), (0, 2), (4, 5), (6, 7), (4, 6), (0, 4)]:
              _ds.union(_a, _b)
          _deep = max(range(8), key=lambda _x: _depth(_ds, _x))
          _path = [_deep]
          while _ds.parent[_path[-1]] != _path[-1]:
              _path.append(_ds.parent[_path[-1]])
          assert len(_path) >= 3, "Joining pairs, then pairs of pairs, should give a tree more than one link tall"
          _ds.find(_deep)
          assert all(_ds.parent[_p] == _path[-1] for _p in _path), "After find(" + str(_deep) + "), every item on its path should point straight at the root"
          assert output.strip() == "1 True False", "The program should print 1 True False"
