    - question:
        id: drill-wrong-pointer
        type: choice
        system: s1
        prompt: |
          Why does `union(a, b)` change the parent of $a$'s **root**, and not the parent of $a$ itself?
        options: ["Changing the root brings the whole of a's class along; changing a alone would separate a from the rest of its class", "Because a may not exist", "Because the root is always a smaller number", "It makes no difference which is changed"]
        answer: 0
        explanation: Every member of $a$'s class leads up to its root. Repointing the root makes all of them lead on to $b$'s root. Repointing $a$ moves $a$ alone and leaves the others where they were.
