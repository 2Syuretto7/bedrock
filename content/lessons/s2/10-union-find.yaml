        solution: |
          class DisjointSets:
              def __init__(self, n):
                  self.parent = list(range(n))
                  self.tree_size = [1] * n
                  self.sets = n

              def find(self, x):
                  root = x
                  while self.parent[root] != root:
                      root = self.parent[root]
                  while self.parent[x] != root:
                      following = self.parent[x]
                      self.parent[x] = root
                      x = following
                  return root

              def union(self, a, b):
                  ra = self.find(a)
                  rb = self.find(b)
                  if ra == rb:
                      return False
                  if self.tree_size[ra] > self.tree_size[rb]:
                      ra, rb = rb, ra
                  self.parent[ra] = rb
                  self.tree_size[rb] += self.tree_size[ra]
                  self.sets -= 1
                  return True

          def extra_roads(n, roads):
              villages = DisjointSets(n)
              extra = []
              for position, (a, b) in enumerate(roads):
                  if not villages.union(a, b):
                      extra.append(position)
              return extra

          print(extra_roads(6, [(0, 1), (1, 2), (0, 2), (3, 4), (4, 5), (2, 3), (5, 1)]))
        tests: |
