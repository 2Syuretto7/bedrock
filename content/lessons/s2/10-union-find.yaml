    - question:
        id: fix-union-roots
        type: code
        mode: find-bug
        system: s2
        prompt: |
          Villages 0 to 5 get the roads (0, 1), (2, 1), (0, 3) and (4, 5). Villages 2 and 3 are now connected, through 1 and 0, so the program should print `2 True`: two pieces, and 2 can reach 3. It prints `2 False`. Find the fault and fix it.
        starter: |
          class DisjointSets:
              def __init__(self, n):
                  self.parent = list(range(n))
                  self.tree_size = [1] * n
                  self.sets = n

              def find(self, x):
                  root = x
                  while self.parent[root] != root:
                      root = self.parent[root]
                  while self.parent[x] != root:
                      following = self.parent[x]
                      self.parent[x] = root
                      x = following
                  return root

              def union(self, a, b):
                  if self.find(a) == self.find(b):
                      return False
                  if self.tree_size[a] > self.tree_size[b]:
                      a, b = b, a
                  self.parent[a] = b
                  self.tree_size[b] += self.tree_size[a]
                  self.sets -= 1
                  return True

          villages = DisjointSets(6)
          for a, b in [(0, 1), (2, 1), (0, 3), (4, 5)]:
              villages.union(a, b)
          print(villages.sets, villages.find(2) == villages.find(3))
        solution: |
          class DisjointSets:
              def __init__(self, n):
                  self.parent = list(range(n))
                  self.tree_size = [1] * n
                  self.sets = n

              def find(self, x):
                  root = x
                  while self.parent[root] != root:
                      root = self.parent[root]
                  while self.parent[x] != root:
                      following = self.parent[x]
                      self.parent[x] = root
                      x = following
                  return root

              def union(self, a, b):
                  ra = self.find(a)
                  rb = self.find(b)
                  if ra == rb:
                      return False
                  if self.tree_size[ra] > self.tree_size[rb]:
                      ra, rb = rb, ra
                  self.parent[ra] = rb
                  self.tree_size[rb] += self.tree_size[ra]
                  self.sets -= 1
                  return True

          villages = DisjointSets(6)
          for a, b in [(0, 1), (2, 1), (0, 3), (4, 5)]:
              villages.union(a, b)
          print(villages.sets, villages.find(2) == villages.find(3))
