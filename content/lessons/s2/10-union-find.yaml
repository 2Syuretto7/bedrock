concept: s2.union-find
minutes: 90
claim: You can keep a collection of items split into groups that only ever merge, answer whether two items are in the same group and merge two groups in a few steps each, by storing each group as a tree of parent pointers, joining the smaller tree under the larger and compressing paths, prove that joining by size keeps every tree's height at most log2 n, and use the structure to count connected pieces and detect cycles as edges arrive.
recalls: [s2.graphs-and-their-representations]
uses: [f2.equivalence-relations-and-partial-orders, f2.induction-and-strong-induction, f2.loop-invariants, f1.logarithms, s2.arrays-and-dynamic-arrays, s2.balanced-search-trees, s1.classes-and-objects, s0.lists-and-tuples, s0.loops, s0.functions]
leads: [f3.counting-with-products-and-sums, f3.graph-theory-basics, s3.minimum-spanning-trees, s3.amortised-analysis, s3.breadth-first-and-depth-first-search]
starter: |
  # Scratch space. Villages 0 to 7, and new roads opening one at a time.
  # Every village carries the label of its connected piece,
  # and each new road relabels one whole piece.
  label = list(range(8))
  renamed = 0

  for a, b in [(0, 1), (1, 2), (2, 3), (4, 5), (5, 6), (3, 6), (6, 7)]:
      old = label[a]
      new = label[b]
      if old != new:
          for village in range(8):
              if label[village] == old:
                  label[village] = new
                  renamed += 1

  print(label, "renamed:", renamed)
  print("can 0 reach 7?", label[0] == label[7])
parts:
  recall:
    - text: |
        [[s2.graphs-and-their-representations]] ended with a question that seemed to need a search of the whole graph: can these two nodes reach each other? Today it is answered in a few steps, provided edges are only ever added. Three quick pulls first.
  puzzle:
    - text: |
        A state is building all-weather roads to connect its villages, under a rural roads scheme, and a new road opens somewhere every day. There are 40,000 villages. After each opening, the planning office is asked, many times over: can a lorry now get from this village to that one by road?

        Searching the road network from one village, as the algorithms cluster will teach, can cross the whole state, and doing it for every question is far too slow. The starter tries something cleverer. Each village carries the label of its connected piece, so the question is one comparison of labels. But a new road between two pieces must relabel every village of one of them, and the starter checks every village to find them: with 40,000 villages that is 40,000 checks for every road, and the relabelling itself can touch half the state.

        So one operation is cheap and the other is not. Asking is a single comparison; joining is a sweep.

        **Can both operations, "are these two in the same piece?" and "join these two pieces", be made to cost only a few steps each, however many villages there are?**
  intuition:
    - text: |
        Think of business groups. Every company is either independent or owned by another company, which may itself be owned by a third, and so on up to a company that nobody owns: the head of the group. To find which group a company belongs to, follow "owned by" upwards until you reach a company that nobody owns. Two companies are in the same group exactly when they lead to the same head.

        Now two groups merge. Nobody rewrites the records of every company in both groups. One head simply buys the other head, and a single line in a register changes. Every company in the bought group still reaches its old head, and that head now leads on, one step further, to the new one.

        Two habits keep this fast. When groups merge, let the **smaller** group's head be bought by the larger's, so that the long chains of ownership stay in the big group and only the few companies of the small group get one step further from the top. And when you have traced a company all the way up to its head, write the head's name directly into the records of every company you passed, so that next time each of them is one step from the top.

        The figure shows eight items joined by seven joins, each group a tree of pointers to its head. Step through the joins, then switch to joining the smaller tree under the larger, and watch the height of the tallest tree.
    - figure: union-find
      props: { find: 0 }
    - text: |
        Joining without looking at size, the seven joins built a tree of height 5, and finding 0's head followed five pointers, through 1, 2, 3, 6 and 7. Joining the smaller tree under the larger, the same joins built trees no taller than 2, and every item reaches its head in at most two steps.
  derivation:
    - text: |
        **What is being kept.** "Can reach by road" is an equivalence relation on villages, in the sense of [[f2.equivalence-relations-and-partial-orders]]: every village reaches itself, reaching goes both ways, and if $a$ reaches $b$ and $b$ reaches $c$ then $a$ reaches $c$. So the villages fall into **classes**, the connected pieces, and every village is in exactly one. A **union-find** structure, also called a disjoint-set structure, keeps such a partition of items $0$ to $n - 1$ under two operations:

        - `find(x)` returns a **representative** of the class of $x$, the same item for every member of the class, so that $x$ and $y$ are in the same class exactly when `find(x) == find(y)`.
        - `union(a, b)` merges the classes of $a$ and $b$ into one.

        The starter is the first attempt, a label for every item: `find` is one look, and `union` relabels a whole class. Joining $n$ items into one class one item at a time, in the worst order, relabels $1 + 2 + \dots + (n - 1)$ items, which is quadratic.

        **Trees of pointers.** Keep instead a list `parent`, in which each item points to another item of its class, and the pointers lead up a tree to a **root** that points to itself. The root is the representative.

        ```python
        parent = list(range(8))

        def find(x):
            while parent[x] != x:
                x = parent[x]
            return x

        def union(a, b):
            parent[find(a)] = find(b)
        ```

        At the start every item is its own root, a class of one. `union` changes **one** pointer, the root of $a$'s tree, which now points to the root of $b$'s tree, so every member of $a$'s class now leads to $b$'s root. Pointing $a$ itself at $b$ would not do: $a$ would leave its old class behind instead of bringing it along.

        `find` costs one step for each level it climbs, so its cost is the height of the tree. And nothing limits the height. The joins (0, 1), (1, 2), (2, 3) and so on build a single path, and a `find` from its bottom walks all $n - 1$ links. We have made `union` cheap by making `find` expensive.

        **Joining by size.** Keep, for each root, the number of items in its tree. In `union`, point the root of the **smaller** tree at the root of the larger, breaking ties either way.

        *Claim: then no tree ever has height more than $\log_2 n$.* Follow one item $x$. Its depth, the number of links from $x$ up to its root, increases only when $x$'s root is pointed at another root, and then by exactly 1. Joining by size means this happens only when $x$'s tree is no larger than the tree it joins, so the merged tree is at least **twice** the size of $x$'s old tree. So each time $x$ gets one link deeper, the size of $x$'s tree at least doubles. It starts at 1 and can never exceed $n$, so it can double at most $\log_2 n$ times, by [[f1.logarithms]]. Hence every depth is at most $\log_2 n$, and `find` follows at most about 20 links among ten lakh items. As an invariant, in the manner of [[f2.loop-invariants]] and [[f2.induction-and-strong-induction]]: *the tree containing $x$ has at least $2^{\text{depth}(x)}$ items.*

        This is the same bargain as the balanced trees of [[s2.balanced-search-trees]]: a cheap local rule, applied at every change, that keeps every tree short for ever.
    - question:
        id: derivation-doubling
        type: choice
        system: s2
        prompt: |
          With joining by size, why does an item's tree at least double in size every time the item gets one link further from its root?
        options:
          - "The item gets deeper only when its root is pointed at another root, which joining by size allows only when the other tree is at least as large, so the merged tree has at least twice the items."
          - "Because every union doubles the number of items in the structure."
          - "Because the item's own pointer is changed to point two levels higher."
          - "It does not; the size grows by one each time."
        answer: 0
        explanation: |
          Depth grows only when a whole tree is hung beneath another root, and only the smaller tree, or an equal one, is ever hung beneath. If the item's tree had $s$ items, the other had at least $s$, so together they have at least $2s$. A tree cannot grow beyond $n$ items, so an item can be pushed down at most $\log_2 n$ times.
    - text: |
        **Compressing paths.** One more habit makes the structure almost unbelievably fast. Every `find` walks from $x$ up to the root. Having found the root, walk the same path again and point every item on it **directly** at the root. The walk costs twice as much this once, and every later `find` from any of those items costs one step.

        ```python
        class DisjointSets:
            def __init__(self, n):
                self.parent = list(range(n))
                self.tree_size = [1] * n
                self.sets = n

            def find(self, x):
                root = x
                while self.parent[root] != root:
                    root = self.parent[root]
                while self.parent[x] != root:
                    following = self.parent[x]
                    self.parent[x] = root
                    x = following
                return root

            def union(self, a, b):
                ra = self.find(a)
                rb = self.find(b)
                if ra == rb:
                    return False
                if self.tree_size[ra] > self.tree_size[rb]:
                    ra, rb = rb, ra
                self.parent[ra] = rb
                self.tree_size[rb] += self.tree_size[ra]
                self.sets -= 1
                return True
        ```

        The second loop must save `self.parent[x]` before overwriting it, or it loses the way up. `tree_size` is only kept up to date at roots, which are the only places it is read. `sets` counts the classes, one fewer after each successful union. And `union` returns `False` when $a$ and $b$ were **already** in the same class, which turns out to be useful in its own right.

        With both joining by size and path compression, a long run of operations costs, on average, a number of steps per operation that grows with $n$ so slowly that the growing part is at most 4 for any $n$ smaller than the number of atoms in the universe. Robert Tarjan proved this in 1975. The proof is hard, and rests on averaging the cost over a whole sequence of operations, which is the idea of [[s3.amortised-analysis]]. In practice, treat each operation as costing a constant.
    - question:
        id: order-compress
        type: order
        system: s2
        prompt: |
          The list `parent` is `[1, 2, 3, 4, 4]`, a single path from 0 up to the root 4. Put the steps of `find(0)`, with path compression, in order.
        steps:
          - "First walk: from 0 follow the pointers to 1, 2, 3 and 4, and stop at 4, which points to itself. The root is 4."
          - "Second walk: at 0, save its parent 1, point 0 straight at 4, and move to 1."
          - "At 1, save its parent 2, point 1 at 4, and move to 2."
          - "At 2, save its parent 3, point 2 at 4, and move to 3."
          - "At 3, the parent is already 4, so stop and return 4, leaving parent as [4, 4, 4, 4, 4]."
        explanation: The first walk finds the root without changing anything. The second walks the same path and repoints each item at the root, saving each old parent first so as not to lose the way. Afterwards every item on the path is one step from the root, so the four links walked this time will never be walked again.
    - text: |
        **What it is used for.**

        - **Connected pieces as edges arrive.** Each new edge is a `union`, each question a pair of `find`s, and `sets` is the number of pieces at any moment. This is the puzzle's road network.
        - **Detecting a cycle.** When `union(a, b)` returns `False`, $a$ and $b$ were already connected, so the new edge closes a loop. A network designer who wants no redundant links, or a program checking that a graph is a tree, asks exactly this.
        - **Cheapest networks.** To connect every village at the least total cost, consider the possible roads from cheapest to dearest, and build each one unless its two ends are already connected. That rule, checked with union-find, gives the cheapest network of all, as [[s3.minimum-spanning-trees]] will prove.
        - **Grouping.** Pixels of an image that touch and share a colour, records that refer to the same person under different spellings, and data points closer than some distance can all be grouped by joining pairs and reading off the classes.

        Union-find has one firm limit: classes can merge but never split. If a road is washed away, the structure cannot tell whether the two halves are still connected by some other route, and the only general remedy is to rebuild from the remaining roads.
  formal:
    - text: |
        **Union-find (disjoint sets).** A partition of the items $0, \dots, n - 1$ into classes, with `find(x)`, a representative of $x$'s class, and `union(a, b)`, which merges two classes.

        **Representation.** A list `parent` in which each class is a tree of pointers ending at a root with `parent[r] == r`. `find` climbs to the root; `union` points one root at the other.

        **Joining by size.** Point the root of the smaller tree at the root of the larger. Invariant: the tree containing $x$ has at least $2^{\text{depth}(x)}$ items, so every height is at most $\log_2 n$.

        **Path compression.** After a `find`, point every item on the path directly at the root.

        **Cost.** With both, a sequence of $m$ operations costs a number of steps that grows only a hair faster than $m$; for any practical $n$, each operation is effectively constant.

        **Uses.** Connected pieces under added edges, cycle detection (`union` finds both ends already together), the cheapest connecting network, grouping. Classes cannot be split.
