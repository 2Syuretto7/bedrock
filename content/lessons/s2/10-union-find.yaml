        explanation: |
          A road is extra exactly when its two villages already share a root before it opens, and `union` reports precisely that by returning `False`. Checking afterwards is too late, since after any union the two ends are always together. Asking only whether both villages have been seen before is not enough either: in the example, the road (2, 3) at position 5 joins two villages that have both been seen, but they were in different pieces until then. The extra roads here are (0, 2), which closes the triangle 0, 1, 2, and (5, 1), which closes the loop 1, 2, 3, 4, 5.
    - question:
        id: work-relabel
        type: numeric
        system: s2
        prompt: |
          The labelling method of the starter joins 1000 villages with the roads (0, 1), (1, 2), (2, 3), and so on up to (998, 999), each time relabelling the whole piece of the road's first village. How many relabellings are made in all?
        answer: "499500"
        explanation: |
          The road $(i, i + 1)$ finds village $i$ in a piece of $i + 1$ villages, 0 to $i$, and relabels all of them. That is $1 + 2 + \dots + 999 = 999 \cdot 1000 / 2 = 499{,}500$, quadratic in the number of villages. Union-find by size makes the same 999 joins with at most two `find`s each, every one at most 10 links long, and in fact each of these joins hangs a single new village beneath the big tree's root.
    - question:
        id: work-cheapest
        type: choice
        system: s2
        prompt: |
          A district must connect all its villages by road at the least total cost. Engineers list every possible road with its cost and consider them from cheapest to dearest. Which rule, checked with union-find, decides whether to build each road?
        options:
          - "Build it unless its two villages are already connected, that is, unless their finds are equal."
          - "Build it if either of its villages has no road yet."
          - "Build every road that costs less than the average."
          - "Build it only if it does not change the number of pieces."
        answer: 0
        explanation: |
          A road between villages that can already reach each other adds cost and no new connection, and it would close a loop. Any other road joins two pieces, and taking the cheapest such road at each step turns out to give the cheapest network overall, a fact the algorithms cluster will prove. Requiring that a village has no road yet would refuse roads needed to join two pieces whose villages all have roads already.
    - question:
        id: work-split
        type: choice
        system: s2
        prompt: |
          A flood washes away one road. Why can union-find not simply undo that road's union?
        options:
          - "The two ends may still be connected by another route, and the trees of pointers record only which villages are together, not which roads hold them together."
          - "Because the road's union returned False."
          - "Because path compression made the tree too short."
          - "It can: point the road's first village back at itself."
        answer: 0
        explanation: |
          A class records that villages are connected, not why. The tree's pointers do not follow the roads; after joining by size and compressing paths, a village may point straight at a root many roads away. Whether the class must split depends on whether some other route survives, which needs the roads themselves and a search. Repointing one village at itself would split off that village, along with any villages whose pointers happen to pass through it, and neither has anything to do with which side of the broken road each village is on.
  connections:
    - text: |
        The puzzle asked for a way to answer "same piece?" and to join two pieces, each in a few steps. Union-find stores each piece as a tree of pointers ending at a root, its representative. A question is two climbs to the roots; a join repoints one root. Joining the smaller tree under the larger keeps every tree at most $\log_2 n$ tall, because an item gets deeper only when its tree at least doubles, and compressing paths flattens trees as they are used, until each operation costs, on average, a handful of steps for any $n$ that could ever exist. The 40,000 villages need a few steps per question, not 40,000.

        That completes the data structures cluster. You can now choose, for each job, how to store things: arrays and dynamic arrays for position, linked lists for cheap splicing, stacks and queues for order of arrival, hash tables for lookup by key, balanced search trees for order, heaps for the most urgent, tries for beginnings, graphs for connections, and union-find for growing groups. Each answers some questions cheaply by refusing to answer others, and each keeps an invariant that every operation restores before it returns.

        Every lesson also raised a counting question you answered by hand: how many links a list of $n$ items needs, how many keys can collide, how many keys an AVL tree of height $h$ must hold, how many nodes a trie of PIN codes has, how many edges a graph can have. The next cluster makes counting a subject of its own, with rules that settle such questions exactly, and later tools for growth that make the words constant, logarithmic, linear and quadratic precise. It begins with the two simplest rules of all: [[f3.counting-with-products-and-sums]].
