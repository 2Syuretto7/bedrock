    - question:
        id: write-top-k
        type: code
        mode: write
        system: s2
        prompt: |
          Write `top_k(scores, k)`, which returns the `k` largest of `scores`, largest first. `scores` may be an enormous stream read one item at a time, so keep a min-heap, with `heapq`, of at most `k` of the best scores seen so far, and never hold the whole stream: the tests watch how large your heap grows. You may assume there are at least `k` scores.
        starter: |
          import heapq

          def top_k(scores, k):
              return []

          print(top_k([212, 187, 254, 199, 276, 231, 168, 245], 3))
        solution: |
          import heapq

          def top_k(scores, k):
              best = []
              for score in scores:
                  heapq.heappush(best, score)
                  if len(best) > k:
                      heapq.heappop(best)
              result = []
              while len(best) > 0:
                  result.append(heapq.heappop(best))
              return result[::-1]

          print(top_k([212, 187, 254, 199, 276, 231, 168, 245], 3))
        tests: |
          import random
          _sizes = [0]
          _real_push = heapq.heappush
          _real_heapify = heapq.heapify
          def _watch_push(h, x):
              _real_push(h, x)
              _sizes[0] = max(_sizes[0], len(h))
          def _watch_heapify(h):
              _real_heapify(h)
              _sizes[0] = max(_sizes[0], len(h))
          heapq.heappush = _watch_push
          heapq.heapify = _watch_heapify
          random.seed(8)
          for _trial in range(150):
              _k = random.randint(1, 6)
              _scores = [random.randint(0, 300) for _ in range(random.randint(_k + 20, 80))]
              _want = sorted(_scores)[::-1][:_k]
              _sizes[0] = 0
              _got = top_k(iter(_scores), _k)
              assert _got == _want, "The " + str(_k) + " largest of " + str(_scores) + " are " + str(_want) + ", largest first, not " + str(_got)
              assert 0 < _sizes[0] <= _k + 1, "Keep a heap of at most k + 1 scores with heapq; yours held " + str(_sizes[0]) + " with k = " + str(_k)
          heapq.heappush = _real_push
          heapq.heapify = _real_heapify
          assert output.strip() == "[276, 254, 245]", "The program should print [276, 254, 245]"
        wrong:
          - |
            import heapq

            def top_k(scores, k):
                return sorted(scores)[::-1][:k]

            print([276, 254, 245])
          - |
            import heapq

            def top_k(scores, k):
                every = []
                for score in scores:
                    heapq.heappush(every, -score)
                result = []
                for _ in range(k):
                    result.append(-heapq.heappop(every))
                return result

            print([276, 254, 245])
          - |
            import heapq

            def top_k(scores, k):
                best = []
                for score in scores:
                    heapq.heappush(best, score)
                    if len(best) > k:
                        heapq.heappop(best)
                result = []
                while len(best) > 0:
                    result.append(heapq.heappop(best))
                return result

            print([276, 254, 245])
        explanation: |
          A **min**-heap of the best $k$ so far keeps the weakest of them at the root, which is exactly the one to throw out when a better score arrives. Push every score, and whenever the heap holds $k + 1$, pop the smallest: whatever leaves cannot be among the $k$ largest, since $k$ larger scores remain. Emptying the heap at the end gives the survivors smallest first, so reverse them. A max-heap of every score also finds the answer, but it holds the whole stream, which is what the stream was too large for. Sorting the whole stream has the same trouble.
    - question:
        id: work-build-15
        type: numeric
        system: s2
        prompt: |
          Fifteen values are built into a heap bottom-up, sifting down each node from the last one with a child back to the root. At most how many swaps can the whole build make?
        answer: "11"
        explanation: |
          Fifteen values make a full tree of height 3: 8 leaves, which do nothing, 4 nodes that can sift at most 1 level, 2 that can sift at most 2, and the root, which can sift at most 3. That is $4 + 4 + 3 = 11$, fewer than the 15 values. Pushing the same values one at a time could need $2 \cdot 1 + 4 \cdot 2 + 8 \cdot 3 = 34$ swaps, because most values land near the bottom with far to climb.
    - question:
        id: work-change-priority
        type: choice
        system: s2
        prompt: |
          A patient's condition gets worse while waiting, and the score must change from 6 to 2. The heap has no quick way to find where the patient's entry is. What is the usual remedy?
        options:
          - "Push a new entry with score 2 and leave the old one in the heap. When an entry is popped, skip it if that patient has already been seen."
          - "Search the list for the entry, change its score, and do nothing more."
          - "Sort the whole list after changing the score."
          - "Pop entries until the patient comes out, change the score, and push everything back."
        answer: 0
        explanation: |
          Pushing costs logarithmic time and needs no search. The patient now has two entries. The one with score 2 comes out first and the patient is seen; when the stale one with score 6 surfaces later, a record of who has been seen, such as a set, says to discard it. Changing the score in place without repairing would break the heap property, since 2 may now sit below a larger parent. Sorting costs far more than needed, and popping until the patient appears can be linear. The same trick of stale entries appears in the shortest-route algorithm of the algorithms cluster.
    - question:
        id: work-median
        type: choice
        system: s2
        prompt: |
          A cricket statistics site must show the median of all innings scores so far, after every new innings. Which arrangement handles each new score in logarithmic time?
        options:
          - "A max-heap of the lower half and a min-heap of the upper half, kept within one of each other in size, so the median is at the top of one or both."
          - "One min-heap of all the scores, since the median is at its root."
          - "One min-heap, popping half the scores to find the middle each time."
          - "A list kept sorted, inserting each new score in its place."
        answer: 0
        explanation: |
          The median separates the lower half from the upper half. With the lower half in a max-heap, its largest is on top, and with the upper half in a min-heap, its smallest is on top, so the middle values are at the two roots. A new score goes into one heap, and if the sizes now differ by two, one root moves across: a few pushes and pops, each logarithmic. A single min-heap has its minimum at the root, not its median, and popping half of it is linear. A sorted list gives the median at once but each insertion shifts up to half the list, which is linear.
  connections:
    - text: |
        The puzzle asked for an arrangement that keeps only the order needed to find the most urgent, cheaply and without links. The heap keeps a complete tree in a list, where a node's children and parent are found by arithmetic, and promises only that every parent is no larger than its children. That one promise puts the smallest at the root. Adding a value climbs one path and removing the smallest sinks along one, so both are logarithmic, and a whole heap can be built in linear time. A lakh of waiting patients need at most 16 swaps for each arrival or departure, not a lakh of looks.

        Notice what the heap gave up. A balanced search tree can find any key and list all of them in order. A heap cannot find a particular value without looking everywhere, and its list is not sorted. Choosing a data structure is choosing which questions to make cheap, and a heap makes one question as cheap as possible by refusing all the others.

        Priority queues are everywhere. Your phone's operating system keeps waiting tasks in one, as you will see in [[h2.scheduling]]. Route planners keep the places still to be explored in one, ordered by distance, in [[s3.shortest-paths]]. Many of the greedy methods of [[s3.greedy-algorithms]], which always take the best-looking choice next, run on a heap.

        So far every structure has compared whole keys with each other. But many keys are words: names, words of a dictionary, phone numbers, web addresses. Comparing two long words takes time in proportion to their length, and words that share a beginning, such as "rail", "railway" and "railways", are compared letter by letter again and again. The next structure branches on one letter at a time and stores each shared beginning once: [[s2.tries]].
