        explanation: |
          A node obeys the rule when its two subtrees' heights differ by at most 1, and a tree obeys it when every node does, so the check must reach every node, not just the root. The two questions, what is the height and is the rule kept, can be answered together. Ask each child for both at once: a number means the child's subtree is fine and has that height, and `None` means something below has already failed. If either child failed, the whole tree fails. Otherwise compare the two heights, and pass up one more than the larger. Each node is visited once, so the work grows in step with the number of nodes. Computing heights afresh at every node gives the same answers but visits each node once for every ancestor it has, about ten times over in a tree of a thousand keys. The same pattern, a recursive function that returns a summary of its subtree and lets the parent combine two summaries, will solve a great many tree problems.
    - question:
        id: work-fewest-5
        type: numeric
        system: s2
        prompt: |
          What is the fewest number of keys an AVL tree of height 5 can hold?
        answer: "20"
        explanation: |
          From $N(0) = 1$ and $N(1) = 2$: $N(2) = 4$, $N(3) = 7$, $N(4) = 12$, $N(5) = 1 + 12 + 7 = 20$. So any AVL tree with fewer than 20 keys has height at most 4. Compare a plain tree, which reaches height 5 with only 6 keys in a path, and the best possible tree, which needs 32 keys to be forced up to height 5.
    - question:
        id: work-rotations-per-insert
        type: choice
        system: s2
        prompt: |
          Why does one AVL insertion never need more than two rotations, however large the tree?
        options:
          - "After the repair at the lowest node that broke the rule, that subtree has the same height it had before the insertion, so no node above it sees any change in its subtrees' heights."
          - "Because an AVL tree's height is small, so there is never room for more."
          - "Because only the root can ever break the rule."
          - "Because each rotation fixes every node in the tree at once."
        answer: 0
        explanation: |
          The insertion made one subtree one level taller, and that is what tipped $z$. The rotation, or pair of rotations, at $z$ brings that part of the tree back to its old height. Every node above $z$ saw its subtrees' heights go up by one and come straight back down, so it is exactly as balanced as before the insertion. Removal is different: shortening a subtree can tip nodes all the way up, so it may need a rotation at each level.
    - question:
        id: work-which-tree
        type: choice
        system: s2
        prompt: |
          A database keeps an index of 50 crore customer records on a flash drive, where reading one 16-kilobyte block costs far more than comparing every key inside it. Which tree should the index be?
        options:
          - "A B-tree whose nodes each fill one block with hundreds of keys, so that a lookup reads only three or four blocks."
          - "An AVL tree, because its height is the smallest of any balanced tree."
          - "A red-black tree, because it needs the fewest rotations."
          - "A plain binary search tree, since the records arrive in random order."
        answer: 0
        explanation: |
          Any binary tree of 50 crore keys has at least 29 levels, and each level may be a separate block to read, so 29 slow reads or more. A B-tree with a thousand children per node reaches 50 crore within three levels. The comparisons inside a block cost almost nothing next to fetching it. The best tree depends on what is expensive: comparisons and links in memory favour binary trees, block reads favour wide ones.
  connections:
    - text: |
        The puzzle asked for a tree that repairs its own shape without breaking its order, cheaply. A rotation changes the shape and keeps the order, in three links. The AVL rule, that sibling subtrees differ in height by at most one, is checked locally, node by node, and after an insertion it is broken at no more than one place, repaired by one or two rotations. The rule cannot be kept by a tall thin tree: a tree of height $h$ needs at least $2^{h / 2}$ keys, so the height of $n$ keys is at most $2 \log_2 n$. Every search, insertion and removal costs logarithmic time, whatever order the keys arrive in.

        Notice the method. A data structure states an invariant strong enough to guarantee its costs, and each operation restores the invariant before it returns. You met the method in [[f2.loop-invariants]] as a way to prove loops right. Here it is a way to design them.

        Balanced trees are the ordered collections of the computing world. Red-black trees sit inside the standard libraries of Java and C++, and inside the Linux kernel, where they schedule processes and track memory. B-trees sit under almost every relational database and file system, chosen because they read few blocks. The counting behind the AVL bound is the start of a larger subject, the solving of recurrences, in [[f3.recurrences]].

        A search tree keeps **all** its keys in order and can answer any question about order. Many programs need much less. A hospital's emergency ward, a router's packet queue and a program's event loop only ever ask one question: which waiting item is the most urgent? For that one question there is a structure that is simpler than a search tree, needs no links at all, and lives entirely inside an array: [[s2.heaps-and-priority-queues]].
