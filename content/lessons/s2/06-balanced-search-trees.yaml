        prompt: |
          A tree has been read back from a file, without its stored heights, and must be checked before anyone trusts it. Write `checked_height(node)`, which returns the height of the subtree under `node`, with $-1$ for the empty tree, when every node in it obeys the AVL rule, and `None` when any node in it breaks the rule. Visit each node once, working upwards from the children's answers: the tests count the links you follow.
