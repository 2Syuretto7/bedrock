          _t = _build([3, 2, 1])
          assert _t.key == 2 and _check(_t), "Inserting 3, 2, 1 makes a line; one rotation puts 2 on top"
          _t = _build(range(1, 1001))
          assert _check(_t) and _keys(_t) == list(range(1, 1001)), "Inserting 1 to 1000 in order should keep the AVL rule everywhere and the keys in order"
          assert height(_t) <= 14, "An AVL tree of 1000 keys has height at most 14; yours has " + str(height(_t))
          _t = _build(range(1000, 0, -1))
          assert _check(_t) and height(_t) <= 14, "Inserting 1000 down to 1 should keep the AVL rule too"
