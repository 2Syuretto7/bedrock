concept: s2.balanced-search-trees
minutes: 100
claim: You can rotate a binary search tree's links without disturbing its order, keep an AVL tree's heights within one of each other by rotating after each insertion, prove that such a tree's height grows only logarithmically with the number of keys, and say when a red-black tree or a B-tree is the better choice.
recalls: [s2.binary-search-trees]
uses: [f2.induction-and-strong-induction, f2.loop-invariants, f1.logarithms, f1.exponents-and-exponential-growth, s1.recursion, s1.classes-and-objects, s2.arrays-and-dynamic-arrays, s0.lists-and-tuples, s0.loops, s0.functions]
leads: [s2.heaps-and-priority-queues, f3.recurrences, f3.trees-and-their-properties, s3.binary-search]
starter: |
  # Scratch space. The fewest keys an AVL tree of each height can hold.
  fewest = [1, 2]
  for h in range(2, 20):
      fewest.append(1 + fewest[h - 1] + fewest[h - 2])
  for h in [5, 10, 15, 19]:
      print("height", h, "needs at least", fewest[h], "keys")
parts:
  recall:
    - text: |
        [[s2.binary-search-trees]] ended with a tree that the order of arrival can ruin: keys that arrive sorted turn it into a path, and every search walks the whole of it. Today the tree learns to repair its own shape as it grows. Three quick pulls first.
  puzzle:
    - text: |
        A stock exchange keeps the buy orders for a share in a search tree ordered by price and time, so that it can find the best order at once and every order in a price range. Orders arrive all day, and their times only ever increase. Fed to a plain binary search tree in that order, the tree becomes a path, and by the afternoon a lookup that should take 20 comparisons takes a lakh.

        You cannot shuffle the input, because the orders arrive one at a time and must be searchable the moment they arrive. You cannot rebuild the tree from scratch after each order, because that costs time in proportion to the number of orders, every time.

        So the tree must fix itself as it goes, and the fixing must be cheap: no more work per insertion than the walk down the path that the insertion already does. And whatever it does to the shape, it must never break the order, or the tree stops being a search tree.

        **Can a tree change its shape without changing its order? And what rule about its shape, cheap to keep, would guarantee a short height for ever?**
  intuition:
    - text: |
        Thread beads on a string in order, 10, 20, 30, 40, 50, and hold the string up by the bead 10. Everything hangs down to one side, a path. Now pick the string up by the bead 30 instead. 10 and 20 hang on one side, 40 and 50 on the other. The beads have not moved along the string. Their order is untouched. Only the place you hold has changed, and with it the shape.

        That is a **rotation**. It takes a node and its child and swaps which of them is on top, passing one subtree across from the child to the node so that everything stays in order. It changes three links. It never changes the in-order walk, so a search tree stays a search tree.

        The second idea is a rule about shape that is easy to check locally: **at every node, the two subtrees may differ in height by at most one**. A shopkeeper's scale with two pans is allowed to tip a little, not a lot. Each insertion may tip some of the scales on the path it walked. Walking back up that path, a rotation at the first scale that tips too far levels it again.

        The figure starts from the fifteen keys inserted in sorted order, with rebalancing on. Press the button to stop rebalancing and see the path come back. Then add keys one at a time with rebalancing on, and watch how few rotations each insertion needs.
    - figure: search-tree
      props: { sorted: true, balance: true, target: 45 }
    - text: |
        In sorted order with no rebalancing, the fifteen keys make a path of height 14. With a rotation wherever a node's subtrees differ by two, the same keys in the same order make the bushiest tree possible, of height 3, and a search for any key makes at most 4 comparisons. Eleven rotations did it: fewer than one for each insertion.
  derivation:
    - text: |
        **A rotation.** Take a node $y$ whose left child is $x$. Call $x$'s subtrees $A$ and $B$, and $y$'s right subtree $C$. The search-tree invariant says the keys are ordered

        $$A < x < B < y < C,$$

        meaning every key in $A$ is less than $x$, and so on. A **right rotation** at $y$ makes $x$ the top of this part of the tree, with $y$ as its right child, and hands $B$ across to become $y$'s left subtree:

        ```text
              y                x
             / \              / \
            x   C    ==>     A   y
           / \                  / \
          A   B                B   C
        ```

        Read both shapes in order, left subtree before node before right subtree, and you get $A, x, B, y, C$ both times. The order is the same; only the shape differs. $A$ has moved up a level and $C$ down one. A **left rotation** is the mirror image, and undoes a right one.

        ```python
        def rotate_right(y):
            x = y.left
            y.left = x.right
            x.right = y
            update(y)
            update(x)
            return x
        ```

        Three links change, whatever the size of the tree, so a rotation costs a constant number of steps. Each node stores its own height, and `update` recomputes it from its children's: one more than the larger. The order of the two updates matters. After the rotation $y$ is below $x$, so $y$'s height must be correct before $x$'s is worked out from it. The function returns the new top, and the caller stores it in whichever link used to point at $y$, exactly as recursive insertion did in the last lesson.
    - question:
        id: derivation-rotation
        type: choice
        system: s2
        prompt: |
          In a right rotation at $y$, the subtree $B$, which was the right subtree of $y$'s left child $x$, becomes the left subtree of $y$. Why is that the right place for it?
        options:
          - "Every key in $B$ is greater than $x$ and less than $y$. After the rotation $y$ is the right child of $x$, so $y$'s left subtree is exactly the place for keys between $x$ and $y$."
          - "$B$ is always empty in a rotation, so it can go anywhere."
          - "It keeps the heights equal, and the order does not matter in a balanced tree."
          - "$B$ must move up a level so that the tree becomes shorter."
        answer: 0
        explanation: |
          Before the rotation $B$ sat to the right of $x$ and inside $y$'s left subtree, so its keys lie between $x$ and $y$. After it, the region between $x$ and $y$ is $y$'s left subtree, since everything there is right of $x$ and left of $y$. Putting $B$ anywhere else would break the invariant. $B$ stays at the same depth: it was two links below $y$'s old position and is two links below $x$'s new one.
    - text: |
        **The AVL rule.** In 1962 Georgy Adelson-Velsky and Evgenii Landis proposed this invariant, and trees that keep it are called **AVL trees**:

        > At every node, the heights of the left and right subtrees differ by at most 1.

        The empty tree counts as height $-1$, so a node with one child that is a leaf is fine, and a node with one child that has a child of its own is not.

        **Why the rule keeps the height small.** Let $N(h)$ be the fewest keys an AVL tree of height $h$ can hold. A tree of height 0 is one node, and one of height 1 needs two, so $N(0) = 1$ and $N(1) = 2$. A tree of height $h$ has a root and two subtrees, one of height $h - 1$, and the other, by the rule, of height at least $h - 2$. The fewest keys come from making each subtree as thin as allowed:

        $$N(h) = 1 + N(h - 1) + N(h - 2).$$

        That gives 1, 2, 4, 7, 12, 20, 33, 54, and the starter prints more. Each term is more than the sum of the two before it, like the Fibonacci numbers, and grows exponentially in the sense of [[f1.exponents-and-exponential-growth]].

        Here is a proof that is short enough to carry with you. Since $N(h - 1) \ge N(h - 2)$, the recurrence gives $N(h) > 2N(h - 2)$: going down two levels at least halves the count. By strong induction, as in [[f2.induction-and-strong-induction]], $N(h) \ge 2^{h / 2}$ for every $h$, since it holds at $h = 0$ and $h = 1$, and each step of two doubles. So a tree of $n$ keys and height $h$ has $n \ge 2^{h / 2}$, and taking logarithms as in [[f1.logarithms]],

        $$h \le 2 \log_2 n.$$

        A sharper count, using the golden ratio $1.618\ldots$ by which Fibonacci-like numbers grow, gives $h < 1.44 \log_2(n + 2)$. Ten lakh keys in an AVL tree have height at most 28, against 19 for the best possible tree and 9,99,999 for the worst plain one. Equations like the one for $N(h)$ get a lesson of their own in [[f3.recurrences]].

        **Restoring the rule after an insertion.** Insert as in a plain tree. Only the nodes on the path from the root down to the new key have changed subtrees, so only their heights can change, and only they can break the rule. Walk back up that path, which the recursive `insert` does for free as its calls return, updating each height. At the first node whose subtrees differ by 2, call it $z$, the new key went down the taller side. There are four ways it can have done so.

        | The new key went | Shape below $z$ | Repair |
        | --- | --- | --- |
        | left, then left | a line leaning left | one right rotation at $z$ |
        | right, then right | a line leaning right | one left rotation at $z$ |
        | left, then right | a bend | a left rotation at $z$'s left child, then a right rotation at $z$ |
        | right, then left | a bend | a right rotation at $z$'s right child, then a left rotation at $z$ |

        A line is straightened by one rotation. A bend must first be turned into a line, by rotating the child, and then straightened. After the repair, the subtree that $z$ headed has exactly the height it had **before** the insertion, so every node above it is as balanced as it was, and nothing more needs doing. An insertion therefore walks one path down, at most one path back up, and makes at most two rotations. Its cost is the height, which the rule keeps logarithmic. Removal is repaired the same way, though it may need a rotation at several nodes on the way up.
    - question:
        id: order-double
        type: order
        system: s2
        prompt: |
          An AVL tree holds 30, with 10 as its left child. Then 20 is inserted. Put the steps of the insertion and its repair in order.
        steps:
          - "Walk down: 20 is less than 30, go left; 20 is more than 10, go right; attach 20 as the right child of 10."
          - "Walking back up, 10 now has a right subtree of height 0 and an empty left one, a difference of 1, which is allowed."
          - "At 30, the left subtree has height 1 and the right is empty, a difference of 2: the rule is broken."
          - "The key went left, then right, a bend, so first rotate left at 10, making 20 the left child of 30 with 10 below it."
          - "Now the shape is a line leaning left, so rotate right at 30, making 20 the top with 10 and 30 as its children."
        explanation: The insertion is a plain one, and the heights are checked on the way back up. 10 is still within the rule, and 30 is the first node to break it. The path from 30 went left and then right, so a single rotation at 30 would only make a bend leaning the other way. Rotating 10 first lines the three keys up, and the second rotation puts the middle key, 20, on top. The order 10, 20, 30 is kept throughout.
    - text: |
        **The whole insertion.** Each node now carries its own height beside its key and its two links. With a function that recomputes a node's height and repairs it if needed, insertion is the plain recursive insertion with one change: each call returns the **rebalanced** subtree.

        ```python
        class Node:
            def __init__(self, key):
                self.key = key
                self.left = None
                self.right = None
                self.height = 0

        def rebalance(node):
            update(node)
            lean = height(node.left) - height(node.right)
            if lean > 1:
                if height(node.left.left) < height(node.left.right):
                    node.left = rotate_left(node.left)
                return rotate_right(node)
            if lean < -1:
                if height(node.right.right) < height(node.right.left):
                    node.right = rotate_right(node.right)
                return rotate_left(node)
            return node

        def insert(node, key):
            if node is None:
                return Node(key)
            if key < node.key:
                node.left = insert(node.left, key)
            elif key > node.key:
                node.right = insert(node.right, key)
            return rebalance(node)
        ```

        The test `height(node.left.left) < height(node.left.right)` asks whether the taller side bends inwards, and if so straightens it first.

        **Other balanced trees.** The AVL rule is strict, and keeping it strictly costs rotations. Two other designs dominate in practice.

        A **red-black tree** colours each node red or black, under two rules: a red node has no red child, and every path from a node down to an empty place passes the same number of black nodes. The rules allow one side to be up to twice as deep as the other, so the height is at most $2 \log_2(n + 1)$, a little taller than AVL, but insertions and removals need fewer rotations. Java's `TreeMap`, C++'s `std::map` and the Linux scheduler use red-black trees.

        A **B-tree** gives up on two children. Each node holds many keys in sorted order, often hundreds, and has one more child than keys. Every leaf is at the same depth, and nodes split in two when they overflow. Why many keys? Because a database or a file system keeps its tree on disk or flash, where reading one block of memory costs far more than comparing the keys inside it. With a thousand children per node, three levels reach $1000^3$, a hundred crore keys, so any lookup reads three blocks. The address arithmetic of [[s2.arrays-and-dynamic-arrays]] does the searching inside a block. Nearly every database index you will ever use is a B-tree.

        Python's standard library has no balanced tree. For a sorted collection it offers the `bisect` module, a halving search over a sorted list, met in [[s3.binary-search]], which is fine when insertions are rare. Third-party libraries fill the gap when they are not.
  formal:
    - text: |
        **Rotation.** A right rotation at $y$ with left child $x$ makes $x$ the top, $y$ its right child, and $x$'s old right subtree $y$'s new left subtree. A left rotation is the mirror. Both keep the in-order sequence and change three links.

        **AVL tree.** A binary search tree in which, at every node, the heights of the two subtrees differ by at most 1, with the empty tree of height $-1$.

        **Height bound.** The fewest keys in an AVL tree of height $h$ satisfy $N(h) = 1 + N(h - 1) + N(h - 2)$, with $N(0) = 1$ and $N(1) = 2$. Since $N(h) > 2N(h - 2)$, $N(h) \ge 2^{h / 2}$, so $h \le 2 \log_2 n$. More precisely $h < 1.44 \log_2(n + 2)$.

        **Insertion.** Insert as in a plain tree, then on the way back up update heights and, at the first node whose subtrees differ by 2, make one rotation for a line or two for a bend. Cost: proportional to the height, so logarithmic.

        **Red-black tree.** Height at most $2 \log_2(n + 1)$, with fewer rotations than AVL.

        **B-tree.** Many keys per node, all leaves at one depth. With $b$ children per node, the height is about $\log_b n$.
