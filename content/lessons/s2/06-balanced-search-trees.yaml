        solution: |
          class Node:
              def __init__(self, key, left, right):
                  self.key = key
                  self.left = left
                  self.right = right

          def checked_height(node):
              if node is None:
                  return -1
              left = checked_height(node.left)
              if left is None:
                  return None
              right = checked_height(node.right)
              if right is None:
                  return None
              if left - right > 1 or right - left > 1:
                  return None
              return 1 + max(left, right)

          leaf = Node(5, None, None)
          good = Node(20, Node(10, leaf, None), Node(30, None, None))
          bad = Node(20, Node(10, leaf, None), None)
          print(checked_height(good), checked_height(bad))
