        solution: |
          class Node:
              def __init__(self, key):
                  self.key = key
                  self.left = None
                  self.right = None
                  self.height = 0

          def height(node):
              if node is None:
                  return -1
              return node.height

          def update(node):
              node.height = 1 + max(height(node.left), height(node.right))

          def rotate_right(y):
              x = y.left
              y.left = x.right
              x.right = y
              update(y)
              update(x)
              return x

          def rotate_left(x):
              y = x.right
              x.right = y.left
              y.left = x
              update(x)
              update(y)
              return y

          def rebalance(node):
              update(node)
              lean = height(node.left) - height(node.right)
              if lean > 1:
                  if height(node.left.left) < height(node.left.right):
                      node.left = rotate_left(node.left)
                  return rotate_right(node)
              if lean < -1:
                  if height(node.right.right) < height(node.right.left):
                      node.right = rotate_right(node.right)
                  return rotate_left(node)
              return node

          def insert(node, key):
              if node is None:
                  return Node(key)
              if key < node.key:
                  node.left = insert(node.left, key)
              elif key > node.key:
                  node.right = insert(node.right, key)
              return rebalance(node)

          root = None
          for k in range(1, 16):
              root = insert(root, k)
          print(root.key, height(root))
        tests: |
          import random
          def _real(node):
              if node is None:
                  return -1
              return 1 + max(_real(node.left), _real(node.right))
          def _check(node):
              if node is None:
                  return True
              if abs(_real(node.left) - _real(node.right)) > 1:
                  return False
              if node.height != _real(node):
                  return False
              return _check(node.left) and _check(node.right)
          def _keys(node):
              if node is None:
                  return []
              return _keys(node.left) + [node.key] + _keys(node.right)
          def _build(keys):
              r = None
              for k in keys:
                  r = insert(r, k)
              return r
          _t = _build([3, 1, 2])
          assert _t.key == 2 and _check(_t), "Inserting 3, 1, 2 makes a bend; after repair 2 should be on top"
          _t = _build([1, 3, 2])
