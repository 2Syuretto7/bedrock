        solution: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          def to_list(head):
              values = []
              while head is not None:
                  values.append(head.value)
                  head = head.next
              return values

          def reverse(head):
              prev = None
              node = head
              while node is not None:
                  after = node.next
                  node.next = prev
                  prev = node
                  node = after
              return prev

          print(to_list(reverse(Node(3, Node(8, Node(1, None))))))
        tests: |
          def _make(values):
              head = None
              for v in values[::-1]:
                  head = Node(v, head)
              return head
          assert to_list(reverse(_make([3, 8, 1]))) == [1, 8, 3], "Reversing 3, 8, 1 should give 1, 8, 3"
          assert reverse(None) is None, "Reversing the empty list gives the empty list"
          assert to_list(reverse(_make([7]))) == [7], "Reversing one node gives the same node"
          assert to_list(reverse(_make(list(range(100))))) == list(range(99, -1, -1)), "A hundred nodes should all come back, reversed"
          _first = _make([1, 2])
          _second = _first.next
          assert reverse(_first) is _second, "The nodes should be relinked, not copied: the old last node becomes the head"
          assert output.strip() == "[1, 8, 3]", "The program should print [1, 8, 3]"
