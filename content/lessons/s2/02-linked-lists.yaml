    - question:
        id: write-has-cycle
        type: code
        mode: write
        system: s2
        prompt: |
          Write `has_cycle(head)`, which returns `True` if following links from `head` would go round for ever and `False` if it reaches `None`. Use Floyd's two pointers and a fixed number of names: no set, dictionary or list of nodes seen.
        starter: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          def has_cycle(head):
              return False

          a = Node(1, Node(2, Node(3, Node(4, Node(5, None)))))
          print(has_cycle(a))
          a.next.next.next.next.next = a.next.next
          print(has_cycle(a))
        solution: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          def has_cycle(head):
              slow = head
              fast = head
              while fast is not None and fast.next is not None:
                  slow = slow.next
                  fast = fast.next.next
                  if slow is fast:
                      return True
              return False

          a = Node(1, Node(2, Node(3, Node(4, Node(5, None)))))
          print(has_cycle(a))
          a.next.next.next.next.next = a.next.next
          print(has_cycle(a))
        tests: |
          _body = source.split("def has_cycle")[1].split("\na =")[0]
          assert "set" not in _body and "{" not in _body and "[" not in _body and "append" not in _body, "Use two pointers only, with no collection of nodes seen"
          def _chain(n, back=None):
              nodes = [Node(k, None) for k in range(n)]
              for k in range(n - 1):
                  nodes[k].next = nodes[k + 1]
              if back is not None and n > 0:
                  nodes[n - 1].next = nodes[back]
              return nodes[0] if n > 0 else None
          assert has_cycle(None) is False, "The empty list has no cycle"
          assert has_cycle(_chain(1)) is False, "One node with no link has no cycle"
          assert has_cycle(_chain(1, 0)) is True, "One node linking to itself is a cycle"
          assert has_cycle(_chain(2)) is False, "Two nodes, no cycle"
          assert has_cycle(_chain(2, 0)) is True, "Two nodes linking back to the first is a cycle"
          for _n in range(1, 30):
              assert has_cycle(_chain(_n)) is False, "A list of " + str(_n) + " nodes ending in None has no cycle"
              for _back in [0, _n // 2, _n - 1]:
                  assert has_cycle(_chain(_n, _back)) is True, "A list of " + str(_n) + " nodes whose last links back to node " + str(_back) + " is a cycle"
          _same = Node(1, Node(2, Node(1, Node(2, None))))
          assert has_cycle(_same) is False, "Repeated values are not a cycle: compare nodes, not values"
          assert output.strip() == "False\nTrue", "The program should print False, then True"
        wrong:
          - |
            class Node:
                def __init__(self, value, next):
                    self.value = value
                    self.next = next

            def has_cycle(head):
                slow = head
                fast = head
                while fast is not None and fast.next is not None:
                    slow = slow.next
                    fast = fast.next
                    if slow is fast:
                        return True
                return False

            print(False)
            print(True)
          - |
            class Node:
                def __init__(self, value, next):
                    self.value = value
                    self.next = next

            def has_cycle(head):
                slow = head
                fast = head
                while fast is not None and fast.next is not None:
                    slow = slow.next
                    fast = fast.next.next
                    if slow.value == fast.value:
                        return True
                return False

            print(False)
            print(True)
          - |
            class Node:
                def __init__(self, value, next):
                    self.value = value
                    self.next = next

            def has_cycle(head):
                slow = head
                fast = head
                while fast.next is not None and fast.next.next is not None:
                    slow = slow.next
                    fast = fast.next.next
                    if slow is fast:
                        return True
                return False

            print(False)
            print(True)
        explanation: |
          The loop runs only while `fast` can take two steps, which handles the lists that end: `fast` reaches `None`, or a last node, and the answer is `False`. On a list that loops, `fast` never finds an end, and the gap between the pointers round the loop shrinks by one each pass until they refer to the same node. Moving both at the same speed makes them equal after the first pass, on every list. Comparing values instead of nodes reports a cycle in 1, 2, 1, 2. And asking `fast.next` before checking `fast` fails on the empty list. The method follows at most a few times $n$ links and keeps two names, whatever the length.
    - question:
        id: work-remove-all
        type: choice
        system: s2
        prompt: |
          A Python list of $n$ items is emptied by repeatedly removing the **first** item with `xs.pop(0)`. A linked list of the same $n$ items is emptied by repeatedly removing its head. How do the total costs compare?
        options:
          - "The Python list moves $(n - 1) + (n - 2) + \\dots + 0$ items in all, which is quadratic. The linked list moves its head $n$ times, which is linear."
          - "Both are linear, since each removes $n$ items."
          - "Both are quadratic."
          - "The linked list is slower, since it must walk to the front."
        answer: 0
        explanation: |
          Removing position 0 of an array closes the gap by moving every remaining item one place left, and the total is $\frac{n(n - 1)}{2}$. Removing the head of a linked list is one assignment. A loop that takes items from the front of a long Python list is a common and well-hidden cause of slow programs, and the next lesson has the proper tool for it.
    - question:
        id: work-choose
        type: choice
        system: s2
        prompt: |
          A program stores 10 lakh records. It reads them constantly by their position, and now and then adds one at the end. It never inserts in the middle. Which structure suits it, and why?
        options:
          - "An array, because reading by position takes a constant number of steps and adding at the end moves nothing. A linked list would follow up to 10 lakh links for each read."
          - "A linked list, because inserting is constant."
          - "Either, since walking both is linear."
          - "A doubly linked list, because it can be walked from either end."
        answer: 0
        explanation: |
          The work is almost all reads by position, which is the one thing an array does in a single step and a linked list does worst. The linked list's strength, cheap insertion at a place already in hand, is never used, and its weaknesses all are: slow reads, a reference stored beside every item, and nodes scattered through memory. Choosing a structure is this kind of bookkeeping: list the operations, weigh them by how often they happen, and read off the costs.
  connections:
    - text: |
        The coupled train answered the puzzle. Because each node knows only the next, inserting or removing next to a node in hand changes a couple of links and moves nothing, however long the list. Because no node has an address you can work out, reaching position $i$ means following $i$ links. And because a link can point anywhere, even backwards, a list can loop, which two pointers moving at different speeds detect with no memory of where they have been, guaranteed to meet by a gap that shrinks by one each pass.

        You also practised the discipline that every linked structure demands: save a link before you overwrite it, and treat the empty and one-node cases as the places where the invariant is most likely to break. Those habits carry straight over to trees, where each node has two links instead of one, in [[s2.binary-search-trees]], and to graphs, where a node may have any number, in [[s2.graphs-and-their-representations]]. A hash table, in [[s2.hash-tables]], keeps short linked lists inside an array, one per slot.

        Real systems use linked lists in particular places. An operating system keeps lists of waiting processes. A memory allocator keeps a list of free blocks, linked through the free blocks themselves. A cache that throws out the least recently used item keeps a doubly linked list in order of use and moves an item to the front, in constant time, whenever it is touched.

        Notice what the cheap operations in these two lessons had in common. An array is fast at its end. A linked list is fast at its head, and with a tail at its end. A great many programs need nothing more than that: put things in and take them out, always at an end. Restricting yourself on purpose to the ends gives two of the most useful structures there are, and which end things leave from decides the order in which a whole computation unfolds: [[s2.stacks-and-queues]].
