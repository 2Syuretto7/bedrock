    - question:
        id: drill-doubly-links
        type: numeric
        system: s1
        prompt: |
          How many links are set to insert a new node between two neighbouring nodes of a doubly linked list?
        answer: "4"
        explanation: The new node's next and prev, the earlier node's next, and the later node's prev.
    - question:
        id: drill-cost-front
        type: choice
        system: s1
        prompt: |
          How does the cost of removing the first item grow with $n$, for a linked list and for an array?
        options: ["Constant for the linked list, linear for the array", "Linear for both", "Constant for both", "Linear for the linked list, constant for the array"]
        answer: 0
        explanation: The linked list moves its head along one link. The array closes the gap by moving every remaining item.
    - question:
        id: drill-cost-reach
        type: choice
        system: s1
        prompt: |
          How does the cost of reading the item at position $\frac{n}{2}$ grow with $n$ in a linked list?
        options: ["Linear", "Constant", "Logarithmic", "Quadratic"]
        answer: 0
        explanation: About $\frac{n}{2}$ links are followed, and that doubles when $n$ does.
    - question:
        id: drill-remove-end
        type: choice
        system: s1
        prompt: |
          A singly linked list keeps a head and a tail. Why is removing the **last** node still slow?
        options: ["The new last node is the one before the tail, and only a walk from the head finds it", "The tail must be copied", "The head must be moved", "It is not slow"]
        answer: 0
        explanation: Links point forwards only. A doubly linked list fixes this with a reference back.
    - question:
        id: drill-identity
        type: choice
        system: s1
        prompt: |
          In cycle detection, why is the test `slow is fast` and not `slow.value == fast.value`?
        options: ["Two different nodes may hold equal values, and only meeting at the same node shows a loop", "`is` is faster to type", "Values cannot be compared", "`==` would loop for ever"]
        answer: 0
        explanation: A list such as 1, 2, 1, 2 has repeated values and no loop.
    - question:
        id: predict-walk
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          head = Node(3, Node(8, Node(1, None)))
          head = Node(5, head)
          node = head.next
          total = 0
          while node is not None:
              total += node.value
              node = node.next
          print(head.value, total)
        output: "5 12"
        explanation: A new node holding 5 becomes the head, in front of 3, 8, 1. The walk starts at the second node, so it adds 3 + 8 + 1.
    - question:
        id: predict-push-front
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          head = None
          for v in [1, 2, 3]:
              head = Node(v, head)
          values = []
          while head is not None:
              values.append(head.value)
              head = head.next
          print(values)
        output: "[3, 2, 1]"
        explanation: Each new node goes in front of the last, so the list comes out in the reverse of the order the values arrived.
  work:
    - text: "Slower now. For each method, name the edge cases first: the empty list, one node, the end."
    - question:
        id: write-to-list
        type: code
        mode: write
        system: s2
        prompt: |
          Write `to_list(head)`. `head` is the first node of a linked list, or `None` for an empty list. Return an ordinary Python list of the values, in order, without changing the linked list.
        starter: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          def to_list(head):
              # Replace the next line with your own.
              return []

          print(to_list(Node(3, Node(8, Node(1, None)))))
        solution: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          def to_list(head):
              values = []
              node = head
              while node is not None:
                  values.append(node.value)
                  node = node.next
              return values

          print(to_list(Node(3, Node(8, Node(1, None)))))
        tests: |
          assert to_list(Node(3, Node(8, Node(1, None)))) == [3, 8, 1], "The list 3, 8, 1 should give [3, 8, 1]. You returned " + repr(to_list(Node(3, Node(8, Node(1, None)))))
          assert to_list(None) == [], "An empty list, given as None, should give []"
          assert to_list(Node(7, None)) == [7], "A single node should give [7]"
          assert to_list(Node(0, Node(0, None))) == [0, 0], "Values of 0 are still values"
          assert to_list(Node(None, Node(2, None))) == [None, 2], "A node may hold the value None. Only the link decides where the list ends"
          _head = None
          for _v in range(50):
              _head = Node(_v, _head)
          assert to_list(_head) == list(range(49, -1, -1)), "A list of 50 nodes should come back whole and in order"
          _keep = Node(1, Node(2, None))
          to_list(_keep)
          assert _keep.next is not None and _keep.next.value == 2, "to_list should not change the linked list"
          assert output.strip() == "[3, 8, 1]", "The program should print [3, 8, 1]"
        wrong:
          - |
            class Node:
                def __init__(self, value, next):
                    self.value = value
                    self.next = next

            def to_list(head):
                values = []
                node = head
                while node.next is not None:
                    values.append(node.value)
                    node = node.next
                return values

            print([3, 8, 1])
          - |
            class Node:
                def __init__(self, value, next):
                    self.value = value
                    self.next = next

            def to_list(head):
                values = []
                node = head
                while node is not None and node.value:
                    values.append(node.value)
                    node = node.next
                return values

            print([3, 8, 1])
          - |
            class Node:
                def __init__(self, value, next):
                    self.value = value
                    self.next = next

            def to_list(head):
                values = []
                node = head
                while node is not None:
                    node = node.next
                    if node is not None:
                        values.append(node.value)
                return values

            print([3, 8, 1])
        explanation: |
          This is the standard walk: hold a node, use it, step to the next, and stop when the node in hand is `None`. The test must be on the node itself. Testing `node.next` stops one node early and misses the last value, and it fails outright on an empty list, where there is no node to ask. Testing the value confuses "the list has ended" with "this item happens to be 0". Stepping before using skips the head. The walk visits each node once, so its cost is linear.
    - question:
        id: write-insert-at
        type: code
        mode: write
        system: s2
        prompt: |
          Write `insert_at(head, i, value)`. Insert a new node holding `value` so that it ends up at position `i`, and return the head of the list, which is a new node when `i` is 0. You may assume `i` is between 0 and the length of the list.
        starter: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          def to_list(head):
              values = []
              while head is not None:
                  values.append(head.value)
                  head = head.next
              return values

          def insert_at(head, i, value):
              # Replace the next line with your own.
              return head

          print(to_list(insert_at(Node(3, Node(8, Node(1, None))), 2, 5)))
        solution: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          def to_list(head):
              values = []
              while head is not None:
                  values.append(head.value)
                  head = head.next
              return values

          def insert_at(head, i, value):
              if i == 0:
                  return Node(value, head)
              node = head
              for _ in range(i - 1):
                  node = node.next
              node.next = Node(value, node.next)
              return head

          print(to_list(insert_at(Node(3, Node(8, Node(1, None))), 2, 5)))
        tests: |
          def _make(values):
              head = None
              for v in values[::-1]:
                  head = Node(v, head)
              return head
          def _read(head):
              values = []
              steps = 0
              while head is not None and steps < 1000:
                  values.append(head.value)
                  head = head.next
                  steps += 1
              assert steps < 1000, "The list never ends. A node points back into the list"
              return values
          assert _read(insert_at(_make([3, 8, 1]), 2, 5)) == [3, 8, 5, 1], "Inserting 5 at position 2 of 3, 8, 1 should give 3, 8, 5, 1. You got " + repr(_read(insert_at(_make([3, 8, 1]), 2, 5)))
          assert _read(insert_at(_make([3, 8, 1]), 0, 5)) == [5, 3, 8, 1], "Inserting at position 0 should return a new head"
          assert _read(insert_at(_make([3, 8, 1]), 3, 5)) == [3, 8, 1, 5], "Inserting at position 3 puts the node at the end"
          assert _read(insert_at(_make([3, 8, 1]), 1, 5)) == [3, 5, 8, 1], "Inserting at position 1 should give 3, 5, 8, 1"
          assert _read(insert_at(None, 0, 9)) == [9], "Inserting into an empty list gives a list of one node"
          _h = _make([1, 2, 3, 4])
          assert insert_at(_h, 2, 0) is _h, "When i is not 0 the head does not change, so return the same head"
          assert output.strip() == "[3, 8, 5, 1]", "The program should print [3, 8, 5, 1]"
        wrong:
          - |
            class Node:
                def __init__(self, value, next):
                    self.value = value
                    self.next = next

            def insert_at(head, i, value):
                node = head
                for _ in range(i - 1):
                    node = node.next
                node.next = Node(value, node.next)
                return head

            print([3, 8, 5, 1])
          - |
            class Node:
                def __init__(self, value, next):
                    self.value = value
                    self.next = next

            def insert_at(head, i, value):
                if i == 0:
                    return Node(value, head)
                node = head
                for _ in range(i):
                    node = node.next
                node.next = Node(value, node.next)
                return head

            print([3, 8, 5, 1])
          - |
            class Node:
                def __init__(self, value, next):
                    self.value = value
                    self.next = next

            def insert_at(head, i, value):
                if i == 0:
                    return Node(value, head)
                node = head
                for _ in range(i - 1):
                    node = node.next
                fresh = Node(value, None)
                node.next = fresh
                fresh.next = node.next
                return head

            print([3, 8, 5, 1])
          - |
            class Node:
                def __init__(self, value, next):
                    self.value = value
                    self.next = next

            def insert_at(head, i, value):
                if i == 0:
                    return Node(value, head)
                node = head
                for _ in range(i - 1):
                    node = node.next
                node.next = Node(value, node.next)
                return node

            print([3, 8, 5, 1])
        explanation: |
          To put a node at position $i$ you need the node at position $i - 1$ in hand, because that is the node whose link changes. So the walk follows $i - 1$ links, and one more would overshoot. Position 0 has no node before it and is handled on its own: the new node points at the old head and is returned as the head. The new node must be given the old link at the moment it is made. If the old link is overwritten first, the new node ends up pointing at itself, which one of the tests detects as a list that never ends.
    - question:
        id: fix-tail
        type: code
        mode: find-bug
        system: s2
        prompt: |
          A clinic keeps its waiting list in this `LinkedList`, with a head and a tail. After the room empties and new patients arrive, some of them vanish: the program below should print `['Kiran', 'Meena'] 2`, and prints `['Kiran'] 2`. Find which method breaks the invariant "`head` and `tail` are both `None` exactly when the list is empty", and fix it.
        starter: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next


          class LinkedList:
              def __init__(self):
                  self.head = None
                  self.tail = None
                  self.length = 0

              def __len__(self):
                  return self.length

              def __iter__(self):
