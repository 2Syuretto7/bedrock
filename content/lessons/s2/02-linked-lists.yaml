    - question:
        id: predict-reverse
        type: predict
        system: s2
        prompt: |
          `reverse` is the in-place reversal from the lesson. What does this show? Think about which node `h` still refers to.
        code: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          def to_list(head):
              values = []
              while head is not None:
                  values.append(head.value)
                  head = head.next
              return values

          def reverse(head):
              prev = None
              node = head
              while node is not None:
                  after = node.next
                  node.next = prev
                  prev = node
                  node = after
              return prev

          h = Node(1, Node(2, Node(3, Node(4, None))))
          r = reverse(h)
          print(to_list(r), to_list(h))
        output: "[4, 3, 2, 1] [1]"
        explanation: |
          `reverse` returns the old last node as the new head, so `r` gives 4, 3, 2, 1. No node was copied: the same four nodes were relinked. `h` still refers to the node holding 1, which was the head and is now the last node, with `None` as its link. So `to_list(h)` finds just that one node. After an in-place change, every outside reference to a node still points at that node, wherever it now sits.
