concept: s2.linked-lists
minutes: 100
claim: You can build a linked list from nodes, walk it, insert and remove after a node you hold in a constant number of steps, keep a tail so that appending is cheap, reverse a list in place, tell whether a list loops back on itself using two pointers, and choose between a linked list and an array by the operations a program performs.
recalls: [s2.arrays-and-dynamic-arrays]
uses: [s1.classes-and-objects, s1.special-methods, s1.exceptions, s1.recursion, s1.generators-and-context-managers, s1.comprehensions-and-iterators, f2.loop-invariants, f2.induction-and-strong-induction, f1.arithmetic-and-geometric-series, s0.lists-and-tuples, s0.loops, s0.functions]
leads: [s2.stacks-and-queues, s2.hash-tables, s2.binary-search-trees, s2.graphs-and-their-representations]
starter: |
  # Scratch space. Three nodes, each holding a value and a link to the next node.
  class Node:
      def __init__(self, value, next):
          self.value = value
          self.next = next

  head = Node(3, Node(8, Node(1, None)))
  head.next = Node(5, head.next)   # insert 5 after the first node: nothing moves

  node = head
  while node is not None:
      print(node.value)
      node = node.next
parts:
  recall:
    - text: |
        [[s2.arrays-and-dynamic-arrays]] showed that an array is fast at its end and slow at its front, and that both facts come from one decision: the items sit packed side by side. Today you make the opposite decision and see what it buys and what it costs. Three quick pulls first.
  puzzle:
    - text: |
        A passenger train is a row of coaches, and you can add one in the middle. At a big junction, the railway sometimes attaches an extra coach partway along a train. Nobody lifts the coaches behind it and slides them back. The train is uncoupled at one point, the new coach is shunted in, and two couplings are made. A train of 24 coaches costs the same two couplings as a train of 4.

        The reason is that a coach is not kept in place by its **position**. It is kept in place by what it is **coupled to**. Each coach knows only the next one.

        The same trick works in memory. In the last lesson, a Python list's slot held the address of an item. Now let every item carry, next to it, the address of the item after it, and let the items live wherever there happens to be room. That is a **linked list**, and inserting into the middle costs two changes of address, however long the list.

        But the train has a cost too. A ticket checker looking for coach S9 cannot do arithmetic on an address. They walk from the engine, coach by coach. And there is a stranger danger. If one coupling were made to point **back** at an earlier coach, a walk along the train would never reach the end. In memory, that is a program that hangs.

        **What exactly does the coupled design make cheap, and what dear? And if a list might loop back on itself, can you find out without remembering every node you have seen, using only two names?**
  intuition:
    - text: |
        Move the place of insertion from the front to the back, and compare the work done by the array of the last lesson and by a linked list.
    - figure: array-list
      props: { index: 2 }
    - text: |
        At the front, the array moves every item and the linked list follows no links at all: the new node simply points at the old first node. At the back, the array moves nothing and the linked list follows every link to reach the end. Each design is quick exactly where the other is slow. Neither is better. They answer different questions quickly.

        For the second question, think of two friends jogging on a path that might end at a road or might loop round a park. One runs twice as fast as the other. If the path ends, the fast one reaches the end first. If it loops, the fast one comes round from behind and catches the slow one, since on a loop the faster runner must eventually lap the slower. Neither needs a map, and neither needs to remember where they have been.
  derivation:
    - text: |
        **Nodes and links.** Give each item its own small object, a **node**, holding the item and a reference to the next node. The last node holds `None`, meaning there is no next. The list as a whole is known by its first node, the **head**. An empty list is just `None`.

        ```python
        class Node:
            def __init__(self, value, next):
                self.value = value
                self.next = next

        head = Node(3, Node(8, Node(1, None)))
        ```

        This is the list 3, 8, 1. Walking it is a loop that holds one node at a time and stops when the node in hand is `None`:

        ```python
        node = head
        while node is not None:
            print(node.value)
            node = node.next
        ```

        The nodes may be anywhere in memory, so there is no formula for the third one. Reaching position $i$ takes $i$ steps of `node = node.next`, which is linear in $n$ in the worst case, where the array took a constant number of steps.

        **Inserting and removing after a node in hand.** In return, nothing ever moves. To insert a value after a node you already hold, make a new node that points where the old one pointed, and then point the old one at the new one:

        ```python
        def insert_after(node, value):
            node.next = Node(value, node.next)
        ```

        Two links are set, whatever the length of the list: a constant cost. The order matters. The old value of `node.next` is the only record of where the rest of the list is, so the new node must take it over before it is overwritten. The one line above does that correctly, because Python works out the right-hand side, `node.next` included, before assigning. Removing the node after one you hold is one assignment, `node.next = node.next.next`, which makes the list skip over it. Nothing refers to the skipped node any more, and Python reclaims its memory.

        At the front it is simpler still. A new node points at the old head and becomes the head, `head = Node(value, head)`, and removing the first node is `head = head.next`.
    - question:
        id: derivation-order-of-links
        type: choice
        system: s2
        prompt: |
          To insert a new node `fresh` after `node`, two links must be set, one at a time. Which order is correct, and what goes wrong with the other?
        options:
          - "`fresh.next = node.next` and then `node.next = fresh`. In the other order, `node.next` is already `fresh` when it is copied, so `fresh` points at itself and the rest of the list is lost."
          - "`node.next = fresh` and then `fresh.next = node.next`. Either order works."
          - "`fresh.next = node` and then `node.next = fresh`."
          - "Only one link needs to be set."
        answer: 0
        explanation: |
          Done the wrong way round, `node.next` is first set to `fresh`, and then `fresh.next = node.next` copies that same reference, so the new node points at itself. A walk along the list would then go round and round `fresh` for ever. With linked structures the safe habit is to attach the new piece to what follows it first, and only then let the old structure point at it.
    - text: |
        **The end needs a tail.** Appending to a linked list known only by its head means walking to the last node first: linear. The fix is to remember the last node too, in a second reference called the **tail**. Wrap both in one object with an invariant: `head` is the first node and `tail` the last, and both are `None` exactly when the list is empty.

        ```python
        class LinkedList:
            def __init__(self):
                self.head = None
                self.tail = None

            def append(self, value):
                fresh = Node(value, None)
                if self.tail is None:
                    self.head = fresh
                else:
                    self.tail.next = fresh
                self.tail = fresh
        ```

        The empty case needs its own branch, because an empty list has no last node whose link could change. Every method must keep the invariant, and the dangerous moments are the edges: the first item arriving and the last one leaving. A method that removes the only node must set **both** references back to `None`.

        **The two side by side.** For a list of $n$ items:

        | Operation | Array | Linked list with a tail |
        | --- | --- | --- |
        | reach position $i$ | constant | linear: $i$ links |
        | insert or remove at the front | linear | constant |
        | add at the end | constant, averaged | constant |
        | remove at the end | constant | linear: the node before the tail must be found |
        | insert or remove after a node in hand | linear | constant |
        | walk through every item | linear | linear |

        **What the counts leave out.** Walking is linear for both, and in practice the array is several times faster. A node carries a reference beside every value, so a linked list takes more memory. And processors fetch memory in neighbouring chunks, so stepping through an array finds the next items already fetched, while each link may lead somewhere far away. For this reason the array is the default, and plain linked lists are rarer in real programs than in textbooks. Their idea is worth more than they are: nodes that refer to other nodes are how every branching structure is built.

        **Doubly linked lists.** Give each node a second reference, `prev`, to the node before it. Now a node in hand can be removed by itself, with no need to find its predecessor: `node.prev.next = node.next` and `node.next.prev = node.prev`. Removing at the end becomes constant too. The price is two references per node and four links to set on every insertion. Doubly linked lists are what text editors, browser histories and caches that throw out the least recently used item are built on. A common trick is a **sentinel**, a dummy node that sits before the first real node and after the last, so the list is never truly empty and the edge cases disappear.

        **Reversing in place.** A singly linked list can be turned round without making a single new node, by flipping every link. Walk along holding two names: `prev`, the head of the part already reversed, and `node`, the head of the part not yet reached.

        ```python
        def reverse(head):
            prev = None
            node = head
            while node is not None:
                after = node.next
                node.next = prev
                prev = node
                node = after
            return prev
        ```

        The invariant of [[f2.loop-invariants]] makes this easy to trust. At the top of every pass, the nodes already visited form a list headed by `prev`, in reverse order, and the nodes not yet visited form a list headed by `node`, in their original order. At the start the first part is empty and the second is everything. Each pass moves one node from the front of the second part to the front of the first. When `node` is `None`, everything is in the first part. The variant is the number of nodes not yet visited. Notice the name `after`: it saves the rest of the list before `node.next` is overwritten, the same discipline as in insertion.
    - question:
        id: order-reverse
        type: order
        system: s2
        prompt: Put the four lines of one pass of the reversal loop in order, so that no part of the list is lost.
        steps:
          - "after = node.next"
          - "node.next = prev"
          - "prev = node"
          - "node = after"
        explanation: The reference to the rest of the list lives only in `node.next`, so it is saved first. Then that link can be turned round to point at the reversed part. Then `node` joins the reversed part as its new head, and finally the walk moves on to the saved rest. Turning the link round before saving it would leave nothing pointing at the unvisited nodes.
    - text: |
        **A list that loops.** Suppose a bug has made the last node point back at some earlier node. A walk that waits for `None` never ends. One way to notice is to remember every node seen in a set, but that needs memory in proportion to $n$. Robert Floyd's method needs two names. Move `slow` one link at a time and `fast` two links at a time, both from the head.

        If the list ends, `fast` reaches `None` first, after about $\frac{n}{2}$ passes, and the answer is no. If it loops, both eventually enter the loop and go round it for ever. Once both are on it, look at the number of links by which `fast` is behind `slow`, counted forwards round the loop. Each pass, `slow` moves one link and `fast` two, so that gap shrinks by exactly one. It is a whole number, it cannot shrink for ever, and when it reaches 0 the two names refer to the **same node**. That gap is a variant in exactly the sense of [[f2.loop-invariants]], and it is what guarantees the meeting. The test for "the same node" is `slow is fast`, identity, not equality of values, since two different nodes may hold equal values.

        **Recursion on lists.** A linked list is either empty, `None`, or a node followed by a linked list. That definition refers to itself, so functions on lists can be written the way [[s1.recursion]] taught:

        ```python
        def length(node):
            if node is None:
                return 0
            return 1 + length(node.next)
        ```

        And claims about every list can be proved the way [[f2.induction-and-strong-induction]] proved claims about every number: show the claim for the empty list, and show that if it holds for a list it holds for that list with one more node in front. Python's limit of about a thousand nested calls makes the loop version the practical one for long lists, but the recursive description is the one to reason with.
  formal:
    - text: |
        **Linked list.** Nodes, each holding a value and a reference to the next node, the last holding `None`. The list is known by its head, and the empty list is `None`.

        **Costs.** Reaching position $i$ follows $i$ links, linear. Inserting or removing after a node in hand, or at the head, sets a constant number of links.

        **Insertion discipline.** Give the new node the old link before overwriting the old link.

        **Head and tail.** Keeping a reference to the last node makes appending constant. Invariant: `head` is the first node and `tail` the last, and both are `None` exactly when the list is empty.

        **Doubly linked list.** Each node also refers to the node before it, so a node in hand can be removed in constant time.

        **Reversal in place.** Invariant: `prev` heads the visited nodes in reverse order and `node` heads the unvisited nodes in order.

        **Cycle detection (Floyd).** A slow pointer moves one link per pass and a fast one two. The list loops if and only if they come to refer to the same node; otherwise the fast pointer reaches `None`.
  drill:
