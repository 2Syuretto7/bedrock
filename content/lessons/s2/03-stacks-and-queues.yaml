concept: s2.stacks-and-queues
minutes: 100
claim: You can say what a stack and a queue promise, build each so that every operation costs a constant number of steps, including a queue in a fixed array that wraps round, and choose between them by asking which item must be dealt with next, as in matching brackets, evaluating an expression and finding the span of a share price.
