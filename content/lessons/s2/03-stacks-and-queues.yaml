            def spans(closes):
                result = []
                stack = []
                for i in range(len(closes)):
                    while stack and closes[stack[-1]] <= closes[i]:
                        stack.pop()
                    if stack:
                        result.append(i - stack[-1])
                    else:
                        result.append(1)
                    stack.append(i)
                return result

            print([1, 1, 1, 2, 1, 4, 6])
        explanation: |
          The stack holds the days that could still stop a later look-back, with closes decreasing from bottom to top. A new day first pops every day whose close is at most its own, since those can never stop anyone again. What remains on top is the nearest earlier day with a strictly higher close, and the span is the distance to it; with nothing left, the span reaches back to day 0 and is $i + 1$. Each day is pushed once and popped at most once, so the reads grow in proportion to the days. Looking back day by day gives the same answers but reads quadratically often on a rising price. Popping only strictly smaller closes stops at an equal close, which the definition says should be counted.
    - question:
        id: work-two-stacks
        type: choice
        system: s2
        prompt: |
          A queue is built from two stacks, `inbox` and `outbox`. Enqueue pushes onto `inbox`. Dequeue pops from `outbox`, but if `outbox` is empty it first pops **every** item from `inbox` and pushes each onto `outbox`. Does this behave as a queue, and what does it cost?
        options:
          - "Yes. Moving reverses the order, so the oldest item ends on top of `outbox`. One dequeue can move many items, but each item is pushed, moved and popped once in its life, so $n$ operations cost a number of steps linear in $n$."
          - "No. Each stack reverses the order, so the items come out newest first."
          - "Yes, and every dequeue costs a constant number of steps, because only one item is popped."
          - "Yes, but $n$ operations cost a number of steps quadratic in $n$, because a dequeue may move every item."
        answer: 0
        explanation: |
          A stack reverses order, and reversing twice restores it: the first item pushed onto `inbox` is at its bottom, so it is the last moved and lands on top of `outbox`, ready to leave first. Items already in `outbox` are older than everything in `inbox`, so they rightly leave first. A single dequeue can be expensive, moving the whole of `inbox`. But follow one item through its life: pushed once onto `inbox`, moved once, popped once. That bounds the total, as with the spans. A dequeue that moves a crore of items is still a slow moment, which matters to code with a deadline on every call.
    - question:
        id: work-recursion-depth
        type: choice
        system: s2
        prompt: |
          A recursive function that walks a linked list of 10 lakh nodes, calling itself once for each node, fails in Python with "maximum recursion depth exceeded". A loop does not. Why?
        options:
          - "Each waiting call keeps a frame on the call stack, so the depth of the call stack equals the length of the list, and Python refuses to let it grow past about a thousand frames. A loop keeps no waiting calls."
          - "Recursion is always slower than a loop, and Python stops slow programs."
          - "The linked list is too long to fit in memory."
          - "Recursive functions cannot follow links."
        answer: 0
        explanation: |
          Recursion uses the call stack as its memory of what remains to be done: each call waiting for a deeper one holds a frame. Python caps the height of that stack, to turn runaway recursion into an error instead of a crash. Recursion that halves its problem is only about 20 deep for 10 lakh items and is safe. Recursion that goes one step deeper for each item is as deep as the data is long. When that is too deep, keep the pending work on a stack of your own, as in the lesson, or use a plain loop.
  connections:
    - text: |
        The puzzle asked what you must remember to check brackets, when counting fails. You must remember the brackets still open, in order, and a closer must match the most recent of them. A pile that you add to and take from only at the top holds exactly that. It is a stack, and the three ways a line can be malformed are the three ways the check can fail.

        A stack returns the newest item and a queue the oldest. That is the whole difference, and it decided how each should be built. An array is cheap at its end, so a Python list is a ready-made stack. A queue works at both ends, so it needs a linked list with a tail, a deque, or, when the room is fixed, a ring buffer whose positions wrap round. In each, every operation costs a constant number of steps. The span of a share price showed a subtler use: a stack that throws away what can never matter again, costing little in total though one step may pop many items.

        These two containers turn up everywhere. Your browser's back button is a stack of pages. A web server's waiting requests, the jobs on a printer and the orders in a restaurant kitchen are queues. Every operating system keeps queues of processes waiting for their turn on a processor, and every network card has a ring buffer of packets.

        The next lessons need them too. When the next item to handle is neither the newest nor the oldest but the **most urgent**, you need a priority queue, built in [[s2.heaps-and-priority-queues]]. And keeping pending work on a stack or on a queue gives the two great ways of exploring a graph, in [[s3.breadth-first-and-depth-first-search]], once graphs themselves are stored in [[s2.graphs-and-their-representations]].

        First, a different question about collections. A stack and a queue hand you an item of **their** choosing. Often you want a particular one: is this word in the dictionary, what is the balance for this account number? A list must search item by item. A Python `dict` answers at once, however much it holds. The next lesson builds one from an array, which can jump to any position, and short linked lists, to hold what collides: [[s2.hash-tables]].
