    - question:
        id: write-spans
        type: code
        mode: write
        system: s2
        prompt: |
          Write `spans(closes)`. `closes` is a sequence of daily closing prices. Return the list of spans: for each day, the number of consecutive days ending with that day on which the close was at most that day's close. Use a stack of earlier days, as in the lesson, so that the whole run is linear: the tests count how many times you read from `closes`.
        starter: |
          def spans(closes):
              # Replace the next line with your own.
              return [1 for _ in range(len(closes))]

          print(spans([100, 80, 60, 70, 60, 75, 85]))
        solution: |
          def spans(closes):
              result = []
              stack = []
              for i in range(len(closes)):
                  while stack and closes[stack[-1]] <= closes[i]:
                      stack.pop()
                  if stack:
                      result.append(i - stack[-1])
                  else:
                      result.append(i + 1)
                  stack.append(i)
              return result

          print(spans([100, 80, 60, 70, 60, 75, 85]))
        tests: |
          assert spans([100, 80, 60, 70, 60, 75, 85]) == [1, 1, 1, 2, 1, 4, 6], "The example from the lesson"
          assert spans([]) == [], "No days, no spans"
          assert spans([50]) == [1], "The first day's span is 1"
          assert spans([10, 20, 30]) == [1, 2, 3], "A price that rises every day looks all the way back"
          assert spans([30, 20, 10]) == [1, 1, 1], "A price that falls every day has spans of 1"
          assert spans([5, 5, 5]) == [1, 2, 3], "Equal closes count: the span includes days at most today's close"
          class _Closes:
              def __init__(self, values):
                  self.values = values
                  self.reads = 0
              def __len__(self):
                  return len(self.values)
              def __getitem__(self, i):
                  self.reads += 1
                  return self.values[i]
          _rising = _Closes(list(range(2000)))
          assert spans(_rising) == list(range(1, 2001)), "A rising price of 2000 days"
          assert _rising.reads <= 16000, "On a rising price the reads from closes should grow in proportion to the days, not look back every time"
          _mixed = _Closes([(_k * 37) % 101 for _k in range(2000)])
          spans(_mixed)
          assert _mixed.reads <= 16000, "The reads from closes should grow in proportion to the days"
          assert output.strip() == "[1, 1, 1, 2, 1, 4, 6]", "The program should print [1, 1, 1, 2, 1, 4, 6]"
