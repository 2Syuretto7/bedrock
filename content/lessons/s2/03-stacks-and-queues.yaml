starter: |
  # Scratch space. Count the brackets in each line. Do the counts tell you which lines are well formed?
  lines = ["f(a[1], {2: (3)})", "([)]", "(()", "())("]

  for text in lines:
      counts = [len([c for c in text if c == b]) for b in "()[]{}"]
      print(text, counts)
parts:
  recall:
    - text: |
        [[s2.linked-lists]] ended by noticing that an array is cheap to change at its end, a linked list at its head, and a linked list with a tail at both its head and its end. Many programs need nothing more than that. Three quick pulls first.
  puzzle:
    - text: |
        A code editor tells you, as you type, whether your brackets are well formed. Four lines to judge:

        | Line | Well formed? |
        | --- | --- |
        | `f(a[1], {2: (3)})` | yes |
        | `([)]` | no |
        | `(()` | no |
        | `())(` | no |

        The obvious method is to count. Run the starter: it counts each kind of bracket. The third line is caught, with two `(` and one `)`. But the second and fourth lines have perfectly equal counts and are still wrong. In `([)]` the round bracket is closed while a square one is still open inside it. In `())(` a bracket is closed before it was opened.

        Counting is not enough. As you read along the line, you need to remember something about the brackets you have passed.

        **What exactly must you remember? And when a closing bracket arrives, which of the remembered brackets must it match?**

        The answer is a way of organising memory so simple that it hardly seems like a data structure. It is also how your own function calls have been kept track of all along.
  intuition:
    - text: |
        Read `f(a[1], {2: (3)})` slowly. You meet `(`, then `[`. Now `]` arrives. Which opener must it match? Not the first one you saw. The **most recent** one that is still open. Brackets nest, so whatever opened last must close first.

        So keep the openers in a pile. Each new opener goes on top. A closer is compared with the top of the pile, and if they match, the top is taken off. You never look at anything but the top. At the end the pile must be empty.

        A pile that you add to and take from only at the top is a **stack**. The steel plates at a wedding buffet are one: the plate put on last is the first one taken. Last in, first out.

        Now a different job. Requests reach a server faster than it can answer them. They must wait, and fairness says that the one that has waited longest is served next. That is the line at a railway ticket counter: join at the back, leave from the front. It is a **queue**. First in, first out.

        Both hold a collection of items, and both let you do only two things, add one and remove one. The entire difference is **which** item comes out. Try it.
    - figure: stack-queue
      props: { items: 3 }
    - text: |
        With A, B, C added in that order, the stack gives them back as C, B, A, reversed. The queue gives them back as A, B, C, in the order they came. Add and remove in a mixed sequence and the two orders part company quickly.
  derivation:
    - text: |
        **The stack.** A stack supports two operations and promises one thing about them.

        | Operation | Meaning |
        | --- | --- |
        | **push** | add an item |
        | **pop** | remove and return the item most recently pushed and not yet popped |

        A third, **peek**, looks at that item without removing it.

        A Python list is already a good stack, and [[s2.arrays-and-dynamic-arrays]] says why. Treat the **end** of the list as the top. Then push is `append` and pop is `pop()`, both at the end of an array, where nothing moves: constant cost, averaged over the occasional move to a bigger block. Peek is `stack[-1]`. Had you used the front as the top, every push and pop would move every item. The idea is the same. Only the choice of end differs.

        **Matching brackets.** Here is the method from the intuition, made exact.

        ```python
        def balanced(text):
            closes = {")": "(", "]": "[", "}": "{"}
            stack = []
            for c in text:
                if c in "([{":
                    stack.append(c)
                elif c in closes:
                    if len(stack) == 0 or stack.pop() != closes[c]:
                        return False
            return len(stack) == 0
        ```

        Follow it on `([)]`. Push `(`, push `[`. Then `)` arrives, and the top is `[`, which is not its partner: `False`. On `())(`, push `(`, pop it for the first `)`, and then the second `)` finds the stack empty: `False`. On `(()`, the line ends with one `(` still on the stack: `False`. The three ways a line can be wrong are the three places the function refuses. Its invariant is that the stack holds exactly the openers read so far that are not yet closed, newest on top. Each character costs a constant number of steps, so the whole check is linear in the length of the line.

        **The call stack is a stack.** In [[s1.recursion]] you watched calls pile up and unwind. A function that calls another must wait, and the one called last finishes first. Python keeps the waiting calls on a stack, which is where the name came from. So any recursive function can be rewritten as a loop with a stack of your own, holding the work still to be done. Here is the total of a nested list without recursion:

        ```python
        def total(nested):
            stack = [nested]
            result = 0
            while len(stack) > 0:
                item = stack.pop()
                if type(item) == list:
                    for part in item:
                        stack.append(part)
                else:
                    result += item
            return result
        ```

        Whatever is popped is either a number, which is added, or a list, whose parts are pushed to be dealt with later. The stack holds exactly the work not yet done.

        **The queue.** A queue also supports two operations.

        | Operation | Meaning |
        | --- | --- |
        | **enqueue** | add an item at the back |
        | **dequeue** | remove and return the item that has waited longest |

        A Python list makes a poor queue. Items join at one end and leave from the other, and one of those ends is the front of the array, where `pop(0)` moves every remaining item. The linked list with a tail from [[s2.linked-lists]] fits exactly: join at the tail, leave from the head, both constant. In practice you will use `collections.deque`, a double-ended queue, which adds and removes at **both** ends in constant time.

        ```python
        from collections import deque

        line = deque()
        line.append("Asha")
        line.append("Ravi")
        print(line.popleft(), len(line))
        ```

        This shows `Asha 1`. Use `append` to join at the back and `popleft` to leave from the front. A deque used with `append` and `pop` is a stack, so it serves as either.

        **A queue in a fixed array.** Sometimes there is no room to grow: a keyboard's buffer, a network card, an audio driver. Each has a fixed block of $m$ slots, and items arrive and leave for ever. Keep two numbers: `front`, the slot of the oldest item, and `length`, how many items there are. The items sit in slots `front`, `front + 1`, and so on, **wrapping round** to slot 0 after slot $m - 1$. In symbols, item $k$ of the queue is in slot $(\text{front} + k) \bmod m$, using the remainder from [[s0.expressions]]. Enqueue writes into slot $(\text{front} + \text{length}) \bmod m$ and adds 1 to `length`. Dequeue reads slot `front`, moves `front` on to $(\text{front} + 1) \bmod m$, and subtracts 1. Nothing ever moves, and no slot is wasted. This is a **ring buffer**: picture the slots bent into a circle, with the queue chasing its own tail round it.
    - question:
        id: derivation-ring
        type: numeric
        system: s2
        prompt: |
          A ring buffer has 8 slots, numbered 0 to 7. Its oldest item is in slot 6 and it holds 5 items. Into which slot does the next enqueue write?
        answer: "3"
        explanation: |
          The items occupy slots 6, 7, 0, 1 and 2, wrapping round after slot 7. The next free slot is $(6 + 5) \bmod 8 = 3$. Without the remainder the answer would be slot 11, which does not exist, and that is exactly the bug that a ring buffer written without `%` has.
    - text: |
        **Choosing between them.** The only question is which item should be dealt with next.

        | If the next item to handle is | Use | Examples |
        | --- | --- | --- |
        | the most recent one | a stack | brackets, undo, function calls, the back button |
        | the oldest one | a queue | requests to a server, print jobs, orders waiting in a kitchen |

        The choice shapes whole algorithms. Explore a maze keeping the places still to visit on a stack, and you plunge down one corridor as far as it goes before trying another. Keep them in a queue and you spread out evenly, reaching everything one step away before anything two steps away. Same loop, different container, and a completely different search, which the algorithms cluster takes up in [[s3.breadth-first-and-depth-first-search]].

        **Evaluating an expression.** A calculator can be built on a stack. Write the expression with each operator **after** its two operands: $(3 + 4) \times 2$ becomes `3 4 + 2 *`. This is called **postfix** notation. It needs no brackets and no rules of precedence. Read it left to right:

        - a number is pushed;
        - an operator pops two numbers, combines them, and pushes the result.

        For `3 4 + 2 *`: push 3, push 4. The `+` pops 4 and 3 and pushes 7. Push 2. The `*` pops 2 and 7 and pushes 14. At the end the stack holds the answer alone. For subtraction the order of the pops matters: the first number popped is the **second** operand.
    - question:
        id: order-postfix
        type: order
        system: s2
        prompt: Put the stack's contents in the order they occur while evaluating the postfix expression `5 1 2 + -`, starting after the first token.
        steps:
          - "`[5]`"
          - "`[5, 1]`"
          - "`[5, 1, 2]`"
          - "`[5, 3]`"
          - "`[2]`"
        explanation: The three numbers are pushed in turn. The plus pops 2 and 1 and pushes 3. The minus pops 3, then 5, and computes 5 − 3, because the first number popped is the second operand. The result, 2, is left alone on the stack.
    - text: |
        **A stack that throws things away.** Here is a question a share-trading app answers for every day of a stock's history. The **span** of a day is the number of consecutive days, ending with that day, on which the closing price was at most that day's close. For closes of 100, 80, 60, 70, 60, 75 and 85 rupees the spans are 1, 1, 1, 2, 1, 4 and 6. The 75 looks back over 60, 70 and 60 and stops at 80.

        The direct method looks back from each day until it meets a higher close. On a price that rises every day it looks all the way back every time, and the total is quadratic.

        A stack does better. Keep the days that could still stop some later day's look-back. Once a close of 75 has arrived, the earlier days with closes of 60 and 70 can never stop anyone again, because any later day that gets past 75 gets past them too. So throw them away. The stack holds days whose closes **decrease** from bottom to top. For each new day, pop every day whose close is at most today's. Whatever is left on top, if anything, is the nearest earlier day with a higher close, and the span is the distance to it. Then push today.

        One pass can pop many days, so a single step looks costly. But follow one day through the whole run: it is pushed once, and popped at most once. So $n$ days cost at most about $2n$ pushes and pops in all, which is linear. That way of counting, by following each item through its life instead of bounding each step, comes back in [[s3.amortised-analysis]].
  formal:
    - text: |
        **Stack.** A collection with push and pop, where pop returns the item most recently pushed and not yet popped: last in, first out. With a Python list, push is `append` and pop is `pop()`, each constant.

        **Queue.** A collection with enqueue and dequeue, where dequeue returns the item enqueued earliest and not yet dequeued: first in, first out. With a linked list that keeps a head and a tail, or with `collections.deque` using `append` and `popleft`, each is constant. With a Python list, `pop(0)` is linear.

        **Ring buffer.** A queue in $m$ fixed slots with `front` and `length`. Item $k$ is in slot $(\text{front} + k) \bmod m$. Enqueue writes slot $(\text{front} + \text{length}) \bmod m$; dequeue reads slot `front` and sets $\text{front} \leftarrow (\text{front} + 1) \bmod m$.

        **Balanced brackets.** A text is balanced exactly when, reading left to right with a stack of openers, every closer matches the top of the stack, which is then popped, and the stack is empty at the end.

        **Postfix evaluation.** Push numbers. For an operator, pop $b$, then pop $a$, and push $a \mathbin{\text{op}} b$.

        **Monotonic stack.** A stack kept in decreasing order by popping everything not larger than each new item before pushing it. Each item is pushed and popped at most once, so $n$ items cost linear time in all.
