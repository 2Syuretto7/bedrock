            print(True, False)
        explanation: |
          The stack holds the brackets that are open and not yet closed, the most recent on top. An opener is pushed. A closer must find a partner of its own kind on top, and there are two ways for it to fail: the stack is empty, or the top is the wrong kind. At the end, anything still on the stack was never closed. Each of the three checks catches a different mistake, and leaving out any one lets a bad line through. Matching against the oldest opener instead of the newest turns the stack into a queue, which is the wrong order for nesting.
    - question:
        id: write-postfix
        type: code
        mode: write
        system: s2
        prompt: |
          Write `evaluate(tokens)`. `tokens` is a list making up a valid postfix expression: each token is a whole number, or one of the strings `"+"`, `"-"`, `"*"`. Return the value of the expression.
        starter: |
          def evaluate(tokens):
              # Replace the next line with your own.
              return 0

          print(evaluate([3, 4, "+", 2, "*"]), evaluate([9, 4, "-"]))
        solution: |
          def evaluate(tokens):
              stack = []
              for token in tokens:
                  if token == "+" or token == "-" or token == "*":
                      b = stack.pop()
                      a = stack.pop()
                      if token == "+":
                          stack.append(a + b)
                      elif token == "-":
                          stack.append(a - b)
                      else:
                          stack.append(a * b)
                  else:
                      stack.append(token)
              return stack.pop()

          print(evaluate([3, 4, "+", 2, "*"]), evaluate([9, 4, "-"]))
        tests: |
          assert evaluate([3, 4, "+", 2, "*"]) == 14, "3 4 + 2 * is (3 + 4) * 2 = 14"
          assert evaluate([9, 4, "-"]) == 5, "9 4 - is 9 - 4 = 5"
          assert evaluate([7]) == 7, "A single number is its own value"
          assert evaluate([5, 1, 2, "+", "-"]) == 2, "5 1 2 + - is 5 - (1 + 2) = 2"
          assert evaluate([2, 3, 4, "*", "+"]) == 14, "2 3 4 * + is 2 + 3 * 4 = 14"
          assert evaluate([2, 3, "+", 4, "*"]) == 20, "2 3 + 4 * is (2 + 3) * 4 = 20"
          assert evaluate([10, 2, 3, "-", "-"]) == 11, "10 2 3 - - is 10 - (2 - 3) = 11"
          assert evaluate([0, 6, "-"]) == -6, "0 6 - is 0 - 6 = -6"
          assert evaluate([1, 2, "+", 3, 4, "+", "*"]) == 21, "1 2 + 3 4 + * is (1 + 2) * (3 + 4) = 21"
          assert output.strip() == "14 5", "The program should print 14 5"
        wrong:
          - |
            def evaluate(tokens):
                stack = []
                for token in tokens:
                    if token == "+" or token == "-" or token == "*":
                        a = stack.pop()
                        b = stack.pop()
                        if token == "+":
                            stack.append(a + b)
                        elif token == "-":
                            stack.append(a - b)
                        else:
                            stack.append(a * b)
                    else:
                        stack.append(token)
                return stack.pop()

            print(14, 5)
          - |
            def evaluate(tokens):
                stack = []
                for token in tokens:
                    if token == "+" or token == "-" or token == "*":
                        a = stack[0]
                        b = stack[1]
                        stack = stack[2:]
                        if token == "+":
                            stack.append(a + b)
                        elif token == "-":
                            stack.append(a - b)
                        else:
                            stack.append(a * b)
                    else:
                        stack.append(token)
                return stack.pop()

            print(14, 5)
        explanation: |
          The stack holds the values computed and not yet used. A number is such a value and is pushed. An operator uses the two most recent values and replaces them by one. Because the stack returns the most recent first, the first pop yields the **second** operand, so for subtraction pop `b`, then `a`, and compute `a - b`. Taking the operands from the front of the list turns the stack into a queue and pairs up the wrong numbers as soon as an expression nests. Each token costs a constant number of steps, so evaluation is linear in the number of tokens.
    - question:
        id: fix-ring
        type: code
        mode: find-bug
        system: s2
        prompt: |
          A bank's token display keeps the waiting tokens in this ring buffer of 3 slots. The program should print `101 102` and then `103 104 105`. It prints `101 102` and then stops with an `IndexError`. The invariant says that the oldest item is always in a slot from 0 to 2. Find the line that breaks it, and fix it.
        starter: |
          class RingQueue:
              def __init__(self, capacity):
                  self.slots = [None] * capacity
                  self.capacity = capacity
                  self.front = 0
                  self.length = 0

              def enqueue(self, value):
                  if self.length == self.capacity:
                      raise IndexError("the queue is full")
                  back = (self.front + self.length) % self.capacity
                  self.slots[back] = value
                  self.length += 1

              def dequeue(self):
                  if self.length == 0:
                      raise IndexError("the queue is empty")
                  value = self.slots[self.front]
                  self.slots[self.front] = None
                  self.front = self.front + 1
                  self.length -= 1
                  return value


          tokens = RingQueue(3)
          for t in [101, 102, 103]:
              tokens.enqueue(t)
          print(tokens.dequeue(), tokens.dequeue())
          tokens.enqueue(104)
          tokens.enqueue(105)
          print(tokens.dequeue(), tokens.dequeue(), tokens.dequeue())
        solution: |
          class RingQueue:
              def __init__(self, capacity):
                  self.slots = [None] * capacity
                  self.capacity = capacity
                  self.front = 0
                  self.length = 0

              def enqueue(self, value):
