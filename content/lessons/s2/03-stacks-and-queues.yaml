  work:
    - text: Slower now. For each problem, say what the container holds and what its top or front means.
    - question:
        id: write-balanced
        type: code
        mode: write
        system: s2
        prompt: |
          Write `balanced(text)`. Return `True` exactly when the round, square and curly brackets in `text` are well formed: every closer matches the most recent bracket still open, and nothing is left open at the end. Ignore every other character.
        starter: |
          def balanced(text):
              # Replace the next line with your own.
              return True

          print(balanced("f(a[1], {2: (3)})"), balanced("([)]"))
        solution: |
          def balanced(text):
              closes = {")": "(", "]": "[", "}": "{"}
              stack = []
              for c in text:
                  if c in "([{":
                      stack.append(c)
                  elif c in closes:
                      if len(stack) == 0 or stack.pop() != closes[c]:
                          return False
              return len(stack) == 0

          print(balanced("f(a[1], {2: (3)})"), balanced("([)]"))
        tests: |
          assert balanced("f(a[1], {2: (3)})") is True, "f(a[1], {2: (3)}) is well formed"
          assert balanced("([)]") is False, "In ([)] the round bracket closes while the square one is still open"
          assert balanced("(()") is False, "In (() one bracket is never closed"
          assert balanced("())(") is False, "In ())( a bracket is closed before it is opened"
          assert balanced("") is True, "A text with no brackets is well formed"
          assert balanced("no brackets here") is True, "A text with no brackets is well formed"
          assert balanced("{[()]}()") is True, "{[()]}() is well formed"
          assert balanced("]") is False, "A closer with nothing open is not well formed"
          assert balanced("(]") is False, "A round opener cannot be closed by a square closer"
          assert balanced("((((((((((") is False, "Ten openers and no closers"
          assert balanced("()" * 500) is True, "A thousand brackets in matched pairs"
          assert balanced("[(])") is False, "In [(]) the square bracket closes while the round one is still open"
          assert output.strip() == "True False", "The program should print True False"
