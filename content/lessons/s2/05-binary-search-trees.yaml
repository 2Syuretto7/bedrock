        type: numeric
        system: s1
        prompt: |
          At most how many nodes can a binary tree have at depth 4?
        answer: "16"
        explanation: 'The most at each depth doubles: 1, 2, 4, 8, 16.'
    - question:
        id: drill-comparisons
        type: numeric
        system: s1
        prompt: |
          A key sits at depth 5 of a binary search tree. How many comparisons does a successful search for it make?
        answer: "6"
        explanation: One at each of the nodes at depths 0 to 5.
    - question:
        id: drill-in-order
        type: choice
        system: s1
        prompt: |
          In which order does the in-order walk visit a node and its two subtrees?
        options: ["Left subtree, the node, right subtree", "The node, left subtree, right subtree", "Left subtree, right subtree, the node", "Right subtree, the node, left subtree"]
        answer: 0
        explanation: Smaller keys first, then the node's key, then larger keys.
    - question:
        id: drill-successor
        type: choice
        system: s1
        prompt: |
          A node with two children is removed. Where is the key that takes its place?
        options: ["One step right, then left as far as possible", "One step left, then right as far as possible, is the only correct choice", "At the root", "At the deepest leaf"]
        answer: 0
        explanation: That is the successor, the smallest key larger than the removed one. Its mirror image, the largest key in the left subtree, would also work, but it is not the only choice.
    - question:
        id: drill-floor
        type: numeric
        system: s1
        prompt: |
          A binary search tree holds the fares 600, 780, 950, 1100, 1200, 1350 and 1500. What is the floor of 1000, the largest fare not above it?
        answer: "950"
        explanation: 950 is at most 1000, and the next fare, 1100, is above it.
    - question:
        id: predict-in-order
