          - |
            class Node:
                def __init__(self, key):
                    self.key = key
                    self.left = None
                    self.right = None


            def _add(node, key):
                if node is None:
                    return Node(key)
                if key < node.key:
                    node.left = _add(node.left, key)
                elif key > node.key:
                    node.right = _add(node.right, key)
                return node


            def _has(node, key):
                if node is None:
                    return False
                if key == node.key:
                    return True
                if key < node.key:
                    return _has(node.left, key)
                return _has(node.right, key)


            class SearchTree:
                def __init__(self):
                    self.root = None
                    self.length = 0

                def __len__(self):
                    return self.length

                def insert(self, key):
                    if not _has(self.root, key):
                        self.length += 1
                    self.root = _add(self.root, key)

                def __contains__(self, key):
                    return _has(self.root, key)


            print(7, True, False)
        explanation: |
          Both methods walk one path from the root, choosing left or right by comparing keys. `insert` stops early if it meets the key, which keeps keys distinct and the count honest, and otherwise attaches a new node at the empty place where a search would have failed. Sending larger keys left in `insert` while `__contains__` sends them right breaks the invariant that the two must share. The recursive version is correct on bushy trees and fails on the path built from sorted keys, because each level of the tree is one more waiting call: 1500 levels is more than Python allows.
