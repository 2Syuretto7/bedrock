concept: s2.binary-search-trees
minutes: 100
claim: You can state the invariant of a binary search tree, search, insert and remove keys by walking one path from the root, list the keys in sorted order, answer order questions such as the largest key not above a limit, and explain why the cost of every operation is the height of the tree, which is about log2 n when the tree is bushy and n when it is a path.
recalls: [s2.hash-tables, s2.linked-lists]
uses: [s2.arrays-and-dynamic-arrays, f2.loop-invariants, f2.induction-and-strong-induction, f2.equivalence-relations-and-partial-orders, f1.logarithms, f1.arithmetic-and-geometric-series, s1.recursion, s1.classes-and-objects, s1.special-methods, s1.generators-and-context-managers, s0.lists-and-tuples, s0.loops, s0.functions]
leads: [s2.balanced-search-trees, s2.heaps-and-priority-queues, s2.tries, f3.trees-and-their-properties, s3.sorting]
starter: |
  # Scratch space. Each node holds a key and links to two smaller trees.
  class Node:
      def __init__(self, key):
          self.key = key
          self.left = None
          self.right = None

  def insert(node, key):
      if node is None:
          return Node(key)
      if key < node.key:
          node.left = insert(node.left, key)
      elif key > node.key:
          node.right = insert(node.right, key)
      return node

  def in_order(node):
      if node is None:
          return []
      return in_order(node.left) + [node.key] + in_order(node.right)

  root = None
  for fare in [950, 1200, 780, 1500, 1100, 600, 1350]:
      root = insert(root, fare)
  print(in_order(root))
parts:
  recall:
    - text: |
        [[s2.hash-tables]] found any key in a few steps by scattering keys over an array, and ended by admitting that scattering destroys order. [[s2.linked-lists]] gave you nodes joined by links. Today each node gets two links, and the result keeps its keys in order. Three quick pulls first.
  puzzle:
    - text: |
        A travel site holds the fares for every flight between two cities, and fares change all day. It must answer questions like these, thousands of times a second:

        - Is there a fare of exactly ₹1,100?
        - What is the dearest fare I can afford with ₹1,000?
        - Which fares lie between ₹800 and ₹1,200?

        And between questions, fares are added and removed.

        Each structure so far fails one way or another. A hash table answers the first question at once and is helpless with the other two: ₹999 and ₹1,000 land in unrelated buckets. A **sorted** array answers all three with the halving search of [[f2.loop-invariants]], in about $\log_2 n$ steps, but adding a fare means moving every larger fare one place along, which is linear. A linked list in sorted order inserts without moving anything, once you are at the right place, but finding the place means walking, since a list cannot be halved.

        **Can one structure halve like a sorted array and insert like a linked list?**
  intuition:
    - text: |
        Play the game of guessing a number between 1 and 100. A sensible player always asks "is it less than 50?", then "less than 25?", and so on. Each answer throws away half of what is left. The questions the player might ask form a branching chart: a first question at the top, and below each question two possible next questions, one for "yes" and one for "no".

        A **binary search tree** is that chart, built out of the keys themselves. The key at the top, the **root**, plays the part of the first question. Every key smaller than it lives somewhere down its left branch, and every key larger down its right branch. And the same holds at every node below. To find a key, start at the root and compare: smaller, go left; larger, go right; equal, found. Each comparison takes you one level down.

        Now insertion. To add a new key, search for it. The search fails at some empty place, the spot where the key would have been if it were present. Hang the new key there. Nothing else moves. It is the linked list's cheap insertion, guided by the sorted array's halving.

        In the figure, fifteen keys have been inserted one by one. Move the search slider and watch the path. Then press the button to insert the same keys in sorted order.
    - figure: search-tree
      props: { target: 45 }
    - text: |
        In the order given, the fifteen keys form a bushy tree whose deepest key is 3 links below the root, and any search makes at most 4 comparisons. Inserted in sorted order, each new key is larger than everything before it, so it always goes right, and the tree is a single path 14 links deep. It is a linked list wearing a tree's clothes, and a search may make 15 comparisons. Same keys, same rules, different order of arrival. Everything in this lesson and the next turns on that difference.
  derivation:
    - text: |
        **The shape.** A node holds a key and two links, `left` and `right`, each either another node or `None`. The node a link points to is a **child**, and everything reachable from a child is that child's **subtree**. A node with no children is a **leaf**.

        ```python
        class Node:
            def __init__(self, key):
                self.key = key
                self.left = None
                self.right = None
        ```

        The tree is a binary search tree when it keeps one invariant:

        > For every node, every key in its left subtree is smaller than its key, and every key in its right subtree is larger.

        This needs keys that can always be compared, a total order in the sense of [[f2.equivalence-relations-and-partial-orders]]: numbers, strings, dates. Each key is stored once.

        **Searching.** Follow the invariant down.

        ```python
        def contains(node, key):
            while node is not None:
                if key == node.key:
                    return True
                if key < node.key:
                    node = node.left
                else:
                    node = node.right
            return False
        ```

        The loop's invariant, in the sense of [[f2.loop-invariants]], is: if the key is anywhere in the tree, it is in the subtree under `node`. It holds at the start, since that subtree is the whole tree. A step left is safe, because a key smaller than `node.key` cannot be in the right subtree, and a step right likewise. When `node` becomes `None`, the subtree under it is empty, so the key is absent.

        **Inserting.** Search, and attach a new node where the search fell off the tree. Written recursively, as in [[s1.recursion]], each call returns the subtree with the key added, and the caller stores that subtree back in its link:

        ```python
        def insert(node, key):
            if node is None:
                return Node(key)
            if key < node.key:
                node.left = insert(node.left, key)
            elif key > node.key:
                node.right = insert(node.right, key)
            return node
        ```

        Only the empty place changes, from `None` to a new node, so every other node keeps its subtree and the invariant survives.

        **Reading the keys in order.** List the left subtree, then the node, then the right subtree. That is the **in-order** walk, and it produces the keys in increasing order. The proof is an induction on the tree, as in [[f2.induction-and-strong-induction]]: the empty tree gives the empty list, which is sorted; and if the walks of the two subtrees are sorted, then putting the smaller keys first, the node's key next and the larger keys last gives a sorted list too. As a generator from [[s1.generators-and-context-managers]]:

        ```python
        def keys_in_order(node):
            if node is not None:
                yield from keys_in_order(node.left)
                yield node.key
                yield from keys_in_order(node.right)
        ```

        Inserting $n$ keys into a tree and reading them back in order is a way of sorting, called **tree sort**. The algorithms cluster compares it with the other ways in [[s3.sorting]].
    - question:
        id: derivation-invariant
        type: choice
        system: s2
        prompt: |
          A tree has 50 at the root, 30 as the root's left child, and 60 as the right child of 30. Is it a binary search tree?
        options:
          - "No. 60 is in the left subtree of the root, so it must be smaller than 50, and it is not. Comparing each node only with its parent misses this."
          - "Yes. 60 is larger than its parent 30, so it is correctly a right child."
          - "Yes, because a search for 60 would still find it."
          - "No, because 30 should be on the right of 50."
        answer: 0
        explanation: |
          The invariant is about whole subtrees, not just parents. 60 is greater than 30, so it may sit to the right of 30, but every key in the root's left subtree must be less than 50. And a search for 60 would **not** find it: it compares 60 with 50, goes right, and never visits the left subtree. A check that compares each node only with its parent passes this tree and is wrong.
    - text: |
        **The height decides everything.** The **depth** of a node is the number of links from the root down to it, and the **height** of the tree is the greatest depth of any node. A search that ends at a node of depth $d$ makes $d + 1$ comparisons, and an insertion walks the same path. So every operation costs at most the height plus one.

        How small can the height be? At depth 0 there is one node, at depth 1 at most two, at depth 2 at most four, and at depth $d$ at most $2^d$, since each node has at most two children. A tree of height $h$ therefore holds at most

        $$1 + 2 + 4 + \dots + 2^h = 2^{h + 1} - 1$$

        keys, the geometric series of [[f1.arithmetic-and-geometric-series]]. Turned round with [[f1.logarithms]]: $n$ keys need a height of at least $\log_2(n + 1) - 1$. Ten lakh keys fit in a tree of height 19, and a search there makes at most 20 comparisons. That is the halving of a sorted array, kept up while inserting costs only a walk down one path.

        How large can it be? As large as $n - 1$, when every node has one child: a path, as the figure showed for keys arriving in sorted order. Then a search makes up to $n$ comparisons, and the tree is no better than a list. Sorted arrivals are not rare. Records are often added in order of time, of serial number or of name. When keys arrive in random order the tree is bushy on average, with an average depth of about $1.39 \log_2 n$, but a plain binary search tree makes no promise. Making a promise is the work of the next lesson.

        **Order questions.** Because the tree keeps order, the questions the hash table could not answer are each one walk down.

        - *Smallest key:* go left until you cannot. *Largest:* go right.
        - *Floor of $x$, the largest key not above $x$:* walk down as if searching for $x$. Each time you step right from a node, its key is at most $x$ and is the best candidate so far; remember it. When the walk falls off, the last candidate remembered is the answer.
        - *Every key between $a$ and $b$:* do the in-order walk, but skip a left subtree when the node's key is below $a$, and a right subtree when it is above $b$. Only the keys in the range and the paths to them are visited.

        **Removing.** Three cases, by the number of children of the node that holds the key.

        1. *A leaf:* set the link to it to `None`.
        2. *One child:* let the child take the node's place, as removing from a linked list skips a node.
        3. *Two children:* the node cannot simply be cut out, since two subtrees would need one parent link. Find its **successor**, the smallest key in its right subtree: step right once, then left as far as possible. Copy that key into the node, and remove the successor's old node, which has no left child and so falls under case 1 or 2.

        The successor is the right replacement because it is larger than everything in the left subtree and smaller than everything else in the right subtree, so the invariant holds with it in the node's place.
    - question:
        id: order-remove
        type: order
        system: s2
        prompt: |
          In the figure's tree (in the order given), 50 is at the root. Its right child is 70, whose left child is 60, whose left child is 55, which has no children. Put in order the steps that remove 50.
        steps:
          - "Search for 50 and stop at the root, which holds it."
          - "See that the root has two children, so it cannot simply be cut out."
          - "Step right once, to 70, then left as far as possible: 60, then 55."
          - "Copy 55 into the root in place of 50."
          - "Remove the node that held 55 from its old place, by setting 60's left link to `None`."
        explanation: The node to remove has two children, so its key is replaced by its successor, the smallest key in the right subtree, found by one step right and then left until no left child remains. 55 is larger than everything on the left of the root and smaller than everything else on the right, so the invariant holds with 55 at the root. The old node of 55 is a leaf and is removed by clearing one link.
  formal:
    - text: |
        **Binary search tree.** Nodes with a key and links `left` and `right`, such that every key in a node's left subtree is smaller than its key and every key in its right subtree is larger.

        **Depth and height.** The depth of a node is its number of links from the root. The height of the tree is the greatest depth. Searching, inserting and removing each walk one path from the root and cost at most the height plus one comparisons.

        **Bounds on the height.** A tree of height $h$ holds at most $2^{h + 1} - 1$ keys, so $n$ keys need $h \ge \log_2(n + 1) - 1$. A path of $n$ keys has height $n - 1$, which is what sorted insertion produces.

        **In-order walk.** Left subtree, node, right subtree. It lists the keys in increasing order, and its cost is linear.

        **Floor.** The largest key at most $x$: walk as if searching for $x$, remembering each key passed on a step to the right.

        **Removal.** A leaf is cut off. A node with one child is replaced by that child. A node with two children takes its successor's key, and the successor's node is removed instead.
  drill:
    - text: Seconds each. At every node, ask only whether to go left or right.
    - question:
