            class Node:
                def __init__(self, key):
                    self.key = key
                    self.left = None
                    self.right = None

            def floor(node, x):
                if node is None:
                    return None
                best = None
                for side in [floor(node.left, x), floor(node.right, x)]:
                    if side is not None and (best is None or side > best):
                        best = side
                if node.key <= x and (best is None or node.key > best):
                    best = node.key
                return best

