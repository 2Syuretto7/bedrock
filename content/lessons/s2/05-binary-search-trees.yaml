        solution: |
          class Node:
              def __init__(self, key):
                  self.key = key
                  self.left = None
                  self.right = None

          def insert(node, key):
              if node is None:
                  return Node(key)
              if key < node.key:
                  node.left = insert(node.left, key)
              elif key > node.key:
                  node.right = insert(node.right, key)
              return node

          def floor(node, x):
              best = None
              while node is not None:
                  if node.key == x:
                      return x
                  if node.key < x:
                      best = node.key
                      node = node.right
                  else:
                      node = node.left
              return best

          root = None
          for fare in [950, 1200, 780, 1500, 1100, 600, 1350]:
              root = insert(root, fare)
          print(floor(root, 1000), floor(root, 500))
        tests: |
          import random
          random.seed(3)
