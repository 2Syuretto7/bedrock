        solution: |
          class Node:
              def __init__(self, key):
                  self.key = key
                  self.left = None
                  self.right = None


          class SearchTree:
              def __init__(self):
                  self.root = None
                  self.length = 0

              def __len__(self):
                  return self.length

              def insert(self, key):
                  if self.root is None:
                      self.root = Node(key)
                      self.length += 1
                      return
                  node = self.root
                  while True:
                      if key == node.key:
                          return
                      if key < node.key:
                          if node.left is None:
                              node.left = Node(key)
                              self.length += 1
                              return
                          node = node.left
                      else:
                          if node.right is None:
                              node.right = Node(key)
                              self.length += 1
                              return
                          node = node.right

              def __contains__(self, key):
                  node = self.root
                  while node is not None:
                      if key == node.key:
                          return True
                      if key < node.key:
                          node = node.left
                      else:
                          node = node.right
                  return False


          fares = SearchTree()
          for f in [950, 1200, 780, 1500, 1100, 600, 1350]:
              fares.insert(f)
          fares.insert(1100)
          print(len(fares), 1100 in fares, 1000 in fares)
