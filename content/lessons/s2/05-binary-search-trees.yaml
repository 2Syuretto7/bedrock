        explanation: |
          The walk is a search for $x$ that keeps a candidate. Whenever a node's key is below $x$, it is a possible answer, and anything larger that is still at most $x$ can only be in its right subtree, so remember it and go right. Whenever a node's key is above $x$, it and its whole right subtree are too big, so go left. When the walk falls off the tree, the last candidate is the largest key at most $x$. Stopping as soon as a node's right child is too large misses keys deeper in that child's left subtree. Visiting both subtrees everywhere gives the right answer by reading the whole tree, which throws away the reason for keeping it in order.
    - question:
        id: predict-height
        type: predict
        system: s2
        prompt: What does this show?
        code: |
          class Node:
              def __init__(self, key):
                  self.key = key
                  self.left = None
                  self.right = None

          def insert(node, key):
              if node is None:
                  return Node(key)
              if key < node.key:
                  node.left = insert(node.left, key)
              elif key > node.key:
                  node.right = insert(node.right, key)
              return node

          def height(node):
              if node is None:
                  return -1
              return 1 + max(height(node.left), height(node.right))

          a = None
          for k in [1, 2, 3, 4, 5, 6, 7]:
              a = insert(a, k)
          b = None
          for k in [4, 2, 6, 1, 3, 5, 7]:
              b = insert(b, k)
          print(height(a), height(b))
        output: "6 2"
        explanation: |
          The same seven keys. In sorted order each goes to the right of the last, and the tree is a path of height 6. Starting from the middle key, 4, and then the middles of each half, gives the bushiest tree possible, of height 2. The empty tree has height $-1$ so that a single node, one more than the empty tree, has height 0.
    - question:
        id: work-sorted-input
        type: numeric
        system: s2
        prompt: |
          A plain binary search tree receives ten lakh order numbers, which arrive in increasing order. How many comparisons does a search for the last order number make?
        answer: "1000000"
        explanation: |
          Each new order number is larger than every key before it, so it goes right at every node, and the tree is a path of ten lakh nodes. The last one is at depth 999999, and a search compares with every node on the way: $10^6$ comparisons. A tree of the smallest possible height would need 20. The structure is correct either way. Only its shape differs, and the shape was decided by the order of arrival.
    - question:
        id: work-hash-or-tree
        type: choice
        system: s2
        prompt: |
          A program keeps 10 lakh customer records by mobile number. It only ever asks "is this number registered, and what is its record?". Should it use a hash table or a binary search tree?
        options:
          - "A hash table. It answers exact lookups in a constant number of steps on average, and the program never asks a question about order, which is all the tree's extra cost would buy."
          - "A binary search tree, because it never has collisions."
          - "A binary search tree, because its lookups are faster than a hash table's."
          - "Either, since both have a cost that does not depend on the number of records."
        answer: 0
        explanation: |
          A bushy tree's lookup makes about 20 comparisons for ten lakh keys, which is good, and a hash table's makes one or two, which is better. The tree's advantage is order: smallest, largest, floor, ranges, the next key. If none of those questions is ever asked, a tree pays for an order nobody uses. Choose the tree when order matters, and the hash table when only equality does.
  connections:
    - text: |
        The puzzle asked for a structure that halves like a sorted array and inserts like a linked list. A binary search tree is binary search frozen into links: the root splits the keys into smaller and larger, and so does every node below. A search compares once per level. An insertion is a search that failed, with a new node hung at the empty place. The keys never move, and the in-order walk reads them back sorted, so questions about order, which a hash table cannot answer, are each one walk down.

        All of it rests on the height. Every operation walks one path, so it costs the height plus one. A bushy tree of ten lakh keys has height about 20. A tree fed keys in sorted order is a path of ten lakh. The plain tree lets the order of arrival choose its shape.

        Trees of this kind run much of the software you use. A database index lets a query find the bookings between two dates without reading every booking. A file system finds a name in a large folder. The scheduler in the Linux kernel keeps runnable tasks in a search tree ordered by how much processor time each has had, and picks the leftmost. Each of these is a **balanced** tree, which never lets the height grow beyond a small multiple of $\log_2 n$. Trees as mathematical objects, with their counts and their properties, are studied in [[f3.trees-and-their-properties]].

        A tree that cannot be trusted to stay bushy is a tree that cannot be trusted. The repair is small and local: after an insertion, look at the nodes on the path just walked, and wherever one side has grown too much deeper than the other, turn the links round a little so that it is level again, without disturbing the order. That turn, the rotation, and the promise it buys are [[s2.balanced-search-trees]].
