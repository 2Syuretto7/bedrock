        explanation: 45 is smaller than 50, so if it is present it is in the left subtree.
    - question:
        id: drill-smallest
        type: choice
        system: s1
        prompt: |
          Where is the smallest key of a binary search tree?
        options: ["At the end of the path that goes left from the root until it cannot", "At the root", "At the deepest leaf", "In the root's right subtree"]
        answer: 0
        explanation: Every step left reaches a smaller key, and a node with no left child has nothing smaller below it.
    - question:
        id: drill-sorted-height
        type: numeric
        system: s1
        prompt: |
          The keys 1, 2, 3, 4, 5, 6, 7 are inserted in that order into an empty binary search tree. What is its height?
        answer: "6"
        explanation: Each key goes right of the one before, making a path of 7 nodes and 6 links.
    - question:
        id: drill-best-height
        type: numeric
        system: s1
        prompt: |
          What is the smallest possible height of a binary search tree holding 7 keys?
        answer: "2"
        explanation: A root, two children and four grandchildren hold $1 + 2 + 4 = 7$ keys.
    - question:
