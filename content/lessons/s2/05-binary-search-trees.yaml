              for _x in range(-5, 1010, 7):
                  _below = [_v for _v in _vals if _v <= _x]
                  _want = max(_below) if _below else None
                  assert floor(_r, _x) == _want, "floor(tree, " + str(_x) + ") should be " + str(_want) + " for the keys " + str(sorted(_vals))
          assert floor(None, 10) is None, "The empty tree has no floor"
          _reads = [0]
          class _Spy:
              def __init__(self, key, left, right):
                  self.key = key
                  self._l = left
                  self._r = right
              @property
              def left(self):
                  _reads[0] += 1
                  return self._l
              @property
              def right(self):
                  _reads[0] += 1
                  return self._r
          def _build(lo, hi):
              if lo > hi:
                  return None
              mid = (lo + hi) // 2
              return _Spy(mid * 2, _build(lo, mid - 1), _build(mid + 1, hi))
          _big = _build(0, 1022)
          _reads[0] = 0
          assert floor(_big, 1001) == 1000, "In a tree of the even numbers 0 to 2044, the floor of 1001 is 1000"
          assert _reads[0] <= 40, "floor followed " + str(_reads[0]) + " links in a tree of height 9; it should walk one path"
          assert output.strip() == "950 None", "The program should print 950 None"
