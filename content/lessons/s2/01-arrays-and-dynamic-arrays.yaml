            class DynamicArray:
                def __init__(self):
                    self.capacity = 1
                    self.length = 0
                    self.slots = [None]
                    self.moved = 0

                def _move_to(self, capacity):
                    block = [None] * capacity
                    for i in range(self.length):
                        block[i] = self.slots[i]
                        self.moved += 1
                    self.slots = block
                    self.capacity = capacity

                def append(self, value):
                    if self.length == self.capacity:
                        self._move_to(2 * self.capacity)
                    self.slots[self.length] = value
                    self.length += 1

                def pop(self):
                    if self.length == 0:
                        raise IndexError("pop from an empty array")
                    self.length -= 1
                    value = self.slots[self.length]
                    self.slots[self.length] = None
                    if self.length <= self.capacity // 4:
                        self._move_to(self.capacity // 2)
                    return value


            a = DynamicArray()
            for k in range(1024):
                a.append(k)
            start = a.moved
            for _ in range(1000):
                a.append(0)
                a.pop()
            print(a.moved - start)
        explanation: |
          With the rule "halve as soon as the items fit in half", the thresholds for growing and shrinking touch. At 1024 items in a block of 1024, an append doubles the block to 2048, and the pop that follows leaves 1024 items, exactly half, so the block halves straight back. Each pair of calls copies about 2048 items. Shrinking only at a quarter puts a gap between the thresholds. After the one move to 2048, the items would have to fall to 512 before the block shrinks, and after any halving the block is half full, so a long run of calls must pass before the next move. The guard `self.capacity > 1` matters too: without it, popping the last item halves a block of 1 to a block of 0, and the next append doubles 0 to 0 and has nowhere to write.
    - question:
        id: write-grid
        type: code
        mode: write
        system: s2
        prompt: |
          A cinema hall's seats form a grid of `rows` rows and `cols` seats per row. `Grid` stores the whole grid in **one** list, `self.cells`, row after row. Write `get(i, j)` and `put(i, j, value)` for row `i` and seat `j`, both counted from 0. Both must raise `IndexError` for a seat that does not exist, even when the position $i \cdot c + j$ happens to land inside the list.
        starter: |
          class Grid:
              def __init__(self, rows, cols):
                  self.rows = rows
                  self.cols = cols
                  self.cells = [0] * (rows * cols)

              def get(self, i, j):
                  pass

              def put(self, i, j, value):
                  pass


          hall = Grid(4, 5)
          hall.put(2, 3, 1)
          print([k for k, seat in enumerate(hall.cells) if seat == 1], hall.get(2, 3))
        solution: |
          class Grid:
              def __init__(self, rows, cols):
                  self.rows = rows
                  self.cols = cols
                  self.cells = [0] * (rows * cols)

              def _position(self, i, j):
                  if not (0 <= i < self.rows and 0 <= j < self.cols):
                      raise IndexError("no seat at row " + str(i) + ", seat " + str(j))
                  return i * self.cols + j

              def get(self, i, j):
                  return self.cells[self._position(i, j)]

              def put(self, i, j, value):
                  self.cells[self._position(i, j)] = value


          hall = Grid(4, 5)
          hall.put(2, 3, 1)
          print([k for k, seat in enumerate(hall.cells) if seat == 1], hall.get(2, 3))
        tests: |
          _g = Grid(4, 5)
          _g.put(2, 3, 9)
          assert _g.cells[13] == 9, "Row 2, seat 3 of a grid with 5 seats per row is position 2 * 5 + 3 = 13"
          assert _g.get(2, 3) == 9, "get should return what put stored"
          _g.put(0, 0, 1)
          _g.put(3, 4, 2)
          assert _g.cells[0] == 1 and _g.cells[19] == 2, "The first seat is position 0 and the last is position 19"
          _t = Grid(2, 3)
          _t.put(1, 0, 5)
          assert _t.cells == [0, 0, 0, 5, 0, 0], "Row 1, seat 0 of a grid with 3 seats per row is position 3"
          for _bad in [(0, 5), (1, -1), (4, 0), (-1, 2)]:
              try:
                  _g.get(_bad[0], _bad[1])
                  assert False, "get" + str(_bad) + " should raise IndexError"
              except IndexError:
                  pass
              try:
                  _g.put(_bad[0], _bad[1], 0)
                  assert False, "put" + str(_bad) + " should raise IndexError"
              except IndexError:
                  pass
          assert output.strip() == "[13] 1", "The program should print [13] 1"
        wrong:
          - |
            class Grid:
                def __init__(self, rows, cols):
                    self.rows = rows
                    self.cols = cols
                    self.cells = [0] * (rows * cols)

                def get(self, i, j):
                    return self.cells[i * self.cols + j]

                def put(self, i, j, value):
                    self.cells[i * self.cols + j] = value


            hall = Grid(4, 5)
            hall.put(2, 3, 1)
            print([k for k, seat in enumerate(hall.cells) if seat == 1], hall.get(2, 3))
          - |
            class Grid:
                def __init__(self, rows, cols):
                    self.rows = rows
                    self.cols = cols
                    self.cells = [0] * (rows * cols)

                def _position(self, i, j):
                    if not (0 <= i < self.rows and 0 <= j < self.cols):
                        raise IndexError("no such seat")
                    return j * self.rows + i

                def get(self, i, j):
                    return self.cells[self._position(i, j)]

                def put(self, i, j, value):
                    self.cells[self._position(i, j)] = value


            hall = Grid(4, 5)
            hall.put(2, 3, 1)
            print([k for k, seat in enumerate(hall.cells) if seat == 1], hall.get(2, 3))
          - |
            class Grid:
                def __init__(self, rows, cols):
                    self.rows = rows
                    self.cols = cols
                    self.cells = [0] * (rows * cols)

                def _position(self, i, j):
                    if not (0 <= i <= self.rows and 0 <= j <= self.cols):
                        raise IndexError("no such seat")
                    return i * self.cols + j

                def get(self, i, j):
                    return self.cells[self._position(i, j)]

                def put(self, i, j, value):
                    self.cells[self._position(i, j)] = value


            hall = Grid(4, 5)
            hall.put(2, 3, 1)
            print([k for k, seat in enumerate(hall.cells) if seat == 1], hall.get(2, 3))
        explanation: |
          Row-major order puts row $i$ after $i$ full rows of `cols` seats, so seat $(i, j)$ is at $i \cdot \text{cols} + j$. Without its own check, the formula never complains: seat 5 of row 0 does not exist, but $0 \cdot 5 + 5 = 5$ is a perfectly good position, the first seat of row 1, and a booking would land in the wrong row with no error. Negative numbers are worse, because Python counts them from the end of the list. Putting the check in one helper that both methods call keeps the two from disagreeing. Storing the grid column after column, at $j \cdot \text{rows} + i$, is a layout that is also used, but it is not the one asked for here.
    - question:
        id: work-fixed-step
        type: numeric
        system: s2
        prompt: |
          A dynamic array starts with room for 100 and, whenever it is full, moves to a block with 100 **more** slots. 10000 items are appended. How many item copies are made in all?
        answer: "495000"
        explanation: |
          The moves come at 100, 200, and so on up to 9900 items: $100 + 200 + \dots + 9900 = 100 \times (1 + 2 + \dots + 99) = 100 \times 4950 = 495000$. Doubling from 100 instead moves at 100, 200, 400, up to 6400, which is $12700$ copies. Double the appends to 20000 and the first count roughly quadruples while the second roughly doubles: quadratic against linear.
    - question:
        id: work-deadline
        type: choice
        system: s2
        prompt: |
          A game draws a frame every 16 milliseconds, and each frame appends a few hundred items to a list that has grown to a crore of items. Every so often a frame stutters badly. Which explanation and remedy are right?
        options:
          - "An append that finds the block full copies the whole crore of items, which can take longer than one frame. The constant amortised cost is an average over many appends, not a promise about each one, so reserve the room in advance or keep the list from growing during play."
          - "Appending is amortised constant, so no single append can be slow, and the stutter must come from somewhere else."
          - "The list is too long for random access, so reading it becomes slow; split it into shorter lists."
          - "Doubling wastes half the block, and the wasted memory slows every append; grow by a fixed amount instead."
        answer: 0
        explanation: |
          An amortised cost bounds the total over a sequence, so the average per append is small. It says nothing about the worst single append, and that one copies every item. A frame that happens to contain it is late. Code with a deadline on **each** operation, such as games, audio and control systems, avoids the move in the middle of the work, for example by making the block big enough before play starts. Growing by a fixed amount would make things worse: moves would come far more often, and the total would become quadratic.
  connections:
    - text: |
        The two puzzles had one answer. An array reaches any position in one step because its items sit side by side at equal spacing, so an address is arithmetic, and that same packing leaves no room in the middle, so the front is dear. And a list grows cheaply because it moves rarely: by doubling, the moves get rarer exactly as fast as they get dearer, and a geometric series keeps their total below $2n$.

        You also have a way to talk about cost that will carry you through this cluster: count steps, and ask what happens when $n$ doubles. The four answers, the same, one more, twice, four times, are the constant, logarithmic, linear and quadratic shapes. The discrete mathematics cluster will make them exact in [[f3.asymptotic-notation]], and the algorithms cluster will return to averaging over a sequence in [[s3.amortised-analysis]], where the same doubling turns up in hash tables and in a queue built from two stacks.

        Arrays are everywhere below the surface. The vectors and matrices of machine learning are arrays in row-major order, and a large part of making numerical code fast is walking memory in the order it is laid out. A string is an array of characters. A video frame is an array of pixels. Two structures in this cluster are built directly on arrays: a stack, in which items arrive and leave only at the cheap end, in [[s2.stacks-and-queues]], and a hash table, which turns a key into a position so that random access works for names as well as numbers, in [[s2.hash-tables]].

        But first, the opposite design. The array is dear at the front because its items are packed together. What if they were not? Let every item live wherever there is room and carry the address of the next one. Then inserting anywhere disturbs nobody, and random access is lost. That trade is [[s2.linked-lists]].
