    - question:
        id: predict-list-ops
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          xs = [3, 8, 1]
          xs.insert(1, 5)
          last = xs.pop()
          print(xs, last)
        output: "[3, 5, 8] 1"
        explanation: Inserting 5 at position 1 moves 8 and 1 along, giving [3, 5, 8, 1]. Then `pop` removes and returns the last item, 1, which costs a constant number of steps.
    - question:
        id: predict-doubling
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          room, count, moves = 1, 0, []
          for _ in range(20):
              if count == room:
                  moves.append(count)
                  room *= 2
              count += 1
          print(moves, room)
        output: "[1, 2, 4, 8, 16] 32"
        explanation: The block is full, and a move happens, each time the count reaches the room. After 20 appends the last move was at 16, to a block with room for 32.
  work:
    - text: Slower now. Before writing a method, say which invariant it must keep.
    - question:
        id: work-front-total
        type: numeric
        system: s2
        prompt: |
          A program builds an array of 1000 items by inserting each new item at the front. The first insertion moves 0 items, the second moves 1, and so on. How many moves are made in all?
        answer: "499500"
        explanation: |
          The moves are $0 + 1 + 2 + \dots + 999 = \frac{999 \times 1000}{2} = 499500$. Building the same array by appending takes 1000 writes and no moves. For a lakh of items the gap widens a hundredfold more: about 500 crore moves against a lakh of writes.
    - question:
        id: write-dynamic-array
        type: code
        mode: write
        system: s2
        prompt: |
          Finish `DynamicArray`. Its block is the list `self.slots`, which always has exactly `self.capacity` slots, and must never be grown with the list's own `append`.

          - `append(value)`: if the block is full, move every item to a new block of twice the capacity, adding 1 to `self.moved` for each item copied. Then write `value` into the first free slot.
          - `a[i]`: return the item at position `i`, and raise `IndexError` if `i` is not one of $0, 1, \dots, \text{length} - 1$. Negative positions are not allowed.
        starter: |
          class DynamicArray:
              def __init__(self):
                  self.capacity = 1
                  self.length = 0
                  self.slots = [None]
                  self.moved = 0

              def __len__(self):
                  return self.length

              def append(self, value):
                  pass

              def __getitem__(self, i):
                  pass


          a = DynamicArray()
          for k in range(10):
              a.append(k * k)
          print(len(a), a.capacity, a.moved, a[9])
        solution: |
          class DynamicArray:
              def __init__(self):
                  self.capacity = 1
                  self.length = 0
                  self.slots = [None]
                  self.moved = 0

              def __len__(self):
                  return self.length

              def append(self, value):
                  if self.length == self.capacity:
                      bigger = [None] * (2 * self.capacity)
                      for i in range(self.length):
                          bigger[i] = self.slots[i]
                          self.moved += 1
                      self.slots = bigger
                      self.capacity = 2 * self.capacity
                  self.slots[self.length] = value
                  self.length += 1

              def __getitem__(self, i):
                  if not 0 <= i < self.length:
                      raise IndexError("index out of range")
                  return self.slots[i]


          a = DynamicArray()
          for k in range(10):
              a.append(k * k)
          print(len(a), a.capacity, a.moved, a[9])
        tests: |
          _e = DynamicArray()
          assert len(_e) == 0, "A new array is empty"
          try:
              _e[0]
              assert False, "An empty array has no position 0, so a[0] should raise IndexError"
          except IndexError:
              pass
          _e.append("x")
          assert len(_e) == 1 and _e[0] == "x", "One append should give an array holding that one item"
          assert _e.capacity == 1 and _e.moved == 0, "The first append fits in the room for 1, so nothing moves"
          _a = DynamicArray()
          for _k in range(1000):
              _a.append(_k * _k)
          assert len(_a) == 1000, "After 1000 appends the length should be 1000"
          assert _a[0] == 0 and _a[500] == 250000 and _a[999] == 998001, "The items should come back in the order they were appended"
          assert len(_a.slots) == _a.capacity, "The block should have exactly capacity slots"
          assert _a.capacity == 1024, "Doubling from 1, the room after 1000 appends should be 1024"
          assert _a.moved == 1023, "Doubling from 1, 1000 appends should copy 1 + 2 + ... + 512 = 1023 items"
          for _bad in [1000, 1023, -1]:
              try:
                  _a[_bad]
                  assert False, "a[" + str(_bad) + "] should raise IndexError"
              except IndexError:
                  pass
          assert output.strip() == "10 16 15 81", "The program should print 10 16 15 81"
        wrong:
          - |
            class DynamicArray:
                def __init__(self):
                    self.capacity = 1
                    self.length = 0
                    self.slots = [None]
                    self.moved = 0

                def __len__(self):
                    return self.length

                def append(self, value):
                    if self.length == self.capacity:
                        bigger = [None] * (self.capacity + 1)
                        for i in range(self.length):
                            bigger[i] = self.slots[i]
                            self.moved += 1
                        self.slots = bigger
                        self.capacity = self.capacity + 1
                    self.slots[self.length] = value
                    self.length += 1

                def __getitem__(self, i):
                    if not 0 <= i < self.length:
                        raise IndexError("index out of range")
                    return self.slots[i]


            a = DynamicArray()
            for k in range(10):
                a.append(k * k)
            print(len(a), a.capacity, a.moved, a[9])
          - |
            class DynamicArray:
                def __init__(self):
                    self.capacity = 1
                    self.length = 0
                    self.slots = [None]
                    self.moved = 0

                def __len__(self):
                    return self.length

                def append(self, value):
                    if self.length == self.capacity:
                        bigger = [None] * (2 * self.capacity)
                        for i in range(self.length):
                            bigger[i] = self.slots[i]
                            self.moved += 1
                        self.slots = bigger
                        self.capacity = 2 * self.capacity
                    self.slots[self.length] = value
                    self.length += 1

                def __getitem__(self, i):
                    return self.slots[i]


            a = DynamicArray()
            for k in range(10):
                a.append(k * k)
            print(len(a), a.capacity, a.moved, a[9])
          - |
            class DynamicArray:
                def __init__(self):
                    self.capacity = 1
                    self.length = 0
                    self.slots = [None]
                    self.moved = 0

                def __len__(self):
                    return self.length

                def append(self, value):
                    self.slots.append(value)
                    self.length += 1

                def __getitem__(self, i):
                    if not 0 <= i < self.length:
                        raise IndexError("index out of range")
                    return self.slots[i + 1]


            a = DynamicArray()
            for k in range(10):
                a.append(k * k)
            print(len(a), a.capacity, a.moved, a[9])
        explanation: |
          `append` keeps the invariant in two cases. If there is a free slot, writing into slot `length` and adding 1 keeps the first `length` slots filled in order. If the block is full, copying every item into a block twice the size first makes a free slot, and then the same two steps work. Copying from slot 0 upwards is safe here, unlike an insertion, because the old and new blocks are different lists. `__getitem__` must check the position itself: the block has spare slots beyond `length`, holding `None`, and a Python list would also accept $-1$ and quietly return the last slot of the **block**, which is not an item at all.
    - question:
        id: fix-shrink
        type: code
        mode: find-bug
        system: s2
        prompt: |
          This `DynamicArray` doubles its block when full and gives room back when items are popped. Every answer it gives is right. But the program at the bottom, which holds 1024 items and then appends and pops one item in turn a thousand times, copies over twenty lakh items, about two thousand for every call. Find why, and change the rule for shrinking so that the block still shrinks when it is mostly empty but this pattern copies only once. The program should then print 1024.
        starter: |
          class DynamicArray:
              def __init__(self):
                  self.capacity = 1
                  self.length = 0
                  self.slots = [None]
                  self.moved = 0

              def _move_to(self, capacity):
                  block = [None] * capacity
                  for i in range(self.length):
                      block[i] = self.slots[i]
                      self.moved += 1
                  self.slots = block
                  self.capacity = capacity

              def append(self, value):
                  if self.length == self.capacity:
                      self._move_to(2 * self.capacity)
                  self.slots[self.length] = value
                  self.length += 1

              def pop(self):
                  if self.length == 0:
                      raise IndexError("pop from an empty array")
                  self.length -= 1
                  value = self.slots[self.length]
                  self.slots[self.length] = None
                  if self.capacity > 1 and self.length <= self.capacity // 2:
                      self._move_to(self.capacity // 2)
                  return value


          a = DynamicArray()
          for k in range(1024):
              a.append(k)
          start = a.moved
          for _ in range(1000):
              a.append(0)
              a.pop()
          print(a.moved - start)
        solution: |
          class DynamicArray:
              def __init__(self):
                  self.capacity = 1
                  self.length = 0
                  self.slots = [None]
                  self.moved = 0

              def _move_to(self, capacity):
                  block = [None] * capacity
                  for i in range(self.length):
                      block[i] = self.slots[i]
                      self.moved += 1
                  self.slots = block
                  self.capacity = capacity

              def append(self, value):
                  if self.length == self.capacity:
                      self._move_to(2 * self.capacity)
                  self.slots[self.length] = value
                  self.length += 1

              def pop(self):
                  if self.length == 0:
                      raise IndexError("pop from an empty array")
                  self.length -= 1
                  value = self.slots[self.length]
                  self.slots[self.length] = None
                  if self.capacity > 1 and self.length <= self.capacity // 4:
                      self._move_to(self.capacity // 2)
                  return value


          a = DynamicArray()
          for k in range(1024):
              a.append(k)
          start = a.moved
          for _ in range(1000):
              a.append(0)
              a.pop()
          print(a.moved - start)
        tests: |
          _a = DynamicArray()
          for _k in range(100):
              _a.append(_k)
          assert [_a.pop() for _ in range(100)] == list(range(99, -1, -1)), "pop should return the items last first"
          try:
              _a.pop()
              assert False, "pop on an empty array should raise IndexError"
          except IndexError:
              pass
          _a.append(7)
          _a.append(8)
          assert _a.pop() == 8 and _a.pop() == 7, "After being emptied, the array should still accept appends"
          _one = DynamicArray()
          _one.append(1)
          _one.pop()
          _one.append(2)
          assert _one.pop() == 2, "Popping the only item and appending again should work"
          _b = DynamicArray()
          for _k in range(1024):
              _b.append(_k)
          _start = _b.moved
          for _ in range(1000):
              _b.append(0)
              _b.pop()
          assert _b.moved - _start <= 2048, "Appending and popping in turn at 1024 items should not copy on every call"
          for _ in range(1020):
              _b.pop()
          assert _b.capacity <= 16, "With 4 items left out of 1024, the block should have shrunk"
          assert output.strip() == "1024", "The program should print 1024"
