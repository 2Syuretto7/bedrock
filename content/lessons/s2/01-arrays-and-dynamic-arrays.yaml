concept: s2.arrays-and-dynamic-arrays
minutes: 100
claim: You can explain how an array reaches position i in one step, count what inserting and removing cost and say how that count grows with the length, store a grid in one array, and build a list that grows by doubling, showing that n appends cost fewer than 3n steps in all though one append can cost n.
recalls: [f2.equivalence-relations-and-partial-orders, s1.testing-with-pytest]
uses: [f2.relations-and-functions-between-sets, f2.loop-invariants, f1.arithmetic-and-geometric-series, f1.logarithms, f1.coordinates-lines-and-slope, h0.alignment-and-the-size-of-things, s0.lists-and-tuples, s0.loops, s0.functions, s1.classes-and-objects, s1.special-methods, s1.exceptions, s1.comprehensions-and-iterators]
leads: [s2.linked-lists, s2.stacks-and-queues, s2.hash-tables, f3.asymptotic-notation, s3.amortised-analysis]
bridges:
  f2.equivalence-relations-and-partial-orders: |
    The logic cluster ended with a promise: that a data structure is a set of values with operations on it, and that its promises are invariants. Here is the first one. An array of $n$ items is a function from the positions $0, 1, \dots, n - 1$ to values. The growing list you build today keeps an invariant you can state exactly: the first `length` slots of its block hold the items in order, and `length` is at most the block's capacity. Every method either keeps that true in a few steps or, when the block is full, restores it by moving house.
starter: |
  # Scratch space. A list lives in a block of fixed room. When the block is full, a bigger block
  # is found and every item is copied across. copies_made counts the copying for a run of appends,
  # under two rules for the room in the new block: one more slot, or twice as many.
  def copies_made(appends, grow):
      room = 1
      count = 0
      copies = 0
      for _ in range(appends):
          if count == room:
              copies += count
              room = grow(room)
          count += 1
      return copies

  for n in [1000, 2000, 4000, 8000]:
      print(n, copies_made(n, lambda room: room + 1), copies_made(n, lambda room: 2 * room))
parts:
  recall:
    - text: |
        [[f2.equivalence-relations-and-partial-orders]] closed the logic cluster by saying what a data structure is: values, operations on them, and invariants that the operations keep. This cluster builds them, one at a time, and the first is the plainest. You will also lean on [[s1.testing-with-pytest]], because the code today has edges everywhere: the empty array, the full block, the last slot. Three quick pulls first.
  puzzle:
    - text: |
        A music app keeps your playlist of 2 lakh songs in a Python list. Here is roughly what three operations cost on an ordinary laptop, each done 200 times.

        | Operation | Time for 200 |
        | --- | --- |
        | read the song in the middle, `songs[100000]` | about 0.01 ms |
        | add a song at the end, `songs.append(s)` | about 0.01 ms |
        | insert a song at the front, `songs.insert(0, s)` | about 20 ms |

        The third is a thousand times slower than the others. But the first row should puzzle you more. Python went straight to the song in the middle without passing the 1,00,000 before it, and a list ten times longer would be no slower. A person asked for the 1,00,000th name on a list would have to count.

        There is a second puzzle hiding in the second row. A list is kept in one block of memory, and a block cannot be stretched, because the memory just past its end may belong to something else. So when the block is full and you append, there is only one thing that can happen: a bigger block is found elsewhere and **every song is copied across**. Appending to a full list of 2 lakh songs costs 2 lakh copies. Yet appending is quick, and you have relied on that in almost every program you have written.

        Run the starter. It counts the copying for two rules for how much room the new block gets. With one more slot each time, 1000 appends make 4,99,500 copies, and doubling the appends quadruples the copies. With twice the room each time, 1000 appends make 1023 copies, and doubling the appends roughly doubles them.

        **How can a list reach any position in one step? Why does the same arrangement make the front so dear? And why does doubling make the copying almost free, when a single append can still copy everything?**
  intuition:
    - text: |
        A computer's memory is one very long row of numbered boxes. The number of a box is its **address**, and the machine can open any box in one step if it is given the address. That is its only trick.

        Think of a new layout of plots on the edge of a city, every plot 30 feet wide, numbered from the corner. Where does plot 40 begin? At $30 \times 40 = 1200$ feet from the corner. Nobody walks past plots 0 to 39 counting them. The answer comes from arithmetic, because the plots are side by side, with no gaps, and all the same width.

        An **array** stores a list the same way. It takes a run of boxes next to each other and gives every item the same room. If the run starts at address 1000 and each item takes 8 boxes, item $i$ starts at $1000 + 8i$. One multiplication and one addition, and item 1,00,000 is found as fast as item 5.

        And there is the price. With no gaps, there is nowhere to put a new item in the middle. To insert at the front, every item must shuffle one place along, as a whole row in a cinema stands up to let one latecomer reach the aisle seat.

        The block's size is the other price. A family whose flat is full cannot push the walls into the neighbour's flat. It moves to a bigger flat and carries everything. Moving is hard work, so a sensible family takes a flat twice the size, and then it is a long while before it has to move again. Step through the appends in the figure, and watch the tall bars, which are the moves.
    - figure: doubling-array
      props: { appends: 9 }
    - text: |
        Most appends cost one step. A few are tall: the 2nd, 3rd, 5th, 9th and 17th, each of which finds the block full and copies everything first. The tall bars get **taller**, doubling each time, and they get **rarer**, the gaps between them doubling too. The two doublings cancel. Spread each tall bar over the cheap appends that follow it, and it adds about one step to each. After 17 appends the figure counts 17 writes and 31 copies: 48 steps, fewer than 3 per append.
  derivation:
    - text: |
        **The address formula.** An array is a block of memory holding $n$ slots of equal size $s$, starting at address $a$. Slot $i$ is at

        $$\text{address}(i) = a + s \cdot i,$$

        a straight line with slope $s$ and intercept $a$, as in [[f1.coordinates-lines-and-slope]]. Reading or writing slot $i$ is one computation and one visit to memory, whatever $i$ and $n$ are. This is called **random access**. As a mathematical object, the array is just a function from the positions $\{0, 1, \dots, n - 1\}$ to values, in the sense of [[f2.relations-and-functions-between-sets]], and random access says that this function can be evaluated in one step.

        A Python list is an array. That may seem impossible, since one list can hold a number, a string and another list side by side, and those are not the same size. The answer is that the slots do not hold the items. Each slot holds the **address of an item**, and an address is always the same size, 8 bytes on today's machines, as [[h0.alignment-and-the-size-of-things]] measured. The items live elsewhere. That is why two slots can refer to one object.

        **Counting cost.** To compare structures you need a way to say what an operation costs that does not depend on which laptop runs it. Count the **steps**: slots read or written, items moved, comparisons made. Then ask how the count grows as the number of items, $n$, grows. Four shapes cover nearly everything in this cluster.

        | The cost is | When $n$ doubles, the cost | Example |
        | --- | --- | --- |
        | constant | stays the same | reading slot $i$ |
        | logarithmic, about $\log_2 n$ | goes up by about one step | the halving search of [[f2.loop-invariants]] |
        | linear, in proportion to $n$ | doubles | inserting at the front |
        | quadratic, in proportion to $n^2$ | is multiplied by 4 | building a list by inserting each item at the front |

        The middle column is the test to remember. A cost of $3n + 5$ steps and a cost of $n$ steps are both linear: they differ by a constant factor, and both double when $n$ does. Constant factors matter on a real machine, but the shape of growth matters more, because it decides what happens when the data become a hundred times larger. Making "grows like" exact is the job of [[f3.asymptotic-notation]].

        **What an array makes cheap and what it makes dear.** Let the array hold $n$ items in a block with spare room at the end.

        | Operation | Steps | Cost |
        | --- | --- | --- |
        | read or write slot $i$ | one address worked out | constant |
        | add at the end | one write | constant |
        | remove the last item | one step | constant |
        | insert at position $i$ | the $n - i$ items from $i$ onwards move right | linear |
        | remove position $i$ | the $n - i - 1$ items after it move left | linear |

        The number of moves depends on where you insert. At the end it is 0, at the front $n$, and averaged over all positions about $\frac{n}{2}$. Half of $n$ still doubles when $n$ does, so it is still linear.

        Moving the items is itself a small algorithm, and it is easy to get wrong.
    - question:
        id: order-insert
        type: order
        system: s2
        prompt: An array holds 6 items in slots 0 to 5 of a block with room for 8. Put the steps in order to insert a new item at position 2 without losing anything.
        steps:
          - "Copy the item in slot 5 into slot 6."
          - "Copy the item in slot 4 into slot 5."
          - "Copy the item in slot 3 into slot 4."
          - "Copy the item in slot 2 into slot 3."
          - "Write the new item into slot 2."
        explanation: The shuffling must start from the far end. Slot 6 is empty, so the last item can move into it safely, which frees slot 5 for the item before it, and so on back to slot 2. Starting from slot 2 instead would copy its item over slot 3 before that one had been saved, and the same value would be smeared along the rest of the array.
    - text: |
        **Building at the front.** Build a list of $n$ items by inserting each new one at the front. The first insertion moves 0 items, the second 1, and the last $n - 1$. By the sum of an arithmetic series from [[f1.arithmetic-and-geometric-series]],

        $$0 + 1 + 2 + \dots + (n - 1) = \frac{n(n - 1)}{2}.$$

        That is quadratic. For the playlist of 2 lakh songs it is about 2,000 crore moves. Building the same list by appending is 2 lakh writes. If you need the items in reverse order, append them all and reverse once at the end.

        **Grids are arrays.** A grid with $r$ rows and $c$ columns, such as the seats of a cinema hall, is usually stored as **one** array of $r \cdot c$ items, row after row. The item in row $i$ and column $j$ is at position

        $$i \cdot c + j,$$

        the address formula again, one level up: skip $i$ whole rows of $c$, then $j$ more. This is called **row-major** order. A table that looks two-dimensional to you is a single run of boxes to the machine.

        **When the block is full.** Now the second puzzle. A **dynamic array** is an array that hides its block's size from you. It keeps a block with room for some number of items, its **capacity**, and a count of how many slots are in use, its **length**. Its invariant is the one from the bridge: the first `length` slots hold the items in order, and `length` is at most `capacity`. Appending writes into slot `length` and adds 1 to it. When `length` equals `capacity` there is no slot to write into, so the array must move: get a new block, copy every item across, and give up the old block.

        Suppose the new block always has **twice** the room, starting from room for 1. The moves happen when the array holds 1, 2, 4, 8, and so on items. If the last move before $n$ appends was at $2^k$ items, so that $2^k < n$, the total copying is a geometric series from [[f1.arithmetic-and-geometric-series]]:

        $$1 + 2 + 4 + \dots + 2^k = 2^{k + 1} - 1 < 2n.$$

        So $n$ appends make $n$ writes and fewer than $2n$ copies, fewer than $3n$ steps in all. **Averaged over the whole run, each append costs fewer than 3 steps**, a constant, even though the single append that triggers a move costs about as many steps as there are items. A cost averaged over a whole sequence of operations in this way is called **amortised**, from the old word for paying off a loan in instalments. The general method, and its uses far beyond lists, comes in [[s3.amortised-analysis]].
    - question:
        id: derive-total
        type: numeric
        system: s2
        prompt: |
          A dynamic array starts with room for 1 and doubles its room whenever it is full. 3000 items are appended. How many item copies are made in all?
        answer: "4095"
        explanation: |
          A move happens whenever an append finds the block full, which is when the array holds 1, 2, 4, and so on up to 2048 items. The next would be at 4096, which is never reached. The copies are $1 + 2 + 4 + \dots + 2048 = 2 \times 2048 - 1 = 4095$. With the 3000 writes that is 7095 steps, about 2.4 per append.
    - text: |
        **Why doubling, and not adding.** Try growing by a fixed amount instead, say 100 more slots each time. The moves come at 100, 200, 300 items and so on up to about $n$, and the copying is an arithmetic series:

        $$100 + 200 + \dots + n = 100\left(1 + 2 + \dots + \frac{n}{100}\right) \approx \frac{n^2}{200}.$$

        That is quadratic in total. The 100 delays the trouble and does not cure it: the moves come at a steady rate while each one keeps getting dearer. The rule of one more slot, which you ran in the starter, is the extreme case, with a move on every append.

        What cures it is growing by a **factor**, so that the gaps between moves grow in step with their cost. The factor need not be 2. With a factor $g$ the copies form a geometric series with ratio $g$, which is less than $\frac{g}{g - 1}$ times its last term: below $2n$ for a factor of 2, below $3n$ for a factor of 1.5. CPython, the usual Python, grows its lists by about one eighth each time, a factor near 1.125, which still gives a constant amortised cost, only a larger constant. The choice is a trade. A large factor copies less and wastes more room, since just after doubling half the block is empty. A small factor wastes little and copies more often.

        **Shrinking.** If items are removed, a block may end up mostly empty, and a careful dynamic array gives the room back. The obvious rule, halve the block as soon as the items fit in half, has a trap. Fill a block of 1024 exactly, then append one item: the block doubles to 2048. Remove one: the items fit in half again, so the block halves to 1024. Append: it doubles. Each call now copies a thousand items. The cure is a gap between the two thresholds: double when full, but halve only when the block is a **quarter** full. After a halving the block is half full, so it takes many operations to reach either threshold again, and the copying is paid for by those operations.
  formal:
    - text: |
        **Array.** $n$ slots of equal size $s$ in consecutive memory from address $a$. Slot $i$ is at $a + s \cdot i$, so reading and writing by position cost a constant number of steps. Inserting at position $i$ moves $n - i$ items and removing position $i$ moves $n - i - 1$, both linear in $n$, except at the end.

        **Python list.** A dynamic array of addresses of objects.

        **Growth of a cost.** As $n$ doubles, a constant cost stays the same, a logarithmic cost goes up by about one step, a linear cost doubles and a quadratic cost is multiplied by 4. Constant factors are ignored.

        **Building at the front.** $0 + 1 + \dots + (n - 1) = \frac{n(n - 1)}{2}$ moves, quadratic.

        **Row-major storage.** A grid with $c$ columns stored row after row has its entry $(i, j)$ at position $i \cdot c + j$.

        **Dynamic array.** A block of `capacity` slots and a `length`, with the invariant that slots $0$ to $\text{length} - 1$ hold the items in order and $\text{length} \le \text{capacity}$. An append to a full block first moves everything to a block of twice the capacity.

        **Amortised cost of appending.** With doubling from 1, $n$ appends make fewer than $2n$ copies and $3n$ steps, so the amortised cost of an append is constant. Growing by a fixed amount makes the total quadratic.

        **Shrinking.** Halve the block when it is a quarter full, not half full.
