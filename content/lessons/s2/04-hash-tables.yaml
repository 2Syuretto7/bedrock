          - |
            def get(buckets, key, default):
                for k, v in buckets[hash(key) % len(buckets)]:
                    if k == key:
                        return v
                return default

            def resize(buckets):
                bigger = [[] for _ in range(2 * len(buckets))]
                for i in range(len(buckets)):
                    bigger[i] = buckets[i]
                    bigger[i + len(buckets)] = buckets[i]
                return bigger

            print("seven")
        explanation: |
          The starter carried each chain across to the bucket with the same number. But a key's bucket is its hash reduced by the number of buckets, and that number has just doubled. The key 7 sat in bucket 3 of 4, since 7 mod 4 is 3. Among 8 buckets it belongs in bucket 7, and that is where `get` now looks. Every pair has to be placed afresh, using the size of the **new** table. Doing so is what makes resizing worthwhile: the keys 4, 2, 6 and 8, which all shared one bucket of two, split into two shorter chains.
    - question:
        id: work-bad-hash
        type: choice
        system: s2
        prompt: |
          A vocabulary of 50000 English words is stored in a hash table with 65536 buckets, using the hash function "the number of letters in the word". What happens?
        options:
          - "Almost all the buckets stay empty. Word lengths run from 1 to about 20, so the words fall into about 20 buckets, with chains thousands long. Each lookup scans thousands of words, and the table is little better than a list."
          - "Lookups take a constant number of steps, since there are more buckets than words."
          - "The table cannot be built, because two words have the same hash."
          - "The table works, but uses less memory."
        answer: 0
        explanation: |
          The load factor, $\frac{50000}{65536}$, is under 1 and looks healthy. It is an average over all buckets, and it promises short chains only if the hash function spreads the keys over them. This one sends every word to a bucket numbered at most about 20. Fifty thousand words in twenty buckets is 2500 to a chain on average, and far more for common lengths. Collisions as such are no fault, since every hash table has them. The fault is a function whose values crowd into a small part of the range.
    - question:
        id: work-saving
        type: numeric
        system: s2
        prompt: |
          A vocabulary holds 50000 words. Looking a word up in a list compares it with 25000 entries on average. Looking it up in a well-kept hash table compares it with about 2. For a text of ten lakh words, how many times more comparisons does the list need than the hash table?
        answer: "12500"
        explanation: |
          The list makes $10^6 \times 25000$ comparisons and the table $10^6 \times 2$. The ratio is $\frac{25000}{2} = 12500$, and the length of the text cancels out. The ratio is fixed by the size of the vocabulary: double the vocabulary and the list's cost doubles while the table's stays where it was. Work that would take the list three and a half hours takes the table one second.
    - question:
        id: work-mutable-key
        type: choice
        system: s2
        prompt: |
          Suppose Python allowed a list as a dictionary key, hashing it by its contents. A program stores a value under the list `[1, 2]`, then appends 3 to that same list. What would go wrong?
        options:
          - "The pair would still sit in the bucket chosen for `[1, 2]`. A lookup with the list, now `[1, 2, 3]`, would hash to a different bucket and miss it, and a lookup with a fresh `[1, 2]` would reach the right bucket and find a stored key that no longer equals it. The value could not be reached either way."
          - "Nothing. The dictionary would follow the change."
          - "The dictionary would hold two copies of the value."
          - "Only the speed of lookups would suffer."
        answer: 0
        explanation: |
          A hash table's one promise is that a key can be found by recomputing where it was put. That works only if the computation gives the same result each time. A key whose contents change after it is stored has, in effect, moved without telling the table, and the pair is stranded in a bucket that no lookup will visit. So the rule is not arbitrary: anything used as a key must be unable to change in a way that affects its hash, and Python enforces it by refusing lists, sets and dictionaries as keys.
  connections:
    - text: |
        The puzzle asked how a booking can be found among crores without looking through them. The system never chose where to keep it. It computed the place from the key itself, by a hash function and a remainder, and it computes the same place again when asked. An array then reaches that bucket in one step, by the address formula of [[s2.arrays-and-dynamic-arrays]]. What remains is a short chain to scan, for the keys that happened to collide.

        Collisions cannot be avoided, since there are more possible keys than buckets. They can be kept few. The average chain has length $n / m$, the load factor, so a table that doubles its buckets as it fills keeps every operation at a constant number of steps on average, provided the hash function scatters its keys. A poor one sends everything to a few buckets and gives back the cost of a list. And because a key is found by recomputing its place, it must never change while it is stored.

        You will meet hash tables everywhere. Databases use them to join tables, which the data track builds on. Compilers keep the names in a program in one. Caches in front of slow services are hash tables from request to answer. Content stores such as git name every file by a hash of its contents, so that equal files are stored once. And sets of places already visited keep searches from going round in circles once graphs arrive in [[s2.graphs-and-their-representations]].

        The same scattering that makes a hash table fast makes it blind to order. Ask it for the smallest key, or for every word beginning with "pre", and it must look in every bucket. Yet many problems are about order: the nearest price below a limit, the bookings between two dates, the next word in alphabetical order. A sorted array answers these with the halving search of [[f2.loop-invariants]], but inserting into it moves everything after the new item. What you want is a structure that keeps its keys in order **and** lets you insert cheaply. It is built from nodes with two links each: [[s2.binary-search-trees]].
