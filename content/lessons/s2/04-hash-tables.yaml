        solution: |
          def get(buckets, key, default):
              for k, v in buckets[hash(key) % len(buckets)]:
                  if k == key:
                      return v
              return default

          def resize(buckets):
              bigger = [[] for _ in range(2 * len(buckets))]
              for bucket in buckets:
                  for key, value in bucket:
                      bigger[hash(key) % len(bigger)].append((key, value))
              return bigger

          table = [[], [(5, "five")], [(6, "six")], [(7, "seven")]]
          print(get(resize(table), 7, None))
        tests: |
          _small = [[], [(5, "five")], [(6, "six")], [(7, "seven")]]
          _big = resize(_small)
          assert len(_big) == 8, "The new table should have twice as many buckets, 8"
          assert _big[5] == [(5, "five")] and _big[6] == [(6, "six")] and _big[7] == [(7, "seven")], "With 8 buckets the keys 5, 6 and 7 belong in buckets 5, 6 and 7. Your table is " + repr(_big)
          assert _big[1] == [] and _big[2] == [] and _big[3] == [], "Buckets 1, 2 and 3 of the new table should be empty. Your table is " + repr(_big)
          for _k, _v in [(5, "five"), (6, "six"), (7, "seven")]:
              assert get(_big, _k, None) == _v, "Every key should still be found after resizing"
          _crowded = [[(4, "a"), (2, "b"), (6, "c"), (8, "d")], [(1, "e"), (3, "f")]]
          _wide = resize(_crowded)
          assert [len(b) for b in _wide] == [2, 1, 2, 1], "Four buckets should split the chains of two: the keys 4, 8 then 1 then 2, 6 then 3. Your chain lengths are " + repr([len(b) for b in _wide])
          assert sum([len(b) for b in _wide]) == 6, "No pair may be lost or repeated"
          assert _crowded == [[(4, "a"), (2, "b"), (6, "c"), (8, "d")], [(1, "e"), (3, "f")]], "resize should leave the old table as it was"
          assert resize([[]]) == [[], []], "An empty table of one bucket becomes an empty table of two"
          assert output.strip() == "seven", "The program should print seven"
        wrong:
          - |
            def get(buckets, key, default):
                for k, v in buckets[hash(key) % len(buckets)]:
                    if k == key:
                        return v
                return default

            def resize(buckets):
