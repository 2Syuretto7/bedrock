concept: h0.alignment-and-the-size-of-things
minutes: 80
claim: You can work out where each field of a record sits in memory and how large the record is, padding included, reorder its fields so that less is wasted, and say when a layout must be packed with no gaps instead.
recalls: [h0.endianness-and-byte-order]
uses: [h0.binary-and-hexadecimal, h0.unsigned-integers-and-fixed-widths, h0.bitwise-operations-and-masks, h0.characters-unicode-and-utf-8, h0.floating-point-and-ieee-754, f0.powers-of-two, f0.units-prefixes-and-orders-of-magnitude, s0.expressions, s0.lists-and-tuples, s0.loops, s0.functions]
leads: [f1.variables-and-expressions, h1.logic-gates, h6.arrays-of-structures-and-structures-of-arrays]
starter: |
  # Scratch space. The same fields, packed tight and laid out as the machine likes.
  import struct
  print(struct.calcsize("<ci"), struct.calcsize("ci"))
  print(struct.calcsize("<cqhi"), struct.calcsize("cqhi"))
  print(struct.calcsize("qihc"))
parts:
  recall:
    - text: |
        In [[h0.endianness-and-byte-order]] a number took several bytes in a row, and the question was which of them came first. Today's question is where in memory such a number is allowed to start. Two quick pulls before it.
  puzzle:
    - text: |
        A metro system logs every tap at every gate. The program that writes the log is in C, the language in which most operating systems and most of the software inside chips are written, and it describes one tap as a **record** of four fields, one after another:

        ```c
        struct Tap {
            char    kind;     // 'I' for a tap in, 'O' for a tap out: 1 byte
            int64_t when;     // milliseconds since 1970: 8 bytes
            int16_t station;  // the station's number: 2 bytes
            int32_t fare;     // the fare in paise: 4 bytes
        };
        ```

        You do not need to read C to follow this. Each line names a field and says how many bytes it takes, and the fields add up to $1 + 8 + 2 + 4 = 15$ bytes.

        On a busy day the system records about a crore taps, so the team budgets $15 \times 10^7$ bytes, 150 MB, to hold a day's taps in memory. Then somebody asks the compiler, the program that turns C into machine instructions, how big one record really is. The answer is **24 bytes**. A day's taps take 240 MB. Nine bytes in every record, more than a third of it, hold nothing at all.

        The smallest record shows the same thing. A record of one `char` and one 4-byte `int` ought to be five bytes. The compiler makes it eight. And when a colleague rearranges the tap record so that its largest fields come first, without adding or removing anything, it shrinks from 24 bytes to 16.

        The compiler is not broken. Every C compiler for today's 64-bit processors lays the record out this way, on purpose. **Why would a computer waste memory deliberately, and why should the order of the fields change how much it wastes?**
  intuition:
    - text: |
        Think of a sleeper coach on a train. It is divided into **bays** of eight berths, with a partition between one bay and the next. Number the berths from 0, as a programmer would: berths 0 to 7 are the first bay, 8 to 15 the second, 16 to 23 the third.

        A family of four that books berths 6, 7, 8 and 9 is legally seated, but split across a partition: two of them in one bay and two in the next. Anything the family does together now means walking round. A family that books berths 0 to 3, or 4 to 7, or 8 to 11, is never split. The rule that guarantees it is simple: **a group of four should start at a berth number that is a multiple of 4.** A couple should start at an even berth, and a group of eight at a multiple of 8. A single traveller can sit anywhere.

        Memory works the same way. It is a long row of bytes, numbered from 0, but the processor does not fetch one byte at a time. It fetches whole aligned chunks, eight bytes at least, starting at addresses that are multiples of 8. A 4-byte number that starts at a multiple of 4 always sits inside one chunk, so one fetch brings all of it. A 4-byte number starting at address 6 straddles two chunks: the processor must fetch both and stitch the pieces together, and some processors refuse outright and stop the program.

        So compilers follow the berth rule. A value whose size is 2, 4 or 8 bytes is placed at an address that is a multiple of its size. This is called **alignment**, and the empty bytes the compiler leaves to achieve it are called **padding**.

        Now the five-byte record. The `char` goes at byte 0, and the next free byte is 1. But the `int` takes 4 bytes, so it must start at a multiple of 4, and the next one is 4. Bytes 1, 2 and 3 are left empty, and the record is eight bytes: five of data, three of padding. Press the buttons below to see the layout packed with no gaps, and with the larger field first.
    - figure: struct-padding
      props: { record: char-int }
    - text: |
        Putting the `int` first does not help. It sits at bytes 0 to 3, the `char` at byte 4, and the record ends at byte 5, yet the compiler still says eight. The reason is that records are usually stored in arrays, one straight after another. If the record were five bytes, the second record in an array would begin at byte 5, and its `int` would be misaligned. So the compiler adds three bytes at the **end** of the record, rounding its size up to a multiple of 4, and every record in the array starts aligned.
  derivation:
    - text: |
        **The rules a compiler follows.** For the plain values of the last few lessons, a value's **alignment** is its size: 1 for a character byte, 2 for a 16-bit number, 4 for a 32-bit number, 8 for a 64-bit number or a float of the kind in [[h0.floating-point-and-ieee-754]]. Laying out a record takes three rules.

        1. The fields go in the order they are written. The compiler never reorders them for you.
        2. Each field starts at the first offset, counting from the start of the record, that is a multiple of its alignment and comes after the previous field. Any bytes skipped are padding.
        3. The record's own alignment is the largest alignment among its fields, and its size is rounded up to a multiple of that, adding padding at the end if needed.

        **Rounding up.** Every rule above needs one small calculation: the first multiple of $a$ that is $n$ or more. Adding $a - 1$ pushes any $n$ that is not already a multiple of $a$ past the next multiple, and `//` then drops the remainder:

        ```python
        def align_up(n, a):
            return (n + a - 1) // a * a

        print(align_up(1, 4), align_up(4, 4), align_up(5, 4), align_up(9, 8))
        ```

        This shows `4 4 8 16`. Because alignments are powers of two, the remainder can also be dropped with a mask, as in [[h0.bitwise-operations-and-masks]]: `~(a - 1)` is all ones except the lowest few bits, so `(n + a - 1) & ~(a - 1)` gives the same answers. Programs that work out alignments while they run, such as the part of a system that hands out memory, use the mask form, because an AND is far cheaper for a processor than a division.

        **The tap record, field by field.** `kind` goes at offset 0 and takes 1 byte. `when` needs a multiple of 8, so it goes at offset 8, after 7 bytes of padding, and takes offsets 8 to 15. `station` needs a multiple of 2, and 16 is one, so it takes offsets 16 and 17. `fare` needs a multiple of 4, and the next one is 20, so after 2 more bytes of padding it takes 20 to 23. The record ends at 24. The largest alignment is 8, and 24 is already a multiple of 8, so the size is 24: 15 bytes of data and 9 of padding.
    - figure: struct-padding
      props: { record: tap }
    - text: |
        **Order matters.** Put the fields largest first: `when` at 0, `fare` at 8, `station` at 12, `kind` at 14. There is no gap at all, because after the 8-byte field the offset is a multiple of 8, which is also a multiple of 4; after the 4-byte field it is a multiple of 4, which is also a multiple of 2; and so on down. The data ends at 15, and only one byte of padding at the end rounds the size up to 16. With sizes that are powers of two, largest first always gives the smallest record possible, the total of the fields rounded up to the largest alignment. Saving 8 bytes on each of a crore records is 80 MB a day, for the price of rearranging four lines.

        **Python can show you.** Python's own integers do not live in fixed-width slots, but its `struct` module packs and unpacks records the way C lays them out. Each field is a letter: `c` for a single byte, `h` for 2 bytes, `i` for 4, `q` for 8 and `d` for an 8-byte float. `struct.calcsize` gives a layout's size. A format that starts with `<` means little-endian with **no** padding at all; a format with no prefix means the layout this machine's C compiler would use, padding and its own byte order included.

        ```python
        import struct
        print(struct.calcsize("<cqhi"))
        print(struct.calcsize("cqhi"))
        print(struct.calcsize("qihc"))
        ```

        This shows 15, 24 and 15. The first is the tap record packed tight, and the second is the compiler's layout. The third is the largest-first order, and it shows one way in which `struct` differs from C: it adds the padding **between** fields but leaves out the padding at the end, so it reports 15 where a C compiler reports 16.

        **When there must be no padding.** Inside one running program, padding is invisible and harmless. But a record written to a file or sent across a network will be read by another program, often on another machine, built by another compiler. Those programs cannot be trusted to pad the same way, so file formats and network protocols fix the exact offset of every field, usually with no gaps at all, and fix the byte order too. Such a layout is called **packed**. Reading a packed record with a padded layout, or the other way round, puts every field after the first gap in the wrong place, and nothing complains.

        Padding has one more trap. In C, the padding bytes in a record hold whatever happened to be in that memory before. Write such a record straight to a file or a network, and those leftovers go with it. Real operating systems have leaked secrets this way, a few stray bytes at a time. Python's `struct` fills padding with zeros.

        **The size of things.** A byte is the smallest piece of memory with its own address, so even a true-or-false value takes a whole byte, seven of its bits unused. A memory address, which C calls a **pointer**, is 8 bytes on today's 64-bit processors. And a Python integer, which carries bookkeeping along with its value, takes about 28 bytes on a 64-bit machine, which is why the course will later store large amounts of numbers in arrays of raw 8-byte values instead.
    - question:
        id: predict-calcsize
        type: predict
        system: s2
        prompt: Work out each layout by hand, with the three rules, before you check.
        code: |
          import struct
          print(struct.calcsize("<ci"))
          print(struct.calcsize("ci"))
          print(struct.calcsize("chi"))
          print(struct.calcsize("cd"))
        output: |
          5
          8
          8
          16
        explanation: |
          `<` packs with no gaps: $1 + 4 = 5$. In `ci` the `int` must start at 4, so the size is 8. In `chi` the 2-byte field goes at offset 2 and the `int` at 4, so the single gap is byte 1 and the size is still 8. In `cd` the 8-byte float must start at 8, leaving 7 bytes of padding.
    - question:
        id: fix-align-up
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `align_up(n, a)` should **return** the smallest multiple of `a` that is `n` or more, where `a` is 1, 2, 4 or 8. `align_up(5, 4)` correctly gives 8. But `align_up(8, 4)` gives 12, and a record laid out with it wastes four bytes after every field that already ends on a boundary. Find the bug and fix it.
        starter: |
          def align_up(n, a):
              return n + a - n % a

          print(align_up(5, 4), align_up(8, 4))
        solution: |
          def align_up(n, a):
              return (n + a - 1) // a * a

          print(align_up(5, 4), align_up(8, 4))
        tests: |
          assert align_up(5, 4) == 8, "align_up(5, 4) should be 8"
          assert align_up(8, 4) == 8, "align_up(8, 4) should be 8: 8 is already a multiple of 4"
          assert align_up(0, 8) == 0, "align_up(0, 8) should be 0: offset 0 is aligned for everything"
          assert align_up(1, 8) == 8, "align_up(1, 8) should be 8"
          assert align_up(13, 2) == 14, "align_up(13, 2) should be 14"
          assert align_up(7, 1) == 7, "align_up(7, 1) should be 7: one-byte values can go anywhere"
          assert align_up(16, 8) == 16, "align_up(16, 8) should be 16"
        wrong:
          - "def align_up(n, a):\n    return n // a * a\n"
          - "def align_up(n, a):\n    return (n + a) // a * a\n"
          - "def align_up(n, a):\n    return n + n % a\n"
        explanation: "Adding `a - n % a` always moves up, even when the remainder is 0, so a value already on a boundary jumps a whole step. Adding only $a - 1$ before dropping the remainder reaches the next multiple when there is a remainder, and stays put when there is none. Rounding down with `n // a * a` would place a field over the end of the one before it."
  formal:
    - text: |
        A value of size 1, 2, 4 or 8 bytes has **alignment** equal to its size: it is placed at an address that is a multiple of its alignment, so it never straddles an aligned chunk of memory.

        A record's fields are laid out in their written order. Each field goes at the offset $\text{align\_up}(\text{end of previous field}, a)$, where $a$ is its alignment and

        $$\text{align\_up}(n, a) = \left\lfloor \frac{n + a - 1}{a} \right\rfloor \times a$$

        which for a power of two $a$ is `(n + a - 1) & ~(a - 1)`. Bytes skipped are **padding**. The record's alignment is the largest alignment of its fields, and its size is the end of the last field rounded up to that alignment, so that records in an array stay aligned.

        Ordering the fields from largest alignment to smallest leaves no padding between fields, and the size is the sum of the fields rounded up to the largest alignment, the least possible.

        A **packed** layout has no padding. File formats and network protocols specify packed layouts, with exact offsets and a byte order. In Python's `struct`, a format beginning `<` is packed and little-endian; a format with no prefix uses this machine's own sizes, alignment and byte order, but adds no padding at the end.
  drill:
    - text: Seconds each. Find the next multiple before you answer.
    - question:
        id: int-after-char
        type: choice
        system: s1
        prompt: A record has a 1-byte field at offset 0, then a 4-byte field. At which offset does the 4-byte field start?
        options: ["1", "2", "4", "8"]
        answer: 2
        explanation: The first multiple of 4 after byte 0 is 4.
    - question:
        id: aligned-offset
        type: choice
        system: s1
        prompt: Which of these offsets is allowed for an 8-byte value?
        options: ["4", "12", "20", "24"]
        answer: 3
        explanation: Only 24 is a multiple of 8.
    - question:
        id: predict-round-up
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print((13 + 4 - 1) // 4 * 4)
        output: "16"
        explanation: 16 is the first multiple of 4 that is 13 or more.
    - question:
        id: predict-packed
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import struct
          print(struct.calcsize("<ci"))
        output: "5"
        explanation: "`<` packs the fields with no padding: 1 + 4."
    - question:
        id: int-then-char
        type: choice
        system: s1
        prompt: A C record holds a 4-byte int and then a 1-byte char. How large is it?
        options: ["5 bytes", "6 bytes", "8 bytes", "16 bytes"]
        answer: 2
        explanation: The size is rounded up to a multiple of 4, so that the next record in an array starts aligned.
    - question:
        id: char-double-char
        type: choice
        system: s1
        prompt: A C record holds a char, an 8-byte double and a char, in that order. How large is it?
        options: ["10 bytes", "16 bytes", "17 bytes", "24 bytes"]
        answer: 3
        explanation: The double starts at 8, the second char sits at 16, and 17 rounds up to 24.
    - question:
        id: bytes-only
        type: choice
        system: s1
        prompt: A record holds only 1-byte fields. How many bytes of padding does it need?
        options: ["0", "1", "3", "7"]
        answer: 0
        explanation: Single bytes can sit at any offset.
  work:
    - text: Slower now. Write the offsets out in a row, with the gaps marked, before you write any code.
    - question:
        id: write-layout
        type: code
        mode: write
        system: s2
        prompt: |
          Write `layout(sizes)`. It takes a list of field sizes, each 1, 2, 4 or 8, in the order the fields are written, and **returns** a list of the offset at which each field starts when every field is aligned to its own size. So `layout([1, 8, 2, 4])` is `[0, 8, 16, 20]`. `align_up` is written for you.
        starter: |
          def align_up(n, a):
              return (n + a - 1) // a * a

          def layout(sizes):
              return []

          print(layout([1, 8, 2, 4]))
        solution: |
          def align_up(n, a):
              return (n + a - 1) // a * a

          def layout(sizes):
              offsets = []
              at = 0
              for size in sizes:
                  at = align_up(at, size)
                  offsets.append(at)
                  at += size
              return offsets

          print(layout([1, 8, 2, 4]))
        tests: |
          assert layout([1, 8, 2, 4]) == [0, 8, 16, 20], "The tap record should be laid out at [0, 8, 16, 20]"
          assert layout([1, 4]) == [0, 4], "A char and an int should be at [0, 4]"
          assert layout([8, 4, 2, 1]) == [0, 8, 12, 14], "Largest first should leave no gaps: [0, 8, 12, 14]"
          assert layout([1, 1, 1]) == [0, 1, 2], "Single bytes need no padding: [0, 1, 2]"
          assert layout([2, 1, 2]) == [0, 2, 4], "[2, 1, 2] should be [0, 2, 4]"
          assert layout([]) == [], "No fields, no offsets"
        wrong:
          - "def layout(sizes):\n    offsets = []\n    at = 0\n    for size in sizes:\n        offsets.append(at)\n        at += size\n    return offsets\n"
          - "def layout(sizes):\n    offsets = []\n    at = 0\n    for size in sizes:\n        offsets.append(at)\n        at = (at + size + size - 1) // size * size\n    return offsets\n"
          - "def layout(sizes):\n    offsets = []\n    at = 0\n    for size in sizes:\n        at = (at + 7) // 8 * 8\n        offsets.append(at)\n        at += size\n    return offsets\n"
        explanation: "Two steps per field, in this order: round the running offset up to the field's own size, record it, then move past the field. Recording first and aligning afterwards pads after each field for the field's own size, not for the next one. Aligning everything to 8 wastes space on the small fields."
    - question:
        id: write-record-size
        type: code
        mode: write
        system: s2
        prompt: |
          Write `record_size(sizes)`. It takes a non-empty list of field sizes, each 1, 2, 4 or 8, and **returns** the size of the record a C compiler would make, padding at the end included. So `record_size([1, 4])` is 8, `record_size([4, 1])` is also 8, and `record_size([8, 4, 2, 1])` is 16.
        starter: |
          def align_up(n, a):
              return (n + a - 1) // a * a

          def record_size(sizes):
              return 0

          print(record_size([1, 8, 2, 4]))
        solution: |
          def align_up(n, a):
              return (n + a - 1) // a * a

          def record_size(sizes):
              at = 0
              for size in sizes:
                  at = align_up(at, size) + size
              return align_up(at, max(sizes))

          print(record_size([1, 8, 2, 4]))
        tests: |
          assert record_size([1, 8, 2, 4]) == 24, "The tap record should be 24 bytes"
          assert record_size([8, 4, 2, 1]) == 16, "Largest first should be 16 bytes"
          assert record_size([1, 4]) == 8, "A char then an int should be 8 bytes"
          assert record_size([4, 1]) == 8, "An int then a char should be 8 bytes: there is padding at the end"
          assert record_size([1, 1, 1]) == 3, "Three single bytes should be 3 bytes"
          assert record_size([2, 1]) == 4, "[2, 1] should be 4 bytes"
          assert record_size([1, 8, 1]) == 24, "A char, an 8-byte value and a char should be 24 bytes"
        wrong:
          - "def record_size(sizes):\n    return sum(sizes)\n"
          - "def align_up(n, a):\n    return (n + a - 1) // a * a\n\ndef record_size(sizes):\n    at = 0\n    for size in sizes:\n        at = align_up(at, size) + size\n    return at\n"
          - "def align_up(n, a):\n    return (n + a - 1) // a * a\n\ndef record_size(sizes):\n    at = 0\n    for size in sizes:\n        at = align_up(at, size) + size\n    return align_up(at, 8)\n"
        explanation: "The loop finds where the last field ends, padding between fields included. The final `align_up` to the largest field adds the padding at the end, which is the only padding `[4, 1]` has. Rounding up to 8 every time would make `[1, 1, 1]` eight bytes, when single bytes need no alignment at all."
    - question:
        id: write-largest-first
        type: code
        mode: write
        system: s2
        prompt: |
          Write `largest_first(fields)`. It takes a list of `(name, size)` tuples, each size 1, 2, 4 or 8, and **returns** a new list of the same tuples with the 8-byte fields first, then the 4-byte, then the 2-byte, then the 1-byte. Fields of the same size keep the order they had. The list passed in must not be changed.
        starter: |
          def largest_first(fields):
              return fields

          tap = [("kind", 1), ("when", 8), ("station", 2), ("fare", 4)]
          print(largest_first(tap))
        solution: |
          def largest_first(fields):
              result = []
              for size in [8, 4, 2, 1]:
                  for name, field_size in fields:
                      if field_size == size:
                          result.append((name, field_size))
              return result

          tap = [("kind", 1), ("when", 8), ("station", 2), ("fare", 4)]
          print(largest_first(tap))
        tests: |
          _tap = [("kind", 1), ("when", 8), ("station", 2), ("fare", 4)]
          assert largest_first(_tap) == [("when", 8), ("fare", 4), ("station", 2), ("kind", 1)], "The tap record should become when, fare, station, kind"
          assert _tap == [("kind", 1), ("when", 8), ("station", 2), ("fare", 4)], "The list passed in must not be changed"
          assert largest_first([("a", 1), ("b", 4), ("c", 1)]) == [("b", 4), ("a", 1), ("c", 1)], "Fields of the same size should keep their order: a before c"
          assert largest_first([("x", 2), ("y", 2)]) == [("x", 2), ("y", 2)], "Two 2-byte fields should stay in order"
          assert largest_first([]) == [], "No fields gives an empty list"
        wrong:
          - "def largest_first(fields):\n    result = []\n    for size in [1, 2, 4, 8]:\n        for name, field_size in fields:\n            if field_size == size:\n                result.append((name, field_size))\n    return result\n"
          - "def largest_first(fields):\n    result = []\n    for size in [8, 4, 2, 1]:\n        for name, field_size in fields:\n            if field_size == size:\n                result.append((name, field_size))\n                break\n    return result\n"
          - "def largest_first(fields):\n    result = []\n    for name, size in fields:\n        if size >= 4:\n            result.append((name, size))\n    for name, size in fields:\n        if size < 4:\n            result.append((name, size))\n    return result\n"
        explanation: "One pass through the fields for each size, largest size first, collects every field of that size in its original order. A `break` would keep only the first field of each size, and splitting at 4 bytes alone leaves a 1-byte field in front of a 2-byte one, which can open a gap."
    - question:
        id: predict-padding-bytes
        type: predict
        system: s2
        prompt: This packs a char and an int with the machine's own layout, which is little-endian here. Give the eight bytes it shows.
        code: |
          import struct
          print(struct.pack("ci", b"A", 1).hex(" "))
        output: "41 00 00 00 01 00 00 00"
        explanation: |
          `A` is `0x41`, from [[h0.characters-unicode-and-utf-8]]. Bytes 1 to 3 are padding, which Python fills with zeros. The `int` 1 starts at byte 4, least significant byte first.
    - question:
        id: megabytes-saved
        type: numeric
        system: s2
        prompt: A crore tap records a day shrink from 24 bytes each to 16 bytes each. How many megabytes a day is that, taking a megabyte as $10^6$ bytes?
        answer: "80"
        unit: MB
        explanation: Each record saves 8 bytes, so a crore records save $8 \times 10^7$ bytes, which is 80 MB.
    - question:
        id: why-pad
        type: choice
        system: s2
        prompt: Why do compilers put padding in records instead of packing every field tightly?
        options:
          - "Because the processor fetches memory in aligned chunks, and a value that straddles two chunks needs two fetches, or on some processors cannot be read at all."
          - "Because padding stores the byte order of the fields."
          - "Because the C language requires every field to be 8 bytes."
          - "Because padding makes the record safe to write to a file."
        answer: 0
        explanation: Padding buys speed and safety inside one program. It is the reason records sent to files or networks are packed with fixed offsets instead, and padding written out by accident can leak old memory.
  connections:
    - text: |
        The puzzle is solved. The tap record is 24 bytes because each field must start at a multiple of its own size: 7 bytes of padding go before the 8-byte `when`, 2 before the 4-byte `fare`, and the record ends on a multiple of 8. The compiler wastes the space to buy speed, so that no value ever straddles two chunks of memory. Put the largest fields first and the gaps between fields vanish, leaving 16 bytes. The five-byte `char` and `int` record is eight bytes for the same reason, and stays eight whichever way round it goes, because the padding at the end keeps the next record in an array aligned.

        This finishes the cluster. You can now say what every byte of a record means: whole numbers of fixed width from [[h0.unsigned-integers-and-fixed-widths]], characters from [[h0.characters-unicode-and-utf-8]], floats from [[h0.floating-point-and-ieee-754]], their order from [[h0.endianness-and-byte-order]], and where each one sits from this lesson. The rounding was the powers of two of [[f0.powers-of-two]] once again, and the mask form of `align_up` was a trick from [[h0.bitwise-operations-and-masks]].

        The route turns next to mathematics. `align_up` was a formula with letters in it, true whatever numbers stand for `n` and `a`, and that is where algebra begins, in [[f1.variables-and-expressions]]. The hardware track picks up the other thread later: [[h1.logic-gates]] begins building, from switches, the machine that fetches those aligned chunks, and [[h6.arrays-of-structures-and-structures-of-arrays]] returns to record layouts, where the order of fields decides how fast a program can run.
