concept: h0.binary-and-hexadecimal
minutes: 85
claim: You can read and write whole numbers in base two and base sixteen, convert between them and decimal by hand and in Python, and explain why a byte is written as exactly two hexadecimal digits.
recalls: [s0.reading-errors-and-debugging, f0.powers-of-two]
uses: [f0.whole-numbers-and-place-value, f0.powers-of-two, s0.expressions, s0.strings, s0.loops, s0.functions]
leads: [h0.unsigned-integers-and-fixed-widths]
bridges:
  s0.reading-errors-and-debugging: |
    The programming cluster ended with debugging, and its first rule: when a program surprises you, look at what the machine actually holds, not at what you meant. This cluster goes one level down and looks at what it holds in the most literal sense. Every value you have bound to a name, an int, a float, a string, is stored as a row of switches. Many bugs that seem mysterious from above, a score that turns negative, a sum that is wrong in its seventeenth digit, a name that prints as gibberish, become plain once you can read those switches. The habit carries over unchanged: predict the bits, then look.
starter: |
  # Scratch space. Change the number and run again.
  n = 153
  print(bin(n), hex(n))
  print(f"{n:08b}", f"{n:02X}")
  print(int("10011001", 2), int("99", 16))
parts:
  recall:
    - text: |
        In [[f0.powers-of-two]] you met bits and bytes and counted how many patterns a row of switches can show. In [[s0.reading-errors-and-debugging]] you learnt to check a program against a small case worked by hand. Today needs both. Two quick pulls first.
  puzzle:
    - text: |
        Open the style sheet behind almost any Indian government website and you will find the colours of the flag written like this:

        ```
        saffron: #FF9933
        white:   #FFFFFF
        green:   #138808
        navy:    #000080
        ```

        A screen makes every colour by mixing three lights, red, green and blue, each at a strength from 0 to 255. Saffron is a lot of red, a fair amount of green and a little blue. So somewhere inside `FF9933` there are three numbers.

        But look at the codes. Two of them contain letters, and the code for white has no digit at all. The green, `138808`, looks like an ordinary number, but it does not mean one lakh thirty-eight thousand eight hundred and eight. And the navy of the Ashoka Chakra, `000080`, is mostly zeros, though it is plainly not a dark black.

        Anyone could have written saffron as `255, 153, 51`. Yet web designers, programmers reading memory, network engineers reading a packet and the people who write processors all use codes like these, every day. **What number system is this, and why would anyone choose it over the ten digits everybody already knows?**
  intuition:
    - text: |
        Go back to what a written number is. In [[f0.whole-numbers-and-place-value]] the digits of 4,507 sat in columns, and each column was worth **ten** times the column to its right: ones, tens, hundreds, thousands. Ten, because we have ten digit symbols, 0 to 9, and when a column passes 9 it rolls back to 0 and carries one into the next column, like the wheels of a car's odometer.

        Nothing in that idea needs the number ten. A computer's memory is made of switches, and a switch has only two states, off and on, written 0 and 1. So a computer counts with wheels that have only two symbols. Each column is worth **two** times the column to its right:

        ```
         128   64   32   16    8    4    2    1
        ```

        This is **base two**, or **binary**. A row of bits is read exactly as a row of decimal digits is, except that every column holds 0 or 1 and is worth a power of two. The bits `1101` mean one 8, one 4, no 2 and one 1, which is 13. Counting goes 0, 1, 10, 11, 100, 101, 110, 111, 1000: each time a column passes 1, it rolls back to 0 and carries.

        Binary is the computer's native tongue, and it is terrible for people. Saffron's red strength, 255, is `11111111` in binary. Its green, 153, is `10011001`. A whole colour is 24 bits, and nobody can glance at 24 ones and zeros and see what they say.

        So people group the bits. Four bits can show $2^4 = 16$ patterns, from `0000` to `1111`, that is, 0 to 15. Give each of those sixteen patterns one symbol of its own, and every group of four bits becomes a single character. The digits 0 to 9 serve for the first ten, and the letters A to F stand for 10 to 15. That is **base sixteen**, or **hexadecimal**, "hex" for short.

        Now read saffron again. `FF` is `1111 1111`, which is 255. `99` is `1001 1001`, which is 153. `33` is `0011 0011`, which is 51. Each colour strength is one byte, and one byte is exactly two hex digits: the first for its left four bits, the second for its right four. White, `FFFFFF`, is every light at full strength. Navy, `000080`, is no red, no green and blue at 128, half strength.

        The figure below is one byte. Flip its bits and watch the same value written three ways.
    - figure: binary-counter
      props: { width: 8, value: 153 }
  derivation:
    - text: |
        **Any base works the same way.** In base $b$ there are $b$ digit symbols, $0$ to $b - 1$, and the columns, from the right, are worth $b^0 = 1$, $b^1$, $b^2$, $b^3$ and so on. A number is the sum of each digit times its column's worth. In base ten, $4507 = 4 \times 10^3 + 5 \times 10^2 + 0 \times 10^1 + 7 \times 10^0$. In base two,

        $$101101_2 = 1 \times 32 + 0 \times 16 + 1 \times 8 + 1 \times 4 + 0 \times 2 + 1 \times 1 = 45$$

        The small 2 written after a number names its base, when there could be doubt. Python has its own way of saying it, which comes in a moment.

        **Binary to decimal.** Write the column values above the bits, from 1 on the right, doubling as you go left, and add the columns that hold a 1. For `10011001`: $128 + 16 + 8 + 1 = 153$.

        There is a second way, which reads the bits from the left and never needs the column values. Start at 0. For each bit, double what you have and add the bit. For `1101`: $0 \to 1 \to 3 \to 6 \to 13$. It works because doubling shifts everything read so far one column to the left, which is exactly what reading one more digit does. In base ten you would multiply by ten instead: reading 4, 5, 0, 7 gives $4 \to 45 \to 450 \to 4507$.

        **Decimal to binary.** Divide by 2 again and again, and write down the remainders. Then read them from the **last** to the first. For 45:

        | Number | $\div 2$ | Remainder |
        | --- | --- | --- |
        | 45 | 22 | 1 |
        | 22 | 11 | 0 |
        | 11 | 5 | 1 |
        | 5 | 2 | 1 |
        | 2 | 1 | 0 |
        | 1 | 0 | 1 |

        Read upwards, the remainders give `101101`. Why does this work? The remainder on dividing by 2 says whether a number is odd, and a number is odd exactly when its rightmost bit is 1. So `n % 2` is the last bit. And `n // 2` throws that last bit away and slides the rest one column to the right, as dividing a decimal number by ten drops its last digit. Repeat, and the bits come out one at a time, from the right-hand end.

        That is a loop, and it is the first program in this cluster:

        ```python
        def to_binary(n):
            if n == 0:
                return "0"
            bits = ""
            while n > 0:
                bits = str(n % 2) + bits
                n = n // 2
            return bits

        print(to_binary(45))
        ```

        It shows `101101`. Notice that each new bit goes on the **front** of the string, because the bits arrive from the right-hand end. And notice the special case: without it, 0 would give the empty string, since the loop would never run.
    - question:
        id: fix-to-binary
        type: code
        mode: find-bug
        system: s2
        prompt: |
          This `to_binary(n)` should return the bits of a whole number `n` as a string, so `to_binary(6)` should be `"110"`. It returns `"011"` instead. Trace it by hand for 6, find the bug and fix it. Do not use `bin`.
        starter: |
          def to_binary(n):
              if n == 0:
                  return "0"
              bits = ""
              while n > 0:
                  bits = bits + str(n % 2)
                  n = n // 2
              return bits

          print(to_binary(6))
        solution: |
          def to_binary(n):
              if n == 0:
                  return "0"
              bits = ""
              while n > 0:
                  bits = str(n % 2) + bits
                  n = n // 2
              return bits

          print(to_binary(6))
        tests: |
          assert "bin(" not in source, "Find the bits with the loop, without calling bin"
          assert to_binary(6) == "110", "to_binary(6) should be '110'. In which order do the bits come out of the loop?"
          assert to_binary(1) == "1", "to_binary(1) should be '1'"
          assert to_binary(0) == "0", "to_binary(0) should be '0'"
          assert to_binary(45) == "101101", "to_binary(45) should be '101101'"
          assert to_binary(153) == "10011001", "to_binary(153) should be '10011001'"
        wrong:
          - "def to_binary(n):\n    bits = \"\"\n    while n > 0:\n        bits = str(n % 2) + bits\n        n = n // 2\n    return bits\n"
          - "def to_binary(n):\n    if n == 0:\n        return \"0\"\n    bits = \"\"\n    while n > 1:\n        bits = str(n % 2) + bits\n        n = n // 2\n    return bits\n"
          - "def to_binary(n):\n    if n == 0:\n        return \"0\"\n    bits = \"\"\n    while n > 0:\n        bits = str(n // 2) + bits\n        n = n % 2\n    return bits\n"
        explanation: "`n % 2` gives the bits from the right-hand end first, so each new bit belongs in **front** of the ones already found. Joining it on the end writes the number backwards, which is why 6 came out as `011`."
    - text: |
        **Python already speaks both bases.** You will not usually write `to_binary` yourself, because Python has it built in, but now you know what the built-ins do.

        ```python
        print(bin(45))
        print(int("101101", 2))
        print(0b101101)
        ```

        This shows `0b101101`, then 45, then 45. `bin` gives a string of bits with `0b` on the front, to say "binary". `int` with a second argument reads a string in that base. And a number written in your program with `0b` in front is read as binary, so `0b101101` is simply another way to write 45. Long ones can be broken up with underscores, which Python ignores: `0b1001_1001` is 153.

        **Hexadecimal.** The sixteen digits, with their four bits:

        | Hex | Bits | Value | Hex | Bits | Value |
        | --- | --- | --- | --- | --- | --- |
        | 0 | 0000 | 0 | 8 | 1000 | 8 |
        | 1 | 0001 | 1 | 9 | 1001 | 9 |
        | 2 | 0010 | 2 | A | 1010 | 10 |
        | 3 | 0011 | 3 | B | 1011 | 11 |
        | 4 | 0100 | 4 | C | 1100 | 12 |
        | 5 | 0101 | 5 | D | 1101 | 13 |
        | 6 | 0110 | 6 | E | 1110 | 14 |
        | 7 | 0111 | 7 | F | 1111 | 15 |

        The columns of a hex number are worth 1, 16, 256, 4096: powers of sixteen. So `99` in hex is $9 \times 16 + 9 = 153$, and `FF` is $15 \times 16 + 15 = 255$. But the real convenience is that you rarely need that arithmetic. To turn bits into hex, cut them into fours **from the right** and replace each four by its digit: `1001 1001` is `99`. To turn hex into bits, replace each digit by its four. No division, no adding up columns. That works only because sixteen is $2^4$. Base ten has no such luck: ten is not a power of two, so a decimal digit does not stand for any fixed group of bits.

        Python's hex tools match its binary ones:

        ```python
        print(hex(255))
        print(int("FF", 16))
        print(0xFF)
        ```

        This shows `0xff`, then 255, then 255. Capital and small letters mean the same in hex, and Python accepts either.

        **Writing a fixed number of digits.** A colour needs exactly two hex digits for each strength, so 8 must be written `08`, not `8`. An f-string can do that. After the colon, `02X` means "at least 2 characters, padded with zeros on the left, in hex with capital letters". A small `x` gives small letters, and `b` gives binary:

        ```python
        print(f"{8:02X}")
        print(f"{255:02X}")
        print(f"{5:08b}")
        ```

        This shows `08`, `FF` and `00000101`.

        **Saffron, decoded.** Now the puzzle is a few lines:

        ```python
        code = "#FF9933"
        red = int(code[1:3], 16)
        green = int(code[3:5], 16)
        blue = int(code[5:7], 16)
        print(red, green, blue)
        ```

        This shows `255 153 51`. The flag's green, `#138808`, comes out as `19 136 8`: little red, a good deal of green and almost no blue. Read as a decimal number it would have been 1,38,808, which is nothing to do with it. And the 24 bits of a colour can show $2^{24} = 16{,}777{,}216$ colours, about 1.7 crore.
    - question:
        id: predict-bases
        type: predict
        system: s2
        prompt: Work out each line by hand, from the column values, before you check.
        code: |
          print(int("1101", 2))
          print(bin(13))
          print(hex(26))
          print(f"{6:04b}")
        output: |
          13
          0b1101
          0x1a
          0110
        explanation: |
          `1101` is $8 + 4 + 1 = 13$, and `bin(13)` turns it back. 26 is one sixteen and ten ones, and ten is the hex digit `a`. 6 is `110`, padded on the left to four characters.
  formal:
    - text: |
        In **base** $b$, for a whole number $b \ge 2$, a number is written with digits $d_k \ldots d_1 d_0$, each from $0$ to $b - 1$, and stands for

        $$d_k b^k + \cdots + d_1 b^1 + d_0 b^0$$

        Every whole number has exactly one such writing without leading zeros.

        **Binary** is base 2, with digits 0 and 1, each called a **bit**. **Hexadecimal** is base 16, with digits 0 to 9 and A to F for 10 to 15. Since $16 = 2^4$, each hex digit stands for exactly four bits, and a **byte**, 8 bits, is exactly two hex digits. Converting between binary and hex is done four bits at a time, from the right.

        To convert $n$ to base $b$: the last digit is $n \bmod b$, and the remaining digits are those of $n \,//\, b$. Repeat until the number is 0. To read digits in base $b$ from the left: start at 0, and for each digit multiply by $b$ and add the digit.

        In Python:

        | Written | Value |
        | --- | --- |
        | `0b101101`, `0xFF` | integers written in binary or hex |
        | `bin(n)`, `hex(n)` | strings such as `'0b101101'` and `'0xff'` |
        | `int(s, b)` | the integer whose base-$b$ digits are the string `s` |
        | `f"{n:b}"`, `f"{n:x}"`, `f"{n:X}"` | `n` in binary, small hex or capital hex, with no prefix |
        | `f"{n:08b}"`, `f"{n:02X}"` | the same, padded with zeros to at least 8 or 2 characters |
  drill:
    - text: Seconds each. Read the bits from the right, doubling as you go.
    - question:
        id: predict-0b
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(0b101)
        output: "5"
        explanation: One 4, no 2, one 1.
    - question:
        id: predict-int-base-2
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(int("11", 2))
        output: "3"
        explanation: One 2 and one 1.
    - question:
        id: predict-hex-16
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(hex(16))
        output: "0x10"
        explanation: Sixteen is one in the sixteens column and nothing in the ones.
    - question:
        id: four-ones
        type: numeric
        system: s1
        prompt: "What is the binary number `1111` in decimal?"
        answer: "15"
        explanation: $8 + 4 + 2 + 1 = 15$, the largest value four bits can hold, and the hex digit F.
    - question:
        id: hex-twelve
        type: choice
        system: s1
        prompt: Which hex digit stands for 12?
        options: ["B", "C", "D", "12"]
        answer: 1
        explanation: A is 10, B is 11, C is 12.
    - question:
        id: predict-0xff
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(0xFF)
        output: "255"
        explanation: $15 \times 16 + 15 = 255$, eight ones in binary.
    - question:
        id: hex-digits-in-byte
        type: numeric
        system: s1
        prompt: How many hex digits does it take to write any one byte, with zeros in front where needed?
        answer: "2"
        unit: digits
        explanation: Each hex digit is four bits, and a byte is eight.
  work:
    - text: Slower now. Check every answer against a small case you can work by hand.
    - question:
        id: write-hex-colour
        type: code
        mode: write
        system: s2
        prompt: |
          Write `hex_colour(red, green, blue)`. Each argument is a whole number from 0 to 255. It **returns** the colour code a web page would use: a `#` followed by each strength as exactly two hex digits in capital letters. So `hex_colour(255, 153, 51)` is `"#FF9933"`.
        starter: |
          def hex_colour(red, green, blue):
              return ""

          print(hex_colour(255, 153, 51))
        solution: |
          def hex_colour(red, green, blue):
              return f"#{red:02X}{green:02X}{blue:02X}"

          print(hex_colour(255, 153, 51))
        tests: |
          assert hex_colour(255, 153, 51) is not None, "hex_colour should return the code, not print it"
          assert hex_colour(255, 153, 51) == "#FF9933", "Saffron, 255, 153 and 51, should be #FF9933"
          assert hex_colour(255, 255, 255) == "#FFFFFF", "White should be #FFFFFF"
          assert hex_colour(19, 136, 8) == "#138808", "The flag's green, 19, 136 and 8, should be #138808. Does a strength below 16 still get two digits?"
          assert hex_colour(0, 0, 128) == "#000080", "Navy, 0, 0 and 128, should be #000080"
          assert hex_colour(10, 11, 12) == "#0A0B0C", "Use capital letters for the hex digits"
        wrong:
          - "def hex_colour(red, green, blue):\n    return f\"#{red:X}{green:X}{blue:X}\"\n"
          - "def hex_colour(red, green, blue):\n    return f\"#{red:02x}{green:02x}{blue:02x}\"\n"
          - "def hex_colour(red, green, blue):\n    return \"#\" + hex(red) + hex(green) + hex(blue)\n"
          - "def hex_colour(red, green, blue):\n    return f\"#{red:02}{green:02}{blue:02}\"\n"
        explanation: "`02X` pads each strength to two hex digits with zeros on the left, so 8 becomes `08` and the code is always seven characters. Without the padding the flag's green would come out as `#13888`, a different colour. `hex` would add `0x` before every strength."
    - question:
        id: write-rgb
        type: code
        mode: write
        system: s2
        prompt: |
          Write `rgb(code)`. It takes a colour code such as `"#FF9933"`, in capital or small letters, and **returns** a tuple of the three strengths as whole numbers, so `rgb("#FF9933")` is `(255, 153, 51)`.
        starter: |
          def rgb(code):
              return (0, 0, 0)

          print(rgb("#FF9933"))
        solution: |
          def rgb(code):
              red = int(code[1:3], 16)
              green = int(code[3:5], 16)
              blue = int(code[5:7], 16)
              return (red, green, blue)

          print(rgb("#FF9933"))
        tests: |
          assert rgb("#FF9933") == (255, 153, 51), "rgb('#FF9933') should be (255, 153, 51)"
          assert rgb("#138808") == (19, 136, 8), "rgb('#138808') should be (19, 136, 8). Which characters hold the red?"
          assert rgb("#000080") == (0, 0, 128), "rgb('#000080') should be (0, 0, 128)"
          assert rgb("#ff9933") == (255, 153, 51), "Small letters mean the same as capitals"
        wrong:
          - "def rgb(code):\n    return (int(code[0:2], 16), int(code[2:4], 16), int(code[4:6], 16))\n"
          - "def rgb(code):\n    return (int(code[1:3]), int(code[3:5]), int(code[5:7]))\n"
          - "def rgb(code):\n    return (int(code[1:3], 16), int(code[3:5], 16), int(code[4:6], 16))\n"
        explanation: "The `#` is at index 0, so the red is the slice `[1:3]`, the green `[3:5]` and the blue `[5:7]`: two characters each, as half-open slices say. `int` with base 16 reads each pair. Without the base, `int` would read `FF` as decimal and stop with a `ValueError`."
    - question:
        id: write-from-bits
        type: code
        mode: write
        system: s2
        prompt: |
          Write `from_bits(bits)`. It takes a string of `0`s and `1`s and **returns** the whole number it stands for, so `from_bits("1101")` is 13. Read the bits from the left, doubling what you have and adding each bit. Do not give `int` a base, and do not use `0b`.
        starter: |
          def from_bits(bits):
              value = 0
              return value

          print(from_bits("1101"))
        solution: |
          def from_bits(bits):
              value = 0
              for bit in bits:
                  value = value * 2 + int(bit)
              return value

          print(from_bits("1101"))
        tests: |
          assert ", 2)" not in source and "0b" not in source, "Build the number with a loop, without giving int a base"
          assert from_bits("1101") == 13, "from_bits('1101') should be 13"
          assert from_bits("0") == 0, "from_bits('0') should be 0"
          assert from_bits("1") == 1, "from_bits('1') should be 1"
          assert from_bits("11111111") == 255, "from_bits('11111111') should be 255"
          assert from_bits("100000000") == 256, "from_bits('100000000') should be 256"
          assert from_bits("00101") == 5, "Zeros on the left change nothing: from_bits('00101') should be 5"
        wrong:
          - "def from_bits(bits):\n    value = 0\n    for bit in bits:\n        value = value + int(bit) * 2\n    return value\n"
          - "def from_bits(bits):\n    value = 0\n    for bit in bits:\n        value = value * 10 + int(bit)\n    return value\n"
          - "def from_bits(bits):\n    value = 1\n    for bit in bits:\n        value = value * 2 + int(bit)\n    return value\n"
        explanation: "Doubling slides everything read so far one column to the left, and adding the new bit fills the ones column. Starting at 0 matters, because 0 is the value of no bits at all. Multiplying by ten instead reads the same characters as a decimal number."
    - question:
        id: predict-count-ones
        type: predict
        system: s2
        prompt: Trace this one row per iteration, with columns for `n` and `count`, then give what it shows.
        code: |
          n = 0b1011
          count = 0
          while n > 0:
              count += n % 2
              n = n // 2
          print(count)
        output: "3"
        explanation: |
          `0b1011` is 11. Each iteration adds the last bit to `count` and drops it: the bits come out as 1, 1, 0, 1. The program counts the ones in the number, which is 3.
    - question:
        id: predict-hex-pieces
        type: predict
        system: s2
        prompt: What does this show? Work out each piece of the slice before converting it.
        code: |
          code = "#1A2B3C"
          print(int(code[1:3], 16) + int(code[5:7], 16))
        output: "86"
        explanation: |
          `code[1:3]` is `1A`, which is $16 + 10 = 26$. `code[5:7]` is `3C`, which is $3 \times 16 + 12 = 60$. Their sum is 86.
    - question:
        id: hex-digits-32-bits
        type: numeric
        system: s2
        prompt: A processor register holds 32 bits. How many hex digits does it take to write any value it can hold?
        answer: "8"
        unit: digits
        explanation: Each hex digit is four bits, and $32 \div 4 = 8$. The largest 32-bit value is written `FFFFFFFF`.
    - question:
        id: why-hex
        type: choice
        system: s2
        prompt: Why do programmers write bytes in hexadecimal rather than in decimal?
        options:
          - "Hexadecimal numbers are smaller, so they take up less memory."
          - "Each hex digit stands for exactly four bits, so a byte is always exactly two digits and its bits can be read straight off them. A decimal digit stands for no fixed group of bits."
          - "Computers store numbers in hexadecimal inside their memory."
          - "Decimal cannot write numbers larger than 255."
        answer: 1
        explanation: Memory holds bits. Hex is only a way of writing them for people, and it is the shortest one in which every digit lines up with a fixed group of bits, because sixteen is a power of two.
  connections:
    - text: |
        The puzzle is solved. `#FF9933` is three bytes written in base sixteen, each as two digits, and decoding it is two slices and `int` with base 16 for each strength. Designers write colours that way because hex is a faithful, compact picture of the bits underneath, which decimal is not.

        Nothing here was new arithmetic. It was the place value of [[f0.whole-numbers-and-place-value]] with a different number of symbols, and the doubling of [[f0.powers-of-two]] read as column values. The loop that turned 45 into `101101` was the divide-and-take-the-remainder of the expressions lesson, and the loop that read `1101` back was an accumulator.

        You will see hex everywhere from now on: in memory addresses when a program crashes, in the network addresses of your phone, in the bytes of a file, and in the hashes that name every commit in Git. Each time, read it as bits in groups of four.

        One thing has been quietly assumed. A colour strength fits in one byte, so it can never be more than 255. What happens if a program adds 1 to a byte that already holds 255? On paper, the answer is 256. In eight switches there is no ninth to carry into. That is the next lesson, [[h0.unsigned-integers-and-fixed-widths]].
