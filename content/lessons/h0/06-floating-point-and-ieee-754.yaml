concept: h0.floating-point-and-ieee-754
minutes: 90
claim: You can explain how a float stores a number as a sign, an exponent and 53 significant bits, say which decimals it can hold exactly and why the gaps between floats grow with their size, and keep money exact by counting it in whole paise.
recalls: [h0.characters-unicode-and-utf-8]
uses: [f0.fractions-decimals-and-percentages, f0.powers-of-two, f0.units-prefixes-and-orders-of-magnitude, h0.binary-and-hexadecimal, h0.unsigned-integers-and-fixed-widths, s0.values-types-and-variables, s0.expressions, s0.booleans-and-conditionals, s0.loops, s0.functions]
leads: [h0.endianness-and-byte-order]
starter: |
  # Scratch space. Show more digits than Python usually does.
  print(0.1 + 0.2)
  print(f"{0.1:.20f}")
  print(f"{0.5:.20f}")
  print((0.1).as_integer_ratio())
parts:
  recall:
    - text: |
        In [[h0.characters-unicode-and-utf-8]] text became numbers with an agreed meaning. Today the last kind of number gets the same treatment: numbers with fractions. Two quick pulls first.
  puzzle:
    - text: |
        In [[s0.expressions]] you met this, and were told only to live with it:

        ```python
        print(0.1 + 0.2)
        print(0.1 + 0.2 == 0.3)
        ```

        It shows `0.30000000000000004` and `False`. Now look at what that does to money. A payments company records ten lakh transactions of ten paise each, and adds them up in floats:

        ```python
        total = 0.0
        for i in range(1000000):
            total += 0.1
        print(total)
        ```

        This shows `100000.00000133288`, not `100000.0`. Worse, here is GST at 18% on an item that costs ₹2.75. The tax is exactly 49.5 paise, and the rule rounds a half up, to 50 paise. In floats:

        ```python
        print(round(2.75 * 0.18, 2))
        ```

        This shows `0.49`. One paisa short. Multiply that by every bill in a day and the company's books no longer balance against the bank's, and an auditor wants to know where the money went.

        Python is not broken, and neither is the processor. Every language that uses the hardware's floats does exactly the same. **What does a float actually store, and why can it not store 0.1? And if floats cannot be trusted with paise, what should a program use for money?**
  intuition:
    - text: |
        Start with something you already know fails. Write $\frac{1}{3}$ as a decimal: $0.3333\ldots$, with threes for ever. Stop after any number of digits and you have something slightly less than a third. Decimal can only write exactly the fractions whose bottom number divides a power of ten. $\frac{1}{4} = 0.25$ works because 4 divides 100. $\frac{1}{3}$ does not, because 3 divides no power of ten.

        Binary fractions work the same way, with columns worth halves instead of tenths. After the point come the $\frac{1}{2}$s column, the $\frac{1}{4}$s, the $\frac{1}{8}$s, the $\frac{1}{16}$s, and so on. So `0.11` in binary is $\frac{1}{2} + \frac{1}{4} = 0.75$. Binary can write exactly only the fractions whose bottom number divides a power of **two**: halves, quarters, eighths.

        Now try $\frac{1}{10}$. Ten is $2 \times 5$, and 5 divides no power of two. So in binary, one tenth is a fraction that never ends, like a third in decimal:

        $$0.1 = 0.0001100110011001100110011\ldots_2$$

        A float has room for only so many bits. It keeps the first 53 significant bits and rounds the rest away, so the 0.1 in your program is not one tenth. It is the nearest number to one tenth that 53 bits can write. Ask Python for twenty decimal places and it shows you:

        ```python
        print(f"{0.1:.20f}")
        ```

        This shows `0.10000000000000000555`. The 0.2 is likewise slightly more than two tenths, and their two small errors, added and rounded once more, land on the float just above the one nearest 0.3. Hence `0.30000000000000004`.

        So the rule is simple. A float holds halves, quarters and eighths, and any sum of them that fits in 53 bits, exactly. `0.5 + 0.25 == 0.75` is True. It holds tenths and hundredths only approximately, and money is counted in hundredths.
  derivation:
    - text: |
        **A float is scientific notation in binary.** You write a large number as $6.02 \times 10^{23}$: a few significant digits, and a power of ten saying where the point goes. A float does the same in base two. Every float is

        $$\pm \; 1.f \times 2^{e}$$

        where $1.f$ is a binary number with one digit before the point and the fraction $f$ after it, called the **significand**, and $e$ is a whole number, the **exponent**. The 64-bit float that Python uses, defined by the standard called **IEEE 754**, packs this into 64 bits:

        | Field | Bits | Holds |
        | --- | --- | --- |
        | sign | 1 | 0 for positive, 1 for negative |
        | exponent | 11 | $e$, stored with 1023 added so that it is never negative |
        | fraction | 52 | the bits of $f$ after the point |

        The 1 before the point is not stored at all. In binary every non-zero number begins with a 1, so the standard leaves it out and gets a 53rd significant bit for free. Python's `hex` method on a float shows the fields, with the significand in hex and the exponent after a `p`:

        ```python
        print((0.5).hex())
        print((0.1).hex())
        ```

        This shows `0x1.0000000000000p-1`, which is $1 \times 2^{-1}$, exact, and `0x1.999999999999ap-4`, which is $1.6 \times 2^{-4}$ with the hex digit 9, that is `1001`, repeating until the bits run out and the last digit rounds up to `a`. That repeating `1001` is the never-ending binary of a tenth.

        **Fifty-three bits is about sixteen decimal digits.** Since $2^{10} \approx 10^3$, 53 bits are worth about $53 \times 0.3 \approx 16$ decimal digits. A float is accurate to about 15 to 17 significant digits **whatever its size**. That is the whole design: like scientific notation, it spends its digits on the leading figures and lets the exponent carry the size.

        **So the gaps between floats grow with the numbers.** Near 1, neighbouring floats are $2^{-52}$ apart, about $2 \times 10^{-16}$. Near $2^{53}$, about $9 \times 10^{15}$, they are 2 apart, and there is no float for the odd numbers at all:

        ```python
        print(float(2 ** 53 + 1))
        print(1e16 + 1 == 1e16)
        ```

        This shows `9007199254740992.0`, which is $2^{53}$, not $2^{53} + 1$, and then `True`: adding 1 to $10^{16}$ changes nothing. Change the power of ten in the figure below and watch the gap between neighbouring floats grow with the number.
    - figure: float-gaps
      props: { power: 7 }
    - text: |
        This has a famous consequence outside Python. JavaScript stores every number as one of these floats, so whole numbers above $2^{53}$, about $9 \times 10^{15}$, cannot all be represented. A database id or a payment reference larger than that, sent to a web page as a JSON number, can arrive silently changed in its last digits. Large ids are sent as strings for exactly that reason.

        **Rounding happens at every step.** Each arithmetic operation on floats gives the float nearest to the exact answer. Each step is as good as it can be, but small errors can pile up, as in the ten lakh additions of 0.1, or be revealed by a later step, as in the GST: $2.75 \times 0.18$ is stored as `0.49499999999999999556`, just below the half-way point, so rounding to two places goes down.

        **What to do about it.**

        - **Never compare floats with `==`.** Ask whether they are close, as [[s0.booleans-and-conditionals]] showed: `abs(a - b) < tolerance`, with a tolerance that suits the size of the numbers.
        - **Never store money in floats.** Store whole **paise** as integers. Integers are exact at any size in Python, and up to $2^{63}$ in a 64-bit database column, which is more paise than all the money in the world. Do the arithmetic in paise and turn the result into rupees only when showing it. The booking site of [[s0.values-types-and-variables]], which kept ₹10.50 as 1050 paise, was doing exactly this.
        - **Round once, on purpose, with integer arithmetic.** 18% GST on 275 paise is $275 \times 18 = 4950$ hundredths of a paisa. To round half up to whole paise, add 50 and divide by 100 with `//`: $(4950 + 50) // 100 = 50$ paise. No float is involved anywhere, so there is nothing to go wrong.

        Python also has a `decimal` module, which does arithmetic in base ten exactly as written, and accounting systems often use it or its equivalent in a database. Integer paise are simpler and enough for everything in this course.
    - question:
        id: predict-float-digits
        type: predict
        system: s2
        prompt: Decide for each line whether the numbers are sums of halves, quarters and eighths, and so exact, or not. Then give what it shows.
        code: |
          print(0.5 + 0.25 == 0.75)
          print(0.1 + 0.7 == 0.8)
          print((0.75).as_integer_ratio())
          print(float(2 ** 53 + 2) == 2 ** 53 + 2)
        output: |
          True
          False
          (3, 4)
          True
        explanation: |
          Halves and quarters are exact in binary, so the first sum is exact. Tenths are not, and here their errors do not cancel. `as_integer_ratio` gives the exact fraction a float holds, and 0.75 really is $\frac{3}{4}$. Near $2^{53}$ floats are 2 apart, so the even number $2^{53} + 2$ is exactly representable.
    - question:
        id: fix-ledger
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `ledger_total(amounts)` takes a list of transaction amounts as **whole paise** and should **return** the total in paise, exactly. Whoever wrote it converted to rupees first and back at the end, and for ten lakh transactions of 10 paise it returns 10000000 plus a little, or minus a little, instead of exactly 10000000. Fix it so the total is always exact.
        starter: |
          def ledger_total(amounts):
              total = 0.0
              for paise in amounts:
                  total += paise / 100
              return total * 100

          print(ledger_total([10] * 1000000))
        solution: |
          def ledger_total(amounts):
              total = 0
              for paise in amounts:
                  total += paise
              return total

          print(ledger_total([10] * 1000000))
        tests: |
          assert ledger_total([10] * 1000000) == 10000000, "Ten lakh transactions of 10 paise should total exactly 10000000 paise"
          assert type(ledger_total([10, 20])) == int, "The total should be a whole number of paise, an int, not a float"
          assert ledger_total([]) == 0, "No transactions total 0 paise"
          assert ledger_total([1050, 1050, 1050]) == 3150, "Three fees of 1050 paise total 3150"
          assert ledger_total([2 ** 60, 1]) == 2 ** 60 + 1, "Very large totals must stay exact to the paisa"
        wrong:
          - "def ledger_total(amounts):\n    total = 0.0\n    for paise in amounts:\n        total += paise\n    return total\n"
          - "def ledger_total(amounts):\n    total = 0.0\n    for paise in amounts:\n        total += paise / 100\n    return round(total * 100)\n"
          - "def ledger_total(amounts):\n    total = 0\n    for paise in amounts:\n        total += paise // 100\n    return total * 100\n"
        explanation: "Dividing by 100 made every amount a float with a tiny error, and ten lakh of them added up. Whole paise are integers, and adding integers is exact at any size. A float total that happens to look right, or one rounded at the end, is still a float: it loses the last paisa once totals pass $2^{53}$."
  formal:
    - text: |
        A **binary fraction** has columns worth $\frac{1}{2}, \frac{1}{4}, \frac{1}{8}, \ldots$ after the point. A fraction $\frac{p}{q}$ in lowest terms has a finite binary expansion exactly when $q$ is a power of two. So $\frac{1}{10}$, $\frac{1}{5}$ and $\frac{1}{100}$ have none.

        An **IEEE 754 double**, Python's `float`, is 64 bits: a sign bit $s$, an 11-bit exponent field $E$ and a 52-bit fraction field $f$. For ordinary values it stands for

        $$(-1)^s \times 1.f_2 \times 2^{E - 1023}$$

        It has 53 significant bits, about 15 to 17 significant decimal digits. Between $2^k$ and $2^{k+1}$ neighbouring doubles are $2^{k-52}$ apart, so the gap is proportional to the size. Every whole number up to $2^{53}$ is exact. Special patterns of the exponent field give zero, infinity, written `inf`, and "not a number", written `nan`.

        Each arithmetic operation returns the double nearest the exact result. Errors of half a gap can accumulate over many operations.

        In Python, `x.hex()` shows a float's significand and exponent, `x.as_integer_ratio()` gives the exact fraction it holds, and `f"{x:.20f}"` shows twenty digits after the point.

        **Money** is kept exact by storing whole paise as integers. Rounding a product to whole paise, half up, is `(n + 50) // 100` when `n` is in hundredths of a paisa.
  drill:
    - text: Seconds each. Ask whether the bottom of the fraction is a power of two.
    - question:
        id: exact-half
        type: choice
        system: s1
        prompt: Which of these can a float store exactly?
        options: ["0.1", "0.2", "0.375", "0.3"]
        answer: 2
        explanation: "0.375 is $\\frac{3}{8}$, and 8 is a power of two."
    - question:
        id: predict-point-three
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(0.1 + 0.2 == 0.3)
        output: "False"
        explanation: Both tenths are stored slightly off, and the sum lands on the float just above the one nearest 0.3.
    - question:
        id: significand-bits
        type: numeric
        system: s1
        prompt: How many significant bits does a 64-bit float keep, counting the 1 that is not stored?
        answer: "53"
        unit: bits
        explanation: 52 stored fraction bits and one leading 1 for free.
    - question:
        id: predict-1e16
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(1e16 + 1 == 1e16)
        output: "True"
        explanation: Near $10^{16}$ neighbouring floats are 2 apart, so the 1 is rounded away.
    - question:
        id: predict-paise-sum
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(10 + 20 == 30)
        output: "True"
        explanation: In whole paise the arithmetic is exact.
    - question:
        id: binary-0-11
        type: numeric
        system: s1
        prompt: "What is the binary fraction `0.11` in decimal?"
        answer: "0.75"
        explanation: $\frac{1}{2} + \frac{1}{4}$.
    - question:
        id: decimal-digits
        type: choice
        system: s1
        prompt: About how many significant decimal digits does a 64-bit float hold?
        options: ["7", "16", "53", "308"]
        answer: 1
        explanation: 53 bits at about 0.3 decimal digits a bit.
  work:
    - text: Slower now. For every float, ask whether it is exact before you trust it.
    - question:
        id: write-add-gst
        type: code
        mode: write
        system: s2
        prompt: |
          Write `with_gst(price, rate)`. `price` is in whole paise and `rate` is the GST rate in whole per cent. **Return** the price plus GST, in whole paise, with the GST rounded to the nearest paisa and a half paisa rounded up. Use only integer arithmetic: no `/`, no floats and no `round`. So `with_gst(275, 18)` is 325.
        starter: |
          def with_gst(price, rate):
              return price

          print(with_gst(275, 18))
        solution: |
          def with_gst(price, rate):
              tax = (price * rate + 50) // 100
              return price + tax

          print(with_gst(275, 18))
        tests: |
          assert "/" not in source.replace("//", ""), "Use only whole-number division, //"
          assert "round" not in source, "Round with integer arithmetic, not round"
          assert with_gst(275, 18) == 325, "18% of 275 paise is 49.5 paise, which rounds up to 50: with_gst(275, 18) should be 325"
          assert with_gst(1000, 18) == 1180, "18% of ₹10 is ₹1.80: with_gst(1000, 18) should be 1180"
          assert with_gst(14999, 12) == 16799, "12% of 14999 paise is 1799.88 paise, which rounds to 1800"
          assert with_gst(10, 5) == 11, "5% of 10 paise is half a paisa, which rounds up"
          assert with_gst(1, 5) == 1, "5% of 1 paisa is a twentieth of a paisa, which rounds down to 0"
          assert type(with_gst(275, 18)) == int, "The answer should be a whole number of paise"
        wrong:
          - "def with_gst(price, rate):\n    tax = price * rate // 100\n    return price + tax\n"
          - "def with_gst(price, rate):\n    tax = (price * rate + 99) // 100\n    return price + tax\n"
          - "def with_gst(price, rate):\n    tax = (price * rate + 50) // 100\n    return tax\n"
        explanation: "`price * rate` is the tax in hundredths of a paisa. Adding 50 before dividing by 100 rounds a half up and anything less down. Plain `//` always rounds down, and adding 99 always rounds up: both are off by a paisa on some bills."
    - question:
        id: write-close
        type: code
        mode: write
        system: s2
        prompt: |
          A fixed tolerance such as 0.000001 is too strict for large numbers and too loose for tiny ones, because the gaps between floats grow with their size. Write `close(a, b)`, which **returns** `True` when `a` and `b` differ by at most one part in $10^9$ of the larger of their sizes, and `False` otherwise. Two zeros are close.
        starter: |
          def close(a, b):
              return a == b

          print(close(0.1 + 0.2, 0.3))
        solution: |
          def close(a, b):
              size = max(abs(a), abs(b))
              return abs(a - b) <= size / 10 ** 9

          print(close(0.1 + 0.2, 0.3))
        tests: |
          assert close(0.1 + 0.2, 0.3) == True, "0.1 + 0.2 and 0.3 differ only in the 17th digit"
          assert close(1e16 + 2, 1e16) == True, "1e16 + 2 and 1e16 differ by one part in 5 million billion"
          assert close(1.0, 1.1) == False, "1.0 and 1.1 are not close"
          assert close(1e-20, 2e-20) == False, "1e-20 and 2e-20 differ by half their size, so they are not close, though their difference is tiny"
          assert close(0.0, 0.0) == True, "Two zeros are close"
          assert close(-5.0, 5.0) == False, "-5 and 5 are not close"
        wrong:
          - "def close(a, b):\n    return abs(a - b) < 0.000001\n"
          - "def close(a, b):\n    return abs(a - b) <= 10 ** -9\n"
          - "def close(a, b):\n    return a == b\n"
        explanation: "A tolerance in proportion to the size matches how floats are built: each keeps about sixteen significant digits whatever its size. A fixed tolerance calls 1e-20 and 2e-20 equal, and however small it is, it calls 1e16 + 2 and 1e16 different, though no float lies between them."
    - question:
        id: write-rupees-text
        type: code
        mode: write
        system: s2
        prompt: |
          Write `rupees(paise)`. It takes a whole number of paise, 0 or more, and **returns** it as text for a bill: a rupee sign, the rupees, a point and exactly two digits of paise, so `rupees(32550)` is `"₹325.50"` and `rupees(7)` is `"₹0.07"`. Use `//` and `%`, never a float.
        starter: |
          def rupees(paise):
              return ""

          print(rupees(32550))
        solution: |
          def rupees(paise):
              whole = paise // 100
              part = paise % 100
              return f"₹{whole}.{part:02d}"

          print(rupees(32550))
        tests: |
          assert "/" not in source.replace("//", ""), "Split the paise with // and %, without making a float"
          assert rupees(32550) == "₹325.50", "rupees(32550) should be '₹325.50'"
          assert rupees(7) == "₹0.07", "rupees(7) should be '₹0.07', with two digits of paise"
          assert rupees(100) == "₹1.00", "rupees(100) should be '₹1.00'"
          assert rupees(0) == "₹0.00", "rupees(0) should be '₹0.00'"
          assert rupees(10000000) == "₹100000.00", "rupees(10000000) should be '₹100000.00'"
        wrong:
          - "def rupees(paise):\n    return f\"₹{paise // 100}.{paise % 100}\"\n"
          - "def rupees(paise):\n    return f\"₹{paise / 100}\"\n"
          - "def rupees(paise):\n    return f\"₹{paise / 100:.2f}\"\n"
        explanation: "`//` gives the rupees and `%` the paise left over, both exact. The paise need two digits, so 7 must show as `07`; `02d` pads a whole number with zeros, as `02X` did for hex. Formatting a float with `.2f` usually looks right, but it rounds a float, which is the thing this lesson is about avoiding."
    - question:
        id: predict-float-hex
        type: predict
        system: s2
        prompt: Read each float as $1.f \times 2^e$. What does this show?
        code: |
          print((4.0).hex())
          print((0.75).hex())
          print((1.5).as_integer_ratio())
        output: |
          0x1.0000000000000p+2
          0x1.8000000000000p-1
          (3, 2)
        explanation: |
          4 is $1 \times 2^2$. 0.75 is $1.5 \times 2^{-1}$, and 1.5 in binary is `1.1`, whose fraction bits `1000` are the hex digit 8. 1.5 is exactly $\frac{3}{2}$.
    - question:
        id: predict-sum-tenths
        type: predict
        system: s2
        prompt: Trace the loop in paise rather than in floats, and give what it shows.
        code: |
          total_float = 0.0
          total_paise = 0
          for i in range(10):
              total_float += 0.1
              total_paise += 10
          print(total_float == 1.0, total_paise == 100)
        output: "False True"
        explanation: |
          Ten floats of 0.1 add up to `0.9999999999999999`, one gap short of 1. Ten integers of 10 paise add up to exactly 100.
    - question:
        id: gap-near-2-52
        type: numeric
        system: s2
        prompt: Between $2^{52}$ and $2^{53}$, neighbouring 64-bit floats are $2^{52 - 52}$ apart. How far apart is that?
        answer: "1"
        explanation: $2^0 = 1$. In that range a float can hold every whole number but nothing in between.
    - question:
        id: why-paise
        type: choice
        system: s2
        prompt: Why should a payments system store amounts as whole paise in integers rather than as rupees in floats?
        options:
          - "Integers take less memory than floats."
          - "Tenths and hundredths are never-ending fractions in binary, so floats hold most rupee amounts only approximately, and the errors add up. Whole paise are integers, and integer arithmetic is exact."
          - "Floats cannot hold numbers as large as a company's yearly revenue."
          - "Integers are faster to add, and speed matters most for payments."
        answer: 1
        explanation: The problem is exactness, not size or speed. A float can hold enormous amounts, but not ₹0.10 exactly.
  connections:
    - text: |
        The puzzle is solved. A float stores a number as a sign, an exponent and 53 significant bits, in binary. A tenth is a never-ending fraction in binary, as a third is in decimal, so 0.1 is stored as the nearest 53-bit value, a little too large. Small errors like that add up over ten lakh transactions, or tip a GST calculation to the wrong side of a half. Money is kept exact by counting whole paise in integers and rounding once, on purpose.

        This lesson joined two earlier ones. The fractions and decimals of [[f0.fractions-decimals-and-percentages]] said which fractions end in base ten, and the same reasoning with powers of two says which end in base two. The scientific notation of [[f0.units-prefixes-and-orders-of-magnitude]] is exactly what a float is, with the exponent counting powers of two.

        Floats are the right tool for measurements, which are never exact anyway: distances, temperatures, probabilities, the millions of numbers inside a machine-learning model. There, the question is always "how close?", never "equal?", and later clusters on numerical methods and on hardware return to how much precision a computation really needs, down to the 16-bit and 8-bit floats that large models now use.

        Every value in this cluster has now been a row of bits: whole numbers, negative numbers, text and fractions. But a value of more than one byte must be laid out in memory, or sent down a wire, one byte at a time. Which byte goes first? Two machines that disagree read the same four bytes as two different numbers. That is the next lesson, [[h0.endianness-and-byte-order]].
