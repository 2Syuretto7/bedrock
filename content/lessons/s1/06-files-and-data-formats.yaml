          - "def read_measurements(path):\n    values = []\n    problems = []\n    with open(path) as f:\n        for number, line in enumerate(f):\n            text = line.strip()\n            if text != \"\":\n                try:\n                    values.append(float(text))\n                except ValueError:\n                    problems.append(number)\n    return (values, problems)\n"
          - "def read_measurements(path):\n    values = []\n    problems = []\n    with open(path) as f:\n        lines = [line.strip() for line in f if line.strip() != \"\"]\n    for number, text in enumerate(lines):\n        try:\n            values.append(float(text))\n        except ValueError:\n            problems.append(number + 1)\n    return (values, problems)\n"
        explanation: |
          The loop walks the file object, so only one line is held at a time. `enumerate` counts every line, blank or not, from zero, and one is added because people count lines from one. `strip` removes the line ending and any spaces, which makes the test for a blank line simple. The `try` is around the single conversion, so one bad line costs only itself. The third wrong answer in the tests removes the blank lines first and numbers what is left, so its line numbers no longer point at the right lines of the file, and a person told to look at line 2 would find nothing wrong there.
    - question:
        id: numeric-shared-encoding
        type: numeric
        system: s2
        concepts: [f1.composition-and-inverses]
        prompt: |
          A careless encoder writes a list of whole numbers from 0 to 99 by putting their digits one after another with nothing between, so that `[3, 14]` becomes `314`. How many different lists of such numbers, each written without leading zeros, are encoded as the three characters `123`?
        answer: "3"
        explanation: The lists are [1, 2, 3], [12, 3] and [1, 23]. The single number 123 is not allowed, since it is over 99. Three different values share one encoding, so the encoder has no inverse and no decoder can exist. A separator between the numbers cures it.
  connections:
    - text: |
        The puzzle asked how a dictionary that holds a list can be put into a row of characters and rebuilt exactly. The answer was a pair of functions that undo each other, an encoder and a decoder, and you now know three such pairs. One value on each line serves a list of numbers. CSV serves a table, and keeps no types. JSON serves nested data, keeps the basic types, and is read by every language.

        Underneath them is the file itself: opened with `with`, so that it is always closed; emptied by `"w"` and extended by `"a"`; and walked one line at a time, because a file object is an iterator. At this edge of the program, where data arrive from outside, the exceptions of the last lesson became everyday tools.

        Two threads continue.

        Look again at what JSON can hold. A list may contain numbers, or lists, which may contain lists, to any depth. A JSON value is defined in terms of **itself**: a value is a number, or a string, or a list of *values*. Now try to write a function that adds up every number in such a structure. A loop handles a list. A loop inside a loop handles a list of lists. But how many loops must you write when the depth is not known in advance? No fixed number will do. The way out is for a function to call itself, which is [[s1.recursion]], next.

        The `with` statement was used in this lesson as a formula: open, use, and the closing happens by itself. It is not special to files. Any object can take part, by way of two special methods, and the same statement will guard locks, timers and connections. You will see how in [[s1.generators-and-context-managers]].
