          def read_measurements(path):
              values = []
              problems = []
              with open(path) as f:
                  for number, line in enumerate(f):
                      text = line.strip()
                      if text == "":
                          pass
                      else:
                          try:
                              values.append(float(text))
                          except ValueError:
                              problems.append(number + 1)
              return (values, problems)

