          assert ".read(" not in source, "Do not call read. Loop over the file object, one line at a time."
          with open("_lab1.txt", "w") as _f:
              _f.write("2.5\n\nabc\n4\n   \n1e2\n7,5\n")
          assert read_measurements("_lab1.txt") == ([2.5, 4.0, 100.0], [3, 7]), "Lines 3 and 7 are not numbers. Lines 2 and 5 are blank and are skipped."
          with open("_lab2.txt", "w") as _f:
