        prompt: |
          JSON cannot hold objects of your own classes, so you must supply the encoding. The class `Point` is given. Write two functions.

          - `encode(points)` takes a list of `Point` objects and returns a JSON **string**.
          - `decode(text)` takes such a string and returns a list of `Point` objects.

          They must be inverses: `decode(encode(points))` must be a list of points equal to the original, in the same order. Choose any JSON representation you like for a point.
        starter: |
          import json

          class Point:
              def __init__(self, x, y):
                  self.x = x
                  self.y = y

              def __eq__(self, other):
                  return isinstance(other, Point) and self.x == other.x and self.y == other.y

              def __repr__(self):
                  return f"Point({self.x}, {self.y})"

          def encode(points):
              # Replace the next line with your own.
              return ""

          def decode(text):
              # Replace the next line with your own.
              return []

          path = [Point(0, 0), Point(1.5, -2)]
          print(decode(encode(path)))
        solution: |
          import json

          class Point:
              def __init__(self, x, y):
                  self.x = x
                  self.y = y

              def __eq__(self, other):
                  return isinstance(other, Point) and self.x == other.x and self.y == other.y

              def __repr__(self):
                  return f"Point({self.x}, {self.y})"

          def encode(points):
              return json.dumps([{"x": p.x, "y": p.y} for p in points])

          def decode(text):
              return [Point(d["x"], d["y"]) for d in json.loads(text)]

          path = [Point(0, 0), Point(1.5, -2)]
          print(decode(encode(path)))
        tests: |
          import json as _json
          _pts = [Point(0, 0), Point(1.5, -2), Point(3, 3)]
          _text = encode(_pts)
          assert type(_text) == str, "encode should return a string"
          _json.loads(_text)
          _back = decode(_text)
          assert type(_back) == list and len(_back) == 3, "decode should return a list of three points"
          assert all(isinstance(p, Point) for p in _back), "decode should return Point objects, not dictionaries or lists"
          assert _back == _pts, "decode(encode(points)) should equal the original list, in the same order"
          assert decode(encode([])) == [], "The empty list should survive the round trip"
          assert decode(encode([Point(1, 2)])) != [Point(2, 1)], "x and y must not be swapped on the way"
          assert encode(decode(_text)) == _text, "Encoding what was decoded should give back the same text"
          assert all(_a is not _b for _a, _b in zip(_pts, _back)), "decode should build new objects"
        wrong:
          - "import json\n\nclass Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __eq__(self, other):\n        return isinstance(other, Point) and self.x == other.x and self.y == other.y\n\ndef encode(points):\n    return json.dumps([{\"x\": p.x, \"y\": p.y} for p in points])\n\ndef decode(text):\n    return json.loads(text)\n"
          - "import json\n\nclass Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __eq__(self, other):\n        return isinstance(other, Point) and self.x == other.x and self.y == other.y\n\ndef encode(points):\n    return json.dumps([[p.x, p.y] for p in points])\n\ndef decode(text):\n    return [Point(y, x) for x, y in json.loads(text)]\n"
          - "import json\n\nclass Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __eq__(self, other):\n        return isinstance(other, Point) and self.x == other.x and self.y == other.y\n\ndef encode(points):\n    return str([(p.x, p.y) for p in points])\n\ndef decode(text):\n    return [Point(x, y) for x, y in json.loads(text)]\n"
        explanation: |
          The encoder first turns each point into something JSON can hold, a dictionary of two numbers, and lets `json.dumps` do the rest. The decoder runs the two steps backwards in the opposite order: `json.loads` to get the plain values, then the class to rebuild each object. That is the rule for the inverse of a composition from [[f1.composition-and-inverses]]: undo the last step first. A pair `[x, y]` would serve as well as a dictionary. What matters is that the two functions agree. The first wrong answer in the tests stops half-way and returns dictionaries, which look like the data but are not points and have none of their methods.
