          with open("_lab4.txt", "w") as _f:
              _f.write("x\n\n\ny\n5")
          assert read_measurements("_lab4.txt") == ([5.0], [1, 4]), "Line numbers count every line of the file, blank ones included. The last line may have no line ending."
        wrong:
