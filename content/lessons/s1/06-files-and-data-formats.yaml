concept: s1.files-and-data-formats
minutes: 105
claim: You can write and read text files safely with the with statement, explain why everything stored in a file must be turned into text and back, walk a large file one line at a time, store tables as CSV and nested data as JSON, say what each format can and cannot hold, and deal with the missing files and malformed lines that real data always contain.
recalls: [s1.exceptions]
uses: [s1.comprehensions-and-iterators, s1.modules-and-imports, s1.classes-and-objects, s0.values-types-and-variables, s0.strings, s0.loops, s0.functions, s0.lists-and-tuples, s0.dictionaries-and-sets, s0.reading-errors-and-debugging, f1.functions-as-machines, f1.composition-and-inverses]
leads: [s1.recursion, s1.generators-and-context-managers]
starter: |
  # Scratch space. Data that outlives the variable that held it.
  import json

  record = {"step": 100, "loss": 0.25, "tags": ["first", "run"]}

  with open("record.json", "w") as f:
      json.dump(record, f)

  with open("record.json") as f:
      print(f.read())

  with open("record.json") as f:
      again = json.load(f)
  print(again == record)
parts:
  recall:
    - text: |
        [[s1.exceptions]] ended by saying that programs fail mostly at their edges, where they meet the world outside, and that the `finally` clause exists for giving back what was borrowed. This lesson is about the most important edge of all, the file. Three quick pulls first.
  puzzle:
    - text: |
        A program trains a model for an hour. At the end it holds, in its variables, the things the hour was spent on: a list of a thousand error measurements and a dictionary of the settings that were used.

        ```python
        losses = [2.31, 1.87, 1.52, 1.44]          # and 996 more
        settings = {"rate": 0.01, "layers": [64, 64], "name": "first try"}
        ```

        Then the program ends, and all of it is gone. Variables live in the computer's working memory, which belongs to the running program and is wiped the moment it stops. An hour of work has left nothing behind.

        The computer has a second kind of memory, the disk, which keeps its contents when programs stop and when the power goes off. Data are kept there in **files**. But a file is a very simple thing. It is one long row of characters, with a name. It has no idea what a list is, or a float, or a dictionary.

        So here is the puzzle. How do you put a dictionary that holds a list of numbers into a row of characters? And it must be done in such a way that a different program, perhaps written in a different language, perhaps run by you a year from now, can read that row of characters and rebuild **exactly** the dictionary you started with. Writing something down is easy. `str(settings)` gives a row of characters at once. Getting it back is the hard direction: when you read that row from the file, you receive a single string of sixty characters, and `"[64, 64]"` is eight characters, not a list of two numbers.
  intuition:
    - text: |
        You already have the right idea for this, from [[f1.composition-and-inverses]]. Writing a value down is a function: it takes a value and gives a string. Reading it back is another function, from strings to values. What you need is for the second to **undo** the first, so that writing and then reading returns the value you began with. In symbols, with $\text{encode}$ for writing and $\text{decode}$ for reading,

        $$\text{decode}(\text{encode}(x)) = x \quad \text{for every value } x \text{ you care about}.$$

        The reading function has to be the inverse of the writing function. A pair of functions like that, agreed between the writer and the reader, is called a **data format**. That is the whole idea, and the rest of this lesson is detail.

        It also tells you what can go wrong. A function has an inverse only if it never sends two inputs to the same output: two different values must never be written down as the same string. If the list `[1, 2]` and the string `"[1, 2]"` both become the same eight characters, no reader can tell which was meant, and no amount of cleverness will recover it.

        Think of a recipe. A cake cannot be sent by post, but a recipe can: a row of characters from which anyone, anywhere, can rebuild the cake. The recipe works only because writer and reader agree on what "200 g" and "bake" mean. A format is that agreement.

        So there are two layers, and they should be kept apart in your mind. Below is the **file**: a named row of characters on the disk, which you can replace or read. Above is the **format**: a convention for arranging the characters so that they can be decoded. Python's `open` deals with the first. Modules such as `csv` and `json` deal with the second.
  derivation:
    - text: |
        **Writing and reading a file.** The built-in function `open` connects your program to a file and returns a **file object**, through which the characters go.

        ```python
        f = open("notes.txt", "w")
        f.write("first line\n")
        f.write("second line\n")
        f.close()
        ```

        The first argument is the file's name. The second is the **mode**, which says what you intend to do.

        | Mode | Meaning | If the file exists | If it does not |
        | --- | --- | --- | --- |
        | `"r"` | read (the default) | it is read from the start | `FileNotFoundError` |
        | `"w"` | write | **it is emptied at once** | it is created |
        | `"a"` | append | new text is added at the end | it is created |

        Take note of the middle row. Opening a file with `"w"` destroys what was in it, immediately, before a single character is written, and there is no undo. This is the easiest way there is to lose a day's results.

        `write` takes a string and nothing else. It also adds nothing. `print` ends every line for you, and `write` does not, so the `"\n"`, the character that ends a line, must be written out.

        `close` is not a formality. For speed, the text you write is first collected in memory and sent to the disk in large pieces. Closing the file sends the last piece. A program that stops before closing may leave a file that is incomplete or empty.

        Reading is the reverse.

        ```python
        f = open("notes.txt")
        text = f.read()
        f.close()
        print(text)
        ```

        `read` returns the whole content of the file as one string, with the line-ending characters in it.
    - text: |
        **Closing without fail: `with`.** There is a weakness in the code above. Suppose something between the `open` and the `close` raises an exception. The exception leaves the function at once, the `close` is never reached, and the file is left open with its last piece unwritten. The last lesson gave you the tool for that:

        ```python
        f = open("notes.txt", "w")
        try:
            f.write("first line\n")
        finally:
            f.close()
        ```

        This is correct, and it is so common that Python has a shorter statement which does exactly the same thing.

        ```python
        with open("notes.txt", "w") as f:
            f.write("first line\n")
            f.write("second line\n")
        ```

        The `with` statement opens the file, gives it the name after `as`, and runs the indented block. When the block ends, **in any way at all**, whether it finishes, returns or raises, the file is closed. You cannot forget, and an exception cannot prevent it.

        From here on, always open files with `with`. A bare `open` with a separate `close` is a bug that has not happened yet. How `with` works underneath, and how to make your own objects usable with it, comes at the end of this cluster.
    - question:
        id: predict-write-read
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          with open("a.txt", "w") as f:
              f.write("one")
              f.write("two\n")
              f.write("three\n")

          with open("a.txt") as f:
              text = f.read()

          print(len(text.splitlines()), text.splitlines()[0])
        output: "2 onetwo"
        explanation: write adds nothing of its own. The first two calls put "one" and "two" on the same line, because no line-ending character was written between them. So the file has two lines, and the first is "onetwo".
    - text: |
        **Only text goes in, and only text comes out.** A file holds characters. So a number must be turned into text before it is written, and turned back after it is read. You have had the two functions for this since [[s0.values-types-and-variables]]: `str` and `int`, or `float`.

        ```python
        scores = [90, 72, 85]

        with open("scores.txt", "w") as f:
            for score in scores:
                f.write(str(score) + "\n")

        with open("scores.txt") as f:
            again = [int(line) for line in f.read().splitlines()]

        print(again == scores)          # True
        ```

        This is a complete data format, the simplest that is of any use: **one value on each line**. Check it against the requirement. Encoding turns each number into its digits and ends the line. Decoding cuts the text at the line endings and reads each piece as a number. The second undoes the first, and the last line confirms it.

        The method `splitlines` cuts a string at its line endings and returns the list of lines without them. It is safer than `split("\n")`, which leaves an empty string at the end when the text finishes with a line ending.

        Forget either conversion and Python tells you. `f.write(90)` is a `TypeError`. And if you forget to convert back, you have a list of strings, `["90", "72", "85"]`, which will fail later, or will not fail and will do something absurd: `"90" + "72"` is `"9072"`.
    - question:
        id: fix-glued
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `save(path, numbers)` should write one number on each line, and `load(path)` should read them back as a list of whole numbers, so that loading what was saved returns the original list. There are two faults, one in each function. With them the program stops with an error. Fix both, so that it prints `[3, 14, 15]`.
        starter: |
          def save(path, numbers):
              with open(path, "w") as f:
                  for n in numbers:
                      f.write(str(n))

          def load(path):
              with open(path) as f:
                  return [line for line in f.read().splitlines()]

          save("pi.txt", [3, 14, 15])
          print(load("pi.txt"))
        solution: |
          def save(path, numbers):
              with open(path, "w") as f:
                  for n in numbers:
                      f.write(str(n) + "\n")

          def load(path):
              with open(path) as f:
                  return [int(line) for line in f.read().splitlines()]

          save("pi.txt", [3, 14, 15])
          print(load("pi.txt"))
        tests: |
          assert output.strip() == "[3, 14, 15]", "The program should print [3, 14, 15]"
          save("_t1.txt", [7, -2, 100])
          with open("_t1.txt") as _f:
              _text = _f.read()
          assert _text.splitlines() == ["7", "-2", "100"], "Each number should be on a line of its own"
          assert load("_t1.txt") == [7, -2, 100], "Loading what was saved should give back the same whole numbers"
          save("_t1.txt", [])
          assert load("_t1.txt") == [], "An empty list should be saved as an empty file and loaded as an empty list"
          with open("_t2.txt", "w") as _f:
              _f.write("1\n22\n333\n")
          assert load("_t2.txt") == [1, 22, 333], "load should read a file with one number on each line"
        wrong:
          - "def save(path, numbers):\n    with open(path, \"w\") as f:\n        for n in numbers:\n            f.write(str(n) + \"\\n\")\n\ndef load(path):\n    with open(path) as f:\n        return [line for line in f.read().splitlines()]\n\nprint([3, 14, 15])\n"
          - "def save(path, numbers):\n    with open(path, \"w\") as f:\n        for n in numbers:\n            f.write(str(n))\n\ndef load(path):\n    with open(path) as f:\n        return [int(c) for c in f.read()]\n\nprint([3, 14, 15])\n"
          - "def save(path, numbers):\n    with open(path, \"w\") as f:\n        f.write(str(numbers))\n\ndef load(path):\n    with open(path) as f:\n        return [3, 14, 15]\n\nprint([3, 14, 15])\n"
        explanation: |
          `save` wrote the digits with nothing between them, so the file held `31415`. That encoding sends different values to the same output: `[3, 14, 15]`, `[31, 415]` and `[31415]` all produce the same five characters, and no reader could tell them apart. The line ending is the separator that makes decoding possible. `load` then returned the lines as they were, which are strings. A format is a pair of functions, and each half must do its conversion: `str` and a separator on the way out, a split and `int` on the way in.
    - text: |
        **One line at a time.** `f.read()` brings the whole file into memory as one string. For a small file that is fine. A dataset can be far larger than the memory of the machine, and then it is impossible.

        You met the answer in [[s1.comprehensions-and-iterators]]. A file object is an **iterator over its lines**. A `for` loop over it receives one line at a time, and each line is forgotten when the next is fetched.

        ```python
        total = 0
        with open("scores.txt") as f:
            for line in f:
                total += int(line)
        print(total)
        ```

        The loop holds one line and one running total, however long the file is. This is the laziness you learnt, applied to the disk, and it is how every large dataset is read.

        Two details. Each line arrives **with its line ending**, as `"90\n"`. `int` and `float` ignore spaces and line endings around a number, so `int("90\n")` is 90. When the line is to be used as text, remove the ending first with `line.strip()`.

        And a file object is an iterator, with everything that implies. It moves forwards only and can be walked **once**. A second loop over the same open file finds it already at the end and receives nothing, with no error. To read a file again, open it again.
    - question:
        id: predict-file-once
        type: predict
        system: s2
        concepts: [s1.comprehensions-and-iterators]
        prompt: What does this print?
        code: |
          with open("b.txt", "w") as f:
              f.write("3\n4\n5\n")

          with open("b.txt") as f:
              count = sum(1 for line in f)
              total = sum(int(line) for line in f)

          print(count, total)
        output: "3 0"
        explanation: A file object is an iterator over its lines. The first generator walks it to the end, counting three lines. The second then finds nothing left, and the empty sum is 0. No error is raised. To get 12, the file would have to be opened a second time, or the lines kept in a list.
    - text: |
        **Tables: comma-separated values.** Most data are tables: rows of records, each with the same columns. The oldest and commonest format for a table puts one row on each line and separates the cells with commas. It is called **CSV**. The first line usually holds the names of the columns, and is called the **header**.

        ```text
        name,city,score
        Asha,Pune,91
        Ravi,Delhi,78
        ```

        You could decode this by hand: split the text into lines, and each line at its commas with `line.split(",")`. Encoding is `",".join(cells)`. Try it, and it works, until the day a cell contains a comma itself:

        ```text
        name,city,score
        "Sharma, Asha",Pune,91
        ```

        A split at the commas now finds four cells in a row of three, and every column after the first is shifted. The format has a rule for this: a cell that contains a comma is wrapped in double quotes. It has further rules for a cell that contains a double quote, and for one that contains a line ending. Getting them all right by hand is harder than it looks, and somebody has already done it. The module `csv` knows the rules.

        ```python
        import csv

        with open("people.csv", "w", newline="") as f:
            writer = csv.writer(f)
            writer.writerow(["name", "city", "score"])
            writer.writerow(["Sharma, Asha", "Pune", 91])

        with open("people.csv") as f:
            for row in csv.reader(f):
                print(row)
        # ['name', 'city', 'score']
        # ['Sharma, Asha', 'Pune', '91']
        ```

        `csv.writer(f)` wraps a file and gives an object whose `writerow` method writes one list as one line, adding quotes where they are needed. `csv.reader(f)` wraps a file and gives an iterator of rows, each a list of cells. The extra argument `newline=""` when opening for writing lets the module manage the line endings itself, and should always be given.

        Look hard at the last line of output. The score was written as the number 91 and came back as the string `'91'`. **CSV has no types.** Every cell is text, and nothing in the file says which columns are meant to be numbers. The reader of the file must know, and must convert. In that sense CSV is only half a format, and the other half is in your code.

        When there is a header, `csv.DictReader` is usually more convenient. It reads the first row as the column names, and then gives each later row as a dictionary from column name to cell.

        ```python
        with open("people.csv") as f:
            for row in csv.DictReader(f):
                print(row["name"], int(row["score"]))
        ```

        Code written this way does not break when someone adds a column or changes their order.
    - question:
        id: predict-csv-strings
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          import csv

          with open("c.csv", "w", newline="") as f:
              writer = csv.writer(f)
              writer.writerow(["x", "y"])
              writer.writerow([2, 3])
              writer.writerow([10, 20])

          with open("c.csv") as f:
              rows = [row for row in csv.DictReader(f)]

          print(len(rows), rows[0]["x"] + rows[0]["y"], int(rows[1]["x"]) + int(rows[1]["y"]))
        output: "2 23 30"
        explanation: The header row gives the column names and is not counted as data, so there are two rows. Every cell comes back as a string, so adding the cells of the first row joins "2" and "3" into "23". Converting the cells of the second row to whole numbers first gives a real sum.
    - text: |
        **Nested data: JSON.** A table is flat. The `settings` dictionary of the puzzle is not: it holds a list inside a dictionary, and real configurations nest much deeper. For data of any shape, the usual format is **JSON**.

        The idea of JSON is simple. Write the value down the way you would type it into a program. A list is written with square brackets, a dictionary with curly brackets, a string in double quotes, a number as its digits.

        ```python
        import json

        settings = {"rate": 0.01, "layers": [64, 64], "name": "first try", "resume": False, "notes": None}
        text = json.dumps(settings)
        print(text)
        # {"rate": 0.01, "layers": [64, 64], "name": "first try", "resume": false, "notes": null}

        again = json.loads(text)
        print(again == settings)          # True
        print(type(again["layers"]))      # <class 'list'>
        ```

        `json.dumps` is the encoder: value to string. `json.loads` is the decoder: string to value. The `s` at the end of each stands for string. And unlike CSV, the types survive. The list came back as a list, the float as a float, because the notation itself distinguishes them: `64` is a number and `"64"` is a string. The puzzle is solved by these two functions.

        The format is not Python, although it resembles it. It writes `true`, `false` and `null` where Python has `True`, `False` and `None`, and its strings always use double quotes. This is because JSON is shared by nearly every programming language, which is its great strength: a file written by your Python program can be read by anything.

        To go straight to and from a file, there are `json.dump(value, f)` and `json.load(f)`, without the `s`.

        ```python
        with open("settings.json", "w") as f:
            json.dump(settings, f, indent=2)

        with open("settings.json") as f:
            again = json.load(f)
        ```

        The `indent=2` argument spreads the text over many indented lines so that a person can read it.
    - text: |
        **What JSON cannot hold.** JSON has six kinds of value: dictionaries, lists, strings, numbers, the two truth values, and null. Anything else must be bent to fit, and it is essential to know how, because the bending is where the inverse breaks.

        | Python value | What happens | After decoding |
        | --- | --- | --- |
        | a tuple `(1, 2)` | written as a list | the list `[1, 2]` |
        | a dictionary key that is a number, `{1: "a"}` | written as a string | `{"1": "a"}` |
        | a set `{1, 2}` | `TypeError` | |
        | an object of your own class | `TypeError` | |

        The first two rows are quiet changes: encoding followed by decoding gives back something that is **not equal** to what you put in. A tuple and a list with the same items become the same text, so the encoder sends two values to one output there, and the decoder has to pick one. If your program later looks up `table[1]` in a dictionary that has been through JSON, it will find nothing, for the key is now `"1"`.

        For an object of your own class, you decide the encoding yourself: write a method that turns the object into a dictionary of plain values, and a function that builds an object back from such a dictionary.

        When the text is not valid JSON, `json.loads` raises `json.JSONDecodeError`. That class is a subclass of `ValueError`, so `except ValueError` catches it.

        **JSON Lines.** One more format combines two ideas of this lesson, and you will meet it everywhere in machine learning. Put one JSON value on each line of a file.

        ```text
        {"step": 1, "loss": 2.31}
        {"step": 2, "loss": 1.87}
        ```

        A file like this can be **appended to** one record at a time, which a single large JSON value cannot. It can also be read one line at a time, however large it grows. Logs of training runs and datasets of text are stored like this. Reading it is a loop over the lines with `json.loads` on each.

        **Which format?** Use CSV for a plain table that may be opened in a spreadsheet. Use JSON for settings, results and anything nested. Use JSON Lines for a long sequence of records. Later you will meet formats that store numbers as raw bytes instead of digits, which are far more compact, and the same principle will govern them: an encoder, and a decoder that is its inverse.
    - question:
        id: predict-json-roundtrip
        type: predict
        system: s2
        concepts: [f1.composition-and-inverses]
        prompt: What does this print?
        code: |
          import json

          before = {"point": (3, 4), 7: "seven"}
          after = json.loads(json.dumps(before))
          print(after == before, after["point"], "7" in after, 7 in after)
        output: "False [3, 4] True False"
        explanation: Encoding and then decoding is not the identity for this value. The tuple was written as a list and came back as a list. The number 7 used as a key was written as a string and came back as the string "7". So the result is not equal to what went in.
    - text: |
        **The edge is where things go wrong.** Inside your program you control the data. A file was written by someone else, or by an older version of your code, or was half written when the power failed. Three failures are routine.

        The file is not there. `open` raises `FileNotFoundError`. Whether to catch it depends, as always, on whether you can do something sensible. A missing settings file may have a sensible fallback: use the defaults. A missing dataset has none, and the error should stop the program.

        ```python
        try:
            with open("settings.json") as f:
                settings = json.load(f)
        except FileNotFoundError:
            settings = {"rate": 0.01}
        ```

        A line is malformed. The conversion raises `ValueError`. In a file of a million lines the error message should say **which** line, and `enumerate` supplies the number:

        ```python
        with open("scores.txt") as f:
            for number, line in enumerate(f):
                try:
                    score = int(line)
                except ValueError:
                    raise ValueError(f"line {number + 1} of scores.txt is not a number: {line.strip()}")
        ```

        The handler here does not hide the error. It catches a vague one and raises a precise one in its place.

        The file is well formed and the content is wrong: a negative age, a missing column. No library can know that. Only your own checks, at the moment of reading, can. **Check data where it enters the program**, and the rest of the program may trust it.
  formal:
    - text: |
        A **file** is a named sequence of characters kept on disk. A **file object**, returned by `open(path, mode)`, reads or writes it.

        | Operation | Effect |
        | --- | --- |
        | `with open(path, mode) as f:` | opens the file, runs the block, and closes the file however the block ends |
        | `f.write(s)` | appends the string `s` to what is written; adds no line ending |
        | `f.read()` | returns the rest of the file as one string |
        | `for line in f:` | walks the lines lazily, each with its line ending; one pass only |
        | `s.splitlines()` | the list of lines of the string `s`, without line endings |
        | `s.strip()` | `s` without spaces and line endings at its two ends |

        Modes: `"r"` reads and requires the file to exist; `"w"` empties or creates the file and writes; `"a"` creates the file if need be and writes at its end.

        A **data format** is a pair of functions, $\text{encode}$ from values to strings and $\text{decode}$ from strings to values, with $\text{decode}(\text{encode}(x)) = x$ for every value $x$ the format supports. This requires $\text{encode}$ never to send two different values to the same string.

        | Format | Encode | Decode | Holds | Types kept |
        | --- | --- | --- | --- | --- |
        | One value per line | `str(x) + "\n"` | `int(line)` or `float(line)` | a list of numbers | by agreement only |
        | CSV | `csv.writer(f).writerow(cells)` | `csv.reader(f)`, `csv.DictReader(f)` | a table | none; every cell is a string |
        | JSON | `json.dumps(x)`, `json.dump(x, f)` | `json.loads(s)`, `json.load(f)` | nested dictionaries and lists | dictionary, list, string, number, truth value, null |
        | JSON Lines | `json.dumps(x) + "\n"` for each record | `json.loads(line)` for each line | a sequence of records | as JSON |

        In JSON, dictionary keys are strings, tuples are encoded as lists, and sets and instances of user-defined classes are not supported. Python's `True`, `False` and `None` are written `true`, `false` and `null`.

        Exceptions at this boundary: `FileNotFoundError` for a missing file opened for reading; `ValueError` for text that is not a number, and its subclass `json.JSONDecodeError` for text that is not JSON; `TypeError` from `write` given something other than a string, and from `json.dumps` given an unsupported type.
  drill:
    - question:
        id: drill-mode-w
        type: choice
        system: s1
        prompt: |
          A file `results.txt` holds yesterday's results. A program runs `with open("results.txt", "w") as f:` and then stops with an error on the very next line, before writing anything. What does the file hold now?
        options:
          - Yesterday's results, untouched.
          - Nothing. Opening with "w" emptied it at once.
          - Yesterday's results, followed by an error message.
          - The file no longer exists.
        answer: 1
        explanation: Mode "w" empties the file at the moment it is opened, before any write. The old content is gone. Mode "a" would have kept it.
    - question:
        id: drill-append
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          with open("d.txt", "w") as f:
              f.write("a\n")
          with open("d.txt", "a") as f:
              f.write("b\n")
          with open("d.txt", "w") as f:
              f.write("c\n")
          with open("d.txt", "a") as f:
              f.write("d\n")
