concept: s1.recursion
minutes: 105
claim: You can write a function that calls itself, with a base case and a step that moves towards it, trace its calls as they pile up and unwind, argue that it stops, use it on data of unknown depth and on problems that split in half, explain why the obvious Fibonacci function is hopelessly slow, and repair it by remembering answers.
recalls: [s1.files-and-data-formats]
uses: [s1.exceptions, s1.classes-and-objects, s1.modules-and-imports, s1.comprehensions-and-iterators, s0.strings, s0.booleans-and-conditionals, s0.loops, s0.functions, s0.lists-and-tuples, s0.dictionaries-and-sets, f1.exponents-and-exponential-growth, f1.logarithms, f1.summation-notation, f1.arithmetic-and-geometric-series, f1.exponents-and-exponential-growth]
leads: [s1.generators-and-context-managers]
starter: |
  # Scratch space. A function that asks itself a smaller question.
  def nested_sum(data):
      total = 0
      for item in data:
          if isinstance(item, list):
              total += nested_sum(item)
          else:
              total += item
      return total

  print(nested_sum([1, [2, [3, 4]], [5]]))
parts:
  recall:
    - text: |
        [[s1.files-and-data-formats]] ended with a question it could not answer. A JSON value may be a list that contains lists that contain lists, to any depth, and no fixed number of loops can add up the numbers in it. This lesson answers the question. Three quick pulls first.
  puzzle:
    - text: |
        Here is a value of the kind that JSON files are full of.

        ```python
        data = [1, [2, [3, 4]], [5]]
        ```

        Add up every number in it. The answer is 15, and you can see that at a glance. Now write the function.

        A loop over `data` meets three items: the number 1, the list `[2, [3, 4]]`, and the list `[5]`. Two of them are not numbers, so a second loop is needed inside the first to open them. But inside `[2, [3, 4]]` there is another list, so a third loop is needed inside the second. This particular value needs three loops. The next file may nest to a depth of four, or forty. **The number of loops you must write depends on the data, and you have to write the program before you see the data.**

        No fixed program made of nested loops can do it. Yet the task is plainly simple, and you did it in your head without counting levels. What were you doing?
  intuition:
    - text: |
        Stand in a long queue, and suppose you want to know your position in it. You cannot see the front. You could leave the queue and count, but there is a lazier way. Tap the person in front of you and ask: *what is your position?* Whatever they answer, yours is one more.

        They do not know either. So they do the same thing: they ask the person in front of them, and wait. The question travels forward, one person at a time, each of them now waiting for an answer. At last it reaches the person at the very front, who needs to ask nobody. They are first, and they say so: *one*.

        Now the answers travel back. The second person hears "one" and says "two". The third hears "two" and says "three". Eventually the person in front of you turns round and gives you a number, and you add one.

        Look at what each person did. Nobody counted the queue. Each did one tiny piece of work, adding one, and handed the rest of the problem, **the same problem but smaller**, to someone else. And one person, at the front, had a problem so small that the answer was known outright.

        That is how you added up the nested list. You did not think "three levels". You thought: the total of a list is the sum of its items, and where an item is itself a list, *its* contribution is *its* total, which is the same question asked of a smaller thing.

        A function that solves a problem by handing a smaller version of the same problem to itself is called **recursive**. It needs exactly the two things the queue had. There must be a case so small that it is answered directly, the person at the front. And every other case must hand on something strictly **smaller**, so that the front is certain to be reached.
  derivation:
    - text: |
        **From a recurrence to a function.** You have seen a definition that refers to itself before. In [[f1.arithmetic-and-geometric-series]] a sequence could be given by a **recurrence**, each term in terms of the one before, together with a starting value. The factorial is the standard example:

        $$0! = 1, \qquad n! = n \times (n - 1)! \quad \text{for } n \ge 1.$$

        The second equation defines the factorial in terms of the factorial. That is not circular, because the factorial on the right is of a *smaller* number, and the first equation stops the descent. Python lets you type the recurrence in almost as it stands.

        ```python
        def factorial(n):
            if n == 0:
                return 1
            return n * factorial(n - 1)
        ```

        The function calls itself. Nothing new in the language is needed for this. A call is a call, and it makes no difference that the function being called has the same name as the one that is running.

        To see that it works, follow `factorial(3)`. It is not 0, so it must compute `3 * factorial(2)`, and it cannot multiply until it knows `factorial(2)`. So it **waits**, and a new call begins. That call needs `factorial(1)`, and waits. That one needs `factorial(0)`, and waits. Now there are four calls in existence at once, three of them waiting. `factorial(0)` is the person at the front of the queue: it returns 1 at once. Then the answers come back. The call with `n = 1` wakes, computes $1 \times 1 = 1$ and returns. The call with `n = 2` wakes, computes $2 \times 1 = 2$. The call with `n = 3` wakes, computes $3 \times 2 = 6$.

        Step through it below. The pile of waiting calls is called the **call stack**. It grows as the questions go down, and shrinks as the answers come up.
    - figure: call-stack
      props:
        n: 4
    - text: |
        The thing to notice in the picture is that there are several values of `n` alive at the same time. That is possible because of something you learnt in [[s0.functions]] and again in the lesson on modules: **each call of a function has its own table of local names**. The four calls do not share one `n`. Each has its own, and when a call wakes up, its own `n` is exactly as it left it.

        **The two parts.** Every recursive function has the same anatomy.

        - A **base case**: an input small enough to be answered without a further call. Here it is `n == 0`.
        - A **recursive case**: for any other input, do a little work and call the function on an input that is closer to the base case. Here it is `n * factorial(n - 1)`.

        Leave out the base case, or step away from it instead of towards it, and the calls go down for ever. Each waiting call occupies memory, so Python does not allow that. It keeps count of the depth of the stack, and when the depth passes a limit, about a thousand, it raises `RecursionError: maximum recursion depth exceeded`. When you see that message, look for a base case that is missing or is never reached.
    - question:
        id: predict-down-up
        type: predict
        system: s2
        prompt: What does this print?
        code: |
          def visit(n):
              if n == 0:
                  print("base")
                  return
              print("down", n)
              visit(n - 1)
              print("up", n)

          visit(2)
        output: |
          down 2
          down 1
          base
          up 1
          up 2
        explanation: Each call prints its down line and then waits for the call below it. Only when the base case has been reached do the waiting calls resume, innermost first, each printing its up line with its own value of n.
    - question:
        id: choice-base-case
        type: choice
        system: s1
        prompt: |
          What happens when this function is called as `countdown(3)`?

          ```python
          def countdown(n):
              print(n)
              countdown(n - 1)
          ```
        options:
          - It prints 3, 2, 1, 0 and stops.
          - It prints 3 and stops.
          - It prints 3, 2, 1, 0, -1, -2 and so on, until Python stops it with a RecursionError.
          - It prints nothing, because a function may not call itself.
        answer: 2
        explanation: There is no base case. Nothing ever tells the function to stop calling itself, so the calls pile up until the stack reaches Python's limit.
    - text: |
        **Why it must stop, and why it must be right.** How can you be sure that a recursive function finishes? Find a quantity, call it the **measure**, with two properties: it is a whole number that is never negative, and it gets **strictly smaller** with every recursive call. A whole number that keeps decreasing and may not go below zero cannot decrease for ever. So the chain of calls is finite. For `factorial` the measure is `n` itself. For a function on lists it is usually the length of the list.

        And how do you know the answer is right, without tracing every call? You do not trace. You reason in two steps.

        1. Check the base case by hand.
        2. For the recursive case, **assume** the recursive call returns the right answer for its smaller input, and check that your line then produces the right answer for this one.

        The second step feels like cheating: you are assuming that the function works in order to show that it works. It is not cheating, because you assume it only for **smaller** inputs. The smallest input is right by step 1. The next smallest is then right by step 2, since it relies only on the smallest. The next is right because it relies only on those, and so on up, as far as you like. This way of reasoning has a name, **induction**, and it is one of the main methods of proof in mathematics. For now, use it as a working habit: **write the recursive case as though the function were already finished, and trust it on anything smaller.**
    - text: |
        **Solving the puzzle.** Describe the data first, and the function will follow. What is a nested list?

        > A nested list is a list in which each item is either a number or a nested list.

        The description mentions itself, and it has two cases. The function has the same shape exactly.

        ```python
        def nested_sum(data):
            total = 0
            for item in data:
                if isinstance(item, list):
                    total += nested_sum(item)
                else:
                    total += item
            return total
        ```

        Read the recursive line with trust: *`nested_sum(item)` is the total of that inner list.* Then the loop is obviously right, since it adds each number and each inner total.

        Where is the base case? It is the list with no lists in it. Such a list never reaches the recursive line, so no further call is made. The measure is the depth of nesting, which drops by at least one with each call.

        One loop, written once, now handles any depth at all, because the function is entered afresh at every level. **When data are defined in terms of themselves, the function that processes them calls itself in the same places.** Folders that contain folders, a web page of elements inside elements, a sentence made of phrases made of phrases, the expression $2 \times (3 + (4 \times 5))$: all of them are handled this way.
    - question:
        id: predict-nested
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          def count_numbers(data):
              count = 0
              for item in data:
                  if isinstance(item, list):
                      count += count_numbers(item)
                  else:
                      count += 1
              return count

          print(count_numbers([7, [8, [], [9, 9]], [[1]]]))
        output: "5"
        explanation: The function counts the items that are not lists, at every depth. They are 7, 8, 9, 9 and 1. The empty list contributes nothing, since the loop over it never runs.
    - text: |
        **Peeling a sequence.** A plain list or string can be seen recursively too: it is either empty, or it is a first item followed by a smaller sequence. So, for instance,

        ```python
        def total(xs):
            if len(xs) == 0:
                return 0
            return xs[0] + total(xs[1:])
        ```

        The base case is the empty list, whose total is the empty sum, 0. The recursive case takes off the first item and trusts the call on the rest. The measure is the length. This is the sigma notation of [[f1.summation-notation]] in its recursive form: $\sum_{i=1}^{n} a_i = a_1 + \sum_{i=2}^{n} a_i$.

        You would not write `total` this way in practice, since a loop does the job and has no limit on depth. But it shows the pattern at its barest, and the same pattern solves problems where a loop is awkward. Is a word a palindrome, the same forwards and backwards? A string of length 0 or 1 is. A longer one is, if its first and last characters agree **and** what lies between them is a palindrome.

        ```python
        def is_palindrome(s):
            if len(s) <= 1:
                return True
            return s[0] == s[-1] and is_palindrome(s[1:-1])
        ```
    - text: |
        **Halving.** A recursive call need not shrink the problem by one. It can cut it in half, and then something remarkable happens to the number of calls.

        Take the power $x^n$ for a whole number $n \ge 0$. The obvious recurrence is $x^n = x \times x^{n-1}$, which takes $n$ multiplications. But the exponent laws of [[f1.exponents-and-exponential-growth]] offer another: $x^{2k} = (x^k)^2$. To get $x^{16}$ you can square $x^8$, which is the square of $x^4$, which is the square of $x^2$, which is the square of $x$. Four multiplications instead of fifteen. For an odd exponent, take one factor out first: $x^{2k+1} = x \times (x^k)^2$.

        ```python
        def power(x, n):
            if n == 0:
                return 1
            half = power(x, n // 2)
            if n % 2 == 0:
                return half * half
            return x * half * half
        ```

        How many calls does `power(x, n)` make? Each call halves $n$. The number of times you can halve $n$ before reaching 1 is $\log_2 n$, by the very definition of the logarithm in [[f1.logarithms]]. So $x^{1\,000\,000}$ needs about 20 calls and at most 40 multiplications, where the obvious method needs a million. Note that the result of the recursive call is stored in `half` and used twice. Writing `power(x, n // 2) * power(x, n // 2)` would make two calls where one will do, and would throw the whole gain away.

        The same halving gives **binary search**. To find a name in a sorted list, look at the middle one. If it is too late in the alphabet, the name you want is in the first half, otherwise in the second, and that half is searched in the same way. A list of a million names is settled in about twenty looks. A problem that can be halved at each step can be solved in a number of steps that is the logarithm of its size, and that is the most valuable trick in the whole of computing.
    - question:
        id: numeric-halving
        type: numeric
        system: s1
        concepts: [f1.logarithms]
        prompt: |
          `power(x, n)` above calls itself with `n // 2` until `n` is 0. How many calls are made in all for `power(2, 8)`, counting the first?
        answer: "5"
        explanation: The values of n are 8, 4, 2, 1 and 0. Halving 8 three times reaches 1, since 8 is two to the third power, and one further call reaches the base case.
    - text: |
        **When recursion explodes.** The Fibonacci sequence is given by a recurrence with *two* earlier terms:

        $$F_0 = 0, \quad F_1 = 1, \quad F_n = F_{n-1} + F_{n-2}.$$

        It begins 0, 1, 1, 2, 3, 5, 8, 13, 21. Typed in directly:

        ```python
        def fib(n):
            if n < 2:
                return n
            return fib(n - 1) + fib(n - 2)
        ```

        This is correct, and it is catastrophically slow. `fib(30)` takes a noticeable pause. `fib(50)` would not finish in a day. Why?

        Each call makes **two** calls, and each of those makes two. `fib(5)` calls `fib(4)` and `fib(3)`. But `fib(4)` also calls `fib(3)`, so `fib(3)` is worked out twice, from scratch. `fib(2)` is worked out three times, and `fib(1)` five times. The calls form a tree that roughly doubles in width at each level. The number of calls needed for `fib(n)` grows like the Fibonacci numbers themselves, multiplying by about 1.6 each time $n$ goes up by one. That is exponential growth, the kind you studied in [[f1.exponents-and-exponential-growth]]. `fib(30)` makes about 2.7 million calls, and `fib(50)` about forty thousand million.

        Yet there are only 51 different questions being asked: `fib(0)` up to `fib(50)`. All the waste is in answering the same ones again and again. The cure is to **remember** each answer the first time it is found.

        ```python
        known = {}

        def fib(n):
            if n < 2:
                return n
            if n not in known:
                known[n] = fib(n - 1) + fib(n - 2)
            return known[n]
        ```

        The dictionary `known` maps each $n$ already solved to its answer. A question asked for the second time is answered by a look-up, with no further calls. Now each of the 51 values is computed once, and `fib(50)` returns instantly. This technique is called **memoisation**, from memo, a note to oneself. Whenever a recursion asks the same question many times, write the answers down.
    - question:
        id: numeric-fib-calls
        type: numeric
        system: s2
        concepts: [f1.arithmetic-and-geometric-series]
        prompt: |
          The first, slow `fib` makes one call for `fib(0)` and one for `fib(1)`. For larger `n`, the number of calls $C_n$ obeys the recurrence $C_n = C_{n-1} + C_{n-2} + 1$, the two sub-problems and the call itself. How many calls does `fib(6)` make in all?
        answer: "25"
        explanation: C(0) = 1 and C(1) = 1. Then C(2) = 3, C(3) = 5, C(4) = 9, C(5) = 15 and C(6) = 25. The count nearly doubles every two steps.
    - text: |
        **Recursion or a loop?** Anything a loop can do, recursion can do, and the reverse is true as well. So which should you choose?

        Use a **loop** when you are walking along something flat: a list, a range, the lines of a file. A loop uses no stack, and Python's depth limit of about a thousand makes deep recursion on long lists impractical.

        Use **recursion** when the problem has the shape of a tree: when the data are nested, or when the problem splits into smaller copies of itself, as in halving. Then the recursive function is short and plainly correct, and the equivalent loop is long and delicate, because it must manage by hand the pile of unfinished work that the call stack manages for you.

        There is a deeper reason to learn it well. A recurrence, a recursive function and a proof by induction are one idea wearing three sets of clothes: *settle the smallest case, and reduce every other case to a smaller one*. You will use the idea to define things, to compute them, and to prove facts about them.
  formal:
    - text: |
        A function is **recursive** if its body contains a call to itself. A correct recursive function has:

        - one or more **base cases**, inputs for which the result is returned without a recursive call;
        - one or more **recursive cases**, in which the function calls itself on inputs that are smaller according to some measure.

        **Termination.** Suppose there is a measure $m$ assigning to every input a whole number $m \ge 0$, such that every recursive call is made on an input with a strictly smaller measure, and every input of measure 0 is a base case. Then every call finishes, after at most $m$ nested calls.

        **Correctness.** If the base cases return correct results, and each recursive case returns a correct result whenever its recursive calls do, then the function is correct for every input.

        **The call stack.** Each call that has started and not yet returned holds its own local names. These pending calls form a stack: the most recent is the first to return. Python raises `RecursionError` when the stack grows past a fixed limit, about 1000 calls.

        | Pattern | Recursive call on | Depth of stack for size $n$ | Example |
        | --- | --- | --- | --- |
        | Reduce by one | $n - 1$, or the list without its first item | $n$ | factorial, total of a list |
        | Halve | $\lfloor n / 2 \rfloor$, or half the list | about $\log_2 n$ | fast power, binary search |
        | Structural | each nested part | the depth of nesting | sum of a nested list |
        | Branching | two or more smaller inputs | $n$, but the number of calls may be exponential | naive Fibonacci |

        **Memoisation.** Storing each result in a dictionary keyed by the input, and returning the stored result when the same input recurs, reduces the number of computed calls to the number of distinct inputs.

        A recurrence $a_n = f(a_{n-1})$ with $a_0$ given corresponds to the function with base case `n == 0` and recursive case `f(a(n - 1))`.
