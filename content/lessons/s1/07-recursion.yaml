    - question:
        id: drill-fib-predict
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          def fib(n):
              if n < 2:
                  return n
              return fib(n - 1) + fib(n - 2)

          print([fib(n) for n in range(8)])
        output: "[0, 1, 1, 2, 3, 5, 8, 13]"
