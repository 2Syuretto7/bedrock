        prompt: What does this print?
        code: |
          def stars(n):
              if n == 0:
                  return ""
              return "*" + stars(n - 1) + "-"

          print(stars(3))
        output: "***---"
        explanation: Each call wraps the result of the call below it with a star in front and a dash behind. The base case gives the empty string, and three wrappings give three stars and three dashes.
    - question:
        id: drill-measure
        type: choice
        system: s1
        prompt: |
          Which of these functions is certain to stop for every whole number `n >= 0`?
        options:
          - "`def f(n): return 0 if n == 0 else f(n - 2)`"
          - "`def f(n): return 0 if n == 0 else f(n + 1)`"
          - "`def f(n): return 0 if n <= 0 else f(n - 2)`"
