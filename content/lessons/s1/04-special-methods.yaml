        id: numeric-calls
        type: numeric
        system: s2
        prompt: |
          A `Vector` class defines `__add__`, and each call to it prints the word `adding`. How many times is `adding` printed by this line, where `total` is the function from the lesson and `a`, `b`, `c` and `zero` are vectors?

          `total([a, b, c], zero) + a + b`
        answer: "5"
        explanation: Inside total there is one addition for each of the three items in the list. The result then has a added to it, and then b, two more. Every one of those is a call of __add__.
  connections:
    - text: |
        The puzzle asked where the knowledge is, when `+` does three different things and `len` measures types that did not exist when it was written. It is in the objects. Every operator and every built-in function of that kind is a method call under an agreed name, and the class of the object supplies the method. `a + b` is `a.__add__(b)`, `len(a)` is `a.__len__()`, and `f(x)` is `f.__call__(x)`. Define the method, and your class receives the syntax, along with everything already written that uses it.

        You have now built, with your own hands, small versions of the two objects that machine learning runs on. A vector that adds, scales and takes dot products is a miniature of the array type in every numerical library. An object with stored numbers and a `__call__` is a miniature of a layer.

        Two threads continue.

        Several times in this lesson a method was given something it could not handle: a vector of the wrong size, a comparison with an integer, an index past the end. You dealt with these by `assert`, or by returning `NotImplemented`, or by not dealing with them. And the tests for your own exercises needed to check that a function *refuses* bad input, which they did with a construction you have not been taught. Errors are objects too, instances of classes, and there is a proper way to raise one, to catch one, and to define your own. That is [[s1.exceptions]], next.

        The `for` loop was the first protocol you met: it calls `__iter__` to obtain an iterator, and then `__next__` on that iterator, again and again. You can now see that those are special methods like the others. Writing an iterator class by hand is laborious, though, and Python offers a far shorter way to make one, along with one more protocol, for setting something up and reliably clearing it away. Both are in [[s1.generators-and-context-managers]].
