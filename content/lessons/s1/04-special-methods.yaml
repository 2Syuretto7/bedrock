    - question:
        id: drill-which-method
        type: choice
        system: s1
        prompt: |
          For two objects `a` and `b` of your own class, which method must the class define for `a - b` to work?
        options:
          - "`__minus__`"
          - "`__sub__`"
          - "`__neg__`"
          - "`__rsub__` only"
        answer: 1
        explanation: The binary minus is __sub__. __neg__ is the minus sign with a single operand, as in -a. The reflected __rsub__ is tried only when the left operand cannot answer.
    - question:
