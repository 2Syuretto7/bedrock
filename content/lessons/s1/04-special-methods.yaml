concept: s1.special-methods
minutes: 105
claim: You can explain that every operator and every built-in function such as len is a method call under a special name, give your own classes a printed form, equality, arithmetic, length, indexing and the ability to be called, explain why 2 * v needs a second method, and judge when an operator should be given a meaning and when it should not.
recalls: [s1.classes-and-objects]
uses: [s1.comprehensions-and-iterators, s1.modules-and-imports, s0.strings, s0.functions, s0.lists-and-tuples, s0.reading-errors-and-debugging, f0.fractions-decimals-and-percentages, f1.functions-as-machines, f1.composition-and-inverses]
leads: [s1.exceptions, s1.generators-and-context-managers]
starter: |
  # Scratch space. A vector that prints, compares and adds like a built-in type.
  class Vector:
      def __init__(self, components):
          self.components = list(components)

      def __repr__(self):
          return f"Vector({self.components})"

      def __eq__(self, other):
          return self.components == other.components

      def __add__(self, other):
          return Vector([a + b for a, b in zip(self.components, other.components)])

  v = Vector([1, 2])
  w = Vector([3, 4])
  print(v + w, v + w == Vector([4, 6]))
parts:
  recall:
    - text: |
        [[s1.classes-and-objects]] ended with a `Vector` that worked but read badly: `v.plus(w)` where you wanted `v + w`, and `v.same_as(w)` where you wanted `v == w`. It also left you with the one rule that explains everything about classes: `obj.f(a)` is the call `C.f(obj, a)`. Three quick pulls, and then the awkwardness is removed.
  puzzle:
    - text: |
        Here are three lines you have written many times.

        ```python
        print(3 + 4)              # 7
        print("ab" + "cd")        # abcd
        print([1, 2] + [3])       # [1, 2, 3]
        ```

        One symbol, three different actions: arithmetic, joining text, joining lists. How does `+` know which to do?

        You might guess that somewhere inside Python there is a long list of cases: if both are numbers, add; if both are strings, join; and so on. Now test the guess against `len`. It measures strings, lists, tuples, dictionaries, sets and ranges. It will also measure types that were written last week, by someone else, long after `len` itself was finished. A fixed list of cases cannot know about types that did not exist when the list was drawn up.

        So the knowledge cannot be inside `len`, and it cannot be inside `+`. Then where is it? And once you know where, can you put it into a class of your own, so that for two of your vectors `v + w` simply works?
  intuition:
    - text: |
        Suppose you run a parcel desk and people bring you objects to weigh. You do not need to know anything about what is in each parcel if every parcel has its weight written on a label in an agreed place. Your whole job is to read the label. A new kind of parcel, invented tomorrow, causes you no trouble at all, so long as it carries the label.

        `len` works like that. It knows nothing about lists or strings. It turns to the object and asks for the label. The label is a method with an agreed name, `__len__`, and `len(x)` simply calls it:

        ```python
        print(len([5, 6, 7]))             # 3
        print([5, 6, 7].__len__())        # 3, the same call written out
        ```

        The knowledge of how to measure a list is in the class `list`. The knowledge of how to measure a string is in the class `str`. `len` is only the desk.

        The operators work the same way. `a + b` is not arithmetic. It is a request to the object on the left: *here is `b`, add yourself to it*. In code, `a + b` is the method call `a.__add__(b)`.

        ```python
        print((3).__add__(4))             # 7
        print("ab".__add__("cd"))         # abcd
        ```

        An integer answers that request in its way and a string in its own. The symbol `+` never knew anything.

        These agreed names, with two underscores on each side, are called **special methods**. You have met one already: `__init__`, which Python calls when an object is made. There are several dozen others, one for each piece of syntax. Python promises to translate the syntax into the method call. A class that defines the method receives the syntax. Giving an operator a meaning for a new type is called **operator overloading**. Nothing about it is advanced. It is the rule from the last lesson, `obj.f(a)` is `C.f(obj, a)`, with a fixed choice of the name `f`.
  derivation:
    - text: |
        **A printed form: `__repr__`.** Begin with the vector as the last lesson left it, now holding any number of components in a list.

        ```python
        class Vector:
            def __init__(self, components):
                self.components = list(components)

        v = Vector([1, 2])
        print(v)          # <__main__.Vector object at 0x7f3a...>
        ```

        The output is useless. It names the class and gives the object's address in memory. `print` asked the object for a description of itself, the class offered none, and that is the default every class inherits.

        The method that describes an object is `__repr__`, short for representation. It takes only `self` and must return a string.

        ```python
        class Vector:
            def __init__(self, components):
                self.components = list(components)

            def __repr__(self):
                return f"Vector({self.components})"

        v = Vector([1, 2])
        print(v)          # Vector([1, 2])
        print([v, v])     # [Vector([1, 2]), Vector([1, 2])]
        ```

        The custom is to make the string look like the code that would rebuild the object. Then a value printed while debugging can be pasted straight back into a program. The built-in function `repr(x)` returns this string, by calling `x.__repr__()`.

        There is a second method, `__str__`, for a friendlier form meant for people who are not programmers. `print` and `str` look for `__str__` first and fall back on `__repr__` when it is missing. Write `__repr__` always, and `__str__` only when you need the two to differ.

        Write a `__repr__` first for every class you make. It costs two lines, and every error message and every debugging `print` from then on will tell you what you are looking at.
    - question:
        id: predict-repr
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          class Money:
              def __init__(self, rupees):
                  self.rupees = rupees

              def __repr__(self):
                  return f"Money({self.rupees})"

          purse = [Money(5), Money(20)]
          print(purse, repr(purse[1]))
        output: "[Money(5), Money(20)] Money(20)"
        explanation: Printing a list shows the repr of each item. The class supplies that through __repr__, and the built-in function repr calls the same method.
    - text: |
        **Equality: `__eq__`.** `a == b` is the call `a.__eq__(b)`. The default, as you saw, answers whether the two are one object. For a vector, equality should mean equal components.

        ```python
            def __eq__(self, other):
                if not isinstance(other, Vector):
                    return NotImplemented
                return self.components == other.components
        ```

        The last line hands the question on to the lists, which already know how to compare themselves. The first two lines deal with a comparison against something that is not a vector at all, such as `v == 5`. The method returns a special value, `NotImplemented`, which means "I do not know how to answer this". Python then tries the other operand, and if that does not know either, it settles on `False`. That is better than crashing while trying to read `components` from an integer.

        You do not need to write `!=` separately. Python answers `a != b` by asking `__eq__` and reversing the result.
    - text: |
        **Arithmetic: `__add__` and its relatives.** Vectors add component by component. The tools are those of [[s1.comprehensions-and-iterators]]: `zip` to pair the components, a comprehension to add each pair.

        ```python
            def __add__(self, other):
                assert len(self.components) == len(other.components), "sizes differ"
                return Vector([a + b for a, b in zip(self.components, other.components)])
        ```

        Now `v + w` works. Notice what the method does **not** do: it does not change `self`. It builds a new vector and returns it. This matters a great deal. When you write `c = a + b` with numbers, you do not expect `a` to be altered. An `__add__` that altered `self` would make `c = a + b` quietly damage `a`, and because of aliasing the damage would appear in every part of the program that held a reference to it. **An operator returns a new object and leaves its operands alone.**

        Each operator has its own name.

        | You write | Python calls | | You write | Python calls |
        | --- | --- | --- | --- | --- |
        | `a + b` | `a.__add__(b)` | | `a == b` | `a.__eq__(b)` |
        | `a - b` | `a.__sub__(b)` | | `a < b` | `a.__lt__(b)` |
        | `a * b` | `a.__mul__(b)` | | `-a` | `a.__neg__()` |
        | `a / b` | `a.__truediv__(b)` | | `abs(a)` | `a.__abs__()` |
        | `a @ b` | `a.__matmul__(b)` | | `a ** b` | `a.__pow__(b)` |

        The `@` in the table is new. It is an operator that Python provides and that none of the built-in types use. It was added to the language for mathematics, where there are two different products to tell apart. In the numerical libraries, `*` multiplies matching entries and `@` is the product of linear algebra. For two vectors that product is the dot product, so:

        ```python
            def __matmul__(self, other):
                return sum(a * b for a, b in zip(self.components, other.components))
        ```

        With that, `v @ w` is a number. You will type `@` constantly in machine-learning code.
    - question:
        id: predict-add-new
        type: predict
        system: s2
        prompt: What does this print?
        code: |
          class Vector:
              def __init__(self, components):
                  self.components = list(components)

              def __repr__(self):
                  return f"Vector({self.components})"

              def __add__(self, other):
                  return Vector([a + b for a, b in zip(self.components, other.components)])

          a = Vector([1, 1])
          b = Vector([2, 3])
          c = a + b + a
          print(a, c)
        output: "Vector([1, 1]) Vector([4, 5])"
        explanation: a + b + a is worked out from the left. a + b makes a new vector [3, 4], and adding a to that makes another new vector, [4, 5]. Neither addition changes a, because the method builds its result afresh.
    - text: |
        **The other side: `__rmul__`.** Multiplying a vector by a number should scale every component.

        ```python
            def __mul__(self, k):
                return Vector([a * k for a in self.components])
        ```

        Now `v * 2` works. Try `2 * v` and it fails with a `TypeError`. Why? Follow the rule. `2 * v` is the call `(2).__mul__(v)`. It is the **integer** that is asked, and the integer class was written decades before your vector. It has no idea what a `Vector` is, and it returns `NotImplemented`.

        Python does not give up at once. When the left operand cannot answer, it turns to the right one and asks a reversed question: `v.__rmul__(2)`, which means "you are on the right of a `*`, and the thing on your left is 2". If the class defines that, its answer is used.

        ```python
            def __rmul__(self, k):
                return self * k
        ```

        Since scaling does not care about order, the reflected method simply hands over to the ordinary one. Every arithmetic operator has such a twin: `__radd__`, `__rsub__`, and so on. The full rule for `a * b` is therefore: try `a.__mul__(b)`; if that method is missing or returns `NotImplemented`, try `b.__rmul__(a)`; if that fails too, raise a `TypeError`.
    - question:
        id: order-rmul
        type: order
        system: s2
        prompt: |
          `v` is a `Vector` whose class defines `__mul__` and `__rmul__`. Put in order what Python does to work out `3 * v`.
        steps:
          - Ask the left operand by calling the integer's __mul__ with v as the argument.
          - The integer does not know what a Vector is and returns NotImplemented.
          - Turn to the right operand and call v.__rmul__(3).
          - Inside __rmul__, work out self * 3, which calls v.__mul__(3).
          - Build and return a new Vector with every component multiplied by 3.
        explanation: The left operand is always asked first. Only when it declines is the right operand asked, through the reflected method, which here passes the work to the ordinary one.
    - text: |
        **Behaving like a container.** A vector has a number of components, a first component, a second. Three more special methods let it be measured, indexed and walked like a list.

        ```python
            def __len__(self):
                return len(self.components)

            def __getitem__(self, i):
                return self.components[i]

            def __iter__(self):
                return iter(self.components)
        ```

        `len(v)` calls `v.__len__()`. `v[0]` calls `v.__getitem__(0)`. And the `for` loop, which you learnt begins by calling `iter`, gets its iterator from `v.__iter__()`. Everything that walks an iterable now accepts a vector: `for`, `sum`, `max`, `zip`, `list`, comprehensions.

        This is the fact that answers the puzzle. `len` and `for` and `+` are not tied to any type. They are tied to method names. Each is a **protocol**: an agreement that anything offering certain methods will be accepted. Your class joins the protocol by defining the methods, and no one has to be asked for permission.

        The test `x in v` calls `v.__contains__(x)` if that is defined, and otherwise walks the object and compares, so a class with `__iter__` gets `in` for nothing. And the truth of an object in an `if`, as in `if v:`, comes from `__bool__` if it exists, or else from `__len__`, with a length of zero counting as false. That is why an empty list is false.

        This protocol matters far beyond vectors. In the library you will use to train models, a dataset is any object with a `__len__`, saying how many examples it has, and a `__getitem__`, returning example number `i`. That is the entire requirement. You will write such a class below.
    - question:
        id: predict-container
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          class Playlist:
              def __init__(self, songs):
                  self.songs = songs

              def __len__(self):
                  return len(self.songs)

              def __getitem__(self, i):
                  return self.songs[i]

              def __iter__(self):
                  return iter(self.songs)

          p = Playlist(["raga", "tala", "alap"])
          print(len(p), p[1], [s.upper() for s in p if "l" in s])
        output: "3 tala ['TALA', 'ALAP']"
        explanation: len calls __len__, the square brackets call __getitem__, and the comprehension walks the iterator that __iter__ returns. Two of the three songs contain the letter l.
    - text: |
        **Objects that can be called.** A function call `f(x)` is syntax too, and it has its method: `f(x)` is `f.__call__(x)`. A class that defines `__call__` makes objects that can be used as functions.

        Why would you want that, when you already have `def`? Because a plain function has no memory. Think of the linear function $x \mapsto wx + b$ from [[f1.functions-as-machines]]. There is not one such function but a whole family, one for each choice of $w$ and $b$. An object can carry its own $w$ and $b$ as attributes, and still be applied like a function:

        ```python
        class Linear:
            def __init__(self, w, b):
                self.w = w
                self.b = b

            def __call__(self, x):
                return self.w * x + self.b

        f = Linear(2, 1)
        g = Linear(-1, 0)
        print(f(3), g(3), f(g(3)))        # 7 -3 -5
        ```

        `f` is a function with adjustable settings. That is exactly what a layer of a neural network is: a function whose settings, called its parameters, are stored inside it and are changed step by step during training. When you later write `model(x)`, you are calling `__call__` on an object that holds millions of numbers.

        **Ordering.** `a < b` is `a.__lt__(b)`. This is the one method that `sorted`, `min` and `max` need, so a class that defines `__lt__` can be sorted.

        **A caution about equality and sets.** Membership in a set or a dictionary depends on a number computed from each object, its hash, and equal objects must have equal hashes. When you define `__eq__`, Python can no longer be sure that the default hash respects your notion of equality, so it removes the hash, and your objects can no longer be put in a set or used as a dictionary key. That is deliberate. The remedy is a method called `__hash__`, and you will not need it in this course for some time.
    - question:
        id: predict-call
        type: predict
        system: s2
        concepts: [f1.composition-and-inverses]
        prompt: What does this print?
        code: |
          class Power:
              def __init__(self, n):
                  self.n = n

              def __call__(self, x):
                  return x ** self.n

          square = Power(2)
          cube = Power(3)
          print(square(5), cube(2), square(cube(2)), cube.n)
        output: "25 8 64 3"
        explanation: Each object remembers its own exponent and applies it when called. square(cube(2)) is a composition. The inner call gives 8, and the outer squares it. The attribute n is still an ordinary attribute.
    - text: |
        **What all this buys.** Here is a function written with only numbers in mind.

        ```python
        def total(items, start):
            result = start
            for item in items:
                result = result + item
            return result

        print(total([1, 2, 3], 0))                                     # 6
        print(total([Vector([1, 0]), Vector([0, 1])], Vector([0, 0])))  # Vector([1, 1])
        ```

        The second call works, and `total` was not changed by a single character. It never asked what kind of things it was adding. It only used `+`, and anything that answers `+` will do. Code written once against a protocol works for every type that will ever join it. This is why the special methods are worth the trouble. They let your types take part in everything that has already been written.

        Mathematics works the same way. Later you will meet theorems proved about "anything that can be added and scaled", with no mention of what the things are, and the theorems will then hold for arrows, for lists of numbers, for functions and for much else.

        **When not to overload.** An operator makes a promise to the reader. `+` should combine two things of a kind into a third of the same kind, without changing either, and usually `a + b` should equal `b + a`. `==` should not change anything. `len` should be cheap and return a whole number. If your method keeps the promise, the operator makes code clearer. If you use `+` to mean "send this message", or `-v` to delete something, every reader will be misled. When there is no obviously right meaning, use a method with a plain name.
    - question:
        id: choice-overload-judgement
        type: choice
        system: s2
        prompt: |
          Which of these is a sound use of operator overloading?
        options:
          - "`account + 50` deposits 50 into the account and returns nothing."
          - "`total = price1 + price2`, for two `Money` objects in the same currency, returns a new `Money` holding the sum."
          - "`len(database)` deletes old rows and returns how many it removed."
          - "`user1 == user2` logs both users out and returns True."
        answer: 1
        explanation: Adding two amounts of money is real addition. It gives a new thing of the same kind and changes neither operand. The other three use the syntax for actions that change something, which no reader would expect from +, len or ==.
  formal:
    - text: |
        A **special method** is a method whose name Python calls in response to a piece of syntax or a built-in function. A class **overloads** an operator by defining the corresponding special method.

        | Syntax | Call | Should return |
        | --- | --- | --- |
        | `C(args)` | `C.__init__(new, args)` | nothing |
        | `repr(a)`, display in a list | `a.__repr__()` | a string, by custom code that rebuilds `a` |
        | `str(a)`, `print(a)` | `a.__str__()`, else `a.__repr__()` | a string |
        | `a == b` | `a.__eq__(b)` | `True`, `False` or `NotImplemented` |
        | `a < b` | `a.__lt__(b)` | `True` or `False` |
        | `a + b`, `a - b`, `a * b`, `a @ b` | `a.__add__(b)`, `__sub__`, `__mul__`, `__matmul__` | a new object |
        | `-a`, `abs(a)` | `a.__neg__()`, `a.__abs__()` | a new object or a number |
        | `len(a)` | `a.__len__()` | a whole number, not negative |
        | `a[i]` | `a.__getitem__(i)` | the item |
        | `x in a` | `a.__contains__(x)`, else by iteration | `True` or `False` |
        | `iter(a)`, `for x in a` | `a.__iter__()` | an iterator |
        | `a(args)` | `a.__call__(args)` | anything |

        **Reflected operators.** To evaluate `a * b`, Python calls `a.__mul__(b)`. If that method does not exist or returns `NotImplemented`, it calls `b.__rmul__(a)`. If that does not exist or returns `NotImplemented`, a `TypeError` is raised. The same holds for every binary arithmetic operator, with `__radd__`, `__rsub__` and so on.

        **Defaults.** A class that defines no `__eq__` compares by identity. `a != b` is the negation of `a == b` unless the class says otherwise. The truth value of an object is given by `__bool__` if defined, otherwise by whether `__len__` is non-zero, otherwise it is true.

        **Convention.** Binary operators return a new object and do not modify their operands.
  drill:
    - question:
        id: drill-len-call
        type: choice
        system: s1
        prompt: |
          What does Python do to work out `len(x)`?
        options:
          - It checks a built-in list of known types to find out how to measure x.
          - It calls the method `x.__len__()`.
          - It counts the characters in the name x.
          - It converts x to a list and counts the items.
        answer: 1
        explanation: len knows nothing about any type. It asks the object, through the agreed method name.
    - question:
