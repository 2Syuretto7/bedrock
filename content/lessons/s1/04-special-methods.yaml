    - question:
        id: drill-truth
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          class Queue:
              def __init__(self, items):
                  self.items = items

              def __len__(self):
                  return len(self.items)

          for q in [Queue([]), Queue([0])]:
              if q:
                  print("has items")
              else:
                  print("empty")
        output: |
          empty
