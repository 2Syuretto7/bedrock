    - question:
        id: drill-print-fallback
        type: choice
        system: s1
        prompt: |
          A class defines `__repr__` but not `__str__`. What does `print(obj)` show?
        options:
          - The default text with the class name and a memory address.
          - The string returned by `__repr__`.
          - Nothing, because print needs `__str__`.
          - An error.
        answer: 1
        explanation: print looks for __str__ first and falls back on __repr__ when there is none.
  work:
    - question:
        id: write-fraction
        type: code
        mode: write
        system: s2
        concepts: [f0.fractions-decimals-and-percentages, s1.modules-and-imports]
        prompt: |
          Write the class `Frac` for exact fractions, so that $\tfrac{1}{2} + \tfrac{1}{3}$ is exactly $\tfrac{5}{6}$ and not `0.8333333333333334`.

          - `Frac(n, d)` stores the fraction in **lowest terms** with a **positive denominator**, as the attributes `n` and `d`. Use `math.gcd`. You may assume `d` is not zero.
          - `repr` gives the form `Frac(5, 6)`.
          - `==` compares two fractions by value.
          - `+` and `*` return new fractions, by the rules of [[f0.fractions-decimals-and-percentages]].
        starter: |
          import math

          class Frac:
              def __init__(self, n, d):
                  # Replace the next two lines with your own.
                  self.n = n
                  self.d = d

              # Add __repr__, __eq__, __add__ and __mul__ here.

          print(Frac(1, 2) + Frac(1, 3))
          print(Frac(2, 3) * Frac(3, 4))
        solution: |
          import math

          class Frac:
              def __init__(self, n, d):
                  g = math.gcd(n, d)
                  if d < 0:
                      g = -g
                  self.n = n // g
                  self.d = d // g

              def __repr__(self):
                  return f"Frac({self.n}, {self.d})"

              def __eq__(self, other):
                  return self.n == other.n and self.d == other.d

              def __add__(self, other):
                  return Frac(self.n * other.d + other.n * self.d, self.d * other.d)

              def __mul__(self, other):
                  return Frac(self.n * other.n, self.d * other.d)

          print(Frac(1, 2) + Frac(1, 3))
          print(Frac(2, 3) * Frac(3, 4))
        tests: |
          _h = Frac(2, 4)
          assert (_h.n, _h.d) == (1, 2), "Frac(2, 4) should be stored in lowest terms, as 1 and 2"
          _m = Frac(3, -6)
          assert (_m.n, _m.d) == (-1, 2), "The denominator should be stored positive, so Frac(3, -6) is -1 and 2"
          assert repr(Frac(10, 12)) == "Frac(5, 6)", "repr should give the form Frac(5, 6)"
          assert Frac(1, 2) == Frac(2, 4), "1/2 and 2/4 are the same fraction"
          assert not (Frac(1, 2) == Frac(1, 3)), "1/2 and 1/3 are different"
          _s = Frac(1, 2) + Frac(1, 3)
          assert isinstance(_s, Frac) and (_s.n, _s.d) == (5, 6), "1/2 + 1/3 is 5/6"
          _p = Frac(2, 3) * Frac(3, 4)
          assert isinstance(_p, Frac) and (_p.n, _p.d) == (1, 2), "2/3 times 3/4 is 1/2, in lowest terms"
          assert Frac(1, 6) + Frac(1, 6) + Frac(1, 6) == Frac(1, 2), "Three sixths make a half, exactly"
          assert Frac(-1, 2) + Frac(1, 2) == Frac(0, 1), "A fraction plus its negative is zero, stored as 0 and 1"
          _a = Frac(1, 2)
          _b = _a + Frac(1, 2)
          assert (_a.n, _a.d) == (1, 2), "Adding must not change either fraction"
        wrong:
          - "import math\n\nclass Frac:\n    def __init__(self, n, d):\n        self.n = n\n        self.d = d\n\n    def __repr__(self):\n        return f\"Frac({self.n}, {self.d})\"\n\n    def __eq__(self, other):\n        return self.n * other.d == other.n * self.d\n\n    def __add__(self, other):\n        return Frac(self.n * other.d + other.n * self.d, self.d * other.d)\n\n    def __mul__(self, other):\n        return Frac(self.n * other.n, self.d * other.d)\n"
          - "import math\n\nclass Frac:\n    def __init__(self, n, d):\n        g = math.gcd(n, d)\n        if d < 0:\n            g = -g\n        self.n = n // g\n        self.d = d // g\n\n    def __repr__(self):\n        return f\"Frac({self.n}, {self.d})\"\n\n    def __eq__(self, other):\n        return self.n == other.n and self.d == other.d\n\n    def __add__(self, other):\n        return Frac(self.n + other.n, self.d + other.d)\n\n    def __mul__(self, other):\n        return Frac(self.n * other.n, self.d * other.d)\n"
          - "import math\n\nclass Frac:\n    def __init__(self, n, d):\n        g = math.gcd(n, d)\n        self.n = n // g\n        self.d = d // g\n\n    def __repr__(self):\n        return f\"Frac({self.n}, {self.d})\"\n\n    def __eq__(self, other):\n        return self.n == other.n and self.d == other.d\n\n    def __add__(self, other):\n        return Frac(self.n * other.d + other.n * self.d, self.d * other.d)\n\n    def __mul__(self, other):\n        return Frac(self.n * other.n, self.d * other.d)\n"
        explanation: |
          The constructor carries the invariant: every `Frac` that exists is in lowest terms with a positive denominator. Because `__add__` and `__mul__` build their results by calling `Frac(...)`, the results pass through the constructor and are simplified for free. And because every fraction has exactly one stored form, `__eq__` can compare the parts directly. The second wrong answer in the tests adds the tops and adds the bottoms, the classic mistake, which the test $\tfrac12 + \tfrac13 = \tfrac56$ catches. Python's standard library has this class already, under the name `fractions.Fraction`. You have just built its core.
    - question:
        id: fix-add-mutates
        type: code
        mode: find-bug
        system: s2
        prompt: |
          The program adds a step to a position and should print `Vector([1, 2]) Vector([4, 6])`: the old position unchanged, and the new one. It prints `Vector([4, 6]) Vector([4, 6])`. Fix the class.
        starter: |
          class Vector:
              def __init__(self, components):
                  self.components = list(components)

              def __repr__(self):
                  return f"Vector({self.components})"

              def __add__(self, other):
                  for i in range(len(self.components)):
                      self.components[i] += other.components[i]
                  return self

          position = Vector([1, 2])
          step = Vector([3, 4])
          moved = position + step
          print(position, moved)
        solution: |
          class Vector:
              def __init__(self, components):
                  self.components = list(components)

              def __repr__(self):
                  return f"Vector({self.components})"

              def __add__(self, other):
                  return Vector([a + b for a, b in zip(self.components, other.components)])

          position = Vector([1, 2])
          step = Vector([3, 4])
          moved = position + step
          print(position, moved)
        tests: |
          assert output.strip() == "Vector([1, 2]) Vector([4, 6])", "The old position should be unchanged, and the new one should be the sum"
          _a = Vector([1, 1])
          _b = Vector([2, 5])
          _c = _a + _b
          assert _c.components == [3, 6], "(1, 1) + (2, 5) is (3, 6)"
          assert _a.components == [1, 1], "Adding must not change the left operand"
          assert _b.components == [2, 5], "Adding must not change the right operand"
          assert _c is not _a and _c is not _b, "The sum should be a new object"
          assert isinstance(_c, Vector), "The sum should be a Vector"
        wrong:
          - "class Vector:\n    def __init__(self, components):\n        self.components = list(components)\n\n    def __repr__(self):\n        return f\"Vector({self.components})\"\n\n    def __add__(self, other):\n        for i in range(len(self.components)):\n            other.components[i] += self.components[i]\n        return other\n\nposition = Vector([1, 2])\nstep = Vector([3, 4])\nmoved = position + step\nprint(\"Vector([1, 2]) Vector([4, 6])\")\n"
          - "class Vector:\n    def __init__(self, components):\n        self.components = list(components)\n\n    def __repr__(self):\n        return f\"Vector({self.components})\"\n\n    def __add__(self, other):\n        return [a + b for a, b in zip(self.components, other.components)]\n\nposition = Vector([1, 2])\nstep = Vector([3, 4])\nmoved = position + step\nprint(\"Vector([1, 2]) Vector([4, 6])\")\n"
        explanation: |
          The method changed `self.components` in place and returned `self`. So `moved` and `position` were two names for one object, and that object had been altered. An operator must build a new object from its operands and leave them alone, as addition of numbers does. A second wrong answer in the tests returns a plain list instead of a `Vector`, which would make the next `+` fail, since the result of adding two vectors should be a vector.
    - question:
        id: write-vector-ops
        type: code
        mode: write
        system: s2
        concepts: [s1.modules-and-imports, s1.comprehensions-and-iterators]
        prompt: |
          Complete the `Vector` class with five more operations.

          - `v - w` is the vector of differences of matching components.
          - `v * k` and `k * v`, for a number `k`, scale every component.
          - `v @ w` is the dot product, a number.
          - `abs(v)` is the length of the vector, $\sqrt{v \cdot v}$. Use `math.sqrt` and your own `@`.

          No operation may change its operands.
        starter: |
          import math

          class Vector:
              def __init__(self, components):
                  self.components = list(components)

              def __repr__(self):
                  return f"Vector({self.components})"

              def __eq__(self, other):
                  return self.components == other.components

              # Add __sub__, __mul__, __rmul__, __matmul__ and __abs__ here.

          v = Vector([3, 4])
          w = Vector([1, 1])
          print(v - w, 2 * v, v @ w, abs(v))
        solution: |
          import math

          class Vector:
              def __init__(self, components):
                  self.components = list(components)

              def __repr__(self):
                  return f"Vector({self.components})"

              def __eq__(self, other):
                  return self.components == other.components

              def __sub__(self, other):
                  return Vector([a - b for a, b in zip(self.components, other.components)])

              def __mul__(self, k):
                  return Vector([a * k for a in self.components])

              def __rmul__(self, k):
                  return self * k

              def __matmul__(self, other):
                  return sum(a * b for a, b in zip(self.components, other.components))

              def __abs__(self):
                  return math.sqrt(self @ self)

          v = Vector([3, 4])
          w = Vector([1, 1])
          print(v - w, 2 * v, v @ w, abs(v))
        tests: |
          _v = Vector([3, 4])
          _w = Vector([1, 1])
          assert _v - _w == Vector([2, 3]), "(3, 4) - (1, 1) is (2, 3)"
          assert _w - _v == Vector([-2, -3]), "Subtraction depends on the order"
          assert _v * 2 == Vector([6, 8]), "(3, 4) scaled by 2 is (6, 8)"
          assert 2 * _v == Vector([6, 8]), "2 * v should work as well as v * 2"
          assert isinstance(0.5 * _v, Vector), "Scaling should return a Vector"
          assert _v @ _w == 7, "The dot product of (3, 4) and (1, 1) is 7"
          assert _v @ _v == 25, "The dot product of (3, 4) with itself is 25"
          assert abs(_v) == 5, "The length of (3, 4) is 5"
          assert abs(abs(Vector([1, 1, 1, 1])) - 2) < 1e-12, "The length of (1, 1, 1, 1) is 2"
          assert _v == Vector([3, 4]) and _w == Vector([1, 1]), "No operation may change its operands"
        wrong:
          - "import math\n\nclass Vector:\n    def __init__(self, components):\n        self.components = list(components)\n\n    def __repr__(self):\n        return f\"Vector({self.components})\"\n\n    def __eq__(self, other):\n        return self.components == other.components\n\n    def __sub__(self, other):\n        return Vector([a - b for a, b in zip(self.components, other.components)])\n\n    def __mul__(self, k):\n        return Vector([a * k for a in self.components])\n\n    def __matmul__(self, other):\n        return sum(a * b for a, b in zip(self.components, other.components))\n\n    def __abs__(self):\n        return math.sqrt(self @ self)\n"
          - "import math\n\nclass Vector:\n    def __init__(self, components):\n        self.components = list(components)\n\n    def __repr__(self):\n        return f\"Vector({self.components})\"\n\n    def __eq__(self, other):\n        return self.components == other.components\n\n    def __sub__(self, other):\n        return Vector([b - a for a, b in zip(self.components, other.components)])\n\n    def __mul__(self, k):\n        return Vector([a * k for a in self.components])\n\n    def __rmul__(self, k):\n        return self * k\n\n    def __matmul__(self, other):\n        return sum(a * b for a, b in zip(self.components, other.components))\n\n    def __abs__(self):\n        return math.sqrt(self @ self)\n"
          - "import math\n\nclass Vector:\n    def __init__(self, components):\n        self.components = list(components)\n\n    def __repr__(self):\n        return f\"Vector({self.components})\"\n\n    def __eq__(self, other):\n        return self.components == other.components\n\n    def __sub__(self, other):\n        return Vector([a - b for a, b in zip(self.components, other.components)])\n\n    def __mul__(self, k):\n        return Vector([a * k for a in self.components])\n\n    def __rmul__(self, k):\n        return self * k\n\n    def __matmul__(self, other):\n        return sum(a * b for a, b in zip(self.components, other.components))\n\n    def __abs__(self):\n        return sum(abs(a) for a in self.components)\n"
        explanation: |
          Each method is one line, because the tools were already in place: `zip` and a comprehension for the work on components, and the class itself to wrap the result. `__rmul__` exists only so that the number may stand on the left, and it hands over to `__mul__`. `__abs__` is built from your own `@`: the dot product of a vector with itself is the sum of the squares of its components, and the square root of that is its length, by Pythagoras' theorem. The vector $(3, 4)$ has length 5. These five operations, on lists of hundreds of numbers instead of two, are most of the arithmetic of machine learning.
