          class Temperature:
              def __init__(self, degrees):
                  self.degrees = degrees

              def __repr__(self):
                  return f"Temperature({self.degrees})"

              def __mul__(self, k):
                  return Temperature(self.degrees * k)

              def __rmul__(self, k):
                  return self * k

              def __eq__(self, other):
                  return self.degrees == other.degrees

          t = Temperature(10)
          print(t * 2, 2 * t, t == Temperature(10))
        tests: |
          assert output.strip() == "Temperature(20) Temperature(20) True", "The program should print Temperature(20) Temperature(20) True"
          _t = Temperature(4)
          assert (3 * _t).degrees == 12, "3 * t should scale the degrees"
          assert (_t * 3).degrees == 12, "t * 3 should still work"
          assert isinstance(3 * _t, Temperature), "3 * t should be a Temperature"
          assert _t == Temperature(4), "Two temperatures with the same degrees are equal"
          assert not (_t == Temperature(5)), "Two temperatures with different degrees are not equal"
          assert _t.degrees == 4, "Multiplying must not change the temperature"
        wrong:
          - "class Temperature:\n    def __init__(self, degrees):\n        self.degrees = degrees\n\n    def __repr__(self):\n        return f\"Temperature({self.degrees})\"\n\n    def __mul__(self, k):\n        return Temperature(self.degrees * k)\n\n    def __rmul__(self, k):\n        return self * k\n\n    def __eq__(self, other):\n        return True\n\nt = Temperature(10)\nprint(t * 2, 2 * t, t == Temperature(10))\n"
          - "class Temperature:\n    def __init__(self, degrees):\n        self.degrees = degrees\n\n    def __repr__(self):\n        return f\"Temperature({self.degrees})\"\n\n    def __mul__(self, k):\n        return Temperature(self.degrees * k)\n\n    def __rmul__(self, k):\n        return self.degrees * k\n\n    def __eq__(self, other):\n        return self.degrees == other.degrees\n\nt = Temperature(10)\nprint(\"Temperature(20) Temperature(20) True\")\n"
        explanation: |
          In `2 * t` the integer is asked first, through its own `__mul__`, and it has never heard of `Temperature`. Python then asks the right operand through `__rmul__`, which the class lacked. Adding it, and handing over to `__mul__`, makes the product work from either side. The `__eq__` that was written compared identity, which is what the default does anyway. Equality of values means comparing the attributes that make up the value.
    - question:
        id: write-dataset
        type: code
        mode: write
        system: s2
        prompt: |
          In machine-learning libraries a **dataset** is any object that can say how many examples it holds and can hand over example number `i`. Write the class `PairDataset`.

          - `PairDataset(inputs, targets)` takes two lists of the same length. Check that with an assertion.
          - `len(ds)` is the number of examples.
          - `ds[i]` is the tuple `(inputs[i], targets[i])`.
          - `for pair in ds:` walks the pairs in order.
          - `x in ds` should work without any further method.
        starter: |
          class PairDataset:
              def __init__(self, inputs, targets):
                  self.inputs = inputs
                  self.targets = targets

              # Add __len__, __getitem__ and __iter__ here.

          ds = PairDataset([1.0, 2.0, 3.0], ["a", "b", "c"])
          print(len(ds), ds[1], [target for x, target in ds])
        solution: |
          class PairDataset:
              def __init__(self, inputs, targets):
                  assert len(inputs) == len(targets), "inputs and targets must have the same length"
                  self.inputs = inputs
                  self.targets = targets

              def __len__(self):
                  return len(self.inputs)

              def __getitem__(self, i):
                  return (self.inputs[i], self.targets[i])

              def __iter__(self):
                  return iter(zip(self.inputs, self.targets))

          ds = PairDataset([1.0, 2.0, 3.0], ["a", "b", "c"])
          print(len(ds), ds[1], [target for x, target in ds])
        tests: |
          _ds = PairDataset([1.0, 2.0, 3.0], ["a", "b", "c"])
          assert len(_ds) == 3, "There are three examples"
          assert _ds[0] == (1.0, "a"), "Example 0 is the pair (1.0, 'a')"
          assert _ds[2] == (3.0, "c"), "Example 2 is the pair (3.0, 'c')"
          assert _ds[-1] == (3.0, "c"), "A negative index should count from the end, as it does for a list"
          assert list(_ds) == [(1.0, "a"), (2.0, "b"), (3.0, "c")], "Walking the dataset should give the pairs in order"
          assert list(_ds) == [(1.0, "a"), (2.0, "b"), (3.0, "c")], "The dataset should be walkable more than once"
          assert (2.0, "b") in _ds, "The pair (2.0, 'b') is in the dataset"
          assert (2.0, "c") not in _ds, "The pair (2.0, 'c') is not in the dataset"
          assert len(PairDataset([], [])) == 0, "An empty dataset has length 0"
          _stopped = False
          try:
              PairDataset([1, 2], [1])
          except AssertionError:
              _stopped = True
          assert _stopped, "Lists of different lengths should be stopped by an assertion in the constructor"
        wrong:
          - "class PairDataset:\n    def __init__(self, inputs, targets):\n        self.inputs = inputs\n        self.targets = targets\n\n    def __len__(self):\n        return len(self.inputs)\n\n    def __getitem__(self, i):\n        return (self.inputs[i], self.targets[i])\n\n    def __iter__(self):\n        return iter(zip(self.inputs, self.targets))\n"
          - "class PairDataset:\n    def __init__(self, inputs, targets):\n        assert len(inputs) == len(targets)\n        self.inputs = inputs\n        self.targets = targets\n        self.pairs = zip(inputs, targets)\n\n    def __len__(self):\n        return len(self.inputs)\n\n    def __getitem__(self, i):\n        return (self.inputs[i], self.targets[i])\n\n    def __iter__(self):\n        return self.pairs\n"
          - "class PairDataset:\n    def __init__(self, inputs, targets):\n        assert len(inputs) == len(targets)\n        self.inputs = inputs\n        self.targets = targets\n\n    def __len__(self):\n        return len(self.inputs) + len(self.targets)\n\n    def __getitem__(self, i):\n        return (self.inputs[i], self.targets[i])\n\n    def __iter__(self):\n        return iter(zip(self.inputs, self.targets))\n"
        explanation: |
          Three short methods, and the object takes part in `len`, in square brackets, in `for`, in comprehensions and in `in`. `__iter__` must return a **fresh** iterator on every call, which is why it builds a new `zip` each time. The second wrong answer in the tests makes one `zip` in the constructor and returns it every time, so the dataset can be walked once and is empty ever after, the mistake from the lesson on iterators. A training loop walks its dataset once per pass, for many passes.
    - question:
        id: write-polynomial
        type: code
        mode: write
        system: s2
        concepts: [f1.functions-as-machines]
        prompt: |
          A **polynomial** is a sum of whole-number powers of $x$, each multiplied by a fixed number called its **coefficient**: $c_0 + c_1 x + c_2 x^2 + \dots$, which is $\sum_k c_k x^k$. So $1 + 2x^2$ has the coefficients 1, 0 and 2. A polynomial is fixed by its list of coefficients. Write the class `Poly`.

          - `Poly([c0, c1, c2, ...])` stores the coefficients, lowest power first.
          - Calling the object, `p(x)`, returns the value of the polynomial at `x`.
          - `p + q` returns a new polynomial. The two may have different numbers of coefficients. Missing ones count as 0.
          - `repr` gives the form `Poly([1, 0, 2])`.

          For $p(x) = 1 + 2x^2$, `Poly([1, 0, 2])(3)` is 19.
        starter: |
          class Poly:
              def __init__(self, coefficients):
                  self.coefficients = list(coefficients)

              def __repr__(self):
                  return f"Poly({self.coefficients})"

              # Add __call__ and __add__ here.

          p = Poly([1, 0, 2])
          q = Poly([0, 5])
          print(p(3), p + q, (p + q)(1))
        solution: |
          class Poly:
              def __init__(self, coefficients):
                  self.coefficients = list(coefficients)

              def __repr__(self):
                  return f"Poly({self.coefficients})"

              def __call__(self, x):
                  return sum(c * x ** k for k, c in enumerate(self.coefficients))

              def __add__(self, other):
                  size = max(len(self.coefficients), len(other.coefficients))
                  mine = self.coefficients + [0] * (size - len(self.coefficients))
                  theirs = other.coefficients + [0] * (size - len(other.coefficients))
                  return Poly([a + b for a, b in zip(mine, theirs)])

          p = Poly([1, 0, 2])
          q = Poly([0, 5])
          print(p(3), p + q, (p + q)(1))
        tests: |
          _p = Poly([1, 0, 2])
          _q = Poly([0, 5])
          assert _p(3) == 19, "1 + 2 times 9 is 19"
          assert _p(0) == 1, "At x = 0 only the constant term is left"
          assert _q(2) == 10, "5x at x = 2 is 10"
          assert Poly([])(7) == 0, "The polynomial with no terms is zero everywhere"
          _s = _p + _q
          assert isinstance(_s, Poly), "The sum should be a Poly"
          assert _s.coefficients == [1, 5, 2], "(1 + 2x^2) + 5x has the coefficients 1, 5 and 2"
          assert (_q + _p).coefficients == [1, 5, 2], "The shorter polynomial may be on either side"
          assert _p.coefficients == [1, 0, 2] and _q.coefficients == [0, 5], "Adding must not change either polynomial"
          assert all((_p + _q)(x) == _p(x) + _q(x) for x in [-2, 0, 1, 3]), "The sum of two polynomials, as a function, is the sum of their values"
          assert repr(_s) == "Poly([1, 5, 2])", "repr should give the form Poly([1, 5, 2])"
        wrong:
          - "class Poly:\n    def __init__(self, coefficients):\n        self.coefficients = list(coefficients)\n\n    def __repr__(self):\n        return f\"Poly({self.coefficients})\"\n\n    def __call__(self, x):\n        return sum(c * x ** k for k, c in enumerate(self.coefficients))\n\n    def __add__(self, other):\n        return Poly([a + b for a, b in zip(self.coefficients, other.coefficients)])\n"
          - "class Poly:\n    def __init__(self, coefficients):\n        self.coefficients = list(coefficients)\n\n    def __repr__(self):\n        return f\"Poly({self.coefficients})\"\n\n    def __call__(self, x):\n        return sum(c * x ** (k + 1) for k, c in enumerate(self.coefficients))\n\n    def __add__(self, other):\n        size = max(len(self.coefficients), len(other.coefficients))\n        mine = self.coefficients + [0] * (size - len(self.coefficients))\n        theirs = other.coefficients + [0] * (size - len(other.coefficients))\n        return Poly([a + b for a, b in zip(mine, theirs)])\n"
          - "class Poly:\n    def __init__(self, coefficients):\n        self.coefficients = list(coefficients)\n\n    def __repr__(self):\n        return f\"Poly({self.coefficients})\"\n\n    def __call__(self, x):\n        return sum(c * x ** k for k, c in enumerate(self.coefficients))\n\n    def __add__(self, other):\n        return Poly(self.coefficients + other.coefficients)\n"
        explanation: |
          `__call__` is the sigma notation $\sum_k c_k x^k$ typed out, with `enumerate` supplying each power alongside its coefficient. `__add__` has one trap, and it is the one from the first lesson of this cluster: `zip` stops at the shorter list, so adding $5x$ to $1 + 2x^2$ by a bare `zip` would silently lose the $2x^2$. Padding the shorter list with zeros first puts that right. Building new lists with `+` leaves the originals untouched. The object is a function you can call and also a value you can add, and the last test states the link between the two: $(p + q)(x) = p(x) + q(x)$.
