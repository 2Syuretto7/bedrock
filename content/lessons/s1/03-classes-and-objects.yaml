    - question:
        id: write-vector2
        type: code
        mode: write
        system: s2
        prompt: |
          Write the class `Vector` for an arrow in the plane with components `x` and `y`.

          - `Vector(x, y)` stores the two components.
          - `v.plus(w)` returns a **new** vector whose components are the sums of the matching components. Neither `v` nor `w` may be changed.
          - `v.scaled(k)` returns a new vector with both components multiplied by the number `k`.
          - `v.same_as(w)` returns `True` when the two vectors have equal components.
        starter: |
          class Vector:
              def __init__(self, x, y):
                  self.x = x
                  self.y = y

              # Add the three methods here.

          v = Vector(1, 2).plus(Vector(3, 4)).scaled(2)
          print(v.x, v.y)
        solution: |
          class Vector:
              def __init__(self, x, y):
                  self.x = x
                  self.y = y

              def plus(self, other):
                  return Vector(self.x + other.x, self.y + other.y)

              def scaled(self, k):
                  return Vector(self.x * k, self.y * k)

              def same_as(self, other):
                  return self.x == other.x and self.y == other.y

          v = Vector(1, 2).plus(Vector(3, 4)).scaled(2)
          print(v.x, v.y)
        tests: |
          _v = Vector(1, 2)
          _w = Vector(3, 4)
          _s = _v.plus(_w)
          assert isinstance(_s, Vector), "plus should return a Vector"
          assert (_s.x, _s.y) == (4, 6), "(1, 2) plus (3, 4) is (4, 6)"
          assert (_v.x, _v.y) == (1, 2) and (_w.x, _w.y) == (3, 4), "plus must not change either of the two vectors"
          assert _s is not _v and _s is not _w, "plus should return a new object"
          _t = _v.scaled(3)
          assert isinstance(_t, Vector) and (_t.x, _t.y) == (3, 6), "(1, 2) scaled by 3 is (3, 6)"
          assert (_v.x, _v.y) == (1, 2), "scaled must not change the vector"
          assert _v.same_as(Vector(1, 2)) is True, "Two vectors with equal components are the same"
          assert _v.same_as(Vector(1, 3)) is False, "A different y means a different vector"
          assert _v.same_as(Vector(0, 2)) is False, "A different x means a different vector"
          assert output.strip() == "8 12", "(1, 2) plus (3, 4), scaled by 2, is (8, 12)"
        wrong:
          - "class Vector:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def plus(self, other):\n        self.x += other.x\n        self.y += other.y\n        return self\n\n    def scaled(self, k):\n        self.x *= k\n        self.y *= k\n        return self\n\n    def same_as(self, other):\n        return self.x == other.x and self.y == other.y\n\nv = Vector(1, 2).plus(Vector(3, 4)).scaled(2)\nprint(v.x, v.y)\n"
          - "class Vector:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def plus(self, other):\n        return Vector(self.x + other.x, self.y + other.y)\n\n    def scaled(self, k):\n        return Vector(self.x * k, self.y * k)\n\n    def same_as(self, other):\n        return self is other\n\nv = Vector(1, 2).plus(Vector(3, 4)).scaled(2)\nprint(v.x, v.y)\n"
          - "class Vector:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def plus(self, other):\n        return Vector(self.x + other.x, self.y + other.y)\n\n    def scaled(self, k):\n        return Vector(self.x * k, self.y)\n\n    def same_as(self, other):\n        return self.x == other.x or self.y == other.y\n\nv = Vector(1, 2).plus(Vector(3, 4)).scaled(2)\nprint(v.x, v.y)\n"
        explanation: |
          Each method that produces a vector calls the class to make a new one, and leaves `self` alone. That is how numbers behave: `3 + 4` gives a new number and does not change 3. Because each method returns a vector, the calls can be chained, as in the last lines of the program. But look at how those lines read. `v.plus(w).scaled(2)` is a clumsy way to write what mathematics writes as $2(v + w)$, and `v.same_as(w)` is a clumsy `v == w`. The next lesson removes the clumsiness.
  connections:
    - text: |
        The puzzle asked how to make a value that knows what can be done to it, and how a function behind the dot finds its object. A class is a new type. Calling it makes an instance and runs the constructor. A method is an ordinary function stored in the class, and `obj.f(a)` is the call `C.f(obj, a)`, with the object passed as `self`. An attribute is looked for in the object, then in its class, then in the classes it inherits from. That single search rule explains methods, class attributes, shadowing and inheritance alike.

        You also saw why classes matter beyond tidiness. A class can make a promise about its data, an invariant, and keep it, because the data can change only through its methods.

        Two threads continue.

        The last exercise ended on an awkwardness. You built a `Vector`, but to add two of them you must write `v.plus(w)`, to compare them `v.same_as(w)`, and printing one shows something like `<Vector object at 0x7f...>`. The built-in types are not treated so. Numbers add with `+`, lists compare with `==` and report their length to `len`. It turns out that these privileges are open to your classes too. Each operator is a method call in disguise, with a special name, and a class that defines the method gets the operator. That is [[s1.special-methods]], next.

        The `Account` in this lesson guarded its invariant with an `assert` in the constructor and a returned `False` from `withdraw`. Both are crude. An assertion is a tool for finding your own mistakes, and a returned `False` is easily ignored by the caller, as one of the wrong answers showed. Python has a proper mechanism for a function to refuse, loudly, in a way the caller cannot overlook and can choose to handle. You will meet it in [[s1.exceptions]].
