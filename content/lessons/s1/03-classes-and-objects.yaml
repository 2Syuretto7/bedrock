  work:
    - question:
        id: write-meter
        type: code
        mode: write
        system: s2
        prompt: |
          Write the class `Meter` for a running average, with a little more care than the one in the lesson.

          - `Meter()` makes a meter that has seen nothing.
          - `m.add(value)` records one value.
          - `m.mean()` returns the mean of the values recorded so far, or `0.0` if there are none yet.
          - `m.reset()` forgets everything, so that the meter is as new.

          The meter must not keep a list of all the values. Two numbers are enough.
        starter: |
          class Meter:
              # Replace the next line with your own.
              pass

          loss = Meter()
          loss.add(4)
          loss.add(2)
          print(loss.mean())
        solution: |
          class Meter:
              def __init__(self):
                  self.total = 0
                  self.count = 0

              def add(self, value):
                  self.total += value
                  self.count += 1

              def mean(self):
                  if self.count == 0:
                      return 0.0
                  return self.total / self.count

              def reset(self):
                  self.total = 0
                  self.count = 0

          loss = Meter()
          loss.add(4)
          loss.add(2)
          print(loss.mean())
        tests: |
          assert "append" not in source and "[" not in source, "Do not keep a list of the values. A running total and a count are enough."
          _m = Meter()
          assert _m.mean() == 0, "A meter that has seen nothing should report 0.0"
          _m.add(4)
          assert _m.mean() == 4, "After one value the mean is that value"
          _m.add(2)
          assert _m.mean() == 3, "The mean of 4 and 2 is 3"
          _m.add(0)
          assert _m.mean() == 2, "The mean of 4, 2 and 0 is 2"
          _n = Meter()
          assert _n.mean() == 0, "A second meter must start empty, whatever the first has recorded"
          _n.add(10)
          assert _m.mean() == 2, "Adding to one meter must not change another"
          _m.reset()
          assert _m.mean() == 0, "After reset the meter should report 0.0"
          _m.add(5)
          assert _m.mean() == 5, "After reset the meter should work as new"
          assert _n.mean() == 10, "Resetting one meter must not reset another"
        wrong:
          - "class Meter:\n    total = 0\n    count = 0\n\n    def add(self, value):\n        Meter.total += value\n        Meter.count += 1\n\n    def mean(self):\n        if Meter.count == 0:\n            return 0.0\n        return Meter.total / Meter.count\n\n    def reset(self):\n        Meter.total = 0\n        Meter.count = 0\n"
          - "class Meter:\n    def __init__(self):\n        self.total = 0\n        self.count = 0\n\n    def add(self, value):\n        self.total += value\n        self.count += 1\n\n    def mean(self):\n        if self.count == 0:\n            return 0.0\n        return self.total / self.count\n\n    def reset(self):\n        self.total = 0\n"
          - "class Meter:\n    def __init__(self):\n        self.total = 0\n        self.count = 0\n\n    def add(self, value):\n        self.total = value\n        self.count += 1\n\n    def mean(self):\n        if self.count == 0:\n            return 0.0\n        return self.total / self.count\n\n    def reset(self):\n        self.total = 0\n        self.count = 0\n"
        explanation: |
          The meter's state is two numbers, a total and a count, both created in the constructor so that every meter has its own. The invariant is that `total` is the sum of exactly `count` values. `add` keeps it by changing both together, and `reset` restores the starting state by setting both. The empty case needs its own line in `mean`, since there is no mean of nothing and the division would fail. Keeping the data on the class instead of on `self`, as the first wrong answer in the tests does, makes every meter in the program share one total.
    - question:
        id: fix-shared-history
        type: code
        mode: find-bug
        system: s2
        prompt: |
          A `Player` records the scores of its own games. The program makes two players, and Asha plays twice and Ravi once. It should print `2 1`, the number of games each has played. It prints `3 3`. Fix the class.
        starter: |
          class Player:
              scores = []

              def __init__(self, name):
                  self.name = name

              def record(self, score):
                  self.scores.append(score)

              def games(self):
                  return len(self.scores)

          asha = Player("Asha")
          ravi = Player("Ravi")
          asha.record(12)
          asha.record(30)
          ravi.record(7)
          print(asha.games(), ravi.games())
        solution: |
          class Player:
              def __init__(self, name):
                  self.name = name
                  self.scores = []

              def record(self, score):
                  self.scores.append(score)

              def games(self):
                  return len(self.scores)

          asha = Player("Asha")
          ravi = Player("Ravi")
          asha.record(12)
          asha.record(30)
          ravi.record(7)
          print(asha.games(), ravi.games())
        tests: |
          assert output.strip() == "2 1", "Asha has played 2 games and Ravi 1"
          _a = Player("A")
          _b = Player("B")
          assert _a.games() == 0, "A new player has played no games"
          _a.record(5)
          assert _a.games() == 1 and _b.games() == 0, "Recording a score for one player must not change another"
          _a.record(9)
          assert _a.scores == [5, 9], "The player's own scores should all be kept, in order"
          assert _a.scores is not _b.scores, "Each player needs a list of their own"
        wrong:
          - "class Player:\n    scores = []\n\n    def __init__(self, name):\n        self.name = name\n        self.scores.clear()\n\n    def record(self, score):\n        self.scores.append(score)\n\n    def games(self):\n        return len(self.scores)\n\nasha = Player(\"Asha\")\nravi = Player(\"Ravi\")\nasha.record(12)\nasha.record(30)\nravi.record(7)\nprint(\"2 1\")\n"
          - "class Player:\n    def __init__(self, name):\n        self.name = name\n        self.scores = []\n\n    def record(self, score):\n        self.scores = [score]\n\n    def games(self):\n        return len(self.scores)\n\nasha = Player(\"Asha\")\nravi = Player(\"Ravi\")\nasha.record(12)\nasha.record(30)\nravi.record(7)\nprint(\"2 1\")\n"
        explanation: |
          `scores = []` in the class body ran once and made one list, stored in the class. `self.scores.append(...)` reads `scores`, fails to find it in the player, finds the shared list in the class, and changes that list in place. No player ever had a list of their own. Moving the line into the constructor, as `self.scores = []`, runs it once for each player and stores each new list in that player's own table.
    - question:
        id: write-account
        type: code
        mode: write
        system: s2
        prompt: |
          Write the class `Account` with the invariant that the balance is never negative.

          - `Account(opening)` opens an account with the given balance.
          - `a.deposit(amount)` adds to the balance.
          - `a.withdraw(amount)` takes the amount out and returns `True` if there is enough money. If there is not, it changes nothing and returns `False`.
          - `a.transfer(other, amount)` moves the amount from this account to the account `other`, if there is enough, and returns `True` or `False` in the same way. Money must never be created or lost.
          - The balance is read as the attribute `a.balance`.
        starter: |
          class Account:
              def __init__(self, opening):
                  self.balance = opening

              # Add the three methods here.

          a = Account(100)
          b = Account(20)
          print(a.transfer(b, 70), a.balance, b.balance)
          print(a.transfer(b, 70), a.balance, b.balance)
        solution: |
          class Account:
              def __init__(self, opening):
                  self.balance = opening

              def deposit(self, amount):
                  self.balance += amount

              def withdraw(self, amount):
                  if amount > self.balance:
                      return False
                  self.balance -= amount
                  return True

              def transfer(self, other, amount):
                  if not self.withdraw(amount):
                      return False
                  other.deposit(amount)
                  return True

          a = Account(100)
          b = Account(20)
          print(a.transfer(b, 70), a.balance, b.balance)
          print(a.transfer(b, 70), a.balance, b.balance)
        tests: |
          _a = Account(100)
          _a.deposit(50)
          assert _a.balance == 150, "A deposit of 50 into 100 should leave 150"
          assert _a.withdraw(30) is True and _a.balance == 120, "A withdrawal that can be afforded returns True and reduces the balance"
          assert _a.withdraw(500) is False, "A withdrawal that cannot be afforded returns False"
          assert _a.balance == 120, "A refused withdrawal must change nothing"
          assert _a.withdraw(120) is True and _a.balance == 0, "The whole balance may be withdrawn"
          _x = Account(100)
          _y = Account(20)
          assert _x.transfer(_y, 70) is True, "A transfer that can be afforded returns True"
          assert (_x.balance, _y.balance) == (30, 90), "70 should have moved from one account to the other"
          assert _x.transfer(_y, 70) is False, "A transfer that cannot be afforded returns False"
          assert (_x.balance, _y.balance) == (30, 90), "A refused transfer must change neither account"
          assert _x.balance + _y.balance == 120, "Money must not be created or lost"
        wrong:
          - "class Account:\n    def __init__(self, opening):\n        self.balance = opening\n\n    def deposit(self, amount):\n        self.balance += amount\n\n    def withdraw(self, amount):\n        self.balance -= amount\n        return True\n\n    def transfer(self, other, amount):\n        self.withdraw(amount)\n        other.deposit(amount)\n        return True\n"
          - "class Account:\n    def __init__(self, opening):\n        self.balance = opening\n\n    def deposit(self, amount):\n        self.balance += amount\n\n    def withdraw(self, amount):\n        if amount > self.balance:\n            return False\n        self.balance -= amount\n        return True\n\n    def transfer(self, other, amount):\n        self.withdraw(amount)\n        other.deposit(amount)\n        return True\n"
          - "class Account:\n    def __init__(self, opening):\n        self.balance = opening\n\n    def deposit(self, amount):\n        self.balance += amount\n\n    def withdraw(self, amount):\n        if amount >= self.balance:\n            return False\n        self.balance -= amount\n        return True\n\n    def transfer(self, other, amount):\n        if not self.withdraw(amount):\n            return False\n        other.deposit(amount)\n        return True\n"
        explanation: |
          `withdraw` is the one place where the balance can fall, so it is the one place that must check. `transfer` is then built from the two methods that already exist, and it inherits their guarantee: it deposits only if the withdrawal succeeded. The second wrong answer in the tests ignores the result of `withdraw` and deposits regardless, which creates money out of nothing whenever the withdrawal is refused. Notice that `other` is just another account, and `other.deposit(amount)` is an ordinary method call on it. A method may call methods on any object it is given.
    - question:
        id: write-linear
        type: code
        mode: write
        system: s2
        concepts: [f1.functions-as-machines]
        prompt: |
          The base class `Layer` is given. It stands for a function from numbers to numbers, and `apply_all` applies that function to every number of a list.

          Write a subclass `Linear` for the function $x \mapsto wx + b$. Its constructor takes `w` and `b`, lets the parent constructor run first with the name `"linear"`, and stores the two numbers. It overrides `forward`. Do not write `apply_all` again. It must be inherited.
        starter: |
          class Layer:
              def __init__(self, name):
                  self.name = name

              def forward(self, x):
                  return x

              def apply_all(self, xs):
                  return [self.forward(x) for x in xs]

          # Write the class Linear here.

          double_plus_one = Linear(2, 1)
          print(double_plus_one.name, double_plus_one.apply_all([0, 1, 2]))
        solution: |
          class Layer:
              def __init__(self, name):
                  self.name = name

              def forward(self, x):
                  return x

              def apply_all(self, xs):
                  return [self.forward(x) for x in xs]

          class Linear(Layer):
              def __init__(self, w, b):
                  super().__init__("linear")
                  self.w = w
                  self.b = b

              def forward(self, x):
                  return self.w * x + self.b

          double_plus_one = Linear(2, 1)
          print(double_plus_one.name, double_plus_one.apply_all([0, 1, 2]))
        tests: |
          assert source.count("def apply_all") == 1, "Do not write apply_all again. Linear should inherit it from Layer."
          _f = Linear(2, 1)
          assert isinstance(_f, Layer), "Linear should be a subclass of Layer"
          assert _f.name == "linear", "The parent constructor should have set the name to linear"
          assert _f.forward(3) == 7, "2 times 3 plus 1 is 7"
          assert _f.apply_all([0, 1, 2]) == [1, 3, 5], "apply_all should use the forward of Linear"
          _g = Linear(-1, 0.5)
          assert _g.forward(2) == -1.5, "It should work for any w and b"
          assert _f.forward(3) == 7, "Two layers must keep their own w and b"
          assert Layer("plain").apply_all([4, 5]) == [4, 5], "The base class must be left unchanged"
        wrong:
          - "class Layer:\n    def __init__(self, name):\n        self.name = name\n\n    def forward(self, x):\n        return x\n\n    def apply_all(self, xs):\n        return [self.forward(x) for x in xs]\n\nclass Linear(Layer):\n    def __init__(self, w, b):\n        self.w = w\n        self.b = b\n\n    def forward(self, x):\n        return self.w * x + self.b\n"
          - "class Layer:\n    def __init__(self, name):\n        self.name = name\n\n    def forward(self, x):\n        return x\n\n    def apply_all(self, xs):\n        return [self.forward(x) for x in xs]\n\nclass Linear:\n    def __init__(self, w, b):\n        self.name = \"linear\"\n        self.w = w\n        self.b = b\n\n    def forward(self, x):\n        return self.w * x + self.b\n\n    def apply_all2(self, xs):\n        return [self.forward(x) for x in xs]\n"
          - "class Layer:\n    def __init__(self, name):\n        self.name = name\n\n    def forward(self, x):\n        return x\n\n    def apply_all(self, xs):\n        return [self.forward(x) for x in xs]\n\nclass Linear(Layer):\n    def __init__(self, w, b):\n        super().__init__(\"linear\")\n        self.w = w\n        self.b = b\n\n    def forward(self, x):\n        return self.w * (x + self.b)\n"
        explanation: |
          `Linear(Layer)` inherits everything, then changes two things. Its constructor calls `super().__init__("linear")` so that the parent can set up its own part, the name, before the subclass stores `w` and `b`. Leave that call out and the object has no `name` at all. Its `forward` overrides the parent's. `apply_all` is found in `Layer`, but inside it `self` is the `Linear` object, so `self.forward` finds the new version. This is the shape of every layer in a deep-learning library: a base class provides the machinery, and each subclass supplies only its own `forward`.
    - question:
        id: numeric-objects
        type: numeric
        system: s2
        prompt: |
          How many separate `Point` objects exist after these lines have run?

          ```python
          a = Point(0, 0)
