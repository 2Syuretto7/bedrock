concept: s1.classes-and-objects
minutes: 105
claim: You can define a class with a constructor, attributes and methods, explain exactly what self is and how a method call finds its function, tell an attribute of one object from an attribute of the whole class, tell two equal objects from one object with two names, and extend a class by inheritance.
recalls: [s1.modules-and-imports]
uses: [s1.comprehensions-and-iterators, s0.values-types-and-variables, s0.functions, s0.lists-and-tuples, s0.dictionaries-and-sets, s0.reading-errors-and-debugging, f1.functions-as-machines]
leads: [s1.special-methods, s1.exceptions]
starter: |
  # Scratch space. A new type of value: a meter that keeps a running average.
  class Meter:
      def __init__(self):
          self.total = 0
          self.count = 0

      def add(self, value):
          self.total += value
          self.count += 1

      def mean(self):
          return self.total / self.count

  loss = Meter()
  loss.add(4)
  loss.add(2)
  print(loss.mean())
parts:
  recall:
    - text: |
        [[s1.modules-and-imports]] gave the dot a meaning: `a.b` looks inside `a` for the name `b`. It also showed that a bare name is searched for in a fixed order of tables, the nearer hiding the farther. Both ideas are about to be used again, on a smaller scale. Three quick pulls first.
  puzzle:
    - text: |
        While a model trains, its error is measured thousands of times, and what you want to watch is the average so far. So you need a thing that can be told a number, again and again, and asked at any moment for the mean. Call it a meter. With the Python you have, you might build it from a dictionary and two functions:

        ```python
        def new_meter():
            return {"total": 0, "count": 0}

        def meter_add(meter, value):
            meter["total"] += value
            meter["count"] += 1

        def meter_mean(meter):
            return meter["total"] / meter["count"]

        loss = new_meter()
        meter_add(loss, 4)
        meter_add(loss, 2)
        print(meter_mean(loss))       # 3.0
        ```

        It works. Now look at what is wrong with it.

        The data and the functions belong together, yet nothing in the code says so. `meter_add` will accept any dictionary at all and fail somewhere inside. Anyone can build a broken meter by hand, with a misspelt key or no count. And every function needs a clumsy prefix, `meter_`, because plain `add` and `mean` would collide with the same words used for other things. That is the naming problem of the last lesson, come back.

        Compare a list. You write `scores.append(3)`. The function sits behind the dot of the value itself. There is no `list_append(scores, 3)`, and no way to call `append` on something that is not a list. A list knows what can be done to it.

        Somebody made lists work that way. Can you make a meter work that way, so that `loss.add(4)` and `loss.mean()` are all anyone needs to know? And when you write `loss.add(4)`, how does the function behind the dot find out *which* meter it is supposed to change?
  intuition:
    - text: |
        Think about a rubber stamp and the marks it makes. The stamp is made once. Each press leaves a separate mark on the page, and all the marks have the same shape, because they came from the same stamp. But each mark is its own ink in its own place. You can write a different date inside each one.

        A **class** is the stamp. An **object** is a mark. The class fixes the shape: which pieces of data every such object carries, and which functions can act on them. Each object made from the class then has its own values for those pieces of data.

        You have used classes since your first program. In [[s0.values-types-and-variables]] the line `print(type(3))` showed `<class 'int'>`. The word was there all along. `int`, `str`, `list` and `dict` are classes, and `3`, `"abc"` and `[1, 2]` are objects made from them. **A class is a type, and to write a class is to add a new type of value to the language.**

        The other half of the picture comes from the last lesson. A module was a table of names, reached with a dot. An object is also a table of names, reached with a dot. The difference is that a module is made once, by running a file, while objects are stamped out as often as you like, each with a table of its own. And where does an object keep its functions? It does not. They are kept once, in the class, and every object made from the class is allowed to look there. When a name is not in the object's own table, the dot looks in the class next. It is the same rule as before: search the nearer table, then the farther.
  derivation:
    - text: |
        **The smallest class.** Begin with a class that fixes nothing at all:

        ```python
        class Meter:
            pass

        loss = Meter()
        loss.total = 6
        loss.count = 2
        print(loss.total / loss.count)      # 3.0
        ```

        The `class` statement creates the stamp and gives it a name. By firm convention a class name starts with a capital letter, which is how you tell `Meter`, a class, from `meter`, a variable. The word `pass` is a statement that does nothing. It fills a body that has to exist but has nothing to say.

        **Calling the class**, `Meter()`, presses the stamp. It makes a new, empty object and returns it. An object made from a class is called an **instance** of the class. The next two lines put names in the object's table with an assignment through the dot, and the last line reads them back. A name stored in an object is called an **attribute**.

        So an object really is a table of names that you can fill as you please. But filling it by hand is the weakness of the dictionary all over again. Forget one line and the meter is broken.
    - text: |
        **Setting an object up: the constructor.** A class may define a function with the special name `__init__`, with two underscores on each side. Python calls it automatically, on every new object, at the moment the object is made.

        ```python
        class Meter:
            def __init__(self):
                self.total = 0
                self.count = 0

        loss = Meter()
        print(loss.total, loss.count)       # 0 0
        ```

        When `Meter()` is called, Python makes the empty object and then at once calls `__init__` with that new object as the argument. Inside the function the object goes by the name `self`. So `self.total = 0` means: in the table of the object now being made, set `total` to 0. When `__init__` finishes, the object is handed back to whoever called `Meter()`.

        It is now impossible to make a meter with no total. Every instance leaves the stamp complete. That function is called the **constructor**, and its job is to put a new object into a valid starting state.

        A constructor may take more parameters. They are given in the brackets when the class is called:

        ```python
        class Point:
            def __init__(self, x, y):
                self.x = x
                self.y = y

        p = Point(3, 4)
        print(p.x, p.y)                     # 3 4
        ```

        Count the arguments. `__init__` has three parameters, and the call `Point(3, 4)` supplies two. The first, `self`, is supplied by Python. Note also that `self.x = x` is not a line that does nothing. On the right is the parameter `x`, a local name that will vanish when the function returns. On the left is an attribute, stored in the object, which will last as long as the object does.
    - question:
        id: predict-init
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          class Rectangle:
              def __init__(self, width, height):
                  self.width = width
                  self.height = height
                  self.area = width * height

          r = Rectangle(3, 5)
          print(r.width, r.area)
        output: "3 15"
        explanation: Calling the class runs the constructor with self as the new object, width as 3 and height as 5. It stores three attributes, the third worked out from the other two.
    - text: |
        **Functions that live in the class: methods.** Now put the two functions of the puzzle inside the class.

        ```python
        class Meter:
            def __init__(self):
                self.total = 0
                self.count = 0

            def add(self, value):
                self.total += value
                self.count += 1

            def mean(self):
                return self.total / self.count

        loss = Meter()
        loss.add(4)
        loss.add(2)
        print(loss.mean())                  # 3.0
        ```

        A function defined inside a class is called a **method**. And here is the answer to the puzzle's last question. How does `add` know which meter to change? Follow the line `loss.add(4)` exactly as Python does.

        1. The dot looks for the name `add` in the table of the object `loss`. That table holds only `total` and `count`. It is not there.
        2. So the dot looks in the table of the object's class, `Meter`. There it finds the function `add`.
        3. Because the function was found in the class by way of an object, Python calls it with **that object placed in front of the other arguments**.

        In other words, these two lines do exactly the same thing:

        ```python
        loss.add(4)
        Meter.add(loss, 4)
        ```

        The second line is the old `meter_add(loss, 4)` of the puzzle, with the prefix turned into a class name. The first is merely a nicer way of writing it. **`self` is not magic. It is an ordinary first parameter, and the object before the dot is passed to it.** The name `self` is not even a keyword of the language, only a convention, though one that nobody breaks.

        This also explains the most common error message in all of class-writing. Leave `self` out of a method's parameters, as in `def mean():`, and the call `loss.mean()` fails with *mean() takes 0 positional arguments but 1 was given*. You gave none. Python gave one, the object, and the function had nowhere to put it.
    - question:
        id: choice-self
        type: choice
        system: s1
        prompt: |
          A class `Meter` has the method `def add(self, value):`. For a meter called `loss`, the call `loss.add(7)` is run. What are `self` and `value` inside the method?
        options:
          - "`self` is the class `Meter`, and `value` is 7."
          - "`self` is the object `loss`, and `value` is 7."
          - "`self` is 7, and `value` is missing, which is an error."
          - "`self` is a fresh empty object, and `value` is 7."
        answer: 1
        explanation: The call loss.add(7) is carried out as Meter.add(loss, 7). The object before the dot becomes the first argument, and the 7 becomes the second.
    - question:
        id: order-method-call
        type: order
        system: s2
        prompt: |
          `p` is an instance of a class `Point` that defines a method `norm`. Put in order what happens when Python runs `p.norm()`.
        steps:
          - Look for the name norm in the object's own table of attributes.
          - Not finding it there, look for norm in the table of the class Point.
          - Find the function norm in the class.
          - Call that function with the object p as its first argument, named self.
          - Run the body, in which self.x reads the attribute x of p.
          - Hand the returned value back to the place of the call.
        explanation: The object's own table is searched before the class, the nearer before the farther. The function has to be found before it is called, and the object is inserted as the first argument at the moment of the call.
    - question:
        id: fix-missing-self
        type: code
        mode: find-bug
        system: s2
        prompt: |
          This class should count how many times `press` is called and report the number with `reading`. It stops with two different errors, one after the other, once the first is fixed. Fix the class so that the program prints 2.
        starter: |
          class Counter:
              def __init__(self):
                  count = 0

              def press(self):
                  self.count += 1

              def reading():
                  return self.count

          c = Counter()
          c.press()
          c.press()
          print(c.reading())
        solution: |
          class Counter:
              def __init__(self):
                  self.count = 0

              def press(self):
                  self.count += 1

              def reading(self):
                  return self.count

          c = Counter()
          c.press()
          c.press()
          print(c.reading())
        tests: |
          assert output.strip() == "2", "The program should print 2"
          _c = Counter()
          assert _c.reading() == 0, "A new counter should read 0"
          _c.press()
          assert _c.reading() == 1, "After one press the counter should read 1"
          _d = Counter()
          assert _d.reading() == 0, "A second counter starts from 0, whatever the first one has done"
        wrong:
          - "class Counter:\n    count = 0\n\n    def __init__(self):\n        count = 0\n\n    def press(self):\n        Counter.count += 1\n\n    def reading(self):\n        return Counter.count\n\nc = Counter()\nc.press()\nc.press()\nprint(c.reading())\n"
          - "class Counter:\n    def __init__(self):\n        self.count = 1\n\n    def press(self):\n        self.count += 1\n\n    def reading(self):\n        return self.count - 1 if self.count > 1 else self.count\n\nc = Counter()\nc.press()\nc.press()\nprint(c.reading())\n"
        explanation: |
          In the constructor, `count = 0` made a local variable, which vanished when the constructor returned. Nothing was stored in the object, so `self.count += 1` found no attribute to add to. Data that should last must be stored through `self`. Then `reading` had no `self` parameter, so when Python passed the object to it there was nowhere for the object to go. Every method needs `self` as its first parameter, and every attribute is reached through it.
    - text: |
        **Each object has its own data.** Two instances of one class share their methods and nothing else.

        ```python
        train = Meter()
        test = Meter()
        train.add(10)
        print(train.count, test.count)      # 1 0
        ```

        `train.add(10)` ran `Meter.add` with `self` as `train`, so only the table of `train` changed.

        **Data that belongs to the class.** A name assigned directly in the body of the class, outside every method, is stored in the class's table. There is one copy, and every instance can see it, by the same rule that lets them see the methods.

        ```python
        class Circle:
            pi = 3.14159

            def __init__(self, radius):
                self.radius = radius

            def area(self):
                return self.pi * self.radius ** 2

        a = Circle(1)
        b = Circle(2)
        print(a.pi, b.pi, Circle.pi)        # 3.14159 three times
        ```

        `a.pi` is not found in the table of `a`, so the class is searched, and there it is. This is a **class attribute**. Those stored through `self` are **instance attributes**.

        Reading falls through to the class. Assigning does not. `a.pi = 3` creates a new instance attribute in the table of `a`, which from then on hides the class attribute for `a` alone. That is shadowing again, and `b.pi` is unaffected.

        There is one trap here that is worth meeting on purpose. Suppose a class attribute is a list:

        ```python
        class Basket:
            items = []

            def put(self, thing):
                self.items.append(thing)

        mine = Basket()
        yours = Basket()
        mine.put("apple")
        print(yours.items)                  # ['apple']
        ```

        Your basket has my apple in it. `self.items` reads the name `items`, does not find it in `mine`, and finds the single list that belongs to the class. `append` then changes that one list. No assignment through `self` ever happened, so no basket ever got a list of its own. The cure is to create the list in the constructor, `self.items = []`, which runs once for each basket. **Whatever each object should have for itself must be made in `__init__`.**
    - question:
        id: predict-class-attr
        type: predict
        system: s2
        prompt: What does this print?
        code: |
          class Dog:
              legs = 4

              def __init__(self, name):
                  self.name = name

          a = Dog("Moti")
          b = Dog("Sheru")
          a.legs = 3
          Dog.legs = 5
          print(a.legs, b.legs)
        output: "3 5"
        explanation: Assigning a.legs created an instance attribute on a alone, which hides the class attribute for that one dog. The other dog has no legs attribute of its own, so the look-up falls through to the class, where the value has since been changed.
    - text: |
        **One object, two names.** An object is a thing in the computer's memory, and a variable is a name that refers to it. Assignment never copies an object. It only makes a name refer to one.

        ```python
        a = Point(1, 2)
        b = a
        b.x = 99
        print(a.x)                          # 99
        ```

        There is one point here, with two names. Changing it through one name is seen through the other. This is called **aliasing**, and it is the same thing that happens when two names refer to one list. It also happens whenever an object is passed to a function: the parameter becomes another name for the same object, which is how a method is able to change the object it is called on.

        So there are two different questions you can ask about two names. Are they the **same object**? That is `a is b`. Do they refer to objects with **equal contents**? That is `a == b`.

        ```python
        p = Point(1, 2)
        q = Point(1, 2)
        r = p
        print(p is r, p is q, p == q)       # True False False
        ```

        The last answer is a surprise. `p` and `q` plainly hold the same coordinates. But Python has not been told what it means for two points to be equal, and it will not guess. Lacking any instruction, `==` on your own objects falls back to asking whether they are the same object. Teaching your class what equality means, and what `+` means, and how it should look when printed, is the whole subject of the next lesson.
    - question:
        id: predict-alias
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          class Box:
              def __init__(self, value):
                  self.value = value

          a = Box(1)
          b = a
          c = Box(1)
          b.value = 7
          print(a.value, c.value, a is b, a is c)
        output: "7 1 True False"
        explanation: a and b are two names for one box, so a change made through b is seen through a. c is a separate box that happened to start with the same value, and it is unaffected.
    - text: |
        **A class as a promise.** The deepest reason for classes is not tidiness. It is that a class can guarantee something about its data. A statement that is true of an object at every moment it can be observed is called an **invariant**.

        Take a bank account whose balance must never be negative. If the balance were a bare number in a dictionary, any line of the program could set it to anything. As a class, the rule can be enforced in the only places where the balance changes:

        ```python
        class Account:
            def __init__(self, opening):
                assert opening >= 0, "an account cannot open in debt"
                self.balance = opening

            def deposit(self, amount):
                assert amount > 0, "a deposit must be positive"
                self.balance += amount

            def withdraw(self, amount):
                if amount > self.balance:
                    return False
                self.balance -= amount
                return True
        ```

        The constructor establishes the invariant. Every method assumes it on entry and preserves it on exit. If code outside the class only ever calls the methods, the balance can never go below zero, and you can be sure of that by reading twenty lines instead of the whole program. The methods are the **interface**: the small set of things that may be done. How the data are stored behind them is the class's own business, and can be changed later without breaking any code that uses it.

        Objects may also hold other objects. A `Line` can have two attributes that are each a `Point`. A neural network is an object that holds layers, each an object that holds its own numbers. Large programs are built in this way, objects inside objects, each keeping its own promise.
    - text: |
        **Building on a class: inheritance.** Sometimes you want a new class that is an existing one with something added or changed. Writing the name of the existing class in brackets makes the new one **inherit** from it:

        ```python
        class Animal:
            def __init__(self, name):
                self.name = name

            def speak(self):
                return "..."

            def introduce(self):
                return self.name + " says " + self.speak()

        class Dog(Animal):
            def speak(self):
                return "woof"

        d = Dog("Moti")
        print(d.introduce())                # Moti says woof
        ```

        `Dog` is called a **subclass** of `Animal`. The rule is the search rule once more, with one more table added to the end of the chain: the object, then its class, then the class it inherits from. `Dog` has no `__init__` and no `introduce`, so those are found in `Animal`. It does have its own `speak`, which is found first and hides the one in `Animal`. Follow the call. `introduce` is found in `Animal`, but `self` is still the dog, so when its body asks for `self.speak()` the search begins again from the dog and finds the `woof`.

        When a subclass needs a constructor of its own, it should first let the parent class do its part. `super()` means "search from the parent class onwards":

        ```python
        class Puppy(Dog):
            def __init__(self, name, weeks):
                super().__init__(name)
                self.weeks = weeks
        ```

        You will type that pattern in every neural network you write. A network is defined as a subclass of a class that the library provides, its constructor begins with `super().__init__()`, and nearly everything it can do is inherited.

        The function `isinstance(obj, cls)` asks whether an object was made from a class or from any subclass of it. `isinstance(d, Animal)` is `True`, since every dog is an animal.
    - question:
        id: predict-inherit
        type: predict
        system: s2
        prompt: What does this print?
        code: |
          class Shape:
              def __init__(self, name):
                  self.name = name

              def area(self):
                  return 0

              def describe(self):
                  return self.name + " " + str(self.area())

          class Square(Shape):
              def __init__(self, side):
                  super().__init__("square")
                  self.side = side

              def area(self):
                  return self.side ** 2

          print(Square(3).describe(), isinstance(Square(3), Shape))
        output: "square 9 True"
        explanation: The constructor of Square passes the name up to the constructor of Shape and then stores the side. describe is found in Shape, but self is the square, so self.area() finds the version in Square first. A square is an instance of Shape because Square inherits from it.
  formal:
    - text: |
        **Definitions.** A **class** is an object that serves as a type. Calling a class creates a new **instance** of it, calls the class's `__init__` method with the new instance as first argument followed by the arguments of the call, and returns the instance. A name stored in an object is an **attribute**. A function stored in a class is a **method**.

        **Attribute look-up.** Reading `obj.name` searches, in order: the instance's own attributes; its class; the classes that class inherits from, nearest first. The first match is used, and if there is none an `AttributeError` is raised. Assigning `obj.name = value` always stores the name in the instance itself.

        **Method calls.** If `obj` is an instance of the class `C` and `C` defines the function `f`, then

        $$\texttt{obj.f(a, b)} \quad\text{is the call}\quad \texttt{C.f(obj, a, b)}.$$

        | | Where it is stored | How many copies | Created by |
        | --- | --- | --- | --- |
        | Instance attribute | in the instance | one for each instance | `self.name = value`, usually in `__init__` |
        | Class attribute | in the class | one, seen by every instance | `name = value` in the class body |
        | Method | in the class | one, seen by every instance | `def name(self, ...)` in the class body |

        **Identity and equality.** `a is b` is true when the two names refer to the same object. Assignment and argument passing never copy an object; they give it another name. For instances of a class that does not say otherwise, `a == b` means `a is b`.

        **Inheritance.** `class D(B):` makes `D` a subclass of `B`. Attributes not found in `D` are searched for in `B`. A method defined in `D` with the same name as one in `B` **overrides** it. Inside a method of `D`, `super().f(...)` calls the version of `f` found by searching from `B` onwards. `isinstance(obj, B)` is true for instances of `B` and of every subclass of `B`.

        **Invariant.** A property of an object's attributes that holds after the constructor returns and is preserved by every method.
