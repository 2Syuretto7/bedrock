    - question:
        id: drill-is-eq
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          class Token:
              def __init__(self, text):
                  self.text = text

          a = Token("the")
          b = Token("the")
          c = a
          print(a == b, a == c, a.text == b.text)
        output: "False True True"
        explanation: The class does not say what equality of tokens means, so == asks whether the two are the same object. a and b are separate objects. a and c are one object. The two strings inside are equal, because strings do know how to compare themselves.
    - question:
        id: drill-shared-list
        type: choice
        system: s1
        prompt: |
          A class body contains `history = []` at the top, outside every method, and a method that runs `self.history.append(x)`. Three instances are made and each appends one item. How many lists exist, and how long is each?
        options:
          - Three lists, each of length 1.
          - One list of length 3, shared by all three instances.
          - Three lists, each of length 3.
          - One list of length 1, because each append replaces the last.
        answer: 1
        explanation: The list was created once, when the class body ran, and it belongs to the class. Every instance reads the same one, and append changes it in place. To give each instance its own list, create it in the constructor.
