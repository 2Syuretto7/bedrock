concept: s1.comprehensions-and-iterators
minutes: 100
claim: You can read and write list, set and dictionary comprehensions as sigma and set notation that runs, walk sequences with enumerate and zip, and explain what an iterator is, why a for loop works on so many kinds of things, and why a generator expression can be used only once.
recalls: [f1.summation-notation, s0.reading-errors-and-debugging]
uses: [f1.functions-as-machines, f1.composition-and-inverses, f1.arithmetic-and-geometric-series, s0.strings, s0.booleans-and-conditionals, s0.loops, s0.functions, s0.lists-and-tuples, s0.dictionaries-and-sets, f1.inequalities]
leads: [s1.modules-and-imports, s1.generators-and-context-managers]
bridges:
  f1.summation-notation: |
    The last lesson ended by saying that Python has a notation modelled on the sigma. Here it is. $\sum_{n=1}^{1000} \frac{1}{n^2}$ names a term, an index and where the index runs, and never says how to do the adding. A comprehension says the same three things in the same order of importance: the expression for a term, the `for` that gives the index its values, and an optional `if` that says which terms are kept. And a sum that never stops is no problem for an iterator, which hands over one term at a time, just as a partial sum needs only the running total.
starter: |
  # Scratch space. The same list built twice: by a loop, and by one line.
  squares = []
  for x in range(10):
      if x % 2 == 0:
          squares.append(x ** 2)
  print(squares)

  print([x ** 2 for x in range(10) if x % 2 == 0])
parts:
  recall:
    - text: |
        [[f1.summation-notation]] ended with a promise: that the notation of sums and sets can be typed into Python almost symbol for symbol. This lesson keeps the promise. It also leans on the habit you formed in [[s0.reading-errors-and-debugging]], of checking a claim about code with a small assertion. Three quick pulls first.
  puzzle:
    - text: |
        In [[f1.functions-as-machines]] you wrote the range of a function in one line, $\{f(x) : x \in A\}$, by saying what belongs in it rather than listing it. Add a condition after a comma, saying which $x$ are kept, and the same notation describes this set:

        $$\{\,x^2 : x \in \{0, 1, \dots, 9\},\ x \text{ is even}\,\}$$

        Read aloud it says: the squares of those $x$, taken from zero to nine, that are even. It does not say how to make the set. There is no first step and no second step. It only says **what** the set is.

        The Python you know says **how**:

        ```python
        squares = []
        for x in range(10):
            if x % 2 == 0:
                squares.append(x ** 2)
        ```

        Four lines, and three of them are machinery: make an empty list, walk, attach. The idea itself, $x^2$, is hidden in the innermost corner. Here is the first puzzle. Can Python be made to say *what*, as the mathematics does?

        The second puzzle is about size. Suppose you want the sum

        $$\sum_{n=1}^{1\,000\,000\,000} \frac{1}{n^2}.$$

        If you first build a list of a thousand million terms and then add it up, the list alone needs more memory than most laptops have. Yet when you add up a long column of numbers by hand you never hold more than two numbers in your head: the running total and the next term. The list was never needed. How do you ask Python for the terms one at a time, without the list ever existing?

        Both puzzles have the same answer, and it is hiding inside the `for` loop you have used since [[s0.loops]].
  intuition:
    - text: |
        Take the four-line loop and fold it. Keep the three ideas, drop the machinery, and write the ideas inside one pair of square brackets:

        ```python
        squares = [x ** 2 for x in range(10) if x % 2 == 0]
        ```

        This is a **list comprehension**. Put it next to the line of mathematics and read them together.

        | The mathematics | The Python | What it says |
        | --- | --- | --- |
        | $x^2$ | `x ** 2` | what each member looks like |
        | $x \in \{0, \dots, 9\}$ | `for x in range(10)` | where $x$ comes from |
        | $x$ is even | `if x % 2 == 0` | which $x$ are kept |

        The colon has become the word `for`, and the comma has become the word `if`. Nothing else has changed. A comprehension is the mathematics of collections, made to run.

        Now the second puzzle. Think of a book and a bookmark. The book is the collection: all the values, sitting there. The bookmark is a small object that knows only where you have got to. To read the book you do one thing again and again: ask the bookmark for the next page, and it moves along by one. A `for` loop does exactly this. It asks the collection for a bookmark, then asks the bookmark for the next value until there are none left.

        Here is the step that matters. The loop only ever talks to the bookmark. So there does not need to be a book at all. Anything that can answer the question "what is next?" can be looped over, even if it works out each value at the moment it is asked, and forgets it afterwards. A bookmark with no book behind it is how you add up a thousand million terms with two numbers' worth of memory.
  derivation:
    - text: |
        **Folding a loop, one piece at a time.** A loop that builds a list always has the same skeleton:

        ```python
        result = []
        for x in source:
            if keep(x):
                result.append(make(x))
        ```

        Three things can vary: the `source` the values come from, the test `keep` that filters them, and the expression `make` that transforms the ones that pass. The comprehension writes those three things and nothing else, with the expression moved to the front:

        ```python
        result = [make(x) for x in source if keep(x)]
        ```

        The order inside the brackets is fixed: **expression, then `for`, then `if`**. The `for` and the `if` appear in the same order as in the loop. Only the expression has moved, from the innermost line to the front, because it is the thing the reader most wants to see.

        The filter is optional. Leave it out and every value is kept, which is a pure transformation. In the language of [[f1.functions-as-machines]] it applies one function to every member of the source:

        ```python
        doubled = [2 * x for x in [3, 1, 4]]        # [6, 2, 8]
        ```

        Or keep the filter and make the expression the plain variable, which is a pure selection:

        ```python
        positives = [x for x in [3, -1, 4, -5] if x > 0]    # [3, 4]
        ```

        The result of a comprehension is always a **new** list. The source is left untouched.
    - question:
        id: predict-basic
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          words = ["sum", "product", "set", "function"]
          print([len(w) for w in words if len(w) > 3])
        output: "[7, 8]"
        explanation: The filter keeps only the words with more than three letters, "product" and "function". The expression then replaces each by its length.
    - text: |
        **Choosing a value is not the same as choosing whether to keep it.** Sometimes every value should stay, but be treated in one of two ways. For that Python has a **conditional expression**, an `if` that produces a value:

        ```python
        size = "big" if n > 100 else "small"
        ```

        Read it in the order it is written: "big", if `n` exceeds 100, otherwise "small". It always needs its `else`, because an expression must always have a value.

        A conditional expression goes at the **front** of a comprehension, as part of the expression. A filter goes at the **back**. They do different jobs:

        ```python
        xs = [3, -1, 4, -5]
        print([x if x > 0 else 0 for x in xs])   # [3, 0, 4, 0]   four in, four out
        print([x for x in xs if x > 0])          # [3, 4]         four in, two out
        ```

        The first line is worth remembering. It replaces every negative number by zero and leaves the rest alone. This small function, $\max(0, x)$, is the most used ingredient in modern neural networks, where it goes by the name ReLU. You have just applied it to a whole layer of numbers in one line.
    - question:
        id: choice-front-or-back
        type: choice
        system: s1
        prompt: |
          `marks = [35, 80, 52, 91]`. Which line produces `["fail", "pass", "pass", "pass"]`, with the pass mark at 40?
        options:
          - '`["pass" for m in marks if m >= 40]`'
          - '`["pass" if m >= 40 else "fail" for m in marks]`'
          - '`[m >= 40 for m in marks]`'
          - '`["pass" for m in marks if m >= 40 else "fail"]`'
        answer: 1
        explanation: Four marks go in and four words come out, so nothing is filtered. The choice between the two words is made by a conditional expression at the front. The first option filters and gives only three words. The last is not valid Python, because a filter has no else.
    - text: |
        **Sets and dictionaries.** Change the square brackets to curly ones and the same notation builds a set. As in [[s0.dictionaries-and-sets]], a set holds each member once and has no order:

        ```python
        remainders = {x % 3 for x in [3, 4, 5, 6, 7]}     # {0, 1, 2}
        ```

        Five values went in, but only three different remainders exist, so the set has three members. This is the image of a function, computed in one line.

        Put a `key: value` pair at the front and the curly brackets build a dictionary:

        ```python
        lengths = {w: len(w) for w in ["set", "function"]}   # {'set': 3, 'function': 8}
        ```

        A dictionary is a function written out as a table, from keys to values. So a dictionary comprehension can do to a function what [[f1.composition-and-inverses]] did on paper. Here is the inverse, made by swapping every pair:

        ```python
        code = {"a": 1, "b": 2, "c": 3}
        decode = {v: k for k, v in code.items()}             # {1: 'a', 2: 'b', 3: 'c'}
        ```

        The `for k, v in` part unpacks each pair into two names, just as `a, b = (1, 2)` does. And the warning from [[f1.composition-and-inverses]] applies in full: a function can be undone only if it never sends two inputs to the same output. If two keys share a value, the swapped table would need one key to have two values, and a dictionary cannot hold that. The later pair silently overwrites the earlier one.
    - question:
        id: predict-set-comp
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          names = ["Asha", "Ravi", "Anil", "Rita", "Arun"]
          initials = {name[0] for name in names}
          print(len(initials))
        output: "2"
        explanation: The five names begin with only two different letters, A and R. A set keeps each member once.
    - question:
        id: predict-invert
        type: predict
        system: s2
        concepts: [f1.composition-and-inverses]
        prompt: What does this print?
        code: |
          parity = {1: "odd", 2: "even", 3: "odd", 4: "even"}
          back = {v: k for k, v in parity.items()}
          print(len(back), back["odd"])
        output: "2 3"
        explanation: The function has no inverse, since two keys map to "odd" and two to "even". The swapped dictionary can hold only one key for each of those words, and each later pair overwrites the earlier one. So "odd" ends up paired with 3, the last odd key.
    - text: |
        **Two sources at once.** A comprehension may have more than one `for`. They nest exactly as loops nest, the first `for` being the outer loop:

        ```python
        pairs = [(a, b) for a in [1, 2] for b in "xy"]
        # [(1, 'x'), (1, 'y'), (2, 'x'), (2, 'y')]
        ```

        Every member of the first source meets every member of the second, so the count is the product of the two sizes, $2 \times 2$. Mathematicians call the collection of all such pairs the **Cartesian product** of the two sets, written $A \times B$. A filter can use both variables. The pairs of different numbers from 0 to 3 are

        ```python
        different = [(a, b) for a in range(4) for b in range(4) if a != b]
        ```

        and there are $4 \times 4 - 4 = 12$ of them, all sixteen pairs less the four on the diagonal.

        A different kind of nesting puts a whole comprehension in the expression position. The result is then a list of lists:

        ```python
        table = [[row * col for col in range(1, 4)] for row in range(1, 3)]
        # [[1, 2, 3], [2, 4, 6]]
        ```

        Read it from the outside in: for each row, build a complete inner list. This is how a grid of numbers, a matrix, is written in plain Python.
    - question:
        id: numeric-pairs
        type: numeric
        system: s1
        concepts: [s0.loops]
        prompt: |
          How many items are in the list `[(a, b) for a in range(5) for b in range(3)]`?
        answer: "15"
        explanation: Each of the 5 values of `a` is paired with each of the 3 values of `b`. It is the Cartesian product of a set of five with a set of three.
    - text: |
        **Walking with an index, and walking two lists together.** Two small tools make most index arithmetic unnecessary.

        `enumerate` hands out each value along with its position, as a pair:

        ```python
        for i, letter in enumerate("abc"):
            print(i, letter)          # 0 a, then 1 b, then 2 c
        ```

        It replaces the clumsier `for i in range(len(s))` followed by `s[i]`.

        `zip` walks two sequences in step, pairing the first with the first, the second with the second, like the two sides of a zip fastener:

        ```python
        prices = [40, 25, 10]
        counts = [2, 1, 5]
        cost = sum([p * c for p, c in zip(prices, counts)])    # 80 + 25 + 50 = 155
        ```

        Multiply matching entries, add the products. This one line is the **dot product** of two lists of numbers, and it is the single most important calculation in machine learning. Every neuron computes one.

        `zip` stops as soon as the **shorter** sequence runs out. It does not complain about the leftovers. If the two lists were meant to be equally long and are not, the result is quietly wrong, so that is worth an assertion.

        Two string methods are also useful from here on. `"a,b,c".split(",")` cuts a string at every comma and returns the list `['a', 'b', 'c']`, and with no argument, `split()` cuts at spaces. Going the other way, `"-".join(["a", "b", "c"])` glues a list of strings together with the given string between them, giving `'a-b-c'`.
    - question:
        id: predict-zip-short
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          xs = [1, 2, 3, 4]
          ys = [10, 20, 30]
          print([x + y for x, y in zip(xs, ys)])
        output: "[11, 22, 33]"
        explanation: zip stops when the shorter list is used up. The 4 has no partner and is silently left out.
    - text: |
        **Dropping the brackets.** Look again at the cost line. It builds a list of three products, hands the list to `sum`, and then throws the list away. The list was only scaffolding. Python lets you leave it out:

        ```python
        cost = sum(p * c for p, c in zip(prices, counts))
        ```

        Now put this beside the notation of [[f1.summation-notation]]:

        $$\sum_{n=1}^{1000} \frac{1}{n^2} \qquad\qquad \texttt{sum(1 / n ** 2 for n in range(1, 1001))}$$

        The sigma is `sum`. The term is the expression. The index and its limits are the `for` and the `range`. The only trap is the old one: a range leaves out its upper end, so a sum up to 1000 needs `range(1, 1001)`.

        A comprehension without square brackets is called a **generator expression**. It looks like a list comprehension, but it builds nothing. To understand what it is instead, you need to know what a `for` loop really does.
    - text: |
        **What `for` really does.** Python has two built-in functions that are the two halves of every loop. `iter(collection)` asks a collection for a bookmark. The official name for the bookmark is an **iterator**. `next(iterator)` asks the iterator for the next value and moves it along by one.

        ```python
        it = iter([10, 20, 30])
        print(next(it))     # 10
        print(next(it))     # 20
        print(next(it))     # 30
        ```

        When the values run out, `next` has nothing to return. It can be given a second argument, a value to hand back in that case:

        ```python
        print(next(it, "finished"))     # finished
        ```

        Without that second argument, an exhausted iterator raises a signal called `StopIteration`. That signal is how the end is announced. So the loop `for x in xs:` is shorthand for this:

        1. Call `iter(xs)` once, to get an iterator.
        2. Call `next` on the iterator, and give the result the name `x`.
        3. Run the body.
        4. Go back to step 2, until the iterator signals that it is finished.

        Anything that can hand out an iterator is called **iterable**. Lists, tuples, strings, dictionaries, sets and ranges are all iterable, and that is the whole reason one kind of `for` loop works on all of them. The loop does not know or care what it is walking through. It only ever says "next".

        An iterator moves in one direction only. It cannot go back, it cannot start again, and it does not know how many values are left. A list is a book, and you can ask it for a fresh bookmark as often as you like. An iterator is the bookmark, and when it reaches the end it stays there.
    - question:
        id: order-for-loop
        type: order
        system: s2
        prompt: Put in order what Python does when it runs a for loop over a list of two items.
        steps:
          - Call iter on the list to get an iterator.
          - Call next on the iterator and receive the first item.
          - Run the body of the loop with the first item.
          - Call next on the iterator and receive the second item.
          - Run the body of the loop with the second item.
          - Call next on the iterator, which signals that nothing is left.
          - Leave the loop and carry on with the line after it.
        explanation: The iterator is asked for once, at the start. After that the loop alternates between asking for the next item and running the body. The loop cannot know that the list is finished until it asks one more time and is told so.
    - question:
        id: predict-shared-iterator
        type: predict
        system: s2
        prompt: What does this print?
        code: |
          it = iter([5, 6, 7, 8])
          first = next(it)
          rest = [x for x in it]
          print(first, rest, next(it, "empty"))
        output: "5 [6, 7, 8] empty"
        explanation: The iterator is a single bookmark. The first next moved it past the 5, so the comprehension starts at 6 and runs it to the end. After that there is nothing left, and next returns the fallback value.
    - text: |
        **A generator expression is an iterator with no book.** Now the bracketless form can be explained. `(1 / n ** 2 for n in range(1, 1001))` does not compute a thousand numbers. It makes an iterator that holds a recipe. Each time `next` is called on it, it takes one more `n` from the range, works out one term, hands it over and forgets it. `sum` calls `next` again and again, adding as it goes. At no moment do two terms exist together. This property is called **laziness**: work is done only when a value is asked for.

        That solves the second puzzle. Summing a thousand million terms this way takes time, but it takes no more memory than summing ten.

        Laziness has a price, and it is the most common mistake people make with iterators. A generator expression is a bookmark, so it can be used **once**:

        ```python
        squares = (x ** 2 for x in range(4))
        print(sum(squares))     # 14
        print(sum(squares))     # 0
        ```

        The second sum is zero, because the iterator was already at its end, and the sum of no terms is the empty sum. Python raises no error. If you need the values twice, keep them: wrap the generator in `list(...)`, or write the comprehension with square brackets in the first place.

        `enumerate` and `zip` are lazy in the same way. They return iterators, which is why printing `zip(xs, ys)` shows nothing useful, and why `list(zip(xs, ys))` is the way to look at the pairs. A `range` is lazy as well, but it is a book and not a bookmark. It works out each number on demand, and it can still be walked as many times as you like.

        The functions `list`, `tuple`, `set` and `dict` accept any iterable and collect its values. `list("abc")` is `['a', 'b', 'c']`, `tuple([1, 2])` is `(1, 2)`, and `dict(zip(keys, values))` builds a dictionary from two matching lists.
    - question:
        id: predict-once-only
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          evens = (n for n in range(10) if n % 2 == 0)
          print(max(evens))
          print(list(evens))
        output: |
          8
          []
        explanation: max walks the generator to its end to find the largest value. The generator is then exhausted, so list has nothing to collect.
    - text: |
        **Asking a question of every member.** Two more built-in functions take an iterable of true and false values. `all` answers whether every one is true. `any` answers whether at least one is.

        ```python
        xs = [3, 8, 5]
        print(all(x > 0 for x in xs))      # True   every member is positive
        print(any(x > 7 for x in xs))      # True   at least one exceeds 7
        print(all(x > 4 for x in xs))      # False  the 3 fails
        ```

        These are the code for two phrases that mathematics uses constantly: "for every $x$ in the set" and "there is some $x$ in the set". They are also lazy in a useful way. `any` stops at the first true value it meets, and `all` stops at the first false one, since after that the answer cannot change. Fed by a generator, they do no more work than is needed.

        On an empty collection, `all` is `True` and `any` is `False`. That is not arbitrary. To make `all` false you must produce a member that fails, and an empty collection has none to offer. It is the same reasoning that made the empty sum 0 and the empty product 1.

        **When not to fold.** A comprehension is for building a collection from another. If the body of your loop prints, or changes something elsewhere, or needs several statements, keep the loop. And if a comprehension has grown past one clear thought, with three `for` clauses and two conditions, unfold it. The aim was to say *what* plainly. A line that must be decoded has lost that.
    - question:
        id: fix-mean-spread
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `spread(values)` should return how far apart the largest and smallest of the squared values are. For `[1, -3, 2]` the squares are 1, 9 and 4, so the answer should be $9 - 1 = 8$. Instead the program stops with an error on the line that calls `min`, complaining that it was given an empty sequence. Fix it without changing what the function is meant to compute.
        starter: |
          def spread(values):
              squares = (v ** 2 for v in values)
              return max(squares) - min(squares)

          print(spread([1, -3, 2]))
        solution: |
          def spread(values):
              squares = [v ** 2 for v in values]
              return max(squares) - min(squares)

          print(spread([1, -3, 2]))
        tests: |
          assert spread([1, -3, 2]) == 8, "The squares are 1, 9 and 4, so the spread is 8"
          assert spread([5]) == 0, "With one value the largest and smallest squares are the same"
          assert spread([-2, 2]) == 0, "-2 and 2 have the same square"
          assert spread([0, 10, -1]) == 100, "The squares are 0, 100 and 1"
          assert spread((3, 4)) == 7, "It should work for a tuple as well"
        wrong:
          - "def spread(values):\n    squares = [v ** 2 for v in values]\n    return max(values) - min(values)\n\nprint(spread([1, -3, 2]))\n"
          - "def spread(values):\n    squares = [v ** 2 for v in values]\n    return max(squares)\n\nprint(spread([1, -3, 2]))\n"
          - "def spread(values):\n    squares = [abs(v) for v in values]\n    return max(squares) - min(squares)\n\nprint(spread([1, -3, 2]))\n"
        explanation: |
          `squares` was a generator, a bookmark with no book. `max` walked it to the end, and `min` then received an iterator with nothing left. Square brackets build a real list, which can be walked as often as you like. The rule: if a result is needed more than once, it must be stored.
  formal:
    - text: |
        **Comprehensions.** With `source` any iterable, `test` an optional condition and `expr`, `key`, `value` expressions:

        | Form | Builds | Loop it replaces |
        | --- | --- | --- |
        | `[expr for x in source if test]` | a list | append `expr` to an empty list |
        | `{expr for x in source if test}` | a set | add `expr` to an empty set |
        | `{key: value for x in source if test}` | a dictionary | set `d[key] = value` in an empty dictionary |
        | `(expr for x in source if test)` | a generator, which is an iterator | nothing is built; values are produced on demand |

        Several `for` clauses nest from left to right, the leftmost being the outermost loop. A conditional expression `a if test else b` in the expression position chooses a value and never drops an item. An `if` after the `for` drops items and has no `else`. When a generator expression is the only argument of a function call, its own round brackets may be left out, as in `sum(x for x in xs)`.

        **The iteration protocol.** An object is **iterable** if `iter(obj)` returns an iterator. An object is an **iterator** if `next(obj)` returns its next value, or signals `StopIteration` when it has none; `next(obj, default)` returns `default` instead of signalling. An iterator moves forwards only and is exhausted after one pass. Calling `iter` on a list, string, tuple, set, dictionary or range gives a new, independent iterator each time. Calling `iter` on an iterator gives back that same iterator.

        | Function | Takes | Gives |
        | --- | --- | --- |
        | `enumerate(xs)` | an iterable | an iterator of pairs `(index, value)`, indices from 0 |
        | `zip(xs, ys)` | two or more iterables | an iterator of tuples of matching items, ending with the shortest |
        | `all(bs)` | an iterable | `True` if no item is false; `True` when empty |
        | `any(bs)` | an iterable | `True` if some item is true; `False` when empty |
        | `list`, `tuple`, `set`, `dict` | an iterable | a new collection holding its items |
        | `s.split(sep)` | a string | the list of pieces of `s` between occurrences of `sep` |
        | `sep.join(strings)` | an iterable of strings | one string, the items joined with `sep` between them |

        **Laziness.** A generator expression, `enumerate`, `zip` and `range` compute each value only when it is requested. The first three are iterators and can be consumed once. A `range` is an iterable and can be walked any number of times.
  drill:
    - question:
        id: drill-map
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          print([n * n for n in range(1, 5)])
        output: "[1, 4, 9, 16]"
        explanation: The range gives 1, 2, 3 and 4, and each is replaced by its square.
    - question:
        id: drill-filter
        type: predict
        system: s1
        prompt: What does this print?
        code: |
          print([c for c in "comprehension" if c in "aeiou"])
        output: "['o', 'e', 'e', 'i', 'o']"
        explanation: A string is iterable, one character at a time. The filter keeps the vowels, in the order they occur, repeats included.
    - question:
        id: drill-count-filter
        type: numeric
        system: s1
        prompt: |
          How many items are in `[n for n in range(20) if n % 3 == 0]`?
        answer: "7"
