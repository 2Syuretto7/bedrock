  work:
    - question:
        id: write-relu
        type: code
        mode: write
        system: s1
        prompt: |
          Write `relu(xs)` that returns a new list in which every negative number of `xs` has been replaced by 0 and every other number is unchanged. Use one comprehension. The original list must not be changed.
        starter: |
          def relu(xs):
              # Replace the next line with your own.
              return xs

          print(relu([3, -1, 4, -5]))
        solution: |
          def relu(xs):
              return [x if x > 0 else 0 for x in xs]

          print(relu([3, -1, 4, -5]))
        tests: |
          assert relu([3, -1, 4, -5]) == [3, 0, 4, 0], "Negative numbers become 0 and the others stay"
          assert relu([]) == [], "An empty list gives an empty list"
          assert relu([-2.5, 2.5]) == [0, 2.5], "It should work for decimals"
          assert relu([0, 0]) == [0, 0], "Zero stays zero"
          _xs = [-1, 1]
          _ys = relu(_xs)
          assert _xs == [-1, 1], "The original list must not be changed"
          assert len(relu([-1, -2, -3])) == 3, "Nothing is dropped. Three numbers in, three numbers out."
        wrong:
          - "def relu(xs):\n    return [x for x in xs if x > 0]\n"
          - "def relu(xs):\n    return [abs(x) for x in xs]\n"
          - "def relu(xs):\n    for i in range(len(xs)):\n        if xs[i] < 0:\n            xs[i] = 0\n    return xs\n"
        explanation: |
          Every number stays in the list, so there is no filter. The choice of what each number becomes is a conditional expression at the front: `x if x > 0 else 0`. `max(x, 0)` in that position works equally well. This function, applied to a list of numbers, is one layer's worth of the activation used in most neural networks.
    - question:
        id: write-dot
        type: code
        mode: write
        system: s2
        prompt: |
          Write `dot(u, v)` that returns the dot product of two lists of numbers: the sum of the products of matching entries. For `[1, 2, 3]` and `[4, 5, 6]` it is $1 \times 4 + 2 \times 5 + 3 \times 6 = 32$.

          The two lists must have the same length. Begin the function with an assertion that says so, so that a mismatch stops the program instead of giving a quietly wrong answer.
        starter: |
          def dot(u, v):
              # Replace the next line with your own.
              return 0

          print(dot([1, 2, 3], [4, 5, 6]))
        solution: |
          def dot(u, v):
              assert len(u) == len(v), "the lists must have the same length"
              return sum(a * b for a, b in zip(u, v))

          print(dot([1, 2, 3], [4, 5, 6]))
        tests: |
          assert dot([1, 2, 3], [4, 5, 6]) == 32, "1*4 + 2*5 + 3*6 is 32"
          assert dot([], []) == 0, "The empty sum is 0"
          assert dot([2], [-3]) == -6, "With one entry each it is a single product"
          assert abs(dot([0.5, 0.5], [4, 6]) - 5) < 1e-12, "It should work for decimals"
          assert dot([1, 0, 0], [0, 1, 0]) == 0, "No matching entries are both non-zero"
          _stopped = False
          try:
              dot([1, 2, 3], [1, 2])
          except AssertionError:
              _stopped = True
          assert _stopped, "Lists of different lengths should be stopped by an assertion"
        wrong:
          - "def dot(u, v):\n    return sum(a * b for a, b in zip(u, v))\n"
          - "def dot(u, v):\n    assert len(u) == len(v)\n    return sum(a + b for a, b in zip(u, v))\n"
          - "def dot(u, v):\n    assert len(u) == len(v)\n    return sum(a * b for a in u for b in v)\n"
        explanation: |
          `zip` pairs matching entries, the expression multiplies each pair, and `sum` adds the products. No list is built, because the generator hands the products to `sum` one at a time. The assertion matters because `zip` stops at the shorter list without a word. The third wrong answer in the tests uses two `for` clauses, which pairs every entry of one list with every entry of the other, the Cartesian product, and that is a different calculation.
    - question:
        id: write-inverse
        type: code
        mode: write
        system: s2
        concepts: [f1.composition-and-inverses, s0.dictionaries-and-sets]
        prompt: |
          A dictionary is a function written as a table. Write `inverse(table)` that returns the inverse function as a new dictionary, with every pair swapped, **if** the function has one. If two keys share a value there is no inverse, and the function should return `None`.

          `inverse({"a": 1, "b": 2})` is `{1: "a", 2: "b"}`. `inverse({"a": 1, "b": 1})` is `None`.
        starter: |
          def inverse(table):
              # Replace the next line with your own.
              return table

          print(inverse({"a": 1, "b": 2}))
          print(inverse({"a": 1, "b": 1}))
        solution: |
          def inverse(table):
              swapped = {v: k for k, v in table.items()}
              if len(swapped) != len(table):
                  return None
              return swapped

          print(inverse({"a": 1, "b": 2}))
          print(inverse({"a": 1, "b": 1}))
        tests: |
          assert inverse({"a": 1, "b": 2}) == {1: "a", 2: "b"}, "Every pair should be swapped"
          assert inverse({"a": 1, "b": 1}) is None, "Two keys share the value 1, so there is no inverse"
          assert inverse({}) == {}, "The empty function is its own inverse"
          assert inverse({1: 2, 2: 3, 3: 1}) == {2: 1, 3: 2, 1: 3}, "A function from a set to itself"
          assert inverse({1: "x", 2: "y", 3: "x"}) is None, "1 and 3 both map to x"
          _t = {"p": "q"}
          assert inverse(inverse(_t)) == _t, "The inverse of the inverse is the function you began with"
          assert _t == {"p": "q"}, "The original table must not be changed"
        wrong:
          - "def inverse(table):\n    return {v: k for k, v in table.items()}\n"
          - "def inverse(table):\n    swapped = {k: v for k, v in table.items()}\n    if len(swapped) != len(table):\n        return None\n    return swapped\n"
          - "def inverse(table):\n    if len(table) > 1:\n        return None\n    return {v: k for k, v in table.items()}\n"
        explanation: |
          Swapping the pairs is one dictionary comprehension. The check for an inverse uses a fact about dictionaries: a key can appear only once. If two keys of the table share a value, the swapped dictionary receives that value as a key twice and keeps one, so it comes out smaller than the table. Comparing the two sizes detects exactly the functions that send two inputs to the same output. An equivalent test is `len(set(table.values())) != len(table)`.
    - question:
        id: write-transpose
        type: code
        mode: write
        system: s2
        prompt: |
          A table of numbers is stored as a list of rows, each row a list. Write `transpose(rows)` that returns the table with rows and columns exchanged: the first row of the result is the first column of the input, and so on. Every row has the same length, and there is at least one row.

          `transpose([[1, 2, 3], [4, 5, 6]])` is `[[1, 4], [2, 5], [3, 6]]`.
        starter: |
          def transpose(rows):
              # Replace the next line with your own.
              return rows

          print(transpose([[1, 2, 3], [4, 5, 6]]))
        solution: |
          def transpose(rows):
              width = len(rows[0])
              return [[row[j] for row in rows] for j in range(width)]

          print(transpose([[1, 2, 3], [4, 5, 6]]))
        tests: |
          assert transpose([[1, 2, 3], [4, 5, 6]]) == [[1, 4], [2, 5], [3, 6]], "Two rows of three become three rows of two"
          assert transpose([[7]]) == [[7]], "A single entry is unchanged"
          assert transpose([[1, 2]]) == [[1], [2]], "One row becomes one column"
          assert transpose([[1], [2], [3]]) == [[1, 2, 3]], "One column becomes one row"
          _m = [[1, 2], [3, 4], [5, 6]]
          assert transpose(transpose(_m)) == _m, "Transposing twice gives back the original table"
          assert _m == [[1, 2], [3, 4], [5, 6]], "The original table must not be changed"
        wrong:
          - "def transpose(rows):\n    return [[row[j] for j in range(len(rows[0]))] for row in rows]\n"
          - "def transpose(rows):\n    return [[row[j] for row in rows] for j in range(len(rows))]\n"
          - "def transpose(rows):\n    return [row[j] for j in range(len(rows[0])) for row in rows]\n"
        explanation: |
          Read the solution from the outside in. For each column number `j`, build one new row: the entry at position `j` of every old row. The outer comprehension runs over the columns of the input, because those become the rows of the output. The first wrong answer has the two loops the other way round and simply copies the table. The last has both `for` clauses in one comprehension, which gives a flat list with no rows at all. Since `zip` pairs matching items of any number of lists, the columns can also be had from it, but the nested comprehension shows what is happening.
    - question:
        id: fix-first-negative
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `first_negative(xs)` should return the **position** of the first negative number in `xs`, or `None` if there is none. For `[4, 7, -2, 9, -1]` the answer is 2. The function returns `-2` for that list, and for a list with no negative numbers it stops with an error instead of returning `None`. Fix both faults.
        starter: |
          def first_negative(xs):
              found = (x for i, x in enumerate(xs) if x < 0)
              return next(found)

          print(first_negative([4, 7, -2, 9, -1]))
        solution: |
          def first_negative(xs):
              found = (i for i, x in enumerate(xs) if x < 0)
              return next(found, None)

          print(first_negative([4, 7, -2, 9, -1]))
        tests: |
          assert first_negative([4, 7, -2, 9, -1]) == 2, "The first negative number is at position 2"
          assert first_negative([1, 2, 3]) is None, "With no negative number the answer is None"
          assert first_negative([]) is None, "An empty list has no negative number"
          assert first_negative([-5]) == 0, "Positions are counted from zero"
          assert first_negative([0, 0, -1]) == 2, "Zero is not negative"
          assert first_negative([3, -3, -3]) == 1, "The first one, not the last"
        wrong:
          - "def first_negative(xs):\n    found = (x for i, x in enumerate(xs) if x < 0)\n    return next(found, None)\n"
          - "def first_negative(xs):\n    found = [i for i, x in enumerate(xs) if x < 0]\n    return found[-1] if found else None\n"
          - "def first_negative(xs):\n    found = (i for i, x in enumerate(xs) if x <= 0)\n    return next(found, None)\n"
        explanation: |
          The expression at the front decides what is produced. It was `x`, the value, where the position `i` was wanted. And `next` on an iterator with nothing in it signals `StopIteration` unless it is given a fallback as its second argument. Notice how little work the fixed version does: the generator is lazy, so `next` stops at the first negative number and the rest of the list is never examined.
    - question:
        id: write-word-lengths
        type: code
        mode: write
        system: s2
        prompt: |
          Write `longest_words(sentence)` that returns a **set** of the longest words in the sentence. Words are separated by single spaces. Compare the words without regard to capital letters, and return them in lower case. If several words tie for the longest, the set holds all of them. An empty sentence gives the empty set.

          `longest_words("The cat sat on THE mat")` is `{"the", "cat", "sat", "mat"}`.
        starter: |
          def longest_words(sentence):
              # Replace the next line with your own.
              return set()

          print(longest_words("a list is a book and an iterator is a bookmark"))
        solution: |
          def longest_words(sentence):
              words = [w.lower() for w in sentence.split()]
              if len(words) == 0:
                  return set()
              longest = max(len(w) for w in words)
              return {w for w in words if len(w) == longest}

          print(longest_words("a list is a book and an iterator is a bookmark"))
        tests: |
          assert longest_words("The cat sat on THE mat") == {"the", "cat", "sat", "mat"}, "Four different three-letter words tie, and 'The' and 'THE' are the same word"
          assert longest_words("a list is a book and an iterator is a bookmark") == {"iterator", "bookmark"}, "Two eight-letter words tie"
          assert longest_words("") == set(), "An empty sentence gives the empty set"
          assert longest_words("Hello") == {"hello"}, "One word, returned in lower case"
          assert longest_words("to be or not") == {"not"}, "One word is longer than the rest"
          assert type(longest_words("a b")) == set, "The result should be a set"
        wrong:
          - "def longest_words(sentence):\n    words = sentence.split()\n    if len(words) == 0:\n        return set()\n    longest = max(len(w) for w in words)\n    return {w for w in words if len(w) == longest}\n"
          - "def longest_words(sentence):\n    words = [w.lower() for w in sentence.split()]\n    if len(words) == 0:\n        return set()\n    return {max(words)}\n"
          - "def longest_words(sentence):\n    words = [w.lower() for w in sentence.split()]\n    longest = max([len(w) for w in words] + [0])\n    return {w for w in words if len(w) >= longest - 1 and longest > 0}\n"
        explanation: |
          Three comprehensions, each doing one job. A list comprehension puts every word in lower case. A generator inside `max` finds the greatest length without building a list of lengths. A set comprehension keeps the words of that length, and being a set it holds each word once. The empty sentence needs its own line, because `max` of nothing has no answer. Note that `max(words)` would compare the words alphabetically, which is a different question.
    - question:
        id: numeric-lazy-count
        type: numeric
        system: s2
        prompt: |
          A function `is_prime(n)` is slow. The line below is run:

          `any(is_prime(n) for n in [8, 9, 10, 11, 12, 13])`

          How many times is `is_prime` called?
        answer: "4"
        explanation: The generator is lazy and any stops at the first true value. is_prime is called for 8, 9 and 10, which are not prime, and then for 11, which is. After that the answer is known, so 12 and 13 are never tested. With square brackets inside any, the whole list of six results would have been built first.
    - question:
        id: write-basel
        type: code
        mode: write
        system: s2
        concepts: [f1.arithmetic-and-geometric-series, f1.summation-notation]
        prompt: |
          The series $\displaystyle\sum_{n=1}^{\infty} \frac{1}{n^2}$ converges. Write `basel(terms)` that returns its partial sum, the sum of the first `terms` terms, in one line with `sum` and a generator expression. Then the program prints the partial sum for a million terms. No list of a million numbers should ever be built.
        starter: |
          def basel(terms):
              # Replace the next line with your own.
              return 0.0

          print(basel(1000000))
        solution: |
          def basel(terms):
              return sum(1 / n ** 2 for n in range(1, terms + 1))

          print(basel(1000000))
        tests: |
          assert "[" not in source, "Do not build a list. Leave the square brackets out and let sum take the terms one at a time."
          assert basel(1) == 1, "The first term is 1"
          assert abs(basel(2) - 1.25) < 1e-12, "1 + 1/4 is 1.25"
          assert abs(basel(3) - (1.25 + 1 / 9)) < 1e-12, "1 + 1/4 + 1/9"
          assert basel(0) == 0, "With no terms the sum is empty"
          assert abs(basel(100000) - 1.6449240668982262) < 1e-9, "The sum of the first hundred thousand terms"
        wrong:
          - "def basel(terms):\n    return sum(1 / n ** 2 for n in range(1, terms))\n"
          - "def basel(terms):\n    return sum(1 / n * 2 for n in range(1, terms + 1))\n"
          - "def basel(terms):\n    return sum(1 / 2 ** n for n in range(1, terms + 1))\n"
        explanation: |
          The line is the sigma notation typed out: `sum` for the sigma, the term at the front, and the index with its limits in the `for`. The upper limit needs `terms + 1` because a range stops one short. The printed value, about 1.644933, is creeping up on Euler's limit from [[f1.summation-notation]], $\dfrac{\pi^2}{6} \approx 1.644934$. That a sum over whole numbers should know about circles is one of the surprises of mathematics.
  connections:
    - text: |
        You began with two puzzles. The first asked whether Python can say what a collection is, as the notation of mathematics does. It can: a comprehension has an expression, a source and a condition, in the places where the mathematics has them. The second asked how to sum terms without storing them. The answer was already inside every `for` loop: a loop talks only to an iterator, and an iterator may work out its values on demand.

        Hold on to the two words. An **iterable** is anything a loop can walk. An **iterator** is the thing that does the walking, forwards, once. Nearly everything you will write from here on is built on that pair. When you train a model, the data will not fit in memory, and it will arrive as an iterator that produces one batch at a time. The training loop will say `for batch in loader:` and never know the difference.

        Two threads continue directly.

        The tools of this lesson, `enumerate`, `zip`, `sum`, `any`, `all`, are built into Python and always at hand. Most of Python is not. Square roots, random numbers, more ways of combining iterators: these live in separate libraries that must be asked for by name. How that asking works, and what a name such as `math.sqrt` really means, is the subject of [[s1.modules-and-imports]], which comes next.

        A generator expression is a recipe that fits on one line. Some sequences need more: a running state, a loop of their own, a first term and a rule for the next, like the recurrences of [[f1.arithmetic-and-geometric-series]]. Python lets you write a whole function that produces values lazily, pausing between each. That is the generator function, and you will build one in [[s1.generators-and-context-managers]], where an iterator that never ends will turn out to be perfectly usable.
