        explanation: |
          Inside `with db:`, the order and an upsert on `daily_sales` commit together, and a refused order rolls the summary back. A plain `update` never creates the first row of a day; updating the summary first and committing it separately counts the refused order of ₹-50 anyway; and `total = excluded.total` replaces the day's total with the latest order.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          How many like rows does the puzzle's app read per hour to show the counts?
        answer: "100000000"
        explanation: |
          Each of the 2,00,000 views counts about 500 like rows: $2{,}00{,}000 \times 500 = 10$ crore rows an hour. A likes column would cost 2,000 extra writes an hour and read one row per view.
    - question:
        id: work-dashboard
        type: choice
        system: s2
        prompt: |
          A dashboard shows yesterday's sales per store and is opened 2,000 times a day. Yesterday's orders table has 50 lakh rows, and nobody changes yesterday's orders. What is the best design?
        options:
          - "A daily summary table rebuilt once after midnight, read by the dashboard."
          - "Recompute the totals from the orders on every dashboard view."
          - "A trigger that updates the summary on every order, plus the rebuild."
          - "Copy each store's total into every one of its order rows."
        answer: 0
        explanation: |
          Yesterday's data never changes, so one rebuild a day is always current for this question, and each view reads a handful of rows instead of 50 lakh. A trigger adds work to every order for no gain here, and copying totals into orders multiplies the copies to keep right.
  connections:
    - text: |
        10 crore rows an hour: 2,00,000 views, each counting about 500 likes. A likes column turns each view into a one-row read for the price of 2,000 extra writes an hour, a saving of about 50,000 to 1, which is why almost every social app stores its counts. It also needs a trigger or a transaction for every like and every unlike, and a nightly reconciliation to catch the day the copy drifts.

        Denormalisation in a relational database is an exception, made table by table. Some systems make it the rule: a document database stores an order with its lines, its customer's name and its address nested in one record, so that one read fetches everything the page needs. That is [[q1.document-models]]. Summary tables kept by the database itself are [[q8.materialised-views]], and the wide, deliberately redundant tables of analytics are the star schemas of [[q8.facts-dimensions-and-star-schemas]].
