                end;
            """

            db = sqlite3.connect(":memory:")
            db.executescript("""
                create table posts (id integer primary key, likes integer not null default 0);
                create table likes (id integer primary key, post integer not null references posts (id), user text not null, unique (post, user));
                insert into posts (id) values (1), (2);
            """)
            db.executescript(triggers)
            db.executemany("insert into likes (post, user) values (?, ?)", [(1, "asha"), (1, "bilal"), (2, "asha"), (1, "chitra"), (2, "dev")])
            db.execute("delete from likes where post = 1 and user = 'bilal'")
            db.execute("delete from likes where post = 2 and user = 'asha'")
            print(db.execute("select p.id, p.likes, (select count(*) from likes l where l.post = p.id) from posts p order by p.id").fetchall())
          - |
            import sqlite3

            triggers = """
                create trigger like_added after insert on likes
                begin
                    update posts set likes = likes + 1 where id = new.post;
                end;
                create trigger like_removed after delete on likes
                begin
                    select 1;
                end;
            """

            db = sqlite3.connect(":memory:")
            db.executescript("""
                create table posts (id integer primary key, likes integer not null default 0);
                create table likes (id integer primary key, post integer not null references posts (id), user text not null, unique (post, user));
                insert into posts (id) values (1), (2);
            """)
            db.executescript(triggers)
            db.executemany("insert into likes (post, user) values (?, ?)", [(1, "asha"), (1, "bilal"), (2, "asha"), (1, "chitra"), (2, "dev")])
            db.execute("delete from likes where post = 1 and user = 'bilal'")
            db.execute("delete from likes where post = 2 and user = 'asha'")
            print(db.execute("select p.id, p.likes, (select count(*) from likes l where l.post = p.id) from posts p order by p.id").fetchall())
          - |
            import sqlite3

            triggers = """
                create trigger like_added after insert on likes
                begin
                    update posts set likes = likes + 1 where id = new.post;
                end;
                create trigger like_removed after delete on likes
                begin
                    update posts set likes = likes - 1 where id = old.id;
                end;
            """

            db = sqlite3.connect(":memory:")
            db.executescript("""
                create table posts (id integer primary key, likes integer not null default 0);
                create table likes (id integer primary key, post integer not null references posts (id), user text not null, unique (post, user));
                insert into posts (id) values (1), (2);
            """)
            db.executescript(triggers)
            db.executemany("insert into likes (post, user) values (?, ?)", [(1, "asha"), (1, "bilal"), (2, "asha"), (1, "chitra"), (2, "dev")])
            db.execute("delete from likes where post = 1 and user = 'bilal'")
            db.execute("delete from likes where post = 2 and user = 'asha'")
            print(db.execute("select p.id, p.likes, (select count(*) from likes l where l.post = p.id) from posts p order by p.id").fetchall())
        explanation: |
          The delete trigger added one instead of subtracting, so every unlike raised the count. Subtracting from the post the deleted like belonged to, `old.post`, keeps the copy right. Without a `where`, every post loses a like; a trigger that does nothing leaves unliked posts too high; and `old.id` is the like's own id, not its post.
    - question:
        id: write-reconcile
        type: code
        mode: write
        system: s2
        prompt: |
          Change `query` so that it returns `(post, stored count, real count)` for every post whose stored `likes` differs from its number of like rows, in order of post, including posts with no likes at all.
        starter: |
          import sqlite3

          query = """
              select p.id, p.likes
              from posts p
              order by p.id
          """

          db = sqlite3.connect(":memory:")
          db.executescript("""
              create table posts (id integer primary key, likes integer not null);
              create table likes (post integer not null, user text not null, primary key (post, user));
              insert into posts values (1, 3), (2, 1), (3, 2), (4, 0);
              insert into likes values (1, 'asha'), (1, 'bilal'), (1, 'chitra'), (2, 'asha'), (2, 'dev');
          """)
          print(db.execute(query).fetchall())
        solution: |
          import sqlite3

          query = """
              select p.id, p.likes, count(l.post)
              from posts p
              left join likes l on l.post = p.id
              group by p.id, p.likes
              having p.likes <> count(l.post)
              order by p.id
          """

          db = sqlite3.connect(":memory:")
          db.executescript("""
              create table posts (id integer primary key, likes integer not null);
              create table likes (post integer not null, user text not null, primary key (post, user));
              insert into posts values (1, 3), (2, 1), (3, 2), (4, 0);
              insert into likes values (1, 'asha'), (1, 'bilal'), (1, 'chitra'), (2, 'asha'), (2, 'dev');
          """)
          print(db.execute(query).fetchall())
        tests: |
          import random as _random

          _rng = _random.Random(67)
          for _ in range(25):
              _db = sqlite3.connect(":memory:")
              _db.execute("create table posts (id integer primary key, likes integer not null)")
              _db.execute("create table likes (post integer not null, user text not null, primary key (post, user))")
              _n = _rng.randint(1, 6)
              _real = {}
              for _p in range(1, _n + 1):
                  _users = _rng.sample(["asha", "bilal", "chitra", "dev", "esha"], _rng.randint(0, 4))
                  _db.executemany("insert into likes values (?, ?)", [(_p, _u) for _u in _users])
                  _real[_p] = len(_users)
              _stored = {_p: (_real[_p] if _rng.random() < 0.6 else max(0, _real[_p] + _rng.choice([-1, 1, 2]))) for _p in _real}
              _db.executemany("insert into posts values (?, ?)", list(_stored.items()))
              _want = [(_p, _stored[_p], _real[_p]) for _p in sorted(_real) if _stored[_p] != _real[_p]]
              _got = _db.execute(query).fetchall()
              assert _got == _want, "With stored counts " + str(_stored) + " and real counts " + str(_real) + ", the mismatches are " + str(_want) + ", not " + str(_got)
          assert output.strip() == "[(2, 1, 2), (3, 2, 0)]", "The program should print [(2, 1, 2), (3, 2, 0)]"
        wrong:
          - |
            import sqlite3

            query = """
                select p.id, p.likes, count(l.post)
                from posts p
                join likes l on l.post = p.id
                group by p.id, p.likes
                having p.likes <> count(l.post)
                order by p.id
            """

            db = sqlite3.connect(":memory:")
            db.executescript("""
                create table posts (id integer primary key, likes integer not null);
                create table likes (post integer not null, user text not null, primary key (post, user));
                insert into posts values (1, 3), (2, 1), (3, 2), (4, 0);
                insert into likes values (1, 'asha'), (1, 'bilal'), (1, 'chitra'), (2, 'asha'), (2, 'dev');
            """)
            print(db.execute(query).fetchall())
          - |
            import sqlite3

            query = """
                select p.id, p.likes, count(*)
                from posts p
                left join likes l on l.post = p.id
                group by p.id, p.likes
                having p.likes <> count(*)
                order by p.id
            """

            db = sqlite3.connect(":memory:")
            db.executescript("""
                create table posts (id integer primary key, likes integer not null);
                create table likes (post integer not null, user text not null, primary key (post, user));
                insert into posts values (1, 3), (2, 1), (3, 2), (4, 0);
                insert into likes values (1, 'asha'), (1, 'bilal'), (1, 'chitra'), (2, 'asha'), (2, 'dev');
            """)
            print(db.execute(query).fetchall())
          - |
            import sqlite3

            query = """
                select p.id, p.likes, count(l.post)
                from posts p
                left join likes l on l.post = p.id
                group by p.id, p.likes
                order by p.id
            """

            db = sqlite3.connect(":memory:")
            db.executescript("""
                create table posts (id integer primary key, likes integer not null);
                create table likes (post integer not null, user text not null, primary key (post, user));
                insert into posts values (1, 3), (2, 1), (3, 2), (4, 0);
                insert into likes values (1, 'asha'), (1, 'bilal'), (1, 'chitra'), (2, 'asha'), (2, 'dev');
            """)
            print(db.execute(query).fetchall())
        explanation: |
          A left join keeps posts with no likes, `count(l.post)` counts only real like rows, and `having` keeps the mismatches. An inner join misses post 3, which claims two likes but has none; `count(*)` counts the padded row of a post with no likes as one like; and without `having` every post is reported.
    - question:
        id: write-record-order
        type: code
        mode: write
        system: s2
        prompt: |
          `daily_sales` holds, for each store and day, the number of orders and their total. Change `record_order` so that it inserts the order and updates `daily_sales` as one all-or-nothing step, adding a new summary row for a store's first order of the day, and lets `IntegrityError` reach the caller when the order is refused. The program should print `[-50] [('IND', '2026-11-26', 1, 900), ('KOR', '2026-11-26', 2, 730)]`.
        starter: |
          import sqlite3


          def record_order(db, store, day, amount):
              # Add the order and keep daily_sales (store, day, orders, total) right, all or nothing.
