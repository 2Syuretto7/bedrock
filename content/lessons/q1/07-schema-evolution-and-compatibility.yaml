    - text: |
        700 on average. Each phone change has a 30% chance of landing on version 1, which rewrites the document from the two fields it knows, and 300 nicknames disappear with no error anywhere. The cure costs one line: change the field you mean to change and carry everything else through.

        This cluster has been about the shape of data: entities and keys, normal forms, deliberate copies, documents, graphs, and changing shapes safely. The same discipline applies to code. A function's parameters, a module's exports and a service's API are shapes that other code depends on, and they too must change without breaking their callers, which is where [[s4.abstraction-and-interfaces]] begins. Underneath every model sits a storage engine that lays records out on fixed-size pages of disk, and record formats there carry versions of their own: [[q2.pages-records-and-the-buffer-pool]].
