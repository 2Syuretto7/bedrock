        explanation: |
          `load_user` keeps only the fields version 1 knows, so writing its result back erases the rest. Changing the phone in the full parsed document preserves every field, including ones added by versions not yet written. Copying the nickname by name adds a null nickname to users without one and still loses other new fields; rebuilding with a default nickname does the same; and returning the original text throws the change away.
    - question:
        id: write-expand
        type: code
        mode: write
        system: s2
        prompt: |
          `expand` is the first step of renaming `mobile` to `phone`. Change it so that after it runs, every existing user's `phone` equals their `mobile`, and it stays equal when old code inserts users or updates `mobile`, while users inserted by new code with both columns keep their phone. The program should print `[(1, 1), (2, 1), (3, 1)]`.
        starter: |
          import sqlite3

          # Run once, before the new code is deployed. Old code keeps running for a while:
          # it inserts with "insert into users (name, mobile) values (?, ?)"
          # and edits with "update users set mobile = ? where id = ?".
          expand = """
              alter table users add column phone text;
          """

          db = sqlite3.connect(":memory:")
          db.executescript("""
              create table users (id integer primary key, name text not null, mobile text);
              insert into users (name, mobile) values ('asha', '98450 12345'), ('bilal', '90080 55555');
          """)
          db.executescript(expand)
          db.execute("insert into users (name, mobile) values (?, ?)", ("chitra", "70123 45678"))
          db.execute("update users set mobile = ? where id = ?", ("99000 11111", 1))
          print(db.execute("select id, mobile = phone from users order by id").fetchall())
        solution: |
          import sqlite3

          # Run once, before the new code is deployed. Old code keeps running for a while:
          # it inserts with "insert into users (name, mobile) values (?, ?)"
          # and edits with "update users set mobile = ? where id = ?".
          expand = """
              alter table users add column phone text;
              update users set phone = mobile;
              create trigger users_insert_phone after insert on users when new.phone is null
              begin
                  update users set phone = new.mobile where id = new.id;
              end;
              create trigger users_update_phone after update of mobile on users
              begin
                  update users set phone = new.mobile where id = new.id;
              end;
          """

          db = sqlite3.connect(":memory:")
          db.executescript("""
              create table users (id integer primary key, name text not null, mobile text);
              insert into users (name, mobile) values ('asha', '98450 12345'), ('bilal', '90080 55555');
          """)
          db.executescript(expand)
          db.execute("insert into users (name, mobile) values (?, ?)", ("chitra", "70123 45678"))
          db.execute("update users set mobile = ? where id = ?", ("99000 11111", 1))
          print(db.execute("select id, mobile = phone from users order by id").fetchall())
