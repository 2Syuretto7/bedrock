        explanation: |
          Expanding takes the new column, a backfill for the existing rows, and a trigger for each way old code writes: inserts and updates of `mobile`. Without the backfill, users who existed before have no phone; without the update trigger, an old edit leaves phone stale; and an update trigger without `where id = new.id` copies one user's number into every row.
    - question:
        id: write-upgrade
        type: code
        mode: write
        system: s2
        prompt: |
          Change `upgrade` so that it returns any stored user document in version 3 form, `{"v": 3, "name": …, "phone": …, "country": …}`, applying each version's change in turn, keeping a version 3 document's own country, and without changing the stored document. The program should print `[(3, '98450 12345', 'IN'), (3, '90080 55555', 'IN'), (3, '70123 45678', 'AE')]`.
        starter: |
          # Documents from before versions existed have no "v" and are version 1.
          # Version 2 renamed "mobile" to "phone". Version 3 added "country", "IN" for older users.
          users = [
              {"name": "Asha", "mobile": "98450 12345"},
              {"v": 2, "name": "Bilal", "phone": "90080 55555"},
              {"v": 3, "name": "Chitra", "phone": "70123 45678", "country": "AE"},
          ]


          def upgrade(doc):
              doc = dict(doc)
              return doc


          print([(u.get("v"), u.get("phone"), u.get("country")) for u in [upgrade(doc) for doc in users]])
        solution: |
          # Documents from before versions existed have no "v" and are version 1.
          # Version 2 renamed "mobile" to "phone". Version 3 added "country", "IN" for older users.
          users = [
              {"name": "Asha", "mobile": "98450 12345"},
              {"v": 2, "name": "Bilal", "phone": "90080 55555"},
              {"v": 3, "name": "Chitra", "phone": "70123 45678", "country": "AE"},
          ]


          def upgrade(doc):
              doc = dict(doc)
              version = doc.get("v", 1)
              if version < 2:
                  doc["phone"] = doc.pop("mobile")
              if version < 3:
                  doc["country"] = "IN"
              doc["v"] = 3
              return doc


          print([(u.get("v"), u.get("phone"), u.get("country")) for u in [upgrade(doc) for doc in users]])
        tests: |
          import random as _random

          _rng = _random.Random(73)
          for _ in range(30):
              _name, _phone, _country = _rng.choice(["Asha", "Bilal", "Dev"]), "9" + str(_rng.randint(1000, 9999)), _rng.choice(["IN", "AE", "SG"])
              _v = _rng.randint(1, 3)
              if _v == 1:
                  _doc = {"name": _name, "mobile": _phone}
              elif _v == 2:
                  _doc = {"v": 2, "name": _name, "phone": _phone}
              else:
                  _doc = {"v": 3, "name": _name, "phone": _phone, "country": _country}
              _want = {"v": 3, "name": _name, "phone": _phone, "country": _country if _v == 3 else "IN"}
              _before = dict(_doc)
              _got = upgrade(_doc)
              assert _got == _want, "upgrade(" + str(_before) + ") should return " + str(_want) + ", not " + str(_got)
              assert _doc == _before, "upgrade should not change the stored document " + str(_before)
