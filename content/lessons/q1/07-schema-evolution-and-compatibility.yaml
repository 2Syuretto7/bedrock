          - "Change amount to paise in one deploy, since it is still a number."
          - "Rename amount to amount_paise in one deploy."
          - "Store paise in amount only for new records."
        answer: 0
        explanation: |
          A change of meaning needs a new name, and expand and contract keeps old and new servers working throughout. Reusing amount silently misreads every value on the other version, and a one-step rename breaks both directions.
