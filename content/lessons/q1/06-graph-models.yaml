                insert into triples values
                    ('asha', 'knows', 'bilal'), ('asha', 'knows', 'chitra'), ('asha', 'knows', 'dev'),
                    ('asha', 'blocked', 'farhan'), ('asha', 'lives_in', 'Delhi'),
                    ('bilal', 'lives_in', 'Pune'), ('bilal', 'knows', 'esha'),
                    ('chitra', 'lives_in', 'Kochi'), ('chitra', 'born_in', 'Madurai'),
                    ('dev', 'lives_in', 'Pune'), ('esha', 'lives_in', 'Jaipur'), ('farhan', 'lives_in', 'Agra');
            """)
            print(db.execute(query, {"person": "asha"}).fetchall())
