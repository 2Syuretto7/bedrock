              assert _got == _want, "With follows " + str(_edges) + ", degrees from " + _a + " to " + _b + " should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "[0, 2, 3, None]", "The program should print [0, 2, 3, None]"
