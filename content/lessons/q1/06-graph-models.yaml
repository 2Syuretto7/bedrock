          assert _got == 2, "With asha following bilal and chitra, bilal following esha, chitra following dev and dev following esha, degrees from asha to esha should be 2, not " + str(_got)
          _people = ["asha", "bilal", "chitra", "dev", "esha", "farhan", "gita", "hari"]
