        explanation: |
          The recursive query finds paths: Chitra at hop 1 and again at hop 2, Dev along two paths, and Asha herself through Chitra. Counting distinct people other than the start counts each person once. Keeping `hops > 0` still counts Asha when a cycle returns to her, and switching to `union` removes only rows identical in both person and hop count.
    - question:
        id: write-degrees
        type: code
        mode: write
        system: s2
        prompt: |
          Change `degrees` so that it returns the fewest follows hops from `a` to `b`, following each edge only in its own direction: 0 when `a` and `b` are the same person, and `None` when `b` cannot be reached. The program should print `[0, 2, 3, None]`.
