        solution: |
          import sqlite3
          from collections import deque

          db = sqlite3.connect(":memory:")
          db.executescript("""
              create table follows (src text not null, dst text not null, primary key (src, dst));
              insert into follows values
                  ('asha', 'bilal'), ('asha', 'chitra'), ('bilal', 'chitra'), ('bilal', 'dev'),
                  ('chitra', 'dev'), ('chitra', 'asha'), ('dev', 'esha'), ('farhan', 'asha');
          """)


          def degrees(db, a, b):
              following = {}
              for src, dst in db.execute("select src, dst from follows"):
                  if src not in following:
                      following[src] = []
                  following[src].append(dst)
              hops = {a: 0}
              queue = deque([a])
              while queue:
                  person = queue.popleft()
                  if person == b:
                      return hops[person]
                  for other in following.get(person, []):
                      if other not in hops:
                          hops[other] = hops[person] + 1
                          queue.append(other)
              return None


          print([degrees(db, "asha", p) for p in ["asha", "dev", "esha", "farhan"]])
