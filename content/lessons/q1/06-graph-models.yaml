                for src, dst in db.execute("select src, dst from follows"):
                    for x, y in [(src, dst), (dst, src)]:
                        if x not in following:
                            following[x] = []
                        following[x].append(y)
                hops = {a: 0}
                queue = deque([a])
                while queue:
                    person = queue.popleft()
                    if person == b:
                        return hops[person]
                    for other in following.get(person, []):
