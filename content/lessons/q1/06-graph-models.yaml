concept: q1.graph-models
minutes: 80
claim: You can model data as a property graph or as triples, store a graph in a nodes table and an edges table, write fixed-hop queries as self-joins and variable-hop queries as recursive queries that survive cycles, estimate how fast a traversal fans out, find shortest hop counts with breadth-first search, and say when a graph model fits the questions an application asks.
recalls: [q1.document-models]
uses: [s2.graphs-and-their-representations, f3.graph-theory-basics, q0.joins, q0.subqueries-and-common-table-expressions, s3.breadth-first-and-depth-first-search, s3.shortest-paths, f2.relations-and-functions-between-sets]
leads: [q1.schema-evolution-and-compatibility]
starter: |
  # Scratch space. A small follows graph, and everyone within two hops of Asha.
  import sqlite3

  db = sqlite3.connect(":memory:")
  db.executescript("""
      create table follows (src text not null, dst text not null, primary key (src, dst));
      insert into follows values ('asha', 'bilal'), ('bilal', 'chitra'), ('chitra', 'asha'), ('bilal', 'dev');
  """)
  print(db.execute("""
      with recursive reach(person, hops) as (
          select 'asha', 0
          union
          select f.dst, r.hops + 1 from reach r join follows f on f.src = r.person where r.hops < 2
      )
      select person, hops from reach order by hops, person
  """).fetchall())
parts:
  recall:
    - text: |
        [[q1.document-models]] nested what belongs to one parent and referred to what is shared, and found that many-to-many relationships fit a tree badly. Some data is almost nothing but many-to-many relationships: who follows whom, which station connects to which, which account sent money to which. For that data, the relationships themselves are the thing worth storing and querying. Three quick pulls first.
  puzzle:
    - text: |
        A social app suggests "people you may know" by walking outwards from a user along follows: the people she follows, the people they follow, and the people those follow. Every user follows exactly 200 accounts, and the walk does not remember whom it has already seen.

        **How many follow edges does the walk read for one user, out to three hops?**
  intuition:
    - text: |
        Open a railway map. It shows stations and the tracks between them, and nearly every question you ask of it is about connections: can I get from Churchgate to Thane, how many stops is it, where must I change lines, is there a route that avoids the bridge under repair? None of these is a question about one station. Each is about paths, and you cannot know in advance how long the path will be.

        A **graph model** stores data the way that map does: things as **nodes**, connections as **edges**, and both carrying properties. The figure shows a small friendship graph. Step the number of hops up from Asha and watch who is reached.
    - figure: graph-hops
      props: { hops: 1 }
    - text: |
        One hop reaches Asha's three friends; two hops reach their friends; Jai is four hops away. In tables, each hop is one more join of the friendships table to itself, so the number of hops must be written into the query. A graph query asks for "any number of hops" directly, and the reach is decided by the data. Notice also how quickly the reached set grows with each hop; in a real network, where people have hundreds of friends, that growth is the whole story of graph queries.
  derivation:
    - text: |
        **The property graph.** The graphs of [[f3.graph-theory-basics]] and [[s2.graphs-and-their-representations]] had bare vertices and edges. A **property graph** dresses them up. Each node has a label, such as Person, Post or City, and properties, such as a name. Each edge has a type, such as FOLLOWS, LIKES or LIVES_IN, a direction, and properties of its own, such as the date a follow began. Anything may connect to anything: a person follows a person, likes a post, lives in a city. A new kind of relationship is just a new edge type; no new table, no migration.

        **Triples.** An even plainer model stores every fact as a **triple**, subject, predicate, object: (asha, knows, bilal), (bilal, lives_in, Pune). That is the binary relation of [[f2.relations-and-functions-between-sets]] with a name attached. The whole database is one long list of triples, as in Wikidata and other knowledge graphs, and a query is a pattern of triples with blanks to fill: "asha knows ?x, ?x lives_in ?city".
    - question:
        id: derivation-triples
        type: choice
        system: s2
        prompt: |
          A triple store holds (asha, knows, bilal), (bilal, lives_in, Pune) and (asha, lives_in, Delhi). Which pattern finds the cities where Asha's acquaintances live?
        options:
          - "asha knows ?x, then ?x lives_in ?city"
          - "asha lives_in ?city"
          - "?x knows asha, then asha lives_in ?city"
          - "asha knows ?city"
        answer: 0
        explanation: |
          The first triple binds ?x to each person Asha knows, and the second follows each of them to a city. The other patterns find Asha's own city, the wrong direction of acquaintance, or people rather than cities.
    - text: |
        **A graph in two tables.** A relational database can hold any graph: a nodes table and an edges table `(src, dst, type)`, which is the edge-list representation. One hop is a join of edges to itself on `a.dst = b.src`, from [[q0.joins]]; two hops is two joins; a query for exactly four hops needs four copies of the edges table. That works when the number of hops is fixed and small.

        For "any number of hops", SQL has the recursive common table expression of [[q0.subqueries-and-common-table-expressions]]. Start with the first person; each round joins the rows found so far to the edges and adds the people one step further. That is the breadth-first search of [[s3.breadth-first-and-depth-first-search]], carried out by the database. Two cautions. A graph with a cycle, Asha follows Bilal who follows Asha, makes `union all` add rows forever, while `union` stops once a round adds nothing new; and if each row carries its hop count, even `union` sees (bilal, 1) and (bilal, 3) as different rows, so a depth limit such as `where r.hops < 3` is needed too. Second, the rows found are paths, not people: the same person reached along two paths appears twice, so count with `count(distinct person)`.
    - question:
        id: order-recursive
        type: order
        system: s2
        prompt: |
          Put the steps of a recursive query for everyone within two hops of Asha in order.
        steps:
          - "Start the result with Asha at hop 0."
          - "Join the rows at hop 0 to the follows table to add the people at hop 1."
          - "Join the rows at hop 1 to the follows table to add the people at hop 2."
          - "Stop, because the depth limit lets no row at hop 2 go further."
          - "Count the distinct people found, leaving out Asha."
        explanation: |
          Each round reads only the previous round's rows, exactly like a breadth-first frontier. The count comes last and must remove both repeats and the start.
    - text: |
        **Fan-out.** If every person has $d$ friends, one hop reads $d$ edges, two hops $d^2$ more, and $k$ hops about $d + d^2 + \dots + d^k$. With $d$ in the hundreds, three hops already read lakhs of edges. Graph databases such as Neo4j store each node's edges next to the node, so following an edge is a pointer and not an index search, which makes each step cheap. Nothing makes $d^k$ small, though. The cures are the ones from search: remember whom you have seen, so each person is expanded once; limit the depth; and prune, for example by following only close friends. Shortest connections, "how many handshakes from Asha to Jai", are the breadth-first distances of [[s3.shortest-paths]], and stopping as soon as the target is found saves most of the work.
    - question:
        id: derivation-fanout
        type: numeric
        system: s2
        prompt: |
          Each person knows exactly 50 others. A walk out to two hops does not remember whom it has seen. How many edges does it read?
        answer: "2550"
        explanation: |
          $50$ at the first hop and $50 \times 50 = 2{,}500$ at the second, $2{,}550$ in all.
    - text: |
        **Graph query languages.** In Cypher, the language of Neo4j and several other graph databases, "everyone Asha follows, up to three hops away" is `MATCH (a:Person {name: 'Asha'})-[:FOLLOWS*1..3]->(p) RETURN DISTINCT p`. The pattern is drawn in ASCII: round brackets for nodes, square brackets for edges, an arrow for direction, `*1..3` for one to three hops. SPARQL queries triple stores with patterns of triples, and the SQL standard has added graph patterns of the same shape. The syntax differs; the idea is the same pattern match over nodes and edges.

        **When a graph fits.** Choose a graph model when the important questions are about paths and connections of unknown length: recommendations, fraud rings where money moves through chains of accounts, dependency graphs, route planning, access rules that pass through nested groups. Choose tables when the questions are totals over many rows, such as sales by store by month, which graph databases handle no better and often worse. Many systems keep the source of truth in tables and copy the relationships into a graph for the traversals, which is denormalisation once more, with the costs you now know.
  formal:
    - text: |
        **Property graph.** Nodes and directed edges, each with a label or type and a set of properties.

        **Triple.** A fact (subject, predicate, object); a triple store holds a graph as a set of triples and is queried with patterns containing variables.

        **Graph in tables.** `nodes(id, …)` and `edges(src, dst, type, …)`. Exactly $k$ hops: $k$ self-joins of edges. Any number of hops: a recursive query.

        **Recursive reach.** `with recursive reach(node, hops) as (select start, 0 union select e.dst, r.hops + 1 from reach r join edges e on e.src = r.node where r.hops < limit)`. Use a depth limit or `union` to survive cycles, and `count(distinct …)` to count nodes rather than paths.

        **Fan-out.** With $d$ edges per node, a walk to $k$ hops that does not remember visited nodes reads $d + d^2 + \dots + d^k$ edges.

        **Shortest hop count.** Breadth-first search from the start, recording each node's hop count when it is first seen.
  drill:
    - text: Seconds each. For every query, ask how many hops and whether a cycle can bring someone back.
    - question:
        id: drill-joins
        type: numeric
        system: s1
        prompt: |
          A plain SQL query, without recursion, finds people exactly 4 follows away. How many copies of the follows table does it join?
        answer: "4"
        explanation: One copy per hop.
    - question:
        id: drill-union-all
        type: choice
        system: s1
        prompt: |
          A recursive query with `union all` and no depth limit walks a follows graph in which Asha follows Bilal and Bilal follows Asha. What happens?
        options:
          - "It never finishes, adding Asha and Bilal again every round."
          - "It returns Asha and Bilal once each."
          - "It returns nothing."
          - "SQLite refuses the query."
        answer: 0
        explanation: "`union all` keeps every new row, so the cycle produces new rows forever. `union` would stop once a round adds nothing new."
    - question:
        id: drill-fanout
        type: numeric
        system: s1
        prompt: |
          Every node has 10 edges. How many edges does a walk read at its third hop alone, if it never remembers whom it has seen?
        answer: "1000"
        explanation: $10^3$.
    - question:
        id: drill-fit
        type: choice
        system: s1
        prompt: |
          Which question most needs a graph model?
        options:
          - "Is account A connected to account B through any chain of transfers?"
          - "What were the total sales per store last month?"
          - "What is the average order value?"
          - "Which products cost more than ₹500?"
        answer: 0
        explanation: Only the first is about paths of unknown length; the others are filters and totals that tables answer well.
    - question:
        id: predict-union
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import sqlite3
          db = sqlite3.connect(":memory:")
          db.executescript("""
              create table follows (src text, dst text);
              insert into follows values ('a', 'b'), ('b', 'c'), ('c', 'a'), ('b', 'd');
          """)
          print(db.execute("""
              with recursive reach(p) as (
                  select 'a' union select f.dst from reach r join follows f on f.src = r.p
              )
              select count(*) from reach
          """).fetchone()[0])
        output: "4"
        explanation: "`union` drops rows already found, so when the cycle leads back to 'a' nothing new is added and the query stops with a, b, c and d."
    - question:
        id: predict-bfs
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          from collections import deque
          follows = {"asha": ["bilal", "chitra"], "bilal": ["dev"], "chitra": ["dev", "asha"], "dev": ["esha"]}
          hops = {"asha": 0}
          queue = deque(["asha"])
          while queue:
              p = queue.popleft()
              for q in follows.get(p, []):
                  if q not in hops:
                      hops[q] = hops[p] + 1
                      queue.append(q)
          print(hops["dev"], hops["esha"], len(hops))
        output: "2 3 5"
        explanation: Dev is first seen from Bilal at hop 2, Esha from Dev at hop 3, and the five people are each recorded once; Chitra's edge back to Asha adds nothing.
  work:
    - text: Slower now. Each problem walks a graph; check cycles, repeats and direction.
    - question:
        id: fix-reach-count
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `query` should count the people Asha can reach in one or two hops along follows, not counting Asha herself. The program should print `3`. It prints `6`. Find the fault and fix it.
        starter: |
          import sqlite3

          query = """
              with recursive reach(person, hops) as (
                  select :start, 0
                  union all
                  select f.dst, r.hops + 1
                  from reach r join follows f on f.src = r.person
                  where r.hops < 2
              )
              select count(*) from reach where hops > 0
          """

          db = sqlite3.connect(":memory:")
          db.executescript("""
              create table follows (src text not null, dst text not null, primary key (src, dst));
              insert into follows values
                  ('asha', 'bilal'), ('asha', 'chitra'), ('bilal', 'chitra'), ('bilal', 'dev'),
                  ('chitra', 'dev'), ('chitra', 'asha'), ('dev', 'esha');
          """)
          print(db.execute(query, {"start": "asha"}).fetchone()[0])
        solution: |
          import sqlite3

          query = """
              with recursive reach(person, hops) as (
                  select :start, 0
                  union all
                  select f.dst, r.hops + 1
                  from reach r join follows f on f.src = r.person
                  where r.hops < 2
              )
              select count(distinct person) from reach where person != :start
          """

          db = sqlite3.connect(":memory:")
          db.executescript("""
              create table follows (src text not null, dst text not null, primary key (src, dst));
              insert into follows values
                  ('asha', 'bilal'), ('asha', 'chitra'), ('bilal', 'chitra'), ('bilal', 'dev'),
                  ('chitra', 'dev'), ('chitra', 'asha'), ('dev', 'esha');
          """)
          print(db.execute(query, {"start": "asha"}).fetchone()[0])
        tests: |
          import random as _random

          _rng = _random.Random(62)
          _people = ["asha", "bilal", "chitra", "dev", "esha", "farhan", "gita"]
          for _ in range(30):
              _edges = sorted({(_a, _b) for _a in _people for _b in _people if _a != _b and _rng.random() < 0.25})
              _db = sqlite3.connect(":memory:")
              _db.execute("create table follows (src text not null, dst text not null, primary key (src, dst))")
              _db.executemany("insert into follows values (?, ?)", _edges)
              _start = _rng.choice(_people)
              _one = {_b for _a, _b in _edges if _a == _start}
              _two = {_b for _a, _b in _edges if _a in _one}
              _want = len((_one | _two) - {_start})
              _got = _db.execute(query, {"start": _start}).fetchone()[0]
              assert _got == _want, "With follows " + str(_edges) + ", " + _start + " reaches " + str(_want) + " other people in one or two hops, not " + str(_got)
          assert output.strip() == "3", "The program should print 3"
