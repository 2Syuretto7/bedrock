          - |
            import sqlite3
            from collections import deque

            db = sqlite3.connect(":memory:")
            db.executescript("""
                create table follows (src text not null, dst text not null, primary key (src, dst));
                insert into follows values
                    ('asha', 'bilal'), ('asha', 'chitra'), ('bilal', 'chitra'), ('bilal', 'dev'),
                    ('chitra', 'dev'), ('chitra', 'asha'), ('dev', 'esha'), ('farhan', 'asha');
            """)


            def degrees(db, a, b):
                following = {}
                for src, dst in db.execute("select src, dst from follows"):
                    if src not in following:
                        following[src] = []
                    following[src].append(dst)
                hops = {}
                queue = deque()
                for other in following.get(a, []):
                    hops[other] = 1
                    queue.append(other)
                while queue:
                    person = queue.popleft()
                    if person == b:
                        return hops[person]
                    for other in following.get(person, []):
                        if other not in hops:
                            hops[other] = hops[person] + 1
                            queue.append(other)
                return None


            print([degrees(db, "asha", p) for p in ["asha", "dev", "esha", "farhan"]])
        explanation: |
          Breadth-first search with a queue sees every person at hop $k$ before anyone at hop $k + 1$, so the first hop count recorded is the smallest. A stack explores one branch deeply first and can record a longer route; adding each edge in both directions finds Farhan, who follows Asha but is not followed by her; and starting from Asha's followees without Asha herself gives the wrong answer when `a` is `b`.
    - question:
        id: write-friend-cities
        type: code
        mode: write
        system: s2
        prompt: |
          The facts are stored as triples. Change `query` so that it returns the distinct cities that the people `:person` knows live in, in alphabetical order. The program should print `[('Kochi',), ('Pune',)]`.
        starter: |
          import sqlite3

          query = """
              select object from triples
              where subject = :person and predicate = 'knows'
              order by object
          """

          db = sqlite3.connect(":memory:")
          db.executescript("""
              create table triples (subject text not null, predicate text not null, object text not null);
              insert into triples values
                  ('asha', 'knows', 'bilal'), ('asha', 'knows', 'chitra'), ('asha', 'knows', 'dev'),
                  ('asha', 'blocked', 'farhan'), ('asha', 'lives_in', 'Delhi'),
                  ('bilal', 'lives_in', 'Pune'), ('bilal', 'knows', 'esha'),
                  ('chitra', 'lives_in', 'Kochi'), ('chitra', 'born_in', 'Madurai'),
                  ('dev', 'lives_in', 'Pune'), ('esha', 'lives_in', 'Jaipur'), ('farhan', 'lives_in', 'Agra');
          """)
          print(db.execute(query, {"person": "asha"}).fetchall())
        solution: |
          import sqlite3

          query = """
              select distinct c.object
              from triples k join triples c on c.subject = k.object
              where k.subject = :person and k.predicate = 'knows' and c.predicate = 'lives_in'
              order by c.object
          """

          db = sqlite3.connect(":memory:")
          db.executescript("""
              create table triples (subject text not null, predicate text not null, object text not null);
              insert into triples values
                  ('asha', 'knows', 'bilal'), ('asha', 'knows', 'chitra'), ('asha', 'knows', 'dev'),
                  ('asha', 'blocked', 'farhan'), ('asha', 'lives_in', 'Delhi'),
                  ('bilal', 'lives_in', 'Pune'), ('bilal', 'knows', 'esha'),
                  ('chitra', 'lives_in', 'Kochi'), ('chitra', 'born_in', 'Madurai'),
                  ('dev', 'lives_in', 'Pune'), ('esha', 'lives_in', 'Jaipur'), ('farhan', 'lives_in', 'Agra');
          """)
          print(db.execute(query, {"person": "asha"}).fetchall())
        tests: |
          import random as _random

          _rng = _random.Random(64)
          _people = ["asha", "bilal", "chitra", "dev", "esha", "farhan"]
          _cities = ["Agra", "Delhi", "Jaipur", "Kochi", "Madurai", "Pune"]
          for _ in range(30):
              _facts = set()
              for _p in _people:
                  _facts.add((_p, "lives_in", _rng.choice(_cities)))
                  if _rng.random() < 0.4:
                      _facts.add((_p, "born_in", _rng.choice(_cities)))
                  for _q in _people:
                      if _q != _p and _rng.random() < 0.3:
                          _facts.add((_p, _rng.choice(["knows", "knows", "blocked"]), _q))
              _facts = sorted(_facts)
              _db = sqlite3.connect(":memory:")
              _db.execute("create table triples (subject text not null, predicate text not null, object text not null)")
              _db.executemany("insert into triples values (?, ?, ?)", _facts)
              _who = _rng.choice(_people)
              _friends = {_o for _s, _r, _o in _facts if _s == _who and _r == "knows"}
              _want = [(_c,) for _c in sorted({_o for _s, _r, _o in _facts if _s in _friends and _r == "lives_in"})]
              _got = _db.execute(query, {"person": _who}).fetchall()
              assert _got == _want, "With the triples " + str(_facts) + ", the cities where the people " + _who + " knows live are " + str(_want) + ", not " + str(_got)
          assert output.strip() == "[('Kochi',), ('Pune',)]", "The program should print [('Kochi',), ('Pune',)]"
        wrong:
