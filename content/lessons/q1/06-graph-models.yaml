        explanation: |
          The pattern "person knows ?x, ?x lives_in ?city" is a join of the triples table to itself, with each copy filtered by its own predicate. Without the `lives_in` filter, birthplaces and acquaintances come back as cities; without `distinct`, Pune appears once per friend there; and without the `knows` filter, the people Asha has blocked count as friends.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          How many follow edges does the puzzle's walk read for one user, out to three hops?
        answer: "8040200"
        explanation: |
          $200 + 200^2 + 200^3 = 200 + 40{,}000 + 80{,}00{,}000 = 80{,}40{,}200$ edges.
    - question:
        id: work-model
        type: choice
        system: s2
        prompt: |
          A bank wants to flag accounts that sit within four transfers of a known fraudulent account, and also to report total deposits per branch each month. Which design fits?
        options:
          - "Keep accounts and transfers in tables for the reports, and query the transfers as a graph for the four-hop check."
          - "Store everything as one document per branch with its accounts and transfers nested."
          - "Use only a graph database and compute monthly totals by walking every edge."
          - "Answer the four-hop check with four separate queries written by hand for each account."
        answer: 0
        explanation: |
          The fraud check is a bounded traversal of unknown paths, which a graph or a recursive query answers directly, while the monthly totals are an aggregate over many rows, which tables answer well. Nesting transfers in branch documents breaks every transfer between branches.
  connections:
    - text: |
        80,40,200 edges for one user: 200 at the first hop, 40,000 at the second and 80 lakh at the third. Remembering whom the walk has already seen cuts this sharply, because friends of friends overlap heavily, but the lesson stands: every extra hop multiplies the work, so real recommendation systems stop at two or three hops and keep only the most promising people at each step.

        Three models now sit side by side. Tables make totals and constraints easy, documents make reading a whole object easy, and graphs make paths easy. Each stores the same facts in a different shape, and each faces the same problem once it is in use: the shape must change while old data and old programs are still running. That is [[q1.schema-evolution-and-compatibility]].
