        explanation: |
          A reader under schema on read must handle every shape ever stored: no name, a string, and an object with or without a last name. `doc["name"]` crashes on a guest; joining with `name.get("last", "")` leaves a trailing space; and reading `name["last"]` unconditionally crashes on a version 2 user with only a first name.
