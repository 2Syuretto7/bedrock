    - question:
        id: work-catalogue
        type: choice
        system: s2
        prompt: |
          A grocery app shows a product page with the product's name, price, its 4 to 6 photos and its seller's name and rating. A seller lists about 3,000 products and their rating changes daily. Which document design fits?
        options:
          - "Nest the photos in the product; store the seller's id and fetch the seller separately."
          - "Nest the photos and the seller's name and rating in every product."
          - "Store each photo as its own document referencing the product."
          - "Nest all of the seller's products inside the seller's document."
        answer: 0
        explanation: |
          Photos belong to one product, are few and are always shown with it, so they nest. Copying the seller's rating into 3,000 products would mean 3,000 rewrites a day, and nesting 3,000 products inside the seller makes one huge document that every product page must read.
  connections:
    - text: |
        20 days: the document holds $1{,}60{,}00{,}000 \div 400 = 40{,}000$ messages, and a busy group sends 2,000 a day. Long before then, every new message rewrites a document of several megabytes and every screen that wants the latest 20 messages reads all of them. Real chat systems store each message as its own record keyed by group and time, which is the normalised table the document model seemed to escape.

        The document model shines for trees: an object with parts that belong to it alone. Data where everything can connect to everything, such as people who follow people, stations linked by trains or papers citing papers, is neither a tree nor comfortably a set of tables, and has a model of its own in [[q1.graph-models]]. And schema on read means that every shape of document the app has ever written is still in the database, waiting for a reader; changing a shape safely while old code and old data are still around is [[q1.schema-evolution-and-compatibility]].
