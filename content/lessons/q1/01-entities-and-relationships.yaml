    - question:
        id: work-cuisines
        type: choice
        system: s2
        prompt: |
          A food app stores each restaurant's cuisines in one text column, such as 'South Indian, Chinese'. Searching by cuisine is slow and the spellings drift. What design fixes this?
        options:
          - "A cuisines table, and a junction table restaurant_cuisines with a foreign key to each side."
          - "Columns cuisine1, cuisine2 and cuisine3 in restaurants."
          - "An index on the cuisines column."
          - "A cuisine column in restaurants holding just the main cuisine."
        answer: 0
        explanation: |
          A restaurant serves many cuisines and a cuisine is served by many restaurants, so the relationship is many to many and needs a junction table. Numbered columns cap the count and make every query check three columns; an index cannot search inside a list; and keeping one cuisine throws facts away.
  connections:
    - text: |
        Four: students, teachers, batches, and enrolments. The teacher's phone number sits in one row of teachers, the subject in one row of batches, and each fee in one row of enrolments. Folding teachers into batches would repeat a teacher's details in every batch they take; putting the fee in students would leave no place for a second batch's fee.

        "No fact written twice" was decided here by judgement, from nouns, verbs and cardinalities. There is a precise version of the same idea, which can check a design rather than trust it: which columns determine which others, written as functional dependencies, and which sets of columns determine everything, the keys. That is [[q1.keys-and-functional-dependencies]], and it leads to the normal forms of [[q1.normal-forms]]. Not every system stores entities as rows: the nested records of [[q1.document-models]] make different choices about the same relationships.
