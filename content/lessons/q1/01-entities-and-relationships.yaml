        explanation: |
          An order line is a weak entity: its key is the owner's key plus its number, `primary key (order_id, line_no)`, and `on delete cascade` removes it with its order. Keying by `line_no` alone allows only one order to have a line 1; without the cascade, deleting an order with lines is refused; and without the foreign key a line can belong to an order that does not exist.
