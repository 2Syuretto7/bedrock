            fds = [
                ({"student"}, {"phone"}),
                ({"batch"}, {"subject", "teacher"}),
                ({"student", "batch"}, {"fee"}),
                ({"student", "batch"}, {"student"}),
            ]
            print(bcnf_violations(columns, fds))
        explanation: |
          A left side is a superkey exactly when its closure is every column, and trivial dependencies never break a normal form. Forgetting to skip trivial dependencies reports harmless ones; testing whether the left and right sides together cover every column ignores what the left side decides through other dependencies; and checking only one-column left sides misses violations such as (a, b) → c.
