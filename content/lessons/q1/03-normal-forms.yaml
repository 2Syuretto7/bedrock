    - question:
        id: work-tutoring
        type: choice
        system: s2
        prompt: |
          `tutoring (student, subject, teacher)` has keys (student, subject) and (student, teacher), and teacher → subject. The team must choose between keeping it and splitting it into (teacher, subject) and (student, teacher). What does each choice cost?
        options:
          - "Keeping it repeats each teacher's subject for every student; splitting it means no key can enforce one teacher per student per subject."
          - "Keeping it loses rows; splitting it is free."
          - "Splitting it is lossy; keeping it is free."
          - "Both choices store every fact once."
        answer: 0
        explanation: |
          The table is in third normal form but not Boyce-Codd: teacher → subject repeats. The Boyce-Codd split is lossless, but the rule (student, subject) → teacher now spans two tables and needs a check outside any key, such as a trigger or application code.
  connections:
    - text: |
        120 rows: 40, 35 and 45 students, each row carrying Rao's phone. If one of the 120 updates fails or is forgotten, the institute holds two phone numbers for one teacher and cannot tell which is right. In third normal form, the same change is one row.

        Normalisation trades repetition for joins: the report that once read one wide table now joins four. Most of the time that trade is right, because joins on keys are cheap with the indexes the keys bring. Sometimes a read is so frequent, or the data so rarely changes, that storing a fact twice on purpose is worth its cost, and [[q1.denormalisation-and-its-costs]] is about doing that knowingly. Systems that keep related facts nested inside one record, the [[q1.document-models]], make that trade by default.
