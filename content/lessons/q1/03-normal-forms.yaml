        explanation: |
          The two tables shared only subject, which is not a key of batches, so every Physics enrolment joined with both Physics batches. Sharing batch, the key of batches, makes the split lossless. Sharing the teacher fails the same way when a teacher takes two batches; dropping the fee loses a fact; and putting the fee into batches gives a batch one row per fee.
    - question:
        id: write-bcnf-violations
        type: code
        mode: write
        system: s2
        prompt: |
          Write `bcnf_violations(columns, fds)`, returning `(sorted left, sorted right)` for each non-trivial dependency whose left side is not a superkey, in the order given. A dependency is trivial when its right side lies inside its left side. `closure` is written for you. The program should print `[(['student'], ['phone']), (['batch'], ['subject', 'teacher'])]`.
        starter: |
          def closure(attributes, fds):
              result = set(attributes)
              changed = True
              while changed:
                  changed = False
                  for left, right in fds:
                      if left <= result and not right <= result:
                          result = result | right
                          changed = True
              return result


          def bcnf_violations(columns, fds):
              # Return (sorted left, sorted right) for every dependency that breaks Boyce-Codd normal form, in the order given.
              return []


          columns = {"student", "phone", "batch", "subject", "teacher", "fee"}
          fds = [
              ({"student"}, {"phone"}),
              ({"batch"}, {"subject", "teacher"}),
              ({"student", "batch"}, {"fee"}),
              ({"student", "batch"}, {"student"}),
          ]
          print(bcnf_violations(columns, fds))
        solution: |
          def closure(attributes, fds):
              result = set(attributes)
              changed = True
              while changed:
                  changed = False
                  for left, right in fds:
                      if left <= result and not right <= result:
                          result = result | right
                          changed = True
              return result


          def bcnf_violations(columns, fds):
              # Return (sorted left, sorted right) for every dependency that breaks Boyce-Codd normal form, in the order given.
              found = []
              for left, right in fds:
                  if not right <= left and closure(left, fds) != columns:
                      found.append((sorted(left), sorted(right)))
              return found


          columns = {"student", "phone", "batch", "subject", "teacher", "fee"}
          fds = [
              ({"student"}, {"phone"}),
              ({"batch"}, {"subject", "teacher"}),
              ({"student", "batch"}, {"fee"}),
              ({"student", "batch"}, {"student"}),
          ]
          print(bcnf_violations(columns, fds))
        tests: |
          import random as _random


          def _cl(_attrs, _fds):
              _r = set(_attrs)
              _grew = True
              while _grew:
                  _grew = False
                  for _l, _rt in _fds:
                      if _l <= _r and not _rt <= _r:
                          _r = _r | _rt
                          _grew = True
              return _r


          _rng = _random.Random(31)
          for _ in range(50):
              _cols = set(["a", "b", "c", "d", "e"][: _rng.randint(2, 5)])
              _fds = []
              for _k in range(_rng.randint(1, 5)):
