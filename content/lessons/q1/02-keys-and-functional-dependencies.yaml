    - question:
        id: work-rule-or-pattern
        type: choice
        system: s2
        prompt: |
          A delivery app's analyst finds that in a year of data, every rider has worked from exactly one store, and proposes declaring rider → store and moving store into the riders table. What should be checked first?
        options:
          - "Whether the business promises that a rider never works from two stores, since the data only shows it has not happened yet."
          - "Whether the query proving it ran on all the rows."
          - "Whether store → rider holds as well."
          - "Nothing; a year of data is enough."
        answer: 0
        explanation: |
          A dependency is a rule, and declaring it changes what the database can store: once store lives in riders, a rider who moves between stores cannot be recorded. If riders can be reassigned, store belongs with each shift instead.
  connections:
    - text: |
        Three. (pnr, pax) is the obvious one, and (train, date, coach, berth) is the seat on the ticket. The third, (pnr, coach, berth), is easy to miss: a PNR fixes the train and date, so with the coach and berth it names one seat and therefore one passenger. Closures found it mechanically, where intuition stopped at two.

        Keys and dependencies are the tools for checking a design, not only for describing it. A table in which some column depends on something less than a whole key, as train_name depends on train here, stores the same fact in many rows: every passenger on the Karnataka Express repeats its name, and a rename must touch them all. The normal forms of [[q1.normal-forms]] name these situations and say how to split such tables, and [[q1.denormalisation-and-its-costs]] says when it is worth keeping the repetition on purpose.
