        explanation: |
          Grouping by train and counting distinct names finds every train with two spellings, each a counterexample to train → train_name. Counting rows instead of distinct names flags every train booked twice; grouping by name tests the reverse dependency, name → train; and grouping by train and name together finds repeated pairs, which are not conflicts.
