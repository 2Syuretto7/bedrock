              _r = set(_attrs)
              _grew = True
              while _grew:
                  _grew = False
                  for _l, _rt in _fds:
                      if _l <= _r and not _rt <= _r:
                          _r = _r | _rt
                          _grew = True
              return _r


          _rng = _random.Random(17)
          _names = ["a", "b", "c", "d", "e", "f", "g"]
          for _ in range(60):
              _fds = []
              for _k in range(_rng.randint(1, 6)):
                  _l = set(_rng.sample(_names, _rng.randint(1, 2)))
                  _fds.append((_l, set(_rng.sample(_names, _rng.randint(1, 2)))))
              _start = set(_rng.sample(_names, _rng.randint(0, 2)))
              _want = _closure(_start, _fds)
              _got = closure(set(_start), [(set(_l), set(_r)) for _l, _r in _fds])
              assert _got == _want, "The closure of " + str(sorted(_start)) + " under " + str([(sorted(_l), sorted(_r)) for _l, _r in _fds]) + " is " + str(sorted(_want)) + ", not " + str(sorted(_got))
          _chain = [({"e"}, {"f"}), ({"d"}, {"e"}), ({"c"}, {"d"}), ({"b"}, {"c"}), ({"a"}, {"b"})]
