    - question:
        id: write-candidate-keys
        type: code
        mode: write
        system: s2
        prompt: |
          Write `candidate_keys(columns, fds)`, returning every candidate key as a sorted tuple of column names, in sorted order. A candidate key is a set of columns whose closure is all of `columns` and that contains no smaller such set. `closure` is written for you. The program should print `[('berth', 'coach', 'date', 'train'), ('berth', 'coach', 'pnr'), ('pax', 'pnr')]`.
        starter: |
          from itertools import combinations


          def closure(attributes, fds):
              result = set(attributes)
              changed = True
              while changed:
                  changed = False
                  for left, right in fds:
                      if left <= result and not right <= result:
                          result = result | right
                          changed = True
              return result


