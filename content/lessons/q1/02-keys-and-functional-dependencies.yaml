    - question:
        id: write-violations
        type: code
        mode: write
        system: s2
        prompt: |
          A train number should have one name. Change `query` so that it returns the train numbers that appear in `bookings` under more than one name, each once, in order.
        starter: |
          import sqlite3

          query = """
              select train
              from bookings
              order by train
          """

          db = sqlite3.connect(":memory:")
          db.executescript("""
              create table bookings (pnr text, pax integer, train text, train_name text, date text);
              insert into bookings values
                  ('4521', 1, '12627', 'Karnataka Express', '2026-12-01'),
                  ('4521', 2, '12627', 'Karnataka Express', '2026-12-01'),
                  ('4733', 1, '12627', 'Karnataka Exp', '2026-12-02'),
                  ('4810', 1, '22691', 'Rajdhani Express', '2026-12-01'),
