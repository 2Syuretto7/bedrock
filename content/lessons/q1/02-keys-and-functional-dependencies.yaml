              # Return every minimal set of columns that determines all of columns, each as a sorted tuple, in sorted order.
              return []


          columns = {"pnr", "pax", "name", "train", "train_name", "date", "coach", "berth"}
          fds = [
              ({"pnr"}, {"train", "date"}),
              ({"train"}, {"train_name"}),
              ({"pnr", "pax"}, {"name", "coach", "berth"}),
              ({"train", "date", "coach", "berth"}, {"pnr", "pax"}),
          ]
          print(candidate_keys(columns, fds))
        solution: |
          from itertools import combinations


          def closure(attributes, fds):
              result = set(attributes)
              changed = True
              while changed:
                  changed = False
                  for left, right in fds:
                      if left <= result and not right <= result:
                          result = result | right
                          changed = True
              return result


          def candidate_keys(columns, fds):
              # Return every minimal set of columns that determines all of columns, each as a sorted tuple, in sorted order.
              keys = []
              for size in range(1, len(columns) + 1):
                  for combo in combinations(sorted(columns), size):
                      if closure(set(combo), fds) == columns and not any(set(key) <= set(combo) for key in keys):
                          keys.append(combo)
              return sorted(keys)


          columns = {"pnr", "pax", "name", "train", "train_name", "date", "coach", "berth"}
          fds = [
              ({"pnr"}, {"train", "date"}),
              ({"train"}, {"train_name"}),
              ({"pnr", "pax"}, {"name", "coach", "berth"}),
              ({"train", "date", "coach", "berth"}, {"pnr", "pax"}),
          ]
          print(candidate_keys(columns, fds))
