    - question:
        id: write-balance
        type: code
        mode: write
        system: s2
        prompt: |
          Write `best_split`, which cuts a chain of logic blocks into k stages so that the slowest stage is as fast as possible. The program should print the slowest stage for 1 to 4 stages: 580, 300, 210 and 170 ps.
        starter: |
          def best_split(delays, k):
              # delays lists the delays of a chain of logic blocks, in order. Cut the
              # chain into k stages of consecutive blocks, each stage at least one
              # block, so that the slowest stage is as fast as possible, and return
              # that slowest stage's delay. Try every place the first stage could end.
              return 0


          blocks = [50, 120, 80, 30, 90, 60, 40, 110]
          for k in range(1, 5):
              print(k, "stages: slowest stage", best_split(blocks, k), "ps")
        solution: |
          def best_split(delays, k):
              # delays lists the delays of a chain of logic blocks, in order. Cut the
              # chain into k stages of consecutive blocks, each stage at least one
              # block, so that the slowest stage is as fast as possible, and return
              # that slowest stage's delay. Try every place the first stage could end.
              if k == 1:
                  return sum(delays)
              best = None
              for end in range(1, len(delays) - k + 2):
                  slowest = max(sum(delays[:end]), best_split(delays[end:], k - 1))
                  if best is None or slowest < best:
                      best = slowest
              return best


          blocks = [50, 120, 80, 30, 90, 60, 40, 110]
          for k in range(1, 5):
              print(k, "stages: slowest stage", best_split(blocks, k), "ps")
        tests: |
          def _brute(_d, _k):
              if _k == 1:
                  return sum(_d)
              return min(max(sum(_d[:_e]), _brute(_d[_e:], _k - 1)) for _e in range(1, len(_d) - _k + 2))


          for _d, _k in [([5], 1), ([3, 4], 2), ([10, 1, 1, 1], 2), ([1, 1, 1, 10], 2), ([7, 2, 5, 10, 8], 2), ([7, 2, 5, 10, 8], 3), ([1, 2, 3, 4, 5, 6, 7, 8, 9], 3), ([9, 9, 1, 1, 1, 9], 4), ([4, 4, 4, 4], 4), ([60, 10, 10, 10, 10, 60], 3)]:
              _want = _brute(_d, _k)
              _got = best_split(_d, _k)
              assert _got == _want, "best_split(" + str(_d) + ", " + str(_k) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.splitlines() == ["1 stages: slowest stage 580 ps", "2 stages: slowest stage 300 ps", "3 stages: slowest stage 210 ps", "4 stages: slowest stage 170 ps"], "The program should print 580, 300, 210 and 170 ps"
        wrong:
