            def run_pipeline(orders, stages):
                # A pipeline, like a dosa counter where one cook pours the batter, one
                # adds the filling and one folds and serves. At every tick each order
                # moves on one stage, all at the same moment, and the next waiting
                # order enters stage 0. An order is finished at the tick it spends in
