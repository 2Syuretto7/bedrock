    - text: |
        104. The first instruction needs all five cycles to come out, and every later one comes out a cycle after the one before, so 100 instructions take 5 + 99 cycles, close to one per cycle. Without pipelining they would take 500.

        That calculation assumed nothing ever waits. But instructions depend on each other: an add may need the result of the instruction just before it, which has not been written back yet, and the pipeline fetches instructions after a branch before it knows which way the branch goes. [[h1.hazards-and-branch-prediction]] deals with both, by forwarding results early, stalling when it must, and guessing branches remarkably well.
