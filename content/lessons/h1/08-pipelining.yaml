          With one stage, the answer is the sum of all blocks. Otherwise try each end for the first stage, leaving at least one block for each remaining stage, and take the best of the larger of the first stage and the best split of the rest. Adding the stages instead of taking the slowest computes total delay, not the clock; the average of the blocks is a lower bound that real cuts rarely reach; and stopping the range one early misses the last possible cut, which for two blocks is the only one.
    - question:
        id: fix-dosa-pipeline
        type: code
        mode: find-bug
        system: s2
        prompt: |
          The simulated dosa counter has three stages, so the four orders should finish at ticks 3, 4, 5 and 6, and the program should print `{'masala': 3, 'plain': 4, 'onion': 5, 'ghee roast': 6}`. Instead every order finishes after 2 ticks, whatever the number of stages. Find the fault and fix it.
        starter: |
          def run_pipeline(orders, stages):
              # A pipeline, like a dosa counter where one cook pours the batter, one
              # adds the filling and one folds and serves. At every tick each order
              # moves on one stage, all at the same moment, and the next waiting
              # order enters stage 0. An order is finished at the tick it spends in
              # the last stage. Return a dict giving the tick each order finishes.
              slots = [None] * stages
              waiting = list(orders)
              finished = {}
              tick = 0
              while waiting or any(slot is not None for slot in slots):
                  tick += 1
                  for i in range(1, stages):
                      slots[i] = slots[i - 1]
                  slots[0] = waiting.pop(0) if waiting else None
                  if slots[-1] is not None:
                      finished[slots[-1]] = tick
                      slots[-1] = None
              return finished


          print(run_pipeline(["masala", "plain", "onion", "ghee roast"], 3))
        solution: |
          def run_pipeline(orders, stages):
              # A pipeline, like a dosa counter where one cook pours the batter, one
              # adds the filling and one folds and serves. At every tick each order
              # moves on one stage, all at the same moment, and the next waiting
              # order enters stage 0. An order is finished at the tick it spends in
              # the last stage. Return a dict giving the tick each order finishes.
              slots = [None] * stages
              waiting = list(orders)
              finished = {}
              tick = 0
              while waiting or any(slot is not None for slot in slots):
                  tick += 1
                  for i in range(stages - 1, 0, -1):
                      slots[i] = slots[i - 1]
                  slots[0] = waiting.pop(0) if waiting else None
                  if slots[-1] is not None:
                      finished[slots[-1]] = tick
                      slots[-1] = None
              return finished


          print(run_pipeline(["masala", "plain", "onion", "ghee roast"], 3))
        tests: |
          for _orders, _k in [(["a"], 1), (["a", "b"], 1), (["a"], 4), (["a", "b", "c"], 2), (["p", "q", "r", "s", "t"], 5), (["x", "y"], 3), ([], 3)]:
              _want = {_o: _k + _i for _i, _o in enumerate(_orders)}
              _got = run_pipeline(_orders, _k)
              assert _got == _want, "With " + str(len(_orders)) + " orders and " + str(_k) + " stages, they should finish at " + str(_want) + ", not " + str(_got)
          assert output.strip() == "{'masala': 3, 'plain': 4, 'onion': 5, 'ghee roast': 6}", "The program should print the four dosas finishing at ticks 3, 4, 5 and 6"
        wrong:
          - |
