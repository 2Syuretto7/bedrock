                slots = [None] * stages
                waiting = list(orders)
                finished = {}
                tick = 0
                while waiting or any(slot is not None for slot in slots):
                    for i in range(stages - 1, 0, -1):
                        slots[i] = slots[i - 1]
                    slots[0] = waiting.pop(0) if waiting else None
                    if slots[-1] is not None:
                        finished[slots[-1]] = tick
                        slots[-1] = None
                    tick += 1
                return finished


            print(run_pipeline(["masala", "plain", "onion", "ghee roast"], 3))
        explanation: |
          Moving the orders from the front of the line backwards copies stage 0's order into stage 1, then that same order into stage 2, and so on, so it shoots through every stage in one tick. Hardware pipeline registers all capture at once from their old values; a simulation gets the same effect by moving orders starting from the last stage. Stopping before stage 1 loses every order, recording before moving finishes each one a tick late, and counting ticks after recording finishes each a tick early.
