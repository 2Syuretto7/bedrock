        explanation: |
          NOT is a NAND with both inputs tied together, AND is NOT of NAND, and OR is NAND of the two negations by De Morgan's law. XOR shares one NAND of a and b between two NANDs that each combine it with one input; their NAND is XOR, four gates in all. The sum-of-products XOR is correct but uses far more NANDs.
    - question:
        id: fix-mux4
        type: code
        mode: find-bug
        system: s2
        prompt: |
          A 4-to-1 multiplexer picks one of four level-crossing sensors by its number. Reading the sensors for gates 0 to 3 in turn should print `sensor read for gates 0 to 3: [0, 1, 0, 1]`, but the program prints `sensor read for gates 0 to 3: [0, 0, 1, 1]`. Find the fault and fix it.
        starter: |
          def mux2(s, a, b):
              # A 2-to-1 multiplexer: a when s is 0, b when s is 1.
              return (a & (1 - s)) | (b & s)


          def mux4(s1, s0, inputs):
              # A 4-to-1 multiplexer built from three 2-to-1 multiplexers. The select
              # bits s1 s0 name the input numbered 2 * s1 + s0.
              low = mux2(s1, inputs[0], inputs[1])
              high = mux2(s1, inputs[2], inputs[3])
              return mux2(s0, low, high)


          # Four level-crossing sensors; only gates 1 and 3 report a train.
          sensors = [0, 1, 0, 1]
          picked = []
          for gate in range(4):
              picked.append(mux4(gate // 2, gate % 2, sensors))
          print("sensor read for gates 0 to 3:", picked)
        solution: |
          def mux2(s, a, b):
              # A 2-to-1 multiplexer: a when s is 0, b when s is 1.
              return (a & (1 - s)) | (b & s)


          def mux4(s1, s0, inputs):
              # A 4-to-1 multiplexer built from three 2-to-1 multiplexers. The select
              # bits s1 s0 name the input numbered 2 * s1 + s0.
              low = mux2(s0, inputs[0], inputs[1])
              high = mux2(s0, inputs[2], inputs[3])
              return mux2(s1, low, high)


          # Four level-crossing sensors; only gates 1 and 3 report a train.
          sensors = [0, 1, 0, 1]
          picked = []
          for gate in range(4):
              picked.append(mux4(gate // 2, gate % 2, sensors))
          print("sensor read for gates 0 to 3:", picked)
        tests: |
          for _pattern in range(16):
              _inputs = [(_pattern >> _i) & 1 for _i in range(4)]
              for _n in range(4):
