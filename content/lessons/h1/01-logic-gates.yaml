          DELAY = {"not": 1, "nand": 1, "nor": 1, "and": 2, "or": 2, "xor": 3}


          def settle(circuit, wire, memo):
              # circuit maps each gate's output wire to (gate kind, list of input wires).
              # A wire that is not in circuit is an input to the whole circuit, steady
              # from time 0. A gate's output settles DELAY[kind] after the last of its
              # inputs settles. Return when wire settles, recording answers in memo.
              if wire not in circuit:
                  return 0
              if wire in memo:
