                  assert _got == _inputs[_n], "With inputs " + str(_inputs) + ", select bits " + str(_n // 2) + " " + str(_n % 2) + " should pick input " + str(_n) + ", which is " + str(_inputs[_n]) + ", not " + str(_got)
          assert output.strip() == "sensor read for gates 0 to 3: [0, 1, 0, 1]", "The program should print the sensors in order: [0, 1, 0, 1]"
