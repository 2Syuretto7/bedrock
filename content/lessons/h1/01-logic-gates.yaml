                # The one gate you may use. a and b are each 0 or 1.
                return 1 - (a & b)


            def not_(a):
                # Build each gate below from nand alone: no and, or, not or bit operators.
                return nand(a, a)


            def and_(a, b):
                return not_(nand(a, b))


            def or_(a, b):
                return nand(not_(a), not_(b))


            def xor(a, b):
                # Use at most four calls to nand.
                return or_(a, b)


            print("a b | and or xor")
            for a in [0, 1]:
                for b in [0, 1]:
                    print(a, b, "|", and_(a, b), " ", or_(a, b), " ", xor(a, b))
          - |
