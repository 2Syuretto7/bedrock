    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. How many different two-input gates are there, counting every possible rule from the four input pairs to an output bit?
        answer: "16"
        explanation: |
          A two-input gate is fixed by its truth table of four rows, and each row's output can be 0 or 1, so there are 2⁴ = 16 of them.
    - question:
        id: work-clock
        type: choice
        system: s2
        prompt: |
          A designer speeds up one gate on a circuit's critical path, but the circuit's settling time does not change at all. What is the most likely reason?
        options:
          - "Another path through the circuit was exactly as slow, so it is now the critical path"
          - "Gate delays add up only on paths of more than ten gates"
          - "The settling time is set by the number of inputs, not by the gates"
          - "Speeding up any one gate never changes a circuit's settling time"
        answer: 0
        explanation: |
          The settling time is the longest path. If two paths tied for longest, shortening one leaves the other in charge, and the circuit is no faster until that one is shortened too.
  connections:
    - text: |
        16. A two-input gate is just a truth table of four rows, each 0 or 1, so there are 2⁴ of them. Six have names that appear in every textbook; the rest include the gates that ignore one input, the gate that always gives 0, and "a AND NOT b". NAND alone builds all 16, which is why a single kind of gate is enough for a whole processor.

        Gates so far only decide things. The next step is to make them count: [[h1.adders-and-the-alu]] wires gates into adders that add whole words, uses two's complement to subtract with the same circuit, and gathers the operations into the arithmetic logic unit at the centre of every processor.
