        explanation: |
          The machine moves the PC on after executing, so a taken branch sets the PC to the target and is then moved one past it, skipping the add. Moving the PC on during the fetch, before executing, lets a branch simply overwrite it, as real processors do. Jumping to two before the target reruns an instruction, branching when the register is zero ends the loop at once, and not counting the halt gives 16.
