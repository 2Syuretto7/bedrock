    - text: |
        34. Three instructions of setup, three per pass for ten passes, and the halt. The loop runs ten times because r1 counts down from 10 and the branch is taken until it reaches 0, so the count grows by 3 for every 1 added to n, exactly as in the figure.

        The toy machine's instructions were made up for this lesson. Real processors follow a published **instruction set**, a precise contract between hardware and software that compilers can target and chip designers can implement in many different ways. [[h1.an-instruction-set-risc-v]] introduces RISC-V, an open instruction set used from tiny microcontrollers to servers, and you will write your first programs in its assembly language.
