        id: work-nx
        type: choice
        system: s2
        prompt: |
          An attacker overflows a buffer in a web server, writing their own machine code into its data and pointing the program counter at it. Which defence stops those bytes being run?
        options:
          - "Marking memory that holds data as not executable, so fetching an instruction from it is refused"
          - "Making the clock faster"
          - "Storing the data in a register instead of memory"
          - "Using a ripple-carry adder"
        answer: 0
        explanation: |
          A stored-program machine runs whatever the PC points at. Modern processors let the operating system mark pages of memory as data only, so a fetch from them stops the program instead of running the attacker's bytes.
