    - question:
        id: write-decode
        type: code
        mode: write
        system: s2
        prompt: |
          Write `decode`, which slices a 16-bit instruction into its opcode name and three 4-bit fields. The program should print the toy machine's program from the figure, one instruction per line, starting with `0 0x1000 ('li', 0, 0, 0)`.
        starter: |
          NAMES = ["halt", "li", "add", "sub", "bnez", "load", "store", "jump"]


          def decode(word):
              # A 16-bit instruction: bits 15 to 12 hold the opcode, bits 11 to 8 the
              # register rd, bits 7 to 4 the register rs, and bits 3 to 0 a small
              # number imm. Return (name, rd, rs, imm), where name is NAMES[opcode].
              return ("halt", 0, 0, 0)


          program = [0x1000, 0x1103, 0x1201, 0x2010, 0x3120, 0x4103, 0x0000]
          for address, word in enumerate(program):
              print(address, hex(word), decode(word))
        solution: |
          NAMES = ["halt", "li", "add", "sub", "bnez", "load", "store", "jump"]


          def decode(word):
              # A 16-bit instruction: bits 15 to 12 hold the opcode, bits 11 to 8 the
              # register rd, bits 7 to 4 the register rs, and bits 3 to 0 a small
              # number imm. Return (name, rd, rs, imm), where name is NAMES[opcode].
              opcode = word >> 12
              rd = (word >> 8) & 0xF
              rs = (word >> 4) & 0xF
              imm = word & 0xF
              return (NAMES[opcode], rd, rs, imm)


          program = [0x1000, 0x1103, 0x1201, 0x2010, 0x3120, 0x4103, 0x0000]
          for address, word in enumerate(program):
              print(address, hex(word), decode(word))
        tests: |
          for _op in range(8):
              for _rd, _rs, _imm in [(0, 0, 0), (1, 2, 3), (15, 0, 15), (7, 9, 4), (0, 15, 0), (10, 11, 12)]:
                  _w = (_op << 12) | (_rd << 8) | (_rs << 4) | _imm
                  _want = (NAMES[_op], _rd, _rs, _imm)
                  _got = tuple(decode(_w))
                  assert _got == _want, "decode(" + hex(_w) + ") should be " + repr(_want) + ", not " + repr(_got)
          assert output.splitlines()[3] == "3 0x2010 ('add', 0, 1, 0)", "The fourth line should show address 3 as add r0, r1"
          assert len(output.splitlines()) == 7, "The program should print one line for each of the 7 words"
        wrong:
          - |
            NAMES = ["halt", "li", "add", "sub", "bnez", "load", "store", "jump"]


            def decode(word):
                # A 16-bit instruction: bits 15 to 12 hold the opcode, bits 11 to 8 the
                # register rd, bits 7 to 4 the register rs, and bits 3 to 0 a small
                # number imm. Return (name, rd, rs, imm), where name is NAMES[opcode].
                opcode = word >> 12
                rd = (word >> 8) & 0xFF
                rs = (word >> 4) & 0xF
                imm = word & 0xF
                return (NAMES[opcode], rd, rs, imm)


            program = [0x1000, 0x1103, 0x1201, 0x2010, 0x3120, 0x4103, 0x0000]
            for address, word in enumerate(program):
                print(address, hex(word), decode(word))
          - |
