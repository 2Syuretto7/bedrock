            NAMES = ["halt", "li", "add", "sub", "bnez", "load", "store", "jump"]


            def decode(word):
                # A 16-bit instruction: bits 15 to 12 hold the opcode, bits 11 to 8 the
                # register rd, bits 7 to 4 the register rs, and bits 3 to 0 a small
                # number imm. Return (name, rd, rs, imm), where name is NAMES[opcode].
                opcode = (word >> 8) & 0x7
                rd = (word >> 12) & 0xF
                rs = (word >> 4) & 0xF
                imm = word & 0xF
                return (NAMES[opcode], rd, rs, imm)


            program = [0x1000, 0x1103, 0x1201, 0x2010, 0x3120, 0x4103, 0x0000]
            for address, word in enumerate(program):
                print(address, hex(word), decode(word))
        explanation: |
          Shift each field down to the bottom and mask it to its width: word >> 12 for the opcode, then (word >> 8) & 0xF, (word >> 4) & 0xF and word & 0xF. A mask of 0xFF lets the opcode's bits leak into rd; swapping the shifts for rs and imm reads the fields in the wrong order; and shifting by the wrong amounts reads every field from the wrong place.
    - question:
        id: fix-branch-pc
        type: code
        mode: find-bug
        system: s2
        prompt: |
          The machine multiplies 3 by 4 by repeated addition, and should print `3 x 4 = 12 in 17 instructions`. Instead it prints `3 x 4 = 3 in 14 instructions`. Find the fault and fix it.
        starter: |
          def run(program):
              # program is a list of instructions, each a tuple:
              #   ("li", rd, n)     rd = n
              #   ("add", rd, rs)   rd = rd + rs
              #   ("sub", rd, rs)   rd = rd - rs
              #   ("bnez", rd, t)   if rd is not 0, continue at instruction t
              #   ("halt",)
              regs = [0] * 4
              pc = 0
              count = 0
              while True:
                  op = program[pc]
                  count += 1
                  name = op[0]
                  if name == "halt":
                      return regs, count
                  if name == "li":
                      regs[op[1]] = op[2]
                  elif name == "add":
                      regs[op[1]] += regs[op[2]]
                  elif name == "sub":
