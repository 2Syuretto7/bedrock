                # a_bits and b_bits hold the bits of two numbers, least significant
                # first, and have the same length. Chain one full adder per bit, each
                # taking the carry out of the one before. Return (sum bits, carry out).
                carry = carry_in
                total = []
                for a, b in zip(a_bits, b_bits):
                    bit, carry = full_adder(a, b, carry)
                    total.append(bit)
                return total, carry


            def to_bits(n, width):
                return [(n >> i) & 1 for i in range(width)]


            def from_bits(bits):
                return sum(bit << i for i, bit in enumerate(bits))


            for a, b in [(100, 55), (200, 100), (255, 1)]:
                total, carry = ripple_add(to_bits(a, 8), to_bits(b, 8), 0)
                print(a, "+", b, "=", from_bits(total), "carry", carry)
          - |
