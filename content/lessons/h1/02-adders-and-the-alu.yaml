              return x & 0xFF


          def to_signed(u):
              return u - 256 if u >= 128 else u


          def add_signed8(a, b):
              # Add two signed 8-bit numbers, -128 to 127, as the hardware does: add
              # their bit patterns and keep the low 8 bits. Return the signed result
              # and whether signed overflow happened.
              total = to_unsigned(a) + to_unsigned(b)
