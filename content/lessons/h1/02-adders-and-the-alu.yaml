                print(a, "+", b, "=", from_bits(total), "carry", carry)
        explanation: |
          The full adder's sum is the XOR of all three bits, and its carry is a AND b, or the carry in AND exactly one of a and b. The ripple adder walks from the least significant bit, feeding each carry out into the next adder. A carry that ignores the carry in, a chain that gives every adder the original carry in, or a walk that starts from the most significant bit all add the wrong columns together.
    - question:
        id: write-alu
        type: code
        mode: write
        system: s2
        prompt: |
          Write an 8-bit `alu` that adds, subtracts by adding the two's complement, ANDs and ORs, and sets the Z, N, C and V flags. The program should print five operations; the second, 100 + 100, should give 200 with N and V set.
        starter: |
          MASK = 0xFF


          def alu(op, a, b):
              # An 8-bit ALU. a and b are 0 to 255, and op is "add", "sub", "and" or "or".
              # Subtract the way the hardware does, by adding: a + (NOT b) + 1.
              # Return (result, flags). The result is 0 to 255. flags holds four bits:
              # Z, the result is 0; N, the top bit of the result is 1; C, the carry
              # out of bit 7; and V, signed overflow. For "and" and "or", C and V are 0.
              return 0, {"Z": 0, "N": 0, "C": 0, "V": 0}


          for op, a, b in [("add", 100, 27), ("add", 100, 100), ("sub", 5, 5), ("sub", 3, 5), ("and", 12, 10)]:
              result, flags = alu(op, a, b)
              print(op, a, b, "->", result, flags)
        solution: |
          MASK = 0xFF


          def alu(op, a, b):
              # An 8-bit ALU. a and b are 0 to 255, and op is "add", "sub", "and" or "or".
              # Subtract the way the hardware does, by adding: a + (NOT b) + 1.
              # Return (result, flags). The result is 0 to 255. flags holds four bits:
              # Z, the result is 0; N, the top bit of the result is 1; C, the carry
              # out of bit 7; and V, signed overflow. For "and" and "or", C and V are 0.
              if op == "and" or op == "or":
                  result = a & b if op == "and" else a | b
                  return result, {"Z": int(result == 0), "N": result >> 7, "C": 0, "V": 0}
              carry_in = 0
              if op == "sub":
                  b = ~b & MASK
                  carry_in = 1
              total = a + b + carry_in
              result = total & MASK
              same_signs = (a >> 7) == (b >> 7)
              overflow = int(same_signs and (result >> 7) != (a >> 7))
              return result, {"Z": int(result == 0), "N": result >> 7, "C": total >> 8, "V": overflow}


          for op, a, b in [("add", 100, 27), ("add", 100, 100), ("sub", 5, 5), ("sub", 3, 5), ("and", 12, 10)]:
              result, flags = alu(op, a, b)
              print(op, a, b, "->", result, flags)
        tests: |
          def _ref(_op, _a, _b):
              if _op in ("and", "or"):
                  _r = _a & _b if _op == "and" else _a | _b
                  return _r, {"Z": int(_r == 0), "N": _r >> 7, "C": 0, "V": 0}
              _sa = _a - 256 if _a >= 128 else _a
              _sb = _b - 256 if _b >= 128 else _b
              if _op == "add":
                  _t, _true = _a + _b, _sa + _sb
              else:
                  _t, _true = _a + (255 - _b) + 1, _sa - _sb
              _r = _t & 255
              return _r, {"Z": int(_r == 0), "N": _r >> 7, "C": _t >> 8, "V": int(not -128 <= _true <= 127)}


          _cases = [(0, 0), (1, 1), (5, 5), (3, 5), (100, 27), (100, 100), (127, 1), (128, 128), (200, 100), (255, 1), (128, 1), (0, 128), (127, 255), (250, 3), (60, 200)]
          for _op in ["add", "sub", "and", "or"]:
              for _a, _b in _cases:
                  _want = _ref(_op, _a, _b)
                  _got = alu(_op, _a, _b)
                  assert _got[0] == _want[0], "alu(" + repr(_op) + ", " + str(_a) + ", " + str(_b) + ") should give result " + str(_want[0]) + ", not " + str(_got[0])
                  for _f in "ZNCV":
                      assert _got[1][_f] == _want[1][_f], "alu(" + repr(_op) + ", " + str(_a) + ", " + str(_b) + ") should set " + _f + " to " + str(_want[1][_f]) + ", not " + str(_got[1][_f])
          assert len(output.splitlines()) == 5 and output.splitlines()[1] == "add 100 100 -> 200 {'Z': 0, 'N': 1, 'C': 0, 'V': 1}", "The program should print five lines, the second showing 100 + 100 overflowing"
        wrong:
