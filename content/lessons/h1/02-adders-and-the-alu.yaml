        id: work-lookahead
        type: choice
        system: s2
        prompt: |
          Why does a fast 64-bit processor not use a ripple-carry adder?
        options:
          - "Its delay grows in proportion to the width, while carry lookahead finds every carry in about log₂ 64 = 6 levels"
          - "A ripple-carry adder cannot add negative numbers"
          - "A ripple-carry adder needs more gates than carry lookahead"
          - "A ripple-carry adder cannot report a carry out"
        answer: 0
        explanation: |
          Ripple carry is the smallest adder, but its worst-case delay is 64 carry steps. Lookahead spends more gates to compute carries in a tree, so delay grows with the logarithm of the width instead.
  connections:
    - text: |
        64. The carry may have to pass through all 32 adders, 2 gate delays each. At a few picoseconds per gate that is still fast, but a processor adds in a fraction of one clock cycle, so real adders use carry lookahead and settle in a dozen or so gate delays instead.

        Gates and adders compute, but they forget: change the inputs and the old answer is gone. A processor must hold numbers from one instruction to the next. [[h1.latches-registers-and-memory]] adds feedback to gates so that they remember, and builds registers and memory from them.
