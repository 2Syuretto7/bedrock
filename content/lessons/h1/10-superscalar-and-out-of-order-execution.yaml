            def dataflow_cycles(program, latency):
                # program lists instructions as (destination, sources, operation), with
                # every destination written once. With unlimited hardware, an
                # instruction starts as soon as all its sources are ready, and its own
                # result is ready latency[operation] cycles later. A source that no
                # instruction writes is ready at cycle 0. Return the cycle at which the
                # last result of the whole program is ready.
                ready = {}
                for dest, sources, op in program:
                    start = max([ready.get(src, 0) for src in sources] + [0])
                    ready[dest] = start + latency[op]
                return ready[program[-1][0]] if program else 0


