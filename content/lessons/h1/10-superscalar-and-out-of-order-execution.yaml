    - text: |
        10. The loads overlap perfectly and are all done at cycle 3, but the running total is a chain of seven adds that must happen one after another, so no amount of width gets the last result before cycle 10. Adding in pairs would cut the chain to three adds and the time to 6.

        That completes the machine: gates, adders, memory, a processor that runs its own instructions, functions on a stack, and the pipelining, prediction and out-of-order tricks that make it fast. One machine must also run many programs at once, keep them from harming each other, and give each the illusion of having the computer to itself. [[h2.what-an-operating-system-does]] begins the operating systems cluster, the software that manages this hardware for everything else.
