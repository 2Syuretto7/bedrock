        explanation: |
          The buffer retires any finished instruction, which is out-of-order retirement. Keep a head pointer to the oldest instruction not yet retired, and each cycle retire from the head for as long as the head has finished. Retiring at most one a cycle, retiring a cycle late, or using each instruction's finish time as its retirement time all break either the order or the timing.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. Eight independent loads take 3 cycles each, and then seven adds of 1 cycle each combine them one at a time into a running total. With unlimited hardware, what is the fewest cycles in which the last result can be ready?
        answer: "10"
        explanation: |
          All eight loads finish at cycle 3. The seven adds form a chain, each waiting for the one before, so the last is ready at 3 + 7 = 10.
