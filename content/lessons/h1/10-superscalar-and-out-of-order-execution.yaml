          def retire_order(finish):
              # finish[i] is the cycle at which instruction i finishes executing, in
              # whatever order the out-of-order core ran them. The reorder buffer
              # retires instructions strictly in program order: in each cycle,
              # starting from the oldest not yet retired, it retires every finished
