    - question:
        id: write-dataflow
        type: code
        mode: write
        system: s2
        prompt: |
          Write `dataflow_cycles`, the time a program takes when every instruction starts as soon as its inputs are ready. The program should print 10 cycles for one running total and 6 for pairwise sums.
        starter: |
          def dataflow_cycles(program, latency):
              # program lists instructions as (destination, sources, operation), with
              # every destination written once. With unlimited hardware, an
              # instruction starts as soon as all its sources are ready, and its own
              # result is ready latency[operation] cycles later. A source that no
              # instruction writes is ready at cycle 0. Return the cycle at which the
              # last result of the whole program is ready.
              return 0


          latency = {"load": 3, "add": 1}
          loads = [("x" + str(i), [], "load") for i in range(8)]

          chain = loads + [("s0", ["x0", "x1"], "add")]
          for i in range(2, 8):
              chain.append(("s" + str(i - 1), ["s" + str(i - 2), "x" + str(i)], "add"))

          pairs = loads + [
              ("a0", ["x0", "x1"], "add"), ("a1", ["x2", "x3"], "add"),
              ("a2", ["x4", "x5"], "add"), ("a3", ["x6", "x7"], "add"),
              ("b0", ["a0", "a1"], "add"), ("b1", ["a2", "a3"], "add"),
              ("c", ["b0", "b1"], "add"),
          ]
          print("one running total:", dataflow_cycles(chain, latency), "cycles")
          print("pairwise sums:", dataflow_cycles(pairs, latency), "cycles")
        solution: |
          def dataflow_cycles(program, latency):
              # program lists instructions as (destination, sources, operation), with
              # every destination written once. With unlimited hardware, an
              # instruction starts as soon as all its sources are ready, and its own
              # result is ready latency[operation] cycles later. A source that no
              # instruction writes is ready at cycle 0. Return the cycle at which the
              # last result of the whole program is ready.
              ready = {}
              for dest, sources, op in program:
                  start = max([ready.get(src, 0) for src in sources] + [0])
                  ready[dest] = start + latency[op]
              return max(ready.values()) if ready else 0


