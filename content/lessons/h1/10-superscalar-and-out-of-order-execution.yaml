                ("a0", ["x0", "x1"], "add"), ("a1", ["x2", "x3"], "add"),
                ("a2", ["x4", "x5"], "add"), ("a3", ["x6", "x7"], "add"),
                ("b0", ["a0", "a1"], "add"), ("b1", ["a2", "a3"], "add"),
                ("c", ["b0", "b1"], "add"),
            ]
            print("one running total:", dataflow_cycles(chain, latency), "cycles")
            print("pairwise sums:", dataflow_cycles(pairs, latency), "cycles")
        explanation: |
          Each result is ready its operation's latency after the latest of its sources, with unwritten sources ready at 0; the answer is the latest result of all. Waiting for the earliest source instead of the latest, giving every operation one cycle, or reporting only the last instruction's result, which need not be the last ready, all misjudge the critical path.
