            def operand(reg, regfile, ex_mem, mem_wb):
                # The forwarding unit: choose the value of source register reg for an
                # instruction entering the execute stage. ex_mem describes the
                # instruction one ahead of it and mem_wb the one two ahead, each as
                # (destination register, result), or None. A result not yet written
                # back must be used instead of the register file, and when both
                # instructions write reg, the newer one, in ex_mem, wins. The register
                # "zero" is always 0.
                if reg == "zero":
                    return 0
                if reg in regfile:
                    return regfile[reg]
                if ex_mem is not None and ex_mem[0] == reg:
                    return ex_mem[1]
                if mem_wb is not None and mem_wb[0] == reg:
                    return mem_wb[1]
                return regfile[reg]


            regfile = {"t0": 0, "t1": 5}
            # addi t0, zero, 10    is two ahead, in MEM/WB, with result 10
            # addi t0, t0, 1       is one ahead, in EX/MEM, with result 11
            # add t2, t0, t1       is entering execute
            print("t0 for the add:", operand("t0", regfile, ("t0", 11), ("t0", 10)))
            print("t1 for the add:", operand("t1", regfile, ("t0", 11), ("t0", 10)))
        explanation: |
          The unit checks MEM/WB first, so the older result wins. Checking EX/MEM, the instruction just ahead, before MEM/WB gives the newest value. Dropping the check for the zero register forwards a value into x0; forwarding only from EX/MEM misses results two instructions ahead; and reading the register file first never forwards at all.
