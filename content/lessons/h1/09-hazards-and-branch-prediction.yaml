            def stalls(program, forwarding):
                # program lists instructions as (destination, sources, is_load) on the
                # classic five-stage pipeline, where a register written back in a cycle
                # can be read in the same cycle. If instruction i is in decode at cycle
                # d[i], it must wait until every source's newest earlier writer p allows:
                #   without forwarding:          d[i] >= d[p] + 3
                #   with forwarding, from a load: d[i] >= d[p] + 2
                #   with forwarding, otherwise:   d[i] >= d[p] + 1
                # and never before d[i - 1] + 1. The register "zero" is never waited
                # for. Return the total number of cycles lost to waiting.
                writer = {}
                lost = 0
                for i, (dest, sources, is_load) in enumerate(program):
                    wait = 0
                    for reg in sources:
                        if reg == "zero" or reg not in writer:
                            continue
                        p = writer[reg]
                        if not forwarding:
                            gap = 3
                        elif program[p][2]:
                            gap = 2
                        else:
                            gap = 1
                        wait = max(wait, gap - (i - p))
                    lost += wait
                    writer[dest] = i
                return lost


            program = [
                ("t0", ["a0"], True),          # lw t0, 0(a0)
                ("t1", ["t0"], False),         # addi t1, t0, 1
                ("t2", ["t1", "t0"], False),   # add t2, t1, t0
                ("t3", ["a1"], False),         # addi t3, a1, 4
                ("t4", ["t2", "zero"], False), # add t4, t2, zero
            ]
            print("stalls without forwarding:", stalls(program, False))
            print("stalls with forwarding:", stalls(program, True))
        explanation: |
          Walk the program keeping each instruction's decode cycle and the newest writer of each register. An instruction decodes a cycle after the one before, unless a source's writer forces it later; the difference is the cycles lost. Checking only the instruction just before misses dependences two apart; treating loads like arithmetic forgets the load-use stall; and working out each wait from the distance in the program ignores that earlier stalls have already pushed instructions apart.
    - question:
        id: write-two-bit
        type: code
        mode: write
        system: s2
        prompt: |
          Write `predict` and `update` for a table of two-bit saturating counters. The program should print that the loop branch is guessed right 89 times in 100, and the alternating branch never.
        starter: |
          class TwoBitPredictor:
              # A table of 2-bit saturating counters, 0 to 3, each starting at 1. A
              # branch at address pc uses counter number (pc >> 2) % size, since
              # instructions are 4 bytes apart. Predict taken when the counter is 2
              # or 3. After the branch resolves, count up if it was taken and down if
              # not, but never above 3 or below 0.

              def __init__(self, size):
                  self.counters = [1] * size

              def predict(self, pc):
                  return False

              def update(self, pc, taken):
                  pass


          def correct_guesses(predictor, pc, outcomes):
              correct = 0
              for taken in outcomes:
                  if predictor.predict(pc) == taken:
                      correct += 1
                  predictor.update(pc, taken)
              return correct


          p = TwoBitPredictor(16)
          loop = ([True] * 9 + [False]) * 10
          print("loop branch:", correct_guesses(p, 0x400, loop), "of", len(loop))
          alternating = [True, False] * 50
          print("alternating branch:", correct_guesses(p, 0x404, alternating), "of", len(alternating))
        solution: |
          class TwoBitPredictor:
              # A table of 2-bit saturating counters, 0 to 3, each starting at 1. A
              # branch at address pc uses counter number (pc >> 2) % size, since
              # instructions are 4 bytes apart. Predict taken when the counter is 2
              # or 3. After the branch resolves, count up if it was taken and down if
              # not, but never above 3 or below 0.

              def __init__(self, size):
                  self.counters = [1] * size

              def predict(self, pc):
                  return self.counters[(pc >> 2) % len(self.counters)] >= 2

              def update(self, pc, taken):
                  i = (pc >> 2) % len(self.counters)
                  if taken:
                      self.counters[i] = min(3, self.counters[i] + 1)
                  else:
                      self.counters[i] = max(0, self.counters[i] - 1)


          def correct_guesses(predictor, pc, outcomes):
              correct = 0
              for taken in outcomes:
                  if predictor.predict(pc) == taken:
                      correct += 1
                  predictor.update(pc, taken)
              return correct


          p = TwoBitPredictor(16)
          loop = ([True] * 9 + [False]) * 10
          print("loop branch:", correct_guesses(p, 0x400, loop), "of", len(loop))
          alternating = [True, False] * 50
          print("alternating branch:", correct_guesses(p, 0x404, alternating), "of", len(alternating))
        tests: |
          def _ref(_outcomes, _start=1):
              _c, _ok = _start, 0
              for _t in _outcomes:
                  _ok += (_c >= 2) == _t
                  _c = min(3, _c + 1) if _t else max(0, _c - 1)
              return _ok


          for _outs in [[True] * 10 + [False] * 3 + [True] * 3, [False] * 5 + [True] * 5, [True, True, False, True, True, False], [True] * 20 + [False, False, True]]:
              _got = correct_guesses(TwoBitPredictor(8), 0x1000, _outs)
              assert _got == _ref(_outs), "On the outcomes " + str(["T" if _x else "N" for _x in _outs]) + " the predictor should guess " + str(_ref(_outs)) + " right, not " + str(_got)
          _p = TwoBitPredictor(4)
          for _ in range(3):
              _p.update(0x400, True)
