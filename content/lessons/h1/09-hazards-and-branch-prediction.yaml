        system: s2
        prompt: |
          A compiler sees `lw t0, 0(a0)`, then `add t1, t0, t2`, then `addi a1, a1, 4`, which does not use t0 or t1. What reordering removes the stall?
        options:
          - "Move the addi between the load and the add"
          - "Move the add before the load"
          - "Replace the load with two loads"
          - "Nothing can remove a load-use stall"
        answer: 0
        explanation: |
          With an independent instruction in between, the load's data is ready by the time the add reaches EX, and forwarding delivers it without a bubble. Moving the add first would use t0 before it is loaded.
  connections:
    - text: |
        2. The exit makes a one-bit predictor wrong twice: once when the loop ends, and once when the next run begins, because that single not-taken flipped its one bit. The two-bit counter, needing two surprises to change its mind, is wrong only at the exit, 1 in 10. Branches with patterns, such as one taken every other time, need predictors that remember the recent history of branches, which is what modern chips do.

        Forwarding and prediction keep one instruction flowing per cycle. To do better than one, a processor must start several instructions every cycle, and look past instructions that are waiting to find ones that are ready. [[h1.superscalar-and-out-of-order-execution]] shows how a modern core does that while still appearing to run the program one instruction at a time.
