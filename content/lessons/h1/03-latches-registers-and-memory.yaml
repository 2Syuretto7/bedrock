                return 1 - (a | b)


            def latch(s, r, q, q_bar):
                # Two NOR gates wired in a loop: q = nor(r, q_bar) and q_bar = nor(s, q).
                # Starting from the stored q and q_bar, work out the first gate and then
                # the second, again and again, until a round changes neither. Return the
                # settled (q, q_bar).
