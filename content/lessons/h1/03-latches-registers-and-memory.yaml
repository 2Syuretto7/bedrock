                        self.regs[rd] = value
                    return a, b


            rf = RegisterFile()
            print(rf.cycle(1, 2, 1, 200, 1))
            print(rf.cycle(1, 2, 2, 300, 1))
            print(rf.cycle(1, 2, 0, 99, 1))
            print(rf.cycle(0, 2, 3, 5, 0))
            print(rf.cycle(1, 3, 0, 0, 0))
          - |
            class RegisterFile:
                # Eight 8-bit registers, numbered 0 to 7. Register 0 always reads 0 and
                # ignores writes, as in RISC-V.

                def __init__(self):
                    self.regs = [0] * 8

                def cycle(self, ra, rb, rd, value, write):
                    # One clock cycle. Read registers ra and rb. Then, at the clock edge,
                    # if write is 1, store the low 8 bits of value in register rd. The
                    # reads see the registers as they were before the edge. Return the
                    # two values read.
                    a = self.regs[ra]
                    b = self.regs[rb]
                    if write == 1:
                        self.regs[rd] = value & 0xFF
                    return a, b


            rf = RegisterFile()
            print(rf.cycle(1, 2, 1, 200, 1))
            print(rf.cycle(1, 2, 2, 300, 1))
            print(rf.cycle(1, 2, 0, 99, 1))
            print(rf.cycle(0, 2, 3, 5, 0))
            print(rf.cycle(1, 3, 0, 0, 0))
        explanation: |
          Read both registers first, then write, keeping only 8 bits and never touching register 0. Writing before reading makes a read see a value that only arrives at the edge; storing 300 unmasked breaks the 8-bit width; and allowing writes to register 0 breaks the promise that it always reads 0.
    - question:
