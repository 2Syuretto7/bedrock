            class Memory:
                # 64 bytes, held as 4 rows of 16. A decoder takes an address's low 4 bits
                # as the column within a row and the bits above them as the row.

                def __init__(self):
                    self.rows = [[0] * 16 for _ in range(4)]

                def split(self, address):
                    row = (address >> 2) & 0x3
                    column = address & 0xF
                    return row, column

                def store(self, address, byte):
                    row, column = self.split(address)
                    self.rows[row][column] = byte

                def load(self, address):
                    row, column = self.split(address)
                    return self.rows[row][column]


            mem = Memory()
            for i, ch in enumerate("BEDROCK"):
                mem.store(14 + i, ord(ch))
            print("".join(chr(mem.load(14 + i)) for i in range(7)))
            print(mem.split(20))
        explanation: |
          With 16 columns the column is the low 4 bits, address & 0xF, and the row is the rest. Masking with 0x3 keeps only 2 bits, so addresses 16 and 20 share a cell and K overwrites D. Masking with 0x7 keeps 3 bits, still too few, and taking the row from bits 2 and 3 makes different addresses collide in the same way.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. A DRAM chip has 8192 rows, each to be refreshed once every 64 milliseconds, one row at a time and evenly spaced. How often must it refresh a row, in microseconds? Give one decimal place.
        answer: "7.8"
        tolerance: "0.05"
        unit: microseconds
        explanation: |
          64 milliseconds is 64,000 microseconds, and 64,000 / 8192 ≈ 7.8 microseconds between refreshes.
    - question:
        id: work-clock-edge
        type: choice
        system: s2
        prompt: |
          A designer shortens the longest path of logic between two rows of flip-flops from 300 to 200 picoseconds. The clock-to-Q delay and setup time together are 50 picoseconds. Which is true?
        options:
          - "The shortest safe clock period falls from 350 to 250 picoseconds"
          - "The clock period stays the same, because flip-flops set it"
          - "The shortest safe clock period falls from 300 to 200 picoseconds"
          - "The circuit can now run without a clock"
        answer: 0
        explanation: |
          The period must cover the flip-flop overheads as well as the logic: 300 + 50 = 350 before and 200 + 50 = 250 after.
  connections:
    - text: |
        7.8. Sixty-four thousand microseconds shared among 8192 rows gives about 7.8 microseconds each. Memory chips really do work on that schedule, refreshing a row or a group of rows every 7.8 microseconds, and a read that arrives during a refresh has to wait for it.

        There are now all the parts of a computer: an ALU that computes, registers that hold values between cycles, and memory that holds programs and data. [[h1.the-fetch-decode-execute-cycle]] wires them together with a program counter and a little control logic, so that the machine fetches its own instructions from memory and runs them one after another.
