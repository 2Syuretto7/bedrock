            def nor(a, b):
                return 1 - (a | b)


            def latch(s, r, q, q_bar):
                # Two NOR gates wired in a loop: q = nor(r, q_bar) and q_bar = nor(s, q).
                # Starting from the stored q and q_bar, work out the first gate and then
                # the second, again and again, until a round changes neither. Return the
                # settled (q, q_bar).
                while True:
                    new_q = nor(s, q_bar)
                    new_q_bar = nor(r, new_q)
                    if new_q == q and new_q_bar == q_bar:
                        return q, q_bar
                    q, q_bar = new_q, new_q_bar


            q, q_bar = 0, 1
            for s, r, what in [(1, 0, "set"), (0, 0, "hold"), (0, 1, "reset"), (0, 0, "hold")]:
                q, q_bar = latch(s, r, q, q_bar)
                print(what, "-> q =", q)
        explanation: |
          Recompute the two gates in turn from the stored outputs, and stop when a whole round changes nothing. A single round is not enough for a set, which takes two rounds to settle; starting from 0 and 0 forgets the stored bit, so a hold after a reset comes out as 1; and swapping s and r turns set into reset.
    - question:
        id: write-register-file
        type: code
        mode: write
        system: s2
        prompt: |
          Write `cycle` for a register file whose reads see the registers as they were before the clock edge, and whose write lands at the edge. The program should print `(0, 0)`, then `(200, 0)`, `(200, 44)`, `(0, 44)` and `(200, 0)`, one per line.
        starter: |
          class RegisterFile:
              # Eight 8-bit registers, numbered 0 to 7. Register 0 always reads 0 and
              # ignores writes, as in RISC-V.

              def __init__(self):
                  self.regs = [0] * 8

              def cycle(self, ra, rb, rd, value, write):
                  # One clock cycle. Read registers ra and rb. Then, at the clock edge,
                  # if write is 1, store the low 8 bits of value in register rd. The
                  # reads see the registers as they were before the edge. Return the
                  # two values read.
                  return 0, 0


          rf = RegisterFile()
          print(rf.cycle(1, 2, 1, 200, 1))
          print(rf.cycle(1, 2, 2, 300, 1))
          print(rf.cycle(1, 2, 0, 99, 1))
          print(rf.cycle(0, 2, 3, 5, 0))
          print(rf.cycle(1, 3, 0, 0, 0))
        solution: |
          class RegisterFile:
              # Eight 8-bit registers, numbered 0 to 7. Register 0 always reads 0 and
              # ignores writes, as in RISC-V.

              def __init__(self):
                  self.regs = [0] * 8

              def cycle(self, ra, rb, rd, value, write):
                  # One clock cycle. Read registers ra and rb. Then, at the clock edge,
                  # if write is 1, store the low 8 bits of value in register rd. The
                  # reads see the registers as they were before the edge. Return the
                  # two values read.
                  a = self.regs[ra]
                  b = self.regs[rb]
                  if write == 1 and rd != 0:
                      self.regs[rd] = value & 0xFF
                  return a, b


          rf = RegisterFile()
          print(rf.cycle(1, 2, 1, 200, 1))
          print(rf.cycle(1, 2, 2, 300, 1))
          print(rf.cycle(1, 2, 0, 99, 1))
          print(rf.cycle(0, 2, 3, 5, 0))
          print(rf.cycle(1, 3, 0, 0, 0))
        tests: |
          _rf = RegisterFile()
          assert tuple(_rf.cycle(5, 6, 5, 42, 1)) == (0, 0), "Reads in the cycle that writes should see the old value, 0"
          assert tuple(_rf.cycle(5, 6, 6, 7, 1)) == (42, 0), "Register 5 should hold 42 in the next cycle"
          assert tuple(_rf.cycle(5, 6, 0, 0, 0)) == (42, 7), "Register 6 should hold 7"
          _rf.cycle(0, 0, 7, 0x1FF, 1)
          assert _rf.cycle(7, 0, 0, 0, 0)[0] == 0xFF, "Only the low 8 bits of 0x1FF, 255, should be stored"
          _rf.cycle(0, 0, 0, 123, 1)
          assert tuple(_rf.cycle(0, 0, 0, 0, 0)) == (0, 0), "Register 0 should always read 0, even after a write to it"
          _rf.cycle(0, 0, 4, 9, 0)
          assert _rf.cycle(4, 4, 0, 0, 0)[0] == 0, "Nothing should be stored when write is 0"
          assert output.splitlines() == ["(0, 0)", "(200, 0)", "(200, 44)", "(0, 44)", "(200, 0)"], "The program should print (0, 0), (200, 0), (200, 44), (0, 44) and (200, 0)"
        wrong:
          - |
            class RegisterFile:
                # Eight 8-bit registers, numbered 0 to 7. Register 0 always reads 0 and
                # ignores writes, as in RISC-V.

                def __init__(self):
                    self.regs = [0] * 8

                def cycle(self, ra, rb, rd, value, write):
                    # One clock cycle. Read registers ra and rb. Then, at the clock edge,
                    # if write is 1, store the low 8 bits of value in register rd. The
                    # reads see the registers as they were before the edge. Return the
                    # two values read.
                    if write == 1 and rd != 0:
                        self.regs[rd] = value & 0xFF
                    return self.regs[ra], self.regs[rb]


            rf = RegisterFile()
            print(rf.cycle(1, 2, 1, 200, 1))
            print(rf.cycle(1, 2, 2, 300, 1))
            print(rf.cycle(1, 2, 0, 99, 1))
            print(rf.cycle(0, 2, 3, 5, 0))
            print(rf.cycle(1, 3, 0, 0, 0))
          - |
