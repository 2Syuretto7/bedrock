          - |
            # main adds up the GST on three bills, keeping its running total in s0
            # across the calls. gst(amount) returns 18% of the amount, rounded down.
            .text
            main:
                li s0, 0
                li a0, 500
                call gst
                add s0, s0, a0
                li a0, 1200
                call gst
                add s0, s0, a0
                li a0, 350
                call gst
                add s0, s0, a0
                mv a0, s0
                li a7, 1
                ecall
                li a7, 10
                ecall

            gst:
                addi sp, sp, -16
                sw s0, 12(sp)
                li s0, 18
                mul a0, a0, s0
                li s0, 100
                div a0, a0, s0
                lw s0, 12(sp)
                ret
        explanation: |
          gst uses s0 for its constants without saving it, so main's total is replaced by 100 at every call. gst is a leaf with no long-lived values, so the simplest fix is to use t0, which a caller never expects to survive. Saving s0 without reloading it, moving main's total to a t register while gst still breaks s0, or reloading s0 but leaving sp 16 bytes down all still break the rules a caller relies on.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. fact(10) recurses down to fact(0), and each of fact(10) to fact(1) uses a 16-byte frame while fact(0) uses none. At the deepest point, how many bytes of stack do fact's frames use?
        answer: "160"
        unit: bytes
        explanation: |
          Ten frames of 16 bytes are on the stack at once when fact(0) runs, 160 bytes.
    - question:
        id: work-leaf
        type: choice
        system: s2
        prompt: |
          A function adds its two arguments and returns, calling nothing else and using only a0, a1 and t0. What must it save on the stack?
        options:
          - "Nothing: it is a leaf, so ra survives, and it touches no s registers"
          - "ra, because every function must save it"
          - "a0 and a1, because it changes them"
          - "t0, because it uses it"
        answer: 0
        explanation: |
          A leaf never overwrites ra, and a, t registers are caller-saved, so it needs no frame at all. Most small functions are leaves, which is why calls are cheap.
  connections:
    - text: |
        160. Ten frames of 16 bytes are stacked up when fact(0) runs, and they unwind one by one as each call multiplies and returns. Recursion that goes deeper, say a million levels, would need 16 megabytes of stack and overflow a typical 8-megabyte stack, which is why deep recursion is turned into loops.

        You can now write real programs for the machine. The rest of the cluster turns from what the machine does to how it does it fast. [[h1.pipelining]] overlaps the fetch, decode and execute of successive instructions, as an assembly line overlaps the work on successive cars, so that a processor finishes close to one instruction every cycle.
