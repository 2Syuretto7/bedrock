concept: s5.profiling-programs
minutes: 80
claim: You can find where a program's time actually goes before trying to make it faster. You can time sections of code reliably, read a profile's self and total times, explain how a sampling profiler estimates time and how accurate it is, use Amdahl's law to predict what speeding up one part can do for the whole, and check every optimisation by measuring again.
recalls: [s5.debugging-methodically]
uses: [s3.measuring-and-predicting-running-time, f4.the-law-of-large-numbers-and-the-central-limit-theorem, s2.hash-tables, s1.generators-and-context-managers]
leads: [s5.continuous-integration, h5.profilers-sampling-and-instrumentation, h5.measuring-performance-honestly, s8.vectorisation, h4.locality]
starter: |
  # Scratch space. Timing two ways of checking membership.
  import time

  items = list(range(5000))
  lookup = set(items)
  start = time.perf_counter()
  hits = sum(1 for x in range(0, 10000, 7) if x in items)
  middle = time.perf_counter()
  hits_again = sum(1 for x in range(0, 10000, 7) if x in lookup)
  end = time.perf_counter()
  print(hits, hits_again, round(middle - start, 4), round(end - middle, 4))
parts:
  recall:
    - text: |
        [[s5.debugging-methodically]] treated a wrong answer as a question to be narrowed down step by step, with every step measured against evidence rather than hunches. A program that gives the right answer too slowly deserves the same treatment. The evidence here is a measurement of where the time goes, and hunches about it are wrong surprisingly often. Three quick pulls first.
  puzzle:
    - text: |
        A shop's nightly job prepares the day's GST invoices. It takes 60 minutes: 45 minutes running database queries, 12 minutes rendering the PDFs, and 3 minutes on everything else.

        Rendering looked like the slow part, so a colleague spent a week rewriting it, and it is now 4 times faster.

        **How many minutes does the nightly job take now?**
  intuition:
    - text: |
        Think of the morning rush to get out of the house: 5 minutes to dress, 20 minutes waiting for the geyser to heat the water, 4 minutes for tea, 6 minutes to find the keys. Buying a faster kettle that boils water in half the time saves two minutes at most. Getting the geyser on a timer saves up to twenty. The kettle is the part you notice, because you stand there watching it; the geyser simply runs in the background. Programs are the same: the part that feels slow is not always the part that is slow, and speeding up something small helps only a little, however clever the speed-up.

        The figure shows a 60-second program in four parts. Choose a part to speed up and by how much, and watch what happens to the whole.
    - figure: amdahl-speedup
      props: { part: compute, factor: 10 }
    - text: |
        Making compute 10 times faster saves under 11 seconds, because compute was only 12 of the 60. Making it infinitely fast would save 12 and no more: the other 48 seconds remain, so the whole can never become more than 1.25 times faster that way. Now choose parse, the largest part, and even a modest 2 times speeds the whole program up more than an infinite speed-up of compute could. Where the time goes decides what is worth doing, and you cannot know where it goes without measuring.
  derivation:
    - text: |
        **Measure first.** Before changing anything for speed, time the whole program on a realistic input, and then find out where inside it the time goes. [[s3.measuring-and-predicting-running-time]] introduced the tools: `time.perf_counter()` reads a clock built for measuring short intervals, and the difference between two readings is the elapsed time. Measurements are noisy, because other programs share the machine, caches are warm or cold, and the operating system interrupts at will. So repeat each measurement several times and report the minimum or the median, not a single run. Noise almost always adds time, so the fastest run is the one least disturbed.

        **Timing sections.** The simplest way to see where time goes is to read the clock around each section and add up the differences, which a context manager from [[s1.generators-and-context-managers]] makes tidy: entering a `with` block reads the clock, leaving it reads the clock again and adds the difference to that section's total. Code that takes the clock as a parameter, instead of calling it directly, can be tested with a fake clock that advances only when told to, so the tests give the same answer every time.

        **Profilers.** Timing every section by hand does not scale to a program with hundreds of functions, so tools do it for you. An **instrumenting profiler** records every call and return of every function, so it counts calls exactly; the cost is that the recording itself slows each call down, and very small, frequently called functions look slower than they are. A **sampling profiler** instead interrupts the program at regular intervals, a hundred or a thousand times a second, and writes down the call stack it finds. A function that is running in 30% of the samples is estimated to take 30% of the time. Sampling adds almost no overhead, so it can even be used on a live service.
    - question:
        id: derivation-samples
        type: numeric
        system: s2
        prompt: |
          A sampling profiler takes 100 samples a second while a program runs for 30 seconds. A function is the one running, at the top of the stack, in 450 of the samples. Roughly how many seconds of the run did it take?
        answer: "4.5"
        tolerance: "0.01"
        explanation: |
          There are $100 \times 30 = 3000$ samples, and 450 of them is 15%. 15% of 30 seconds is 4.5 seconds.
    - text: |
        **How accurate is sampling?** Each sample is like a random draw: with probability $p$ it lands in a given function, where $p$ is that function's true share of the time. Over $n$ samples the count is close to $np$, and by [[f4.the-law-of-large-numbers-and-the-central-limit-theorem]] the estimated share $\hat p$ has a standard error of about $\sqrt{p(1-p)/n}$. With 3,000 samples and $p = 0.15$, that is about 0.0065, so the 15% is reliable to within a percentage point or so. Functions that appear in only a handful of samples are measured poorly, but those are also the functions that do not matter.

        **Self time and total time.** A profile reports two numbers per function. **Self time** is the time spent running the function's own code: the samples where it was at the top of the stack. **Total time**, also called cumulative or inclusive time, is the time from when it was called to when it returned, including everything it called: the samples where it appeared anywhere on the stack. The `main` function has a total time of 100% and usually a self time near zero, since it spends its life calling others. Look for functions with a large self time to find code that is itself slow, and follow large total times downwards to find which path through the program leads there. A **flame graph** draws exactly this: each stack is a column, each function a bar whose width is its total time, with callees stacked above their callers.
    - question:
        id: derivation-self-total
        type: choice
        system: s2
        prompt: |
          In a profile, `build_report` has a total time of 62% and a self time of 1%. What does that tell you?
        options:
          - "Its own code is cheap; the time goes in the functions it calls, so look at them"
          - "It is the slowest function and should be rewritten first"
          - "The profiler failed to sample it correctly"
          - "It is called very many times"
        answer: 0
        explanation: |
          Total time includes callees; self time does not. A large total with a tiny self means `build_report` is mostly waiting on what it calls, so the next step is to see which of its callees carry the 61%.
    - text: |
        **Amdahl's law.** If a fraction $p$ of the run time is in the part you speed up, and you make that part $s$ times faster, the new time is $(1 - p) + p/s$ of the old, so the whole program becomes
        $$\frac{1}{(1 - p) + p/s}$$
        times faster. As $s$ grows without limit, the speed-up approaches $1/(1 - p)$: the part you did not touch sets a ceiling. A part that takes 20% of the time can never make the whole more than 1.25 times faster, however brilliantly it is optimised, while a part taking 80% can, in principle, make it 5 times faster. The same law reappears when work is spread over many processors: whatever cannot be shared out limits the speed-up.
    - question:
        id: derivation-amdahl
        type: numeric
        system: s2
        prompt: |
          A profile shows one function taking 80% of a program's time. You make that function 4 times faster and change nothing else. How many times faster is the whole program?
        answer: "2.5"
        tolerance: "0.01"
        explanation: |
          The new time is $0.2 + 0.8/4 = 0.4$ of the old, so the program is $1/0.4 = 2.5$ times faster.
    - text: |
        **Fix the right thing, in the right way.** Once a profile shows where the time goes, ask why. Very often the answer is an algorithm or a data structure rather than slow code: a list searched again for every item, where a set from [[s2.hash-tables]] answers each question in constant time; a query run once per row instead of once for all rows; a file read repeatedly instead of once. Changes like these remove whole factors of $n$ and dwarf any amount of tuning of individual lines. Only when the algorithm is right is it worth reducing constant factors, and then the reasons are usually about memory: data laid out so that the processor's caches can serve it, the subject of [[h4.locality]], or work done on whole arrays at once, as [[s8.vectorisation]] will show.

        **Measure again.** After each change, rerun the same measurement on the same input and compare. Sometimes an "obvious" improvement makes no difference, because the time was going elsewhere; sometimes it is slower. Keep a change only if the numbers say so, and keep the tests passing throughout: a fast wrong answer is not an improvement.
    - question:
        id: order-profile
        type: order
        system: s2
        prompt: |
          Put the steps of speeding up a slow program in order.
        steps:
          - "Pick a realistic input and time the whole program on it several times."
          - "Run a profiler to see which functions have the largest self and total times."
          - "Use Amdahl's law to judge which part is worth working on."
          - "Change that part, keeping the tests passing."
          - "Time the program again on the same input and compare."
        explanation: |
          A baseline must exist before anything can be compared with it; the profile says where the time goes; Amdahl's law says what a speed-up there could achieve; and only a second measurement shows whether the change worked.
  formal:
    - text: |
        **Elapsed time.** The difference of two readings of a monotonic, high-resolution clock such as `time.perf_counter()`; repeat and report the minimum or median.

        **Instrumenting profiler.** Records every call and return; exact call counts, with overhead on every call.

        **Sampling profiler.** Records the call stack at regular intervals; a function's share of samples estimates its share of time, with standard error about $\sqrt{p(1-p)/n}$ for $n$ samples.

        **Self time and total time.** Self: samples where the function is running its own code, at the top of the stack. Total: samples where it is anywhere on the stack, counted once per sample even if it appears more than once.

        **Amdahl's law.** Speeding up a fraction $p$ of the run time by a factor $s$ makes the whole $1/((1 - p) + p/s)$ times faster, never more than $1/(1 - p)$.
  drill:
    - text: Seconds each. Ask how much of the time is in the part being changed.
    - question:
        id: drill-ceiling
        type: numeric
        system: s1
        prompt: |
          A part of a program takes 30% of its run time. If that part took no time at all, how many times faster would the whole be? Give two decimal places.
        answer: "1.43"
        tolerance: "0.01"
        explanation: The other 70% remains, so the best possible is $1/0.7 \approx 1.43$ times faster.
    - question:
        id: drill-overhead
        type: choice
        system: s1
        prompt: |
          Which kind of profiler slows down every single function call while it runs?
        options:
          - "An instrumenting profiler"
          - "A sampling profiler"
          - "Both equally"
          - "Neither"
        answer: 0
        explanation: An instrumenting profiler records every call and return, so each call pays a little extra; a sampling profiler only looks occasionally.
    - question:
        id: drill-runs
        type: choice
        system: s1
        prompt: |
          Five runs of a benchmark take 2.1, 2.0, 2.4, 2.0 and 3.9 seconds. Which is the better single summary of the code's speed?
        options:
          - "2.0, the minimum"
          - "2.48, the mean"
          - "3.9, the maximum"
          - "2.4, the middle run in time order"
        answer: 0
        explanation: Interference only ever adds time, so the fastest run is the least disturbed. The mean is dragged up by the one disturbed run of 3.9.
    - question:
        id: predict-parts
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          parts = {"load": 9, "parse": 33, "save": 6}
          parts["parse"] = parts["parse"] / 3
          print(sum(parts.values()))
        output: "26.0"
        explanation: Parsing drops from 33 to 11.0, so the total is 9 + 11.0 + 6, a float because of the division.
    - question:
        id: predict-share
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          samples = ["parse", "parse", "load", "parse", "save"]
          print(sum(1 for s in samples if s == "parse") / len(samples))
        output: "0.6"
        explanation: Three of the five samples found `parse` running, so it is estimated to take 60% of the time.
  work:
    - text: Slower now. Each problem is part of a profiler.
    - question:
        id: fix-sections
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `profile_sections` times each section of a program with the clock it is given, adding up the times of sections that share a name. The program should print `{'load': 3.0, 'parse': 5.0, 'save': 0.5}`. It prints `{'load': 1.0, 'parse': 5.0, 'save': 0.5}`. Find the fault and fix it.
        starter: |
          def profile_sections(sections, clock):
              # sections is a list of (name, function) pairs, run in order. clock()
              # returns the current time in seconds. Return a dict from each name to
              # the total seconds its functions took; a name may appear more than once.
              totals = {}
              for name, fn in sections:
                  start = clock()
                  fn()
                  totals[name] = clock() - start
              return totals


          class FakeClock:
              def __init__(self):
                  self.now = 0.0

              def __call__(self):
                  return self.now

              def advance(self, seconds):
                  self.now += seconds


          clock = FakeClock()
          sections = [("load", lambda: clock.advance(2)), ("parse", lambda: clock.advance(5)),
                      ("load", lambda: clock.advance(1)), ("save", lambda: clock.advance(0.5))]
          print(profile_sections(sections, clock))
        solution: |
          def profile_sections(sections, clock):
              # sections is a list of (name, function) pairs, run in order. clock()
              # returns the current time in seconds. Return a dict from each name to
              # the total seconds its functions took; a name may appear more than once.
              totals = {}
              for name, fn in sections:
                  start = clock()
                  fn()
                  totals[name] = totals.get(name, 0) + clock() - start
              return totals


          class FakeClock:
              def __init__(self):
                  self.now = 0.0

              def __call__(self):
                  return self.now

              def advance(self, seconds):
                  self.now += seconds


          clock = FakeClock()
          sections = [("load", lambda: clock.advance(2)), ("parse", lambda: clock.advance(5)),
                      ("load", lambda: clock.advance(1)), ("save", lambda: clock.advance(0.5))]
          print(profile_sections(sections, clock))
        tests: |
          class _Clock:
              def __init__(self, start):
                  self.now = start

              def __call__(self):
                  return self.now


          def _run(_steps, _start):
              _c = _Clock(_start)

              def _make(_d):
                  def _f():
                      _c.now += _d
                  return _f

              return profile_sections([(_n, _make(_d)) for _n, _d in _steps], _c)


          def _same(_got, _want, _name):
              assert isinstance(_got, dict), "profile_sections should return a dict, not " + type(_got).__name__
              assert sorted(_got) == sorted(_want), "For " + _name + ", the names should be " + repr(sorted(_want)) + ", not " + repr(sorted(_got))
              for _k in _want:
                  assert abs(_got[_k] - _want[_k]) < 1e-9, "For " + _name + ", " + repr(_k) + " should total " + str(_want[_k]) + " seconds, not " + str(_got[_k])


          _same(_run([("a", 3)], 100.0), {"a": 3}, "one section on a clock that starts at 100")
          _same(_run([("a", 1), ("b", 2), ("a", 4), ("a", 0.5)], 7.0), {"a": 5.5, "b": 2}, "a name that repeats")
          _same(_run([("x", 0), ("y", 2), ("x", 0)], 0.0), {"x": 0, "y": 2}, "sections that take no time")
          _same(_run([], 5.0), {}, "no sections")
          assert output.strip() == "{'load': 3.0, 'parse': 5.0, 'save': 0.5}", "The program should print {'load': 3.0, 'parse': 5.0, 'save': 0.5}"
