                       ("main", "parse", "tokenise"), ("main", "load", "read"), ("main", "parse", "tokenise"),
                       ("main", "parse")]
            for row in summarise(samples):
                print(row)
        explanation: |
          Self time counts only the last name on each stack; total time counts every distinct name on the stack, once per sample. Counting every occurrence makes a recursive function's total exceed 100%; counting every name as self time makes `main` look like the slowest function; and sorting by total time puts `main` first, which says nothing about where code is slow.
