        solution: |
          def speedup_needed(parts, name, target):
              # parts maps each part of a program to the seconds it takes. Return how
              # many times faster parts[name] must become for the whole program to
              # take target seconds, rounded to 2 places, or None if no speed-up of
              # that part alone can reach the target.
              rest = sum(parts.values()) - parts[name]
              if target <= rest:
                  return None
              return round(parts[name] / (target - rest), 2)


          parts = {"load": 9, "parse": 33, "compute": 12, "save": 6}
          goals = [("parse", 40), ("parse", 25), ("compute", 50), ("save", 50)]
          print([speedup_needed(parts, name, target) for name, target in goals])
        tests: |
          _cases = [
              ({"a": 10, "b": 10}, "a", 15, 2.0),
              ({"a": 10, "b": 10}, "a", 10, None),
              ({"a": 10, "b": 10}, "a", 9, None),
              ({"a": 10, "b": 10}, "a", 20, 1.0),
              ({"x": 1, "y": 99}, "y", 2, 99.0),
              ({"x": 1, "y": 99}, "x", 99.5, 2.0),
              ({"p": 30, "q": 20, "r": 10}, "p", 40, 3.0),
              ({"p": 30, "q": 20, "r": 10}, "q", 50, 2.0),
          ]
          for _parts, _name, _target, _want in _cases:
              _got = speedup_needed(dict(_parts), _name, _target)
              if _want is None:
                  assert _got is None, "With parts " + repr(_parts) + ", no speed-up of " + repr(_name) + " reaches " + str(_target) + " seconds, so the answer should be None, not " + repr(_got)
              else:
                  assert _got is not None and abs(_got - _want) < 0.006, "With parts " + repr(_parts) + ", " + repr(_name) + " must become " + str(_want) + " times faster to reach " + str(_target) + " seconds, not " + repr(_got)
          assert output.strip() == "[2.54, None, 6.0, None]", "The program should print [2.54, None, 6.0, None]"
