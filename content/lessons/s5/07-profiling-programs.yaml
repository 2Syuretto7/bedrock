            parts = {"load": 9, "parse": 33, "compute": 12, "save": 6}
            goals = [("parse", 40), ("parse", 25), ("compute", 50), ("save", 50)]
            print([speedup_needed(parts, name, target) for name, target in goals])
        explanation: |
          The other parts take `rest` seconds whatever you do, so the chosen part must fit into `target - rest` seconds, a speed-up of `parts[name] / (target - rest)`. If `target` is no more than `rest`, even an infinitely fast part cannot reach it. Dividing the whole time by the target treats the program as if every part sped up; testing `target < rest` crashes when the target equals the rest, which would need the part to take no time at all; and leaving the check out returns negative or impossible speed-ups.
