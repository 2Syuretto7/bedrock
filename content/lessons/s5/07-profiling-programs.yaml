    - question:
        id: work-slow-page
        type: choice
        system: s2
        prompt: |
          Users say the order history page is slow. Ravi is sure the cause is the code that formats dates, which he has always thought clumsy. What should happen first?
        options:
          - "Time the page on a realistic account with many orders, and profile it to see where the time goes."
          - "Rewrite the date formatting, since Ravi knows the code best."
          - "Add a cache in front of every function on the page."
          - "Move the page to a bigger server."
        answer: 0
        explanation: |
          Until the time has been measured, Ravi's hunch is just a hunch, and Amdahl's law says that speeding up a small part buys little. A profile on realistic data shows where the time really goes. Caching everything adds complexity without knowing what to cache, and a bigger server spends money on a problem nobody has located.
  connections:
    - text: |
        Fifty-one minutes. Rendering dropped from 12 minutes to 3, and the 45 minutes of queries and 3 of everything else did not change. A week of work made the job only about 1.18 times faster. Even if rendering took no time at all, the job would still take 48 minutes. Making the queries just twice as fast, perhaps by fetching all the invoices in one query instead of one query each, would have brought the job to 37 and a half minutes. A profile on the first morning would have pointed there.

        Measurements like these are most useful when they run every time the code changes, so that a commit that makes the nightly job ten minutes slower is noticed the day it is written rather than months later. Running the build, the tests and checks like these automatically on every change is [[s5.continuous-integration]]. How profilers work underneath, and the many ways a measurement can mislead, return in [[h5.profilers-sampling-and-instrumentation]] and [[h5.measuring-performance-honestly]].
