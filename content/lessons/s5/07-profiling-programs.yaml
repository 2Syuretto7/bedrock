        solution: |
          def summarise(samples):
              # Each sample is the call stack at one moment, outermost function first,
              # so its last name is the function that was running. Return one
              # (name, self_pct, total_pct) row per function: self_pct is the share of
              # samples in which it was running, total_pct the share in which it was
              # anywhere on the stack, each a whole-number percentage from round().
              # Sort by self_pct, largest first, breaking ties by name.
              own = {}
              anywhere = {}
              for stack in samples:
                  own[stack[-1]] = own.get(stack[-1], 0) + 1
                  for name in set(stack):
                      anywhere[name] = anywhere.get(name, 0) + 1
              n = len(samples)
              rows = [(name, round(100 * own.get(name, 0) / n), round(100 * anywhere[name] / n)) for name in anywhere]
              return sorted(rows, key=lambda row: (-row[1], row[0]))


          samples = [("main", "load", "read"), ("main", "parse", "tokenise"), ("main", "parse", "tokenise"),
                     ("main", "parse"), ("main", "parse", "tokenise"), ("main", "save"),
                     ("main", "parse", "tokenise"), ("main", "load", "read"), ("main", "parse", "tokenise"),
                     ("main", "parse")]
          for row in summarise(samples):
              print(row)
