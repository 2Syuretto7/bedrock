  connections:
    - text: |
        120 seconds. The steps that do not depend on each other all run at once, so what remains is the longest chain: `orders.o` for 50 seconds, linking for 10 and the tests for 60. The other 115 seconds of work happen alongside that chain and cost nothing extra. Only shortening the chain itself can make the build faster.

        A build's inputs include more than the project's own files. The compiler, the Python interpreter and every library the code imports are inputs too, and if a teammate's laptop or the build server has a different version of one of them, the same sources can build into a different program. Pinning those versions so that a build means the same thing everywhere is [[s5.packages-and-reproducible-environments]].
