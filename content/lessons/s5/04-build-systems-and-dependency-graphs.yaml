                dirty = set(changed)
                for target in deps:
                    if any(i in dirty for i in deps[target]):
                        dirty.add(target)
                return sorted(t for t in dirty if t in deps)


            deps = {
                "utils.o": ["utils.c"],
                "menu.o": ["menu.c", "utils.h"],
                "orders.o": ["orders.c", "utils.h"],
                "pay.o": ["pay.c"],
                "docs": ["menu.c", "orders.c"],
                "app": ["utils.o", "menu.o", "orders.o", "pay.o"],
                "tests": ["app"],
            }
            print(to_rebuild(deps, {"utils.h"}), to_rebuild(deps, {"pay.c", "orders.c"}))
          - |
            def to_rebuild(deps, changed):
                dirty = set(changed)
                grew = True
                while grew:
                    grew = False
                    for target in deps:
                        if target not in dirty and any(i in dirty for i in deps[target]):
                            dirty.add(target)
                            grew = True
                return sorted(dirty)


            deps = {
                "utils.o": ["utils.c"],
                "menu.o": ["menu.c", "utils.h"],
                "orders.o": ["orders.c", "utils.h"],
                "pay.o": ["pay.c"],
                "docs": ["menu.c", "orders.c"],
                "app": ["utils.o", "menu.o", "orders.o", "pay.o"],
                "tests": ["app"],
            }
            print(to_rebuild(deps, {"utils.h"}), to_rebuild(deps, {"pay.c", "orders.c"}))
        explanation: |
          Keep adding targets that use anything already stale until a full pass adds nothing. Looking only at direct inputs misses everything built from rebuilt targets; a single pass works only when the dictionary happens to list targets in build order; and returning the whole stale set includes the changed source files, which are not targets.
    - question:
        id: write-finish-time
        type: code
        mode: write
        system: s2
        prompt: |
          Write `finish_time(times, deps)`, which returns when the last step of a build finishes if every step starts as soon as all the steps it depends on are done, with as many machines as needed. The program should print `240`.
        starter: |
          def finish_time(times, deps):
              # times maps each step to its duration in seconds; deps maps each step to
              # the steps that must finish before it starts. With as many machines as
              # needed, every step starts as soon as all its inputs are done. Return
              # the time at which the last step finishes.
              return sum(times.values())


          times = {"lint": 20, "compile": 90, "unit": 60, "bundle": 30, "e2e": 120, "docs": 45}
          deps = {"lint": [], "compile": [], "unit": ["compile"], "bundle": ["compile"], "e2e": ["bundle"], "docs": []}
          print(finish_time(times, deps))
        solution: |
          def finish_time(times, deps):
              done = {}

              def finish(step):
                  if step not in done:
                      start = 0
                      for before in deps[step]:
                          start = max(start, finish(before))
                      done[step] = start + times[step]
                  return done[step]

              return max(finish(step) for step in times)


          times = {"lint": 20, "compile": 90, "unit": 60, "bundle": 30, "e2e": 120, "docs": 45}
          deps = {"lint": [], "compile": [], "unit": ["compile"], "bundle": ["compile"], "e2e": ["bundle"], "docs": []}
          print(finish_time(times, deps))
        tests: |
          _t = {"a": 5, "b": 3, "c": 4, "d": 2}
          _g = {"a": [], "b": ["a"], "c": ["a"], "d": ["b", "c"]}
          _got = finish_time(_t, _g)
          assert _got == 11, "a takes 5, then b and c run side by side, c finishing at 9, then d runs to 11; got " + str(_got)
          _got = finish_time({"x": 7, "y": 9}, {"x": [], "y": []})
          assert _got == 9, "Two independent steps run side by side, so the build takes 9, not " + str(_got)
          _t2 = {"p": 1, "q": 1, "r": 1, "s": 1}
          _g2 = {"p": [], "q": ["p"], "r": ["q"], "s": ["r"]}
          _got = finish_time(_t2, _g2)
          assert _got == 4, "A chain of four 1-second steps takes 4 seconds, not " + str(_got)
          _t3 = {"m": 2, "n": 10, "o": 1}
          _g3 = {"m": [], "n": [], "o": ["m", "n"]}
          _got = finish_time(_t3, _g3)
          assert _got == 11, "o waits for its slowest input, n, which finishes at 10, so the build ends at 11, not " + str(_got)
          _t4 = {"k1": 3, "k2": 3, "k3": 3, "k4": 3}
          _g4 = {"k1": [], "k2": ["k1"], "k3": ["k2"], "k4": ["k1", "k3"]}
          _got = finish_time(_t4, _g4)
          assert _got == 12, "k4 waits for k3, which finishes at 9 after k1 and k2, so the build ends at 12, not " + str(_got)
          assert output.strip() == "240", "The program should print 240"
        wrong:
