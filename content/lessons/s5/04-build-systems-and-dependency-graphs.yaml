            deps = {"lint": [], "compile": [], "unit": ["compile"], "bundle": ["compile"], "e2e": ["bundle"], "docs": []}
            print(finish_time(times, deps))
          - |
            def finish_time(times, deps):
                return max(times.values())


            times = {"lint": 20, "compile": 90, "unit": 60, "bundle": 30, "e2e": 120, "docs": 45}
            deps = {"lint": [], "compile": [], "unit": ["compile"], "bundle": ["compile"], "e2e": ["bundle"], "docs": []}
            print(finish_time(times, deps))
          - |
            def finish_time(times, deps):
                done = {}

                def finish(step):
                    if step not in done:
                        start = 0
                        for before in deps[step]:
                            start = max(start, times[before])
                        done[step] = start + times[step]
                    return done[step]

                return max(finish(step) for step in times)


            times = {"lint": 20, "compile": 90, "unit": 60, "bundle": 30, "e2e": 120, "docs": 45}
            deps = {"lint": [], "compile": [], "unit": ["compile"], "bundle": ["compile"], "e2e": ["bundle"], "docs": []}
            print(finish_time(times, deps))
        explanation: |
          Each step finishes at its own duration plus the latest finish among the steps it waits for, remembered so that shared steps are computed once; the answer is the latest finish of all. Adding the inputs' finish times counts parallel work as if it were serial; the longest single step ignores chains; and using the inputs' durations instead of their finish times forgets what those inputs were waiting for.
