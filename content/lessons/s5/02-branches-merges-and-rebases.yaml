        explanation: |
          Two set differences of the ancestor sets give both counts. Following only first parents misses commits that a merge brought in, so a branch that has merged main still looks behind; swapping the differences reports behind as ahead; and subtracting the sizes measures how much bigger one history is, not how they differ.
