        prompt: |
          A team's feature branches live for three to four weeks, and merging them takes a day of untangling conflicts each time. What change would help most?
        options:
          - "Split work into pieces small enough to merge within a day or two, merging main into each branch often in the meantime."
          - "Rebase every branch onto main once, just before merging, after the four weeks."
          - "Let only one person commit at a time."
          - "Stop using branches and email files to each other."
        answer: 0
        explanation: |
          Conflicts grow with how long branches spend apart and how much they change, so small, short-lived branches keep each merge small. A single rebase at the end faces the same pile of conflicts; serialising commits wastes everyone's time; and emailing files throws away the merge base that makes merging possible at all.
