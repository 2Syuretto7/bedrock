                if ours == theirs:
                    return ours
                if theirs != base:
                    return theirs
                if ours != base:
                    return ours
                return base


            base = ["rajma", "chole", "idli", "poha"]
            ours = ["rajma", "chole bhature", "dosa", "poha"]
            theirs = ["rajma rice", "chole", "pongal", "poha"]
            print([merge_line(b, o, t) for b, o, t in zip(base, ours, theirs)])
          - |
            def merge_line(base, ours, theirs):
                if ours == theirs:
                    return ours
                if ours == base:
                    return theirs
                if theirs == base:
                    return ours
                return base


            base = ["rajma", "chole", "idli", "poha"]
            ours = ["rajma", "chole bhature", "dosa", "poha"]
            theirs = ["rajma rice", "chole", "pongal", "poha"]
            print([merge_line(b, o, t) for b, o, t in zip(base, ours, theirs)])
        explanation: |
          The function asked only whether ours had changed, so when both sides changed a line it kept ours and threw theirs away without a word. Asking whether each side still matches the base, and reporting a conflict when neither does, keeps every change or stops for a person. Checking for a conflict before checking for agreement turns identical edits into conflicts; letting theirs win silently loses ours instead; and falling back to the base loses both.
    - question:
        id: write-merge-base
        type: code
        mode: write
        system: s2
        prompt: |
          Write `merge_base(parents, a, b)`, which returns, sorted, the common ancestors of `a` and `b` that are not ancestors of any other common ancestor. `parents` maps each commit to the list of its parents, and `ancestors` is given. The program should print `['c3'] ['c4']`.
        starter: |
          def ancestors(parents, commit):
              # Every commit reachable from commit by following parents, commit included.
              seen = set()
              todo = [commit]
              while todo:
                  c = todo.pop()
                  if c not in seen:
                      seen.add(c)
                      for p in parents[c]:
                          todo.append(p)
              return seen


          def merge_base(parents, a, b):
              # Return, sorted, the common ancestors of a and b that are not
              # ancestors of any other common ancestor.
              return []


          parents = {
              "c1": [], "c2": ["c1"], "c3": ["c2"], "c4": ["c3"], "c5": ["c4"],
              "f1": ["c3"], "f2": ["f1"],
          }
          print(merge_base(parents, "c5", "f2"), merge_base(parents, "c5", "c4"))
        solution: |
          def ancestors(parents, commit):
              # Every commit reachable from commit by following parents, commit included.
              seen = set()
              todo = [commit]
              while todo:
                  c = todo.pop()
                  if c not in seen:
                      seen.add(c)
                      for p in parents[c]:
                          todo.append(p)
              return seen


          def merge_base(parents, a, b):
              common = ancestors(parents, a) & ancestors(parents, b)
              best = []
              for c in common:
                  if not any(c in ancestors(parents, d) for d in common if d != c):
                      best.append(c)
              return sorted(best)


          parents = {
              "c1": [], "c2": ["c1"], "c3": ["c2"], "c4": ["c3"], "c5": ["c4"],
              "f1": ["c3"], "f2": ["f1"],
          }
          print(merge_base(parents, "c5", "f2"), merge_base(parents, "c5", "c4"))
        tests: |
          _p = {"a": [], "b": ["a"], "c": ["b"], "x": ["b"], "y": ["x"], "m": ["c", "y"], "z": ["y"]}
          _got = merge_base(_p, "c", "y")
          assert _got == ["b"], "c and y last shared commit b, so merge_base should be ['b'], not " + str(_got)
          _got = merge_base(_p, "m", "z")
          assert _got == ["y"], "m merged y in through its second parent, so the merge base of m and z is ['y'], not " + str(_got)
          _got = merge_base(_p, "c", "c")
          assert _got == ["c"], "A commit's merge base with itself is ['c'], not " + str(_got)
          _q = {"r": [], "p": ["r"], "q": ["r"], "m1": ["p", "q"], "m2": ["q", "p"]}
          _got = merge_base(_q, "m1", "m2")
          assert _got == ["p", "q"], "After a criss-cross merge, p and q are both best common ancestors, so the answer is ['p', 'q'], not " + str(_got)
          assert output.strip() == "['c3'] ['c4']", "The program should print ['c3'] ['c4']"
        wrong:
