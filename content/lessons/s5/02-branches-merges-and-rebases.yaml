                return sorted(best)


            parents = {
                "c1": [], "c2": ["c1"], "c3": ["c2"], "c4": ["c3"], "c5": ["c4"],
                "f1": ["c3"], "f2": ["f1"],
            }
            print(merge_base(parents, "c5", "f2"), merge_base(parents, "c5", "c4"))
          - |
            def ancestors(parents, commit):
                # Every commit reachable from commit by following parents, commit included.
                seen = set()
                todo = [commit]
                while todo:
                    c = todo.pop()
                    if c not in seen:
                        seen.add(c)
                        for p in parents[c]:
                            todo.append(p)
                return seen


            def first_parents(parents, commit):
                seen = set()
                c = commit
                while True:
                    seen.add(c)
                    if len(parents[c]) == 0:
                        return seen
                    c = parents[c][0]


            def merge_base(parents, a, b):
                common = first_parents(parents, a) & first_parents(parents, b)
                best = []
                for c in common:
