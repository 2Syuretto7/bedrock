                        best.append(c)
                return sorted(best)


            parents = {
                "c1": [], "c2": ["c1"], "c3": ["c2"], "c4": ["c3"], "c5": ["c4"],
                "f1": ["c3"], "f2": ["f1"],
            }
            print(merge_base(parents, "c5", "f2"), merge_base(parents, "c5", "c4"))
        explanation: |
          Intersect the two ancestor sets, then keep only the commits that no other common commit descends from. Returning every common ancestor includes all the older history; returning the root finds the oldest common commit rather than the latest; and following only first parents ignores everything a merge brought in through its second parent.
    - question:
        id: write-ahead-behind
        type: code
        mode: write
        system: s2
        prompt: |
          Write `ahead_behind(parents, a, b)`, which returns a pair: how many commits `a` has that `b` lacks, and how many `b` has that `a` lacks. The program should print `(2, 2) (3, 0)`.
        starter: |
          def ancestors(parents, commit):
              # Every commit reachable from commit by following parents, commit included.
              seen = set()
              todo = [commit]
              while todo:
                  c = todo.pop()
                  if c not in seen:
                      seen.add(c)
                      for p in parents[c]:
                          todo.append(p)
              return seen


          def ahead_behind(parents, a, b):
              # Return (ahead, behind): how many commits a has that b lacks,
              # and how many b has that a lacks.
              return (0, 0)


          parents = {
              "c1": [], "c2": ["c1"], "c3": ["c2"], "c4": ["c3"], "c5": ["c4"],
              "f1": ["c3"], "f2": ["f1"], "m1": ["f2", "c5"],
          }
          print(ahead_behind(parents, "f2", "c5"), ahead_behind(parents, "m1", "c5"))
        solution: |
          def ancestors(parents, commit):
              # Every commit reachable from commit by following parents, commit included.
              seen = set()
              todo = [commit]
              while todo:
                  c = todo.pop()
                  if c not in seen:
                      seen.add(c)
                      for p in parents[c]:
                          todo.append(p)
              return seen


          def ahead_behind(parents, a, b):
              mine = ancestors(parents, a)
              theirs = ancestors(parents, b)
              return (len(mine - theirs), len(theirs - mine))


          parents = {
              "c1": [], "c2": ["c1"], "c3": ["c2"], "c4": ["c3"], "c5": ["c4"],
              "f1": ["c3"], "f2": ["f1"], "m1": ["f2", "c5"],
          }
          print(ahead_behind(parents, "f2", "c5"), ahead_behind(parents, "m1", "c5"))
        tests: |
          _p = {"a": [], "b": ["a"], "c": ["b"], "d": ["c"], "x": ["b"], "y": ["x"], "z": ["y"], "m": ["d", "z"]}
          _got = ahead_behind(_p, "z", "d")
          assert tuple(_got) == (3, 2), "z has x, y and z that d lacks, and d has c and d that z lacks, so the answer is (3, 2), not " + str(_got)
          _got = ahead_behind(_p, "d", "z")
          assert tuple(_got) == (2, 3), "Swapping the branches swaps the counts: (2, 3), not " + str(_got)
          _got = ahead_behind(_p, "m", "z")
          assert tuple(_got) == (3, 0), "After merging z through its second parent, m is 3 ahead (c, d and m) and 0 behind, not " + str(_got)
          _got = ahead_behind(_p, "b", "b")
          assert tuple(_got) == (0, 0), "A branch compared with itself is (0, 0), not " + str(_got)
          assert output.strip() == "(2, 2) (3, 0)", "The program should print (2, 2) (3, 0)"
        wrong:
