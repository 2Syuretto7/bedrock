                # The billing bug: a zero-quantity line together with a coupon.
                has_zero = any(line[-3:] == " x0" for line in order)
                has_coupon = any(line.startswith("coupon") for line in order)
                return has_zero and has_coupon


            order = ["rice x2", "dal x1", "coupon FEST10", "ghee x0", "salt x1", "atta x3"]
            print(shrink(order, fails))
          - |
            def shrink(items, fails):
                # fails(items) is True. Try removing one item at a time, and keep any
                # removal after which fails is still True. Stop when no single removal
                # keeps the failure. Return what is left, in the original order.
                return [item for item in items if fails([item])]


            def fails(order):
                # The billing bug: a zero-quantity line together with a coupon.
                has_zero = any(line[-3:] == " x0" for line in order)
                has_coupon = any(line.startswith("coupon") for line in order)
                return has_zero and has_coupon


            order = ["rice x2", "dal x1", "coupon FEST10", "ghee x0", "salt x1", "atta x3"]
            print(shrink(order, fails))
          - |
            def shrink(items, fails):
                # fails(items) is True. Try removing one item at a time, and keep any
                # removal after which fails is still True. Stop when no single removal
                # keeps the failure. Return what is left, in the original order.
                current = list(items)
                for item in current:
                    trial = [x for x in current if x != item]
                    if fails(trial):
                        current.remove(item)
                return current


            def fails(order):
                # The billing bug: a zero-quantity line together with a coupon.
                has_zero = any(line[-3:] == " x0" for line in order)
                has_coupon = any(line.startswith("coupon") for line in order)
                return has_zero and has_coupon


            order = ["rice x2", "dal x1", "coupon FEST10", "ghee x0", "salt x1", "atta x3"]
            print(shrink(order, fails))
        explanation: |
          Try each removal on a copy, keep it only if the failure survives, and start the scan again after every success, stopping when a full pass removes nothing. Keeping removals that make the failure disappear throws away exactly the items that matter; testing each item on its own misses failures that need two items together; and removing from a list while looping over it skips the item after each removal, leaving the result only partly shrunk.
    - question:
        id: write-posteriors
        type: code
        mode: write
        system: s2
        prompt: |
          Write `posteriors(priors, likelihoods)`, which applies Bayes' rule to a set of possible causes and returns `(cause, posterior)` pairs, rounded to 2 places, most likely first. The program should print `[('config change', 0.51), ('new library version', 0.46), ('bad data', 0.03)]`.
        starter: |
          def posteriors(priors, likelihoods):
              # priors[cause]: how likely each cause seemed before the evidence.
              # likelihoods[cause]: the chance of seeing the evidence if that cause
              # were the real one. Return (cause, posterior) pairs, posteriors rounded
              # to 2 places, most likely first.
              return []


          priors = {"config change": 0.5, "new library version": 0.3, "bad data": 0.2}
          # The evidence: the failure appears only on servers that were redeployed.
          likelihoods = {"config change": 0.6, "new library version": 0.9, "bad data": 0.1}
          print(posteriors(priors, likelihoods))
        solution: |
          def posteriors(priors, likelihoods):
              # priors[cause]: how likely each cause seemed before the evidence.
              # likelihoods[cause]: the chance of seeing the evidence if that cause
              # were the real one. Return (cause, posterior) pairs, posteriors rounded
              # to 2 places, most likely first.
              joint = {cause: priors[cause] * likelihoods[cause] for cause in priors}
              total = sum(joint.values())
              pairs = [(cause, round(joint[cause] / total, 2)) for cause in joint]
              return sorted(pairs, key=lambda pair: -pair[1])


          priors = {"config change": 0.5, "new library version": 0.3, "bad data": 0.2}
          # The evidence: the failure appears only on servers that were redeployed.
          likelihoods = {"config change": 0.6, "new library version": 0.9, "bad data": 0.1}
          print(posteriors(priors, likelihoods))
        tests: |
          def _close(_got, _want, _name):
              assert isinstance(_got, list), "posteriors should return a list, not " + type(_got).__name__
              assert [c for c, _ in _got] == [c for c, _ in _want], "For " + _name + ", the causes should come out in the order " + repr([c for c, _ in _want]) + ", not " + repr([c for c, _ in _got])
              for (_c, _p), (_, _q) in zip(_got, _want):
                  assert abs(_p - _q) < 0.006, "For " + _name + ", the posterior of " + repr(_c) + " should be " + str(_q) + ", not " + str(_p)


