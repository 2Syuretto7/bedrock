    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          In the puzzle, 1,000 commits were merged since the release and each test takes 4 minutes. Bisecting, how many minutes does it take in the worst case to name the commit that broke the check?
        answer: "40"
        explanation: |
          The first bad commit is one of the 1,000. Bisection needs $\lceil \log_2 1000 \rceil = 10$ tests, since $2^{10} = 1024$, and 10 tests at 4 minutes each take 40 minutes.
    - question:
        id: work-next-step
        type: choice
        system: s2
        prompt: |
          Bisection points at a commit that changed how discounts are rounded, and the shrunk failing order has just two lines. What should you do next?
        options:
          - "Write a test using the two-line order that fails now, then fix the rounding and see the test pass."
          - "Revert the whole commit and close the bug report."
          - "Fix the rounding, check the customer's original order by hand, and move on."
          - "Add a log line to the rounding code and wait for the failure to recur in production."
        answer: 0
        explanation: |
          The shrunk order is a ready-made regression test. Writing it first proves it catches the bug, and keeping it stops the bug from returning. Reverting may be a sensible emergency measure, but it also throws away the commit's intended change and leaves no test; a manual check protects nothing in future; and waiting for production to fail again is slower than the test you already have.
  connections:
    - text: |
        Forty minutes. The first bad commit is one of the 1,000, and ten halvings bring 1,000 candidates down to one, since $2^{10} = 1024$. At 4 minutes a test, that is 40 minutes. Testing newest first could take 999 tests, more than 66 hours, and staring at the code could take any amount of time at all.

        Bisection, shrinking and hypothesis ranking share one idea: every step must reduce what you do not know, and you should be able to say by how much. Not every problem is a wrong answer, though. Sometimes the answer is right and simply takes too long, and then the same discipline applies to time: measure where it goes before changing anything, which is [[s5.profiling-programs]]. In a running service with real users, the evidence comes from logs, metrics and traces rather than from a debugger, [[r3.logs-metrics-and-traces]].
