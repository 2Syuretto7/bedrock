    - text: |
        About 1.5%. Each of the 40 packages stays put with probability 0.9, so all of them do with probability $0.9^{40} \approx 0.015$. Without a lock file, a fresh install a month from now almost certainly differs from today's somewhere, usually harmlessly, occasionally not. With one, the chance of a difference is zero until someone changes the lock on purpose.

        Pinning the environment removes one whole class of "it works on my machine" mysteries. The rest still need finding: a test that fails, a crash that happens only on Fridays, a number that comes out slightly wrong. Finding them by reasoning rather than by guessing is [[s5.debugging-methodically]]. The same discipline of pinning every input reappears when the inputs are datasets and trained models, [[m1.reproducible-environments]].
