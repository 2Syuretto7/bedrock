                return sorted(bad)


            lock = {
                "pay-sdk": ("1.9.0", sha("pay-sdk 1.9.0 code")),
                "requests": ("2.32.3", sha("requests 2.32.3 code")),
                "colour": ("0.4.1", sha("colour 0.4.1 code")),
            }
            downloads = {
                "pay-sdk": ("1.9.0", "pay-sdk 1.9.0 code"),
                "requests": ("2.32.3", "requests 2.32.3 code, plus something extra"),
                "colour": ("0.4.2", "colour 0.4.2 code"),
                "left-pad": ("1.3.0", "left-pad 1.3.0 code"),
            }
            print(verify(lock, downloads))
        explanation: |
          Walk the lock, since it says what must be installed, and check presence, version and hash for each package. Checking only versions lets a tampered file with the right version number through; walking the downloads never notices a locked package that did not arrive; and skipping missing packages and versions catches only altered contents.
