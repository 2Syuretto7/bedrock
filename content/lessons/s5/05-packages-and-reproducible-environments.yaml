    - question:
        id: work-works-on-mine
        type: choice
        system: s2
        prompt: |
          A test passes on Kavya's laptop and fails on the build server for the same commit. The project has ranges in its requirements but no lock file. What should the team do first?
        options:
          - "Generate a lock file, commit it, and make both the laptop and the server install from it, then rerun the test."
          - "Mark the test as flaky and skip it on the server."
          - "Copy Kavya's installed packages folder to the server."
          - "Upgrade every package to its newest version on both machines."
        answer: 0
        explanation: |
          Without a lock, the two machines very likely resolved different versions. Installing from one committed lock file removes that difference, and if the test still fails, the cause lies elsewhere. Skipping the test hides the problem; copying a folder by hand cannot be repeated or reviewed; and upgrading everything only moves both machines to a new, still unpinned state.
