        explanation: |
          The listing followed the dictionary's order, which is the order the files happened to be added, so two machines with the same files could compute different trees. Sorting by name makes the bytes, and so the id, depend only on the snapshot. Leaving names out means a rename goes unnoticed; sorting by contents leaves files with equal contents in arbitrary order; and hashing only the names ignores every edit.
    - question:
        id: write-store
        type: code
        mode: write
        system: s2
        prompt: |
          Write `put`, which stores a text under its id, the first 12 hexadecimal digits of the SHA-256 of the text, and returns the id, and `get`, which returns the text stored under an id but raises `ValueError` if the stored text no longer matches its id. The program should print `True 2 [True]`.
        starter: |
          import hashlib


          class Store:
              def __init__(self):
                  self.objects = {}

              def put(self, text):
                  # Store text under its id, the first 12 hex digits of the SHA-256
                  # of the text, and return the id.
                  return ""

              def get(self, object_id):
                  # Return the text stored under object_id, or raise ValueError if
                  # the stored text no longer matches its id.
                  return ""


          store = Store()
          a = store.put("monday,rajma")
          b = store.put("tuesday,chole")
          c = store.put("monday,rajma")
          store.objects[b] = "tuesday,chole!"  # a disk error damages one object
          damaged = []
          for object_id in [a, b]:
              try:
                  store.get(object_id)
              except ValueError:
                  damaged.append(object_id == b)
          print(a == c, len(store.objects), damaged)
        solution: |
          import hashlib


          class Store:
              def __init__(self):
                  self.objects = {}

              def put(self, text):
                  object_id = hashlib.sha256(text.encode()).hexdigest()[:12]
                  self.objects[object_id] = text
                  return object_id

              def get(self, object_id):
                  text = self.objects[object_id]
                  if hashlib.sha256(text.encode()).hexdigest()[:12] != object_id:
                      raise ValueError("object " + object_id + " is damaged")
                  return text


          store = Store()
          a = store.put("monday,rajma")
          b = store.put("tuesday,chole")
          c = store.put("monday,rajma")
          store.objects[b] = "tuesday,chole!"  # a disk error damages one object
          damaged = []
          for object_id in [a, b]:
              try:
                  store.get(object_id)
              except ValueError:
                  damaged.append(object_id == b)
          print(a == c, len(store.objects), damaged)
        tests: |
          import hashlib as _h

          _s = Store()
          _i = _s.put("idli,sambar")
          assert _i == _h.sha256("idli,sambar".encode()).hexdigest()[:12], "put should return the first 12 hex digits of the text's SHA-256, not " + repr(_i)
          assert _s.put("idli,sambar") == _i and len(_s.objects) == 1, "Putting the same text twice should give the same id and store it once"
          _j = _s.put("dosa")
          assert _j != _i and len(_s.objects) == 2, "Different texts should get different ids and both be stored"
          assert _s.get(_i) == "idli,sambar" and _s.get(_j) == "dosa", "get should return each stored text"
          _s.objects[_j] = "dosa "
          try:
              _s.get(_j)
              _raised = False
          except ValueError:
              _raised = True
          assert _raised, "get should raise ValueError when the stored text no longer matches its id"
          assert len(_s.objects) == 2, "Checking an object must not store anything new; the store now holds " + str(len(_s.objects)) + " objects"
          assert output.strip() == "True 2 [True]", "The program should print True 2 [True]"
