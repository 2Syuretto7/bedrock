            import hashlib


            class Store:
                def __init__(self):
                    self.objects = {}

                def put(self, text):
                    object_id = hashlib.sha256(text.encode()).hexdigest()[:12]
                    self.objects[object_id] = text
                    return object_id

                def get(self, object_id):
                    text = self.objects[object_id]
                    if self.put(text) != object_id:
                        raise ValueError("object " + object_id + " is damaged")
                    return text


            store = Store()
            a = store.put("monday,rajma")
            b = store.put("tuesday,chole")
            c = store.put("monday,rajma")
            store.objects[b] = "tuesday,chole!"  # a disk error damages one object
            damaged = []
            for object_id in [a, b]:
                try:
                    store.get(object_id)
                except ValueError:
                    damaged.append(object_id == b)
            print(a == c, len(store.objects), damaged)
        explanation: |
          Storing under the hash makes equal texts share one entry, and recomputing the hash on the way out catches the damaged object. Returning the text unchecked passes damage on silently; using all 64 digits breaks the agreed id length; and checking by calling `put` again quietly stores the damaged text as a new object.
    - question:
        id: write-changed
        type: code
        mode: write
        system: s2
        prompt: |
          Write `changed(old, new)`, which compares two trees, each a dictionary from file name to blob id, and returns a sorted list of `(name, what)` pairs, where `what` is `"added"`, `"removed"` or `"modified"`. A file whose blob id is the same in both has not changed. The program should print `[('app.py', 'modified'), ('menu.csv', 'removed'), ('orders.csv', 'added')]`.
        starter: |
          def changed(old, new):
              # old and new map file names to blob ids. Return a sorted list of
              # (name, what) pairs, where what is "added", "removed" or "modified".
              return []


          old = {"README.md": "3f9a01c2b7e4", "app.py": "88d0e1a9c3f2", "menu.csv": "b41c7d2e9a05"}
          new = {"README.md": "3f9a01c2b7e4", "app.py": "0c5e9f1d2a77", "orders.csv": "e2a6b8c4d1f0"}
          print(changed(old, new))
        solution: |
          def changed(old, new):
              found = []
              for name in old:
                  if name not in new:
                      found.append((name, "removed"))
                  elif new[name] != old[name]:
                      found.append((name, "modified"))
              for name in new:
                  if name not in old:
                      found.append((name, "added"))
              return sorted(found)


          old = {"README.md": "3f9a01c2b7e4", "app.py": "88d0e1a9c3f2", "menu.csv": "b41c7d2e9a05"}
          new = {"README.md": "3f9a01c2b7e4", "app.py": "0c5e9f1d2a77", "orders.csv": "e2a6b8c4d1f0"}
          print(changed(old, new))
        tests: |
