        type: numeric
        system: s2
        prompt: |
          How many objects does the puzzle's store hold after the 201 commits?
        answer: "1802"
        explanation: |
          The first commit stores 1,000 blobs, 1 tree and 1 commit: 1,002 objects. Each of the next 200 adds 2 blobs, 1 tree and 1 commit, 4 objects, so 800 more. In all, $1{,}002 + 800 = 1{,}802$.
    - question:
        id: work-verify
        type: choice
        system: s2
        prompt: |
          A teammate sends you the id of the latest commit on a shared branch, over a channel you trust. You then download the whole repository from a mirror you do not trust. How can you be sure you received exactly the history the teammate meant?
        options:
          - "Hash every object you received, check each matches its name, and check that the commit you were told about is the branch's latest and that every object it names, directly or indirectly, is present."
          - "Check that the mirror's web page uses HTTPS."
          - "Compare the number of commits with your teammate's count."
          - "Open a few files at random and read them."
        answer: 0
        explanation: |
          The one trusted id pins down the whole history: each object is named by its hash, and each commit names its tree and parent by hash, so any altered byte anywhere would change an id on the path up to that commit. HTTPS protects only the trip from the mirror, not the mirror's honesty; counts and spot checks miss altered contents.
  connections:
    - text: |
        1,802 objects. The first commit stored 1,002: 1,000 blobs, a tree and a commit. Every later commit added only 4, two new blobs, a new tree and a commit, because the other 998 entries of each tree pointed at blobs already stored. Copying the project for each of the 201 commits would have meant 2,01,000 file copies, more than a hundred times as many.

        The puzzle's history was a straight line, one commit after another. Real teams work on many things at once: one person on a feature, another on a fix, each committing on a branch of their own. Because a branch is only a name for a commit id, making one costs nothing. The interesting part is joining branches back together, when two people have changed the same files: [[s5.branches-merges-and-rebases]]. Every change that reaches the main branch is first read by someone else, which is [[s5.code-review]]; and build systems reuse the same trick of naming things by the hash of their inputs to avoid rebuilding what has not changed, which is part of [[s5.build-systems-and-dependency-graphs]].
