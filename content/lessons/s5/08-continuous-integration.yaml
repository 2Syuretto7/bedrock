    - question:
        id: write-runners
        type: code
        mode: write
        system: s2
        prompt: |
          Write `pipeline_minutes(stages, runners)`, which works out how long a pipeline takes on a fixed number of runners, as the comment describes. The program should print `[29, 21, 16]`.
        starter: |
          def pipeline_minutes(stages, runners):
              # stages run one after another; each is a list of job durations in
              # minutes. Within a stage, each job in turn starts on whichever of the
              # runners becomes free first, and the stage ends when its last job
              # finishes. Return the minutes the whole pipeline takes.
              return 0


          stages = [[2], [6, 4, 3, 5], [8, 1]]
          print([pipeline_minutes(stages, r) for r in (1, 2, 4)])
        solution: |
          def pipeline_minutes(stages, runners):
              # stages run one after another; each is a list of job durations in
              # minutes. Within a stage, each job in turn starts on whichever of the
              # runners becomes free first, and the stage ends when its last job
              # finishes. Return the minutes the whole pipeline takes.
              total = 0
              for stage in stages:
                  free_at = [0] * runners
                  for job in stage:
                      first = 0
                      for i in range(runners):
                          if free_at[i] < free_at[first]:
                              first = i
                      free_at[first] += job
                  total += max(free_at)
              return total


          stages = [[2], [6, 4, 3, 5], [8, 1]]
          print([pipeline_minutes(stages, r) for r in (1, 2, 4)])
        tests: |
          _cases = [
              ([[5]], 1, 5),
              ([[5]], 3, 5),
              ([[1, 1, 1, 1]], 2, 2),
              ([[1, 1, 1, 1]], 3, 2),
              ([[7, 1, 1, 1, 1]], 2, 7),
              ([[2, 2], [3]], 2, 5),
              ([[4, 1, 1], [1, 1, 1, 1]], 2, 6),
              ([[3, 3, 3], [10]], 5, 13),
              ([], 2, 0),
          ]
          for _stages, _r, _want in _cases:
              _got = pipeline_minutes([list(s) for s in _stages], _r)
              assert _got == _want, "With stages " + repr(_stages) + " on " + str(_r) + (" runner" if _r == 1 else " runners") + ", the pipeline should take " + str(_want) + " minutes, not " + str(_got)
          assert output.strip() == "[29, 21, 16]", "The program should print [29, 21, 16]"
        wrong:
          - |
            def pipeline_minutes(stages, runners):
                # stages run one after another; each is a list of job durations in
                # minutes. Within a stage, each job in turn starts on whichever of the
                # runners becomes free first, and the stage ends when its last job
                # finishes. Return the minutes the whole pipeline takes.
                return sum(max(stage) for stage in stages)


            stages = [[2], [6, 4, 3, 5], [8, 1]]
            print([pipeline_minutes(stages, r) for r in (1, 2, 4)])
          - |
            def pipeline_minutes(stages, runners):
                # stages run one after another; each is a list of job durations in
                # minutes. Within a stage, each job in turn starts on whichever of the
                # runners becomes free first, and the stage ends when its last job
                # finishes. Return the minutes the whole pipeline takes.
                total = 0
                free_at = [0] * runners
                for stage in stages:
                    for job in stage:
                        first = 0
                        for i in range(runners):
                            if free_at[i] < free_at[first]:
                                first = i
                        free_at[first] += job
                return max(free_at)


            stages = [[2], [6, 4, 3, 5], [8, 1]]
            print([pipeline_minutes(stages, r) for r in (1, 2, 4)])
          - |
            def pipeline_minutes(stages, runners):
                # stages run one after another; each is a list of job durations in
                # minutes. Within a stage, each job in turn starts on whichever of the
                # runners becomes free first, and the stage ends when its last job
                # finishes. Return the minutes the whole pipeline takes.
                total = 0
                for stage in stages:
                    free_at = [0] * runners
                    for i, job in enumerate(stage):
                        free_at[i % runners] += job
                    total += max(free_at)
                return total


            stages = [[2], [6, 4, 3, 5], [8, 1]]
            print([pipeline_minutes(stages, r) for r in (1, 2, 4)])
        explanation: |
          For each stage, track when each runner becomes free, give each job to the runner that frees up first, and add the stage's latest finish to the total. Taking each stage's longest job assumes unlimited runners; letting jobs of a later stage start before the earlier stage ends ignores that stages run in sequence; and dealing jobs to runners in turn ignores which runner is actually free.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          In the puzzle, 1,200 tests of 3 seconds each are split evenly across machines that each need 2 minutes to set up. What is the smallest number of machines that finishes within 10 minutes?
        answer: "8"
        explanation: |
          The tests take 3,600 seconds, or 60 minutes, in all. With $k$ machines each takes $2 + 60/k$ minutes, which is at most 10 when $60/k \le 8$, that is $k \ge 7.5$. So 8 machines are needed, finishing in 9.5 minutes; 7 would take about 10.6.
    - question:
        id: work-red-main
        type: choice
        system: s2
        prompt: |
          Main has failed since a pull request merged an hour ago, and five other pull requests are now failing because of it. Its author, Meera, is in a long meeting. What should the team do?
        options:
          - "Revert the merge on main now, and let Meera reland it later with a fix and a test."
          - "Wait for Meera to come out of the meeting and fix it."
          - "Turn off the failing check until the fix arrives."
          - "Merge the other five pull requests anyway, since their own changes are fine."
        answer: 0
        explanation: |
          Reverting restores a green main within minutes, unblocks everyone, and loses nothing, since the change is still in history and can be relanded. Waiting blocks the team for as long as the meeting runs; turning the check off hides further breakages; and merging on a red main makes it impossible to tell which change broke what.
  connections:
    - text: |
        Eight. The tests add up to 3,600 seconds, an hour. Spread over $k$ machines, each needs 2 minutes to set up and then $60/k$ minutes of tests, and $2 + 60/k \le 10$ requires $k \ge 7.5$, so 8 machines, done in 9.5 minutes. Notice that the 2 minutes of setup can never be split: with a hundred machines the suite would still take over 2 minutes, a ceiling that caching the setup, not more machines, would lift.

        The cluster is complete. Version control names every state of the code, branches and merges let people work side by side, review and builds and locked environments turn a change into something trustworthy, debugging and profiling find what is wrong or slow, and continuous integration runs the checks on every change. But a green pipeline is only as meaningful as the tests it runs. What a passing test actually tells you, and what it cannot, opens the next cluster: [[s6.what-a-test-can-prove]].
