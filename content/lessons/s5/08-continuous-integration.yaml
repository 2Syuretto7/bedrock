            print(jobs_to_run(["docs/guide.md", "src/billing/tax.py"], jobs))
          - |
            def jobs_to_run(changed, jobs):
                # changed lists the paths a pull request touches. jobs maps each job's
                # name to its path filter, a list of folder prefixes such as "src/". A
                # job runs if any changed path starts with any of its prefixes; a job
                # with an empty filter always runs. Return the sorted names of the jobs
                # that run.
                chosen = []
                for name, prefixes in jobs.items():
