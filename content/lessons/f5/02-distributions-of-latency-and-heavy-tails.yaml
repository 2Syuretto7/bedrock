        explanation: |
          Keep only the requests strictly longer than `t`, subtract `t` from each, and average over those requests alone. Averaging the whole times, not the excess, counts the `t` they all share; `>=` lets in requests that took exactly `t` and so have no excess; dividing by the number of all requests spreads the excess over requests that had none. In the program the mean excess rises from 368 ms past 20 ms to about 517 ms past 100 ms, the signature of a heavy tail.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        tolerance: "0.001"
        prompt: |
          A service has $P(T > t) = (10/t)^2$ for $t \ge 10$, in milliseconds. A request has been running for 1,000 ms. What is the chance that it is still running at 2,000 ms?
        answer: "0.25"
        explanation: |
          $P(T > 2000 \mid T > 1000) = S(2000)/S(1000) = (1000/2000)^2 = 0.25$. It is the same as the chance that a request still running at 10 ms lasts to 20 ms: a power law looks the same at every scale.
    - question:
        id: work-hedge
        type: choice
        system: s2
        prompt: |
          A service's times have a power-law tail. A client sends a request, and if no answer has come by the service's p95, it sends a second copy to another replica and uses whichever answer arrives first. This cuts the client's p99.9 sharply while adding only about 5% more requests. Why?
        options:
          - "Only the 5% of requests still waiting at p95 send a copy, and under a heavy tail a request that is already slow expects to stay slow, while a fresh copy is most likely fast."
          - "The second replica is always faster than the first."
          - "Sending a second copy halves the time of every request."
          - "A request still running at p95 is about to finish, so the copy rarely matters."
        answer: 0
        explanation: |
          With a power-law tail the mean excess grows with the time already waited, so a request past p95 is likely to take much longer still. A fresh copy is a new draw, which usually lands in the fast bulk. Since only requests that reach p95 send a copy, the extra load is about 5%. With a bounded tail the last option would be closer to the truth, and copies would be wasted.
  connections:
    - text: |
        The chance is $(1000/2000)^2 = 0.25$: one in four. And a request that has run for 10 ms reaches 20 ms with the same chance, one in four. A power-law tail has no natural scale, so waiting does not bring the end closer; the expected extra wait grows with the wait already spent. That is why systems that call heavy-tailed services set timeouts, retry, and send hedged copies of slow requests, rather than wait patiently: a request that is already slow is the one most likely to stay slow.

        [[f5.histograms]] turns a pile of response times into a picture, and shows why logarithmic buckets suit long tails. [[f5.sampling-and-estimators]] asks how well a sample's mean or percentile estimates the true one, a question with an uncomfortable answer for heavy tails. [[f5.the-bootstrap]] estimates that uncertainty from the data alone, and [[f5.noise-in-measurements-and-benchmarks]] uses the skew of measured times to choose between medians, minimums and means when timing programs.
