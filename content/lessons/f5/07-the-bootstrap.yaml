    - text: |
        The chance is $0.95^{20} \approx 0.358$. More than a third of resamples leave the slowest value out, and in those the resample's maximum is the second-slowest time. That is how the bootstrap varies the maximum: only downward, among values already seen. For the median of the same 20 times this is harmless, since the median does not depend on the slowest value; for the maximum or a far-tail percentile it is the bootstrap's blind spot.

        With the bootstrap, every summary from the start of this cluster can carry an honest interval. [[f5.comparing-two-systems-a-b-tests]] uses it to compare the tails of two versions of a system on live traffic, where the means are not what users feel. [[f5.noise-in-measurements-and-benchmarks]] uses it on repeated timings of a program, where the danger is the dependence between runs that the plain bootstrap ignores.
