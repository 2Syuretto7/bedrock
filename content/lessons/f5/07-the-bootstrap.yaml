          A resample of 20 is drawn with replacement from 20 response times. What is the chance that the slowest original value is not picked at all? Give three decimal places.
        answer: "0.358"
        explanation: |
          Each pick misses it with chance $19/20$, so all 20 miss with chance $0.95^{20} \approx 0.358$. In about a third of resamples the maximum drops to the second-slowest value.
