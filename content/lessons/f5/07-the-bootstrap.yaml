          A load test sent 400 requests. A colleague bootstraps the p99.9 and reports a tight 95% interval. Why should it not be trusted?
        options:
          - "The p99.9 of 400 values is essentially the maximum, and resamples cannot go above the sample's maximum, so the interval cannot show how much slower the true p99.9 might be."
          - "The bootstrap only works for means."
          - "1,000 resamples is too few for any interval."
          - "Bootstrap intervals are always too wide for percentiles."
        answer: 0
        explanation: |
          The nearest rank is $\lceil 0.999 \times 400 \rceil = 400$, the slowest request. Every resample's p99.9 is one of the sample's few largest values, so the interval spans only those, though the true p99.9 could be far beyond them. Estimating it needs many more requests, as [[f5.sampling-and-estimators]] warned.
