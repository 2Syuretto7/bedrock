    - question:
        id: write-bootstrap-se
        type: code
        mode: write
        system: s2
        prompt: |
          Write `bootstrap_se(xs, stat, resamples, seed)`. Call `random.seed(seed)` once. For each of `resamples` resamples of `len(xs)` values, drawn with replacement one at a time with `random.choice(xs)`, compute `stat(resample)`. Return the standard deviation of those values with `statistics.pstdev`. `stat` is any function of a list, such as `statistics.median` or `max`.
        starter: |
          import random
          import statistics


          def bootstrap_se(xs, stat, resamples, seed):
              # Seed once. For each of `resamples` resamples of len(xs) values, drawn with
              # replacement one at a time with random.choice(xs), compute stat(resample).
              # Return the standard deviation of those values, using statistics.pstdev.
              return 0


          times = [42, 45, 47, 48, 50, 51, 52, 53, 55, 56, 58, 60, 61, 63, 66, 70, 75, 82, 95, 120]
          print(round(bootstrap_se(times, statistics.mean, 2000, 1), 2), round(bootstrap_se(times, statistics.median, 2000, 1), 2), bootstrap_se([5, 5, 5], max, 100, 0))
        solution: |
          import random
          import statistics


          def bootstrap_se(xs, stat, resamples, seed):
              # Seed once. For each of `resamples` resamples of len(xs) values, drawn with
              # replacement one at a time with random.choice(xs), compute stat(resample).
              # Return the standard deviation of those values, using statistics.pstdev.
              random.seed(seed)
              values = []
              for _ in range(resamples):
                  sample = [random.choice(xs) for _ in range(len(xs))]
                  values.append(stat(sample))
              return statistics.pstdev(values)


          times = [42, 45, 47, 48, 50, 51, 52, 53, 55, 56, 58, 60, 61, 63, 66, 70, 75, 82, 95, 120]
          print(round(bootstrap_se(times, statistics.mean, 2000, 1), 2), round(bootstrap_se(times, statistics.median, 2000, 1), 2), bootstrap_se([5, 5, 5], max, 100, 0))
        tests: |
          def _reference(_xs, _stat, _resamples, _seed):
              random.seed(_seed)
              _values = []
              for _r in range(_resamples):
                  _sample = [random.choice(_xs) for _i in range(len(_xs))]
                  _values.append(_stat(_sample))
              return statistics.pstdev(_values)


          for _xs, _stat, _resamples, _seed in [([1, 2, 3], statistics.mean, 20, 0), ([1, 2, 3, 4], statistics.median, 30, 4), ([3, 1, 4, 1, 5, 9, 2, 6], max, 50, 7), ([10, 10], min, 5, 1)]:
              _want = _reference(_xs, _stat, _resamples, _seed)
              _got = bootstrap_se(_xs, _stat, _resamples, _seed)
              assert abs(_got - _want) < 1e-9, "bootstrap_se(" + str(_xs) + ", " + _stat.__name__ + ", " + str(_resamples) + ", " + str(_seed) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "4.15 3.6 0.0", "The program should print 4.15 3.6 0.0"
