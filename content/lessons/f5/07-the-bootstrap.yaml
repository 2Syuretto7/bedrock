        explanation: |
          Shuffling a copy draws without replacement, so every resample is the original sample in a new order and every mean is identical. Each resample must be `len(xs)` independent picks. One pick fewer gives resamples of the wrong size; repeating a single pick gives means that are single values; and seeding inside the loop makes every resample the same.
    - question:
        id: write-percentile-interval
        type: code
        mode: write
        system: s2
        prompt: |
          Write `percentile_interval(stats, level)`. Sort the statistics, drop `round(len(stats) * (1 - level) / 2)` of them from each end, and return the smallest and largest that remain, as a pair. Do not change the list you are given.
        starter: |
          def percentile_interval(stats, level):
              # Sort the statistics, drop round(len(stats) * (1 - level) / 2) of them from each end,
              # and return the smallest and largest that remain, as a pair.
              return (0, 0)


          print(percentile_interval(list(range(1000, 0, -1)), 0.95), percentile_interval([4, 9, 1, 7, 3, 8, 2, 6, 5, 10], 0.8))
        solution: |
          def percentile_interval(stats, level):
              # Sort the statistics, drop round(len(stats) * (1 - level) / 2) of them from each end,
              # and return the smallest and largest that remain, as a pair.
              ordered = sorted(stats)
              drop = round(len(ordered) * (1 - level) / 2)
              return (ordered[drop], ordered[len(ordered) - 1 - drop])


          print(percentile_interval(list(range(1000, 0, -1)), 0.95), percentile_interval([4, 9, 1, 7, 3, 8, 2, 6, 5, 10], 0.8))
        tests: |
          for _stats, _level in [([3, 1, 2], 0.5), ([5], 0.9), (list(range(1, 41)), 0.9), (list(range(2000, 0, -1)), 0.95), ([2.5, 1.5, 9.0, 4.0, 3.0, 6.5, 0.5, 7.0], 0.5), ([4, 4, 1, 9, 9, 2, 7, 3, 3, 8], 0.8)]:
              _ordered = sorted(_stats)
              _drop = round(len(_ordered) * (1 - _level) / 2)
              _want = (_ordered[_drop], _ordered[len(_ordered) - 1 - _drop])
              _copy = list(_stats)
              _got = percentile_interval(_stats, _level)
              assert _stats == _copy, "percentile_interval should not change the list it is given"
              assert tuple(_got) == _want, "percentile_interval(" + str(_stats) + ", " + str(_level) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "(26, 975) (2, 9)", "The program should print (26, 975) (2, 9)"
