            import random
            import statistics


            def bootstrap_se(xs, stat, resamples, seed):
                # Seed once. For each of `resamples` resamples of len(xs) values, drawn with
                # replacement one at a time with random.choice(xs), compute stat(resample).
                # Return the standard deviation of those values, using statistics.pstdev.
                random.seed(seed)
                values = []
                for _ in range(resamples):
                    sample = [random.choice(xs) for _ in range(len(xs))]
                    values.append(stat(sample))
                return statistics.pstdev(values) / len(xs) ** 0.5


            times = [42, 45, 47, 48, 50, 51, 52, 53, 55, 56, 58, 60, 61, 63, 66, 70, 75, 82, 95, 120]
            print(round(bootstrap_se(times, statistics.mean, 2000, 1), 2), round(bootstrap_se(times, statistics.median, 2000, 1), 2), bootstrap_se([5, 5, 5], max, 100, 0))
        explanation: |
          The function never needs to know which statistic it bootstraps; it applies `stat` to each resample. Applying it to the original `xs` every time gives the same value repeatedly and a standard error of 0. The mean of the bootstrap values estimates the statistic, not its spread, and dividing the spread by $\sqrt{n}$ again counts the sample size twice: the resamples already have size $n$. The median's standard error comes out smaller than the mean's here, because the slowest few times pull the mean about but not the median.
