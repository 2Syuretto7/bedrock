        prompt: |
          20 independent tests, each with a 5% chance of a false alarm, are run on a release that changed nothing. What is the chance that at least one flags a change? Give two decimal places.
        answer: "0.64"
        explanation: |
          $1 - 0.95^{20} \approx 1 - 0.358 = 0.64$. Most releases, even ones that change nothing, will light up some metric.
    - question:
        id: work-power
        type: choice
        system: s2
        prompt: |
          A team tests a caching change on 30 requests per version and gets $p = 0.4$. A manager concludes that the cache makes no difference. What is wrong with that?
        options:
          - "A large p-value only says the data are not surprising under no effect; with 30 requests the test has little power, so a real effect could easily have been missed."
          - "Nothing: $p = 0.4$ means a 40% chance that the cache helps."
          - "The p-value should have been one-sided, which would make it significant."
          - "The test proves the cache is harmful."
        answer: 0
        explanation: |
          Failing to reject is not evidence of no effect unless the test could have detected an effect of the size that matters. The confidence interval for the difference shows this directly: with 30 requests it is likely wide enough to include both zero and a useful speed-up. Choosing a one-sided test after seeing the data is a way to manufacture significance, not a fix.
  connections:
    - text: |
        The chance is $1 - 0.95^{20} \approx 0.64$. Nearly two releases in three, even ones that change nothing, will turn some metric red. Teams that react to every flag chase noise; teams that learn to ignore the dashboard miss real regressions. The cures are the ones above: fewer, chosen metrics; corrected levels such as Bonferroni's $0.05/20 = 0.0025$; and intervals that show the size of a change rather than a bare verdict.

        [[f5.the-bootstrap]] builds intervals and tests for statistics that have no formula, such as a p99, by resampling the data itself. [[f5.comparing-two-systems-a-b-tests]] puts tests to work on live traffic and adds the traps of peeking and stopping early, and [[f5.noise-in-measurements-and-benchmarks]] applies them to benchmarks, where the noise comes from the machine rather than from the users.
