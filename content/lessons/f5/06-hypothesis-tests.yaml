        explanation: |
          No false alarm in any test has chance $(1 - \alpha)^m$, so at least one has $1 - (1 - \alpha)^m$. Multiplying $\alpha$ by $m$ is the union bound: close when $\alpha m$ is small, but for 20 tests at 0.05 it gives 1, a certainty, when the true chance is 0.64. $(1 - \alpha)^m$ alone is the chance of no alarm at all. Bonferroni divides the level by the number of tests, it does not multiply.
