          - |
            import random


            def permutation_p(a, b, shuffles, seed):
                # Seed once. Pool a + b into one list; each time, shuffle it in place with random.shuffle,
                # call its first len(a) values group A and the rest group B, and count the shuffles whose
                # difference of means (B minus A) is at least as large in size as the observed one.
                # Return that count divided by shuffles.
                random.seed(seed)
                observed = sum(b) / len(b) - sum(a) / len(a)
                pool = a + b
                count = 0
                for _ in range(shuffles):
                    random.shuffle(pool)
                    first = pool[:len(a)]
                    rest = pool[len(a):]
                    diff = sum(rest) / len(rest) - sum(first) / len(first)
                    if abs(diff) > abs(observed):
                        count += 1
                return count / shuffles


            old = [52, 48, 61, 55, 50, 47, 58, 53]
            new = [45, 49, 44, 51, 46, 43, 48, 50]
            print(permutation_p(old, new, 2000, 1), permutation_p([1, 2, 3], [1, 2, 3], 100, 0))
        explanation: |
          "At least as large in size" compares absolute values with `>=`, which makes the test two-sided and counts ties. Comparing signed differences gives a one-sided test in the wrong direction here, since the new build is faster and its difference negative; re-seeding inside the loop repeats the same shuffle; and a strict `>` drops ties, so two identical groups get a p-value of 0 instead of 1. The program finds that only about 0.5% of shuffles separate the builds as well as the real labels do.
    - question:
        id: write-family
        type: code
        mode: write
        system: s2
        prompt: |
          Write `family_false_alarm(alpha, tests)`, the chance that at least one of `tests` independent tests at level `alpha` raises a false alarm when nothing changed, and `bonferroni(alpha, tests)`, the level each test should use so that the chance of any false alarm is at most `alpha`.
        starter: |
          def family_false_alarm(alpha, tests):
              # The chance that at least one of `tests` independent tests, each at level alpha,
              # flags a change when nothing changed.
              return 0


          def bonferroni(alpha, tests):
              # The level each test should use so that the chance of any false alarm is at most alpha.
              return 0


          print(round(family_false_alarm(0.05, 20), 4), bonferroni(0.05, 20), round(family_false_alarm(bonferroni(0.05, 20), 20), 4))
        solution: |
          def family_false_alarm(alpha, tests):
              # The chance that at least one of `tests` independent tests, each at level alpha,
              # flags a change when nothing changed.
              return 1 - (1 - alpha) ** tests


          def bonferroni(alpha, tests):
