        explanation: |
          A's count among $N$ is binomial with mean $N/2$ and variance $N \times \frac{1}{2} \times \frac{1}{2} = N/4$, so $z = (n_A - N/2)/\sqrt{N/4}$. Dividing by the variance instead of its square root shrinks $z$ to almost nothing; comparing $n_A$ with $n_B$ doubles the deviation; and $n_A/4$ is not the variance of anything here. The first split, 50,000 against 48,500, is almost 5 standard deviations off: something is losing B's users.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Version B served 800 mobile requests averaging 180 ms and 200 desktop requests averaging 45 ms. What is its mean latency over all 1,000 requests, in milliseconds?
        answer: "153"
        explanation: |
          $(800 \times 180 + 200 \times 45)/1{,}000 = (144{,}000 + 9{,}000)/1{,}000 = 153$ ms. A's is $(200 \times 200 + 800 \times 50)/1{,}000 = 80$ ms. B is faster on each device but nearly twice as slow overall, because four-fifths of its traffic is mobile.
    - question:
        id: work-heavy-users
        type: choice
        system: s2
        prompt: |
          A test randomises 2,000 users and records 400,000 page loads. The analyst computes the standard error of the mean load time as $s/\sqrt{400{,}000}$. What is wrong?
        options:
          - "Page loads from the same user are correlated, so there are far fewer than 400,000 independent measurements; the standard error should be computed per user, for example from each user's mean."
          - "Nothing; more measurements always mean a smaller standard error."
          - "The standard error should use $n - 1$."
          - "Page loads should have been randomised instead of users."
        answer: 0
        explanation: |
          A user on a slow phone is slow on every load. The independent units are the 2,000 users, so the effective sample size is near 2,000, not 400,000, and the true standard error is many times larger. Summarising each user first, or bootstrapping users rather than loads, gives honest error bars. Randomising loads would bring the cache problem back.
  connections:
    - text: |
        B's mean is 153 ms against A's 80 ms, so on the totals B looks almost twice as slow, though it is faster on both mobile and desktop. The totals compare traffic mixes, not versions: B was rolled out to the slow segment first. A randomised split would have given both versions the same mix, and the overall comparison would then have been fair. When a comparison cannot be randomised, compare like with like, segment by segment.

        [[f5.noise-in-measurements-and-benchmarks]] turns from users to machines: comparing two versions of a program on one computer, where the noise comes from caches, clock speeds and the other programs running, and where the same ideas, randomising order, planning the number of runs and not stopping when the result looks good, keep the comparison honest.
