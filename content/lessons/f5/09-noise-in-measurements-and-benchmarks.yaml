                ordered = sorted(values)
                return ordered[math.ceil(p * len(ordered) / 100) - 1]


            def coordinated_waits(recorded, interval):
                # A load tester meant to send one request every `interval` ms, but it waited for each
                # answer before sending the next. For each recorded time r, keep r, and also add the
                # waits r - interval, r - 2 * interval, ... (while still above 0) of the requests that
                # should have been sent during it. Return the corrected list.
                waits = []
                for r in recorded:
                    waits.append(r)
                    extra = r - interval
                    while extra > 0:
                        waits.append(r)
                        extra -= interval
                return waits


            recorded = [1] * 9800 + [2000]
            print(len(coordinated_waits(recorded, 10)), percentile(recorded, 99), percentile(coordinated_waits(recorded, 10), 99))
        explanation: |
          Each long wait hides the requests that were due during it, and each of those waited a little less than the one before. Stopping at `>= 0` adds a request that waited no time at all when `r` is a multiple of the interval; forgetting to keep `r` itself loses the request that was actually recorded; and adding copies of `r` pretends that every hidden request waited the full stall. Corrected, the p99 is 1,000 ms where the raw recording said 1 ms.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          10,000 requests are due every 10 ms; 9,800 of them take 1 ms, and the 200 that fall in a 2-second freeze wait 2,000, 1,990, …, 10 ms. What is the nearest-rank p99 of the 10,000 waits, in milliseconds?
        answer: "1000"
        explanation: |
          The rank is $\lceil 0.99 \times 10{,}000 \rceil = 9{,}900$. The first 9,800 sorted waits are 1 ms, so the 9,900th is the 100th smallest of the stalled waits 10, 20, …, 2,000, which is 1,000 ms.
    - question:
        id: work-blocks
        type: choice
        system: s2
        prompt: |
          An engineer times the old build 30 times, then the new build 30 times, on a laptop. The new build's median is 4% slower. Before believing it, what is the most important thing to do?
        options:
          - "Rerun with the builds interleaved or in shuffled order, since a laptop that heats up over the session would make whichever ran second look slower."
          - "Report the mean instead of the median."
          - "Run each build 30 more times in the same order."
          - "Discard the slowest run of the new build."
        answer: 0
        explanation: |
          Two blocks confound the build with the time of the run. More runs in the same order repeat the same bias, and switching summaries or trimming one build's runs does not touch it. Interleaving, or pairing the builds back to back, puts the drift on both.
  connections:
    - text: |
        The true p99 is 1,000 ms. Of the 10,000 users, 200 met the freeze, waiting anywhere from 10 ms to 2 seconds, and the slowest 1% of all users waited a second or more. The tester saw one slow request instead of two hundred, because it stopped asking while the server was frozen, and so it reported p99 = 1 ms. Measuring from the intended send time, or adding back the hidden requests, recovers the truth.

        This cluster has built the tools to measure honestly: summaries that suit skewed data, intervals, tests, the bootstrap, and the habits of randomising, pairing and planning before looking. [[s3.measuring-and-predicting-running-time]] puts them to work on algorithms, timing code as inputs grow and checking the timings against a prediction. [[f6.arrivals-and-the-poisson-process]] models where queues and their long waits come from, and [[h5.measuring-performance-honestly]] returns to benchmarking at the level of the processor's own counters.
