        explanation: |
          Sorting each list separately throws the pairing away: the fastest old run is compared with the fastest new run, though they ran on different inputs at different moments. The point of pairing is that both members of a pair saw the same input and the same state of the machine, so compare `old[i]` with `new[i]`. A tie is not a win, so the test is `n < o`, and the wins belong to the new version, not the old.
    - question:
        id: write-summarise-runs
        type: code
        mode: write
        system: s2
        prompt: |
          Write `summarise_runs(times, warmup)`. The times are in the order the runs were taken. Drop the first `warmup` runs, and return the minimum and the median of the rest, as a pair. Do not change the list you are given.
        starter: |
          import statistics


          def summarise_runs(times, warmup):
              # times are in the order the runs were taken. Drop the first `warmup` runs,
              # then return the minimum and the median of the rest, as a pair.
              return (0, 0)


          runs = [180, 131, 104, 101, 99, 103, 100, 160, 102, 98, 101]
          print(summarise_runs(runs, 2), summarise_runs(runs, 0))
        solution: |
          import statistics


          def summarise_runs(times, warmup):
              # times are in the order the runs were taken. Drop the first `warmup` runs,
              # then return the minimum and the median of the rest, as a pair.
              kept = times[warmup:]
              return (min(kept), statistics.median(kept))


          runs = [180, 131, 104, 101, 99, 103, 100, 160, 102, 98, 101]
          print(summarise_runs(runs, 2), summarise_runs(runs, 0))
        tests: |
          for _times, _warmup in [([5], 0), ([9, 1, 2], 1), ([9, 8, 1, 2, 3], 2), ([180, 131, 104, 101, 99, 103, 100, 160, 102, 98, 101], 2), ([7, 7, 3, 4], 0), ([50, 10, 20, 30, 40], 1)]:
              _kept = _times[_warmup:]
              _want = (min(_kept), statistics.median(_kept))
              _copy = list(_times)
              _got = summarise_runs(_times, _warmup)
              assert _times == _copy, "summarise_runs should not change the list it is given"
              assert tuple(_got) == _want, "summarise_runs(" + str(_times) + ", " + str(_warmup) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "(98, 101) (98, 102)", "The program should print (98, 101) (98, 102)"
        wrong:
          - |
