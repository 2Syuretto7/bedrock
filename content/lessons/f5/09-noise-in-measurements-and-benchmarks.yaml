                # times are in the order the runs were taken. Drop the first `warmup` runs,
                # then return the minimum and the median of the rest, as a pair.
                kept = times[:len(times) - warmup]
                return (min(kept), statistics.median(kept))


            runs = [180, 131, 104, 101, 99, 103, 100, 160, 102, 98, 101]
            print(summarise_runs(runs, 2), summarise_runs(runs, 0))
          - |
