        explanation: |
          Warm-up is about *when* a run happened, so drop by position, `times[warmup:]`, before any sorting. Sorting first and then dropping removes the fastest runs instead of the earliest. Dropping from the end removes the steady runs and keeps the cold ones, and the mean is not robust to the interrupted run at 160 ms.
    - question:
        id: write-coordinated
        type: code
        mode: write
        system: s2
        prompt: |
          Write `coordinated_waits(recorded, interval)`. A load tester meant to send a request every `interval` ms, but it waited for each answer before sending the next. For each recorded time `r`, keep `r`, and also add the waits `r - interval`, `r - 2 * interval`, and so on, while they are still above 0, of the requests that should have been sent during it. Return the corrected list.
        starter: |
          import math


          def percentile(values, p):
              ordered = sorted(values)
              return ordered[math.ceil(p * len(ordered) / 100) - 1]


          def coordinated_waits(recorded, interval):
              # A load tester meant to send one request every `interval` ms, but it waited for each
              # answer before sending the next. For each recorded time r, keep r, and also add the
              # waits r - interval, r - 2 * interval, ... (while still above 0) of the requests that
              # should have been sent during it. Return the corrected list.
              return list(recorded)


          recorded = [1] * 9800 + [2000]
          print(len(coordinated_waits(recorded, 10)), percentile(recorded, 99), percentile(coordinated_waits(recorded, 10), 99))
        solution: |
          import math


          def percentile(values, p):
              ordered = sorted(values)
              return ordered[math.ceil(p * len(ordered) / 100) - 1]


          def coordinated_waits(recorded, interval):
              # A load tester meant to send one request every `interval` ms, but it waited for each
              # answer before sending the next. For each recorded time r, keep r, and also add the
              # waits r - interval, r - 2 * interval, ... (while still above 0) of the requests that
              # should have been sent during it. Return the corrected list.
              waits = []
              for r in recorded:
                  waits.append(r)
                  extra = r - interval
                  while extra > 0:
                      waits.append(extra)
                      extra -= interval
              return waits


          recorded = [1] * 9800 + [2000]
          print(len(coordinated_waits(recorded, 10)), percentile(recorded, 99), percentile(coordinated_waits(recorded, 10), 99))
        tests: |
          for _recorded, _interval in [([], 10), ([5], 10), ([10], 10), ([25], 10), ([1, 30, 2], 10), ([1, 1, 1, 100], 20), ([7, 3, 12], 5)]:
              _want = []
              for _r in _recorded:
                  _want.append(_r)
                  _x = _r - _interval
                  while _x > 0:
                      _want.append(_x)
                      _x -= _interval
              _got = coordinated_waits(_recorded, _interval)
              assert sorted(_got) == sorted(_want), "coordinated_waits(" + str(_recorded) + ", " + str(_interval) + ") should give, in some order, " + str(sorted(_want)) + ", not " + str(sorted(_got))
          assert output.strip() == "10000 1 1000", "The program should print 10000 1 1000"
        wrong:
          - |
            import math


            def percentile(values, p):
                ordered = sorted(values)
                return ordered[math.ceil(p * len(ordered) / 100) - 1]


            def coordinated_waits(recorded, interval):
                # A load tester meant to send one request every `interval` ms, but it waited for each
                # answer before sending the next. For each recorded time r, keep r, and also add the
                # waits r - interval, r - 2 * interval, ... (while still above 0) of the requests that
                # should have been sent during it. Return the corrected list.
                waits = []
                for r in recorded:
                    waits.append(r)
                    extra = r - interval
                    while extra >= 0:
                        waits.append(extra)
                        extra -= interval
                return waits


            recorded = [1] * 9800 + [2000]
            print(len(coordinated_waits(recorded, 10)), percentile(recorded, 99), percentile(coordinated_waits(recorded, 10), 99))
          - |
            import math


            def percentile(values, p):
                ordered = sorted(values)
                return ordered[math.ceil(p * len(ordered) / 100) - 1]


            def coordinated_waits(recorded, interval):
                # A load tester meant to send one request every `interval` ms, but it waited for each
                # answer before sending the next. For each recorded time r, keep r, and also add the
                # waits r - interval, r - 2 * interval, ... (while still above 0) of the requests that
                # should have been sent during it. Return the corrected list.
                waits = []
                for r in recorded:
                    extra = r - interval
                    while extra > 0:
                        waits.append(extra)
                        extra -= interval
                return waits


            recorded = [1] * 9800 + [2000]
            print(len(coordinated_waits(recorded, 10)), percentile(recorded, 99), percentile(coordinated_waits(recorded, 10), 99))
