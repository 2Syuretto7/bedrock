    - question:
        id: work-hot-counter
        type: choice
        system: s2
        prompt: |
          A web server on 64 cores counts every request in one atomic counter, and profiling shows the counter itself is slowing requests down. What is the usual fix?
        options:
          - "Give each core its own counter and add them up only when the total is read"
          - "Replace the atomic counter with a mutex"
          - "Use a compare-and-swap loop instead of fetch-and-add"
          - "Count only every tenth request"
        answer: 0
        explanation: |
          The cost is the cache line bouncing between 64 cores. Per-core counters are written only by their own core, so they stay in its cache; reading the total sums 64 numbers, which is rare and cheap. A mutex or a CAS loop bounces the same line, and worse.
  connections:
    - text: |
        Ten. In the first round all four compare against the same old value and only one wins; the three losers re-read and try again, and two of them lose; then one; then the last succeeds alone. 4 + 3 + 2 + 1 attempts, growing with the square of the threads. Fetch-and-add would do the same work in four.

        All of this lesson quietly assumed that when one core writes a word, every other core sees the writes in the order they were made. Real processors and compilers do not promise that: they reorder loads and stores for speed, and a thread can see another's flag set before the data the flag announces. [[d0.memory-models-and-happens-before]] explains what is actually promised, and how fences, acquire and release restore order where it matters.
