        explanation: |
          cas compares, writes and reports; fetch_add remembers the old value, adds, and returns the old value; increment loops: load, yield, count the attempt, and return once the cas succeeds. A cas that writes without comparing loses updates; trying once without retrying loses every increment that collides; and returning the new value from fetch_add breaks every use of it as a ticket, since the first caller should get the original value.
    - question:
        id: write-ticket-lock
        type: code
        mode: write
        system: s2
        prompt: |
          Write `acquire` and `release` for a ticket lock built on fetch-and-add. The program should print `finished ['ravi', 'ravi', 'anu', 'anu', 'joseph', 'joseph']` and `3 3`.
        starter: |
          class Atomic:
              def __init__(self, value):
                  self.value = value

              def load(self):
                  return self.value

              def store(self, value):
                  self.value = value

              def fetch_add(self, amount):
                  old = self.value
                  self.value = old + amount
                  return old


          class TicketLock:
              # A fair spinlock, like the queue tokens at a bank. acquire takes the
              # next ticket with one atomic fetch_add, then waits until now_serving
              # reaches it. release serves the next ticket. Threads enter strictly in
              # the order they took tickets.
              def __init__(self):
                  self.next_ticket = Atomic(0)
                  self.now_serving = Atomic(0)

              def acquire(self):
                  yield "waiting"

              def release(self):
                  pass


          def customer(name, lock, order):
              yield "walking in"
              yield from lock.acquire()
              order.append(name)
              yield "at the counter"
              order.append(name)
              lock.release()


          def run(threads):
              while threads:
                  moved = False
                  for t in list(threads):
                      try:
                          if next(t) != "waiting":
                              moved = True
                      except StopIteration:
                          threads.remove(t)
                          moved = True
                  if not moved:
                      return "stuck"
              return "finished"


          lock = TicketLock()
          order = []
          print(run([customer(name, lock, order) for name in ["ravi", "anu", "joseph"]]), order)
          print(lock.next_ticket.load(), lock.now_serving.load())
        solution: |
          class Atomic:
              def __init__(self, value):
                  self.value = value

              def load(self):
                  return self.value

              def store(self, value):
                  self.value = value

              def fetch_add(self, amount):
                  old = self.value
                  self.value = old + amount
                  return old


          class TicketLock:
              # A fair spinlock, like the queue tokens at a bank. acquire takes the
              # next ticket with one atomic fetch_add, then waits until now_serving
              # reaches it. release serves the next ticket. Threads enter strictly in
              # the order they took tickets.
              def __init__(self):
                  self.next_ticket = Atomic(0)
                  self.now_serving = Atomic(0)

              def acquire(self):
                  mine = self.next_ticket.fetch_add(1)
                  while self.now_serving.load() != mine:
                      yield "waiting"

              def release(self):
                  self.now_serving.store(self.now_serving.load() + 1)


          def customer(name, lock, order):
              yield "walking in"
              yield from lock.acquire()
              order.append(name)
              yield "at the counter"
              order.append(name)
              lock.release()


          def run(threads):
              while threads:
                  moved = False
                  for t in list(threads):
                      try:
                          if next(t) != "waiting":
                              moved = True
                      except StopIteration:
                          threads.remove(t)
                          moved = True
                  if not moved:
                      return "stuck"
              return "finished"


          lock = TicketLock()
          order = []
          print(run([customer(name, lock, order) for name in ["ravi", "anu", "joseph"]]), order)
          print(lock.next_ticket.load(), lock.now_serving.load())
        tests: |
          _l = TicketLock()
          for _x in _l.acquire():
              raise AssertionError("the first thread to take a ticket should go straight in")
