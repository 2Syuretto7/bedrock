          class Atomic:
              def __init__(self, value):
                  self.value = value

              def load(self):
                  return self.value

              def cas(self, expected, new):
                  if self.value == expected:
                      self.value = new
                      return True
                  return False


          class Stack:
              # A lock-free stack. Nodes are kept by number in self.nodes and are
              # reused after they are popped, as a memory allocator reuses freed
              # memory. top is the only shared word, changed by compare-and-swap. It
              # holds the top node and a version that every change increases, so a
              # node that comes back to the top no longer looks unchanged.
              def __init__(self):
                  self.nodes = {}
                  self.top = Atomic((None, 0))

              def push(self, node, value):
                  self.nodes[node] = {"value": value, "next": None}
                  while True:
                      old = self.top.load()
                      self.nodes[node]["next"] = old[0]
                      yield "read the top"
                      if self.top.cas(old, (node, old[1] + 1)):
                          return

              def pop(self, out):
                  while True:
                      old = self.top.load()
                      if old[0] is None:
                          out.append(None)
                          return
                      after = self.nodes[old[0]]["next"]
                      yield "read the top"
                      if self.top.cas(old, (after, old[1] + 1)):
                          out.append(self.nodes[old[0]]["value"])
                          return


