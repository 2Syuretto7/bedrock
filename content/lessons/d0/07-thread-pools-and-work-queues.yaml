            def run_stealing(deques):
                # Each worker has its own deque of tasks, a list whose end is the
                # bottom. In every round, each worker in turn runs one task: the one at
                # the bottom of its own deque, the task it pushed most recently. If its
                # deque is empty it steals from the top (the oldest task) of the deque
                # with the most tasks left, the lowest-numbered on a tie, and runs that.
                # Stop when every deque is empty. Return each worker's tasks in the
                # order it ran them.
                ran = [[] for d in deques]
                while any(deques):
                    for w in range(len(deques)):
                        if deques[w]:
                            ran[w].append(deques[w].pop())
                        else:
                            victim = 0
                            for v in range(len(deques)):
                                if deques[v] and not deques[victim]:
                                    victim = v
                            if deques[victim]:
                                ran[w].append(deques[victim].pop(0))
                return ran


            deques = [["a1", "a2", "a3", "a4", "a5", "a6"], [], ["c1"]]
            print(run_stealing(deques))
        explanation: |
          While any deque has tasks, give each worker a turn: pop from the end of its own list, or, if it is empty, find the longest deque, the first on a tie, and take from its front. An owner taking from the front works oldest first, losing the cache benefit and colliding with thieves; a thief taking from the end fights the owner for its newest task; and stealing from the first non-empty deque ignores where the work actually is.
