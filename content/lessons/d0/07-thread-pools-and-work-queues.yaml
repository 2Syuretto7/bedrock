    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. Requests compute for 10 ms and wait 90 ms for the database, on 8 cores. About how many workers keep all the cores busy?
        answer: "80"
        explanation: |
          Each worker uses its core only 10 ms in every 100, a tenth of the time, so it takes ten workers per core: 8 × (1 + 90 / 10) = 80, provided the database can serve that many queries at once.
    - question:
        id: work-nested
        type: choice
        system: s2
        prompt: |
          A report service has a pool of 8 workers. Each report task submits 3 chart tasks to the same pool and waits for them. Under load the service freezes with all 8 workers waiting. What is the fix?
        options:
          - "Run the chart tasks on a separate pool, or use a fork-join pool whose waiting workers run queued tasks while they wait"
          - "Add a timeout to the chart tasks"
          - "Make the queue unbounded"
          - "Use 9 workers"
        answer: 0
        explanation: |
          This is thread starvation deadlock: every worker holds a report waiting for charts that no free worker can run. A separate pool or a pool whose waiters help out breaks the cycle; one more worker only moves the point at which it freezes.
  connections:
    - text: |
        About 80. A worker keeps its core busy only during the 10 ms it computes out of every 100 ms, so each core needs ten workers taking turns. With fewer, the cores idle while every thread waits for the database; with many more, the threads only queue at the database and use memory.

        Eighty threads to keep eight cores busy is mostly threads that are asleep, waiting. With ten thousand open connections, each mostly idle, even a pool becomes heavy. The alternative is to stop dedicating a thread to each wait: one thread asks the kernel which of its connections are ready and serves whichever are. [[d0.event-loops-and-asynchronous-i-o]] builds that event loop, and the async and await that make it readable.
