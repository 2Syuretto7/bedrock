                return sum(durations) // workers, ran


            def fixed_split(durations, workers):
                # For comparison: task i is handed to worker i % workers in advance.
                free_at = [0] * workers
                for task in range(len(durations)):
                    free_at[task % workers] += durations[task]
                return max(free_at)


            tasks = [6, 1, 1, 1, 5, 1, 1, 2]
            print(run_pool(tasks, 2))
            print(fixed_split(tasks, 2), run_pool(tasks, 3)[0], run_pool(tasks, 8)[0])
        explanation: |
          Keep the time at which each worker becomes free. For each task in queue order, give it to the worker free earliest, the lowest-numbered on a tie, and move that worker's free time on by the task's length; the answer is the latest free time. Choosing the worker free latest piles everything on one worker; assigning by position is the fixed split again; and dividing the total work by the workers gives a time no real schedule may reach.
    - question:
        id: write-stealing
        type: code
        mode: write
        system: s2
        prompt: |
          Write `run_stealing`, which runs workers with a deque each: owners pop from the bottom, and idle workers steal from the top of the fullest deque. The program should print `[['a6', 'a5', 'a4'], ['a1', 'a2'], ['c1', 'a3']]`.
        starter: |
          def run_stealing(deques):
              # Each worker has its own deque of tasks, a list whose end is the
              # bottom. In every round, each worker in turn runs one task: the one at
              # the bottom of its own deque, the task it pushed most recently. If its
              # deque is empty it steals from the top (the oldest task) of the deque
              # with the most tasks left, the lowest-numbered on a tie, and runs that.
              # Stop when every deque is empty. Return each worker's tasks in the
              # order it ran them.
              return [[] for d in deques]

          deques = [["a1", "a2", "a3", "a4", "a5", "a6"], [], ["c1"]]
          print(run_stealing(deques))
        solution: |
          def run_stealing(deques):
              # Each worker has its own deque of tasks, a list whose end is the
              # bottom. In every round, each worker in turn runs one task: the one at
              # the bottom of its own deque, the task it pushed most recently. If its
              # deque is empty it steals from the top (the oldest task) of the deque
              # with the most tasks left, the lowest-numbered on a tie, and runs that.
              # Stop when every deque is empty. Return each worker's tasks in the
              # order it ran them.
              ran = [[] for d in deques]
              while any(deques):
                  for w in range(len(deques)):
                      if deques[w]:
                          ran[w].append(deques[w].pop())
                      else:
                          victim = 0
                          for v in range(len(deques)):
                              if len(deques[v]) > len(deques[victim]):
                                  victim = v
                          if deques[victim]:
                              ran[w].append(deques[victim].pop(0))
              return ran


          deques = [["a1", "a2", "a3", "a4", "a5", "a6"], [], ["c1"]]
          print(run_stealing(deques))
        tests: |
          assert run_stealing([[], []]) == [[], []], "with no tasks nobody runs anything"
          assert run_stealing([["t1", "t2", "t3"]]) == [["t3", "t2", "t1"]], "a worker alone runs its own tasks from the bottom, newest first"
          _r = run_stealing([["a1", "a2", "a3", "a4"], []])
          assert _r == [["a4", "a3"], ["a1", "a2"]], "the owner works from the bottom while the thief steals from the top, the oldest first, not " + repr(_r)
          _r = run_stealing([[], ["p1", "p2"], ["q1", "q2", "q3", "q4"]])
          assert _r[0][0] == "q1", "an idle worker steals from the deque with the most tasks left, so worker 0 first steals q1, not " + repr(_r[0][:1])
          assert sorted(_r[0] + _r[1] + _r[2]) == ["p1", "p2", "q1", "q2", "q3", "q4"], "every task runs exactly once"
          _r = run_stealing([["x1", "x2"], ["y1", "y2"], []])
          assert _r[2][0] == "x1", "on a tie the thief picks the lowest-numbered worker's deque, so it steals x1, not " + repr(_r[2][:1])
          assert output.splitlines() == ["[['a6', 'a5', 'a4'], ['a1', 'a2'], ['c1', 'a3']]"], "The program should print [['a6', 'a5', 'a4'], ['a1', 'a2'], ['c1', 'a3']]"
