    - question:
        id: write-semaphore
        type: code
        mode: write
        system: s2
        prompt: |
          Write a fair counting semaphore: `acquire` takes a free permit or queues, and `release` hands the permit to the first in the queue. The program should print `3 at once at most` and the ten photos in order.
        starter: |
          class Semaphore:
              # A counting semaphore holding count permits. acquire takes a permit if
              # one is free and nobody is queued; otherwise the thread joins the back
              # of the queue and waits. release hands its permit straight to the
              # first thread in the queue, or puts it back if nobody is waiting.
              def __init__(self, count):
                  self.count = count
                  self.queue = []

              def acquire(self, name):
                  return
                  yield "waiting"

              def release(self):
                  pass


          def download(name, sem, active, log):
              yield from sem.acquire(name)
              active.append(name)
              log.append((name, len(active)))
              yield "downloading"
              yield "downloading"
              active.remove(name)
              sem.release()


          def run(threads):
              seconds = 0
              while threads:
                  for t in list(threads):
                      try:
                          next(t)
                      except StopIteration:
                          threads.remove(t)
                  seconds += 1
              return seconds


          sem = Semaphore(3)
