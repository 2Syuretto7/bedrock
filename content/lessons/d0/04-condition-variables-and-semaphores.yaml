        explanation: |
          acquire takes a permit at once only if one is free and nobody is queued; otherwise it joins the back of the queue and waits until it is removed. release removes the first in the queue, which hands it the permit, and only puts the permit back when nobody waits. Also adding to the count when handing over creates permits out of thin air; waking the last in the queue lets latecomers overtake; and testing count >= 0 lets a thread in when no permit is left.
