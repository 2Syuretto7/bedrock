          take checks for jobs and then yields before it joins the condition's queue. In that gap the office sends the job and notifies nobody, and the printer then sleeps through a wakeup that has already happened. Checking and starting to wait must be one step, so remove the yield in between. Notifying twice cannot help a thread that is not yet waiting; spinning instead of waiting avoids the stall but burns the processor; and waiting with if instead of while crashes when another taker grabs the job first.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. 10 uploads of 2 seconds each, at most 3 at once. How many seconds until all are done?
        answer: "8"
        explanation: |
          Three run in the first 2 seconds, three in the next 2, three in the next 2, and the tenth alone in the last 2: 4 rounds of 2 seconds. The last round uses only one permit, so a limit of 4 or 5 would cut it to 6 seconds.
    - question:
        id: work-unbounded
        type: choice
        system: s2
        prompt: |
          A logging service puts messages on an unbounded queue for a thread that writes them to a slow disk. During a traffic spike its memory grows until it crashes. What fixes it?
        options:
          - "Bound the queue, so producers wait or messages are dropped by policy when it is full, and the writer's pace pushes back on them"
          - "Make the queue unbounded on disk too"
          - "Use notify_all instead of notify"
          - "Add a second lock around the queue"
        answer: 0
        explanation: |
          An unbounded buffer hides a consumer that is slower than its producers until memory runs out. A bound turns the mismatch into backpressure, or into a deliberate decision about what to drop.
  connections:
    - text: |
        8 seconds. The semaphore lets uploads through three at a time, so the 10 photos go in rounds of 3, 3, 3 and 1, each round lasting 2 seconds. The last round wastes two permits, which is why the total is set by rounding up, not by dividing.

        Locks, condition variables and semaphores are all built on something smaller: a handful of machine instructions that read and change one memory word indivisibly, even when several cores run them at once. Those instructions can also be used directly, to build counters, stacks and queues that never lock at all. [[d0.atomic-operations-and-compare-and-swap]] looks at them, at compare-and-swap above all, and at the strange bug called ABA.
