          - "Add a sleep before reading the buffer"
          - "Mark ready volatile in C++"
          - "Set ready twice"
        answer: 0
        explanation: |
          The program has a data race, so it has no defined meaning; on ARM the flag can become visible before the buffer. Release and acquire make the buffer writes happen before the reads. C++'s volatile, unlike Java's, gives no ordering between threads.
