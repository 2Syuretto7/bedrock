    - text: |
        All four. The three interleavings allow, and (0, 0) as well: on x86 a load may run while its own core's earlier store still waits in the store buffer, so both threads can read 0. This is the one reordering x86 permits, and it is exactly what the puzzle's two programs expose.

        From here on the cluster stops building synchronisation and starts using it. A pool of worker threads takes tasks from a shared queue; the queue's lock or atomics give the happens-before that makes each task's inputs visible to the worker that runs it, and its result visible to whoever collects it. [[d0.thread-pools-and-work-queues]] asks how many workers to run, how to share the work fairly, and how to stop a flood of tasks from sinking the pool.
