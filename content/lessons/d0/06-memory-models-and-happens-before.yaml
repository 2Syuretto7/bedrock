            def get_fares(name, cache, lock, loads, out):
                # Lazily load the fare table once and share it. The first check needs
                # no lock, so that once the table exists, readers never wait. Anything
                # a reader can see through cache["fares"] must already be complete.
                if cache["fares"] is None:
                    yield from lock.acquire(name)
                    loads.append(name)
                    fresh = {}
                    yield "reading the fare file"
                    for key, value in load_fares().items():
                        fresh[key] = value
                    cache["fares"] = fresh
                    lock.release(name)
                out.append((name, cache["fares"].get("per_km")))


            def run(threads):
                while threads:
                    for t in list(threads):
                        try:
                            next(t)
                        except StopIteration:
                            threads.remove(t)


            cache = {"fares": None}
            lock = Lock()
            loads = []
            out = []
            run([get_fares(n, cache, lock, loads, out) for n in ["gate1", "gate2", "gate3"]])
            print(out, loads, lock.taken)
        explanation: |
          The table is published, through cache["fares"], before it is filled, and readers that skip the lock see the empty dictionary. Build it completely in a local variable and publish it with one store at the end. Publishing the local dictionary before filling it is the same bug, since it is the same object; taking the lock on every call is correct but makes every later reader wait; and dropping the check inside the lock lets every gate that arrived early load the file again.
