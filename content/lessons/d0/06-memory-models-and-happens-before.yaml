          def run_tso(threads, schedule):
              # A machine with a store buffer per core. threads holds two lists of
              # operations: ("store", var, value), ("load", var, register), ("fence",).
              # schedule is a list of actions: ("step", i) runs thread i's next
              # operation; ("drain", i) moves the oldest store in core i's buffer to
              # memory. A store goes into its core's buffer; a load takes the newest
              # value for that variable in its own buffer if there is one, otherwise
              # memory (where every variable starts at 0); a fence may only run when
              # its core's buffer is empty. Return the registers as a dictionary, or
              # None if the schedule is impossible or leaves anything unfinished.
              memory = {}
              buffers = [[], []]
              pc = [0, 0]
              registers = {}
              for kind, i in schedule:
                  if kind == "drain":
                      if not buffers[i]:
                          return None
                      var, value = buffers[i].pop(0)
                      memory[var] = value
                      continue
                  if pc[i] >= len(threads[i]):
                      return None
                  op = threads[i][pc[i]]
                  if op[0] == "store":
                      buffers[i].append((op[1], op[2]))
                  elif op[0] == "load":
                      value = memory.get(op[1], 0)
                      for var, v in buffers[i]:
                          if var == op[1]:
                              value = v
                      registers[op[2]] = value
                  elif buffers[i]:
                      return None
                  pc[i] += 1
              if pc != [len(threads[0]), len(threads[1])] or buffers != [[], []]:
                  return None
              return registers


