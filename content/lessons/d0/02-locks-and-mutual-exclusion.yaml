        explanation: |
          The refusal returns while still holding the lock, so every later transfer waits for ever. Release it before returning; with real threads, `with lock:` or `try` and `finally` would do this on every path. Checking the balance before taking the lock lets two transfers both pass the check; releasing before the ledger write lets others see money in flight; and releasing on refusal without returning goes on to make the transfer anyway and then releases a lock it no longer holds.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. Each request holds one global lock for 2 ms. What is the most requests per second the server can complete, however many cores and threads it has?
        answer: "500"
        explanation: |
          Only one thread can hold the lock, for 2 ms per request, so at most 1 / 0.002 = 500 requests a second pass through it. With 64 threads each taking 10 ms the server could otherwise reach 6,400 a second; the lock caps it at 500.
    - question:
        id: work-fix-ceiling
        type: choice
        system: s2
        prompt: |
          The team wants 5,000 requests a second from the ticketing server. Which change can get there?
        options:
          - "Split the seat map so each block of seats has its own lock, so requests for different blocks hold different locks"
          - "Raise the thread count from 64 to 640"
          - "Move to a machine with 128 cores"
          - "Use a spinlock instead of a sleeping mutex"
        answer: 0
        explanation: |
          The ceiling is set by one serial lane, 2 ms per request. More threads or cores only lengthen the queue, and a spinlock changes the cost of waiting, not the length of the critical section. With ten or more independent seat blocks, requests spread over many locks and the ceiling rises in proportion.
  connections:
    - text: |
        500 requests a second. Each request occupies the lock for 2 ms, and only one can occupy it at a time, so the lock passes on at most 500 times a second. Adding threads only makes the queue for the lock longer, and the 30 idle cores do not help. To go faster, hold the lock for less time, or split it.

        Splitting is where the trouble starts. A transfer between two accounts, each with its own lock, must hold both, and two transfers that take the same two locks in opposite orders can each hold one and wait for ever for the other. [[d0.deadlock]] studies that standoff, how to detect it, and the simple rule that prevents it.
