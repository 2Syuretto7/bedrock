                        raise RuntimeError(name + " released a lock it does not hold")
                    self.holder = None


            def deposit(name, lock, account):
                for i in range(2):
                    yield from lock.acquire(name)
                    balance = account["balance"]
                    yield "preempted inside the critical section"
                    account["balance"] = balance + 100
                    lock.release(name)
                    yield "outside"


            def run(threads):
                while threads:
                    for t in list(threads):
                        try:
                            next(t)
                        except StopIteration:
                            threads.remove(t)


            lock = Lock()
            account = {"balance": 0}
            run([deposit(n, lock, account) for n in ["A", "B", "C"]])
            print(account["balance"], lock.holder, lock.waits > 0)
          - |
            class Lock:
                # A lock for threads written as generators. A thread takes it with
                # `yield from lock.acquire(name)`: while another thread holds it, the
                # thread yields "waiting" and tries again on its next turn. Code between
                # two yields runs as one step, so testing and taking the lock in the
                # same step is atomic. release(name) frees it, and raises RuntimeError
                # if name does not hold it.
                def __init__(self):
                    self.holder = None
                    self.waits = 0

                def acquire(self, name):
                    while self.holder is not None:
                        self.waits += 1
                        yield "waiting"
                    yield "about to take the lock"
                    self.holder = name

                def release(self, name):
                    if self.holder != name:
                        raise RuntimeError(name + " released a lock it does not hold")
                    self.holder = None


            def deposit(name, lock, account):
                for i in range(2):
                    yield from lock.acquire(name)
                    balance = account["balance"]
                    yield "preempted inside the critical section"
                    account["balance"] = balance + 100
                    lock.release(name)
                    yield "outside"


            def run(threads):
                while threads:
                    for t in list(threads):
                        try:
                            next(t)
                        except StopIteration:
                            threads.remove(t)


