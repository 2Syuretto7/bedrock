          - |
            class Lock:
                # A lock for threads written as generators. A thread takes it with
                # `yield from lock.acquire(name)`: while another thread holds it, the
                # thread yields "waiting" and tries again on its next turn. Code between
                # two yields runs as one step, so testing and taking the lock in the
                # same step is atomic. release(name) frees it, and raises RuntimeError
                # if name does not hold it.
                def __init__(self):
                    self.holder = None
                    self.waits = 0

                def acquire(self, name):
                    while self.holder is not None:
                        self.waits += 1
                        yield "waiting"
                    self.holder = name

                def release(self, name):
                    self.holder = None


            def deposit(name, lock, account):
                for i in range(2):
                    yield from lock.acquire(name)
                    balance = account["balance"]
                    yield "preempted inside the critical section"
                    account["balance"] = balance + 100
                    lock.release(name)
                    yield "outside"


            def run(threads):
                while threads:
                    for t in list(threads):
                        try:
                            next(t)
                        except StopIteration:
                            threads.remove(t)


            lock = Lock()
            account = {"balance": 0}
            run([deposit(n, lock, account) for n in ["A", "B", "C"]])
            print(account["balance"], lock.holder, lock.waits > 0)
        explanation: |
          acquire loops while the lock is held, counting a wait and yielding each time, and takes it in the same step as the test that finds it free; release checks the holder and clears it. Testing once with if lets a thread take the lock after one wait even if another thread took it first; yielding between the test and the take reopens the gap that makes a flag fail; and a release that never checks the holder lets one thread free a lock another thread holds.
    - question:
        id: write-peterson
        type: code
        mode: write
        system: s2
        prompt: |
          Write `enter` and `leave` for Peterson's algorithm, and let the program check every schedule of 12 steps. It should print `0 of 4096 schedules break mutual exclusion` and `both finish taking turns: True`.
        starter: |
          def enter(i, shared):
              # Peterson's algorithm: thread i (0 or 1) waits until it may enter the
              # critical section. Each write to shared memory is one step, so yield
              # after it; the test in the while loop is one step too. shared["flag"]
              # is a list of two booleans and shared["turn"] is 0 or 1.
              yield


          def leave(i, shared):
              # Thread i leaves the critical section.
              yield


          def thread(i, shared, inside):
              yield from enter(i, shared)
              inside.append(i)
              yield
              inside.remove(i)
              yield from leave(i, shared)


          def run(choices):
              # Run both threads, letting choices pick who moves at each step (the
              # other thread moves when the chosen one has finished). Return whether
              # both were ever inside at once, and whether both finished.
              shared = {"flag": [False, False], "turn": 0}
              inside = []
              threads = {0: thread(0, shared, inside), 1: thread(1, shared, inside)}
              clash = False
              for c in choices:
                  if not threads:
                      break
                  if c not in threads:
                      c = 1 - c
                  try:
                      next(threads[c])
                  except StopIteration:
                      del threads[c]
                  if len(inside) == 2:
                      clash = True
              return clash, not threads


          schedules = [[(n >> k) & 1 for k in range(12)] for n in range(2 ** 12)]
          clashes = sum(1 for s in schedules if run(s)[0])
          print(clashes, "of", len(schedules), "schedules break mutual exclusion")
          print("both finish taking turns:", run([0, 1] * 20)[1])
        solution: |
          def enter(i, shared):
              # Peterson's algorithm: thread i (0 or 1) waits until it may enter the
              # critical section. Each write to shared memory is one step, so yield
              # after it; the test in the while loop is one step too. shared["flag"]
              # is a list of two booleans and shared["turn"] is 0 or 1.
              other = 1 - i
              shared["flag"][i] = True
              yield
              shared["turn"] = other
              yield
              while shared["flag"][other] and shared["turn"] == other:
                  yield


          def leave(i, shared):
              # Thread i leaves the critical section.
              shared["flag"][i] = False
              yield


          def thread(i, shared, inside):
              yield from enter(i, shared)
              inside.append(i)
              yield
              inside.remove(i)
              yield from leave(i, shared)


          def run(choices):
              # Run both threads, letting choices pick who moves at each step (the
              # other thread moves when the chosen one has finished). Return whether
              # both were ever inside at once, and whether both finished.
              shared = {"flag": [False, False], "turn": 0}
              inside = []
              threads = {0: thread(0, shared, inside), 1: thread(1, shared, inside)}
              clash = False
              for c in choices:
                  if not threads:
                      break
                  if c not in threads:
                      c = 1 - c
                  try:
                      next(threads[c])
                  except StopIteration:
                      del threads[c]
                  if len(inside) == 2:
                      clash = True
              return clash, not threads


          schedules = [[(n >> k) & 1 for k in range(12)] for n in range(2 ** 12)]
          clashes = sum(1 for s in schedules if run(s)[0])
          print(clashes, "of", len(schedules), "schedules break mutual exclusion")
          print("both finish taking turns:", run([0, 1] * 20)[1])
        tests: |
          _bad = [_n for _n in range(2 ** 11) if run([(_n >> _k) & 1 for _k in range(11)])[0]]
          assert not _bad, "both threads were inside the critical section at once under the schedule " + repr([(_bad[0] >> _k) & 1 for _k in range(11)])
          assert run([0, 1] * 20)[1], "taking turns one step at a time, both threads should get in and finish"
          assert run([0] * 20)[1] and run([1] * 20)[1], "one thread running alone should get in at once and finish, and then the other"
          assert run([0, 0, 1, 1, 1] + [0, 1] * 10)[1], "when both want to enter, the one that set turn last waits and the other goes first; both should finish"
          _sh = {"flag": [False, False], "turn": 0}
          for _x in enter(1, _sh):
              pass
          assert _sh["flag"][1] and _sh["turn"] == 0, "thread 1 entering alone should raise its flag and give the turn to thread 0"
          for _x in leave(1, _sh):
              pass
          assert _sh["flag"] == [False, False], "leaving lowers the thread's flag"
          assert output.splitlines() == ["0 of 4096 schedules break mutual exclusion", "both finish taking turns: True"], "The program should print 0 of 4096 schedules break mutual exclusion and both finish taking turns: True"
        wrong:
          - |
            def enter(i, shared):
                # Peterson's algorithm: thread i (0 or 1) waits until it may enter the
                # critical section. Each write to shared memory is one step, so yield
                # after it; the test in the while loop is one step too. shared["flag"]
                # is a list of two booleans and shared["turn"] is 0 or 1.
                other = 1 - i
