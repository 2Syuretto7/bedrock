        explanation: |
          Raise your flag, give the turn to the other thread, then wait while the other's flag is up and it is the other's turn; to leave, lower your flag. Giving the turn away before raising the flag lets both threads slip in; waiting while either condition holds, with or, makes both wait for ever when both want in; and taking the turn for yourself rather than giving it away lets both decide it is their turn.
