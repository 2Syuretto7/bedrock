          Build one random.Random(seed) for the whole run. While threads remain, choose one of the unfinished threads with it, record its number, and step it, dropping it when it finishes; hunt runs seeds from 0 and returns the first failing seed with its schedule. The shared random module gives a different schedule each time for the same seed; a new generator for every step makes the same choice at every step; and recording the position in the list of unfinished threads, instead of the thread's number, gives a schedule that replays differently.
