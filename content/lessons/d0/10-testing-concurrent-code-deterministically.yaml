    - question:
        id: work-bound
        type: choice
        system: s2
        prompt: |
          An explorer for three threads of 20 steps each would need far more schedules than it could ever run. What is the most effective plan?
        options:
          - "Explore every schedule with at most two preemptions, then sample the rest with seeded random schedules"
          - "Run the test without a scheduler many times overnight"
          - "Explore only the six orders that run each thread to the end"
          - "Reduce the threads to one"
        answer: 0
        explanation: |
          Bounded preemptions cover, exhaustively, the small schedules where many real bugs live, and seeded sampling reaches further while keeping every failure replayable. The six sequential orders contain no interleaving at all.
  connections:
    - text: |
        1,84,756, which is C(20, 10): a schedule is fixed by choosing which 10 of the 20 steps belong to the first thread. With 20 steps each it would be about 13,785 crore, which is why real explorers bound preemptions, prune independent steps and sample with seeds.

        Every schedule in this lesson was chosen by the test. Real systems do not choose: requests arrive whenever people press buttons, and how long the queue in front of a pool, an event loop or an actor grows depends on how those arrivals bunch up. [[f6.arrivals-and-the-poisson-process]] begins the queueing cluster with a model of random arrivals, the starting point for predicting waits instead of discovering them in production.
