concept: d0.interleavings-and-race-conditions
minutes: 80
claim: You can treat concurrent threads as interleaved sequences of atomic steps, count the interleavings of two threads and see why testing them all is hopeless; simulate a read-modify-write race step by step and predict every final value it can produce, including the surprising smallest one; recognise the other common races, check-then-act and publishing half-built data; tell a race condition from a data race; explain why races hide from ordinary tests and surface under load; and repair a race by making the check and the action one indivisible step.
recalls: [h2.signals-and-the-life-of-a-process, s6.fuzzing, s6.deterministic-tests-seeds-clocks-and-fakes]
uses: [h2.threads-in-the-kernel, h2.scheduling, h2.interrupts-and-i-o, s6.flaky-tests-and-their-causes, s1.generators-and-context-managers, s1.recursion, f3.permutations-and-combinations, s0.dictionaries-and-sets]
leads: [d0.locks-and-mutual-exclusion]
bridges:
  h2.signals-and-the-life-of-a-process: The operating systems cluster ended with signals, which can arrive between any two instructions of a program and run a handler in the middle of whatever it was doing. That is already concurrency on one thread, and it is why a handler should only set a flag. This lesson generalises the idea to threads, whose steps the scheduler can interleave anywhere, and asks which results each interleaving can produce.
  s6.fuzzing: The testing cluster's last lesson fed a program huge numbers of generated inputs to reach the rare ones that break it. A concurrent program has a second, hidden input, the order in which its threads' steps run, and the bad orders are rare in the same way. This lesson counts those orders and shows why only a few of them break the program.
  s6.deterministic-tests-seeds-clocks-and-fakes: The testing cluster showed how to pin a test's hidden inputs, the clock, randomness and the order of events, so that a failure replays exactly. For threads, the hidden input is the schedule. In this lesson threads are written as Python generators and a small scheduler of our own decides which one moves next, so every interleaving can be chosen, printed and replayed.
starter: |
  # Scratch space. Two threads each add 1 to a shared count, as three
  # steps: load, add, store. Here the steps are interleaved by hand.
  count = 0
  reg_a = count       # A loads 0
  reg_b = count       # B loads 0
  reg_a = reg_a + 1   # A adds
  reg_b = reg_b + 1   # B adds
  count = reg_a       # A stores 1
  count = reg_b       # B stores 1
  print(count)
parts:
  recall:
    - text: |
        [[h2.signals-and-the-life-of-a-process]] showed a handler running in the middle of a program, between any two of its instructions, and the threads of the kernel cluster run that way all the time. [[s6.fuzzing]] hunted for rare inputs that break a program, and [[s6.deterministic-tests-seeds-clocks-and-fakes]] pinned down a test's hidden inputs so that a failure replays. For a program with threads, the rarest and most hidden input is the order in which their steps happen. Three quick pulls first.
  puzzle:
    - text: |
        Two threads share a variable `count`, which starts at 0. Each thread runs the same loop, with no locks:

        ```python
        for i in range(10):
            count += 1
        ```

        Each `count += 1` is really three steps: load `count` into the thread's own register, add 1 to the register, and store the register back into `count`. The scheduler may switch threads between any two steps, in any pattern it likes.

        **What is the smallest final value of `count` that some schedule can produce?**
  intuition:
    - text: |
        Two cashiers at a sweet shop in Kolkata share one notebook in which they keep the day's count of boxes sold. Each, after a sale, reads the number, works out one more in their head, and writes it down. If both read 41 at the same moment, both write 42, and one box has vanished from the count. Nobody made an arithmetic mistake; each cashier did exactly the right thing with what they read. The trouble is only the **order** in which their steps fell.

        A thread's work is a sequence of small steps. When two threads run, their steps are merged into one timeline, an **interleaving**, keeping each thread's own steps in their order. The figure shows every interleaving of one increment by A and one by B, each made of a load, an add and a store, and the count each leaves behind.
    - figure: thread-interleaving
      props: { mode: steps, schedule: 1 }
    - text: |
        Of the 20 interleavings, only two give the right answer, 2: those where one thread finishes its store before the other loads. In the other 18, both threads load the same old value, and one store overwrites the other. Make the increment a single indivisible step, and only two interleavings remain, both correct. Most of concurrency is about which steps must be indivisible, and how to make them so.
  derivation:
    - text: |
        **Atomic steps and interleavings.** To reason about threads we split their work into **atomic** steps, steps that happen entirely or not at all, with nothing from another thread in the middle. For a machine, a single load or store of an aligned word is atomic; `count += 1` is not, because it is a load, an add and a store. A run of a concurrent program is then one interleaving of its threads' atomic steps. On one core the interleaving comes from the scheduler preempting threads at timer interrupts; on several cores the steps truly overlap, but their effects on memory still fall into some order, and for now we assume each step takes effect in one global order. That assumption, **sequential consistency**, is not quite what real hardware gives, as a later lesson will show, but it is the right starting point.

        **Counting interleavings.** Two threads with m and n steps can be merged in C(m + n, m) ways: choose which of the m + n positions in the timeline belong to the first thread, and the order inside each thread is already fixed. One increment each, 3 steps and 3 steps, gives C(6, 3) = 20. Ten increments each, 30 and 30 steps, gives C(60, 30), about 1.2 × 10^17. With three threads the count is a multinomial, and it grows faster still. No test can try them all, which is why concurrent bugs must be prevented by design and then hunted with the methods at the end of this cluster.
    - question:
        id: derivation-count
        type: numeric
        system: s2
        prompt: |
          Thread A has 2 atomic steps and thread B has 3. In how many ways can their steps be interleaved?
        answer: "10"
        explanation: |
          Choose which 2 of the 5 positions belong to A: C(5, 2) = 10. Each thread's steps then fill their positions in their own order.
    - text: |
        **A race condition.** A program has a **race condition** when its result depends on the interleaving and some interleavings give a wrong result. The lost update above is the classic **read-modify-write** race: two threads read the same value, modify it, and write it back, and the second write erases the first. It hides in every `count += 1`, `total = total + amount` and `balance -= price` on shared data.

        **Check-then-act.** The second classic race tests a condition and then acts on it, assuming the condition still holds. "If a seat is free, take the payment, then book it": two threads both see the last seat free, both take payment, and the seat is sold twice. "If the file does not exist, create it": two processes both see no file, and one overwrites the other's. The gap between the check and the act is where another thread slips in, and the longer the gap, a network call or a payment, the likelier the collision.

        **Publishing half-built data.** The third: one thread builds an object and sets a flag or a pointer to announce it; another sees the announcement and reads the object. If the announcement can be seen before the building is finished, the reader sees half an object. With sequential consistency this happens only if the code announces too early; on real hardware it can happen even when the code looks right, which is the subject of the memory models lesson.
    - question:
        id: derivation-check-act
        type: choice
        system: s2
        prompt: |
          A cache function checks `if key not in cache:`, then computes the value for 200 ms and stores it. Two threads ask for the same missing key at once. What happens?
        options:
          - "Both see the key missing and both spend 200 ms computing it; the second store overwrites the first"
          - "The second thread waits for the first to finish"
          - "Python raises an error because two threads touched the dictionary"
          - "Only one thread can run the check, so the value is computed once"
        answer: 0
        explanation: |
          This is check-then-act: both checks happen before either store. Here the damage is only wasted work, since both compute the same value, but the same shape with a seat or a bank balance sells twice or overdraws.
    - text: |
        **Races and data races.** Two terms are often confused. A **data race** is a precise, low-level thing: two threads access the same memory location, at least one access is a write, and nothing orders the two accesses. Languages such as C, C++ and Rust treat a data race as a bug in itself, and C and C++ give a program with one no meaning at all. A **race condition** is a higher-level bug in the program's logic: some interleaving gives a wrong answer. They overlap but neither contains the other. A check-then-act on a database row has no data race inside the program, yet it is a race condition. And a data race on a statistics counter whose exact value nobody needs may be harmless as logic, while still being undefined behaviour in C.

        **Why races hide.** A race only bites when the bad interleaving happens, and on an idle machine the scheduler rarely switches threads in the middle of a three-instruction increment, since each thread runs for milliseconds between switches. On a developer's laptop the test passes ten thousand times. In production, with 64 cores, heavy load and threads stalled on cache misses and page faults, the window opens many times a second. This is why races are the archetypal **heisenbug**: adding a print statement changes the timing and the bug disappears.
    - question:
        id: derivation-why-hidden
        type: choice
        system: s2
        prompt: |
          A test that runs two threads, each incrementing a shared counter 100 times, passes every time on a developer's laptop. Why might it still have a race?
        options:
          - "Each thread probably finishes its 100 increments within one time slice, so the threads never overlap mid-increment"
          - "Python makes `+=` atomic for small numbers"
          - "Races only happen on machines with more than 8 cores"
          - "A test that passes every time cannot contain a race"
        answer: 0
        explanation: |
          100 increments take microseconds, far less than a scheduler's time slice, so the first thread is usually done before the second starts. The bad interleavings exist; this timing just never produces them.
    - text: |
        **Making the schedule an input.** To study races we will write each thread as a Python generator: the code between two `yield`s is one atomic step, and a small scheduler of our own decides which thread moves next. This is the trick of [[s6.deterministic-tests-seeds-clocks-and-fakes]] applied to threads: the schedule, normally hidden and random, becomes an explicit input that we can choose, print, enumerate and replay. In this model, a race fix often means rearranging the code so that a check and its action sit in the same step, with no `yield` between them. Real threads need real tools to get the same guarantee, and the next lessons supply them: locks, condition variables and atomic instructions.

        **The smallest value.** Some interleavings are worse than a single lost update. With several increments per thread, one thread can load an early value, sit on it while the other does almost all its work, and then store its stale value, wiping out many increments at once. The puzzle asks how bad it can get.
    - question:
        id: derivation-two-each
        type: choice
        system: s2
        prompt: |
          Two threads each run `count += 1` twice, starting from 0. Which final values are possible?
        options:
          - "2, 3 and 4"
          - "Only 4"
          - "3 and 4"
          - "1, 2, 3 and 4"
        answer: 0
        explanation: |
          4 when nothing overlaps, and 3 when one increment is lost. 2 when, for example, A loads 0, B runs both its increments to 2, A stores 1 over them, and A's second increment loads 1 and stores 2. It cannot be 1: the last store is some thread's second increment, which loaded a value that a first increment had already stored, so at least 1.
  formal:
    - text: |
        **Atomic step.** A step that takes effect entirely, with no other thread's step inside it. An aligned load or store is atomic; `x += 1` is not.

        **Interleaving.** A merge of the threads' atomic steps into one order, keeping each thread's order. Two threads of m and n steps: C(m + n, m) interleavings. Assuming each run is one interleaving is sequential consistency.

        **Race condition.** The result depends on the interleaving, and some interleavings are wrong. Common shapes: read-modify-write (lost update), check-then-act (the condition changes between check and action), and publishing data before it is complete.

        **Data race.** Two unordered accesses to one location, at least one a write. Undefined behaviour in C and C++; neither implies nor is implied by a race condition.

        **Hiding.** Bad interleavings are rare under light load and common under heavy load, so passing tests prove little.

        **Model.** Threads as generators, one atomic step between yields, a scheduler that chooses the order: the schedule becomes an input.
