        explanation: |
          The check and the decrement are separated by the slow payment, where other threads run, so all three see a free seat. Claim the seat in the same step as the check, before the yield, and only then take payment. Copying the count into a local before waiting turns the race into a lost update, selling three seats while the count says 0; decrementing without checking first drives the count negative; and re-checking after payment but decrementing regardless still drives it below zero.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. Two threads each run `count += 1` ten times, as load, add and store, starting from 0. What is the smallest final value some schedule can produce?
        answer: "2"
        explanation: |
          A loads 0. B runs nine whole increments, to 9. A stores 1. B loads 1 for its tenth increment. A runs its other nine increments, to 10. B adds and stores 2. The final value is 2, and it cannot be lower: the last store comes from an increment whose load saw some earlier store of at least 1.
    - question:
        id: work-tests
        type: choice
        system: s2
        prompt: |
          A team's concurrent counter passed a stress test of 10,000 runs in continuous integration. In production it is occasionally wrong. What is the best next step?
        options:
          - "Control the schedule in the test, so that it can explore or replay the interleavings that lose updates, and fix the code so no interleaving can"
          - "Run the stress test 100,000 times"
          - "Add print statements to the counter to see when it goes wrong"
          - "Add short sleeps between the load and the store"
        answer: 0
        explanation: |
          More runs of the same timing reach the same interleavings; prints change the timing and hide the bug; and sleeps only move the window. Making the schedule an input finds the bad orders on purpose, and the fix must make them impossible rather than rare.
  connections:
    - text: |
        The smallest value is 2. A loads 0 and stalls; B runs nine increments to 9; A stores 1, wiping them out; B loads 1 and stalls; A runs its remaining nine increments to 10; and B finally stores 2. Twenty increments, and the count says 2. No real machine is likely to produce this exact schedule, but every step of it is allowed, and allowed is what matters.

        Rearranging code so that a check and its action share a step works in our generator model, but real threads can be preempted between any two instructions. They need a way to make a whole sequence of steps behave as one. [[d0.locks-and-mutual-exclusion]] builds the lock, which lets only one thread at a time into a critical section, and asks what it costs.
