    - question:
        id: predict-steps
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def thread(name):
              yield name + " loads"
              yield name + " adds"
              yield name + " stores"

          a = thread("A")
          b = thread("B")
          print(next(a), next(b), next(a), sep=", ")
        output: "A loads, B loads, A adds"
        explanation: Each next runs one thread up to its next yield, so the scheduler chooses the interleaving A, B, A.
  work:
    - text: Slower now. Each answer is a tool for seeing, or removing, a race.
    - question:
        id: write-interleavings
        type: code
        mode: write
        system: s2
        prompt: |
          Write `interleavings`, which returns every merge of two threads' steps that keeps each thread's own order. The program should print `20 interleavings`, then the first two merges and the last one.
        starter: |
          def interleavings(a, b):
              # Every way the steps of two threads can be merged into one timeline,
              # keeping each thread's own steps in order. Each result is a list of
              # steps. Results that take a's next step come before those that take
              # b's next step.
              return []

          merges = interleavings(["A1", "A2", "A3"], ["B1", "B2", "B3"])
          print(len(merges), "interleavings")
          print(merges[:2])
          print(merges[-1:])
        solution: |
          def interleavings(a, b):
              # Every way the steps of two threads can be merged into one timeline,
              # keeping each thread's own steps in order. Each result is a list of
              # steps. Results that take a's next step come before those that take
              # b's next step.
              if not a:
                  return [list(b)]
              if not b:
                  return [list(a)]
              first_a = [[a[0]] + rest for rest in interleavings(a[1:], b)]
              first_b = [[b[0]] + rest for rest in interleavings(a, b[1:])]
              return first_a + first_b


          merges = interleavings(["A1", "A2", "A3"], ["B1", "B2", "B3"])
          print(len(merges), "interleavings")
          print(merges[:2])
          print(merges[-1:])
        tests: |
          _m = interleavings(["A1", "A2"], ["B1"])
          assert _m == [["A1", "A2", "B1"], ["A1", "B1", "A2"], ["B1", "A1", "A2"]], "two steps of A and one of B can merge 3 ways, A's next step first: " + repr(_m)
          _m = interleavings(["x"], [])
          assert _m == [["x"]], "with one thread empty there is exactly one timeline, the other thread's steps: " + repr(_m)
          _m = interleavings([], [])
          assert _m == [[]], "two empty threads give one empty timeline, not " + repr(_m)
          _a = ["a1", "a2", "a3", "a4"]
          _b = ["b1", "b2", "b3"]
          _m = interleavings(_a, _b)
          assert len(_m) == 35, "4 steps and 3 steps merge in 7 choose 3 = 35 ways, not " + str(len(_m))
          for _t in _m:
              assert [_s for _s in _t if _s in _a] == _a and [_s for _s in _t if _s in _b] == _b, "each thread's steps must stay in their own order, but " + repr(_t) + " breaks that"
          assert len(set(tuple(_t) for _t in _m)) == 35, "every merge should appear once"
          assert _a == ["a1", "a2", "a3", "a4"] and _b == ["b1", "b2", "b3"], "interleavings should not change the lists it is given"
          assert output.splitlines() == ["20 interleavings", "[['A1', 'A2', 'A3', 'B1', 'B2', 'B3'], ['A1', 'A2', 'B1', 'A3', 'B2', 'B3']]", "[['B1', 'B2', 'B3', 'A1', 'A2', 'A3']]"], "The program should print 20 interleavings and the first, second and last of them"
        wrong:
          - |
            def interleavings(a, b):
