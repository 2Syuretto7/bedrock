            def run(schedule, k):
                # Threads A and B each run `count += 1` k times. Each increment is three
                # steps: load count into the thread's own register, add 1 to that
                # register, and store the register back into count. schedule is a
                # string of "A" and "B", one letter per step, saying which thread takes
                # the next step. Return the final value of count.
                count = 0
                reg = {"A": 0, "B": 0}
                done = {"A": 0, "B": 0}
                for who in schedule:
                    step = done[who]
                    if step == 0:
                        reg[who] = count
                    elif step == 1:
                        reg[who] = reg[who] + 1
                    else:
                        count = reg[who]
                    done[who] += 1
                return count


            print(run("AAABBB", 1), run("ABABAB", 1), run("AABBBA", 1))
            print(run("AAAAAABBBBBB", 2), run("ABBBBBAAAAAB", 2))
        explanation: |
          Keep a register and a step counter for each thread. Each letter in the schedule moves that thread one step: the step number modulo 3 says whether it loads, adds or stores. One register shared by both threads is not how threads work, since each has its own registers, and it produces the wrong values; adding straight into count makes the increment atomic, so no update is ever lost; and forgetting the modulo makes the second increment do nothing.
    - question:
        id: fix-oversold
        type: code
        mode: find-bug
        system: s2
        prompt: |
          A bus booking service sometimes sells the last seat to several people. The program should print `['asha'] 0`. Find the fault and fix it.
        starter: |
          def book(name, seats, booked):
