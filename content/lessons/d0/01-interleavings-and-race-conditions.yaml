          - |
            def interleavings(a, b):
                # Every way the steps of two threads can be merged into one timeline,
                # keeping each thread's own steps in order. Each result is a list of
                # steps. Results that take a's next step come before those that take
                # b's next step.
                if not a:
                    return [list(b)]
                if not b:
                    return [list(a)]
                first_a = [[a[0]] + rest for rest in interleavings(a[1:], b)]
                first_b = [[b[-1]] + rest for rest in interleavings(a, b[:-1])]
                return first_a + first_b


            merges = interleavings(["A1", "A2", "A3"], ["B1", "B2", "B3"])
            print(len(merges), "interleavings")
            print(merges[:2])
            print(merges[-1:])
        explanation: |
          If one thread has no steps left, there is exactly one merge, the other thread's remaining steps. Otherwise the next step is a's first or b's first, and the rest is any merge of what remains. Returning nothing when one list is empty loses every merge; returning the empty list instead of the other one drops steps; and taking b's last step first breaks the order inside b, so the merges are no longer real runs.
    - question:
        id: write-run-schedule
        type: code
        mode: write
        system: s2
        prompt: |
          Write `run`, which executes two threads' increments step by step under a given schedule and returns the final count. The program should print `2 1 1` and `4 2`.
        starter: |
          def run(schedule, k):
              # Threads A and B each run `count += 1` k times. Each increment is three
              # steps: load count into the thread's own register, add 1 to that
              # register, and store the register back into count. schedule is a
              # string of "A" and "B", one letter per step, saying which thread takes
              # the next step. Return the final value of count.
              return 0

          print(run("AAABBB", 1), run("ABABAB", 1), run("AABBBA", 1))
          print(run("AAAAAABBBBBB", 2), run("ABBBBBAAAAAB", 2))
        solution: |
          def run(schedule, k):
              # Threads A and B each run `count += 1` k times. Each increment is three
              # steps: load count into the thread's own register, add 1 to that
              # register, and store the register back into count. schedule is a
              # string of "A" and "B", one letter per step, saying which thread takes
              # the next step. Return the final value of count.
              count = 0
              reg = {"A": 0, "B": 0}
              done = {"A": 0, "B": 0}
              for who in schedule:
                  step = done[who] % 3
                  if step == 0:
                      reg[who] = count
                  elif step == 1:
                      reg[who] = reg[who] + 1
                  else:
                      count = reg[who]
                  done[who] += 1
              return count


          print(run("AAABBB", 1), run("ABABAB", 1), run("AABBBA", 1))
          print(run("AAAAAABBBBBB", 2), run("ABBBBBAAAAAB", 2))
        tests: |
          assert run("AAABBB", 1) == 2, "A finishes its increment before B loads, so count is 2"
          assert run("BBBAAA", 1) == 2, "B finishes before A loads, so count is 2"
          assert run("ABABAB", 1) == 1, "both load 0 before either stores, so both store 1 and one increment is lost"
          assert run("ABBBAA", 1) == 1, "A loads 0, B loads, adds and stores 1, then A adds and stores 1 over it: count is 1"
          assert run("", 0) == 0, "no steps leave count at 0"
          assert run("AAAAAABBBBBB", 2) == 4, "A's two increments and then B's two give 4"
          assert run("ABBBBBAAAAAB", 2) == 2, "A loads 0 and waits while B does one increment and half of the next; A stores 1 over B's work and finishes its second increment, and B's late store writes 2 again: count is 2"
          assert run("AAABBBAAABBB", 2) == 4, "taking turns a whole increment at a time loses nothing: 4"
          assert run("AAAAAAAAA", 3) == 3, "A alone, three increments, gives 3"
          _r = run("AB" * 6 + "AAABBB", 3)
          assert _r == 4, "in lockstep both threads lose one of their first two increments each, giving 2, and then one more each gives 4, not " + str(_r)
          assert output.splitlines() == ["2 1 1", "4 2"], "The program should print 2 1 1 and then 4 2"
        wrong:
