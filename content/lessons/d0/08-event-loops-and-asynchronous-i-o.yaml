concept: d0.event-loops-and-asynchronous-i-o
minutes: 85
claim: You can explain how one thread serves thousands of connections by never waiting in the thread itself, asking the kernel which connections are ready, with epoll or kqueue, or which operations are complete, with io_uring; write an event loop that keeps its timers in a heap and resumes each task when what it awaits is ready; multiplex many sessions over one thread by readiness; read async and await as the points where a task hands the loop back; predict how a blocking call or a long computation stalls every task on the loop, and move such work to a thread pool; keep check-then-act races out of code that spans an await; and bound, time out and cancel asynchronous work.
recalls: [d0.thread-pools-and-work-queues]
uses: [h2.interrupts-and-i-o, h2.processes-and-system-calls, h2.threads-in-the-kernel, s2.heaps-and-priority-queues, s1.generators-and-context-managers, d0.interleavings-and-race-conditions, d0.condition-variables-and-semaphores]
leads: [d0.actors-and-message-passing]
starter: |
  # Scratch space. Three requests on one event loop: all three wait 100 ms
  # for the database together, then each computes 1 ms, one at a time.
  finish = []
  clock = 100
  for r in range(3):
      clock += 1
      finish.append(clock)
  print(finish)
parts:
  recall:
    - text: |
        [[d0.thread-pools-and-work-queues]] sized a pool by how much of its time a task spends waiting: work that computes 10 ms and then waits 90 ms needed ten threads for every core, nine of them asleep at any moment. Each sleeping thread still costs a stack and a place in the kernel's tables, and a chat server holding a hundred thousand mostly idle connections cannot afford a hundred thousand of them. This lesson keeps the waiting and drops the threads. Three quick pulls first.
  puzzle:
    - text: |
        One thread runs the event loop of a booking API. A thousand requests arrive together. Each waits 100 ms for the database, without blocking the thread, and then computes for 1 ms to build its reply.

        **When is the last reply ready?**
  intuition:
    - text: |
        A waiter in a busy Udupi restaurant in Matunga does not take one table's order, carry it to the kitchen and stand there until the dosa is ready. They take the order, hand the slip in and go to the next table, and come back to the hatch whenever the bell says a plate is up. One waiter can look after twenty tables, because most of each table's time is spent waiting for the kitchen, and waiting needs no waiter. What one waiter cannot do is two things at once: if they stop to argue over a bill for five minutes, every table waits.

        An **event loop** is that waiter. The figure runs requests that each wait 100 ms for a database and then compute for 20 ms, first on one thread that makes blocking calls and then on an event loop.
    - figure: event-loop
      props: { mode: async, requests: 3 }
    - text: |
        With blocking calls the thread itself sits out every wait, so the requests take turns end to end. The event loop sends every query at once and lets the waits overlap; only the computing still happens one request at a time, on the one thread. That is the whole trade. Waiting becomes nearly free, and computing, or anything else that holds the thread, delays everyone, like the waiter arguing over the bill.
  derivation:
    - text: |
        **Not waiting in the thread.** A `read` on a network socket normally **blocks**: the thread sleeps in the kernel until data arrives, the interrupt-driven wait of the operating systems cluster. A socket can instead be made **non-blocking**, and then `read` returns at once, with whatever data has arrived or with the error EAGAIN, meaning "nothing yet, try later". Trying every socket over and over would burn a core, so the kernel also offers **readiness notification**. The old calls, `select` and `poll`, take the whole list of sockets on every call and scan it, which costs time proportional to the number of connections even when only one is active. Linux's **epoll** and the BSDs' and macOS's **kqueue** keep the list of sockets of interest inside the kernel and return only the ready ones, so the cost follows the activity, not the number of connections. That is how nginx or Redis holds tens of thousands of connections on a handful of threads.

        epoll can report readiness in two ways. **Level-triggered**, it reports a socket on every call for as long as unread data remains. **Edge-triggered**, it reports a socket only when new data arrives, so the program must keep reading until EAGAIN, or the rest of the data can sit unread with no further notice. A different design reports **completion** instead of readiness: with Windows' IOCP and Linux's io_uring, the program submits the read itself, the kernel does it, and the program is told when it is done.
    - question:
        id: derivation-epoll
        type: choice
        system: s2
        prompt: |
          A server holds 100 000 connections, of which about 50 are active at any moment. Why does it use epoll rather than select?
        options:
          - "select passes and scans all 100 000 sockets on every call; epoll keeps them registered in the kernel and returns only the ready ones"
          - "select cannot report sockets at all"
          - "epoll makes each read faster"
          - "epoll creates a thread for each connection"
        answer: 0
        explanation: |
          With select, every call costs time in proportion to all 100 000 connections. epoll's interest list lives in the kernel, so each wait costs in proportion to the 50 that are ready.
    - text: |
        **The loop.** An event loop is one thread repeating four steps. Run every task that is ready, each until it gives control back. Look at the earliest timer, kept in a heap since the loop only ever needs the soonest. Ask the kernel to wait for readiness, with a timeout that ends at that timer. Then mark ready every task whose socket became ready or whose timer has passed. Node's libuv, Python's asyncio, nginx and Redis all run loops of this shape.

        Early event-driven code registered a **callback** for every event, and a sequence of steps became a chain of nested callbacks that was hard to read and harder to handle errors in. A **coroutine** is a function that can pause in the middle and be resumed later with its local variables intact, which is exactly what a generator is. In Python, `async def` defines a coroutine and `await` pauses it until what it awaits is finished, handing the thread back to the loop meanwhile; a **task** is a coroutine the loop is running. The exercises use plain generators, and `yield ("sleep", ms)` stands for `await asyncio.sleep(ms / 1000)`.
    - question:
        id: derivation-loop-order
        type: order
        system: s2
        prompt: |
          Put one turn of an event loop in order.
        steps:
          - "Run each ready task until it reaches an await and hands the loop back."
          - "Look at the earliest timer in the heap to decide how long the loop may sleep."
          - "Call epoll_wait with that timeout, sleeping until a socket is ready or the timer is due."
          - "Mark ready the tasks whose sockets are now readable or whose timers have passed."
        explanation: |
          The loop only sleeps when nothing is ready, and never longer than the soonest timer, so neither a socket nor a timer is noticed late.
    - text: |
        **Cooperative, and what that costs.** Tasks on a loop switch only where a task awaits. That makes the code between two awaits atomic with respect to every other task on the loop, so state used only by one loop needs no locks. It also means a race still exists **across** an await: a task that checks a balance, awaits a payment, and then deducts has given every other task a chance to run between its check and its act, the same check-then-act race met with threads, now with its interleaving points written in plain sight.

        Worse, nothing forces a task to hand the loop back. A call that blocks, such as `time.sleep`, an old database driver or reading a large file, or a computation that runs for 200 ms, holds the one thread, and every other task, timer and connection waits for it. A thousand requests that each make a 100 ms blocking call take 100 seconds on one loop. The cure is to move such work off the loop: run it on a thread pool or a process pool and await its result, as `asyncio.to_thread` and `run_in_executor` do, or split a long computation into pieces with awaits between them.
    - question:
        id: derivation-blocking
        type: choice
        system: s2
        prompt: |
          A handler on an asyncio server calls time.sleep(2) where it meant await asyncio.sleep(2). What happens while it sleeps?
        options:
          - "Every task on that loop is frozen for 2 seconds, since the loop's only thread is asleep"
          - "Only that request waits; the others carry on"
          - "Python turns it into an await automatically"
          - "The loop starts a second thread to cover"
        answer: 0
        explanation: |
          time.sleep blocks the thread, and the thread is the loop. No other task can run, no timer fires and no socket is read until it returns.
    - text: |
        **Bounding, timing out, cancelling.** Starting asynchronous work is so cheap that it is easy to start too much: a crawler that launches 10 000 fetches at once overwhelms the site it is fetching. A semaphore with, say, 20 permits around each fetch bounds how many run at a time, and a bounded queue between stages pushes back on the producer as it did with threads. A **timeout** wraps an await so that it gives up after a limit, as `asyncio.wait_for` does. Giving up means **cancelling** the task: the loop raises a cancellation error inside the coroutine at the await where it is paused, so its `finally` blocks and `with` blocks still close files and connections. A task that never awaits can never be cancelled, for the same reason it can never be interrupted.

        Two more facts round out the picture. An `async` function can only be awaited from another `async` function, so asynchronous code spreads upward through a program, sometimes called function colouring. And some runtimes hide the loop entirely: Go's goroutines look like blocking threads, but the runtime parks a goroutine that waits on a socket and multiplexes thousands of them over a few threads with epoll underneath.
    - question:
        id: derivation-cancel
        type: choice
        system: s2
        prompt: |
          A task is cancelled by a timeout while it is in the middle of a 3-second loop of pure computation with no await. When does the cancellation take effect?
        options:
          - "Only when the task next reaches an await, here after the computation ends"
          - "Immediately, in the middle of the loop"
          - "Never; a timeout cannot cancel a task"
          - "After the loop restarts"
        answer: 0
        explanation: |
          Cancellation is delivered as an error raised at the await where the task is paused. A task that is computing is not paused anywhere, and it also holds up every other task until it finishes.
  formal:
    - text: |
        **Non-blocking I/O.** A non-blocking read returns data or EAGAIN at once. Readiness: select and poll scan the whole set each call; epoll and kqueue keep the set in the kernel and return only ready sockets. Level-triggered reports while data remains; edge-triggered reports new data, so read until EAGAIN. Completion: io_uring and IOCP perform the operation and report when it is done.

        **Event loop.** One thread: run ready tasks until each awaits; sleep in epoll_wait no longer than the earliest timer, kept in a heap; wake the tasks whose sockets or timers are due.

        **Coroutines.** `async def` defines one, `await` pauses it and returns the thread to the loop, a task is a coroutine being run. Switches happen only at awaits.

        **Costs.** Waiting is cheap; anything that holds the thread, a blocking call or long computation, stalls every task. Move it to a thread or process pool and await the result. Check-then-act across an await is a race.

        **Control.** Bound concurrency with a semaphore and bounded queues; time out with wait_for; cancellation is raised at an await, so cleanup runs, and a task that never awaits cannot be cancelled.
