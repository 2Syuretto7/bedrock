            def run_loop(tasks):
                # tasks is a list of (name, generator); every task is ready at time 0.
                # A task yields ("sleep", ms) to wait without holding the loop, as an
                # await on the network does: it is ready again ms later. It yields
                # ("cpu", ms) to compute, which holds the loop: the clock moves on by ms
                # and the same task carries on at once. Always resume the task that
                # became ready earliest; on a tie, the one that became ready first.
                # Return a list of (time, name) in the order the tasks finish.
                ready = []
                order = 0
                for name, task in tasks:
                    ready.append((0, order, name, task))
                    order += 1
                clock = 0
                finished = []
                while ready:
                    when, _, name, task = ready.pop(0)
                    clock = max(clock, when)
                    while True:
                        try:
                            kind, ms = next(task)
                        except StopIteration:
                            finished.append((clock, name))
                            break
                        if kind == "cpu":
                            clock += ms
                        else:
                            ready.append((clock + ms, order, name, task))
                            order += 1
                            break
                return finished


            def request(wait_ms, cpu_ms):
                yield ("sleep", wait_ms)   # await the database's reply
                yield ("cpu", cpu_ms)      # build the page


            def blocking_request(wait_ms, cpu_ms):
                yield ("cpu", wait_ms)     # a blocking database call holds the loop
                yield ("cpu", cpu_ms)


            print(run_loop([(n, request(100, 1)) for n in ["a", "b", "c"]]))
            print(run_loop([(n, blocking_request(100, 1)) for n in ["a", "b", "c"]]))
            print(run_loop([("r" + str(i), request(100, 1)) for i in range(1000)])[-1:])
        explanation: |
          Push every task with ready time 0 and an order number, then repeatedly pop the earliest. Move the clock up to its ready time, never back, and run the task: a computation adds to the clock and the task carries on, while a sleep pushes the task back with the clock plus the sleep as its ready time. Treating computing like a sleep lets work overlap that one thread cannot overlap; treating a sleep like computing is the blocking server; and a plain first-come list resumes a long sleep before a short one.
    - question:
        id: write-serve
        type: code
        mode: write
        system: s2
        prompt: |
          Write `serve`, which runs many chat sessions on one thread, resuming each only when the kernel says its connection has a message. The program should print the six messages at 0, 5, 8, 12, 20 and 30 ms, then `['meena']`.
        starter: |
          class Kernel:
              # Stands in for the kernel's epoll. arrivals is a list of
              # (time, connection, message), in time order.
              def __init__(self, arrivals):
                  self.arrivals = list(arrivals)
                  self.inbox = {}
                  self.count = 0
                  self.now = 0

              def wait(self, interested):
                  # Sleeps until a message is waiting on at least one connection in
                  # interested, then returns those connections, oldest message first.
                  # Returns [] if no message will ever come for any of them.
                  while not [c for c in interested if self.inbox.get(c)]:
                      if not self.arrivals:
                          return []
                      time, conn, message = self.arrivals.pop(0)
                      self.now = time
                      self.inbox[conn] = self.inbox.get(conn, []) + [(self.count, message)]
                      self.count += 1
                  while self.arrivals and self.arrivals[0][0] == self.now:
                      time, conn, message = self.arrivals.pop(0)
                      self.inbox[conn] = self.inbox.get(conn, []) + [(self.count, message)]
                      self.count += 1
                  ready = [(self.inbox[c][0][0], c) for c in interested if self.inbox.get(c)]
                  return [c for first, c in sorted(ready)]

              def recv(self, conn):
                  # Never blocks: the oldest waiting message on conn, or None.
                  if not self.inbox.get(conn):
                      return None
                  return self.inbox[conn].pop(0)[1]


          def session(conn, kernel, log):
              # Talks to one client: logs each message until the client says bye.
              while True:
                  yield conn                  # park until conn has a message
                  message = kernel.recv(conn)
                  log.append((kernel.now, conn, message))
                  if message == "bye":
                      return


          def serve(kernel, sessions):
              # One thread serves every session. A session yields the connection it
              # wants to read next and must be resumed only once that connection has
              # a message. Return the sorted list of connections whose sessions are
