        explanation: With blocking calls each request pays its own wait; on a loop the waits overlap and only the computing adds up.
  work:
    - text: Slower now. Each answer is part of how one thread keeps many conversations going.
    - question:
        id: write-run-loop
        type: code
        mode: write
        system: s2
        prompt: |
          Write `run_loop`, an event loop that keeps ready tasks in a heap by the time they become ready, lets a sleep overlap with everything else, and lets computing hold the loop. The program should print `[(101, 'a'), (102, 'b'), (103, 'c')]`, then `[(101, 'a'), (202, 'b'), (303, 'c')]`, then `[(1100, 'r999')]`.
        starter: |
          import heapq


          def run_loop(tasks):
              # tasks is a list of (name, generator); every task is ready at time 0.
              # A task yields ("sleep", ms) to wait without holding the loop, as an
              # await on the network does: it is ready again ms later. It yields
              # ("cpu", ms) to compute, which holds the loop: the clock moves on by ms
              # and the same task carries on at once. Always resume the task that
              # became ready earliest; on a tie, the one that became ready first.
              # Return a list of (time, name) in the order the tasks finish.
              return []


          def request(wait_ms, cpu_ms):
              yield ("sleep", wait_ms)   # await the database's reply
              yield ("cpu", cpu_ms)      # build the page


          def blocking_request(wait_ms, cpu_ms):
              yield ("cpu", wait_ms)     # a blocking database call holds the loop
              yield ("cpu", cpu_ms)


          print(run_loop([(n, request(100, 1)) for n in ["a", "b", "c"]]))
          print(run_loop([(n, blocking_request(100, 1)) for n in ["a", "b", "c"]]))
          print(run_loop([("r" + str(i), request(100, 1)) for i in range(1000)])[-1:])
        solution: |
          import heapq


          def run_loop(tasks):
              # tasks is a list of (name, generator); every task is ready at time 0.
              # A task yields ("sleep", ms) to wait without holding the loop, as an
              # await on the network does: it is ready again ms later. It yields
              # ("cpu", ms) to compute, which holds the loop: the clock moves on by ms
              # and the same task carries on at once. Always resume the task that
              # became ready earliest; on a tie, the one that became ready first.
              # Return a list of (time, name) in the order the tasks finish.
              ready = []
              order = 0
              for name, task in tasks:
                  heapq.heappush(ready, (0, order, name, task))
                  order += 1
              clock = 0
              finished = []
              while ready:
                  when, _, name, task = heapq.heappop(ready)
                  clock = max(clock, when)
                  while True:
                      try:
                          kind, ms = next(task)
                      except StopIteration:
                          finished.append((clock, name))
                          break
                      if kind == "cpu":
                          clock += ms
                      else:
                          heapq.heappush(ready, (clock + ms, order, name, task))
                          order += 1
                          break
              return finished


          def request(wait_ms, cpu_ms):
              yield ("sleep", wait_ms)   # await the database's reply
              yield ("cpu", cpu_ms)      # build the page


          def blocking_request(wait_ms, cpu_ms):
              yield ("cpu", wait_ms)     # a blocking database call holds the loop
              yield ("cpu", cpu_ms)


          print(run_loop([(n, request(100, 1)) for n in ["a", "b", "c"]]))
          print(run_loop([(n, blocking_request(100, 1)) for n in ["a", "b", "c"]]))
          print(run_loop([("r" + str(i), request(100, 1)) for i in range(1000)])[-1:])
        tests: |
          def _steps(*steps):
              for step in steps:
                  yield step


          def _names(result):
              return [name for time, name in result]


          _r = run_loop([("slow", _steps(("sleep", 50), ("cpu", 1))), ("fast", _steps(("sleep", 10), ("cpu", 1)))])
          assert _r == [(11, "fast"), (51, "slow")], "a task that sleeps 10 ms should be resumed before one that sleeps 50 ms, whatever order they started in: expected [(11, 'fast'), (51, 'slow')], not " + repr(_r)
          _r = run_loop([("x", _steps(("cpu", 5))), ("y", _steps(("sleep", 1), ("cpu", 1)))])
          assert _r == [(5, "x"), (7, "y")], "computing holds the loop: while x computes for 5 ms, y cannot even start its 1 ms sleep, so the answer is [(5, 'x'), (7, 'y')], not " + repr(_r)
          _r = run_loop([("p", _steps(("sleep", 20), ("cpu", 2))), ("q", _steps(("sleep", 20), ("cpu", 2))), ("s", _steps(("sleep", 20), ("cpu", 2)))])
          assert _r == [(22, "p"), (24, "q"), (26, "s")], "tasks ready at the same moment should run in the order they became ready: expected [(22, 'p'), (24, 'q'), (26, 's')], not " + repr(_r)
          _r = run_loop([("m", _steps(("sleep", 5), ("cpu", 3), ("sleep", 5), ("cpu", 3))), ("n", _steps(("cpu", 4), ("sleep", 1), ("cpu", 1)))])
          assert _r == [(9, "n"), (16, "m")], "with several awaits per task, expected [(9, 'n'), (16, 'm')], not " + repr(_r)
          assert run_loop([]) == [], "with no tasks, nothing finishes"
          _r = run_loop([("r" + str(_i), _steps(("sleep", 100), ("cpu", 1))) for _i in range(50)])
          assert len(_r) == 50 and _r[-1] == (150, "r49"), "fifty requests that each wait 100 ms and compute 1 ms should all finish by 150 ms, not " + repr(_r[-1:])
          assert output.splitlines() == ["[(101, 'a'), (102, 'b'), (103, 'c')]", "[(101, 'a'), (202, 'b'), (303, 'c')]", "[(1100, 'r999')]"], "The program should print [(101, 'a'), (102, 'b'), (103, 'c')], then [(101, 'a'), (202, 'b'), (303, 'c')], then [(1100, 'r999')]"
