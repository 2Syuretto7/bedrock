    - question:
        id: predict-switch
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def task(name, n):
              for i in range(n):
                  yield name + str(i)

          a, b = task("a", 2), task("b", 3)
          print([next(t) for t in [a, b, a, b, b]])
        output: "['a0', 'b0', 'a1', 'b1', 'b2']"
