                    return
                yield 5                      # await the payment gateway
                if pays and seats["left"] >= want:
                    seats["left"] -= want    # check again now that we are back
                    log.append(name + " booked")
                elif pays:
                    log.append(name + " refused")
                else:
                    log.append(name + " payment failed")


