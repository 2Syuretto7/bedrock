    - question:
        id: work-bound
        type: choice
        system: s2
        prompt: |
          An async crawler gathers 10 000 page fetches at once, and the website starts refusing its connections. What is the fix?
        options:
          - "Wrap each fetch in a semaphore with a few dozen permits, so only that many run at a time"
          - "Run the crawler on more threads"
          - "Switch from epoll to select"
          - "Remove the awaits so the fetches finish faster"
        answer: 0
        explanation: |
          Asynchronous work is cheap to start, so it needs an explicit bound. A semaphore caps the fetches in flight, and the rest wait their turn on the loop at almost no cost.
  connections:
    - text: |
        1100 ms. All thousand queries go out at once, so their waits overlap and the database's replies are back at about 100 ms. The one thread then builds the thousand replies one after another, 1 ms each. With blocking calls the same work would take 101 seconds; the waiting was never the cost, only waiting inside the thread.

        An event loop needs no locks because each piece of its state belongs to one thread, and tasks change it only between awaits. Push that idea further: give every piece of state its own owner that handles one message at a time, and let everyone else send it messages instead of touching the state. [[d0.actors-and-message-passing]] builds those owners, the actors, and the mailboxes and channels between them.
