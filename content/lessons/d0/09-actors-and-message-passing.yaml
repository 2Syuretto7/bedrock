        explanation: |
          The board sends its own prices dictionary in every message and then keeps changing it, so every snapshot is the same dictionary, shared by two actors. Send dict(state["prices"]), a copy taken at the moment of sending. Copying on receipt is too late, because the board may already have changed the dictionary before the chart handles the message; copying once before the updates sends one stale snapshot over and over; and sending only the changed item is not a snapshot of all the prices.
