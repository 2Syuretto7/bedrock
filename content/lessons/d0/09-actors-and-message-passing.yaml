        explanation: |
          Call the handler inside try and keep the state it returns. On an exception, if the actor has used all its restarts, mark it stopped, empty its mailbox and log it; otherwise count the restart, give it dict(initial) as its state and log it, without putting the message back. Keeping the half-updated state counts an order that has no amount; putting the message back retries a poison message until the actor is stopped; and assigning initial itself, not a copy, lets the next messages change what later restarts start from.
