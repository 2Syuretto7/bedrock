          Look at the message's kind. A deposit returns the balance plus the amount. A withdrawal that the balance covers replies ok to reply_to and returns the reduced balance; otherwise it replies refused and returns the balance unchanged. A balance request replies with the actor's name and balance and returns the balance. Replying to the account itself leaves the customers hearing nothing; deducting before checking leaves refused withdrawals still taken; and returning nothing from one branch loses the state.
    - question:
        id: write-supervisor
        type: code
        mode: write
        system: s2
        prompt: |
          Write `deliver`, the supervisor's part of the actor system: a crash discards the actor's state and restarts it from a fresh copy, up to a limit, after which the actor is stopped. The program should print `[('till', 'restarted')] {'orders': 2, 'total': 80} {'tickets': 5}`.
        starter: |
          class System:
