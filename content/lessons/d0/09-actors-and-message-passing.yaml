          Back to the opening question. Three feeds each send 100 messages a second to an actor that handles 200 a second, with no limit on its mailbox. How many messages are waiting after one minute?
        answer: "6000"
        explanation: |
          300 arrive and 200 are handled each second, so 100 a second pile up: 100 × 60 = 6000 after a minute.
    - question:
        id: work-ask-deadlock
        type: choice
        system: s2
        prompt: |
          While handling a message, the order actor asks the payment actor for a charge and waits for the reply. The payment actor, while handling that request, asks the order actor for the order's total and waits. What happens, and what is the fix?
        options:
          - "Both wait for ever; do not block inside a handler, but send the request and handle the reply as a later message"
          - "The payment actor times out and the order completes"
          - "Messages are handled out of order, so it completes"
          - "Add a lock around the two actors"
        answer: 0
        explanation: |
          Each actor is busy waiting, so neither handles the message that would free the other: a deadlock made of replies. Handling replies as ordinary messages keeps both actors free to serve.
  connections:
    - text: |
        6000. Three feeds send 300 messages a second and the actor handles 200, so 100 a second pile up, 6000 after a minute, and a message arriving then waits 30 s to be handled. Nothing has crashed and every message will be handled in time, which is exactly what makes an unbounded mailbox dangerous: the overload shows up as slowness, not as an error.

        Threads with locks, loops with awaits and actors with mailboxes share one difficulty. A bug shows itself only in some orders of events, and the order changes from run to run, so a test can pass a thousand times and fail in production. [[d0.testing-concurrent-code-deterministically]] takes the order into the test's own hands, so that every interleaving can be tried and every failure replayed.
