        Locks answer "only one at a time". Threads also need to wait for things to happen: for a queue to have an item, for a buffer to have space, for a result to be ready. Spinning on a lock to check is wasteful, and sleeping blindly is slow. [[d0.condition-variables-and-semaphores]] adds the tools for waiting until a condition holds, and for counting how many threads may proceed at once.
