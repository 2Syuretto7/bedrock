        explanation: |
          Every philosopher takes the left fork first, so when all hold one fork, each waits for a neighbour: a cycle. Take the lower-numbered fork first; then the last philosopher, whose right fork is fork 0, reaches for it first, and the cycle cannot close. Everyone taking the right fork first is the same cycle the other way round; a butler who lets all n sit at once prevents nothing, since the rule needs n - 1; and putting back only one fork leaves the other held for ever.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. Five philosophers each take the left fork, then the right. What is the smallest number who must take their right fork first to make the deadlock impossible?
        answer: "1"
        explanation: |
          With one philosopher reversed, the five can never each hold one fork while waiting for the next: the reversed one and a neighbour compete for the same first fork, and whoever loses waits holding nothing. This is the global order rule, numbering the forks 0 to 4 and taking the lower first.
    - question:
        id: work-database
        type: choice
        system: s2
        prompt: |
          A web app's database sometimes reports "deadlock detected" and aborts one of two transactions that update the same two rows. What should the application do?
        options:
          - "Retry the aborted transaction, and where possible update rows in a consistent order, such as by id, so the deadlock becomes rare"
          - "Turn off the database's deadlock detection"
          - "Show the error to the user and give up"
          - "Run every transaction on one connection"
        answer: 0
        explanation: |
          The database broke the cycle by aborting a victim, so retrying is safe and expected. Ordering the updates removes the cycle at its source; turning detection off would leave the two transactions stuck until a timeout, and one connection serialises everything.
