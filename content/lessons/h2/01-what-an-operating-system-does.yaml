        explanation: |
          The check looks only at where the request starts. A request may start inside user memory and run past its end, so the kernel must check both ends: addr at or above USER_START and addr + n at or below USER_END, with n not negative. Using >= refuses a write that ends exactly at the boundary, dropping the lower check lets a program read the kernel's low pages, and comparing n with an address checks nothing useful.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. A program loops for ever without system calls on a one-core laptop, and the kernel's timer interrupts every 4 milliseconds. How many times a second does the kernel get the processor back?
        answer: "250"
        explanation: |
          A second is 1,000 milliseconds, and 1000 / 4 = 250 interrupts. Each one puts the kernel in charge, whatever the loop is doing.
    - question:
        id: work-sandbox
        type: choice
        system: s2
        prompt: |
          A banking app on a phone must never read the messages of the chat app beside it, even if the bank's code has a bug that loads from a random address. What makes that guarantee hold?
        options:
          - "The app runs in user mode, where it cannot change how memory is mapped, so its loads reach only its own memory"
          - "The chat app checks every load the bank makes"
          - "Phone apps are written in languages without pointers"
          - "The timer interrupts the bank's code before it can load anything"
        answer: 0
        explanation: |
          The mapping from the app's addresses to real memory is set by the kernel with privileged instructions. In user mode the bank cannot change it, so a wild load either reaches its own memory or traps.
  connections:
    - text: |
        250. A second is 1,000 milliseconds and the timer fires every 4, so the kernel gets the processor back 250 times a second, however tightly the program loops. Each time, the scheduler can give the next slice to the music player, the mouse driver or your terminal, which is why the machine stays usable and why you can kill the loop.

        Everything in this lesson happens on behalf of a **process**, the kernel's name for a running program with its own registers, memory and open files. [[h2.processes-and-system-calls]] looks at what a process is, how one is created by copying another, and the handful of system calls through which programs do almost everything.
