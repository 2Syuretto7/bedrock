            from collections import deque


            def busy():
                # A buggy program: it loops for ever and never makes a system call.
                while True:
                    yield


            def player(name, n):
                # A program that does n steps of useful work, printing as it goes.
                for i in range(n):
                    print(name, i)
                    yield


            def run(programs, tick, steps):
                line = deque(programs)
                ran = 0
                fired = 0
                while line and ran < steps:
                    program = line.popleft()
                    exited = False
                    for _ in range(tick):
                        ran += 1
                        try:
                            next(program)
                        except StopIteration:
                            exited = True
                            break
                    fired += 1
                    if not exited:
                        line.append(program)
                return fired


            fired = run([busy(), player("music", 3), player("chat", 2)], 2, 30)
            print(fired, "timer interrupts")
        explanation: |
          Take the program at the front of a deque, run it for up to tick steps, and either drop it when it exits or count an interrupt and put it at the back. Running each program until it finishes is co-operative multitasking, and busy then holds the processor for good; putting the interrupted program back at the front has the same effect; and counting an interrupt when a program exits gives 16.
