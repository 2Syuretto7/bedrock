                entry = TABLE.get(regs["a7"])
                if entry is None:
                    regs["a0"] = -ENOSYS
                    return regs
                handler, count = entry
                args = [regs["a" + str(i)] for i in range(count)]
                regs["a7"] = handler(*args)
                return regs


            regs = ecall({"a7": 64, "a0": "hello from user mode\n"})
            print("write returned", regs.get("a0"))
            print("getpid returned", ecall({"a7": 172}).get("a0"))
            print("call 999 returned", ecall({"a7": 999}).get("a0"))
        explanation: |
          Use `TABLE.get` so that an unknown number gives None rather than an exception, and answer it with -ENOSYS; otherwise gather a0 up to the handler's count, call it, and store the result in a0. Errors are returned as negative numbers so that one register can carry either a result or an error. Returning +38 looks like a successful result, indexing the table directly lets any program crash the kernel with a bad number, and writing the result into a7 leaves the program reading its own argument back.
    - question:
        id: write-timer
        type: code
        mode: write
        system: s2
        prompt: |
          Write `run`, a kernel that shares one processor among programs with a timer interrupt every `tick` instructions. Even with `busy`, which never gives the processor up, the music player and the chat should both finish. The program should print `music 0`, `music 1`, `chat 0`, `chat 1`, `music 2` and then `14 timer interrupts`.
        starter: |
          from collections import deque


          def busy():
              # A buggy program: it loops for ever and never makes a system call.
              while True:
                  yield


          def player(name, n):
              # A program that does n steps of useful work, printing as it goes.
              for i in range(n):
                  print(name, i)
                  yield


          def run(programs, tick, steps):
              # Each program is a generator, and one next() runs one instruction of it;
              # StopIteration means the program has exited. Keep the programs in a
              # line. Run the one at the front for up to tick instructions, counting
              # each next(), including one that ends in StopIteration. If it exits,
              # drop it. If it uses its whole tick, the timer interrupts: count one
              # interrupt and move the program to the back of the line. Stop when the
              # line is empty, or when steps instructions or more have run by the time
              # the next program would start. Return the number of timer interrupts.
              return 0


          fired = run([busy(), player("music", 3), player("chat", 2)], 2, 30)
          print(fired, "timer interrupts")
        solution: |
          from collections import deque


          def busy():
              # A buggy program: it loops for ever and never makes a system call.
              while True:
                  yield


          def player(name, n):
              # A program that does n steps of useful work, printing as it goes.
              for i in range(n):
                  print(name, i)
                  yield


          def run(programs, tick, steps):
              line = deque(programs)
              ran = 0
              fired = 0
              while line and ran < steps:
                  program = line.popleft()
                  exited = False
                  for _ in range(tick):
                      ran += 1
                      try:
                          next(program)
                      except StopIteration:
                          exited = True
                          break
                  if not exited:
                      fired += 1
                      line.append(program)
              return fired


          fired = run([busy(), player("music", 3), player("chat", 2)], 2, 30)
          print(fired, "timer interrupts")
        tests: |
          import io as _io
          import contextlib as _ctx


          def _go(_programs, _tick, _steps):
              _buf = _io.StringIO()
              with _ctx.redirect_stdout(_buf):
                  _n = run(_programs, _tick, _steps)
              return _n, _buf.getvalue().splitlines()


          _n, _lines = _go([busy(), player("music", 3), player("chat", 2)], 2, 30)
          assert _lines == ["music 0", "music 1", "chat 0", "chat 1", "music 2"], "With a timer, the music player and the chat should both finish even though busy never gives up the processor; they printed " + repr(_lines)
          assert _n == 14, "busy, music and chat with tick 2 and 30 steps should take 14 timer interrupts, not " + repr(_n)
          _n, _lines = _go([player("a", 1)], 3, 100)
          assert (_n, _lines) == (0, ["a 0"]), "a program that exits within its tick is never interrupted, but this gave " + repr(_n)
          _n, _lines = _go([player("a", 5)], 2, 100)
          assert _n == 2, "a program of 5 steps with tick 2 uses up two whole ticks before it exits in the third, so 2 interrupts, not " + repr(_n)
          _n, _lines = _go([busy(), busy()], 1, 10)
          assert _n == 10, "two busy programs with tick 1 and 10 steps take 10 interrupts, not " + repr(_n)
          _n, _lines = _go([player("x", 2), busy(), player("y", 4)], 3, 40)
          assert _lines == ["x 0", "x 1", "y 0", "y 1", "y 2", "y 3"], "every program that has work to do should get to do it, but they printed " + repr(_lines)
          assert output.splitlines() == ["music 0", "music 1", "chat 0", "chat 1", "music 2", "14 timer interrupts"], "The program should print the music and chat lines and then 14 timer interrupts"
