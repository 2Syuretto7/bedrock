            calls = []


            def sys_write(data):
                # Each call into the kernel costs about a microsecond, however little
                # it carries.
                calls.append(data)


            class Writer:
                # Collects small writes in a buffer and hands them to the kernel in
                # batches of at least size characters. close must hand over whatever
                # is left, without making an empty call.
                def __init__(self, size):
                    self.size = size
                    self.buffer = ""

                def write(self, text):
                    self.buffer += text
                    if len(self.buffer) >= self.size:
                        self.flush()

                def flush(self):
                    sys_write(self.buffer)
                    self.buffer = ""

                def close(self):
                    if self.buffer:
                        self.buffer = ""


            w = Writer(16)
            for i in range(10):
                w.write(f"line {i}\n")
            w.close()
            print(len(calls), "system calls")
            print("".join(calls).count("\n"), "lines reached the file")
        explanation: |
          close sends what is left only when the buffer is full, but by then write would already have sent it; close must send anything that remains. Flushing unconditionally makes an empty system call when the buffer happens to be empty, flushing on every write throws away the point of the buffer, and emptying the buffer at close without writing it loses the data quietly. The same mistake in real programs is why output can vanish when a program crashes before its buffers are flushed.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. A program calls `fork()` once in each of 3 times round a loop and then prints "hi". How many times is "hi" printed?
        answer: "8"
        explanation: |
          Every process in the loop forks once per round, so the count doubles three times, 1, 2, 4, 8, and each of the 8 processes prints once.
    - question:
        id: work-fork-bomb
        type: choice
        system: s2
        prompt: |
          A program forks in an endless loop, in the parent and every child, until the machine stops responding. What limit lets an administrator stop this from hurting other users?
        options:
          - "A cap on the number of processes each user may have, which makes fork fail beyond it"
          - "A faster processor"
          - "A larger stack for each process"
          - "Buffering the program's output"
        answer: 0
        explanation: |
          The doubling of the puzzle has no end here, and the process table fills in a fraction of a second. Linux lets the administrator cap processes per user, so fork returns an error instead and other users' programs still get the processor.
  connections:
    - text: |
        8. In each round every process still in the loop forks, so the number of processes doubles: 1, 2, 4, 8. All 8 leave the loop and print. With n rounds it is 2 to the power n, which is why a careless fork in a loop is dangerous; with `if (fork() == 0) break;` only the original keeps forking and you get n + 1.

        A busy machine has hundreds of processes, and most of the time several of them are ready to run at once. Which one runs next, and for how long, decides whether a video stutters, a compile finishes overnight, or a server answers in time. [[h2.scheduling]] treats that choice as an algorithm problem, with a priority queue at its heart.
