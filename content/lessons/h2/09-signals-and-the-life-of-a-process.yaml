            reaped = []


            def child_exits(pid, status):
                zombies.append((pid, status))
                pending.add("SIGCHLD")  # if one is already pending, the two merge into one


            def waitpid_nohang():
                # Reap one exited child and return (pid, status), or None at once if no
                # child has exited, without blocking.
                if zombies:
                    return zombies.pop(0)
                return None


            def on_sigchld():
                # The server's SIGCHLD handler: it should reap every child that has
                # exited, so that none is left a zombie.
                while waitpid_nohang() is not None:
                    reaped.append(waitpid_nohang())


            def deliver():
                if "SIGCHLD" in pending:
                    pending.remove("SIGCHLD")
                    on_sigchld()


            # Three downloads finish while the server is busy, then a fourth.
            child_exits(201, 0)
            child_exits(202, 1)
            child_exits(203, 0)
            deliver()
            child_exits(204, 0)
            deliver()
            print("reaped", reaped)
            print("zombies left", len(zombies))
        explanation: |
          The handler reaps one child per signal, but signals do not queue: three children exiting before delivery produce one SIGCHLD. The handler must call the non-blocking wait in a loop until it reports no more exited children. Reaping a fixed number per signal fails as soon as more merge; popping zombies directly loses their statuses, which the server needs; and calling wait twice per pass throws away every other status.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. `sleep 100` is killed by SIGINT, signal 2, which it does not handle. What does `echo $?` print?
        answer: "130"
        explanation: |
          The child was killed by a signal, so the status's low bits hold 2 and the shell reports 128 + 2 = 130. Scripts use exactly this to tell an interrupted command from one that failed by itself.
    - question:
        id: work-graceful
        type: choice
        system: s2
        prompt: |
          A payment service is stopped during every deployment, and now and then a payment is half-written. Its code has no signal handlers. What is the best fix?
        options:
          - "Handle SIGTERM: stop taking new requests, finish the ones in progress, then exit, within the grace period"
          - "Handle SIGKILL to finish the payment first"
          - "Ignore SIGTERM so the service is never stopped"
          - "Make the deployment send SIGKILL straight away"
        answer: 0
        explanation: |
          Without a handler, SIGTERM kills the service mid-request. Handling it lets the service drain its work and exit cleanly before the manager's SIGKILL, which cannot be handled at all, arrives.
  connections:
    - text: |
        130. sleep has no handler, so SIGINT's default action kills it; wait reports "killed by signal 2", and the shell, by convention, turns that into 128 + 2. A script can test for 130 to tell that the user interrupted a command rather than that the command failed.

        That completes the operating system: processes and the system calls that make them, the scheduler that shares the processor, virtual memory and the TLB that share the memory, interrupts and DMA for the devices, files that survive crashes, threads that share an address space, and signals and the end of a process. Threads sharing memory raised a question this cluster left open: what happens when two of them update the same data at the same moment. [[d0.interleavings-and-race-conditions]] begins the concurrency cluster with exactly that.
