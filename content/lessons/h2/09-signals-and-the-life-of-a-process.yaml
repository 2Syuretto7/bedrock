            ECHILD = 10


            class Kernel:
                def __init__(self):
                    # pid -> {"parent": pid, "state": "running" or "zombie", "status": exit status}
                    self.procs = {1: {"parent": 0, "state": "running", "status": None}}  # pid 1 is init
                    self.next_pid = 100

                def fork(self, parent):
                    self.next_pid += 1
                    self.procs[self.next_pid] = {"parent": parent, "state": "running", "status": None}
                    return self.next_pid

                def exit(self, pid, status):
                    self.procs[pid]["state"] = "zombie"
                    self.procs[pid]["status"] = status
                    for p in self.procs.values():
                        if p["parent"] == pid:
                            p["parent"] = 1

                def wait(self, parent):
                    children = sorted(pid for pid, p in self.procs.items() if p["parent"] == parent)
                    if not children:
                        return -ECHILD
                    for pid in children:
                        if self.procs[pid]["state"] == "zombie":
                            status = self.procs[pid]["status"]
                            return pid, status
                    return "blocked"


            k = Kernel()
            shell = k.fork(1)
            job = k.fork(shell)
            helper = k.fork(job)
            print(k.wait(shell))
            k.exit(job, 3)
            print(k.procs[job]["state"], k.procs[helper]["parent"])
            print(k.wait(shell))
            print(job in k.procs, k.wait(shell))
            k.exit(helper, 0)
            print(k.wait(1))
        explanation: |
          exit marks the process a zombie with its status and hands its children to init. wait lists the parent's children: none means -ECHILD; a zombie among them, lowest pid first, is removed and its pid and status returned; otherwise the parent must block. Deleting the process at exit loses the status the parent is owed; not re-parenting leaves orphans whose zombies nobody can reap; and not removing the reaped entry returns the same child again and again.
    - question:
        id: write-wait-status
        type: code
        mode: write
        system: s2
        prompt: |
          Write `describe`, which decodes the status wait returns into the shell's `$?` and a message. The program should print five lines, ending `(137, 'killed by SIGKILL')`, `(139, 'killed by SIGSEGV, core dumped')` and `(130, 'killed by SIGINT')`.
        starter: |
          NAMES = {2: "SIGINT", 9: "SIGKILL", 11: "SIGSEGV", 15: "SIGTERM"}


          def describe(status):
              # status is the number wait hands the parent. Its low 7 bits hold the
              # number of the signal that killed the child, or 0 if the child exited
              # by itself; then bits 8 to 15 hold its exit code. Bit 7 is set when a
              # killed child also dumped core. Return the shell's $?, which is the
              # exit code, or 128 + the signal number for a killed child, and a
              # message: "exited with 3", "killed by SIGKILL", or
              # "killed by SIGSEGV, core dumped". Name a signal not in NAMES as, for
              # example, "signal 6".
              return 0, ""


          for status in [0x0000, 0x0300, 0x0009, 0x008B, 0x0002]:
              print(hex(status), describe(status))
        solution: |
          NAMES = {2: "SIGINT", 9: "SIGKILL", 11: "SIGSEGV", 15: "SIGTERM"}


          def describe(status):
              signal = status & 0x7F
              if signal == 0:
                  code = (status >> 8) & 0xFF
                  return code, "exited with " + str(code)
              message = "killed by " + NAMES.get(signal, "signal " + str(signal))
              if status & 0x80:
                  message += ", core dumped"
              return 128 + signal, message


          for status in [0x0000, 0x0300, 0x0009, 0x008B, 0x0002]:
              print(hex(status), describe(status))
        tests: |
          assert describe(0) == (0, "exited with 0"), "status 0 means the child exited with code 0"
          assert describe(0x0300) == (3, "exited with 3"), "the exit code sits in bits 8 to 15, so 0x0300 is exit code 3"
          assert describe(0xFF00) == (255, "exited with 255"), "0xff00 is exit code 255"
          assert describe(0x000F) == (143, "killed by SIGTERM"), "a child killed by signal 15 gives $? = 128 + 15 = 143"
          assert describe(0x008B) == (139, "killed by SIGSEGV, core dumped"), "0x8b is signal 11 with the core-dump bit, bit 7, set: 139 and core dumped"
          assert describe(0x0086) == (134, "killed by signal 6, core dumped"), "a signal without a name in NAMES is written as signal 6"
          assert describe(0x0002) == (130, "killed by SIGINT"), "Ctrl+C kills with SIGINT, 2, so $? is 130"
          assert output.splitlines() == ["0x0 (0, 'exited with 0')", "0x300 (3, 'exited with 3')", "0x9 (137, 'killed by SIGKILL')", "0x8b (139, 'killed by SIGSEGV, core dumped')", "0x2 (130, 'killed by SIGINT')"], "The program should print the five decoded statuses"
