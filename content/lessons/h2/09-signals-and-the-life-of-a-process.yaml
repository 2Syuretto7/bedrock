            k = Kernel()
            shell = k.fork(1)
            job = k.fork(shell)
            helper = k.fork(job)
            print(k.wait(shell))
            k.exit(job, 3)
            print(k.procs[job]["state"], k.procs[helper]["parent"])
            print(k.wait(shell))
