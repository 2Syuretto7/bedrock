                    message += ", core dumped"
                return signal, message


            for status in [0x0000, 0x0300, 0x0009, 0x008B, 0x0002]:
                print(hex(status), describe(status))
        explanation: |
          Mask the low 7 bits for the signal. If it is 0, shift right by 8 and mask with 0xFF for the exit code; otherwise report 128 + signal, its name, and the core-dump flag from bit 7. Taking the exit code from the low byte reads the signal field instead; masking the signal with 0xFF drags the core-dump bit into the number; and reporting the bare signal number makes a command killed by SIGINT look like one that exited with code 2.
