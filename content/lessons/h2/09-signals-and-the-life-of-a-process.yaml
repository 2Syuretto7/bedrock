concept: h2.signals-and-the-life-of-a-process
minutes: 80
claim: You can follow a process through its whole life, from fork through ready, running and blocked to exit, zombie and reaping; explain zombies and orphans and build the process table logic that handles them; describe signals as the kernel's asynchronous notifications to a process, with their default actions, handlers and masks; say which signals cannot be caught; decode the status that wait returns and work out a shell's exit code for a killed command; write a handler that reaps every exited child even when signals merge; and shut a service down gracefully with SIGTERM before SIGKILL.
recalls: [h2.threads-in-the-kernel]
uses: [h2.processes-and-system-calls, h2.what-an-operating-system-does, h2.interrupts-and-i-o, h2.scheduling, h0.bitwise-operations-and-masks, s1.classes-and-objects, s0.dictionaries-and-sets, s4.dependency-injection-and-testable-code]
leads: [d0.interleavings-and-race-conditions]
starter: |
  # Scratch space. A shell reports a command killed by a signal as
  # 128 plus the signal's number.
  for name, number in [("SIGINT", 2), ("SIGKILL", 9), ("SIGSEGV", 11), ("SIGTERM", 15)]:
      print(name, number, "-> $? =", 128 + number)
parts:
  recall:
    - text: |
        [[h2.threads-in-the-kernel]] showed one process holding many threads, and the kernel scheduling each. Processes, though, do not live for ever. Every one of them was made by another, and when it ends, someone has to find out how it ended and clear away what is left. And sometimes the outside world has to interrupt a process that is busy with something else: a user pressing Ctrl+C, a server being told to shut down. This last lesson of the cluster follows a process to its end. Three quick pulls first.
  puzzle:
    - text: |
        In a terminal, you run `sleep 100` and press Ctrl+C after a few seconds. The terminal sends SIGINT, signal number 2, to the program, which has no handler for it. Then you type `echo $?` to see the exit status of the last command.

        **What number does the shell print?**
  intuition:
    - text: |
        When an employee leaves a firm in Ahmedabad, the desk is cleared and the laptop returned at once, but the HR file stays open until their manager signs off the final settlement. Only then is the file closed. If the manager has left too, the file passes to the head of HR, who signs off everyone's leftovers. And while someone is still working, the office can interrupt them with a note on the desk: "finish what you are doing and go home", which they deal with when they next look up, or a security guard who walks them out at once, mid-sentence.

        The open HR file is a **zombie**; the manager's sign-off is `wait`; the head of HR is **init**; the notes are **signals**. The figure follows one process, a backup started from a shell, through four different endings.
    - figure: process-life
      props: { ending: exit, step: 0 }
    - text: |
        Every ending passes through the zombie state, and every one ends with somebody calling wait. SIGTERM lets the process clean up first; SIGKILL does not, and the status the shell sees records which signal it was. That record, turned into a number by the shell, is the puzzle.
  derivation:
    - text: |
        **The life cycle.** A process is born when its parent calls fork. It moves between **ready**, **running** and **blocked** as the scheduler and its I/O decide. It ends by calling `exit(status)`, or by being killed. At that moment the kernel frees almost everything: its memory, its open files, its threads. What it keeps is a small entry in the process table holding the pid and the **exit status**, because the parent may want to know how the child ended. A process in that state is a **zombie**. When the parent calls `wait` or `waitpid`, the kernel hands over the status and removes the entry; the child has been **reaped**.

        **Zombies and orphans.** A parent that never waits leaves its zombies in the table. Each costs little, but the table has a limit, and a long-running server that forgets to reap can eventually be unable to fork at all. If the parent exits first, its children become **orphans**: the kernel makes init, pid 1, their new parent (Linux also allows a nearer "subreaper"), and init calls wait in a loop, so orphans are reaped when they exit.
    - question:
        id: derivation-zombie
        type: choice
        system: s2
        prompt: |
          A server forks a worker for each job and never calls wait. After a day, `ps` shows thousands of entries marked `<defunct>`. What are they?
        options:
          - "Zombies: exited workers whose status nobody has collected"
          - "Workers stuck in an infinite loop"
          - "Workers blocked on disk reads"
          - "Orphans that init has adopted"
        answer: 0
        explanation: |
          The workers have exited and freed their memory, but each entry waits for the parent's wait to collect the status. The fix is for the server to reap its children.
    - text: |
        **Signals.** A **signal** is a small asynchronous notification sent to a process, by the kernel or by another process with the `kill` system call. Each has a number and a default action:

        - SIGINT (2), sent by the terminal on Ctrl+C: terminate.
        - SIGTERM (15), the polite request to stop, sent by `kill` by default and by service managers: terminate.
        - SIGKILL (9): terminate, and it **cannot be caught, blocked or ignored**.
        - SIGSEGV (11), sent by the kernel after a bad memory access: terminate and dump core.
        - SIGCHLD (17 on Linux), sent to a parent when a child exits or stops: ignored by default.
        - SIGSTOP and SIGCONT: stop and resume the process; SIGSTOP, like SIGKILL, cannot be caught.

        A process can install a **handler**, a function to run instead of the default action, or ask for a signal to be ignored, for every signal except SIGKILL and SIGSTOP. Those two exist so that the administrator always has the last word.
    - question:
        id: derivation-uncatchable
        type: choice
        system: s2
        prompt: |
          A buggy program has installed handlers that ignore SIGINT and SIGTERM. Which signal still stops it for certain?
        options:
          - "SIGKILL"
          - "SIGCHLD"
          - "SIGINT, sent twice"
          - "SIGCONT"
        answer: 0
        explanation: |
          SIGKILL cannot be caught, blocked or ignored; the kernel ends the process itself. SIGCHLD and SIGCONT do not terminate anything by default.
    - text: |
        **Delivery.** Sending a signal only sets a **pending** bit in the target's kernel record and, if it is blocked in a system call, wakes it. The signal is acted on the next time the target is about to return from the kernel to user mode, after a system call, an interrupt or a context switch. If the signal is not in the process's **blocked mask**, the kernel either applies the default action or arranges for the handler to run: it pushes a frame on the user stack so that the process "returns" into the handler, and the handler's return lands in a small `sigreturn` call that restores the interrupted state. Because there is one pending bit per signal, ordinary signals do not queue: three SIGCHLDs sent before the first is delivered arrive as one.

        **Handlers are dangerous places.** A handler can run between any two instructions of the program, even in the middle of `malloc` or `printf`. Calling those again from the handler can deadlock or corrupt their data. So handlers should do almost nothing: set a flag the main loop checks, or write a byte to a pipe the main loop watches, and only call functions listed as **async-signal-safe**, such as `write` and `waitpid`.
    - question:
        id: derivation-merge
        type: numeric
        system: s2
        prompt: |
          Five child processes exit while their parent is running a long computation that makes no system calls, and only then does the parent return to user mode from a timer interrupt. How many times does its SIGCHLD handler run?
        answer: "1"
        explanation: |
          Each exit sets the same pending bit, which is already set after the first. When the signal is finally delivered, the handler runs once, and must reap all five children itself.
    - text: |
        **Exit status.** `wait` hands the parent one integer that encodes how the child ended. On Linux, the low 7 bits are the number of the signal that killed it, or 0 if it exited by itself; in that case bits 8 to 15 hold the exit code, the value passed to `exit`, which is why exit codes run from 0 to 255. Bit 7 says whether a killed child dumped core. C programs decode this with macros such as `WIFEXITED` and `WEXITSTATUS`. Shells turn it into one number, `$?`: the exit code, or **128 plus the signal number** for a killed command, so a command killed by SIGKILL gives 137.

        **Graceful shutdown.** Service managers such as systemd, and Kubernetes when it stops a container, send SIGTERM first. A well-written service catches it, stops taking new work, finishes or saves what is in progress, and exits with status 0. If it has not exited after a grace period, 30 seconds by default in Kubernetes, the manager sends SIGKILL. A service that ignores SIGTERM therefore always dies the hard way, possibly mid-write.
    - question:
        id: derivation-status
        type: numeric
        system: s2
        prompt: |
          A container is stopped by SIGTERM (15), which it does not handle. What exit code does the shell report?
        answer: "143"
        explanation: |
          With no handler, SIGTERM's default action terminates the process, and the shell reports a killed command as 128 + 15 = 143.
  formal:
    - text: |
        **Life cycle.** fork → ready ⇄ running ⇄ blocked → exit or killed → zombie (status kept) → wait → reaped. Orphans are adopted by init, which reaps them.

        **Signals.** Asynchronous notifications with default actions: terminate, core dump, ignore, stop. Handlers may replace them, except for SIGKILL and SIGSTOP. A signal is marked pending and acted on at the next return to user mode, unless blocked; ordinary signals do not queue.

        **Handlers.** Run between any two instructions; do the minimum with async-signal-safe calls; a SIGCHLD handler must reap in a loop.

        **Status.** Low 7 bits: killing signal, or 0. Bits 8 to 15: exit code. Bit 7: core dumped. Shell's $? = exit code, or 128 + signal.

        **Shutdown.** SIGTERM, a grace period, then SIGKILL.
  drill:
    - text: Seconds each. Ask who must act, and when.
    - question:
        id: drill-orphan
        type: choice
        system: s1
        prompt: |
          A parent exits while its child is still running. Who reaps the child when it exits?
        options:
          - "init, pid 1, or a subreaper, which adopts orphans"
          - "Nobody: it stays a zombie for ever"
          - "The child reaps itself"
          - "The parent's parent, always"
        answer: 0
        explanation: Orphans are re-parented to init (or a subreaper), which waits for its children in a loop.
    - question:
        id: drill-when
        type: choice
        system: s1
        prompt: |
          A signal is sent to a process that is running a long loop of arithmetic on another core. When does the process act on it?
        options:
          - "The next time it returns from the kernel to user mode, such as after the next timer interrupt"
          - "Never, until the loop ends"
          - "At the exact instruction the signal was sent"
          - "Only at its next system call"
        answer: 0
        explanation: The kernel checks for pending signals on every return to user mode; the timer interrupt guarantees one soon, so the loop cannot hide from signals.
    - question:
        id: predict-dollar
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          status = 0x0009
          signal = status & 0x7F
          print(128 + signal if signal else (status >> 8) & 0xFF)
        output: "137"
        explanation: The low 7 bits are 9, so the child was killed by SIGKILL, and the shell reports 128 + 9.
    - question:
        id: predict-merge
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          pending = set()
          for child in [201, 202, 203]:
              pending.add("SIGCHLD")
          print(len(pending))
        output: "1"
        explanation: A set holds each signal once, as the kernel's pending bits do, so three exits leave one pending SIGCHLD.
    - question:
        id: predict-zombie
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          table = {101: "running", 102: "running", 103: "running"}
          for pid in [102, 103]:
              table[pid] = "zombie"
          del table[102]
          print(sorted(table.items()))
        output: "[(101, 'running'), (103, 'zombie')]"
        explanation: Both children exited and became zombies, but only 102 was waited for and removed; 103 stays a zombie.
  work:
    - text: Slower now. Each answer is part of how a kernel or a careful program ends processes.
    - question:
        id: write-process-table
        type: code
        mode: write
        system: s2
        prompt: |
          Write `exit` and `wait` for a kernel's process table, with zombies, orphans adopted by init, and the three answers wait can give. The program should print `blocked`, `zombie 1`, `(102, 3)`, `False -10` and `(103, 0)`.
        starter: |
          ECHILD = 10


          class Kernel:
              def __init__(self):
                  # pid -> {"parent": pid, "state": "running" or "zombie", "status": exit status}
                  self.procs = {1: {"parent": 0, "state": "running", "status": None}}  # pid 1 is init
                  self.next_pid = 100

              def fork(self, parent):
                  self.next_pid += 1
                  self.procs[self.next_pid] = {"parent": parent, "state": "running", "status": None}
                  return self.next_pid

              def exit(self, pid, status):
                  # pid has finished with an exit status. It becomes a zombie, keeping
                  # only that status until its parent waits for it. Any children it
                  # had are adopted by init, pid 1.
                  pass

              def wait(self, parent):
                  # If parent has a zombie child, remove the one with the lowest pid
                  # from the table altogether and return (its pid, its status). If
                  # parent has children but none has exited, return "blocked". If it
                  # has no children at all, return -ECHILD.
                  return "blocked"


          k = Kernel()
          shell = k.fork(1)
          job = k.fork(shell)
          helper = k.fork(job)
          print(k.wait(shell))
          k.exit(job, 3)
          print(k.procs[job]["state"], k.procs[helper]["parent"])
          print(k.wait(shell))
          print(job in k.procs, k.wait(shell))
          k.exit(helper, 0)
          print(k.wait(1))
        solution: |
          ECHILD = 10


          class Kernel:
              def __init__(self):
                  # pid -> {"parent": pid, "state": "running" or "zombie", "status": exit status}
                  self.procs = {1: {"parent": 0, "state": "running", "status": None}}  # pid 1 is init
                  self.next_pid = 100

              def fork(self, parent):
                  self.next_pid += 1
                  self.procs[self.next_pid] = {"parent": parent, "state": "running", "status": None}
                  return self.next_pid

              def exit(self, pid, status):
                  self.procs[pid]["state"] = "zombie"
                  self.procs[pid]["status"] = status
                  for p in self.procs.values():
                      if p["parent"] == pid:
                          p["parent"] = 1

              def wait(self, parent):
                  children = sorted(pid for pid, p in self.procs.items() if p["parent"] == parent)
                  if not children:
                      return -ECHILD
                  for pid in children:
                      if self.procs[pid]["state"] == "zombie":
                          status = self.procs[pid]["status"]
                          del self.procs[pid]
                          return pid, status
                  return "blocked"


          k = Kernel()
          shell = k.fork(1)
          job = k.fork(shell)
          helper = k.fork(job)
          print(k.wait(shell))
          k.exit(job, 3)
          print(k.procs[job]["state"], k.procs[helper]["parent"])
          print(k.wait(shell))
          print(job in k.procs, k.wait(shell))
          k.exit(helper, 0)
          print(k.wait(1))
        tests: |
          _k = Kernel()
          assert _k.wait(1) == -10, "init with no children at all should get -ECHILD, -10"
          _a = _k.fork(1)
          assert _k.wait(1) == "blocked", "a parent whose children are all still running must wait: blocked"
          _k.exit(_a, 7)
          assert _a in _k.procs and _k.procs[_a]["state"] == "zombie", "an exited process stays in the table as a zombie until its parent waits"
          assert _k.wait(1) == (_a, 7), "wait should return the zombie child's pid and status, 7"
          assert _a not in _k.procs, "once waited for, the zombie is removed from the table"
          assert _k.wait(1) == -10, "after reaping its only child, init has no children left"
          _p = _k.fork(1)
          _c1 = _k.fork(_p)
          _c2 = _k.fork(_p)
          _k.exit(_c2, 2)
          _k.exit(_c1, 1)
          assert _k.wait(_p) == (_c1, 1) and _k.wait(_p) == (_c2, 2), "with two zombie children, wait returns the lowest pid first, then the next"
          _q = _k.fork(1)
          _g = _k.fork(_q)
          _k.exit(_q, 0)
          assert _k.procs[_g]["parent"] == 1, "when a process exits, its children are adopted by init, pid 1"
          _k.exit(_g, 5)
          assert _k.wait(1) == (_q, 0) and _k.wait(1) == (_g, 5), "init can then reap both the exited parent and the orphan"
          assert output.splitlines() == ["blocked", "zombie 1", "(102, 3)", "False -10", "(103, 0)"], "The program should print blocked, zombie 1, (102, 3), False -10 and (103, 0)"
