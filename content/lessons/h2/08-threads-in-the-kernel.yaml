            current_user = {}  # which user each thread's request is for, by thread id


            def handle(tid, user, replies):
                # One thread handling one web request. While it waits for the database
                # the kernel runs other threads of the same process, which share all of
                # its global variables.
                global current_user
                current_user = {tid: user}
                yield  # waiting for the database; other threads run now
                replies.append((tid, "hello " + current_user[tid]))


            def run(requests):
                replies = []
                threads = [handle(tid, user, replies) for tid, user in requests]
                while threads:
                    for t in list(threads):
                        try:
                            next(t)
                        except StopIteration:
                            threads.remove(t)
                return replies


            print(run([(1, "asha"), (2, "ravi")]))
        explanation: |
          current_user is a global, shared by every thread, so the last thread to set it wins and the others read its value after their wait. Keeping one entry per thread, keyed by thread id, is thread-local storage. A dictionary with one fixed key is still one shared slot; copying the global into a local after the wait copies the wrong value; and rebinding the global to a fresh dictionary in each thread throws away the other threads' entries.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. A program runs 8 threads with a user-level (N:1) thread library on 4 cores, and one thread blocks in read for half a second. How many of the other 7 can run meanwhile?
        answer: "0"
        explanation: |
          The kernel sees one thread, and the read put it to sleep. The library never gets the processor back to switch to another thread, so all 8 wait.
    - question:
        id: work-server
        type: choice
        system: s2
        prompt: |
          A team must handle 200,000 mostly idle chat connections on one server. Which design fits best?
        options:
          - "An M:N runtime or an event loop, so each connection costs a few KiB rather than a kernel thread"
          - "One kernel thread per connection, each with the default 8 MiB stack"
          - "One process per connection"
          - "A single thread that reads each connection in turn with blocking calls"
        answer: 0
        explanation: |
          200,000 kernel threads would mean 200,000 kernel stacks and scheduler entries; processes are heavier still; and blocking reads in turn would stall on the first quiet connection. Cheap user-level threads, or the event loops of the concurrency cluster, handle this many idle connections comfortably.
  connections:
    - text: |
        None of them: 0. The library switches threads in user space, but the kernel sees a single thread, and the read has put it to sleep. Until the read returns, the library itself never runs, so it cannot switch to another thread, and the process uses no core at all. With kernel threads, four of the seven would run at once on the four cores; with an M:N runtime, the same.

        Threads and processes come and go, and the kernel sometimes has to tell a process something urgently: that a child has exited, that the user pressed Ctrl+C, that it touched memory it should not. [[h2.signals-and-the-life-of-a-process]] follows a process from birth to the moment its parent collects its exit status, and the signals that can interrupt it on the way.
