    - question:
        id: write-thread-models
        type: code
        mode: write
        system: s2
        prompt: |
          Write `elapsed`, which runs threads of computing and I/O on one core under user-level (N:1) or kernel (1:1) threading and returns when the last one finishes. The program should print `user-level threads: 27 ms` and `kernel threads: 15 ms`.
        starter: |
          from collections import deque


          def elapsed(threads, model):
              # threads is a list of threads, each a list of steps ("cpu", ms) or
              # ("io", ms), run on one core. Ready threads wait in a queue in order.
              # The thread at the front runs its steps in turn until it finishes or
              # blocks; nothing preempts it. A "cpu" step takes ms of the core's time.
              # On an "io" step the two models differ:
              #   "N:1"  user-level threads: the kernel sees only one thread, so the
              #          whole process waits ms and then the same thread carries on.
              #   "1:1"  kernel threads: only this thread blocks. It leaves the core,
              #          and when its I/O is done it joins the back of the ready queue,
              #          with the rest of its steps. Whenever a thread stops running,
              #          first queue every thread whose I/O has finished by then,
              #          earliest first; if nothing is ready, the core idles until the
              #          next I/O finishes.
              # Return the time at which the last thread finishes.
              return 0


          threads = [[("cpu", 2), ("io", 10), ("cpu", 2)], [("cpu", 8)], [("cpu", 1), ("io", 3), ("cpu", 1)]]
          print("user-level threads:", elapsed(threads, "N:1"), "ms")
          print("kernel threads:", elapsed(threads, "1:1"), "ms")
        solution: |
          from collections import deque


          def elapsed(threads, model):
              steps = [deque(t) for t in threads]
              ready = deque(range(len(threads)))
              blocked = []
              now = 0
              while ready or blocked:
                  if not ready:
                      blocked.sort()
                      wake, i = blocked.pop(0)
                      now = max(now, wake)
                      ready.append(i)
                      continue
                  i = ready.popleft()
                  while steps[i]:
                      kind, ms = steps[i].popleft()
                      if kind == "cpu" or model == "N:1":
                          now += ms
                      else:
                          blocked.append((now + ms, i))
                          break
                  blocked.sort()
                  while blocked and blocked[0][0] <= now:
                      ready.append(blocked.pop(0)[1])
              return now


          threads = [[("cpu", 2), ("io", 10), ("cpu", 2)], [("cpu", 8)], [("cpu", 1), ("io", 3), ("cpu", 1)]]
          print("user-level threads:", elapsed(threads, "N:1"), "ms")
          print("kernel threads:", elapsed(threads, "1:1"), "ms")
        tests: |
          _t = [[("cpu", 2), ("io", 10), ("cpu", 2)], [("cpu", 8)], [("cpu", 1), ("io", 3), ("cpu", 1)]]
          assert elapsed(_t, "N:1") == 27, "with user-level threads every I/O stalls the whole process, so the times simply add up to 27 ms, not " + repr(elapsed(_t, "N:1"))
