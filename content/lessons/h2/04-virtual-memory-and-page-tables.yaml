            def lru_faults(refs, frames):
                # Count the page faults when a process touches the pages in refs, in
                # order, with room for frames pages in memory. On a fault with memory
                # full, evict the least recently used page: the one touched longest ago.
                memory = []  # the pages in memory, least recently used first
                faults = 0
                for page in refs:
                    if page in memory:
                        memory.remove(page)
                        memory.append(page)
                        continue
                    faults += 1
                    if len(memory) >= frames - 1:
                        memory.pop(0)
                    memory.append(page)
                return faults


            refs = [7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1]
            print(lru_faults(refs, 3), "faults with 3 frames")
            print(lru_faults(refs, 4), "faults with 4 frames")
        explanation: |
          On a hit the code does nothing, so the list stays in order of loading and the policy is really FIFO. A hit must move the page to the most recent end: remove it and append it. Moving it to the front instead makes it the next victim; popping from the end evicts the most recently used page; and evicting one page early wastes a frame.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. A 32-bit machine with 4 KiB pages gives each process a flat page table with one 4-byte entry per page. How many MiB is each table?
        answer: "4"
        unit: MiB
        explanation: |
          A 4 GiB address space holds 2³² / 2¹² = 2²⁰ pages, about a million, and 2²⁰ entries of 4 bytes is 2²² bytes, 4 MiB, for every process, even one that uses a few pages.
