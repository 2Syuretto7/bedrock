        explanation: |
          The root index is vaddr >> 22, the top 10 bits, and the second-level index is (vaddr >> 12) & 0x3FF, the next 10. Create a second-level table only if the root entry is empty. Creating one every time throws away the pages already mapped in that region; shifting by 10 instead of 12 reads part of the offset as page number; and checking only the root entry crashes on an empty slot in a table that exists.
