          def lru_faults(refs, frames):
              # Count the page faults when a process touches the pages in refs, in
              # order, with room for frames pages in memory. On a fault with memory
              # full, evict the least recently used page: the one touched longest ago.
              memory = []  # the pages in memory, least recently used first
              faults = 0
              for page in refs:
                  if page in memory:
                      memory.remove(page)
                      memory.append(page)
                      continue
                  faults += 1
                  if len(memory) == frames:
                      memory.pop(0)
                  memory.append(page)
              return faults


