        system: s2
        prompt: |
          Kernels leave the lowest pages of every address space unmapped on purpose. A program follows a null pointer to read a field 16 bytes into a struct. What happens?
        options:
          - "The load from address 16 hits an unmapped page, the kernel sends SIGSEGV, and the bug shows up at once"
          - "It reads whatever data happens to be at physical address 16"
          - "It reads the kernel's memory"
          - "The kernel maps a fresh zero page and the program carries on"
        answer: 0
        explanation: |
          Address 16 lies in page 0, which has no mapping, so the access faults immediately. Without that guard the program would read garbage and fail somewhere far from the bug.
  connections:
    - text: |
        4 MiB. There are 2³² / 2¹² = 2²⁰ pages and each entry takes 4 bytes, so 2²² bytes, for every process, even a tiny one. A hundred processes would spend 400 MiB on page tables alone. That is why real tables are trees: a small process needs only the root and a handful of second-level tables, 16 KiB in the exercise.

        Every load and store now needs a translation, and with a four-level table that means four extra memory reads before the real one, which would make every program several times slower. [[h2.the-tlb-and-address-translation]] shows the small cache inside the processor that makes almost all of those reads unnecessary.
