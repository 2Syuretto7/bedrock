        explanation: |
          The ring is full when advancing head would make it equal tail, which must be computed modulo the size: (head + 1) % size == tail. The test head == tail - 1 misses the case where tail is 0 and head is the last slot, so the card wraps onto unread packets and the ring then looks empty. Treating head == tail as full refuses every packet, advancing tail without wrapping runs off the end of the list, and evicting the oldest packet loses data the driver has not seen.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. A network card raises 1,000,000 interrupts a second, each costing 2 microseconds of processor time. What percentage of one core would the interrupts alone need?
        answer: "200"
        unit: "%"
        explanation: |
          1,000,000 × 2 microseconds = 2,000,000 microseconds of work each second, twice what one core has. The core cannot keep up, which is receive livelock.
    - question:
        id: work-nvme
        type: choice
        system: s2
        prompt: |
          An NVMe drive finishes a read in 10 microseconds, and handling an interrupt costs about 2. For a database doing millions of small reads, which design keeps latency lowest?
        options:
          - "Poll the completion queue for a short while after submitting, since the answer will come almost at once"
          - "Sleep and wait for an interrupt, as for a hard disk"
          - "Copy each block through a data register, word by word"
          - "Raise the interrupt's priority"
        answer: 0
        explanation: |
          When the device is nearly as fast as an interrupt, the interrupt and the context switch become a large part of each read. Spinning briefly on the completion ring avoids both; Linux offers exactly this for fast drives.
  connections:
    - text: |
        200%. A million interrupts at 2 microseconds each is two seconds of handling per second, twice what one core can do, so the core would spend all its time in handlers and still fall behind. In practice the card coalesces interrupts, interrupting once per batch, and the driver switches to polling its receive ring under load, which brings the cost down to a small fraction.

        With interrupts and DMA, the kernel can talk to a disk efficiently, but a disk only stores numbered blocks. [[h2.files-and-file-systems]] shows how the kernel turns those blocks into named files and directories that survive crashes, and why opening one file can take several disk reads.
