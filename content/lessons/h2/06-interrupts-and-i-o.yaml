            def coalesce(arrivals, batch, timeout):
                interrupts = 0
                longest = 0
                first = None
                count = 0
                for t in arrivals:
                    if first is not None and t > first + timeout:
                        interrupts += 1
                        longest = max(longest, timeout)
                        first = None
                    if first is None:
                        first = t
                    count += 1
                    if count == batch:
                        interrupts += 1
                        longest = max(longest, t - first)
                        first = None
                        count = 0
                if first is not None:
                    interrupts += 1
                    longest = max(longest, timeout)
                return interrupts, longest


            times = list(range(10)) + [100, 500]  # a burst of ten packets, then two stragglers
            print(coalesce(times, 1, 20), "interrupting for every packet")
            print(coalesce(times, 4, 20), "in batches of up to 4")
        explanation: |
          Track when the first waiting packet arrived and how many are waiting. Before adding a packet, check whether the timer would already have fired; after adding it, check whether the batch is full; at the end, the timer handles whatever is left. Forgetting the timer lets a straggler wait for ever; starting the timer from the latest packet lets a steady trickle postpone the interrupt indefinitely; and not resetting the count after the timer fires makes the next batch interrupt early.
    - question:
        id: fix-rx-ring
        type: code
        mode: find-bug
        system: s2
        prompt: |
