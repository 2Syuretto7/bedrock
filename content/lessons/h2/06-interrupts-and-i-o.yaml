            TIMER, DISK, NET, KEYBOARD = 0, 2, 3, 5
            pic = InterruptController()
            pic.raise_line(KEYBOARD)
            pic.raise_line(DISK)
            pic.mask(DISK)  # the disk driver is busy, so hold its interrupts back
