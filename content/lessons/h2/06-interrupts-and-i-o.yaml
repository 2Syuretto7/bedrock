            class InterruptController:
                # Eight interrupt lines, 0 to 7; a lower number has a higher priority.
                # pending and masked are bit masks: bit n set means line n is waiting to
                # be handled, or is masked (held back) for now. A masked line that is
                # raised stays pending, and is handled once it is unmasked.
                def __init__(self):
                    self.pending = 0
                    self.masked = 0

                def raise_line(self, n):
                    self.pending |= 1 << n

                def mask(self, n):
                    self.masked |= 1 << n

                def unmask(self, n):
                    self.masked ^= 1 << n

                def claim(self):
                    ready = self.pending & ~self.masked
                    if ready == 0:
                        return None
                    n = (ready & -ready).bit_length() - 1
                    self.pending &= ~(1 << n)
                    return n


            TIMER, DISK, NET, KEYBOARD = 0, 2, 3, 5
            pic = InterruptController()
            pic.raise_line(KEYBOARD)
            pic.raise_line(DISK)
            pic.mask(DISK)  # the disk driver is busy, so hold its interrupts back
            pic.raise_line(TIMER)
            print(pic.claim(), pic.claim(), pic.claim())
            pic.unmask(DISK)
            print(pic.claim(), pic.claim())
        explanation: |
          Set a bit with |= 1 << n and clear it with &= ~(1 << n). The lines ready to claim are pending & ~masked, and the lowest set bit of a number x is x & -x, whose bit_length minus 1 is its position. Clearing the pending bit when masking loses interrupts; taking the highest set bit serves the lowest priority first; and toggling with ^= masks a line that was never masked.
    - question:
        id: write-coalesce
        type: code
        mode: write
        system: s2
        prompt: |
          Write `coalesce`, which counts the interrupts a network card raises when it waits for a batch of packets or a timeout, and the longest any packet waited. The program should print `(12, 0) interrupting for every packet` and `(5, 20) in batches of up to 4`.
        starter: |
          def coalesce(arrivals, batch, timeout):
              # arrivals is a sorted list of times, in microseconds, at which packets
              # reach the network card. Rather than interrupt for every packet, the
              # card interrupts as soon as `batch` packets are waiting, or `timeout`
              # microseconds after the first waiting packet arrived, whichever comes
              # first; each interrupt hands over every waiting packet. A packet that
              # arrives at the very moment the timer fires goes with that interrupt.
              # Return (number of interrupts, the longest any packet waited for one).
              return 0, 0


          times = list(range(10)) + [100, 500]  # a burst of ten packets, then two stragglers
          print(coalesce(times, 1, 20), "interrupting for every packet")
          print(coalesce(times, 4, 20), "in batches of up to 4")
        solution: |
          def coalesce(arrivals, batch, timeout):
              interrupts = 0
              longest = 0
              first = None
              count = 0
              for t in arrivals:
                  if first is not None and t > first + timeout:
                      interrupts += 1
                      longest = max(longest, timeout)
                      first = None
                      count = 0
                  if first is None:
                      first = t
                  count += 1
                  if count == batch:
                      interrupts += 1
                      longest = max(longest, t - first)
                      first = None
                      count = 0
              if first is not None:
                  interrupts += 1
                  longest = max(longest, timeout)
              return interrupts, longest


          times = list(range(10)) + [100, 500]  # a burst of ten packets, then two stragglers
          print(coalesce(times, 1, 20), "interrupting for every packet")
          print(coalesce(times, 4, 20), "in batches of up to 4")
        tests: |
          assert coalesce([5], 4, 20) == (1, 20), "a lone packet waits for the timer: 1 interrupt after 20 microseconds"
          assert coalesce([0, 1, 2, 3], 4, 20) == (1, 3), "four packets fill a batch of 4 at time 3, so 1 interrupt, and the first packet waited 3 microseconds"
          assert coalesce([0, 15, 30, 45], 10, 20) == (2, 20), "the timer runs from the first waiting packet: it fires at 20 for the packets at 0 and 15, and again at 50 for 30 and 45"
          assert coalesce([0, 20], 10, 20) == (1, 20), "a packet that arrives just as the timer fires goes with that interrupt"
          assert coalesce([0, 30, 31, 32, 33], 4, 20) == (2, 20), "after the timer fires for the packet at 0, the count starts again: 30 to 33 make a new batch of 4"
          assert coalesce([], 4, 20) == (0, 0), "no packets, no interrupts"
          assert coalesce(list(range(10)) + [100, 500], 4, 20) == (5, 20), "the example should give 5 interrupts, the longest wait 20"
          assert output.splitlines() == ["(12, 0) interrupting for every packet", "(5, 20) in batches of up to 4"], "The program should print (12, 0) and then (5, 20)"
        wrong:
