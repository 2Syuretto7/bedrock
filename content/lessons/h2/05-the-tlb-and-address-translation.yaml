          # Two processes, each with its own page table. Both use virtual page 0x10.
          tables = {1: {0x10: 0x2A, 0x11: 0x2B}, 2: {0x10: 0x3B}}
          memory = {0x2A: "A's password", 0x2B: "A's photos", 0x3B: "B's shopping list"}


          class Core:
              # One processor core with a TLB. The TLB should keep translations
              # across context switches, so that a process that runs again soon finds
              # its pages still there, but a process must never use another's.
              def __init__(self):
                  self.tlb = {}
                  self.asid = None  # which address space is running
                  self.walks = 0    # page-table walks, each several slow memory reads

              def switch_to(self, asid):
                  self.asid = asid

              def read(self, vaddr):
                  vpn = vaddr >> 12
                  key = (self.asid, vpn)
                  if key in self.tlb:
                      frame = self.tlb[key]
                  else:
                      self.walks += 1
                      frame = tables[self.asid][vpn]
                      self.tlb[key] = frame
                  return memory[frame]


