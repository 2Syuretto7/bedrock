                # A small cache of translations, from virtual page number to frame
                # number, holding at most `entries` of them. self.map is kept in order of
                # use, least recently used first. A lookup that hits counts as a use;
                # inserting into a full TLB evicts the least recently used translation.
                def __init__(self, entries):
                    self.entries = entries
                    self.map = {}

                def lookup(self, vpn):
                    if vpn not in self.map:
                        return None
                    frame = self.map.pop(vpn)
                    self.map[vpn] = frame
                    return frame

                def insert(self, vpn, frame):
                    if vpn in self.map:
                        self.map.pop(vpn)
                    elif len(self.map) == self.entries:
                        del self.map[next(iter(self.map))]
                    self.map[vpn] = frame


            ROWS = 64
            COLS = 1024  # a row of 1024 four-byte ints fills exactly one 4 KiB page
            BASE = 0x10000000


            def addresses(order):
                result = []
                if order == "row":
                    for r in range(ROWS):
                        for c in range(COLS):
                            result.append((r * COLS + c) * 4)
                else:
                    for c in range(COLS):
                        for r in range(ROWS):
                            result.append((r * COLS + c) * 4)
                return result


            def misses(addrs, entries):
                tlb = TLB(entries)
                count = 0
                for a in addrs:
                    vpn = a >> 12
                    if tlb.lookup(vpn) is None:
                        count += 1
                        tlb.insert(vpn, vpn)
                return count


            for order in ["row", "column"]:
                print(order, misses(addresses(order), 32))
        explanation: |
          The address of a[r][c] is always BASE + (r × COLS + c) × 4; only the order of the two loops changes. Down a column, each step is a whole 4 KiB row, so each access lands on a new page, and 64 pages in turn overflow a 32-entry TLB. Swapping r and COLS in the formula computes the wrong element and hides the effect; leaving out the 4 treats ints as bytes; and leaving out BASE puts the array at address 0.
