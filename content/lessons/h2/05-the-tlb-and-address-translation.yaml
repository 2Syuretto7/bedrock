            # Two processes, each with its own page table. Both use virtual page 0x10.
            tables = {1: {0x10: 0x2A, 0x11: 0x2B}, 2: {0x10: 0x3B}}
            memory = {0x2A: "A's password", 0x2B: "A's photos", 0x3B: "B's shopping list"}


            class Core:
                # One processor core with a TLB. The TLB should keep translations
                # across context switches, so that a process that runs again soon finds
                # its pages still there, but a process must never use another's.
                def __init__(self):
                    self.tlb = {}
                    self.asid = None  # which address space is running
                    self.walks = 0    # page-table walks, each several slow memory reads

                def switch_to(self, asid):
                    self.asid = asid

                def read(self, vaddr):
                    vpn = vaddr >> 12
                    if self.asid in self.tlb:
                        frame = self.tlb[self.asid]
                    else:
                        self.walks += 1
                        frame = tables[self.asid][vpn]
                        self.tlb[self.asid] = frame
                    return memory[frame]


            core = Core()
            for asid in [1, 2, 1]:
                core.switch_to(asid)
                print(asid, core.read(0x10008))
            print(core.walks, "page-table walks")
        explanation: |
          The TLB is keyed by page number alone, so a translation made for process 1 is used by process 2. Keying it by (asid, page number) does what an address-space identifier does in hardware: each process's entries are kept apart, and process 1 finds its entry again after the switch. Flushing on every switch is correct but throws that entry away; storing under the tagged key but looking up the bare one never hits; and keying by asid alone confuses a process's different pages.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. A TLB holds 64 translations for 4 KiB pages. What is the largest array, in KiB, that a loop can sweep repeatedly with no TLB misses after the first sweep?
        answer: "256"
        unit: KiB
        explanation: |
          The TLB can hold translations for 64 pages at once, which cover 64 × 4 = 256 KiB. An array that fits stays mapped; one page more and, with LRU replacement, each sweep evicts every page just before it is needed again.
    - question:
        id: work-db
        type: choice
        system: s2
        prompt: |
          A database server scans a 40 GiB in-memory table and spends a fifth of its time on page-table walks. What is the most direct fix?
        options:
          - "Back the table with huge pages, so far fewer TLB entries cover it"
          - "Add more processor cores"
          - "Flush the TLB more often"
          - "Use a faster disk"
        answer: 0
        explanation: |
          The walks come from TLB misses, and with 4 KiB pages 40 GiB needs ten million translations. With 1 GiB pages it needs 40, and with 2 MiB pages 20,480, which a second-level TLB nearly holds.
  connections:
    - text: |
        256 KiB. Sixty-four entries of 4 KiB each cover 256 KiB, the TLB's reach. Any array up to that size stays mapped from one sweep to the next; with even one more page, LRU replacement evicts each page just before the loop comes back for it, and every new page misses. That cliff is why huge pages and loop order matter so much for big data.

        Translation, faults and context switches all depend on the processor being interrupted and handing control to the kernel. So far that has been the timer and the program's own mistakes. [[h2.interrupts-and-i-o]] turns to the devices: disks, network cards and keyboards that finish their work on their own schedule and need the processor's attention when they do.
