    - question:
        id: write-loop-order
        type: code
        mode: write
        system: s2
        prompt: |
          Write `addresses`, which lists the address of every element of a 64 × 1024 array of ints in row order or in column order. The program should print `row 64` and `column 65536`: the same sum, with a thousand times as many TLB misses.
        starter: |
          class TLB:
              # A small cache of translations, from virtual page number to frame
              # number, holding at most `entries` of them. self.map is kept in order of
              # use, least recently used first. A lookup that hits counts as a use;
              # inserting into a full TLB evicts the least recently used translation.
              def __init__(self, entries):
                  self.entries = entries
                  self.map = {}

              def lookup(self, vpn):
                  if vpn not in self.map:
                      return None
                  frame = self.map.pop(vpn)
                  self.map[vpn] = frame
                  return frame

              def insert(self, vpn, frame):
                  if vpn in self.map:
                      self.map.pop(vpn)
                  elif len(self.map) == self.entries:
                      del self.map[next(iter(self.map))]
                  self.map[vpn] = frame


          ROWS = 64
          COLS = 1024  # a row of 1024 four-byte ints fills exactly one 4 KiB page
          BASE = 0x10000000


          def addresses(order):
              # The address of every element of a ROWS x COLS array of 4-byte ints,
              # stored row after row from BASE, so a[r][c] is at
              # BASE + (r * COLS + c) * 4. Return them in the order a loop visits them:
              # "row" goes along each row in turn, a[0][0], a[0][1], ..., and "column"
              # goes down each column in turn, a[0][0], a[1][0], ....
              return []


          def misses(addrs, entries):
              tlb = TLB(entries)
              count = 0
              for a in addrs:
                  vpn = a >> 12
                  if tlb.lookup(vpn) is None:
                      count += 1
                      tlb.insert(vpn, vpn)
              return count


          for order in ["row", "column"]:
              print(order, misses(addresses(order), 32))
        solution: |
          class TLB:
              # A small cache of translations, from virtual page number to frame
              # number, holding at most `entries` of them. self.map is kept in order of
              # use, least recently used first. A lookup that hits counts as a use;
              # inserting into a full TLB evicts the least recently used translation.
              def __init__(self, entries):
                  self.entries = entries
                  self.map = {}

              def lookup(self, vpn):
                  if vpn not in self.map:
                      return None
                  frame = self.map.pop(vpn)
                  self.map[vpn] = frame
                  return frame

              def insert(self, vpn, frame):
                  if vpn in self.map:
                      self.map.pop(vpn)
                  elif len(self.map) == self.entries:
                      del self.map[next(iter(self.map))]
                  self.map[vpn] = frame


          ROWS = 64
          COLS = 1024  # a row of 1024 four-byte ints fills exactly one 4 KiB page
          BASE = 0x10000000


          def addresses(order):
              result = []
              if order == "row":
                  for r in range(ROWS):
                      for c in range(COLS):
                          result.append(BASE + (r * COLS + c) * 4)
              else:
                  for c in range(COLS):
                      for r in range(ROWS):
                          result.append(BASE + (r * COLS + c) * 4)
              return result


          def misses(addrs, entries):
              tlb = TLB(entries)
              count = 0
              for a in addrs:
                  vpn = a >> 12
                  if tlb.lookup(vpn) is None:
                      count += 1
                      tlb.insert(vpn, vpn)
              return count


          for order in ["row", "column"]:
              print(order, misses(addresses(order), 32))
        tests: |
          _row = addresses("row")
          _col = addresses("column")
          assert len(_row) == 64 * 1024 and len(_col) == 64 * 1024, "each order should visit all 65,536 elements once"
          assert _row[:3] == [0x10000000, 0x10000004, 0x10000008], "along a row, ints are 4 bytes apart, starting at BASE"
          assert _row[1024] == 0x10001000, "the second row starts 4096 bytes after the first"
          assert _col[:3] == [0x10000000, 0x10001000, 0x10002000], "down a column, a[1][0] is a whole row, 4096 bytes, after a[0][0]"
          assert _col[64] == 0x10000004, "after the 64 elements of column 0 comes a[0][1], at BASE + 4"
          assert sorted(_row) == sorted(_col), "both orders visit the same addresses"
          assert misses(_row, 32) == 64, "going along rows misses once per page, 64 times"
          assert misses(_col, 32) == 65536, "going down columns touches 64 pages in turn, more than 32 entries hold, so every access misses"
          assert output.splitlines() == ["row 64", "column 65536"], "The program should print row 64 and column 65536"
