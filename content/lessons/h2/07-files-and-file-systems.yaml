            print(len(ops), "operations;", len(survivors), "different files could survive a crash")
        explanation: |
          Writing straight into the file truncates it first, so every crash point after that leaves a stump. Write the new data to a temporary file, truncating it first in case an earlier crash left one behind, and then rename it over the old name in one atomic step. Renaming the empty temporary file first and appending afterwards is no better; copying the data back with truncate and append reopens the window; and skipping the truncate lets an old temporary file's junk into the result. Real code also calls fsync on the temporary file before the rename, so its data is on disk before the name points to it.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Back to the opening question. With 4 KiB blocks, 4-byte pointers, 12 direct pointers and one single-indirect pointer, what is the largest file in KiB?
        answer: "4144"
        unit: KiB
        explanation: |
          12 direct blocks hold 48 KiB. The indirect block holds 4096 / 4 = 1,024 pointers, so 1,024 more blocks, 4,096 KiB. In all 48 + 4,096 = 4,144 KiB, just over 4 MiB.
    - question:
        id: work-db-fsync
        type: choice
        system: s2
        prompt: |
          A small payments app writes each transaction to a file with write and then tells the customer "payment recorded". After a power cut, some recorded payments are missing. What should it do before telling the customer?
        options:
          - "Call fsync on the file and wait for it to return"
          - "Write the transaction twice"
          - "Close and reopen the file"
          - "Use a bigger buffer"
        answer: 0
        explanation: |
          write only puts the data in the page cache; it reaches the disk seconds later. fsync waits until it is on the disk, so a crash after the confirmation cannot lose it.
  connections:
    - text: |
        4,144 KiB. The 12 direct pointers reach 12 × 4 = 48 KiB, and the single-indirect block holds 4,096 / 4 = 1,024 more pointers, reaching 1,024 × 4 = 4,096 KiB more. Beyond that you need the double-indirect pointer, which adds 4 GiB, and a third read for every block it reaches.

        A file system is shared by every process, and inside the kernel many of its operations can be in progress at once: one thread waiting for a disk block while another looks up a name. [[h2.threads-in-the-kernel]] looks at threads, several flows of control sharing one address space, and at how the kernel creates, schedules and protects them.
