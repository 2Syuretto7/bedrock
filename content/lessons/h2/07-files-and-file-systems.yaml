            def save(name, data):
                # Return the operations that replace the file `name` with data, written
                # in chunks of 4 characters. A crash at any point must leave `name`
                # holding either its old contents or the new ones, never a mixture or a
                # stump.
                temp = name + ".tmp"
                ops = []
                for i in range(0, len(data), 4):
                    ops.append(("append", temp, data[i:i + 4]))
                ops.append(("rename", temp, name))
                return ops


            old = {"settings.json": '{"theme": "dark"}'}
            ops = save("settings.json", '{"theme": "light", "font": 14}')
            survivors = set()
            for crash in range(len(ops) + 1):
