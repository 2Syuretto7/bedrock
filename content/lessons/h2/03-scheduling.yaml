          _w = sjf([("compile", 0, 24), ("key", 0, 3), ("save", 0, 5)])
          assert _w == {"key": 0, "save": 3, "compile": 8}, "three jobs ready at once run shortest first, not " + repr(_w)
          _w = sjf([("zed", 0, 2), ("late", 0, 4), ("early", 1, 4)])
          assert _w == {"zed": 0, "late": 2, "early": 5}, "between two jobs of the same length, the one that arrived first runs first, whatever their names, not " + repr(_w)
          _w = sjf([("A", 0, 2), ("B", 10, 1)])
