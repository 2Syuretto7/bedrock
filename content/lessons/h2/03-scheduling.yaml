            from collections import deque


            def round_robin(jobs, quantum):
                pending = deque(jobs)
                queue = deque()
                arrived = {}
                left = {}
                done = {}
                time = 0
                while pending or queue:
                    while pending and pending[0][1] <= time:
                        name, arrival, length = pending.popleft()
                        arrived[name] = arrival
                        left[name] = length
                        queue.append(name)
                    if not queue:
                        time = pending[0][1]
                        continue
                    name = queue.popleft()
                    run = min(quantum, left[name])
                    time += run
                    left[name] -= run
                    while pending and pending[0][1] <= time:
                        new, arrival, length = pending.popleft()
                        arrived[new] = arrival
                        left[new] = length
                        queue.append(new)
                    if left[name] > 0:
                        queue.append(name)
                    else:
                        done[name] = time
                return done


            jobs = [("A", 0, 8), ("B", 1, 4), ("C", 2, 9), ("D", 3, 5)]
            turnaround = round_robin(jobs, 3)
            print(turnaround)
            print("average", sum(turnaround.values()) / len(jobs))
        explanation: |
          Admit arrivals, take the front job, run it for min(quantum, what it has left), admit anything that arrived meanwhile, and then requeue the job or record its finish. Requeuing the job before the new arrivals lets it jump ahead of them; adding a whole quantum when less was needed leaves the processor idle for nothing; and the finish time alone is not the turnaround, which starts at arrival.
    - question:
        id: write-fair-share
        type: code
        mode: write
        system: s2
        prompt: |
          Write `fair_share`, which runs the task with the least virtual runtime each tick, so that each task's share is proportional to its weight. The program should print `backup 10`, `compile 20` and `video 40`.
        starter: |
          import heapq


          def fair_share(weights, ticks):
              # weights is a dictionary from task name to weight: a task of twice the
              # weight deserves twice the processor. Each task has a virtual runtime,
              # starting at 0. Keep a heap of (virtual runtime, name). Each tick,
              # take the task with the smallest virtual runtime (on a tie, the name
              # that sorts first, which the heap does for you), run it for the tick,
              # add 1024 / its weight to its virtual runtime, and put it back.
              # Return a dictionary from each name to the number of ticks it ran.
              return {}


          share = fair_share({"video": 2048, "compile": 1024, "backup": 512}, 70)
          for name in sorted(share):
              print(name, share[name])
        solution: |
          import heapq


          def fair_share(weights, ticks):
              heap = [(0, name) for name in weights]
              heapq.heapify(heap)
              ran = {name: 0 for name in weights}
              for _ in range(ticks):
                  vruntime, name = heapq.heappop(heap)
                  ran[name] += 1
                  heapq.heappush(heap, (vruntime + 1024 / weights[name], name))
              return ran


          share = fair_share({"video": 2048, "compile": 1024, "backup": 512}, 70)
          for name in sorted(share):
              print(name, share[name])
        tests: |
          _s = fair_share({"a": 1024, "b": 1024}, 10)
          assert _s == {"a": 5, "b": 5}, "two tasks of equal weight should share ten ticks five and five, not " + repr(_s)
          _s = fair_share({"heavy": 3072, "light": 1024}, 40)
          assert _s == {"heavy": 30, "light": 10}, "a task of three times the weight should get three quarters of the ticks, 30 of 40, not " + repr(_s)
          _s = fair_share({"only": 100}, 7)
          assert _s == {"only": 7}, "a task alone gets every tick"
          _s = fair_share({"x": 1024, "y": 512}, 3)
          assert _s == {"x": 2, "y": 1}, "over 3 ticks, weights 1024 and 512 run x, y, x: 2 and 1, not " + repr(_s)
          assert output.splitlines() == ["backup 10", "compile 20", "video 40"], "The program should print backup 10, compile 20 and video 40"
        wrong:
          - |
            import heapq


            def fair_share(weights, ticks):
                heap = [(0, name) for name in weights]
                heapq.heapify(heap)
                ran = {name: 0 for name in weights}
                for _ in range(ticks):
                    vruntime, name = heapq.heappop(heap)
                    ran[name] += 1
                    heapq.heappush(heap, (vruntime + weights[name] / 1024, name))
                return ran


            share = fair_share({"video": 2048, "compile": 1024, "backup": 512}, 70)
            for name in sorted(share):
                print(name, share[name])
          - |
