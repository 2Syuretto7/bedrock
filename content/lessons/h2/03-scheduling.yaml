            import heapq


            def fair_share(weights, ticks):
                heap = [(0, name) for name in weights]
                heapq.heapify(heap)
                ran = {name: 0 for name in weights}
                for _ in range(ticks):
                    vruntime, name = heapq.heappop(heap)
                    ran[name] += 1
                    heapq.heappush(heap, (1024 / weights[name], name))
                return ran


            share = fair_share({"video": 2048, "compile": 1024, "backup": 512}, 70)
            for name in sorted(share):
                print(name, share[name])
        explanation: |
          Heapify (0, name) for every task, then each tick pop the smallest, count the tick, and push it back with 1024 / weight added. Adding weight / 1024 gives heavy tasks the smallest share instead of the largest; adding 1 ignores weights and shares equally; and pushing back only the increment, forgetting the time already used, lets the heaviest task run almost every tick.
    - question:
        id: fix-sjf-heap
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `sjf` should run the shortest ready job first. For four jobs it should print `{'A': 0, 'B': 7, 'D': 9, 'C': 15}` and `average 7.75`, but it prints C before D, with an average of 8.75. Find the fault and fix it.
        starter: |
          import heapq


          def sjf(jobs):
              # Shortest job first, without preemption. jobs is a list of
              # (name, arrival, length), sorted by arrival. Whenever the processor is
              # free, run the shortest job that has arrived, to the end; on a tie, the
              # one that arrived first. Return a dictionary from name to waiting time:
              # when it started minus when it arrived.
              pending = list(jobs)
              ready = []
              time = 0
              waits = {}
              while pending or ready:
