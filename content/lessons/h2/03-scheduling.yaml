          import heapq


          def sjf(jobs):
              # Shortest job first, without preemption. jobs is a list of
              # (name, arrival, length), sorted by arrival. Whenever the processor is
              # free, run the shortest job that has arrived, to the end; on a tie, the
              # one that arrived first. Return a dictionary from name to waiting time:
              # when it started minus when it arrived.
              pending = list(jobs)
              ready = []
              time = 0
              waits = {}
              while pending or ready:
                  while pending and pending[0][1] <= time:
                      name, arrival, length = pending.pop(0)
                      heapq.heappush(ready, (length, arrival, name))
                  if not ready:
                      time = pending[0][1]
                      continue
                  length, arrival, name = heapq.heappop(ready)
                  waits[name] = time - arrival
                  time += length
              return waits


          waits = sjf([("A", 0, 8), ("B", 1, 4), ("C", 2, 9), ("D", 3, 5)])
          print(waits)
          print("average", sum(waits.values()) / len(waits))
