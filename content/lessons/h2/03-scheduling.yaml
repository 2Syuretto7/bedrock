    - text: |
        3 ms. Running the two 3 ms jobs first gives waits of 0, 3 and 6, an average of 3, against 17 for compile-first. The exchange argument says this is the best possible: putting a long job before a short one always adds to the total. The same argument explains why schedulers favour short, interactive bursts, and why they need aging or fair shares so that the compile still finishes.

        So far a process has been something the scheduler picks; the next lessons look at what it runs in. Every process believes it has a memory of its own, starting at address 0, even though they all share one set of memory chips. [[h2.virtual-memory-and-page-tables]] shows how the hardware and kernel keep up that illusion.
