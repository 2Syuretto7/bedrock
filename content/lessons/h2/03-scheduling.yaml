          A cloud server runs web requests, each needing about 2 ms of processor time, next to nightly report jobs that need minutes. Users complain about slow pages while reports run. Which scheduler change helps most?
        options:
          - "Give the web server's tasks more weight, or a higher priority, so they run first whenever they are ready"
          - "Switch to first come, first served"
          - "Make the quantum several seconds long"
          - "Run the report jobs first so they finish sooner"
        answer: 0
        explanation: |
          The requests are short and I/O-bound, the reports long and CPU-bound. Favouring the requests costs the reports little, since each request takes only a sliver, and brings page times back down. FCFS and long quanta would make the requests wait behind the reports.
