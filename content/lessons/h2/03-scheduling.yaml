            import heapq


            def sjf(jobs):
                # Shortest job first, without preemption. jobs is a list of
                # (name, arrival, length), sorted by arrival. Whenever the processor is
                # free, run the shortest job that has arrived, to the end; on a tie, the
                # one that arrived first. Return a dictionary from name to waiting time:
                # when it started minus when it arrived.
                pending = list(jobs)
                ready = []
                time = 0
                waits = {}
                while pending or ready:
                    while pending and pending[0][1] <= time:
                        name, arrival, length = pending.pop(0)
                        heapq.heappush(ready, (length, name, arrival))
                    if not ready:
                        time = pending[0][1]
                        continue
                    length, name, arrival = heapq.heappop(ready)
                    waits[name] = time - arrival
                    time += length
                return waits


            waits = sjf([("A", 0, 8), ("B", 1, 4), ("C", 2, 9), ("D", 3, 5)])
            print(waits)
            print("average", sum(waits.values()) / len(waits))
        explanation: |
          A heap of tuples orders by the first item, then the second. With arrival first, the heap hands back the earliest arrival, which is first come, first served; the length must come first and the arrival second, both where the tuple is pushed and where it is unpacked. Changing only the push mixes the two up, negating the length runs the longest job first, and putting the name before the arrival breaks ties alphabetically instead of by arrival.
