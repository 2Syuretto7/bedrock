concept: f1.variables-and-expressions
minutes: 95
claim: You can read and write algebraic expressions, evaluate them by substitution, simplify them by collecting like terms and expanding brackets, and tell a statement true for one value from one true for all.
recalls: [h0.alignment-and-the-size-of-things, s0.reading-errors-and-debugging]
uses: [f0.estimation-and-back-of-the-envelope-reasoning, f0.the-four-operations-and-order-of-operations, f0.fractions-decimals-and-percentages, f0.negative-numbers, f0.powers-and-roots, s0.values-types-and-variables, s0.expressions, s0.booleans-and-conditionals, s0.loops, s0.functions]
leads: [f1.linear-equations]
bridges:
  h0.alignment-and-the-size-of-things: |
    The last lesson ended with `align_up(n, a)`, which is `(n + a - 1) // a * a`. You trusted it for a record of any size and any alignment, not only for the handful of numbers you tried, because you could see why it worked whatever `n` and `a` were. That was already algebra: letters standing for numbers not yet known, and an argument about the recipe itself. This lesson makes that kind of reasoning a tool you can use on purpose, with rules for reshaping a recipe without changing what it computes.
starter: |
  # Scratch space. Is 3(x + 4) always the same as 3x + 12?
  for x in range(-5, 6):
      assert 3 * (x + 4) == 3 * x + 12, "they differ"
  print("equal for every x tried")
parts:
  recall:
    - text: |
        Two threads meet in this lesson. From [[h0.alignment-and-the-size-of-things]] you bring a formula, `align_up`, that you trusted for numbers you had not yet tried. From [[s0.reading-errors-and-debugging]] you bring the assertion, a claim that Python checks for you. Both will be used on the rules of algebra. A quick pull on each.
  puzzle:
    - text: |
        At a family wedding, an uncle who fancies himself a magician gathers the cousins round. "Think of a number," he says. "Any number, and do not tell anyone."

        "Add 4 to it. Double the result. Subtract 6. Halve what you have. Finally, subtract the number you first thought of."

        "You are left with 1," he announces, and he is right, for every cousin at once.

        Try it yourself with a different number. A large one, a negative one, a fraction. You get 1 every time.

        You could confirm this for a hundred starting numbers and still not know **why** it happens, or whether the hundred-and-first would break it. You cannot try them all, since there is no end to the numbers.

        **How can you reason about a number without knowing which number it is?**
  intuition:
    - text: |
        You have already been doing it. In a Python function such as

        ```python
        def trick(n):
            return ((n + 4) * 2 - 6) / 2 - n
        ```

        the name `n` stands for whatever number is passed in. When you wrote the block, you did not know which number that would be, and you did not need to. You wrote down what to **do** with it.

        Algebra is the same move made on paper. Let a letter, say $n$, stand for the number thought of. Then follow the instructions, writing down what you have at each stage without working anything out to a single number, because you cannot.

        | Instruction | What you have |
        | --- | --- |
        | Think of a number | $n$ |
        | Add 4 | $n + 4$ |
        | Double | $2n + 8$ |
        | Subtract 6 | $2n + 2$ |
        | Halve | $n + 1$ |
        | Subtract the number you thought of | $1$ |

        The $n$ has gone. Whatever it was, it was added in and later taken out, and what remains is 1. This is not a check on one number or on a hundred. It is an argument about **all** numbers at once, made by letting a letter hold the place of any of them.

        Two of the steps need justifying. Why is the double of $n + 4$ equal to $2n + 8$? And why is $2n + 2$, halved, equal to $n + 1$? Both rest on a law of arithmetic you met as a picture of area. The rest of this lesson makes such steps exact.
  derivation:
    - text: |
        **The language.** A **variable** is a letter that stands for a number. An **expression** is a recipe built from numbers, variables and operations, such as $3x + 5$. To save ink, algebra has conventions of writing.

        | Algebra | Meaning | Python |
        | --- | --- | --- |
        | $3x$ | 3 times $x$ | `3 * x` |
        | $xy$ | $x$ times $y$ | `x * y` |
        | $x^2$ | $x$ times $x$ | `x ** 2` |
        | $\dfrac{x}{4}$ | $x$ divided by 4 | `x / 4` |
        | $3(x + 4)$ | 3 times the whole of $x + 4$ | `3 * (x + 4)` |

        The multiplication sign is left out, and a number is written before a letter. Python cannot read this shorthand: `3x` is a syntax error, and the `*` must always be written.

        The order of operations is the one you know. Powers first, then multiplication and division, then addition and subtraction, with brackets overriding. So $3x^2$ means $3 \times (x^2)$, and it is not $(3x)^2$.

        **Evaluating.** To **evaluate** an expression is to replace each variable by a given number and work out the result. This is **substitution**, and it is exactly what Python does in a call. For $x = 4$:

        $$3x + 5 = 3 \times 4 + 5 = 17, \qquad 3x^2 = 3 \times 16 = 48.$$

        When the number is negative, put it in brackets as you substitute, or signs will go astray. For $x = -2$:

        $$x^2 = (-2)^2 = 4, \qquad -x^2 = -\left((-2)^2\right) = -4, \qquad 5 - x = 5 - (-2) = 7.$$

        The middle one deserves a second look. The power is done before the minus sign, in algebra and in Python alike, so $-x^2$ is the opposite of the square and never the square of the opposite.

        **The anatomy of an expression.** The parts of an expression that are added together are its **terms**. In $3x + 5y - 2$ the terms are $3x$, $5y$ and $-2$. The sign belongs to the term that follows it. The number that multiplies the variable in a term is the **coefficient**: 3 is the coefficient of $x$. A term with no variable, like $-2$, is a **constant**. A bare $x$ has the coefficient 1, and $-x$ has the coefficient $-1$.

        **Collecting like terms.** Three apples and four apples are seven apples. In symbols, $3x + 4x = 7x$. This is not a new rule. It is the distributive law read backwards: $3x + 4x = (3 + 4)x$.

        Terms can be collected in this way only when they are **like terms**, with exactly the same letters to the same powers. $3x + 4y$ cannot be made simpler, because three apples and four pears are not seven of anything. Nor can $x^2 + x$, since a square and a length are different kinds of thing.

        $$5x + 3 - 2x + 4 = (5x - 2x) + (3 + 4) = 3x + 7.$$

        The terms were reordered first, which the commutative law of addition allows, provided each term carries its sign with it.
    - question:
        id: evaluate-negative
        type: numeric
        system: s2
        prompt: "Evaluate $2x^2 - 3x + 1$ for $x = -2$. Put the value in brackets as you substitute."
        answer: "15"
        explanation: "$2 \\times (-2)^2 - 3 \\times (-2) + 1 = 2 \\times 4 + 6 + 1 = 15$. The square is positive, and subtracting a negative adds."
    - text: |
        **Expanding brackets.** Here is the law that the puzzle leaned on. Use the grid below with 3 rows, and split the columns into two blocks.
    - figure: area-grid
      props: { rows: 3, columns: 9, split: 5 }
    - text: |
        Three rows of 9 is three rows of 5 together with three rows of 4. Move the split and the two blocks change, but together they always make the whole rectangle. Nothing in the picture depends on the first block being 5 wide. Call its width $x$, and the picture says

        $$3(x + 4) = 3x + 12.$$

        That is the **distributive law**: a number multiplying a bracket multiplies **every** term inside it.

        $$a(b + c) = ab + ac.$$

        Replacing a bracketed product by a sum in this way is called **expanding**. The commonest slip is to multiply only the first term and write $3(x + 4) = 3x + 4$. The picture shows why that is wrong: it leaves out two of the three rows of the second block.

        Signs need care. A negative multiplier changes the sign of every term in the bracket:

        $$-2(x - 5) = -2x + 10.$$

        And a bare minus sign in front of a bracket is a multiplication by $-1$: $-(x - 5) = -x + 5$.

        Now both steps of the puzzle are justified. Doubling $n + 4$ gives $2(n + 4) = 2n + 8$. And halving $2n + 2$ gives $\frac{1}{2}(2n + 2) = n + 1$, since halving is multiplying by a half.

        **Factorising.** Read from right to left, the same law pulls a common factor **out** of a sum: $6x + 9 = 3(2x + 3)$. This is **factorising**. You can always check a factorisation by expanding it again.

        **Two kinds of statement.** Compare these.

        $$3(x + 4) = 3x + 12 \qquad\qquad 3x + 5 = 17$$

        The first is true for **every** value of $x$. The two sides are the same recipe written in two ways. Such a statement is called an **identity**, and the two expressions are called **equivalent**. The second is true only when $x = 4$. It is an **equation**, a question about which value makes it true, and the next lesson is about answering it.

        **Testing an identity with a program.** A loop can try an identity on many values in an instant.

        ```python
        for x in range(-100, 101):
            assert 3 * (x + 4) == 3 * x + 12, "they differ"
        print("equal for every x tried")
        ```

        Be exact about what this shows. If the assertion ever **fails**, the two expressions are certainly not equivalent, because you have found a value on which they differ. One such value, a **counterexample**, settles the matter. But if every assertion passes, you have only learnt that they agree on the values tried. The claim "for every number" covers infinitely many, and no loop reaches them all. That needs an argument from the laws of arithmetic, like the one in the area picture.

        So the program is a powerful **detector of mistakes** and the laws are the **source of certainty**. A good mathematician uses both: test first, because it is cheap and catches slips, and then prove.
    - question:
        id: fix-expansion
        type: code
        mode: find-bug
        system: s2
        prompt: |
          The function `expanded(x)` is meant to be equivalent to `original(x)`, which is $2(3x - 5) - (x - 4)$, but with the brackets expanded and like terms collected. The loop finds that they differ. Expand by hand, taking care with both minus signs, and correct `expanded`. Do not change `original`, and keep `expanded` free of brackets.
        starter: |
          def original(x):
              return 2 * (3 * x - 5) - (x - 4)

          def expanded(x):
              return 5 * x - 14

          for x in range(-10, 11):
              assert original(x) == expanded(x), "they differ"
          print("equal for every x tried")
        solution: |
          def original(x):
              return 2 * (3 * x - 5) - (x - 4)

          def expanded(x):
              return 5 * x - 6

          for x in range(-10, 11):
              assert original(x) == expanded(x), "they differ"
          print("equal for every x tried")
        tests: |
          assert original(3) == 9 and original(0) == -6, "Leave the function original as it was"
          assert "(" not in source.split("def expanded(x):")[1].split("for x")[0].replace("expanded(x)", ""), "Write expanded without brackets: expand and collect by hand"
          for _x in [-7, -1, 0, 1, 2, 10, 2.5]:
              assert expanded(_x) == original(_x), "The two expressions still differ for some x. What does the minus sign in front of the second bracket do to the -4?"
        wrong:
          - "def original(x):\n    return 2 * (3 * x - 5) - (x - 4)\n\ndef expanded(x):\n    return 7 * x - 6\n\nprint(\"equal for every x tried\")\n"
          - "def original(x):\n    return 2 * (3 * x - 5) - (x - 4)\n\ndef expanded(x):\n    return 5 * x - 1\n\nprint(\"equal for every x tried\")\n"
          - "def original(x):\n    return 2 * (3 * x - 5) - (x - 4)\n\ndef expanded(x):\n    return 2 * (3 * x - 5) - (x - 4)\n\nprint(\"equal for every x tried\")\n"
        explanation: "$2(3x - 5) = 6x - 10$ and $-(x - 4) = -x + 4$. Collecting, $6x - x = 5x$ and $-10 + 4 = -6$. The slip was to write $-(x - 4)$ as $-x - 4$, forgetting that the minus sign multiplies both terms."
  formal:
    - text: |
        A **variable** is a symbol standing for a number. An **expression** is built from numbers and variables by addition, subtraction, multiplication, division and powers. **Evaluating** an expression at given values means substituting those values for the variables and computing the result.

        A **term** is a product of a number, its **coefficient**, and variables raised to powers. Terms are **like** when their variable parts are identical. An expression is a sum of terms.

        For all numbers $a$, $b$ and $c$:

        | Law | Statement |
        | --- | --- |
        | Commutative | $a + b = b + a$ and $ab = ba$ |
        | Associative | $(a + b) + c = a + (b + c)$ and $(ab)c = a(bc)$ |
        | Distributive | $a(b + c) = ab + ac$ |
        | Identities | $a + 0 = a$ and $1 \times a = a$ |
        | Opposites | $a + (-a) = 0$, and $-a = (-1) \times a$ |

        From these follow the working rules: like terms are collected by adding their coefficients, $ax + bx = (a + b)x$; a factor multiplying a bracket multiplies each term in it; $-(a + b) = -a - b$ and $-(a - b) = -a + b$.

        Two expressions are **equivalent** if they have the same value for every value of their variables. A statement that two equivalent expressions are equal is an **identity**. To show that two expressions are **not** equivalent, one value on which they differ, a **counterexample**, is enough. To show that they **are** equivalent, agreement on finitely many values is not enough: one must transform one into the other using the laws.
  drill:
    - text: Seconds each. Say the terms and their signs before you collect.
    - question:
        id: collect-simple
        type: choice
        system: s1
        prompt: "Simplify $7x - 2x + x$."
        options: ["$5x$", "$6x$", "$4x$", "$6x^3$"]
        answer: 1
        explanation: "The coefficients are 7, $-2$ and 1, and $7 - 2 + 1 = 6$."
    - question:
        id: evaluate-simple
        type: numeric
        system: s1
        prompt: "Evaluate $4x - 7$ for $x = 3$."
        answer: "5"
        explanation: "$4 \\times 3 - 7 = 12 - 7$."
    - question:
        id: evaluate-square
        type: numeric
        system: s1
        prompt: "Evaluate $-x^2$ for $x = 3$."
        answer: "-9"
        explanation: "The square is done first, giving 9, and then the minus sign is applied."
    - question:
        id: expand-simple
        type: choice
        system: s1
        prompt: "Expand $5(x - 2)$."
        options: ["$5x - 2$", "$5x - 10$", "$5x + 10$", "$x - 10$"]
        answer: 1
        explanation: "The 5 multiplies both terms: $5 \\times x$ and $5 \\times (-2)$."
    - question:
        id: expand-negative
        type: choice
        system: s1
        prompt: "Expand $-(3 - x)$."
        options: ["$-3 - x$", "$3 - x$", "$-3 + x$", "$3 + x$"]
        answer: 2
        explanation: "Multiplying by $-1$ changes the sign of each term: $-3$ and $+x$."
    - question:
        id: like-terms
        type: choice
        system: s1
        prompt: "Which of these can be collected into a single term?"
        options: ["$3x + 4y$", "$x^2 + x$", "$2xy + 5xy$", "$x + 1$"]
        answer: 2
        explanation: "Only $2xy$ and $5xy$ have the same variable part. They make $7xy$."
    - question:
        id: factor-simple
        type: choice
        system: s1
        prompt: "Factorise $8x + 12$ as far as possible."
        options: ["$2(4x + 6)$", "$4(2x + 3)$", "$8(x + 4)$", "$4(2x + 12)$"]
        answer: 1
        explanation: "The largest number dividing both 8 and 12 is 4. Expanding $4(2x + 3)$ gives $8x + 12$ back."
    - question:
        id: predict-python-expression
        type: predict
        system: s1
        prompt: "This is $3x^2$ for $x = -2$, written in Python. What does it show?"
        code: |
          x = -2
          print(3 * x ** 2)
        output: "12"
        explanation: The power is done first, giving 4, and then the multiplication by 3.
    - question:
        id: identity-or-equation
        type: choice
        system: s1
        prompt: "Which of these is true for every value of $x$?"
        options: ["$2x = 10$", "$x + 3 = 3 + x$", "$x^2 = 9$", "$x + 1 = x$"]
        answer: 1
        explanation: "$x + 3 = 3 + x$ is the commutative law, an identity. The first is true only for 5, the third only for 3 and $-3$, and the last for no number at all."
  work:
    - text: Slower now. Do the algebra on paper first. Then let the program check it on many values.
    - question:
        id: simplify-long
        type: choice
        system: s2
        prompt: "Simplify $3(2x + 1) - 2(x - 4)$."
        options: ["$4x - 5$", "$4x + 11$", "$4x - 7$", "$8x + 11$"]
        answer: 1
        explanation: "$3(2x + 1) = 6x + 3$ and $-2(x - 4) = -2x + 8$. Collecting gives $4x + 11$."
    - question:
        id: write-trick
        type: code
        mode: write
        system: s2
        prompt: |
          Here is another number trick: think of a number, multiply it by 3, add 12, divide by 3, and subtract the number you first thought of. Write a function `trick(n)` that carries out these steps exactly as stated and returns the result. Then, on paper, simplify the expression to find what the trick always gives, and bind `always` to that number. Finally add a loop that asserts `trick(n) == always` for every whole number `n` from -20 to 20.
        starter: |
          def trick(n):
              # Replace the next line with your own.
              return 0

          always = 0
        solution: |
          def trick(n):
              return (n * 3 + 12) / 3 - n

          always = 4
          for n in range(-20, 21):
              assert trick(n) == always, "the trick failed"
        tests: |
          assert trick(0) == 4, "Starting from 0: times 3 is 0, add 12 is 12, divide by 3 is 4, subtract 0 is 4"
          assert trick(5) == 4, "Starting from 5: 15, 27, 9, and then 9 - 5"
          assert trick(-3) == 4, "It should give the same result for a negative number"
          assert trick(100) == 4, "It should give the same result for any number"
          assert always == 4, "Simplify (3n + 12) / 3 - n on paper. Dividing by 3 divides every term."
          assert "assert" in source and "for" in source, "Add a loop that asserts trick(n) == always for many values of n"
        wrong:
          - "def trick(n):\n    return n * 3 + 12 / 3 - n\n\nalways = 4\nfor n in range(-20, 21):\n    pass\n"
          - "def trick(n):\n    return (n * 3 + 12) / 3 - n\n\nalways = 12\n"
          - "def trick(n):\n    return 4\n\nalways = 4\n"
        explanation: "$(3n + 12) \\div 3 = n + 4$, since dividing by 3 divides both terms, and $n + 4 - n = 4$. In Python the brackets are essential: without them only the 12 is divided by 3."
    - question:
        id: write-counterexample
        type: code
        mode: write
        system: s2
        prompt: |
          A tempting "rule" says that $(a + b)^2$ is the same as $a^2 + b^2$. It is false, and one counterexample is enough to show it. Write a function `counterexample()` that searches the whole numbers `a` and `b` from 1 to 5 with two loops, one inside the other, and returns the first pair `(a, b)` for which `(a + b) ** 2` differs from `a ** 2 + b ** 2`. Then bind `gap` to the amount by which $(a + b)^2$ exceeds $a^2 + b^2$ when $a = 3$ and $b = 4$.
        starter: |
          def counterexample():
              # Replace the next line with your own.
              return (0, 0)

          gap = 0
        solution: |
          def counterexample():
              for a in range(1, 6):
                  for b in range(1, 6):
                      if (a + b) ** 2 != a ** 2 + b ** 2:
                          return (a, b)

          gap = (3 + 4) ** 2 - (3 ** 2 + 4 ** 2)
        tests: |
          _p = counterexample()
          assert _p is not None, "The function returns None. It should return the pair as soon as it is found."
          assert len(_p) == 2, "Return a pair (a, b)"
          assert (_p[0] + _p[1]) ** 2 != _p[0] ** 2 + _p[1] ** 2, "The pair returned is not a counterexample: the two sides are equal for it"
          assert _p == (1, 1), "Return the first pair the loops meet, with a and b both starting from 1"
          assert gap == 24, "For a = 3 and b = 4, compare 7 squared with 9 + 16"
        wrong:
          - "def counterexample():\n    for a in range(1, 6):\n        for b in range(1, 6):\n            if (a + b) ** 2 == a ** 2 + b ** 2:\n                return (a, b)\n\ngap = 24\n"
          - "def counterexample():\n    return (1, 1)\n\ngap = 0\n"
          - "def counterexample():\n    for a in range(1, 6):\n        for b in range(1, 6):\n            if (a + b) ** 2 != a ** 2 + b ** 2:\n                return (a, b)\n\ngap = 12\n"
        explanation: "Already for $a = b = 1$ the left side is 4 and the right side is 2. For 3 and 4 the gap is $49 - 25 = 24$, which is $2 \\times 3 \\times 4$. That is no accident: a square of side $a + b$ contains the two smaller squares **and** two rectangles of area $ab$. You can prove $(a + b)^2 = a^2 + 2ab + b^2$ now, by expanding $(a + b)(a + b)$ with the distributive law twice."
    - question:
        id: fix-translation
        type: code
        mode: find-bug
        system: s2
        prompt: |
          The function should compute $\dfrac{x + 6}{2} - x^2$. For $x = 4$ that is $5 - 16 = -11$, but the program shows a different number. The slips are in the translation from algebra to Python, where what a fraction bar and a power make obvious on paper must be spelt out. Fix the function.
        starter: |
          def f(x):
              return x + 6 / 2 - x * 2

          print(f(4))
        solution: |
          def f(x):
              return (x + 6) / 2 - x ** 2

          print(f(4))
        tests: |
          assert f(4) == -11, "For x = 4 the value should be 5 - 16 = -11"
          assert f(0) == 3, "For x = 0 the value should be 3. What does the fraction bar group together?"
          assert f(2) == 0, "For x = 2 the value should be 4 - 4 = 0. A square is not a doubling, though for one value of x the two agree."
          assert f(-2) == -2, "For x = -2 the value should be 2 - 4 = -2"
          assert f(10) == -92, "It should work for any x"
        wrong:
          - "def f(x):\n    return (x + 6) / 2 - x * 2\n\nprint(f(4))\n"
          - "def f(x):\n    return x + 6 / 2 - x ** 2\n\nprint(f(4))\n"
          - "def f(x):\n    return (x + 6) / (2 - x ** 2)\n\nprint(f(4))\n"
        explanation: A fraction bar groups everything above it, so the numerator needs brackets in Python. And $x^2$ is `x ** 2`. Writing `x * 2` doubles instead of squaring, a slip that hides when $x = 2$, where both give 4.
    - question:
        id: expression-for-perimeter
        type: choice
        system: s2
        prompt: |
          A rectangle is 3 units longer than it is wide. Its width is $w$. Which expression gives its perimeter, simplified?
        options: ["$2w + 3$", "$4w + 3$", "$4w + 6$", "$w^2 + 3w$"]
        answer: 2
        explanation: "The length is $w + 3$. The perimeter is twice the width plus twice the length: $2w + 2(w + 3) = 2w + 2w + 6 = 4w + 6$. The last option is the area."
    - question:
        id: evaluate-fraction
        type: numeric
        system: s2
        prompt: "Evaluate $\\dfrac{3a - b}{a + b}$ for $a = 2$ and $b = -4$. Give an exact answer."
        answer: "-5"
        explanation: "The numerator is $6 - (-4) = 10$ and the denominator is $2 + (-4) = -2$. Then $10 \\div (-2) = -5$."
    - question:
        id: testing-versus-proof
        type: choice
        system: s2
        prompt: |
          A loop checks that two expressions give the same value for every whole number $x$ from $-1000$ to $1000$, and every assertion passes. What has been established?
        options:
          - "The two expressions are equivalent."
          - "The two expressions agree on 2001 values. They are probably equivalent, but only an argument from the laws of arithmetic can establish it for all numbers."
          - "Nothing at all, since testing is worthless."
          - "The two expressions are equivalent for whole numbers, though perhaps not for fractions."
        answer: 1
        explanation: Passing tests are evidence, and strong evidence against a careless slip, but they cover finitely many values. Even the whole numbers beyond 1000 were not tried. A failed test, in contrast, would have been conclusive.
  connections:
    - text: |
        A letter can now hold the place of a number you do not know, and the laws of arithmetic let you reshape what is written without changing what it means. That is the whole of algebra in one sentence. Everything after is technique.

        Notice how much was already familiar. A variable is a name, an expression is what stands on the right of an assignment, and evaluating by substitution is what happens in a function call. From here on, the two subjects will check each other: algebra will tell you what a program must output before you run it, and a program will catch your slips of algebra in a second.

        One difference must be kept in mind. In Python, `x = x + 1` is an instruction: work out the right-hand side and rebind the name. In algebra, $x = x + 1$ is a claim that two things are equal, and it is a false one for every number. The sign is shared and the meaning is not.

        You have met this already without the name. `align_up(n, a)` in [[h0.alignment-and-the-size-of-things]] was an expression in two variables, and the claim that it never moves a value that is already aligned was a statement about every `n` at once. The formulas ahead in this course, for the cost of an algorithm, the throughput of a server or the prediction of a model, are expressions in many variables. Simplifying them before computing them, by exactly the collecting and factorising you did today, is often the difference between a program that takes a day and one that takes an hour.

        Today you met two kinds of statement and studied only one. An identity holds for every value. An equation such as $3x + 5 = 17$ holds for some values and not others, and it poses a question: **which?** Answering it by reasoning, and not by trying numbers, is the next lesson, [[f1.linear-equations]].
