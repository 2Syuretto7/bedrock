concept: f1.composition-and-inverses
minutes: 100
claim: You can compose functions in the right order, see a complicated function as a chain of simple ones, decide whether a function can be undone, find its inverse by solving for the input, and write both operations as Python functions that take and return functions.
recalls: [f1.functions-as-machines]
uses: [f0.fractions-decimals-and-percentages, f0.powers-and-roots, f1.variables-and-expressions, f1.linear-equations, f1.inequalities, f1.coordinates-lines-and-slope, s0.booleans-and-conditionals, s0.loops, s0.functions, s0.lists-and-tuples, s0.dictionaries-and-sets, s0.reading-errors-and-debugging]
leads: [f1.exponents-and-exponential-growth, f1.logarithms, f2.relations-and-functions-between-sets]
starter: |
  # Scratch space. Two small functions, joined in both orders.
  def double(x):
      return 2 * x

  def add_three(x):
      return x + 3

  print(add_three(double(5)))
  print(double(add_three(5)))
parts:
  recall:
    - text: |
        In [[f1.functions-as-machines]] a function became a precise thing: a rule that gives each member of its domain exactly one output. One machine at a time. Real work is done by joining machines, the output of one becoming the input of the next, and sometimes by running a machine in reverse. Three quick pulls first.
  puzzle:
    - text: |
        A shop is running two offers on a ₹2,000 pair of shoes: **₹400 off**, and **25% off**. The assistant says you may have both. Does it matter in which order they are applied?

        Take the flat discount first, then the percentage:

        $$2000 \;\longrightarrow\; 1600 \;\longrightarrow\; 1200.$$

        Take the percentage first, then the flat discount:

        $$2000 \;\longrightarrow\; 1500 \;\longrightarrow\; 1100.$$

        A hundred rupees of difference, from the same two offers. Now try two percentage offers, 25% off and 10% off, in each order: $2000 \to 1500 \to 1350$, and $2000 \to 1800 \to 1350$. No difference at all.

        Why does the order matter for one pair of offers and not for the other?

        And a second question. At the till, the price after both offers is ₹1,200. The assistant has forgotten the original price. Can it be recovered from the final one? For these offers, yes: you could work it out. But suppose the till also **rounded the price to the nearest hundred**. A final price of ₹1,200 might have come from ₹1,160, or ₹1,249, or anything between. Something has been lost, and no amount of cleverness will bring it back.

        **When does the order of two operations matter? And when can an operation be undone?** Both questions are about functions, and both have exact answers.
  intuition:
    - text: |
        Each offer is a machine. "₹400 off" is the function $s(x) = x - 400$. "25% off" is the function $p(x) = 0.75x$. Having both offers means standing the machines in a row, so that what drops out of the first falls into the slot of the second. The row is itself a machine: a price goes in at one end and a price comes out at the other. That new machine is the **composition** of the two.

        There are two ways to stand them in a row, and they are different machines:

        $$p(s(x)) = 0.75(x - 400) = 0.75x - 300, \qquad s(p(x)) = 0.75x - 400.$$

        The algebra shows where the hundred rupees went. When the flat discount comes first, the percentage shrinks **it** as well: 25% off a ₹400 saving leaves a ₹300 saving. Two percentage discounts, on the other hand, are two multiplications, and multiplication does not care about order.

        Now reverse a machine. To **undo** a function is to build a machine that takes each output back to the input it came from. For $s$, add 400. For $p$, divide by 0.75. For a row of machines, think of how you dress and undress. In the morning you put on socks, then shoes. At night you do not take off your socks first. You undo the **last** thing first: shoes off, then socks off. To undo "subtract 400, then multiply by 0.75", divide by 0.75 and then add 400:

        $$1200 \;\longrightarrow\; 1600 \;\longrightarrow\; 2000.$$

        And rounding? Rounding sends many different prices to the same output. From the output alone there is no telling which input it was. **A function can be undone exactly when it never sends two inputs to the same output**, so that every output remembers where it came from.

        The figure shows a straight-line function $f$, in blue, together with the function that undoes it, in grey. Move the point. Wherever $f$ sends $x$ to $y$, the undoing function sends $y$ to $x$, so the two graphs are mirror images in the dashed line $y = x$. Then set the slope to 0 and read what happens.
    - figure: inverse-line
      props: { slope: 2, intercept: -2, x: 3 }
  derivation:
    - text: |
        **Composition.** Let $f : A \to B$ and $g : B \to C$. The **composition** of $g$ with $f$ is the function $g \circ f : A \to C$ defined by

        $$(g \circ f)(x) = g(f(x)).$$

        Read $g \circ f$ as "$g$ after $f$". The definition makes sense because $f(x)$ lies in $B$, which is the domain of $g$: the chute of the first machine fits the slot of the second. More generally all that is needed is that every output of $f$ is an allowed input of $g$, that is, that the range of $f$ is a subset of the domain of $g$.

        **The order is right to left.** In $g \circ f$ the function written on the **right** acts **first**. This looks backwards until you see that it copies the way $g(f(x))$ is written and evaluated: the innermost function is nearest the $x$ and gets to it first. Python agrees: in `g(f(x))`, `f` runs first.

        Take $f(x) = x + 3$ and $g(x) = x^2$. Then

        $$(g \circ f)(x) = g(x + 3) = (x + 3)^2, \qquad (f \circ g)(x) = f(x^2) = x^2 + 3.$$

        At $x = 1$ these give 16 and 4. So in general

        $$g \circ f \ne f \circ g.$$

        **Composition is not commutative.** This is the first operation you have met for which order matters and cannot be argued away, and it is the answer to the first question of the puzzle. Some pairs of functions do **commute**, as the two percentage discounts did, but that is a special property of the pair, to be checked each time.

        **Composition is associative.** With three machines in a row, it does not matter which two you bolt together first:

        $$h \circ (g \circ f) = (h \circ g) \circ f,$$

        because both send $x$ to $h(g(f(x)))$. So a chain $h \circ g \circ f$ needs no brackets. Only the order along the row matters.

        **The identity.** On any set $A$ there is a function that does nothing, the **identity function** $\operatorname{id}_A : A \to A$ with $\operatorname{id}_A(x) = x$. Composing with it changes nothing: $f \circ \operatorname{id}_A = f$ and $\operatorname{id}_B \circ f = f$. It plays the part for composition that 1 plays for multiplication, and it will be needed in a moment.

        **Composing two lines.** Let $f(x) = ax + b$ and $g(x) = cx + d$. Then

        $$(g \circ f)(x) = c(ax + b) + d = (ca)x + (cb + d).$$

        The composition of two lines is a line, and **its slope is the product of the two slopes**. If the first machine triples every change in its input, and the second doubles every change in its input, the row multiplies every change by six. Remember this small fact. When you learn how a neural network is trained, the central rule, the chain rule, will say exactly this about any chain of smooth functions, because every smooth function looks like a line when you look closely enough.

        **Reading a function as a chain.** Composition is used in both directions. Just as often as building, you will need to take a function apart. Consider

        $$h(x) = \sqrt{x^2 + 1}.$$

        To evaluate it by hand you square, then add 1, then take the root. So $h = r \circ a \circ s$ with $s(x) = x^2$, $a(u) = u + 1$ and $r(v) = \sqrt{v}$. The question to ask is always: **what is the last thing I would do?** That is the outermost function. Peel it off and ask again.
    - question:
        id: compose-order
        type: choice
        system: s2
        prompt: |
          Let $f(x) = 2x - 1$ and $g(x) = x^2$. Which is $(f \circ g)(x)$?
        options: ["$(2x - 1)^2$", "$2x^2 - 1$", "$2x^3 - x^2$", "$4x^2 - 1$"]
        answer: 1
        explanation: |
          $f \circ g$ is $f$ after $g$: square first, then double and subtract 1. $(f \circ g)(x) = f(x^2) = 2x^2 - 1$. The first option is $g \circ f$, and the third is the product of the two functions, which is a different operation altogether.
    - text: |
        **Inverses.** Let $f : A \to B$. A function $g : B \to A$ is an **inverse** of $f$ if it undoes $f$ and $f$ undoes it:

        $$g(f(x)) = x \text{ for every } x \in A, \qquad \text{and} \qquad f(g(y)) = y \text{ for every } y \in B.$$

        In the language just built, $g \circ f = \operatorname{id}_A$ and $f \circ g = \operatorname{id}_B$. If $f$ has an inverse it has only one, and it is written $f^{-1}$, read "$f$ inverse".

        A warning about the notation. The $-1$ is **not an exponent**. $f^{-1}(x)$ does not mean $\dfrac{1}{f(x)}$. For $f(x) = x + 400$, the inverse is $f^{-1}(x) = x - 400$, while $\dfrac{1}{f(x)} = \dfrac{1}{x + 400}$. The notation is borrowed from $a^{-1}$, the number that undoes multiplication by $a$, because $f^{-1}$ is the function that undoes composition with $f$.

        **Finding an inverse: solve for the input.** $f^{-1}$ answers the question "which $x$ gave this $y$?". So write $y = f(x)$ and solve for $x$. For $f(x) = 3x - 4$:

        $$y = 3x - 4 \quad\Longrightarrow\quad y + 4 = 3x \quad\Longrightarrow\quad x = \frac{y + 4}{3}.$$

        So $f^{-1}(y) = \dfrac{y + 4}{3}$. The name of the placeholder does not matter, so this is the same as saying $f^{-1}(x) = \dfrac{x + 4}{3}$. Check both conditions, always:

        $$f^{-1}(f(x)) = \frac{(3x - 4) + 4}{3} = x, \qquad f(f^{-1}(x)) = 3 \cdot \frac{x + 4}{3} - 4 = x.$$

        Look at what the solving did. $f$ multiplies by 3 and then subtracts 4. The inverse adds 4 and then divides by 3: the opposite operations in the opposite order. You have been computing inverse functions since your first linear equation. "Solving for $x$" is applying $f^{-1}$ to both sides.

        **Socks and shoes.** That observation is a general law. If $f$ and $g$ both have inverses, so does $g \circ f$, and

        $$(g \circ f)^{-1} = f^{-1} \circ g^{-1}.$$

        The order reverses. To check it, compose and watch the middle collapse: $f^{-1}(g^{-1}(g(f(x)))) = f^{-1}(f(x)) = x$.

        **Inverses you already know.** Many of the operations you learnt in pairs are inverse functions:

        | Function | Inverse | On which sets |
        | --- | --- | --- |
        | $x \mapsto x + c$ | $x \mapsto x - c$ | $\mathbb{R} \to \mathbb{R}$ |
        | $x \mapsto cx$, with $c \ne 0$ | $x \mapsto x / c$ | $\mathbb{R} \to \mathbb{R}$ |
        | $x \mapsto x^3$ | $x \mapsto \sqrt[3]{x}$ | $\mathbb{R} \to \mathbb{R}$ |

        Two lessons from now, [[f1.logarithms]] will be defined in exactly this way, as the inverse of raising a fixed number to a power, and you will check it with the same two conditions.

        **When there is no inverse.** Try to invert $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^2$. Solving $y = x^2$ for $x$ gives $x = \sqrt{y}$ **or** $x = -\sqrt{y}$. Two answers. The output 9 came from 3 or from $-3$, and it does not remember which. Squaring is like rounding in the puzzle: it merges inputs, and what is merged cannot be separated. There is a second obstacle as well: the output $-4$ came from no input at all, so an inverse would have nothing to send it to.

        So an inverse exists exactly when **every member of the codomain is the output of one input and one only**. [[f2.relations-and-functions-between-sets]] will give each half of that condition a name and study it carefully.

        **Repair by restriction.** A function that merges inputs can often be made invertible by shrinking its domain until it no longer does. Squaring, restricted to the non-negative numbers,

        $$f(x) = x^2 \quad \text{for } x \ge 0, \text{ with outputs } y \ge 0,$$

        sends different inputs to different outputs and reaches every non-negative number. It has an inverse, and that inverse is the square root. This is the real reason $\sqrt{9}$ is 3 and not $\pm 3$: $\sqrt{\phantom{x}}$ is the inverse of squaring **on the non-negative numbers**. The price of the restriction is paid when you undo a square on all of $\mathbb{R}$: $\sqrt{x^2}$ is not $x$ but $|x|$.

        **The graph of an inverse.** If the point $(a, b)$ is on the graph of $f$, then $f(a) = b$, so $f^{-1}(b) = a$, and the point $(b, a)$ is on the graph of $f^{-1}$. Exchanging the two coordinates of every point reflects the plane in the line $y = x$. So the graph of $f^{-1}$ is the mirror image of the graph of $f$ in that line, as the figure showed. A line of slope $m$ is mirrored to a line of slope $\dfrac{1}{m}$. A horizontal line, slope 0, would be mirrored to a vertical one, which is not the graph of a function. That is the picture of a constant function having no inverse.

        **In Python.** A function is a value, so a function can take functions and **return a new function**. One way is to define the new function inside and return it:

        ```python
        def compose(g, f):
            def h(x):
                return g(f(x))
            return h

        def double(x):
            return 2 * x

        def add_three(x):
            return x + 3

        k = compose(add_three, double)
        print(k(5))
        ```

        This shows `13`. The inner `h` remembers the `g` and `f` it was made with. For a function small enough to be a single expression, Python has a shorter spelling that needs no name, the `lambda`:

        ```python
        square = lambda x: x * x
        print(square(7))
        ```

        `lambda x: x * x` is the Python for $x \mapsto x^2$: the parameter before the colon, and after it the one expression whose value is returned. With it, `compose` is one line: `return lambda x: g(f(x))`.

        For a function stored as a table, the inverse is found by turning every pair round. A dictionary with the pairs `key: value` becomes one with the pairs `value: key`, provided no value occurs twice.
    - question:
        id: fix-inverse-order
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `to_fahrenheit(c)` converts a temperature from Celsius to Fahrenheit: multiply by 1.8, then add 32. `to_celsius(f)` should be its inverse, but `to_celsius(to_fahrenheit(100))` gives about `82.2` when it should give back `100`. Think of socks and shoes, and fix `to_celsius`.
        starter: |
          def to_fahrenheit(c):
              return c * 1.8 + 32

          def to_celsius(f):
              return f / 1.8 - 32

          print(to_fahrenheit(100))
          print(to_celsius(to_fahrenheit(100)))
        solution: |
          def to_fahrenheit(c):
              return c * 1.8 + 32

          def to_celsius(f):
              return (f - 32) / 1.8

          print(to_fahrenheit(100))
          print(to_celsius(to_fahrenheit(100)))
        tests: |
          assert to_fahrenheit(100) == 212, "Leave to_fahrenheit as it was: 100 Celsius is 212 Fahrenheit"
          assert abs(to_celsius(212) - 100) < 1e-9, "212 Fahrenheit is 100 Celsius. Undo the last operation first."
          assert abs(to_celsius(32)) < 1e-9, "32 Fahrenheit is 0 Celsius"
          for _c in [-40, 0, 37, 250.5]:
              assert abs(to_celsius(to_fahrenheit(_c)) - _c) < 1e-9, "to_celsius should undo to_fahrenheit for every input"
          for _f in [-40, 50, 451]:
              assert abs(to_fahrenheit(to_celsius(_f)) - _f) < 1e-9, "to_fahrenheit should undo to_celsius for every input"
        wrong:
          - "def to_fahrenheit(c):\n    return c * 1.8 + 32\n\ndef to_celsius(f):\n    return f - 32 / 1.8\n\nprint(to_fahrenheit(100))\nprint(to_celsius(to_fahrenheit(100)))\n"
          - "def to_fahrenheit(c):\n    return c * 1.8 + 32\n\ndef to_celsius(f):\n    return (f + 32) / 1.8\n\nprint(to_fahrenheit(100))\nprint(to_celsius(to_fahrenheit(100)))\n"
          - "def to_fahrenheit(c):\n    return c * 1.8 + 32\n\ndef to_celsius(f):\n    return (f - 32) * 1.8\n\nprint(to_fahrenheit(100))\nprint(to_celsius(to_fahrenheit(100)))\n"
        explanation: The forward function multiplies and then adds. The inverse must undo the adding first and the multiplying second, so it subtracts 32 and then divides by 1.8, and the brackets are needed to make the subtraction happen first. The starter undid the two steps in the same order as they were done.
  formal:
    - text: |
        **Composition.** For $f : A \to B$ and $g : B \to C$, the composition $g \circ f : A \to C$ is defined by $(g \circ f)(x) = g(f(x))$.

        **Identity.** $\operatorname{id}_A : A \to A$ is defined by $\operatorname{id}_A(x) = x$.

        | Law | Statement |
        | --- | --- |
        | Associativity | $h \circ (g \circ f) = (h \circ g) \circ f$ |
        | Identity | $f \circ \operatorname{id}_A = f = \operatorname{id}_B \circ f$ |
        | No commutativity | in general $g \circ f \ne f \circ g$ |
        | Lines | if $f(x) = ax + b$ and $g(x) = cx + d$ then $(g \circ f)(x) = cax + (cb + d)$ |

        **Inverse.** A function $g : B \to A$ is an **inverse** of $f : A \to B$ if $g \circ f = \operatorname{id}_A$ and $f \circ g = \operatorname{id}_B$. A function has at most one inverse, written $f^{-1}$, and a function that has one is called **invertible**.

        *Uniqueness.* If $g$ and $h$ are both inverses of $f$, then $g = g \circ \operatorname{id}_B = g \circ (f \circ h) = (g \circ f) \circ h = \operatorname{id}_A \circ h = h$.

        | Fact | Statement |
        | --- | --- |
        | Inverse of an inverse | $(f^{-1})^{-1} = f$ |
        | Inverse of a composition | $(g \circ f)^{-1} = f^{-1} \circ g^{-1}$ |
        | Domain and range | the domain of $f^{-1}$ is the codomain of $f$, and its range is the domain of $f$ |
        | Graph | $(a, b)$ is on the graph of $f$ if and only if $(b, a)$ is on the graph of $f^{-1}$ |
        | Inverse of a line | if $f(x) = mx + b$ with $m \ne 0$ then $f^{-1}(x) = \dfrac{x - b}{m}$ |

        $f : A \to B$ is invertible if and only if for each $y \in B$ there is exactly one $x \in A$ with $f(x) = y$.

        The function $x \mapsto x^2$ from the numbers $x \ge 0$ to the numbers $y \ge 0$ has the inverse $x \mapsto \sqrt{x}$, and for every real $x$, $\sqrt{x^2} = \lvert x \rvert$.
  drill:
    - text: Seconds each. In a composition, find the innermost function first.
    - question:
        id: drill-compose-number
        type: numeric
        system: s1
        prompt: |
          $f(x) = x + 2$ and $g(x) = 3x$. What is $(g \circ f)(4)$?
        answer: "18"
        explanation: |
          $f$ acts first: $f(4) = 6$. Then $g(6) = 18$.
    - question:
        id: drill-compose-other-way
        type: numeric
        system: s1
        prompt: |
          $f(x) = x + 2$ and $g(x) = 3x$. What is $(f \circ g)(4)$?
        answer: "14"
        explanation: |
          $g$ acts first: $g(4) = 12$. Then $f(12) = 14$.
    - question:
        id: drill-compose-formula
        type: choice
        system: s1
        prompt: |
          $f(x) = x^2$ and $g(x) = x - 5$. What is $(f \circ g)(x)$?
        options: ["$x^2 - 5$", "$(x - 5)^2$", "$x^3 - 5x^2$", "$x^2 - 25$"]
        answer: 1
        explanation: g acts first, subtracting 5, and then f squares the whole result.
    - question:
        id: drill-slopes
        type: numeric
        system: s1
        prompt: |
          $f(x) = 4x + 1$ and $g(x) = -2x + 7$. What is the slope of the line $g \circ f$?
        answer: "-8"
        explanation: The slopes of composed lines multiply.
    - question:
        id: drill-inverse-line
        type: choice
        system: s1
        prompt: |
          What is the inverse of $f(x) = 2x + 6$?
        options: ["$f^{-1}(x) = \\dfrac{x}{2} - 6$", "$f^{-1}(x) = \\dfrac{x - 6}{2}$", "$f^{-1}(x) = \\dfrac{1}{2x + 6}$", "$f^{-1}(x) = -2x - 6$"]
        answer: 1
        explanation: Undo the adding of 6 first, then the doubling. The third option is the reciprocal, which is not the inverse.
    - question:
        id: drill-inverse-value
        type: numeric
        system: s1
        prompt: |
          $f(x) = x^3 + 1$. What is $f^{-1}(9)$?
        answer: "2"
        explanation: |
          $f^{-1}(9)$ is the input that gives 9. $x^3 + 1 = 9$ means $x^3 = 8$.
    - question:
        id: drill-root-of-square
        type: numeric
        system: s1
        prompt: |
          What is $\sqrt{(-7)^2}$?
        answer: "7"
        explanation: |
          $\sqrt{49} = 7$. The square root is the inverse of squaring only on the non-negative numbers, so $\sqrt{x^2} = |x|$.
    - question:
        id: predict-compose
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          f = lambda x: x + 1
          g = lambda x: x * x
          print(g(f(3)), f(g(3)))
        output: "16 10"
        explanation: Add one then square gives 16. Square then add one gives 10. The innermost call runs first.
    - question:
        id: predict-returned-function
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def shift(c):
              return lambda x: x + c

          up = shift(10)
          down = shift(-10)
          print(up(5), down(up(5)), shift(1)(1))
        output: "15 5 2"
        explanation: shift returns a new function each time it is called, remembering its own c. down undoes up, so they are inverses. The last expression makes a function and calls it at once.
  work:
    - text: Slower now. Check every inverse by composing in both orders.
    - question:
        id: work-decompose
        type: choice
        system: s2
        prompt: |
          $h(x) = \dfrac{1}{(x - 2)^3}$. With $a(x) = x - 2$, $c(x) = x^3$ and $r(x) = \dfrac{1}{x}$, which composition equals $h$?
        options: ["$a \\circ c \\circ r$", "$r \\circ c \\circ a$", "$c \\circ r \\circ a$ only", "$r \\circ a \\circ c$"]
        answer: 1
        explanation: |
          To evaluate $h$ you subtract 2, cube, then take the reciprocal. The first to act is written on the right: $r \circ c \circ a$. In fact $c \circ r \circ a$ gives the same function here, since the cube of a reciprocal is the reciprocal of the cube, a pair of functions that happens to commute. But it is not the **only** one, which is what that option claims.
    - question:
        id: work-inverse-fraction
        type: choice
        system: s2
        prompt: |
          Find the inverse of $f(x) = \dfrac{2x + 1}{x - 3}$, defined for $x \ne 3$.
        options: ["$f^{-1}(x) = \\dfrac{x - 3}{2x + 1}$", "$f^{-1}(x) = \\dfrac{3x + 1}{x - 2}$", "$f^{-1}(x) = \\dfrac{3x - 1}{x + 2}$", "$f^{-1}(x) = \\dfrac{x + 1}{2x - 3}$"]
        answer: 1
        explanation: |
          Write $y = \dfrac{2x + 1}{x - 3}$. Multiply up: $y(x - 3) = 2x + 1$, so $yx - 3y = 2x + 1$. Collect the terms with $x$: $x(y - 2) = 3y + 1$, so $x = \dfrac{3y + 1}{y - 2}$. Check with a number: $f(4) = 9$ and $f^{-1}(9) = \dfrac{28}{7} = 4$. The first option is the reciprocal, not the inverse.
    - question:
        id: write-compose
        type: code
        mode: write
        system: s2
        prompt: |
          Write `chain(functions)` that takes a list of functions and returns a single function that applies them one after another **in list order**: the first in the list acts first. So `chain([f, g, h])(x)` is `h(g(f(x)))`. For an empty list, return the identity function.
        starter: |
          def chain(functions):
              # Replace the next line with your own.
              return lambda x: 0

          price = chain([lambda x: x - 400, lambda x: x * 0.75])
          print(price(2000))
        solution: |
          def chain(functions):
              def run(x):
                  for f in functions:
                      x = f(x)
                  return x
              return run

          price = chain([lambda x: x - 400, lambda x: x * 0.75])
          print(price(2000))
        tests: |
          _s = lambda x: x - 400
          _p = lambda x: x * 0.75
          assert chain([_s, _p])(2000) == 1200, "Flat discount first, then the percentage: 2000 -> 1600 -> 1200"
          assert chain([_p, _s])(2000) == 1100, "Percentage first, then the flat discount: 2000 -> 1500 -> 1100"
          assert chain([])(42) == 42 and chain([])("x") == "x", "An empty chain is the identity function"
          assert chain([abs])(-3) == 3, "A chain of one function is that function"
          assert chain([lambda x: x + 1, lambda x: x * 2, lambda x: x - 3])(5) == 9, "Three functions in list order: (5 + 1) * 2 - 3"
          _k = chain([str, len])
          assert _k(12345) == 5 and _k(7) == 1, "The returned function should work every time it is called, and for functions that are not numeric"
        wrong:
          - "def chain(functions):\n    def run(x):\n        for f in functions[::-1]:\n            x = f(x)\n        return x\n    return run\n"
          - "def chain(functions):\n    def run(x):\n        for f in functions:\n            y = f(x)\n        return y\n    return run\n"
          - "def chain(functions):\n    x = 2000\n    for f in functions:\n        x = f(x)\n    return lambda y: x\n"
        explanation: The returned function threads its input through the list, each output becoming the next input. With no functions the loop never runs and the input comes back unchanged, which is the identity. This little function is the whole idea of a pipeline, and of a neural network as a list of layers.
    - question:
        id: write-invert-table
        type: code
        mode: write
        system: s2
        prompt: |
          A function with a finite domain is given as a dictionary. Write `invert(table)` that returns the inverse function as a dictionary, with every pair turned round. If the function has no inverse, because two inputs share an output, return `None`.
        starter: |
          def invert(table):
              # Replace the next line with your own.
              return table

          print(invert({"a": 1, "b": 2, "c": 3}))
          print(invert({"a": 1, "b": 1}))
        solution: |
          def invert(table):
              back = {}
              for key, value in table.items():
                  if value in back:
                      return None
                  back[value] = key
              return back

          print(invert({"a": 1, "b": 2, "c": 3}))
          print(invert({"a": 1, "b": 1}))
        tests: |
          assert invert({"a": 1, "b": 2, "c": 3}) == {1: "a", 2: "b", 3: "c"}, "Every pair should be turned round"
          assert invert({"a": 1, "b": 1}) is None, "Two inputs share the output 1, so there is no inverse: return None"
          assert invert({}) == {}, "The empty function is its own inverse"
          assert invert({1: 1, 2: 2}) == {1: 1, 2: 2}, "The identity is its own inverse"
          _t = {"x": 10, "y": 20, "z": 30}
          assert invert(invert(_t)) == _t, "The inverse of the inverse is the original function"
          assert _t == {"x": 10, "y": 20, "z": 30}, "Do not change the dictionary you were given"
          assert invert({1: "p", 2: "q", 3: "p"}) is None, "The clash may be between the first and last entries"
        wrong:
          - "def invert(table):\n    back = {}\n    for key, value in table.items():\n        back[value] = key\n    return back\n"
          - "def invert(table):\n    back = {}\n    for key, value in table.items():\n        if key in back:\n            return None\n        back[value] = key\n    return back\n"
          - "def invert(table):\n    back = {}\n    for key, value in table.items():\n        if value in back:\n            return None\n        back[key] = value\n    return back\n"
        explanation: Turning a pair round makes the old output the new key. A dictionary can hold each key only once, so if an output occurs twice the second pair would silently overwrite the first. That overwriting is the code's version of "the output does not remember which input it came from", and the function detects it and reports that there is no inverse.
    - question:
        id: fix-pipeline-order
        type: code
        mode: find-bug
        system: s2
        prompt: |
          A value is **normalised** by subtracting the mean 50 and then dividing by the spread 10, so that 70 becomes 2.0. `denormalise` should be the inverse. It is correct. The bug is in `normalise`, which was written as a composition in the wrong order and turns 70 into `-43.0`. Fix `normalise` by changing only the order of the composition.
        starter: |
          centre = lambda x: x - 50
          scale = lambda x: x / 10

          def compose(g, f):
              return lambda x: g(f(x))

          normalise = compose(centre, scale)
          denormalise = lambda z: z * 10 + 50

          print(normalise(70))
          print(denormalise(normalise(70)))
        solution: |
          centre = lambda x: x - 50
          scale = lambda x: x / 10

          def compose(g, f):
              return lambda x: g(f(x))

          normalise = compose(scale, centre)
          denormalise = lambda z: z * 10 + 50

          print(normalise(70))
          print(denormalise(normalise(70)))
        tests: |
          assert compose(lambda x: x + 1, lambda x: x * 2)(5) == 11, "Leave compose as it was: compose(g, f) is g after f"
          assert normalise(70) == 2, "70 is two spreads above the mean: subtract 50 first, then divide by 10"
          assert normalise(50) == 0, "The mean itself should become 0"
          assert normalise(35) == -1.5, "35 is one and a half spreads below the mean"
          for _x in [0, 12.5, 50, 99]:
              assert abs(denormalise(normalise(_x)) - _x) < 1e-9, "denormalise should undo normalise"
        wrong:
          - "centre = lambda x: x - 50\nscale = lambda x: x / 10\n\ndef compose(g, f):\n    return lambda x: f(g(x))\n\nnormalise = compose(scale, centre)\ndenormalise = lambda z: z * 10 + 50\n\nprint(normalise(70))\nprint(denormalise(normalise(70)))\n"
          - "centre = lambda x: x - 50\nscale = lambda x: x / 10\n\ndef compose(g, f):\n    return lambda x: g(f(x))\n\nnormalise = compose(centre, centre)\ndenormalise = lambda z: z * 10 + 50\n\nprint(normalise(70))\nprint(denormalise(normalise(70)))\n"
        explanation: |
          `compose(g, f)` is $g \circ f$: the second argument acts first. Centring must act first, so it goes on the right. The broken version divided by 10 and then subtracted 50. Subtracting the mean and dividing by the spread is done to almost every column of data before it is given to a model, and its inverse is applied to the model's predictions, so this pair of functions is worth getting right.
    - question:
        id: work-commute
        type: choice
        system: s2
        prompt: |
          For which of these pairs is $f \circ g = g \circ f$?
        options:
          - "$f(x) = x + 2$ and $g(x) = 3x$"
          - "$f(x) = x + 2$ and $g(x) = x - 7$"
          - "$f(x) = x^2$ and $g(x) = x + 1$"
          - "$f(x) = 2x$ and $g(x) = x^2$"
        answer: 1
        explanation: |
          Two shifts commute: adding 2 and subtracting 7 give $x - 5$ in either order. For the first pair, $3x + 2 \ne 3(x + 2)$. For the third, $(x + 1)^2 \ne x^2 + 1$. For the fourth, $2x^2 \ne (2x)^2 = 4x^2$. This answers the puzzle: two percentage discounts commute because both are multiplications, and a flat discount and a percentage do not because one is a shift and the other a scaling.
    - question:
        id: work-restrict
        type: choice
        system: s2
        prompt: |
          $f(x) = (x - 3)^2$ on all of $\mathbb{R}$ has no inverse. Restricted to which domain does it have one, and what is the inverse there?
        options:
          - "On $x \\ge 0$, with $f^{-1}(x) = \\sqrt{x} + 3$"
          - "On $x \\ge 3$, with $f^{-1}(x) = \\sqrt{x} + 3$"
          - "On $x \\ge 3$, with $f^{-1}(x) = \\sqrt{x + 3}$"
          - "On every real number except 3, with $f^{-1}(x) = \\sqrt{x} + 3$"
        answer: 1
        explanation: |
          The parabola turns at $x = 3$. To the right of the turning point, different inputs give different outputs. There $x - 3 \ge 0$, so $y = (x - 3)^2$ gives $x - 3 = \sqrt{y}$ and $x = \sqrt{y} + 3$. On $x \ge 0$ the inputs 2 and 4 still share the output 1. Removing the single point 3 does not help either, for the same reason.
  connections:
    - text: |
        Two operations on functions, and both will be with you permanently.

        **Composition** is how every large function is made. A program is a composition of its statements. A data pipeline is a composition: read, clean, normalise, predict, denormalise. And a neural network is, quite literally, a composition of layers,

        $$\text{network} = \text{layer}_n \circ \cdots \circ \text{layer}_2 \circ \text{layer}_1,$$

        each layer being a simple function with adjustable numbers in it. The `chain` function you wrote is a neural network's skeleton. The fact that slopes multiply along a chain is the chain rule in embryo, and the method that trains every network, backpropagation, is that rule applied from the last layer back to the first: socks and shoes again.

        **Inversion** is how every question of the form "what input gave this output?" is answered. Solving an equation is applying an inverse. Decoding undoes encoding, decompression undoes compression, decryption undoes encryption. In machine learning, a tokeniser turns text into numbers and its inverse turns the model's numbers back into text, and a whole family of generative models is built from functions chosen specifically because they can be inverted.

        The lesson also showed how inversion fails. Rounding, squaring and a constant function all merge inputs, and what is merged cannot be unmerged. Squaring on $\mathbb{R}$ fails in a second way too: some numbers in its codomain are never produced. These are two separate properties, "never merges" and "misses nothing", and a function may have either without the other. Each has a name, and between them they answer a question that looks unrelated: when do two sets have the same number of members? That waits for [[f2.relations-and-functions-between-sets]].

        One pair of inverses matters more than any other in computing, and it is next. Raising a number to a power is the function behind compound interest, doubling user counts and the cost of a brute-force search, and running it backwards, asking "to what power?", is how you count the digits of a number or the steps of binary search. The forward direction is [[f1.exponents-and-exponential-growth]], and its inverse, [[f1.logarithms]], follows.
