concept: f1.functions-as-machines
minutes: 100
claim: You can say exactly what a function is, name its domain, codomain and range, tell a function from a rule that is not one, read a function from a formula, a table, a graph or a program, and find every input for which a formula makes sense.
recalls: [f1.coordinates-lines-and-slope]
uses: [f0.fractions-decimals-and-percentages, f0.negative-numbers, f0.powers-and-roots, f1.variables-and-expressions, f1.linear-equations, f1.inequalities, h0.alignment-and-the-size-of-things, s0.strings, s0.booleans-and-conditionals, s0.loops, s0.functions, s0.lists-and-tuples, s0.dictionaries-and-sets]
leads: [f1.composition-and-inverses, f2.relations-and-functions-between-sets]
starter: |
  # Scratch space. A function is a value: it can be handed to another function.
  def square(x):
      return x * x

  def table(f, inputs):
      for x in inputs:
          print(x, "->", f(x))

  table(square, [-2, -1, 0, 1, 2])
parts:
  recall:
    - text: |
        In [[f1.coordinates-lines-and-slope]] a line turned each $x$ into exactly one $y$, and a whole curve became a set of points in the plane. Today that idea, one output for each input, is taken out of the plane and made exact. Two quick pulls first.
  puzzle:
    - text: |
        You have used the word **function** for weeks: in Python since `def`, and on paper since "$y = 2x + 1$". Here are five rules. Decide for each whether it deserves the name.

        1. To each person in your class, assign that person's date of birth.
        2. To each day of the year, assign the person in your class born on that day.
        3. To each real number $x$, assign the number $y$ with $y^2 = x$.
        4. To each real number $x$, assign $\dfrac{1}{x - 3}$.
        5. This Python function:

        ```python
        calls = []

        def ticket(name):
            calls.append(name)
            return len(calls)
        ```

        The first one is fine. Every person has a date of birth, and only one.

        The second has two things wrong with it. On most days nobody in the class was born, so there is nothing to assign. And if two classmates share a birthday, there are two candidates and no way to choose.

        The third has the same two faults in mathematical dress. For $x = -4$ there is no real $y$ at all. For $x = 9$ there are two, 3 and $-3$.

        The fourth fails for exactly one input, $x = 3$, and works for every other.

        The fifth is the strangest. `ticket("Asha")` returns 1. Call `ticket("Asha")` again, with the very same input, and it returns 2.

        Some of these are "almost" functions and some can be repaired. To sort them out you need to know **precisely what is being promised** when something is called a function. The promise turns out to be one sentence long.
  intuition:
    - text: |
        Picture a machine with a slot on the left and a chute on the right. You put something into the slot, and something drops out of the chute.

        Two things make it a **function** machine.

        **It accepts everything it claims to accept.** On the front of the machine is a label saying which inputs are allowed. For each of those, something comes out. It never jams.

        **It is not moody.** The same input always produces the same output. Put 3 in today and 7 comes out. Put 3 in tomorrow, after a thousand other inputs, and 7 comes out. For each input there is **one** output, never two to choose between.

        That is all. Nothing says the machine must work by a formula. It may look the answer up in a table. Nothing says its inputs must be numbers. They may be people, strings or whole lists. Nothing says different inputs must give different outputs. A machine that returns 0 for everything is a dull function, but it is one.

        The picture below shows a small function as arrows from each input to its output. Change the rule and the number of inputs and outputs. One thing never changes: **exactly one arrow leaves each input.** Arrows may land on the same output, and some outputs may get none.
    - figure: arrow-map
      props: { rule: 3, inputs: 5, outputs: 6, plain: true }
    - text: |
        Now look back at the five rules. The second breaks both promises: some days have no arrow leaving them, and some have two. So does the third. The fourth jams on a single input, which can be repaired by changing the label on the front. And the fifth is moody: its output depends on its history and not only on its input. Programmers call it a function. Mathematicians do not.
  derivation:
    - text: |
        **A little notation for collections.** A function needs a collection of allowed inputs and a collection where the outputs land. Mathematicians call any such collection a **set**. A small one is written by listing its members in curly brackets, as in $\{1, 2, 3\}$, and $x \in A$ is read "$x$ is a member of $A$". Three sets of numbers have names of their own: $\mathbb{N}$, the counting numbers $0, 1, 2, \dots$; $\mathbb{Z}$, the whole numbers, negative ones included; and $\mathbb{R}$, the real numbers, every point of the number line. A later lesson, [[f2.relations-and-functions-between-sets]], builds sets and functions up from nothing. Here the sets are only the labels on the machine.

        **The definition.** A **function** $f$ from a set $A$ to a set $B$ assigns to **each** member of $A$ **exactly one** member of $B$. We write

        $$f : A \to B.$$

        $A$ is the **domain** of $f$, the label on the front of the machine: the set of allowed inputs. $B$ is the **codomain**: a set in which all the outputs are promised to lie. For an input $x \in A$, the output is written $f(x)$, read "$f$ of $x$", and called the **value** of $f$ at $x$, or the **image** of $x$.

        The two words in bold are the two promises. "Each": no input is left without an output. "Exactly one": no input has two.

        A function comes with its domain and codomain, as a Python function comes with its parameters. A rule alone is not yet a function. "Square it" is one function from $\mathbb{R}$ to $\mathbb{R}$ and a different function from $\mathbb{N}$ to $\mathbb{N}$.

        **Two notations.** A function given by a formula is written in either of two ways:

        $$f(x) = x^2 + 1 \qquad \text{or} \qquad f : x \mapsto x^2 + 1.$$

        The barred arrow $\mapsto$ is read "maps to" and connects an input to its output. The plain arrow $\to$ connects the domain to the codomain. Do not mix them up: $f : \mathbb{R} \to \mathbb{R}$, and $3 \mapsto 10$.

        The letter $x$ is a placeholder, exactly as a parameter is in Python. $f(x) = x^2 + 1$ and $f(t) = t^2 + 1$ define the same function. To evaluate, replace the placeholder everywhere by the input, in brackets:

        $$f(-3) = (-3)^2 + 1 = 10, \qquad f(a + 1) = (a + 1)^2 + 1 = a^2 + 2a + 2.$$

        And be careful with the notation itself: $f(x)$ is a **number**, the output for the input $x$. The function is $f$. Saying "the function $f(x)$" is a common shorthand, but when it matters, $f$ is the machine and $f(x)$ is what comes out of it.

        **The range.** The codomain is a promise about where outputs lie, and it may be generous. The set of outputs that actually occur is the **range** or **image** of $f$:

        $$f(A) = \{f(x) : x \in A\},$$

        read "the set of all the values $f(x)$, for $x$ in $A$". For $f : \mathbb{R} \to \mathbb{R}$ with $f(x) = x^2$, the codomain is all of $\mathbb{R}$, but no square is negative, and every number $y \ge 0$ is the square of $\sqrt{y}$. So the range is every number from 0 upwards, all $y$ with $y \ge 0$. The range always lies inside the codomain. In the arrow diagram, the codomain is the whole right-hand column and the range is the dots that are hit.

        Why have a codomain at all, if the range is the truth? Because the range is often hard to find, and a promise is useful before the truth is known. A Python function documented to "return a float" is giving a codomain. Working out exactly which floats it can return may be a research problem.

        **A function is a table of pairs.** Here is the definition with the machine removed. Take a function $f : A \to B$ and write down every pair (input, output), $(x, f(x))$ for each $x$ in $A$. This collection of pairs has a special property: **each $x$ in $A$ appears as the first entry of exactly one pair.** Conversely, any collection of pairs with that property tells you the output for every input, so it is a function. This collection of pairs is the **graph** of $f$, and for the mathematician it **is** the function. No mechanism, no formula, just a table of all the answers.

        When the inputs and outputs are real numbers, the pairs are points of the plane, and the graph is the curve you drew in [[f1.coordinates-lines-and-slope]]. The line $y = 2x + 1$ is the set of pairs $(x, 2x + 1)$. The property "each $x$ appears in exactly one pair" becomes a test you can do by eye:

        > **The vertical line test.** A curve is the graph of a function of $x$ exactly when every vertical line over the domain meets it once.

        The U-shaped curve $y = x^2$, called a **parabola**, passes: above each $x$ there is one point. A circle fails: the vertical line through its centre meets it twice. That is rule 3 of the puzzle again. The circle $x^2 + y^2 = 25$ is a perfectly good **set of pairs**, but it is not a function, because $x = 3$ is paired with both $4$ and $-4$.
    - question:
        id: which-is-function
        type: choice
        system: s2
        prompt: |
          Let $A = \{1, 2, 3\}$ and $B = \{a, b\}$. Which of these sets of pairs is a function from $A$ to $B$?
        options: ["$\\{(1, a), (2, b)\\}$", "$\\{(1, a), (2, a), (3, a)\\}$", "$\\{(1, a), (1, b), (2, a), (3, b)\\}$", "$\\{(a, 1), (b, 2)\\}$"]
        answer: 1
        explanation: |
          Each of 1, 2 and 3 must appear as a first entry exactly once. The second option does that. It sends everything to $a$, which is allowed: a constant function. The first leaves 3 without an output, the third gives 1 two outputs, and the fourth is a function from $B$ to $A$.
    - text: |
        **Equal functions.** Two functions are **equal** when they have the same domain and codomain and give the same output for every input. How the output is computed is irrelevant. On $\mathbb{R}$,

        $$f(x) = (x + 1)^2 \qquad \text{and} \qquad g(x) = x^2 + 2x + 1$$

        are the same function, written twice. Every identity you proved in algebra was a statement that two formulas define one function. In programming this is the idea of two implementations of one specification, and it is the entire basis of optimisation: replace a program by a faster one that is the same function.

        **Four ways to give a function.**

        *A formula:* $f(x) = 3x - 2$.

        *A table*, listing every input with its output. This is the set of pairs written out, and it is the only way when there is no pattern. In Python a table is a dictionary. The keys are the domain, each key appears once and has one value, which are the two promises exactly:

        ```python
        capital = {"India": "New Delhi", "Japan": "Tokyo", "Kenya": "Nairobi"}
        print(capital["Japan"])
        ```

        *A graph*, read by going up from the input on the horizontal axis to the curve and across to the vertical axis.

        *An algorithm*, a procedure that computes the output: a Python `def`.

        **Natural domains.** In practice a function is often given by a formula alone, with the domain left unsaid. The convention is that the domain is then every real number for which the formula makes sense, its **natural domain**. For the formulas you know so far, exactly two things can go wrong:

        | Trouble | Requirement |
        | --- | --- |
        | Division by zero | the denominator is not 0 |
        | Square root of a negative number | the quantity under the root is $\ge 0$ |

        A third, the logarithm of a number that is not positive, will join the table when logarithms arrive later in this cluster.

        So $f(x) = \dfrac{1}{x - 3}$ has as its natural domain every real number except 3, which repairs rule 4 of the puzzle by changing the label on the machine. $g(x) = \sqrt{x - 2}$ needs $x - 2 \ge 0$, so its domain is every $x$ with $x \ge 2$. And $h(x) = \dfrac{\sqrt{x - 2}}{x - 5}$ needs both conditions at once: $x \ge 2$ and $x \ne 5$. Finding a domain is solving inequalities, as in [[f1.inequalities]], and keeping the numbers that pass every one.

        Rule 3 can be repaired too, by making a choice. For $x \ge 0$ let $\sqrt{x}$ mean the solution of $y^2 = x$ that is not negative. With that choice, the square root is a function from the numbers $x \ge 0$ to the numbers $y \ge 0$. This is why $\sqrt{9}$ is 3 and never $\pm 3$. The symbol was defined to have one value so that it would be a function.

        **Functions in pieces.** Nothing requires one formula for the whole domain. A **piecewise** function uses different formulas on different parts, provided each input belongs to exactly one part:

        $$|x| = \begin{cases} x & \text{if } x \ge 0, \\ -x & \text{if } x < 0. \end{cases}$$

        In Python a piecewise function is an `if`. One piecewise function is worth meeting now, because modern machine learning is built out of it. The **rectified linear unit** passes positive inputs through unchanged and replaces negative ones by zero:

        $$\operatorname{relu}(x) = \begin{cases} x & \text{if } x > 0, \\ 0 & \text{if } x \le 0. \end{cases}$$

        Its graph is flat along the negative axis and then turns up along the line $y = x$. A neural network is, to a first approximation, millions of straight lines joined by this one bend.

        **More than one input, and inputs that are not numbers.** The area of a rectangle depends on two numbers. That is a function whose domain is a set of pairs:

        $$\operatorname{area}(w, h) = wh.$$

        Its inputs are pairs of numbers, so a "function of two variables" is a function of one pair. `align_up(n, a)` from [[h0.alignment-and-the-size-of-things]] was another. And domains need not contain numbers. `len` is a function from the set of all strings to $\mathbb{N}$. A spam filter is a function from emails to the set $\{\text{spam}, \text{not spam}\}$, and the IFSC code of a branch is a function of the branch. A language model is a function from sequences of words to tables of probabilities. When you train a model, you are searching a very large set of functions for a good one.

        **Mathematical functions and Python functions.** A Python `def` is a function in the mathematical sense only if it keeps the two promises: it returns a value for every allowed input, and that value depends on the inputs alone. Such a `def` is called **pure**. The `ticket` function of the puzzle is not pure, since it reads and changes a list outside itself. Neither is anything that reads the clock, a file or a random number. Impure functions are sometimes necessary, but they cannot be reasoned about by substituting equals for equals, and they are much harder to test. A good habit, which you will see enforced in the numerical libraries used for machine learning, is to keep as much of a program as possible in pure functions.

        Finally, in Python a function is itself a **value**. Its name can be passed to another function, as `square` is passed to `table` in the scratch space. This is not a trick: functions are values, like numbers, and the next lesson combines them with one another.
    - question:
        id: fix-relu
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `relu(x)` should return `x` for positive `x` and `0` otherwise. `leaky(x)` is a common variant: it returns `x` for positive `x`, and one tenth of `x` otherwise, so that negative inputs are shrunk and not erased. One of the two is wrong. `leaky(-20)` should be `-2.0`. Read both piecewise definitions against the code, and fix the one that is wrong.
        starter: |
          def relu(x):
              if x > 0:
                  return x
              return 0

          def leaky(x):
              if x > 0:
                  return x / 10
              return x

          print(relu(-3), relu(4), leaky(-20), leaky(5))
        solution: |
          def relu(x):
              if x > 0:
                  return x
              return 0

          def leaky(x):
              if x > 0:
                  return x
              return x / 10

          print(relu(-3), relu(4), leaky(-20), leaky(5))
        tests: |
          assert relu(-3) == 0 and relu(4) == 4 and relu(0) == 0, "Leave relu as it was: it was right"
          assert leaky(5) == 5, "A positive input passes through leaky unchanged"
          assert leaky(-20) == -2, "A negative input is divided by 10: leaky(-20) is -2.0"
          assert leaky(0) == 0, "leaky(0) is 0"
          assert leaky(0.5) == 0.5 and leaky(-0.5) == -0.05, "It should work for numbers between -1 and 1 as well"
        wrong:
          - "def relu(x):\n    if x > 0:\n        return x\n    return 0\n\ndef leaky(x):\n    if x > 0:\n        return x\n    return -x / 10\n\nprint(relu(-3), relu(4), leaky(-20), leaky(5))\n"
          - "def relu(x):\n    if x > 0:\n        return x\n    return 0\n\ndef leaky(x):\n    if x > 0:\n        return x\n    return 0\n\nprint(relu(-3), relu(4), leaky(-20), leaky(5))\n"
        explanation: The two pieces of leaky were attached to the wrong conditions. A piecewise function is a list of (condition, formula) rows, and the commonest mistake is to pair a formula with the other row's condition.
  formal:
    - text: |
        Let $A$ and $B$ be sets. A **function** $f : A \to B$ assigns to each $x \in A$ exactly one $y \in B$. That $y$ is written $f(x)$. $A$ is the **domain**, $B$ the **codomain**, and the collection of pairs $(x, f(x))$ for $x \in A$ is the **graph** of $f$: each member of $A$ is the first entry of exactly one pair.

        | Term | Meaning |
        | --- | --- |
        | Value, image of $x$ | $f(x)$, the one output for the input $x$ |
        | Range, image of $f$ | $f(A) = \{f(x) : x \in A\}$, the outputs that occur; it lies inside $B$ |
        | $x \mapsto \text{expression}$ | the function sending each $x$ to the value of the expression |

        Functions $f$ and $g$ are **equal** if and only if they have the same domain and the same codomain, and $f(x) = g(x)$ for every $x$ in the domain.

        **Vertical line test.** A curve in the plane is the graph of a function of $x$ with domain $D$ if and only if, for each $a$ in $D$, the vertical line $x = a$ meets it in exactly one point, and no vertical line with $a$ outside $D$ meets it.

        **Natural domain.** When a function is given by a formula alone, its domain is every real $x$ for which every denominator is non-zero and every quantity under a square root is non-negative.

        A function may be defined **piecewise**, by different expressions on different parts of the domain, provided each point of the domain lies in exactly one part. A function of several variables is a function whose inputs are pairs, or longer tuples.

        A Python function is **pure** if its return value is determined by its arguments alone and calling it changes nothing else. A pure Python function that returns a value for every input in a set $A$ defines a function with domain $A$.
  drill:
    - text: Seconds each. For every rule, ask the two questions. Does each input get an output, and only one?
    - question:
        id: drill-evaluate
        type: numeric
        system: s1
        prompt: |
          $f(x) = x^2 - 3x$. What is $f(-2)$?
        answer: "10"
        explanation: |
          $(-2)^2 - 3 \times (-2) = 4 + 6$.
    - question:
        id: drill-evaluate-expression
        type: choice
        system: s1
        prompt: |
          $f(x) = 2x + 1$. What is $f(a + 3)$?
        options: ["$2a + 4$", "$2a + 7$", "$a + 4$", "$2a + 3$"]
        answer: 1
        explanation: |
          $2(a + 3) + 1 = 2a + 6 + 1$. The whole input goes in the bracket.
    - question:
        id: drill-arrows
        type: choice
        system: s1
        prompt: |
          In the notation $f : \mathbb{N} \to \mathbb{Z}$, what is $\mathbb{Z}$, the set of whole numbers?
        options: ["The domain", "The codomain", "The range", "The graph"]
        answer: 1
        explanation: The set after the arrow is the codomain, the set in which outputs are promised to lie. The range may be smaller.
    - question:
        id: drill-domain-fraction
        type: choice
        system: s1
        prompt: |
          What is the natural domain of $f(x) = \dfrac{x}{x + 4}$?
        options: ["Every real number", "Every real number except 0", "Every real number except -4", "Every real number except 4"]
        answer: 2
        explanation: Only the denominator matters. It is zero when x is -4. A zero on top is harmless.
    - question:
        id: drill-domain-root
        type: choice
        system: s1
        prompt: |
          What is the natural domain of $g(x) = \sqrt{6 - 2x}$?
        options: ["$x \\ge 3$", "$x \\le 3$", "$x < 3$", "$x \\ge 0$"]
        answer: 1
        explanation: |
          $6 - 2x \ge 0$ gives $x \le 3$. The end is included, because $\sqrt{0}$ is fine.
    - question:
        id: drill-range
        type: choice
        system: s1
        prompt: |
          What is the range of $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^2 + 3$?
        options: ["Every real number", "Every number from 0 up", "Every number from 3 up, 3 included", "Every number greater than 3"]
        answer: 2
        explanation: A square is at least 0, and takes every value from 0 upwards, so the outputs are everything from 3 upwards. The value 3 itself occurs, at x = 0.
    - question:
        id: drill-vertical-line
        type: choice
        system: s1
        prompt: |
          Which of these sets of points is **not** the graph of a function of $x$?
        options: ["The line $y = 3$", "The curve $y = x^2$", "The line $x = 3$", "The curve $y = \\lvert x \\rvert$"]
        answer: 2
        explanation: The vertical line x = 3 pairs the single input 3 with every y at once, and gives no output for any other input.
    - question:
        id: drill-relu
        type: numeric
        system: s1
        prompt: |
          $\operatorname{relu}(x)$ is $x$ for $x > 0$ and $0$ otherwise. What is $\operatorname{relu}(-7) + \operatorname{relu}(4)$?
        answer: "4"
        explanation: The negative input gives 0 and the positive one passes through.
    - question:
        id: predict-dict-function
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          f = {1: 4, 2: 4, 3: 9}
          print(f[2], sorted(f.keys()), sorted(set(f.values())))
        output: "4 [1, 2, 3] [4, 9]"
        explanation: A dictionary is a function given as a table. Its keys are the domain and the set of its values is the range. Two inputs share the output 4.
    - question:
        id: predict-impure
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          seen = []

          def ticket(name):
              seen.append(name)
              return len(seen)

          print(ticket("a"), ticket("a"), ticket("b"))
        output: "1 2 3"
        explanation: The same input gives two different outputs, because the result depends on the list, which every call changes. This is not a function in the mathematical sense.
  work:
    - text: Slower now. State the domain before you compute anything.
    - question:
        id: work-domain-both
        type: choice
        system: s2
        prompt: |
          What is the natural domain of $h(x) = \dfrac{\sqrt{x + 1}}{x^2 - 4}$?
        options: ["Every $x \\ge -1$", "Every $x \\ge -1$ except 2", "Every real number except -2 and 2", "Every $x > -1$ except 2"]
        answer: 1
        explanation: |
          The root needs $x \ge -1$. The denominator is zero at $x = 2$ and $x = -2$, but $-2$ is already excluded by the root. So the domain is every $x \ge -1$ with the single point 2 removed.
    - question:
        id: write-is-function
        type: code
        mode: write
        system: s2
        prompt: |
          A candidate function is given as a list of pairs `(x, y)`. Write `is_function(pairs, domain)` that returns `True` exactly when the pairs define a function on the set `domain`: every member of `domain` appears as a first entry **exactly once**, and no first entry lies outside `domain`. The second entries may be anything.
        starter: |
          def is_function(pairs, domain):
              # Replace the next line with your own.
              return True

          print(is_function([(1, "a"), (2, "a"), (3, "b")], {1, 2, 3}))
          print(is_function([(1, "a"), (1, "b"), (2, "a")], {1, 2}))
        solution: |
          def is_function(pairs, domain):
              counts = {}
              for x, y in pairs:
                  if x not in domain:
                      return False
                  counts[x] = counts.get(x, 0) + 1
              for x in domain:
                  if counts.get(x, 0) != 1:
                      return False
              return True

          print(is_function([(1, "a"), (2, "a"), (3, "b")], {1, 2, 3}))
          print(is_function([(1, "a"), (1, "b"), (2, "a")], {1, 2}))
        tests: |
          assert is_function([(1, "a"), (2, "a"), (3, "b")], {1, 2, 3}) is True, "Each of 1, 2, 3 appears once as an input. Sharing an output is allowed."
          assert is_function([(1, "a"), (1, "b"), (2, "a")], {1, 2}) is False, "The input 1 has two outputs"
          assert is_function([(1, "a"), (2, "b")], {1, 2, 3}) is False, "The input 3 has no output"
          assert is_function([(1, "a"), (2, "b"), (4, "c")], {1, 2}) is False, "The pair (4, c) starts outside the domain"
          assert is_function([], set()) is True, "With an empty domain and no pairs, both promises hold"
          assert is_function([(1, "a"), (1, "a")], {1}) is False, "A list that gives the input 1 twice has two arrows leaving 1, even if they agree"
          assert is_function([(2, 2), (1, 1)], {1, 2}) is True, "The order of the pairs does not matter"
          assert is_function([(1, "a"), (1, "b")], {1, 2}) is False, "Two pairs for a domain of two is not enough: here 1 has two outputs and 2 has none"
        wrong:
          - "def is_function(pairs, domain):\n    firsts = set()\n    for x, y in pairs:\n        firsts.add(x)\n    return firsts == domain\n"
          - "def is_function(pairs, domain):\n    return len(pairs) == len(domain)\n"
          - "def is_function(pairs, domain):\n    counts = {}\n    for x, y in pairs:\n        counts[x] = counts.get(x, 0) + 1\n    for x in domain:\n        if counts.get(x, 0) != 1:\n            return False\n    return True\n"
        explanation: Count how many pairs start at each input, rejecting any pair that starts outside the domain. Then the two promises are one check, that every member of the domain has the count 1. A count of 0 breaks "each" and a count of 2 breaks "exactly one".
    - question:
        id: write-image
        type: code
        mode: write
        system: s2
        prompt: |
          Write `image(f, inputs)` that takes a function `f` and a set `inputs`, and returns the set of all outputs `f(x)` for `x` in `inputs`: the range of `f` on that domain. Then use it: the program should print the sorted range of the squaring function on the integers from $-3$ to $3$.
        starter: |
          def square(x):
              return x * x

          def image(f, inputs):
              # Replace the next line with your own.
              return inputs

          print(sorted(image(square, {-3, -2, -1, 0, 1, 2, 3})))
        solution: |
          def square(x):
              return x * x

          def image(f, inputs):
              outputs = set()
              for x in inputs:
                  outputs.add(f(x))
              return outputs

          print(sorted(image(square, {-3, -2, -1, 0, 1, 2, 3})))
        tests: |
          assert image(square, {-3, -2, -1, 0, 1, 2, 3}) == {0, 1, 4, 9}, "The squares of the integers from -3 to 3 are 0, 1, 4 and 9"
          assert output.strip() == "[0, 1, 4, 9]", "The program should print [0, 1, 4, 9]"
          assert image(abs, {-2, 2}) == {2}, "Two inputs with the same output give a range with one member"
          assert image(square, set()) == set(), "The image of the empty set is empty"
          def _const(x):
              return 7
          assert image(_const, {1, 2, 3}) == {7}, "A constant function has a range with one member"
          assert image(len, {"a", "bb", "cc"}) == {1, 2}, "The function need not take numbers"
        wrong:
          - "def square(x):\n    return x * x\n\ndef image(f, inputs):\n    outputs = set()\n    for x in inputs:\n        outputs.add(x * x)\n    return outputs\n\nprint(sorted(image(square, {-3, -2, -1, 0, 1, 2, 3})))\n"
          - "def square(x):\n    return x * x\n\ndef image(f, inputs):\n    outputs = []\n    for x in inputs:\n        outputs.append(f(x))\n    return outputs\n\nprint(sorted(image(square, {-3, -2, -1, 0, 1, 2, 3})))\n"
        explanation: |
          `image` is the definition of the range, $f(A) = \{f(x) : x \in A\}$, as a loop. It works for any function, because the function is handed in as a value and called inside. Seven inputs give only four outputs, since $x$ and $-x$ share a square.
    - question:
        id: fix-in-domain
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `in_domain(x)` should return `True` exactly when $x$ lies in the natural domain of $h(x) = \dfrac{\sqrt{x - 2}}{x - 5}$. It gives the right answer for 1, 3 and 5, but wrong answers for 2 and for 7. Work out the domain on paper, compare it with the conditions in the code, and fix both mistakes.
        starter: |
          def in_domain(x):
              return x > 2 and x < 5

          print(in_domain(1), in_domain(2), in_domain(3), in_domain(5), in_domain(7))
        solution: |
          def in_domain(x):
              return x >= 2 and x != 5

          print(in_domain(1), in_domain(2), in_domain(3), in_domain(5), in_domain(7))
        tests: |
          assert in_domain(1) is False, "At x = 1 the quantity under the root is negative"
          assert in_domain(2) is True, "At x = 2 the root is the root of 0, which is fine"
          assert in_domain(3) is True, "x = 3 is in the domain"
          assert in_domain(5) is False, "At x = 5 the denominator is zero"
          assert in_domain(7) is True, "x = 7 is in the domain: only the single point 5 is removed, not everything beyond it"
          assert in_domain(4.999) is True and in_domain(5.001) is True, "Points just either side of 5 are in the domain"
          assert in_domain(1.999) is False, "Points just below 2 are not"
        wrong:
          - "def in_domain(x):\n    return x >= 2 and x < 5\n\nprint(in_domain(1), in_domain(2), in_domain(3), in_domain(5), in_domain(7))\n"
          - "def in_domain(x):\n    return x > 2 and x != 5\n\nprint(in_domain(1), in_domain(2), in_domain(3), in_domain(5), in_domain(7))\n"
          - "def in_domain(x):\n    return x >= 2 or x != 5\n\nprint(in_domain(1), in_domain(2), in_domain(3), in_domain(5), in_domain(7))\n"
        explanation: |
          The root needs $x - 2 \ge 0$, with equality allowed. The denominator needs $x \ne 5$, which removes one point and nothing else. The domain is every $x \ge 2$ except 5. The starter excluded the end point 2 and threw away everything to the right of 5.
    - question:
        id: work-same-function
        type: choice
        system: s2
        prompt: |
          Let $f(x) = \dfrac{x^2 - 9}{x - 3}$ and $g(x) = x + 3$, each with its natural domain. Are $f$ and $g$ the same function?
        options:
          - "Yes, because the fraction cancels to x + 3."
          - "No. They agree wherever both are defined, but 3 is in the domain of g and not in the domain of f, and equal functions must have the same domain."
          - "No, because they give different values at x = 4."
          - "Yes, because their graphs are both straight lines."
        answer: 1
        explanation: |
          Expanding $(x - 3)(x + 3)$ with the distributive law gives $x^2 - 9$, so for $x \ne 3$, $\dfrac{(x - 3)(x + 3)}{x - 3} = x + 3$. But $f(3)$ is $0/0$, undefined. The graph of $f$ is the line $y = x + 3$ with the single point $(3, 6)$ missing. Cancelling a factor silently assumes it is not zero. This hole in a graph is exactly the kind of thing calculus was invented to talk about.
    - question:
        id: work-count-functions
        type: numeric
        system: s2
        prompt: |
          How many different functions are there from the set $\{1, 2, 3\}$ to the set $\{a, b\}$?
        answer: "8"
        explanation: |
          A function is a choice of output for each input. There are 2 choices for 1, 2 for 2 and 2 for 3, independent of one another: $2^3$. In general, with $n$ inputs and $k$ possible outputs there are $k^n$ functions, the powers of [[f0.powers-and-roots]] once again.
  connections:
    - text: |
        The word you have been using loosely is now exact. A function is a table of pairs in which each input appears once. Everything else, the formula, the table, the curve, the program, is a way of describing that table. [[f2.relations-and-functions-between-sets]] will later build it from sets alone.

        Look at how much of what you already know was this idea in disguise. A straight line is the function $x \mapsto mx + b$, and its slope says how fast the output changes with the input. The absolute value and the square root are functions, each with a domain you had to be careful about. `align_up` was a function of two inputs. A dictionary is a function with a finite domain. A list is a function too, from the positions $0, 1, \dots, n - 1$ to its entries, and `xs[i]` is function evaluation written with square brackets.

        And look forward. A machine-learning **model** is a function with adjustable numbers inside it, its parameters. **Training** is the search for the parameter values that make the function agree with a table of examples. A **loss** is a function from models to numbers, saying how bad each one is. A neural network is a function built by feeding simple functions, straight lines and the bend of relu, into one another. A web service is a function from requests to responses, and the hard part of building one is keeping it as pure as possible.

        That last paragraph used an operation this lesson did not define: feeding one function into another. You have done it in Python whenever you wrote `f(g(x))`. It is the way large functions are built from small ones, and it raises the natural question of whether a function can be run backwards, from the output to the input, as subtracting 199 undid adding 199 in [[f1.linear-equations]]. Both are the subject of the next lesson: [[f1.composition-and-inverses]].
