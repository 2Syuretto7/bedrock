concept: f1.coordinates-lines-and-slope
minutes: 110
claim: You can locate points in the plane by their coordinates, decide whether a point lies on the graph of an equation, compute the slope of a line from two points, read slope and intercept from an equation, find the equation of a line from a point and a slope or from two points, and interpret slope as a rate of change.
recalls: [f1.inequalities]
uses: [f1.variables-and-expressions, f1.linear-equations, f1.inequalities, f0.fractions-decimals-and-percentages, f0.negative-numbers, f0.ratio-rate-and-proportion, s0.expressions, s0.booleans-and-conditionals, s0.loops, s0.functions, s0.lists-and-tuples, s0.reading-errors-and-debugging]
leads: [f1.functions-as-machines]
starter: |
  # Scratch space. Equal steps in x: what happens to y?
  for x in range(0, 6):
      print(x, 3 * x + 2)
parts:
  recall:
    - text: |
        In [[f1.inequalities]] every answer lived on a number line, a single row of numbers. Today a second line is stood upright across the first, and equations with two unknowns get a picture. Two quick pulls first.
  puzzle:
    - text: |
        The power goes off one evening, as it does in many Indian towns in the summer, and a candle is lit on the dining table. A child with a ruler measures it every ten minutes.

        | Minutes burning | 0 | 10 | 20 | 30 |
        | --- | --- | --- | --- | --- |
        | Height in cm | 24 | 21 | 18 | 15 |

        How tall will it be after 45 minutes? When will it burn out?

        You can probably answer both, and it is worth noticing how. You saw that every ten minutes costs 3 centimetres, assumed that this goes on, and worked from there. Nothing in the table says so directly. What you saw was a **pattern in the differences**.

        Mark the four measurements on squared paper, time across and height up, and they lie in a straight row.

        **What is the connection between "the same change every time" and "straight"? And how do you turn a steady rate and a starting value into an equation?**
  intuition:
    - text: |
        To say where your seat is in a cinema hall, you give two things: the row, F, and the seat within the row, 12. To find a square on a chessboard, a letter and a number. One number is not enough to pin down a position on a flat surface, and two always are.

        So take **two** number lines. Lay one flat, as usual. Stand the other upright, crossing the first at right angles, so that the two zeros coincide. The flat one is the **$x$-axis**, the upright one the **$y$-axis**, and the point where they cross is the **origin**.

        Any point on the flat surface can now be reached from the origin by two moves: first along, then up. The point reached by going 3 along and 2 up is named $(3, 2)$. The numbers are the point's **coordinates**. Negative numbers mean the opposite direction: left instead of right, down instead of up.

        Move the point below with the steppers, and watch its name change.
    - figure: plane-point
      props: { x: 3, y: 2 }
    - text: |
        Two things happened when you did that. Every position you could reach got a name made of two numbers. And every pair of numbers you could dial named exactly one position. Points and pairs match up perfectly, one to one.

        That matching is one of the great ideas of mathematics, due to René Descartes. It is a two-way dictionary. Anything said about numbers can be turned into a picture, and anything drawn can be turned into numbers. An equation becomes a shape. A shape becomes an equation. From here on, algebra and geometry are one subject.
    - text: |
        Think of a staircase where every step is the same: so far forward, so far up. However many steps you climb, the stairs head in one unchanging direction, and a plank laid along the edges of the steps would touch every one. Now think of a staircase whose steps get taller as you go. Its edges curve upwards, and no plank fits.

        Now back to the candle. Its measurements are pairs, minutes and centimetres, so each is a point in this plane.

        **Straight means steady.** A line is the path of something whose height changes by the same amount for every equal step sideways.

        The number that says **how much** it changes per step is the line's **slope**. For the candle, each 1 minute forward changes the height by $-0.3$ centimetres, because 3 centimetres are lost in 10 minutes. The slope is $-0.3$. It is negative since the height falls.

        A steady rate alone does not fix the line. A taller candle burning at the same rate would give a different line, parallel to the first. You also need to know where it **starts**. At time 0 the height is 24. That is where the line meets the $y$-axis, and it is called the **intercept**.

        Start at 24 and change by $-0.3$ for each minute. After $t$ minutes, the height is

        $$h = 24 - 0.3t.$$

        After 45 minutes: $24 - 13.5 = 10.5$ centimetres. It burns out when $h = 0$, that is, when $0.3t = 24$, so $t = 80$ minutes. Both answers came from two numbers: a rate and a start.

        Steer the line below with its two sliders. One of them tilts it, and the other slides it up and down without changing the tilt.
    - figure: plane-line
      props: { slope: 2, intercept: 1 }
  derivation:
    - text: |
        **Ordered pairs.** A point is written $(x, y)$, always with the $x$-coordinate first. The order matters: $(3, 2)$ and $(2, 3)$ are different points. For this reason the pair is called an **ordered pair**. In Python it is a tuple, `(3, 2)`, and unpacking takes it apart: `x, y = point`.

        Points on the $x$-axis have the form $(x, 0)$. Points on the $y$-axis have the form $(0, y)$. The origin is $(0, 0)$.

        The axes cut the plane into four **quadrants**, numbered anticlockwise from the top right.

        | Quadrant | Sign of $x$ | Sign of $y$ | Example |
        | --- | --- | --- | --- |
        | I | positive | positive | $(3, 2)$ |
        | II | negative | positive | $(-3, 2)$ |
        | III | negative | negative | $(-3, -2)$ |
        | IV | positive | negative | $(3, -2)$ |

        **The graph of an equation.** Return to $y = 2x - 1$. Its solutions are pairs, and pairs are points. So mark them. A **table of values** gives a few.

        | $x$ | $-2$ | $-1$ | $0$ | $1$ | $2$ | $3$ |
        | --- | --- | --- | --- | --- | --- | --- |
        | $y = 2x - 1$ | $-5$ | $-3$ | $-1$ | $1$ | $3$ | $5$ |

        A loop makes the table for you, as a list of tuples:

        ```python
        points = []
        for x in range(-2, 4):
            points.append((x, 2 * x - 1))
        print(points)
        ```

        Plot those six points and something striking appears: they lie in a perfectly straight row. Put in the points for $x = 0.5$, $x = 1.5$ and every value between, and the gaps fill in to make an unbroken straight line.

        The **graph** of an equation is the set of **all** points whose coordinates satisfy it. This sentence cuts both ways, and both are used constantly.

        - If a point is on the graph, its coordinates satisfy the equation.
        - If a pair satisfies the equation, the point is on the graph.

        So to test whether $(4, 7)$ lies on the graph of $y = 2x - 1$, you do not need to draw anything. Substitute: is $7 = 2 \times 4 - 1$? Yes. The point is on the line. And $(4, 8)$? Is $8 = 7$? No. It lies off the line, one unit above.
    - question:
        id: on-the-graph
        type: choice
        system: s2
        prompt: "Which of these points lies on the graph of $y = x^2 - 3$?"
        options: ["$(2, 7)$", "$(-2, 1)$", "$(1, 2)$", "$(0, 3)$"]
        answer: 1
        explanation: "Substitute each pair. For $(-2, 1)$: $(-2)^2 - 3 = 4 - 3 = 1$, which equals the $y$-coordinate. For $(2, 7)$ the right side is 1, for $(1, 2)$ it is $-2$, and for $(0, 3)$ it is $-3$."
    - text: |
        **Measuring steepness.** Take any two points on a line. Going from the first to the second you move some distance sideways, the **run**, and some distance vertically, the **rise**. The slope is the rise **per unit of** run:

        $$m = \frac{\text{rise}}{\text{run}} = \frac{y_2 - y_1}{x_2 - x_1}.$$

        For the points $(1, 2)$ and $(4, 8)$: the rise is $8 - 2 = 6$ and the run is $4 - 1 = 3$, so the slope is 2. For every 1 across, the line climbs 2.

        Three cautions. Subtract in the **same order** on top and bottom: second minus first both times, or first minus second both times, since $\frac{2 - 8}{1 - 4} = \frac{-6}{-3}$ is 2 as well. Put the **change in $y$ on top**. And keep the signs: they carry the direction.

        | Slope | The line, read from left to right |
        | --- | --- |
        | positive | climbs |
        | negative | falls |
        | zero | is horizontal |
        | large in absolute value | is steep |
        | small in absolute value | is gentle |

        **Why $y = mx + b$ is straight.** Take the equation $y = mx + b$ and any two points on its graph. Their coordinates satisfy $y_1 = mx_1 + b$ and $y_2 = mx_2 + b$. Subtract the first from the second. The $b$ cancels:

        $$y_2 - y_1 = m(x_2 - x_1), \qquad\text{so}\qquad \frac{y_2 - y_1}{x_2 - x_1} = m.$$

        Whichever two points you pick, near together or far apart, the ratio of rise to run is the same number $m$. That constancy is exactly what "straight" means. So the graph is a line, and the coefficient of $x$ is its slope. This answers last lesson's question about the six points.

        And $b$? Put $x = 0$ into the equation and you get $y = b$. The graph passes through $(0, b)$. The constant term is the intercept on the $y$-axis.

        $$y = \underbrace{m}_{\text{slope}}\,x + \underbrace{b}_{\text{intercept}}$$

        This is the **slope–intercept form**. From it you can read a line at a glance. $y = -\frac{1}{2}x + 3$ starts at 3 on the $y$-axis and falls 1 for every 2 across.

        **Drawing a line from its equation.** Mark the intercept. From there, go 1 across and $m$ up, and mark a second point. Two points fix a line.

        **From a point and a slope to an equation.** Suppose a line has slope 3 and passes through $(2, 5)$. What is its equation? It must be $y = 3x + b$ for some $b$, and the point must satisfy it: $5 = 3 \times 2 + b$, so $b = -1$. The line is $y = 3x - 1$.

        There is a form that skips the step. For any other point $(x, y)$ on the line, the slope from $(2, 5)$ to it must be 3, so $y - 5 = 3(x - 2)$. In general, the line through $(x_1, y_1)$ with slope $m$ is

        $$y - y_1 = m(x - x_1).$$

        This is the **point–slope form**. Expanding it gives the slope–intercept form.

        **From two points to an equation.** Two points fix a line, so they must fix its equation. Find the slope from the two points, then use either of them in the point–slope form. Through $(1, 2)$ and $(4, 8)$: the slope is 2, so $y - 2 = 2(x - 1)$, that is, $y = 2x$. Check with the **other** point: $2 \times 4 = 8$. It fits.
    - question:
        id: line-through-two-points
        type: numeric
        system: s2
        prompt: "A line passes through $(-1, 7)$ and $(3, -1)$. What is its intercept on the $y$-axis? Find the slope first, then use one point, and check with the other."
        answer: "5"
        explanation: "The slope is $\\dfrac{-1 - 7}{3 - (-1)} = \\dfrac{-8}{4} = -2$. Using $(3, -1)$: $-1 = -2 \\times 3 + b$, so $b = 5$. The line is $y = -2x + 5$. Check with $(-1, 7)$: $-2 \\times (-1) + 5 = 7$."
    - text: |
        **Horizontal and vertical lines.** A horizontal line has rise 0 between any two of its points, so its slope is 0 and its equation is $y = b$: every point has the same height. For example, $y = 3$.

        A vertical line is the odd one out. Between any two of its points the run is 0, and the slope would be a division by zero. A vertical line has **no slope**. Nor can its equation be written as $y = mx + b$. Its points all share the same $x$-coordinate, so its equation is $x = k$, for example $x = 2$. A program that computes slopes must treat this case separately, or it will stop with a `ZeroDivisionError`.

        **Parallel and perpendicular.** Two lines with the same slope climb at the same rate and never get nearer or farther. They are **parallel**. So $y = 2x + 1$ and $y = 2x - 4$ never meet.

        Two lines are **perpendicular** when they meet at a right angle. Take a line of slope $m$ through the origin. Going 1 across takes you $m$ up, to the point $(1, m)$. Now turn the whole plane a quarter-turn anticlockwise about the origin. The step "1 across" becomes "1 up", and the step "$m$ up" becomes "$m$ to the left". The point $(1, m)$ lands on $(-m, 1)$. The turned line passes through the origin and $(-m, 1)$, so its slope is

        $$\frac{1}{-m} = -\frac{1}{m}.$$

        Perpendicular lines have slopes that are **negative reciprocals** of each other. Their product is $-1$. A line of slope 2 is perpendicular to one of slope $-\frac{1}{2}$.

        **Where a line crosses the $x$-axis.** On the $x$-axis, $y = 0$. So set $y = 0$ and solve the linear equation: for $y = 2x - 6$, $0 = 2x - 6$ gives $x = 3$. This is how the candle's burning time was found.

        **Slope as a rate.** In applications the two axes measure different things, and the slope has units: the units of $y$ per unit of $x$. Centimetres per minute. Rupees per gigabyte. Kilometres per hour. The slope says how fast one quantity changes as the other increases, and the intercept says what it was at the start. When someone says a quantity "grows linearly", they mean precisely that its rate of change is constant.

        Not every table of data is linear. To test one, compute the slope between each pair of neighbouring points. If the slopes are all the same, the points lie on one line. If they differ, they do not, however straight the plot may look to the eye.
    - question:
        id: fix-slope
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `slope(p, q)` should return the slope of the line through two points given as tuples. For $(1, 2)$ and $(4, 8)$ the slope is 2, but the function returns 0.5. Find the slip, and fix it. You may assume the two points do not lie on a vertical line.
        starter: |
          def slope(p, q):
              x1, y1 = p
              x2, y2 = q
              return (x2 - x1) / (y2 - y1)

          print(slope((1, 2), (4, 8)))
        solution: |
          def slope(p, q):
              x1, y1 = p
              x2, y2 = q
              return (y2 - y1) / (x2 - x1)

          print(slope((1, 2), (4, 8)))
        tests: |
          assert slope((1, 2), (4, 8)) == 2, "The slope through (1, 2) and (4, 8) is 6 / 3 = 2. Which change goes on top?"
          assert slope((4, 8), (1, 2)) == 2, "The order of the two points should not matter"
          assert slope((0, 5), (2, 1)) == -2, "The slope through (0, 5) and (2, 1) is -2"
          assert slope((-3, 4), (5, 4)) == 0, "A horizontal line has slope 0"
          assert slope((0, 0), (4, 1)) == 0.25, "The slope through (0, 0) and (4, 1) is 0.25"
        wrong:
          - "def slope(p, q):\n    x1, y1 = p\n    x2, y2 = q\n    return (y2 - y1) / (x1 - x2)\n\nprint(slope((1, 2), (4, 8)))\n"
          - "def slope(p, q):\n    x1, y1 = p\n    x2, y2 = q\n    return (y2 - x2) / (y1 - x1)\n\nprint(slope((1, 2), (4, 8)))\n"
          - "def slope(p, q):\n    x1, y1 = p\n    x2, y2 = q\n    return y2 / x2\n\nprint(slope((1, 2), (4, 8)))\n"
        explanation: Slope is rise over run, the change in $y$ divided by the change in $x$. The starter had the fraction upside down, which gives the reciprocal.
  formal:
    - text: |
        The **slope** of the line through two points $(x_1, y_1)$ and $(x_2, y_2)$ with $x_1 \neq x_2$ is

        $$m = \frac{y_2 - y_1}{x_2 - x_1}.$$

        It does not depend on which two points of the line are chosen. If $x_1 = x_2$ the line is vertical and has no slope.

        | Form | Equation | Reads off |
        | --- | --- | --- |
        | Slope–intercept | $y = mx + b$ | slope $m$, passes through $(0, b)$ |
        | Point–slope | $y - y_1 = m(x - x_1)$ | slope $m$, passes through $(x_1, y_1)$ |
        | Horizontal | $y = b$ | slope 0 |
        | Vertical | $x = k$ | no slope |

        **Theorem.** The graph of $y = mx + b$ is a straight line of slope $m$. Conversely, every non-vertical line is the graph of exactly one equation of this form.

        For two non-vertical lines with slopes $m_1$ and $m_2$:

        - they are **parallel** exactly when $m_1 = m_2$;
        - they are **perpendicular** exactly when $m_1 m_2 = -1$.

        The **$y$-intercept** of a graph is the value of $y$ where $x = 0$. An **$x$-intercept** is a value of $x$ where $y = 0$. For $y = mx + b$ with $m \neq 0$, the $x$-intercept is $-\dfrac{b}{m}$.

        A relation between two quantities is **linear** when equal changes in one always produce equal changes in the other. The slope is then the **rate of change**, in units of $y$ per unit of $x$.
  drill:
    - text: Seconds each. Rise on top, run underneath, same order both times.
    - question:
        id: drill-slope-two-points
        type: numeric
        system: s1
        prompt: "What is the slope of the line through $(0, 1)$ and $(2, 7)$?"
        answer: "3"
        explanation: "Rise $7 - 1 = 6$, run $2 - 0 = 2$, and $6 \\div 2 = 3$."
    - question:
        id: drill-slope-negative
        type: numeric
        system: s1
        prompt: "What is the slope of the line through $(1, 5)$ and $(3, 1)$?"
        answer: "-2"
        explanation: "Rise $1 - 5 = -4$, run $3 - 1 = 2$."
    - question:
        id: drill-read-slope
        type: numeric
        system: s1
        prompt: "What is the slope of the line $y = 4 - 3x$?"
        answer: "-3"
        explanation: "The slope is the coefficient of $x$, which is $-3$. The 4 is the intercept. The order in which the terms are written does not matter."
    - question:
        id: drill-read-intercept
        type: numeric
        system: s1
        prompt: "Where does the line $y = 5x - 8$ cross the $y$-axis? Give the value of $y$."
        answer: "-8"
        explanation: "On the $y$-axis $x = 0$, so $y = -8$."
    - question:
        id: drill-x-intercept
        type: numeric
        system: s1
        prompt: "Where does the line $y = 2x - 10$ cross the $x$-axis? Give the value of $x$."
        answer: "5"
        explanation: "On the $x$-axis $y = 0$, so $2x = 10$."
    - question:
        id: drill-parallel
        type: choice
        system: s1
        prompt: "Which line is parallel to $y = 3x + 1$?"
        options: ["$y = -3x + 1$", "$y = 3x - 7$", "$y = \\frac{1}{3}x + 1$", "$y = x + 3$"]
        answer: 1
        explanation: Parallel lines have equal slopes. Only the second has slope 3.
    - question:
        id: drill-perpendicular
        type: choice
        system: s1
        prompt: "A line has slope 4. What is the slope of a line perpendicular to it?"
        options: ["$-4$", "$\\frac{1}{4}$", "$-\\frac{1}{4}$", "$4$"]
        answer: 2
        explanation: "The negative reciprocal: $4 \\times \\left(-\\frac{1}{4}\\right) = -1$."
    - question:
        id: drill-horizontal
        type: choice
        system: s1
        prompt: "What is the equation of the horizontal line through $(2, -5)$?"
        options: ["$x = 2$", "$y = -5$", "$y = 2x - 5$", "$y = -5x$"]
        answer: 1
        explanation: Every point of a horizontal line has the same $y$-coordinate.
    - question:
        id: predict-equal-steps
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          ys = []
          for x in range(4):
              ys.append(10 - 3 * x)
          print(ys, ys[1] - ys[0], ys[3] - ys[2])
        output: "[10, 7, 4, 1] -3 -3"
        explanation: Each step of 1 in `x` changes `y` by $-3$, the slope, wherever on the line the step is taken.
    - question:
        id: drill-quadrant
        type: choice
        system: s1
        prompt: "In which quadrant is the point $(-4, 3)$?"
        options: ["I", "II", "III", "IV"]
        answer: 1
        explanation: Left and up is the top left quadrant, the second.
    - question:
        id: predict-unpack-point
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          p = (4, -1)
          x, y = p
          print(y, x, x > 0 and y < 0)
        output: "-1 4 True"
        explanation: Unpacking binds `x` to 4 and `y` to $-1$. The point is right and down, in quadrant IV.
  work:
    - text: Slower now. For each line, say in words what its slope and its intercept mean before you compute with them.
    - question:
        id: work-point-slope
        type: choice
        system: s2
        prompt: "What is the equation of the line with slope $-\\frac{1}{2}$ through the point $(4, 1)$?"
        options: ["$y = -\\frac{1}{2}x + 1$", "$y = -\\frac{1}{2}x + 3$", "$y = -\\frac{1}{2}x - 1$", "$y = 4x - \\frac{1}{2}$"]
        answer: 1
        explanation: "$y - 1 = -\\frac{1}{2}(x - 4)$ expands to $y = -\\frac{1}{2}x + 2 + 1$. Check: at $x = 4$, $y = -2 + 3 = 1$."
    - question:
        id: write-line-through
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `line_through(p, q)` that takes two points as tuples and returns the tuple `(m, b)` of the slope and intercept of the line through them. If the two points lie on a vertical line, there is no such pair, and the function must return `None` instead of stopping with an error.
        starter: |
          def line_through(p, q):
              # Replace the next line with your own.
              return (0, 0)

          print(line_through((1, 2), (4, 8)))
          print(line_through((3, 1), (3, 9)))
        solution: |
          def line_through(p, q):
              x1, y1 = p
              x2, y2 = q
              if x1 == x2:
                  return None
              m = (y2 - y1) / (x2 - x1)
              b = y1 - m * x1
              return (m, b)

          print(line_through((1, 2), (4, 8)))
          print(line_through((3, 1), (3, 9)))
        tests: |
          def _safe(p, q):
              try:
                  return line_through(p, q)
              except ZeroDivisionError:
                  return "zero-division"
          assert _safe((1, 2), (4, 8)) == (2, 0), "The line through (1, 2) and (4, 8) is y = 2x, so return (2, 0)"
          assert _safe((-1, 7), (3, -1)) == (-2, 5), "The line through (-1, 7) and (3, -1) is y = -2x + 5"
          assert _safe((0, 4), (5, 4)) == (0, 4), "The line through (0, 4) and (5, 4) is horizontal: slope 0 and intercept 4"
          assert _safe((3, 1), (3, 9)) != "zero-division", "For two points on a vertical line the function divides by zero. Test for that case before dividing."
          assert _safe((3, 1), (3, 9)) is None, "For two points on a vertical line, return None"
          assert _safe((2, 3), (4, 4)) == (0.5, 2), "The line through (2, 3) and (4, 4) is y = 0.5x + 2"
        wrong:
          - "def line_through(p, q):\n    x1, y1 = p\n    x2, y2 = q\n    m = (y2 - y1) / (x2 - x1)\n    b = y1 - m * x1\n    return (m, b)\n"
          - "def line_through(p, q):\n    x1, y1 = p\n    x2, y2 = q\n    if x1 == x2:\n        return None\n    m = (y2 - y1) / (x2 - x1)\n    b = y1 + m * x1\n    return (m, b)\n"
          - "def line_through(p, q):\n    x1, y1 = p\n    x2, y2 = q\n    if y1 == y2:\n        return None\n    m = (y2 - y1) / (x2 - x1)\n    b = y1 - m * x1\n    return (m, b)\n"
        explanation: "The slope is rise over run. The intercept comes from solving $y_1 = mx_1 + b$ for $b$. The vertical case has a run of zero and must be caught before the division."
    - question:
        id: write-is-linear
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `is_linear(points)` that takes a list of at least two points, with increasing $x$-coordinates, and returns True exactly when they all lie on one straight line. Compute the slope between each pair of neighbouring points and compare it with the first slope, counting two slopes as equal when they differ by less than 0.000001.
        starter: |
          def is_linear(points):
              # Replace the next line with your own.
              return True

          print(is_linear([(0, 24), (10, 21), (20, 18), (30, 15)]))
          print(is_linear([(0, 0), (1, 1), (2, 4), (3, 9)]))
        solution: |
          def slope(p, q):
              x1, y1 = p
              x2, y2 = q
              return (y2 - y1) / (x2 - x1)

          def is_linear(points):
              first = slope(points[0], points[1])
              for i in range(1, len(points) - 1):
                  if abs(slope(points[i], points[i + 1]) - first) >= 0.000001:
                      return False
              return True

          print(is_linear([(0, 24), (10, 21), (20, 18), (30, 15)]))
          print(is_linear([(0, 0), (1, 1), (2, 4), (3, 9)]))
        tests: |
          assert is_linear([(0, 24), (10, 21), (20, 18), (30, 15)]) == True, "The candle's measurements lose 3 cm every 10 minutes, so they are linear"
          assert is_linear([(0, 0), (1, 1), (2, 4), (3, 9)]) == False, "The squares 0, 1, 4, 9 do not rise by equal steps, so they are not linear"
          assert is_linear([(1, 5), (2, 5), (7, 5)]) == True, "Points at the same height lie on a horizontal line"
          assert is_linear([(0, 0), (5, 5)]) == True, "Any two points lie on a line"
          assert is_linear([(0, 0), (1, 2), (2, 4), (3, 7)]) == False, "Only the last point is off the line. Does your loop reach the last pair?"
          assert is_linear([(0, 0), (1, 2), (3, 6), (6, 12)]) == True, "The x-coordinates need not be equally spaced. Compare slopes, not differences in y."
          assert is_linear([(0, 1), (1, 3), (2, 4), (3, 6)]) == False, "The middle step is different. Compare every slope with the first."
          assert is_linear([(0, 0), (1, 1), (2, 3), (3, 3)]) == False, "The first and last points happen to line up with the second, but the third is off the line. Check every neighbouring pair."
        wrong:
          - "def is_linear(points):\n    first = points[1][1] - points[0][1]\n    for i in range(1, len(points) - 1):\n        if abs(points[i + 1][1] - points[i][1] - first) >= 0.000001:\n            return False\n    return True\n"
          - "def slope(p, q):\n    x1, y1 = p\n    x2, y2 = q\n    return (y2 - y1) / (x2 - x1)\n\ndef is_linear(points):\n    first = slope(points[0], points[1])\n    for i in range(1, len(points) - 2):\n        if abs(slope(points[i], points[i + 1]) - first) >= 0.000001:\n            return False\n    return True\n"
          - "def slope(p, q):\n    x1, y1 = p\n    x2, y2 = q\n    return (y2 - y1) / (x2 - x1)\n\ndef is_linear(points):\n    return abs(slope(points[0], points[1]) - slope(points[0], points[-1])) < 0.000001\n"
        explanation: Straight means that the slope between any two points is the same. Checking each neighbouring pair against the first slope is enough, and one mismatch settles the matter, so the function can return False at once.
    - question:
        id: fix-predict-height
        type: code
        mode: find-bug
        system: s2
        prompt: |
          A plant was 12 cm tall on day 4 and 27 cm tall on day 9, and grows at a steady rate. `height(day)` should return its height on any day. The rate is right, but the function gives 12 cm for day 0, which cannot be so if it was 12 cm on day 4 and has been growing. Find the equation of the line through the two measurements on paper, and fix the function.
        starter: |
          def height(day):
              rate = (27 - 12) / (9 - 4)
              return rate * day + 12

          print(height(4))
          print(height(9))
        solution: |
          def height(day):
              rate = (27 - 12) / (9 - 4)
              return rate * (day - 4) + 12

          print(height(4))
          print(height(9))
        tests: |
          assert height(4) == 12, "On day 4 the plant was 12 cm tall"
          assert height(9) == 27, "On day 9 the plant was 27 cm tall"
          assert height(0) == 0, "At 3 cm a day, four days before day 4 the height was 12 - 12 = 0 cm"
          assert height(5) == 15, "One day after day 4 it has grown 3 cm"
          assert height(14) == 42, "It should work for any day"
        wrong:
          - "def height(day):\n    rate = (27 - 12) / (9 - 4)\n    return rate * day + 4\n\nprint(height(4))\n"
          - "def height(day):\n    rate = (27 - 12) / (9 - 4)\n    return rate * (day + 4) + 12\n\nprint(height(4))\n"
          - "def height(day):\n    rate = (9 - 4) / (27 - 12)\n    return rate * (day - 4) + 12\n\nprint(height(4))\n"
        explanation: "The starter used 12 as the intercept, but 12 is the height on day 4, not on day 0. The point–slope form uses the known point directly: $h - 12 = 3(d - 4)$, which simplifies to $h = 3d$. A check against both measurements would have caught the slip."
