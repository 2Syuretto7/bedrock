    - question:
        id: perpendicular-check
        type: choice
        system: s2
        prompt: "The line $L$ passes through $(0, 0)$ and $(2, 3)$. Which of these lines is perpendicular to $L$?"
        options: ["$y = \\frac{3}{2}x + 1$", "$y = \\frac{2}{3}x + 1$", "$y = -\\frac{2}{3}x + 1$", "$y = -\\frac{3}{2}x + 1$"]
        answer: 2
        explanation: "$L$ has slope $\\frac{3}{2}$. A perpendicular line has the negative reciprocal slope, $-\\frac{2}{3}$, since $\\frac{3}{2} \\times \\left(-\\frac{2}{3}\\right) = -1$."
    - question:
        id: why-straight
        type: choice
        system: s2
        prompt: "Why is the graph of $y = mx + b$ a straight line?"
        options:
          - "Because it has been plotted for many values of x and always looks straight."
          - "Because for any two points on it, subtracting their equations gives $y_2 - y_1 = m(x_2 - x_1)$, so the ratio of rise to run is the same number $m$ for every pair of points."
          - "Because b is a constant."
          - "Because x and y are both variables."
        answer: 1
        explanation: A constant ratio of rise to run between every pair of points is what straightness means. The subtraction shows it for all pairs at once, which no amount of plotting could.
    - question:
        id: write-on-graph
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `on_line(point, m, b)` that returns True exactly when the point, a tuple, lies on the graph of $y = mx + b$. Because coordinates may be floats, count the point as on the line when the two sides differ by less than 0.000001.
        starter: |
          def on_line(point, m, b):
              # Replace the next line with your own.
              return False

          print(on_line((4, 7), 2, -1))
          print(on_line((4, 8), 2, -1))
        solution: |
          def on_line(point, m, b):
              x, y = point
              return abs(y - (m * x + b)) < 0.000001

          print(on_line((4, 7), 2, -1))
          print(on_line((4, 8), 2, -1))
        tests: |
          assert on_line((4, 7), 2, -1) == True, "(4, 7) is on y = 2x - 1, since 2 times 4 minus 1 is 7"
          assert on_line((4, 8), 2, -1) == False, "(4, 8) is not on y = 2x - 1"
          assert on_line((4, 6), 2, -1) == False, "(4, 6) is below the line, so it is not on it. A difference can be negative."
          assert on_line((0, 3), 5, 3) == True, "(0, 3) is on y = 5x + 3"
          assert on_line((0.1, 0.3), 3, 0) == True, "(0.1, 0.3) is on y = 3x, although 3 * 0.1 is not exactly 0.3 as a float"
          assert on_line((7, 4), 2, -1) == False, "(7, 4) is not on y = 2x - 1. The x-coordinate comes first in the pair."
        wrong:
          - "def on_line(point, m, b):\n    x, y = point\n    return y == m * x + b\n\nprint(on_line((4, 7), 2, -1))\n"
          - "def on_line(point, m, b):\n    x, y = point\n    return y - (m * x + b) < 0.000001\n\nprint(on_line((4, 7), 2, -1))\n"
          - "def on_line(point, m, b):\n    y, x = point\n    return abs(y - (m * x + b)) < 0.000001\n\nprint(on_line((4, 7), 2, -1))\n"
        explanation: A point is on a graph exactly when its coordinates satisfy the equation. With floats, "satisfy" means that the two sides are within a tolerance, and the distance between them needs its absolute value, or every point below the line would pass.
  connections:
    - text: |
        A line is now two numbers: how fast, and from where. With those you can predict, work backwards, compare, and say exactly what "steady" means.

        The linear relation is the first model that anyone fits to data, and the one all others are measured against. A **linear model** predicts a quantity as $y = mx + b$, and "training" it means finding the slope and intercept that suit the measurements best. With two measurements you did that exactly today. With two thousand noisy ones there is no line through them all, and the question becomes which line misses by the least. That is linear regression, and the two numbers get new names: the slope becomes a **weight** and the intercept a **bias**. A neural network is, to a first description, an enormous number of such weighted sums stacked together.

        Slope is also the seed of calculus. A curve has no single slope, but at each point it has a steepness, found by taking the slope between two points and letting them come together. Every time you compute rise over run you are rehearsing the definition of the derivative, the tool by which networks learn.

        One question from [[f1.inequalities]] can now be seen. Two phone plans were compared, and the boundary between them was a single value of usage. Each plan's cost is a line, with the monthly rent as its intercept and the price per gigabyte as its slope, and the boundary is where the two lines cross.

        A line turns each $x$ into exactly one $y$. The candle turns each minute into one height, a plan turns each month's data into one bill, and `align_up` turned each size into one aligned size. That idea, a rule that takes an input and gives back one output, is bigger than lines, and it is the subject of the next lesson, [[f1.functions-as-machines]].
