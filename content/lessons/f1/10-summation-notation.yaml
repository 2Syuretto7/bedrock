  work:
    - text: Slower now. Before evaluating a sum, write out its first two terms and its last.
    - question:
        id: work-write-sigma
        type: choice
        system: s2
        prompt: |
          Which expression is $5 + 8 + 11 + 14 + \dots + 302$ in sigma notation?
        options: ["$\\displaystyle\\sum_{i=1}^{100} (3i + 2)$", "$\\displaystyle\\sum_{i=1}^{302} (3i + 2)$", "$\\displaystyle\\sum_{i=5}^{302} 3i$", "$\\displaystyle\\sum_{i=1}^{99} (3i + 5)$"]
        answer: 0
        explanation: |
          The terms go up in threes, so the summand is $3i$ plus a constant. At $i = 1$ it must be 5, so the constant is 2. The last term gives $3i + 2 = 302$, so $i = 100$. Check the fourth option: its first term is 8, not 5.
    - question:
        id: work-telescope
        type: choice
        system: s2
        prompt: |
          Evaluate $\displaystyle\sum_{i=1}^{99} \frac{1}{i(i + 1)}$.
        options: ["$\\dfrac{1}{100}$", "$\\dfrac{99}{100}$", "$1$", "$\\dfrac{98}{99}$"]
        answer: 1
        explanation: |
          Each term is $\dfrac{1}{i} - \dfrac{1}{i + 1}$, so the sum telescopes to $1 - \dfrac{1}{100}$.
    - question:
        id: write-sigma
        type: code
        mode: write
        system: s2
        prompt: |
          Write `sigma(f, m, n)` that returns $\displaystyle\sum_{i=m}^{n} f(i)$ for a function `f` and whole numbers `m` and `n`. If `m` is greater than `n` the sum is empty. Then use it: the program should print the sum of the cubes from 1 to 10.
        starter: |
          def sigma(f, m, n):
              # Replace the next line with your own.
              return 0

          print(sigma(lambda i: i ** 3, 1, 10))
        solution: |
          def sigma(f, m, n):
              total = 0
              for i in range(m, n + 1):
                  total = total + f(i)
              return total

          print(sigma(lambda i: i ** 3, 1, 10))
        tests: |
          assert sigma(lambda i: i, 1, 100) == 5050, "The sum of 1 to 100 is 5050. The upper limit is included."
          assert sigma(lambda i: i * i, 1, 5) == 55, "The sum of the squares from 1 to 5 is 55"
          assert sigma(lambda i: 3, 1, 50) == 150, "A constant summand is added once per term"
          assert sigma(lambda i: i, 3, 7) == 25, "The lower limit need not be 1: 3 + 4 + 5 + 6 + 7"
          assert sigma(lambda i: i, 5, 4) == 0, "An empty sum is 0"
          assert sigma(lambda i: i, -2, 2) == 0, "Limits may be negative"
          assert sigma(lambda i: 2 * i - 1, 1, 12) == 144, "The first 12 odd numbers add up to 144"
          assert output.strip() == "3025", "The program should print 3025, the sum of the cubes from 1 to 10"
        wrong:
          - "def sigma(f, m, n):\n    total = 0\n    for i in range(m, n):\n        total = total + f(i)\n    return total\n\nprint(sigma(lambda i: i ** 3, 1, 10))\n"
          - "def sigma(f, m, n):\n    total = 0\n    for i in range(m, n + 1):\n        total = total + i\n    return total\n\nprint(sigma(lambda i: i ** 3, 1, 10))\n"
          - "def sigma(f, m, n):\n    total = 0\n    for i in range(1, n + 1):\n        total = total + f(i)\n    return total\n\nprint(sigma(lambda i: i ** 3, 1, 10))\n"
        explanation: |
          This one function is the sigma notation itself: the summand is the function handed in, and the limits are the ends of the range, with $n + 1$ as the stop so that $n$ is included. By the way, $3025 = 55^2$. The sum of the first $n$ cubes is always the square of the sum of the first $n$ whole numbers.
    - question:
        id: write-mse
        type: code
        mode: write
        system: s2
        prompt: |
          Write `mse(ys, preds)` that returns the mean squared error of two lists of equal length,

          $$\frac{1}{n}\sum_{i=1}^{n} (y_i - \hat{y}_i)^2,$$

          where `ys` holds the true values $y_i$ and `preds` the predictions $\hat{y}_i$. You may assume the lists are not empty. Remember that the mathematics counts from 1 and Python's positions from 0.
        starter: |
          def mse(ys, preds):
              # Replace the next line with your own.
              return 0

          print(mse([3, 5, 2], [2, 5, 4]))
        solution: |
          def mse(ys, preds):
              n = len(ys)
              total = 0
              for i in range(n):
                  total = total + (ys[i] - preds[i]) ** 2
              return total / n

          print(mse([3, 5, 2], [2, 5, 4]))
        tests: |
          assert abs(mse([3, 5, 2], [2, 5, 4]) - 5 / 3) < 1e-12, "The squared differences are 1, 0 and 4, and their mean is 5/3"
          assert mse([1, 2, 3], [1, 2, 3]) == 0, "Perfect predictions have an error of 0"
          assert mse([10], [7]) == 9, "With one value the error is the square of the difference"
          assert mse([0, 0], [3, -3]) == 9, "Errors of opposite sign must not cancel: square each one before adding"
          assert mse([1, 1, 1, 1], [2, 2, 2, 2]) == 1, "Divide by the number of values, not by a fixed number"
          assert abs(mse([0.5, 1.5], [1.0, 1.0]) - 0.25) < 1e-12, "It should work for values that are not whole numbers"
        wrong:
          - "def mse(ys, preds):\n    n = len(ys)\n    total = 0\n    for i in range(n):\n        total = total + (ys[i] - preds[i])\n    return total ** 2 / n\n"
          - "def mse(ys, preds):\n    n = len(ys)\n    total = 0\n    for i in range(n):\n        total = total + (ys[i] - preds[i]) ** 2\n    return total\n"
          - "def mse(ys, preds):\n    n = len(ys)\n    total = 0\n    for i in range(n - 1):\n        total = total + (ys[i] - preds[i]) ** 2\n    return total / n\n"
        explanation: |
          The index $i = 1, \dots, n$ of the formula becomes the positions $0, \dots, n - 1$ of the lists, which is `range(n)`. The square is taken inside the sum, term by term. Squaring after adding would let a prediction that is 3 too high cancel one that is 3 too low. You have just written the loss function used to train most models that predict a number.
    - question:
        id: write-exp-series
        type: code
        mode: write
        system: s2
        prompt: |
          Write `exp_series(x, terms)` that approximates $e^x$ by the sum of the first `terms` terms of its series,

          $$\sum_{k=0}^{\text{terms} - 1} \frac{x^k}{k!}.$$

          Do not import anything, and do not compute any factorial or power from scratch. Each term is the one before multiplied by $\dfrac{x}{k}$, so keep a running term and a running total.
        starter: |
          def exp_series(x, terms):
              # Replace the next line with your own.
              return 1.0

          print(exp_series(1, 10))
          print(exp_series(2, 20))
        solution: |
          def exp_series(x, terms):
              total = 0.0
              term = 1.0
              for k in range(terms):
                  total = total + term
                  term = term * x / (k + 1)
              return total

          print(exp_series(1, 10))
          print(exp_series(2, 20))
        tests: |
          import math as _m
          assert "import" not in source, "Do not import anything"
          assert exp_series(1, 1) == 1, "One term: just the 1"
          assert exp_series(1, 2) == 2, "Two terms: 1 + 1"
          assert abs(exp_series(1, 3) - 2.5) < 1e-12, "Three terms: 1 + 1 + 1/2"
          assert abs(exp_series(1, 4) - (2.5 + 1 / 6)) < 1e-12, "Four terms: 1 + 1 + 1/2 + 1/6"
          assert abs(exp_series(1, 20) - _m.e) < 1e-12, "Twenty terms at x = 1 give e to twelve places"
          assert abs(exp_series(2, 30) - _m.exp(2)) < 1e-9, "At x = 2 the series gives e squared"
          assert abs(exp_series(-1, 30) - _m.exp(-1)) < 1e-12, "It should work for negative x, where the terms alternate in sign"
          assert exp_series(0, 5) == 1, "e to the 0 is 1"
          assert exp_series(3, 0) == 0, "With no terms the sum is empty"
        wrong:
          - "def exp_series(x, terms):\n    total = 0.0\n    term = 1.0\n    for k in range(terms):\n        total = total + term\n        term = term * x / k if k > 0 else term * x\n    return total\n"
          - "def exp_series(x, terms):\n    total = 0.0\n    term = 1.0\n    for k in range(terms):\n        term = term * x / (k + 1)\n        total = total + term\n    return total\n"
          - "def exp_series(x, terms):\n    total = 0.0\n    term = 1.0\n    for k in range(terms):\n        total = total + term\n        term = term * x\n    return total\n"
        explanation: |
          The term with index $k + 1$ is $\dfrac{x^{k+1}}{(k+1)!} = \dfrac{x^k}{k!} \cdot \dfrac{x}{k + 1}$. So the terms obey a recurrence, and no power or factorial ever needs to be computed. That keeps every intermediate number small. This is, in essence, how `math.exp` works: a function with no formula, evaluated by adding the terms of a rapidly convergent series.
    - question:
        id: fix-product-start
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `factorial(n)` should return $n! = \displaystyle\prod_{i=1}^{n} i$. It returns 0 for every input. `log_factorial(n)` should return $\ln(n!)$, computed as a **sum** of logarithms so that it works for huge `n`. It is correct. Fix `factorial`.
        starter: |
          import math

          def factorial(n):
              result = 0
              for i in range(1, n + 1):
                  result = result * i
              return result

          def log_factorial(n):
              total = 0
              for i in range(1, n + 1):
                  total = total + math.log(i)
              return total

          print(factorial(5), round(log_factorial(5), 4))
        solution: |
          import math

          def factorial(n):
              result = 1
              for i in range(1, n + 1):
                  result = result * i
              return result

          def log_factorial(n):
              total = 0
              for i in range(1, n + 1):
                  total = total + math.log(i)
              return total

          print(factorial(5), round(log_factorial(5), 4))
        tests: |
          import math as _m
          assert factorial(5) == 120, "5! is 120. What should a running product start at?"
          assert factorial(1) == 1, "1! is 1"
          assert factorial(0) == 1, "0! is the empty product, which is 1"
          assert factorial(10) == 3628800, "10! is 3,628,800"
          assert abs(log_factorial(5) - _m.log(120)) < 1e-9, "Leave log_factorial as it was"
          assert abs(log_factorial(20) - _m.log(factorial(20))) < 1e-9, "The sum of the logs should equal the log of the product"
        wrong:
          - "import math\n\ndef factorial(n):\n    result = 1\n    for i in range(1, n):\n        result = result * i\n    return result\n\ndef log_factorial(n):\n    total = 0\n    for i in range(1, n + 1):\n        total = total + math.log(i)\n    return total\n\nprint(factorial(5), round(log_factorial(5), 4))\n"
          - "import math\n\ndef factorial(n):\n    result = 1\n    for i in range(n + 1):\n        result = result * i\n    return result\n\ndef log_factorial(n):\n    total = 0\n    for i in range(1, n + 1):\n        total = total + math.log(i)\n    return total\n\nprint(factorial(5), round(log_factorial(5), 4))\n"
        explanation: A running sum starts at 0 because adding 0 changes nothing. A running product must start at 1 for the same reason, and 0 times anything stays 0 for ever. The starting value is also the value of the empty product, which is why 0! is 1. Compare the two functions. They are the same loop, with times and 1 in one and plus and 0 in the other, joined by the logarithm.
    - question:
        id: work-shift
        type: choice
        system: s2
        prompt: |
          Which of these equals $\displaystyle\sum_{i=1}^{n} (i - 1)^2$?
        options: ["$\\displaystyle\\sum_{k=0}^{n-1} k^2$", "$\\displaystyle\\sum_{k=0}^{n} k^2$", "$\\displaystyle\\sum_{k=1}^{n} k^2 - 1$", "$\\displaystyle\\sum_{k=2}^{n+1} k^2$"]
        answer: 0
        explanation: |
          Put $k = i - 1$. When $i = 1$, $k = 0$, and when $i = n$, $k = n - 1$. Both sums are $0^2 + 1^2 + \dots + (n - 1)^2$. Using the closed form with $n - 1$ in place of $n$, the value is $\dfrac{(n - 1)n(2n - 1)}{6}$.
    - question:
        id: work-double-sum
        type: numeric
        system: s2
        prompt: |
          Evaluate $\displaystyle\sum_{i=1}^{10}\sum_{j=1}^{10} (i + j)$.
        answer: "1100"
        explanation: |
          Split it: $\sum_i\sum_j i + \sum_i\sum_j j$. In the first, the inner sum adds the constant $i$ ten times, giving $10i$, and then $\sum_i 10i = 10 \times 55 = 550$. The second is the same with the roles exchanged. Total 1,100. As a check, there are 100 terms, with a mean value of $5.5 + 5.5 = 11$.
    - question:
        id: work-underflow
        type: choice
        system: s2
        prompt: |
          A language model assigns a probability to each of the 5,000 words of a document, each about 0.05. To score the document, the probabilities must be combined. Which approach is right, and why?
        options:
          - "Multiply them, since the probability of the document is the product of the probabilities."
          - "Add them, since addition is easier."
          - "Add their logarithms. The product is far smaller than the smallest positive float and would come out as exactly 0, while the sum of logs is an ordinary number that carries the same information."
          - "Take the largest one."
        answer: 2
        explanation: |
          $0.05^{5000}$ is about $10^{-6505}$. The smallest positive float is about $10^{-324}$, so the product **underflows** to 0.0. The sum of the logs is $5000 \times \ln 0.05 \approx -14{,}979$. Because the logarithm is strictly increasing, comparing sums of logs is the same as comparing products. Adding the probabilities themselves would be a different, meaningless quantity.
  connections:
    - text: |
        From now on you can read the formulas. Open any text on statistics or machine learning and nearly every definition is a sigma: a mean, a variance, a loss, an expected value. Each is a loop over the data, and you can now pass in both directions between the line of mathematics and the lines of code.

        Three things from this lesson will recur without announcement. **Linearity**: because constants come out and sums split, anything defined as a sum can be taken apart and reassembled, which is why averages are so much easier to handle than anything else. **The sum of products** $\sum_i a_i b_i$, which you were warned is not a product of sums, is the single most important expression in the subject. It is the dot product of two lists of numbers, the way a neuron combines its inputs with its weights, and a whole cluster of lessons, starting from [[f9.vectors]], is built on it. And **logs of products**: the training objective of a language model is a sum of log-probabilities, one for each word, for exactly the reason you saw.

        Closed forms matter for programs as well. A double sum is two nested loops, and the number of times the inner body runs is itself a sum. The staircase $1 + 2 + \dots + n = \dfrac{n(n + 1)}{2}$ is how many comparisons a simple sort makes, and that it grows like $n^2$ is the reason such a sort is useless on large data. Counting the steps of a loop by evaluating a sum is how algorithms are analysed.

        This is the end of the cluster on algebra and functions. Look back over the ten lessons. Letters stood for numbers, and equations and inequalities were solved by undoing. Lines, and then functions, gave rules a shape, and composition and inverses gave ways to chain them and to run them backwards. Exponentials and logarithms are the particular pair that growth, decay and search are made of. And sequences, series and sigma are how many numbers are handled as one.

        Two things come next. First, the programming needs to catch up with the mathematics. You have been writing loops that add up sums, build lists of terms and run recurrences, each one by hand. Python has a notation modelled on the sigma itself, in which a loop that builds a list or adds up a sum is written in a single line, and a sequence that never ends becomes an iterator that produces its terms only when asked: [[s1.comprehensions-and-iterators]]. Then comes the mathematics of arguments. The definition of convergence is built from the phrases "for every" and "there is", and learning to handle such phrases exactly, and to prove things with them, starts with [[f2.propositions-and-connectives]].
