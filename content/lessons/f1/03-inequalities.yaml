concept: f1.inequalities
minutes: 95
claim: You can solve linear inequalities, reversing the sign when multiplying or dividing by a negative, describe solution sets as intervals, and use absolute value as distance to express and solve statements about closeness.
recalls: [f1.linear-equations]
uses: [f1.variables-and-expressions, f0.negative-numbers, f0.the-four-operations-and-order-of-operations, f0.fractions-decimals-and-percentages, s0.expressions, s0.booleans-and-conditionals, s0.loops, s0.functions, s0.lists-and-tuples, s0.reading-errors-and-debugging]
leads: [f1.coordinates-lines-and-slope]
starter: |
  # Scratch space. Which whole numbers satisfy 7 - 2x > 1?
  for x in range(-3, 7):
      print(x, 7 - 2 * x > 1)
parts:
  recall:
    - text: |
        In [[f1.linear-equations]] you solved equations by doing the same thing to both sides of a balance. Today the balance tips, and one of those moves needs a second look. Two quick pulls first.
  puzzle:
    - text: |
        Two phone plans. Plan A costs 199 rupees a month and 3 rupees a gigabyte. Plan B costs 99 rupees a month and 5 rupees a gigabyte. For $g$ gigabytes, when is plan A the cheaper?

        The question is not "when are they equal?". It is "when is one less than the other?":

        $$199 + 3g < 99 + 5g.$$

        The answer cannot be a single number. Surely it is a whole range of usage: heavy users are better off with A's low rate, light users with B's low rent.

        Treat it like an equation and see what happens. Subtract $5g$ from both sides and subtract 199 from both sides:

        $$-2g < -100.$$

        Divide both sides by $-2$:

        $$g < 50 \quad ?$$

        That says A is cheaper for **light** users. Test it. With $g = 10$, plan A costs 229 and plan B costs 149. A is dearer. The conclusion is exactly the wrong way round.

        Every move was one you made safely last lesson. **Which of them is not safe for an inequality, and why?**
  intuition:
    - text: |
        Put the numbers on a line. To say $a < b$ is to say that $a$ lies to the **left** of $b$. That picture is all you need.

        **Adding** a number to both slides the two points along the line by the same amount. Whichever was on the left is still on the left. So adding to, or subtracting from, both sides of an inequality is safe.

        **Multiplying by a positive number** stretches or shrinks the line away from zero, like a rubber band pinned at 0. The points keep their order. Safe.

        **Multiplying by $-1$** sends every number to its opposite. That is a **reflection** of the whole line in zero, as in a mirror. And a mirror swaps left and right. Take 2 and 5. Certainly $2 < 5$. Their opposites are $-2$ and $-5$, and $-2$ is to the **right** of $-5$:

        $$2 < 5 \qquad\text{but}\qquad -2 > -5.$$

        In terms of money: a debt of 5 is worse than a debt of 2, although 5 is more than 2.

        So multiplying or dividing an inequality by a negative number is allowed, but it **reverses the direction of the sign**. Go back to the puzzle. From $-2g < -100$, dividing by $-2$ gives

        $$g > 50.$$

        Plan A is cheaper for anyone using **more** than 50 gigabytes. Test: with $g = 60$, A costs 379 and B costs 399. Correct.

        The point below starts at 2. Step it left and right. Every position to the right of some number, or to the left of it, is a solution of a simple inequality. A solution is no longer a point. It is a stretch of the line.
    - figure: number-line
      props: { min: -6, max: 6, start: 2 }
  derivation:
    - text: |
        **The four signs.** You met them in Python as comparisons.

        | Algebra | Read as | Python |
        | --- | --- | --- |
        | $a < b$ | $a$ is less than $b$ | `a < b` |
        | $a \le b$ | $a$ is less than or equal to $b$ | `a <= b` |
        | $a > b$ | $a$ is greater than $b$ | `a > b` |
        | $a \ge b$ | $a$ is greater than or equal to $b$ | `a >= b` |

        An **inequality** containing a variable is, like an equation, true for some values and false for others. Its **solutions** are the values that make it true, and there are usually infinitely many of them. So the answer to an inequality is itself a simpler inequality, such as $x > 3$, which describes the whole set of solutions at a glance.

        **Solving.** Proceed exactly as for an equation, with the one new rule.

        $$\begin{aligned} 7 - 2x &> 1 \\ -2x &> -6 && \text{subtract 7 from both sides} \\ x &< 3 && \text{divide both sides by } -2 \text{, and reverse the sign} \end{aligned}$$

        You can avoid the negative division altogether by moving the variable to the side where its coefficient is positive. Add $2x$ to both sides of the first line: $7 > 1 + 2x$, so $6 > 2x$, so $3 > x$. That is the same statement, read from the right.

        **Checking.** An inequality cannot be checked by one substitution, but it can be checked by three. The **boundary** value, here 3, should turn the inequality into an equality: $7 - 6 = 1$. Yes. A value on the claimed side, say $x = 0$, should make it true: $7 > 1$. Yes. A value on the other side, say $x = 5$, should make it false: $-3 > 1$. False, as it should be. If the sign had been left unreversed, the second and third checks would both have failed.

        A program can do the same on many values at once, by comparing the original inequality with the claimed solution:

        ```python
        for x in range(-10, 11):
            assert (7 - 2 * x > 1) == (x < 3), "they disagree"
        print("the two agree for every x tried")
        ```

        Each side of the `==` is a boolean. The assertion says that they are true together and false together, for every value tried.

        **Why a variable multiplier is dangerous.** Never multiply or divide an inequality by an expression whose sign you do not know. Multiplying both sides by $x$ would be safe if $x$ were positive, would reverse the sign if $x$ were negative, and would destroy the inequality if $x$ were zero. You would have to treat the cases separately.

        **Between two bounds.** Often a quantity must lie between two limits. The statement "$x$ is greater than $-1$ **and** at most 4" is written as a chain,

        $$-1 < x \le 4,$$

        and Python accepts the same chain: `-1 < x <= 4` means `-1 < x and x <= 4`. Such a set is an **interval**. It is drawn on the number line as a segment, with a hollow dot at an end that is left out and a solid dot at an end that is included.

        A chain can be solved by doing the same thing to all three parts:

        $$\begin{aligned} -3 \le 2x + 1 &< 9 \\ -4 \le 2x &< 8 && \text{subtract 1 throughout} \\ -2 \le x &< 4 && \text{divide by 2 throughout} \end{aligned}$$

        The opposite kind of set, "$x$ is less than $-2$ **or** greater than 2", is two separate rays. It cannot be written as a single chain, because no number is both. Write the word **or**.
    - question:
        id: solve-flip
        type: choice
        system: s2
        prompt: "Solve $5 - 3x \\le 20$. Then check your answer with a boundary value, a value on your side, and a value on the other side."
        options: ["$x \\le -5$", "$x \\ge -5$", "$x \\le 5$", "$x \\ge 5$"]
        answer: 1
        explanation: "Subtract 5: $-3x \\le 15$. Divide by $-3$ and reverse the sign: $x \\ge -5$. Checks: at $x = -5$ the left side is exactly 20. At $x = 0$ it is 5, and $5 \\le 20$ is true. At $x = -10$ it is 35, and $35 \\le 20$ is false."
    - text: |
        **Absolute value: size without direction.** How far is $-3$ from zero? Three steps. How far is 3 from zero? Three steps also. The **absolute value** of a number, written $|x|$, is its **distance from zero** on the number line. A distance is never negative.

        $$|3| = 3, \qquad |-3| = 3, \qquad |0| = 0.$$

        You have used it in Python as `abs`. As a rule for computing, it has two cases:

        $$|x| = \begin{cases} x & \text{if } x \ge 0, \\ -x & \text{if } x < 0. \end{cases}$$

        The second line troubles people, since $-x$ looks negative. It is not. When $x$ is negative, $-x$ is its opposite, which is positive: for $x = -3$, $-x = 3$.

        **The distance between two numbers.** How far apart are 2 and 7? Five. And $-3$ and 4? Seven. In general the distance between $a$ and $b$ is

        $$|a - b|,$$

        the difference with its sign thrown away, since it does not matter which is the larger: $|2 - 7| = |-5| = 5 = |7 - 2|$. Read $|x - 5|$ as "**the distance from $x$ to 5**" and half of this subject becomes plain.

        **Equations with absolute value.** $|x - 5| = 2$ asks: which numbers are at distance 2 from 5? Go two steps either way from 5: $x = 3$ or $x = 7$. Two solutions, one on each side. And $|x| = -1$ has no solution, since no distance is negative.

        **Closeness.** $|x - 5| < 2$ asks: which numbers are **within** 2 of 5? Everything strictly between 3 and 7.

        $$|x - 5| < 2 \quad\text{means}\quad 3 < x < 7.$$

        In general, for a positive number $r$, the statement $|x - a| < r$ means $a - r < x < a + r$: an interval with centre $a$ and half-width $r$. This is the precise language of tolerance. A rod that must be $50 \pm 0.2$ millimetres long satisfies $|L - 50| \le 0.2$.

        **Farness.** $|x - 5| > 2$ asks for the numbers **more** than 2 away from 5. That is everything outside the interval: $x < 3$ **or** $x > 7$. Two rays.

        **Why programs need this.** Run this.

        ```python
        print(0.1 + 0.2 == 0.3)
        print(abs((0.1 + 0.2) - 0.3) < 0.000000001)
        ```

        It shows False and then True. Decimals are stored in a computer only approximately, so two calculations that ought to agree may differ in the sixteenth digit. Asking whether floats are exactly equal is therefore the wrong question. The right question is whether they are **close**: whether the distance between them is below a small tolerance. You wrote that test last lesson, for the temperature round trip. Now you know what it says.
    - question:
        id: fix-is-close
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `is_close(a, b, tolerance)` should return True when the distance between `a` and `b` is less than `tolerance`. It gives the right answer for the first call below and the wrong one for the second, which shows True although 1.0 and 5.0 are far apart. Work out what the function computes when `a` is the smaller number, and fix it.
        starter: |
          def is_close(a, b, tolerance):
              return a - b < tolerance

          print(is_close(5.0, 1.0, 0.5))
          print(is_close(1.0, 5.0, 0.5))
        solution: |
          def is_close(a, b, tolerance):
              return abs(a - b) < tolerance

          print(is_close(5.0, 1.0, 0.5))
          print(is_close(1.0, 5.0, 0.5))
        tests: |
          assert is_close(5.0, 1.0, 0.5) == False, "5.0 and 1.0 are 4 apart, which is not within 0.5"
          assert is_close(1.0, 5.0, 0.5) == False, "1.0 and 5.0 are 4 apart, which is not within 0.5. What is a - b here, and is it less than 0.5?"
          assert is_close(0.1 + 0.2, 0.3, 0.000001) == True, "0.1 + 0.2 and 0.3 differ only in the last digits, so they are close"
          assert is_close(2.0, 2.4, 0.5) == True, "2.0 and 2.4 are 0.4 apart, which is within 0.5"
          assert is_close(2.4, 2.0, 0.5) == True, "The order of the two numbers should not matter"
          assert is_close(-1.0, 1.0, 1.5) == False, "-1.0 and 1.0 are 2 apart"
        wrong:
          - "def is_close(a, b, tolerance):\n    return abs(a) - abs(b) < tolerance\n\nprint(is_close(1.0, 5.0, 0.5))\n"
          - "def is_close(a, b, tolerance):\n    return abs(a - b) > tolerance\n\nprint(is_close(1.0, 5.0, 0.5))\n"
          - "def is_close(a, b, tolerance):\n    return a == b\n\nprint(is_close(1.0, 5.0, 0.5))\n"
        explanation: "With $a = 1$ and $b = 5$ the difference is $-4$, and $-4$ is less than any positive tolerance. A difference can be hugely negative. A distance cannot, and the distance is $|a - b|$."
  formal:
    - text: |
        For numbers $a$ and $b$, $a < b$ means that $b - a$ is positive. On the number line, $a$ lies to the left of $b$.

        **Properties of order.** For all numbers $a$, $b$ and $c$:

        | Move | Result |
        | --- | --- |
        | Add or subtract $c$ | if $a < b$ then $a + c < b + c$ |
        | Multiply or divide by $c > 0$ | if $a < b$ then $ac < bc$ |
        | Multiply or divide by $c < 0$ | if $a < b$ then $ac > bc$: **the sign reverses** |
        | Transitivity | if $a < b$ and $b < c$ then $a < c$ |

        The same hold with $\le$ in place of $<$.

        The reversal follows from the definition. If $a < b$ then $b - a$ is positive. For negative $c$, the product $c(b - a) = cb - ca$ is negative, so $ca - cb$ is positive, which says $cb < ca$.

        An **interval** is the set of numbers between two bounds. $a < x < b$ excludes both ends, $a \le x \le b$ includes both.

        The **absolute value** of $x$ is $|x| = x$ if $x \ge 0$ and $|x| = -x$ if $x < 0$. For all numbers $x$, $y$ and $a$, and for $r > 0$:

        | Fact | Statement |
        | --- | --- |
        | Never negative | $\lvert x \rvert \ge 0$, and $\lvert x \rvert = 0$ only when $x = 0$ |
        | Symmetric | $\lvert -x \rvert = \lvert x \rvert$, so $\lvert x - y \rvert = \lvert y - x \rvert$ |
        | Distance | $\lvert x - y \rvert$ is the distance between $x$ and $y$ |
        | Products | $\lvert xy \rvert = \lvert x \rvert \, \lvert y \rvert$ |
        | Equation | $\lvert x - a \rvert = r$ exactly when $x = a - r$ or $x = a + r$ |
        | Within | $\lvert x - a \rvert < r$ exactly when $a - r < x < a + r$ |
        | Outside | $\lvert x - a \rvert > r$ exactly when $x < a - r$ or $x > a + r$ |
        | Triangle inequality | $\lvert x + y \rvert \le \lvert x \rvert + \lvert y \rvert$ |
  drill:
    - text: Seconds each. Before dividing, look at the sign of the number you divide by.
    - question:
        id: drill-solve-plain
        type: choice
        system: s1
        prompt: "Solve $x + 4 > 1$."
        options: ["$x > 5$", "$x > -3$", "$x < -3$", "$x < 5$"]
        answer: 1
        explanation: Subtract 4 from both sides. Subtraction never reverses the sign.
    - question:
        id: drill-solve-positive
        type: choice
        system: s1
        prompt: "Solve $3x \\le 12$."
        options: ["$x \\le 4$", "$x \\ge 4$", "$x \\le 36$", "$x \\le 9$"]
        answer: 0
        explanation: Divide both sides by 3. The divisor is positive, so the sign stays.
    - question:
        id: drill-solve-negative
        type: choice
        system: s1
        prompt: "Solve $-x < 2$."
        options: ["$x < -2$", "$x > -2$", "$x < 2$", "$x > 2$"]
        answer: 1
        explanation: "Multiply both sides by $-1$ and reverse the sign."
    - question:
        id: drill-true-false
        type: choice
        system: s1
        prompt: "Which of these is true?"
        options: ["$-7 > -2$", "$-2 > -7$", "$-2 < -7$", "$0 < -1$"]
        answer: 1
        explanation: "$-2$ lies to the right of $-7$ on the number line."
    - question:
        id: drill-abs-value
        type: numeric
        system: s1
        prompt: "What is $|3 - 8|$?"
        answer: "5"
        explanation: "$3 - 8 = -5$, and its distance from zero is 5. Equally, 3 and 8 are 5 apart."
    - question:
        id: drill-abs-distance
        type: numeric
        system: s1
        prompt: "What is the distance between $-4$ and $6$ on the number line?"
        answer: "10"
        explanation: "$|-4 - 6| = |-10| = 10$."
    - question:
        id: drill-abs-equation
        type: choice
        system: s1
        prompt: "Which values of $x$ satisfy $|x - 1| = 4$?"
        options: ["Only 5", "5 and $-3$", "5 and 3", "4 and $-4$"]
        answer: 1
        explanation: "The numbers at distance 4 from 1 are $1 + 4 = 5$ and $1 - 4 = -3$."
    - question:
        id: drill-abs-within
        type: choice
        system: s1
        prompt: "$|x| < 3$ means the same as which of these?"
        options: ["$x < 3$", "$-3 < x < 3$", "$x < -3$ or $x > 3$", "$0 < x < 3$"]
        answer: 1
        explanation: "The numbers less than 3 away from zero lie between $-3$ and 3."
    - question:
        id: predict-chain
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          x = 4
          print(-1 < x <= 4, abs(x - 6) < 2)
        output: "True False"
        explanation: "4 is greater than $-1$ and at most 4, so the chain is True. The distance from 4 to 6 is exactly 2, which is not less than 2."
  work:
    - text: Slower now. Solve on paper, then check a boundary value and one value on each side.
    - question:
        id: work-chain
        type: choice
        system: s2
        prompt: "Solve $-5 < 1 - 2x \\le 7$."
        options: ["$-3 \\le x < 3$", "$-3 < x \\le 3$", "$-4 \\le x < 2$", "$3 < x \\le -3$"]
        answer: 0
        explanation: "Subtract 1 throughout: $-6 < -2x \\le 6$. Divide by $-2$ and reverse **both** signs: $3 > x \\ge -3$. Read from the right, that is $-3 \\le x < 3$. Check the ends: at $x = -3$ the middle is 7, which is allowed, and at $x = 3$ it is $-5$, which is not."
    - question:
        id: work-abs-solve
        type: choice
        system: s2
        prompt: "Solve $|2x - 6| \\le 4$."
        options: ["$x \\le 5$", "$1 \\le x \\le 5$", "$-5 \\le x \\le 5$", "$x \\le 1$ or $x \\ge 5$"]
        answer: 1
        explanation: "The statement says that $2x - 6$ is within 4 of zero: $-4 \\le 2x - 6 \\le 4$. Add 6 throughout: $2 \\le 2x \\le 10$. Divide by 2: $1 \\le x \\le 5$. As a distance: $|2x - 6| = 2|x - 3|$, so $x$ is within 2 of 3."
    - question:
        id: write-my-abs
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `my_abs(x)` that returns the absolute value of `x` from its two-case definition, without calling `abs`. Then write a function `distance(a, b)` that returns the distance between two numbers on the number line, using `my_abs`.
        starter: |
          def my_abs(x):
              # Replace the next line with your own.
              return 0

          def distance(a, b):
              # Replace the next line with your own.
              return 0

          print(my_abs(-3), distance(2, 7))
        solution: |
          def my_abs(x):
              if x < 0:
                  return -x
              return x

          def distance(a, b):
              return my_abs(a - b)

          print(my_abs(-3), distance(2, 7))
        tests: |
          assert "abs(" not in source.replace("my_abs(", ""), "Write the two cases yourself, without calling abs"
          assert my_abs(-3) == 3, "The absolute value of -3 is 3"
          assert my_abs(3) == 3, "The absolute value of 3 is 3"
          assert my_abs(0) == 0, "The absolute value of 0 is 0"
          assert my_abs(-0.5) == 0.5, "It should work for decimals"
          assert distance(2, 7) == 5, "2 and 7 are 5 apart"
          assert distance(7, 2) == 5, "The order should not matter: 7 and 2 are 5 apart"
          assert distance(-3, 4) == 7, "-3 and 4 are 7 apart"
          assert distance(-1, -6) == 5, "-1 and -6 are 5 apart"
        wrong:
          - "def my_abs(x):\n    if x < 0:\n        return -x\n    return x\n\ndef distance(a, b):\n    return my_abs(a) - my_abs(b)\n\nprint(my_abs(-3), distance(2, 7))\n"
          - "def my_abs(x):\n    return -x\n\ndef distance(a, b):\n    return my_abs(a - b)\n\nprint(my_abs(-3), distance(2, 7))\n"
          - "def my_abs(x):\n    if x < 0:\n        return -x\n    return x\n\ndef distance(a, b):\n    return b - a\n\nprint(my_abs(-3), distance(2, 7))\n"
        explanation: A negative number is replaced by its opposite and anything else is returned as it is. The distance is the absolute value of the difference, taken after subtracting and not before.
    - question:
        id: write-cheaper-plan
        type: code
        mode: write
        system: s2
        prompt: |
          Plan A costs a fixed `rent_a` and then `rate_a` per gigabyte. Plan B costs `rent_b` and then `rate_b` per gigabyte. Write a function `a_is_cheaper(g, rent_a, rate_a, rent_b, rate_b)` that returns True exactly when plan A costs strictly less than plan B for `g` gigabytes. Then solve $199 + 3g < 99 + 5g$ on paper and bind `threshold` to the boundary value of $g$, and bind `heavy_users` to True if A is the cheaper plan **above** the threshold, or False if it is cheaper below.
        starter: |
          def a_is_cheaper(g, rent_a, rate_a, rent_b, rate_b):
              # Replace the next line with your own.
              return False

          threshold = 0
          heavy_users = False
        solution: |
          def a_is_cheaper(g, rent_a, rate_a, rent_b, rate_b):
              return rent_a + rate_a * g < rent_b + rate_b * g

          threshold = 50
          heavy_users = True
        tests: |
          assert a_is_cheaper(60, 199, 3, 99, 5) == True, "For 60 GB plan A costs 379 and plan B costs 399, so A is cheaper"
          assert a_is_cheaper(10, 199, 3, 99, 5) == False, "For 10 GB plan A costs 229 and plan B costs 149, so A is not cheaper"
          assert a_is_cheaper(50, 199, 3, 99, 5) == False, "At 50 GB the two plans cost the same, so A is not strictly cheaper"
          assert a_is_cheaper(1, 10, 1, 20, 1) == True, "With equal rates the plan with the lower rent is always cheaper"
          assert a_is_cheaper(5, 0, 10, 30, 2) == False, "It should work for any two plans"
          assert threshold == 50, "Solve 199 + 3g < 99 + 5g. The boundary is where the two costs are equal."
          assert heavy_users == True, "Test a value above the threshold and one below. On which side is A cheaper? Remember what dividing by a negative does."
        wrong:
          - "def a_is_cheaper(g, rent_a, rate_a, rent_b, rate_b):\n    return rent_a + rate_a * g < rent_b + rate_b * g\n\nthreshold = 50\nheavy_users = False\n"
          - "def a_is_cheaper(g, rent_a, rate_a, rent_b, rate_b):\n    return rent_a + rate_a * g <= rent_b + rate_b * g\n\nthreshold = 50\nheavy_users = True\n"
          - "def a_is_cheaper(g, rent_a, rate_a, rent_b, rate_b):\n    return g > 50\n\nthreshold = 50\nheavy_users = True\n"
        explanation: "The function is the inequality itself, written out. On paper: subtract $3g$ and 99 from both sides to get $100 < 2g$, so $g > 50$. Keeping the coefficient of $g$ positive avoids the reversal that caught the puzzle out."
    - question:
        id: fix-inequality-solution
        type: code
        mode: find-bug
        system: s2
        prompt: |
          Someone has solved $10 - 4x \ge 2$ and claims the solution is $x \ge 2$. The function `claimed(x)` records that claim, and the loop compares it with the original inequality on many values. It fails. Solve the inequality correctly on paper, fix `claimed` so that it states the true solution, and leave `original` and the loop alone.
        starter: |
          def original(x):
              return 10 - 4 * x >= 2

          def claimed(x):
              return x >= 2

          for x in range(-10, 11):
              assert original(x) == claimed(x), "they disagree"
          print("the two agree for every x tried")
        solution: |
          def original(x):
              return 10 - 4 * x >= 2

          def claimed(x):
              return x <= 2

          for x in range(-10, 11):
              assert original(x) == claimed(x), "they disagree"
          print("the two agree for every x tried")
        tests: |
          assert original(0) == True and original(3) == False, "Leave the function original as it was"
          assert "10" not in source.split("def claimed(x):")[1].split("for x")[0], "State the solution in its simplest form, with x alone on one side"
          for _x in [-10, -1, 0, 1, 1.5, 2, 2.5, 3, 10]:
              assert claimed(_x) == original(_x), "The claim still disagrees with the inequality for some x. Check a value on each side of the boundary, and the boundary itself."
          assert output.strip().endswith("every x tried"), "The loop should run to the end without an assertion failing"
        wrong:
          - "def original(x):\n    return 10 - 4 * x >= 2\n\ndef claimed(x):\n    return x < 2\n\nprint(\"the two agree for every x tried\")\n"
          - "def original(x):\n    return 10 - 4 * x >= 2\n\ndef claimed(x):\n    return x <= -2\n\nprint(\"the two agree for every x tried\")\n"
          - "def original(x):\n    return 10 - 4 * x >= 2\n\ndef claimed(x):\n    return x >= -2\n\nprint(\"the two agree for every x tried\")\n"
        explanation: "Subtract 10: $-4x \\ge -8$. Divide by $-4$ and reverse the sign: $x \\le 2$. The boundary 2 is included, because the original sign allowed equality."
    - question:
        id: tolerance-interval
        type: numeric
        system: s2
        prompt: |
          A model's output is accepted when it is within 0.05 of the target 0.8, that is, when $|y - 0.8| \le 0.05$. What is the smallest accepted value of $y$?
        answer: "0.75"
        explanation: "The condition means $0.8 - 0.05 \\le y \\le 0.8 + 0.05$, the interval from 0.75 to 0.85."
    - question:
        id: why-flip
        type: choice
        system: s2
        prompt: |
          Why does multiplying both sides of an inequality by a negative number reverse the sign?
        options:
          - "It is a convention that mathematicians agreed on."
          - "Multiplying by a negative number reflects the number line in zero, and a reflection swaps left and right, so the number that was on the left ends up on the right."
          - "Because negative numbers are smaller than positive ones."
          - "It does not. The sign reverses only when dividing."
        answer: 1
        explanation: "$a < b$ says $a$ is to the left of $b$. Reflecting in zero and then stretching puts $ca$ to the right of $cb$. Division by a negative is multiplication by its negative reciprocal, so it reverses the sign for the same reason."
  connections:
    - text: |
        Solutions can now be whole stretches of the number line, and you have a precise way to say that two numbers are close. Both ideas run through everything that follows.

        Absolute value is the first and simplest measure of **error**. If a model predicts 7.5 and the truth is 8, its error is $|7.5 - 8| = 0.5$, and it is 0.5 whichever way the miss went. Averaging such errors over many predictions gives one of the standard ways of scoring a model. When you later measure the distance between points in a plane, and between lists of a thousand numbers, the formulas will be generalisations of $|a - b|$, and the triangle inequality in today's table will still hold for them.

        The statement $|x - a| < r$, "within $r$ of $a$", is the atom from which calculus is built. To say that a quantity approaches a limit is to say that it can be brought within **any** tolerance, however small. You will meet that sentence again, word for word.

        And you have seen why exact equality is the wrong test for floats. Every numerical program you write from now on will compare with a tolerance.

        So far every equation and inequality has had one unknown, and its solutions have lived on a line. An equation such as $y = 2x + 1$ has two unknowns, and its solutions are **pairs** of numbers. A line has no room for pairs. They need a second direction, and with it comes the picture that joins algebra to geometry: [[f1.coordinates-lines-and-slope]].
