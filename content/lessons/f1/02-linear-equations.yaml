concept: f1.linear-equations
minutes: 95
claim: You can solve any linear equation in one unknown by doing the same thing to both sides, check the solution by substitution, recognise equations with no solution or with every number as a solution, and rearrange a formula.
recalls: [f1.variables-and-expressions]
uses: [f0.the-four-operations-and-order-of-operations, f0.fractions-decimals-and-percentages, f0.negative-numbers, f0.fractions-decimals-and-percentages, s0.expressions, s0.booleans-and-conditionals, s0.loops, s0.functions, s0.reading-errors-and-debugging]
leads: [f1.inequalities]
starter: |
  # Scratch space. Check a solution by substitution.
  x = 4
  print(3 * x + 5 == 17)
parts:
  recall:
    - text: |
        In [[f1.variables-and-expressions]] you reshaped expressions without changing their value, and met the equation, a statement true for only some values. Today you find those values. Three quick pulls first.
  puzzle:
    - text: |
        A phone plan costs 199 rupees a month and then 3 rupees for every gigabyte of data. Last month's bill was 304 rupees. How many gigabytes were used?

        You could guess. Twenty gigabytes would cost $199 + 60 = 259$, which is too little. Forty would cost $199 + 120 = 319$, too much. Thirty gives 289, thirty-five gives 304. Found it, at the fourth try.

        Guessing worked because the answer was a small whole number. Had the bill been 304.75, or the rate 2.99, you might have guessed all afternoon. And a program that guessed would need to be told how finely to guess, and when to stop.

        Write $g$ for the number of gigabytes. The bill says

        $$3g + 199 = 304.$$

        The unknown is wrapped inside an expression: it has been multiplied by 3 and then had 199 added. **Is there a way to unwrap it, reasoning directly from the equation to the answer?**
  intuition:
    - text: |
        Picture an old-fashioned pair of scales, with a pan on each side, sitting level. On the left pan are three identical sealed bags and 199 loose one-gram weights. On the right are 304 loose weights. The scales balance. How heavy is one bag?

        The one thing you know about scales is this: **if they balance, and you do the same thing to both pans, they still balance.**

        So take 199 weights off each pan. On the left only the three bags remain. On the right there are $304 - 199 = 105$ weights. Still level.

        Now replace what is in each pan by a third of it. One bag on the left, $105 \div 3 = 35$ weights on the right. Still level. A bag weighs 35.

        In symbols, the same two moves:

        $$\begin{aligned} 3g + 199 &= 304 \\ 3g &= 105 && \text{subtract 199 from both sides} \\ g &= 35 && \text{divide both sides by 3} \end{aligned}$$

        Look at the choice of moves. The expression $3g + 199$ was built from $g$ in two steps: multiply by 3, then add 199. It was taken apart by **undoing** those steps in the **reverse** order: first undo the adding, by subtracting, then undo the multiplying, by dividing. It is like taking off shoes and socks. The shoes went on last, so they come off first.

        An equation is a balance. Solving it is unwrapping the unknown, one layer at a time, doing to both sides whatever undoes the outermost layer.
  derivation:
    - text: |
        **What a solution is.** A **solution** of an equation is a value of the variable that makes the equation true. To **solve** an equation is to find all of its solutions. This gives you something precious: **a solution can always be checked**. Substitute it into the original equation and see whether the two sides agree.

        $$3 \times 35 + 199 = 105 + 199 = 304. \checkmark$$

        A check takes seconds and catches nearly every slip. In Python it is a single comparison: `3 * 35 + 199 == 304` is `True`. Never hand in a solution you have not substituted back.

        **Why the method is sound.** Each move replaces the equation by a new one. The moves allowed are those that give an equation with **exactly the same solutions**:

        - adding the same number, or the same expression, to both sides, or subtracting it;
        - multiplying or dividing both sides by the same number, provided that number is **not zero**.

        If two quantities are equal, they remain equal after the same thing is done to each. And each of these moves can be undone by its opposite move, so no solution is lost and none is invented. Multiplying by zero is forbidden because it cannot be undone: it turns every equation, true or false, into $0 = 0$.

        **Unknown on both sides.** When the variable appears on both sides, first gather its terms on one side.

        $$\begin{aligned} 5x - 3 &= 2x + 9 \\ 3x - 3 &= 9 && \text{subtract } 2x \text{ from both sides} \\ 3x &= 12 && \text{add 3 to both sides} \\ x &= 4 && \text{divide both sides by 3} \end{aligned}$$

        Check in the **original** equation, both sides: $5 \times 4 - 3 = 17$ and $2 \times 4 + 9 = 17$. They agree.

        **Brackets.** Expand first, then proceed as before.

        $$\begin{aligned} 2(x - 3) &= 5 - (x + 2) \\ 2x - 6 &= 3 - x && \text{expand both sides and collect} \\ 3x &= 9 && \text{add } x \text{ and add 6} \\ x &= 3 \end{aligned}$$

        **Fractions.** Fractions are cleared by multiplying both sides by a number that all the denominators divide. Every term must be multiplied.

        $$\begin{aligned} \frac{x}{2} + \frac{x}{3} &= 10 \\ 3x + 2x &= 60 && \text{multiply both sides by 6} \\ 5x &= 60 \\ x &= 12 \end{aligned}$$

        Check: $6 + 4 = 10$.

        **A negative coefficient.** Nothing changes. To undo multiplication by $-2$, divide by $-2$: from $-2x = 10$ follows $x = -5$.
    - question:
        id: solve-both-sides
        type: numeric
        system: s2
        prompt: "Solve $7x + 4 = 3x - 10$. Check your answer in the original equation before you submit it. Give an exact answer."
        answer: "-7/2"
        explanation: "Subtract $3x$ from both sides: $4x + 4 = -10$. Subtract 4: $4x = -14$. Divide by 4: $x = -\\frac{14}{4} = -\\frac{7}{2}$. Check: the left side is $-24.5 + 4 = -20.5$ and the right side is $-10.5 - 10 = -20.5$."
    - text: |
        **The general case.** Every equation above, once expanded and collected, takes the form

        $$ax + b = c.$$

        Solve it once with letters and you have solved them all. Subtract $b$ from both sides, then divide by $a$:

        $$x = \frac{c - b}{a}.$$

        That is a formula, and a formula is a function waiting to be written.

        ```python
        def solve(a, b, c):
            return (c - b) / a

        x = solve(3, 199, 304)
        print(x)
        print(3 * x + 199 == 304)
        ```

        This shows 35.0 and True. The division by $a$ is allowed only when $a$ is not zero, and that restriction turns out to be the interesting part.

        **When there is no solution, and when there are too many.** Try to solve $2x + 3 = 2x + 5$. Subtract $2x$ from both sides and you are left with

        $$3 = 5.$$

        The variable has vanished and what remains is false. No mistake has been made. The moves preserve solutions, so the original equation has exactly as many solutions as $3 = 5$ has, which is none. And that makes sense: the equation asks for a number which, doubled and raised by 3, equals the same number doubled and raised by 5.

        Now try $2(x + 1) = 2x + 2$. Expanding the left side gives $2x + 2 = 2x + 2$, and subtracting $2x$ leaves $2 = 2$, which is true whatever $x$ was. **Every** number is a solution. The equation was an identity in disguise.

        So a linear equation has exactly one solution, or none, or every number. In the form $ax + b = c$: one solution when $a \neq 0$; and when $a = 0$ the equation reads $b = c$, with no solution if that is false and every number if it is true. The forbidden division by zero is precisely where the two odd cases live.

        **Rearranging a formula.** The same moves work when the "numbers" are letters. A formula such as

        $$F = \frac{9}{5}C + 32$$

        gives the Fahrenheit temperature from the Celsius one. To go the other way, solve for $C$, treating $F$ as if it were a known number. Subtract 32, then multiply by $\frac{5}{9}$:

        $$C = \frac{5}{9}(F - 32).$$

        This is called **making $C$ the subject**. It is solving an equation in which the answer is an expression instead of a number.

        **From words to an equation.** Most equations do not arrive ready-made. The method is always the same. Name the unknown with a letter, and say in words what it stands for, with its unit. Translate each fact into an expression. Find two expressions that the story says are equal. Solve. Then check the answer against the **story** and not just the equation, because the translation is where mistakes are made.
    - question:
        id: fix-solver
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `solve(a, b, c, d)` should return the solution of $ax + b = cx + d$, and you may assume $a \neq c$. The check below it finds that the value returned for $5x - 3 = 2x + 9$ is not a solution. Solve the general equation on paper, keeping track of which side each term ends up on, and fix the formula.
        starter: |
          def solve(a, b, c, d):
              return (d + b) / (a - c)

          x = solve(5, -3, 2, 9)
          print(x)
          print(5 * x - 3 == 2 * x + 9)
        solution: |
          def solve(a, b, c, d):
              return (d - b) / (a - c)

          x = solve(5, -3, 2, 9)
          print(x)
          print(5 * x - 3 == 2 * x + 9)
        tests: |
          assert solve(5, -3, 2, 9) == 4, "The solution of 5x - 3 = 2x + 9 is 4. When b moves to the other side, what happens to its sign?"
          assert solve(1, 0, 0, 7) == 7, "The solution of x = 7 is 7"
          assert solve(2, 6, 0, 0) == -3, "The solution of 2x + 6 = 0 is -3"
          assert solve(3, 1, 5, 1) == 0, "The solution of 3x + 1 = 5x + 1 is 0"
          assert solve(1, 2, 3, 4) == -1, "The solution of x + 2 = 3x + 4 is -1"
        wrong:
          - "def solve(a, b, c, d):\n    return (d - b) / (a + c)\n\nx = solve(5, -3, 2, 9)\n"
          - "def solve(a, b, c, d):\n    return (b - d) / (a - c)\n\nx = solve(5, -3, 2, 9)\n"
          - "def solve(a, b, c, d):\n    return 4\n\nx = solve(5, -3, 2, 9)\n"
        explanation: "Subtract $cx$ from both sides to get $(a - c)x + b = d$, then subtract $b$ to get $(a - c)x = d - b$. The constant $b$ is subtracted from both sides, so it appears on the right with a minus sign."
  formal:
    - text: |
        An **equation** is a statement that two expressions are equal. A **solution** is a value of the variable for which the statement is true. Two equations are **equivalent** if they have exactly the same solutions.

        **Balance principles.** For any expressions $A$ and $B$ and any number or expression $k$:

        - $A = B$ is equivalent to $A + k = B + k$ and to $A - k = B - k$;
        - if $k \neq 0$, $A = B$ is equivalent to $kA = kB$ and to $\dfrac{A}{k} = \dfrac{B}{k}$.

        A **linear equation** in $x$ is one equivalent to $ax + b = c$ for some numbers $a$, $b$ and $c$.

        | Case | Solutions |
        | --- | --- |
        | $a \neq 0$ | exactly one, $x = \dfrac{c - b}{a}$ |
        | $a = 0$ and $b \neq c$ | none |
        | $a = 0$ and $b = c$ | every number |

        **Procedure.** (1) Clear fractions by multiplying both sides by a common multiple of the denominators. (2) Expand brackets. (3) Collect like terms on each side. (4) Gather the variable terms on one side and the constants on the other. (5) Divide by the coefficient of the variable. (6) Check by substituting into the original equation.

        To **make a variable the subject** of a formula is to solve the formula for that variable, treating the other letters as known numbers.
  drill:
    - text: Seconds each. Name the move before you make it.
    - question:
        id: solve-one-step-add
        type: numeric
        system: s1
        prompt: "Solve $x + 9 = 4$."
        answer: "-5"
        explanation: Subtract 9 from both sides.
    - question:
        id: solve-one-step-multiply
        type: numeric
        system: s1
        prompt: "Solve $6x = 42$."
        answer: "7"
        explanation: Divide both sides by 6.
    - question:
        id: solve-two-step
        type: numeric
        system: s1
        prompt: "Solve $2x - 5 = 11$."
        answer: "8"
        explanation: "Add 5 to both sides to get $2x = 16$, then divide by 2."
    - question:
        id: solve-negative-coefficient
        type: numeric
        system: s1
        prompt: "Solve $-3x = 12$."
        answer: "-4"
        explanation: "Divide both sides by $-3$."
    - question:
        id: solve-division
        type: numeric
        system: s1
        prompt: "Solve $\\dfrac{x}{4} = 3$."
        answer: "12"
        explanation: Multiply both sides by 4.
    - question:
        id: first-move
        type: choice
        system: s1
        prompt: "To solve $5x + 2 = 17$, which move comes first?"
        options: ["Divide both sides by 5", "Subtract 2 from both sides", "Add 2 to both sides", "Subtract 17 from both sides"]
        answer: 1
        explanation: The addition of 2 was the last thing done to build the left side, so it is undone first.
    - question:
        id: predict-check
        type: predict
        system: s1
        prompt: "Someone claims that $x = 3$ solves $4x - 2 = 3x + 2$. What does the check show?"
        code: |
          x = 3
          print(4 * x - 2, 3 * x + 2, 4 * x - 2 == 3 * x + 2)
        output: "10 11 False"
        explanation: The two sides are 10 and 11, so 3 is not a solution. The solution is 4.
    - question:
        id: how-many-solutions
        type: choice
        system: s1
        prompt: "How many solutions has $x + 1 = x + 2$?"
        options: ["None", "Exactly one", "Exactly two", "Every number is a solution"]
        answer: 0
        explanation: "Subtracting $x$ from both sides leaves $1 = 2$, which is false. No number is one more than itself and also two more than itself."
    - question:
        id: subject-simple
        type: choice
        system: s1
        prompt: "Make $t$ the subject of $d = st$, where $s \\neq 0$."
        options: ["$t = ds$", "$t = \\dfrac{d}{s}$", "$t = \\dfrac{s}{d}$", "$t = d - s$"]
        answer: 1
        explanation: "The $t$ has been multiplied by $s$. Divide both sides by $s$."
  work:
    - text: Slower now. Write one move per line, saying what you did to both sides. Check every answer in the original equation.
    - question:
        id: solve-brackets
        type: numeric
        system: s2
        prompt: "Solve $3(x - 2) = 2(x + 1) + 5$."
        answer: "13"
        explanation: "Expand: $3x - 6 = 2x + 7$. Subtract $2x$: $x - 6 = 7$. Add 6: $x = 13$. Check: the left side is $3 \\times 11 = 33$, and the right side is $2 \\times 14 + 5 = 33$."
    - question:
        id: solve-fractions
        type: numeric
        system: s2
        prompt: "Solve $\\dfrac{x}{3} - \\dfrac{x}{4} = 2$."
        answer: "24"
        explanation: "Multiply both sides by 12, a common multiple of 3 and 4: $4x - 3x = 24$, so $x = 24$. Check: $8 - 6 = 2$."
    - question:
        id: write-solve-general
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `solve(a, b, c)` for the equation $ax + b = c$ that handles all three cases. When there is exactly one solution, return it as a number. When there is no solution, return the string `"none"`. When every number is a solution, return the string `"all"`.
        starter: |
          def solve(a, b, c):
              # Replace the next line with your own.
              return 0

          print(solve(3, 199, 304))
          print(solve(0, 3, 5))
          print(solve(0, 2, 2))
        solution: |
          def solve(a, b, c):
              if a != 0:
                  return (c - b) / a
              if b == c:
                  return "all"
              return "none"

          print(solve(3, 199, 304))
          print(solve(0, 3, 5))
          print(solve(0, 2, 2))
        tests: |
          assert solve(3, 199, 304) is not None, "The function returns None. Does every path reach a return?"
          assert solve(3, 199, 304) == 35, "3x + 199 = 304 has the solution 35"
          assert solve(2, 0, 5) == 2.5, "2x = 5 has the solution 2.5"
          assert solve(-2, 4, 10) == -3, "-2x + 4 = 10 has the solution -3"
          assert solve(0, 3, 5) == "none", "0x + 3 = 5 says 3 = 5, which is never true, so return the string none"
          assert solve(0, 2, 2) == "all", "0x + 2 = 2 says 2 = 2, which is true for every x, so return the string all"
          assert solve(4, 7, 7) == 0, "4x + 7 = 7 has the solution 0. Zero is a perfectly good solution, and here a is not zero."
        wrong:
          - "def solve(a, b, c):\n    return (c - b) / a\n\nprint(solve(3, 199, 304))\n"
          - "def solve(a, b, c):\n    if a != 0:\n        return (c - b) / a\n    return \"none\"\n\nprint(solve(3, 199, 304))\n"
          - "def solve(a, b, c):\n    if b == c:\n        return \"all\"\n    if a == 0:\n        return \"none\"\n    return (c - b) / a\n\nprint(solve(3, 199, 304))\n"
        explanation: The division is safe exactly when $a$ is not zero. When $a$ is zero the equation no longer mentions $x$, and reads $b = c$, which is either always true or never true. The order of the tests matters, since $b = c$ with a non-zero $a$ is the ordinary case with the solution 0.
    - question:
        id: write-to-celsius
        type: code
        mode: write
        system: s2
        prompt: |
          The function `to_fahrenheit(c)` is given. Make $C$ the subject of $F = \frac{9}{5}C + 32$ on paper, and write the function `to_celsius(f)` that undoes it. Then add a loop that asserts, for every whole number `c` from -40 to 100, that converting to Fahrenheit and back gives `c` again to within 0.000001. Floats are not always exact, so compare with `abs(...) < 0.000001` instead of `==`.
        starter: |
          def to_fahrenheit(c):
              return 9 / 5 * c + 32

          def to_celsius(f):
              # Replace the next line with your own.
              return 0
        solution: |
          def to_fahrenheit(c):
              return 9 / 5 * c + 32

          def to_celsius(f):
              return 5 / 9 * (f - 32)

          for c in range(-40, 101):
              assert abs(to_celsius(to_fahrenheit(c)) - c) < 0.000001, "round trip failed"
        tests: |
          assert to_fahrenheit(100) == 212, "Leave to_fahrenheit as it was"
          assert abs(to_celsius(212) - 100) < 1e-9, "212 degrees Fahrenheit is 100 degrees Celsius"
          assert abs(to_celsius(32) - 0) < 1e-9, "32 degrees Fahrenheit is 0 degrees Celsius. Which operation must be undone first?"
          assert abs(to_celsius(-40) - (-40)) < 1e-9, "-40 is the same on both scales"
          assert abs(to_celsius(50) - 10) < 1e-9, "50 degrees Fahrenheit is 10 degrees Celsius"
          assert "assert" in source and "for" in source, "Add the loop that asserts the round trip for every c from -40 to 100"
        wrong:
          - "def to_fahrenheit(c):\n    return 9 / 5 * c + 32\n\ndef to_celsius(f):\n    return 5 / 9 * f - 32\n\nfor c in range(-40, 101):\n    assert True\n"
          - "def to_fahrenheit(c):\n    return 9 / 5 * c + 32\n\ndef to_celsius(f):\n    return 9 / 5 * (f - 32)\n\nfor c in range(-40, 101):\n    assert True\n"
          - "def to_fahrenheit(c):\n    return 9 / 5 * c + 32\n\ndef to_celsius(f):\n    return 5 / 9 * (f - 32)\n"
        explanation: The formula multiplies by nine fifths and then adds 32. Undoing it in reverse order, subtract 32 first and then multiply by five ninths. The brackets carry the order. A round-trip test like this one is a standard way to check that one function is the inverse of another.
    - question:
        id: fix-word-problem
        type: code
        mode: find-bug
        system: s2
        prompt: |
          A taxi charges a fixed 50 rupees and then 12 rupees a kilometre. `distance(fare)` should return how far you can travel for a given fare, by solving $12k + 50 = \text{fare}$. For a fare of 290 the answer should be 20 kilometres, and the check on the last line should show True. Find the slip in the order of the undoing, and fix the function.
        starter: |
          def distance(fare):
              return fare / 12 - 50

          k = distance(290)
          print(k)
          print(12 * k + 50 == 290)
        solution: |
          def distance(fare):
              return (fare - 50) / 12

          k = distance(290)
          print(k)
          print(12 * k + 50 == 290)
        tests: |
          assert distance(290) == 20, "For a fare of 290 the distance is 20 km"
          assert distance(50) == 0, "A fare of 50 is the fixed charge alone, so the distance is 0"
          assert distance(62) == 1, "A fare of 62 pays for 1 km"
          assert distance(650) == 50, "It should work for any fare"
        wrong:
          - "def distance(fare):\n    return fare - 50 / 12\n\nk = distance(290)\n"
          - "def distance(fare):\n    return (fare + 50) / 12\n\nk = distance(290)\n"
          - "def distance(fare):\n    return 20\n\nk = distance(290)\n"
        explanation: The fare was built by multiplying by 12 and then adding 50. To undo it, subtract 50 first and then divide by 12. The starter divided first, which undoes the layers in the wrong order.
    - question:
        id: word-ages
        type: numeric
        system: s2
        prompt: |
          Three consecutive whole numbers add up to 114. What is the smallest of them? Name the smallest $n$, write the other two in terms of $n$, and form an equation.
        answer: "37"
        explanation: "The numbers are $n$, $n + 1$ and $n + 2$, so $3n + 3 = 114$, giving $3n = 111$ and $n = 37$. Check against the story: $37 + 38 + 39 = 114$."
    - question:
        id: solving-order
        type: order
        system: s2
        prompt: "Put the lines of this solution of $\\dfrac{2x + 1}{3} = x - 2$ in order."
        steps:
          - "$\\dfrac{2x + 1}{3} = x - 2$"
          - "$2x + 1 = 3x - 6$, multiplying both sides by 3"
          - "$1 = x - 6$, subtracting $2x$ from both sides"
          - "$7 = x$, adding 6 to both sides"
          - "Check: the left side is $\\dfrac{15}{3} = 5$ and the right side is $7 - 2 = 5$."
        explanation: Clear the fraction first, remembering that the whole right-hand side is multiplied by 3. Then gather the variable terms, then the constants, and check last.
    - question:
        id: no-solution-meaning
        type: choice
        system: s2
        prompt: |
          While solving an equation correctly, you arrive at the line $0 = 6$. What should you conclude?
        options:
          - "You have made a mistake, because 0 is not 6."
          - "The solution is x = 6."
          - "The original equation has no solution, since every line has the same solutions as the first and this one is never true."
          - "Every number is a solution."
        answer: 2
        explanation: Each permitted move keeps the set of solutions unchanged. The last line is true for no value of the variable, so the same is true of the first.
  connections:
    - text: |
        You can now go straight from a linear equation to its solution, and you know what it means when the method ends in nonsense or in a truism. The two ideas underneath, that an equation is a balance and that solving is undoing in reverse order, will carry you through every kind of equation you ever meet. Only the operations to be undone will change.

        Undoing has a mathematical name, the **inverse**, and it will keep returning: square roots undo squares, and in a few lessons logarithms will undo powers. The round-trip test you wrote for the temperature formulas is the working definition of an inverse.

        Fitting a model to data is, at heart, solving equations: find the values of the model's numbers that make its predictions equal the observations as nearly as possible. With one unknown you have just learnt to do it exactly. With millions there is rarely an exact solution, and the unknowns are found by a loop that improves them step by step. The idea of substituting back and measuring how far the two sides are apart, which you used today as a check, becomes the thing that loop tries to shrink.

        An equation asks where two expressions are equal. Often the real question is where one is **larger**: when does this plan become cheaper than that one, which inputs keep an error below a limit? Balances then become comparisons, and one of the moves you used freely today acquires a twist. That is the next lesson, [[f1.inequalities]].
