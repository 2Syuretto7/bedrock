concept: f1.exponents-and-exponential-growth
minutes: 110
claim: You can simplify expressions with the laws of exponents, explain why they force negative exponents to be reciprocals and fractional exponents to be roots, recognise exponential growth by its constant ratio, compute compound and continuous growth, and say where the number e comes from.
recalls: [f1.composition-and-inverses]
uses: [f0.powers-and-roots, f0.powers-of-two, f0.fractions-decimals-and-percentages, f0.negative-numbers, f0.estimation-and-back-of-the-envelope-reasoning, h0.unsigned-integers-and-fixed-widths, f1.variables-and-expressions, f1.linear-equations, f1.inequalities, f1.coordinates-lines-and-slope, f1.functions-as-machines, s0.expressions, s0.booleans-and-conditionals, s0.loops, s0.functions, s0.reading-errors-and-debugging]
leads: [f1.logarithms]
starter: |
  # Scratch space. Interest paid more and more often on one rupee at 100%.
  for n in [1, 2, 4, 12, 365]:
      print(n, (1 + 1 / n) ** n)
parts:
  recall:
    - text: |
        In [[f1.composition-and-inverses]] you joined functions and ran them backwards. Today one family of functions is studied for its own sake: raising a fixed number to a variable power. Its inverse comes next lesson. Two quick pulls first.
  puzzle:
    - text: |
        A bank, in a generous mood, offers **100% interest a year**. Put in ₹1 and at the end of the year you have ₹2.

        You ask for the interest to be paid in two halves instead: 50% after six months and 50% at the end. It sounds like the same thing. It is not. After six months you have ₹1.50, and the second 50% is paid on **that**:

        $$1 \;\longrightarrow\; 1.5 \;\longrightarrow\; 2.25.$$

        Twenty-five paise more, because for the second half of the year your interest earned interest. So you push. Four payments of 25%:

        $$1.25^4 = 2.4414\ldots$$

        Twelve monthly payments of $\tfrac{100}{12}$%: about 2.6130. Better every time. The bank's clerk is getting nervous, and so should you be getting excited. If the interest is paid every day, every hour, every second, **does the total grow without limit?** Could you become arbitrarily rich in one year from one rupee, just by asking for the interest to be chopped finely enough?

        Each finer division helps. But each helps less than the one before. Whether a sum of ever-smaller improvements can be boundless is not obvious, and the answer to this particular case was found by Jacob Bernoulli in 1683. It is one of the most important numbers there is.
  intuition:
    - text: |
        The figure shows your balance through the year. The blue staircase is the bank's version: flat, then a jump each time interest is paid. Step through "how often", from once a year to once an hour.
    - figure: growth
      props: { start: 1 }
    - text: |
        Two things happen as the payments become more frequent. The steps become too small to see, so the staircase becomes a smooth curve. And the final balance does **not** run away. It creeps up towards a ceiling just above ₹2.71 and stays there.

        Why is there a ceiling? Because the two effects of chopping more finely pull against each other. There are more payments, which helps. But each payment is smaller, which hurts. Twice as many payments of half the size very nearly cancel out. What survives is only the "interest on interest", and there is a limited amount of that to be had in one year.

        The smooth curve is what you get in the limit: money that earns interest **continuously**, at every instant, on everything it has earned up to that instant. Its rule is the simplest growth law there could be:

        > **At every moment, the rate of growth is equal to the current amount.**

        More money, faster growth, in exact proportion. That one sentence describes money at continuous interest, bacteria with unlimited food, a rumour in a large crowd, a chain reaction. The amount after one unit of time, starting from 1, is the same number in all of them. It is called $e$:

        $$e = 2.718281828\ldots$$

        It is not a number somebody chose. Like $\pi$, it was found.
  derivation:
    - text: |
        **The laws for whole exponents.** For a whole number $n \geq 1$, $a^n$ means $n$ copies of $a$ multiplied together. Everything follows from counting copies.

        *Multiplying powers of the same base.* $a^m \times a^n$ is $m$ copies followed by $n$ more:

        $$a^m \times a^n = a^{m + n}.$$

        *Dividing powers of the same base.* Each copy below cancels one above:

        $$\frac{a^5}{a^2} = \frac{a \times a \times a \times a \times a}{a \times a} = a^3, \qquad\text{in general}\qquad \frac{a^m}{a^n} = a^{m - n}.$$

        *A power of a power.* $(a^2)^3$ is three copies of $a^2$, which is $a^2 \times a^2 \times a^2 = a^6$. There are 3 groups of 2 copies:

        $$(a^m)^n = a^{mn}.$$

        *A power of a product, and of a quotient.* $(ab)^3 = ab \times ab \times ab$, and since order does not matter in multiplication the $a$'s and $b$'s can be gathered:

        $$(ab)^n = a^n b^n, \qquad \left(\frac{a}{b}\right)^n = \frac{a^n}{b^n}.$$

        Keep the first and third laws apart. **Multiplying** powers **adds** exponents: $x^2 \times x^3 = x^5$. **Raising** a power to a power **multiplies** them: $(x^2)^3 = x^6$.

        **What the laws do not say.** There is no law for a **sum** of powers. $a^2 + a^3$ cannot be simplified, and $(a + b)^2$ is not $a^2 + b^2$, as you know. The laws concern multiplication only. Nor does anything combine powers with **different bases and different exponents**: $2^3 \times 5^2$ is just 200.

        **Zero and negative exponents.** You derived these in arithmetic. Put $m = n$ in the division law: $\frac{a^n}{a^n} = a^0$, and a number divided by itself is 1. Put $m = 0$: $\frac{1}{a^n} = a^{-n}$.

        $$a^0 = 1, \qquad a^{-n} = \frac{1}{a^n} \qquad (a \neq 0).$$

        A negative exponent means a reciprocal. It never makes the value negative. With these, all five laws hold for every integer exponent, and they let an expression be tidied in whichever direction is convenient:

        $$\frac{6x^5 y^2}{2x^2 y^3} = 3x^{5 - 2}y^{2 - 3} = 3x^3 y^{-1} = \frac{3x^3}{y}.$$
    - question:
        id: simplify-mixed
        type: choice
        system: s2
        prompt: "Simplify $\\dfrac{(2x^3)^2}{4x^{-1}}$."
        options: ["$x^5$", "$x^7$", "$\\dfrac{x^6}{2}$", "$x^4$"]
        answer: 1
        explanation: "The power of a product gives $(2x^3)^2 = 2^2 x^6 = 4x^6$. Dividing, $\\dfrac{4x^6}{4x^{-1}} = x^{6 - (-1)} = x^7$. Check with $x = 2$: the top is $(16)^2 = 256$, the bottom is $4 \\times \\frac{1}{2} = 2$, and $256 \\div 2 = 128 = 2^7$."
    - text: |
        **Fractional exponents.** Python will tell you that `9 ** 0.5` is `3.0`. But on the reading "copies multiplied together", $9^{0.5}$ is half a nine multiplied together, which is nonsense. Nobody **decided** that a half should mean a root. The meaning was forced, in the same way as the meaning of $a^0$: by demanding that the laws keep working. Whatever $9^{1/2}$ is, call it $r$. If exponents are to go on adding, then $r \times r = 9^{1/2 + 1/2} = 9^1 = 9$, so $r$ is a number whose square is 9. In general, use the power-of-a-power law:

        $$\left(a^{1/n}\right)^n = a^{\frac{1}{n} \times n} = a^1 = a.$$

        So $a^{1/n}$ is a number whose $n$th power is $a$. That is the **$n$th root**:

        $$a^{1/2} = \sqrt{a}, \qquad a^{1/3} = \sqrt[3]{a}, \qquad a^{1/n} = \sqrt[n]{a}.$$

        For example $8^{1/3} = 2$, because $2^3 = 8$. For a positive $a$ there are two numbers whose square is $a$, and by convention $a^{1/2}$ means the positive one.

        What about a fraction with a numerator other than 1? Since $\frac{m}{n} = \frac{1}{n} \times m$, the same law gives

        $$a^{m/n} = \left(a^{1/n}\right)^m = \left(\sqrt[n]{a}\right)^m.$$

        **Root first, then power**, because the root makes the number smaller and the arithmetic easier:

        $$8^{2/3} = \left(8^{1/3}\right)^2 = 2^2 = 4, \qquad 16^{-3/4} = \frac{1}{\left(16^{1/4}\right)^3} = \frac{1}{2^3} = \frac{1}{8}.$$

        Read a fractional exponent in three parts: the **denominator** is a root, the **numerator** is a power, and a **minus sign** is a reciprocal.

        The laws of exponents hold for these too, which makes roots much easier to handle. The awkward-looking $\sqrt{x} \times \sqrt[3]{x}$ is just $x^{1/2} \times x^{1/3} = x^{5/6}$.

        One restriction. Fractional powers are safe only for a **positive** base. $(-4)^{1/2}$ would be a number whose square is $-4$, and you know there is none on the number line. Python gives a strange answer for `(-4) ** 0.5`, a so-called complex number, for exactly this reason.

        **Any exponent at all.** What is $2^{1.5}$? It is $2^{3/2} = (\sqrt{2})^3$, about 2.83. And $2^{1.41}$ is $2^{141/100}$, the hundredth root of 2 raised to the 141st power, a perfectly definite number. Any decimal exponent is a fraction, so it has a meaning. As the exponent slides smoothly from 1 to 2, the value $2^x$ slides smoothly from 2 to 4. The gaps between the whole-number powers have been filled in, and $2^x$ has become a smooth curve defined for every $x$. That is what lets `**` accept a float.

        **Exponential functions.** Fix a base $b > 0$ with $b \ne 1$. The **exponential function with base $b$** is

        $$f(x) = b^x, \quad \text{for every real } x.$$

        The variable is in the **exponent**. Do not confuse this with a power function such as $x^2$, where the variable is the base. The laws above gave $b^x$ a meaning for whole, negative and fractional $x$. For every other real $x$, such as $\sqrt{2}$, the value is fixed by filling in the gaps so that the curve has no jumps. What you need to know is that every law of exponents continues to hold for all real exponents.

        Four facts follow at once, for every base.

        - $f(0) = b^0 = 1$. Every exponential curve passes through $(0, 1)$.
        - $b^x > 0$ always. The curve never touches the horizontal axis.
        - If $b > 1$ the function is strictly increasing: **growth**. If $0 < b < 1$ it is strictly decreasing: **decay**. In both cases different inputs give different outputs.
        - Its range is every positive number, and by [[f1.composition-and-inverses]] it therefore has an inverse from the positive numbers back to all real numbers. That inverse is the logarithm, the subject of the next lesson.

        **The signature of an exponential.** Compare what happens when the input takes equal steps.

        | $x$ | 0 | 1 | 2 | 3 | 4 |
        | --- | --- | --- | --- | --- | --- |
        | linear, $3x + 1$ | 1 | 4 | 7 | 10 | 13 |
        | exponential, $3^x$ | 1 | 3 | 9 | 27 | 81 |

        The line **adds** the same amount for each step: constant difference. The exponential **multiplies** by the same amount for each step: constant ratio. This follows from the first law of exponents,

        $$f(x + h) = b^{x + h} = b^h \cdot b^x = b^h \cdot f(x),$$

        and it is the defining property. A step of $h$ in the input multiplies the output by $b^h$, no matter where you start. A quantity grows exponentially exactly when it grows by the same **percentage** in every equal period of time. A population that grows by 2% a year is exponential, with $b = 1.02$. In everyday speech "exponential" is used for "very fast". In mathematics it means "constant ratio", and an exponential with base 1.0001 is very slow for a very long time before it overtakes everything.

        **Compound interest.** A principal $P$ earns interest at an annual rate $r$, written as a decimal, so that 8% is $r = 0.08$. If interest is added once a year, each year multiplies the balance by $(1 + r)$, and after $t$ years

        $$A = P(1 + r)^t.$$

        If instead the year's interest is split into $n$ equal instalments, each instalment multiplies the balance by $\left(1 + \dfrac{r}{n}\right)$, and there are $nt$ of them in $t$ years:

        $$A = P\left(1 + \frac{r}{n}\right)^{nt}.$$

        The puzzle is the case $P = 1$, $r = 1$, $t = 1$: the final balance is $\left(1 + \dfrac{1}{n}\right)^n$.

        | Paid | $n$ | $\left(1 + \frac{1}{n}\right)^n$ |
        | --- | --- | --- |
        | yearly | 1 | 2 |
        | half-yearly | 2 | 2.25 |
        | quarterly | 4 | 2.44141 |
        | monthly | 12 | 2.61304 |
        | daily | 365 | 2.71457 |
        | hourly | 8,760 | 2.71813 |
        | every second | 31,536,000 | 2.71828 |

        The numbers increase, but by less and less, and they never pass a certain value. That value is the number $e$:

        $$\left(1 + \frac{1}{n}\right)^n \longrightarrow e = 2.71828\ldots \quad \text{as } n \text{ grows without bound.}$$

        The arrow is read "approaches". The idea of a **limit**, a value that is approached as closely as you please but need not be reached, is used informally here. It will be made exact in later lessons, and again in calculus. Like $\pi$, the number $e$ is not a fraction, and its decimal expansion never ends or repeats.

        **Any rate.** What if the rate is not 100% but $r$? The balance after a year of $n$ instalments is $\left(1 + \dfrac{r}{n}\right)^n$. Write $n = mr$, so that $\dfrac{r}{n} = \dfrac{1}{m}$:

        $$\left(1 + \frac{r}{n}\right)^n = \left(1 + \frac{1}{m}\right)^{mr} = \left[\left(1 + \frac{1}{m}\right)^m\right]^r.$$

        As $n$ grows, so does $m$, and the square bracket approaches $e$. So

        $$\left(1 + \frac{r}{n}\right)^n \longrightarrow e^r,$$

        and the balance under **continuous compounding** at rate $r$ for $t$ years is

        $$A = Pe^{rt}.$$

        This is the formula for anything that grows at a rate proportional to its size. With a negative $r$ it describes decay.

        **In Python.** Python keeps its mathematical functions and constants in a separate collection called a **module**, named `math`. The line `import math` at the top of a program makes it available, and everything in it is then reached with the module's name and a dot in front. You will study modules properly later. For now two names are enough: `math.e` is the number $e$, and `math.exp(x)` computes $e^x$.

        ```python
        import math
        print(math.e)
        print(math.exp(1), math.exp(0.07 * 10))
        ```

        This shows 2.718281828459045, then 2.718281828459045 2.0137527074704766. The second number on the last line is $e^{0.7}$, the factor by which continuous compounding at 7% multiplies a deposit in 10 years. So the balance $Pe^{rt}$ is written `p * math.exp(r * t)`. You could also write `math.e ** (r * t)`, but `math.exp` is made for the job and is the one to use.
    - question:
        id: compound-vs-continuous
        type: choice
        system: s2
        prompt: |
          ₹10,000 is invested for 10 years at 7% a year. Roughly how much more does continuous compounding give than compounding once a year? Use $1.07^{10} \approx 1.967$ and $e^{0.7} \approx 2.014$.
        options: ["Nothing: they are the same", "About ₹470", "About ₹4,700", "About ₹20,000"]
        answer: 1
        explanation: |
          Yearly: $10{,}000 \times 1.967 = 19{,}670$. Continuous: $10{,}000 \times 2.014 = 20{,}140$. The difference is about ₹470. Compounding more often helps, but only a little. Most of the gain comes from the first few subdivisions, as the table for $e$ showed.
    - text: |
        **Exponential growth.** Now compare two ways of growing. In $x^2$, the variable is the base. In $2^x$, the variable is the **exponent**.

        | $x$ | 1 | 2 | 5 | 10 | 20 | 30 |
        | --- | --- | --- | --- | --- | --- | --- |
        | $x^2$ | 1 | 4 | 25 | 100 | 400 | 900 |
        | $2^x$ | 2 | 4 | 32 | 1024 | 1048576 | 1073741824 |

        They start level and then part company for ever. The reason is in how each responds to one more step. Going from $x$ to $x + 1$ **adds** to a power of $x$: $x^2$ goes up by $2x + 1$. The same step **multiplies** an exponential: $2^{x + 1} = 2 \times 2^x$, by the first law. Adding a fixed amount to the input multiplies the output by a fixed factor. A quantity that doubles at every step is said to grow **exponentially**, and no polynomial, of any degree, can keep up with it in the end.

        A rule of thumb worth memorising: $2^{10} = 1024$, which is about $10^3$. So every ten doublings is roughly a thousandfold. Twenty doublings make a million, thirty a billion.

        When the base is between 0 and 1 the same law gives exponential **decay**: $\left(\frac{1}{2}\right)^x$ halves at each step, shrinking towards zero without ever reaching it.
    - question:
        id: fix-fast-power
        type: code
        mode: find-bug
        system: s2
        prompt: |
          The law $(a^m)^n = a^{mn}$ gives a fast way to compute a large power: $a^{16} = \big(\big((a^2)^2\big)^2\big)^2$ takes 4 squarings instead of 15 multiplications. `fast_power(a, n)` uses it for any whole number `n` that is 0 or more: while `n` is positive, if `n` is odd it multiplies one copy of `a` into the result, and then it squares `a` and halves `n`. It gives the right answer for $2^8$ and the wrong answer, 16, for $2^5$. Trace `result`, `a` and `n` by hand for $2^5$, find the line that is wrong, and fix it.
        starter: |
          def fast_power(a, n):
              result = 1
              while n > 0:
                  if n % 2 == 1:
                      result = a
                  a = a * a
                  n = n // 2
              return result

          print(fast_power(2, 8))
          print(fast_power(2, 5))
        solution: |
          def fast_power(a, n):
              result = 1
              while n > 0:
                  if n % 2 == 1:
                      result = result * a
                  a = a * a
                  n = n // 2
              return result

          print(fast_power(2, 8))
          print(fast_power(2, 5))
        tests: |
          assert fast_power(2, 8) == 256, "2 to the power 8 is 256"
          assert fast_power(2, 5) == 32, "2 to the power 5 is 32. Trace it: 5 is odd, then 2 is even, then 1 is odd. What should happen to result at each odd step?"
          assert fast_power(3, 4) == 81, "3 to the power 4 is 81"
          assert fast_power(7, 0) == 1, "Any number to the power 0 is 1"
          assert fast_power(7, 1) == 7, "Any number to the power 1 is itself"
          assert fast_power(2, 10) == 1024, "2 to the power 10 is 1024"
          assert fast_power(3, 7) == 2187, "3 to the power 7 is 2187"
          assert fast_power(2, 100) == 2 ** 100, "It should work for a large exponent"
        wrong:
          - "def fast_power(a, n):\n    result = 1\n    while n > 0:\n        if n % 2 == 1:\n            result = result + a\n        a = a * a\n        n = n // 2\n    return result\n\nprint(fast_power(2, 5))\n"
          - "def fast_power(a, n):\n    result = 1\n    while n > 0:\n        if n % 2 == 0:\n            result = result * a\n        a = a * a\n        n = n // 2\n    return result\n\nprint(fast_power(2, 5))\n"
          - "def fast_power(a, n):\n    result = 1\n    while n > 1:\n        if n % 2 == 1:\n            result = result * a\n        a = a * a\n        n = n // 2\n    return result\n\nprint(fast_power(2, 5))\n"
        explanation: "At an odd step one copy of the current `a` must be multiplied **into** the result, not replace it. For $2^5$: `result` becomes 2, `a` becomes 4 and then 16, and at the last step `result` should become $2 \\times 16 = 32$. This is $2^5 = 2^1 \\times 2^4$, the first law at work. The method reaches $2^{100}$ in seven squarings."
    - text: |
        **Why $e$ is the natural base.** There are infinitely many exponential functions. What makes $e^x$ the one that mathematicians and programmers reach for?

        Ask how steep each curve is where it crosses the vertical axis. The slope of a curve at a point can be estimated as you would estimate the slope of a line: take a tiny step $h$ to the right and divide the rise by the run. At $x = 0$, where the height is $b^0 = 1$:

        $$\text{slope at } 0 \approx \frac{b^h - 1}{h} \quad \text{for a very small } h.$$

        Compute this with $h = 0.000001$ for a few bases:

        | Base $b$ | 2 | 2.5 | $e$ | 3 |
        | --- | --- | --- | --- | --- |
        | slope at 0 | 0.6931 | 0.9163 | 1.0000 | 1.0986 |

        The base 2 is not steep enough, and 3 is too steep. Exactly one base has slope **1** at the axis, and it is $e$. That is a second route to the same number, and it has nothing to do with banks.

        Now use the constant-ratio property to find the slope of $e^x$ anywhere else:

        $$\frac{e^{x + h} - e^x}{h} = e^x \cdot \frac{e^h - 1}{h} \approx e^x \cdot 1.$$

        **At every point, the slope of $e^x$ equals its height.** The function is its own rate of change. This is the sentence from the intuition, "the rate of growth is equal to the current amount", now as a statement about a curve. For any other base the slope is the height times an awkward constant: for $2^x$ it is $0.6931 \times 2^x$. Only for base $e$ is the constant 1. Choosing $e$ as the base is like choosing units in which that constant disappears, and every formula of calculus becomes simpler as a result.

        One consequence is useful every day. Near $x = 0$ the curve $e^x$ has height 1 and slope 1, so it hugs the line $1 + x$:

        $$e^x \approx 1 + x \quad \text{when } x \text{ is small.}$$

        So $e^{0.01} \approx 1.01$: growing continuously at 1% is almost the same as adding 1%.

        **Squashing with the exponential.** One function built from $e^x$ will be with you throughout machine learning. The **sigmoid**, or logistic function, is

        $$\sigma(x) = \frac{1}{1 + e^{-x}}.$$

        Follow the chain of functions. For a large positive $x$, $e^{-x}$ is nearly 0, so $\sigma(x)$ is nearly 1. For a large negative $x$, $e^{-x}$ is enormous, so $\sigma(x)$ is nearly 0. At $x = 0$ it is exactly $\tfrac{1}{2}$. The sigmoid is strictly increasing, and its outputs fill the gap between 0 and 1 without ever reaching either: it takes any real number and squashes it into something that can be read as a probability. Going back the other way, from a probability to the number that produced it, needs the inverse of $e^x$, which is the subject of the next lesson.
    - question:
        id: fix-growth-rate
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `grow(p, percent, years)` should return the balance when `p` is compounded continuously at an annual rate given **as a percentage**. `grow(1000, 5, 10)` should be about `1648.72`, but the function returns a number with 24 digits. Find the mistake and fix it.
        starter: |
          import math

          def grow(p, percent, years):
              return p * math.exp(percent * years)

          print(grow(1000, 5, 10))
        solution: |
          import math

          def grow(p, percent, years):
              return p * math.exp(percent / 100 * years)

          print(grow(1000, 5, 10))
        tests: |
          import math as _m
          assert abs(grow(1000, 5, 10) - 1648.7212707) < 1e-4, "1000 at 5% for 10 years, compounded continuously, is 1000 times e to the 0.5. The formula needs the rate as a decimal."
          assert abs(grow(1, 100, 1) - _m.e) < 1e-9, "1 at 100% for one year is e"
          assert grow(250, 0, 30) == 250, "At 0% nothing changes"
          assert abs(grow(1000, 7, 0) - 1000) < 1e-9, "After no time nothing has changed"
          assert abs(grow(800, -10, 5) - 800 * _m.exp(-0.5)) < 1e-9, "A negative rate is decay"
        wrong:
          - "import math\n\ndef grow(p, percent, years):\n    return p * math.exp(percent / 100) * years\n\nprint(grow(1000, 5, 10))\n"
          - "import math\n\ndef grow(p, percent, years):\n    return p * (1 + percent / 100) ** years\n\nprint(grow(1000, 5, 10))\n"
          - "import math\n\ndef grow(p, percent, years):\n    return p * math.exp(percent * years) / 100\n\nprint(grow(1000, 5, 10))\n"
        explanation: |
          In $A = Pe^{rt}$ the rate is a decimal: 5% is 0.05. The starter used $r = 5$, which is 500% a year, and $e^{50}$ is about $5 \times 10^{21}$. A rate that has not been converted from a percentage is one of the commonest bugs in any code that models growth, and the exponential punishes it more severely than any other function would.
  formal:
    - text: |
        For $a > 0$, the power $a^x$ is defined in stages:

        | Exponent | Definition |
        | --- | --- |
        | whole number $n \geq 1$ | $a^n = a \times a \times \dots \times a$, with $n$ factors |
        | zero | $a^0 = 1$ |
        | negative integer | $a^{-n} = \dfrac{1}{a^n}$ |
        | unit fraction | $a^{1/n} = \sqrt[n]{a}$, the positive number whose $n$th power is $a$ |
        | any fraction | $a^{m/n} = \left(\sqrt[n]{a}\right)^m$ |

        Each stage is the only definition for which the following laws remain true. For $a, b > 0$ and all exponents $x$ and $y$:

        | Law | Statement |
        | --- | --- |
        | Product | $a^x a^y = a^{x + y}$ |
        | Quotient | $\dfrac{a^x}{a^y} = a^{x - y}$ |
        | Power of a power | $(a^x)^y = a^{xy}$ |
        | Power of a product | $(ab)^x = a^x b^x$ |
        | Power of a quotient | $\left(\dfrac{a}{b}\right)^x = \dfrac{a^x}{b^x}$ |

        For zero and negative integer exponents the base may be any non-zero number. For fractional exponents the base is taken positive. There is no corresponding law for $a^x + a^y$ or for $(a + b)^x$.

        **Exponential functions.** For $b > 0$, $b \ne 1$, the exponential function $x \mapsto b^x$ is defined for every real $x$ and takes every positive value exactly once. It is strictly increasing if $b > 1$ and strictly decreasing if $0 < b < 1$, and for all real $x$ and $h$,

        $$b^{x + h} = b^h \, b^x.$$

        Equal steps in the input multiply the output by equal factors. For $b > 1$, $b^x$ eventually exceeds every power $x^k$.

        **The number $e$.** $e = 2.718281828\ldots$ is the value approached by $\left(1 + \dfrac{1}{n}\right)^n$ as $n$ grows without bound. For every real $r$, $\left(1 + \dfrac{r}{n}\right)^n$ approaches $e^r$. The slope of the graph of $e^x$ at any point equals its height there, and $e^x \approx 1 + x$ when $\lvert x \rvert$ is small.

        | Model | Formula |
        | --- | --- |
        | Compounded $n$ times a year | $A = P\left(1 + \dfrac{r}{n}\right)^{nt}$ |
        | Compounded continuously | $A = Pe^{rt}$ |

        Here $P$ is the initial amount, $r$ the rate per unit time as a decimal, and $t$ the time.

        **The sigmoid** $\sigma(x) = \dfrac{1}{1 + e^{-x}}$ is strictly increasing, takes every value strictly between 0 and 1, and has $\sigma(0) = \tfrac{1}{2}$ and $\sigma(-x) = 1 - \sigma(x)$.
  drill:
    - text: Seconds each. Say which law you are using before you answer.
    - question:
        id: drill-product
        type: choice
        system: s1
        prompt: "Simplify $x^4 \\times x^3$."
        options: ["$x^{12}$", "$x^7$", "$2x^7$", "$x^1$"]
        answer: 1
        explanation: Multiplying powers of the same base adds the exponents.
    - question:
        id: drill-power-of-power
        type: choice
        system: s1
        prompt: "Simplify $(x^4)^3$."
        options: ["$x^{12}$", "$x^7$", "$x^{64}$", "$3x^4$"]
        answer: 0
        explanation: Three groups of four copies. A power of a power multiplies the exponents.
    - question:
        id: drill-quotient
        type: choice
        system: s1
        prompt: "Simplify $\\dfrac{x^3}{x^7}$."
        options: ["$x^4$", "$x^{-4}$", "$x^{10}$", "$-x^4$"]
        answer: 1
        explanation: "Dividing subtracts exponents: $3 - 7 = -4$. It equals $\\dfrac{1}{x^4}$."
    - question:
        id: drill-negative
        type: numeric
        system: s1
        prompt: "What is $2^{-3}$? Give an exact answer."
        answer: "1/8"
        explanation: "$\\dfrac{1}{2^3}$."
    - question:
        id: drill-half
        type: numeric
        system: s1
        prompt: "What is $49^{1/2}$?"
        answer: "7"
        explanation: The power one half is the square root.
    - question:
        id: drill-two-thirds
        type: numeric
        system: s1
        prompt: "What is $27^{2/3}$?"
        answer: "9"
        explanation: "Root first: $27^{1/3} = 3$. Then the power: $3^2 = 9$."
    - question:
        id: drill-constant-ratio
        type: choice
        system: s1
        prompt: |
          A quantity takes the values 5, 15, 45, 135 at times 0, 1, 2, 3. What kind of growth is this?
        options: ["Linear, adding 10 each time", "Exponential, multiplying by 3 each time", "Quadratic", "None of these"]
        answer: 1
        explanation: Each value is three times the one before. Constant ratio is the signature of an exponential.
    - question:
        id: drill-through-one
        type: numeric
        system: s1
        prompt: |
          What is $e^0$?
        answer: "1"
        explanation: Any non-zero base to the power 0 is 1. Every exponential curve passes through the point (0, 1).
    - question:
        id: drill-approx-e
        type: choice
        system: s1
        prompt: |
          Which of these is closest to $e$?
        options: ["2.5", "2.72", "3.14", "1.62"]
        answer: 1
        explanation: e is 2.71828 to five places. The third option is close to pi.
    - question:
        id: drill-small-x
        type: choice
        system: s1
        prompt: |
          Without a calculator, which is the best estimate of $e^{0.02}$?
        options: ["0.02", "1.02", "1.2", "2.72"]
        answer: 1
        explanation: For a small x, e to the x is close to 1 + x.
    - question:
        id: predict-compound
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          balance = 1.0
          for step in range(2):
              balance = balance * 1.5
          print(balance, balance > 2)
        output: "2.25 True"
        explanation: Two payments of 50% multiply by 1.5 twice, which gives 2.25. That is more than the 2 from a single payment of 100%.
    - question:
        id: predict-powers
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(2 ** 3 * 2 ** 2, (2 ** 3) ** 2, 4 ** -1)
        output: "32 64 0.25"
        explanation: "$2^3 \\times 2^2 = 2^5$, $(2^3)^2 = 2^6$, and $4^{-1} = \\frac{1}{4}$."
  work:
    - text: Slower now. Check every simplification by substituting a number.
    - question:
        id: work-simplify-fractional
        type: choice
        system: s2
        prompt: "Simplify $\\dfrac{\\sqrt{x} \\times x^2}{x^{-1/2}}$ for $x > 0$."
        options: ["$x^2$", "$x^3$", "$x^{5/2}$", "$x^{3/2}$"]
        answer: 1
        explanation: "$\\sqrt{x} = x^{1/2}$. The top is $x^{1/2 + 2} = x^{5/2}$. Dividing by $x^{-1/2}$ subtracts $-\\frac{1}{2}$: $\\frac{5}{2} + \\frac{1}{2} = 3$. Check with $x = 4$: the top is $2 \\times 16 = 32$, the bottom is $\\frac{1}{2}$, and $32 \\div \\frac{1}{2} = 64 = 4^3$."
    - question:
        id: work-solve-exponent
        type: numeric
        system: s2
        prompt: "Solve $2^{3x - 1} = 32$. Write 32 as a power of 2, and use the fact that equal powers of the same base have equal exponents."
        answer: "2"
        explanation: "$32 = 2^5$, so $3x - 1 = 5$, giving $x = 2$. Check: $2^{6 - 1} = 2^5 = 32$."
    - question:
        id: write-nth-root
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `power(a, m, n)` that returns $a^{m/n}$ for a positive number `a`, an integer `m` and a positive whole number `n`, computed as the lesson recommends: the $n$th root first, then the $m$th power. Then write a function `check_law(a, x, y)` that returns True exactly when $a^x \times a^y$ and $a^{x + y}$ agree to within 0.000001, so that the product law can be tested on fractional exponents.
        starter: |
          def power(a, m, n):
              # Replace the next line with your own.
              return 0

          def check_law(a, x, y):
              # Replace the next line with your own.
              return False

          print(power(8, 2, 3))
          print(check_law(2, 0.5, 0.5))
        solution: |
          def power(a, m, n):
              root = a ** (1 / n)
              return root ** m

          def check_law(a, x, y):
              return abs(a ** x * a ** y - a ** (x + y)) < 0.000001

          print(power(8, 2, 3))
          print(check_law(2, 0.5, 0.5))
        tests: |
          assert abs(power(8, 2, 3) - 4) < 1e-9, "8 to the power 2/3 is the cube root of 8, squared, which is 4"
          assert abs(power(9, 1, 2) - 3) < 1e-9, "9 to the power 1/2 is 3"
          assert abs(power(16, -3, 4) - 0.125) < 1e-9, "16 to the power -3/4 is 1 over 2 cubed, which is 0.125"
          assert abs(power(5, 0, 7) - 1) < 1e-9, "Any positive number to the power 0 is 1"
          assert abs(power(32, 3, 5) - 8) < 1e-9, "32 to the power 3/5 is the fifth root of 32, cubed, which is 8"
          assert check_law(2, 0.5, 0.5) == True, "2 to the 0.5 times 2 to the 0.5 is 2 to the 1"
          assert check_law(3, 1.5, -0.25) == True, "The product law holds for every pair of exponents"
          assert check_law(10, 2, 3) == True, "The product law holds for whole exponents too"
        wrong:
          - "def power(a, m, n):\n    return a ** m / n\n\ndef check_law(a, x, y):\n    return abs(a ** x * a ** y - a ** (x + y)) < 0.000001\n"
          - "def power(a, m, n):\n    return a ** (n / m)\n\ndef check_law(a, x, y):\n    return abs(a ** x * a ** y - a ** (x + y)) < 0.000001\n"
          - "def power(a, m, n):\n    root = a ** (1 / n)\n    return root ** m\n\ndef check_law(a, x, y):\n    return abs(a ** x * a ** y - a ** (x * y)) < 0.000001\n"
        explanation: "The denominator of the exponent is a root, written `** (1 / n)` with brackets, since without them `a ** 1 / n` would raise to the power 1 and then divide. The numerator is then an ordinary power. Floats are compared with a tolerance."
    - question:
        id: write-doublings
        type: code
        mode: write
        system: s2
        prompt: |
          A quantity grows by a fixed factor at every step. Write a function `steps_to_exceed(start, factor, target)` that returns how many steps are needed before the quantity first **exceeds** `target`, where `start` is positive and `factor` is greater than 1. Then bind `cube_wins_until` to the largest whole number $n \geq 1$ for which $n^3 > 2^n$, found with a loop over $n$ from 1 to 50.
        starter: |
          def steps_to_exceed(start, factor, target):
              # Replace the next line with your own.
              return 0

          cube_wins_until = 0
        solution: |
          def steps_to_exceed(start, factor, target):
              steps = 0
              value = start
              while value <= target:
                  value *= factor
                  steps += 1
              return steps

          cube_wins_until = 0
          for n in range(1, 51):
              if n ** 3 > 2 ** n:
                  cube_wins_until = n
        tests: |
          assert steps_to_exceed(1, 2, 1000) == 10, "Starting at 1 and doubling, the value first exceeds 1000 after 10 steps, at 1024"
          assert steps_to_exceed(1, 2, 1024) == 11, "1024 does not exceed 1024, so one more doubling is needed"
          assert steps_to_exceed(5, 2, 3) == 0, "A quantity already above the target needs no steps"
          assert steps_to_exceed(100, 1.1, 200) == 8, "Growing by 10 percent a step, 100 first exceeds 200 after 8 steps"
          assert steps_to_exceed(1, 10, 999999) == 6, "Six tenfold steps reach a million"
          assert cube_wins_until == 9, "Compare n cubed with 2 to the n for each n. At n = 9 they are 729 and 512. At n = 10 they are 1000 and 1024."
        wrong:
          - "def steps_to_exceed(start, factor, target):\n    steps = 0\n    value = start\n    while value < target:\n        value *= factor\n        steps += 1\n    return steps\n\ncube_wins_until = 9\n"
          - "def steps_to_exceed(start, factor, target):\n    steps = 0\n    value = start\n    while value <= target:\n        value += factor\n        steps += 1\n    return steps\n\ncube_wins_until = 9\n"
          - "def steps_to_exceed(start, factor, target):\n    steps = 0\n    value = start\n    while value <= target:\n        value *= factor\n        steps += 1\n    return steps\n\ncube_wins_until = 10\n"
        explanation: "Exponential growth is repeated multiplication, so the loop multiplies and counts. The cubic $n^3$ leads from $n = 2$ to $n = 9$, and from $n = 10$ onwards $2^n$ is ahead for good, since each further step doubles it while $n^3$ grows by an ever smaller proportion."
    - question:
        id: write-compound
        type: code
        mode: write
        system: s2
        prompt: |
          Write `balance(p, r, n, t)` returning the balance after `t` years when a principal `p` earns interest at the annual rate `r`, given as a decimal, compounded `n` times a year. If `n` is `0`, treat that as a request for **continuous** compounding and use the exponential.
        starter: |
          import math

          def balance(p, r, n, t):
              # Replace the next line with your own.
              return p

          print(balance(1, 1, 1, 1), balance(1, 1, 12, 1), balance(1, 1, 0, 1))
        solution: |
          import math

          def balance(p, r, n, t):
              if n == 0:
                  return p * math.exp(r * t)
              return p * (1 + r / n) ** (n * t)

          print(balance(1, 1, 1, 1), balance(1, 1, 12, 1), balance(1, 1, 0, 1))
        tests: |
          import math as _m
          assert balance(1, 1, 1, 1) == 2, "One rupee at 100%, paid once, is 2"
          assert balance(1, 1, 2, 1) == 2.25, "Paid twice: 1.5 squared"
          assert abs(balance(1, 1, 12, 1) - 2.6130352902) < 1e-8, "Paid monthly: about 2.613"
          assert abs(balance(1, 1, 0, 1) - _m.e) < 1e-12, "n = 0 means continuous compounding: e"
          assert abs(balance(5000, 0.08, 4, 3) - 5000 * 1.02 ** 12) < 1e-6, "5000 at 8%, quarterly, for 3 years: twelve instalments of 2%"
          assert abs(balance(5000, 0.08, 0, 3) - 5000 * _m.exp(0.24)) < 1e-6, "Continuous: 5000 times e to the power 0.24"
          assert balance(300, 0.05, 12, 0) == 300, "After no time the balance is the principal"
        wrong:
          - "import math\n\ndef balance(p, r, n, t):\n    if n == 0:\n        return p * math.exp(r * t)\n    return p * (1 + r / n) ** t\n"
          - "import math\n\ndef balance(p, r, n, t):\n    if n == 0:\n        return p * math.exp(r) * t\n    return p * (1 + r / n) ** (n * t)\n"
          - "import math\n\ndef balance(p, r, n, t):\n    if n == 0:\n        return p * math.exp(r * t)\n    return p * (1 + r) ** (n * t)\n"
        explanation: Each instalment multiplies by one plus the rate divided by n, and there are n times t instalments. The continuous case is the limit of that as n grows, P times e to the rt. Checking n equal to 0 first also avoids dividing by zero.
    - question:
        id: work-linear-vs-exp
        type: choice
        system: s2
        prompt: |
          Plan A pays you ₹1,00,000 every day. Plan B pays ₹1 on day 1, ₹2 on day 2, ₹4 on day 3, doubling each day. On which day does a **single day's** payment from plan B first exceed a single day's payment from plan A? Use $2^{10} \approx 1{,}000$.
        options: ["Day 11", "Day 18", "Day 100", "Never"]
        answer: 1
        explanation: |
          Plan B pays $2^{d - 1}$ on day $d$. $2^{16} = 65{,}536$ is too small and $2^{17} = 131{,}072$ is large enough, so $d - 1 = 17$ and $d = 18$. Estimating: $10^5 = 100 \times 10^3 \approx 2^{6.6} \times 2^{10}$, so about $2^{16.6}$. However large the constant payment, a doubling overtakes it, and after that the gap itself doubles every day.
    - question:
        id: thousand-rule
        type: numeric
        system: s2
        prompt: |
          Using the rule of thumb $2^{10} \approx 10^3$, a model with $2^{40}$ parameters has roughly $10^n$ parameters. What is $n$?
        answer: "12"
        explanation: "$2^{40} = (2^{10})^4 \\approx (10^3)^4 = 10^{12}$, by the power-of-a-power law. About a trillion."
    - question:
        id: why-half-is-root
        type: choice
        system: s2
        prompt: "Why must $a^{1/2}$ equal $\\sqrt{a}$, for a positive $a$?"
        options:
          - "It is a notation that mathematicians agreed on, with no deeper reason."
          - "Because half of a is its root."
          - "Because if the law $a^x a^y = a^{x+y}$ is to hold, then $a^{1/2} \\times a^{1/2} = a^1 = a$, so $a^{1/2}$ is a number whose square is $a$."
          - "Because Python computes it that way."
        answer: 2
        explanation: The meaning is forced by requiring the product law to continue to hold. A number that multiplied by itself gives $a$ is, by definition, a square root of $a$.
  connections:
    - text: |
        The puzzle is answered. Chopping the year's interest ever more finely does not make you arbitrarily rich. One rupee at 100% creeps up towards $e = 2.71828\ldots$ and no further, because more payments of smaller size very nearly cancel, and only the interest on interest survives.

        Along the way the meaning of a power was stretched three times, and each time the stretch was forced. A zero exponent had to give 1, a negative one a reciprocal, and a half a square root, because any other choice would have broken the law that exponents add when powers multiply. That is the same move as in [[f1.variables-and-expressions]]: decide what must be true for every number, and let the rules do the work.

        Exponential growth is everywhere in computing, and it is usually bad news. The number of possible passwords grows exponentially with their length, which is why long passwords are strong. The cost of trying every subset of $n$ items is $2^n$, which is why such searches stop being feasible somewhere past $n = 50$. A user base, a virus or a viral video that grows by a fixed percentage each day doubles on a fixed schedule, and ten doublings make a thousandfold. The binary numbers of [[h0.unsigned-integers-and-fixed-widths]] were exponential too: each extra bit doubles the count of values.

        Every question in this lesson ran one way: given the exponent, find the power. The questions that matter in practice usually run the other way. How many doublings until a thousand users become a crore? How many bits are needed for a lakh of values? How many halvings does binary search need? Each asks for an **exponent**, and the function that answers it is the inverse of $b^x$, the logarithm. That is the next lesson, [[f1.logarithms]].
