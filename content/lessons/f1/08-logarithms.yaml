concept: f1.logarithms
minutes: 120
claim: You can read a logarithm as an unknown exponent, derive and use the laws of logarithms from the laws of exponents, change base, use the natural logarithm, solve exponential equations including doubling times and half-lives, and explain why logarithms turn multiplication into addition.
recalls: [f1.exponents-and-exponential-growth]
uses: [f1.variables-and-expressions, f1.linear-equations, f1.inequalities, f1.coordinates-lines-and-slope, f1.functions-as-machines, f1.composition-and-inverses, f0.powers-and-roots, f0.estimation-and-back-of-the-envelope-reasoning, f0.fractions-decimals-and-percentages, s0.expressions, s0.booleans-and-conditionals, s0.loops, s0.functions, s0.lists-and-tuples, s0.reading-errors-and-debugging]
leads: [f1.arithmetic-and-geometric-series]
starter: |
  # Scratch space. Python keeps logarithms in its math module.
  import math
  print(math.log2(8), math.log10(1000), math.log2(20))
  print(2 ** math.log2(20))
parts:
  recall:
    - text: |
        In [[f1.exponents-and-exponential-growth]] exponents became any number, and you could solve $2^x = 32$ only because 32 is a power of 2. Today you find the exponent whatever the right-hand side. Three quick pulls first, since every law of today is a law of exponents seen from the other side.
  puzzle:
    - text: |
        A colony of bacteria doubles every hour. It starts as a single cell. After how many hours are there 1024 cells? You can answer from memory: $2^{10} = 1024$, so ten hours.

        After how many hours are there a **million** cells?

        The number of cells after $x$ hours is $2^x$, so the question is

        $$2^x = 1\,000\,000.$$

        You know $2^{19} = 524\,288$ and $2^{20} = 1\,048\,576$, so the answer is a little under 20. But what is it exactly? The unknown is sitting in the **exponent**, and none of your tools reaches it there. Subtracting, dividing and taking roots all fail. A root would undo a known exponent to find an unknown base. Here the base is known and the exponent is not.

        Addition is undone by subtraction and multiplication by division. A power, it turns out, can be undone in **two** different ways, depending on which part is unknown. **What is the operation that finds an unknown exponent?**
  intuition:
    - text: |
        Give it a name and see what you already know about it. Define

        $$\log_2 y \;=\; \text{the exponent to which 2 must be raised to give } y.$$

        It is read "log base 2 of $y$". The word **logarithm** is a name for an exponent, nothing more.

        Then you already know many logarithms. $\log_2 8 = 3$, because $2^3 = 8$. $\log_2 1024 = 10$. $\log_2 1 = 0$, because $2^0 = 1$. $\log_2 \frac{1}{2} = -1$. And the puzzle's answer is $\log_2 1\,000\,000$, a number just below 20.

        In words, $\log_2 y$ answers the question "**how many doublings** does it take to get from 1 to $y$?" Likewise $\log_{10} y$ asks "how many multiplications by ten?" That one you have used for a long time under another name. The order of magnitude of a number is, near enough, its logarithm to base 10: a million is $10^6$, and $\log_{10} 1\,000\,000 = 6$. The exponent slider below is a logarithm dial. Set the exponent, and it shows the number. Read it the other way, from the number to the exponent, and you are taking a logarithm.
    - figure: powers-of-ten
      props: { start: 6 }
    - text: |
        Two things follow from this at once.

        Logarithms grow with tremendous reluctance. To raise $\log_{10}$ by 1, the number must grow tenfold. A thousand has logarithm 3, a billion has 9. Exponentials turn small numbers into huge ones, and logarithms turn huge numbers back into small ones.

        And logarithms turn **multiplication into addition**. To multiply a thousand by a million, you add their exponents: $10^3 \times 10^6 = 10^9$. In the language of logarithms, the log of a product is the sum of the logs. For three centuries, before calculators, this is how all serious multiplication was done, with printed tables of logarithms.
  derivation:
    - text: |
        **The definition.** For a base $b$ that is positive and not 1, and a positive number $y$,

        $$\log_b y = x \qquad\text{means exactly}\qquad b^x = y.$$

        The two statements are one fact written in two ways. Practise turning each into the other until it is automatic.

        | Exponential form | Logarithmic form |
        | --- | --- |
        | $2^5 = 32$ | $\log_2 32 = 5$ |
        | $10^{-2} = 0.01$ | $\log_{10} 0.01 = -2$ |
        | $9^{1/2} = 3$ | $\log_9 3 = \frac{1}{2}$ |
        | $b^0 = 1$ | $\log_b 1 = 0$ |
        | $b^1 = b$ | $\log_b b = 1$ |

        To evaluate a logarithm by hand, turn it into a question about exponents. $\log_4 8$: to what power must 4 be raised to give 8? Write both as powers of 2: $4^x = 2^{2x}$ and $8 = 2^3$, so $2x = 3$ and $x = \frac{3}{2}$.

        **Two operations that undo each other.** Since $\log_b y$ is the exponent that gives $y$, raising $b$ to it gives $y$ back. And the exponent needed to make $b^x$ is, of course, $x$:

        $$b^{\log_b y} = y, \qquad \log_b\!\left(b^x\right) = x.$$

        Taking the logarithm and raising the base to a power are **inverse** operations, in the same sense that the two temperature formulas were.

        **Only positive numbers have logarithms.** A positive base raised to any power is positive: $2^x$ is never zero and never negative. So $\log_2 0$ and $\log_2(-4)$ ask for an exponent that does not exist. On the other hand the **value** of a logarithm can be any number, positive, negative or zero. Numbers between 0 and 1 have negative logarithms.

        **The laws of logarithms.** Each law of exponents, read backwards, is a law of logarithms. Let $x = \log_b M$ and $y = \log_b N$, which means $M = b^x$ and $N = b^y$.

        *Product.* $MN = b^x b^y = b^{x + y}$. So the exponent that gives $MN$ is $x + y$:

        $$\log_b (MN) = \log_b M + \log_b N.$$

        *Quotient.* $\dfrac{M}{N} = b^{x - y}$, so

        $$\log_b \frac{M}{N} = \log_b M - \log_b N.$$

        *Power.* $M^k = (b^x)^k = b^{kx}$, so

        $$\log_b \left(M^k\right) = k \log_b M.$$

        The third is the most useful of all. It **brings an exponent down** to where ordinary algebra can reach it.

        As with exponents, there is no law for the logarithm of a **sum**. $\log(M + N)$ is not $\log M + \log N$.
    - question:
        id: use-laws
        type: numeric
        system: s2
        prompt: "Given that $\\log_{10} 2 \\approx 0.301$, find $\\log_{10} 500$ without a calculator, to three decimal places. Write 500 using a power of ten and a 2."
        answer: "2.699"
        explanation: "$500 = \\dfrac{1000}{2}$, so $\\log_{10} 500 = \\log_{10} 1000 - \\log_{10} 2 = 3 - 0.301 = 2.699$. A sanity check by order of magnitude: 500 lies between $10^2$ and $10^3$, nearer the top, so its logarithm should be a little under 3."
    - text: |
        **Solving exponential equations.** Now the puzzle can be answered in general. To solve $2^x = 20$, take the logarithm of both sides, to any convenient base, and bring the exponent down with the power law. Using base 10:

        $$\log_{10}\!\left(2^x\right) = \log_{10} 20 \quad\Longrightarrow\quad x \log_{10} 2 = \log_{10} 20 \quad\Longrightarrow\quad x = \frac{\log_{10} 20}{\log_{10} 2} \approx \frac{1.301}{0.301} \approx 4.32.$$

        Taking logarithms of both sides is a permitted move, like adding to both sides: if two positive numbers are equal, so are their logarithms, and the other way round.

        **Changing base.** The same calculation, done with letters, shows how to convert any logarithm into another base. If $x = \log_b y$ then $b^x = y$. Take logarithms to a base $c$: $x \log_c b = \log_c y$. So

        $$\log_b y = \frac{\log_c y}{\log_c b}.$$

        Logarithms to different bases differ only by a constant factor. $\log_2 y$ is always about 3.32 times $\log_{10} y$, because $\frac{1}{\log_{10} 2} \approx 3.32$. This is why people can say "it grows logarithmically" without naming a base. It is also the source of your rule of thumb: ten doublings are about three tenfolds, since $10 \times 0.301 \approx 3$.

        **The natural logarithm.** One base deserves a name of its own. In [[f1.exponents-and-exponential-growth]] the number $e = 2.71828\ldots$ came out of compound interest, and $e^x$ turned out to be the exponential whose slope equals its height. The logarithm to base $e$ is so common that it has its own symbol, $\ln$, read "natural log":

        $$\ln x = \log_e x, \qquad \ln(e^x) = x, \qquad e^{\ln x} = x \;\;(x > 0).$$

        $\ln x$ answers the question "for how long must something grow continuously at 100% to become $x$ times as large?". So $\ln 1 = 0$, $\ln e = 1$, and $\ln 2 \approx 0.693$. All the laws of logarithms hold for it, since they hold for every base.

        **Every exponential is $e$ in disguise.** Since $b = e^{\ln b}$, the power-of-a-power law gives

        $$b^x = \left(e^{\ln b}\right)^x = e^{x \ln b}.$$

        Any exponential function is $e$ raised to a constant times $x$. The constant $\ln b$ is exactly the awkward constant in the last lesson's table of slopes: $\ln 2 = 0.6931\ldots$ and $\ln 3 = 1.0986\ldots$. So there is really only **one** exponential function, $e^x$, and all the others are obtained by stretching its input. A quantity that grows by the factor $b$ in each unit of time grows continuously at the rate $k = \ln b$, and can be written $A = Pe^{kt}$.

        **Doubling time and half-life.** How long does continuous growth at rate $r$ take to double? Solve $Pe^{rt} = 2P$. Divide both sides by $P$, then take natural logarithms of both sides:

        $$e^{rt} = 2 \quad\Longrightarrow\quad rt = \ln 2 \quad\Longrightarrow\quad t = \frac{\ln 2}{r} \approx \frac{0.693}{r}.$$

        The answer does not depend on $P$. An exponential takes the same time to go from 1 to 2 as from 1,000 to 2,000. With the rate written as a percentage this is the **rule of 70**: the doubling time is about 70 divided by the percentage rate. A deposit growing at 7% a year doubles in about 10 years, and the population of a town growing at 2% a year doubles in about 35.

        For decay, the same calculation gives the **half-life**, the time for the quantity to halve: $t = \dfrac{\ln 2}{|r|}$. After one half-life a half remains, after two a quarter, after ten less than a thousandth. If the half-life is $T$, then after a time $t$ exactly $\dfrac{t}{T}$ half-lives have passed, and the fraction left is $\left(\dfrac{1}{2}\right)^{t / T}$.

        **Undoing the sigmoid.** The sigmoid of the last lesson, $\sigma(x) = \dfrac{1}{1 + e^{-x}}$, turns any number into something between 0 and 1 that can be read as a probability. Its inverse turns the probability back into the number, and it is found by undoing the chain in reverse order, as in [[f1.composition-and-inverses]]. From $y = \dfrac{1}{1 + e^{-x}}$, take reciprocals and subtract 1: $\dfrac{1}{y} - 1 = e^{-x}$, which is $\dfrac{1 - y}{y}$. Take reciprocals again: $e^x = \dfrac{y}{1 - y}$. Now take natural logarithms:

        $$x = \ln \frac{y}{1 - y}.$$

        This inverse is called the **logit**. It is defined for $0 < y < 1$, which is exactly the range of the sigmoid.

        **In Python.** The `math` module from the last lesson has three logarithm functions.

        ```python
        import math
        print(math.log2(1000000))
        print(math.log10(500))
        print(math.log(20, 2))
        print(math.log(math.e), math.log(2))
        ```

        This shows 19.931568569324174, then 2.6989700043360187, then 4.321928094887363, then 1.0 0.6931471805599453. `math.log2` and `math.log10` use the bases 2 and 10, and `math.log(y, b)` takes the base as its second argument. With only one argument, `math.log(y)` is the natural logarithm $\ln y$. That is a warning about notation worth keeping: beyond school mathematics, and in almost every programming language, a bare "log" means $\ln$. So a million cells are reached after about 19.93 hours. Ask any of them for the logarithm of 0 or of a negative number and Python stops with `ValueError: math domain error`.

        **Finding a logarithm without a logarithm function.** It is worth seeing that nothing mysterious happens inside `math.log2`. Because $2^x$ rises steadily as $x$ rises, an unknown exponent can be hunted down by **halving**, the search you used for bugs. To solve $2^x = 20$: the answer lies between 4 and 5. Try the midpoint, 4.5. $2^{4.5} \approx 22.6$ is too big, so the answer lies between 4 and 4.5. Try 4.25. $2^{4.25} \approx 19.03$ is too small, so it lies between 4.25 and 4.5. Each test halves the interval. After twenty tests it is pinned down to within a millionth.

        **Logarithmic scales.** When values range over many orders of magnitude, plot or think about their logarithms instead. On such a scale, each equal step is a **multiplication** by a fixed factor: 1, 10, 100, 1000 are evenly spaced. Exponential growth, $y = c \, a^x$, becomes a straight line, since $\log y = \log c + x \log a$ has the form intercept plus slope times $x$. To test whether data grow exponentially, take logarithms and see whether the result is linear, with the test you wrote for straight lines.
    - question:
        id: fix-bisection
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `log2_by_halving(y)` should find $\log_2 y$ for a `y` between 1 and 1024 without using a logarithm function, by halving an interval that contains the answer. It keeps `low` and `high` with $2^{\text{low}} \le y \le 2^{\text{high}}$, tests the midpoint, and throws away the half that cannot contain the answer. For $y = 8$ it should return a number within 0.000001 of 3, but it returns nearly 10. Trace the first two steps by hand for $y = 8$, decide which half should be kept when $2^{\text{mid}}$ is too big, and fix it.
        starter: |
          def log2_by_halving(y):
              low = 0
              high = 10
              for step in range(40):
                  mid = (low + high) / 2
                  if 2 ** mid > y:
                      low = mid
                  else:
                      high = mid
              return (low + high) / 2

          print(log2_by_halving(8))
        solution: |
          def log2_by_halving(y):
              low = 0
              high = 10
              for step in range(40):
                  mid = (low + high) / 2
                  if 2 ** mid > y:
                      high = mid
                  else:
                      low = mid
              return (low + high) / 2

          print(log2_by_halving(8))
        tests: |
          import math as _m
          assert "log" not in source.replace("log2_by_halving", ""), "Find the exponent by halving, without calling a logarithm function"
          assert abs(log2_by_halving(8) - 3) < 1e-6, "log base 2 of 8 is 3. If 2 to the midpoint is too big, is the answer above the midpoint or below it?"
          assert abs(log2_by_halving(20) - _m.log2(20)) < 1e-6, "log base 2 of 20 is about 4.3219"
          assert abs(log2_by_halving(1) - 0) < 1e-6, "log base 2 of 1 is 0"
          assert abs(log2_by_halving(1024) - 10) < 1e-6, "log base 2 of 1024 is 10"
          assert abs(log2_by_halving(1.5) - _m.log2(1.5)) < 1e-6, "It should work for a number between 1 and 2"
        wrong:
          - "def log2_by_halving(y):\n    low = 0\n    high = 10\n    for step in range(40):\n        mid = (low + high) / 2\n        if 2 ** mid > y:\n            high = mid\n        else:\n            low = mid\n    return high - low\n\nprint(log2_by_halving(8))\n"
          - "def log2_by_halving(y):\n    low = 0\n    high = 10\n    for step in range(3):\n        mid = (low + high) / 2\n        if 2 ** mid > y:\n            high = mid\n        else:\n            low = mid\n    return (low + high) / 2\n\nprint(log2_by_halving(8))\n"
          - "def log2_by_halving(y):\n    low = 0\n    high = 10\n    for step in range(40):\n        mid = (low + high) / 2\n        if mid ** 2 > y:\n            high = mid\n        else:\n            low = mid\n    return (low + high) / 2\n\nprint(log2_by_halving(8))\n"
        explanation: "If $2^{\\text{mid}}$ is bigger than $y$, the midpoint is too large an exponent, so the answer lies **below** it and `mid` becomes the new upper end. The starter kept the wrong half each time and so marched away from the answer. Forty halvings shrink an interval of length 10 by a factor of $2^{40}$, about a trillion."
  formal:
    - text: |
        Let $b > 0$ with $b \neq 1$. For $y > 0$, the **logarithm of $y$ to base $b$**, written $\log_b y$, is the unique number $x$ such that $b^x = y$:

        $$\log_b y = x \iff b^x = y.$$

        It is defined only for $y > 0$.

        For $M, N > 0$ and any number $k$:

        | Law | Statement | From the law of exponents |
        | --- | --- | --- |
        | Inverse | $b^{\log_b y} = y$ and $\log_b(b^x) = x$ | the definition |
        | Special values | $\log_b 1 = 0$ and $\log_b b = 1$ | $b^0 = 1$ and $b^1 = b$ |
        | Product | $\log_b(MN) = \log_b M + \log_b N$ | $b^x b^y = b^{x + y}$ |
        | Quotient | $\log_b \dfrac{M}{N} = \log_b M - \log_b N$ | $\dfrac{b^x}{b^y} = b^{x - y}$ |
        | Power | $\log_b(M^k) = k \log_b M$ | $(b^x)^k = b^{kx}$ |
        | Change of base | $\log_b y = \dfrac{\log_c y}{\log_c b}$ | the power law applied to $b^x = y$ |

        There is no law for $\log_b(M + N)$.

        **Monotonicity.** For $b > 1$, $\log_b$ is increasing: if $0 < M < N$ then $\log_b M < \log_b N$. Hence $\log_b y$ is negative for $0 < y < 1$, zero at $y = 1$, and positive for $y > 1$, and an equation or inequality between positive numbers is preserved when logarithms to a base greater than 1 are taken on both sides.

        The equation $a^x = y$, with $a > 0$, $a \neq 1$ and $y > 0$, has the single solution $x = \dfrac{\log y}{\log a}$, the logarithms being to any one base.

        **The natural logarithm** is $\ln = \log_e$, where $e = 2.71828\ldots$. It satisfies $\ln(e^x) = x$ for every real $x$ and $e^{\ln x} = x$ for $x > 0$.

        | Fact | Statement |
        | --- | --- |
        | Any base through $e$ | $b^x = e^{x \ln b}$ and $\log_b y = \dfrac{\ln y}{\ln b}$ |
        | Doubling time of $Pe^{rt}$, for $r > 0$ | $t = \dfrac{\ln 2}{r}$ |
        | Half-life of $Pe^{rt}$, for $r < 0$ | $t = \dfrac{\ln 2}{\lvert r \rvert}$ |
        | Fraction left after time $t$, half-life $T$ | $\left(\dfrac{1}{2}\right)^{t / T}$ |
        | Logit, the inverse of the sigmoid | $\sigma^{-1}(y) = \ln \dfrac{y}{1 - y}$ for $0 < y < 1$ |
  drill:
    - text: Seconds each. Turn every logarithm into the question "to what power?".
    - question:
        id: drill-log2-16
        type: numeric
        system: s1
        prompt: "What is $\\log_2 16$?"
        answer: "4"
        explanation: "$2^4 = 16$."
    - question:
        id: drill-log10
        type: numeric
        system: s1
        prompt: "What is $\\log_{10} 100000$?"
        answer: "5"
        explanation: "$10^5 = 100000$. Count the zeros."
    - question:
        id: drill-log-one
        type: numeric
        system: s1
        prompt: "What is $\\log_7 1$?"
        answer: "0"
        explanation: "$7^0 = 1$. The logarithm of 1 is 0 in every base."
    - question:
        id: drill-log-fraction
        type: numeric
        system: s1
        prompt: "What is $\\log_2 \\dfrac{1}{8}$?"
        answer: "-3"
        explanation: "$2^{-3} = \\dfrac{1}{8}$. A number below 1 has a negative logarithm."
    - question:
        id: drill-log-root
        type: numeric
        system: s1
        prompt: "What is $\\log_{25} 5$? Give an exact answer."
        answer: "1/2"
        explanation: "$25^{1/2} = 5$."
    - question:
        id: drill-to-exponential
        type: choice
        system: s1
        prompt: "Which statement says the same as $\\log_3 81 = 4$?"
        options: ["$3^{81} = 4$", "$4^3 = 81$", "$3^4 = 81$", "$81^4 = 3$"]
        answer: 2
        explanation: The base of the logarithm is the base of the power, and the logarithm is the exponent.
    - question:
        id: drill-product-law
        type: choice
        system: s1
        prompt: "$\\log_2 5 + \\log_2 7$ equals which of these?"
        options: ["$\\log_2 12$", "$\\log_2 35$", "$\\log_4 35$", "$\\log_2 5 \\times \\log_2 7$"]
        answer: 1
        explanation: A sum of logarithms is the logarithm of the product.
    - question:
        id: drill-power-law
        type: choice
        system: s1
        prompt: "$\\log_{10}(x^3)$ equals which of these, for $x > 0$?"
        options: ["$(\\log_{10} x)^3$", "$3 \\log_{10} x$", "$\\log_{10} 3x$", "$3 + \\log_{10} x$"]
        answer: 1
        explanation: The power law brings the exponent down as a multiplier.
    - question:
        id: drill-ln-e
        type: numeric
        system: s1
        prompt: |
          What is $\ln(e^5)$?
        answer: "5"
        explanation: The natural logarithm is the inverse of the exponential with base e, so they cancel.
    - question:
        id: drill-rule-of-70
        type: numeric
        system: s1
        prompt: |
          By the rule of 70, about how many years does a quantity growing at 10% a year take to double?
        answer: "7"
        explanation: 70 divided by the percentage rate.
    - question:
        id: drill-half-lives
        type: choice
        system: s1
        prompt: |
          A substance has a half-life of 3 days. What fraction of it remains after 9 days?
        options: ["$\\dfrac{1}{3}$", "$\\dfrac{1}{6}$", "$\\dfrac{1}{8}$", "$\\dfrac{1}{9}$"]
        answer: 2
        explanation: Nine days is three half-lives, and halving three times leaves an eighth.
    - question:
        id: predict-math-log
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import math
          print(math.log2(32), math.log10(0.01), math.log2(1))
        output: "5.0 -2.0 0.0"
        explanation: "$2^5 = 32$, $10^{-2} = 0.01$ and $2^0 = 1$. The functions return floats."
    - question:
        id: predict-exp-log
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import math
          print(math.exp(0), math.log(1), round(math.e, 3))
        output: "1.0 0.0 2.718"
        explanation: e to the 0 is 1, the natural log of 1 is 0, and e rounded to three places is 2.718. Both functions return floats.
  work:
    - text: Slower now. Estimate each logarithm between two whole numbers before you compute it.
    - question:
        id: work-solve-exponential
        type: numeric
        system: s2
        prompt: "Solve $5 \\times 2^x = 80$."
        answer: "4"
        explanation: "Divide both sides by 5 first: $2^x = 16$. Then $x = \\log_2 16 = 4$. Undo the multiplication before the power, since it was applied last."
    - question:
        id: work-solve-log-equation
        type: numeric
        system: s2
        prompt: "Solve $\\log_3(2x + 1) = 2$."
        answer: "4"
        explanation: "In exponential form, $2x + 1 = 3^2 = 9$, so $x = 4$. Check: $\\log_3 9 = 2$, and $2x + 1$ is positive, as it must be."
    - question:
        id: write-doubling-time
        type: code
        mode: write
        system: s2
        prompt: |
          A quantity is multiplied by `factor` at every step, with `factor` greater than 1. Write a function `steps_needed(start, factor, target)` that returns the exact, generally fractional, number of steps $x$ for which $\text{start} \times \text{factor}^x = \text{target}$, using a logarithm. All three arguments are positive. So a single cell doubling reaches 1024 in exactly 10.0 steps. Solve the equation for $x$ on paper first.
        starter: |
          import math

          def steps_needed(start, factor, target):
              # Replace the next line with your own.
              return 0

          print(steps_needed(1, 2, 1024))
          print(steps_needed(1, 2, 1000000))
        solution: |
          import math

          def steps_needed(start, factor, target):
              return math.log(target / start, factor)

          print(steps_needed(1, 2, 1024))
          print(steps_needed(1, 2, 1000000))
        tests: |
          import math as _m
          assert abs(steps_needed(1, 2, 1024) - 10) < 1e-9, "A single cell doubling reaches 1024 in 10 steps"
          assert abs(steps_needed(1, 2, 1000000) - _m.log2(1000000)) < 1e-9, "A single cell doubling reaches a million in about 19.93 steps"
          assert abs(steps_needed(5, 2, 80) - 4) < 1e-9, "5 doubled four times is 80. Divide by the start before taking the logarithm."
          assert abs(steps_needed(100, 10, 100000) - 3) < 1e-9, "100 multiplied by ten three times is 100000"
          assert abs(steps_needed(8, 2, 1)  - (-3)) < 1e-9, "A target below the start needs a negative number of steps: 8 halved three times is 1"
          assert abs(steps_needed(3, 1.5, 3)) < 1e-9, "When the target equals the start, no steps are needed"
        wrong:
          - "import math\n\ndef steps_needed(start, factor, target):\n    return math.log(target, factor)\n"
          - "import math\n\ndef steps_needed(start, factor, target):\n    return math.log(target - start, factor)\n"
          - "import math\n\ndef steps_needed(start, factor, target):\n    return math.log(factor, target / start)\n"
        explanation: "Divide both sides by the start: $\\text{factor}^x = \\dfrac{\\text{target}}{\\text{start}}$. The exponent is then the logarithm of that ratio to the base `factor`. It is the same order of undoing as in any equation: the multiplication by the start was applied last, so it is undone first."
    - question:
        id: work-solve-for-time
        type: choice
        system: s2
        prompt: |
          An investment grows continuously at 6% a year. How long until it triples? Use $\ln 3 \approx 1.099$.
        options: ["About 11.6 years", "About 18.3 years", "About 50 years", "About 33.3 years"]
        answer: 1
        explanation: |
          $Pe^{0.06t} = 3P$ gives $0.06t = \ln 3$, so $t = \dfrac{1.099}{0.06} \approx 18.3$ years. The first option is the doubling time, $\dfrac{\ln 2}{0.06}$.
    - question:
        id: write-count-digits
        type: code
        mode: write
        system: s2
        prompt: |
          The number of digits of a whole number is tied to its logarithm to base 10: a number with $d$ digits lies from $10^{d-1}$ up to just below $10^d$. Write a function `digits(n)` that returns the number of digits of a whole number `n` that is 1 or more, **without** a logarithm function and without turning the number into a string: count how many times `n` can be divided by 10, with floor division, before it reaches 0. This count is an integer logarithm, computed by a loop.
        starter: |
          def digits(n):
              # Replace the next line with your own.
              return 0

          print(digits(7), digits(1000), digits(999999))
        solution: |
          def digits(n):
              count = 0
              while n > 0:
                  n = n // 10
                  count += 1
              return count

          print(digits(7), digits(1000), digits(999999))
        tests: |
          assert "str(" not in source and "log" not in source, "Count the divisions by 10 with a loop, without str and without a logarithm function"
          assert digits(7) == 1, "7 has 1 digit"
          assert digits(10) == 2, "10 has 2 digits. A power of ten has one more digit than its exponent."
          assert digits(99) == 2, "99 has 2 digits"
          assert digits(1000) == 4, "1000 has 4 digits"
          assert digits(999999) == 6, "999999 has 6 digits"
          assert digits(2 ** 100) == 31, "2 to the power 100 has 31 digits"
        wrong:
          - "def digits(n):\n    count = 0\n    while n > 10:\n        n = n // 10\n        count += 1\n    return count\n\nprint(digits(7))\n"
          - "def digits(n):\n    count = 0\n    while n >= 10:\n        n = n // 10\n        count += 1\n    return count\n\nprint(digits(7))\n"
          - "def digits(n):\n    count = 1\n    while n > 0:\n        n = n // 10\n        count += 1\n    return count\n\nprint(digits(7))\n"
        explanation: "Each floor division by 10 removes the last digit, so the number of divisions needed to reach 0 is the number of digits. It equals the whole part of $\\log_{10} n$, plus one. That $2^{100}$ has 31 digits agrees with the rule of thumb: $100 \\times 0.301 \\approx 30.1$."
    - question:
        id: fix-log-law
        type: code
        mode: find-bug
        system: s2
        prompt: |
          Multiplying many small probabilities together gives a number too small for a float to hold, so programs add their logarithms instead. `log_of_product(xs)` should return $\log_2$ of the product of a list of positive numbers, computed **without** ever forming the product. For `[2, 4, 4]`, whose product is 32, it should return 5.0, but it returns 4.0. Decide which law of logarithms applies, and fix the accumulator.
        starter: |
          import math

          def log_of_product(xs):
              total = 1
              for x in xs:
                  total *= math.log2(x)
              return total

          print(log_of_product([2, 4, 4]))
        solution: |
          import math

          def log_of_product(xs):
              total = 0
              for x in xs:
                  total += math.log2(x)
              return total

          print(log_of_product([2, 4, 4]))
        tests: |
          assert abs(log_of_product([2, 4, 4]) - 5) < 1e-9, "The product of 2, 4 and 4 is 32, and log base 2 of 32 is 5. What becomes of a product when logarithms are taken?"
          assert abs(log_of_product([2, 2]) - 2) < 1e-9, "The product of 2 and 2 is 4, and log base 2 of 4 is 2"
          assert abs(log_of_product([0.5, 0.25]) - (-3)) < 1e-9, "The product of 0.5 and 0.25 is 0.125, whose log base 2 is -3"
          assert abs(log_of_product([1, 1, 1])) < 1e-9, "The product of ones is 1, whose logarithm is 0"
          assert abs(log_of_product([]) - 0) < 1e-9, "An empty product is 1, whose logarithm is 0. What should the accumulator start at?"
          assert abs(log_of_product([0.001] * 200) - 200 * (-9.965784284662087)) < 1e-6, "It should work when the product itself would be too small for a float"
        wrong:
          - "import math\n\ndef log_of_product(xs):\n    total = 1\n    for x in xs:\n        total += math.log2(x)\n    return total\n\nprint(log_of_product([2, 4, 4]))\n"
          - "import math\n\ndef log_of_product(xs):\n    total = 1\n    for x in xs:\n        total *= x\n    return math.log2(total)\n\nprint(log_of_product([2, 4, 4]))\n"
        explanation: "The logarithm of a product is the **sum** of the logarithms, so the accumulator adds and starts at 0. Multiplying the logarithms has no meaning. Forming the product first and then taking one logarithm would be right on paper, but for two hundred factors of 0.001 the product underflows to 0.0 as a float, and zero has no logarithm."
    - question:
        id: write-sigmoid
        type: code
        mode: write
        system: s2
        prompt: |
          Write two functions. `sigmoid(x)` returns $\dfrac{1}{1 + e^{-x}}$. `logit(y)` is its inverse, for $0 < y < 1$: it returns $\ln\dfrac{y}{1 - y}$. The program then prints the sigmoid of 0, and the result of applying `logit` to `sigmoid(2)`, rounded to 6 places.
        starter: |
          import math

          def sigmoid(x):
              # Replace the next line with your own.
              return x

          def logit(y):
              # Replace the next line with your own.
              return y

          print(sigmoid(0), round(logit(sigmoid(2)), 6))
        solution: |
          import math

          def sigmoid(x):
              return 1 / (1 + math.exp(-x))

          def logit(y):
              return math.log(y / (1 - y))

          print(sigmoid(0), round(logit(sigmoid(2)), 6))
        tests: |
          import math as _m
          assert sigmoid(0) == 0.5, "The sigmoid of 0 is exactly one half"
          assert abs(sigmoid(1) - 0.7310585786) < 1e-9, "The sigmoid of 1 is about 0.731"
          assert abs(sigmoid(-1) + sigmoid(1) - 1) < 1e-12, "sigmoid(-x) is 1 - sigmoid(x)"
          assert 0.999 < sigmoid(10) < 1 and 0 < sigmoid(-10) < 0.001, "Large inputs are squashed towards 1 and large negative inputs towards 0"
          assert abs(logit(0.5)) < 1e-12, "The logit of one half is 0"
          assert abs(logit(0.8) - _m.log(4)) < 1e-9, "The logit of 0.8 is ln(0.8 / 0.2) = ln 4"
          for _x in [-3, -0.5, 0, 1.25, 4]:
              assert abs(logit(sigmoid(_x)) - _x) < 1e-9, "logit should undo sigmoid"
          for _y in [0.1, 0.5, 0.9]:
              assert abs(sigmoid(logit(_y)) - _y) < 1e-9, "sigmoid should undo logit"
          assert output.strip() == "0.5 2.0", "The program should print 0.5 2.0"
        wrong:
          - "import math\n\ndef sigmoid(x):\n    return 1 / (1 + math.exp(x))\n\ndef logit(y):\n    return math.log(y / (1 - y))\n\nprint(sigmoid(0), round(logit(sigmoid(2)), 6))\n"
          - "import math\n\ndef sigmoid(x):\n    return 1 / 1 + math.exp(-x)\n\ndef logit(y):\n    return math.log(y / (1 - y))\n\nprint(sigmoid(0), round(logit(sigmoid(2)), 6))\n"
          - "import math\n\ndef sigmoid(x):\n    return 1 / (1 + math.exp(-x))\n\ndef logit(y):\n    return math.log(y) / (1 - y)\n\nprint(sigmoid(0), round(logit(sigmoid(2)), 6))\n"
        explanation: |
          The sigmoid is a chain: negate, exponentiate, add 1, take the reciprocal. Its inverse undoes the chain backwards. From $y = \dfrac{1}{1 + e^{-x}}$, $\dfrac{1}{y} - 1 = e^{-x}$, so $e^x = \dfrac{y}{1 - y}$ and $x = \ln\dfrac{y}{1 - y}$. The pair is how a model's raw scores are turned into probabilities and back.
    - question:
        id: fix-half-life
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `remaining(amount, half_life, time)` should return how much of a decaying quantity is left after `time`, given its half-life in the same units. `remaining(80, 3, 9)` should be `10.0`, since 9 is three half-lives. It returns `66.66...`. Find the mistake and fix it.
        starter: |
          def remaining(amount, half_life, time):
              return amount * 0.5 ** half_life / time

          print(remaining(80, 3, 9))
        solution: |
          def remaining(amount, half_life, time):
              return amount * 0.5 ** (time / half_life)

          print(remaining(80, 3, 9))
        tests: |
          assert abs(remaining(80, 3, 9) - 10) < 1e-9, "Three half-lives: 80 -> 40 -> 20 -> 10. The exponent is the number of half-lives that have passed."
          assert remaining(80, 3, 0) == 80, "After no time, everything remains"
          assert abs(remaining(80, 3, 3) - 40) < 1e-9, "After one half-life, half remains"
          assert abs(remaining(100, 10, 5) - 100 * 0.5 ** 0.5) < 1e-9, "Half a half-life leaves 1 over root 2 of the amount"
          assert abs(remaining(1, 2, 20) - 1 / 1024) < 1e-12, "Ten half-lives leave one part in 1024"
        wrong:
          - "def remaining(amount, half_life, time):\n    return amount * 0.5 ** (half_life / time)\n\nprint(remaining(80, 3, 9))\n"
          - "def remaining(amount, half_life, time):\n    return amount * 0.5 * (time / half_life)\n\nprint(remaining(80, 3, 9))\n"
          - "def remaining(amount, half_life, time):\n    return amount * 0.5 ** time / half_life\n\nprint(remaining(80, 3, 9))\n"
        explanation: The number of half-lives that have passed is the time divided by the half-life, and the quantity is halved once for each, so that quotient is the exponent. It needs brackets, because a power is computed before a division. The starter also had the quotient upside down.
    - question:
        id: change-of-base-estimate
