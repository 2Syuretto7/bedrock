    - question:
        id: why-log-product
        type: order
        system: s2
        prompt: "Put the steps of the proof that $\\log_b(MN) = \\log_b M + \\log_b N$ in order."
        steps:
          - "Let $x = \\log_b M$ and $y = \\log_b N$."
          - "By the definition of a logarithm, $M = b^x$ and $N = b^y$."
          - "Multiply: $MN = b^x \\times b^y$."
          - "By the product law of exponents, $MN = b^{x + y}$."
          - "By the definition again, $\\log_b(MN) = x + y = \\log_b M + \\log_b N$."
        explanation: The proof translates into exponential form, uses a law of exponents there, and translates back. Every law of logarithms is proved in this way.
    - question:
        id: log-scale
        type: choice
        system: s2
        prompt: |
          The values 3, 6, 12, 24, 48 are recorded at equal intervals of time. If the logarithm of each value is plotted against time, what will the plot look like, and why?
        options:
          - "A curve bending upwards, because the values grow faster and faster."
          - "A straight line, because each step multiplies the value by the same factor, which adds the same amount to its logarithm."
          - "A horizontal line, because logarithms remove all growth."
          - "A curve that rises and then falls back, because logarithms grow so slowly."
        answer: 1
        explanation: "Each value is twice the one before. Taking logarithms, $\\log(2v) = \\log 2 + \\log v$, so each step adds the constant $\\log 2$. Equal steps in time give equal steps in the logarithm, which is the definition of a straight line."
  connections:
    - text: |
        The last of the elementary operations now has its undoing. A power with an unknown base is undone by a root. A power with an unknown exponent is undone by a logarithm. And logarithms, being exponents, obey the laws of exponents read backwards: products become sums, quotients differences, powers multiples.

        That last fact is the reason logarithms are in every machine learning program. A language model assigns a probability to each next word, and the probability of a whole sentence is the product of hundreds of small numbers, far too small for any float. So nobody multiplies. Everyone adds logarithms, exactly as you did in today's work, and the quantity that training tries to improve is a sum of logarithms of probabilities. When you read that a model's **loss** is 2.3, that number is a logarithm.

        Logarithms also measure **information**. To pick out one item among eight equally likely ones takes three yes-or-no questions, because $\log_2 8 = 3$. The unit of that measure, the bit, is a logarithm to base 2, and the theory built on it will tell you how much a model has learnt.

        The halving search you repaired today is one of the most important algorithms there is. It finds an item in a sorted list of a million in about twenty steps, because $\log_2$ of a million is about 20. Whenever an algorithm's cost is described as logarithmic, a halving is hiding inside it.

        Every question today was about one step repeated: multiply by the same factor again and again, and ask how many times. The next lesson keeps the repeated step but asks something new. A recurring deposit adds the same ₹1,000 every month, and a message forwarded to two new people at every step doubles its reach each time. What do all the steps **add up to**, and can the total be found without adding the terms one by one? That is the subject of [[f1.arithmetic-and-geometric-series]], and logarithms will be there to say how many terms are needed to reach a given total.
