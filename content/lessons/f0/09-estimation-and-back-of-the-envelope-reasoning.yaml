concept: f0.estimation-and-back-of-the-envelope-reasoning
minutes: 85
claim: You can round to a place or to significant figures, estimate a product in your head through its powers of ten, break a question you have no data for into factors you can guess, size a system for its peak and not only its average, and catch a wrong answer by its sign, its size or its sense before trusting it.
recalls: [f0.units-prefixes-and-orders-of-magnitude]
uses: [f0.fractions-decimals-and-percentages, f0.powers-and-roots, f0.powers-of-two, f0.ratio-rate-and-proportion]
leads: [s0.what-a-program-is, f6.capacity-planning]
parts:
  recall:
    - text: |
        [[f0.units-prefixes-and-orders-of-magnitude]] wrote every quantity as a front number times a power of ten, so that products became additions of exponents. This lesson uses that to answer questions with no data at all. Two quick pulls first.
  puzzle:
    - text: |
        You are in an interview for a job on a payments team. The interviewer leans back and asks: "Roughly how many UPI payments does India make every second?"

        There is no laptop and no search engine. You have not memorised the figure, and you suspect that is the point. The interviewer does not want a number you have read. They want to watch you get to a sensible number from things you already know, and to see whether you can tell a sensible number from a silly one.

        It is not a trick question. It is the most ordinary question in engineering. Before anyone builds a system, someone has to say how big it must be: how many requests a second, how many bytes a day, how many machines. Those numbers are needed long before anyone can measure them, and a design that is out by a factor of ten in either direction fails. Too small, and the system falls over on its first busy evening. Too big, and the company pays for a hundred idle machines.

        And it cuts the other way too. A slide in a meeting says the payment system "handles 2 million payments a second". Is that believable, or has someone slipped a few zeros?

        Here is the puzzle. **How do you get the right order of magnitude for a quantity you have no data for, in a couple of minutes, and how do you know when a number you are shown cannot be right?**
  intuition:
    - text: |
        Look at the question the way you would look at a map from an aeroplane. From that height the fine detail vanishes and only the big features remain. Nobody needs to know whether the answer is 6,800 or 7,300. What matters is whether it is near a thousand, near ten thousand or near a hundred thousand.

        From that height the question breaks into pieces, and each piece is something you can guess. How many people are in India? About 140 crore, which is $1.4 \times 10^9$. What share of them use UPI? Not the youngest children, not many of the oldest, not everyone without a smartphone: perhaps a third, call it 40 crore. How many payments does a user make in a day? Some make five or six, for chai and auto rides and groceries; many make none on a given day; one or two is a fair middle. How many seconds are in a day? That one you can work out exactly.

        Multiply the pieces, and the answer to a question you knew nothing about appears out of guesses you were fairly sure of. This is called a **Fermi estimate**, after a physicist who was famous for doing it. It works for two reasons. First, each guess is usually within a factor of two or three of the truth, and you are only asking for the order of magnitude. Second, when several guesses are multiplied, some are too high and some too low, and their errors partly cancel.

        The figure below shows counts you can lean on, on a scale where each step multiplies by ten. Compare the people of India with the UPI payments made in a month, and read how many payments that is per person.
    - figure: log-scale
      props: { set: counts, first: 5, second: 6 }
  derivation:
    - text: |
        **Rounding to a place.** To round to the nearest hundred, ask which multiple of a hundred the number is closest to. 6,482 lies between 6,400 and 6,500. The halfway mark is 6,450, and 6,482 is beyond it, so it rounds to 6,500. In practice: look at the digit just to the right of the place you are keeping; 5 or more rounds up, 4 or less rounds down. Rounding to the nearest hundred never moves a number by more than 50, half of the place.

        **Significant figures.** "To the nearest hundred" suits numbers in the thousands but is useless for 0.0213. What we really want is to keep a certain number of **leading digits**, wherever they are. The first non-zero digit from the left is the first **significant figure**. To one significant figure, 4,870 is 5,000 and 0.0213 is 0.02. To two, they are 4,900 and 0.021. One significant figure is enough to catch a mistake in size; two are enough for most estimates.

        **Estimating a product.** Is $4870 \times 0.0213 = 1037.31$ right? Round each to one significant figure and write it with its power of ten:

        $$4870 \times 0.0213 \approx (5 \times 10^3) \times (2 \times 10^{-2}) = 10 \times 10^{1} = 10^2.$$

        The sign $\approx$ means "is approximately". The answer must be near 100, so 1037.31 is impossible. The true value is 103.731: every digit was right and the decimal point was in the wrong place, which is the most common and most damaging slip in all numerical work.
    - question:
        id: product-size
        type: choice
        system: s2
        prompt: |
          A data table has 784 columns and 512 rows of numbers. Without calculating exactly, which is closest to how many numbers it holds?
        options: ["4,000", "40,000", "400,000", "4,000,000"]
        answer: 2
        explanation: |
          About $(8 \times 10^2) \times (5 \times 10^2) = 40 \times 10^4 = 4 \times 10^5$. The exact value is 401,408.
    - text: |
        **Two numbers worth knowing.** A day has $24 \times 60 \times 60 = 86{,}400$ seconds, which is $8.64 \times 10^4$, close enough to $10^5$ for a first guess. A year has about $3 \times 10^7$ seconds. Estimate that one to see the method work:

        $$60 \times 60 \times 24 \times 365 \approx (6 \times 10^1) \times (6 \times 10^1) \times (2 \times 10^1) \times (4 \times 10^2).$$

        Front numbers: $6 \times 6 \times 2 \times 4 = 288$, about $3 \times 10^2$. Powers: $10^{1+1+1+2} = 10^5$. Together about $3 \times 10^7$. The exact figure is 31,536,000, so one significant figure each gave an answer within five per cent. It worked so well because 24 was rounded down to 20 and 365 up to 400, and the errors partly cancelled. That suggests a tactic: when you round one factor up, round another down if you can.

        **Now the puzzle.** Multiply the guesses:

        $$\underbrace{4 \times 10^8}_{\text{users}} \times \underbrace{1.5}_{\text{payments per user per day}} = 6 \times 10^8 \text{ payments a day}.$$

        Divide by the seconds in a day:

        $$\frac{6 \times 10^8}{8.64 \times 10^4} \approx 0.7 \times 10^4 = 7 \times 10^3.$$

        About 7,000 payments every second, on average. How good is that? The National Payments Corporation of India publishes the real counts, and in 2025 they passed 20 billion payments a month. A month is about $2.6 \times 10^6$ seconds, so that is

        $$\frac{2 \times 10^{10}}{2.6 \times 10^6} \approx 0.77 \times 10^4 \approx 7{,}700 \text{ a second}.$$

        The estimate, built from guesses, is within about 10% of the published figure. It need not have been that close. Within a factor of two would still have been a good answer, because it gets the order of magnitude right.

        **Peaks, not averages.** An engineer does not build for the average. Few people pay for chai at 3 a.m., and a great many pay at 7 p.m.; on the evening of a festival sale, more still. If the busiest hour carries three times the average rate, the system must handle about $3 \times 7{,}700 \approx 23{,}000$ payments a second, or it fails exactly when it matters most. The ratio of the peak to the average is called the **peak factor**, and every sizing estimate should state the one it assumed.
    - question:
        id: peak-capacity
        type: numeric
        system: s2
        prompt: |
          A ticket-booking site averages 1,200 requests a second over a day. At 10 a.m., when bookings for the next day open, the rate is 8 times the average. How many requests a second must the site handle at that peak?
        answer: "9600"
        unit: requests a second
        explanation: |
          $8 \times 1200 = 9600$. Sizing for the average would leave the site with an eighth of the capacity it needs at the one moment everybody is watching.
    - text: |
        **When you cannot even guess a piece.** Sometimes a factor is truly unknown. Then give a low bound and a high bound that you are sure of, and take the middle *in orders of magnitude*, not the ordinary middle. If you are sure a quantity is more than 100 and less than 10,000, the ordinary middle is about 5,000, which is fifty times the low bound and only half the high one. The middle on the ladder of powers of ten is $10^3 = 1000$, which is ten times one end and a tenth of the other. That is the fairer guess when you know only the order of magnitude.

        **Three checks for any answer.** Before trusting a result, yours or anyone else's, ask:

        1. **Sign.** Should it be positive or negative?
        2. **Size.** Which power of ten should it be near?
        3. **Sense.** Does it respect an obvious limit? A part cannot exceed the whole. A product of two numbers below one must be smaller than either. A rate per person cannot be more than a person could possibly do.

        The slide claiming 2 million payments a second fails the sense check at once. That would be $2 \times 10^6 \times 8.64 \times 10^4 \approx 1.7 \times 10^{11}$ payments a day, which is more than a hundred payments for every person in India, every day. Someone has added a few zeros.
  formal:
    - text: |
        **Rounding** a number to a given place replaces it by the nearest multiple of that place. A number exactly halfway is, by the usual convention, rounded up. The change made by rounding is at most half a unit of the place rounded to.

        The **significant figures** of a number are its digits starting from the first non-zero digit on the left. Rounding to $k$ significant figures keeps $k$ of them.

        A **Fermi estimate** writes an unknown quantity as a product of factors, guesses each to one or two significant figures, writes each in scientific notation, and multiplies by multiplying the front numbers and adding the exponents.

        The **middle of two bounds in orders of magnitude**: if a quantity lies between $10^a$ and $10^b$, the fairer single guess is $10^{(a+b)/2}$, the power of ten halfway between them on the ladder.

        **Peak factor.** The rate a system must handle is its average rate times its peak factor, the ratio of the busiest rate to the average.

        **Numbers worth knowing.** A day is $86{,}400 \approx 10^5$ seconds. A year is about $3.15 \times 10^7$ seconds. India has about $1.4 \times 10^9$ people. $2^{10} \approx 10^3$.

        **Checks.** Sign, size and sense, before any answer is trusted.
  drill:
    - text: Seconds each. Estimate; do not calculate exactly.
    - question:
        id: round-hundred
        type: numeric
        system: s1
        prompt: Round 6,482 to the nearest hundred.
        answer: "6500"
        explanation: The tens digit is 8, which is 5 or more, so round up.
    - question:
        id: round-sigfig
        type: numeric
        system: s1
        prompt: Round 0.0473 to one significant figure.
        answer: "0.05"
        explanation: The first significant figure is the 4. The next digit is 7, so it rounds up.
    - question:
        id: seconds-in-day
        type: choice
        system: s1
        prompt: Which power of ten is closest to the number of seconds in a day?
        options: ["$10^{3}$", "$10^{4}$", "$10^{5}$", "$10^{7}$"]
        answer: 2
        explanation: "86,400 is $8.64 \\times 10^4$, much nearer $10^5$ than $10^4$."
    - question:
        id: multiply-scientific
        type: numeric
        system: s1
        prompt: |
          $(2 \times 10^3) \times (4 \times 10^2) = 8 \times 10^n$. What is $n$?
        answer: "5"
        explanation: Front numbers multiply, exponents add.
    - question:
        id: percent-estimate
        type: choice
        system: s1
        prompt: Which is closest to 19.6% of 5,120?
        options: ["100", "1,000", "2,500", "10,000"]
        answer: 1
        explanation: About 20% of about 5,000, which is a fifth of 5,000.
    - question:
        id: middle-of-bounds
        type: choice
        system: s1
        prompt: A quantity is surely more than $10^2$ and less than $10^6$. What is the fairer single guess?
        options: ["$10^{4}$", "$5 \\times 10^{5}$", "$10^{3}$", "$10^{6}$"]
        answer: 0
        explanation: Halfway up the ladder from exponent 2 to exponent 6 is exponent 4.
  work:
    - text: Slower now. For each, estimate first, write your factors down, and only then calculate.
    - question:
        id: fermi-steps
        type: order
        system: s2
        prompt: Put the steps of a Fermi estimate into order.
        steps:
          - Break the unknown quantity into a product of factors you can guess.
          - Guess each factor to one or two significant figures.
          - Write each guess as a front number times a power of ten.
          - Multiply the front numbers together and add the exponents.
          - Check the result for sign, size and sense.
        explanation: The breaking down comes first, because it turns one impossible guess into several easy ones. The checks come last and are never skipped.
    - question:
        id: log-storage
        type: numeric
        system: s2
        prompt: |
          A service handles 3,000 requests a second, all day, and writes a 1,000-byte log line for each. Estimate how many gigabytes (SI, $10^9$ bytes) of logs it writes in a day.
        answer: "260"
        tolerance: "45"
        unit: GB
        explanation: |
          $(3 \times 10^3) \times 10^3 = 3 \times 10^6$ bytes a second. Times $8.64 \times 10^4$ seconds is about $2.6 \times 10^{11}$ bytes, which is 260 GB. Using $10^5$ for the day gives 300 GB, also fine for sizing: either way, roughly a quarter of a terabyte every day, about 100 TB a year.
    - question:
        id: sense-check
        type: choice
        system: s2
        prompt: |
          A report states that $0.48 \times 0.52 = 2.496$. Without calculating exactly, what can you say?
        options:
          - "It is plausible, since $48 \\times 52 = 2496$."
          - "It must be wrong. Both numbers are about a half, so the product is about a quarter, and a product of two numbers below one cannot exceed either of them."
          - "It must be wrong, because the answer should be negative."
          - "Nothing can be said without a calculator."
        answer: 1
        explanation: The digits are right and the size is wrong by an order of magnitude. The true value is 0.2496. This is the sense check.
    - question:
        id: bad-slide
        type: choice
        system: s2
        prompt: |
          A slide says a city's metro, which carries about 20 lakh riders a day, records "50 crore card taps a day". Which check shows fastest that this is wrong?
        options:
          - "Sense: it is 250 taps for every rider every day, and a rider taps in and out once or twice a day."
          - "Sign: taps cannot be counted in crore."
          - "Size: crore is an Indian unit and lakh is not."
          - "Nothing is wrong, because big cities have many taps."
        answer: 0
        explanation: |
          $50 \text{ crore} \div 20 \text{ lakh} = \frac{5 \times 10^8}{2 \times 10^6} = 250$ taps per rider per day. Someone has added two zeros, or confused lakh with crore.
    - question:
        id: average-from-month
        type: numeric
        system: s2
        prompt: |
          A food delivery app takes 6 crore orders in a 30-day month. On average, about how many orders arrive each second? Use $2.6 \times 10^6$ seconds for the month.
        answer: "23"
        tolerance: "2"
        unit: orders a second
        explanation: |
          $\frac{6 \times 10^7}{2.6 \times 10^6} \approx 2.3 \times 10^1$, about 23 a second on average. The dinner-time peak will be several times higher.
  connections:
    - text: |
        The puzzle is answered. Break the unknown into factors you can guess, write each as a front number times a power of ten, multiply, and check the result for sign, size and sense. India makes about seven or eight thousand UPI payments a second on average, more at the evening peak, and nowhere near two million.

        That completes the first cluster. Look at how far the ground has been built from nothing. You began with digits in places, defined four operations and found their laws, sealed two leaks with fractions and negative numbers, gave repeated multiplication a notation, met the powers of two that every computer counts in, learned to compare by ratio and to chain rates, and gave every size a name and an exponent. Estimation is the supervisor of all of it. From now on every numeric question in this course is an invitation to estimate first.

        These estimates grow up later. In [[f6.capacity-planning]] the peak factor, the averages and the guesses become a method for deciding how many machines a service needs, with queues and waiting times worked out properly.

        Next, the arithmetic moves to a new place. Until now you have done every calculation yourself. A computer can do them for you, exactly and by the million, if you can say precisely what you want. That is programming, and it begins with [[s0.what-a-program-is]]. The first things you type will be the operations of this cluster, and the three checks will be the first tests you run on anything a program prints.
