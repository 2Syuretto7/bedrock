concept: f0.the-four-operations-and-order-of-operations
minutes: 75
claim: You can explain what adding, subtracting, multiplying and dividing whole numbers mean, rebuild the written methods from place value, and evaluate any expression in the agreed order.
recalls: [f0.whole-numbers-and-place-value]
uses: []
leads: [f0.fractions-decimals-and-percentages, f1.variables-and-expressions]
parts:
  recall:
    - text: |
        The last lesson, [[f0.whole-numbers-and-place-value]], said that a number is a sum of digits times places, each place worth ten of the place to its right. Two quick questions to pull that back out before we lean on it.
  puzzle:
    - text: |
        Four friends finish dinner at a dhaba. The bill has one line for the food:

        $$3 \times 15 + 2 \times 120$$

        Three rotis at ₹15 each and two plates of dal at ₹120 each. Anika reads the line the way she would type it into the cheap calculator on her phone's lock screen, one key at a time from the left. Three times 15 is 45. Add 2 to get 47. Times 120 is 5,640. She looks up, alarmed: "₹5,640 for rotis and dal?"

        Rohan reads the same line and says ₹285. He worked out the rotis, 45, and the dal, 240, and added them.

        Nobody at the table doubts that the food cost ₹285. But Anika did not make an arithmetic slip. Every step she took was a correct multiplication or a correct addition. Her calculator did exactly what it was told. A scientific calculator, a spreadsheet and every programming language you will ever use agree with Rohan.

        So the two of them did not disagree about numbers. They disagreed about what the *line* means. Either one reading is wrong, or else a line of arithmetic has no fixed meaning, and nothing written on a bill, in a textbook or in a program could be trusted.

        Which reading is right, and is that a fact about numbers or only a habit people agreed on? To answer, we first need to say precisely what the four operations *are*.
  intuition:
    - text: |
        There are really only two ideas, and each comes with its undoing.

        **Adding is putting together.** Five coins in one hand and three in the other: close your hands together and count. You do not need to start again from one. Start at five and count on three more: six, seven, eight. On a number line, adding three is taking three steps to the right.

        **Subtracting undoes adding.** It answers the question "what must I add to this to reach that?" The difference $8 - 3$ is the number that, added to 3, gives 8. On the number line it is three steps back to the left, or equally the gap between 3 and 8.
    - figure: number-line
      props: { min: 0, max: 12, start: 5 }
    - text: |
        **Multiplying is adding equal groups.** Three bags with four oranges each hold $4 + 4 + 4$ oranges. We write that as $3 \times 4$, read "three fours". Multiplication is not a new thing in the world. It is shorthand for a particular kind of repeated addition, the kind where every group is the same size.

        The best picture of multiplication is a rectangle of dots: three rows of four. Count the rows and you see $3 \times 4$. Turn your head sideways and the same dots are four rows of three, $4 \times 3$. Nothing was added or removed by turning your head, so the two must be equal. That is the whole reason why the order of a multiplication does not matter.

        **Dividing undoes multiplying.** $12 \div 4$ asks "how many fours make 12?", or equally, "if 12 is shared into 4 equal groups, how big is each?" Both questions have the answer 3, because $3 \times 4 = 12$. The two readings are the same rectangle looked at two ways.

        Play with the rectangle below before going on. Change the rows and columns and watch the total. Then drag the **split** slider and watch the rectangle fall into two smaller rectangles whose totals add up to the whole.
    - figure: area-grid
      props: { rows: 3, columns: 12, split: 10 }
  derivation:
    - text: |
        **The law hiding in the split.** Cut a rectangle of 3 rows and 12 columns after the tenth column. On the left are 3 rows of 10. On the right are 3 rows of 2. No dot was created or destroyed, so

        $$3 \times 12 = 3 \times 10 + 3 \times 2 = 30 + 6 = 36.$$

        Nothing about this depends on the particular numbers. For any whole numbers,

        $$a \times (b + c) = a \times b + a \times c.$$

        The letters $a$, $b$ and $c$ are labels standing for any three whole numbers you care to choose, so that one line states the fact for all of them at once.

        This is the **distributive law**. It is the single most used fact in all of algebra, and you have just seen why it is true: a rectangle can be cut in two.

        **Written multiplication is this law plus place value.** To work out $28 \times 28$, split one of the 28s into its places, $20 + 8$:

        $$28 \times 28 = 28 \times 20 + 28 \times 8.$$

        Each piece is easier. $28 \times 8$ can be split again: $20 \times 8 + 8 \times 8 = 160 + 64 = 224$. And $28 \times 20$ is $28 \times 2$ tens, which is 56 tens, or 560. The method you may have been taught at school, with its rows and its shifted zeros, is exactly this. Each row is one place of one number multiplied by the whole of the other, and the shift is the place.
    - question:
        id: split-multiply
        type: numeric
        system: s2
        prompt: |
          A small greyscale picture is a grid of 28 rows and 28 columns of dots called pixels. Using the two pieces found above, $28 \times 20$ and $28 \times 8$, how many pixels does it have?
        answer: "784"
        unit: pixels
        explanation: |
          $28 \times 20 = 560$ and $28 \times 8 = 224$, and $560 + 224 = 784$. You will meet this exact number again: it is the size of the pictures in the most famous beginner's data set in machine learning.
    - text: |
        **Written addition is place value with carries.** To add 367 and 285, add the ones: $7 + 5 = 12$, which is one ten and two ones. Write 2 and carry the ten. Tens: $6 + 8 + 1 = 15$ tens, which is one hundred and five tens. Write 5 and carry. Hundreds: $3 + 2 + 1 = 6$. Result 652. The carry is the shopkeeper from the last lesson wrapping ten coins into a roll.

        **Division with something left over.** Twelve divides evenly into fours. But 14 does not: three fours make 12, and two are left. We say the **quotient** is 3 and the **remainder** is 2, and we can write the whole story in one line with no division sign at all:

        $$14 = 3 \times 4 + 2.$$

        In general, dividing $a$ by $b$ means finding the quotient $q$ and remainder $r$ with

        $$a = q \times b + r, \qquad 0 \le r < b.$$

        Read $0 \le r < b$ as "$r$ is at least 0 and less than $b$". The condition says you kept taking groups of $b$ until fewer than $b$ were left. It is what makes the answer unique.

        **Why you cannot divide by zero.** $12 \div 0$ asks "what number times 0 gives 12?" But any number times 0 is 0, never 12. No number answers the question. And $0 \div 0$ asks "what number times 0 gives 0?", which every number answers. One question has no answer and the other has all of them, so neither is given a value. This is not a rule imposed from outside. It falls out of what division means.
    - question:
        id: quotient-remainder
        type: numeric
        system: s2
        prompt: |
          $47 = q \times 6 + r$ with $0 \le r < 6$. Find the remainder $r$.
        answer: "5"
        explanation: |
          Seven sixes are 42 and eight sixes are 48, which is too many. So $q = 7$ and $r = 47 - 42 = 5$.
    - text: |
        **Now the puzzle.** What does $3 \times 15 + 2 \times 120$ mean? Remember that $3 \times 15$ is shorthand for $15 + 15 + 15$, and $2 \times 120$ for $120 + 120$. Unpack the shorthand and the bill reads

        $$15 + 15 + 15 + 120 + 120 = 285.$$

        That is one roti, another, another, one dal and another: exactly what was eaten. The multiplications have to be done first because each *is* a packed-up addition, and you must unpack it before you can add across it. Anika's calculator quietly changed the sentence into $(3 \times 15 + 2) \times 120$, which is forty-seven plates of dal. That is a different sentence about a much larger dinner.

        The same thing happens with smaller numbers. $2 + 3 \times 4$ means $2 + 4 + 4 + 4 = 14$, and the left-to-right answer of 20 is really $(2 + 3) \times 4$, five fours.

        So the order has a reason, and on top of the reason sits an agreement, so that everyone reads a line the same way:

        1. **Brackets first.** Whatever is inside brackets is worked out before anything outside touches it. Brackets are how a writer overrides everything below.
        2. **Then multiplication and division**, working from left to right.
        3. **Then addition and subtraction**, working from left to right.

        The "left to right" matters. $20 - 8 - 5$ means $(20 - 8) - 5 = 7$. Grouping it the other way, $20 - (8 - 5)$, gives 17. Addition does not care how it is grouped, and neither does multiplication, but subtraction and division do, so a direction had to be chosen. The choice is left to right.
  formal:
    - text: |
        For whole numbers $a$, $b$ and $c$:

        | Law | Addition | Multiplication |
        | --- | --- | --- |
        | Order does not matter (commutative) | $a + b = b + a$ | $a \times b = b \times a$ |
        | Grouping does not matter (associative) | $(a + b) + c = a + (b + c)$ | $(a \times b) \times c = a \times (b \times c)$ |
        | Doing nothing (identity) | $a + 0 = a$ | $a \times 1 = a$ |

        Linking the two: $a \times (b + c) = a \times b + a \times c$ (distributive), and $a \times 0 = 0$.

        **Subtraction** is defined by addition: $a - b$ is the number $d$ with $b + d = a$. **Division** is defined by multiplication: for $b$ not zero, the quotient $q$ and remainder $r$ of $a$ divided by $b$ are the unique whole numbers with $a = q \times b + r$ and $0 \le r < b$. When $r = 0$ we write $a \div b = q$. Division by zero is undefined.

        Subtraction and division are **not** commutative and **not** associative: $8 - 3$ is not $3 - 8$, and $(24 \div 4) \div 2$ is not $24 \div (4 \div 2)$.

        **Order of operations.** Brackets, innermost first; then $\times$ and $\div$ from left to right; then $+$ and $-$ from left to right.
  drill:
    - text: Seconds each. These facts need to be instant, because every later calculation is built out of them.
    - question:
        id: times-fact
        type: numeric
        system: s1
        prompt: "$7 \\times 8$"
        answer: "56"
        explanation: Seven eights. If it was not instant, split it as $7 \times 4$ doubled.
    - question:
        id: order-plain
        type: numeric
        system: s1
        prompt: "$4 + 6 \\times 5$"
        answer: "34"
        explanation: Multiplication first, $6 \times 5 = 30$, then add 4.
    - question:
        id: order-brackets
        type: numeric
        system: s1
        prompt: "$(4 + 6) \\times 5$"
        answer: "50"
        explanation: The brackets override. Ten fives.
    - question:
        id: left-to-right-minus
        type: numeric
        system: s1
        prompt: "$30 - 12 - 8$"
        answer: "10"
        explanation: Left to right. $30 - 12 = 18$, then $18 - 8$.
    - question:
        id: left-to-right-divide
        type: numeric
        system: s1
        prompt: "$48 \\div 4 \\div 2$"
        answer: "6"
        explanation: Left to right. $48 \div 4 = 12$, then $12 \div 2$.
    - question:
        id: distributive-spot
        type: choice
        system: s1
        prompt: "Which of these is equal to $6 \\times 14$?"
        options:
          - "$6 \\times 10 + 4$"
          - "$6 \\times 10 + 6 \\times 4$"
          - "$6 + 10 \\times 6 + 4$"
          - "$60 \\times 4$"
        answer: 1
        explanation: Splitting 14 into $10 + 4$ cuts the rectangle into six tens and six fours.
  work:
    - text: Slower now, on paper. Write every line.
    - question:
        id: evaluate-long
        type: numeric
        system: s2
        prompt: "$100 - 4 \\times (7 + 8) \\div 2$"
        answer: "70"
        explanation: |
          Brackets: $7 + 8 = 15$. Then multiplication and division left to right: $4 \times 15 = 60$, then $60 \div 2 = 30$. Last the subtraction: $100 - 30$.
    - question:
        id: evaluate-steps
        type: order
        system: s2
        prompt: "Put the steps for evaluating $3 + 2 \\times (10 - 4) \\div 3$ into the order they must be done."
        steps:
          - "Work out the brackets: $10 - 4 = 6$."
          - "Multiply: $2 \\times 6 = 12$."
          - "Divide: $12 \\div 3 = 4$."
          - "Add: $3 + 4 = 7$."
        explanation: Brackets first. Then multiplication and division from left to right, and the multiplication stands to the left. Addition last.
    - question:
        id: batches-remainder
        type: numeric
        system: s2
        prompt: |
          A data set of 4,300 photographs is fed to a program in batches of 32. After as many full batches as possible, how many photographs are left over for the final, smaller batch?
        answer: "12"
        unit: photographs
        explanation: |
          $100 \times 32 = 3200$, leaving 1100. $30 \times 32 = 960$, leaving 140. $4 \times 32 = 128$, leaving 12, which is less than 32. So $4300 = 134 \times 32 + 12$.
    - question:
        id: training-steps
        type: numeric
        system: s2
        prompt: |
          A program studies 60,000 pictures in batches of 100, taking one step per batch. It goes through the whole collection 3 times. How many steps does it take in total?
        answer: "1800"
        unit: steps
        explanation: |
          $60000 \div 100 = 600$ batches in one pass, because removing two zeros is grouping into hundreds. Three passes: $3 \times 600$.
    - question:
        id: zero-division
        type: choice
        system: s2
        prompt: "Why is $9 \\div 0$ not given a value?"
        options:
          - "Because the answer is too large to write down."
          - "Because it would have to be a number that gives 9 when multiplied by 0, and every number multiplied by 0 gives 0."
          - "Because the answer is 0, and that would be confusing."
          - "Because mathematicians agreed to forbid it, although it does have a value."
        answer: 1
        explanation: Division is defined as the undoing of multiplication. Multiplying by zero destroys all information about what you started with, so there is nothing to undo.
  connections:
    - text: |
        You began with one idea, a number as digits in places, and now have four operations on those numbers, each understood from what it means and not from a recipe. You also have the first law that will follow you all the way into machine learning: the distributive law. When a program later multiplies a table of numbers by another table, each entry is a sum of products, and the reason the sums can be rearranged and regrouped freely is the handful of laws in the table above.

        The same agreement is built into every programming language. When you write your first programs, a line such as `3 * 15 + 2 * 120` will be read exactly as Rohan read the bill, and when you want Anika's meaning you will have to write the brackets yourself. In [[f1.variables-and-expressions]] the numbers in such lines start to be replaced by letters, and the laws in the table above become the rules for rearranging them.

        Division raised a loose end. Splitting a ₹14 bill among 4 friends left a remainder, and we stopped there. But ₹14 *can* be split among 4 people exactly, with nothing left over: each pays three and a half rupees. To say how much each person pays, whole numbers are not enough. The next lesson, [[f0.fractions-decimals-and-percentages]], builds the numbers that live in the gaps, and the decimals and percentages that every price, tax and discount is written in.
