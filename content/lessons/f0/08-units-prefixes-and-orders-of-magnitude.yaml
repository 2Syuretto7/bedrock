concept: f0.units-prefixes-and-orders-of-magnitude
minutes: 85
claim: You can translate between Indian and international number names and the SI prefixes from nano to peta by their powers of ten, write any number in scientific notation and calculate with it, convert between bits and bytes and between units of time, and say how many orders of magnitude separate two quantities.
recalls: [f0.ratio-rate-and-proportion]
uses: [f0.whole-numbers-and-place-value, f0.powers-and-roots, f0.powers-of-two]
leads: [f0.estimation-and-back-of-the-envelope-reasoning, f1.logarithms]
parts:
  recall:
    - text: |
        [[f0.ratio-rate-and-proportion]] chained rates together by writing each with its units as a fraction and letting the units cancel. Today the units get prefixes, and the same cancelling does the converting. Two quick pulls first.
  puzzle:
    - text: |
        Two messages arrive on the family group on the same morning.

        The first is a news clipping: "UPI handled 20 billion payments last month." Your uncle replies, "How many crore is that? I only understand crore." Somebody guesses 20 crore. Somebody else says 200. A third says it cannot be converted, because a billion is a Western number.

        The second is from your cousin, who runs a small website. The hosting bill says "Data transferred: 2.5 TB". She wants to know how many bytes that is, because her own logs count bytes, and whether her home connection, sold as "100 Mbps", could have moved that much in a month.

        These look like two different problems, one about Indian and Western counting and one about computers. They are the same problem. In both, a quantity has been given a *name*, crore or billion, tera or mega, and the question is how one name relates to another. People who learn each conversion as a separate fact get them wrong under pressure, and engineers who mix up a mega and a giga, or a bit and a byte, ship systems that are a thousand times too small or eight times too slow.

        Here is the puzzle. **Is there a single way of writing large and small quantities that turns every one of these translations, crore to billion, terabyte to byte, megabit to megabyte, into the same mechanical step?**
  intuition:
    - text: |
        Every one of those names is a disguise for a **power of ten**. Strip the disguise and they line up on one ladder.

        In the first lesson a lakh was 1,00,000, a 1 followed by five zeros, which is $10^5$. A crore was 1,00,00,000, seven zeros, $10^7$. A thousand is $10^3$, a million $10^6$, a billion $10^9$. Once each name is replaced by its exponent, the uncle's question is easy: a billion is $10^9$ and a crore is $10^7$, so a billion is $10^{9-7} = 10^2 = 100$ crore. Twenty billion is 2,000 crore. The two counting systems are not different numbers. They are different names for the same rungs of the same ladder, and the Indian system simply names rungs that the international one skips, and the other way round.

        Science and engineering use one more set of names, the **SI prefixes**. Each stands for a power of ten that is a multiple of three: kilo for $10^3$, mega for $10^6$, giga for $10^9$, tera for $10^{12}$, peta for $10^{15}$. They work on any unit. A kilometre is $10^3$ metres, a gigabyte $10^9$ bytes, a terabyte $10^{12}$ bytes. Going below one, milli is $10^{-3}$, micro is $10^{-6}$ and nano is $10^{-9}$: a millisecond is a thousandth of a second and a nanosecond a billionth.

        Slide the exponent below and read the names as you pass them.
    - figure: powers-of-ten
      props: { start: 9 }
    - text: |
        Each step of the ladder is one **order of magnitude**: ten times the step below. Engineers think in these steps all the time, because quantities in computing are spread over an enormous range. A processor's clock ticks about every third of a nanosecond. A message from Mumbai to Chennai and back takes about 20 milliseconds. A year is about 30 million seconds. Put those on an ordinary ruler and almost everything is squashed against zero. Put them on a ruler where every equal step multiplies by ten, and they spread out so you can see them. Try both in the figure.
    - figure: log-scale
      props: { set: time, first: 2, second: 3 }
  derivation:
    - text: |
        **Scientific notation.** To translate names mechanically, every number should be written as "some digits" times "a power of ten". Any positive number can be written as

        $$a \times 10^n \quad \text{with } 1 \le a < 10,$$

        where $n$ is a whole number, possibly negative. To find it, move the digits past the point until exactly one non-zero digit stands to its left, and count the moves. Twenty billion is 20,000,000,000. Ten moves leave 2 alone, so it is $2 \times 10^{10}$. For a small number the digits move the other way and the exponent is negative: $0.0213 = 2.13 \times 10^{-2}$, because $10^{-2}$ is a hundredth and 2.13 hundredths is 0.0213. The front number $a$ carries the digits. The exponent $n$ carries the size, and is the number's **order of magnitude**.

        **Translating names.** A name is a power of ten, so changing from one name to another divides one power of ten by another, and dividing powers of the same base subtracts exponents. In crore: $2 \times 10^{10} \div 10^7 = 2 \times 10^3$, which is 2,000 crore. In lakh it would be $2 \times 10^5$ lakh, two lakh lakh. Every translation is one subtraction of exponents.
    - question:
        id: lakh-in-million
        type: numeric
        system: s2
        prompt: |
          A million is $10^6$ and a lakh is $10^5$. How many lakh make a million?
        answer: "10"
        unit: lakh
        explanation: |
          $10^6 \div 10^5 = 10^{6-5} = 10^1$. Ten lakh is a million, which is why 10,00,000 and 1,000,000 are the same number.
    - text: |
        **Multiplying and dividing.** Order does not matter in a multiplication, so gather the front numbers together and the powers of ten together:

        $$(3 \times 10^4) \times (5 \times 10^{-3}) = (3 \times 5) \times 10^{4 + (-3)} = 15 \times 10^1 = 1.5 \times 10^2.$$

        If the front number escapes the range from 1 to 10, as 15 did, move one power of ten across. Division works the same way with exponents subtracted: $\dfrac{6 \times 10^4}{3 \times 10^{-2}} = 2 \times 10^{4-(-2)} = 2 \times 10^6$.

        **Converting units with prefixes.** A prefix is a factor, so it converts by the cancelling of the last lesson. How many milliseconds are 250 microseconds?

        $$250 \ \mu\text{s} = 250 \times 10^{-6} \ \text{s} = 250 \times 10^{-6} \times 10^{3} \ \text{ms} = 0.25 \ \text{ms}.$$

        One second is $10^3$ ms, so multiplying by $10^3$ turns seconds into milliseconds. The prefixes are just powers of ten that travel with the unit.

        **Bits and bytes.** One trap catches everyone once. Storage and file sizes are counted in **bytes** (written with a capital B: MB, GB). Network speeds are counted in **bits per second** (a small b: Mbps, Gbps). A byte is 8 bits. So a connection sold as 100 Mbps moves

        $$100 \times 10^6 \ \frac{\text{bits}}{\text{s}} \times \frac{1 \ \text{byte}}{8 \ \text{bits}} = 12.5 \times 10^6 \ \frac{\text{bytes}}{\text{s}},$$

        which is 12.5 MB per second, not 100. Forgetting the 8 makes every download estimate eight times too hopeful.

        **Now the puzzle.** The uncle's 20 billion is $2 \times 10^{10}$, which is $2 \times 10^3$ crore: 2,000 crore payments. The cousin's 2.5 TB is $2.5 \times 10^{12}$ bytes. Her home line moves $1.25 \times 10^7$ bytes a second, and a 30-day month is $30 \times 86{,}400 \approx 2.6 \times 10^6$ seconds, so running flat out for a whole month it could move about

        $$(1.25 \times 10^7) \times (2.6 \times 10^6) \approx 3.2 \times 10^{13} \ \text{bytes},$$

        about 32 TB. So yes, 2.5 TB fits easily, using under a tenth of the month. Every step was the same move: write each quantity as a front number times a power of ten, then multiply or divide, adding or subtracting exponents.
    - question:
        id: download-time
        type: numeric
        system: s2
        prompt: |
          A 2 GB file is downloaded over a 50 Mbps connection running at full speed. How many seconds does it take?
        answer: "320"
        unit: seconds
        explanation: |
          The file is $2 \times 10^9$ bytes, which is $1.6 \times 10^{10}$ bits. The line moves $5 \times 10^7$ bits a second. $\frac{1.6 \times 10^{10}}{5 \times 10^7} = 0.32 \times 10^3 = 320$ seconds, a little over five minutes.
    - text: |
        **How far apart are two quantities?** Two quantities differ by $k$ orders of magnitude when one is about $10^k$ times the other. A nanosecond and a second are 9 orders apart, since a second is $10^9$ nanoseconds. A kilobyte and a terabyte are 9 orders apart too. When the ratio is not an exact power of ten, the difference in orders is between two whole numbers: a 20 GB film on a 1 TB drive is a ratio of 50, between $10^1$ and $10^2$, so between one and two orders. The figure above gives such in-between values to one decimal place, and [[f1.logarithms]] will show how they are calculated.

        Adding is different from multiplying here. Adding a quantity to one several orders larger barely changes the larger: $10^6 + 10^2 = 1{,}000{,}100$, still about $10^6$. A millisecond spent on a calculation is invisible next to a 20 millisecond round trip across the country, which is why engineers first ask which part of a system is the largest, and leave the rest until later.
  formal:
    - text: |
        **Number names as powers of ten.**

        | Indian | international | power of ten |
        | --- | --- | --- |
        | thousand | thousand | $10^3$ |
        | lakh |  | $10^5$ |
        | ten lakh | million | $10^6$ |
        | crore |  | $10^7$ |
        | hundred crore | billion | $10^9$ |
        | one lakh crore | trillion | $10^{12}$ |

        **SI prefixes.** nano (n) $10^{-9}$, micro ($\mu$) $10^{-6}$, milli (m) $10^{-3}$, kilo (k) $10^3$, mega (M) $10^6$, giga (G) $10^9$, tera (T) $10^{12}$, peta (P) $10^{15}$. In computing the binary prefixes of [[f0.powers-of-two]], Ki, Mi, Gi and Ti, are used beside them, and are slightly larger.

        **Scientific notation.** Every positive number can be written in exactly one way as $a \times 10^n$ with $1 \le a < 10$ and $n$ an integer. The integer $n$ is its **order of magnitude**, and two numbers differ by $k$ orders of magnitude when their ratio is about $10^k$.

        **Arithmetic.**

        $$(a \times 10^m) \times (b \times 10^n) = (a \times b) \times 10^{m+n}, \qquad \frac{a \times 10^m}{b \times 10^n} = \frac{a}{b} \times 10^{m-n}.$$

        If the new front number falls outside the range from 1 to 10, move one power of ten across: $15 \times 10^1 = 1.5 \times 10^2$. To add, first rewrite both numbers with the same power of ten.

        **Converting.** To change from one named size to another, divide the two powers of ten, which subtracts their exponents. To change units, multiply by a fraction equal to one, such as $\frac{10^3 \ \text{ms}}{1 \ \text{s}}$ or $\frac{1 \ \text{byte}}{8 \ \text{bits}}$, arranged so that the unit you do not want cancels.

        **Bits and bytes.** 1 byte = 8 bits. Sizes are quoted in bytes (B), network speeds in bits per second (b/s, bps).
  drill:
    - text: Seconds each. Translate through the exponent every time.
    - question:
        id: crore-in-billion
        type: numeric
        system: s1
        prompt: How many crore make one billion?
        answer: "100"
        unit: crore
        explanation: "$10^9 \\div 10^7 = 10^2$."
    - question:
        id: bytes-in-megabyte
        type: numeric
        system: s1
        prompt: How many bytes are in 1 MB, using the SI prefix?
        answer: "1000000"
        unit: bytes
        explanation: Mega is $10^6$.
    - question:
        id: from-scientific
        type: numeric
        system: s1
        prompt: Write $3.2 \times 10^4$ as an ordinary number.
        answer: "32000"
        explanation: Move the digits four places to the left of where they stand. 3.2 ten-thousands.
    - question:
        id: small-scientific
        type: numeric
        system: s1
        prompt: |
          $0.006 = 6 \times 10^n$. What is $n$?
        answer: "-3"
        explanation: Six thousandths. The digits moved three places, and the number is less than one, so the exponent is negative.
    - question:
        id: ms-in-microseconds
        type: numeric
        system: s1
        prompt: How many microseconds are in one millisecond?
        answer: "1000"
        unit: microseconds
        explanation: "$10^{-3} \\div 10^{-6} = 10^{3}$."
    - question:
        id: bits-in-byte
        type: choice
        system: s1
        prompt: A line is sold as 80 Mbps. At full speed, how many megabytes does it move each second?
        options: ["10", "80", "640", "8"]
        answer: 0
        explanation: Megabits per second, divided by 8 bits in a byte.
  work:
    - text: Slower now. Write every quantity as a front number times a power of ten before doing anything else.
    - question:
        id: upi-in-crore
        type: numeric
        system: s2
        prompt: |
          A report says a payment system handled 18.4 billion payments in a month. How many crore payments is that?
        answer: "1840"
        unit: crore
        explanation: |
          $18.4 \times 10^9 \div 10^7 = 18.4 \times 10^2 = 1840$. A billion is a hundred crore.
    - question:
        id: requests-per-second
        type: numeric
        system: s2
        prompt: |
          A server spends 250 microseconds on each request and handles them one at a time without a pause. How many requests does it handle in one second?
        answer: "4000"
        unit: requests
        explanation: |
          $\frac{1 \ \text{s}}{250 \times 10^{-6} \ \text{s}} = \frac{1}{2.5 \times 10^{-4}} = 0.4 \times 10^4 = 4000$.
    - question:
        id: divide-scientific
        type: choice
        system: s2
        prompt: "$\\dfrac{6 \\times 10^{4}}{3 \\times 10^{-2}}$"
        options: ["$2 \\times 10^{6}$", "$2 \\times 10^{2}$", "$3 \\times 10^{6}$", "$2 \\times 10^{-8}$"]
        answer: 0
        explanation: Divide the front numbers, $6 \div 3 = 2$, and subtract the exponents, $4 - (-2) = 6$. Subtracting a negative adds.
    - question:
        id: to-scientific-steps
        type: order
        system: s2
        prompt: Put the steps for writing 3.5 crore in scientific notation into order.
        steps:
          - "Replace the name by its power of ten: 3.5 crore is $3.5 \\times 10^{7}$."
          - "Check that the front number lies between 1 and 10. 3.5 does."
          - "Read off the order of magnitude: 7."
          - "Check the size by writing it out: 3,50,00,000, a 35 followed by six zeros."
        explanation: The name hides a power of ten. Once it is replaced, the number is already in scientific notation, and writing it out is an independent check on the exponent.
    - question:
        id: orders-apart
        type: numeric
        system: s2
        prompt: |
          One read from main memory takes about 100 nanoseconds. A network round trip across the country takes about 20 milliseconds. The second is about $2 \times 10^k$ times the first. What is $k$?
        answer: "5"
        explanation: |
          $100 \ \text{ns} = 10^2 \times 10^{-9} \ \text{s} = 10^{-7} \ \text{s}$, and $20 \ \text{ms} = 2 \times 10^{-2} \ \text{s}$. The ratio is $2 \times 10^{-2-(-7)} = 2 \times 10^5$. Two lakh memory reads fit in one round trip, which is why programs try hard not to wait on the network.
    - question:
        id: bits-trap
        type: choice
        system: s2
        prompt: |
          A cousin says: "My line is 100 Mbps, so a 1 GB file downloads in 10 seconds." What is wrong?
        options:
          - "Mbps counts bits and GB counts bytes, so the file is 8,000 megabits and needs at least 80 seconds."
          - "Nothing. 1 GB is 1,000 MB, and 1,000 divided by 100 is 10."
          - "The file needs 100 seconds, because a gigabyte is a hundred megabytes."
          - "The file needs 1 second, because giga is a thousand times mega."
        answer: 0
        explanation: |
          $10^9$ bytes is $8 \times 10^9$ bits, and $\frac{8 \times 10^9}{10^8} = 80$ seconds. The capital B and the small b differ by a factor of 8.
  connections:
    - text: |
        The puzzle is solved. Every name for a size, lakh and crore, million and billion, kilo and tera, milli and nano, is a power of ten in disguise. Write each quantity as a front number times a power of ten, and every translation is one subtraction of exponents and every product one addition. Twenty billion is 2,000 crore, 2.5 TB is $2.5 \times 10^{12}$ bytes, and a 100 Mbps line moves 12.5 MB a second.

        The figure measured the gap between two quantities in orders of magnitude, sometimes as a whole number and sometimes as something like 5.3. That in-between number is the exponent that ten would need to reach the ratio, and it has a name, the logarithm, which [[f1.logarithms]] takes apart properly.

        You can now write down any quantity an engineer meets, however large or small. The last lesson of the cluster uses that to do something more useful than exact arithmetic: to get the size of an answer right, in your head, before the details are known. That is [[f0.estimation-and-back-of-the-envelope-reasoning]].
