concept: f0.fractions-decimals-and-percentages
minutes: 100
claim: You can say what a fraction is, add, multiply and divide fractions while saying why each rule works, read a decimal as a fraction with a place-value bottom, and turn any percentage rise or fall into a multiplier, so that you can tell at once whether the order of two changes matters.
recalls: [f0.the-four-operations-and-order-of-operations]
uses: [f0.whole-numbers-and-place-value]
leads: [f0.negative-numbers, h0.floating-point-and-ieee-754]
parts:
  recall:
    - text: |
        The last lesson, [[f0.the-four-operations-and-order-of-operations]], defined division as the undoing of multiplication and fixed the order in which a line of arithmetic is read. Both are about to be used hard.
  puzzle:
    - text: |
        A pair of headphones has a sticker price of ₹1,000 before tax. Two shops sell it.

        The first shop adds 18% GST to the sticker price and then, at the till, gives 10% off what you owe. The second shop takes 10% off the sticker price first and then adds 18% GST to the reduced price.

        The shopkeeper's nephew, helping out for the summer, says there is no need to calculate anything: "18% up and 10% down is 8% up, so both shops charge ₹1,080." His friend says that cannot be right, because the 10% in the first shop is taken off a bigger amount, so the first shop must be cheaper.

        Neither of them has worked anything out. Both have a reason that sounds convincing. And it matters far beyond headphones. A cloud bill adds a tax and then a discount for committing to a year. A server is made 20% faster and then loses 10% of the gain to a security patch. Every one of those is two percentage changes, one after another.

        Here is the puzzle. **When a price goes up by one percentage and down by another, what is the final price, and does the order of the two changes matter?** To answer, we need to know what a percentage *is*, and that means first knowing what a fraction is.
  intuition:
    - text: |
        Start further back, with a meal. Share 3 rotis equally among 4 people.

        With whole numbers this cannot be done. $3 = 0 \times 4 + 3$: the quotient is zero and all three are left over. The arithmetic says nobody gets anything. But anyone who has shared a meal knows that is nonsense. Tear each roti into four equal pieces. There are now twelve pieces, and each person takes three of them. Everyone has the same amount, nothing is left, and nobody went hungry.

        The move that saved the meal was to **change the unit**. Whole rotis could not be shared, so we stopped counting whole rotis and started counting quarter rotis. That is all a fraction is. It is a count of pieces, together with a note saying how big each piece is.

        $$\frac{3}{4}$$

        The bottom number, the **denominator**, names the piece: cut one whole into 4 equal parts, and take one. The top number, the **numerator**, counts how many of those pieces you have: 3. The word denominator comes from "to name", and numerator from "to number". Three quarters is three of something, in the same way that three metres is three of something.

        In the figure, the upper bar shows a fraction. Change the parts taken and the parts in a whole. Go past one whole and see that nothing breaks. Then use the third control to cut every part more finely, and watch the lower bar.
    - figure: fraction-bar
      props: { numerator: 3, denominator: 4, finer: 1 }
    - text: |
        The lower bar shows the fact about fractions that surprises everyone at first: **the same amount has many names.** Cut every quarter in two and three quarters becomes six eighths. Cut every quarter in three and it becomes nine twelfths. The shaded length never moves. Only the way of counting it changes.

        One family of names is special, because it fits the place-value system from the first lesson. Each place there was worth ten of the place to its right. Read that backwards: each place is worth **one tenth** of the place to its left. Nothing says the pattern must stop at the ones. One tenth of a one is a tenth, one tenth of a tenth is a hundredth, and so on. A mark is needed to show where the ones place is, and that mark is the **decimal point**:

        $$3.75 = 3 \times 1 + 7 \times \frac{1}{10} + 5 \times \frac{1}{100}.$$

        A decimal is not a new kind of number. It is a fraction whose bottom is agreed in advance to be 10, 100, 1000 and so on. On the number line below each step is one tenth. Step from 0 past 1 and watch the carry: ten tenths wrap into a one, exactly as ten ones wrapped into a ten.
    - figure: number-line
      props: { min: 0, max: 2, start: 0, parts: 10 }
    - text: |
        **Percentages** are the same idea with one fixed bottom. "Per cent" means "out of a hundred". 18% means $\frac{18}{100}$, which is 0.18. And 75% is $\frac{75}{100}$, which is 0.75, which is $\frac{3}{4}$. Three names, one number.
  derivation:
    - text: |
        **What a fraction is.** Start from division, as the rotis did. $\frac{1}{4}$ is defined to be the number which, taken 4 times, makes 1:

        $$4 \times \frac{1}{4} = 1.$$

        It is the answer to $1 \div 4$, a division with no whole-number answer. Then $\frac{3}{4}$ means three of these, $3 \times \frac{1}{4}$, and the fraction line *is* a division sign: three rotis among four people is $3 \div 4$.

        **Equal fractions.** Cut each of the $b$ parts of a whole into $n$ smaller parts. There are now $n \times b$ parts in the whole, and your $a$ pieces have become $n \times a$ smaller pieces. The amount has not changed, so

        $$\frac{a}{b} = \frac{n \times a}{n \times b}.$$

        Read from right to left, this says that if the top and bottom share a factor you may divide both by it. $\frac{6}{8}$ shares the factor 2, giving $\frac{3}{4}$, the fraction in **simplest form**.

        **Adding.** You can add 3 metres and 2 metres to get 5 metres, but not 3 metres and 2 feet until both are in one unit. Fractions are no different. Quarters add to quarters, $\frac{1}{4} + \frac{2}{4} = \frac{3}{4}$, so you add the tops and **leave the bottom alone**. When the pieces differ, rename both so that they match:

        $$\frac{1}{2} + \frac{1}{3} = \frac{3}{6} + \frac{2}{6} = \frac{5}{6}.$$

        A bottom that works for both is a **common denominator**. The product of the two bottoms always works.
    - question:
        id: add-unlike
        type: numeric
        system: s2
        prompt: |
          $\dfrac{1}{4} + \dfrac{1}{6}$. Give the result as a fraction.
        answer: "5/12"
        explanation: |
          Twelfths suit both: $\frac{1}{4} = \frac{3}{12}$ and $\frac{1}{6} = \frac{2}{12}$. Three pieces and two pieces make five pieces.
    - text: |
        **Multiplying.** Read the sign $\times$ as "of". What is $\frac{2}{3}$ of $\frac{4}{5}$? Draw a square that is one whole. Cut it into 5 vertical strips and shade 4. Now cut it into 3 horizontal strips and keep 2. The square is a grid of $3 \times 5 = 15$ cells, and the part kept both ways is $2 \times 4 = 8$ cells. So

        $$\frac{2}{3} \times \frac{4}{5} = \frac{2 \times 4}{3 \times 5} = \frac{8}{15}.$$

        Tops multiply because they count what you keep. Bottoms multiply because they count the whole. Notice that multiplying by a fraction less than one makes a number **smaller**. "Multiply" does not mean "make bigger". It means "take this many of".

        **Dividing.** $2 \div \frac{1}{4}$ asks how many quarters make 2. Each whole holds 4, so 2 wholes hold 8: dividing by a quarter is multiplying by 4. In general, multiplying by $\frac{d}{c}$ undoes multiplying by $\frac{c}{d}$, because together they multiply by $\frac{d \times c}{c \times d} = 1$. So

        $$\frac{a}{b} \div \frac{c}{d} = \frac{a}{b} \times \frac{d}{c}.$$

        The flipped fraction is the **reciprocal**. "Flip and multiply" is not a trick. It is the only thing that undoes the multiplication.

        **Decimals and fractions.** To turn a decimal into a fraction, put the digits after the point over the place of the last digit: $0.375 = \frac{375}{1000} = \frac{3}{8}$. To go the other way, divide, and when you run out of ones, change to a smaller unit and carry on. For $\frac{3}{4}$: 4 goes into 3 ones zero times, so write 0 and the point. Change the 3 ones into 30 tenths; 4 goes 7 times, remainder 2. Change 2 tenths into 20 hundredths; 4 goes 5 times, remainder 0. So $\frac{3}{4} = 0.75$.

        Some divisions never finish. For $\frac{1}{3}$ the remainder is 1 at every step, so the digits are $0.3333\ldots$ for ever. A division by 3 can only leave the remainders 1 or 2, so a remainder must come back, and then the digits cycle. The division finishes only when the bottom, in simplest form, is built from 2s and 5s alone, because $10 = 2 \times 5$. This matters to engineers: a number stored with a fixed count of places cannot hold $\frac{1}{3}$ exactly, and computers store numbers with a fixed count of places.

        **Percentages of things.** "18% of ₹1,000" uses "of" exactly as above: $\frac{18}{100} \times 1000 = 180$. Finding 1% first, by moving the digits two places, is almost always the quickest route.

        **A rise is a multiplication.** Now the step that settles the puzzle. Adding 18% to a price $P$ gives

        $$P + \frac{18}{100} \times P = \left(1 + \frac{18}{100}\right) \times P = 1.18 \times P.$$

        That is the distributive law from the last lesson, read backwards. So "add 18%" is the same as "multiply by 1.18". In the same way "take 10% off" is "keep 90%", which is "multiply by 0.9". The number you multiply by is called the **multiplier**.
    - question:
        id: multiplier-of-fall
        type: numeric
        system: s2
        prompt: |
          A cloud provider takes 25% off a bill for committing to a year. What single number is the bill multiplied by?
        answer: "0.75"
        explanation: |
          Taking 25% off leaves $100\% - 25\% = 75\%$ of the bill, and 75% is $\frac{75}{100} = 0.75$.
    - text: |
        **Now the puzzle.** The first shop multiplies by 1.18 and then by 0.9. The second multiplies by 0.9 and then by 1.18. Multiplication does not care about order, which was the commutative law of the last lesson, so both shops charge

        $$1000 \times 1.18 \times 0.9 = 1000 \times 1.062 = 1062.$$

        The order does not matter, so the friend was wrong. And the answer is ₹1,062, not ₹1,080, so the nephew was wrong too. His mistake was to *add* the changes, $18 - 10 = 8$, when changes one after another *multiply*: $1.18 \times 0.9 = 1.062$, a rise of 6.2%. The 10% is taken off a price that already includes the tax, so it takes back more than 10% of the original. Adding percentages is only nearly right when both are small.

        **Two kinds of change.** One last trap. Suppose a server's error rate falls from 10% to 5%. The rate fell by 5 **percentage points**, the plain difference $10 - 5$. It also fell by 50 **per cent**, because the change, 5, is half of where it started. Both are true, and they answer different questions. Whenever you read a percentage change, ask: per cent *of what*?
  formal:
    - text: |
        A **fraction** $\frac{a}{b}$, with $a$ and $b$ whole numbers and $b$ not zero, is the number that satisfies $b \times \frac{a}{b} = a$. In words, it is the result of $a \div b$. Every whole number is a fraction: $5 = \frac{5}{1}$.

        **Equality.** $\frac{a}{b} = \frac{c}{d}$ exactly when $a \times d = b \times c$.

        **Operations.**

        $$\frac{a}{b} + \frac{c}{d} = \frac{a \times d + c \times b}{b \times d} \qquad \frac{a}{b} \times \frac{c}{d} = \frac{a \times c}{b \times d} \qquad \frac{a}{b} \div \frac{c}{d} = \frac{a \times d}{b \times c} \quad (c \text{ not zero})$$

        The commutative, associative and distributive laws from the last lesson all continue to hold.

        A **decimal** $d_k \ldots d_0 \,.\, e_1 e_2 \ldots e_m$ has the value $d_k \times 10^k + \dots + d_0 + \frac{e_1}{10} + \frac{e_2}{100} + \dots + \frac{e_m}{10^m}$. Every fraction is a decimal that either ends or eventually repeats, and it ends exactly when its bottom in simplest form has no factor other than 2s and 5s. To compare two decimals, pad them with zeros to the same number of places after the point and compare them as whole numbers.

        **Percentage.** $p\% = \frac{p}{100}$. A rise of $p\%$ multiplies by $1 + \frac{p}{100}$ and a fall of $p\%$ multiplies by $1 - \frac{p}{100}$. Changes one after another multiply their multipliers, in any order.

        **Change.** If a quantity goes from an old value to a new one, its **percentage change** is $\frac{\text{new} - \text{old}}{\text{old}} \times 100\%$. If the quantity is itself a percentage, the plain difference is measured in **percentage points**.
  drill:
    - text: Seconds each. You may type fractions as `3/4`.
    - question:
        id: rename-down
        type: numeric
        system: s1
        prompt: |
          $\dfrac{12}{16} = \dfrac{x}{4}$. What is $x$?
        answer: "3"
        explanation: Top and bottom share the factor 4.
    - question:
        id: half-of
        type: numeric
        system: s1
        prompt: "$\\dfrac{1}{2} \\times \\dfrac{1}{3}$"
        answer: "1/6"
        explanation: Half of a third. Tops multiply and bottoms multiply.
    - question:
        id: largest-decimal
        type: choice
        system: s1
        prompt: Which is the largest?
        options: ["0.45", "0.5", "0.409", "0.05"]
        answer: 1
        explanation: Padded to three places they are 450, 500, 409 and 50 thousandths. More digits does not mean a bigger number once you are right of the point.
    - question:
        id: percent-of
        type: numeric
        system: s1
        prompt: 18% of ₹500
        answer: "90"
        unit: rupees
        explanation: 1% of 500 is 5, and eighteen of those are 90.
    - question:
        id: decimal-to-percent
        type: numeric
        system: s1
        prompt: |
          $0.07 = x\%$. What is $x$?
        answer: "7"
        explanation: Seven hundredths is seven per hundred. Not seventy.
    - question:
        id: rise-multiplier
        type: choice
        system: s1
        prompt: Adding 5% to an amount is the same as multiplying it by which number?
        options: ["1.05", "0.05", "1.5", "5"]
        answer: 0
        explanation: The amount plus 5% of it is $1 \times$ the amount $+ 0.05 \times$ the amount, which is $1.05 \times$ the amount.
  work:
    - text: Slower now. Draw a bar or a square whenever a step does not feel obvious.
    - question:
        id: add-steps
        type: order
        system: s2
        prompt: Put the steps for adding two fractions with different bottoms into order.
        steps:
          - Find a number that both bottoms divide into evenly.
          - Rename each fraction with that number as its bottom, multiplying its top by whatever its bottom was multiplied by.
          - Add the tops and keep the shared bottom.
          - Divide top and bottom by any factor they share.
        explanation: Pieces must match before they can be counted together. Simplifying comes last because it changes only the name, not the amount.
    - question:
        id: divide-work
        type: numeric
        system: s2
        prompt: "$\\dfrac{3}{4} \\div \\dfrac{3}{8}$"
        answer: "2"
        explanation: |
          It asks how many pieces of size $\frac{3}{8}$ fit in $\frac{3}{4}$, which is $\frac{6}{8}$. Two fit. By the rule: $\frac{3}{4} \times \frac{8}{3} = \frac{24}{12} = 2$.
    - question:
        id: gst-then-discount
        type: numeric
        system: s2
        prompt: |
          A laptop's price before tax is ₹50,000. The shop adds 18% GST and then gives 5% off the total. What do you pay, in rupees?
        answer: "56050"
        unit: rupees
        explanation: |
          The multipliers are 1.18 and 0.95, and $1.18 \times 0.95 = 1.121$. So you pay $1.121 \times 50000 = 56050$. Doing it in steps gives the same: $50000 \to 59000 \to 59000 - 2950$.
    - question:
        id: up-then-down
        type: choice
        system: s2
        prompt: |
          A server's throughput rises by 20% after an upgrade and then falls by 20% after a security patch. Compared with where it started, it is now:
        options:
          - "4% lower"
          - "the same"
          - "4% higher"
          - "20% lower"
        answer: 0
        explanation: |
          The multipliers are 1.2 and 0.8, and $1.2 \times 0.8 = 0.96$, which is 96% of the start. The fall of 20% was taken from a larger number than the rise of 20% was added to.
    - question:
        id: points-or-percent
        type: choice
        system: s2
        prompt: |
          After a fix, a service's success rate rises from 80% to 90%. Which statement is correct?
        options:
          - "It rose by 10 percentage points, which is a 12.5% increase."
          - "It rose by 10%, and there is no other way to say it."
          - "It rose by 12.5 percentage points."
          - "It rose by 10 percentage points, which is a 10% increase."
        answer: 0
        explanation: |
          The gap is $90 - 80 = 10$ points. Compared with the starting value, $\frac{10}{80} = \frac{1}{8} = 0.125$, which is 12.5%.
    - question:
        id: why-repeats
        type: choice
        system: s2
        prompt: Why must the decimal for $\dfrac{2}{7}$ eventually repeat?
        options:
          - "Because 7 is an odd number."
          - "Because when dividing by 7 only the remainders 1 to 6 are possible, so one must recur, and from then on the same digits follow."
          - "Because every decimal repeats."
          - "Because 2 is smaller than 7."
        answer: 1
        explanation: Each step of the division depends only on the current remainder. The same remainder leads to the same next digit and the same next remainder, so the cycle is locked in. Seven has a factor other than 2 or 5, so the remainder never reaches zero.
  connections:
    - text: |
        The puzzle is answered. A percentage is a fraction with the bottom 100, a rise or a fall by a percentage is a multiplication, and multiplications can be done in any order. Both shops charge ₹1,062, and the quick rule of adding and subtracting percentages is wrong, slightly for small changes and badly for large ones.

        Fractions also mended the leak in division. Whole numbers were closed under adding and multiplying but not under dividing; with fractions, every division except by zero has an answer. Decimals then fitted those answers into the place-value system, at the price that some, like a third, need digits without end. In [[h0.floating-point-and-ieee-754]] you will see how a computer stores such numbers in a fixed number of places, and what it does with the digits that do not fit.

        One of today's ideas quietly needs something new. A percentage change subtracts: new minus old. When a price falls, that asks you to take a larger number from a smaller one, and none of the numbers so far can answer. The next lesson, [[f0.negative-numbers]], builds the numbers that can.
