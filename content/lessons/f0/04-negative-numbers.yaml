concept: f0.negative-numbers
minutes: 80
claim: You can place negative numbers on the number line, record a balance or a change that can go either way as one signed number, add, subtract, multiply and divide with signed numbers, and derive the sign rules from the laws of arithmetic instead of memorising them.
recalls: [f0.fractions-decimals-and-percentages]
uses: [f0.whole-numbers-and-place-value, f0.the-four-operations-and-order-of-operations]
leads: [f0.powers-and-roots, f1.inequalities, h0.twos-complement-and-overflow]
parts:
  recall:
    - text: |
        In [[f0.fractions-decimals-and-percentages]] fractions were rewritten with bottoms of ten, a hundred, a thousand, and a change was measured as new minus old. Two quick questions before that subtraction gets into trouble.
  puzzle:
    - text: |
        Meera's payments app shows a balance of ₹40. She buys a ₹65 lunch with a card that allows an overdraft, which means the bank lets her spend more than she has and owe the difference.

        Before lunch the balance was easy to write down: 40. After lunch it should be "what she had, minus what she spent", which is $40 - 65$. Subtraction was defined as the undoing of addition: $40 - 65$ is the number which, added to 65, gives 40. But adding any number we know of to 65 makes it bigger or leaves it alone. Nothing we have brings 65 *down* to 40.

        The app cannot simply show 0, because Meera owes the bank ₹25 and that has to be remembered. It could keep two columns, "money you have" and "money you owe", and show one of them. But then every payment and every refund needs a rule. A ₹30 refund arriving when she owes ₹25 has to clear the debt, switch columns and leave ₹5 in the other one. A ₹10 payment when she has ₹5 has to switch columns the other way. Every app, every bank and every program that keeps a balance would need its own special cases, and each one is a place for a mistake to hide.

        Here is the puzzle. **Is there a single kind of number that can record a balance on either side of zero, so that ordinary addition and subtraction do all the bookkeeping, with no columns and no special cases?** And once there is, what should such numbers do when they are multiplied?
  intuition:
    - text: |
        You have met this kind of gap before. Division leaked, because 3 could not be divided by 4, and fractions were invented to seal it. Now subtraction leaks, because 9 cannot have 15 taken from it. We seal it the same way: by admitting new numbers and checking that every old law still works.

        The picture is the number line. So far it has started at zero and run off to the right. Adding steps right. Subtracting steps left. The only reason $3 - 5$ had no answer is that stepping five to the left from 3 walks off the end of the line.

        So extend the line. Put a mark one step left of zero and call it $-1$, "negative one". The next mark is $-2$, and so on for ever. Fractions and decimals fill the gaps on the left exactly as they do on the right: $-0.5$ is halfway between 0 and $-1$.

        Start at 3 on the line below and step left five times.
    - figure: number-line
      props: { min: -6, max: 6, start: 3 }
    - text: |
        You land on $-2$. So $3 - 5 = -2$, and in the same way Meera's balance is $40 - 65 = -25$. The balance is negative, which simply *means* she owes ₹25. One number carries both the size of the balance and which side of zero it is on. When the ₹30 refund arrives, the app does an ordinary addition, $-25 + 30 = 5$, and the debt is cleared with nothing special said about it.

        Every positive number now has a mirror image on the other side of zero, the same distance away. The mirror image of 4 is $-4$. The mirror image of $-4$ is 4 again. These pairs are called **opposites**, and their defining property is that they cancel:

        $$4 + (-4) = 0.$$

        Four steps right, then four steps left, and you are back where you started. A debt of four and a credit of four make nothing. Everything about negative numbers follows from this one cancelling property together with the laws you already know.

        A word on size. Further left means smaller. So $-5$ is less than $-2$, even though 5 is more than 2. A temperature of $-5$ degrees is colder than $-2$ degrees. Owing 5 is worse than owing 2. If you ever doubt a comparison, picture the line.
  derivation:
    - text: |
        **Adding a negative.** $5 + (-2)$: a credit of 5 and a debt of 2. On the line, start at 5 and step left twice. Result 3. So adding a negative number is the same as subtracting its opposite:

        $$a + (-b) = a - b.$$

        **Subtracting a negative.** This is the one that feels strange, so go back to the definition and do not guess. $3 - (-2)$ is the number which, added to $-2$, gives 3. Stand at $-2$ on the line. How far, and in which direction, to reach 3? Five steps to the right. So

        $$3 - (-2) = 5 = 3 + 2.$$

        Subtracting a negative is adding its opposite. In money: if someone cancels a debt of 2 that you owed, you are 2 better off. Taking away a debt is a gain.
    - question:
        id: subtract-negative
        type: numeric
        system: s2
        prompt: |
          A server's clock is compared with an exact time signal, and the difference, server minus signal, is written down in seconds. On Monday it is $-0.04$: the server is slow. On Tuesday it is $0.03$: the server is fast. What is the change, new minus old: $0.03 - (-0.04)$?
        answer: "0.07"
        explanation: |
          Standing at $-0.04$ on the line, it takes 0.04 to reach zero and another 0.03 to reach 0.03. Subtracting a negative adds its opposite: $0.03 + 0.04$.
    - text: |
        **Multiplying a positive by a negative.** Multiplication is repeated addition, and that still works: $3 \times (-2)$ is three debts of two.

        $$3 \times (-2) = (-2) + (-2) + (-2) = -6.$$

        What about $(-2) \times 3$? "Negative two lots of three" makes no sense as repeated addition. But we insisted that the old laws must survive, and one of them says order does not matter in a multiplication. So $(-2) \times 3$ must equal $3 \times (-2)$, which is $-6$. Positive times negative, in either order, is negative.

        **Multiplying two negatives.** What is $(-1) \times (-1)$? No picture of bags of oranges will help. But the laws will. We do not get to choose the answer. The distributive law chooses it for us.

        Start with something certain: $1 + (-1) = 0$. Multiply both sides by $-1$. Anything times zero is zero, so

        $$(-1) \times \big(1 + (-1)\big) = 0.$$

        Now open the bracket with the distributive law:

        $$(-1) \times 1 + (-1) \times (-1) = 0.$$

        The first term is $-1$. So the line says: $-1$ plus *something* is zero. The only number that cancels $-1$ is its opposite, 1. Therefore

        $$(-1) \times (-1) = 1.$$

        Negative times negative is positive, not because a teacher said so, but because any other answer would break the distributive law. The same argument works for any two negative numbers: $(-4) \times (-3) = 12$.

        There is a pattern that agrees. Read down this list, where the second number drops by one each time:

        $$(-3) \times 2 = -6, \quad (-3) \times 1 = -3, \quad (-3) \times 0 = 0, \quad (-3) \times (-1) = {?}$$

        The results go up by 3 each step: $-6$, $-3$, $0$. The next must be 3.

        **Dividing** undoes multiplying, so the signs follow the same rule. $(-8) \div (-2)$ asks what number times $-2$ gives $-8$. That is 4. And $(-8) \div 2$ asks what times 2 gives $-8$, which is $-4$.
    - question:
        id: mixed-signs
        type: numeric
        system: s2
        prompt: "$(-4) \\times (-3) + (-2) \\times 5$"
        answer: "2"
        explanation: |
          Multiplications first. $(-4) \times (-3) = 12$ and $(-2) \times 5 = -10$. Then $12 + (-10)$.
    - text: |
        **The minus sign has two jobs.** In $7 - 3$ it is an operation between two numbers: subtract. In $-3$ it is part of the name of one number: negative three. And in front of a bracket, as in $-(2 + 3)$, it means "the opposite of". All three jobs agree with each other, because subtracting is adding the opposite, and the opposite of a number is that number multiplied by $-1$:

        $$-a = (-1) \times a.$$

        This last fact is the most useful way to think when signs get tangled. $-(2 + 3)$ is $(-1) \times (2 + 3)$, which by the distributive law is $-2 - 3 = -5$. The minus sign reaches every term inside the bracket. And $-(-5)$ is $(-1) \times (-5) = 5$. The opposite of the opposite is where you began.
  formal:
    - text: |
        For every number $a$ there is exactly one number $-a$, its **opposite**, with

        $$a + (-a) = 0.$$

        The whole numbers together with their opposites, $\ldots, -3, -2, -1, 0, 1, 2, 3, \ldots$, are called the **integers**. Fractions and decimals have opposites too. Zero is its own opposite and is neither positive nor negative.

        **Subtraction** is now defined for every pair of numbers: $a - b = a + (-b)$.

        **Sign rules**, each a consequence of the laws of arithmetic:

        | | Result |
        | --- | --- |
        | positive $\times$ positive | positive |
        | positive $\times$ negative, negative $\times$ positive | negative |
        | negative $\times$ negative | positive |

        Division follows the same table. Also $-(-a) = a$ and $-(a + b) = -a - b$.

        **Order.** $a < b$, read "$a$ is less than $b$", means $a$ lies to the left of $b$ on the number line. Every negative number is less than zero, and zero is less than every positive number.

        **Size without direction.** The distance of a number from zero, ignoring which side it is on, is its **absolute value**. Both 4 and $-4$ have absolute value 4. This idea returns in [[f1.inequalities]].

        All the laws of the earlier lessons, commutative, associative, distributive, hold for negative numbers without exception. And with them, subtraction never fails. The number system now has three operations that always work, and a fourth, division, that fails only for zero.
  drill:
    - text: Seconds each. Picture the line if you need to, until you no longer need to.
    - question:
        id: add-mixed
        type: numeric
        system: s1
        prompt: "$-7 + 4$"
        answer: "-3"
        explanation: Start at $-7$, step right four times.
    - question:
        id: below-zero
        type: numeric
        system: s1
        prompt: "$5 - 9$"
        answer: "-4"
        explanation: Five steps left reaches zero, and four more go beyond it.
    - question:
        id: further-left
        type: numeric
        system: s1
        prompt: "$-3 - 6$"
        answer: "-9"
        explanation: Already left of zero, and six more steps left.
    - question:
        id: product-sign
        type: numeric
        system: s1
        prompt: "$(-6) \\times 7$"
        answer: "-42"
        explanation: Seven debts of six.
    - question:
        id: quotient-sign
        type: numeric
        system: s1
        prompt: "$(-8) \\div (-2)$"
        answer: "4"
        explanation: What times $-2$ gives $-8$? A positive number.
    - question:
        id: double-opposite
        type: numeric
        system: s1
        prompt: "$-(-5)$"
        answer: "5"
        explanation: The opposite of the opposite.
    - question:
        id: smallest
        type: choice
        system: s1
        prompt: Which is the smallest?
        options: ["$-2$", "$0$", "$-10$", "$3$"]
        answer: 2
        explanation: Smallest means furthest left.
  work:
    - text: Slower now. Write every sign.
    - question:
        id: evaluate-signs
        type: order
        system: s2
        prompt: "Put the steps for evaluating $4 - 2 \\times (-3 + 1)$ into order."
        steps:
          - "Brackets: $-3 + 1 = -2$."
          - "Multiply: $2 \\times (-2) = -4$."
          - "Rewrite the subtraction: $4 - (-4)$."
          - "Subtracting a negative adds its opposite: $4 + 4 = 8$."
        explanation: The order of operations is unchanged by negative numbers. Brackets, then multiplication, then subtraction.
    - question:
        id: repeated-correction
        type: numeric
        system: s2
        prompt: |
          A wallet holds ₹150. Four bus fares of ₹20 are paid from it, each recorded as a change of $-20$. What does the wallet hold afterwards, in rupees?
        answer: "70"
        unit: rupees
        explanation: |
          Four changes of $-20$ are $4 \times (-20) = -80$. Then $150 + (-80) = 150 - 80$.
    - question:
        id: week-change
        type: numeric
        system: s2
        prompt: |
          Over three days a server's queue of waiting jobs changes by $+300$, $-600$ and $-200$, each recorded as new minus old. What is the total change over the three days?
        answer: "-500"
        unit: jobs
        explanation: |
          $300 + (-600) + (-200)$. The two falls total $-800$, and the rise offsets 300 of that. This is the bookkeeping the puzzle asked for: one kind of number, ordinary addition, no special cases.
    - question:
        id: fraction-signs
        type: numeric
        system: s2
        prompt: "$-\\dfrac{2}{3} + \\dfrac{1}{2}$"
        answer: "-1/6"
        explanation: |
          In sixths: $-\frac{4}{6} + \frac{3}{6}$. Start four sixths left of zero and step three sixths right.
    - question:
        id: why-positive
        type: choice
        system: s2
        prompt: "Which is the actual reason that $(-1) \\times (-1) = 1$?"
        options:
          - "It is a convention that mathematicians voted on."
          - "Two minus signs drawn together look like a plus sign."
          - "Expanding $(-1) \\times (1 + (-1)) = 0$ by the distributive law gives $-1 + (-1) \\times (-1) = 0$, which forces $(-1) \\times (-1)$ to be the opposite of $-1$."
          - "Because multiplying always makes numbers larger."
        answer: 2
        explanation: The value is forced by requiring the distributive law to keep working. No other value is consistent with the rest of arithmetic.
    - question:
        id: compare-negatives
        type: choice
        system: s2
        prompt: Which statement is true?
        options:
          - "$-0.75 < -0.5$, because $-0.75$ lies further to the left."
          - "$-0.75 > -0.5$, because 75 is more than 50."
          - "$-0.75 = -0.5$, because both are less than zero."
          - "They cannot be compared."
        answer: 0
        explanation: Among negative numbers, the one with the larger absolute value is the smaller number, because it is further left.
  connections:
    - text: |
        The puzzle is solved. A balance is one number, positive when you have money and negative when you owe it, and every payment and refund is an ordinary addition. The same is true of any change: positive for a rise, negative for a fall, and a week of changes is just their sum.

        Signed numbers are everywhere in what is coming. A clock that runs fast or slow is off by a signed amount. A measurement minus its target is positive when it is too high and negative when too low. A program that learns nudges thousands of numbers up or down, and the sign of each nudge says which way. None of that can even be written down without today's numbers.

        Computers have to store the sign as well, using nothing but switches that are on or off. In [[h0.twos-complement-and-overflow]] you will see the trick nearly every processor uses, which turns out to be the counter that ran out of wheels from the first lesson, read in a clever way.

        The proof that negative times negative is positive is also your first taste of a way of working that will keep returning: when a new kind of number is introduced, we do not make up its rules. We demand that the old laws keep holding, and the rules are whatever that demand forces.

        Next, in [[f0.powers-and-roots]], multiplication gets a shorthand of its own, in the same way that multiplication was a shorthand for addition. Signs will matter there at once: what happens when a negative number is multiplied by itself over and over?
