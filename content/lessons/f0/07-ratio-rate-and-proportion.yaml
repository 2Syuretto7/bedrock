concept: f0.ratio-rate-and-proportion
minutes: 85
claim: You can compare quantities by ratio, turn a ratio into a rate per one, chain several rates by letting their units cancel like fractions, recognise when two quantities are proportional or inversely proportional, and find a missing value in a proportion while saying why the method works.
recalls: [f0.powers-of-two]
uses: [f0.the-four-operations-and-order-of-operations, f0.fractions-decimals-and-percentages, f0.powers-and-roots]
leads: [f0.units-prefixes-and-orders-of-magnitude, f1.coordinates-lines-and-slope, f6.littles-law]
parts:
  recall:
    - text: |
        [[f0.powers-of-two]] counted patterns of bits and found that a gibibyte is 7.4% larger than a gigabyte, a comparison made by dividing one size by the other. Today is about comparing by dividing. First, two quick pulls on the last lesson.
  puzzle:
    - text: |
        Priya rides a scooter to her office in Pune, 12 km each way. The scooter does 45 km to a litre of petrol, petrol costs ₹103 a litre, and she goes to the office 22 days a month. What does the commute cost her each month?

        Every number needed is on the page, and yet most people who try this in their heads get stuck, or get an answer that is wildly wrong. The trouble is not the arithmetic. It is that the numbers are of four different kinds: kilometres per trip, trips per day, days per month, kilometres per litre and rupees per litre. Should 45 be multiplied by 103, or divided into it? Is it 12 times 45, or 12 divided by 45? A guess that multiplies the wrong pair gives a confident answer such as ₹4,635, the price of 45 litres, which has nothing to do with Priya.

        Engineers meet this tangle every day. A server handles so many requests per second, each request reads so many kilobytes, storage costs so many rupees per gigabyte per month, and the question is what the month will cost. The numbers change; the tangle does not.

        Here is the puzzle. **When a question gives several quantities, each "per" something else, how do you know which to multiply and which to divide, without guessing, and how can you check that you combined them correctly?**
  intuition:
    - text: |
        The key word is **per**, and it means "for each one".

        Start with the simplest kind of comparison by division. Two web servers are watched for a day. Server A fails on 45 requests and server B on 60. Subtract and A looks better. But A was sent 900 requests and B was sent 1,500, so B had far more chances to fail. The fair question is not "how many failures?" but "how many failures **for each** request?", or, scaled up, "for every hundred requests?"

        A failed 45 times in 900. Cut both numbers down together and that is 5 in every 100. B failed 60 times in 1,500, which is 4 in every 100. B is the better server, even though it failed more often.

        We compared each count with its total **by division instead of by subtraction**. A comparison by division is called a **ratio**. It is the idea from the lesson on fractions: $\frac{3}{4}$ and $\frac{6}{8}$ were the same amount because both numbers were scaled by the same factor, and "45 in 900" and "5 in 100" are the same ratio for the same reason.

        In the figure, a service handles 4 reads of data for every 1 write. Slide the multiplier. Both bars grow, but watch what does not change.
    - figure: ratio-table
      props: { a: 4, b: 1, first: reads, second: writes, start: 1 }
    - text: |
        The amounts change. The total changes. The **shape** does not: the first bar is always four times as long as the second. Four to one, eight to two, forty to ten: all are the same ratio, written $4 : 1$.

        That is the difference between the two kinds of comparison. If you **add** the same amount to two quantities, the gap between them stays fixed, but their ratio changes. If you **multiply** two quantities by the same number, their ratio stays fixed, but the gap changes. Ratios are for situations where things scale together: recipes, maps, speeds, failure rates, the mix of reads and writes on a database.
  derivation:
    - text: |
        **Writing a ratio.** "Four parts to one part" is written $4 : 1$. A ratio can be scaled up or down like a fraction: $12 : 8$, dividing both by 4, is $3 : 2$. When no further common factor remains, the ratio is in simplest form.

        **Two kinds of ratio, and how they relate.** The mix $4 : 1$ compares one part with the other part. It does not say that reads are $\frac{4}{1}$ of all the requests, which would be more than all of them. To compare a part with the **whole**, first find the whole in the same units: $4 + 1 = 5$ parts. Then reads are $\frac{4}{5}$ of the requests and writes are $\frac{1}{5}$.

        This is the single most common slip with ratios, so say it once more. A ratio $a : b$ between two parts corresponds to the fractions $\frac{a}{a+b}$ and $\frac{b}{a+b}$ of the whole.

        **Rates: ratios per one.** The most useful way to scale a ratio is until the second number is 1. Server A's 45 failures in 900 requests becomes

        $$\frac{45}{900} = \frac{5}{100} = 0.05 \text{ failures per request.}$$

        A ratio scaled so that it speaks about **one** unit of the second quantity is called a **unit rate**, and the word "per" means "for each one". Speeds are unit rates: kilometres per hour. So are prices per kilogram. A percentage is a rate per hundred instead of per one, which is the same idea with a friendlier size.

        Unit rates are what make comparison fair, because they put everything on the same footing: one request, one hour, one kilogram.

        **Units cancel like fractions.** A rate carries its units as a fraction: 45 km per litre is $\frac{45 \text{ km}}{1 \text{ litre}}$, and ₹103 per litre is $\frac{103 \text{ rupees}}{1 \text{ litre}}$. Read upside down, the first is $\frac{1 \text{ litre}}{45 \text{ km}}$, which is just as true: one litre for every 45 km. Now treat a unit exactly like a number that appears on the top and the bottom of a fraction. When it appears in both, it cancels, as $\frac{3 \times 5}{4 \times 5} = \frac{3}{4}$ did.

        **Now the puzzle.** Priya rides $2 \times 12 = 24$ km a day, so $24 \times 22 = 528$ km a month. Chain the rates so that each unit you do not want cancels:

        $$528 \ \cancel{\text{km}} \times \frac{1 \ \cancel{\text{litre}}}{45 \ \cancel{\text{km}}} \times \frac{103 \text{ rupees}}{1 \ \cancel{\text{litre}}} = \frac{528 \times 103}{45} \text{ rupees} \approx 1{,}209 \text{ rupees}.$$

        Kilometres cancel against kilometres, litres against litres, and only rupees are left, which is what was asked. That is how you know 45 must divide and 103 must multiply: any other arrangement leaves a unit such as $\frac{\text{km}^2}{\text{litre}}$ or "rupee-kilometres per litre squared", which is not a price at all. The units are a free check on the reasoning.
    - question:
        id: storage-bill
        type: numeric
        system: s2
        prompt: |
          A storage service charges ₹2 per GB per month. A team keeps 300 GB there. Chaining the rate so that GB cancels, what is the monthly bill in rupees?
        answer: "600"
        unit: rupees
        explanation: |
          $300 \ \text{GB} \times \frac{2 \text{ rupees}}{1 \ \text{GB}} = 600 \text{ rupees}$ for each month. Gigabytes appear on the top and on the bottom, so they cancel and leave rupees.
    - text: |
        **Proportion.** Two quantities are **proportional** when their ratio never changes: double one and the other doubles, halve one and the other halves. If a program handles pictures at a steady speed, the time taken is proportional to the number of pictures.

        Since the ratio is fixed, call its value $k$. Then the second quantity is always $k$ times the first:

        $$y = k \times x.$$

        The number $k$ is the unit rate, here called the **constant of proportionality**. Everything about a proportional relationship is contained in that one number.

        **Finding a missing value.** Suppose 3 pictures take 0.6 seconds, at a steady speed. How long do 20 take? There are two routes, and they are the same idea.

        *Through one.* Find the unit rate: $0.6 \div 3 = 0.2$ seconds per picture. Then 20 pictures take $20 \times 0.2 = 4$ seconds. Go down to one, then up to what you need.

        *By the equation.* The two ratios must be equal:

        $$\frac{0.6}{3} = \frac{t}{20}.$$

        In the lesson on fractions, two fractions $\frac{a}{b}$ and $\frac{c}{d}$ were equal exactly when $a \times d = b \times c$. Apply that here: $0.6 \times 20 = 3 \times t$, so $12 = 3 \times t$, and $t = 4$. This is what people call "cross-multiplying". It is not a trick. It is the test for equal fractions, used backwards.
    - question:
        id: missing-value
        type: numeric
        system: s2
        prompt: |
          At a steady speed, a program labels 8 pictures in 2 seconds. How many seconds does it need for 100 pictures?
        answer: "25"
        unit: seconds
        explanation: |
          Through one: $2 \div 8 = 0.25$ seconds per picture, and $100 \times 0.25 = 25$. Or by the equation: $\frac{2}{8} = \frac{t}{100}$ gives $8 \times t = 200$.
    - text: |
        **When things are not proportional.** Proportion is so convenient that it is tempting to assume it everywhere. Two warnings.

        First, adding is not scaling. The ratio $2 : 3$ is not the same as $3 : 4$, although one was added to each side. As decimals, $\frac{2}{3}$ is about 0.67 and $\frac{3}{4}$ is 0.75.

        Second, some quantities scale by a **power**. Double the side of a square picture from 28 pixels to 56 and the number of pixels does not double. The picture is twice as wide *and* twice as tall, so the count is multiplied by $2 \times 2 = 2^2 = 4$. In general, scaling every length by a factor $k$ scales an area by $k^2$. A picture three times as wide and tall holds nine times as many pixels, which is why larger pictures are so much more costly for a program to handle.

        **Inverse proportion.** Sometimes one quantity goes up exactly as another goes down. If 4 machines finish a job in 6 hours, then 8 identical machines finish it in 3. Here it is the **product**, not the ratio, that stays fixed: $4 \times 6 = 8 \times 3 = 24$ machine-hours of work. Doubling one quantity halves the other.
  formal:
    - text: |
        A **ratio** $a : b$, with $b$ not zero, compares two quantities by division. Its value is the fraction $\frac{a}{b}$. For any $n$ not zero, $a : b$ and $n \times a : n \times b$ are the same ratio.

        If a whole is divided into two parts in the ratio $a : b$, the parts are $\frac{a}{a+b}$ and $\frac{b}{a+b}$ of the whole. The same holds for three or more parts: in the ratio $a : b : c$ the first part is $\frac{a}{a+b+c}$ of the whole.

        A **rate** is a ratio of quantities of different kinds, and a **unit rate** is a rate whose second quantity is 1.

        Two quantities $x$ and $y$ are **proportional** if there is a fixed number $k$, the constant of proportionality, with $y = k \times x$ for every pair of values. Equivalently, $\frac{y}{x}$ is the same for every pair.

        A **proportion** is a statement that two ratios are equal, $\frac{a}{b} = \frac{c}{d}$, and it holds exactly when $a \times d = b \times c$.

        Two quantities are **inversely proportional** if their product is fixed: $x \times y = k$.

        If all lengths of a flat shape are multiplied by $k$, its area is multiplied by $k^2$.
  drill:
    - text: Seconds each.
    - question:
        id: simplify-ratio
        type: numeric
        system: s1
        prompt: |
          $12 : 8 = 3 : x$. What is $x$?
        answer: "2"
        explanation: Both numbers were divided by 4.
    - question:
        id: part-of-whole
        type: numeric
        system: s1
        prompt: |
          A collection is split in the ratio $3 : 1$. What fraction of the whole is the larger part?
        answer: "3/4"
        explanation: There are $3 + 1 = 4$ parts in all.
    - question:
        id: unit-rate
        type: numeric
        system: s1
        prompt: A program labels 150 pictures in 3 seconds. How many pictures per second is that?
        answer: "50"
        unit: per second
        explanation: Per second means for each one second. Divide by 3.
    - question:
        id: scale-up
        type: numeric
        system: s1
        prompt: |
          $3 : 4 = 15 : x$. What is $x$?
        answer: "20"
        explanation: Three was multiplied by 5.
    - question:
        id: share
        type: numeric
        system: s1
        prompt: "35 pictures are split in the ratio $2 : 5$. How many are in the smaller part?"
        answer: "10"
        explanation: Seven parts in all, so each part is 5 pictures. Two parts.
    - question:
        id: solve-proportion
        type: numeric
        system: s1
        prompt: |
          $\dfrac{x}{12} = \dfrac{3}{4}$. What is $x$?
        answer: "9"
        explanation: Twelve is three fours, so the top is three threes.
  work:
    - text: Slower now.
    - question:
        id: three-way-split
        type: numeric
        system: s2
        prompt: |
          A collection of 60,000 pictures is split into three sets, for training, for checking during training, and for the final test, in the ratio $8 : 1 : 1$. How many pictures are in the final test set?
        answer: "6000"
        unit: pictures
        explanation: |
          There are $8 + 1 + 1 = 10$ parts, so one part is $60000 \div 10$. The test set is one part.
    - question:
        id: throughput
        type: numeric
        system: s2
        prompt: |
          At a steady speed a program labels 240 pictures in 8 seconds. How many does it label in one minute?
        answer: "1800"
        unit: pictures
        explanation: |
          The unit rate is $240 \div 8 = 30$ pictures per second. A minute is 60 seconds.
    - question:
        id: proportion-steps
        type: order
        system: s2
        prompt: |
          5 pictures take 2 seconds at a steady speed. Put the steps for finding the time $t$ for 35 pictures, by the equation method, into order.
        steps:
          - "State that the two ratios of time to pictures are equal: $\\dfrac{2}{5} = \\dfrac{t}{35}$."
          - "Use the test for equal fractions: $2 \\times 35 = 5 \\times t$."
          - "Work out the left side: $70 = 5 \\times t$."
          - "Undo the multiplication by dividing: $t = 14$."
        explanation: The proportion is set up first, with matching quantities in matching positions. The test for equal fractions then removes the fractions, and one division finishes it.
    - question:
        id: area-scaling
        type: numeric
        system: s2
        prompt: |
          A square picture is enlarged so that its side goes from 28 pixels to 84 pixels. By what factor is the number of pixels multiplied?
        answer: "9"
        explanation: |
          The side is multiplied by $84 \div 28 = 3$. The count of pixels is rows times columns, and both are tripled, so it is multiplied by $3^2$.
    - question:
        id: inverse
        type: numeric
        system: s2
        prompt: |
          A job takes 4 identical machines 6 hours. Working in the same way, how many hours would 12 machines take?
        answer: "2"
        unit: hours
        explanation: |
          The total work is fixed: $4 \times 6 = 24$ machine-hours. Then $24 \div 12$. Three times the machines, a third of the time.
    - question:
        id: is-proportional
        type: choice
        system: s2
        prompt: |
          In which case are the two quantities proportional?
        options:
          - "Pictures labelled: 10, 20, 30. Seconds taken: 4, 8, 12."
          - "Pictures labelled: 10, 20, 30. Seconds taken: 5, 7, 9."
          - "Side of a square: 1, 2, 3. Pixels in it: 1, 4, 9."
          - "Machines: 1, 2, 4. Hours for the job: 8, 4, 2."
        answer: 0
        explanation: Only in the first is the ratio the same in every pair, 0.4 seconds per picture. The second adds a fixed 2 for each extra 10 pictures but starts from the wrong place, the third scales by a square, and the fourth is inverse proportion.
    - question:
        id: fair-comparison
        type: choice
        system: s2
        prompt: |
          Program C makes 30 mistakes on 500 pictures. Program D makes 54 mistakes on 1,000 pictures. Which statement is correct?
        options:
          - "C is better, because it made fewer mistakes."
          - "D is better, because its error rate is 5.4% against C's 6%."
          - "They are equally good, because D saw twice as many pictures and made about twice as many mistakes."
          - "They cannot be compared, because the totals differ."
        answer: 1
        explanation: Per hundred pictures, C makes 6 mistakes and D makes 5.4. Rates put both on the same footing.
  connections:
    - text: |
        The puzzle is answered. Priya's commute costs about ₹1,209 a month, and the way to be sure of it is to write each rate with its units as a fraction and arrange the chain so that every unit except the one you want cancels. Counts from different totals are compared the same way, by ratio, most conveniently as a rate per one or per hundred.

        Proportion will come back in a new form very soon. The equation $y = k \times x$ says that $y$ is a fixed multiple of $x$. Drawn as a picture it is a straight line through zero, and the constant $k$ is the steepness of that line. That is the subject of [[f1.coordinates-lines-and-slope]]. Further on, [[f6.littles-law]] turns out to be a single rate equation, people in a queue equal to arrivals per second times seconds spent waiting, and it explains more about busy servers than any other formula.

        Units did a lot of work today, and so far they have been everyday ones: kilometres, litres, rupees. Engineers use units that span from a billionth of a second to a petabyte, with prefixes to keep the numbers short. The next lesson, [[f0.units-prefixes-and-orders-of-magnitude]], is about those prefixes and about how to think about quantities that differ by factors of a thousand or a million.
