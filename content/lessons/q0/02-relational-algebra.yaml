            print(columns, sorted(rows))
          - |
            def natural_join(r, s):
                # Pair every row of r with every row of s that agrees on all the columns they share.
                rcols, rrows = r
                scols, srows = s
                shared = [c for c in rcols if c in scols]
                extra = [c for c in scols if c not in rcols]
                rows = set()
                for a in rrows:
                    for b in srows:
                        if not shared or a[rcols.index(shared[0])] == b[scols.index(shared[0])]:
                            rows.add(a + tuple(b[scols.index(c)] for c in extra))
                return (rcols + tuple(extra), rows)


            riders = (("rider", "store"), {("Asha", "KOR"), ("Bilal", "IND"), ("Chitra", "KOR")})
            stores = (("store", "manager"), {("KOR", "Meena"), ("IND", "Ravi"), ("HSR", "Tara")})
            columns, rows = natural_join(riders, stores)
            print(columns, sorted(rows))
        explanation: |
          The join is the product filtered by agreement on every shared column, with each shared column kept once. Keeping every pair is the product; joining the two rows whole repeats the shared columns; and checking only the first shared column accepts pairs that disagree on another.
    - question:
        id: write-rota-query
        type: code
        mode: write
        system: s2
        prompt: |
          The tables `mon`, `tue` and `on_leave` each have one column, `rider`. Change `query` so that it returns, in order of name, every rider on Monday's or Tuesday's list who is not on leave, each once.
        starter: |
          import sqlite3

          query = """
              select rider from mon
          """

          db = sqlite3.connect(":memory:")
          db.executescript("""
              create table mon (rider text primary key);
              create table tue (rider text primary key);
              create table on_leave (rider text primary key);
              insert into mon values ('Asha'), ('Bilal'), ('Chitra');
              insert into tue values ('Bilal'), ('Dev'), ('Esha');
              insert into on_leave values ('Chitra'), ('Esha'), ('Farhan');
          """)
          print(db.execute(query).fetchall())
        solution: |
          import sqlite3

          query = """
              select rider from mon
              union
              select rider from tue
              except
              select rider from on_leave
              order by rider
          """

          db = sqlite3.connect(":memory:")
          db.executescript("""
              create table mon (rider text primary key);
              create table tue (rider text primary key);
              create table on_leave (rider text primary key);
              insert into mon values ('Asha'), ('Bilal'), ('Chitra');
              insert into tue values ('Bilal'), ('Dev'), ('Esha');
              insert into on_leave values ('Chitra'), ('Esha'), ('Farhan');
          """)
          print(db.execute(query).fetchall())
        tests: |
          import random as _random

          _rng = _random.Random(73)
          _people = ["Asha", "Bilal", "Chitra", "Dev", "Esha", "Farhan", "Gita", "Harish"]
          for _ in range(30):
              _db = sqlite3.connect(":memory:")
              _db.executescript("create table mon (rider text primary key); create table tue (rider text primary key); create table on_leave (rider text primary key);")
              _sets = {}
              for _t in ["mon", "tue", "on_leave"]:
                  _sets[_t] = set(_rng.sample(_people, _rng.randint(0, 5)))
                  _db.executemany("insert into " + _t + " values (?)", [(_p,) for _p in _sets[_t]])
              _want = sorted((_sets["mon"] | _sets["tue"]) - _sets["on_leave"])
              _got = sorted(_r[0] for _r in _db.execute(query).fetchall())
              assert _got == _want, "With Monday " + str(sorted(_sets["mon"])) + ", Tuesday " + str(sorted(_sets["tue"])) + " and on leave " + str(sorted(_sets["on_leave"])) + ", the query should give " + str(_want) + ", not " + str(_got)
          assert output.strip() == "[('Asha',), ('Bilal',), ('Dev',)]", "The program should print [('Asha',), ('Bilal',), ('Dev',)]"
        wrong:
