        explanation: |
          In algebra this is $(\text{mon} \cup \text{tue}) - \text{on\_leave}$, and SQLite applies `union` and then `except` from left to right, so writing them in that order gives exactly it. `intersect` keeps only riders on both lists; taking the leave away from Monday before adding Tuesday lets a Tuesday rider on leave back in; and forgetting the leave list keeps everyone.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          A database pairs each of 1,00,000 orders with each of 500 stores before filtering. How many pairs does it form?
        answer: "50000000"
        explanation: |
          $1{,}00{,}000 \times 500 = 5{,}00{,}00{,}000$, five crore pairs, to keep 200 orders in the end.
    - question:
        id: work-self-join
        type: choice
        system: s2
        prompt: |
          To list every pair of riders who work at the same store from riders(rider, store), what does relational algebra need that a join of two different tables does not?
        options:
          - "Rename one copy of riders, so the two copies' columns can be told apart, then join them on store and keep the pairs whose first name comes before the second."
          - "A union of riders with itself."
          - "A difference of riders and itself."
          - "Nothing: the natural join of riders with itself gives the pairs."
        answer: 0
        explanation: |
          The natural join of a table with itself shares every column, so each row matches only itself. Renaming one copy's columns, say to rider2 and store2, lets the join compare store with store2 while keeping both names; requiring rider < rider2 drops a rider paired with themselves and each pair's mirror image.
  connections:
    - text: |
        Five crore pairs, to keep 200. Moving the selection below the join, onto the stores table, leaves one store; pairing it with the orders whose store code matches touches each order once, and an index on the store code would reach the 200 orders directly. The two plans are equivalent expressions of the same question, and the rewriting rules of this lesson are what let a database's optimiser choose the cheap one, as [[q3.from-sql-to-a-plan]] will show from the inside.

        From here the course writes questions in SQL itself. [[q0.selecting-and-filtering]] starts with the commonest pair, selection and projection, written as `select … from … where`, and [[q0.joins]] follows with the many kinds of join.
