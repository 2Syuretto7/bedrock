                    for b in srows:
                        if True:
                            rows.add(a + tuple(b[scols.index(c)] for c in extra))
                return (rcols + tuple(extra), rows)


            riders = (("rider", "store"), {("Asha", "KOR"), ("Bilal", "IND"), ("Chitra", "KOR")})
            stores = (("store", "manager"), {("KOR", "Meena"), ("IND", "Ravi"), ("HSR", "Tara")})
            columns, rows = natural_join(riders, stores)
            print(columns, sorted(rows))
          - |
            def natural_join(r, s):
                # Pair every row of r with every row of s that agrees on all the columns they share.
                rcols, rrows = r
                scols, srows = s
                shared = [c for c in rcols if c in scols]
                extra = [c for c in scols if c not in rcols]
