        explanation: |
          `not null` with `references customers (id)` demands a real customer, and `not null` with `check (amount > 0)` demands a positive amount; the default action refuses deleting a customer with orders. A foreign key allows NULL unless told otherwise; a check lets a NULL amount through, since its condition is unknown; and `on delete cascade` deletes the orders instead of refusing.
