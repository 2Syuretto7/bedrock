    - question:
        id: work-durable
        type: choice
        system: s2
        prompt: |
          A payment service commits a transfer and tells the customer "done". A second later the server loses power. What should the customer see after the restart?
        options:
          - "The transfer, because a committed transaction is durable."
          - "No transfer, because the server crashed."
          - "Half of the transfer."
          - "Whatever the last backup held."
        answer: 0
        explanation: |
          `commit` returns only after the change is safely logged on disk, so a crash after it cannot undo it. A crash before `commit` returns would undo the whole transaction, never half of it.
  connections:
    - text: |
        ₹700. The debit was committed by itself, and the credit never ran, so ₹500 vanished from the system. Wrapped in a transaction, the same power cut leaves an unfinished transaction that the database undoes on restart: Asha ₹1,000, Bilal ₹200, ₹1,200 in all, as if the transfer had never been tried, and the app can try again.

        Constraints and transactions turn a database from a store of rows into a keeper of promises. Several of those promises need the database to find rows fast: checking `unique` or a foreign key means looking up a value among millions, at every write. The structure that makes this, and fast reads, possible is an index, and [[q0.indexes-from-the-outside]] shows how to use one without yet opening it up. The machinery behind `commit` surviving a crash is [[q2.write-ahead-logging]], and the full meaning of isolation when many connections write at once is [[q4.acid-precisely]].
