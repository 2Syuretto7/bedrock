        explanation: |
          Left joins keep restaurants with nothing on one side, and the two joins pair every item with every review, so plain counts multiply: Dosa Corner's 3 items and 2 reviews become 6 and 6. `count(distinct …)` counts each item and review once, and ignores the NULLs of the padded rows, giving 0 where there are none. Inner joins drop Chai Point, which has no reviews; `count(*)` counts the multiplied rows.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Store A's 2 orders average ₹1,000 and Store B's 8 orders average ₹500. What is the average of all 10 orders, in rupees?
        answer: "600"
        explanation: |
          The totals are ₹2,000 and ₹4,000, so ₹6,000 over 10 orders is ₹600. The average of the two averages, ₹750, gives Store A's two orders as much weight as Store B's eight.
    - question:
        id: work-missing-days
        type: choice
        system: s2
        prompt: |
          A daily sales chart is drawn from `select day, sum(amount) from orders group by day`. On a day when the shop was shut, the chart joins the previous and next days with a straight line instead of dropping to zero. Why, and what is the fix?
        options:
          - "A day with no orders has no rows and so no group; left joining a table of all days to the orders, and turning a missing sum into 0, gives every day a row."
          - "sum returns NULL on holidays; use avg instead."
          - "group by skips days whose total is small; use having to keep them."
          - "The chart library is wrong; the query is fine."
        answer: 0
        explanation: |
          Grouping can only produce groups for values that occur. To show days with no orders, the days must come from somewhere else, such as a calendar table, joined with a left join so that each day appears, and then its NULL total replaced by 0.
  connections:
    - text: |
        ₹600, not ₹750. Averages must be rebuilt from sums and counts, because an average throws away the size of the group it came from. Dashboards that average averages, across stores, days or regions, are wrong in exactly this way more often than anyone likes to admit.

        The double count from [[q0.joins]] is now repaired for counts. For sums, the cure is to aggregate each table on its own and join the small results, which needs a query inside a query, the subject of [[q0.subqueries-and-common-table-expressions]]. How a database computes groups over millions of rows, by sorting or by hashing, is [[q3.aggregation]]; and tables designed for exactly these summaries are the theme of [[q8.oltp-and-olap]].
