          - |
            import sqlite3

            query = """
                select name from customers
                where phone like ? || '_' and name like '%' || ? || '%'
                order by name
            """

            db = sqlite3.connect(":memory:")
            db.executescript("""
                create table customers (id integer primary key, name text, phone text);
                insert into customers (name, phone) values
                    ('Anil Kumar', '9845012345'), ('Kumari Devi', '9880011223'), ('Ravi Kumar', '7022098765'),
                    ('Suresh Kumar', '9898989898'), ('Meena Rao', '9845098450'), ('Kumar Swamy', '6398123456');
            """)
            print([row[0] for row in db.execute(query, ("98", "kumar"))])
        explanation: |
          `? || '%'` builds the pattern "the prefix, then anything", and `'%' || ? || '%'` builds "anything, the part, anything"; `like` ignores capitals. Putting `%` before the prefix matches 98 anywhere in the number, such as in 7022098765; a name pattern without the leading `%` matches only names starting with the part; and `_` allows exactly one more digit instead of any number.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          In the puzzle's table, how many rows does `where store = 'KOR' or store = 'HSR' and status = 'cancelled'` return?
        answer: "5"
        explanation: |
          It means `store = 'KOR' or (store = 'HSR' and status = 'cancelled')`: all four KOR orders, 1, 2, 5 and 8, and the cancelled HSR order 7.
    - question:
        id: work-paging
        type: choice
        system: s2
        prompt: |
          An app shows orders 20 at a time with `select * from orders limit 20 offset ?`, passing 0, 20, 40 and so on. Users report seeing some orders twice and others never. What is the fix?
        options:
          - "Add an order by on a column, or columns, that never ties, such as order by placed desc, id."
          - "Use limit 21 so that pages overlap safely."
          - "Fetch every order once and page through them in the app."
          - "Use offset ? + 1."
        answer: 0
        explanation: |
          Without `order by`, each page's query may return rows in a different order, so the pages need not fit together. A total order, with a unique column as the final tie-break, makes page $k$ exactly rows $20k + 1$ to $20k + 20$ of one fixed sequence.
  connections:
    - text: |
        Five rows, not three: all four KOR orders and the cancelled HSR one. The database did exactly what the query said, because `and` binds before `or`. Most wrong answers from SQL are like this one, a precise answer to a slightly different question, and the defence is to bracket mixed conditions and test a query on rows chosen to catch the mistake.

        Placeholders kept the search query safe; [[r2.injection]] shows what happens to programs that paste values into SQL instead. And every query in this lesson read one table. [[q0.joins]] combines tables, so that an order can be shown with its customer's name and its store's address in one result.
