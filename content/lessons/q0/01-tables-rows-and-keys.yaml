    - question:
        id: work-aadhaar
        type: choice
        system: s2
        prompt: |
          A clinic's patients table uses the Aadhaar number as its primary key, and appointments, bills and test results refer to patients by it. What is the strongest reason to change this?
        options:
          - "The identity number is copied into every table that refers to a patient, spreading private data, and any correction must be made everywhere; a surrogate id avoids both."
          - "Aadhaar numbers are too long to be stored as integers."
          - "Two patients may share an Aadhaar number."
          - "Primary keys must be made of letters."
        answer: 0
        explanation: |
          Every reference copies the key, so a private identifier as key ends up in every table and every log that mentions a patient, and a mistyped number becomes a correction in many places. A surrogate id keeps references meaningless outside the database, and the identity number can live in one unique column, with access controlled.
  connections:
    - text: |
        Three sets: rider, day and slot; rider, store and slot; and all four columns. Only the first is a key by the rules of the business; the second is an accident of this week's rows, as Wednesday's shift showed. That difference, between what the data happens to show and what the rules guarantee, is the heart of designing tables, and [[q1.keys-and-functional-dependencies]] will make it precise.

        Keys are the first of the constraints a database enforces for its users; [[q0.writes-constraints-and-transactions]] adds the rest. First, though, tables need a language for asking questions. [[q0.relational-algebra]] builds one from a handful of operations, each taking tables and giving back a table, so that any question can be built by composing them.
