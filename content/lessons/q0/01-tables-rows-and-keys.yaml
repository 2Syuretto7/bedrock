    - question:
        id: write-is-key
        type: code
        mode: write
        system: s2
        prompt: |
          Write `is_key(header, rows, columns)`. `header` lists the column names, each row is a tuple in that order, and `columns` names some of them. Return `True` exactly when no two rows agree on every column in `columns`.
        starter: |
          def is_key(header, rows, columns):
              # True when no two rows agree on every column named in columns.
              return True

          header = ["rider", "day", "store", "slot"]
          rows = [
              ("Asha", "Mon", "Koramangala", "morning"),
              ("Asha", "Mon", "Koramangala", "evening"),
              ("Asha", "Tue", "Indiranagar", "morning"),
              ("Bilal", "Mon", "Indiranagar", "morning"),
              ("Bilal", "Tue", "Indiranagar", "evening"),
              ("Chitra", "Mon", "Koramangala", "morning"),
              ("Chitra", "Tue", "Koramangala", "evening"),
              ("Dev", "Tue", "Indiranagar", "morning"),
          ]
          print(is_key(header, rows, ["rider", "day"]), is_key(header, rows, ["rider", "day", "slot"]), is_key(header, rows, []))
        solution: |
          def is_key(header, rows, columns):
              # True when no two rows agree on every column named in columns.
              places = [p for p in range(len(header)) if header[p] in columns]
              seen = set()
              for row in rows:
                  value = tuple(row[p] for p in places)
                  if value in seen:
                      return False
                  seen.add(value)
              return True


          header = ["rider", "day", "store", "slot"]
          rows = [
              ("Asha", "Mon", "Koramangala", "morning"),
              ("Asha", "Mon", "Koramangala", "evening"),
              ("Asha", "Tue", "Indiranagar", "morning"),
              ("Bilal", "Mon", "Indiranagar", "morning"),
              ("Bilal", "Tue", "Indiranagar", "evening"),
              ("Chitra", "Mon", "Koramangala", "morning"),
              ("Chitra", "Tue", "Koramangala", "evening"),
              ("Dev", "Tue", "Indiranagar", "morning"),
          ]
          print(is_key(header, rows, ["rider", "day"]), is_key(header, rows, ["rider", "day", "slot"]), is_key(header, rows, []))
        tests: |
          import itertools as _it
          import random as _random

          _rng = _random.Random(61)
          _h = ["a", "b", "c"]
          for _ in range(60):
              _rows = [tuple(_rng.randint(0, 2) for _ in range(3)) for _ in range(_rng.randint(0, 6))]
              for _k in range(4):
                  for _cols in _it.combinations(_h, _k):
                      _idx = [_h.index(_c) for _c in _cols]
                      _want = len(set(tuple(_r[_i] for _i in _idx) for _r in _rows)) == len(_rows)
                      _got = is_key(_h, list(_rows), list(_cols))
                      assert _got == _want, "is_key(" + str(_h) + ", " + str(_rows) + ", " + str(list(_cols)) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "False True False", "The program should print False True False"
