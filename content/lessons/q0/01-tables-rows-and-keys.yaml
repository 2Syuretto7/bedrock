                ("Asha", "Mon", "Koramangala", "morning"),
                ("Asha", "Mon", "Koramangala", "evening"),
                ("Asha", "Tue", "Indiranagar", "morning"),
                ("Bilal", "Mon", "Indiranagar", "morning"),
                ("Bilal", "Tue", "Indiranagar", "evening"),
                ("Chitra", "Mon", "Koramangala", "morning"),
                ("Chitra", "Tue", "Koramangala", "evening"),
                ("Dev", "Tue", "Indiranagar", "morning"),
            ]
            print(is_key(header, rows, ["rider", "day"]), is_key(header, rows, ["rider", "day", "slot"]), is_key(header, rows, []))
          - |
            def is_key(header, rows, columns):
                # True when no two rows agree on every column named in columns.
                if not columns:
                    return True
                places = [p for p in range(len(header)) if header[p] in columns]
                seen = set()
                for row in rows:
                    value = tuple(row[p] for p in places)
                    if value in seen:
                        return False
                    seen.add(value)
                return True


            header = ["rider", "day", "store", "slot"]
            rows = [
                ("Asha", "Mon", "Koramangala", "morning"),
                ("Asha", "Mon", "Koramangala", "evening"),
                ("Asha", "Tue", "Indiranagar", "morning"),
                ("Bilal", "Mon", "Indiranagar", "morning"),
                ("Bilal", "Tue", "Indiranagar", "evening"),
                ("Chitra", "Mon", "Koramangala", "morning"),
                ("Chitra", "Tue", "Koramangala", "evening"),
                ("Dev", "Tue", "Indiranagar", "morning"),
            ]
            print(is_key(header, rows, ["rider", "day"]), is_key(header, rows, ["rider", "day", "slot"]), is_key(header, rows, []))
        explanation: |
          Each row's values in the chosen columns form a tuple, and the columns are a key exactly when no tuple repeats, which a set detects in one pass. Comparing only neighbouring rows misses repeats that are far apart; testing each column on its own asks a different question; and with no columns chosen every row gives the empty tuple, so more than one row means not a key.
