    - question:
        id: work-gaps
        type: choice
        system: s2
        prompt: |
          A report shows a seven-day moving average of daily sales with `rows between 6 preceding and current row`, but the shop is shut on some days and those days have no row. What is the right fix?
        options:
          - "Generate every day with a recursive common table expression, left join the sales with 0 for missing days, and take the window over that."
          - "Change the frame to rows between 7 preceding and current row."
          - "Use rank instead of avg."
          - "Remove the order by from the window."
        answer: 0
        explanation: |
          A `rows` frame counts rows, so with missing days it spans more than a week. Filling in the calendar makes one row per day, and the frame then means seven days. Widening the frame only moves the error, and dropping the order makes it the average of everything.
  connections:
    - text: |
        Day 4. The running totals are ₹1,200, ₹2,100, ₹4,600 and ₹6,400, and one query computes all of them at once: `sum(amount) over (order by day)`, with an outer query to pick the first day above ₹6,000. Before windows, the same answer needed a correlated subquery summing the earlier days for every day, a quadratic amount of work for a linear idea.

        Windows put three new tools beside the totals of the last lessons: running and moving aggregates, rankings, and neighbours. Several of them produce NULL where there is nothing to look at, such as `lag` on the first row, and NULL behaves strangely in comparisons, sums and `not in`, which is the subject of [[q0.null-and-three-valued-logic]]. The same ideas reappear outside databases: data frames in [[s8.data-frames]] offer cumulative sums, rolling windows, ranks and shifts that are window functions under other names.
