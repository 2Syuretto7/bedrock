        explanation: |
          `lag(amount) over (order by day)` fetches the previous day's takings, the common table expression names the change, and the outer query keeps the falls. `lead` compares with the next day instead; ordering the window by amount makes the "previous" row the next smaller amount, so no change is ever negative; and `<= 0` also keeps days that merely matched the day before.
