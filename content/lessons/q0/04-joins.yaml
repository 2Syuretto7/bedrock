        explanation: |
          Two aliases of riders, joined on equal stores, give every ordered pair at each store, including each rider with themselves. `a.name < b.name` keeps exactly one ordering of each pair of different riders. `<>` keeps both orderings; no name condition keeps riders paired with themselves; and joining on id pairs each rider only with themselves, whom `<` then removes.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          A restaurant with 20 menu items and 30 reviews is joined to its items and its reviews in one query, both on the restaurant's id. How many rows does it produce?
        answer: "600"
        explanation: |
          Each item pairs with each review of the same restaurant, $20 \times 30 = 600$ rows. Counting reviews in that result gives 600, twenty times the truth.
    - question:
        id: work-orphans
        type: choice
        system: s2
        prompt: |
          A report joins orders to customers with an inner join and totals the amounts. Finance says the total is below the sum of all orders. What is the likeliest cause?
        options:
          - "Some orders name customers that no longer exist, so the inner join drops them; a left join from orders, or a constraint preventing such orders, would keep the totals right."
          - "Inner joins round amounts down."
          - "Customers with several orders are counted once."
          - "The join counts some orders twice."
        answer: 0
        explanation: |
          An inner join keeps only matched pairs. An order whose customer row was deleted, or never existed, matches nothing and disappears from the total. Duplicated rows would raise the total, not lower it. The lasting fix is a foreign key constraint, which stops such orders from existing at all.
  connections:
    - text: |
        600 rows, every item paired with every review. Counting reviews from them gives 600, not 30. The cure is to count each table separately and join the counts, which needs grouping, the subject of [[q0.grouping-and-aggregation]].

        The padded rows of outer joins introduced NULL, which behaves unlike any ordinary value: `= null` is never true, and a NULL amount fails `amount > 500` without being small. [[q0.null-and-three-valued-logic]] gives the full rules. How a database actually finds matching pairs, without forming a product, starts with [[q3.nested-loop-joins]].
