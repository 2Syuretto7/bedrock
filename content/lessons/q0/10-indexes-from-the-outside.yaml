        explanation: |
          `placed >= :day and placed < :next` is a range on the stored values, which the index can search, and it keeps 23:59 on the day and midnight of the next day out. `like` ignores case in SQLite and so cannot use the index; `placed >= :day` alone also takes every later day; and `substr` computes a value for every row, like `date`.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          About how many halving steps narrow the puzzle's 1 crore sorted entries down to one?
        answer: "24"
        tolerance: "1"
        explanation: |
          $2^{23} = 83{,}88{,}608$ is less than 1 crore and $2^{24} = 1{,}67{,}77{,}216$ is more, so 24 halvings suffice: $\log_2 10^7 \approx 23.3$.
    - question:
        id: work-indexes
        type: choice
        system: s2
        prompt: |
          A table receives 5,000 inserts a second and is queried a few times a day, always by `device` and `time`. A colleague proposes an index on each of its 8 columns. What is the better plan?
        options:
          - "One index on (device, time), because every index slows each of the 5,000 inserts a second."
          - "All 8 indexes, because indexes only make queries faster."
          - "No index, because queries are rare."
          - "An index on time only, because time always increases."
        answer: 0
        explanation: |
          Each index adds work to every insert, so 8 indexes multiply the write cost for queries that need only one. A single composite index serves the actual query; no index at all would make each of those few queries scan the whole, fast-growing table.
  connections:
    - text: |
        About 24. Since $2^{24}$ is about 1.7 crore, two dozen halvings narrow 1 crore sorted entries to one, against 1 crore rows for a scan. That ratio is why every serious database is built around indexes, and why a missing index is the commonest reason a query that was fast on test data becomes slow in production.

        This cluster has treated the database as a black box that keeps tables, answers queries and keeps promises. The next question is what the tables should be in the first place: which things an application talks about, how they relate, and how to turn that into tables whose keys and constraints say the right things, which is where [[q1.entities-and-relationships]] begins. The index itself, a B-tree kept balanced on disk, is opened up in [[q2.b-trees]], and the planner that chooses between scanning and searching in [[q3.from-sql-to-a-plan]]. Input checked at the edge of an application, before it reaches any of this, is [[r2.validating-input]].
