        explanation: |
          A `with` chain keeps one query, and so one consistent answer, while giving every intermediate result a name and making it testable by selecting from it directly. The database can still optimise the whole.
  connections:
    - text: |
        Five orders: 2, 5, 7, 8 and 9. Comparing with the chain-wide average would have found only four, missing HSR's ₹410 order, which is unusually large for a small store. The correlated subquery, or equally a CTE of store averages joined back to the orders, puts each row next to a summary of its own group.

        Putting each row beside a summary of its group is so common that SQL has a dedicated tool for it, which avoids both the subquery and the join: [[q0.window-functions]] computes running totals, ranks and averages over a row's group without collapsing the rows. How a database turns nested queries into a plan, often by removing the nesting, is part of [[q3.from-sql-to-a-plan]].
