        explanation: |
          The recursive CTE supplies all 30 days, the left join keeps days with no orders, and `count(o.id)` counts only real orders, giving 0 for a padded row. An inner join loses the empty days; `count(*)` counts the padded row, so an empty day shows 1; and stopping the recursion at '2026-11-29' produces only 29 days.
