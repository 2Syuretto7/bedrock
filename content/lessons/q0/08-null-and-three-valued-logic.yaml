          - |
            import sqlite3

            query = """
                select id
                from orders
                where coalesce(delivered, promised) > promised
                order by id
            """

            db = sqlite3.connect(":memory:")
            db.executescript("""
                create table orders (id integer primary key, promised text, delivered text);
                insert into orders values
                    (1, '19:30', '19:25'), (2, '19:40', '19:55'), (3, '19:45', null),
                    (4, '20:00', '20:00'), (5, '20:10', null), (6, '20:15', '20:40');
            """)
            print(db.execute(query).fetchall())
        explanation: |
          For an order on its way, `delivered > promised` is unknown, so the undelivered orders need their own `delivered is null`. Negating the condition, `not (delivered <= promised)`, does not help, because not unknown is still unknown; and `coalesce(delivered, promised)` pretends every undelivered order arrived exactly on time.
