        None. The subquery's result contains NULL, for Asha and Esha, whom nobody referred, so `id not in (…)` contains a comparison with NULL for every customer and is never true. Chitra, Esha and Farhan, the intended answer, come back once the NULLs are filtered out of the subquery or the query is written with `not exists`.

        Three-valued logic is the price of letting values be missing, and it is paid in every query that touches a column allowing NULL. The cheapest place to pay is at the door: a `not null` constraint stops a missing value from being stored at all, and other constraints stop duplicates and dangling references. Those rules, and the transactions that keep several changes together, are [[q0.writes-constraints-and-transactions]]. Checking data before it reaches a database, so that missing and malformed values are caught at the edge of a system, returns in [[r2.validating-input]].
