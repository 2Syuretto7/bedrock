    - question:
        id: work-design
        type: choice
        system: s2
        prompt: |
          An orders table needs a `discount` column. Most orders have no discount. How should "no discount" be stored?
        options:
          - "As 0, with the column declared not null, because no discount is a known amount."
          - "As NULL, because nothing was given."
          - "As an empty string."
          - "As -1, to stand out."
        answer: 0
        explanation: |
          "No discount" is a known fact with a natural value, so 0 keeps sums and averages right without `coalesce` everywhere. NULL should mean that something is genuinely missing or unknown; an empty string and a magic -1 break arithmetic in other ways.
