concept: s0.expressions
minutes: 80
claim: You can evaluate any arithmetic expression the way Python does, choose correctly between the three kinds of division, and explain why decimal arithmetic on a computer is very slightly inexact.
recalls: [s0.values-types-and-variables]
uses: [s0.what-a-program-is, f0.the-four-operations-and-order-of-operations, f0.fractions-decimals-and-percentages, f0.negative-numbers, f0.powers-and-roots, f0.whole-numbers-and-place-value]
leads: [s0.strings, f1.exponents-and-exponential-growth]
starter: |
  # Scratch space. Try the three kinds of division.
  print(7 / 2)
  print(7 // 2)
  print(7 % 2)
parts:
  recall:
    - text: |
        In [[s0.values-types-and-variables]] values got names and types: int, float and str. An assignment works out its right side first and then binds the name. Two quick pulls.
  puzzle:
    - text: |
        An auto-rickshaw meter in your city charges ₹30 for the first 1.5 km and ₹15 for every kilometre after that. You want Python to work out the fare for a 7.5 km ride, and then split it three ways. Before you run these lines, write down what you expect each to show.

        ```python
        print(30 + (7.5 - 1.5) * 15)
        print(120 / 3)
        print(0.1 + 0.2)
        ```

        The fare is ₹120, and Python agrees, nearly: it shows `120.0`, not `120`. Split three ways, each friend pays ₹40, and Python shows `40.0`. A hundred and twenty divided by three is a whole number, so where did the decimal point come from?

        The third line is a meter adding up distance a tenth of a kilometre at a time: one tenth, then two tenths more. It shows

        ```
        0.30000000000000004
        ```

        The machine that never drops a carry has just got one tenth plus two tenths wrong.

        None of these is a fault. All three follow from rules that are simple once seen. **What are the rules by which Python turns a line like the fare into a value?**
  intuition:
    - text: |
        An expression is a small machine built from **operators**, such as `+` and `*`, and the values they act on, called **operands**. Python evaluates it exactly as you would on paper: find the operation that must be done first, replace it by its value, and repeat until one value is left.

        $$2 + 3 \times 4^2 \;\to\; 2 + 3 \times 16 \;\to\; 2 + 48 \;\to\; 50$$

        Everything in this lesson is a detail of that one process: which operation goes first, and what each operator produces.

        Start with the first surprise. In arithmetic, dividing gave rise to fractions: $7 \div 2$ is not a whole number. Python's `/` is that division, the true one, and since its result is often not whole, Python makes a firm promise: **the result of `/` is always a float**, even when it happens to be whole. That is why `120 / 3` is `40.0`, and why the fare showed `120.0`: once a float such as 7.5 is in an expression, the result is a float too, as the rules below say. A rule with no exceptions is easier to rely on than one that depends on the numbers.

        But arithmetic had a second kind of division, the one with a quotient and a remainder: $7 = 3 \times 2 + 1$. Python has an operator for each half of it. `7 // 2` is the quotient, 3. `7 % 2` is the remainder, 1. Neither involves fractions, and for ints both give ints.
  derivation:
    - text: |
        **Three divisions.** Take 4,300 pictures in batches of 32.

        ```python
        print(4300 / 32)
        print(4300 // 32)
        print(4300 % 32)
        ```

        This shows `134.375`, then `134`, then `12`. The first is the exact ratio. The second is the number of full batches. The third is the number of pictures left over. You met exactly these numbers on paper: $4300 = 134 \times 32 + 12$.

        The two operators always fit together this way. For any ints `a` and `b`, with `b` not zero,

        $$a = (a \mathbin{//} b) \times b + (a \mathbin{\%} b).$$

        The operator `//` is called **floor division** and `%` is called **modulo**, or just "mod". Three uses of them come up constantly.

        - **Divisibility.** `n % 2` is 0 exactly when `n` is even. More generally `n % k` is 0 exactly when `k` divides `n`.
        - **Digits.** Because of place value, `n % 10` is the last digit of `n` and `n // 10` is `n` with its last digit removed. For 5837 they are 7 and 583.
        - **Units.** 3725 seconds is `3725 // 60` whole minutes with `3725 % 60` seconds left over.

        Dividing by zero, with any of the three, stops the program with a `ZeroDivisionError`. Python refuses for the same reason arithmetic did: there is no such number.
    - question:
        id: predict-divisions
        type: predict
        system: s2
        prompt: Predict each line.
        code: |
          print(9 / 3)
          print(9 // 2)
          print(9 % 2)
          print(20 % 5)
        output: |
          3.0
          4
          1
          0
        explanation: |
          `/` always gives a float, so `3.0`. Then $9 = 4 \times 2 + 1$ gives quotient 4 and remainder 1. Five divides 20 exactly, so the remainder is 0.
    - text: |
        **Powers.** The operator for a power is `**`. So `2 ** 10` is 1024 and `10 ** -2` is 0.01. A negative exponent gives a float, since the result is a fraction.

        **The order of operations, in full.** Python's order is the one from arithmetic, with the new operators slotted in:

        | Rank | Operators | Direction |
        | --- | --- | --- |
        | 1 (first) | brackets `( )` | innermost first |
        | 2 | `**` | right to left |
        | 3 | a minus sign in front, as in `-x` | |
        | 4 | `*`  `/`  `//`  `%` | left to right |
        | 5 (last) | `+`  `-` | left to right |

        Two rows deserve a second look. Powers rank above the minus sign in front, so `-3 ** 2` is $-9$, the same trap you met on paper. And a tower of powers is read from the right: `2 ** 3 ** 2` is `2 ** 9`, which is 512, not `8 ** 2`.

        When in any doubt, add brackets. They cost nothing and they tell the next reader what you meant.

        **Int or float?** `+`, `-`, `*`, `//`, `%` and `**` give an int when both operands are ints, and a float when either is a float. `/` always gives a float.

        **The second surprise.** In the lesson on decimals you saw that $\frac{1}{3}$ cannot be written exactly with a fixed number of decimal places: 0.3333 is close, and never equal. The trouble was that 3 is not built from 2s and 5s, the factors of ten.

        A computer does not store numbers in tens. It stores them in **twos**, because a switch has two states. Its places after the point are halves, quarters, eighths and so on. In that system, the only fractions that can be written exactly are those whose bottoms are built from 2s alone. One tenth has a 5 in its bottom. So one tenth is, to a computer, what one third is to us: a number that would need places without end.

        A float has a fixed number of places, about sixteen significant decimal digits' worth. So Python stores the nearest number it can to 0.1, and the nearest it can to 0.2. Each is off by a hair, and when they are added the hairs add up and become just visible:

        ```
        0.30000000000000004
        ```

        The error is in the seventeenth significant figure. For almost every purpose it is nothing. But it has two consequences you must carry from now on.

        1. **Never expect float arithmetic to be exact.** Numbers like 0.5 and 0.25, built from halves, are stored exactly. Most others are not.
        2. **Round for display.** `round(x, 2)` gives `x` rounded to 2 decimal places, so `round(0.1 + 0.2, 2)` is 0.3.

        Two more tools. `abs(x)` is the absolute value of `x`, its distance from zero: `abs(-0.06)` is 0.06. And very large or small floats can be typed in scientific notation: `3e-3` means $3 \times 10^{-3}$, which is 0.003, and `6e4` is 60000.0.

        Square roots need no new operator. A root is a power with a fractional exponent, so `16 ** 0.5` is 4.0. Why that is so belongs to [[f1.exponents-and-exponential-growth]]. For now, take it as a fact you can check by squaring.
    - question:
        id: fix-floor
        type: code
        mode: find-bug
        system: s2
        prompt: |
          This program should store the number of **full** batches in `full` and the number of pictures left over in `left`. The value of `full` is wrong: it is not a whole number, and there is no such thing as 0.375 of a batch. Fix that one line.
        starter: |
          pictures = 4300
          batch = 32
          full = pictures / batch
          left = pictures % batch
          print(full, left)
        solution: |
          pictures = 4300
          batch = 32
          full = pictures // batch
          left = pictures % batch
          print(full, left)
        tests: |
          assert pictures == 4300 and batch == 32, "Keep pictures as 4300 and batch as 32"
          assert type(full) == int, "full should be a whole number of batches. Which division gives the quotient?"
          assert full * batch + left == pictures, "Full batches times batch size, plus the left-over pictures, should give back all the pictures"
          assert left == 12, "left should be the remainder"
          again = rerun(pictures=64)
          assert again["full"] == 2 and again["left"] == 0, "The program should work for any number of pictures"
        wrong:
          - "pictures = 4300\nbatch = 32\nfull = int(pictures / batch) + 1\nleft = pictures % batch\nprint(full, left)\n"
          - "pictures = 4300\nbatch = 32\nfull = pictures % batch\nleft = pictures % batch\nprint(full, left)\n"
        explanation: "`/` is true division and gives the float 134.375. Floor division `//` gives the quotient, 134, which together with the remainder 12 accounts for every picture."
  formal:
    - text: |
        An **expression** is a value, a name, or operators applied to smaller expressions. Python evaluates it by repeatedly evaluating the highest-ranked remaining operation.

        **Arithmetic operators**, for numbers `a` and `b`:

        | Operator | Meaning | Type of result |
        | --- | --- | --- |
        | `a + b`, `a - b`, `a * b` | sum, difference, product | int if both are ints, otherwise float |
        | `a / b` | true division | always float |
        | `a // b` | floor division: the largest whole number not above $a \div b$ | int if both are ints |
        | `a % b` | remainder, satisfying `a == (a // b) * b + a % b` | int if both are ints |
        | `a ** b` | `a` to the power `b` | int if both are ints and `b` is not negative |
        | `-a` | the opposite of `a` | same as `a` |

        For a positive divisor `b`, the remainder `a % b` always lies from 0 up to but not including `b`, even when `a` is negative. So `-7 // 2` is $-4$ and `-7 % 2` is 1, because $-7 = (-4) \times 2 + 1$. This matches the definition of quotient and remainder from arithmetic exactly.

        Division by zero raises a **ZeroDivisionError**.

        **Precedence**, highest first: brackets; `**` (right to left); unary minus; `*`, `/`, `//`, `%` (left to right); `+`, `-` (left to right).

        A **float** stores a number in a fixed number of binary places. Most decimal fractions are stored as the nearest representable value, so float results carry errors around the sixteenth significant figure.

        `round(x, n)` rounds `x` to `n` decimal places. `round(x)` rounds to a whole number and gives an int. `abs(x)` is the absolute value.
  drill:
    - text: Seconds each.
    - question:
        id: predict-power
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(2 ** 10)
        output: "1024"
        explanation: Ten twos multiplied together. One of the powers worth knowing by sight.
    - question:
        id: predict-mod
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(17 % 5)
        output: "2"
        explanation: "$17 = 3 \\times 5 + 2$."
    - question:
        id: predict-floor
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(10 // 4)
        output: "2"
        explanation: Two fours fit in ten. The remainder is thrown away.
    - question:
        id: predict-true-division
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(8 / 4)
        output: "2.0"
        explanation: True division always gives a float.
    - question:
        id: predict-trap
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(-3 ** 2)
        output: "-9"
        explanation: The power ranks above the minus sign in front.
    - question:
        id: predict-precedence
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(2 + 3 * 4 ** 2)
        output: "50"
        explanation: Power, then multiplication, then addition.
    - question:
        id: predict-round
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(round(3.14159, 2))
        output: "3.14"
        explanation: Rounded to two decimal places. The third decimal is 1, so it rounds down.
  work:
    - text: Slower now. Estimate, then run, then compare.
    - question:
        id: write-digits
        type: code
        mode: write
        system: s2
        prompt: |
          The starter binds `n` to 5837. Using place value and the two whole-number division operators, create `last` holding the last digit of `n`, and `rest` holding `n` with its last digit removed. Your lines must work for any whole number `n`, not only this one.
        starter: |
          n = 5837
        solution: |
          n = 5837
          last = n % 10
          rest = n // 10
        tests: |
          assert "last" in dir() and "rest" in dir(), "Create both last and rest"
          assert type(last) == int and type(rest) == int, "Both should be whole numbers. Avoid the single slash."
          assert rest * 10 + last == n, "rest times ten plus last should rebuild n"
          assert 0 <= last <= 9, "last should be a single digit"
          again = rerun(n=90)
          assert again["last"] == 0 and again["rest"] == 9, "Your lines should work for any whole number, not only 5837. Compute last and rest from n."
        wrong:
          - "n = 5837\nlast = n // 10\nrest = n % 10\n"
          - "n = 5837\nlast = n % 10\nrest = n / 10\n"
        explanation: Dividing by ten splits a number at its ones place. The remainder is the ones digit and the quotient is everything to its left.
    - question:
        id: write-accuracy
        type: code
        mode: write
        system: s2
        prompt: |
          A program labels 47 of 50 test pictures correctly. The starter binds `right` and `total`. Create `accuracy`, the percentage correct, computed from the two variables, and show it.
        starter: |
          right = 47
          total = 50
        solution: |
          right = 47
          total = 50
          accuracy = right / total * 100
          print(accuracy)
        tests: |
          assert "accuracy" in dir(), "Create a variable called accuracy"
          assert abs(accuracy - right / total * 100) < 0.000001, "accuracy should be the fraction right, turned into a percentage. Estimate first: nearly all were right."
          assert output.strip() != "", "Show the accuracy"
          assert abs(float(output.strip()) - 94) < 0.000001, "The value shown should be the accuracy"
        wrong:
          - "right = 47\ntotal = 50\naccuracy = right // total * 100\nprint(accuracy)\n"
          - "right = 47\ntotal = 50\naccuracy = right / total\nprint(accuracy)\n"
          - "right = 47\ntotal = 50\naccuracy = total / right * 100\nprint(accuracy)\n"
        explanation: "`right / total` is the fraction 0.94, and multiplying by 100 turns it into a percentage, 94.0. Floor division would give 0, because 50 does not fit into 47 even once."
    - question:
        id: write-time
        type: code
        mode: write
        system: s2
        prompt: |
          A training run takes 3725 seconds. Create `minutes`, the number of whole minutes in that time, and `left`, the seconds left over. Then show both on one line, minutes first.
        starter: |
          seconds = 3725
        solution: |
          seconds = 3725
          minutes = seconds // 60
          left = seconds % 60
          print(minutes, left)
        tests: |
          assert "minutes" in dir() and "left" in dir(), "Create both minutes and left"
          assert type(minutes) == int, "minutes should be a whole number"
          assert minutes * 60 + left == seconds, "minutes times sixty plus left should give back all the seconds"
          assert 0 <= left < 60, "left should be less than a full minute"
          assert output.split() == [str(minutes), str(left)], "Show minutes and then left on one line"
          again = rerun(seconds=59)
          assert again["minutes"] == 0 and again["left"] == 59, "Compute minutes and left from seconds, so the program works for any length of time"
        wrong:
          - "seconds = 3725\nminutes = seconds / 60\nleft = seconds % 60\nprint(minutes, left)\n"
          - "seconds = 3725\nminutes = seconds // 60\nleft = seconds // 60\nprint(minutes, left)\n"
        explanation: It is quotient and remainder again, with 60 as the divisor. 62 minutes and 5 seconds.
    - question:
        id: fix-mean
        type: code
        mode: find-bug
        system: s2
        prompt: |
          This should store in `middle` the number halfway between `low` and `high`, which is their sum divided by 2. For 10 and 20 that is 15, but the program gives 20. Fix the expression.
        starter: |
          low = 10
          high = 20
          middle = low + high / 2
          print(middle)
        solution: |
          low = 10
          high = 20
          middle = (low + high) / 2
          print(middle)
        tests: |
          assert low == 10 and high == 20, "Keep low as 10 and high as 20"
          assert middle == 15, "middle should be halfway between low and high. Which operation is Python doing first?"
        wrong:
          - "low = 10\nhigh = 20\nmiddle = low + (high / 2)\nprint(middle)\n"
          - "low = 10\nhigh = 20\nmiddle = low / 2 + high\nprint(middle)\n"
        explanation: Division ranks above addition, so only `high` was being halved. Brackets make the sum happen first.
    - question:
        id: evaluation-order
        type: order
        system: s2
        prompt: "Put the steps in the order Python carries them out when evaluating `2 + 3 * 4 ** 2 // 5`."
        steps:
          - "`4 ** 2` becomes 16."
          - "`3 * 16` becomes 48."
          - "`48 // 5` becomes 9."
          - "`2 + 9` becomes 11."
        explanation: The power ranks highest. Multiplication and floor division share a rank and run left to right, so the multiplication goes first. Addition is last.
    - question:
        id: why-inexact
        type: choice
        system: s2
        prompt: "Why does `0.1 + 0.2` show `0.30000000000000004` in Python?"
        options:
          - "Because Python's addition has a bug."
          - "Because a float stores numbers in binary places, where one tenth cannot be written exactly, just as one third cannot be written exactly in decimal places. The stored values are very slightly off."
          - "Because floats are rounded to one decimal place before adding."
          - "Because 0.1 and 0.2 are strings."
        answer: 1
        explanation: Only fractions whose bottoms are built from 2s terminate in binary. Ten has a factor of 5, so tenths are stored as the nearest available value, and the tiny errors surface in the last digits.
  connections:
    - text: |
        You can now read any arithmetic expression as Python reads it, and you know what each operator produces. Both surprises in the puzzle turned out to be rules: `/` always gives a float, and floats live in binary places where tenths do not fit exactly.

        Quotient and remainder, which looked like a schoolroom leftover in arithmetic, are everywhere in programs. Splitting data into batches, deciding what to do every hundredth step, wrapping around the end of a list: all are `//` and `%`.

        The float lesson is one you will meet again at much larger scale. Machine learning is float arithmetic repeated billions of times, and choosing how many places to keep is a real engineering decision with its own later lessons.

        So far every interesting value has been a number. But programs also read, build and report text, and text has operations of its own. That is next, in [[s0.strings]].
