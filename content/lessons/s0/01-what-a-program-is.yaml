concept: s0.what-a-program-is
minutes: 60
claim: You can say what a program is, predict what a short sequence of print statements will show, and write one that makes Python do arithmetic for you.
recalls: [f0.estimation-and-back-of-the-envelope-reasoning]
uses: [f0.the-four-operations-and-order-of-operations, f0.negative-numbers, f0.fractions-decimals-and-percentages]
leads: [s0.values-types-and-variables]
bridges:
  f0.estimation-and-back-of-the-envelope-reasoning: |
    The arithmetic cluster ended with estimation: a quick sense of an answer's size, and three checks on any result, its sign, its size and its sense. A program does the exact arithmetic for you, far faster than you could, but it does precisely what you typed, which is not always what you meant. So the work divides. The machine calculates and you supervise. Before you press Run, estimate what should appear. If the output disagrees with your estimate, one of the two is wrong, and finding out which is how you will catch your first bugs.
starter: |
  # This is your scratch space. Change anything and press Run.
  print("Hello")
  print(2 + 3 * 4)
parts:
  recall:
    - text: |
        The last lesson, [[f0.estimation-and-back-of-the-envelope-reasoning]], ended with three checks to run on any answer: sign, size and sense. From today a machine will do your arithmetic, and those checks become your way of knowing whether to believe it. Two quick pulls first.
  puzzle:
    - text: |
        Here is how a great many households make chai, written down the way a grandmother would tell it:

        ```
        Boil a cup of water.
        Add a spoon of tea and some ginger.
        Add milk and sugar to taste.
        Let it boil till it looks right, then strain it.
        ```

        A person who has drunk chai can follow this without a second thought. Now hand it to a machine that does exactly what it is told and knows nothing about tea. It gets stuck on almost every line. How big a cup? A level spoon or a heaped one? How much is "some" ginger, and is it grated or crushed? "To taste" is no use to something that cannot taste. "Till it looks right" is no use to something that has never seen chai. And the recipe never says to turn the stove off.

        That is the whole difficulty of programming in one cup. You can already do every calculation in the arithmetic lessons by hand, and you can also do them wrong by hand: somewhere around the fortieth multiplication of the day, attention slips and a carry is dropped. A computer never tires and never drops a carry. It will multiply a million pairs of numbers in the time it takes you to blink, and get every one right. It is also, in a precise sense, the most stupid thing you will ever work with. It has no idea what you want. It cannot guess. If you tell it to do something slightly different from what you meant, it will do exactly that, a million times, without complaint.

        So the difficulty is not in the calculating. It is in the **telling**. How do you give instructions to something that is perfectly obedient and has no understanding at all, so that it never has to guess the way the chai recipe makes it guess?
  intuition:
    - text: |
        Go back to the chai recipe and imagine handing it to a cook who follows every line to the letter and knows nothing about food. "Sugar to taste" is no good, because how much? "Till it looks right" is no good, because what is right? Every step must be exact, and the steps must be in the right order, because the cook will carry them out from the top of the page to the bottom, one at a time, and never look ahead.

        A **program** is such a recipe: a list of exact instructions, carried out one after another, from top to bottom. Each instruction is called a **statement**. The language the instructions are written in has to be one the machine can read without guessing, and the one you will use throughout this course is called **Python**.

        Here is a complete program. It is on the right of your screen already.

        ```python
        print("Hello")
        print(2 + 3 * 4)
        ```

        Press **Run**. Two lines appear in the output:

        ```
        Hello
        14
        ```

        Each line of the program is one statement. Python carried out the first, then the second, in that order. The instruction used both times is `print`, which means "show this on the screen". It has nothing to do with paper.

        Look hard at the second line of output. The program did not show `2 + 3 * 4`. It showed 14. Python **worked the arithmetic out** and then showed the result. And it got 14, not 20: it did the multiplication before the addition, exactly as the order of operations demands. In Python the multiplication sign is `*`, because the keyboard has no $\times$.

        Now look at the first line. `"Hello"` is in quotation marks, and Python showed it exactly as written, without the marks. Quotation marks tell Python: this is **text**, do not try to work it out, just take it as it is.
  derivation:
    - text: |
        Let us be exact about the three things you have just seen.

        **Statements run in order.** Python starts at the top line, carries it out completely, then moves to the next. Nothing lower down can affect a line above it, because by the time the lower line runs, the upper one is finished. Swap the two lines of the program and the output swaps too.

        **`print` shows a value.** The general shape is the word `print`, an opening bracket, the thing to show, and a closing bracket. The brackets are required. Each `print` ends by moving to a new line, so two prints give two lines. You can give `print` several things separated by commas, and it shows them on one line with a space between:

        ```python
        print("Total:", 3 + 4)
        ```

        This shows `Total: 7`.

        **Numbers are calculated and text is not.** There are two kinds of thing in that last program. `3 + 4` is arithmetic on numbers, and Python replaces it by its value, 7. `"Total:"` is text, called a **string** because it is a string of characters, and Python leaves it alone. The quotation marks are the only thing that tells the two apart. Compare:

        ```python
        print(3 + 4)
        print("3 + 4")
        ```

        The first line shows `7`. The second shows `3 + 4`, because inside quotation marks those five characters are just characters. This is the single most common surprise for beginners, so make sure you could have predicted both lines.
    - question:
        id: predict-quotes
        type: predict
        system: s2
        prompt: Predict exactly what this program shows. Then check yourself by running it in the scratch space.
        code: |
          print("6 * 7")
          print(6 * 7)
          print("Six sevens are", 6 * 7)
        output: |
          6 * 7
          42
          Six sevens are 42
        explanation: The first line is text and is shown as written. The second is arithmetic and is worked out. The third shows a piece of text and then a calculated number, with a space between them.
    - text: |
        **The arithmetic you already know.** For whole numbers and decimals, Python uses `+` to add, `-` to subtract and `*` to multiply, and it follows the order of operations exactly as you learned it: brackets first, then multiplication, then addition and subtraction from left to right.

        ```python
        print(100 - 4 * (7 + 8))
        print(-3 + 5)
        print(0.5 * 0.5)
        ```

        This shows 40, then 2, then 0.25. Negative numbers and decimals work as they did on paper. (Division and powers have some surprises of their own and are kept for the lesson on expressions.)

        **Python reads exactly what you wrote.** Here is the price of obedience. Leave out one closing bracket:

        ```
        print("Hello"
        ```

        Python does not guess that you meant to close it. It stops and reports a `SyntaxError`, which means "this is not a correctly formed statement". **Syntax** is the grammar of the language: where brackets, quotation marks and commas must go. A person would read past a missing bracket. Python will not, and that strictness is useful. A machine that guessed what you meant would sometimes guess wrong, silently. An error message is the machine telling you, as early as possible, that it did not understand.

        When you see an error, do not flinch. Read its last line. It names the kind of error and usually the line where Python gave up. You will have a whole lesson on reading errors at the end of this cluster. For now it is enough to know that they are information, not punishment.

        **Notes for humans.** Anything on a line after a `#` sign is ignored by Python. It is called a **comment** and is there for people reading the program:

        ```python
        # Pixels in a 28 by 28 picture
        print(28 * 28)
        ```

        **Believing the machine.** Python's arithmetic is reliable. Your typing is not. If you meant `28 * 28` and typed `28 * 82`, Python will faithfully show 2296, and nothing will warn you. This is where the last lesson earns its keep. Before you press Run, estimate: about $30 \times 30 = 900$. When 2296 appears, the size check fails, and you look for the slip. Make this a habit now. **Estimate, then run, then compare.**
    - question:
        id: fix-quotes
        type: code
        mode: find-bug
        system: s2
        prompt: |
          This program is meant to show the number of pixels in a picture with 28 rows and 28 columns. It runs without any error, but it does not show a number. Find the bug and fix it.
        starter: |
          # Pixels in a 28 by 28 picture
          print("28 * 28")
        solution: |
          # Pixels in a 28 by 28 picture
          print(28 * 28)
        tests: |
          assert output.strip() != "28 * 28", "It still shows the text 28 * 28 instead of working it out"
          assert output.strip() == str(28 * 28), "It should show one number: the product of 28 and 28"
        wrong:
          - "print(\"784 pixels\")\n"
          - "print(28 + 28)\n"
        explanation: The quotation marks turned the arithmetic into text. Without them Python works out the product and shows 784, which passes the size check against an estimate of 900.
  formal:
    - text: |
        A **program** is a sequence of statements. Python **executes** them one at a time, in the order written, from the first line to the last. Executing a program is also called **running** it.

        A **value** is a piece of data. So far there are two kinds: numbers, written as digits with an optional sign and decimal point, such as `42`, `-3` and `0.25`; and **strings**, written as any characters between a pair of quotation marks, such as `"Hello"`. Double quotes and single quotes both work, as long as the pair matches.

        An **expression** is something Python can work out to a single value. `2 + 3 * 4` is an expression with the value 14. A number or a string on its own is also an expression, and its value is itself. Working an expression out is called **evaluating** it.

        The statement `print(` *expressions separated by commas* `)` evaluates each expression, shows the values on one line separated by single spaces, and then starts a new line.

        `+`, `-` and `*` are the **operators** for addition, subtraction and multiplication. Brackets and the usual order of operations apply.

        Text from a `#` to the end of the line is a **comment** and is not executed.

        If a statement breaks the grammar of the language, Python reports a **SyntaxError** and runs none of the program.
  drill:
    - text: Seconds each. Predict before you run anything.
    - question:
        id: predict-order
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(10 - 2 * 3)
        output: "4"
        explanation: Multiplication first, then the subtraction.
    - question:
        id: predict-two-lines
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print("b")
          print("a")
        output: |
          b
          a
        explanation: Statements run from top to bottom. Python does not sort anything.
    - question:
        id: which-is-string
        type: choice
        system: s1
        prompt: Which of these is a string?
        options: ["`42`", "`\"42\"`", "`4 + 2`", "`-4.2`"]
        answer: 1
        explanation: Quotation marks make a string, even when the characters inside are digits.
    - question:
        id: predict-negative
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(3 - 5 * 2)
        output: "-7"
        explanation: "$3 - 10$. Subtracting a larger number takes you below zero."
    - question:
        id: what-comment
        type: choice
        system: s1
        prompt: |
          What does this program show?

          ```python
          # print("one")
          print("two")
          ```
        options: ["`one` and then `two`", "Only `two`", "Only `one`", "Nothing, because of an error"]
        answer: 1
        explanation: The first line is a comment. Python ignores everything after the `#`.
  work:
    - text: Slower now. For each program you write, estimate the answer first, then run it and compare.
    - question:
        id: write-hello
        type: code
        mode: write
        system: s1
        prompt: |
          Write a program that shows exactly this one line:

          ```
          I can program.
          ```
        starter: ""
        solution: |
          print("I can program.")
        tests: |
          assert output.strip() != "", "The program shows nothing yet. Which instruction shows something on the screen?"
          assert output.strip() == "I can program.", "Not quite. Check the capital letter, the spaces and the full stop."
        wrong:
          - "print(\"i can program\")\n"
          - "print(\"I can program\")\n"
        explanation: Text goes between quotation marks, inside the brackets of print. Every character counts, including the full stop.
    - question:
        id: write-batches
        type: code
        mode: write
        system: s2
        prompt: |
          A program studies 60,000 pictures. It goes through them all 3 times, and on each pass it handles them in 600 batches, taking one step per batch. On top of that it takes 25 extra warm-up steps once, at the start.

          Write a program that makes Python work out and show the total number of steps. Let Python do the arithmetic: your program should contain the numbers 3, 600 and 25, not the answer.
        starter: |
          # Total steps: 3 passes of 600 batches, plus 25 warm-up steps
        solution: |
          # Total steps: 3 passes of 600 batches, plus 25 warm-up steps
          print(3 * 600 + 25)
        tests: |
          assert output.strip() != "", "The program shows nothing yet"
          assert output.strip().isdigit(), "Show just one whole number and nothing else"
          assert int(output.strip()) == 3 * 600 + 25, "That is not the total. Estimate first: three passes of 600 is a little under two thousand."
        wrong:
          - "print(3 * (600 + 25))\n"
          - "print(\"3 * 600 + 25\")\n"
          - "print(3 + 600 + 25)\n"
        explanation: "`print(3 * 600 + 25)` shows 1825. Multiplication is done before addition, so no brackets are needed. With brackets around `600 + 25` the warm-up steps would wrongly be counted three times."
    - question:
        id: fix-order
        type: code
        mode: find-bug
        system: s2
        prompt: |
          A test set has 50 pictures. A program gets 3 wrong, so it gets $50 - 3$ right. Each right answer scores 2 points. This program should show the score, but its result is too large. Fix it without changing any of the numbers.
        starter: |
          print(50 - 3 * 2)
        solution: |
          print((50 - 3) * 2)
        tests: |
          assert output.strip() != "44", "It still shows 44. Which operation is Python doing first?"
          assert output.strip() == str((50 - 3) * 2), "The score should be 47 right answers at 2 points each"
        wrong:
          - "print(50 - (3 * 2))\n"
          - "print(50 * 2 - 3)\n"
        explanation: Without brackets the multiplication runs first and only the 3 is doubled. Brackets force the subtraction to happen first, giving 47 right answers and 94 points.
    - question:
        id: order-of-run
        type: order
        system: s2
        prompt: |
          Python is given this program. Put what happens into the order it happens.

          ```python
          print("Steps:", 2 * 5)
          print(1 - 4)
          ```
        steps:
          - "Python evaluates `2 * 5` and gets 10."
          - "Python shows `Steps: 10` and starts a new line."
          - "Python evaluates `1 - 4` and gets -3."
          - "Python shows `-3` and starts a new line."
        explanation: The first statement is finished completely, evaluation and then showing, before the second begins. Within a statement the expression is evaluated before print can show it.
    - question:
        id: why-error
        type: choice
        system: s2
        prompt: |
          A program of ten lines has a missing closing bracket on line 7. What happens when it is run?
        options:
          - "Lines 1 to 6 run and show their output, then Python stops at line 7."
          - "Python reports a SyntaxError and runs none of the ten lines."
          - "Python guesses where the bracket should go and runs all ten lines."
          - "Python skips line 7 and runs the other nine."
        answer: 1
        explanation: Python checks the grammar of the whole program before executing any of it. A syntax error anywhere means nothing runs. Other kinds of error, which you will meet soon, do stop a program partway.
  connections:
    - text: |
        You have written and run programs. The puzzle's answer is that you instruct a machine with exact statements in a strict language, carried out in order, and you check its output with the judgement you built in arithmetic.

        But these programs have a weakness. Each calculates one thing, shows it, and forgets it. There is no way yet to keep a result and use it in a later line. To work out a score and then turn the score into a percentage, you would have to type the whole calculation twice. The next lesson, [[s0.values-types-and-variables]], gives a program a memory.
