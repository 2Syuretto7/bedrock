concept: s0.lists-and-tuples
minutes: 100
claim: You can hold many values in a list, index, slice, change and grow it, loop over it to compute totals and extremes, and explain what happens when two names refer to the same list.
recalls: [s0.functions]
uses: [s0.what-a-program-is, s0.values-types-and-variables, s0.expressions, s0.strings, s0.booleans-and-conditionals, s0.loops, f0.the-four-operations-and-order-of-operations, f0.fractions-decimals-and-percentages, f0.negative-numbers]
leads: [s0.dictionaries-and-sets]
starter: |
  # Scratch space. Change the runs and run again.
  runs = [8, 6, 11, 7, 9, 12, 5, 7, 8, 6, 10, 9, 7, 14, 8, 11, 13, 9, 22, 16]
  total = 0
  for r in runs:
      total += r
  print(total / len(runs))
parts:
  recall:
    - text: |
        In [[s0.functions]] you wrapped a recipe in a name, passed values in through parameters and got one value back through `return`. Today's functions will take a whole collection through a single parameter. Two quick pulls first.
  puzzle:
    - text: |
        A T20 innings is twenty overs. The scorer writes down the runs conceded in each one, and after the match the commentators always ask the same two questions: what was the run rate, and **which was the most expensive over?**

        Here is the start of that program, written with what you have.

        ```python
        over1 = 8
        over2 = 6
        over3 = 11
        over4 = 7
        ```

        Twenty names, one per over. The run rate needs a sum twenty terms long, divided by 20. The most expensive over is worse: a chain of twenty comparisons, each one remembering not only the largest number of runs so far but also **which over** it came from.

        And the number 20 is built into the shape of the program. A rain-shortened match of twelve overs needs a different program. A loop cannot help, because a loop needs a way to say "the next over", and `over1`, `over2`, `over3` are just unrelated names that happen to look alike to a human.

        Last lesson ended with a function that took three numbers. Twenty overs, or a thousand sensor readings, or every UPI payment in a day, are each one thing, not many things. **How can one name hold many values, in order, so that a loop can walk through them?**
  intuition:
    - text: |
        You already own most of the answer. A string holds many characters under one name, in order, and you can pick one out by its position, take its length, and walk through it with `for`. The only trouble is that a string holds nothing but characters.

        A **list** is the same idea with the restriction removed. It is a row of numbered boxes, and each box can hold any value at all.

        ```python
        runs = [8, 6, 11, 7, 9, 12, 5, 7, 8, 6, 10, 9, 7, 14, 8, 11, 13, 9, 22, 16]
        print(len(runs))
        print(runs[0], runs[-1])
        print(runs[:6])
        ```

        Square brackets make the list, with commas between the items. This shows 20, then `8 16`, the first over and the last, then `[8, 6, 11, 7, 9, 12]`, the six overs of the powerplay. Everything you learnt for strings carries over unchanged: positions start at 0, negative positions count from the end, slices stop just before their end, and `len` gives the number of items. Notice the one thing to keep straight: the first over is at **position** 0. Over number $k$ sits at position $k - 1$.

        And a `for` loop walks through the items, one per iteration:

        ```python
        runs = [8, 6, 11, 7, 9, 12, 5, 7, 8, 6, 10, 9, 7, 14, 8, 11, 13, 9, 22, 16]
        total = 0
        for r in runs:
            total += r
        print(total / len(runs))
        ```

        This shows 9.9, the run rate: 198 runs from 20 overs. Look at what is **not** in the program: the number 20. Write twelve numbers between the brackets for the rain-shortened match, and not one other character needs to change. The loop takes as many turns as there are items, and `len` supplies the divisor. The program is now about "the overs", however many there are.

        That is the whole point of a collection. The data can grow while the program stays the same. The most expensive over needs one more idea, positions and items together, which is in the next section.
  derivation:
    - text: |
        **Reading: exactly as for strings.** Indexing and slicing work as before, and a slice of a list is a new list.

        ```python
        temps = [31, 29, 35, 38, 33, 30]
        print(temps[1])
        print(temps[1:4])
        print(temps[:2])
        print(temps[-2:])
        ```

        This shows 29, then `[29, 35, 38]`, then `[31, 29]`, then `[33, 30]`. The slice `[1:4]` starts at position 1 and stops just before position 4, so it has $4 - 1 = 3$ items. Ask for a position that does not exist, such as `temps[6]`, and Python stops with `IndexError: list index out of range`. A list of 6 items has positions 0 to 5.

        **Writing: here lists part company with strings.** A string cannot be changed. A list can. You may put a new value into any box:

        ```python
        temps = [31, 29, 35]
        temps[1] = 30
        print(temps)
        ```

        This shows `[31, 30, 35]`. The list is the same list. One of its boxes now holds a different value. Data that can be changed in place is called **mutable**.

        **Growing.** The method `append` adds one item at the end.

        ```python
        squares = []
        for n in range(1, 6):
            squares.append(n * n)
        print(squares)
        ```

        This shows `[1, 4, 9, 16, 25]`. Look at its shape, because it is the accumulator pattern again. Before the loop, a starting value: the **empty list** `[]`, which is to lists what 0 is to sums. Inside the loop, combine: append. After the loop, the answer. Nearly every list your programs build will be built this way.

        One trap. `append` changes the list and returns `None`. It does not hand back a new list. So `squares = squares.append(4)` destroys your list by rebinding the name to `None`. Write `squares.append(4)` on a line by itself.

        Two lists can also be joined with `+`, which makes a new list and leaves both originals alone: `[1, 2] + [3]` is `[1, 2, 3]`.

        **Asking whether something is there.** The operator `in` tests membership and evaluates to a boolean.

        ```python
        primes = [2, 3, 5, 7, 11]
        print(7 in primes)
        print(9 in primes)
        print(9 not in primes)
        ```

        This shows True, False and True. The same operator works on strings: `"at" in "data"` is True.

        **Built-in summaries.** Some loops are so common that Python supplies them ready-made.

        | Call | Value for `xs = [3, 1, 2]` |
        | --- | --- |
        | `len(xs)` | 3 |
        | `sum(xs)` | 6 |
        | `min(xs)` | 1 |
        | `max(xs)` | 3 |
        | `sorted(xs)` | `[1, 2, 3]` |

        `sorted` returns a **new** list in increasing order and leaves `xs` as it was. With these the mean of any list of numbers is one line: `sum(xs) / len(xs)`.

        You should still be able to write each of them yourself, because the day will come when you need a summary that is not built in. Here is the largest item, found by hand.

        ```python
        def largest(xs):
            best = xs[0]
            for x in xs:
                if x > best:
                    best = x
            return best

        print(largest([31, 29, 35, 38, 33]))
        ```

        It shows 38. The accumulator `best` holds the largest value seen **so far**. It starts as the first item, and each item that beats it takes its place. Why start at `xs[0]` and not at 0? Try the list `[-5, -2, -9]` in your head. Starting at 0, no item would ever beat it, and the function would return 0, a number that is not even in the list. For a sum the right starting value is 0 and for a product it is 1, but for a maximum there is no number that is safely below everything, so the first item must serve.

        Notice too that the function has one parameter and receives the whole list through it. That settles the question the last lesson ended on.
    - question:
        id: predict-build
        type: predict
        system: s2
        prompt: Trace this with a table of `x` and `out` after each iteration. Then give what it shows.
        code: |
          values = [4, -1, 7, -3, 0]
          out = []
          for x in values:
              if x > 0:
                  out.append(x * 2)
          print(out, len(out))
        output: "[8, 14] 2"
        explanation: |
          Only 4 and 7 are greater than 0, so only they are doubled and appended. Zero is not greater than zero. This is the accumulator pattern with a condition: start with an empty list and append only what passes the test.
    - text: |
        **Positions and items together.** `for x in xs` gives you the items but not where they sit. When you need the position, loop over the positions and index:

        ```python
        temps = [31, 29, 35, 38]
        for i in range(len(temps)):
            print(i, temps[i])
        ```

        `range(len(temps))` produces 0, 1, 2 and 3, which are exactly the valid positions. This form is also the one to use when you want to **change** the items, since `temps[i] = ...` needs the position.

        **Two names, one list.** This is the most important idea in the lesson, and it will surprise you. Predict what this shows before reading on.

        ```python
        a = [1, 2, 3]
        b = a
        b.append(4)
        print(a)
        ```

        It shows `[1, 2, 3, 4]`. You appended through `b`, and `a` changed.

        Go back to what assignment means. `b = a` evaluates the right-hand side, which gives a value, and binds the name `b` to that value. The value is the list itself, the row of boxes. It is not copied. So after that line there is **one** list with **two** names. A change made through either name is seen through both, because there is only one thing to change.

        Why did this never happen with numbers or strings? Because they cannot be changed in place. After `x = 5` and `y = x`, the line `y = y + 1` does not alter the 5. It computes a new value, 6, and rebinds `y` to it, leaving `x` on the 5. With immutable values, sharing can never be noticed. With lists it can.

        The distinction to hold on to is between **changing a list** and **rebinding a name**:

        ```python
        a = [1, 2, 3]
        b = a
        b = b + [4]
        print(a)
        ```

        This shows `[1, 2, 3]`. Here `b + [4]` built a new list and `b` was rebound to it. The original, still called `a`, was never touched.

        When you want a separate list with the same items, make a **copy**. A full slice does it: `b = a[:]`.

        **The same thing happens in a call.** Binding a parameter to an argument is an assignment, so a function receives the caller's own list and not a copy.

        ```python
        def add_zero(xs):
            xs.append(0)

        data = [5, 6]
        add_zero(data)
        print(data)
        ```

        This shows `[5, 6, 0]`. The function changed the caller's list. Sometimes that is exactly what is wanted, but it must never be an accident. A function that is asked for an answer should build and **return a new list** and leave its argument alone.

        **Tuples: lists that cannot change.** Write the items with round brackets, or with commas alone, and you get a **tuple**.

        ```python
        point = (3, 4)
        print(point[0], len(point))
        ```

        A tuple can be indexed, sliced, measured and looped over like a list. It cannot be changed: `point[0] = 5` is a `TypeError`, and there is no `append`. Use a tuple for a small, fixed group of values that belong together, such as the two coordinates of a point. Use a list for a collection that may grow or change.

        Tuples bring one great convenience, **unpacking**. A tuple on the right can be taken apart into names on the left:

        ```python
        point = (3, 4)
        x, y = point
        print(x + y)
        ```

        That gives a function a way to return more than one value. It returns a tuple, and the caller unpacks it.

        ```python
        def low_high(xs):
            return min(xs), max(xs)

        low, high = low_high([31, 29, 35])
        print(low, high)
        ```

        This shows `29 35`. And it gives the neatest way to swap two variables: `a, b = b, a`. The right-hand side is evaluated in full first, making a tuple of the two old values, which is then unpacked into the names the other way round.

        **The most expensive over.** Now the puzzle can be finished. The answer is two values that belong together, the over number and the runs, so the function returns a tuple. And since the over number is a position, the loop walks through positions rather than items.

        ```python
        def most_expensive(runs):
            worst = 0
            for i in range(len(runs)):
                if runs[i] > runs[worst]:
                    worst = i
            return worst + 1, runs[worst]

        innings = [8, 6, 11, 7, 9, 12, 5, 7, 8, 6, 10, 9, 7, 14, 8, 11, 13, 9, 22, 16]
        over, conceded = most_expensive(innings)
        print(f"Over {over} went for {conceded} runs")
        ```

        This shows `Over 19 went for 22 runs`. The accumulator `worst` holds the **position** of the most expensive over so far, starting at the first, and the runs are read through it as `runs[worst]`. Two details carry the rule. The test is `>`, not `>=`, so when two overs cost the same the earlier one is kept. And the function returns `worst + 1`, because positions count from 0 and overs from 1.
    - question:
        id: fix-alias
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `with_bonus(marks, bonus)` should **return a new list** in which every mark has been raised by `bonus`, and leave the original list alone. The program should show `[40, 55, 70]` and then `[45, 60, 75]`, but it shows `[45, 60, 75]` twice. Work out how many lists there really are, and fix the function.
        starter: |
          def with_bonus(marks, bonus):
              result = marks
              for i in range(len(result)):
                  result[i] = result[i] + bonus
              return result

          original = [40, 55, 70]
          raised = with_bonus(original, 5)
          print(original)
          print(raised)
        solution: |
          def with_bonus(marks, bonus):
              result = []
              for m in marks:
                  result.append(m + bonus)
              return result

          original = [40, 55, 70]
          raised = with_bonus(original, 5)
          print(original)
          print(raised)
        tests: |
          _given = [40, 55, 70]
          _got = with_bonus(_given, 5)
          assert _got is not None, "The function returns None. It should return the new list."
          assert _got == [45, 60, 75], "with_bonus([40, 55, 70], 5) should return [45, 60, 75]"
          assert _given == [40, 55, 70], "The list passed in was changed. How many lists exist after the line result = marks?"
          assert _got is not _given, "Return a new list, not the one that was passed in"
          assert with_bonus([], 3) == [], "An empty list should give an empty list"
          assert with_bonus([1, 2], -1) == [0, 1], "It should work for any list and any bonus"
        wrong:
          - "def with_bonus(marks, bonus):\n    for i in range(len(marks)):\n        marks[i] = marks[i] + bonus\n    return marks\n\noriginal = [40, 55, 70]\nraised = with_bonus(original, 5)\n"
          - "def with_bonus(marks, bonus):\n    result = marks[:]\n    for i in range(len(result)):\n        result[i] = result[i] + bonus\n\noriginal = [40, 55, 70]\nraised = with_bonus(original, 5)\n"
          - "def with_bonus(marks, bonus):\n    result = []\n    for m in marks:\n        result.append(m)\n    return result\n\noriginal = [40, 55, 70]\nraised = with_bonus(original, 5)\n"
        explanation: "`result = marks` did not copy anything. It gave the caller's list a second name, so every change made through `result` was a change to the original. Starting from an empty list and appending, or starting from the copy `marks[:]`, gives the function a list of its own."
  formal:
    - text: |
        A **list** is a mutable sequence of values, written `[item, item, ...]`. The empty list is `[]`. For a list `xs` of length $n$:

        | Written | Meaning |
        | --- | --- |
        | `xs[i]` | the item at position `i`, where $0 \le i < n$, or $-n \le i < 0$ counting from the end |
        | `xs[a:b]` | a new list of the items at positions `a` up to but not including `b` |
        | `xs[i] = v` | replace the item at position `i` by `v`, in place |
        | `xs.append(v)` | add `v` at the end, in place; evaluates to `None` |
        | `xs + ys` | a new list: the items of `xs` followed by those of `ys` |
        | `v in xs`, `v not in xs` | whether some item equals `v` |
        | `len(xs)`, `sum(xs)`, `min(xs)`, `max(xs)` | the number of items, their total, the least, the greatest |
        | `sorted(xs)` | a new list of the items in increasing order |

        `for x in xs:` executes its block once for each item, in order. Two lists are equal under `==` when they have the same items in the same order.

        A **tuple** is an immutable sequence, written `(item, item, ...)` or with commas alone. It supports indexing, slicing, `len`, `in` and `for`, and nothing that would change it. The **unpacking** assignment `a, b = t` requires `t` to have exactly two items and binds `a` to the first and `b` to the second. It extends to any number of names.

        **Assignment never copies.** After `b = a`, the names `a` and `b` refer to the same object. If the object is mutable, a change made through one name is visible through the other. Binding a parameter to an argument in a call behaves in the same way. `a[:]` evaluates to a new list with the same items.
