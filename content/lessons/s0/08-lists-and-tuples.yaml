  work:
    - text: Slower now. For each function, name the accumulator, its starting value and how it is combined with each item, before you write a line.
    - question:
        id: write-mean
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `mean(xs)` that returns the mean of a list of numbers: their total divided by how many there are. Write the total with a loop of your own, without calling `sum`. You may assume the list is not empty.
        starter: |
          def mean(xs):
              # Replace the next line with your own.
              return 0

          print(mean([72, 85, 90, 64, 88]))
        solution: |
          def mean(xs):
              total = 0
              for x in xs:
                  total += x
              return total / len(xs)

          print(mean([72, 85, 90, 64, 88]))
        tests: |
          assert "sum(" not in source, "Build the total with a loop of your own, without calling sum"
          assert mean([1, 2, 3]) is not None, "The function returns None. Showing a value is not the same as returning it."
          assert mean([72, 85, 90, 64, 88]) == 79.8, "The mean of 72, 85, 90, 64 and 88 is 79.8"
          assert mean([5]) == 5, "The mean of a single number is that number"
          assert mean([-2, 2]) == 0, "The mean of -2 and 2 is 0"
          assert mean([1, 2]) == 1.5, "The mean of 1 and 2 is 1.5. Which kind of division keeps the fraction?"
          _xs = [3, 4, 5]
          mean(_xs)
          assert _xs == [3, 4, 5], "The function should not change the list it is given"
        wrong:
          - "def mean(xs):\n    total = 0\n    for x in xs:\n        total += x\n    return total / 5\n\nprint(mean([72, 85, 90, 64, 88]))\n"
          - "def mean(xs):\n    total = 0\n    for x in xs:\n        total += x\n    return total // len(xs)\n\nprint(mean([72, 85, 90, 64, 88]))\n"
          - "def mean(xs):\n    total = 0\n    for x in xs:\n        total += x\n    print(total / len(xs))\n\nmean([72, 85, 90, 64, 88])\n"
        explanation: The total is an accumulator starting at 0. The divisor is `len(xs)`, never a fixed number, so the same function serves a list of any length.
    - question:
        id: write-smallest
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `smallest(xs)` that returns the least item of a list of numbers, using a loop of your own and without calling `min` or `sorted`. You may assume the list is not empty. Think carefully about the starting value of your accumulator: the list may contain only large numbers, or only negative ones.
        starter: |
          def smallest(xs):
              # Replace the next line with your own.
              return 0

          print(smallest([31, 29, 35, 38]))
        solution: |
          def smallest(xs):
              best = xs[0]
              for x in xs:
                  if x < best:
                      best = x
              return best

          print(smallest([31, 29, 35, 38]))
        tests: |
          assert "min(" not in source and "sorted(" not in source, "Find the least item with a loop of your own, without calling min or sorted"
          assert smallest([31, 29, 35, 38]) is not None, "The function returns None. Does it reach a return?"
          assert smallest([31, 29, 35, 38]) == 29, "The least of 31, 29, 35 and 38 is 29. What did your accumulator start at?"
          assert smallest([-5, -2, -9]) == -9, "The least of -5, -2 and -9 is -9"
          assert smallest([7]) == 7, "A list of one item has that item as its least"
          assert smallest([4, 4, 1]) == 1, "The least item may be the last one"
          assert smallest([1000000, 2000000]) == 1000000, "It should work however large the numbers are"
        wrong:
          - "def smallest(xs):\n    best = 0\n    for x in xs:\n        if x < best:\n            best = x\n    return best\n\nprint(smallest([31, 29, 35, 38]))\n"
          - "def smallest(xs):\n    best = xs[0]\n    for x in xs:\n        if x > best:\n            best = x\n    return best\n\nprint(smallest([31, 29, 35, 38]))\n"
          - "def smallest(xs):\n    best = 100\n    for x in xs:\n        if x < best:\n            best = x\n    return best\n\nprint(smallest([31, 29, 35, 38]))\n"
        explanation: The accumulator holds the least value seen so far. No fixed number is safely above every possible item, so it must start as an item of the list itself.
    - question:
        id: write-most-expensive
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `most_expensive(runs)` that takes the runs conceded in each over of an innings, in order, and returns a tuple of two values: the **over number** of the most expensive over, counting the first over as 1, and the runs conceded in it. If two overs cost the same, return the earlier one. You may assume the list is not empty.
        starter: |
          def most_expensive(runs):
              # Replace the next line with your own.
              return 0, 0

          print(most_expensive([8, 6, 11, 7, 9, 12, 5, 7, 8, 6, 10, 9, 7, 14, 8, 11, 13, 9, 22, 16]))
        solution: |
          def most_expensive(runs):
              worst = 0
              for i in range(len(runs)):
                  if runs[i] > runs[worst]:
                      worst = i
              return worst + 1, runs[worst]

          print(most_expensive([8, 6, 11, 7, 9, 12, 5, 7, 8, 6, 10, 9, 7, 14, 8, 11, 13, 9, 22, 16]))
        tests: |
          _innings = [8, 6, 11, 7, 9, 12, 5, 7, 8, 6, 10, 9, 7, 14, 8, 11, 13, 9, 22, 16]
          assert most_expensive(_innings) is not None, "The function returns None. It should return the over and the runs."
          assert most_expensive(_innings) == (19, 22), "In this innings over 19 went for 22 runs. Are you counting overs from 1?"
          assert most_expensive([4, 9, 9, 2]) == (2, 9), "Overs 2 and 3 both cost 9 runs, so the earlier one, over 2, should be returned"
          assert most_expensive([15, 3, 7]) == (1, 15), "The most expensive over may be the first"
          assert most_expensive([0]) == (1, 0), "An innings of one maiden over has that over as its most expensive"
          _xs = [5, 1, 8]
          most_expensive(_xs)
          assert _xs == [5, 1, 8], "The function should not change the list it is given"
        wrong:
          - "def most_expensive(runs):\n    worst = 0\n    for i in range(len(runs)):\n        if runs[i] > runs[worst]:\n            worst = i\n    return worst, runs[worst]\n"
          - "def most_expensive(runs):\n    worst = 0\n    for i in range(len(runs)):\n        if runs[i] >= runs[worst]:\n            worst = i\n    return worst + 1, runs[worst]\n"
          - "def most_expensive(runs):\n    worst = 0\n    for r in runs:\n        if r > worst:\n            worst = r\n    return worst, worst\n"
          - "def most_expensive(runs):\n    worst = 0\n    for i in range(len(runs)):\n        if runs[i] > runs[worst]:\n            worst = i\n    print(worst + 1, runs[worst])\n"
        explanation: "The accumulator holds the position of the costliest over so far, so the loop must walk through positions with `range(len(runs))`. A strict `>` keeps the earlier of two equal overs, and `worst + 1` turns a position, counted from 0, into an over number, counted from 1."
    - question:
        id: write-above
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `above(xs, threshold)` that returns a **new list** of the items of `xs` that are strictly greater than `threshold`, in their original order. So `above([3, 8, 5, 9], 5)` is `[8, 9]`. The list passed in must not be changed.
        starter: |
          def above(xs, threshold):
              # Replace the next line with your own.
              return []

          print(above([3, 8, 5, 9], 5))
        solution: |
          def above(xs, threshold):
              out = []
              for x in xs:
                  if x > threshold:
                      out.append(x)
              return out

          print(above([3, 8, 5, 9], 5))
        tests: |
          assert above([3, 8, 5, 9], 5) is not None, "The function returns None. Remember what append itself evaluates to."
          assert above([3, 8, 5, 9], 5) == [8, 9], "above([3, 8, 5, 9], 5) should be [8, 9]. Is 5 strictly greater than 5?"
          assert above([1, 2], 10) == [], "When nothing passes, the result is the empty list"
          assert above([], 0) == [], "An empty list gives an empty list"
          assert above([9, 1, 7], 0) == [9, 1, 7], "Keep the original order"
          _xs = [4, 6]
          above(_xs, 5)
          assert _xs == [4, 6], "The list passed in should not be changed"
        wrong:
          - "def above(xs, threshold):\n    out = []\n    for x in xs:\n        if x >= threshold:\n            out.append(x)\n    return out\n\nprint(above([3, 8, 5, 9], 5))\n"
          - "def above(xs, threshold):\n    out = []\n    for x in xs:\n        if x > threshold:\n            out = out.append(x)\n    return out\n\nprint(above([3, 8, 5, 9], 5))\n"
          - "def above(xs, threshold):\n    out = []\n    for x in xs:\n        if x > threshold:\n            out.append(x)\n    return sorted(out)\n\nprint(above([3, 8, 5, 9], 0))\n"
        explanation: Start with an empty list and append each item that passes the test. This filtering loop is one of the most used shapes in data work.
    - question:
        id: write-min-max
        type: code
        mode: write
        system: s2
        prompt: |
          Before numbers are fed to a model they are often rescaled to run from 0 to 1. Write a function `rescale(xs)` that returns a new list in which each item `x` has been replaced by `(x - low) / (high - low)`, where `low` and `high` are the least and greatest items of `xs`. So `rescale([10, 20, 30])` is `[0.0, 0.5, 1.0]`. You may use `min` and `max`, and you may assume the items are not all equal.
        starter: |
          def rescale(xs):
              # Replace the next line with your own.
              return []

          print(rescale([10, 20, 30]))
        solution: |
          def rescale(xs):
              low = min(xs)
              high = max(xs)
              out = []
              for x in xs:
                  out.append((x - low) / (high - low))
              return out

          print(rescale([10, 20, 30]))
        tests: |
          assert rescale([10, 20, 30]) is not None, "The function returns None. It should return the new list."
          assert rescale([10, 20, 30]) == [0.0, 0.5, 1.0], "rescale([10, 20, 30]) should be [0.0, 0.5, 1.0]"
          assert rescale([4, 0, 2]) == [1.0, 0.0, 0.5], "Keep the original order: rescale([4, 0, 2]) should be [1.0, 0.0, 0.5]"
          assert rescale([-1, 1]) == [0.0, 1.0], "It should work for negative numbers"
          _xs = [1, 3]
          rescale(_xs)
          assert _xs == [1, 3], "The list passed in should not be changed"
        wrong:
          - "def rescale(xs):\n    high = max(xs)\n    out = []\n    for x in xs:\n        out.append(x / high)\n    return out\n\nprint(rescale([10, 20, 30]))\n"
          - "def rescale(xs):\n    low = min(xs)\n    high = max(xs)\n    for i in range(len(xs)):\n        xs[i] = (xs[i] - low) / (high - low)\n    return xs\n\nprint(rescale([10, 20, 30]))\n"
          - "def rescale(xs):\n    low = min(xs)\n    high = max(xs)\n    out = []\n    for x in xs:\n        out.append((x - low) / high - low)\n    return out\n\nprint(rescale([10, 20, 30]))\n"
        explanation: Subtracting `low` slides the least item to 0. Dividing by the spread `high - low` then brings the greatest item to 1. The brackets around the spread matter, because division binds more tightly than subtraction.
    - question:
        id: fix-append-rebind
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `evens_up_to(n)` should return the list of even whole numbers from 2 to `n`, both included, so the program should show `[2, 4, 6, 8, 10]`. It stops with an error that mentions `NoneType`. Find out which line turned a list into `None`, and fix it.
        starter: |
          def evens_up_to(n):
              out = []
              for k in range(2, n + 1, 2):
                  out = out.append(k)
              return out

          print(evens_up_to(10))
        solution: |
          def evens_up_to(n):
              out = []
              for k in range(2, n + 1, 2):
                  out.append(k)
              return out

          print(evens_up_to(10))
        tests: |
          assert evens_up_to(10) == [2, 4, 6, 8, 10], "evens_up_to(10) should be [2, 4, 6, 8, 10]"
          assert evens_up_to(2) == [2], "evens_up_to(2) should be [2]"
          assert evens_up_to(1) == [], "There are no even numbers from 2 to 1"
          assert evens_up_to(7) == [2, 4, 6], "It should work for an odd n as well"
        wrong:
          - "def evens_up_to(n):\n    out = []\n    for k in range(2, n, 2):\n        out.append(k)\n    return out\n\nprint(evens_up_to(10))\n"
          - "def evens_up_to(n):\n    out = []\n    for k in range(2, n + 1, 2):\n        out = [k]\n    return out\n\nprint(evens_up_to(10))\n"
        explanation: "`append` changes the list in place and evaluates to `None`. Assigning that back to `out` threw the list away after the first iteration, and the second iteration then tried to call `append` on `None`."
    - question:
        id: alias-or-copy
        type: choice
        system: s2
        prompt: |
          What does this show, and why?

          ```python
          a = [1, 2, 3]
          b = a[:]
          c = a
          c.append(4)
          b.append(5)
          print(len(a), len(b), len(c))
          ```
        options:
          - "3 4 4, because a is never changed directly."
          - "4 4 4, because b is a separate copy while c is a second name for the list called a."
          - "5 5 5, because all three names refer to one list."
          - "4 5 4, because both appends reach b."
        answer: 1
        explanation: "`a[:]` makes a new list, so `b` is independent and ends as `[1, 2, 3, 5]`. `c = a` copies nothing, so appending through `c` lengthens the one list that `a` also names, to `[1, 2, 3, 4]`."
    - question:
        id: mean-after-append
        type: numeric
        system: s2
        prompt: |
          A list holds four marks whose mean is 70. A fifth mark of 90 is appended. What is the mean of the list now?
        answer: "74"
        explanation: "The four marks total $4 \\times 70 = 280$. With the fifth the total is 370, and $370 \\div 5 = 74$. A mean is a total divided by a count, so work through the total."
  connections:
    - text: |
        One name can now stand for any amount of data, and a function can take all of it through a single parameter. The innings became one list, its run rate one line, and its most expensive over a five-line function that works for twenty overs, for twelve, or for a full day's ninety in a Test match. From here on, the size of the data and the size of the program are separate matters.

        Lists of numbers are where machine learning lives. A data set is a list of examples. An example is often a list of measurements. The mean you wrote today is the first statistic anyone computes, and the rescaling function is a real preprocessing step with a real name, min-max scaling. Later you will meet arrays, which are lists specialised for arithmetic on millions of numbers at once, and their indexes and slices will work the way you learnt today on strings and lists.

        The business of two names for one list never goes away. In a training program the model's numbers are shared between many parts of the code on purpose, so that when one part improves them every other part sees the improvement. Knowing whether you hold the thing itself or a copy of it is a question you will ask every working day.

        A list finds its items by position: item 0, item 1, item 2. That is perfect for a row of marks, but awkward for a question such as "what is Meera's mark?", where the natural handle is a name and not a number. You would have to search. The next lesson, [[s0.dictionaries-and-sets]], gives you a collection that is looked up by a key of your own choosing.
