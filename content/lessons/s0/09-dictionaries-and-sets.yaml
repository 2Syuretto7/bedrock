  work:
    - text: Slower now. Before writing, say what the keys are and what the values are. Afterwards, check that the counts add up.
    - question:
        id: write-count-items
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `count_items(xs)` that returns a dictionary from each distinct item of the list `xs` to the number of times it occurs. So `count_items(["cat", "dog", "cat"])` is `{"cat": 2, "dog": 1}`.
        starter: |
          def count_items(xs):
              # Replace the next line with your own.
              return {}

          print(count_items(["cat", "dog", "cat"]))
        solution: |
          def count_items(xs):
              counts = {}
              for x in xs:
                  counts[x] = counts.get(x, 0) + 1
              return counts

          print(count_items(["cat", "dog", "cat"]))
        tests: |
          assert count_items(["cat"]) is not None, "The function returns None. It should return the dictionary."
          assert count_items(["cat", "dog", "cat"]) == {"cat": 2, "dog": 1}, "count_items(['cat', 'dog', 'cat']) should be {'cat': 2, 'dog': 1}"
          assert count_items([]) == {}, "An empty list gives an empty dictionary"
          assert count_items([5, 5, 5]) == {5: 3}, "Three equal items should give one key with the count 3"
          _c = count_items([1, 2, 1, 3, 1, 2])
          assert sum(_c.values()) == 6, "The counts should add up to the number of items"
          assert _c == {1: 3, 2: 2, 3: 1}, "It should work for any list"
        wrong:
          - "def count_items(xs):\n    counts = {}\n    for x in xs:\n        counts[x] = 1\n    return counts\n\nprint(count_items([\"cat\", \"dog\", \"cat\"]))\n"
          - "def count_items(xs):\n    counts = {}\n    for x in xs:\n        counts[x] = counts.get(x, 1) + 1\n    return counts\n\nprint(count_items([\"cat\", \"dog\", \"cat\"]))\n"
          - "def count_items(xs):\n    counts = {}\n    for x in xs:\n        counts[x] = counts.get(x, 0) + 1\n    print(counts)\n\ncount_items([\"cat\", \"dog\", \"cat\"])\n"
        explanation: One counter per distinct item, each starting from the fallback 0 the first time its item is seen. The counts must add up to the length of the list.
    - question:
        id: write-count-votes
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `count_votes(ballots)` that takes a list of `(flat, candidate)` pairs, in the order they came in, and returns a dictionary from each candidate to the number of votes counted for them. Each flat has one vote: only the **first** ballot from a flat counts, and any later ballot from the same flat is ignored. The list passed in must not be changed.
        starter: |
          def count_votes(ballots):
              # Replace the next line with your own.
              return {}

          print(count_votes([("A-101", "Iyer"), ("A-102", "Khan"), ("A-101", "Khan")]))
        solution: |
          def count_votes(ballots):
              seen = set()
              votes = {}
              for flat, choice in ballots:
                  if flat not in seen:
                      seen.add(flat)
                      votes[choice] = votes.get(choice, 0) + 1
              return votes

          print(count_votes([("A-101", "Iyer"), ("A-102", "Khan"), ("A-101", "Khan")]))
        tests: |
          _society = [("A-101", "Iyer"), ("A-102", "Khan"), ("B-201", "Iyer"), ("A-101", "Khan"), ("B-202", "Fernandes"), ("C-301", "Khan"), ("C-302", "Iyer"), ("B-201", "Khan"), ("C-303", "Iyer"), ("C-301", "Khan"), ("A-103", "Fernandes")]
          assert count_votes(_society) is not None, "The function returns None. It should return the dictionary of votes."
          assert count_votes(_society) == {"Iyer": 4, "Khan": 2, "Fernandes": 2}, "In the society's election Iyer should have 4 votes, Khan 2 and Fernandes 2. Are second ballots from a flat being ignored?"
          assert count_votes([]) == {}, "No ballots should give an empty dictionary"
          assert count_votes([("A-1", "X"), ("A-1", "Y")]) == {"X": 1}, "When a flat votes twice, its first ballot counts and the second is ignored"
          assert count_votes([("A-1", "X"), ("B-1", "X"), ("C-1", "X")]) == {"X": 3}, "Three flats voting for the same candidate give that candidate 3 votes"
          _b = [("A-1", "X"), ("A-1", "Y")]
          count_votes(_b)
          assert _b == [("A-1", "X"), ("A-1", "Y")], "The list passed in should not be changed"
        wrong:
          - "def count_votes(ballots):\n    votes = {}\n    for flat, choice in ballots:\n        votes[choice] = votes.get(choice, 0) + 1\n    return votes\n"
          - "def count_votes(ballots):\n    seen = set()\n    votes = {}\n    for flat, choice in ballots:\n        if flat not in seen:\n            votes[choice] = votes.get(choice, 0) + 1\n    return votes\n"
          - "def count_votes(ballots):\n    final = {}\n    for flat, choice in ballots:\n        final[flat] = choice\n    votes = {}\n    for flat, choice in final.items():\n        votes[choice] = votes.get(choice, 0) + 1\n    return votes\n"
          - "def count_votes(ballots):\n    seen = set()\n    votes = {}\n    for flat, choice in ballots:\n        if flat not in seen:\n            seen.add(flat)\n            votes[choice] = 1\n    return votes\n"
        explanation: "The set `seen` answers \"has this flat voted already?\" at once, and the flat is added only at its first ballot. The dictionary is the counting pattern: `votes.get(choice, 0)` is the count so far, or 0 for a candidate with no votes yet. Keeping a dictionary from flat to choice would let a later ballot overwrite an earlier one, which counts the last ballot instead of the first."
    - question:
        id: write-most-common
        type: code
        mode: write
        system: s2
        prompt: |
          A model has predicted a label for each of several examples, and the labels are in a list. Write a function `most_common(labels)` that returns the label that occurs most often. So `most_common(["cat", "dog", "cat"])` is `"cat"`. You may assume the list is not empty and that one label is a clear winner. It takes two steps: count, then find the best.
        starter: |
          def most_common(labels):
              # Replace the next line with your own.
              return ""

          print(most_common(["cat", "dog", "cat"]))
        solution: |
          def most_common(labels):
              counts = {}
              for label in labels:
                  counts[label] = counts.get(label, 0) + 1
              best_label = ""
              best_count = 0
              for label, count in counts.items():
                  if count > best_count:
                      best_label = label
                      best_count = count
              return best_label

          print(most_common(["cat", "dog", "cat"]))
        tests: |
          assert most_common(["cat"]) is not None, "The function returns None. Does it reach a return?"
          assert most_common(["cat", "dog", "cat"]) == "cat", "In ['cat', 'dog', 'cat'] the most common label is cat"
          assert most_common(["a", "b", "b"]) == "b", "The winner may be the label that appears last. Are you returning the label with the greatest count?"
          assert most_common(["x"]) == "x", "A single label is the most common one"
          assert most_common(["b", "a", "c", "a", "c", "c"]) == "c", "It should work for any list"
          assert most_common(["zebra", "ant", "ant"]) == "ant", "Compare counts, not the labels themselves"
          assert most_common([3, 1, 3, 2]) == 3, "The labels may be numbers. Return the label, not its count."
        wrong:
          - "def most_common(labels):\n    counts = {}\n    for label in labels:\n        counts[label] = counts.get(label, 0) + 1\n    return max(counts)\n\nprint(most_common([\"cat\", \"dog\", \"cat\"]))\n"
          - "def most_common(labels):\n    counts = {}\n    for label in labels:\n        counts[label] = counts.get(label, 0) + 1\n    return max(counts.values())\n\nprint(most_common([\"cat\", \"dog\", \"cat\"]))\n"
          - "def most_common(labels):\n    return labels[0]\n\nprint(most_common([\"cat\", \"dog\", \"cat\"]))\n"
        explanation: First the counting pattern builds a dictionary from label to count. Then a "best so far" loop over its pairs carries the winning label along with the winning count. Starting the best count at 0 is safe because every real count is at least 1.
    - question:
        id: write-distinct
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `distinct_in_order(xs)` that returns a new list holding each distinct item of `xs` once, in the order of **first appearance**. So `distinct_in_order([3, 1, 3, 2, 1])` is `[3, 1, 2]`. A set alone would lose the order, and a list alone would have to be searched again and again. Use both: a list for the answer and a set to remember what has been seen.
        starter: |
          def distinct_in_order(xs):
              # Replace the next line with your own.
              return []

          print(distinct_in_order([3, 1, 3, 2, 1]))
        solution: |
          def distinct_in_order(xs):
              seen = set()
              out = []
              for x in xs:
                  if x not in seen:
                      seen.add(x)
                      out.append(x)
              return out

          print(distinct_in_order([3, 1, 3, 2, 1]))
        tests: |
          assert distinct_in_order([1]) is not None, "The function returns None. It should return the new list."
          assert distinct_in_order([3, 1, 3, 2, 1]) == [3, 1, 2], "distinct_in_order([3, 1, 3, 2, 1]) should be [3, 1, 2]. Keep the order of first appearance."
          assert distinct_in_order([]) == [], "An empty list gives an empty list"
          assert distinct_in_order([7, 7, 7]) == [7], "Repeats should appear once"
          assert distinct_in_order(["b", "a", "b"]) == ["b", "a"], "It should work for strings, in order of first appearance and not alphabetical order"
          _xs = [2, 2, 1]
          distinct_in_order(_xs)
          assert _xs == [2, 2, 1], "The list passed in should not be changed"
        wrong:
          - "def distinct_in_order(xs):\n    return sorted(set(xs))\n\nprint(distinct_in_order([3, 1, 3, 2, 1]))\n"
          - "def distinct_in_order(xs):\n    seen = set()\n    out = []\n    for x in xs:\n        if x not in seen:\n            out.append(x)\n    return out\n\nprint(distinct_in_order([3, 1, 3, 2, 1]))\n"
          - "def distinct_in_order(xs):\n    seen = set()\n    out = []\n    for x in xs:\n        if x in seen:\n            out.append(x)\n        seen.add(x)\n    return out\n\nprint(distinct_in_order([3, 1, 3, 2, 1]))\n"
        explanation: The list keeps the order and the set answers "have I met this before?" at once. Each new item goes into both. Each collection is doing the one job it is good at.
    - question:
        id: write-invert
        type: code
        mode: write
        system: s2
        prompt: |
          A model works with numbers, so every word it knows is given a number, in a dictionary such as `{"cat": 0, "dog": 1}`. To turn the model's output back into words, the lookup is needed the other way round. Write a function `invert(d)` that returns a new dictionary in which every value of `d` has become a key and its key has become the value. So `invert({"cat": 0, "dog": 1})` is `{0: "cat", 1: "dog"}`. You may assume no value occurs twice.
        starter: |
          def invert(d):
              # Replace the next line with your own.
              return {}

          print(invert({"cat": 0, "dog": 1}))
        solution: |
          def invert(d):
              out = {}
              for key, value in d.items():
                  out[value] = key
              return out

          print(invert({"cat": 0, "dog": 1}))
        tests: |
          assert invert({"a": 1}) is not None, "The function returns None. It should return the new dictionary."
          assert invert({"cat": 0, "dog": 1}) == {0: "cat", 1: "dog"}, "invert({'cat': 0, 'dog': 1}) should be {0: 'cat', 1: 'dog'}"
          assert invert({}) == {}, "An empty dictionary gives an empty dictionary"
          assert invert({1: 2, 3: 4}) == {2: 1, 4: 3}, "It should work for any keys and values"
          _d = {"x": "y"}
          _i = invert(_d)
          assert _d == {"x": "y"}, "The dictionary passed in should not be changed"
          assert invert(_i) == _d, "Inverting twice should give back the original"
        wrong:
          - "def invert(d):\n    out = {}\n    for key, value in d.items():\n        out[key] = value\n    return out\n\nprint(invert({\"cat\": 0, \"dog\": 1}))\n"
          - "def invert(d):\n    for key, value in d.items():\n        out = {}\n        out[value] = key\n    return out\n\nprint(invert({\"cat\": 0, \"dog\": 1}))\n"
        explanation: Walk through the pairs and store each one the other way round in a new dictionary. A pair of dictionaries like these, word to number and number to word, sits at the entrance and exit of every language model.
    - question:
        id: fix-set-index
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `second_smallest(xs)` should return the second smallest **distinct** value of a list, so for `[4, 1, 1, 3]` it should return 3. The program stops with a `TypeError` instead. Read what the error says about sets, and fix the function. Keep the idea of removing repeats with a set.
        starter: |
          def second_smallest(xs):
              distinct = set(xs)
              return distinct[1]

          print(second_smallest([4, 1, 1, 3]))
        solution: |
          def second_smallest(xs):
              distinct = sorted(set(xs))
              return distinct[1]

          print(second_smallest([4, 1, 1, 3]))
        tests: |
          assert second_smallest([4, 1, 1, 3]) == 3, "For [4, 1, 1, 3] the distinct values are 1, 3 and 4, so the second smallest is 3"
          assert second_smallest([2, 2, 5, 5]) == 5, "Repeats count once: for [2, 2, 5, 5] the answer is 5"
          assert second_smallest([9, 8, 7]) == 8, "The list may arrive in any order"
          assert second_smallest([-1, -5, 0]) == -1, "It should work for negative numbers"
        wrong:
          - "def second_smallest(xs):\n    distinct = sorted(xs)\n    return distinct[1]\n\nprint(second_smallest([4, 1, 1, 3]))\n"
          - "def second_smallest(xs):\n    distinct = sorted(set(xs))\n    return distinct[2]\n\nprint(second_smallest([4, 1, 1, 3]))\n"
          - "def second_smallest(xs):\n    distinct = sorted(set(xs))\n    return distinct[-2]\n\nprint(second_smallest([9, 8, 7, 6]))\n"
        explanation: A set has no positions, so it cannot be indexed. `sorted` turns it into a list in increasing order, and a list can be indexed. Sorting the original list without the set would leave the repeats in.
    - question:
        id: distinct-count
        type: numeric
        system: s2
        prompt: |
          A list holds the remainders `n % 7` for every whole number `n` from 1 to 100. What is `len(set(...))` of that list?
        answer: "7"
        explanation: A remainder on division by 7 can only be 0, 1, 2, 3, 4, 5 or 6, and every one of those occurs among the first hundred numbers. The list has a hundred items but only seven distinct ones.
    - question:
        id: which-collection
        type: choice
        system: s2
        prompt: |
          A program reads ten million words of text, one at a time, and for each word must decide whether it belongs to a fixed vocabulary of fifty thousand words. Which collection should hold the vocabulary, and why?
        options:
          - "A list, because the vocabulary has an order."
          - "A set, because the only question asked is whether a word is present, and a set answers that at once however large it is."
          - "A tuple, because the vocabulary never changes."
          - "A dictionary from position to word, because dictionaries are fast."
        answer: 1
        explanation: Membership in a list or tuple means searching, up to fifty thousand comparisons for each of ten million words. A set goes straight to the answer. A dictionary keyed by position would be fast for the wrong question.
  connections:
    - text: |
        You now have the four collections that almost every Python program is made from, and a rule for choosing among them: let the question you will ask decide. The society election needed two of them at once: a set for "has this flat voted?" and a dictionary for "how many votes has each candidate?". Neither question needed a search, and neither needed the list of candidates in advance.

        The counting pattern is older than computers. It is a tally chart, and the dictionary it produces is the raw material of statistics: divide each count by the total and you have the fraction of the time each outcome occurred, which is the first step towards probability. The check you used, that the counts add up to the number of items, becomes the rule that probabilities add up to 1.

        Dictionaries are how language models meet text. A model cannot read letters. It is given a vocabulary, a dictionary from each word or word-piece to a number, and its output is turned back into text with the inverse dictionary, which you wrote today. Dictionaries also carry the settings of a training run, and the named results it reports.

        The idea underneath, a rule that assigns to each key exactly one value, should sound familiar. It is the mathematical idea of a function again, this time written out as a table instead of computed by a recipe.

        You have met a good many error messages along the way: `NameError`, `TypeError`, `IndexError`, `KeyError`. So far each has been a passing nuisance. They are in fact the most useful thing Python tells you, and reading them is a skill with a method. Finding out why a program is wrong, quickly and without guessing, is the last lesson of this cluster: [[s0.reading-errors-and-debugging]].
