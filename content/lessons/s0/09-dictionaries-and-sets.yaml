concept: s0.dictionaries-and-sets
minutes: 95
claim: You can store and look up values by key in a dictionary, count and group with it, loop over its pairs, and use a set to hold distinct items and test membership.
recalls: [s0.lists-and-tuples]
uses: [s0.what-a-program-is, s0.values-types-and-variables, s0.expressions, s0.strings, s0.booleans-and-conditionals, s0.loops, s0.functions, f0.the-four-operations-and-order-of-operations, f0.fractions-decimals-and-percentages, f0.estimation-and-back-of-the-envelope-reasoning]
leads: [s0.reading-errors-and-debugging]
starter: |
  # Scratch space. Count how often each letter occurs.
  counts = {}
  for letter in "banana":
      counts[letter] = counts.get(letter, 0) + 1
  print(counts)
parts:
  recall:
    - text: |
        In [[s0.lists-and-tuples]] one name held many values, found by position. Today's collection finds its values by a handle you choose. Three quick pulls first, including the one about two names for one list, because it applies to today's collections as well.
  puzzle:
    - text: |
        A housing society is electing its secretary, and each flat has one vote. The committee collected the votes on a form, and some residents filled it in twice, now and then changing their mind in between. The general body agreed a rule beforehand: **the first ballot from each flat counts, and any later one from the same flat is ignored.** Here are the ballots, in the order they came in, as pairs of flat and candidate:

        ```python
        ballots = [
            ("A-101", "Iyer"),
            ("A-102", "Khan"),
            ("B-201", "Iyer"),
            ("A-101", "Khan"),
            ("B-202", "Fernandes"),
            ("C-301", "Khan"),
            ("C-302", "Iyer"),
            ("B-201", "Khan"),
            ("C-303", "Iyer"),
            ("C-301", "Khan"),
            ("A-103", "Fernandes"),
        ]
        ```

        Count every ballot carelessly and Khan wins, with 5 votes to Iyer's 4. The committee suspects that is wrong. Three ballots came from flats that had already voted.

        Counting properly with what you have needs three lists. One holds the flats that have voted so far. Two more hold the tally, names and counts lined up by position:

        ```python
        names = ["Iyer", "Khan", "Fernandes"]
        counts = [0, 0, 0]
        for i in range(len(names)):
            if names[i] == "Khan":
                counts[i] += 1
        ```

        That is five lines to add one vote for one candidate, and it has three weaknesses. It searches: with a lakh of voters, every ballot may mean a walk through a lakh of boxes, both to find the candidate and to check whether the flat is already in the list of voters. The two tally lists are held together by nothing but good behaviour: sort one of them, or append to one and forget the other, and votes silently belong to the wrong person. And the list of candidates must be known before counting begins.

        A list answers the question "what is at position 2?" at once. The questions you actually have are "how many votes does Khan have?" and "has flat B-201 voted already?". **Can a collection be indexed by a name instead of a position, and can a program remember what it has seen without searching for it?**
  intuition:
    - text: |
        Think of a printed dictionary. You do not find a word by knowing that it is the 40,213th entry. You find it by the word itself, and next to it is the meaning. The word is the **key** and the meaning is the **value**.

        Python's **dictionary** is a collection of exactly such pairs.

        ```python
        pincodes = {"Mumbai": 400001, "Chennai": 600001, "Kolkata": 700001, "Delhi": 110001}
        print(pincodes["Chennai"])
        ```

        Curly brackets make the dictionary. Each entry is a key, a colon, and its value. The second line shows 600001, the PIN code of Chennai's head post office. The square brackets are the ones you know from lists, but what goes inside them is now a key of your choosing and not a position.

        Compare this with two lists lined up by position. The question is one expression instead of five lines. The city and its PIN code are stored **together** as a pair, so they cannot drift apart. And the lookup does not search. Python computes from the key where its value is kept and goes straight there, so finding one entry among a million takes about as long as finding one among four. How that trick works is a story for much later. For now, the fact is enough: **lookup by key is immediate**.

        A list is a row of boxes numbered 0, 1, 2 by Python. A dictionary is a set of boxes each **labelled by you**. For the election, the labels will be the candidates' names and the values their votes so far. The flats that have voted need something even simpler, which comes later in the lesson: a collection that only remembers **whether** it has seen something.
  derivation:
    - text: |
        **Adding and changing.** Assigning to a key stores a value under it. If the key is new, the pair is added. If the key is already there, its value is replaced, since a key can appear only once.

        ```python
        marks = {"Asha": 72, "Ravi": 85}
        marks["Meera"] = 90
        marks["Asha"] = 75
        print(marks)
        print(len(marks))
        ```

        This shows `{'Asha': 75, 'Ravi': 85, 'Meera': 90}` and then 3. `len` counts the pairs. Like a list, a dictionary is **mutable**, and everything you learnt about two names for one list holds for it too. The empty dictionary is written `{}`.

        **Asking for a key that is not there.** Run `print(marks["Zoya"])` and Python stops with

        ```
        KeyError: 'Zoya'
        ```

        There are two polite ways to avoid that. The first is to ask before you look. The operator `in`, applied to a dictionary, tests whether a **key** is present:

        ```python
        marks = {"Asha": 72, "Ravi": 85}
        if "Zoya" in marks:
            print(marks["Zoya"])
        else:
            print("no mark recorded")
        ```

        The second is the method `get`, which takes a key and a **fallback** value to use when the key is missing:

        ```python
        marks = {"Asha": 72, "Ravi": 85}
        print(marks.get("Ravi", 0))
        print(marks.get("Zoya", 0))
        ```

        This shows 85 and then 0. `get` never changes the dictionary. It only answers.

        **Counting: the pattern that makes dictionaries indispensable.** How often does each letter occur in a word? You want a tally with one line per letter, and you do not know in advance which letters will turn up. That is a dictionary from letter to count, built with the accumulator pattern.

        ```python
        counts = {}
        for letter in "banana":
            counts[letter] = counts.get(letter, 0) + 1
        print(counts)
        ```

        This shows `{'b': 1, 'a': 3, 'n': 2}`. Trace the one line in the loop. The right-hand side is evaluated first. `counts.get(letter, 0)` is the count so far for this letter, or 0 if the letter has never been seen. Add 1. Then store the result under the letter.

        | Letter | `counts.get(letter, 0)` | `counts` after the line |
        | --- | --- | --- |
        | b | 0 | `{'b': 1}` |
        | a | 0 | `{'b': 1, 'a': 1}` |
        | n | 0 | `{'b': 1, 'a': 1, 'n': 1}` |
        | a | 1 | `{'b': 1, 'a': 2, 'n': 1}` |
        | n | 1 | `{'b': 1, 'a': 2, 'n': 2}` |
        | a | 2 | `{'b': 1, 'a': 3, 'n': 2}` |

        It is the counting accumulator you know, `count += 1`, with one difference: there is a separate counter for every distinct item, created on the day it is first needed. The fallback 0 is the starting value of each of those counters.

        Check the answer the way you check any total. The counts are 1, 3 and 2, which add to 6, and "banana" has 6 letters. A tally whose counts do not add up to the number of items tallied is wrong.
    - question:
        id: predict-count
        type: predict
        system: s2
        prompt: Trace this with a table of `tally` after each iteration. Then give what it shows.
        code: |
          rolls = [3, 6, 3, 1, 3, 6]
          tally = {}
          for r in rolls:
              tally[r] = tally.get(r, 0) + 1
          print(tally[3], tally.get(2, 0), len(tally))
        output: "3 0 3"
        explanation: |
          The value 3 occurs three times. The value 2 never occurs, so it is not a key and `get` falls back to 0. There are three distinct values, 3, 6 and 1, so the dictionary has three pairs.
    - text: |
        **Walking through a dictionary.** A `for` loop over a dictionary visits its **keys**, in the order they were first put in.

        ```python
        marks = {"Asha": 72, "Ravi": 85, "Meera": 90}
        for name in marks:
            print(name, marks[name])
        ```

        More often you want the key and the value together. The method `items` produces the pairs as tuples, and unpacking, from the last lesson, takes each apart in the `for` line itself:

        ```python
        marks = {"Asha": 72, "Ravi": 85, "Meera": 90}
        for name, mark in marks.items():
            print(name, mark)
        ```

        There are also `keys()` and `values()`, which produce the keys alone and the values alone. The built-in summaries accept them, so the mean mark is `sum(marks.values()) / len(marks)`.

        Here is a loop that finds the name with the highest mark. It is the "best so far" accumulator from the last lesson, carrying the key along with the value.

        ```python
        marks = {"Asha": 72, "Ravi": 85, "Meera": 90, "Kabir": 64}
        best_name = ""
        best_mark = -1
        for name, mark in marks.items():
            if mark > best_mark:
                best_name = name
                best_mark = mark
        print(best_name)
        ```

        It shows Meera. Starting `best_mark` at -1 is safe here only because a mark cannot be negative.

        **What may be a key.** A key must be a value that can never change: a number, a string, a tuple of such things. A list may not be a key, and trying gives a `TypeError`. The reason is the lookup trick. Python works out where to keep a value from its key. If the key could change after it was filed, the value could never be found again. Values, on the other hand, may be anything, including lists and other dictionaries.

        **Sets: keys with no values.** Sometimes the only question is whether something is present, or how many **different** things there are. For that there is the **set**: a collection of distinct items with no order and no repeats.

        ```python
        seen = {3, 6, 3, 1, 3, 6}
        print(len(seen))
        print(6 in seen, 5 in seen)
        ```

        This shows 3, and then `True False`. The repeats vanished the moment the set was made. The call `set(xs)` builds a set from any sequence, which makes "how many distinct items?" a single expression: `len(set(xs))`. The method `add` puts one item in, and adding an item that is already there changes nothing.

        ```python
        letters = set()
        for ch in "banana":
            letters.add(ch)
        print(len(letters))
        ```

        This shows 3. Notice the empty set is written `set()`. The brackets `{}` were already taken: they mean the empty dictionary.

        A set finds its items by the same trick as a dictionary finds its keys, so `x in some_set` is immediate however large the set, while `x in some_list` must search the list from the front. Two consequences follow from the trick. The items of a set must be unchangeable, like dictionary keys. And a set has **no positions**: there is no first item, `seen[0]` is an error, and the order in which a set is shown or looped over is not something to rely on. When you need its items in order, use `sorted(seen)`, which gives a list.

        Sets combine in the ways their name suggests. For two sets `a` and `b`, `a | b` is everything in either, `a & b` is everything in both, and `a - b` is everything in `a` that is not in `b`.

        ```python
        maths = {"Asha", "Ravi", "Meera"}
        physics = {"Ravi", "Kabir", "Meera"}
        print(sorted(maths & physics))
        print(len(maths | physics))
        print(sorted(maths - physics))
        ```

        This shows `['Meera', 'Ravi']`, then 4, then `['Asha']`.

        **The society election, counted by the rules.** Every piece is now in hand. A set remembers which flats have voted, and answers "has this flat voted already?" without searching. A dictionary keeps the tally, with a counter for each candidate created the first time that candidate gets a vote. And unpacking takes each ballot apart in the `for` line.

        ```python
        ballots = [
            ("A-101", "Iyer"),
            ("A-102", "Khan"),
            ("B-201", "Iyer"),
            ("A-101", "Khan"),
            ("B-202", "Fernandes"),
            ("C-301", "Khan"),
            ("C-302", "Iyer"),
            ("B-201", "Khan"),
            ("C-303", "Iyer"),
            ("C-301", "Khan"),
            ("A-103", "Fernandes"),
        ]
        seen = set()
        votes = {}
        for flat, choice in ballots:
            if flat not in seen:
                seen.add(flat)
                votes[choice] = votes.get(choice, 0) + 1
        print(votes)
        print(len(seen), "flats voted")
        ```

        This shows `{'Iyer': 4, 'Khan': 2, 'Fernandes': 2}` and then `8 flats voted`. Iyer wins. Khan's careless lead came entirely from the three second ballots, and every one of them was a vote for Khan. Check the tally the usual way: $4 + 2 + 2 = 8$, one vote for each flat in `seen`, and $11 - 8 = 3$ ballots ignored.

        Notice where `seen.add(flat)` sits. It is inside the `if`, so a flat is recorded at its first ballot, and every later ballot from it finds it already there. The order of the list carries the rule "the first ballot counts".

        **Which collection?** Ask what question you will put to the data.

        | The question | The collection |
        | --- | --- |
        | What is at position `i`? What comes next? | list |
        | A few fixed values that belong together | tuple |
        | What belongs to this key? | dictionary |
        | Is this present? How many different ones? | set |
    - question:
        id: fix-key-error
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `stock` records how many of each item a shop holds. `add_stock(stock, item, amount)` should raise the count of `item` by `amount`, creating the entry if the shop has never held the item. The program should show `{'pens': 15, 'ink': 3}`, but it stops with a `KeyError`. Read the error, find the line and the key, and fix the function.
        starter: |
          def add_stock(stock, item, amount):
              stock[item] = stock[item] + amount

          shelf = {"pens": 10}
          add_stock(shelf, "pens", 5)
          add_stock(shelf, "ink", 3)
          print(shelf)
        solution: |
          def add_stock(stock, item, amount):
              stock[item] = stock.get(item, 0) + amount

          shelf = {"pens": 10}
          add_stock(shelf, "pens", 5)
          add_stock(shelf, "ink", 3)
          print(shelf)
        tests: |
          assert shelf == {"pens": 15, "ink": 3}, "The shelf should end as {'pens': 15, 'ink': 3}"
          _s = {}
          add_stock(_s, "tape", 2)
          assert _s == {"tape": 2}, "Adding to an empty stock should create the entry"
          add_stock(_s, "tape", 4)
          assert _s == {"tape": 6}, "Adding to an item already held should raise its count, not replace it"
          add_stock(_s, "glue", 1)
          assert _s == {"tape": 6, "glue": 1}, "Other entries should be left alone"
        wrong:
          - "def add_stock(stock, item, amount):\n    stock[item] = amount\n\nshelf = {\"pens\": 10}\nadd_stock(shelf, \"pens\", 5)\nadd_stock(shelf, \"ink\", 3)\nprint(shelf)\n"
          - "def add_stock(stock, item, amount):\n    if item in stock:\n        stock[item] = stock[item] + amount\n\nshelf = {\"pens\": 10}\nadd_stock(shelf, \"pens\", 5)\nadd_stock(shelf, \"ink\", 3)\nprint(shelf)\n"
          - "def add_stock(stock, item, amount):\n    stock[item] = stock.get(item, amount) + amount\n\nshelf = {\"pens\": 10}\nadd_stock(shelf, \"pens\", 5)\nadd_stock(shelf, \"ink\", 3)\nprint(shelf)\n"
        explanation: The right-hand side is evaluated first, and `stock[item]` fails when the item has never been stored. `stock.get(item, 0)` supplies the count so far, or 0 for an item that is new.
  formal:
    - text: |
        A **dictionary** is a mutable collection of **key–value pairs** in which each key occurs at most once. It is written `{key: value, key: value, ...}`, and `{}` is the empty dictionary. For a dictionary `d`:

        | Written | Meaning |
        | --- | --- |
        | `d[k]` | the value stored under `k`; a `KeyError` if `k` is not a key |
        | `d[k] = v` | store `v` under `k`, adding the pair or replacing the old value |
        | `k in d`, `k not in d` | whether `k` is a key |
        | `d.get(k, fallback)` | `d[k]` if `k` is a key, otherwise `fallback`; `d` is unchanged |
        | `len(d)` | the number of pairs |
        | `d.keys()`, `d.values()`, `d.items()` | the keys, the values, the pairs as tuples |

        `for k in d:` visits the keys in the order in which they were first inserted. Keys must be immutable values. Two dictionaries are equal when they hold the same pairs, whatever the order.

        A **set** is a mutable collection of distinct immutable items, with no order. It is written `{item, item, ...}`, and the empty set is `set()`. For sets `a` and `b`:

        | Written | Meaning |
        | --- | --- |
        | `set(xs)` | a set of the distinct items of the sequence `xs` |
        | `a.add(x)` | put `x` in, in place; no effect if it is already there |
        | `x in a` | whether `x` is an item |
        | `len(a)` | the number of distinct items |
        | `a \| b`, `a & b`, `a - b` | union, intersection, difference: each a new set |

        A set has no indexes. `sorted(a)` gives its items as a list in increasing order.

        The **counting pattern**: start with `counts = {}` and for each item execute `counts[item] = counts.get(item, 0) + 1`. Afterwards the values of `counts` sum to the number of items counted.
  drill:
    - text: Seconds each. For a dictionary, say its pairs after each line. For a set, say its distinct items.
