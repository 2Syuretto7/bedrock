concept: s0.functions
minutes: 95
claim: You can wrap a piece of program in a named function with parameters and a return value, trace a call step by step, and tell returning a value apart from showing it.
recalls: [s0.loops]
uses: [s0.what-a-program-is, s0.values-types-and-variables, s0.expressions, s0.strings, s0.booleans-and-conditionals, f0.the-four-operations-and-order-of-operations, f0.fractions-decimals-and-percentages, f0.powers-and-roots]
leads: [s0.lists-and-tuples]
starter: |
  # Scratch space. Change the arguments and run again.
  def emi(principal, annual_rate, months):
      r = annual_rate / 12 / 100
      growth = (1 + r) ** months
      return principal * r * growth / (growth - 1)

  print(round(emi(500000, 9, 60)))
  print(round(emi(50000, 15, 12)))
parts:
  recall:
    - text: |
        In [[s0.loops]] you built totals, counts and products with the accumulator pattern. Today those loops get names, so that each can be written once and used for ever. Two quick pulls first.
  puzzle:
    - text: |
        Every loan website in India has the same widget: three sliders for the amount, the interest rate and the number of months, and a large number that changes as you drag them. That number is the **EMI**, the equated monthly instalment you would pay every month until the loan is cleared.

        Behind the sliders is one formula. With $P$ the amount borrowed, $r$ the interest rate for one month as a fraction (the yearly rate divided by 12, then by 100), and $n$ the number of months,

        $$\text{EMI} = \frac{P \, r \, (1 + r)^n}{(1 + r)^n - 1}$$

        Suppose you must compare three loans: ₹5,00,000 for a car at 9 per cent a year over 60 months, ₹50,000 for a phone at 15 per cent over 12 months, and ₹30,00,000 for a flat at 8.5 per cent over 240 months. With what you know, you would write this:

        ```python
        r = 9 / 12 / 100
        growth = (1 + r) ** 60
        print(500000 * r * growth / (growth - 1))

        r = 15 / 12 / 100
        growth = (1 + r) ** 12
        print(50000 * r * growth / (growth - 1))

        r = 8.5 / 12 / 100
        growth = (1 + r) ** 240
        print(3000000 * r * growth / (growth - 1))
        ```

        Nine lines, and they say the same thing three times. Only three numbers differ from one copy to the next. If you find a slip in one copy, you must remember to mend the other two. And a reader has to study each copy to discover that they are all the same idea. The website cannot work this way at all: it does not know in advance which numbers you will drag the sliders to.

        Yet you have been using something better since your first program. When you write `abs(-7)` or `len("SBIN0005943")`, you do not see the lines of program that do the work. You give a name and some values, and an answer comes back.

        **Can you make a name of your own that works like that, so that `emi(500000, 9, 60)` simply gives the EMI?**
  intuition:
    - text: |
        Think about what is common to the three copies and what varies. The common part is a recipe: turn the yearly rate into a monthly fraction, raise $1 + r$ to the number of months, and put the pieces into the formula. The varying part is three numbers: the amount, the yearly rate and the number of months.

        A **function** is a recipe with a name, and with blanks left for the things that vary.

        ```python
        def emi(principal, annual_rate, months):
            r = annual_rate / 12 / 100
            growth = (1 + r) ** months
            return principal * r * growth / (growth - 1)
        ```

        Read the first line as "**define** a function called `emi`, with three blanks called `principal`, `annual_rate` and `months`". The indented block is the recipe. The last line says what the answer is: **return** the value of the formula to whoever asked.

        Run those four lines alone and nothing is shown. This surprises everyone once. A definition does not do the work. It only teaches Python the recipe and binds the name `emi` to it, just as `x = 5` binds the name `x` to a number.

        The work happens when you **call** the function, by writing its name with values for the blanks:

        ```python
        def emi(principal, annual_rate, months):
            r = annual_rate / 12 / 100
            growth = (1 + r) ** months
            return principal * r * growth / (growth - 1)

        print(round(emi(500000, 9, 60)))
        print(round(emi(50000, 15, 12)))
        print(round(emi(3000000, 8.5, 240)))
        ```

        This shows 10379, 4513 and 26035: the car costs about ₹10,379 a month, the phone ₹4,513 and the flat ₹26,035. The recipe is written once and used three times. If it has a slip, there is one place to mend it. And the three calls say what they mean: a reader sees `emi(50000, 15, 12)` and does not need to study a formula. A website's sliders do exactly this: each time you drag one, the page calls its EMI function again with the new numbers.

        The picture to hold is a machine with a slot at the top and a chute at the bottom. Values go in at the slot. The machine works out of sight. One value comes out of the chute. You have fed such machines since the first lesson: `abs`, `len`, `round`, `int`. Now you can build them.
  derivation:
    - text: |
        **What happens in a call, step by step.** Take a smaller function and trace it the way you traced loops.

        ```python
        def area(width, height):
            return width * height

        a = area(3, 4)
        print(a + 1)
        ```

        1. Python reads the `def` and binds the name `area` to the recipe. Nothing is computed.
        2. It reaches `a = area(3, 4)`. As always, the right-hand side is evaluated first.
        3. The values 3 and 4 are bound to the names `width` and `height`, in order.
        4. The block runs. It reaches `return width * height`, which evaluates to 12.
        5. The call is over. **The call `area(3, 4)` is replaced by the value 12**, exactly as `2 + 3` is replaced by 5 when an expression is evaluated.
        6. So the line has become `a = 12`. Then `print(a + 1)` shows 13.

        Step 5 is the heart of the matter. A call is an **expression**. It has a value, and it can stand anywhere a value can: inside arithmetic, inside a condition, inside another call. `area(3, 4) + area(1, 2)` is $12 + 2 = 14$.

        Two words are worth keeping apart. The names in the definition, `width` and `height`, are **parameters**: the blanks. The values in a call, 3 and 4, are **arguments**: what fills the blanks. Arguments are matched to parameters by position, first to first and second to second. So `emi(500000, 9, 60)` and `emi(9, 500000, 60)` are very different calls: the second lends nine rupees at an interest rate of five lakh per cent. An argument can be any expression, and it is evaluated before the call begins: `area(1 + 2, 4)` is the same call as `area(3, 4)`.

        **Returning is not showing.** This is the mistake that nearly every beginner makes, so look at it squarely. Here are two functions that seem to do the same job.

        ```python
        def double_show(x):
            print(x * 2)

        def double_return(x):
            return x * 2
        ```

        Call each on its own line, `double_show(5)` and `print(double_return(5))`, and both put 10 on the screen. The difference appears the moment you try to **use** the answer.

        ```python
        def double_show(x):
            print(x * 2)

        def double_return(x):
            return x * 2

        a = double_return(5) + 1
        print(a)
        b = double_show(5)
        print(b)
        ```

        The first pair of lines shows 11. The second pair shows 10, and then `None`.

        `print` puts characters on the screen for a person to read. The program itself cannot get them back. `return` hands a value back to the program, which can store it, add to it, compare it or pass it on. A function that only shows its answer has thrown the answer away as far as the rest of the program is concerned.

        So what did `double_show(5)` evaluate to? Every call must be replaced by some value. When a function reaches the end of its block without meeting a `return`, Python returns a special value called **`None`**, which means "nothing here". It has a type of its own and it is not 0, not `""` and not `False`. If you ever see `None` on the screen, or an error complaining about `NoneType`, the first question to ask is: which function forgot to return?

        The rule of thumb: **functions compute and return; the main program decides what to show.**
    - question:
        id: predict-return-vs-print
        type: predict
        system: s2
        prompt: Trace this one line at a time. It shows two lines. Give both.
        code: |
          def half(x):
              print(x / 2)

          y = half(10)
          print(y)
        output: "5.0\nNone"
        explanation: |
          The call `half(10)` runs the block, which shows 5.0. The block ends without a `return`, so the call evaluates to `None`, and that is what `y` is bound to.
    - text: |
        **Return ends the call.** The moment Python executes a `return`, the function is finished. Lines after it in the block do not run. This makes `return` inside an `if` a clean way to handle cases:

        ```python
        def sign(x):
            if x > 0:
                return "positive"
            if x < 0:
                return "negative"
            return "zero"

        print(sign(-3))
        ```

        For -3 the first condition is false, the second is true, and the function returns `"negative"` at once. The last line is reached only when neither condition held.

        The same holds inside a loop. A `return` leaves the loop and the function together. This function finds the smallest divisor of `n` that is greater than 1:

        ```python
        def smallest_divisor(n):
            for d in range(2, n + 1):
                if n % d == 0:
                    return d

        print(smallest_divisor(35))
        ```

        It shows 5. The loop tried 2, 3 and 4, found that 5 divides 35, and returned without trying 6 or anything after it.

        **Names inside a function stay inside.** Run this.

        ```python
        def area(width, height):
            result = width * height
            return result

        a = area(3, 4)
        print(a)
        ```

        It shows 12. Now add the line `print(result)` at the bottom and run it again. Python stops with

        ```
        NameError: name 'result' is not defined
        ```

        The names `width`, `height` and `result` were created when the call began and were thrown away when it returned. They are **local** to the function. Each call gets a fresh set, like a clean sheet of scratch paper that is binned when the answer has been copied out.

        This is a kindness and not a nuisance. It means the main program can have its own variable called `result` and no function will disturb it:

        ```python
        def square(x):
            result = x * x
            return result

        result = 100
        s = square(7)
        print(result, s)
        ```

        This shows `100 49`. The `result` inside `square` was a different name on a different sheet. Because of this you can use a function knowing only what goes in and what comes out. Nobody could use `len` if they first had to check that it did not overwrite their variables.

        The traffic across the wall of a function should go through two gates only: **arguments in, return value out.**

        **Functions built from functions.** A function's block can call other functions. That is how large programs are made from small, tested parts.

        ```python
        def square(x):
            return x * x

        def sum_of_squares(a, b):
            return square(a) + square(b)

        print(sum_of_squares(3, 4))
        ```

        Trace it by substitution. `sum_of_squares(3, 4)` becomes `square(3) + square(4)`, which becomes `9 + 16`, which is 25.

        **Functions that answer yes or no.** A function may return a boolean, and then its call can sit directly in a condition.

        ```python
        def is_even(n):
            return n % 2 == 0

        if is_even(10):
            print("even")
        ```

        The comparison `n % 2 == 0` already evaluates to `True` or `False`, so it can be returned as it stands. There is no need for an `if` that returns `True` in one branch and `False` in the other.

        **Say what it does.** By custom the first line of a block is a string that describes the function, called a **docstring**. Python ignores it. People do not.

        ```python
        def percent_of(part, whole):
            "Return what percentage part is of whole."
            return part / whole * 100
        ```

        A good function does **one** job, has a name that says what the job is, takes what it needs as parameters, and returns its answer.
    - question:
        id: fix-forgot-return
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `mean_of_three` should return the mean of its three arguments. The program should show 5.0 and then 6.0, but it shows 5.0 and then stops with an error about `NoneType`. Find out what the call really evaluates to, and fix the function.
        starter: |
          def mean_of_three(a, b, c):
              total = a + b + c
              print(total / 3)

          m = mean_of_three(2, 4, 9)
          print(m + 1)
        solution: |
          def mean_of_three(a, b, c):
              total = a + b + c
              return total / 3

          m = mean_of_three(2, 4, 9)
          print(m)
          print(m + 1)
        tests: |
          assert mean_of_three(2, 4, 9) == 5.0, "mean_of_three(2, 4, 9) should evaluate to 5.0. What does the call evaluate to at the moment?"
          assert mean_of_three(1, 1, 1) == 1.0, "It should work for any three numbers"
          assert mean_of_three(-3, 0, 3) == 0.0, "It should work for negative numbers too"
          assert m == 5.0, "m should be bound to 5.0"
        wrong:
          - "def mean_of_three(a, b, c):\n    total = a + b + c\n    return total\n\nm = mean_of_three(2, 4, 9)\nprint(m)\n"
          - "def mean_of_three(a, b, c):\n    total = a + b + c\n    return 5.0\n\nm = mean_of_three(2, 4, 9)\nprint(m + 1)\n"
        explanation: The function showed its answer and then fell off the end of its block, so the call evaluated to `None`, and `None + 1` is an error. Returning the value lets the main program store it and use it.
  formal:
    - text: |
        A **function definition** has the form

        ```
        def name(parameter, parameter, ...):
            block
        ```

        Executing it binds the name to a function. The block is not executed then. A function may have no parameters at all, in which case the brackets are empty, both in the definition and in the call.

        A **call** `name(argument, argument, ...)` is an expression. To evaluate it, Python

        1. evaluates each argument, left to right;
        2. creates a fresh set of **local** names and binds each parameter to the matching argument, by position;
        3. executes the block until it meets a `return` or runs off the end;
        4. discards the local names and uses the returned value as the value of the call.

        The number of arguments must equal the number of parameters, or Python stops with a `TypeError`.

        The statement `return expression` evaluates the expression, ends the call at once, and makes that value the value of the call. A bare `return`, or reaching the end of the block, returns **`None`**, the single value of the type `NoneType`.

        A name bound inside a function is **local**: it exists only during that call and is unrelated to any name of the same spelling elsewhere. A function may **read** a name from the main program if it has no local of that spelling, but good functions take what they need as parameters.

        A function must be defined before the line that calls it is executed.
  drill:
    - text: Seconds each. For every call, say which value each parameter is bound to before you answer.
    - question:
        id: predict-simple-call
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def add_one(x):
              return x + 1

          print(add_one(4) * 2)
        output: "10"
        explanation: The call is replaced by 5, and the line becomes `print(5 * 2)`.
    - question:
        id: predict-argument-order
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def subtract(a, b):
              return a - b

          print(subtract(3, 10))
        output: "-7"
        explanation: Arguments are matched by position, so `a` is 3 and `b` is 10.
    - question:
        id: predict-nested-call
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def square(x):
              return x * x

          print(square(square(2)))
        output: "16"
        explanation: The inner call is evaluated first and gives 4. Then `square(4)` gives 16.
    - question:
        id: predict-local
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def reset(x):
              x = 0
              return x

          x = 7
          reset(x)
          print(x)
        output: "7"
        explanation: The `x` inside the function is a local name. Rebinding it does not touch the main program's `x`, and the returned 0 was not stored anywhere.
    - question:
        id: predict-early-return
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def first(x):
              return x
              print("after")

          print(first(3))
        output: "3"
        explanation: "`return` ends the call at once. The line after it never runs."
    - question:
        id: predict-boolean-function
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def is_even(n):
              return n % 2 == 0

          print(is_even(7))
        output: "False"
        explanation: "`7 % 2` is 1, and `1 == 0` is False."
    - question:
        id: no-return-value
        type: choice
        system: s1
        prompt: "A function's block ends without executing a `return`. What does the call evaluate to?"
        options: ["0", "None", "The value of its last line", "It is an error"]
        answer: 1
        explanation: Every call evaluates to something. With no `return`, that something is `None`.
    - question:
        id: parameter-or-argument
        type: choice
        system: s1
        prompt: "In `def area(width, height):` followed later by `area(3, 4)`, what is `width`?"
        options: ["An argument", "A parameter", "A return value", "A call"]
        answer: 1
        explanation: Parameters are the names in the definition. Arguments are the values in the call, here 3 and 4.
  work:
    - text: Slower now. For each function, decide first what goes in and what comes out. Then try it on a case you can do in your head.
    - question:
        id: write-percent-change
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `percent_change(old, new)` that **returns** the percentage change from `old` to `new`. A rise from 80 to 100 is a change of 25 percent, and a fall from 100 to 80 is a change of -20 percent. The base of the percentage is always the old value.
        starter: |
          def percent_change(old, new):
              # Replace the next line with your own.
              return 0

          print(percent_change(80, 100))
        solution: |
          def percent_change(old, new):
              return (new - old) / old * 100

          print(percent_change(80, 100))
        tests: |
          assert percent_change(80, 100) is not None, "The function returns None. Showing a value is not the same as returning it."
          assert percent_change(80, 100) == 25.0, "From 80 to 100 is a rise of 25 percent"
          assert percent_change(100, 80) == -20.0, "From 100 to 80 is a fall of 20 percent. Which value is the base?"
          assert percent_change(50, 50) == 0.0, "No change is 0 percent"
          assert percent_change(40, 100) == 150.0, "From 40 to 100 is a rise of 150 percent"
        wrong:
          - "def percent_change(old, new):\n    print((new - old) / old * 100)\n\nprint(percent_change(80, 100))\n"
          - "def percent_change(old, new):\n    return (new - old) / new * 100\n\nprint(percent_change(80, 100))\n"
          - "def percent_change(old, new):\n    return new / old * 100\n\nprint(percent_change(80, 100))\n"
        explanation: The change is `new - old`, and it is measured as a fraction of the old value, then scaled to a percentage. The function returns the number so that the main program can decide what to do with it.
    - question:
        id: write-emi
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `emi(principal, annual_rate, months)` that **returns** the monthly instalment on a loan, using the formula from the puzzle. `annual_rate` is in per cent a year, so the monthly rate $r$ is `annual_rate / 12 / 100`.

          Shops also sell phones on "no-cost EMI", which is a loan at a rate of 0. The formula then divides by zero, so when `annual_rate` is 0 the function must instead return the amount split equally over the months.
        starter: |
          def emi(principal, annual_rate, months):
              r = annual_rate / 12 / 100
        solution: |
          def emi(principal, annual_rate, months):
              if annual_rate == 0:
                  return principal / months
              r = annual_rate / 12 / 100
              growth = (1 + r) ** months
              return principal * r * growth / (growth - 1)
        tests: |
          assert "emi" in dir(), "Define a function called emi"
          assert emi(500000, 9, 60) is not None, "emi should return the instalment. Does your function return, or only show?"
          assert abs(emi(500000, 9, 60) - 10379.18) < 0.01, "emi(500000, 9, 60) should be about 10379.18. Is the yearly rate turned into a monthly fraction?"
          assert abs(emi(50000, 15, 12) - 4512.92) < 0.01, "emi(50000, 15, 12) should be about 4512.92"
          assert abs(emi(3000000, 8.5, 240) - 26034.70) < 0.01, "emi(3000000, 8.5, 240) should be about 26034.70"
          assert emi(12000, 0, 6) == 2000.0, "A no-cost EMI of 12000 over 6 months should be 2000.0 a month. What does your formula do when the rate is 0?"
        wrong:
          - "def emi(principal, annual_rate, months):\n    r = annual_rate / 12 / 100\n    growth = (1 + r) ** months\n    return principal * r * growth / (growth - 1)\n"
          - "def emi(principal, annual_rate, months):\n    if annual_rate == 0:\n        return principal / months\n    r = annual_rate / 100\n    growth = (1 + r) ** months\n    return principal * r * growth / (growth - 1)\n"
          - "def emi(principal, annual_rate, months):\n    if annual_rate == 0:\n        return principal / months\n    r = annual_rate / 12 / 100\n    growth = (1 + r) ** months\n    print(principal * r * growth / (growth - 1))\n"
          - "def emi(principal, annual_rate, months):\n    if annual_rate == 0:\n        return 0\n    r = annual_rate / 12 / 100\n    growth = (1 + r) ** months\n    return principal * r * growth / (growth - 1)\n"
        explanation: The zero-rate case is tested first and returns at once, so the formula is never reached when it would divide by zero. Otherwise the yearly rate becomes a monthly fraction, $(1 + r)^n$ is worked out once and used twice, and the result is returned so that a website, or the rest of a program, can use it.
    - question:
        id: write-clamp
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `clamp(x, low, high)` that returns `x` if it lies between `low` and `high`, both included. If `x` is below `low` it returns `low`, and if `x` is above `high` it returns `high`. So `clamp(15, 0, 10)` is 10 and `clamp(-2, 0, 10)` is 0.
        starter: |
          def clamp(x, low, high):
              # Replace the next line with your own.
              return 0

          print(clamp(15, 0, 10))
        solution: |
          def clamp(x, low, high):
              if x < low:
                  return low
              if x > high:
                  return high
              return x

          print(clamp(15, 0, 10))
        tests: |
          assert clamp(5, 0, 10) is not None, "The function returns None for a value inside the range. Does every path through the block reach a return?"
          assert clamp(5, 0, 10) == 5, "A value inside the range comes back unchanged"
          assert clamp(15, 0, 10) == 10, "A value above the range comes back as high"
          assert clamp(-2, 0, 10) == 0, "A value below the range comes back as low"
          assert clamp(10, 0, 10) == 10, "The ends of the range are inside it"
          assert clamp(0.5, -1, 1) == 0.5, "It should work for any range"
          assert clamp(-7, -5, -1) == -5, "It should work for a range of negative numbers"
        wrong:
          - "def clamp(x, low, high):\n    if x < low:\n        return low\n    if x > high:\n        return high\n\nprint(clamp(15, 0, 10))\n"
          - "def clamp(x, low, high):\n    if x < low:\n        return high\n    if x > high:\n        return low\n    return x\n\nprint(clamp(15, 0, 10))\n"
          - "def clamp(x, low, high):\n    if x < 0:\n        return 0\n    if x > 10:\n        return 10\n    return x\n\nprint(clamp(15, 0, 10))\n"
        explanation: There are three cases and each ends in a `return`. Because `return` ends the call, the last line is reached only when `x` was neither too low nor too high.
    - question:
        id: write-is-prime
        type: code
        mode: write
        system: s2
        prompt: |
          A whole number greater than 1 is **prime** if no whole number from 2 up to one less than itself divides it exactly. Write a function `is_prime(n)` that returns `True` if `n` is prime and `False` otherwise. Numbers below 2 are not prime. Use a loop, and return as soon as the answer is known.
        starter: |
          def is_prime(n):
              # Replace the next line with your own.
              return False

          print(is_prime(7))
          print(is_prime(9))
        solution: |
          def is_prime(n):
              if n < 2:
                  return False
              for d in range(2, n):
                  if n % d == 0:
                      return False
              return True

          print(is_prime(7))
          print(is_prime(9))
        tests: |
          assert is_prime(7) is not None, "The function returns None. Does every path through the block reach a return?"
          assert is_prime(7) == True, "7 is prime"
          assert is_prime(9) == False, "9 is 3 times 3, so it is not prime. Does your loop give up after the first divisor it tries?"
          assert is_prime(2) == True, "2 is prime. How many times does your loop run for n = 2?"
          assert is_prime(1) == False, "1 is not prime"
          assert is_prime(0) == False, "0 is not prime"
          assert is_prime(97) == True, "97 is prime"
          assert is_prime(91) == False, "91 is 7 times 13"
        wrong:
          - "def is_prime(n):\n    for d in range(2, n):\n        if n % d == 0:\n            return False\n        else:\n            return True\n\nprint(is_prime(7))\n"
          - "def is_prime(n):\n    for d in range(2, n):\n        if n % d == 0:\n            return False\n    return True\n\nprint(is_prime(7))\n"
          - "def is_prime(n):\n    if n < 2:\n        return False\n    for d in range(2, n + 1):\n        if n % d == 0:\n            return False\n    return True\n\nprint(is_prime(7))\n"
        explanation: |
          One divisor is enough to prove that a number is not prime, so the function can return `False` inside the loop. But a number is prime only if **every** candidate fails, so `True` can be returned only after the loop has finished. Returning `True` inside the loop would give up after testing 2 alone.
    - question:
        id: fix-local-name
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `sum_to(n)` should return $1 + 2 + \dots + n$, and the program should show 55. It stops with a `NameError` instead. Read the last line of the error, work out which sheet of scratch paper each name lives on, and fix the program. The function itself is correct.
        starter: |
          def sum_to(n):
              total = 0
              for k in range(1, n + 1):
                  total += k
              return total

          sum_to(10)
          print(total)
        solution: |
          def sum_to(n):
              total = 0
              for k in range(1, n + 1):
                  total += k
              return total

          answer = sum_to(10)
          print(answer)
        tests: |
          assert output.strip() == "55", "The program should show 55 and nothing else"
          assert sum_to(4) == 10, "Leave the function as it was: sum_to(4) should be 10"
          assert "total = 55" not in source and "print(55)" not in source, "Use the value that the call returns"
        wrong:
          - "def sum_to(n):\n    total = 0\n    for k in range(1, n + 1):\n        total += k\n    return total\n\nsum_to(10)\ntotal = 0\nprint(total)\n"
          - "def sum_to(n):\n    total = 0\n    for k in range(1, n + 1):\n        total += k\n    print(total)\n\nsum_to(10)\nsum_to(10)\n"
        explanation: "`total` is local to the function and is gone when the call returns. The call `sum_to(10)` evaluates to 55, but the starter threw that value away. Binding it to a name, or passing the call straight to `print`, keeps it."
    - question:
        id: call-order
        type: order
        system: s2
        prompt: |
          Put the events in the order they happen when Python runs this program.

          ```python
          def triple(x):
              return x * 3

          y = triple(2 + 1)
          print(y)
          ```
        steps:
          - "The name `triple` is bound to the function. Its block does not run."
          - "The argument `2 + 1` is evaluated to 3."
          - "The parameter `x` is bound to 3."
          - "`return` evaluates `x * 3` to 9 and ends the call."
          - "`y` is bound to 9."
          - "`print` shows 9."
        explanation: The definition comes first and computes nothing. In the call, the argument is evaluated before the parameter is bound, and the assignment to `y` can happen only once the call has been replaced by its value.
    - question:
        id: substitute-calls
        type: numeric
        system: s2
        prompt: |
          With the definitions below, what is the value of `f(g(2)) - g(f(2))`? Work by substitution, replacing each call with its value from the inside out.

          ```python
          def f(x):
              return x + 3

          def g(x):
              return x * x
          ```
        answer: "-18"
        explanation: "`g(2)` is 4, so `f(g(2))` is 7. `f(2)` is 5, so `g(f(2))` is 25. Then $7 - 25 = -18$. The order in which functions are applied matters."
    - question:
        id: why-return
        type: choice
        system: s2
        prompt: |
          A function `mean(a, b)` ends with `print((a + b) / 2)` and has no `return`. A program then runs `x = mean(4, 6) * 10`. What happens?
        options:
          - "x is bound to 50.0 and nothing is shown."
          - "5.0 is shown, and x is bound to 50.0."
          - "5.0 is shown, and then the program stops with an error, because the call evaluated to None and None cannot be multiplied by 10."
          - "Nothing is shown, and x is bound to None."
        answer: 2
        explanation: The block runs, so 5.0 appears. The call then evaluates to `None`, and `None * 10` is a `TypeError`. Had the function returned its value, `x` would be 50.0.
  connections:
    - text: |
        You can now name a piece of work, hide its insides, and use it knowing only what goes in and what comes out. That is the single most important organising idea in programming. Every library you will ever import is a collection of functions written by someone else, and you will use them exactly as you used `emi` today. The loan widget's whole job is one function and three sliders that keep calling it.

        The word is borrowed from mathematics on purpose. In algebra, which begins after this cluster, a function is a rule that turns each input into exactly one output, written $f(x)$, and the substitution you practised in today's work is how such rules are evaluated. A Python function that only computes from its arguments and returns a result is that same object in runnable form.

        Machine learning is built from them. A model is a function from inputs to predictions. A loss is a function from predictions to a single number saying how wrong they were. Training repeatedly calls one inside the other, just as `sum_of_squares` called `square`. The `clamp` you wrote is used, under the name of clipping, to stop numbers from running away during training.

        One limit remains. Every function today took a fixed, small number of values: two numbers, three numbers. A mean of three numbers is easy to write. A mean of a thousand measurements would need a thousand parameters. What is missing is a way to hold many values under one name and hand them over together. That is the next lesson, [[s0.lists-and-tuples]].
