concept: s0.values-types-and-variables
minutes: 75
claim: You can store values under names, trace how a program's variables change line by line, tell integers, floats and strings apart, and convert between them.
recalls: [s0.what-a-program-is]
uses: [f0.the-four-operations-and-order-of-operations, f0.fractions-decimals-and-percentages, f0.estimation-and-back-of-the-envelope-reasoning]
leads: [s0.expressions]
starter: |
  # Scratch space. Try the lesson's examples here.
  rows = 28
  columns = 28
  print(rows * columns)
parts:
  recall:
    - text: |
        In [[s0.what-a-program-is]] a program was a list of statements run from top to bottom, numbers were calculated, and text in quotation marks was left alone. Two quick pulls.
  puzzle:
    - text: |
        A ticket on a booking site costs ₹10.50 in booking fees. Inside the bank's computers that amount is not kept as 10.50 at all. It is kept as **1050**: a whole number of paise. Every bank and every payment system does something like this. When the site charges you for 3 tickets, it works with 1050 paise three times over, and only when it shows you the bill does it put the rupees and the decimal point back.

        Try writing that bill with what you know so far:

        ```python
        print(1050 * 3)
        print(1050 * 3 - 200)
        print((1050 * 3 - 200) * 2)
        ```

        The second line takes off a ₹2 discount, and the third doubles the bill for a return journey. It works. But `1050 * 3` has been typed three times and worked out three times. If the fee changes, every copy must be found and changed, and a missed one quietly shows a wrong bill. Each line starts from nothing and forgets everything when it ends.

        Two questions hide in this. **How does a program write a value down, so that later lines can use it?** And why would a bank bother to count whole paise, when a computer can surely hold 10.50 as easily as 1050? The answer to the second is that a computer keeps different *kinds* of number in different ways, and the kind matters.
  intuition:
    - text: |
        It gives the value a **name**.

        ```python
        fare = 1050 * 3
        print(fare)
        print(fare - 200)
        print((fare - 200) * 2)
        ```

        The first line works out $1050 \times 3$ and attaches the name `fare` to the result, 3150. From then on, wherever `fare` appears, Python looks up what the name is attached to and uses that. A name attached to a value is called a **variable**.

        The best picture is a luggage label tied to a suitcase. The value 3150 is the suitcase. The name `fare` is the label. To use the variable, Python follows the label to the value. A label can later be untied and tied to a different suitcase, which is why it is called a variable: what it refers to can vary.

        Names also make a program explain itself. Compare `print((1050 * 3 - 200) * 2)` with this:

        ```python
        fee_paise = 1050
        tickets = 3
        discount_paise = 200
        journeys = 2
        bill_paise = (fee_paise * tickets - discount_paise) * journeys
        print(bill_paise)
        ```

        It is longer, and far better. Every number now says what it is. To change the fee you change one line, and everything that depends on it follows.
  derivation:
    - text: |
        **The equals sign is an instruction, not a claim.** In mathematics, $x = 5$ is a statement that two things are equal. In Python, `x = 5` is a command with two steps, always in this order:

        1. Work out the value of whatever is on the **right** of the `=`.
        2. Attach the name on the **left** to that value.

        This is called **assignment**. It runs right to left, and it happens at the moment the line is executed, not before and not continuously afterwards.

        That explains a line which would be nonsense in mathematics:

        ```python
        steps = 10
        steps = steps + 1
        print(steps)
        ```

        No number equals itself plus one. But as an instruction it is perfectly clear. Step one: work out the right side. `steps` is currently 10, so the right side is 11. Step two: attach the name `steps` to 11. The old value is forgotten. The program shows 11.

        **Assignment takes a snapshot.** What does this show?

        ```python
        a = 5
        b = a
        a = 7
        print(a, b)
        ```

        Follow the two steps on each line. Line 1 ties `a` to 5. Line 2 works out the right side, which is the value `a` refers to *now*, 5, and ties `b` to it. Line 3 unties `a` and ties it to 7. Nothing in line 3 mentions `b`, so `b` is still tied to 5. The program shows `7 5`. Assignment does not link two names together. It copies the label onto whatever value is there at that moment.

        The dependable way to read any program is to keep a small table of every variable and update it line by line. It is called **tracing**. It feels slow, and it is how every experienced programmer finds bugs.

        | After line | `a` | `b` |
        | --- | --- | --- |
        | 1 | 5 | |
        | 2 | 5 | 5 |
        | 3 | 7 | 5 |
    - question:
        id: predict-trace
        type: predict
        system: s2
        prompt: Trace this program with a table, one row per line, then give exactly what it shows.
        code: |
          x = 2
          y = x * 3
          x = x + y
          y = 1
          print(x, y)
        output: "8 1"
        explanation: |
          After line 1, `x` is 2. After line 2, `y` is 6. Line 3 works out $2 + 6$ and reattaches `x` to 8. Line 4 reattaches `y` to 1, which does not change `x`, because `x` was computed earlier from the value `y` had then.
    - text: |
        **A name must be assigned before it is used.** Statements run in order, so a line that uses a name Python has not yet met fails:

        ```
        print(total)
        total = 12
        ```

        Python stops at line 1 with `NameError: name 'total' is not defined`. This is a different kind of error from the last lesson's. The grammar is fine, so the program starts running, and it fails partway, at the line it cannot carry out.

        **Choosing names.** A name may contain letters, digits and underscores, and must not start with a digit or contain a space. So `batch_size` and `layer2` are valid. `2nd_layer` and `batch size` are not. Capital and small letters are different: `Total` and `total` are two names. By custom, Python names are written in small letters with underscores between words. Choose names that say what the value *means*.

        **Every value has a type.** You have met two kinds of value, numbers and text. In fact Python has two kinds of number, and it keeps track of which is which.

        - An **int** (integer) is a whole number: `47`, `-3`, `0`.
        - A **float** is a number with a decimal point: `0.25`, `-3.5`, `2.0`. Note that `2.0` is a float even though its value is whole.
        - A **str** (string) is text: `"Hello"`, `"47"`.

        The kind of a value is called its **type**, and you can ask for it:

        ```python
        print(type(47))
        print(type(2.0))
        print(type("47"))
        ```

        This shows `<class 'int'>`, `<class 'float'>` and `<class 'str'>`.

        **Why types matter.** The type decides what an operator *does*. For numbers, `+` adds. For strings, `+` joins end to end:

        ```python
        print(3 + 4)
        print("3" + "4")
        ```

        The first shows 7. The second shows `34`: the character 3 followed by the character 4. Same symbol, different types, different meaning. And if you mix them, as in `"3" + 4`, Python refuses with a `TypeError`. It will not guess whether you meant 7 or "34".

        **Converting between types.** When you have the right information in the wrong type, convert it. `int("47")` gives the integer 47. `float("0.5")` gives 0.5. `str(47)` gives the string `"47"`. And `float(3)` gives 3.0.

        One conversion needs care. `int(3.9)` gives 3, not 4. Converting a float to an int **cuts off** everything after the point. It does not round. For negative numbers too: `int(-3.9)` is $-3$.

        **Now the bank.** An int is a whole number held exactly, however large: 1050 paise is 1050 paise, and adding a crore of such amounts gives an exact total. A float is held differently. It is very nearly exact for most decimals, but "very nearly" can leave a tiny error, smaller than a millionth of a paisa, and the next lesson shows one appearing in front of your eyes. A tiny error on one bill does not matter. The same error repeated over crores of payments a day, in a system where every paisa must be accounted for, does. So money is counted in whole paise, as ints, and the decimal point is put back only when a person needs to read it.
    - question:
        id: fix-name-order
        type: code
        mode: find-bug
        system: s2
        prompt: |
          This program should work out the cost of 3 tickets at 40 rupees each and store it in `total`. It stops with a NameError. Fix it by changing only the order of the lines.
        starter: |
          total = price * count
          price = 40
          count = 3
          print(total)
        solution: |
          price = 40
          count = 3
          total = price * count
          print(total)
        tests: |
          assert price == 40 and count == 3, "Keep price as 40 and count as 3"
          assert total == price * count, "total should be price times count"
          assert output.strip() == "120", "The program should show the total"
        wrong:
          - "price = 40\ncount = 3\nprint(total)\ntotal = price * count\n"
          - "total = 0\nprice = 40\ncount = 3\nprint(total)\n"
        explanation: Statements run from top to bottom. The line that uses `price` and `count` must come after the lines that assign them.
  formal:
    - text: |
        An **assignment statement** has the form *name* `=` *expression*. Python evaluates the expression, then binds the name to the resulting value. If the name was already bound, the old binding is replaced. The expression is evaluated using the bindings in force at that moment.

        A **variable** is a name bound to a value. Using a name in an expression evaluates to the value it is currently bound to. Using a name that has never been bound raises a **NameError**, and the program stops at that line.

        A **name** consists of letters, digits and underscores, does not begin with a digit, and is case-sensitive. Words that Python reserves for itself cannot be used as names.

        Every value has a **type**. So far:

        | Type | Meaning | Examples |
        | --- | --- | --- |
        | `int` | whole number | `47`, `-3`, `0` |
        | `float` | number with a decimal point | `0.25`, `2.0`, `-3.5` |
        | `str` | text | `"Hello"`, `"47"` |

        `type(x)` gives the type of the value of `x`.

        For two numbers, `+`, `-` and `*` do arithmetic. If both are ints the result is an int. If either is a float the result is a float, so `2 * 0.5` is `1.0`. For two strings, `+` joins them. Adding a string to a number raises a **TypeError**.

        `int(x)`, `float(x)` and `str(x)` convert a value to that type. `int` of a float discards the fractional part. `int` or `float` of a string that does not look like a number raises a **ValueError**.

        The **state** of a program at any moment is the set of its variables and their current values. Tracing a program means following its state line by line.
  drill:
    - text: Seconds each. Trace in your head.
    - question:
        id: predict-update
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          x = 3
          x = x + 4
          print(x)
        output: "7"
        explanation: The right side is worked out with the old value of `x`, then `x` is reattached.
    - question:
        id: predict-join
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print("3" + "4")
        output: "34"
        explanation: Both are strings, so `+` joins them.
    - question:
        id: type-of
        type: choice
        system: s1
        prompt: "What is the type of the value `2.0`?"
        options: ["int", "float", "str", "It has no type"]
        answer: 1
        explanation: The decimal point makes it a float, even though the value is whole.
    - question:
        id: predict-convert
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(int("12") + 1)
        output: "13"
        explanation: "`int(\"12\")` is the number 12, and then one is added."
    - question:
        id: predict-truncate
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(int(3.9))
        output: "3"
        explanation: Converting a float to an int cuts off the fractional part. It does not round.
    - question:
        id: valid-name
        type: choice
        system: s1
        prompt: Which of these is a valid variable name?
        options: ["`2nd_layer`", "`batch size`", "`batch_size`", "`batch-size`"]
        answer: 2
        explanation: Letters, digits and underscores only, and not starting with a digit. A hyphen would be read as a minus sign.
  work:
    - text: Slower now. Trace before you run.
    - question:
        id: write-pixels
        type: code
        mode: write
        system: s1
        prompt: |
          Create a variable `rows` with the value 28 and a variable `columns` with the value 28. Then create `pixels` as their product, calculated from the two variables, and show it.
        starter: |
          rows = 28
        solution: |
          rows = 28
          columns = 28
          pixels = rows * columns
          print(pixels)
        tests: |
          assert "columns" in dir(), "Create a variable called columns"
          assert "pixels" in dir(), "Create a variable called pixels"
          assert rows == 28 and columns == 28, "rows and columns should both be 28"
          assert pixels == rows * columns, "pixels should be rows multiplied by columns"
          assert rerun(rows=10)["pixels"] == 280, "pixels should be calculated from the variables rows and columns, not typed in as a number"
          assert output.strip() == str(pixels), "Show the value of pixels, and nothing else"
        wrong:
          - "rows = 28\ncolumns = 28\npixels = rows + columns\nprint(pixels)\n"
          - "rows = 28\ncolumns = 28\npixels = rows * columns\n"
        explanation: Each value gets a name, and `pixels` is computed from the names, so changing `rows` on line 1 would change the result everywhere.
    - question:
        id: write-swap
        type: code
        mode: write
        system: s2
        prompt: |
          The starter binds `a` to `"train"` and `b` to `"test"`. Add lines so that afterwards `a` is bound to the value `b` started with and `b` to the value `a` started with. Do not type the words train or test again: move the values using the names. You will need one extra variable.
        starter: |
          a = "train"
          b = "test"
        solution: |
          a = "train"
          b = "test"
          spare = a
          a = b
          b = spare
        tests: |
          assert a == "test", "a should now hold the value b started with"
          assert b == "train", "b should now hold the value a started with. Trace your lines: was a's first value still available when you needed it?"
        wrong:
          - "a = \"train\"\nb = \"test\"\na = b\nb = a\n"
          - "a = \"train\"\nb = \"test\"\nb = a\na = b\n"
        explanation: |
          `a = b` overwrites the only label on `"train"`, so that value is lost unless another name is tied to it first. The spare variable holds it while the first reassignment happens.
    - question:
        id: fix-type
        type: code
        mode: find-bug
        system: s2
        prompt: |
          The number of batches was read from a file as text. This program should show 4 times that number, 12, but it shows `3333`. Fix it by converting, and keep the first line exactly as it is.
        starter: |
          count = "3"
          print(count * 4)
        solution: |
          count = "3"
          print(int(count) * 4)
        tests: |
          assert count == "3", "Keep the first line as it is: count is the text 3"
          assert output.strip() != "3333", "It still repeats the text. What type is count?"
          assert output.strip() == "12", "It should show 12"
        wrong:
          - "count = \"3\"\nprint(count + count + count + count)\n"
          - "count = \"3\"\nprint(str(count) * 4)\n"
        explanation: For a string, `*` repeats the text. Converting with `int` first gives a number, and then `*` multiplies.
    - question:
        id: write-convert
        type: code
        mode: write
        system: s2
        prompt: |
          The starter binds `text` to the string `"0.25"`. Create a variable `share` holding the same amount as a float, then a variable `double` that is twice `share`, and show `double`.
        starter: |
          text = "0.25"
        solution: |
          text = "0.25"
          share = float(text)
          double = share * 2
          print(double)
        tests: |
          assert "share" in dir() and "double" in dir(), "Create both share and double"
          assert type(share) == float, "share should be a float. Which conversion turns text into a float?"
          assert share == 0.25, "share should be 0.25"
          assert double == 0.5, "double should be twice share"
          assert output.strip() == "0.5", "Show the value of double"
        wrong:
          - "text = \"0.25\"\nshare = text\ndouble = share * 2\nprint(double)\n"
          - "text = \"0.25\"\nshare = int(0.25)\ndouble = share * 2\nprint(double)\n"
        explanation: "`float(text)` turns the characters into the number 0.25. Multiplying a float by an int gives a float, 0.5."
    - question:
        id: meaning-of-update
        type: choice
        system: s2
        prompt: "What does the statement `steps = steps + 1` tell Python to do?"
        options:
          - "Check whether steps is equal to steps plus one, which is never true."
          - "Work out the current value of steps plus one, then bind the name steps to that result."
          - "Create a second variable, also called steps, that is one larger."
          - "Link steps to itself so that it keeps growing."
        answer: 1
        explanation: Assignment evaluates the right side first, using the current binding, and then rebinds the name on the left. It happens once, when the line is executed.
    - question:
        id: trace-order
        type: order
        system: s2
        prompt: |
          Put the events in the order they happen when Python runs this program.

          ```python
          n = 4
          n = n * n
          print(n)
          ```
        steps:
          - "The name `n` is bound to 4."
          - "The right side `n * n` is evaluated using the current value, giving 16."
          - "The name `n` is rebound to 16, and the value 4 is forgotten."
          - "`print` looks up `n` and shows 16."
        explanation: On the second line, evaluation of the right side is complete before the name is rebound, which is why both copies of `n` on the right mean 4.
  connections:
    - text: |
        A program now has a memory. Values are computed once, named, and reused, and a program can be read as a story about named quantities instead of a wall of numbers.

        The idea of a name standing for a value is the same one that crept into the arithmetic lessons whenever a law had to be stated for all numbers at once. There the letters stood for "any number". Here a name stands for one particular value at a time, and that value can be replaced. Keep the two apart. The difference will matter when algebra begins after this cluster.

        Types will matter for the rest of the course. The tables of numbers that machine learning runs on are, underneath, huge blocks of floats, and many real bugs are type bugs: text where a number was expected, a whole number where a decimal was needed.

        So far the right side of an assignment has only added, subtracted and multiplied. Division, remainders and powers each behave in ways worth a careful look, and they are the business of the next lesson, [[s0.expressions]].
