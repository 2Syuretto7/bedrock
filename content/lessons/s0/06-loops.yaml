        type: predict
        system: s1
        prompt: What does this show?
        code: |
          count = 0
          for i in range(2, 8):
              count += 1
          print(count)
        output: "6"
        explanation: "`range(2, 8)` has $8 - 2 = 6$ values."
    - question:
        id: predict-halving
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          x = 16
          while x > 1:
              x = x // 2
          print(x)
        output: "1"
