    - question:
        id: predict-break
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          for i in range(10):
              if i == 3:
                  break
          print(i)
        output: "3"
        explanation: The loop is left the moment `i` is 3, and `i` keeps that value.
    - question:
        id: range-values
        type: choice
        system: s1
        prompt: "Which values does `range(1, 5)` produce?"
        options: ["1, 2, 3, 4, 5", "1, 2, 3, 4", "0, 1, 2, 3, 4", "2, 3, 4, 5"]
        answer: 1
        explanation: It starts at 1 and stops just before 5.
    - question:
        id: predict-letters
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          word = ""
          for letter in "abc":
              word = letter + word
          print(word)
        output: "cba"
        explanation: Each new letter is put in front of what has been built so far.
  work:
    - text: Slower now. For every loop, name the first value, the last value and the number of iterations before you run it.
    - question:
        id: write-power
        type: code
        mode: write
        system: s2
        prompt: |
          A power is repeated multiplication. The starter binds `base` and `exponent`, a whole number that is 0 or more. Using a loop and the accumulator pattern, bind `result` to `base` to the power `exponent`. Do not use the `**` operator: build the power the way it is defined.
        starter: |
          base = 2
          exponent = 10
        solution: |
          base = 2
          exponent = 10
          result = 1
          for i in range(exponent):
              result *= base
        tests: |
          assert "**" not in source, "Build the power with a loop, without the ** operator"
          assert "result" in dir(), "Create a variable called result"
          assert result == 1024, "2 to the power 10 should be 1024"
          assert rerun(base=3, exponent=4)["result"] == 81, "It should work for any base and exponent"
          assert rerun(base=5, exponent=0)["result"] == 1, "Any number to the power 0 is 1. What should the accumulator start at?"
          assert rerun(base=7, exponent=1)["result"] == 7, "Any number to the power 1 is itself"
        wrong:
          - "base = 2\nexponent = 10\nresult = 0\nfor i in range(exponent):\n    result *= base\n"
          - "base = 2\nexponent = 10\nresult = base\nfor i in range(exponent):\n    result *= base\n"
          - "base = 2\nexponent = 10\nresult = 1\nfor i in range(exponent):\n    result += base\n"
        explanation: The accumulator starts at 1, the identity of multiplication, and is multiplied by the base once per iteration. With zero iterations it stays at 1, which is exactly why a power of zero is 1.
    - question:
        id: write-double
        type: code
        mode: write
        system: s2
        prompt: |
          The starter binds `deposit`, in rupees, and `rate`, the interest in per cent a year, added on once a year to everything in the account. Bind `years` to the number of whole years until the balance is first at least double the deposit. Your lines must work for any deposit and any rate above zero.
        starter: |
          deposit = 100000
          rate = 7
        solution: |
          deposit = 100000
          rate = 7
          balance = deposit
          years = 0
          while balance < 2 * deposit:
              balance = balance * (1 + rate / 100)
              years += 1
        tests: |
          assert "years" in dir(), "Create a variable called years"
          assert years == 11, "At 7 per cent the deposit first reaches double in year 11. The rule of 72 says about 10.3 years."
          assert rerun(rate=4)["years"] == 18, "At 4 per cent it should take 18 years. Use rate, so that the program works for any rate."
          assert rerun(rate=12)["years"] == 7, "At 12 per cent it should take 7 years"
          assert rerun(rate=100)["years"] == 1, "At 100 per cent the deposit is exactly double after one year. Exactly double counts as doubled."
          assert rerun(deposit=5000)["years"] == 11, "The answer should not depend on the size of the deposit"
        wrong:
          - "deposit = 100000\nrate = 7\nbalance = deposit\nyears = 0\nwhile balance <= 2 * deposit:\n    balance = balance * (1 + rate / 100)\n    years += 1\n"
          - "deposit = 100000\nrate = 7\nbalance = deposit\nyears = 0\nwhile balance < 2 * deposit:\n    balance = balance + deposit * rate / 100\n    years += 1\n"
          - "deposit = 100000\nrate = 7\nbalance = deposit\nyears = 0\nwhile balance < 200000:\n    balance = balance * (1 + rate / 100)\n    years += 1\n"
          - "deposit = 100000\nrate = 7\nbalance = deposit\nyears = 0\nfor i in range(11):\n    balance = balance * (1 + rate / 100)\n    years += 1\n"
        explanation: "The number of years is not known in advance, so the loop is a `while` that continues as long as the balance is still below double. Each year multiplies the balance by $1 + r/100$, so interest is earned on earlier interest. Adding the same 7 per cent of the first deposit every year is simple interest, which takes 15 years to double."
    - question:
        id: write-multiples
        type: code
        mode: write
        system: s2
        prompt: |
          The starter binds `n`. Bind `count` to how many of the whole numbers from 1 to `n`, both included, are multiples of 7.
        starter: |
          n = 100
        solution: |
          n = 100
          count = 0
          for k in range(1, n + 1):
              if k % 7 == 0:
                  count += 1
        tests: |
          assert "count" in dir(), "Create a variable called count"
          assert count == 14, "There are 14 multiples of 7 from 1 to 100. Estimate: about a seventh of the numbers."
          assert rerun(n=7)["count"] == 1, "From 1 to 7 there is one multiple of 7, which is 7 itself. Is the last number included in your loop?"
          assert rerun(n=6)["count"] == 0, "From 1 to 6 there are none. Zero is not in the range from 1 to n."
          assert rerun(n=50)["count"] == 7, "It should work for any n"
        wrong:
          - "n = 100\ncount = 0\nfor k in range(1, n):\n    if k % 7 == 0:\n        count += 1\n"
          - "n = 100\ncount = 0\nfor k in range(n + 1):\n    if k % 7 == 0:\n        count += 1\n"
          - "n = 100\ncount = 0\nfor k in range(1, n + 1):\n    if k % 7 == 0:\n        count += k\n"
        explanation: A counting accumulator starts at 0 and goes up by 1 whenever the condition holds. The range must start at 1, because 0 is a multiple of everything, and end at `n + 1` so that `n` itself is tested.
    - question:
        id: write-halvings
        type: code
        mode: write
        system: s2
        prompt: |
          A step size starts at the value bound to `rate` and is halved again and again. Bind `steps` to the number of halvings needed before it first falls below 0.01. You cannot know the number in advance, so which kind of loop fits?
        starter: |
          rate = 1.0
          steps = 0
        solution: |
          rate = 1.0
          steps = 0
          while rate >= 0.01:
              rate = rate / 2
              steps += 1
        tests: |
          assert steps == 7, "Starting from 1.0 it takes 7 halvings: the values go 0.5, 0.25, and so on, and the seventh is the first below 0.01"
          assert rerun(rate=0.005)["steps"] == 0, "A rate already below 0.01 needs no halvings"
          assert rerun(rate=0.02)["steps"] == 2, "From 0.02 the first halving gives exactly 0.01, which is not below 0.01, so a second is needed"
          assert rerun(rate=8.0)["steps"] == 10, "It should work for any starting rate"
        wrong:
          - "rate = 1.0\nsteps = 0\nwhile rate > 0.01:\n    rate = rate / 2\n    steps += 1\n"
          - "rate = 1.0\nsteps = 0\nwhile rate >= 0.01:\n    rate = rate / 2\nsteps += 1\n"
          - "rate = 1.0\nsteps = 0\nfor i in range(6):\n    rate = rate / 2\n    steps += 1\n"
        explanation: The loop must continue while the rate is **not** yet below 0.01, that is, while it is at least 0.01. Each iteration halves the rate and counts one step.
    - question:
        id: fix-reset
        type: code
        mode: find-bug
        system: s2
        prompt: |
          This should bind `total` to the sum of the squares of the whole numbers from 1 to `n`. For `n = 4` that is $1 + 4 + 9 + 16 = 30$, but the program shows 16. Trace it to find out why, and fix it.
        starter: |
          n = 4
          for k in range(1, n + 1):
              total = 0
              total += k * k
          print(total)
        solution: |
          n = 4
          total = 0
          for k in range(1, n + 1):
              total += k * k
          print(total)
        tests: |
          assert total == 30, "For n = 4 the total should be 30. Trace total through each iteration: what happens to it at the top of the block?"
          assert rerun(n=1)["total"] == 1, "For n = 1 the total should be 1"
          assert rerun(n=10)["total"] == 385, "It should work for any n"
        wrong:
          - "n = 4\nfor k in range(1, n + 1):\n    total = k * k\nprint(total)\n"
          - "n = 4\ntotal = 0\nfor k in range(1, n):\n    total += k * k\nprint(total)\n"
        explanation: The accumulator was being set back to 0 at the start of every iteration, so only the last square survived. Setting up belongs before the loop, where it happens once.
    - question:
        id: loop-order
        type: order
        system: s2
        prompt: |
          Put the events in the order they happen when Python runs this program.

          ```python
          n = 2
          while n < 4:
              n += 1
          print(n)
          ```
        steps:
          - "`n` is bound to 2."
          - "The condition `2 < 4` is True, so the block runs and `n` becomes 3."
          - "The condition `3 < 4` is True, so the block runs and `n` becomes 4."
          - "The condition `4 < 4` is False, so the loop ends."
          - "`print` shows 4."
        explanation: The condition is checked before every iteration, including a final check that fails. The block ran twice and the condition was checked three times.
    - question:
        id: iterations-count
        type: numeric
        system: s2
        prompt: "How many times does the block of `for i in range(3, 12, 3):` run?"
        answer: "3"
        explanation: The values are 3, 6 and 9. The next would be 12, which is the end and is not included.
    - question:
        id: which-loop
        type: choice
        system: s2
        prompt: |
          A program must keep doubling a number until it exceeds one million, and report how many doublings that took. Which loop fits, and why?
        options:
          - "A for loop over a range, because for loops are faster."
          - "A while loop, because the number of iterations is not known in advance. The loop must continue until a condition is met."
          - "Either, because the two kinds of loop are always interchangeable."
          - "Neither. An if statement is enough."
        answer: 1
        explanation: "`for` suits a known count or a collection to walk through. `while` suits repeating until something becomes true. An `if` runs its block at most once."
  connections:
    - text: |
        The fixed deposit no longer needs a guess at how many years to write out. A `while` loop kept multiplying until the balance had doubled, and stopped at year 11, which the rule of 72 confirms. A few lines can now do a million steps of work. With variables, conditions and loops, you have in principle everything needed to compute anything that can be computed. The rest of programming is about organising those three so that people can read, trust and reuse them.

        The loop is the shape of machine learning itself. Training is a loop: show the program a batch of examples, measure how wrong it was, nudge its numbers, and go round again, often millions of times. The halving loop in today's work is a small cousin of the schedules that shrink the step size as training goes on. The accumulator pattern is how every average, every total and every count is computed.

        Notice, too, that you defined a power today with a loop, and the rule that anything to the power zero is 1 fell out of a loop that ran zero times. Arithmetic's definitions and a program's behaviour are the same thing seen from two sides.

        There is a cost to what you have built. The power loop is five lines. If a program needs powers in ten places, must those five lines be copied ten times? The cure is to wrap a piece of program up, give it a name, and call on it whenever it is needed. That is the next lesson, [[s0.functions]].
