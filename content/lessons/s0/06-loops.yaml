concept: s0.loops
minutes: 90
claim: You can make a program repeat work with while and for, trace a loop line by line, and build totals, counts and products with the accumulator pattern.
recalls: [s0.booleans-and-conditionals]
uses: [s0.what-a-program-is, s0.values-types-and-variables, s0.expressions, s0.strings, f0.the-four-operations-and-order-of-operations, f0.powers-and-roots, f0.estimation-and-back-of-the-envelope-reasoning]
leads: [s0.functions]
starter: |
  # Scratch space. Change the rate and run again.
  balance = 100000
  year = 0
  while balance < 200000:
      balance = balance * 1.07
      year += 1
  print(year, round(balance))
parts:
  recall:
    - text: |
        In [[s0.booleans-and-conditionals]] a condition decided whether a block of lines ran. Today the same kind of condition decides whether a block runs **again**. Two quick pulls.
  puzzle:
    - text: |
        You put ₹1,00,000 into a fixed deposit that pays 7 per cent a year, added on once a year. Each year's interest is paid on everything in the account, including last year's interest. **In which year does the deposit first reach ₹2,00,000?**

        You can work out the first few years with what you know:

        ```python
        balance = 100000
        balance = balance * 1.07
        print(balance)
        balance = balance * 1.07
        print(balance)
        ```

        That shows `107000.0` and then `114490.0`, which are the balances after one year and after two. To reach the answer you would keep pasting the same two lines and reading the output until it passes 2,00,000.

        But how many times? You do not know in advance. That is the whole question. And if the bank changes the rate to 4 per cent, the number of pastes changes too, so the program you wrote for 7 per cent is wrong for 4. The work itself is utterly regular: multiply by 1.07, look at the balance, and do that again. You could explain it to a child in one sentence.

        A program should be able to say "keep doing this until the balance has doubled" without knowing how many times that will be. **How do you tell Python to do something again?**
  intuition:
    - text: |
        Go back to how you would do this by hand, with a pencil and a patient temperament. You would keep two things on the paper: the **balance so far**, and the **number of years** that have passed. Then you would repeat one small routine.

        1. Multiply the balance by 1.07.
        2. Add one to the count of years.
        3. If the balance is still below 2,00,000, go back to step 1.

        Step 3 is the new idea. Every program so far has only moved down the page. A **loop** is an instruction to go back up and run some lines again.

        Here is the routine in Python.

        ```python
        balance = 100000
        year = 0
        while balance < 200000:
            balance = balance * 1.07
            year = year + 1
        print(year)
        ```

        Read the third line as "**while** the balance is below 2,00,000, keep doing the indented block". Python checks the condition. If it is true, it runs the block, then **jumps back** and checks the condition again. When the condition is at last false, Python skips the block and carries on below it. The program shows `11`. After ten years the deposit holds about ₹1,96,715, still short. After the eleventh it holds about ₹2,10,485.

        Change 1.07 to 1.04 and run it again: `18`. Nothing else in the program changed, though the number of times the block ran did. Six lines of program, and they work for any rate.

        A loop looks very like an `if`. Both have a condition, a colon and an indented block. The only difference is what happens at the bottom of the block. After an `if` block, Python moves on. After a `while` block, Python goes back to the condition.

        Step through the deposit below, one line at a time, and watch the marked line jump back up to the `while` after every year. Then change the rate and jump to the end.
    - figure: step-through
      props: { program: deposit, rate: 7 }
  derivation:
    - text: |
        **Tracing a loop.** The only reliable way to understand a loop is to trace it, with one row for every time the condition is checked. The deposit takes eleven rows, so take a loop with whole numbers that ends sooner. This one adds up 1, 2, 3 and 4.

        ```python
        total = 0
        n = 1
        while n <= 4:
            total = total + n
            n = n + 1
        print(total, n)
        ```

        | Check | `n <= 4`? | `total` after the block | `n` after the block |
        | --- | --- | --- | --- |
        | 1st | 1 ≤ 4, True | 1 | 2 |
        | 2nd | 2 ≤ 4, True | 3 | 3 |
        | 3rd | 3 ≤ 4, True | 6 | 4 |
        | 4th | 4 ≤ 4, True | 10 | 5 |
        | 5th | 5 ≤ 4, False | loop ends | |

        It shows `10 5`. Notice two things. The block ran four times but the condition was checked five times: the last check is the one that fails. And when the loop ends, `n` is 5, not 4. It is the first value for which the condition was false.

        **Three parts of every loop.** Look at what made it work. Something was set up **before** the loop (`n = 1`). A **condition** was tested each time round (`n <= 4`). And inside the block, something **changed** so that the condition would eventually fail (`n = n + 1`).

        Leave out the third part and the condition stays true for ever. The program runs without end and shows nothing. This is an **infinite loop**. If it happens to you, and it will, press **Stop**. Then ask: what in the block was supposed to move the loop towards its end?

        **A shorter way to update.** Lines like `total = total + n` are so common that there is a shorthand: `total += n`. It means exactly the same. Likewise `n -= 1`, `p *= 2` and `x //= 2`.

        **The accumulator pattern.** Almost every loop you will write builds up an answer piece by piece. The shape is always the same.

        1. Before the loop, bind a variable to a **starting value**.
        2. Inside the loop, **combine** it with the next item.
        3. After the loop, the variable holds the answer.

        For a sum, start at 0 and add. For a count, start at 0 and add 1. For a product, start at **1** and multiply. The starting value is whatever leaves the first item unchanged: adding 0 changes nothing, and multiplying by 1 changes nothing. You met these as the identities of addition and multiplication.
    - question:
        id: predict-while
        type: predict
        system: s2
        prompt: Trace this with a table, one row per check of the condition. Then give what it shows.
        code: |
          power = 1
          count = 0
          while power < 100:
              power = power * 2
              count += 1
          print(power, count)
        output: "128 7"
        explanation: |
          `power` doubles each time: 2, 4, 8, 16, 32, 64, 128. After the seventh doubling it is 128, the condition `128 < 100` is false, and the loop ends. So $2^7 = 128$ is the first power of two that is not below 100.
    - text: |
        **Counting loops: `for` and `range`.** The loop above counts: `n` goes 1, 2, 3 and so on, up to a limit. Counting is so common that Python has a form that does the setting up, the testing and the changing for you.

        ```python
        for i in range(3):
            print(i)
        print("end")
        ```

        This shows 0, 1, 2 on separate lines and then `end`. Read it as "**for** each value `i` in the range, run the block". `range(3)` produces the three values 0, 1 and 2, in order. Each time round, `i` is bound to the next one. When they run out, the loop ends. There is no update to forget, so a `for` loop over a range cannot run for ever.

        `range` follows the same convention as slices: it starts where you say and stops **just before** the end.

        | Written | Values produced |
        | --- | --- |
        | `range(5)` | 0, 1, 2, 3, 4 |
        | `range(1, 5)` | 1, 2, 3, 4 |
        | `range(0, 10, 2)` | 0, 2, 4, 6, 8 |
        | `range(10, 0, -3)` | 10, 7, 4, 1 |

        `range(n)` gives exactly `n` values, and `range(a, b)` gives $b - a$ of them. The optional third number is the step. So to count from 1 to 10, both included, you write `range(1, 11)`. Forgetting that the end is not included is the classic **off-by-one error**, and the cure is to ask of every loop: what is the first value, what is the last, and how many times does the block run?

        A `for` loop can also walk through a string, one character at a time:

        ```python
        for letter in "abc":
            print(letter)
        ```

        **Which loop?** Use `for` when you know in advance how many times to go round, or have a collection to walk through. Use `while` when you must keep going **until** something happens, and cannot say beforehand how long that will take, as with the fixed deposit and the doubling example above.

        **Loops and decisions together.** A block can contain anything, including an `if`. This counts the multiples of 3 below 20:

        ```python
        count = 0
        for n in range(1, 20):
            if n % 3 == 0:
                count += 1
        print(count)
        ```

        It shows 6. The `if` is indented once, inside the loop, and its block twice.

        **Leaving early.** The statement `break` ends the nearest loop at once. This finds the first whole number whose square exceeds 200:

        ```python
        for n in range(1, 100):
            if n * n > 200:
                break
        print(n)
        ```

        It shows 15, since $14^2 = 196$ and $15^2 = 225$.

        **Check loops with estimates.** A loop can run a million times, so you cannot check it by hand. But you can check its **answer**. Change the limit in the tracing example from 4 to a million, `while n <= 1000000:`, and it shows `500000500000 1000001`. The numbers from 1 to 1,000,000 average about half a million, and there are a million of them, so the sum should be about $5 \times 10^5 \times 10^6 = 5 \times 10^{11}$. Twelve digits, leading 5. It passes.

        The fixed deposit has an estimate too. Bankers use the **rule of 72**: money growing at $r$ per cent a year doubles in about $72 / r$ years. For 7 per cent that is about 10.3 years, so the first whole year at or past double should be the 11th. For 4 per cent it is 18 years. Both agree with the loop.
    - question:
        id: fix-off-by-one
        type: code
        mode: find-bug
        system: s2
        prompt: |
          This should add the whole numbers from 1 to `n`, both included. For `n = 10` the answer is 55, but the program shows 45. Find which values the loop really visits, and fix it.
        starter: |
          n = 10
          total = 0
          for i in range(n):
              total += i
          print(total)
        solution: |
          n = 10
          total = 0
          for i in range(1, n + 1):
              total += i
          print(total)
        tests: |
          assert total == 55, "For n = 10 the total should be 55. List the values that i takes: what is the last one?"
          assert rerun(n=1)["total"] == 1, "For n = 1 the total should be 1"
          assert rerun(n=100)["total"] == 5050, "It should work for any n"
        wrong:
          - "n = 10\ntotal = 0\nfor i in range(n + 1):\n    total += i + 1\nprint(total)\n"
          - "n = 10\ntotal = 10\nfor i in range(n):\n    total += i\nprint(total)\n"
          - "n = 10\ntotal = 0\nfor i in range(1, n):\n    total += i\nprint(total)\n"
        explanation: "`range(n)` produces 0 up to `n - 1`, so the last number, `n` itself, was never added. `range(1, n + 1)` produces 1 up to `n`."
  formal:
    - text: |
        A **while statement** has the form

        ```
        while condition:
            block
        ```

        Python evaluates the condition. If it is true, the block is executed and the condition is evaluated again. This repeats until the condition is false, when execution continues after the block. If the condition is false at the first check, the block does not run at all.

        `range(a, b, s)` represents the values `a`, `a + s`, `a + 2s`, … that lie before `b`. `range(a, b)` uses a step of 1 and `range(b)` starts at 0. The end value `b` is never included.

        A **for statement** has the form

        ```
        for name in sequence:
            block
        ```

        The block is executed once for each item of the sequence, in order, with the name bound to that item. The sequence may be a range or a string, and later the collections you have yet to meet. After the loop the name stays bound to the last item.

        One execution of the block is called an **iteration**. `break` ends the innermost loop immediately.

        The **augmented assignments** `x += y`, `x -= y`, `x *= y`, `x /= y`, `x //= y` and `x %= y` mean `x = x + y` and so on.

        The **accumulator pattern**: bind a variable to the identity of the operation (0 for sums and counts, 1 for products, `""` for joining strings), update it in each iteration, and read the result after the loop.
  drill:
    - text: Seconds each. Say the values the loop visits before you answer.
    - question:
