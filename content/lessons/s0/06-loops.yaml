        type: predict
        system: s1
        prompt: What does this show?
        code: |
          total = 0
          for i in range(5):
              total += i
          print(total)
        output: "10"
        explanation: "The values are 0, 1, 2, 3 and 4. Their sum is 10."
    - question:
