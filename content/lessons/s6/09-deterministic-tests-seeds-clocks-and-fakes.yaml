            import random


            def first_failure(check, master_seed, cases):
                # Run check(rng) on up to `cases` cases. Each case should get its own
                # generator, seeded from the master generator, so that a failing case
                # can be replayed alone from its seed. Return the seed of the first
                # failing case, or None if every case passes.
                master = random.Random(master_seed)
                for i in range(cases):
                    case_seed = master.randint(0, 10 ** 6)
                    if not check(random.Random(case_seed)):
                        return master_seed
                return None


            def rupees(paise):
                # Format an amount in paise as rupees, such as 1205 -> "12.05".
                return str(paise // 100) + "." + str(paise % 100)


            def check_rupees(rng):
                paise = rng.randint(0, 99999)
                whole, part = rupees(paise).split(".")
                return len(part) == 2 and int(whole) * 100 + int(part) == paise


            seed = first_failure(check_rupees, 2027, 200)
            print(seed, check_rupees(random.Random(seed)))
        explanation: |
          Each case draws a seed from the master generator but then runs the check on the master generator itself, so the case's input depends on every earlier draw and the logged seed reproduces nothing. Run the check on `random.Random(case_seed)`. Returning the case number or the master seed gives something that cannot be replayed alone, and making a new master generator inside the loop gives every case the same seed, so most bugs are never found.
    - question:
        id: write-fake-clock
        type: code
        mode: write
        system: s2
        prompt: |
          Finish `FakeClock`, a test clock that moves only when advanced and fires timers as they fall due. The program should print two lines: the four events of a login screen with their times, 2, 5, 5 and 35 seconds, then `40`.
        starter: |
          class FakeClock:
              # A clock for tests. Time starts at 0 and moves only when advance() is
              # called. call_later(delay, fn) asks for fn() to be called once, delay
              # seconds from now. advance(seconds) moves time forward by that much,
              # calling every callback that falls due, in time order; callbacks due at
              # the same moment run in the order they were scheduled. While a callback
              # runs, now() gives its due time. A callback may schedule more
              # callbacks, and any that fall due within the same advance run too.
              def __init__(self):
                  self.time = 0

              def now(self):
                  return self.time

              def call_later(self, delay, fn):
                  pass

              def advance(self, seconds):
                  self.time += seconds


          clock = FakeClock()
          log = []


          def send_otp():
              log.append(("otp sent", clock.now()))
              clock.call_later(30, lambda: log.append(("otp expired", clock.now())))


          clock.call_later(5, send_otp)
          clock.call_later(5, lambda: log.append(("screen shown", clock.now())))
          clock.call_later(2, lambda: log.append(("page loaded", clock.now())))
          clock.advance(40)
          print(log)
          print(clock.now())
        solution: |
          class FakeClock:
              # A clock for tests. Time starts at 0 and moves only when advance() is
              # called. call_later(delay, fn) asks for fn() to be called once, delay
              # seconds from now. advance(seconds) moves time forward by that much,
              # calling every callback that falls due, in time order; callbacks due at
              # the same moment run in the order they were scheduled. While a callback
              # runs, now() gives its due time. A callback may schedule more
              # callbacks, and any that fall due within the same advance run too.
              def __init__(self):
                  self.time = 0
                  self.pending = []
                  self.count = 0

              def now(self):
                  return self.time

              def call_later(self, delay, fn):
                  self.pending.append((self.time + delay, self.count, fn))
                  self.count += 1

              def advance(self, seconds):
                  end = self.time + seconds
                  while True:
                      due = [p for p in self.pending if p[0] <= end]
                      if not due:
                          break
                      first = min(due, key=lambda p: (p[0], p[1]))
                      self.pending.remove(first)
                      self.time = first[0]
                      first[2]()
                  self.time = end


          clock = FakeClock()
          log = []


          def send_otp():
              log.append(("otp sent", clock.now()))
              clock.call_later(30, lambda: log.append(("otp expired", clock.now())))


          clock.call_later(5, send_otp)
          clock.call_later(5, lambda: log.append(("screen shown", clock.now())))
          clock.call_later(2, lambda: log.append(("page loaded", clock.now())))
          clock.advance(40)
          print(log)
          print(clock.now())
        tests: |
          _c = FakeClock()
          assert _c.now() == 0, "A new FakeClock should start at time 0"
          _seen = []
          _c.call_later(10, lambda: _seen.append(("a", _c.now())))
          _c.call_later(3, lambda: _seen.append(("b", _c.now())))
          _c.call_later(10, lambda: _seen.append(("c", _c.now())))
          _c.advance(2)
          assert _seen == [] and _c.now() == 2, "After advance(2) nothing is due yet and now() should be 2"
          _c.advance(1)
          assert _seen == [("b", 3)], "A callback due exactly at the end of an advance should run, at its due time; got " + repr(_seen)
          _c.advance(20)
          assert _seen == [("b", 3), ("a", 10), ("c", 10)], "Callbacks should run in time order, ties in the order scheduled, each seeing its own due time; got " + repr(_seen)
          assert _c.now() == 23, "After all the advances, now() should be 23, not " + str(_c.now())
          _c.advance(100)
          assert len(_seen) == 3, "Each callback should run only once"

          _d = FakeClock()
          _ticks = []


          def _tick():
              _ticks.append(_d.now())
              if len(_ticks) < 5:
                  _d.call_later(4, _tick)


          _d.call_later(4, _tick)
          _d.advance(13)
          assert _ticks == [4, 8, 12], "A callback that schedules itself every 4 seconds should run at 4, 8 and 12 within advance(13); got " + repr(_ticks)
          _d.advance(13)
          assert _ticks == [4, 8, 12, 16, 20], "It should stop after five runs, at 16 and 20; got " + repr(_ticks)
          _d.call_later(0, lambda: _ticks.append(("now", _d.now())))
          _d.advance(0)
          assert _ticks[-1] == ("now", 26), "A callback with delay 0 should run on advance(0); got " + repr(_ticks[-1])
          _e = FakeClock()
          _order = []
          _e.call_later(5, lambda: _order.append("later"))
          _e.call_later(1, lambda: _order.append("sooner"))
          _e.advance(10)
          assert _order == ["sooner", "later"], "A callback due at 1 second should run before one due at 5, even if scheduled second; got " + repr(_order)
          assert output.splitlines()[0] == "[('page loaded', 2), ('otp sent', 5), ('screen shown', 5), ('otp expired', 35)]", "The program's first line should list the four events at 2, 5, 5 and 35 seconds"
        wrong:
          - |
            class FakeClock:
                # A clock for tests. Time starts at 0 and moves only when advance() is
                # called. call_later(delay, fn) asks for fn() to be called once, delay
                # seconds from now. advance(seconds) moves time forward by that much,
                # calling every callback that falls due, in time order; callbacks due at
                # the same moment run in the order they were scheduled. While a callback
                # runs, now() gives its due time. A callback may schedule more
                # callbacks, and any that fall due within the same advance run too.
                def __init__(self):
                    self.time = 0
                    self.pending = []
                    self.count = 0

                def now(self):
                    return self.time

                def call_later(self, delay, fn):
