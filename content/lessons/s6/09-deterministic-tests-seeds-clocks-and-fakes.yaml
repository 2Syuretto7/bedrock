            def daily_totals(orders):
                # orders is a list of (seconds, amount) pairs. seconds counts from
                # midnight UTC at the start of 1 November 2026, which is 5:30 a.m. on
                # 1 November in India, since India is 5 hours 30 minutes ahead of UTC.
                # Add up the amounts for each Indian calendar date and return a list of
                # (date, total) pairs sorted by date, where date is the day of November
                # in India, from 1 to 30.
