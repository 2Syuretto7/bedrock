            class FakeClock:
                # A clock for tests. Time starts at 0 and moves only when advance() is
                # called. call_later(delay, fn) asks for fn() to be called once, delay
                # seconds from now. advance(seconds) moves time forward by that much,
                # calling every callback that falls due, in time order; callbacks due at
                # the same moment run in the order they were scheduled. While a callback
                # runs, now() gives its due time. A callback may schedule more
                # callbacks, and any that fall due within the same advance run too.
                def __init__(self):
                    self.time = 0
                    self.pending = []
                    self.count = 0

                def now(self):
                    return self.time

                def call_later(self, delay, fn):
                    self.pending.append((self.time + delay, self.count, fn))
                    self.count += 1

                def advance(self, seconds):
                    end = self.time + seconds
                    while True:
                        due = [p for p in self.pending if p[0] <= end]
                        if not due:
                            break
                        first = min(due, key=lambda p: (p[0], p[1]))
                        self.pending.remove(first)
                        self.time = end
                        first[2]()
                    self.time = end


            clock = FakeClock()
            log = []


            def send_otp():
                log.append(("otp sent", clock.now()))
                clock.call_later(30, lambda: log.append(("otp expired", clock.now())))


            clock.call_later(5, send_otp)
            clock.call_later(5, lambda: log.append(("screen shown", clock.now())))
            clock.call_later(2, lambda: log.append(("page loaded", clock.now())))
            clock.advance(40)
            print(log)
            print(clock.now())
        explanation: |
          Keep pending timers as (due time, sequence number, callback). To advance, repeatedly take the earliest due timer, ties broken by sequence number, set the time to its due time and call it, until none falls due before the end; then set the time to the end. Picking the next timer by scheduling order runs a 2-second timer after 5-second ones; collecting the due timers once misses the OTP expiry that a callback schedules during the advance; and moving time to the end first makes every callback see the wrong time.
