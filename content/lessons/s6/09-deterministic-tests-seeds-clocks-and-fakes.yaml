                for seconds, amount in orders:
                    date = (seconds + 19800) // 86400 + 1
                    totals[date] = totals.get(date, 0) + amount
                return list(totals.items())


            orders = [
                (40000, 250),       # 4:36 p.m. on 1 November in India
                (66599, 120),       # one second before midnight in India
                (66600, 300),       # midnight in India: 2 November begins
                (90000, 80),        # 6:30 a.m. on 2 November in India
                (242800, 500),      # 12:56 a.m. on 4 November in India, still 3 November in UTC
            ]
            for date, total in daily_totals(orders):
                print(date, "Nov", total)
        explanation: |
          Add India's offset, 19,800 seconds, before dividing by the 86,400 seconds in a day, then add 1 because the dates start at 1 November. Without the offset, an order at 11:59 p.m. India time and one at 12:00 midnight both land on 1 November; an offset of 5 hours instead of 5 hours 30 minutes gets the half hour after midnight wrong; and returning the totals in the order first seen breaks as soon as orders arrive out of date order. Only times a test chooses, such as one second either side of 18:30 UTC, catch the first two.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          In the puzzle, the shop's code fails on the last day of each month and its test runs once a day on the real date. On how many days of 2027 does the test fail?
        answer: "12"
        explanation: |
          2027 is not a leap year, and each of its 12 months has one last day, 31 January, 28 February, 31 March and so on to 31 December. On those 12 days the code builds an impossible date; on the other 353 the test passes and the bug stays hidden.
    - question:
        id: work-nightly-seed
        type: choice
        system: s2
        prompt: |
          Meera's nightly property test failed on seed 81723. When she reran the test with fresh seeds, it passed. What should she do first?
        options:
          - "Replay seed 81723 to reproduce the failure, then add it to the fixed seeds run on every merge."
          - "Ignore it, since the rerun passed."
          - "Run the nightly job twice as often."
          - "Remove the property test, since it is flaky."
        answer: 0
        explanation: |
          The seed is the bug report. Replaying it reproduces the failure exactly, and keeping it in the fixed list guards the fix for ever. A passing rerun on fresh seeds says only that those other inputs were fine, and the test is not flaky at all: the same seed fails every time.
  connections:
    - text: |
        12. The code is wrong on the last day of each month, and 2027 has twelve of them, so a test on the real date fails on 12 days and passes on 353. Each failure looks like a flake because the next run passes, and the real bug can survive for months. With the date passed in, the test checks 31 January, 28 February and 31 December on every run and fails every time until the code is right.

        The same rule, give the test control of everything that varies, runs through all of testing. Seeds make random inputs replayable; fake clocks make time something a test sets; fakes and simulation make the network and the order of events something a test chooses. [[s6.fuzzing]] takes the replayable random input to its extreme, throwing millions of generated inputs at parsers and other code that reads untrusted data, and keeping every input that crashes it. [[d0.interleavings-and-race-conditions]] looks at the event orders that deterministic simulation explores, and at why they are so hard to get right.
