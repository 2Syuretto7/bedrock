                    for x in [t - 1, t, t + 1]:
                        if lo <= x <= hi:
                            chosen.append(x)
                return sorted(chosen)


            # Free delivery from 500 rupees; approval needed from 5,000; orders up to 1,00,000.
            print(boundary_tests([500, 5000], 0, 100000))
          - |
            def boundary_tests(thresholds, lo, hi):
                # Valid inputs are the whole numbers from lo to hi. Behaviour changes at
                # each threshold t, which belongs to the upper side. Return the sorted
                # test inputs: lo and hi, and t - 1, t and t + 1 for every threshold,
                # leaving out anything outside lo to hi and listing each input once.
                chosen = set()
                for t in thresholds:
                    for x in [t - 1, t, t + 1]:
                        if lo <= x <= hi:
                            chosen.add(x)
                return sorted(chosen)


            # Free delivery from 500 rupees; approval needed from 5,000; orders up to 1,00,000.
            print(boundary_tests([500, 5000], 0, 100000))
        explanation: |
          Collect the ends and the three values around each threshold in a set, keep only those inside the valid range, and sort. Without the range check a threshold at the bottom produces an invalid input; a list instead of a set repeats inputs where thresholds or ends coincide; and leaving out `lo` and `hi` skips the extremes, where many bugs live.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          In the puzzle, a bug shows on 1 input in 10,000. How many independent random tests give at least a 95% chance of catching it?
        answer: "29956"
        tolerance: "100"
        explanation: |
          $n \ge \ln 0.05 / \ln 0.9999 \approx 29{,}955.8$, so 29,956 tests, close to the rule of thumb $3/\theta = 30{,}000$.
    - question:
        id: work-no-bugs
        type: choice
        system: s2
        prompt: |
          All 400 tests of the new fare calculator pass. The product manager, Sneha, asks whether that means it has no bugs. What is the accurate answer?
        options:
          - "It works for every case the tests try; whether it works elsewhere depends on how well those cases cover the classes and boundaries of the rules."
          - "Yes; 400 passing tests prove it correct."
          - "No; passing tests tell us nothing at all."
          - "Yes, as long as the tests ran in the continuous integration pipeline."
        answer: 0
        explanation: |
          Tests show behaviour on the inputs they ran, so their value depends on which inputs those were. 400 tests that probe every boundary say a lot; 400 near-identical ones say little. Where they ran does not change what they checked.
  connections:
    - text: |
        About 30,000. The chance that $n$ random tests all miss a bug on 1 input in 10,000 is $0.9999^n$, and pushing that below 5% needs $n \ge \ln 0.05 / \ln 0.9999 \approx 29{,}956$. The rule of thumb, three divided by the rarity, gives 30,000. Rare bugs are expensive to find at random, which is why tests chosen by reading the specification, at its boundaries, matter so much, and why random testing works best when it runs for a long time, as in [[s6.fuzzing]].

        A test is a small experiment, and like any experiment it needs a controlled setting: the same starting state every time, the inputs it means to try, and an exact statement of what should happen. Writing many such experiments cleanly, each independent of the others, with the shared setup factored out, is [[s6.unit-tests-and-fixtures]].
