          - |
            import random


            def is_leap(year):
                # The function under test. It forgets the rules for years ending in 00.
                return year % 4 == 0


            def spec(year):
                return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)


            def random_search(f, reference, n, seed):
                # Seed the generator with seed, then try n random years from 1 to 3000,
                # each drawn with random.randint(1, 3000). Return the first year on which
                # f and reference disagree, or None if all n agree.
                random.seed(0)
                for _ in range(n):
                    year = random.randint(1, 3000)
                    if f(year) != reference(year):
                        return year
                return None


            print(random_search(is_leap, spec, 500, 7))
        explanation: |
          Seeding inside the loop resets the generator every time, so all 500 "random" years are the same year, tested 500 times. Seed once, before the loop, and the draws differ while staying repeatable. Not seeding at all makes a failure impossible to replay; keeping the last disagreement instead of the first changes the answer to a different, later year; and seeding with a fixed number ignores the seed the caller asked for.
    - question:
        id: write-tests-needed
        type: code
        mode: write
        system: s2
        prompt: |
          Write `tests_needed(rate, confidence)`, the smallest number of independent random tests that catches a bug of the given rarity with at least the given chance. The program should print `[299, 29956, 7]`.
        starter: |
          import math


          def tests_needed(rate, confidence):
              # A bug shows on a fraction rate of random inputs, independently. Return
              # the smallest number of random tests n for which the chance of at least
              # one failing test, 1 - (1 - rate) ** n, is at least confidence.
              return 1


          print([tests_needed(0.01, 0.95), tests_needed(0.0001, 0.95), tests_needed(0.5, 0.99)])
        solution: |
          import math


          def tests_needed(rate, confidence):
              # A bug shows on a fraction rate of random inputs, independently. Return
              # the smallest number of random tests n for which the chance of at least
              # one failing test, 1 - (1 - rate) ** n, is at least confidence.
              return math.ceil(math.log(1 - confidence) / math.log(1 - rate))


          print([tests_needed(0.01, 0.95), tests_needed(0.0001, 0.95), tests_needed(0.5, 0.99)])
        tests: |
          def _brute(_r, _c):
              _n = 1
              while 1 - (1 - _r) ** _n < _c:
                  _n += 1
              return _n


          for _r, _c in [(0.01, 0.95), (0.001, 0.9), (0.2, 0.5), (0.5, 0.75), (0.3, 0.99), (0.05, 0.999), (0.9, 0.5), (0.0002, 0.95)]:
              _want = _brute(_r, _c)
              _got = tests_needed(_r, _c)
              assert _got == _want, "For a bug on " + str(_r) + " of inputs and confidence " + str(_c) + ", tests_needed should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "[299, 29956, 7]", "The program should print [299, 29956, 7]"
        wrong:
          - |
            import math


            def tests_needed(rate, confidence):
                # A bug shows on a fraction rate of random inputs, independently. Return
                # the smallest number of random tests n for which the chance of at least
                # one failing test, 1 - (1 - rate) ** n, is at least confidence.
                return math.ceil(confidence / rate)


            print([tests_needed(0.01, 0.95), tests_needed(0.0001, 0.95), tests_needed(0.5, 0.99)])
          - |
            import math


            def tests_needed(rate, confidence):
                # A bug shows on a fraction rate of random inputs, independently. Return
                # the smallest number of random tests n for which the chance of at least
                # one failing test, 1 - (1 - rate) ** n, is at least confidence.
                return math.floor(math.log(1 - confidence) / math.log(1 - rate))


            print([tests_needed(0.01, 0.95), tests_needed(0.0001, 0.95), tests_needed(0.5, 0.99)])
          - |
            import math


            def tests_needed(rate, confidence):
                # A bug shows on a fraction rate of random inputs, independently. Return
                # the smallest number of random tests n for which the chance of at least
                # one failing test, 1 - (1 - rate) ** n, is at least confidence.
                return math.ceil(math.log(confidence) / math.log(1 - rate))


            print([tests_needed(0.01, 0.95), tests_needed(0.0001, 0.95), tests_needed(0.5, 0.99)])
        explanation: |
          All $n$ tests miss with probability $(1 - \text{rate})^n$, which must be at most $1 - \text{confidence}$, so $n$ is the logarithm of one divided by the logarithm of the other, rounded up. Dividing confidence by rate treats chances as if they added up; rounding down stops one test short; and taking the logarithm of the confidence instead of the chance of missing answers a different question.
    - question:
        id: write-boundaries
        type: code
        mode: write
        system: s2
        prompt: |
          Write `boundary_tests(thresholds, lo, hi)`, which lists the test inputs around every threshold and at both ends of the valid range. The program should print `[0, 499, 500, 501, 4999, 5000, 5001, 100000]`.
        starter: |
          def boundary_tests(thresholds, lo, hi):
              # Valid inputs are the whole numbers from lo to hi. Behaviour changes at
              # each threshold t, which belongs to the upper side. Return the sorted
              # test inputs: lo and hi, and t - 1, t and t + 1 for every threshold,
              # leaving out anything outside lo to hi and listing each input once.
              return [lo, hi]


          # Free delivery from 500 rupees; approval needed from 5,000; orders up to 1,00,000.
          print(boundary_tests([500, 5000], 0, 100000))
        solution: |
          def boundary_tests(thresholds, lo, hi):
              # Valid inputs are the whole numbers from lo to hi. Behaviour changes at
              # each threshold t, which belongs to the upper side. Return the sorted
              # test inputs: lo and hi, and t - 1, t and t + 1 for every threshold,
              # leaving out anything outside lo to hi and listing each input once.
              chosen = {lo, hi}
              for t in thresholds:
                  for x in [t - 1, t, t + 1]:
                      if lo <= x <= hi:
                          chosen.add(x)
              return sorted(chosen)


          # Free delivery from 500 rupees; approval needed from 5,000; orders up to 1,00,000.
          print(boundary_tests([500, 5000], 0, 100000))
        tests: |
          _cases = [
              (([10], 0, 20), [0, 9, 10, 11, 20]),
              (([0], 0, 5), [0, 1, 5]),
              (([5], 0, 5), [0, 4, 5]),
              (([3, 4], 0, 10), [0, 2, 3, 4, 5, 10]),
              (([], 1, 9), [1, 9]),
              (([18, 60], 0, 120), [0, 17, 18, 19, 59, 60, 61, 120]),
          ]
          for (_t, _lo, _hi), _want in _cases:
              _got = boundary_tests(list(_t), _lo, _hi)
              assert list(_got) == _want, "boundary_tests(" + repr(_t) + ", " + str(_lo) + ", " + str(_hi) + ") should be " + repr(_want) + ", not " + repr(_got)
          assert output.strip() == "[0, 499, 500, 501, 4999, 5000, 5001, 100000]", "The program should print [0, 499, 500, 501, 4999, 5000, 5001, 100000]"
        wrong:
          - |
            def boundary_tests(thresholds, lo, hi):
                # Valid inputs are the whole numbers from lo to hi. Behaviour changes at
                # each threshold t, which belongs to the upper side. Return the sorted
                # test inputs: lo and hi, and t - 1, t and t + 1 for every threshold,
                # leaving out anything outside lo to hi and listing each input once.
                chosen = {lo, hi}
                for t in thresholds:
                    for x in [t - 1, t, t + 1]:
                        chosen.add(x)
                return sorted(chosen)


            # Free delivery from 500 rupees; approval needed from 5,000; orders up to 1,00,000.
            print(boundary_tests([500, 5000], 0, 100000))
          - |
