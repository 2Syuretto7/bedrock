            import random


            def guided(target, start, mutate, rng, steps):
                # target(text) returns the set of branch names that the input reached.
                # The corpus starts as [start], and seen as the branches start reached.
                # On each step, pick an input from the corpus with rng.choice, mutate it
                # with mutate(text, rng), and run target on the result. If it reaches
                # any branch not in seen, add it to the corpus and its branches to seen.
                # Return (corpus, seen).
                corpus = [start]
                seen = set(target(start))
                for _ in range(steps):
                    parent = rng.choice(corpus)
                    child = mutate(parent, rng)
                    reached = target(child)
                    if not reached <= target(parent):
                        corpus.append(child)
                        seen = seen | reached
                return corpus, seen


            def header(text):
                # A file must begin "BDRK". The check goes letter by letter, so each
                # correct letter reaches a new branch.
                reached = {"start"}
                for i in range(4):
                    if i >= len(text) or text[i] != "BDRK"[i]:
                        return reached
                    reached.add("letter " + str(i + 1))
                reached.add("body")
                return reached


            def mutate(text, rng):
                # Replace one random character with a random capital letter.
                i = rng.randint(0, len(text) - 1)
                return text[:i] + rng.choice("ABCDEFGHIJKLMNOPQRSTUVWXYZ") + text[i + 1:]


            corpus, seen = guided(header, "AAAA", mutate, random.Random(1), 20000)
            print(corpus)
            print(sorted(seen))
        explanation: |
          Each step mutates an input chosen from the corpus, and the child is kept only if its branches are not all in `seen`. Mutating the start input every time is blind fuzzing again, and stalls after the first letter; keeping every child buries the few useful inputs among thousands of useless ones; and comparing a child with its own parent instead of with everything seen keeps duplicates of inputs already in the corpus.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          In the puzzle, random files must begin with one particular 4-byte header, each byte having 256 equally likely values. On average, how many random files must the fuzzer send before one gets past the check?
        answer: "4294967296"
        tolerance: "100000000"
        explanation: |
          A random file has the right header with probability $1/256^4 = 1/4{,}29{,}49{,}67{,}296$, and the number of tries until the first success is geometric with mean $256^4$, about 4.3 billion files.
    - question:
        id: work-finding
        type: choice
        system: s2
        prompt: |
          Priya's overnight fuzzing run reports a crash in an image decoder on a 4 KB input. What should she do first?
        options:
          - "Minimise the input to the few bytes that still crash, and keep it as a regression test before fixing the bug."
          - "Fix whatever looks wrong near the crash and rerun the fuzzer with a new seed."
          - "Ignore it unless it happens again tomorrow."
          - "Add a try block around the decoder that returns an empty image on any exception."
        answer: 0
        explanation: |
          A minimised input shows the cause and becomes a test that proves the fix and guards it for ever. Rerunning with a new seed may never hit the bug again; ignoring a reproducible crash wastes the finding; and swallowing every exception hides this bug and every future one.
  connections:
    - text: |
        About 4.3 billion. A random file has the right 4-byte header once in $256^4 = 4{,}29{,}49{,}67{,}296$ tries, so the fuzzer spends almost all its time being rejected at the door. A fuzzer that keeps inputs reaching new code gets through a header checked byte by byte in a few thousand inputs, and then spends its millions on the code behind it.

        Fuzzing finishes the testing toolkit: examples pin down behaviour, properties generalise it, fakes and seeds make it repeatable, and fuzzers search the inputs nobody thought to write. The first code that a fuzzer usually meets in a language implementation is the part that splits raw text into words and symbols, which is where the next cluster begins, in [[s7.tokenising]]. Treating outside input as hostile, the attitude a fuzzer takes, returns in [[r2.validating-input]]; and the habit of recording seeds and corpora so that runs can be compared returns in [[m1.experiments-as-data]].
