        explanation: |
          Make one generator from the seed, and for each run draw a length and then that many characters. Call the target inside `try`: a `ValueError` is a clean rejection and the loop moves on, and any other exception is returned with its type's name. Treating `ValueError` as a crash reports correct behaviour as a bug; starting lengths at 1 never tries the empty string, a favourite crash; and drawing one length for every run tests only strings of that length.
    - question:
        id: fix-time-parser
        type: code
        mode: find-bug
        system: s2
        prompt: |
          The fuzzer found that `minutes(":")` raises `IndexError` instead of rejecting the input. The program should print five lines, from `07:45 465` to `24:00 rejected`. Its second line is `0:05 rejected`, a second bug, and then it crashes. Fix both without letting anything but `ValueError` escape.
        starter: |
          def minutes(text):
              # "7:45" or "07:45" -> 465: one or two digits of hours from 0 to 23, a
              # colon, and exactly two digits of minutes from 00 to 59. Anything else
              # must raise ValueError, never any other exception.
