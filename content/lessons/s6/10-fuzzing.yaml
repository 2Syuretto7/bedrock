concept: s6.fuzzing
minutes: 80
claim: You can fuzz code that reads untrusted input, feeding it huge numbers of generated inputs and treating any failure other than a clean rejection as a bug; write a seeded fuzz harness; explain why random bytes rarely get past headers and checksums, and how mutating real samples, generating from a grammar, and keeping inputs that reach new code each get deeper; estimate the inputs a check costs a fuzzer; and turn a crash into a fix by minimising it, keeping it as a regression test, and using round-trip and differential oracles to catch wrong answers as well as crashes.
recalls: [s6.deterministic-tests-seeds-clocks-and-fakes]
uses: [s6.property-based-testing, s6.coverage-and-mutation-testing, s6.oracles-and-invariants, s6.what-a-test-can-prove, s4.errors-as-part-of-the-design, s1.exceptions, h0.characters-unicode-and-utf-8, f4.expectation-and-linearity, f4.common-discrete-distributions]
leads: [s7.tokenising, r2.validating-input, d0.interleavings-and-race-conditions, m1.experiments-as-data]
starter: |
  # Scratch space. Throw random strings at a parser and count what happens.
  import random

  rng = random.Random(1)
  outcomes = {}
  for _ in range(1000):
      text = "".join(rng.choice("0123456789:") for _ in range(rng.randint(0, 5)))
      try:
          int(text)
          result = "parsed"
      except ValueError:
          result = "rejected"
      outcomes[result] = outcomes.get(result, 0) + 1
  print(outcomes)
parts:
  recall:
    - text: |
        [[s6.deterministic-tests-seeds-clocks-and-fakes]] made random inputs replayable: seed every generator, log the seed, and a failure can be rerun at will. This lesson takes that idea to its extreme. Instead of a few hundred generated cases checked against careful properties, a fuzzer throws millions of inputs at code and watches for anything going wrong. Three quick pulls first.
  puzzle:
    - text: |
        A photo-upload service checks that every file begins with a particular 4-byte header, and rejects anything else before any of its interesting code runs. A fuzzer sends it files made of random bytes. Each byte has 256 possible values, all equally likely.

        **On average, how many random files must the fuzzer send before one gets past the header check?**
  intuition:
    - text: |
        A suitcase lock has four wheels of ten digits each. Trying combinations blindly means up to 10,000 attempts, about 5,000 on average. Now imagine a cheap lock that clicks softly whenever the first wheel is right, then again when the second is right, and so on. Turn the first wheel until it clicks, keep it, turn the second, and the lock opens in at most 40 turns. The click changes the search from guessing four digits at once to guessing one digit four times.

        A program that checks its input step by step gives a fuzzer the same kind of click, if the fuzzer listens: an input that gets one byte further through the check reaches code that no earlier input reached. The figure compares random bytes with a fuzzer that keeps every input reaching new code and builds on it. Change the length of the header and the number of inputs.
    - figure: fuzz-header
      props: { bytes: 4, budget: 4 }
    - text: |
        Random bytes pay for the whole header at once: every extra byte multiplies the cost by 256, so 4 bytes cost billions of inputs. The fuzzer that listens for the click pays for one byte at a time, so each extra byte adds roughly the same cost again. That difference, multiplying against adding, is why modern fuzzers measure which code each input reaches.
  derivation:
    - text: |
        **What fuzzing is.** **Fuzzing** means running code on very large numbers of generated inputs, often malformed ones, and reporting any input that makes it misbehave. The targets are programs that read data from outside: parsers, file and image decoders, network protocol handlers, anything that takes text from a form. That data can come from an attacker, so every crash is a possible security hole, the subject of [[r2.validating-input]].

        The oracle is deliberately cheap, because it has to run millions of times. It asks only whether the program misbehaved: a crash, an exception it was not meant to raise, a hang, a broken assertion inside the code. A parser that meets garbage should reject it cleanly, in Python by raising the `ValueError` its documentation promises, the design of [[s4.errors-as-part-of-the-design]]. An `IndexError` or a `KeyError` escaping from deep inside means the code met a case its author never imagined.

        The piece of code that connects a fuzzer to its target is the **harness**: it takes one generated input, calls the target, and sorts the outcome into clean or crash. Like every test in this cluster, it should be deterministic, so the same input always takes the same path; otherwise the fuzzer cannot tell what an input really did, and a crash cannot be replayed.
    - question:
        id: derivation-report
        type: choice
        system: s2
        prompt: |
          A fuzz harness calls a date parser that is documented to raise `ValueError` for bad input. Which outcome should it report as a bug?
        options:
          - "An `IndexError` raised from inside the parser"
          - "A `ValueError` saying the month is out of range"
          - "A correct date returned for a valid input"
          - "A `ValueError` for an empty string"
        answer: 0
        explanation: |
          `ValueError` is the parser's promised way of saying no, so those inputs were handled. An `IndexError` means the code indexed past the end of something it assumed was there, an unhandled case and possibly a security problem.
    - text: |
        **Where the inputs come from.** There are three main ways to make inputs, and serious fuzzers mix them.

        - **Random** inputs, bytes or characters drawn at random. Cheap and unbiased, and almost always rejected at the first check.
        - **Mutation-based** inputs, made by taking real samples, a **seed corpus** of valid files, and changing them: flipping bits, replacing bytes, inserting or deleting runs, splicing two samples together. Starting from a valid file means most of its structure survives each change.
        - **Generation-based** inputs, built from a description of the format, often a grammar that says which pieces may follow which. They get deep into the program, but only along paths the description allows.

        Random inputs die at two kinds of gate. A **magic number**, a fixed header such as the first bytes of every image file, costs $256^k$ tries for $k$ bytes. A **checksum**, a value computed from the rest of the file, is right for only one value in 256 per byte, so almost every mutated file is rejected for a bad checksum before anything interesting runs. Harnesses often recompute the checksum after mutating, or turn the check off in the build being fuzzed.
    - question:
        id: derivation-checksum
        type: numeric
        system: s2
        prompt: |
          A file format ends with a 1-byte checksum of everything before it. A fuzzer mutates valid files at random without fixing the checksum. Roughly what percentage of mutated files still pass the checksum?
        answer: "0.39"
        tolerance: "0.02"
        explanation: |
          After a change, the stored checksum is effectively a random byte compared with the new correct one, a match with probability $1/256 \approx 0.0039$, or 0.39%. The other 99.6% of the fuzzer's effort dies at the checksum.
    - text: |
        **Coverage guidance.** The breakthrough of modern fuzzers is to measure which parts of the program each input reaches, the coverage of [[s6.coverage-and-mutation-testing]], and to use it as the click of the lock. The fuzzer keeps a corpus. On each step it picks an input from the corpus, mutates it, and runs the target. If the new input reaches a branch that no earlier input reached, it joins the corpus; otherwise it is thrown away. Inputs that crash are saved as findings.

        This is a search that keeps its progress. An input that gets one byte further through a header is kept, and its children start from there. A header checked byte by byte costs roughly one byte's worth of guessing per byte, instead of all of them at once. The same happens deeper in: a kept input that reaches the code for one kind of record becomes the parent of inputs that explore that code. Coverage-guided fuzzers run for hours or days, millions of inputs per hour, and public fuzzing services that run them continuously on open-source projects have reported tens of thousands of bugs.
    - question:
        id: derivation-loop
        type: order
        system: s2
        prompt: |
          Put the steps of one round of a coverage-guided fuzzer in order.
        steps:
          - "Pick an input from the corpus."
          - "Mutate it into a new input."
          - "Run the target on the new input, recording the branches it reaches."
          - "If it crashed, save it as a finding."
          - "If it reached a branch never reached before, add it to the corpus."
        explanation: |
          The corpus supplies a parent, mutation makes a child, the instrumented run measures it, and the two checks decide whether it is a bug, a new stepping stone, or neither.
    - text: |
        **From crash to fix.** A raw finding is often a long, ugly input: 4 KB of mangled bytes. The first job is to **minimise** it, removing pieces as long as the crash still happens, the same shrinking as in [[s6.property-based-testing]], until a few bytes remain that a person can read. Many findings turn out to be the same bug, so fuzzers group them by where they crashed. The minimised input then becomes an ordinary unit test, run on every merge, so the fix can never quietly undo itself.

        Crashes are only the bugs that announce themselves. Two cheap oracles let a fuzzer catch wrong answers too. A **round-trip** oracle checks that turning a parsed value back into text and parsing it again gives the same value. A **differential** oracle runs two implementations of the same thing, an old parser and a new one, or two libraries, on every input and reports any disagreement, one of the oracles of [[s6.oracles-and-invariants]]. Neither needs to know the right answer; each only needs two things that ought to agree.
    - question:
        id: derivation-differential
        type: choice
        system: s2
        prompt: |
          A team is replacing a slow fare-rule parser with a fast new one. What is the cheapest way to fuzz the new parser for wrong answers, not just crashes?
        options:
          - "Run both parsers on every generated input and report any input where their results differ"
          - "Write down the correct result for each of a million generated inputs"
          - "Fuzz only for crashes, since wrong answers cannot be detected"
          - "Run the new parser twice on each input and compare"
        answer: 0
        explanation: |
          The old parser is an oracle that already exists. Any disagreement is a bug in one of them, worth a look either way. Running one parser twice only checks determinism, and writing down a million answers by hand is impossible.
  formal:
    - text: |
        **Fuzzing.** Running a target on very many generated inputs and reporting any that make it misbehave: a crash, an unexpected exception, a hang or a failed assertion.

        **Harness.** The code that feeds one input to the target and classifies the outcome. Clean rejections, such as a documented `ValueError`, are not bugs.

        **Input sources.** Random; mutation of a seed corpus; generation from a grammar or other description of the format.

        **Gates.** A $k$-byte magic number costs random inputs about $256^k$ tries; a 1-byte checksum passes about 1 in 256 mutated inputs.

        **Coverage-guided fuzzing.** Mutate inputs from a corpus, and add a new input to the corpus whenever it reaches a branch no earlier input reached.

        **After a finding.** Minimise the input, group findings by crash site, and keep the minimised input as a regression test. Round-trip and differential oracles detect wrong answers as well as crashes.
  drill:
    - text: Seconds each. For every input, ask whether the program said no properly.
    - question:
        id: drill-keep
        type: choice
        system: s1
        prompt: |
          Which inputs does a coverage-guided fuzzer add to its corpus?
        options:
          - "Inputs that reach a branch no earlier input reached"
          - "Every input it generates"
          - "Only inputs that the target accepts"
          - "Only inputs that crash the target"
        answer: 0
        explanation: New coverage is the click; inputs that reach nothing new are thrown away, and crashing inputs are saved separately as findings.
    - question:
        id: drill-night
        type: numeric
        system: s1
        prompt: |
          A fuzzer runs 2,000 inputs a second. How many inputs does it try in a 12-hour night?
        answer: "86400000"
        explanation: $2{,}000 \times 12 \times 3{,}600 = 8{,}64{,}00{,}000$ inputs, which is why a cheap oracle matters.
    - question:
        id: predict-two-bytes
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(256 ** 2)
        output: "65536"
        explanation: A 2-byte magic number has 65,536 possible values, so random inputs pass it about once in 65,536 tries.
    - question:
        id: predict-error-name
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          try:
              "07"[5]
          except Exception as error:
              print(type(error).__name__)
        output: "IndexError"
        explanation: Indexing past the end of a string raises `IndexError`, the kind of exception a harness reports as a crash.
  work:
    - text: Slower now. Build a fuzzer, fix what it finds, then make it listen for the click.
    - question:
        id: write-harness
        type: code
        mode: write
        system: s2
        prompt: |
          Write `fuzz`, a seeded harness that throws random strings at a target and reports the first crash. The program fuzzes a time parser and should print `(':', 'IndexError')`.
        starter: |
          import random


          def fuzz(target, alphabet, seed, runs, max_len):
              # Call target on `runs` random strings, using rng = random.Random(seed).
              # For each string, draw its length with rng.randint(0, max_len), then
              # each character with rng.choice(alphabet). A ValueError means the input
              # was rejected cleanly, which is fine. Any other exception is a crash:
              # return (input, name of the exception's type) for the first crash, or
              # None if nothing crashed.
              return None


          def minutes(text):
              # "7:45" or "07:45" -> 465. Anything else should raise ValueError.
              parts = text.split(":")
              if len(parts) != 2:
                  raise ValueError("expected one colon")
              hours, mins = parts
              if hours[0] == "0":
                  hours = hours[1:]
              if not (hours.isdigit() and mins.isdigit() and len(mins) == 2):
                  raise ValueError("expected digits")
              if int(hours) > 23 or int(mins) > 59:
                  raise ValueError("out of range")
              return int(hours) * 60 + int(mins)


          print(fuzz(minutes, "0123456789:", 7, 1000, 5))
        solution: |
          import random


          def fuzz(target, alphabet, seed, runs, max_len):
              # Call target on `runs` random strings, using rng = random.Random(seed).
              # For each string, draw its length with rng.randint(0, max_len), then
              # each character with rng.choice(alphabet). A ValueError means the input
              # was rejected cleanly, which is fine. Any other exception is a crash:
              # return (input, name of the exception's type) for the first crash, or
              # None if nothing crashed.
              rng = random.Random(seed)
              for _ in range(runs):
                  n = rng.randint(0, max_len)
                  text = "".join(rng.choice(alphabet) for _ in range(n))
                  try:
                      target(text)
                  except ValueError:
                      pass
                  except Exception as error:
                      return text, type(error).__name__
              return None


          def minutes(text):
              # "7:45" or "07:45" -> 465. Anything else should raise ValueError.
              parts = text.split(":")
              if len(parts) != 2:
                  raise ValueError("expected one colon")
              hours, mins = parts
              if hours[0] == "0":
                  hours = hours[1:]
              if not (hours.isdigit() and mins.isdigit() and len(mins) == 2):
                  raise ValueError("expected digits")
              if int(hours) > 23 or int(mins) > 59:
                  raise ValueError("out of range")
              return int(hours) * 60 + int(mins)


          print(fuzz(minutes, "0123456789:", 7, 1000, 5))
        tests: |
          def _ref(_t, _a, _seed, _runs, _max):
              _r = random.Random(_seed)
              for _ in range(_runs):
                  _n = _r.randint(0, _max)
                  _s = "".join(_r.choice(_a) for _ in range(_n))
                  try:
                      _t(_s)
                  except ValueError:
                      pass
                  except Exception as _e:
                      return _s, type(_e).__name__
              return None


          def _clean(_s):
              raise ValueError("rejected")


          assert fuzz(_clean, "ab", 1, 300, 4) is None, "A target that only ever raises ValueError never crashes, so fuzz should return None"


          def _empty(_s):
              if _s == "":
                  return {}["missing"]
              raise ValueError("rejected")


          _got = fuzz(_empty, "ab", 3, 200, 4)
          assert _got == ("", "KeyError"), "A target that crashes only on the empty string should be caught with ('', 'KeyError'), since lengths start at 0; got " + repr(_got)


          def _three(_s):
              if len(_s) == 3:
                  return 1 // 0
              return len(_s)


          for _seed in [1, 2, 3, 4, 5]:
              _got = fuzz(_three, "abc", _seed, 100, 6)
              assert _got is not None and len(_got[0]) == 3 and _got[1] == "ZeroDivisionError", "With seed " + str(_seed) + ", a target that crashes on every string of length 3 should be caught; got " + repr(_got)


          def _xy(_s):
              if "x" in _s:
                  return [][0]
              if "y" in _s:
                  return {}["y"]
              raise ValueError("rejected")


          for _seed in [10, 11, 12]:
              _want = _ref(_xy, "xyz", _seed, 50, 3)
              _got = fuzz(_xy, "xyz", _seed, 50, 3)
              assert _got == _want, "With seed " + str(_seed) + ", the first crash is " + repr(_want) + ", but fuzz returned " + repr(_got)
              assert fuzz(_xy, "xyz", _seed, 50, 3) == _got, "The same seed should give the same result every time"
          assert output.strip() == "(':', 'IndexError')", "The program should print (':', 'IndexError')"
