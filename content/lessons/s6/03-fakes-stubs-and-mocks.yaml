        explanation: |
          Each check gets its own store and its own `try`, so that one failure or unexpected exception marks only that check as failed. Sharing one store makes later checks trip over earlier bookings, so a correct store fails; accepting any `SeatTaken` without checking the holder passes a store that overwrites before refusing; and without the outer `try`, a store whose `cancel` raises crashes the whole contract run instead of failing one check.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          In the puzzle, the suite makes 300 independent calls, each failing 1 time in 200. What is the chance, in per cent, that a run sees no network failure at all?
        answer: "22"
        tolerance: "0.5"
        explanation: |
          Each call succeeds with probability $0.995$, so all 300 do with probability $0.995^{300} \approx 0.222$, about 22%. Nearly four runs in five fail for reasons that have nothing to do with the code.
    - question:
        id: work-mock-breaks
        type: choice
        system: s2
        prompt: |
          Rohit tidies `place_order` so that it saves the order before charging the card instead of after, with an outcome that is identical in every case. Forty tests fail, all of them because a mock expected the calls in the old order. What should the team take from this?
        options:
          - "The tests check how the code works instead of what it achieves; rewrite most of them to check the resulting state, keeping interaction checks only where the order of calls is itself a requirement."
          - "Rohit's change must be wrong, since forty tests fail."
          - "Update the forty mocks to expect the new order and move on."
          - "Delete the forty tests, since they were never useful."
        answer: 0
        explanation: |
          A correct change that breaks forty tests is a sign of tests tied to implementation. Updating the mocks fixes today and repeats the problem at the next refactor; deleting them loses whatever they did check. Checking state keeps the protection without the brittleness.
  connections:
    - text: |
        About 22%. Each call survives with probability 0.995, and all 300 together with probability $0.995^{300} \approx 0.22$. Nearly four runs in five would fail through no fault of the code, after four minutes of waiting each time. That is why unit tests use doubles, and why the real service is exercised in fewer, deliberate tests whose failures are investigated rather than shrugged off.

        Doubles make each test fast and controlled, but each test still checks the handful of cases somebody thought of. The next step is to let the computer invent the cases, hundreds of them, and check a rule that must hold for all of them: [[s6.property-based-testing]].
