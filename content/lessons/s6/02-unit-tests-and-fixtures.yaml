          - "Rename the test so it runs first in alphabetical order."
          - "Mark the test as flaky and let the pipeline retry it."
          - "Make the test accept any number of items."
        answer: 0
        explanation: |
          The extra items come from another test through shared state, and a fresh fixture removes the dependence. Renaming makes the suite depend on order more deliberately; retrying hides the cause; and loosening the assertion stops the test from checking what it was written to check.
  connections:
    - text: |
        Eight of the 24 orders. The tests that need an empty cart, `E` and `C`, pass only where nothing has been added since the start or since `R`, and that rules out two orders in three. The code under test is the same in all 24, so the suite's verdict here measures the shuffle, not the code. With a fixture that makes a fresh cart for each test, all 24 orders pass.

        A fresh cart is easy to make. A fresh payment gateway, email service or clock is not, and a unit test should not touch the real ones at all. Replacing them with stand-ins that the test controls, and knowing which kind of stand-in to use, is [[s6.fakes-stubs-and-mocks]].
