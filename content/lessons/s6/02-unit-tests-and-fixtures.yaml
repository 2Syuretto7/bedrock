                # A fixture: returns a new cart, a list holding the given items or none.
                items.clear()
                return items


            def test_one_item():
                cart = make_cart()
                cart.append("chai")
                return len(cart)


            def test_two_items():
                cart = make_cart()
                cart.append("samosa")
                cart.append("jalebi")
                return len(cart)


            print(test_one_item(), test_two_items(), test_one_item())
          - |
            SHARED = []


            def make_cart(items=None):
                # A fixture: returns a new cart, a list holding the given items or none.
                SHARED.clear()
                if items is not None:
                    SHARED.extend(items)
                return SHARED


            def test_one_item():
                cart = make_cart()
                cart.append("chai")
                return len(cart)


            def test_two_items():
                cart = make_cart()
                cart.append("samosa")
                cart.append("jalebi")
                return len(cart)


            print(test_one_item(), test_two_items(), test_one_item())
        explanation: |
          The default list is created once, so every call returns the same list and each test sees the items of the tests before it. Default to `None` and build a new list on every call, copying any items given. Returning the caller's own list lets a test change data it does not own; clearing a shared list makes one test's cart vanish under another that still holds it; and a module-level list that is reset each time has the same problem.
    - question:
        id: write-runner
        type: code
        mode: write
        system: s2
        prompt: |
          Write `run_tests(tests, setup)`, a tiny test runner that gives each test a fresh fixture and tells passes, failures and errors apart. The program should print `[('test_overdraw', 'FAIL'), ('test_refund', 'ERROR'), ('test_spend', 'PASS'), ('test_starts_at_100', 'PASS')]`.
        starter: |
          def run_tests(tests, setup):
              # tests maps each test's name to a function that takes a fixture. Call
              # setup() afresh for every test and pass its result in. A test passes if
              # it returns normally, fails if it raises AssertionError, and is an error
              # if it raises anything else. Return (name, "PASS" / "FAIL" / "ERROR")
              # pairs in order of name.
              return []


          def new_wallet():
