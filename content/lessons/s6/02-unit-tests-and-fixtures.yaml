    - question:
        id: write-table
        type: code
        mode: write
        system: s2
        prompt: |
          Write `check_table(f, cases)`, which runs a table of cases and reports every case that does not match, including cases where an exception is expected. The program should print `[(5, 50, 62), (6, 62, 74), (10, 110, 122)]`.
        starter: |
          def check_table(f, cases):
              # cases is a list of (x, expected) pairs. Call f(x) for every case, even
              # after a failure, and return a list of (x, expected, got) for the cases
              # where got != expected. If f(x) raises an exception, got is the name of
              # its class, such as "ValueError".
              return []


          def fare(km):
              # Rs 50 covers the first 5 km; each km after that costs Rs 12.
              if km <= 0:
                  raise ValueError("distance must be positive")
              if km < 5:
                  return 50
              return 50 + 12 * (km - 4)


          cases = [(1, 50), (5, 50), (6, 62), (10, 110), (0, "ValueError")]
          print(check_table(fare, cases))
        solution: |
          def check_table(f, cases):
              # cases is a list of (x, expected) pairs. Call f(x) for every case, even
              # after a failure, and return a list of (x, expected, got) for the cases
              # where got != expected. If f(x) raises an exception, got is the name of
              # its class, such as "ValueError".
              failures = []
              for x, expected in cases:
                  try:
                      got = f(x)
                  except Exception as error:
                      got = type(error).__name__
                  if got != expected:
                      failures.append((x, expected, got))
              return failures


          def fare(km):
              # Rs 50 covers the first 5 km; each km after that costs Rs 12.
              if km <= 0:
                  raise ValueError("distance must be positive")
              if km < 5:
                  return 50
              return 50 + 12 * (km - 4)


          cases = [(1, 50), (5, 50), (6, 62), (10, 110), (0, "ValueError")]
          print(check_table(fare, cases))
        tests: |
          def _sq(x):
              if x < 0:
                  raise ArithmeticError("negative")
              return x * x


          _got = check_table(_sq, [(2, 4), (3, 10), (0, 0), (-1, "ArithmeticError"), (4, 15), (-2, 4)])
          _want = [(3, 10, 9), (4, 15, 16), (-2, 4, "ArithmeticError")]
          assert [tuple(r) for r in _got] == _want, "check_table should report " + repr(_want) + ", not " + repr(_got)
          assert list(check_table(_sq, [(1, 1), (5, 25)])) == [], "When every case passes, check_table should return an empty list"
          _lookup = {"a": 1}
