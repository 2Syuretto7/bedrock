          _want = [("a_inc", "PASS"), ("b_inc", "PASS"), ("c_bad", "FAIL"), ("d_boom", "ERROR"), ("e_key", "ERROR")]
          assert [tuple(r) for r in _got] == _want, "run_tests should return " + repr(_want) + ", not " + repr(_got)
          assert len(_made) == 5, "setup should be called once for each of the 5 tests, not " + str(len(_made)) + " times"
          assert list(run_tests({}, _setup)) == [], "With no tests, run_tests should return an empty list"
          assert output.strip() == "[('test_overdraw', 'FAIL'), ('test_refund', 'ERROR'), ('test_spend', 'PASS'), ('test_starts_at_100', 'PASS')]", "The program should print [('test_overdraw', 'FAIL'), ('test_refund', 'ERROR'), ('test_spend', 'PASS'), ('test_starts_at_100', 'PASS')]"
