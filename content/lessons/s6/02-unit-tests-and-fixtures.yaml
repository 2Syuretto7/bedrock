              assert w["balance"] >= 0, "balance went negative"


          tests = {"test_spend": test_spend, "test_starts_at_100": test_starts_at_100,
                   "test_refund": test_refund, "test_overdraw": test_overdraw}
          print(run_tests(tests, new_wallet))
        solution: |
          def run_tests(tests, setup):
              # tests maps each test's name to a function that takes a fixture. Call
              # setup() afresh for every test and pass its result in. A test passes if
              # it returns normally, fails if it raises AssertionError, and is an error
              # if it raises anything else. Return (name, "PASS" / "FAIL" / "ERROR")
              # pairs in order of name.
              results = []
              for name in sorted(tests):
                  try:
                      tests[name](setup())
                      results.append((name, "PASS"))
                  except AssertionError:
                      results.append((name, "FAIL"))
                  except Exception:
                      results.append((name, "ERROR"))
              return results


          def new_wallet():
              return {"balance": 100}


          def test_spend(w):
              w["balance"] -= 30
              assert w["balance"] == 70


          def test_starts_at_100(w):
              assert w["balance"] == 100


          def test_refund(w):
              w["balance"] += w["refund"]


          def test_overdraw(w):
              w["balance"] -= 150
              assert w["balance"] >= 0, "balance went negative"


          tests = {"test_spend": test_spend, "test_starts_at_100": test_starts_at_100,
                   "test_refund": test_refund, "test_overdraw": test_overdraw}
          print(run_tests(tests, new_wallet))
