        prompt: |
          In the puzzle, four tests `E`, `C`, `S` and `R` share one cart that is never reset between them. In how many of the 24 orders do all four pass?
        answer: "8"
        explanation: |
          `S` always passes and `R` leaves the cart empty. `E` and `C` each need an empty cart, which happens only at the start, after `R`, or after `E`. So within each stretch of the order separated by `R`, `E` must come before any adding test, and `C` must be the first adding test. Checking the 24 orders, 8 pass: ECSR, ECRS, ESRC, ERCS, CSRE, CRES, SREC and RECS.
