          All five differ with probability $\frac{1440 \times 1439 \times 1438 \times 1437 \times 1436}{1440^5} \approx 0.99307$, so a repeat has probability about 0.0069, or 0.69%.
    - question:
        id: work-generator
        type: choice
        system: s2
        prompt: |
          A property test of a fare calculator draws distances uniformly from 1 to 10,000 km and has never failed. The fare rules change at 5 km and at 100 km. What would most improve it?
        options:
          - "Bias the generator to draw often near 5 and 100 km and at the ends of the range, as well as across it"
          - "Generate a million cases instead of a thousand"
          - "Draw distances from 1 to 1,00,000 km"
          - "Replace the property with one example at 50 km"
        answer: 0
        explanation: |
          Uniform draws land within a kilometre of 5 or 100 only about 6 times in 10,000, so boundary bugs stay hidden. Biasing the generator towards boundaries finds them in a few hundred cases; more cases or a wider range spend effort where the rules do not change, and one example tests far less.
  connections:
    - text: |
        About 0.69%. Five times from 1,440 minutes all differ with probability $\frac{1440 \cdot 1439 \cdot 1438 \cdot 1437 \cdot 1436}{1440^5} \approx 0.9931$, so a hundred lists find the bug only about half the time. Drawn from ten minutes, 70% of lists collide. The property was right all along; it was the generator that decided whether anyone saw it fail.

        The strongest property of all is agreement with something you already trust: a slow, simple version of the same computation, or a rule about the state of the system that must never be broken. Using such a reference, called an oracle, and checking invariants while the system runs, is [[s6.oracles-and-invariants]]. When the generator's inputs are hostile rather than merely random, the same machinery becomes [[s6.fuzzing]].
