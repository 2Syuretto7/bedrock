    - question:
        id: write-check
        type: code
        mode: write
        system: s2
        prompt: |
          Write `check(prop, gen, n, seed)`, the loop at the heart of a property-testing library. The program should print `(73, [968, 497, 968, 833])`.
        starter: |
          import random


          def check(prop, gen, n, seed):
              # Make one generator with random.Random(seed), leaving the random
              # module's own generator alone. Generate up to n cases with gen(rng),
              # stopping at the first case for which prop is False. Return
              # (number of cases that passed, failing case or None).
              return n, None


          def merge_bookings(times):
              return sorted(set(times))


          def bookings(rng):
              return [rng.randint(0, 1439) for _ in range(rng.randint(0, 5))]


          def keeps_all(times):
              return len(merge_bookings(times)) == len(times)


          print(check(keeps_all, bookings, 1000, 42))
        solution: |
          import random


          def check(prop, gen, n, seed):
              # Make one generator with random.Random(seed), leaving the random
              # module's own generator alone. Generate up to n cases with gen(rng),
              # stopping at the first case for which prop is False. Return
              # (number of cases that passed, failing case or None).
              rng = random.Random(seed)
              for i in range(n):
                  case = gen(rng)
                  if not prop(case):
                      return i, case
              return n, None


          def merge_bookings(times):
              return sorted(set(times))


          def bookings(rng):
              return [rng.randint(0, 1439) for _ in range(rng.randint(0, 5))]


          def keeps_all(times):
              return len(merge_bookings(times)) == len(times)


          print(check(keeps_all, bookings, 1000, 42))
        tests: |
          def _ref(_prop, _gen, _n, _seed):
              _r = random.Random(_seed)
              for _i in range(_n):
                  _c = _gen(_r)
                  if not _prop(_c):
                      return _i, _c
              return _n, None


          _small = lambda r: [r.randint(0, 3) for _ in range(r.randint(0, 4))]
          _nodup = lambda xs: len(set(xs)) == len(xs)
          _always = lambda xs: True
          for _seed in [0, 1, 7, 99]:
              for _p, _g, _n in [(_nodup, _small, 50), (_always, _small, 20), (_nodup, bookings, 30)]:
                  _want = _ref(_p, _g, _n, _seed)
                  _got = check(_p, _g, _n, _seed)
                  assert tuple(_got) == _want, "With seed " + str(_seed) + ", check should return " + repr(_want) + ", not " + repr(_got)
          random.seed(2026)
          _expected_next = random.random()
          random.seed(2026)
          check(_nodup, _small, 50, 5)
          assert random.random() == _expected_next, "check must use its own random.Random(seed) and leave the random module's generator untouched"
          assert tuple(check(_nodup, _small, 0, 3)) == (0, None), "With n = 0, check should return (0, None)"
          assert output.strip() == "(73, [968, 497, 968, 833])", "The program should print (73, [968, 497, 968, 833])"
        wrong:
          - |
