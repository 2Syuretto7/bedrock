            def check(prop, gen, n, seed):
                # Make one generator with random.Random(seed), leaving the random
                # module's own generator alone. Generate up to n cases with gen(rng),
                # stopping at the first case for which prop is False. Return
                # (number of cases that passed, failing case or None).
                random.seed(seed)
