            def normalise(s):
                s = s.replace(" ", "").replace("-", "")
                if s.startswith("+91"):
                    s = s[3:]
                return s


            inputs = ["+91 98450 12345", "098450-12345", "98450 12345"]
            print([violated(normalise, s) for s in inputs])
        explanation: |
          Idempotence compares a second application with the first, not the output with the input; "ten digits" needs both the length and every character a digit; and the number to keep is the last ten digits, since prefixes such as +91 or 0 come first. The normaliser fails on "098450-12345" because it never removes the leading 0.
