    - question:
        id: write-properties
        type: code
        mode: write
        system: s2
        prompt: |
          Write `violated(f, s)`, which checks three properties of a phone-number normaliser on one input and names those that fail. The program should print `[[], ['ten digits', 'keeps the number'], []]`.
        starter: |
          def violated(f, s):
              # f normalises an Indian mobile number written in any style. Return the
              # names of the properties f breaks on input s, in this order:
              #   "idempotent": f(f(s)) == f(s)
              #   "ten digits": f(s) is 10 characters long, every one a digit
              #   "keeps the number": f(s) equals the last 10 digits that appear in s
              return []


          def normalise(s):
              s = s.replace(" ", "").replace("-", "")
              if s.startswith("+91"):
                  s = s[3:]
              return s


          inputs = ["+91 98450 12345", "098450-12345", "98450 12345"]
          print([violated(normalise, s) for s in inputs])
        solution: |
          def violated(f, s):
              # f normalises an Indian mobile number written in any style. Return the
              # names of the properties f breaks on input s, in this order:
              #   "idempotent": f(f(s)) == f(s)
              #   "ten digits": f(s) is 10 characters long, every one a digit
              #   "keeps the number": f(s) equals the last 10 digits that appear in s
              out = f(s)
              broken = []
              if f(out) != out:
                  broken.append("idempotent")
              if not (len(out) == 10 and all(c.isdigit() for c in out)):
                  broken.append("ten digits")
              digits = "".join(c for c in s if c.isdigit())
              if out != digits[-10:]:
                  broken.append("keeps the number")
              return broken


          def normalise(s):
              s = s.replace(" ", "").replace("-", "")
              if s.startswith("+91"):
                  s = s[3:]
              return s


          inputs = ["+91 98450 12345", "098450-12345", "98450 12345"]
          print([violated(normalise, s) for s in inputs])
        tests: |
          def _good(s):
              d = "".join(c for c in s if c.isdigit())
              return d[-10:]


          def _letters(s):
              return s.replace(" ", "")


          def _grows(s):
              return "0" + s


          _cases = [
              (_good, "+91 98450 12345", []),
              (_good, "98450-12345", []),
              (_letters, "98450 1234x", ["ten digits", "keeps the number"]),
              (_grows, "9845012345", ["idempotent", "ten digits", "keeps the number"]),
              (_letters, "9845012345", []),
              (_good, "12345", ["ten digits"]),
              (lambda s: "9999999999", "98450 12345", ["keeps the number"]),
          ]
          for _f, _s, _want in _cases:
              _got = violated(_f, _s)
              assert list(_got) == _want, "For input " + repr(_s) + " and output " + repr(_f(_s)) + ", the broken properties should be " + repr(_want) + ", not " + repr(_got)
          assert output.strip() == "[[], ['ten digits', 'keeps the number'], []]", "The program should print [[], ['ten digits', 'keeps the number'], []]"
        wrong:
