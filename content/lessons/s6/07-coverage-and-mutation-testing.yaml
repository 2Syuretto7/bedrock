    - question:
        id: write-smallest
        type: code
        mode: write
        system: s2
        prompt: |
          Write `smallest_suite(kills)`, which picks tests greedily until every mutant that any test kills has been killed. The program should print `['500 gives 500', '1000 gives 900']`.
        starter: |
          def smallest_suite(kills):
              # kills maps each test's name to the set of mutants it kills. Choose
              # tests greedily: repeatedly take the test that kills the most mutants
              # not yet killed, breaking ties by name, until no test kills anything
              # new. Return the chosen names in the order chosen.
              return sorted(kills)


          kills = {
              "types only": set(),
              "1500 gives 1350": {"0.8 for 0.9", "<= for >="},
              "1000 gives 900": {"> for >=", "0.8 for 0.9"},
              "500 gives 500": {"100 for 1000", "0 for a", "<= for >="},
              "999 gives 999": {"100 for 1000"},
          }
          print(smallest_suite(kills))
        solution: |
          def smallest_suite(kills):
              # kills maps each test's name to the set of mutants it kills. Choose
              # tests greedily: repeatedly take the test that kills the most mutants
              # not yet killed, breaking ties by name, until no test kills anything
              # new. Return the chosen names in the order chosen.
              killed = set()
              chosen = []
              while True:
                  best = None
                  gain = 0
                  for name in sorted(kills):
                      new = len(kills[name] - killed)
                      if new > gain:
                          best = name
                          gain = new
                  if best is None:
                      return chosen
                  chosen.append(best)
                  killed = killed | kills[best]


          kills = {
              "types only": set(),
              "1500 gives 1350": {"0.8 for 0.9", "<= for >="},
              "1000 gives 900": {"> for >=", "0.8 for 0.9"},
              "500 gives 500": {"100 for 1000", "0 for a", "<= for >="},
              "999 gives 999": {"100 for 1000"},
          }
          print(smallest_suite(kills))
        tests: |
          _cases = [
              ({"a": {1, 2}, "b": {3}, "c": {2, 3}}, ["a", "b"]),
              ({"x": {1, 2, 3, 4}, "y": {1, 2, 3, 5}, "z": {4, 5}}, ["x", "y"]),
              ({"t1": {1, 2, 3}, "t2": {1, 2, 3, 4}, "t3": {5}}, ["t2", "t3"]),
              ({"p": set(), "q": set()}, []),
              ({"m": {1}, "n": {1}}, ["m"]),
              ({"big": {1, 2, 3, 4}, "l": {1, 2, 5}, "r": {3, 4, 6}}, ["big", "l", "r"]),
              ({"b": {1, 2}, "a": {1, 2}, "c": {3}}, ["a", "c"]),
