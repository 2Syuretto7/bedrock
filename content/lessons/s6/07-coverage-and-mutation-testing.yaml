        system: s2
        prompt: |
          In the puzzle, the test checks only that `discount(1500) > 0` and `discount(500) > 0`. How many of the five broken versions does it notice?
        answer: "1"
        explanation: |
          Only the version returning `-amount * 0.9` makes a result negative, so only it fails the test. With `>`, 0.8, 100 or `amount + 1`, both results stay positive and the test passes, despite 100% line coverage.
    - question:
        id: work-coverage-target
        type: choice
        system: s2
        prompt: |
          A manager proposes making 90% line coverage a requirement for every pull request. What is the best response?
        options:
          - "Coverage can show what is untested, but tests written to hit a number may check little; use it as a guide, and use mutation testing on critical code to see whether the tests check anything."
          - "Agree; 90% coverage means 90% of bugs are caught."
          - "Ask for 100% instead, since more is always better."
          - "Refuse to measure coverage at all, since it proves nothing."
        answer: 0
        explanation: |
          Coverage is a useful warning about untested code but a poor target, because executing a line is not checking it. Mutation testing measures checking directly, at a cost that is worth paying where bugs are expensive.
  connections:
    - text: |
        One. Every broken version except the one that returns a negative number still returns positive amounts for ₹1,500 and ₹500, so a test that checks only "greater than zero" cannot tell them from the original. The suite runs every line, and notices almost nothing. Tests at ₹999, ₹1,000 and ₹1,500 with exact expected values would kill all five.

        A suite that kills its mutants has one more way to fail its team: by failing when nothing is wrong. A test that passes and fails at random on the same code teaches everyone to ignore red runs, and a suite nobody believes protects nothing. Where such tests come from is [[s6.flaky-tests-and-their-causes]].
