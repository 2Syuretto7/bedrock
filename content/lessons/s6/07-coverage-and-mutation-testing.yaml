              "> for >=": lambda a: a * 0.9 if a > 1000 else a,
              "0.8 for 0.9": lambda a: a * 0.8 if a >= 1000 else a,
              "100 for 1000": lambda a: a * 0.9 if a >= 100 else a,
              "0 for a": lambda a: a * 0.9 if a >= 1000 else 0,
              "<= for >=": lambda a: a * 0.9 if a <= 1000 else a,
