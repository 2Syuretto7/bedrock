              ("x + y + z", {"+": "-"}, ["x - y + z", "x + y - z"]),
              ("a < b", {"<": "<=", "*": "/"}, ["a <= b"]),
              ("n", {"+": "-"}, []),
              ("p * q < r * s", {"*": "/", "<": ">"}, ["p / q < r * s", "p * q < r / s", "p * q > r * s"]),
              ("1 == 1 == 1", {"==": "!="}, ["1 != 1 == 1", "1 == 1 != 1"]),
          ]
          for _src, _sw, _want in _cases:
              _got = mutants(_src, dict(_sw))
              assert list(_got) == _want, "mutants(" + repr(_src) + ", " + repr(_sw) + ") should be " + repr(_want) + ", not " + repr(_got)
          assert output.strip() == "3\nif a >= 10 and b > 20: total = a * 2", "The program should print 3, then the mutant that changes only the second >="
