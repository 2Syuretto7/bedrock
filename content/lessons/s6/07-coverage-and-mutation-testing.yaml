          print(mutation_report(mutants, tests))
        solution: |
          def mutation_report(mutants, tests):
              # mutants maps a name to a mutated version of a function. tests is a
              # list of (x, expected) pairs. A mutant is killed if, for some test,
              # calling it on x raises an exception or returns something other than
              # expected. Return (sorted killed names, sorted surviving names, score),
              # where score is the percentage killed, rounded to a whole number.
              killed = []
              for name, f in mutants.items():
                  for x, expected in tests:
                      try:
                          dead = f(x) != expected
                      except Exception:
                          dead = True
                      if dead:
                          killed.append(name)
                          break
              survived = [name for name in mutants if name not in killed]
              score = round(100 * len(killed) / len(mutants)) if mutants else 0
              return sorted(killed), sorted(survived), score


