        explanation: |
          Each round, count only the mutants a test would newly kill, take the best, breaking ties by the first name, and stop when no test adds anything. Sorting once by total kills keeps tests that add nothing new; letting a later name win ties breaks the tie rule; and counting total kills instead of new ones prefers a test whose mutants are already dead.
