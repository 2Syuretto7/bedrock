            print(first_divergence(ops, RowStore, Model))
        explanation: |
          Make one real store and one model before the loop, so that state builds up in both, and compare each operation's two results. Making new objects for every operation never builds the state that exposes the bug; remembering the last divergence instead of the first points past the operation that went wrong; and applying each operation a second time to report its results changes the very state being compared.
