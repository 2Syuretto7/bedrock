concept: s6.oracles-and-invariants
minutes: 80
claim: You can find a way to judge a program's answers even when nobody can work them out by hand, by comparing with a simple reference implementation or an earlier version, by checking relations between answers that must hold whatever the true values are, and by checking a system's invariants after every step; and you can test a stateful component by running random sequences of operations against it and against a simple model side by side.
recalls: [s6.property-based-testing]
uses: [s2.heaps-and-priority-queues, s3.shortest-paths, f2.loop-invariants, s4.designing-with-types-and-invariants, s6.fakes-stubs-and-mocks]
leads: [s6.integration-and-end-to-end-tests, s6.fuzzing, r6.model-checking-by-state-exploration, r6.checking-histories-for-linearisability, r6.deterministic-simulation-testing]
starter: |
  # Scratch space. A fast answer checked against a slow, obvious one.
  import random

  rng = random.Random(3)
  xs = [rng.randint(0, 99) for _ in range(20)]
  fast = sorted(xs)[-3:][::-1]
  slow = []
  pool = list(xs)
  for _ in range(3):
      slow.append(max(pool))
      pool.remove(max(pool))
  print(fast, slow, fast == slow)
parts:
  recall:
    - text: |
        [[s6.property-based-testing]] checked rules that every output must satisfy, on inputs the computer invented. Its strongest kind of property was saved for this lesson: agreement with something already trusted. Most of the hard problems in testing come down to one question, how do you know what the right answer is? Three quick pulls first.
  puzzle:
    - text: |
        A route planner reports shortest road distances. It says Bengaluru to Mysuru is 145 km, Mysuru to Ooty is 125 km, and Bengaluru to Ooty is 310 km. You have no map and no other planner to compare with.

        **By at least how many kilometres, in total, must the planner's answers be wrong?**
  intuition:
    - text: |
        A shopkeeper counting the day's takings cannot know the right total in advance; that is what the counting is for. But some checks need no answer key. The cash in the drawer plus the UPI receipts must equal the sum of the bills printed. The number of biscuit packets sold plus those still on the shelf must equal the morning's stock. If either fails, something is wrong, even though nobody knows the correct figure for anything.

        Programs can be checked the same way. The figure shows three distances from a route planner. A shortest distance can never be longer than a detour through a third city. Choose what the planner says for Pune to Nashik.
    - figure: triangle-check
      props: { pn: 280 }
    - text: |
        At 280 or 315 km, the three answers are consistent; at 340 or 480 they are not, and the size of the inconsistency is a floor on how wrong the planner is. The check cannot say which answer is wrong, or whether a consistent set of answers is right. But it caught a bug without knowing a single true distance. Checks like this, which compare answers with each other instead of with a known truth, are among the most useful tools in testing.
  derivation:
    - text: |
        **The oracle problem.** Every test needs an **oracle**, a way of deciding whether an output is correct. For a function that adds GST to a price, the oracle is a hand calculation. For a route planner over a million roads, a search engine's ranking, a compiler's optimised code or a weather simulation, nobody can compute the right answer independently, and that is exactly why the program was written. This lesson collects the ways to test such programs anyway.

        **Reference implementations.** Often a slow, simple program computes the same thing as a fast, clever one. Trying every path in a small graph gives the true shortest distance that the fast algorithm of [[s3.shortest-paths]] must match; `sorted(xs)[:k]` is an obvious oracle for a fast `smallest_k`; a dictionary is an obvious oracle for a hand-built hash table or tree. The reference only needs to be right, not fast, so it can be checked on small inputs generated by the thousand. Comparing two implementations in this way is called **differential testing**, and the other implementation can also be yesterday's version of the same program, so that a refactor must change nothing, or a different program altogether, such as a second compiler.
    - question:
        id: derivation-reference
        type: choice
        system: s2
        prompt: |
          A team writes a fast `top_k(xs, k)` that returns the k largest values, largest first, using a heap. What is the best oracle for property tests of it?
        options:
          - "sorted(xs, reverse=True)[:k], on many small random lists"
          - "A few lists with answers worked out by hand"
          - "top_k itself, run twice to check it gives the same answer"
          - "Checking only that the output has k items"
        answer: 0
        explanation: |
          Sorting is slow for huge lists but obviously correct, so it can judge thousands of generated cases. Hand-worked examples are too few; running `top_k` twice checks only that it is repeatable; and a length check passes a function that returns the wrong items.
    - text: |
        **Relations between answers.** When there is no reference, some relations must still hold among the outputs. Shortest distances satisfy the triangle rule, $d(a, c) \le d(a, b) + d(b, c)$, and on two-way roads they are symmetric. Changing the input in a known way changes the output in a known way: a search with an extra filter returns a subset of the results; shuffling a list does not change its sum; doubling every quantity in a cart doubles the total before discounts; a translation of a document and its translation back should mean roughly the same. These are called **metamorphic relations**, and each one is a property that needs no oracle at all.
    - question:
        id: derivation-metamorphic
        type: choice
        system: s2
        prompt: |
          `search(query, filters)` returns matching buses. Which relation must hold whatever the right results are?
        options:
          - "Adding a filter, such as AC only, never adds a bus that was not in the results without it"
          - "Every search returns at least one bus"
          - "Results always come back in alphabetical order"
          - "A longer query always returns more buses"
        answer: 0
        explanation: |
          A filter can only narrow the results, so the filtered set must be a subset of the unfiltered one. The others are not guaranteed by the meaning of search at all.
    - text: |
        **Invariants.** A system's state obeys rules at all times: the heap property of [[s2.heaps-and-priority-queues]], the ordering of a search tree, seats booked never exceeding a bus's capacity, a ledger's debits equalling its credits. Where possible, types make broken states impossible, as in [[s4.designing-with-types-and-invariants]]; where not, a `check_invariants()` function states the rules in code. Tests call it after every operation, so that a broken rule is caught at the step that broke it, not ten steps later when some answer finally comes out wrong. Loop invariants from [[f2.loop-invariants]] are the same idea inside one function, and cheap invariants are worth asserting in production code too, failing loudly instead of corrupting data quietly.
    - question:
        id: derivation-heap-checks
        type: numeric
        system: s2
        prompt: |
          A complete invariant check of a binary min-heap compares every item except the root with its parent. How many comparisons does it make for a heap of 1,000 items?
        answer: "999"
        explanation: |
          Each of the 999 non-root items has exactly one parent, so there are 999 comparisons. Checking after every operation in a test multiplies that by the number of operations, which is affordable for the small heaps tests use.
    - text: |
        **Model-based testing.** A component with state, such as a booking store, a cache or a queue, is tested by generating a random sequence of operations and applying each one both to the real component and to a **model**: a tiny, obviously correct version, often just a dictionary or a list, used as a fake in [[s6.fakes-stubs-and-mocks]]. After every operation the results are compared, and invariants are checked. The first divergence pinpoints the operation where the real component went wrong, and shrinking the sequence of operations, as property tests shrink inputs, reduces a failing run of hundreds of operations to the three or four that matter. Some of the most serious bugs in databases and distributed systems have been found exactly this way.

        **Choosing among oracles.** The kinds of oracle differ in strength and cost. A reference implementation is the strongest, since it says exactly what the answer should be, but it must exist and must itself be right. An earlier version catches every change, intended or not, so each difference needs a person to judge it. Metamorphic relations and invariants are weaker, since they catch only answers that are inconsistent, but they are cheap to state and need no second program. Good test suites use several at once: each kind catches bugs the others miss.
    - question:
        id: order-stateful
        type: order
        system: s2
        prompt: |
          Put the steps of a model-based test of a booking store in order.
        steps:
          - "Write a model: a dictionary from seat to passenger with the same operations."
          - "Generate a random sequence of book, cancel and look-up operations from a seed."
          - "Apply each operation to both the store and the model, comparing results and checking invariants after each."
          - "On the first divergence, shrink the sequence to the fewest operations that still diverge."
          - "Report the seed and the short sequence, and keep it as a regression test."
        explanation: |
          The model comes first because it is the oracle; generation feeds the comparison; shrinking needs a failing sequence; and the short sequence becomes the report and the regression test.
  formal:
    - text: |
        **Oracle.** Any means of deciding whether an output is correct: a hand-worked answer, a reference implementation, an earlier version, or a relation the outputs must satisfy.

        **Differential testing.** Running two implementations of the same specification on the same inputs and reporting any difference.

        **Metamorphic relation.** A known relation between the outputs for related inputs, such as $d(a, c) \le d(a, b) + d(b, c)$, or a filtered result being a subset of the unfiltered one.

        **Invariant.** A condition on a system's state that must hold after every operation; checked by a function called throughout tests, and asserted in production when cheap.

        **Model-based testing.** Applying random sequences of operations to the real component and to a simple model, comparing results and invariants after each step.
  drill:
    - text: Seconds each. Ask what you can check without knowing the answer.
    - question:
        id: drill-oracle
        type: choice
        system: s1
        prompt: |
          In testing, what is an oracle?
        options:
          - "Whatever decides whether an output is correct"
          - "A database used in tests"
          - "A test that never fails"
          - "The fastest implementation available"
        answer: 0
        explanation: Every test needs one, and finding one is often the hardest part.
    - question:
        id: drill-pairs
        type: numeric
        system: s1
        prompt: |
          A planner covers 5 cities. How many pairs of cities must a symmetry check compare?
        answer: "10"
        explanation: 'Each unordered pair once: $\binom{5}{2} = 10$.'
    - question:
        id: drill-double
        type: choice
        system: s1
        prompt: |
          `cart_total(items)` has no discounts. Which relation must hold?
        options:
          - "Doubling every quantity doubles the total"
          - "The total is always a round number"
          - "Adding an item never changes the total"
          - "The total equals the number of items"
        answer: 0
        explanation: With no discounts the total is a sum of price times quantity, so doubling each quantity doubles the sum.
    - question:
        id: predict-heap
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          h = [1, 4, 2, 5, 3]
          print(all(h[(i - 1) // 2] <= h[i] for i in range(1, len(h))))
        output: "False"
        explanation: The item 3 at index 4 has its parent at index 1, which holds 4, so the heap invariant fails there.
    - question:
        id: predict-symmetry
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          d = {("A", "B"): 3, ("B", "A"): 4}
          print(d[("A", "B")] == d[("B", "A")], abs(d[("A", "B")] - d[("B", "A")]))
        output: "False 1"
        explanation: The two directions disagree by 1, so on two-way roads at least one of them is wrong.
  work:
    - text: Slower now. Each problem is an oracle of some kind.
    - question:
        id: fix-heap-check
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `heap_ok` checks the min-heap invariant. The program should print `True False`. It prints `True True`. Find the fault and fix it.
        starter: |
          def heap_ok(h):
              # True if the list h satisfies the min-heap invariant: every parent at
              # index i is no larger than its children at 2 * i + 1 and 2 * i + 2.
              for i in range(len(h) // 2 - 1):
                  for c in [2 * i + 1, 2 * i + 2]:
                      if c < len(h) and h[i] > h[c]:
                          return False
              return True


          print(heap_ok([1, 3, 2, 7, 4, 5]), heap_ok([1, 3, 2, 7, 4, 0]))
        solution: |
          def heap_ok(h):
              # True if the list h satisfies the min-heap invariant: every parent at
              # index i is no larger than its children at 2 * i + 1 and 2 * i + 2.
              for i in range(len(h) // 2):
                  for c in [2 * i + 1, 2 * i + 2]:
                      if c < len(h) and h[i] > h[c]:
                          return False
              return True


          print(heap_ok([1, 3, 2, 7, 4, 5]), heap_ok([1, 3, 2, 7, 4, 0]))
        tests: |
          _cases = [
              ([], True), ([5], True), ([1, 2], True), ([2, 1], False), ([1, 1, 1], True),
              ([1, 2, 3, 4, 5, 6, 7], True), ([1, 2, 3, 4, 5, 6, 0], False), ([1, 5, 2, 4], False),
              ([0, 3, 1, 4, 5, 2, 1], True), ([1, 3, 2, 7, 4, 0], False), ([2, 2, 3, 2], True), ([1, 2, 0], False),
          ]
          for _h, _want in _cases:
              _got = heap_ok(list(_h))
              assert _got == _want, "heap_ok(" + repr(_h) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "True False", "The program should print True False"
        wrong:
          - |
            def heap_ok(h):
                # True if the list h satisfies the min-heap invariant: every parent at
                # index i is no larger than its children at 2 * i + 1 and 2 * i + 2.
                for i in range(len(h) // 2):
                    for c in [2 * i + 1, 2 * i + 2]:
                        if c < len(h) and h[i] >= h[c]:
                            return False
                return True


            print(heap_ok([1, 3, 2, 7, 4, 5]), heap_ok([1, 3, 2, 7, 4, 0]))
          - |
            def heap_ok(h):
                # True if the list h satisfies the min-heap invariant: every parent at
                # index i is no larger than its children at 2 * i + 1 and 2 * i + 2.
                for i in range(len(h) // 2):
                    c = 2 * i + 1
                    if c < len(h) and h[i] > h[c]:
                        return False
                return True


            print(heap_ok([1, 3, 2, 7, 4, 5]), heap_ok([1, 3, 2, 7, 4, 0]))
          - |
            def heap_ok(h):
                # True if the list h satisfies the min-heap invariant: every parent at
                # index i is no larger than its children at 2 * i + 1 and 2 * i + 2.
                return h[0] == min(h) if h else True


            print(heap_ok([1, 3, 2, 7, 4, 5]), heap_ok([1, 3, 2, 7, 4, 0]))
        explanation: |
          The parents are at indices 0 up to `len(h) // 2 - 1`, so the loop must run over `range(len(h) // 2)`; stopping one short never checks the last parent, which in the second heap sits above the 0. Using `>=` rejects heaps with equal items, which are valid; checking only left children misses a smaller right child; and checking that the root is the minimum misses violations deeper down.
    - question:
        id: write-divergence
        type: code
        mode: write
        system: s2
        prompt: |
          Write `first_divergence(ops, make_real, make_model)`, the heart of a model-based test. The program should print `(4, None, 'Meena')`.
        starter: |
          def first_divergence(ops, make_real, make_model):
              # Make one real store and one model, apply every operation in ops to
              # both, in order, and return (index, real result, model result) for the
              # first operation whose results differ, or None if they never differ.
              return None


          class Model:
              # Obviously correct: one dictionary from seat to passenger.
              def __init__(self):
                  self.seats = {}

              def apply(self, op):
                  if op[0] == "book":
                      if op[1] in self.seats:
                          return "taken"
                      self.seats[op[1]] = op[2]
                      return "ok"
                  if op[0] == "cancel":
                      return "ok" if self.seats.pop(op[1], None) is not None else "none"
                  return self.seats.get(op[1])


          class RowStore:
              # Faster for whole-row queries: row -> {letter: passenger}.
              def __init__(self):
                  self.rows = {}

              def apply(self, op):
                  row, letter = op[1][:-1], op[1][-1]
                  seats = self.rows.get(row, {})
                  if op[0] == "book":
                      if letter in seats:
                          return "taken"
                      seats[letter] = op[2]
                      self.rows[row] = seats
                      return "ok"
                  if op[0] == "cancel":
                      if letter in seats:
                          self.rows.pop(row)
                          return "ok"
                      return "none"
                  return seats.get(letter)


          ops = [("book", "12A", "Ravi"), ("book", "12B", "Meena"), ("holder", "12B"),
                 ("cancel", "12A"), ("holder", "12B"), ("book", "12A", "Joseph")]
          print(first_divergence(ops, RowStore, Model))
        solution: |
          def first_divergence(ops, make_real, make_model):
              # Make one real store and one model, apply every operation in ops to
              # both, in order, and return (index, real result, model result) for the
              # first operation whose results differ, or None if they never differ.
              real = make_real()
              model = make_model()
              for i, op in enumerate(ops):
                  got = real.apply(op)
                  want = model.apply(op)
                  if got != want:
                      return i, got, want
              return None


          class Model:
              # Obviously correct: one dictionary from seat to passenger.
              def __init__(self):
                  self.seats = {}

              def apply(self, op):
                  if op[0] == "book":
                      if op[1] in self.seats:
                          return "taken"
                      self.seats[op[1]] = op[2]
                      return "ok"
                  if op[0] == "cancel":
                      return "ok" if self.seats.pop(op[1], None) is not None else "none"
                  return self.seats.get(op[1])


          class RowStore:
              # Faster for whole-row queries: row -> {letter: passenger}.
              def __init__(self):
                  self.rows = {}

              def apply(self, op):
                  row, letter = op[1][:-1], op[1][-1]
                  seats = self.rows.get(row, {})
                  if op[0] == "book":
                      if letter in seats:
                          return "taken"
                      seats[letter] = op[2]
                      self.rows[row] = seats
                      return "ok"
                  if op[0] == "cancel":
                      if letter in seats:
                          self.rows.pop(row)
                          return "ok"
                      return "none"
                  return seats.get(letter)


          ops = [("book", "12A", "Ravi"), ("book", "12B", "Meena"), ("holder", "12B"),
                 ("cancel", "12A"), ("holder", "12B"), ("book", "12A", "Joseph")]
          print(first_divergence(ops, RowStore, Model))
        tests: |
          class _Forgetful(Model):
              def apply(self, op):
                  r = Model.apply(self, op)
                  if op[0] == "book" and len(self.seats) > 2:
                      self.seats.pop(op[1])
                  return r


          _cases = [
              ([("book", "1A", "x"), ("holder", "1A")], RowStore, None),
              ([("book", "1A", "x"), ("book", "1B", "y"), ("cancel", "1B"), ("holder", "1A")], RowStore, (3, None, "x")),
              ([("book", "1A", "x"), ("book", "2A", "y"), ("book", "3A", "z"), ("holder", "3A"), ("holder", "1A")], _Forgetful, (3, None, "z")),
