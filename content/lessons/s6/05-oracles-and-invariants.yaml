    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          In the puzzle, the planner says Bengaluru to Mysuru is 145 km, Mysuru to Ooty 125 km and Bengaluru to Ooty 310 km. By at least how many kilometres, in total, must its answers be wrong?
        answer: "40"
        explanation: |
          A shortest distance cannot exceed a detour, so Bengaluru to Ooty is at most $145 + 125 = 270$ km. The reported 310 is 40 km too long unless the other two answers are too short by 40 km between them; either way, the answers are wrong by at least 40 km in total.
    - question:
        id: work-no-oracle
        type: choice
        system: s2
        prompt: |
          Divya's team is rewriting the engine that ranks bus search results. Nobody can say what the perfect ranking is for any search. How should they test the new engine?
        options:
          - "Run both engines on thousands of recorded searches and investigate differences, and check relations such as filtered results being a subset of unfiltered ones."
          - "Skip testing, since there is no right answer."
          - "Check a few searches by eye and ship."
          - "Test only that the engine returns results quickly."
        answer: 0
        explanation: |
          The old engine is a differential oracle for unintended changes, and metamorphic relations catch outright bugs without any answer key. Eyeballing a few searches covers almost nothing, and speed says nothing about correctness.
  connections:
    - text: |
        Forty kilometres. A shortest distance can never exceed a detour, so Bengaluru to Ooty is at most $145 + 125 = 270$ km. The planner's 310 breaks the triangle rule by 40 km, and however the error is shared out among the three answers, they are wrong by at least that much in total. No map was needed.

        Oracles, invariants and models check components one at a time, with doubles in place of their neighbours. The bugs that remain are often between the components: a field named differently on two sides of an interface, a time zone lost on the way to the database, a page that the API serves and the app cannot read. Testing the pieces together is [[s6.integration-and-end-to-end-tests]].
