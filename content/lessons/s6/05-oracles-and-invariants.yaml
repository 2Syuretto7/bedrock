          def inconsistencies(dist, cities):
              # dist(a, b) is a route planner's shortest distance from a to b. Without
              # knowing the true distances, two rules must still hold for every pair
              # and triple of different cities:
              #   ("symmetry", a, b) is broken if dist(a, b) != dist(b, a)
              #   ("triangle", a, b, c) is broken if dist(a, c) > dist(a, b) + dist(b, c)
              # Return every broken rule as such a tuple, in sorted order. Report a
              # symmetry break once, with a before b in the order of cities.
              broken = []
              for i, a in enumerate(cities):
                  for b in cities[i + 1:]:
                      if dist(a, b) != dist(b, a):
                          broken.append(("symmetry", a, b))
              for a in cities:
                  for b in cities:
                      for c in cities:
                          if a != b and b != c and a != c and dist(a, c) > dist(a, b) + dist(b, c):
                              broken.append(("triangle", a, b, c))
              return sorted(broken)


          km = {("Pune", "Mumbai"): 150, ("Mumbai", "Nashik"): 165, ("Pune", "Nashik"): 340}


          def planner(a, b):
              return km[(a, b)] if (a, b) in km else km[(b, a)]


          print(inconsistencies(planner, ["Pune", "Mumbai", "Nashik"]))
