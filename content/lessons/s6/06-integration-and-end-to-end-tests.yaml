                    self.conn.execute("DELETE FROM seats WHERE seat = ?", (seat,))


            store = SqlSeatStore(sqlite3.connect(":memory:"))
            store.book("12A", "Ravi")
            try:
                store.book("12A", "Meena")
            except SeatTaken:
                print("refused")
            store.cancel("12A")
            store.book("12A", "Meena")
            print(store.holder("12A"), store.holder("12B"))
          - |
            import sqlite3


            class SeatTaken(Exception):
                pass


            class SqlSeatStore:
                # The real booking store, on SQLite. Same contract as the fake: book
                # raises SeatTaken for a seat already booked and leaves the first
                # booking; holder returns the passenger or None; cancel frees the seat.
                def __init__(self, conn):
                    self.conn = conn
                    conn.execute("CREATE TABLE seats (seat TEXT PRIMARY KEY, passenger TEXT NOT NULL)")

                def book(self, seat, passenger):
                    self.conn.execute("INSERT OR REPLACE INTO seats VALUES (?, ?)", (seat, passenger))

                def holder(self, seat):
                    row = self.conn.execute("SELECT passenger FROM seats WHERE seat = ?", (seat,)).fetchone()
                    return row[0] if row else None

                def cancel(self, seat):
                    self.conn.execute("DELETE FROM seats WHERE seat = ?", (seat,))


            store = SqlSeatStore(sqlite3.connect(":memory:"))
            store.book("12A", "Ravi")
            try:
                store.book("12A", "Meena")
            except SeatTaken:
                print("refused")
            store.cancel("12A")
            store.book("12A", "Meena")
            print(store.holder("12A"), store.holder("12B"))
          - |
            import sqlite3


            class SeatTaken(Exception):
                pass


            class SqlSeatStore:
                # The real booking store, on SQLite. Same contract as the fake: book
                # raises SeatTaken for a seat already booked and leaves the first
                # booking; holder returns the passenger or None; cancel frees the seat.
                def __init__(self, conn):
                    self.conn = conn
                    conn.execute("CREATE TABLE seats (seat TEXT PRIMARY KEY, passenger TEXT NOT NULL)")

                def book(self, seat, passenger):
                    try:
                        self.conn.execute("INSERT INTO seats VALUES (?, ?)", (seat, passenger))
                    except sqlite3.IntegrityError:
                        raise SeatTaken(seat)

                def holder(self, seat):
                    return self.conn.execute("SELECT passenger FROM seats WHERE seat = ?", (seat,)).fetchone()

                def cancel(self, seat):
                    self.conn.execute("DELETE FROM seats WHERE seat = ?", (seat,))


            store = SqlSeatStore(sqlite3.connect(":memory:"))
            store.book("12A", "Ravi")
            try:
                store.book("12A", "Meena")
            except SeatTaken:
                print("refused")
            store.cancel("12A")
            store.book("12A", "Meena")
            print(store.holder("12A"), store.holder("12B"))
        explanation: |
          A primary key on the seat makes the database itself refuse a second booking, and translating its `IntegrityError` into `SeatTaken` keeps the contract the rest of the code relies on. Without the key, double bookings are silently stored; `INSERT OR REPLACE` hands the seat to the second passenger; and returning the row instead of its first column gives callers a tuple where they expect a name.
    - question:
        id: write-contract-check
        type: code
        mode: write
        system: s2
        prompt: |
          Write `contract_problems(response, contract)`, a consumer's contract check run against the provider's real responses. The program should print `['fare should be int', 'missing time']`.
        starter: |
          def contract_problems(response, contract):
              # contract maps each field the app relies on to the name of the type it
              # expects: "str", "int", "bool" or "list". Return a sorted list of
              # problems: "missing FIELD" for an absent field and "FIELD should be
              # TYPE" for a field whose value has a different type. Fields the app
              # does not rely on are allowed, so a server can add fields safely.
              return []


          contract = {"seat": "str", "fare": "int", "time": "str", "ac": "bool"}
          response = {"seat": "12A", "fare": 450.5, "departure": "21:30", "ac": True, "operator": "KSRTC"}
          print(contract_problems(response, contract))
        solution: |
          def contract_problems(response, contract):
              # contract maps each field the app relies on to the name of the type it
              # expects: "str", "int", "bool" or "list". Return a sorted list of
              # problems: "missing FIELD" for an absent field and "FIELD should be
              # TYPE" for a field whose value has a different type. Fields the app
              # does not rely on are allowed, so a server can add fields safely.
              problems = []
              for field, kind in contract.items():
                  if field not in response:
                      problems.append("missing " + field)
                  elif type(response[field]).__name__ != kind:
                      problems.append(field + " should be " + kind)
              return sorted(problems)


          contract = {"seat": "str", "fare": "int", "time": "str", "ac": "bool"}
          response = {"seat": "12A", "fare": 450.5, "departure": "21:30", "ac": True, "operator": "KSRTC"}
          print(contract_problems(response, contract))
        tests: |
          _c = {"id": "int", "name": "str", "tags": "list", "open": "bool"}
          _cases = [
              ({"id": 1, "name": "a", "tags": [], "open": False}, []),
              ({"id": 1, "name": "a", "tags": [], "open": False, "extra": 5}, []),
              ({"name": "a", "tags": []}, ["missing id", "missing open"]),
              ({"id": "1", "name": "a", "tags": [], "open": False}, ["id should be int"]),
              ({"id": 1, "name": 7, "tags": "x", "open": "yes"}, ["name should be str", "open should be bool", "tags should be list"]),
              ({"id": True, "name": "a", "tags": [], "open": 1}, ["id should be int", "open should be bool"]),
              ({}, ["missing id", "missing name", "missing open", "missing tags"]),
          ]
          for _r, _want in _cases:
              _got = contract_problems(dict(_r), _c)
              assert list(_got) == _want, "For the response " + repr(_r) + ", the problems should be " + repr(_want) + ", not " + repr(_got)
          assert output.strip() == "['fare should be int', 'missing time']", "The program should print ['fare should be int', 'missing time']"
