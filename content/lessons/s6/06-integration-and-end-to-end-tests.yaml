    - text: |
        36,000. Twelve minutes is 720 seconds; 8 end-to-end tests take 240 and 150 integration tests take 300, leaving 180 seconds, and at 5 milliseconds each that is 36,000 unit tests. Eight slow tests cost as much time as 48,000 fast ones, which is why the top of the pyramid stays narrow and is kept for the journeys that matter most.

        A suite of tens of thousands of tests raises its own question: does it actually exercise the code, and would it notice if the code were wrong? Measuring which lines the tests run, and deliberately breaking the code to see whether any test objects, is [[s6.coverage-and-mutation-testing]].
