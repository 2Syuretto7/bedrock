                        problems.append(field + " should be " + kind)
                return sorted(problems)


            contract = {"seat": "str", "fare": "int", "time": "str", "ac": "bool"}
            response = {"seat": "12A", "fare": 450.5, "departure": "21:30", "ac": True, "operator": "KSRTC"}
            print(contract_problems(response, contract))
        explanation: |
          Walk the contract, not the response: every field the consumer relies on must be present with the right type, compared by the type's exact name so that `True` is not accepted as an `int`. Reporting extra fields forbids the provider from ever adding one; checking only presence misses the fare that changed type; and checking only integers lets wrongly typed strings, lists and booleans through.
