          assert dict(classify({})) == {}, "With no tests, classify should return an empty dict"
          assert output.strip() == "test_fare_table -> stable\ntest_refund_rounding -> broken\ntest_seat_map_loads -> flaky: 2 of 20 failed", "The program should print the three verdicts: stable, broken, and flaky with 2 of 20 failed"
