        explanation: |
          Run the first half of the suspects before the target. If the target still passes, the polluter is in the second half; if it fails, it is in the first. Repeat until one suspect remains, about $\log_2 n$ runs. Trying each test alone works but takes up to $n$ runs; keeping the wrong half after a passing run throws the polluter away; and skipping one test when moving to the second half can skip the polluter itself.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          In the puzzle, the job takes a uniformly random time between 0 and 4 seconds and the test checks after sleeping 3 seconds. In what percentage of runs does it fail?
        answer: "25"
        explanation: |
          The test fails when the job takes longer than 3 seconds. Under a uniform distribution on 0 to 4 seconds, that is the last second of four, a probability of $1/4$, or 25%.
    - question:
        id: work-quarantine
        type: choice
        system: s2
        prompt: |
          Sanjay finds a flaky end-to-end test that fails about once a day and blocks other people's merges. He cannot fix it today. What should he do?
        options:
          - "Quarantine it out of the blocking suite, keep it running and recording results, and give it an owner and a date for a fix."
          - "Delete it, since it is unreliable."
          - "Add three automatic retries and forget about it."
          - "Leave it blocking merges until someone has time."
        answer: 0
        explanation: |
          Quarantine stops the harm to everyone else while keeping the evidence and the responsibility. Deleting throws away whatever the test protected; silent retries hide a cause that might be a real bug; and leaving it blocking teaches the team to ignore red.
