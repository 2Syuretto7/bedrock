    - text: |
        25%. With the finish time spread evenly over four seconds, the job is still running at the 3-second check one time in four. The code is correct in every run, so every one of those failures is the test's fault. Sleeping 5 seconds would end the failures and make every run 5 seconds slow; polling ends the failures and waits only as long as needed.

        Most flaky tests share one root: something in the test that the test does not control, such as time, randomness, order or the speed of a machine. The cure is to take control of each of those deliberately, choosing the seed, the clock and the timing inside the test itself, which is [[s6.deterministic-tests-seeds-clocks-and-fakes]].
