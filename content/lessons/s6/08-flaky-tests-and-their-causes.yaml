        explanation: |
          Count the failures in each list: none means stable, all means broken, and anything in between is flaky, reported with its count. Calling every failure "broken" misses the flaky seat map test, which needs a different response from a broken one; counting passes as failures reports 18 failures out of 20 instead of 2; and a test with no runs at all has shown nothing, so it should not be called stable.
    - question:
        id: write-polluter
        type: code
        mode: write
        system: s2
        prompt: |
          Write `find_polluter(before, run)`, which bisects the tests that ran before a failing test to find the one that leaves bad state behind. The program should print `('test_cache_warm', 4)`.
        starter: |
          def find_polluter(before, run):
              # A target test passes alone but fails after the tests in before, and
              # exactly one of them is to blame. run(tests) runs the given tests in
              # order, then the target, and returns True if the target passed. Bisect:
              # keep a list of suspects, run the first half of it, and keep whichever
              # half must contain the polluter. Return (polluter, number of runs).
              return before[0], 0


          suite = ["test_" + name for name in ["login", "search", "seat_map", "cache_warm", "fares",
                                               "refund", "sms", "profile", "logout", "report"]]


          def run(tests):
              # In real life this would run the tests; here, test_cache_warm leaves a
              # stale fare in a module-level cache that the target then reads.
              return "test_cache_warm" not in tests


          print(find_polluter(suite, run))
        solution: |
          def find_polluter(before, run):
              # A target test passes alone but fails after the tests in before, and
              # exactly one of them is to blame. run(tests) runs the given tests in
              # order, then the target, and returns True if the target passed. Bisect:
              # keep a list of suspects, run the first half of it, and keep whichever
              # half must contain the polluter. Return (polluter, number of runs).
              suspects = list(before)
              runs = 0
              while len(suspects) > 1:
                  half = suspects[:len(suspects) // 2]
                  runs += 1
                  if run(half):
                      suspects = suspects[len(suspects) // 2:]
                  else:
                      suspects = half
              return suspects[0], runs


          suite = ["test_" + name for name in ["login", "search", "seat_map", "cache_warm", "fares",
                                               "refund", "sms", "profile", "logout", "report"]]


          def run(tests):
              # In real life this would run the tests; here, test_cache_warm leaves a
              # stale fare in a module-level cache that the target then reads.
              return "test_cache_warm" not in tests


          print(find_polluter(suite, run))
        tests: |
          import math as _m

          for _n in [1, 2, 3, 5, 8, 10, 33]:
              _names = ["t" + str(_i) for _i in range(_n)]
              for _p in sorted(set([0, _n // 2, _n - 1])):
                  _bad = _names[_p]
                  _calls = []

                  def _run(tests, _bad=_bad, _calls=_calls):
                      _calls.append(list(tests))
                      return _bad not in tests

                  _got = find_polluter(list(_names), _run)
