concept: f4.bayes-rule
minutes: 90
claim: You can turn P(B | A) into P(A | B) with Bayes' rule, finding the bottom line with the law of total probability, explain a surprising result with natural frequencies, update in odds form by multiplying by a likelihood ratio, update again as each new piece of evidence arrives, compute posteriors over several hypotheses, and spot base-rate neglect and the prosecutor's fallacy.
recalls: [f4.conditional-probability]
uses: [f4.conditional-probability, f4.sample-spaces-and-events, f1.linear-equations, s1.comprehensions-and-iterators, s1.modules-and-imports, s0.dictionaries-and-sets, s0.functions, s0.loops]
leads: [f4.independence, f4.random-variables, f4.common-discrete-distributions]
starter: |
  # Scratch space. Ten thousand people, a condition 1 in 100 have, and a test.
  people = 10000
  sick = people // 100
  caught = sick * 90 // 100
  false_alarms = (people - sick) * 5 // 100
  print(caught, false_alarms, caught / (caught + false_alarms))
parts:
  recall:
    - text: |
        [[f4.conditional-probability]] ended on a warning: $P(A \mid B)$ is not $P(B \mid A)$. A test is described by how it behaves when the answer is known, and a patient wants to know the answer from how the test behaved. Three quick pulls first.
  puzzle:
    - text: |
        A district runs a free health camp and screens everyone who comes for a condition that 1 in 100 adults in the district has. The test is good. Of people who have the condition, 90% test positive. Of people who do not, only 5% test positive.

        Ravi, who feels perfectly well, goes to the camp to keep his mother company, takes the test while he waits, and tests positive. The volunteer, trying to be kind, says, "The test is 90% accurate, so I am afraid it is very likely you have it."

        When doctors were asked this kind of question in surveys, most gave an answer between 70% and 90%. **What is the actual chance that Ravi has the condition?**
  intuition:
    - text: |
        Forget percentages for a moment and imagine the people. Suppose 10,000 adults like Ravi come to the camp.

        - 1 in 100 has the condition: that is 100 people. The other 9,900 do not.
        - Of the 100 with the condition, 90% test positive: 90 people.
        - Of the 9,900 without it, 5% test positive anyway: 495 people.

        So 90 + 495 = 585 people walk away with a positive result, and only 90 of them have the condition. Ravi is one of the 585, and nothing about him singles him out among them. His chance of having the condition is $90/585$, about 15%.

        The false alarms win because they come from the much larger group. A small error rate applied to 9,900 healthy people produces more positives than a large success rate applied to 100 sick ones. The test did its job: Ravi's chance has gone up from 1% to 15%, fifteen times as likely as before. But 15% is a long way from 90%.

        The figure draws the same 10,000 people as a square. The narrow column on the left is those with the condition, the wide one on the right those without, and the shaded top of each column is those who test positive. The bar below lines up everyone who tests positive. Make the condition rarer and watch the dark share of the bar shrink; make it common and the test looks far better than it did, though the test itself has not changed.
    - figure: bayes-square
      props: { prevalence: 10, sensitivity: 90, falsePositive: 5 }
    - text: |
        Try a perfect test for people who have the condition, 100% positive, with the false positive rate still at 5%. The answer barely moves, to about 17%. Now put the false positive rate down to 1% with sensitivity back at 90%: the answer jumps to about 48%. For a rare condition, it is the false positives, not the misses, that decide what a positive result means.
  derivation:
    - text: |
        **Bayes' rule.** The multiplication rule of the last lesson writes $P(A \cap B)$ two ways, $P(A \mid B)\,P(B)$ and $P(B \mid A)\,P(A)$. Setting them equal and dividing by $P(B)$, when it is not zero,

        $$P(A \mid B) = \frac{P(B \mid A)\,P(A)}{P(B)}.$$

        That is Bayes' rule. The bottom line usually comes from the law of total probability, splitting $B$ by whether $A$ happened:

        $$P(B) = P(B \mid A)\,P(A) + P(B \mid A^c)\,P(A^c).$$

        For Ravi, $A$ is "has the condition" and $B$ is "tests positive":

        $$P(A \mid B) = \frac{0.9 \times 0.01}{0.9 \times 0.01 + 0.05 \times 0.99} = \frac{0.009}{0.009 + 0.0495} = \frac{0.009}{0.0585} \approx 0.154.$$

        Every piece of the natural-frequency picture is here. The top, $0.009$, is the true positives as a share of everyone, 90 out of 10,000. The second term at the bottom, $0.0495$, is the false alarms, 495 out of 10,000. The formula and the 10,000 people are the same calculation.

        **Names.** $P(A)$, what you believed before the evidence, is the **prior**. $P(B \mid A)$, how probable the evidence is if $A$ is true, is the **likelihood**. $P(A \mid B)$, what you believe after, is the **posterior**. In words: the posterior is proportional to the likelihood times the prior, and the bottom line only scales the answers so that they add to 1.
    - question:
        id: derivation-reverse
        type: numeric
        system: s2
        prompt: |
          $P(B \mid A) = 0.8$, $P(A) = 0.1$ and $P(B) = 0.2$. What is $P(A \mid B)$?
        answer: "0.4"
        explanation: |
          $P(A \mid B) = 0.8 \times 0.1 / 0.2 = 0.4$. The evidence $B$ is four times as likely when $A$ holds as it is in general, $0.8$ against $0.2$, so it multiplies the chance of $A$ by four.
    - text: |
        **Several hypotheses.** Nothing limits Bayes' rule to "$A$ or not $A$". If hypotheses $H_1, \dots, H_n$ split the sample space, then

        $$P(H_i \mid E) = \frac{P(E \mid H_i)\,P(H_i)}{\sum_j P(E \mid H_j)\,P(H_j)}.$$

        Multiply each prior by its likelihood, add the products, and divide each by the total. A factory has three machines. Machine A makes half the parts and 1% of its parts are faulty; B makes 30% with 2% faulty; C makes 20% with 5% faulty. The products are $0.005$, $0.006$ and $0.010$, adding to $0.021$, so a faulty part came from A, B or C with chances $5/21$, $6/21$ and $10/21$. Machine C makes the fewest parts, yet it is the most likely culprit, because its likelihood of making a faulty part is five times A's.

        **Odds.** The **odds** of an event are $P(A) / P(A^c)$: odds of 1 to 4, written $1:4$ or $1/4$, mean a probability of $1/5$. To go back, a probability is odds divided by one plus odds. Dividing Bayes' rule for $A$ by Bayes' rule for $A^c$, the awkward bottom line cancels and leaves

        $$\frac{P(A \mid B)}{P(A^c \mid B)} = \frac{P(B \mid A)}{P(B \mid A^c)} \times \frac{P(A)}{P(A^c)}:$$

        posterior odds are the **likelihood ratio** times the prior odds. For Ravi, the prior odds are $1:99$; a positive result is $0.9 / 0.05 = 18$ times as likely with the condition as without; so the posterior odds are $18:99 = 2:11$, a probability of $2/13 \approx 15.4\%$. Each test has a likelihood ratio for a positive result and another for a negative one, $0.1 / 0.95 \approx 0.105$ here, and the ratio says how strong the evidence is, whatever the prior.
    - question:
        id: order-odds
        type: order
        system: s2
        prompt: |
          A spam filter knows that 1 email in 10 is spam, and that a certain word appears 6 times as often in spam as in genuine email. An email contains the word. Put the steps for the chance that it is spam in order.
        steps:
          - "The prior odds of spam are $1 : 9$."
          - "The likelihood ratio of the word is 6."
          - "The posterior odds are $6 \\times 1 : 9 = 6 : 9 = 2 : 3$."
          - "Odds of $2 : 3$ mean a probability of $2 / (2 + 3) = 0.4$."
        explanation: |
          In odds form, the prior and the evidence separate cleanly: multiply the prior odds by the likelihood ratio, then turn the odds back into a probability. The same answer comes from Bayes' rule directly: $0.1 \times 6p / (0.1 \times 6p + 0.9 \times p) = 0.6 / 1.5 = 0.4$, whatever the word's rate $p$ in genuine email.
    - text: |
        **Updating again.** The posterior after one piece of evidence is the prior for the next. If Ravi takes a second, separate test, whose mistakes have nothing to do with the first's, his odds are multiplied by 18 again: $2:11$ becomes $36:11$, a probability of $36/47 \approx 77\%$. Two positives make the condition likely; one did not. This is why a screening result is followed by a different, confirmatory test before anyone is treated. "Have nothing to do with" needs care, since a second run of the same test on the same sample may repeat the same mistake. The precise condition is [[f4.independence]].

        **Two famous errors.** Ignoring the prior, and reading $P(B \mid A)$ as if it were $P(A \mid B)$, is called **base-rate neglect**; it is what the volunteer did. In a courtroom it becomes the **prosecutor's fallacy**. "Only 1 person in 10 lakh would match this blood sample, so the chance the accused is innocent is 1 in 10 lakh" confuses $P(\text{match} \mid \text{innocent})$ with $P(\text{innocent} \mid \text{match})$. In a city of a crore people, about 10 innocent people would match too, and with no other evidence the accused is just one of about 11 matches.

        **In Python.** Fractions keep a chain of updates exact:

        ```python
        from fractions import Fraction

        odds = Fraction(1, 99)
        for ratio in [18, 18]:
            odds = odds * ratio
        print(odds, odds / (1 + odds))
        ```

        This prints `36/11 36/47`: the odds and the probability after two positive tests.
  formal:
    - text: |
        **Bayes' rule.** If $P(B) > 0$, $P(A \mid B) = P(B \mid A)\,P(A) / P(B)$, where $P(B) = P(B \mid A)\,P(A) + P(B \mid A^c)\,P(A^c)$.

        **Several hypotheses.** If $H_1, \dots, H_n$ are pairwise disjoint with union $\Omega$, then $P(H_i \mid E) = P(E \mid H_i)\,P(H_i) / \sum_j P(E \mid H_j)\,P(H_j)$.

        **Names.** $P(H)$ is the prior, $P(E \mid H)$ the likelihood, $P(H \mid E)$ the posterior.

        **Odds form.** The odds of $A$ are $P(A) / P(A^c)$, and a probability is odds$/(1 + $odds$)$. Posterior odds $=$ likelihood ratio $\times$ prior odds, where the likelihood ratio of $E$ is $P(E \mid A) / P(E \mid A^c)$.

        **Sequential updating.** The posterior after one piece of evidence is the prior for the next. When the pieces are independent given $A$ and given $A^c$, the likelihood ratios multiply.
  drill:
    - text: Seconds each. Prior times likelihood, then scale.
    - question:
        id: drill-odds
        type: numeric
        system: s1
        prompt: |
          An event has probability $0.2$. What are its odds, as a single number?
        answer: "0.25"
        explanation: $0.2 / 0.8 = 0.25$, odds of 1 to 4.
    - question:
        id: drill-odds-back
        type: numeric
        system: s1
        prompt: |
          The odds of an event are 3 to 1. What is its probability?
        answer: "0.75"
        explanation: $3 / (3 + 1) = 0.75$.
    - question:
        id: drill-ratio
        type: numeric
        system: s1
        prompt: |
          The prior odds are $1 : 9$ and the evidence has likelihood ratio 3. What is the posterior probability?
        answer: "0.25"
        explanation: 'The posterior odds are $3 : 9 = 1 : 3$, a probability of $1/4$.'
    - question:
        id: drill-bayes
        type: numeric
        system: s1
        prompt: |
          $P(B \mid A) = 0.5$, $P(A) = 0.2$ and $P(B) = 0.25$. What is $P(A \mid B)$?
        answer: "0.4"
        explanation: $0.5 \times 0.2 / 0.25 = 0.4$.
    - question:
        id: drill-ten-thousand
        type: numeric
        system: s1
        prompt: |
          Out of 10,000 people, 50 have a condition. A test is positive for all 50 of them and for 100 of the others. What is the chance that someone who tests positive has the condition? Give a fraction.
        answer: "1/3"
        explanation: 150 people test positive, and 50 of them have it.
    - question:
        id: drill-fallacy
        type: choice
        system: s1
        prompt: |
          A test for a rare condition is positive for 99% of people who have it. Which of these follows?
        options:
          - "Nothing about the chance that a person who tests positive has it, without the base rate and the false positive rate."
          - "A person who tests positive has it with probability 0.99."
          - "A person who tests negative is healthy with probability 0.99."
          - "1% of positive tests are wrong."
        answer: 0
        explanation: 99% is $P(\text{positive} \mid \text{condition})$. Turning it round needs the prior, $P(\text{condition})$, and $P(\text{positive} \mid \text{no condition})$.
    - question:
        id: predict-frequencies
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          people = 10000
          sick = people // 50
          caught = sick * 80 // 100
          false_alarms = (people - sick) * 10 // 100
          print(sick, caught, false_alarms, caught + false_alarms)
        output: "200 160 980 1140"
        explanation: 200 of 10,000 have the condition, the test finds 160 of them and wrongly flags 980 of the other 9,800, so 1,140 test positive. Only $160/1140 \approx 14\%$ of them have the condition.
    - question:
        id: predict-posterior
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          from fractions import Fraction

          priors = {"A": Fraction(1, 2), "B": Fraction(1, 2)}
          likely = {"A": Fraction(1, 10), "B": Fraction(3, 10)}
          joint = {h: priors[h] * likely[h] for h in priors}
          total = sum(joint.values())
          print(total, joint["A"] / total, joint["B"] / total)
        output: "1/5 1/4 3/4"
        explanation: The products are $1/20$ and $3/20$, adding to $1/5$. Divided by $1/5$, they give the posteriors $1/4$ and $3/4$. With equal priors, the posteriors are in the ratio of the likelihoods.
  work:
    - text: Slower now. Write down the prior, the likelihoods and what is known before you compute, and check each answer by imagining 10,000 cases.
    - question:
        id: fix-flagged
        type: code
        mode: find-bug
        system: s2
        prompt: |
          A payments company flags transactions that look like fraud. `fraud_given_flag(fraud_rate, catch_rate, false_alarm_rate)` should give the exact chance that a flagged transaction is fraud, where `fraud_rate` is the fraction of transactions that are fraud, `catch_rate` is the fraction of fraud that gets flagged, and `false_alarm_rate` is the fraction of genuine transactions that get flagged. The program should print `11/122`. It prints `11/111`. Find the fault and fix it.
        starter: |
          from fractions import Fraction

          def fraud_given_flag(fraud_rate, catch_rate, false_alarm_rate):
              true_flags = fraud_rate * catch_rate
              false_flags = (1 - fraud_rate) * false_alarm_rate
              return true_flags / false_flags

          print(fraud_given_flag(Fraction(1, 1000), Fraction(99, 100), Fraction(1, 100)))
        solution: |
          from fractions import Fraction

          def fraud_given_flag(fraud_rate, catch_rate, false_alarm_rate):
              true_flags = fraud_rate * catch_rate
              false_flags = (1 - fraud_rate) * false_alarm_rate
              return true_flags / (true_flags + false_flags)

          print(fraud_given_flag(Fraction(1, 1000), Fraction(99, 100), Fraction(1, 100)))
        tests: |
          import random
          from fractions import Fraction
          random.seed(3)
          for _trial in range(300):
              _f = Fraction(random.randint(1, 99), 100)
              _c = Fraction(random.randint(1, 100), 100)
              _a = Fraction(random.randint(1, 100), 100)
              _want = _f * _c / (_f * _c + (1 - _f) * _a)
              _got = fraud_given_flag(_f, _c, _a)
              assert _got == _want, "fraud_given_flag(" + str(_f) + ", " + str(_c) + ", " + str(_a) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "11/122", "The program should print 11/122"
        wrong:
          - |
            from fractions import Fraction

            def fraud_given_flag(fraud_rate, catch_rate, false_alarm_rate):
                true_flags = fraud_rate * catch_rate
                return true_flags / (true_flags + false_alarm_rate)

            print("11/122")
          - |
            from fractions import Fraction

            def fraud_given_flag(fraud_rate, catch_rate, false_alarm_rate):
                return catch_rate / (catch_rate + false_alarm_rate)

            print("11/122")
        explanation: |
          True flags divided by false flags is the posterior *odds* of fraud, 99 to 999 here. The chance that a flagged transaction is fraud is true flags divided by *all* flags, $99 / (99 + 999) = 11/122$, about 9%. Forgetting to multiply the false alarm rate by the share of genuine transactions overcounts false flags slightly. Leaving out the fraud rate altogether is base-rate neglect, and gives about 99%, wildly wrong when fraud is rare.
    - question:
        id: write-posterior
        type: code
        mode: write
        system: s2
        prompt: |
          Write `posterior(priors, likelihoods)`. Both are dictionaries with the same keys, the hypotheses. `priors[h]` is the prior probability of `h`, and the priors add to 1; `likelihoods[h]` is the probability of the evidence if `h` is true. At least one product of prior and likelihood is not zero. Return a dictionary from each hypothesis to its posterior probability, keeping the values exact if the inputs are `Fraction`s.
        starter: |
          from fractions import Fraction

          def posterior(priors, likelihoods):
              return {h: priors[h] for h in priors}

          machines = {"A": Fraction(1, 2), "B": Fraction(3, 10), "C": Fraction(1, 5)}
          faulty = {"A": Fraction(1, 100), "B": Fraction(2, 100), "C": Fraction(5, 100)}
          result = posterior(machines, faulty)
          print(result["A"], result["B"], result["C"])
        solution: |
          from fractions import Fraction

          def posterior(priors, likelihoods):
              joint = {h: priors[h] * likelihoods[h] for h in priors}
              total = sum(joint.values())
              return {h: joint[h] / total for h in joint}

          machines = {"A": Fraction(1, 2), "B": Fraction(3, 10), "C": Fraction(1, 5)}
          faulty = {"A": Fraction(1, 100), "B": Fraction(2, 100), "C": Fraction(5, 100)}
          result = posterior(machines, faulty)
          print(result["A"], result["B"], result["C"])
        tests: |
          import random
          from fractions import Fraction
          random.seed(19)
          for _trial in range(300):
              _n = random.randint(1, 6)
              _w = [random.randint(1, 9) for _i in range(_n)]
              _pri = {"h" + str(_i): Fraction(_w[_i], sum(_w)) for _i in range(_n)}
              _lik = {"h" + str(_i): Fraction(random.randint(0, 10), 10) for _i in range(_n)}
              if all(_lik[_h] == 0 for _h in _lik):
                  _lik["h0"] = Fraction(1, 10)
              _tot = sum(_pri[_h] * _lik[_h] for _h in _pri)
              _want = {_h: _pri[_h] * _lik[_h] / _tot for _h in _pri}
              _got = posterior(dict(_pri), dict(_lik))
              assert _got == _want, "With priors " + str({_h: str(_v) for _h, _v in _pri.items()}) + " and likelihoods " + str({_h: str(_v) for _h, _v in _lik.items()}) + ", the posteriors are " + str({_h: str(_v) for _h, _v in _want.items()})
          assert output.strip() == "5/21 2/7 10/21", "The program should print 5/21 2/7 10/21"
        wrong:
          - |
            from fractions import Fraction

            def posterior(priors, likelihoods):
                total = sum(likelihoods.values())
                return {h: likelihoods[h] / total for h in likelihoods}

            print("5/21 2/7 10/21")
          - |
            from fractions import Fraction

            def posterior(priors, likelihoods):
                return {h: priors[h] * likelihoods[h] for h in priors}

            print("5/21 2/7 10/21")
          - |
            from fractions import Fraction

            def posterior(priors, likelihoods):
                total = sum(likelihoods.values())
                return {h: priors[h] * likelihoods[h] / total for h in priors}

            print("5/21 2/7 10/21")
        explanation: |
          Each posterior is prior times likelihood, divided by the sum of those products over all hypotheses, which is $P(E)$ by the law of total probability. Dividing the likelihoods by their own sum leaves out the priors, which is base-rate neglect: it would blame machine C with chance $5/8$ instead of $10/21$. Returning the products without dividing gives numbers that do not add to 1, and dividing them by the sum of the likelihoods uses the wrong bottom line.
    - question:
        id: write-tests
        type: code
        mode: write
        system: s2
        prompt: |
          A person is tested several times for a condition. `prevalence` is the prior chance of the condition, `sensitivity` the chance each test is positive if they have it, and `false_positive` the chance each test is positive if they do not. The tests' results are independent given the person's true state, so a positive result multiplies the odds by `sensitivity / false_positive` and a negative one by `(1 - sensitivity) / (1 - false_positive)`. Write `after_tests(prevalence, sensitivity, false_positive, results)`, where `results` is a list of `True` for positive and `False` for negative, returning the exact chance of the condition after all of them as a `Fraction`. All rates are strictly between 0 and 1.
        starter: |
          from fractions import Fraction

          def after_tests(prevalence, sensitivity, false_positive, results):
              return prevalence

          base, sens, false_pos = Fraction(1, 100), Fraction(9, 10), Fraction(1, 20)
          print(after_tests(base, sens, false_pos, [True]), after_tests(base, sens, false_pos, [True, True]), after_tests(base, sens, false_pos, [True, False]))
        solution: |
          from fractions import Fraction

          def after_tests(prevalence, sensitivity, false_positive, results):
              odds = prevalence / (1 - prevalence)
              for positive in results:
                  if positive:
                      odds = odds * sensitivity / false_positive
                  else:
                      odds = odds * (1 - sensitivity) / (1 - false_positive)
              return odds / (1 + odds)

          base, sens, false_pos = Fraction(1, 100), Fraction(9, 10), Fraction(1, 20)
          print(after_tests(base, sens, false_pos, [True]), after_tests(base, sens, false_pos, [True, True]), after_tests(base, sens, false_pos, [True, False]))
        tests: |
          import itertools
          import random
          from fractions import Fraction
          random.seed(23)
          for _trial in range(120):
              _p = Fraction(random.randint(1, 99), 100)
              _s = Fraction(random.randint(1, 99), 100)
              _f = Fraction(random.randint(1, 99), 100)
              _res = [random.random() < 0.5 for _i in range(random.randint(0, 4))]
              _yes = _p
              _no = 1 - _p
              for _r in _res:
                  _yes = _yes * (_s if _r else 1 - _s)
                  _no = _no * (_f if _r else 1 - _f)
              _want = _yes / (_yes + _no)
              _got = after_tests(_p, _s, _f, list(_res))
              assert _got == _want, "after_tests(" + str(_p) + ", " + str(_s) + ", " + str(_f) + ", " + str(_res) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "2/13 36/47 4/213", "The program should print 2/13 36/47 4/213"
        wrong:
          - |
            from fractions import Fraction

            def after_tests(prevalence, sensitivity, false_positive, results):
                odds = prevalence / (1 - prevalence)
                for positive in results:
                    odds = odds * sensitivity / false_positive
                return odds / (1 + odds)

            print("2/13 36/47 4/213")
          - |
            from fractions import Fraction

            def after_tests(prevalence, sensitivity, false_positive, results):
                odds = Fraction(1)
                for positive in results:
                    if positive:
                        odds = odds * sensitivity / false_positive
                    else:
                        odds = odds * (1 - sensitivity) / (1 - false_positive)
                return odds / (1 + odds)

            print("2/13 36/47 4/213")
          - |
            from fractions import Fraction

            def after_tests(prevalence, sensitivity, false_positive, results):
                odds = prevalence / (1 - prevalence)
                for positive in results:
                    if positive:
                        odds = odds * sensitivity / false_positive
                    else:
                        odds = odds * (1 - sensitivity) / (1 - false_positive)
                return odds

            print("2/13 36/47 4/213")
        explanation: |
          Start from the prior odds $p / (1 - p)$, multiply by the likelihood ratio of each result in turn, and turn the final odds back into a probability. A negative result has its own ratio, below 1, and pulls the odds down: one positive and one negative leave the chance at $4/213$, under 2%. Treating every result as positive ignores the evidence against; starting from even odds ignores the base rate; and returning the odds is not returning a probability.
    - question:
        id: work-toss-back
        type: numeric
        system: s2
        tolerance: "0.005"
        prompt: |
          A cricket team wins 70% of its matches when it wins the toss and 45% when it loses it, and the toss is fair. You hear that the team won yesterday's match. What is the probability that it won the toss? Give a decimal to two places.
        answer: "0.61"
        explanation: |
          $P(\text{won toss} \mid \text{won match}) = 0.5 \times 0.7 / (0.5 \times 0.7 + 0.5 \times 0.45) = 0.35 / 0.575 = 14/23 \approx 0.609$. Winning the match is evidence of winning the toss, with likelihood ratio $0.7 / 0.45 \approx 1.56$, so the even odds of the toss become 14 to 9.
    - question:
        id: work-fraud
        type: numeric
        system: s2
        tolerance: "0.005"
        prompt: |
          1 transaction in 1,000 is fraud. A detector flags 99% of fraud and 1% of genuine transactions. What is the probability that a flagged transaction is fraud? Give a decimal to two places.
        answer: "0.09"
        explanation: |
          In 1,00,000 transactions, 100 are fraud and 99 of them are flagged, while 1% of the 99,900 genuine ones, 999, are flagged too. So $99 / (99 + 999) \approx 0.09$. A detector that looks 99% accurate sends a human reviewer ten false alarms for every real fraud.
    - question:
        id: work-court
        type: choice
        system: s2
        prompt: |
          A blood sample from a crime scene matches the accused. An expert says that only 1 person in 10 lakh would match by chance. The city has 1 crore people, and there is no other evidence. Which is closest to the chance that the accused is the source?
        options:
          - "About 1 in 11: about 10 other people in the city would match too."
          - "About 9,99,999 in 10 lakh."
          - "Exactly 1 in 10 lakh."
          - "About 1 in 2: either the accused is the source or not."
        answer: 0
        explanation: |
          $P(\text{match} \mid \text{not the source})$ is 1 in 10 lakh, but that is not $P(\text{not the source} \mid \text{match})$. Among a crore people, about 10 who are not the source would match, plus the true source: about 11 matches, of whom the accused is one. Reading the match probability as the chance of innocence is the prosecutor's fallacy. Other evidence changes the prior, and with it the answer.
  connections:
    - text: |
        Ravi's chance is $90/585$, about 15%: one in seven or so, not nine in ten. The volunteer confused $P(\text{positive} \mid \text{condition})$, the 90% that describes the test, with $P(\text{condition} \mid \text{positive})$, the chance Ravi cares about, and ignored that the condition is rare. Counting 10,000 imagined people made the answer obvious.

        Bayes' rule turns one conditional into the other: posterior equals likelihood times prior, divided by the total chance of the evidence. In odds form it is a single multiplication by the likelihood ratio, and it repeats as evidence arrives, each posterior becoming the next prior. Spam filters, fraud detectors, medical screening and the way a search engine weighs signals are all built on it.

        One assumption kept appearing: the second test's errors "have nothing to do with" the first's, the words in an email arrive "separately". When can probabilities simply be multiplied? That is [[f4.independence]], and it is the next lesson.
