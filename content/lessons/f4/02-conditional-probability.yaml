    - question:
        id: work-near-home
        type: choice
        system: s2
        prompt: |
          A survey finds that most road accidents happen within 5 kilometres of the driver's home. Does that show that driving near home is more dangerous than driving far from it?
        options:
          - "No. The survey measures P(near home | accident), and most driving happens near home anyway; the danger is P(accident | near home), which it does not give."
          - "Yes. Most accidents are near home, so the chance of an accident there must be higher."
          - "Yes, because P(A | B) and P(B | A) are always equal."
          - "No, because accidents are disjoint events."
        answer: 0
        explanation: |
          The survey gives the fraction of accidents that happen near home. The risk of driving near home is the fraction of near-home kilometres that end in an accident, the conditional the other way round. If 80% of all driving is near home, 80% of accidents could be near home even if every kilometre carried exactly the same risk.
  connections:
    - text: |
        The hidden side is red with probability $2/3$. "Two cards remain, so one in two" treated the cards as equally likely when the news was about a face, and the red-red card has twice as many red faces to show. Shrinking the sample space to what is known, and keeping the old proportions inside it, gave the right answer.

        Conditioning is that shrinking, and $P(A \mid B) = P(A \cap B) / P(B)$ is its formula. Turned round, it is the multiplication rule, which chains along a sequence of stages and draws as a probability tree. Split over cases, it is the law of total probability, a weighted average of the chances within each case. And the bar has a direction: $P(A \mid B)$ is not $P(B \mid A)$.

        That last point is where the next lesson begins. A doctor knows how often a test is positive for patients who have a disease, but the patient wants the reverse, the chance of the disease given a positive test. Turning one conditional into the other is [[f4.bayes-rule]]. And sometimes, as with a total of 7 given the first die, the news changes nothing at all; that is [[f4.independence]].
