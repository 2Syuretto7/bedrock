concept: f4.conditional-probability
minutes: 90
claim: You can compute the probability of an event given that another has happened, by shrinking the sample space or by the formula P(A | B) = P(A and B) / P(B), multiply along a chain of conditions to get the chance that several things all happen, split a probability over cases with the law of total probability, draw the calculation as a probability tree, and tell P(A | B) apart from P(B | A).
recalls: [f4.sample-spaces-and-events]
uses: [f4.sample-spaces-and-events, f3.permutations-and-combinations, f3.trees-and-their-properties, f2.sets-and-set-operations, f1.functions-as-machines, s1.comprehensions-and-iterators, s1.modules-and-imports, s0.functions, s0.lists-and-tuples, s0.loops]
leads: [f4.bayes-rule, f4.independence, f4.random-variables, f4.expectation-and-linearity]
starter: |
  # Scratch space. Two dice: how does knowing "at least one six" change the chance of doubles?
  import itertools
  from fractions import Fraction

  pairs = list(itertools.product(range(1, 7), repeat=2))
  with_six = [p for p in pairs if 6 in p]
  doubles = [p for p in with_six if p[0] == p[1]]
  print(len(with_six), Fraction(len(doubles), len(with_six)))
parts:
  recall:
    - text: |
        [[f4.sample-spaces-and-events]] asked every question before anything was known. Now something is known, and the chances must change to fit. Three quick pulls first.
  puzzle:
    - text: |
        At a Diwali card party, someone takes three cards from an old set and paints them. The first is red on both sides. The second is white on both sides. The third is red on one side and white on the other. The three go into a cloth bag.

        She draws one card without looking and puts it flat on the table. The side facing up is red.

        "It cannot be the white-white card," she says, "so it is either the red-red card or the red-white card. One in two that the other side is red. I will bet you ten rupees at even money that the other side is white."

        It sounds fair: two cards remain possible, and nothing seems to favour either. Yet if you play this game all evening, you lose about two rounds in three. **What is the real chance that the hidden side is red, and where does "one in two" go wrong?**
  intuition:
    - text: |
        Go back to two dice, a red one and a blue one, and their 36 equally likely results. The chance that the total is at least 10 is $6/36 = 1/6$: the six results (4, 6), (5, 5), (5, 6), (6, 4), (6, 5) and (6, 6).

        Now a friend peeks and tells you, "at least one die shows a six." Eleven results fit that news, and the other 25 are ruled out. The dice did nothing new; your knowledge changed. Among the eleven that remain, nothing favours one over another, since each was as likely as any other before the news and the news ruled none of them in or out differently. So they are still equally likely, each now with chance $1/11$.

        Of those eleven, five have a total of at least 10: all the high results except (5, 5). So, given the news, the chance of a total of at least 10 is $5/11$, about $0.45$, close to three times the $1/6$ it was before.

        That is all conditional probability is: **throw away the outcomes the news rules out, and share the probability among the ones that remain, in the same proportions as before.** The figure does exactly this. Choose an event and a condition; the cells outside the condition fade, and the chance is counted among the cells that remain.
    - figure: dice-grid
      props: { event: ten, given: six }
    - text: |
        Try "doubles" first with "at least one six" and then with "the first die shows six". The answers differ: $1/11$ and $1/6$. "At least one six" leaves eleven cells, only one of which is a double. "The first die shows six" leaves six cells, one of which is a double. Two pieces of news that sound almost the same can carry different information, which is why it pays to count instead of guessing.

        Then try "total 7" with "the first die shows six". The chance stays at $1/6$, exactly as it was without any news. Sometimes knowing one thing tells you nothing about another; that case gets its own lesson.
  derivation:
    - text: |
        **The definition.** Let $B$ be an event with $P(B) > 0$. Learning that $B$ has happened rules out every outcome outside $B$. Inside $B$, each outcome keeps its weight relative to the others, and the weights are scaled up so that they add to 1 again. The total weight inside $B$ was $P(B)$, so each weight is divided by $P(B)$. The chance of $A$ is then the scaled weight of the outcomes of $A$ that lie inside $B$:

        $$P(A \mid B) = \frac{P(A \cap B)}{P(B)}.$$

        Read $P(A \mid B)$ as "the probability of $A$ given $B$". With equally likely outcomes the formula is just counting in a smaller sample space, $P(A \mid B) = \lvert A \cap B \rvert / \lvert B \rvert$, which is what the figure does: $5/11$ for a high total given a six.

        $P(\cdot \mid B)$ is itself a probability, obeying all three rules of the last lesson on the new sample space $B$. So everything proved there holds with "given $B$" added: for instance $P(A^c \mid B) = 1 - P(A \mid B)$.

        **The multiplication rule.** Turning the definition round gives

        $$P(A \cap B) = P(B)\, P(A \mid B),$$

        which is often the easier way to use it: the chance that both happen is the chance of the first times the chance of the second once the first is known. For several events it chains:

        $$P(A_1 \cap A_2 \cap A_3) = P(A_1)\, P(A_2 \mid A_1)\, P(A_3 \mid A_1 \cap A_2),$$

        and so on. A shopkeeper has 10 bulbs, 3 of them faulty, and a customer picks 2 at random. The first is faulty with chance $3/10$. Given that, 9 bulbs remain with 2 faulty, so the second is faulty with chance $2/9$. Both are faulty with chance $\frac{3}{10} \cdot \frac{2}{9} = \frac{1}{15}$. Counting pairs, as in [[f3.permutations-and-combinations]], agrees: $\binom{3}{2} / \binom{10}{2} = 3/45 = 1/15$.
    - question:
        id: derivation-doubles
        type: numeric
        system: s2
        prompt: |
          Two fair dice are thrown, and you are told that at least one of them shows a six. What is the probability that the throw is a double? Give a fraction.
        answer: "1/11"
        explanation: |
          Eleven of the 36 results contain a six, and only (6, 6) among them is a double. If instead you were told that the *first* die shows six, six results would remain, one of them a double, giving $1/6$.
    - text: |
        **Trees.** A calculation with several stages draws naturally as a tree, one of the structures of [[f3.trees-and-their-properties]]. The root is the start; each internal node branches into the possible results of the next stage; each edge carries the chance of its branch *given* everything above it. By the multiplication rule, the chance of reaching a leaf is the product of the edge labels on its path from the root. The leaves are disjoint, since each outcome follows exactly one path, so the chance of an event is the sum over the leaves where it happens.

        **The law of total probability.** Suppose events $B_1, \dots, B_n$ split the sample space into pieces: they are pairwise disjoint and together make $\Omega$. Then $A$ is the disjoint union of the pieces $A \cap B_i$, and applying the multiplication rule to each,

        $$P(A) = P(B_1)\,P(A \mid B_1) + \cdots + P(B_n)\,P(A \mid B_n).$$

        This is the tree with one level of cases. An online shop sends 70% of its orders from a warehouse in Bhiwandi and 30% from one in Gurugram. Bhiwandi orders arrive late 2% of the time and Gurugram orders 5% of the time. Then

        $$P(\text{late}) = 0.7 \times 0.02 + 0.3 \times 0.05 = 0.014 + 0.015 = 0.029.$$

        The overall rate is an average of the two rates, weighted by how much each warehouse ships. It lies between them, and closer to the warehouse that ships more.
    - question:
        id: order-total
        type: order
        system: s2
        prompt: |
          A cricket team wins 70% of its matches when it wins the toss and 45% when it loses the toss, and the toss is fair. Put the steps for the chance that it wins a match in order.
        steps:
          - "Split by the toss: the cases \"won the toss\" and \"lost the toss\" are disjoint and cover everything."
          - "Each case has probability 0.5, since the toss is fair."
          - "Multiply each case by the chance of winning given it: $0.5 \\times 0.7 = 0.35$ and $0.5 \\times 0.45 = 0.225$."
          - "Add the two disjoint pieces: $0.35 + 0.225 = 0.575$."
        explanation: |
          This is the law of total probability with two cases. Each piece is the chance of a case and a win together, by the multiplication rule; the pieces do not overlap, so they add.
    - text: |
        **Which way round.** $P(A \mid B)$ and $P(B \mid A)$ are different numbers, and confusing them is the most common error in all of probability. Most people struck by lightning were outdoors at the time; that is $P(\text{outdoors} \mid \text{struck})$, close to 1. Very few people outdoors are struck by lightning; that is $P(\text{struck} \mid \text{outdoors})$, tiny. The two are linked, since both have $P(\text{struck} \cap \text{outdoors})$ on top, but their bottoms differ:

        $$P(A \mid B)\, P(B) = P(A \cap B) = P(B \mid A)\, P(A).$$

        Turning one into the other needs $P(A)$ and $P(B)$, and that is the whole of [[f4.bayes-rule]].

        **The cards.** "Red-red or red-white, one in two" chose the cards as the equally likely outcomes. But you were not shown a card; you were shown a *face*. Before the draw, each of the six faces was equally likely to end up on top: a random card, then a random side. Label them: the red-red card has faces $R_1$ and $R_2$, the white-white card $W_1$ and $W_2$, and the red-white card $R_3$ and $W_3$. The news "the top face is red" leaves $R_1$, $R_2$ and $R_3$, equally likely. The hidden side is red for $R_1$ and $R_2$, whose other sides are $R_2$ and $R_1$, and white only for $R_3$. So the chance is $2/3$.

        The red-red card is twice as likely to show red as the red-white card, so seeing red makes it twice as likely to be the card on the table. Being dealt "a card that has a red side" would be different news, and with that news one in two would be right. What you know depends on how you came to know it.

        **In Python.** With equally likely outcomes, conditioning is filtering:

        ```python
        import itertools
        from fractions import Fraction

        pairs = list(itertools.product(range(1, 7), repeat=2))
        given = [p for p in pairs if 6 in p]
        high = [p for p in given if p[0] + p[1] >= 10]
        print(Fraction(len(high), len(given)))
        ```

        This prints `5/11`. Dividing by `len(pairs)` instead would give $5/36$, the chance of a six *and* a high total, which answers a different question.
  formal:
    - text: |
        **Conditional probability.** For $P(B) > 0$, $P(A \mid B) = P(A \cap B) / P(B)$. With equally likely outcomes, $P(A \mid B) = \lvert A \cap B \rvert / \lvert B \rvert$. The function $A \mapsto P(A \mid B)$ obeys the three rules of probability.

        **Multiplication rule.** $P(A \cap B) = P(B)\, P(A \mid B)$, and $P(A_1 \cap \cdots \cap A_n) = P(A_1)\, P(A_2 \mid A_1) \cdots P(A_n \mid A_1 \cap \cdots \cap A_{n-1})$.

        **Law of total probability.** If $B_1, \dots, B_n$ are pairwise disjoint with union $\Omega$ and each $P(B_i) > 0$, then $P(A) = \sum_i P(B_i)\, P(A \mid B_i)$.

        **Trees.** Edge labels are conditional probabilities given the path above; a leaf's probability is the product along its path; an event's probability is the sum over its leaves.

        **Direction.** In general $P(A \mid B) \ne P(B \mid A)$; they are related by $P(A \mid B)\,P(B) = P(B \mid A)\,P(A)$.
  drill:
    - text: Seconds each. Shrink the sample space to what is known, then count.
