    - question:
        id: predict-given
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import itertools
          from fractions import Fraction

          pairs = list(itertools.product(range(1, 7), repeat=2))
          given = [p for p in pairs if p[0] == 6]
          sevens = [p for p in given if p[0] + p[1] == 7]
          print(len(given), Fraction(len(sevens), len(given)))
        output: "6 1/6"
        explanation: Six results have a 6 on the first die, and exactly one of them, (6, 1), adds to 7.
    - question:
        id: predict-chain
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          from fractions import Fraction

          chance = Fraction(1)
          good, left = 4, 6
          for draw in range(3):
              chance = chance * Fraction(good, left)
              good = good - 1
              left = left - 1
          print(chance)
        output: "1/5"
        explanation: The chance that three items drawn without replacement from 6, of which 4 are good, are all good is $\frac{4}{6} \cdot \frac{3}{5} \cdot \frac{2}{4} = \frac{24}{120} = \frac{1}{5}$.
  work:
    - text: Slower now. For each question, say what is known, shrink the sample space to it, and only then count or multiply.
    - question:
        id: fix-conditional
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `conditional(outcomes, a, b)` should give the exact probability of event `a` given event `b`, where `outcomes` lists equally likely outcomes and `a` and `b` are functions that return `True` for the outcomes in each event. `b` always contains at least one outcome. The program should print `5/11 1/6`. It prints `5/36 1/36`. Find the fault and fix it.
        starter: |
          import itertools
          from fractions import Fraction

          def conditional(outcomes, a, b):
              inside_b = [o for o in outcomes if b(o)]
              both = [o for o in inside_b if a(o)]
              return Fraction(len(both), len(outcomes))

          def high(p):
              return p[0] + p[1] >= 10

          def has_six(p):
              return 6 in p

          def double(p):
              return p[0] == p[1]

          def first_six(p):
              return p[0] == 6

          pairs = list(itertools.product(range(1, 7), repeat=2))
          print(conditional(pairs, high, has_six), conditional(pairs, double, first_six))
        solution: |
          import itertools
          from fractions import Fraction

          def conditional(outcomes, a, b):
              inside_b = [o for o in outcomes if b(o)]
              both = [o for o in inside_b if a(o)]
              return Fraction(len(both), len(inside_b))

          def high(p):
              return p[0] + p[1] >= 10

          def has_six(p):
              return 6 in p

          def double(p):
              return p[0] == p[1]

          def first_six(p):
              return p[0] == 6

          pairs = list(itertools.product(range(1, 7), repeat=2))
          print(conditional(pairs, high, has_six), conditional(pairs, double, first_six))
        tests: |
          import random
          from fractions import Fraction
          random.seed(11)
          for _trial in range(300):
              _n = random.randint(1, 12)
              _outs = list(range(_n))
              _a = set(random.sample(_outs, random.randint(0, _n)))
              _b = set(random.sample(_outs, random.randint(1, _n)))
              _got = conditional(_outs, lambda _x, _s=_a: _x in _s, lambda _x, _s=_b: _x in _s)
              _want = Fraction(len(_a & _b), len(_b))
              assert isinstance(_got, Fraction), "conditional should return a Fraction"
              assert _got == _want, "With A = " + str(sorted(_a)) + " and B = " + str(sorted(_b)) + " among " + str(_n) + " outcomes, P(A | B) is " + str(_want) + ", not " + str(_got)
          assert output.strip() == "5/11 1/6", "The program should print 5/11 1/6"
        wrong:
          - |
            from fractions import Fraction

            def conditional(outcomes, a, b):
                inside_a = [o for o in outcomes if a(o)]
                both = [o for o in inside_a if b(o)]
                return Fraction(len(both), len(inside_a))

            print("5/11 1/6")
          - |
            from fractions import Fraction

            def conditional(outcomes, a, b):
                inside_b = [o for o in outcomes if b(o)]
                inside_a = [o for o in outcomes if a(o)]
                return Fraction(len(inside_a), len(outcomes))

            print("5/11 1/6")
        explanation: |
          Given $B$, the sample space shrinks to the outcomes of $B$, so the count of $A \cap B$ must be divided by $\lvert B \rvert$, not by the size of the whole sample space. Dividing by $\lvert \Omega \rvert$ gives $P(A \cap B)$. Dividing by $\lvert A \rvert$ gives $P(B \mid A)$, the conditional the wrong way round. Ignoring $B$ altogether gives $P(A)$, as if nothing were known.
    - question:
        id: write-other-side
        type: code
        mode: write
        system: s2
        prompt: |
          Generalise the puzzle. `cards` is a list of cards, each a pair of colours such as `("R", "W")`. A card is drawn at random and laid down with a random side up, and the side facing up shows the colour `shown`, which appears on at least one card. Write `other_side_same(cards, shown)`, the exact probability, as a `Fraction`, that the hidden side is also `shown`.
        starter: |
          from fractions import Fraction

          def other_side_same(cards, shown):
              return Fraction(0)

          party = [("R", "R"), ("W", "W"), ("R", "W")]
          print(other_side_same(party, "R"), other_side_same(party, "W"), other_side_same([("R", "W"), ("R", "W"), ("R", "R")], "R"))
        solution: |
          from fractions import Fraction

          def other_side_same(cards, shown):
              up_count = 0
              same_count = 0
              for first, second in cards:
                  for up, down in [(first, second), (second, first)]:
                      if up == shown:
                          up_count += 1
                          if down == shown:
                              same_count += 1
              return Fraction(same_count, up_count)

          party = [("R", "R"), ("W", "W"), ("R", "W")]
          print(other_side_same(party, "R"), other_side_same(party, "W"), other_side_same([("R", "W"), ("R", "W"), ("R", "R")], "R"))
        tests: |
          import random
          from fractions import Fraction
          random.seed(5)
          for _trial in range(300):
              _cards = [(random.choice("RWB"), random.choice("RWB")) for _i in range(random.randint(1, 6))]
              _colours = sorted({_c for _card in _cards for _c in _card})
              for _shown in _colours:
                  _faces = [(_u, _d) for _x, _y in _cards for _u, _d in [(_x, _y), (_y, _x)] if _u == _shown]
                  _want = Fraction(len([1 for _u, _d in _faces if _d == _shown]), len(_faces))
                  _got = other_side_same(list(_cards), _shown)
                  assert _got == _want, "For cards " + str(_cards) + " showing " + _shown + ", the chance is " + str(_want) + ", not " + str(_got)
          assert output.strip() == "2/3 2/3 1/2", "The program should print 2/3 2/3 1/2"
        wrong:
          - |
            from fractions import Fraction

            def other_side_same(cards, shown):
                possible = [card for card in cards if shown in card]
                same = [card for card in possible if card[0] == shown and card[1] == shown]
                return Fraction(len(same), len(possible))

            print("2/3 2/3 1/2")
          - |
            from fractions import Fraction

            def other_side_same(cards, shown):
                up_count = 0
                same_count = 0
                for first, second in cards:
                    for up, down in [(first, second), (second, first)]:
                        if up == shown:
                            up_count += 1
                    if first == shown and second == shown:
                        same_count += 1
                return Fraction(same_count, up_count)

            print("2/3 2/3 1/2")
        explanation: |
          The equally likely outcomes are the faces, a card and a side, not the cards. Keep the faces showing `shown`, and count those whose other side matches. A card with `shown` on both sides contributes two such faces, so it is twice as likely as a one-sided card to be the one on the table. Counting cards instead of faces gives the tempting one in two. Counting the double card once in the numerator, but twice in the denominator, mixes the two sample spaces.
    - question:
        id: write-all-good
        type: code
        mode: write
        system: s2
        prompt: |
          A batch has `total` items, `good` of them good. Write `all_good(good, total, draws)`, the exact probability, as a `Fraction`, that `draws` items taken at random one after another without putting any back are all good. Use the multiplication rule. You may assume `0 <= good <= total` and `0 <= draws <= total`.
        starter: |
          from fractions import Fraction

          def all_good(good, total, draws):
              return Fraction(0)

          print(all_good(7, 10, 3), all_good(3, 10, 2), all_good(2, 5, 3))
        solution: |
          from fractions import Fraction

          def all_good(good, total, draws):
              chance = Fraction(1)
              for i in range(draws):
                  chance *= Fraction(good - i, total - i)
              return chance

          print(all_good(7, 10, 3), all_good(3, 10, 2), all_good(2, 5, 3))
        tests: |
          import math
          from fractions import Fraction
          for _total in range(1, 13):
              for _good in range(0, _total + 1):
                  for _draws in range(0, _total + 1):
                      _want = Fraction(math.comb(_good, _draws), math.comb(_total, _draws))
                      _got = all_good(_good, _total, _draws)
                      assert _got == _want, "all_good(" + str(_good) + ", " + str(_total) + ", " + str(_draws) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "7/24 1/15 0", "The program should print 7/24 1/15 0"
        wrong:
          - |
            from fractions import Fraction

            def all_good(good, total, draws):
                return Fraction(good, total) ** draws

            print("7/24 1/15 0")
          - |
            from fractions import Fraction

            def all_good(good, total, draws):
                chance = Fraction(1)
                for i in range(draws):
                    chance *= Fraction(good - i, total)
                return chance

            print("7/24 1/15 0")
        explanation: |
          The first draw is good with chance $g/t$. Given that, $g - 1$ good items remain among $t - 1$, and so on, so the answer is $\frac{g}{t} \cdot \frac{g - 1}{t - 1} \cdots \frac{g - d + 1}{t - d + 1}$. If $d > g$ a factor is zero, as it should be. Raising $g/t$ to the power $d$ treats the draws as if each item were put back. Shrinking the good count but not the total forgets that the batch gets smaller too. The answer equals $\binom{g}{d} / \binom{t}{d}$, by counting sets of $d$ items.
