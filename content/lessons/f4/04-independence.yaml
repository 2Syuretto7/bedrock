        explanation: |
          For a sub-collection of $k$ events, $P(\text{all}) = \prod P(A_i)$ is $\lvert \text{all} \rvert / n = \prod (\lvert A_i \rvert / n)$, which in whole numbers is $\lvert \text{all} \rvert \cdot n^{k - 1} = \prod \lvert A_i \rvert$. Checking only pairs misses the two coins and "they match". Checking only the whole collection misses a pair that fails while the full product happens to hold. Multiplying by $n$ instead of $n^{k-1}$ is right for pairs only.
    - question:
        id: work-meera
        type: numeric
        system: s2
        tolerance: "0.00005"
        prompt: |
          In Meera's puzzle, the bag holding both devices is stolen with chance 0.01 in a year. If it is not stolen, each device fails on its own with chance 0.01, independently of the other. What is the chance she loses both copies in a year? Give a decimal to four places.
        answer: "0.0101"
        explanation: |
          Split by the theft. Stolen: both lost, chance $0.01$. Not stolen, chance $0.99$: both fail on their own with chance $0.01^2 = 0.0001$. In total $0.01 + 0.99 \times 0.0001 = 0.010099 \approx 0.0101$, about 25 times the $0.0004$ that multiplying the 2% chances suggests.
    - question:
        id: work-two-tests
        type: numeric
        system: s2
        prompt: |
          At Ravi's health camp, 1% of people have the condition. Each of two tests is positive with chance 0.9 for people who have it and 0.05 for people who do not, and the two tests are independent given whether a person has it. What is the chance that a random person at the camp tests positive on both?
        answer: "0.010575"
        explanation: |
          With the condition: $0.01 \times 0.9^2 = 0.0081$. Without: $0.99 \times 0.05^2 = 0.002475$. Total $0.010575$. Each test alone is positive with chance $0.0585$, and $0.0585^2 \approx 0.0034$ is far smaller, so the two results are not independent, even though they are independent given the person's state.
    - question:
        id: work-captain
        type: choice
        system: s2
        prompt: |
          A captain has lost eight tosses in a row with a fair coin. A commentator says that the next toss is very likely to go the captain's way, because losing nine in a row has chance only $1/512$. What is wrong?
        options:
          - "$1/512$ is the chance of nine losses seen from before the first toss. Given eight losses already, the ninth toss is still lost with chance $1/2$."
          - "Nothing: the ninth toss is won with chance $511/512$."
          - "The chance of nine losses in a row is $9/2$, not $1/512$."
          - "Tosses are disjoint events, so they cannot be multiplied."
        answer: 0
        explanation: |
          Before any toss, nine losses in a row had chance $(1/2)^9 = 1/512$. But eight have happened; the remaining question is about one independent toss, which goes either way with chance $1/2$. The commentator is committing the gambler's fallacy.
  connections:
    - text: |
        Meera loses both copies with chance about $0.0101$, one in 99, not one in 2,500. Multiplying chances is right only for independent events, and her two devices shared a common cause, the bag. Given that the bag was safe, they really were independent, and that conditional independence is what the honest calculation used.

        Independence means $P(A \cap B) = P(A)\,P(B)$: knowing one event leaves the chance of the other alone. It is a fact about the numbers, not about whether the events overlap, and disjoint events are never independent. Repeated throws and tosses are independent, which is why they multiply and why they have no memory. Several events need every sub-collection to multiply. Parts in series multiply their chances of working; parts in parallel multiply their chances of failing.

        So far every question has been about events, things that happen or do not. Most questions an engineer asks are about numbers: how many requests fail, how long a page takes to load, how much a policy pays. A number that depends on chance is [[f4.random-variables]], and independence extends to such numbers too.
