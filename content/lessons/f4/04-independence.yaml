            import itertools

            def mutually_independent(outcomes, events):
                n = len(outcomes)
                sizes = [len([o for o in outcomes if e(o)]) for e in events]
                for size in range(2, len(events) + 1):
                    for chosen in itertools.combinations(range(len(events)), size):
                        together = [o for o in outcomes if all(events[i](o) for i in chosen)]
                        product = 1
                        for i in chosen:
                            product *= sizes[i]
                        if len(together) * n != product:
                            return False
                return True

