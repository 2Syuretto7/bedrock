concept: f4.independence
minutes: 90
claim: You can test whether two events are independent by checking that P(A and B) = P(A) P(B), tell independence apart from disjointness, multiply chances across independent trials, compute the reliability of components in series and in parallel, tell pairwise from mutual independence, recognise conditional independence and common causes, and avoid the gambler's fallacy.
recalls: [f4.bayes-rule]
uses: [f4.bayes-rule, f4.conditional-probability, f4.sample-spaces-and-events, f3.counting-with-products-and-sums, f3.permutations-and-combinations, s1.comprehensions-and-iterators, s1.modules-and-imports, s0.functions, s0.loops, s0.lists-and-tuples]
leads: [f4.random-variables, f4.expectation-and-linearity, f4.variance, f4.common-discrete-distributions, f4.the-law-of-large-numbers-and-the-central-limit-theorem]
starter: |
  # Scratch space. Is "the first die is even" independent of "the total is 7"?
  import itertools

  pairs = list(itertools.product(range(1, 7), repeat=2))
  a = [p for p in pairs if p[0] % 2 == 0]
  b = [p for p in pairs if p[0] + p[1] == 7]
  both = [p for p in a if p in b]
  print(len(a), len(b), len(both), len(both) * len(pairs) == len(a) * len(b))
parts:
  recall:
    - text: |
        [[f4.bayes-rule]] multiplied the odds by 18 for each positive test, on the assumption that the second test's mistakes have nothing to do with the first's. That phrase needs a precise meaning. Three quick pulls first.
  puzzle:
    - text: |
        Meera keeps her final-year project in two places, on her laptop and on a pen drive. "Each has about a 2% chance of being lost or ruined in a year," she reasons, "so the chance of losing both is 2% of 2%, which is 0.04%, one in 2,500. I am safe."

        Then she thinks about how each could be lost. A device can fail on its own, a dead disk or a pen drive through the washing machine, with chance 1% in a year, and these failures have nothing to do with each other. But she also carries both in the same bag, and a bag is stolen with chance 1% in a year, taking both devices at once.

        Each device is still lost with chance about 2%. **What is the real chance of losing both copies in a year, and when is multiplying two chances the right thing to do?**
  intuition:
    - text: |
        Two dice once more. The chance that the total is 7 is $1/6$. Suppose you learn that the first die is even. Of the 18 results with an even first die, exactly 3 make 7: (2, 5), (4, 3) and (6, 1). So the chance is still $3/18 = 1/6$. The news changed nothing.

        That is no accident. Whatever the first die shows, exactly one face of the second die makes the total 7, so the first die can never make 7 more or less likely. Compare "the total is at least 10" given that the first die is even: now 4 of the 18 results qualify, $2/9$, more than the $1/6$ of before, because a 6 on the first die helps. Learning about the first die changes your view of a high total, but not of a total of 7.

        Two events are **independent** when knowing that one happened does not change the chance of the other. In the figure, switch the condition between events about the first die and look for the message that knowing the condition does not change the chance. Then try "the two dice match" given "the first die is even": also $1/6$, independent again, though "the two dice match" sounds like it should depend on the first die.
    - figure: dice-grid
      props: { event: seven, given: first-even }
    - text: |
        Independence is a fact about the numbers, not about stories. Doubles and "first die even" are linked in the story, since the second die must copy the first, yet they are independent, because a double is equally likely whatever the first die shows. Meera's two devices are linked by a bag that holds both, and that link is what her multiplication left out.
  derivation:
    - text: |
        **The definition.** Events $A$ and $B$ are **independent** when

        $$P(A \cap B) = P(A)\,P(B).$$

        If $P(B) > 0$, dividing by it gives the meaning: $P(A \mid B) = P(A)$, knowing $B$ leaves the chance of $A$ alone. The product form is preferred as the definition because it is symmetric, so $A$ independent of $B$ is the same as $B$ independent of $A$, and it makes sense even when $P(B) = 0$.

        With equally likely outcomes, independence is the count $\lvert A \cap B \rvert \cdot \lvert \Omega \rvert = \lvert A \rvert \cdot \lvert B \rvert$. For the first die even and a total of 7: $3 \times 36 = 108 = 18 \times 6$.

        **Complements.** If $A$ and $B$ are independent, so are $A$ and $B^c$:

        $$P(A \cap B^c) = P(A) - P(A \cap B) = P(A) - P(A)P(B) = P(A)\,\bigl(1 - P(B)\bigr) = P(A)\,P(B^c),$$

        where the first step splits $A$ into the disjoint parts inside and outside $B$. Applying this twice, $A^c$ and $B^c$ are independent too. Knowing that something did *not* happen is also no news.

        **Disjoint is not independent.** If $A$ and $B$ are disjoint and both have positive probability, then $P(A \cap B) = 0$ but $P(A)\,P(B) > 0$, so they are not independent. They are as dependent as events can be: if one happens, the other certainly did not. "Has nothing in common" and "has nothing to do with" are different ideas.
    - question:
        id: derivation-check
        type: choice
        system: s2
        prompt: |
          A card is drawn from a full pack of 52. Are "the card is a heart" and "the card is a king" independent?
        options:
          - "Yes: $P(\\text{heart and king}) = 1/52 = \\tfrac{1}{4} \\cdot \\tfrac{1}{13}$."
          - "No: the king of hearts is in both events, so they overlap."
          - "No: they are disjoint."
          - "It cannot be decided without drawing many cards."
        answer: 0
        explanation: |
          $P(\text{heart}) = 13/52 = 1/4$ and $P(\text{king}) = 4/52 = 1/13$, and exactly one card, the king of hearts, is both, so $P(\text{heart and king}) = 1/52$, which is the product. Knowing the card is a heart leaves the chance of a king at $1/13$. Overlapping is required for independence, not a sign against it.
    - text: |
        **Independent trials.** When a die is thrown again, or a coin tossed again, the physical setup makes each throw independent of the others, and then chances multiply across throws. That is what [[f4.sample-spaces-and-events]] used without saying so: four throws with no six have chance $(5/6)^4$, the product of the chances for each throw. In the equally likely model of all $6^4$ sequences, the count $5^4$ is exactly that product, so the two views agree.

        Independent trials have no memory. After five heads in a row, a fair coin is still heads with chance $1/2$, since the sixth toss is independent of the first five. Believing that tails is now "due" is the **gambler's fallacy**. Five heads followed by a tail is exactly as likely as six heads, $1/64$ each.

        **Several events.** Events $A_1, \dots, A_n$ are **mutually independent** when every sub-collection multiplies: $P(A_i \cap A_j) = P(A_i)\,P(A_j)$ for every pair, $P(A_i \cap A_j \cap A_k) = P(A_i)\,P(A_j)\,P(A_k)$ for every three, and so on. Checking pairs is not enough. Toss two coins; let $A$ be "the first is heads", $B$ "the second is heads" and $C$ "the two match". Each has chance $1/2$, and each pair has chance $1/4$ of both happening, so the three are pairwise independent. But $A$ and $B$ together force $C$: $P(A \cap B \cap C) = 1/4$, not $1/8$.

        **Reliability.** A system whose parts must all work is in **series**; one that works if any part works is in **parallel**. With independent parts that work with chances $p_1, \dots, p_n$,

        $$P(\text{series works}) = p_1 p_2 \cdots p_n, \qquad P(\text{parallel works}) = 1 - (1 - p_1)(1 - p_2) \cdots (1 - p_n),$$

        the second by the complement: a parallel system fails only if every part fails. Three servers each up 90% of the time give $0.729$ in series and $0.999$ in parallel. This is why every serious service runs copies of everything.
    - question:
        id: order-parallel
        type: order
        system: s2
        prompt: |
          A website runs on two servers in parallel, each up with chance 0.99, failing independently. Put the steps for the chance that the site is up in order.
        steps:
          - "The site is down only when both servers are down."
          - "Each server is down with chance $1 - 0.99 = 0.01$."
          - "By independence, both are down with chance $0.01 \\times 0.01 = 0.0001$."
          - "So the site is up with chance $1 - 0.0001 = 0.9999$."
        explanation: |
          Parallel systems are computed through the complement, because "all fail" is a single intersection that independence lets you multiply. The result, "four nines", is only as good as the word "independently".
    - text: |
        **Common causes.** "Four nines" assumes the servers fail independently. If they share a power supply, a network switch or a software release, one cause can take both down, and the product badly underestimates the chance of failing together. Engineers call this a common-cause or correlated failure, and spreading copies across separate buildings, power grids and cities is the fix.

        Meera's bag is a common cause. Her device is lost if the bag is stolen, or if not, if the device fails on its own:

        $$P(\text{laptop lost}) = 0.01 + 0.99 \times 0.01 = 0.0199,$$

        about 2%, and the same for the pen drive. Both are lost if the bag is stolen, or if not, if both fail on their own:

        $$P(\text{both lost}) = 0.01 + 0.99 \times 0.01 \times 0.01 = 0.010099,$$

        about 1 in 99. The product $0.0199^2 \approx 0.0004$ is 25 times too small. A copy in the cloud, which no bag theft can reach, is the real backup.

        **Conditional independence.** Within each case, the devices fail independently: given that the bag is not stolen, losing the laptop tells you nothing more about the pen drive. Events $A$ and $B$ are **independent given $C$** when $P(A \cap B \mid C) = P(A \mid C)\,P(B \mid C)$. Ravi's two tests in the last lesson were independent given his true state, but not independent outright: a positive first test raises the chance that he has the condition, which raises the chance of a positive second test. Across all 10,000 people, both tests are positive with chance $0.01 \times 0.9^2 + 0.99 \times 0.05^2 \approx 0.0106$, about three times the $0.0585^2 \approx 0.0034$ that multiplying would give.

        **Checking in Python.** On a finite equally likely sample space, independence is a comparison of counts, done exactly in integers:

        ```python
        import itertools

        pairs = list(itertools.product(range(1, 7), repeat=2))
        a = [p for p in pairs if p[0] % 2 == 0]
        b = [p for p in pairs if p[0] + p[1] == 7]
        both = [p for p in a if p in b]
        print(len(both) * len(pairs) == len(a) * len(b))
        ```

        This prints `True`. Comparing the floating-point products `len(both) / 36` and `(len(a) / 36) * (len(b) / 36)` with `==` could fail on a rounding difference even when the events are independent.
  formal:
    - text: |
        **Independence.** $A$ and $B$ are independent when $P(A \cap B) = P(A)\,P(B)$; when $P(B) > 0$ this is $P(A \mid B) = P(A)$. If $A$ and $B$ are independent, so are $A$ and $B^c$, $A^c$ and $B$, and $A^c$ and $B^c$.

        **Disjointness.** Disjoint events with positive probabilities are never independent.

        **Mutual independence.** $A_1, \dots, A_n$ are mutually independent when $P(A_{i_1} \cap \cdots \cap A_{i_k}) = P(A_{i_1}) \cdots P(A_{i_k})$ for every sub-collection of two or more. Pairwise independence does not imply mutual independence.

        **Reliability.** For independent parts with chances $p_i$ of working: series works with chance $\prod p_i$; parallel with chance $1 - \prod (1 - p_i)$.

        **Conditional independence.** $A$ and $B$ are independent given $C$ when $P(A \cap B \mid C) = P(A \mid C)\,P(B \mid C)$. Neither conditional independence nor independence implies the other.
  drill:
    - text: Seconds each. Multiply only when the events are independent.
    - question:
        id: drill-product
        type: numeric
        system: s1
        prompt: |
          $A$ and $B$ are independent, with $P(A) = 0.3$ and $P(B) = 0.5$. What is $P(A \cap B)$?
        answer: "0.15"
        explanation: $0.3 \times 0.5 = 0.15$.
    - question:
        id: drill-union
        type: numeric
        system: s1
        prompt: |
          $A$ and $B$ are independent, with $P(A) = 0.3$ and $P(B) = 0.5$. What is $P(A \cup B)$?
        answer: "0.65"
        explanation: $0.3 + 0.5 - 0.15 = 0.65$, or $1 - 0.7 \times 0.5 = 0.65$ through the complements, which are independent too.
    - question:
        id: drill-series
        type: numeric
        system: s1
        prompt: |
          A request passes through three services in series, each up with chance 0.9, independently. What is the chance the request succeeds?
        answer: "0.729"
        explanation: $0.9^3 = 0.729$.
    - question:
        id: drill-parallel
        type: numeric
        system: s1
        prompt: |
          Two independent servers in parallel are each up with chance 0.9. What is the chance that at least one is up?
        answer: "0.99"
        explanation: Both are down with chance $0.1^2 = 0.01$.
    - question:
        id: drill-memory
        type: numeric
        system: s1
        prompt: |
          A fair coin has come up heads five times in a row. What is the chance that the next toss is heads?
        answer: "1/2"
        explanation: Tosses are independent; the coin has no memory of the first five.
    - question:
        id: drill-disjoint
        type: choice
        system: s1
        prompt: |
          $A$ and $B$ are disjoint, with $P(A) = 0.2$ and $P(B) = 0.3$. Are they independent?
        options: ["No", "Yes", "Only if $P(A \\cup B) = 0.5$", "It depends on the experiment"]
        answer: 0
        explanation: $P(A \cap B) = 0$ but $P(A)\,P(B) = 0.06$. If one happens, the other cannot, which is the opposite of "no news".
    - question:
        id: predict-independent
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import itertools

          pairs = list(itertools.product(range(1, 7), repeat=2))
          a = [p for p in pairs if p[0] % 2 == 0]
          b = [p for p in pairs if p[0] + p[1] >= 10]
          both = [p for p in a if p in b]
          print(len(a), len(b), len(both), len(both) * 36 == len(a) * len(b))
        output: "18 6 4 False"
        explanation: An even first die allows (4, 6), (6, 4), (6, 5) and (6, 6), four results, while independence would need $18 \times 6 / 36 = 3$. A high total depends on the first die.
    - question:
        id: predict-reliability
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          up = 0.9
          series = up * up * up
          parallel = 1 - (1 - up) ** 3
          print(round(series, 3), round(parallel, 3))
        output: "0.729 0.999"
        explanation: Three parts in series all work with chance $0.9^3$; three in parallel all fail with chance $0.1^3 = 0.001$.
  work:
    - text: Slower now. Before multiplying any two chances, name the reason they are independent, and look for a common cause that would break it.
    - question:
        id: fix-independent
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `independent(outcomes, a, b)` should say whether events `a` and `b` are independent, where `outcomes` lists equally likely outcomes and the events are functions returning `True` or `False`. The program should print `True False False`. It prints `False False True`. Find the fault and fix it.
        starter: |
          import itertools

          def independent(outcomes, a, b):
              both = [o for o in outcomes if a(o) and b(o)]
              return len(both) == 0

          def first_even(p):
              return p[0] % 2 == 0

          def seven(p):
              return p[0] + p[1] == 7

          def high(p):
              return p[0] + p[1] >= 10

          def first_one(p):
              return p[0] == 1

          def first_two(p):
              return p[0] == 2

          pairs = list(itertools.product(range(1, 7), repeat=2))
          print(independent(pairs, first_even, seven), independent(pairs, first_even, high), independent(pairs, first_one, first_two))
        solution: |
          import itertools

          def independent(outcomes, a, b):
              in_a = [o for o in outcomes if a(o)]
              in_b = [o for o in outcomes if b(o)]
              both = [o for o in in_a if b(o)]
              return len(both) * len(outcomes) == len(in_a) * len(in_b)

          def first_even(p):
              return p[0] % 2 == 0

          def seven(p):
              return p[0] + p[1] == 7

          def high(p):
              return p[0] + p[1] >= 10

          def first_one(p):
              return p[0] == 1

          def first_two(p):
              return p[0] == 2

          pairs = list(itertools.product(range(1, 7), repeat=2))
          print(independent(pairs, first_even, seven), independent(pairs, first_even, high), independent(pairs, first_one, first_two))
        tests: |
          import random
          random.seed(29)
          for _trial in range(400):
              _n = random.randint(1, 12)
              _outs = list(range(_n))
              _a = set(random.sample(_outs, random.randint(0, _n)))
              _b = set(random.sample(_outs, random.randint(0, _n)))
              _want = len(_a & _b) * _n == len(_a) * len(_b)
              _got = independent(_outs, lambda _x, _s=_a: _x in _s, lambda _x, _s=_b: _x in _s)
              assert _got == _want, "With " + str(_n) + " outcomes, A = " + str(sorted(_a)) + " and B = " + str(sorted(_b)) + ", independent should be " + str(_want)
          assert independent(list(range(4)), lambda _x: _x < 2, lambda _x: _x % 2 == 0) is True, "0, 1 and 0, 2 out of 0 to 3 are independent"
          assert output.strip() == "True False False", "The program should print True False False"
        wrong:
          - |
            def independent(outcomes, a, b):
                in_a = [o for o in outcomes if a(o)]
                in_b = [o for o in outcomes if b(o)]
                both = [o for o in in_a if b(o)]
                return len(both) == len(in_a) * len(in_b)

            print("True False False")
          - |
            def independent(outcomes, a, b):
                in_a = [o for o in outcomes if a(o)]
                both = [o for o in in_a if b(o)]
                return len(both) > 0

            print("True False False")
        explanation: |
          Independence is not the absence of overlap; it is the right *amount* of overlap. $P(A \cap B) = P(A)\,P(B)$ becomes, after multiplying through by $\lvert \Omega \rvert^2$, the integer test $\lvert A \cap B \rvert \cdot \lvert \Omega \rvert = \lvert A \rvert \cdot \lvert B \rvert$. Testing for no overlap finds disjoint events, which are dependent. Comparing counts without the factor $\lvert \Omega \rvert$ mixes counts with probabilities, and "some overlap" is not enough either: a high total overlaps "first die even" but depends on it.
    - question:
        id: write-system
        type: code
        mode: write
        system: s2
        prompt: |
          A service is built in stages, one after another, and every stage must work. Each stage has one or more copies of a component in parallel, and a stage works if at least one copy works. Every copy works independently with its own chance. `stages` is a list of stages, each a list of `Fraction`s, the chances of its copies working. Write `chance_up(stages)`, the exact chance that the whole service works.
        starter: |
          from fractions import Fraction

          def chance_up(stages):
              return Fraction(0)

          web = [Fraction(9, 10), Fraction(9, 10)]
          database = [Fraction(99, 100)]
          print(chance_up([web, database]), chance_up([database, database]), chance_up([[Fraction(1, 2)] * 3]))
        solution: |
          from fractions import Fraction

          def chance_up(stages):
              chance = Fraction(1)
              for copies in stages:
                  all_down = Fraction(1)
                  for p in copies:
                      all_down *= 1 - p
                  chance *= 1 - all_down
              return chance

          web = [Fraction(9, 10), Fraction(9, 10)]
          database = [Fraction(99, 100)]
          print(chance_up([web, database]), chance_up([database, database]), chance_up([[Fraction(1, 2)] * 3]))
        tests: |
          import itertools
          import random
          from fractions import Fraction
          random.seed(31)
          for _trial in range(150):
              _stages = [[Fraction(random.randint(0, 10), 10) for _j in range(random.randint(1, 3))] for _i in range(random.randint(0, 3))]
              _flat = [_p for _st in _stages for _p in _st]
              _want = Fraction(0)
              for _state in itertools.product([True, False], repeat=len(_flat)):
                  _chance = Fraction(1)
                  for _p, _up in zip(_flat, _state):
                      _chance *= _p if _up else 1 - _p
                  _k = 0
                  _ok = True
                  for _st in _stages:
                      if not any(_state[_k:_k + len(_st)]):
                          _ok = False
                      _k += len(_st)
                  if _ok:
                      _want += _chance
              _got = chance_up([list(_st) for _st in _stages])
              assert _got == _want, "For stages " + str([[str(_p) for _p in _st] for _st in _stages]) + ", the chance is " + str(_want) + ", not " + str(_got)
          assert output.strip() == "9801/10000 9801/10000 7/8", "The program should print 9801/10000 9801/10000 7/8"
        wrong:
          - |
            from fractions import Fraction

            def chance_up(stages):
                chance = Fraction(1)
                for copies in stages:
                    for p in copies:
                        chance *= p
                return chance

            print("9801/10000 9801/10000 7/8")
          - |
            from fractions import Fraction

            def chance_up(stages):
                chance = Fraction(1)
                for copies in stages:
                    all_down = Fraction(1)
                    for p in copies:
                        all_down *= 1 - p
                    chance *= all_down
                return chance

            print("9801/10000 9801/10000 7/8")
          - |
            from fractions import Fraction

            def chance_up(stages):
                chance = Fraction(0)
                for copies in stages:
                    all_down = Fraction(1)
                    for p in copies:
                        all_down *= 1 - p
                    chance += 1 - all_down
                return chance

            print("9801/10000 9801/10000 7/8")
        explanation: |
          A stage fails only when all its copies fail, which by independence has chance $\prod (1 - p)$, so it works with chance $1 - \prod (1 - p)$. The stages are in series, so their chances multiply. Multiplying every copy's chance treats the copies as if all of them were needed. Multiplying the "all down" chances gives the chance that every stage fails. Adding the stage chances can exceed 1. With no stages at all, nothing can fail, and the answer is 1.
    - question:
        id: write-mutual
        type: code
        mode: write
        system: s2
        prompt: |
          Write `mutually_independent(outcomes, events)`. `outcomes` lists equally likely outcomes and `events` is a list of functions, each returning `True` for the outcomes in its event. Return `True` if every sub-collection of two or more events multiplies, and `False` otherwise. Work with whole-number counts so that the test is exact.
        starter: |
          import itertools

          def mutually_independent(outcomes, events):
              return True

          def first_heads(t):
              return t[0] == "H"

          def second_heads(t):
              return t[1] == "H"

          def match(t):
              return t[0] == t[1]

          tosses = list(itertools.product("HT", repeat=2))
          print(mutually_independent(tosses, [first_heads, second_heads]), mutually_independent(tosses, [first_heads, second_heads, match]))
        solution: |
          import itertools

          def mutually_independent(outcomes, events):
              n = len(outcomes)
              sizes = [len([o for o in outcomes if e(o)]) for e in events]
              for size in range(2, len(events) + 1):
                  for chosen in itertools.combinations(range(len(events)), size):
                      together = [o for o in outcomes if all(events[i](o) for i in chosen)]
                      product = 1
                      for i in chosen:
                          product *= sizes[i]
                      if len(together) * n ** (size - 1) != product:
                          return False
              return True

          def first_heads(t):
              return t[0] == "H"

          def second_heads(t):
              return t[1] == "H"

          def match(t):
              return t[0] == t[1]

          tosses = list(itertools.product("HT", repeat=2))
          print(mutually_independent(tosses, [first_heads, second_heads]), mutually_independent(tosses, [first_heads, second_heads, match]))
        tests: |
          import itertools
          import random
          from fractions import Fraction
          def _check(_outs, _sets):
              _n = len(_outs)
              for _size in range(2, len(_sets) + 1):
                  for _ch in itertools.combinations(_sets, _size):
                      _p = Fraction(1)
                      for _s in _ch:
                          _p *= Fraction(len(_s), _n)
                      _common = set(_outs)
                      for _s in _ch:
                          _common &= _s
                      if Fraction(len(_common), _n) != _p:
                          return False
              return True
          random.seed(37)
          _seen = set()
          for _trial in range(400):
              _n = random.choice([4, 6, 8, 9, 12])
              _outs = list(range(_n))
              _sets = [set(random.sample(_outs, random.randint(0, _n))) for _k in range(random.randint(1, 4))]
              _want = _check(_outs, _sets)
              _seen.add(_want)
              _got = mutually_independent(_outs, [lambda _x, _s=_s: _x in _s for _s in _sets])
              assert _got == _want, "With " + str(_n) + " outcomes and events " + str([sorted(_s) for _s in _sets]) + ", the answer is " + str(_want)
          _cube = list(itertools.product([0, 1], repeat=3))
          _bits = [lambda _t, _i=_i: _t[_i] == 1 for _i in range(3)]
          assert mutually_independent(_cube, _bits) is True, "Three fair coins: each showing heads is mutually independent"
          _par = _bits[:2] + [lambda _t: _t[0] == _t[1]]
          assert mutually_independent(list(itertools.product([0, 1], repeat=2)), _par) is False, "Two coins with 'they match' are only pairwise independent"
          _trip = [lambda _x: _x < 4, lambda _x: _x < 4, lambda _x: _x in (0, 4, 5, 6)]
          assert mutually_independent(list(range(8)), _trip) is False, "A pair can fail to multiply even when the whole triple does"
          assert output.strip() == "True False", "The program should print True False"
