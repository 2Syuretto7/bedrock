concept: f4.expectation-and-linearity
minutes: 90
claim: You can compute the expectation of a random variable as the probability-weighted average of its values and read it as a long-run average and a balance point, find the expectation of a function of a random variable without finding its distribution, use linearity of expectation, even for dependent variables, to count expected numbers through indicators, compute an expectation from tail probabilities, and know when E[XY] = E[X] E[Y] and when E[g(X)] = g(E[X]) fail.
recalls: [f4.random-variables]
uses: [f4.random-variables, f4.independence, f4.sample-spaces-and-events, f3.permutations-and-combinations, f3.counting-with-products-and-sums, f1.summation-notation, s2.hash-tables, s1.comprehensions-and-iterators, s1.modules-and-imports, s0.dictionaries-and-sets, s0.functions, s0.loops]
leads: [f4.variance, f4.common-discrete-distributions, f4.the-birthday-problem-and-collisions, f4.tail-bounds, f4.the-law-of-large-numbers-and-the-central-limit-theorem, s3.randomised-algorithms]
starter: |
  # Scratch space. Hand out 4 tiffins at random. On average, how many reach their owners?
  import itertools

  orders = list(itertools.permutations(range(4)))
  right = [sum(1 for person in range(4) if order[person] == person) for order in orders]
  print(len(orders), sum(right) / len(orders))
parts:
  recall:
    - text: |
        [[f4.random-variables]] described a number that depends on chance by its whole distribution, a value and a chance for every possibility. Often one number is enough: what happens on average. Three quick pulls first.
  puzzle:
    - text: |
        Mumbai's dabbawalas deliver lakhs of lunch boxes a day, and they are famous for almost never sending one to the wrong desk. Imagine a new helper on his first day, though. He brings 30 tiffins to an office of 30 people, cannot read the markings, and hands them out completely at random, one to each person, every possible way of matching tiffins to people being equally likely.

        Some people may get their own lunch by luck. **On average, how many of the 30 do?** And if the office had 300 people, would the answer be bigger or smaller?
  intuition:
    - text: |
        Start with something simpler. A stall at the mela charges nothing to play: you throw two dice, and if they match the stall pays you 20 rupees, and if they do not you pay the stall 5. Is it worth playing?

        Imagine playing 36,000 times. Doubles come up in about a sixth of the throws, so about 6,000 times you win 20 rupees, and about 30,000 times you lose 5. You end up about $6{,}000 \times 20 - 30{,}000 \times 5 = 1{,}20{,}000 - 1{,}50{,}000 = -30{,}000$ rupees, which is $-30{,}000 / 36{,}000 \approx -0.83$ rupees a game. The stall expects to earn about 83 paise every time someone plays.

        That number, the average you would get over a long run of plays, is the **expectation** of the prize. Notice the calculation: each value times its chance, added up, $20 \times \tfrac16 + (-5) \times \tfrac56 = -\tfrac56$. No single game ever pays $-0.83$; it is an average, not a prediction of any one throw.

        The figure shows it as a balance point. If each bar were a weight on a light rod, the rod would balance on the marked point. A heavy bar at $-5$ and a light one far out at $20$ balance just below zero. Switch to the other variables and see where they balance: the total at 7, where it is symmetric, and the larger number well above the middle.
    - figure: variable-bars
      props: { variable: prize, marks: mean }
    - text: |
        For the tiffins, the direct route is hopeless: a pmf for "how many people get their own tiffin" would need counting arrangements of 30 tiffins, and there are $30!$ of them, a 33-digit number. The rule in this lesson goes round that wall entirely.
  derivation:
    - text: |
        **Expectation.** The **expectation**, expected value or mean of a random variable $X$ is

        $$E[X] = \sum_x x \, P(X = x),$$

        the sum, over its values, of each value times its chance. It is often written $\mu$. Grouping by outcomes instead of by values gives the same total, $E[X] = \sum_{\omega} X(\omega)\,P(\{\omega\})$, since each outcome contributes its value times its chance either way; the second form is the one that makes the rules below easy.

        A fair die has $E[X] = (1 + 2 + 3 + 4 + 5 + 6)/6 = 3.5$, a value the die can never show. The expectation is a long-run average, as with the stall, and the balance point of the pmf. [[f4.the-law-of-large-numbers-and-the-central-limit-theorem]] will prove that averages of many independent plays really do settle near it.

        **Functions of a random variable.** To find $E[g(X)]$ there is no need for the distribution of $g(X)$. Apply $g$ to each value and weight by the same chances:

        $$E[g(X)] = \sum_x g(x)\,P(X = x).$$

        This works because grouping the outcomes by $x$ instead of by $g(x)$ is just adding the same terms in a different order. For a fair die, $E[X^2] = (1 + 4 + 9 + 16 + 25 + 36)/6 = 91/6 \approx 15.17$.

        That is not $(E[X])^2 = 12.25$. In general $E[g(X)] \ne g(E[X])$: the average of the squares is not the square of the average. The gap between those two numbers will measure spread in [[f4.variance]].
    - question:
        id: derivation-mean
        type: numeric
        system: s2
        prompt: |
          A game pays 100 rupees with chance $0.05$, 10 rupees with chance $0.2$, and nothing otherwise. What is the expected payout, in rupees?
        answer: "7"
        explanation: |
          $100 \times 0.05 + 10 \times 0.2 + 0 \times 0.75 = 5 + 2 = 7$. A ticket priced above 7 rupees loses money on average.
    - text: |
        **Linearity.** For any random variables $X$ and $Y$ on the same sample space, and any numbers $a$ and $b$,

        $$E[X + Y] = E[X] + E[Y], \qquad E[aX + b] = a\,E[X] + b.$$

        The proof is one line with the outcome form: $\sum_\omega \bigl(X(\omega) + Y(\omega)\bigr) P(\{\omega\})$ splits into $\sum_\omega X(\omega)\,P(\{\omega\}) + \sum_\omega Y(\omega)\,P(\{\omega\})$, the [[f1.summation-notation]] rule for a sum of sums. **Nothing is assumed about independence.** $X$ and $Y$ can be as tangled as you like, and the expectation of the sum is still the sum of the expectations. The total of two dice has expectation $3.5 + 3.5 = 7$, with no table needed.

        **Indicators.** The indicator of an event has expectation $E[\mathbf{1}_A] = 1 \cdot P(A) + 0 \cdot P(A^c) = P(A)$. So if a count is a sum of indicators, $N = \mathbf{1}_{A_1} + \cdots + \mathbf{1}_{A_n}$, then

        $$E[N] = P(A_1) + \cdots + P(A_n).$$

        The expected number of sixes in 60 throws of a die is $60 \times \tfrac16 = 10$, and the expected number of heads in $n$ tosses is $n/2$. This is how expected counts are almost always found: write the count as a sum of indicators, find each chance, and add.

        **The tiffins.** Let $A_i$ be the event that person $i$ gets their own tiffin. In a random arrangement, person $i$'s tiffin is equally likely to be any of the $n$, so $P(A_i) = 1/n$. The number who get their own is $N = \mathbf{1}_{A_1} + \cdots + \mathbf{1}_{A_n}$, so

        $$E[N] = n \times \frac1n = 1.$$

        One person, on average, whether the office has 30 people or 300 or 3 crore. The events $A_i$ are far from independent: if 29 people have their own tiffin, so does the 30th. Linearity did not care.
    - question:
        id: order-indicators
        type: order
        system: s2
        prompt: |
          A hash table has $m$ buckets, and $n$ keys are each put in a bucket chosen uniformly at random, independently. Put the steps for the expected number of pairs of keys that share a bucket in order.
        steps:
          - "For each of the $\\binom{n}{2}$ pairs of keys, let its indicator be 1 if the two keys land in the same bucket."
          - "The number of colliding pairs is the sum of these indicators."
          - "Whatever bucket the first key of a pair lands in, the second lands there with chance $1/m$."
          - "By linearity, the expected number of colliding pairs is $\\binom{n}{2} / m$."
        explanation: |
          Each pair collides with chance $1/m$, and linearity adds the chances, although the pair events overlap and are not all independent. With 23 keys and 365 buckets, the expected number of colliding pairs is $253/365 \approx 0.69$, a first glimpse of [[f4.the-birthday-problem-and-collisions]].
    - text: |
        **Products need independence.** For independent $X$ and $Y$,

        $$E[XY] = E[X]\,E[Y],$$

        because the joint pmf is the product of the marginals, and the double sum $\sum_x \sum_y xy\,p_X(x)\,p_Y(y)$ factors into $\bigl(\sum_x x\,p_X(x)\bigr)\bigl(\sum_y y\,p_Y(y)\bigr)$. Without independence it can fail: with $X$ the number on a die, $E[X \cdot X] = 91/6$ but $E[X]\,E[X] = 49/4$. Sums never need independence; products do.

        **Tail sums.** For a random variable whose values are whole numbers $0, 1, 2, \dots$,

        $$E[X] = \sum_{k \ge 1} P(X \ge k).$$

        Write $X$ as the sum of the indicators of "$X \ge 1$", "$X \ge 2$", and so on: a value of 3 switches on exactly the first three. Then take expectations. For the larger of two dice, $P(\text{larger} \ge k) = 1 - (k - 1)^2/36$, so

        $$E[\text{larger}] = \sum_{k=1}^{6} \Bigl(1 - \frac{(k - 1)^2}{36}\Bigr) = 6 - \frac{0 + 1 + 4 + 9 + 16 + 25}{36} = 6 - \frac{55}{36} = \frac{161}{36} \approx 4.47.$$

        **Computing in Python.** With a pmf as a dictionary, an expectation is one sum:

        ```python
        from fractions import Fraction

        pmf = {20: Fraction(1, 6), -5: Fraction(5, 6)}
        print(sum(x * p for x, p in pmf.items()))
        ```

        This prints `-5/6`, the stall's prize. For the tiffins, listing all $4! = 24$ arrangements of four tiffins and averaging the number of matches gives exactly 1, a check worth running once, because for 30 tiffins no listing is possible and linearity is the only way.
  formal:
    - text: |
        **Expectation.** $E[X] = \sum_x x\,P(X = x) = \sum_\omega X(\omega)\,P(\{\omega\})$, when the sum converges absolutely.

        **Functions.** $E[g(X)] = \sum_x g(x)\,P(X = x)$. In general $E[g(X)] \ne g(E[X])$.

        **Linearity.** $E[aX + bY + c] = a\,E[X] + b\,E[Y] + c$ for any random variables $X$ and $Y$, independent or not, and similarly for any finite sum.

        **Indicators.** $E[\mathbf{1}_A] = P(A)$, so $E\bigl[\sum_i \mathbf{1}_{A_i}\bigr] = \sum_i P(A_i)$.

        **Products.** If $X$ and $Y$ are independent, $E[XY] = E[X]\,E[Y]$.

        **Tail sum.** If $X$ takes values in $\{0, 1, 2, \dots\}$, then $E[X] = \sum_{k \ge 1} P(X \ge k)$.
  drill:
    - text: Seconds each. Value times chance, added up; or split into pieces and add their expectations.
    - question:
        id: drill-die
        type: numeric
        system: s1
        prompt: |
          What is the expectation of the number shown by a fair die?
        answer: "3.5"
        explanation: $21/6 = 3.5$.
    - question:
        id: drill-linear
        type: numeric
        system: s1
        prompt: |
          $E[X] = 4$. What is $E[2X + 3]$?
        answer: "11"
        explanation: $2 \times 4 + 3 = 11$.
    - question:
        id: drill-sum
        type: numeric
        system: s1
        prompt: |
          $E[X] = 2$ and $E[Y] = 5$, and $X$ and $Y$ are not independent. What is $E[X + Y]$?
        answer: "7"
        explanation: Linearity needs no independence.
    - question:
        id: drill-heads
        type: numeric
        system: s1
        prompt: |
          What is the expected number of heads in 10 tosses of a fair coin?
        answer: "5"
        explanation: Ten indicators, each with expectation $1/2$.
    - question:
        id: drill-ticket
        type: numeric
        system: s1
        prompt: |
          A scratch card wins 10 rupees with chance $0.2$ and nothing otherwise. What is its expected prize, in rupees?
        answer: "2"
        explanation: $10 \times 0.2 = 2$.
    - question:
        id: drill-indicator
        type: choice
        system: s1
        prompt: |
          What does $E[X + Y] = E[X] + E[Y]$ require of $X$ and $Y$?
        options: ["Nothing, beyond having expectations", "Independence", "The same distribution", "Disjointness"]
        answer: 0
        explanation: Linearity holds for any random variables with expectations. Independence is needed for products, not for sums.
    - question:
        id: predict-moments
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          from fractions import Fraction

          pmf = {0: Fraction(1, 4), 1: Fraction(1, 2), 2: Fraction(1, 4)}
          mean = sum(x * p for x, p in pmf.items())
          square = sum(x * x * p for x, p in pmf.items())
          print(mean, square, mean * mean)
        output: "1 3/2 1"
        explanation: $E[X] = 0 + 1/2 + 2/4 = 1$ and $E[X^2] = 0 + 1/2 + 4/4 = 3/2$, which is not $(E[X])^2 = 1$.
    - question:
        id: predict-matches
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import itertools
          from fractions import Fraction

          orders = list(itertools.permutations(range(4)))
          right = [sum(1 for i in range(4) if order[i] == i) for order in orders]
          print(len(orders), Fraction(sum(right), len(orders)))
        output: "24 1"
        explanation: There are $4! = 24$ arrangements, and the average number of people with their own tiffin is exactly 1, as linearity says.
  work:
    - text: Slower now. For every expected count, write the count as a sum of indicators before computing anything.
    - question:
        id: fix-mean
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `expected_value(pmf)` should return the expectation of a random variable whose pmf is a dictionary from values to chances. The program should print `161/36 7`, for the larger of two dice and for their total. It prints `7/2 7`. Find the fault and fix it.
        starter: |
          import itertools
          from fractions import Fraction

          def expected_value(pmf):
              return Fraction(sum(pmf), len(pmf))

          larger = {}
          total = {}
          for a, b in itertools.product(range(1, 7), repeat=2):
              larger[max(a, b)] = larger.get(max(a, b), 0) + Fraction(1, 36)
              total[a + b] = total.get(a + b, 0) + Fraction(1, 36)
          print(expected_value(larger), expected_value(total))
        solution: |
          import itertools
          from fractions import Fraction

          def expected_value(pmf):
              return sum(x * p for x, p in pmf.items())

          larger = {}
          total = {}
          for a, b in itertools.product(range(1, 7), repeat=2):
              larger[max(a, b)] = larger.get(max(a, b), 0) + Fraction(1, 36)
              total[a + b] = total.get(a + b, 0) + Fraction(1, 36)
          print(expected_value(larger), expected_value(total))
        tests: |
          import random
          from fractions import Fraction
          random.seed(53)
          for _trial in range(300):
              _k = random.randint(1, 6)
              _xs = random.sample(range(-10, 11), _k)
              _w = [random.randint(1, 9) for _i in range(_k)]
              _pmf = {_xs[_i]: Fraction(_w[_i], sum(_w)) for _i in range(_k)}
              _want = sum(_x * _p for _x, _p in _pmf.items())
              _got = expected_value(dict(_pmf))
              assert _got == _want, "For the pmf " + str({_x: str(_p) for _x, _p in _pmf.items()}) + ", the expectation is " + str(_want) + ", not " + str(_got)
          assert output.strip() == "161/36 7", "The program should print 161/36 7"
        wrong:
          - |
            def expected_value(pmf):
                return sum(pmf.values()) / len(pmf)

            print("161/36 7")
          - |
            def expected_value(pmf):
                best = max(pmf, key=lambda x: pmf[x])
                return best

            print("161/36 7")
        explanation: |
          The expectation weights each value by its chance, $\sum x\,P(X = x)$. Averaging the distinct values treats them as equally likely, which is right for the total only because its pmf is symmetric about 7; the larger number piles its chance onto high values, so its mean, $161/36 \approx 4.47$, is well above the middle value 3.5. The most likely value is a different summary altogether.
    - question:
        id: write-collisions
        type: code
        mode: write
        system: s2
        prompt: |
          `n` keys are put into a hash table with `m` buckets, each key into a bucket chosen uniformly at random, independently of the others. Write `expected_collisions(n, m)`, the exact expected number of pairs of keys that land in the same bucket, as a `Fraction`. Use indicators and linearity.
        starter: |
          from fractions import Fraction

          def expected_collisions(n, m):
              return Fraction(0)

          print(expected_collisions(23, 365), expected_collisions(10, 100), expected_collisions(1000, 1000))
        solution: |
          import math
          from fractions import Fraction

          def expected_collisions(n, m):
              return Fraction(math.comb(n, 2), m)

          print(expected_collisions(23, 365), expected_collisions(10, 100), expected_collisions(1000, 1000))
        tests: |
          import itertools
          from fractions import Fraction
          for _n in range(0, 5):
              for _m in range(1, 5):
                  _ways = list(itertools.product(range(_m), repeat=_n))
                  _pairs = 0
                  for _w in _ways:
                      _pairs += sum(1 for _i in range(_n) for _j in range(_i + 1, _n) if _w[_i] == _w[_j])
                  _want = Fraction(_pairs, len(_ways))
                  _got = expected_collisions(_n, _m)
                  assert _got == _want, "expected_collisions(" + str(_n) + ", " + str(_m) + ") should be " + str(_want) + ", not " + str(_got)
          assert expected_collisions(10 ** 6, 10 ** 9) == Fraction(10 ** 6 * (10 ** 6 - 1) // 2, 10 ** 9), "expected_collisions(10 ** 6, 10 ** 9) is wrong"
          assert output.strip() == "253/365 9/20 999/2", "The program should print 253/365 9/20 999/2"
        wrong:
          - |
            from fractions import Fraction

            def expected_collisions(n, m):
                return Fraction(n * n, m)

            print("253/365 9/20 999/2")
          - |
            from fractions import Fraction

            def expected_collisions(n, m):
                return Fraction(n * (n - 1), m)

            print("253/365 9/20 999/2")
          - |
            from fractions import Fraction

            def expected_collisions(n, m):
                return Fraction(n, m)

            print("253/365 9/20 999/2")
        explanation: |
          There are $\binom{n}{2} = n(n - 1)/2$ unordered pairs of keys, each colliding with chance $1/m$, so by linearity the expectation is $n(n - 1)/(2m)$. Counting $n^2$ includes each key paired with itself; $n(n - 1)$ counts each pair twice, once in each order; $n/m$ is the average number of keys per bucket, a different quantity. With as many keys as buckets, about $n/2$ pairs collide on average, which is why hash tables keep their load factor below 1.
    - question:
        id: write-expected-max
        type: code
        mode: write
        system: s2
        prompt: |
          Write `expected_max(sides, dice)`, the exact expectation, as a `Fraction`, of the largest number shown when `dice` fair dice with faces 1 to `sides` are thrown. Use the tail sum $E[X] = \sum_{k \ge 1} P(X \ge k)$, and the fact that the largest is below $k$ exactly when every die is below $k$.
        starter: |
          from fractions import Fraction

          def expected_max(sides, dice):
              return Fraction(0)

          print(expected_max(6, 2), expected_max(6, 1), expected_max(2, 3))
        solution: |
          from fractions import Fraction

          def expected_max(sides, dice):
              total = Fraction(0)
              for k in range(1, sides + 1):
                  total += 1 - Fraction(k - 1, sides) ** dice
              return total

          print(expected_max(6, 2), expected_max(6, 1), expected_max(2, 3))
        tests: |
          import itertools
          from fractions import Fraction
          for _s in range(1, 7):
              for _d in range(1, 5):
                  _all = list(itertools.product(range(1, _s + 1), repeat=_d))
                  _want = Fraction(sum(max(_t) for _t in _all), len(_all))
                  _got = expected_max(_s, _d)
                  assert _got == _want, "expected_max(" + str(_s) + ", " + str(_d) + ") should be " + str(_want) + ", not " + str(_got)
          assert expected_max(100, 50) > 98, "expected_max(100, 50) should be close to 100"
          assert output.strip() == "161/36 7/2 15/8", "The program should print 161/36 7/2 15/8"
        wrong:
          - |
            from fractions import Fraction

            def expected_max(sides, dice):
                return Fraction(sides + 1, 2)

            print("161/36 7/2 15/8")
          - |
            from fractions import Fraction

            def expected_max(sides, dice):
                total = Fraction(0)
                for k in range(1, sides + 1):
                    total += 1 - Fraction(k, sides) ** dice
                return total

            print("161/36 7/2 15/8")
          - |
            from fractions import Fraction

            def expected_max(sides, dice):
                total = Fraction(0)
                for k in range(1, sides + 1):
                    total += k * Fraction(k, sides) ** dice
                return total

            print("161/36 7/2 15/8")
        explanation: |
          $P(X \ge k) = 1 - P(X \le k - 1) = 1 - \bigl((k - 1)/s\bigr)^d$, since every die must be at most $k - 1$ for the largest to be. Adding these for $k = 1$ to $s$ gives the expectation. Using $k$ instead of $k - 1$ computes $P(X > k)$, which loses 1 from the answer. The mean of one die ignores the extra dice, and $k\,(k/s)^d$ is the value times the cdf, not times the pmf.
    - question:
        id: work-tiffins
        type: numeric
        system: s2
        prompt: |
          The new helper hands 300 tiffins to 300 people completely at random. What is the expected number of people who get their own tiffin?
        answer: "1"
        explanation: |
          Each person gets their own with chance $1/300$, and there are 300 people, so linearity gives $300 \times 1/300 = 1$, the same as for 30 people or for 3.
    - question:
        id: work-empty
        type: numeric
        system: s2
        tolerance: "0.01"
        prompt: |
          Ten keys are hashed uniformly and independently into 10 buckets. What is the expected number of empty buckets? Give a decimal to two places.
        answer: "3.49"
        explanation: |
          A given bucket is empty when all ten keys miss it, with chance $(9/10)^{10} \approx 0.3487$. There are 10 buckets, so the expected number of empty ones is $10 \times 0.3487 \approx 3.49$. About a third of the buckets are wasted, even with exactly one key per bucket on average.
    - question:
        id: work-square
        type: choice
        system: s2
        prompt: |
          A delivery app finds that the average distance of a delivery is 3 km, and estimates the average area of the circle a delivery partner covers as $\pi \times 3^2 \approx 28$ square km. Distances vary a lot between deliveries. What is wrong?
        options:
          - "The average of $\\pi d^2$ is $\\pi E[d^2]$, which is larger than $\\pi (E[d])^2$ whenever the distances vary."
          - "Nothing: $E[\\pi d^2] = \\pi (E[d])^2$ by linearity."
          - "The average of $\\pi d^2$ is smaller than $\\pi (E[d])^2$ whenever the distances vary."
          - "Expectations cannot be taken of areas."
        answer: 0
        explanation: |
          Linearity covers sums and constant multiples, not squares: $E[g(X)] \ne g(E[X])$ in general. Long deliveries add far more area than short ones remove, so the average of the squares exceeds the square of the average. The size of that gap is the subject of the next lesson.
  connections:
    - text: |
        On average exactly one person gets their own tiffin, whether the office has 30 people or 300. Each person's chance is $1/n$, there are $n$ people, and linearity adds the $n$ chances without caring that the events are tangled together. No table of $30!$ arrangements was needed.

        The expectation of a random variable is its probability-weighted average, the long-run average of many plays and the balance point of its pmf. For a function of a variable, weight the function's values by the same chances, and do not expect $E[g(X)]$ to equal $g(E[X])$. Linearity, $E[X + Y] = E[X] + E[Y]$, holds always, and with indicators it turns expected counts into sums of chances; tail sums do the same for whole-number variables. Products split only for independent variables.

        Two random variables can share an expectation and behave very differently: one always gives 7, another gives 0 or 14 with even chances. The next lesson measures how far a variable strays from its mean, [[f4.variance]]. And the expected number of colliding pairs in a hash table, $\binom{n}{2}/m$, will return in [[f4.the-birthday-problem-and-collisions]] as the reason why collisions arrive so much sooner than intuition expects, and in [[s3.randomised-algorithms]], where linearity is the main tool for analysing algorithms that toss coins.
