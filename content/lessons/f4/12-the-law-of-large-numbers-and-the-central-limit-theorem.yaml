concept: f4.the-law-of-large-numbers-and-the-central-limit-theorem
minutes: 100
claim: You can state and prove the weak law of large numbers from Chebyshev's inequality, explain what it does and does not promise, state the central limit theorem, use it to approximate the chances of sums and averages of independent measurements with a normal distribution, including the continuity correction for counts, compute the standard error of an average, and recognise when the approximation is poor.
recalls: [f4.tail-bounds]
uses: [f4.tail-bounds, f4.continuous-distributions-and-densities, f4.common-discrete-distributions, f4.variance, f4.expectation-and-linearity, f4.independence, f4.sample-spaces-and-events, f3.permutations-and-combinations, s1.modules-and-imports, s0.functions, s0.loops]
leads: [f4.simulation-and-pseudo-random-numbers, f5.summaries-mean-median-and-percentiles, f5.sampling-and-estimators, f5.distributions-of-latency-and-heavy-tails]
starter: |
  # Scratch space. Days on which more than 60% of the babies born are boys.
  import math
  from fractions import Fraction

  for births in [15, 45]:
      boys_heavy = sum(math.comb(births, k) for k in range(births + 1) if Fraction(k, births) > Fraction(3, 5))
      print(births, boys_heavy / 2 ** births)
parts:
  recall:
    - text: |
        [[f4.tail-bounds]] showed with Chebyshev's inequality that an average of many independent measurements is unlikely to stray far from the mean. This lesson makes that a law, and then finds the shape of the straying. Three quick pulls first.
  puzzle:
    - text: |
        A district has two maternity hospitals. In the large one about 45 babies are born each day; in the small one about 15. Each baby is equally likely to be a boy or a girl, independently of the others.

        For a year, each hospital marks every day on which more than 60% of the babies born were boys. When the district health officer was asked which hospital would mark more such days, she said, "About the same, surely. A boy is a boy in either hospital, and the chance is one half in both."

        **Which hospital marks more days, and roughly how many does each mark in a year of 365 days?**
  intuition:
    - text: |
        Toss a coin once and the fraction of heads is 0 or 1, as far from one half as it can be. Toss it ten times and the fraction is usually between 0.3 and 0.7. Toss it a thousand times and it is almost always between 0.47 and 0.53. The fraction settles towards one half, not because later tosses correct earlier ones, but because each toss counts for less and less of the total.

        That is the **law of large numbers**: the average of many independent measurements settles at their mean. The last lesson already gave its speed. An average of $n$ measurements has standard deviation $\sigma/\sqrt{n}$, so its fluctuations shrink like one over the square root of $n$.

        Something more surprising happens to their shape. The figure takes 2,000 averages, each of $n$ throws of a die, and draws their histogram. With $n = 1$ the histogram is six flat spikes, nothing like a bell. With $n = 2$ it is a triangle. By $n = 10$ it is a bell, and it fits the normal curve drawn over it almost exactly. Try the exponential waits, which are lopsided, and the rare failures, which are almost always 0: they need more draws, but they turn into the same bell.
    - figure: sample-means
      props: { source: die, n: 1 }
    - text: |
        Whatever the measurements look like on their own, their averages look normal once there are enough of them. That is the **central limit theorem**, and it is the reason the bell curve is everywhere: heights, measurement errors and exam totals are all sums of many small independent influences.
  derivation:
    - text: |
        **The weak law of large numbers.** Let $X_1, X_2, \dots$ be independent, each with mean $\mu$ and variance $\sigma^2$, and let $\bar{X}_n = (X_1 + \cdots + X_n)/n$. Then for every $\varepsilon > 0$,

        $$P\bigl(\lvert \bar{X}_n - \mu \rvert \ge \varepsilon\bigr) \to 0 \quad \text{as } n \to \infty.$$

        *Proof.* $E[\bar{X}_n] = \mu$ by linearity and $\operatorname{Var}(\bar{X}_n) = \sigma^2/n$ by independence, so Chebyshev gives $P(\lvert \bar{X}_n - \mu \rvert \ge \varepsilon) \le \sigma^2/(n\varepsilon^2)$, which tends to 0. $\square$

        Applied to indicators, the law says that the fraction of trials in which an event happens settles at its probability. That is the long-run meaning of probability promised in [[f4.sample-spaces-and-events]], now a theorem rather than an assumption.

        **What it does not say.** It does not say that heads and tails "even out". The *fraction* of heads approaches one half, but the *difference* between the number of heads and $n/2$ typically grows, like $\sqrt{n}/2$: about 5 after 100 tosses and 50 after 10,000. A run of bad luck is never repaid; it is only diluted. It also needs a finite mean: averages of measurements with extremely heavy tails need not settle at all.

        **Standard error.** The standard deviation of an average, $\sigma/\sqrt{n}$, is called its **standard error**. It is the number to put beside any average of measurements: a benchmark's mean time, a survey's percentage, an A/B test's conversion rate.
    - question:
        id: derivation-standard-error
        type: numeric
        system: s2
        prompt: |
          One request's response time has standard deviation 40 ms. What is the standard error of the average of 400 independent response times, in milliseconds?
        answer: "2"
        explanation: |
          $40/\sqrt{400} = 40/20 = 2$ ms. Averaging 400 measurements makes the average 20 times steadier than one measurement.
    - text: |
        **The central limit theorem.** Let $X_1, X_2, \dots$ be independent with the same distribution, mean $\mu$ and finite variance $\sigma^2 > 0$, and let $S_n = X_1 + \cdots + X_n$. Then for every $z$,

        $$P\Bigl(\frac{S_n - n\mu}{\sigma\sqrt{n}} \le z\Bigr) \to \Phi(z) \quad \text{as } n \to \infty,$$

        where $\Phi$ is the cdf of the standard normal $N(0, 1)$. In words: a sum of many independent measurements is approximately normal with mean $n\mu$ and standard deviation $\sigma\sqrt{n}$, and their average is approximately $N(\mu, \sigma^2/n)$. The proof needs tools from later clusters; the figure is the evidence for now.

        **Using it.** To find a chance about a sum, standardise and read the normal cdf, with `statistics.NormalDist` from [[f4.continuous-distributions-and-densities]]. A hundred dice have total with mean 350 and standard deviation $\sqrt{100 \times 35/12} \approx 17.1$. The chance that the total is 380 or more is about $1 - \Phi\bigl((379.5 - 350)/17.1\bigr) = 1 - \Phi(1.73) \approx 0.042$.

        **The continuity correction.** The $379.5$ is deliberate. A total of dice is a whole number, and the normal spreads its chance smoothly, so the bar for 380 is best matched by the stretch from $379.5$ to $380.5$. Using $s - 0.5$ for "$s$ or more" and $s + 0.5$ for "$s$ or less" usually improves the approximation for counts noticeably.

        **The hospitals.** On a day with $n$ births, the number of boys is Binomial($n$, 1/2): mean $n/2$, standard deviation $\sqrt{n}/2$. "More than 60% boys" is $X \ge 10$ for $n = 15$ and $X \ge 28$ for $n = 45$. With the correction,

        $$n = 15: \ 1 - \Phi\Bigl(\frac{9.5 - 7.5}{1.94}\Bigr) \approx 0.151, \qquad n = 45: \ 1 - \Phi\Bigl(\frac{27.5 - 22.5}{3.35}\Bigr) \approx 0.068.$$

        So the small hospital marks about $0.151 \times 365 \approx 55$ days, and the large one about $0.068 \times 365 \approx 25$. The exact binomial chances agree to three places. Small samples vary more, so extreme fractions are more common in them, which is why the smallest schools top and bottom every league table.
    - question:
        id: order-clt
        type: order
        system: s2
        prompt: |
          Put the steps for approximating the chance that 100 fair dice total 380 or more in order.
        steps:
          - "One die has mean 3.5 and variance $35/12$."
          - "The total has mean 350 and standard deviation $\\sqrt{100 \\times 35/12} \\approx 17.1$."
          - "With the continuity correction, standardise: $z = (379.5 - 350)/17.1 \\approx 1.73$."
          - "The chance is about $1 - \\Phi(1.73) \\approx 0.042$."
        explanation: |
          Linearity and independence give the mean and variance of the sum; the central limit theorem says the sum is nearly normal; standardising reduces every such question to one table, or one call to `NormalDist().cdf`.
    - text: |
        **How large must $n$ be?** There is no single answer. Symmetric measurements, like dice, look normal by $n \approx 10$. Lopsided ones need more: the averages of exponential waits are still visibly skewed at $n = 10$. Rare events need the most, because a sum of rare indicators stays close to Poisson until the expected count is large; a common rule asks for at least about 10 expected successes and 10 failures before trusting the normal for a binomial. And the theorem needs independence and a finite variance. Measurements that move together, or that have very heavy tails, such as some response times, can break it, and [[f5.distributions-of-latency-and-heavy-tails]] shows what happens then.

        **The bell as a measuring tool.** Since an average is nearly $N(\mu, \sigma^2/n)$, it lies within $2\sigma/\sqrt{n}$ of $\mu$ about 95% of the time. Turned around, the stretch "average plus or minus two standard errors" catches the true mean about 95% of the time. That is the idea of a confidence interval, the subject of [[f5.sampling-and-estimators]] and the lessons after it.

        **In Python.** `NormalDist` makes each approximation one line:

        ```python
        import math
        import statistics

        z = statistics.NormalDist()
        mean, sd = 100 * 3.5, math.sqrt(100 * 35 / 12)
        print(round(1 - z.cdf((379.5 - mean) / sd), 3))
        ```

        This prints `0.042`.
  formal:
    - text: |
        **Setting.** $X_1, X_2, \dots$ independent with the same distribution, mean $\mu$, variance $\sigma^2$; $S_n = \sum_{i \le n} X_i$; $\bar{X}_n = S_n/n$.

        **Weak law of large numbers.** For every $\varepsilon > 0$, $P(\lvert \bar{X}_n - \mu \rvert \ge \varepsilon) \le \sigma^2/(n\varepsilon^2) \to 0$.

        **Standard error.** $\operatorname{SD}(\bar{X}_n) = \sigma/\sqrt{n}$.

        **Central limit theorem.** If $0 < \sigma^2 < \infty$, then $P\bigl((S_n - n\mu)/(\sigma\sqrt{n}) \le z\bigr) \to \Phi(z)$ for every $z$. Approximately, $S_n \sim N(n\mu, n\sigma^2)$ and $\bar{X}_n \sim N(\mu, \sigma^2/n)$.

        **Continuity correction.** For an integer-valued sum, approximate $P(S_n \ge s)$ by $1 - \Phi\bigl((s - \tfrac12 - n\mu)/(\sigma\sqrt{n})\bigr)$ and $P(S_n \le s)$ by $\Phi\bigl((s + \tfrac12 - n\mu)/(\sigma\sqrt{n})\bigr)$.
  drill:
    - text: Seconds each. Mean times $n$, standard deviation times $\sqrt{n}$ for sums; divide both by $n$ for averages.
    - question:
        id: drill-se
        type: numeric
        system: s1
        prompt: |
          One measurement has standard deviation 20. What is the standard deviation of the average of 100 independent measurements?
        answer: "2"
        explanation: $20/\sqrt{100} = 2$.
    - question:
        id: drill-sum-mean
        type: numeric
        system: s1
        prompt: |
          What is the mean of the total of 100 fair dice?
        answer: "350"
        explanation: $100 \times 3.5$.
    - question:
        id: drill-sum-sd
        type: numeric
        system: s1
        prompt: |
          Each of 25 independent parts has standard deviation 3. What is the standard deviation of their sum?
        answer: "15"
        explanation: $3\sqrt{25} = 15$.
    - question:
        id: drill-z
        type: numeric
        system: s1
        prompt: |
          An average has mean 50 and standard error 1. How many standard errors above the mean is an observed average of 52?
        answer: "2"
        explanation: $(52 - 50)/1 = 2$.
    - question:
        id: drill-chebyshev-law
        type: numeric
        system: s1
        prompt: |
          Measurements have variance 1. By Chebyshev, what is the largest chance that the average of 100 of them is 0.5 or more from the mean?
        answer: "0.04"
        explanation: $\sigma^2/(n\varepsilon^2) = 1/(100 \times 0.25) = 0.04$.
    - question:
        id: drill-even-out
        type: choice
        system: s1
        prompt: |
          A fair coin is tossed 10,000 times. What does the law of large numbers say?
        options:
          - "The fraction of heads is very likely close to one half."
          - "The number of heads is very likely within 5 of 5,000."
          - "After a run of heads, tails become more likely."
          - "Exactly 5,000 heads is the most likely outcome, with chance near 1."
        answer: 0
        explanation: The fraction settles; the count typically misses 5,000 by about 50, and exactly 5,000 has chance under 1%.
    - question:
        id: predict-se
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import math

          sigma = 20
          for n in [1, 4, 100, 400]:
              print(n, sigma / math.sqrt(n))
        output: |
          1 20.0
          4 10.0
          100 2.0
          400 1.0
        explanation: The standard error halves each time $n$ is multiplied by 4.
    - question:
        id: predict-normal
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import statistics

          z = statistics.NormalDist()
          print(round(1 - z.cdf(2), 3), round(z.cdf(1.96) - z.cdf(-1.96), 3))
        output: "0.023 0.95"
        explanation: A standard normal is above 2 with chance about $0.023$, and within $1.96$ of 0 with chance $0.95$.
  work:
    - text: Slower now. For each approximation, compute the mean and standard deviation of the sum first, decide whether a continuity correction is needed, and only then standardise.
    - question:
        id: fix-approx
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `at_least(n, p, k)` should use the central limit theorem, with the continuity correction, to approximate the chance that a Binomial(`n`, `p`) count is `k` or more. The program should print `0.151 0.068 0.029`, and conclude that the small hospital marks more days. It prints `0.297 0.328 0.352`, and concludes the opposite. Find the fault and fix it.
        starter: |
          import math
          import statistics

          def at_least(n, p, k):
              mean = n * p
              spread = n * p * (1 - p)
              return 1 - statistics.NormalDist().cdf((k - 0.5 - mean) / spread)

          print(round(at_least(15, 0.5, 10), 3), round(at_least(45, 0.5, 28), 3), round(at_least(100, 0.5, 60), 3))
        solution: |
          import math
          import statistics

          def at_least(n, p, k):
              mean = n * p
              spread = math.sqrt(n * p * (1 - p))
              return 1 - statistics.NormalDist().cdf((k - 0.5 - mean) / spread)

          print(round(at_least(15, 0.5, 10), 3), round(at_least(45, 0.5, 28), 3), round(at_least(100, 0.5, 60), 3))
        tests: |
          import math
          import statistics
          _z = statistics.NormalDist()
          for _n in [5, 10, 15, 45, 100, 1000]:
              for _p in [0.1, 0.3, 0.5, 0.8]:
                  for _k in range(0, _n + 1, max(1, _n // 10)):
                      _want = 1 - _z.cdf((_k - 0.5 - _n * _p) / math.sqrt(_n * _p * (1 - _p)))
                      _got = at_least(_n, _p, _k)
                      assert abs(_got - _want) < 1e-9, "at_least(" + str(_n) + ", " + str(_p) + ", " + str(_k) + ") should be about " + str(round(_want, 6)) + ", not " + str(_got)
          assert output.strip() == "0.151 0.068 0.029", "The program should print 0.151 0.068 0.029"
        wrong:
          - |
            import math
            import statistics

            def at_least(n, p, k):
                mean = n * p
                spread = math.sqrt(n * p * (1 - p))
                return 1 - statistics.NormalDist().cdf((k - mean) / spread)

            print("0.151 0.068 0.029")
          - |
            import math
            import statistics

            def at_least(n, p, k):
                mean = n * p
                spread = math.sqrt(p * (1 - p))
                return 1 - statistics.NormalDist().cdf((k - 0.5 - mean) / spread)

            print("0.151 0.068 0.029")
          - |
            import math
            import statistics

            def at_least(n, p, k):
                mean = n * p
                spread = math.sqrt(n * p * (1 - p))
                return statistics.NormalDist().cdf((k - 0.5 - mean) / spread)

            print("0.151 0.068 0.029")
        explanation: |
          Standardising divides by the standard deviation, $\sqrt{np(1 - p)}$, not by the variance. Dividing by the variance shrinks large samples' distances most, which is how the bug made the large hospital look more extreme. Leaving out the continuity correction gives a noticeably worse answer for small $n$; using one trial's standard deviation ignores $n$; and the cdf without the "1 minus" gives the chance of fewer than $k$.
    - question:
        id: write-within
        type: code
        mode: write
        system: s2
        prompt: |
          Write `chance_within(sd, n, eps)`, the central limit theorem's approximation to the chance that the average of `n` independent measurements, each with standard deviation `sd`, lands within `eps` of the true mean. Use `statistics.NormalDist`.
        starter: |
          import math
          import statistics

          def chance_within(sd, n, eps):
              return 0.5

          print(round(chance_within(20, 100, 4), 3), round(chance_within(1, 1, 1), 3), round(chance_within(math.sqrt(35 / 12), 30, 0.5), 3))
        solution: |
          import math
          import statistics

          def chance_within(sd, n, eps):
              z = statistics.NormalDist()
              limit = eps * math.sqrt(n) / sd
              return z.cdf(limit) - z.cdf(-limit)

          print(round(chance_within(20, 100, 4), 3), round(chance_within(1, 1, 1), 3), round(chance_within(math.sqrt(35 / 12), 30, 0.5), 3))
        tests: |
          import math
          import statistics
          _z = statistics.NormalDist()
          for _sd in [0.5, 1, 3, 20]:
              for _n in [1, 2, 10, 100, 2500]:
                  for _eps in [0.01, 0.1, 0.5, 1, 4]:
                      _l = _eps * math.sqrt(_n) / _sd
                      _want = _z.cdf(_l) - _z.cdf(-_l)
                      _got = chance_within(_sd, _n, _eps)
                      assert abs(_got - _want) < 1e-9, "chance_within(" + str(_sd) + ", " + str(_n) + ", " + str(_eps) + ") should be about " + str(round(_want, 6)) + ", not " + str(_got)
          assert output.strip() == "0.954 0.683 0.891", "The program should print 0.954 0.683 0.891"
        wrong:
          - |
            import math
            import statistics

            def chance_within(sd, n, eps):
                z = statistics.NormalDist()
                limit = eps / sd
                return z.cdf(limit) - z.cdf(-limit)

            print("0.954 0.683 0.891")
          - |
            import math
            import statistics

            def chance_within(sd, n, eps):
                z = statistics.NormalDist()
                limit = eps * n / sd
                return z.cdf(limit) - z.cdf(-limit)

            print("0.954 0.683 0.891")
          - |
            import math
            import statistics

            def chance_within(sd, n, eps):
                z = statistics.NormalDist()
                limit = eps * math.sqrt(n) / sd
                return z.cdf(limit)

            print("0.954 0.683 0.891")
        explanation: |
          The average is about $N(\mu, \sigma^2/n)$, so being within $\varepsilon$ of $\mu$ means being within $\varepsilon\sqrt{n}/\sigma$ standard errors, and the chance is $\Phi(\ell) - \Phi(-\ell)$ with $\ell = \varepsilon\sqrt{n}/\sigma$. Leaving out $\sqrt{n}$ treats the average like one measurement; using $n$ shrinks the spread far too fast; and $\Phi(\ell)$ alone forgets the lower side.
    - question:
        id: write-days
        type: code
        mode: write
        system: s2
        prompt: |
          Write `marked_days(births, fraction, days)`, the exact expected number of days, out of `days`, on which more than `fraction` of the `births` babies born are boys, when each birth is a boy with chance one half independently. `fraction` is a `Fraction`. Return a `Fraction`, computing the binomial chance exactly with `math.comb`.
        starter: |
          import math
          from fractions import Fraction

          def marked_days(births, fraction, days):
              return Fraction(0)

          print(round(float(marked_days(15, Fraction(3, 5), 365)), 1), round(float(marked_days(45, Fraction(3, 5), 365)), 1), marked_days(2, Fraction(1, 2), 4))
        solution: |
          import math
          from fractions import Fraction

          def marked_days(births, fraction, days):
              ways = sum(math.comb(births, k) for k in range(births + 1) if Fraction(k, births) > fraction)
              return days * Fraction(ways, 2 ** births)

          print(round(float(marked_days(15, Fraction(3, 5), 365)), 1), round(float(marked_days(45, Fraction(3, 5), 365)), 1), marked_days(2, Fraction(1, 2), 4))
        tests: |
          import itertools
          from fractions import Fraction
          for _b in range(1, 9):
              for _f in [Fraction(0), Fraction(1, 3), Fraction(1, 2), Fraction(3, 5), Fraction(3, 4), Fraction(1)]:
                  _seqs = list(itertools.product([0, 1], repeat=_b))
                  _hit = sum(1 for _s in _seqs if Fraction(sum(_s), _b) > _f)
                  _want = 7 * Fraction(_hit, len(_seqs))
                  _got = marked_days(_b, _f, 7)
                  assert _got == _want, "marked_days(" + str(_b) + ", " + str(_f) + ", 7) should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "55.1 24.7 1", "The program should print 55.1 24.7 1"
        wrong:
          - |
            import math
            from fractions import Fraction

            def marked_days(births, fraction, days):
                ways = sum(math.comb(births, k) for k in range(births + 1) if Fraction(k, births) >= fraction)
                return days * Fraction(ways, 2 ** births)

            print("55.1 24.7 1")
          - |
            import math
            from fractions import Fraction

            def marked_days(births, fraction, days):
                ways = sum(1 for k in range(births + 1) if Fraction(k, births) > fraction)
                return days * Fraction(ways, births + 1)

            print("55.1 24.7 1")
          - |
            import math
            from fractions import Fraction

            def marked_days(births, fraction, days):
                ways = sum(math.comb(births, k) for k in range(births + 1) if Fraction(k, births) > fraction)
                return Fraction(ways, 2 ** births)

            print("55.1 24.7 1")
        explanation: |
          Each day's number of boys is Binomial($n$, 1/2), so the chance of more than the fraction is the number of birth sequences with that many boys, $\sum \binom{n}{k}$ over the qualifying $k$, divided by $2^n$. By linearity, the expected number of marked days is that chance times the number of days. "More than" excludes the boundary: with 2 births, exactly one boy is not more than half. Treating each count of boys as equally likely is the eleven-totals mistake again, and forgetting the days returns a chance, not a count.
    - question:
        id: work-hospitals
        type: numeric
        system: s2
        tolerance: "1"
        prompt: |
          In the puzzle, about how many days a year does the small hospital, with 15 births a day, mark? Give a whole number.
        answer: "55"
        explanation: |
          $P(X \ge 10)$ for Binomial(15, 1/2) is $4944/32768 \approx 0.151$, and $0.151 \times 365 \approx 55$. The large hospital marks only about 25.
    - question:
        id: work-dice
        type: numeric
        system: s2
        tolerance: "0.003"
        prompt: |
          Using the central limit theorem with the continuity correction, what is the approximate chance that 100 fair dice total 380 or more? Give a decimal to three places.
        answer: "0.042"
        explanation: |
          Mean 350, standard deviation $\sqrt{100 \times 35/12} \approx 17.08$, so $z = 29.5/17.08 \approx 1.73$ and the chance is about $1 - \Phi(1.73) \approx 0.042$.
    - question:
        id: work-when
        type: choice
        system: s2
        prompt: |
          A team averages 50 page-load times and quotes the result with a normal-based 95% range. In which case is that range least trustworthy?
        options:
          - "When most loads take 200 ms but about 1 in 1,000 takes over a minute, because such heavy tails make 50 far too few for the normal approximation."
          - "When load times are roughly symmetric around 200 ms with a standard deviation of 20 ms."
          - "When the 50 loads are independent."
          - "When the average happens to be a whole number."
        answer: 0
        explanation: |
          The central limit theorem needs enough draws for the sum to forget the shape of one draw. A rare, enormous value dominates the variance, and 50 draws may contain none of them or one, so the average jumps between two very different values rather than following a bell. Symmetric, light-tailed, independent measurements are where the approximation is best.
  connections:
    - text: |
        The small hospital marks about 55 days a year and the large one about 25. A boy is equally likely in both, but the fraction of boys among 15 births strays from one half much more than among 45, since the spread of a fraction shrinks like $1/\sqrt{n}$. The health officer looked at one birth when the question was about averages.

        The law of large numbers says that averages of independent measurements settle at the mean, with Chebyshev's inequality as its proof, and the standard error $\sigma/\sqrt{n}$ as its speed. It does not make luck even out. The central limit theorem says that the fluctuations of sums and averages are approximately normal, whatever the shape of one measurement, given independence, a finite variance and enough terms. Standardise, use the normal cdf, and correct for continuity when counting.

        All of this has been checked so far with formulas, and with a figure that drew thousands of random averages. Where did those random numbers come from, in a machine that does only what it is told? And how can a program use them to answer questions no formula reaches? That is the last lesson of the cluster: [[f4.simulation-and-pseudo-random-numbers]].
