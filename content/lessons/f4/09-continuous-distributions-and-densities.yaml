concept: f4.continuous-distributions-and-densities
minutes: 90
claim: You can describe a random variable that takes any value in a range by its cdf or its density, find chances as areas under a density and as differences of the cdf, explain why every single value has chance zero and why a density can exceed 1, work with the uniform, exponential and normal distributions, including the exponential's lack of memory and the normal's 68, 95 and 99.7 per cent rule, and find quantiles such as the median.
recalls: [f4.common-discrete-distributions]
uses: [f4.common-discrete-distributions, f4.variance, f4.expectation-and-linearity, f4.random-variables, f4.conditional-probability, f1.exponents-and-exponential-growth, f1.logarithms, f1.coordinates-lines-and-slope, f1.composition-and-inverses, s1.modules-and-imports, s0.functions, s0.booleans-and-conditionals]
leads: [f4.the-birthday-problem-and-collisions, f4.tail-bounds, f4.the-law-of-large-numbers-and-the-central-limit-theorem, f4.simulation-and-pseudo-random-numbers, f5.summaries-mean-median-and-percentiles]
starter: |
  # Scratch space. A train every 10 minutes, and you arrive at a random moment.
  def wait_cdf(t):
      if t <= 0:
          return 0
      if t >= 10:
          return 1
      return t / 10

  print(wait_cdf(6) - wait_cdf(4), wait_cdf(4) - wait_cdf(4))
parts:
  recall:
    - text: |
        [[f4.common-discrete-distributions]] ended with quantities that can take any value in a range, such as waiting times and response times, whose chances cannot sit on single points. Three quick pulls first.
  puzzle:
    - text: |
        On a quiet suburban line, a local train leaves the platform exactly every 10 minutes. You walk onto the platform at a random moment, with no idea of the timetable, so your wait is somewhere between 0 and 10 minutes, and no moment of arrival is favoured over another.

        A friend asks two questions. "What is the chance that you wait between 4 and 6 minutes?" That seems easy. Then: "What is the chance that you wait *exactly* 4 minutes, not 4.001 or 3.9999, but exactly 4?"

        **Answer both. And if the second answer is 0, and the same is true of every exact waiting time, how can the chances of all the possible waits add up to 1?**
  intuition:
    - text: |
        Start with something you can count. If waits were measured in whole minutes, there would be 10 equally likely values, each with chance $1/10$, and "between 4 and 6" would mean a couple of them. Measure in half-minutes and there are 20 values, each with chance $1/20$. In seconds there are 600, each with chance $1/600$. The finer the measurement, the smaller the chance of any one value, and in the limit, with time measured exactly, every single value has chance 0.

        But the chance of an *interval* does not shrink. "Between 4 and 6 minutes" is 2 of 10 whole minutes, 4 of 20 half-minutes and 120 of 600 seconds: $1/5$ every time. Chance has stopped living on points and is spread out along the line, like a thin layer of paint, and what you measure is how much paint lies over a stretch.

        The thickness of the paint is the **density**. For the train it is the same everywhere from 0 to 10 minutes: $1/10$ per minute. The chance of a stretch is its length times the density, the area of a rectangle, $2 \times 1/10 = 1/5$. The figure draws the density as a curve and shades the area between two times you choose.
    - figure: density-area
      props: { shape: uniform, from: 4, to: 6 }
    - text: |
        Move both ends together until they meet: the shaded area shrinks to nothing, which is why an exact time has chance 0. That is no contradiction, because chances add over disjoint events in a list, and the points of a line cannot be listed one by one; area is the right way to measure them. Then switch shapes. Other waits pile their paint unevenly: the total of two random waits is most likely near the middle, and the time to a server's next request is most likely short.
  derivation:
    - text: |
        **Continuous random variables.** A random variable $X$ is **continuous** when every single value has chance zero, $P(X = x) = 0$. Its pmf is then useless, but its cdf $F(x) = P(X \le x)$ still works, and chances of intervals come from it:

        $$P(a < X \le b) = F(b) - F(a).$$

        Since single points have no chance, it does not matter whether the ends are included: $P(a \le X \le b)$ is the same number.

        **Densities.** A **density** for $X$ is a function $f \ge 0$ such that, for every $a \le b$, $P(a \le X \le b)$ is the area under the graph of $f$ between $a$ and $b$. The total area under $f$ is 1. Over a short stretch of width $h$, the area is nearly a thin rectangle, so

        $$P(x \le X \le x + h) \approx f(x)\,h,$$

        and the density is the slope of the cdf, in the sense of [[f1.coordinates-lines-and-slope]]: how fast chance accumulates per unit of $x$. A density is measured *per unit*, per minute or per millisecond, and it is not a chance. In particular it can exceed 1. A wait spread evenly over half a minute has density 2 per minute, since $2 \times \tfrac12 = 1$.

        **Expectations.** The rules of the last three lessons carry over, with areas in place of sums. Cut the line into thin strips of width $h$; a strip near $x$ has chance about $f(x)\,h$, so $E[X] \approx \sum x\,f(x)\,h$, and the approximation improves as the strips get thinner. The limit is written $\int x\,f(x)\,dx$, an integral, which a later cluster on calculus treats properly. For now the formulas below are enough, and linearity, the variance rules and independence all hold exactly as before.
    - question:
        id: derivation-density
        type: numeric
        system: s2
        prompt: |
          A random variable is spread evenly over the interval from 2 to 2.25 and is never outside it. What is its density on that interval?
        answer: "4"
        explanation: |
          The total area must be 1, and the interval has width $0.25$, so the height is $1/0.25 = 4$ per unit. A density above 1 is perfectly possible; a chance above 1 is not.
    - text: |
        **Uniform.** $X$ is **Uniform($a$, $b$)** when its density is $1/(b - a)$ on $[a, b]$ and 0 elsewhere. Then

        $$F(x) = \frac{x - a}{b - a} \quad (a \le x \le b), \qquad E[X] = \frac{a + b}{2}, \qquad \operatorname{Var}(X) = \frac{(b - a)^2}{12}.$$

        The mean is the middle, by symmetry. The variance is the continuous form of a die's: a fair die with faces $1, \dots, n$ has variance $(n^2 - 1)/12$, and shrinking the spacing between faces towards zero gives $(b - a)^2/12$. The train wait is Uniform(0, 10), with mean 5 minutes and standard deviation $10/\sqrt{12} \approx 2.9$ minutes.

        **Exponential.** Requests reach a server at an average rate of $\lambda$ per minute, with no pattern. Cut each minute into $n$ tiny slots, each holding a request with chance $\lambda/n$, independently. The wait $T$ until the first request is more than $t$ minutes when all $nt$ slots in that time are empty, a geometric tail:

        $$P(T > t) = \Bigl(1 - \frac{\lambda}{n}\Bigr)^{nt} \to e^{-\lambda t}$$

        as the slots shrink, by the same limit that gave the Poisson. So the **Exponential($\lambda$)** distribution has

        $$F(t) = 1 - e^{-\lambda t}, \qquad f(t) = \lambda e^{-\lambda t}, \qquad E[T] = \frac{1}{\lambda}, \qquad \operatorname{Var}(T) = \frac{1}{\lambda^2},$$

        for $t \ge 0$. The mean is the limit of the geometric's mean, counted in minutes. Like the geometric, it has no memory: $P(T > s + t \mid T > s) = e^{-\lambda(s + t)}/e^{-\lambda s} = e^{-\lambda t}$. If no request has come for 5 minutes, the wait from now on is distributed exactly as if the clock had just started.
    - question:
        id: order-exponential
        type: order
        system: s2
        prompt: |
          Requests arrive at a rate of $0.5$ per minute. Put the steps for the chance that the next one comes within 2 minutes in order.
        steps:
          - "The wait $T$ is exponential with rate $\\lambda = 0.5$."
          - "$T$ is more than 2 minutes with chance $e^{-0.5 \\times 2} = e^{-1}$."
          - "So $P(T \\le 2) = 1 - e^{-1}$."
          - "That is about $1 - 0.368 = 0.632$."
        explanation: |
          The exponential's tail, $e^{-\lambda t}$, is the easy part; the cdf is its complement. Even though 2 minutes is the average wait, the chance of waiting at most that long is $63\%$, not $50\%$, because the many short waits are balanced by a few very long ones.
    - text: |
        **Normal.** The most famous density is the bell-shaped **normal** distribution with mean $\mu$ and standard deviation $\sigma$, written $N(\mu, \sigma^2)$:

        $$f(x) = \frac{1}{\sigma\sqrt{2\pi}}\, e^{-(x - \mu)^2 / (2\sigma^2)}.$$

        Its cdf has no formula in terms of familiar functions, so it is computed numerically or read from a table, and the facts worth carrying in your head are these: about 68% of the probability lies within one standard deviation of the mean, about 95% within two and about 99.7% within three. Standardising, $Z = (X - \mu)/\sigma$ is $N(0, 1)$, so one table serves every normal. Normals turn up whenever many small independent effects add together, a fact made precise in [[f4.the-law-of-large-numbers-and-the-central-limit-theorem]]. The triangle shape in the figure, the total of just *two* uniform waits, is already a step towards the bell.

        **Quantiles.** The value $x$ with $F(x) = q$ is the **$q$-quantile**: the $0.5$-quantile is the **median** and the $0.99$-quantile is the **99th percentile**. Engineers state service targets this way: "99% of requests finish within 300 ms" is a statement about the 99th percentile of the response time, which [[f5.summaries-mean-median-and-percentiles]] takes up. For the exponential, solving $1 - e^{-\lambda t} = q$ with [[f1.logarithms]] gives

        $$t = \frac{-\ln(1 - q)}{\lambda}.$$

        At $\lambda = 0.5$ per minute, the median wait is $2 \ln 2 \approx 1.39$ minutes, less than the mean of 2, and the 99th percentile is about $9.2$ minutes, more than four times the mean.

        **In Python.** The `statistics` module has a normal distribution with a cdf and its inverse:

        ```python
        import statistics

        z = statistics.NormalDist(0, 1)
        print(round(z.cdf(1) - z.cdf(-1), 3), round(z.inv_cdf(0.975), 2))
        ```

        This prints `0.683 1.96`: the chance within one standard deviation, and the point with 2.5% of the chance above it, which is why "about two standard deviations" covers 95%.
  formal:
    - text: |
        **Continuous random variable.** $P(X = x) = 0$ for every $x$; $P(a < X \le b) = F(b) - F(a)$, where $F(x) = P(X \le x)$.

        **Density.** $f \ge 0$ with total area 1, and $P(a \le X \le b)$ equal to the area under $f$ from $a$ to $b$, written $\int_a^b f(x)\,dx$. $P(x \le X \le x + h) \approx f(x)\,h$ for small $h$. $E[X] = \int x\,f(x)\,dx$ and $E[g(X)] = \int g(x)\,f(x)\,dx$.

        | Name | Density | Cdf | Mean | Variance |
        |---|---|---|---|---|
        | Uniform($a$, $b$) | $1/(b - a)$ on $[a, b]$ | $(x - a)/(b - a)$ | $(a + b)/2$ | $(b - a)^2/12$ |
        | Exponential($\lambda$) | $\lambda e^{-\lambda t}$, $t \ge 0$ | $1 - e^{-\lambda t}$ | $1/\lambda$ | $1/\lambda^2$ |
        | Normal $N(\mu, \sigma^2)$ | $\frac{1}{\sigma\sqrt{2\pi}} e^{-(x - \mu)^2/(2\sigma^2)}$ | no simple formula | $\mu$ | $\sigma^2$ |

        **Memoryless.** For exponential $T$, $P(T > s + t \mid T > s) = P(T > t)$.

        **Normal rule.** $P(\lvert X - \mu \rvert \le k\sigma) \approx 0.68, 0.95, 0.997$ for $k = 1, 2, 3$.

        **Quantile.** The $q$-quantile is the $x$ with $F(x) = q$; the median is the $0.5$-quantile.
  drill:
    - text: Seconds each. Chances are areas; densities are heights.
    - question:
        id: drill-uniform
        type: numeric
        system: s1
        prompt: |
          $X$ is Uniform(0, 10). What is $P(4 \le X \le 6)$?
        answer: "0.2"
        explanation: Width 2 times height $1/10$.
    - question:
        id: drill-point
        type: numeric
        system: s1
        prompt: |
          $X$ is Uniform(0, 10). What is $P(X = 4)$?
        answer: "0"
        explanation: A single point has zero width, so zero area.
    - question:
        id: drill-height
        type: numeric
        system: s1
        prompt: |
          $X$ is Uniform(0, 0.5). What is its density at $0.2$?
        answer: "2"
        explanation: Height times width must be 1, so the height is $1/0.5 = 2$.
    - question:
        id: drill-exp-mean
        type: numeric
        system: s1
        prompt: |
          Requests arrive at an average rate of 4 per second. What is the mean wait until the next one, in seconds?
        answer: "0.25"
        explanation: An exponential wait has mean $1/\lambda = 1/4$.
    - question:
        id: drill-normal
        type: numeric
        system: s1
        prompt: |
          Roughly what fraction of a normal distribution lies within two standard deviations of its mean?
        answer: "0.95"
        tolerance: "0.005"
        explanation: About 95%, by the 68, 95 and 99.7 rule.
    - question:
        id: drill-density-big
        type: choice
        system: s1
        prompt: |
          Can a density be larger than 1?
        options: ["Yes, a density is chance per unit, not a chance", "No, it is a probability", "Only for the normal distribution", "Only if the variable is negative"]
        answer: 0
        explanation: Only areas under the density are chances. A tall, narrow density has a small area.
    - question:
        id: predict-exponential
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import math

          rate = 0.5

          def cdf(t):
              return 1 - math.exp(-rate * t)

          print(round(cdf(2) - cdf(0), 3), round(1 - cdf(4), 3))
        output: "0.632 0.135"
        explanation: $1 - e^{-1} \approx 0.632$ is the chance of a wait of at most 2 minutes, and $e^{-2} \approx 0.135$ the chance of a wait over 4.
    - question:
        id: predict-normal
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import statistics

          heights = statistics.NormalDist(168, 7)
          print(round(heights.cdf(175) - heights.cdf(161), 2), round(heights.inv_cdf(0.5)))
        output: "0.68 168"
        explanation: 161 and 175 are one standard deviation either side of 168, so about 68% of heights lie between them. The median of a normal is its mean.
  work:
    - text: Slower now. For every chance, say which area it is, and find it as a difference of the cdf rather than a height times a width, unless the density is flat.
    - question:
        id: fix-between
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `wait_between(a, b, rate)` should give the chance that an exponential wait with the given rate lands between `a` and `b`. The program should print `0.632 0.233 0.0`. It prints `1.0 0.368 0.0`. Find the fault and fix it.
        starter: |
          import math

          def wait_between(a, b, rate):
              return rate * math.exp(-rate * a) * (b - a)

          print(round(wait_between(0, 2, 0.5), 3), round(wait_between(2, 4, 0.5), 3), round(wait_between(3, 3, 0.5), 3))
        solution: |
          import math

          def wait_between(a, b, rate):
              return math.exp(-rate * a) - math.exp(-rate * b)

          print(round(wait_between(0, 2, 0.5), 3), round(wait_between(2, 4, 0.5), 3), round(wait_between(3, 3, 0.5), 3))
        tests: |
          import math
          for _rate in [0.1, 0.5, 1, 2, 5]:
              for _a in [0, 0.1, 0.5, 1, 2, 3.5]:
                  for _w in [0, 0.01, 0.5, 1, 4, 10]:
                      _b = _a + _w
                      _want = math.exp(-_rate * _a) - math.exp(-_rate * _b)
                      _got = wait_between(_a, _b, _rate)
                      assert abs(_got - _want) < 1e-9, "wait_between(" + str(_a) + ", " + str(_b) + ", " + str(_rate) + ") should be about " + str(round(_want, 6)) + ", not " + str(_got)
          assert output.strip() == "0.632 0.233 0.0", "The program should print 0.632 0.233 0.0"
        wrong:
          - |
            import math

            def wait_between(a, b, rate):
                return rate * math.exp(-rate * (a + b) / 2) * (b - a)

            print("0.632 0.233 0.0")
          - |
            import math

            def wait_between(a, b, rate):
                return math.exp(-rate * b) - math.exp(-rate * a)

            print("0.632 0.233 0.0")
        explanation: |
          The chance of an interval is an area, $F(b) - F(a) = (1 - e^{-\lambda b}) - (1 - e^{-\lambda a}) = e^{-\lambda a} - e^{-\lambda b}$. Height times width is only an approximation for narrow intervals; across 2 minutes the exponential density falls by more than half, so the rectangle overshoots, and for long intervals it can even exceed 1. Using the height at the middle is closer but still not exact, and subtracting the other way round gives a negative chance.
    - question:
        id: write-triangle
        type: code
        mode: write
        system: s2
        prompt: |
          The total of two independent waits, each Uniform(0, 5), has the triangular density of the figure: it rises in a straight line from 0 at $x = 0$ to $0.2$ at $x = 5$, then falls back to 0 at $x = 10$. Write `triangle_cdf(x)`, the chance that the total is at most `x`, for any number `x`. Use areas of triangles.
        starter: |
          def triangle_cdf(x):
              return x / 10

          print(round(triangle_cdf(5), 3), round(triangle_cdf(2), 3), round(triangle_cdf(9), 3), triangle_cdf(-1), triangle_cdf(12))
        solution: |
          def triangle_cdf(x):
              if x <= 0:
                  return 0
              if x <= 5:
                  return x * x / 50
              if x < 10:
                  return 1 - (10 - x) * (10 - x) / 50
              return 1

          print(round(triangle_cdf(5), 3), round(triangle_cdf(2), 3), round(triangle_cdf(9), 3), triangle_cdf(-1), triangle_cdf(12))
        tests: |
          import random
          random.seed(67)
          def _exact(_x):
              if _x <= 0:
                  return 0
              if _x <= 5:
                  return _x * _x / 50
              if _x < 10:
                  return 1 - (10 - _x) ** 2 / 50
              return 1
          for _i in range(-20, 241):
              _x = _i / 20
              _got = triangle_cdf(_x)
              assert abs(_got - _exact(_x)) < 1e-9, "triangle_cdf(" + str(_x) + ") should be about " + str(round(_exact(_x), 6)) + ", not " + str(_got)
          assert output.strip() == "0.5 0.08 0.98 0 1", "The program should print 0.5 0.08 0.98 0 1"
        wrong:
          - |
            def triangle_cdf(x):
                if x <= 0:
                    return 0
                if x <= 5:
                    return x * x / 50
                return 1

            print("0.5 0.08 0.98 0 1")
          - |
            def triangle_cdf(x):
                if x <= 0:
                    return 0
                if x >= 10:
                    return 1
                if x <= 5:
                    return x * x / 50
                return 0.5 + (x - 5) * (x - 5) / 50

            print("0.5 0.08 0.98 0 1")
          - |
            def triangle_cdf(x):
                if x <= 0:
                    return 0
                if x <= 5:
                    return x * 0.2
                if x < 10:
                    return 1 - (10 - x) * 0.2
                return 1

            print("0.5 0.08 0.98 0 1")
        explanation: |
          Up to $x \le 5$, the area is a triangle with base $x$ and height $x/25$, so $x^2/50$; at $x = 5$ it is $1/2$. Beyond 5, the area *not yet* covered is a triangle with base $10 - x$ and height $(10 - x)/25$, so $F(x) = 1 - (10 - x)^2/50$. Adding $(x - 5)^2/50$ after the peak counts a triangle where the shape is really a trapezium. Using the density's height alone, without halving for the triangle, gives values above 1.
    - question:
        id: write-quantile
        type: code
        mode: write
        system: s2
        prompt: |
          Write `exponential_quantile(rate, q)`, the time $t$ by which a fraction `q` of exponential waits with the given rate are over, so that $1 - e^{-\lambda t} = q$. `q` is at least 0 and less than 1.
        starter: |
          import math

          def exponential_quantile(rate, q):
              return q / rate

          print(round(exponential_quantile(0.5, 0.5), 3), round(exponential_quantile(0.5, 0.99), 2), round(exponential_quantile(2, 0.5), 3))
        solution: |
          import math

          def exponential_quantile(rate, q):
              return -math.log(1 - q) / rate

          print(round(exponential_quantile(0.5, 0.5), 3), round(exponential_quantile(0.5, 0.99), 2), round(exponential_quantile(2, 0.5), 3))
        tests: |
          import math
          for _rate in [0.1, 0.5, 1, 2, 7]:
              for _q in [0, 0.01, 0.1, 0.25, 0.5, 0.9, 0.99, 0.999]:
                  _got = exponential_quantile(_rate, _q)
                  _back = 1 - math.exp(-_rate * _got)
                  assert abs(_back - _q) < 1e-9, "exponential_quantile(" + str(_rate) + ", " + str(_q) + ") gives " + str(_got) + ", but a wait that long is over with chance " + str(round(_back, 6))
          assert output.strip() == "1.386 9.21 0.347", "The program should print 1.386 9.21 0.347"
        wrong:
          - |
            import math

            def exponential_quantile(rate, q):
                return -math.log(q) / rate

            print("1.386 9.21 0.347")
          - |
            import math

            def exponential_quantile(rate, q):
                return -math.log(1 - q) * rate

            print("1.386 9.21 0.347")
          - |
            import math

            def exponential_quantile(rate, q):
                return math.log(1 - q) / rate

            print("1.386 9.21 0.347")
        explanation: |
          From $1 - e^{-\lambda t} = q$, $e^{-\lambda t} = 1 - q$, so $-\lambda t = \ln(1 - q)$ and $t = -\ln(1 - q)/\lambda$. Using $\ln q$ solves for the tail instead of the cdf, and swaps the median with nothing and the 99th percentile with the 1st. Multiplying by the rate instead of dividing gets the units wrong: a faster server should mean shorter waits. Dropping the minus sign gives negative times.
    - question:
        id: work-train
        type: numeric
        system: s2
        prompt: |
          A train leaves every 10 minutes and you arrive at a random moment. What is the chance that you wait more than 7 minutes?
        answer: "0.3"
        explanation: |
          The wait is Uniform(0, 10), and the stretch from 7 to 10 has width 3 and height $1/10$.
    - question:
        id: work-tall
        type: numeric
        system: s2
        tolerance: "0.003"
        prompt: |
          Adult heights in a city are roughly normal with mean 168 cm and standard deviation 7 cm. About what fraction of adults are taller than 182 cm? Give a decimal to three places.
        answer: "0.023"
        explanation: |
          182 is two standard deviations above the mean. About 95% lie within two standard deviations, leaving 5% split equally between the two tails, so about $0.025$; the exact normal value is $0.0228$.
    - question:
        id: work-memory
        type: choice
        system: s2
        prompt: |
          Requests reach a server at an average of one every 2 minutes, with exponential waits between them. No request has arrived for the last 5 minutes. What is the expected further wait until the next one?
        options:
          - "2 minutes: the exponential has no memory, so the wait starts afresh."
          - "Less than 2 minutes, because a request is now overdue."
          - "More than 2 minutes, because the server has gone quiet."
          - "0 minutes, because 5 minutes is more than the average."
        answer: 0
        explanation: |
          $P(T > 5 + t \mid T > 5) = e^{-0.5 t} = P(T > t)$, so the remaining wait has the same exponential distribution as a fresh one, with mean 2. This holds only for genuinely memoryless arrivals; if a long silence makes you suspect the server is down, that is evidence about a different model, not about the exponential.
  connections:
    - text: |
        The chance of waiting between 4 and 6 minutes is $1/5$, and the chance of waiting exactly 4 minutes is 0. Both are right. Chance on a continuous line is spread out like paint with thickness $1/10$ per minute, and only stretches, not points, carry any of it. The chances of all waits add to 1 as an area, not as a list of points.

        A continuous random variable has a cdf, and usually a density: chances are areas under the density, or differences of the cdf. A density is chance per unit and may exceed 1. The uniform spreads chance evenly; the exponential is the memoryless wait for events arriving at a steady rate, the continuous geometric; the normal is the bell that sums of many small effects produce, with its 68, 95 and 99.7 per cent rule. Quantiles invert the cdf, and give the medians and percentiles in which service targets are written.

        The next lesson puts the exponential to an unexpected use. In a room of 23 people, a shared birthday is more likely than not, and in a hash table the first collision comes far sooner than its size suggests. The exponential function is what makes both predictable: [[f4.the-birthday-problem-and-collisions]].
