    - question:
        id: work-papers
        type: numeric
        system: s2
        tolerance: "0.5"
        prompt: |
          In the puzzle, what is the expected number of pairs of students who get identical papers? Give a decimal to one place.
        answer: "299.5"
        explanation: |
          A paper is fixed by its seed, and there are only 600 seconds. Each of the $\binom{600}{2} = 179{,}700$ pairs shares a second with chance $1/600$, so by linearity the expected number of identical pairs is $179{,}700/600 = 299.5$.
    - question:
        id: work-rare
        type: numeric
        system: s2
        tolerance: "200"
        prompt: |
          A simulation estimates the chance that a backup fails within a year, which is near 0.02. About how many trials make its standard error 0.001?
        answer: "19600"
        explanation: |
          $n = p(1 - p)/\text{SE}^2 = 0.02 \times 0.98/0.000001 = 19{,}600$. That is only 5% of the chance itself; a 1% relative error would need 25 times as many trials.
    - question:
        id: work-tokens
        type: choice
        system: s2
        prompt: |
          A web app builds each password-reset link from 20 draws of `random.randint(0, 61)`, after calling `random.seed(int(time.time()))` when the request arrives. What is the real danger?
        options:
          - "An attacker who knows roughly when a reset was requested can try each second as the seed and rebuild the link, so links should come from the secrets module."
          - "Twenty characters are too few, because $62^{20}$ links are easy to try one by one."
          - "The Mersenne Twister repeats after 624 draws, so links repeat."
          - "randint favours small numbers, so some characters are more common than others."
        answer: 0
        explanation: |
          The link has no more variety than its seed. An hour holds only 3,600 seconds, so an attacker who knows the hour can rebuild every possible link. $62^{20}$ is about $7 \times 10^{35}$, far too many to try; 624 is the number of outputs that reveal the Mersenne Twister's state, not its period; and `randint` has no modulo bias. Even without a clock seed, earlier outputs of the same generator can predict later ones, so secrets need `secrets`.
  connections:
    - text: |
        About 300 pairs of students get identical papers. A paper is decided entirely by its seed, and the seed is the second at which the student pressed Start, which has only 600 possible values. Each of the 179,700 pairs of students shares a second with chance $1/600$, so the expected number of identical pairs is 299.5. It is [[f4.the-birthday-problem-and-collisions]] with 600 days and 600 people. The 49-digit number of possible papers never mattered: a generator's output has no more variety than its seed.

        A pseudo-random generator is a fixed rule applied to a state. The seed fixes the whole sequence, so runs can be repeated; the finite state forces a period; and a simple rule can leave patterns between draws, such as alternating low bits and points on a few lines. Python's Mersenne Twister is good for simulation and wrong for secrets. A simulation estimates a chance by the fraction of hits, with standard error $\sqrt{\hat{p}(1 - \hat{p})/n}$; every distribution is built from uniform draws, by cutting the stretch from 0 to 1 into pieces, by the inverse cdf, or by the Fisher and Yates shuffle.

        That completes probability. Statistics turns the question around, from known chances to unknown ones read from data. [[f5.summaries-mean-median-and-percentiles]] begins with the simplest question about any pile of measurements: what is typical? [[f5.sampling-and-estimators]] treats a dataset as one run of a random experiment, and [[f5.the-bootstrap]] measures the error of almost any statistic by simulation, resampling the data with exactly the generators of this lesson. Later, [[f7.checksums-and-error-detection]] uses simulated random errors to measure how often a checksum misses one.
