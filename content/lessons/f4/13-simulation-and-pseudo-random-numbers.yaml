                  assert _calls[0] == _n, "estimate(trial, " + str(_n) + ") should run trial " + str(_n) + " times, not " + str(_calls[0])
                  assert len(_got) == 2, "estimate should return two numbers, the fraction and its standard error"
                  assert abs(_got[0] - _share) < 1e-12, "With " + str(_hits) + " of " + str(_n) + " trials hitting, the fraction should be " + str(_share) + ", not " + str(_got[0])
                  assert abs(_got[1] - _error) < 1e-12, "With " + str(_hits) + " of " + str(_n) + " trials hitting, the standard error should be about " + str(round(_error, 6)) + ", not " + str(_got[1])
          assert output.strip() == "0.2492 0.0043", "The program should print 0.2492 0.0043"
