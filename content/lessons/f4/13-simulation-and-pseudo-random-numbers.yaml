        explanation: |
          Swapping each position with any position makes $3^3 = 27$ equally likely runs, and 27 cannot be split evenly among 6 orders: three orders come from 5 runs each and three from 4. Choosing `j` from positions `i` to the end makes $3 \times 2 \times 1 = 6$ runs, one per order. Choosing from the first `len(items) - i` positions also makes 6 runs, but some orders come twice and others never. Counting down and choosing below `i`, which never lets an item stay where it is, gives only the orders that form one long cycle. Stopping one position early still makes $3^2 = 9$ runs, which 6 orders cannot share.
    - question:
        id: write-estimate
        type: code
        mode: write
        system: s2
        prompt: |
          Write `estimate(trial, n)`, which calls `trial()` `n` times, where each call returns `True` or `False`, and returns two numbers: the fraction of calls that returned `True`, and that fraction's estimated standard error. The program estimates the chance that a 1-metre stick of sugarcane, cut at two uniformly random points, gives three pieces that make a triangle.
        starter: |
          import math
          import random

          def estimate(trial, n):
              return 0.0, 0.0

          def triangle():
              a, b = sorted([random.random(), random.random()])
              return max(a, b - a, 1 - b) < 0.5

          random.seed(7)
          share, error = estimate(triangle, 10000)
          print(round(share, 4), round(error, 4))
        solution: |
          import math
          import random

          def estimate(trial, n):
              hits = 0
              for _ in range(n):
                  if trial():
                      hits += 1
              share = hits / n
              return share, math.sqrt(share * (1 - share) / n)

          def triangle():
              a, b = sorted([random.random(), random.random()])
              return max(a, b - a, 1 - b) < 0.5

          random.seed(7)
          share, error = estimate(triangle, 10000)
          print(round(share, 4), round(error, 4))
        tests: |
          import math
          def _make(_pattern):
              _calls = [0]
              def _trial():
                  _calls[0] += 1
                  return _pattern[(_calls[0] - 1) % len(_pattern)]
              return _trial, _calls
          for _pattern in [[True], [False], [True, False], [True, False, False, False], [False, True, True, False, True]]:
