                return max(a, b - a, 1 - b) < 0.5

            random.seed(7)
            share, error = estimate(triangle, 10000)
            print("0.2492 0.0043")
        explanation: |
          The fraction is $\hat{p}$ = hits $/n$, and its standard error is $\sqrt{\hat{p}(1 - \hat{p})/n}$. Putting $n$ outside the square root shrinks the error far too fast; leaving out the square root gives the variance, not the standard error; and $\sqrt{\hat{p}/n}$ forgets that an event that always happens has no uncertainty at all. The program prints `0.2492 0.0043`: the exact chance, $1/4$, is well within one standard error.
    - question:
        id: write-pick
        type: code
        mode: write
        system: s2
        prompt: |
          A tea stall sells chai to half its customers, coffee to 30% and lemon tea to 20%. Write `pick(chances, u)`, which turns one uniform draw `u`, with $0 \le u < 1$, into a choice: it returns the first index `i` for which `u` is less than `chances[0] + ... + chances[i]`. The chances add up to 1 and may include zeros.
        starter: |
          from fractions import Fraction

          def pick(chances, u):
              return 0

          chances = [Fraction(1, 2), Fraction(3, 10), Fraction(1, 5)]
          draws = [Fraction(0), Fraction(49, 100), Fraction(1, 2), Fraction(79, 100), Fraction(4, 5), Fraction(99, 100)]
          print(" ".join([str(pick(chances, u)) for u in draws]))
        solution: |
          from fractions import Fraction

          def pick(chances, u):
              total = 0
              for i in range(len(chances)):
                  total += chances[i]
                  if u < total:
                      return i
              return len(chances) - 1

          chances = [Fraction(1, 2), Fraction(3, 10), Fraction(1, 5)]
          draws = [Fraction(0), Fraction(49, 100), Fraction(1, 2), Fraction(79, 100), Fraction(4, 5), Fraction(99, 100)]
          print(" ".join([str(pick(chances, u)) for u in draws]))
        tests: |
          from fractions import Fraction
          for _chances in [[Fraction(1)], [Fraction(1, 2), Fraction(1, 2)], [Fraction(1, 2), Fraction(3, 10), Fraction(1, 5)], [Fraction(0), Fraction(1, 2), Fraction(0), Fraction(1, 2)], [Fraction(1, 6)] * 6, [Fraction(1, 10), Fraction(0), Fraction(3, 5), Fraction(3, 10)]]:
              for _k in range(60):
                  _u = Fraction(_k, 60)
                  _total = Fraction(0)
                  _want = None
                  for _i in range(len(_chances)):
                      _total += _chances[_i]
                      if _want is None and _u < _total:
                          _want = _i
                  _got = pick(_chances, _u)
                  assert _got == _want, "pick(" + str([str(_c) for _c in _chances]) + ", " + str(_u) + ") should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "0 0 1 1 2 2", "The program should print 0 0 1 1 2 2"
