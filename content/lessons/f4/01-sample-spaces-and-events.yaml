concept: f4.sample-spaces-and-events
minutes: 90
claim: You can describe a chance experiment by its sample space, write events as sets of outcomes, use the rules that every probability obeys, including complements, inclusion and exclusion and the union bound, compute probabilities by counting when outcomes are equally likely and by adding weights when they are not, and check a calculation exactly in Python with fractions.
recalls: [f3.trees-and-their-properties]
uses: [f3.counting-with-products-and-sums, f3.permutations-and-combinations, f3.inclusion-and-exclusion, f2.sets-and-set-operations, f2.propositions-and-connectives, f1.arithmetic-and-geometric-series, f1.composition-and-inverses, s1.modules-and-imports, s1.generators-and-context-managers, s1.comprehensions-and-iterators, s0.dictionaries-and-sets, s0.loops, s0.functions]
leads: [f4.conditional-probability, f4.independence, f4.random-variables, f4.the-law-of-large-numbers-and-the-central-limit-theorem]
starter: |
  # Scratch space. Every outcome of throwing two dice, and how many give each total.
  import itertools

  outcomes = list(itertools.product(range(1, 7), repeat=2))
  totals = {}
  for a, b in outcomes:
      totals[a + b] = totals.get(a + b, 0) + 1
  print(len(outcomes), totals)
parts:
  recall:
    - text: |
        [[f3.trees-and-their-properties]] closed discrete mathematics with a question it could not answer: if a network were picked at random, how likely would it be to be a path? Counting gives the numbers; probability turns them into chances. Three quick pulls first.
  puzzle:
    - text: |
        Two stalls at a village mela run dice games, and both pay out at even money.

        At the first stall you throw one die four times, and you win if at least one of the four throws is a six.

        At the second you throw two dice together twenty-four times, and you win if at least one of the twenty-four throws is a double six.

        Each looks like a fair bet. A six comes up once in six throws on average, so four throws give "four chances in six"; a double six comes once in thirty-six, so twenty-four throws give "twenty-four chances in thirty-six". Both work out to two in three, which would make both stalls generous. But that reasoning cannot be right: by the same argument, seven throws would give seven chances in six, more than certain.

        A gambler in seventeenth-century Paris noticed from long experience that the first bet won slightly more often than it lost, and the second slightly less often, and he could not see why. **What exactly is the chance of winning at each stall, and how do you work it out without guessing?**
  intuition:
    - text: |
        Begin with something smaller: two dice, one red and one blue, thrown once. Before talking about chances, list everything that can happen. The red die shows 1 to 6 and so does the blue, so there are $6 \times 6 = 36$ possible results, from (1, 1) to (6, 6), by the product rule of [[f3.counting-with-products-and-sums]]. If the dice are fair, no result is favoured over another, so each has the same chance, one in 36.

        A question such as "is the total 7?" picks out some of those results: (1, 6), (2, 5), (3, 4), (4, 3), (5, 2) and (6, 1). That is 6 of the 36, so the chance is $6/36 = 1/6$. A total of 12 happens only as (6, 6), a chance of $1/36$.

        This is where many people go wrong. The totals run from 2 to 12, eleven of them, and it is tempting to call each one equally likely, one in eleven. They are not: there are six ways to make 7 and one way to make 12. The equally likely things are the 36 ordered results, not the 11 totals. Choosing the right list of equally likely possibilities is most of the work in probability.

        The figure shows all 36 results, each labelled with its total. Switch between the events and count the highlighted cells. Leave the condition alone for now; it is the subject of the next lesson.
    - figure: dice-grid
      props: { event: seven, given: none }
    - text: |
        "At least one die shows 6" has 11 cells, not 12: the six on the red die gives 6 cells and the six on the blue die gives 6, but (6, 6) is in both. That is inclusion and exclusion, $6 + 6 - 1 = 11$, and the probability is $11/36$. Now the first stall is within reach. Four throws of one die have $6^4 = 1{,}296$ equally likely results, in the same way.
  derivation:
    - text: |
        **Sample spaces and events.** A chance experiment has a **sample space**, written $\Omega$, the set of all its possible outcomes. An **event** is a set of outcomes, a subset of $\Omega$, and it *happens* when the outcome is one of its members. For two dice, $\Omega$ is the 36 ordered pairs, and "the total is 7" is the six-element event above.

        Because events are sets, the set operations of [[f2.sets-and-set-operations]] are the logic of events, as in [[f2.propositions-and-connectives]]:

        - $A \cup B$ is "$A$ or $B$" (or both);
        - $A \cap B$ is "$A$ and $B$";
        - the complement $A^c = \Omega \setminus A$ is "not $A$".

        Two events with no outcome in common, $A \cap B = \varnothing$, are **disjoint**, or mutually exclusive: they cannot both happen.

        **The rules.** A probability $P$ gives each event a number, following three rules:

        1. $P(A) \ge 0$ for every event $A$;
        2. $P(\Omega) = 1$: something happens;
        3. if $A$ and $B$ are disjoint, $P(A \cup B) = P(A) + P(B)$, and the same for any number of events that are pairwise disjoint.

        Everything else follows. Since $A$ and $A^c$ are disjoint and together make $\Omega$,

        $$P(A^c) = 1 - P(A).$$

        In particular $P(\varnothing) = 0$. If $A \subseteq B$, then $B$ is $A$ together with the disjoint part $B \setminus A$, so $P(A) \le P(B)$. For any two events, split $A \cup B$ into $A$ only, $B$ only and both, and the argument of [[f3.inclusion-and-exclusion]] gives

        $$P(A \cup B) = P(A) + P(B) - P(A \cap B),$$

        with the longer alternating formula for more events. Dropping the subtracted terms gives the **union bound**, $P(A_1 \cup \cdots \cup A_n) \le P(A_1) + \cdots + P(A_n)$, crude but often all you need.
    - question:
        id: derivation-disjoint
        type: choice
        system: s2
        prompt: |
          A weather service says the chance of rain tomorrow is 0.6 and the chance of strong wind is 0.5. Can rain and strong wind be disjoint events?
        options:
          - "No: if they were, $P(\\text{rain or wind})$ would be $0.6 + 0.5 = 1.1$, more than 1."
          - "Yes: rain and wind are different kinds of weather."
          - "Yes, as long as $0.6 + 0.5$ is rounded."
          - "No, because no two events are ever disjoint."
        answer: 0
        explanation: |
          Disjoint events add, and no probability exceeds $P(\Omega) = 1$. So they must overlap, with $P(\text{rain and wind}) \ge 0.6 + 0.5 - 1 = 0.1$, by the formula for $P(A \cup B)$ and the fact that it is at most 1.
    - text: |
        **Equally likely outcomes.** When $\Omega$ is finite and every outcome has the same chance, each has probability $1/\lvert\Omega\rvert$, and adding over an event gives

        $$P(A) = \frac{\lvert A \rvert}{\lvert \Omega \rvert}.$$

        Probability becomes counting, and every tool of the last cluster applies. A six-digit one-time password guessed at random is right with probability $1/10^6$. Three dice have $6^3 = 216$ equally likely results, and a total of 10 happens in 27 of them, so its chance is $27/216 = 1/8$.

        The formula is only as good as the claim that the outcomes are equally likely, and that claim belongs to the sample space you chose. A famous eighteenth-century mathematician argued that in two tosses of a coin, "at least one head" has chance $2/3$, because the possibilities are a head on the first toss, a head only on the second, or no head. Those three are not equally likely. The equally likely outcomes are HH, HT, TH and TT, three of which contain a head, so the chance is $3/4$. When in doubt, make the outcomes as detailed as the physical situation: label the dice, order the tosses.

        **Outcomes that are not equally likely.** In general, give each outcome $\omega$ a probability $p(\omega) \ge 0$, with all of them adding to 1, and let $P(A)$ be the sum of $p(\omega)$ over the outcomes in $A$. A die loaded so that six is five times as likely as each other face has weights 1, 1, 1, 1, 1, 5 out of 10, and "an even number" has probability $(1 + 1 + 5)/10 = 7/10$. Sample spaces can even be infinite: toss a coin until the first head, and the outcome "first head on toss $k$" has probability $1/2^k$. These add up to $\tfrac12 + \tfrac14 + \cdots = 1$, the geometric series of [[f1.arithmetic-and-geometric-series]].

        **What the number means.** A probability of $1/6$ does not promise one total of 7 in every six throws. It describes the long run: over many throws, the fraction of 7s settles near $1/6$. Why it must settle is a theorem, [[f4.the-law-of-large-numbers-and-the-central-limit-theorem]], and it is what lets a mela stall owner, an insurer or a data centre plan on probabilities.

        **The mela.** Four throws of one die have $6^4 = 1{,}296$ equally likely sequences. The complement of "at least one six" is "no six at all", which happens in $5^4 = 625$ sequences, since each throw has 5 non-six faces. So

        $$P(\text{at least one six}) = 1 - \frac{625}{1296} = \frac{671}{1296} \approx 0.518.$$

        The second stall is the same calculation with a pair of dice as one throw of 36 faces, one of which wins: $1 - (35/36)^{24} \approx 0.491$. "Four chances in six" added probabilities of events that overlap, which is exactly what the rules forbid.

        **Checking in Python.** `itertools.product` lists a finite sample space, and the `fractions` module keeps probabilities exact, where floating-point numbers would round them:

        ```python
        import itertools
        from fractions import Fraction

        throws = list(itertools.product(range(1, 7), repeat=4))
        wins = [t for t in throws if 6 in t]
        print(Fraction(len(wins), len(throws)))
        ```

        This prints `671/1296`. Listing works for thousands or millions of outcomes; for $36^{24}$ outcomes the complement is the only way.
    - question:
        id: order-complement
        type: order
        system: s2
        prompt: |
          Find the chance of at least one head in 5 tosses of a fair coin. Put the steps in order.
        steps:
          - "The sample space is all $2^5 = 32$ sequences of heads and tails, equally likely."
          - "The complement of \"at least one head\" is \"no heads\", which is the single sequence of five tails."
          - "So $P(\\text{no heads}) = 1/32$."
          - "So $P(\\text{at least one head}) = 1 - 1/32 = 31/32$."
        explanation: '"At least one" events are unions of many overlapping events, and their complement, "none", is a single simple event. Counting the complement and subtracting from 1 avoids inclusion and exclusion altogether.'
  formal:
    - text: |
        **Sample space and events.** $\Omega$ is the set of outcomes; an event is a subset $A \subseteq \Omega$. $A \cup B$, $A \cap B$ and $A^c$ are "or", "and" and "not". $A$ and $B$ are disjoint when $A \cap B = \varnothing$.

        **Rules.** $P(A) \ge 0$; $P(\Omega) = 1$; $P(A_1 \cup A_2 \cup \cdots) = P(A_1) + P(A_2) + \cdots$ for pairwise disjoint events.

        **Consequences.** $P(A^c) = 1 - P(A)$; $P(\varnothing) = 0$; $A \subseteq B$ implies $P(A) \le P(B)$; $P(A \cup B) = P(A) + P(B) - P(A \cap B)$; $P(\bigcup A_i) \le \sum P(A_i)$.

        **Equally likely outcomes.** On a finite $\Omega$ with all outcomes equally likely, $P(A) = \lvert A \rvert / \lvert \Omega \rvert$.

        **Weighted outcomes.** In general $P(A) = \sum_{\omega \in A} p(\omega)$ with $p(\omega) \ge 0$ and $\sum_{\omega \in \Omega} p(\omega) = 1$.
  drill:
    - text: Seconds each. Name the equally likely outcomes, then count.
    - question:
        id: drill-seven
        type: numeric
        system: s1
        prompt: |
          Two fair dice are thrown. What is the probability that the total is 7? Give a fraction.
        answer: "1/6"
        explanation: 6 of the 36 ordered results add to 7.
    - question:
        id: drill-heads
        type: numeric
        system: s1
        prompt: |
          Three fair coins are tossed. What is the probability of at least one head?
        answer: "7/8"
        explanation: Only TTT has no head, so $1 - 1/8 = 7/8$.
    - question:
        id: drill-union
        type: numeric
        system: s1
        prompt: |
          $P(A) = 0.5$, $P(B) = 0.4$ and $P(A \cap B) = 0.2$. What is $P(A \cup B)$?
        answer: "0.7"
        explanation: $0.5 + 0.4 - 0.2 = 0.7$.
    - question:
        id: drill-complement
        type: numeric
        system: s1
        prompt: |
          The chance of rain tomorrow is 0.35. What is the chance of no rain?
        answer: "0.65"
        explanation: $1 - 0.35 = 0.65$.
    - question:
        id: drill-three-dice
        type: numeric
        system: s1
        prompt: |
          How many equally likely outcomes are there when three dice are thrown, keeping track of which die shows what?
        answer: "216"
        explanation: $6 \cdot 6 \cdot 6 = 216$, by the product rule.
    - question:
        id: drill-otp
        type: numeric
        system: s1
        prompt: |
          What is the chance that a random guess of a six-digit one-time password, from 000000 to 999999, is right?
        answer: "1/1000000"
        explanation: One of $10^6$ equally likely codes.
    - question:
        id: drill-coin-model
        type: choice
        system: s1
        prompt: |
          Two fair coins are tossed. Which list of outcomes is equally likely?
        options: ["HH, HT, TH, TT", "two heads, one head, no heads", "same, different", "HH, TT"]
        answer: 0
        explanation: The ordered results each have chance $1/4$. "One head" covers two of them, HT and TH, so it has chance $1/2$, not $1/3$.
    - question:
        id: predict-totals
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import itertools

          totals = [a + b for a, b in itertools.product(range(1, 7), repeat=2)]
          print(len(totals), totals.count(7), totals.count(12))
        output: "36 6 1"
        explanation: The 36 ordered pairs give 6 totals of 7 and one of 12. The totals are not equally likely, though the pairs are.
    - question:
        id: predict-fraction
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          from fractions import Fraction

          p = Fraction(6, 36)
          print(p, 1 - p, p + Fraction(1, 3))
        output: "1/6 5/6 1/2"
        explanation: A `Fraction` is kept in lowest terms and its arithmetic is exact, so $6/36$ shows as `1/6`, and $1/6 + 1/3 = 1/2$ exactly.
  work:
    - text: Slower now. Before counting anything, write down the sample space and say why its outcomes are equally likely, or what their weights are.
    - question:
        id: fix-totals
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `chance_of_total(total)` should give the exact probability that two fair dice add up to `total`. It should print `1/6 1/36 0`. It prints `1/11 1/11 0`. Find the fault and fix it.
        starter: |
          from fractions import Fraction

          def chance_of_total(total):
              totals = list(range(2, 13))
              if total in totals:
                  return Fraction(1, len(totals))
              return Fraction(0)

          print(chance_of_total(7), chance_of_total(12), chance_of_total(13))
        solution: |
          import itertools
          from fractions import Fraction

          def chance_of_total(total):
              outcomes = list(itertools.product(range(1, 7), repeat=2))
              hits = [pair for pair in outcomes if pair[0] + pair[1] == total]
              return Fraction(len(hits), len(outcomes))

          print(chance_of_total(7), chance_of_total(12), chance_of_total(13))
        tests: |
          from fractions import Fraction
          _want = {_t: Fraction(6 - abs(_t - 7), 36) for _t in range(2, 13)}
          for _t in range(-3, 20):
              _w = _want.get(_t, Fraction(0))
              _got = chance_of_total(_t)
              assert _got == _w, "chance_of_total(" + str(_t) + ") should be " + str(_w) + ", not " + str(_got)
          assert output.strip() == "1/6 1/36 0", "The program should print 1/6 1/36 0"
        wrong:
          - |
            from fractions import Fraction

            def chance_of_total(total):
                pairs = []
                for a in range(1, 7):
                    for b in range(a, 7):
                        pairs.append((a, b))
                hits = [p for p in pairs if p[0] + p[1] == total]
                return Fraction(len(hits), len(pairs))

            print("1/6 1/36 0")
          - |
            import itertools
            from fractions import Fraction

            def chance_of_total(total):
                outcomes = list(itertools.product(range(1, 7), repeat=2))
                hits = [pair for pair in outcomes if pair[0] + pair[1] == total]
                return Fraction(len(hits), 11)

            print("1/6 1/36 0")
        explanation: |
          The eleven totals are not equally likely, so giving each one chance $1/11$ is wrong. The equally likely outcomes are the 36 ordered pairs, and a total's chance is the number of pairs that make it divided by 36. Listing unordered pairs, such as $\{3, 4\}$ once, gives 21 outcomes that are not equally likely either: $\{3, 4\}$ can happen two ways and $\{3, 3\}$ only one. And dividing by 11 mixes the two sample spaces.
    - question:
        id: write-weighted
        type: code
        mode: write
        system: s2
        prompt: |
          Write `probability(weights, event)`. `weights` is a dictionary from each outcome to a positive whole-number weight, proportional to its chance, and `event` is a function that returns `True` for the outcomes in the event. Return the exact probability of the event as a `Fraction`: the total weight of its outcomes divided by the total weight of all outcomes.
        starter: |
          from fractions import Fraction

          def probability(weights, event):
              return Fraction(0)

          loaded = {1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 6: 5}
          fair = {face: 1 for face in range(1, 7)}
          print(probability(loaded, lambda face: face % 2 == 0), probability(fair, lambda face: face > 4), probability(loaded, lambda face: face > 6))
        solution: |
          from fractions import Fraction

          def probability(weights, event):
              total = sum(weights.values())
              inside = sum(w for outcome, w in weights.items() if event(outcome))
              return Fraction(inside, total)

          loaded = {1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 6: 5}
          fair = {face: 1 for face in range(1, 7)}
          print(probability(loaded, lambda face: face % 2 == 0), probability(fair, lambda face: face > 4), probability(loaded, lambda face: face > 6))
        tests: |
          import random
          from fractions import Fraction
          random.seed(7)
          for _trial in range(300):
              _n = random.randint(1, 8)
              _ws = {_k: random.randint(1, 9) for _k in range(_n)}
              _cut = random.randint(0, _n)
              _got = probability(_ws, lambda _x, _c=_cut: _x < _c)
              _want = Fraction(sum(_ws[_k] for _k in range(_cut)), sum(_ws.values()))
              assert isinstance(_got, Fraction), "probability should return a Fraction"
              assert _got == _want, "For weights " + str(_ws) + " and the event x < " + str(_cut) + ", the probability is " + str(_want) + ", not " + str(_got)
          assert output.strip() == "7/10 1/3 0", "The program should print 7/10 1/3 0"
        wrong:
          - |
            from fractions import Fraction

            def probability(weights, event):
                inside = [outcome for outcome in weights if event(outcome)]
                return Fraction(len(inside), len(weights))

            print("7/10 1/3 0")
          - |
            from fractions import Fraction

            def probability(weights, event):
                total = sum(weights.values())
                inside = sum(w for outcome, w in weights.items() if event(outcome))
                return inside / total

            print("7/10 1/3 0")
          - |
            from fractions import Fraction

            def probability(weights, event):
                inside = sum(w for outcome, w in weights.items() if event(outcome))
                return Fraction(inside, 6)

            print("7/10 1/3 0")
        explanation: |
          An outcome with weight $w$ has probability $w$ divided by the total weight, so the weights add to 1 after dividing, and an event's probability is the sum over its outcomes. Counting outcomes instead of adding weights treats the loaded die as fair. Dividing with `/` gives a floating-point number, not an exact fraction, and dividing by 6 assumes a die where any dictionary of weights may be given.
    - question:
        id: write-at-least-once
        type: code
        mode: write
        system: s2
        prompt: |
          Write `at_least_once(hits, sides, throws)`, the exact probability, as a `Fraction`, that in `throws` throws of a fair die with `sides` faces, at least one throw lands on one of `hits` chosen faces. Use the complement. Then the program compares the two stalls of the puzzle with a half.
        starter: |
          from fractions import Fraction

          def at_least_once(hits, sides, throws):
              return Fraction(0)

          first = at_least_once(1, 6, 4)
          second = at_least_once(1, 36, 24)
          print(first, first > Fraction(1, 2), second > Fraction(1, 2))
        solution: |
          from fractions import Fraction

          def at_least_once(hits, sides, throws):
              miss = Fraction(sides - hits, sides)
              return 1 - miss ** throws

          first = at_least_once(1, 6, 4)
          second = at_least_once(1, 36, 24)
          print(first, first > Fraction(1, 2), second > Fraction(1, 2))
        tests: |
          import itertools
          from fractions import Fraction
          for _sides in range(1, 7):
              for _hits in range(0, _sides + 1):
                  for _throws in range(0, 5):
                      _all = list(itertools.product(range(_sides), repeat=_throws))
                      _good = [_t for _t in _all if any(_x < _hits for _x in _t)]
                      _want = Fraction(len(_good), len(_all))
                      _got = at_least_once(_hits, _sides, _throws)
                      assert _got == _want, "at_least_once(" + str(_hits) + ", " + str(_sides) + ", " + str(_throws) + ") should be " + str(_want) + ", not " + str(_got)
          assert at_least_once(1, 36, 24) == 1 - Fraction(35, 36) ** 24, "at_least_once(1, 36, 24) is wrong"
          assert output.strip() == "671/1296 True False", "The program should print 671/1296 True False"
        wrong:
          - |
            from fractions import Fraction

            def at_least_once(hits, sides, throws):
                return Fraction(hits * throws, sides)

            print("671/1296 True False")
          - |
            from fractions import Fraction

            def at_least_once(hits, sides, throws):
                return 1 - Fraction(hits, sides) ** throws

            print("671/1296 True False")
          - |
            from fractions import Fraction

            def at_least_once(hits, sides, throws):
                return Fraction(hits, sides) ** throws

            print("671/1296 True False")
        explanation: |
          Each of the $s^t$ sequences of $t$ throws is equally likely, and the sequences with no hit at all number $(s - h)^t$, since each throw has $s - h$ faces that miss. So the chance of at least one hit is $1 - \bigl((s - h)/s\bigr)^t$. Multiplying the chance of one hit by the number of throws adds overlapping events and can exceed 1. Raising the chance of a *hit* to the power $t$ gives the chance that *every* throw hits, the opposite of what was asked.
    - question:
        id: work-three-dice
        type: numeric
        system: s2
        prompt: |
          Three fair dice are thrown. What is the probability that the total is 10? Give a fraction.
        answer: "1/8"
        explanation: |
          Count the ordered triples adding to 10. With first die $a$ from 1 to 6, the other two must add to $10 - a$, which can be done in 3, 4, 5, 6, 5, 4 ways for $a = 1, \dots, 6$: 27 in all. So the chance is $27/216 = 1/8$.
    - question:
        id: work-neither
        type: numeric
        system: s2
        prompt: |
          In a college, the chance that a student plays cricket is 0.6, that they play football is 0.3, and that they play both is 0.15. What is the chance that a student plays neither?
        answer: "0.25"
        explanation: |
          $P(\text{cricket or football}) = 0.6 + 0.3 - 0.15 = 0.75$, and "neither" is its complement, $1 - 0.75 = 0.25$.
    - question:
        id: work-servers
        type: choice
        system: s2
        prompt: |
          A cluster has 100 servers, and each fails on a given day with probability 0.001. Without knowing anything about how failures relate to one another, what can you say for certain about the chance that at least one fails that day?
        options:
          - "It is at most 0.1, by the union bound."
          - "It is exactly 0.1."
          - "It is exactly $1 - 0.999^{100}$."
          - "Nothing at all."
        answer: 0
        explanation: |
          The union bound needs no information about how the events overlap: the chance of the union is at most the sum, $100 \times 0.001 = 0.1$. It is exactly 0.1 only if no two servers ever fail on the same day. The formula $1 - 0.999^{100} \approx 0.095$ assumes the failures have nothing to do with each other, an assumption called independence that a shared power supply would break.
  connections:
    - text: |
        The first stall wins with probability $671/1296 \approx 0.518$ and the second with about $0.491$, so the first is a slightly good bet and the second a slightly bad one, as the gambler found. The trap was adding chances of events that overlap. The cure was to list the equally likely outcomes and count the complement.

        A sample space lists every outcome; events are its subsets, combined with "or", "and" and "not". Three rules govern every probability, and from them come the complement rule, inclusion and exclusion and the union bound. With equally likely outcomes, probability is counting; otherwise it is adding weights. Either way, the hard part is choosing outcomes that really are equally likely, or knowing their weights.

        So far every question has been asked before anything is known. Often something is known already: the first die has landed, a test has come back positive, a server has started returning errors. How should a probability change when you learn that some event has happened? That is [[f4.conditional-probability]], and the condition button in the figure was a preview of it.
