    - question:
        id: predict-double
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          from fractions import Fraction

          die = {x: Fraction(1, 6) for x in range(1, 7)}

          def var(pmf):
              mean = sum(x * p for x, p in pmf.items())
              return sum((x - mean) ** 2 * p for x, p in pmf.items())

          doubled = {2 * x: p for x, p in die.items()}
          print(var(die), var(doubled))
        output: "35/12 35/3"
        explanation: Doubling a die's value multiplies its variance by 4. Throwing two dice and adding would only double it, to $35/6$, because independent errors partly cancel.
  work:
    - text: Slower now. Before adding variances, check that the pieces are independent, or work out their covariance.
    - question:
        id: fix-variance
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `variance(pmf)` should return the variance of a random variable whose pmf is a dictionary from values to chances. The program should print `35/12 35/6`, for one die and for the total of two. It prints `0 0`. Find the fault and fix it.
        starter: |
          import itertools
          from fractions import Fraction

          def variance(pmf):
              mean = sum(x * p for x, p in pmf.items())
              return sum((x - mean) * p for x, p in pmf.items())

          die = {x: Fraction(1, 6) for x in range(1, 7)}
          total = {}
          for a, b in itertools.product(range(1, 7), repeat=2):
              total[a + b] = total.get(a + b, 0) + Fraction(1, 36)
          print(variance(die), variance(total))
        solution: |
          import itertools
          from fractions import Fraction

          def variance(pmf):
              mean = sum(x * p for x, p in pmf.items())
              return sum((x - mean) ** 2 * p for x, p in pmf.items())

          die = {x: Fraction(1, 6) for x in range(1, 7)}
          total = {}
          for a, b in itertools.product(range(1, 7), repeat=2):
              total[a + b] = total.get(a + b, 0) + Fraction(1, 36)
          print(variance(die), variance(total))
        tests: |
          import random
          from fractions import Fraction
          random.seed(59)
          for _trial in range(300):
              _k = random.randint(1, 6)
              _xs = random.sample(range(-10, 11), _k)
              _w = [random.randint(1, 9) for _i in range(_k)]
              _pmf = {_xs[_i]: Fraction(_w[_i], sum(_w)) for _i in range(_k)}
              _m = sum(_x * _p for _x, _p in _pmf.items())
              _want = sum((_x - _m) ** 2 * _p for _x, _p in _pmf.items())
              _got = variance(dict(_pmf))
              assert _got == _want, "For the pmf " + str({_x: str(_p) for _x, _p in _pmf.items()}) + ", the variance is " + str(_want) + ", not " + str(_got)
          assert output.strip() == "35/12 35/6", "The program should print 35/12 35/6"
        wrong:
          - |
            def variance(pmf):
                mean = sum(x * p for x, p in pmf.items())
                return sum(abs(x - mean) * p for x, p in pmf.items())

            print("35/12 35/6")
          - |
            def variance(pmf):
                mean = sum(x * p for x, p in pmf.items())
                return sum(x * x * p for x, p in pmf.items()) - mean

            print("35/12 35/6")
          - |
            def variance(pmf):
                mean = sum(x * p for x, p in pmf.items())
                return (sum((x - mean) ** 2 * p for x, p in pmf.items())) ** 0.5

            print("35/12 35/6")
        explanation: |
          The distances from the mean, weighted by their chances, always add to zero: that is what it means for the mean to be the balance point. Squaring each distance first keeps them all positive. The average absolute distance is a different measure of spread; $E[X^2] - \mu$ forgets to square the mean; and the square root gives the standard deviation, not the variance.
    - question:
        id: write-covariance
        type: code
        mode: write
        system: s2
        prompt: |
          `joint` is a dictionary from pairs `(x, y)` to the chance that $X = x$ and $Y = y$. Write `covariance(joint)`, the exact covariance of $X$ and $Y$, using $\operatorname{Cov}(X, Y) = E[XY] - E[X]\,E[Y]$.
        starter: |
          import itertools
          from fractions import Fraction

          def covariance(joint):
              return Fraction(0)

          first_total = {}
          two_dice = {}
          top_bottom = {}
          for a, b in itertools.product(range(1, 7), repeat=2):
              first_total[(a, a + b)] = first_total.get((a, a + b), 0) + Fraction(1, 36)
              two_dice[(a, b)] = Fraction(1, 36)
          for a in range(1, 7):
              top_bottom[(a, 7 - a)] = Fraction(1, 6)
          print(covariance(first_total), covariance(two_dice), covariance(top_bottom))
        solution: |
          import itertools
          from fractions import Fraction

          def covariance(joint):
              ex = sum(x * p for (x, y), p in joint.items())
              ey = sum(y * p for (x, y), p in joint.items())
              exy = sum(x * y * p for (x, y), p in joint.items())
              return exy - ex * ey

          first_total = {}
          two_dice = {}
          top_bottom = {}
          for a, b in itertools.product(range(1, 7), repeat=2):
              first_total[(a, a + b)] = first_total.get((a, a + b), 0) + Fraction(1, 36)
              two_dice[(a, b)] = Fraction(1, 36)
          for a in range(1, 7):
              top_bottom[(a, 7 - a)] = Fraction(1, 6)
          print(covariance(first_total), covariance(two_dice), covariance(top_bottom))
        tests: |
          import random
          from fractions import Fraction
          random.seed(61)
          for _trial in range(300):
              _cells = list(set((random.randint(-3, 3), random.randint(-3, 3)) for _i in range(random.randint(1, 6))))
              _w = [random.randint(1, 9) for _c in _cells]
              _j = {_c: Fraction(_w[_i], sum(_w)) for _i, _c in enumerate(_cells)}
              _ex = sum(_x * _p for (_x, _y), _p in _j.items())
              _ey = sum(_y * _p for (_x, _y), _p in _j.items())
              _want = sum((_x - _ex) * (_y - _ey) * _p for (_x, _y), _p in _j.items())
              _got = covariance(dict(_j))
              assert _got == _want, "For the joint pmf " + str({_c: str(_p) for _c, _p in _j.items()}) + ", the covariance is " + str(_want) + ", not " + str(_got)
          assert output.strip() == "35/12 0 -35/12", "The program should print 35/12 0 -35/12"
        wrong:
          - |
            def covariance(joint):
                ex = sum(x * p for (x, y), p in joint.items())
                ey = sum(y * p for (x, y), p in joint.items())
                exy = sum(x * y * p for (x, y), p in joint.items())
                return exy

            print("35/12 0 -35/12")
          - |
            def covariance(joint):
                ex = sum(x for (x, y), p in joint.items()) / len(joint)
                ey = sum(y for (x, y), p in joint.items()) / len(joint)
                exy = sum(x * y * p for (x, y), p in joint.items())
                return exy - ex * ey

            print("35/12 0 -35/12")
          - |
            def covariance(joint):
                ex = sum(x * p for (x, y), p in joint.items())
                ey = sum(y * p for (x, y), p in joint.items())
                exy = sum(x * y * p for (x, y), p in joint.items())
                return ex * ey - exy

            print("35/12 0 -35/12")
        explanation: |
          $E[X]$, $E[Y]$ and $E[XY]$ are each a sum over the cells of the joint pmf, weighted by the cell's chance, and the covariance is $E[XY] - E[X]\,E[Y]$. The first die and the total have covariance $35/12$, the variance of one die, since the total contains the first die. Two separate dice have covariance 0, and the top and bottom faces, $X$ and $7 - X$, have $-35/12$: one is high exactly when the other is low. Averaging the values without their chances, leaving out $E[X]\,E[Y]$ or getting the subtraction backwards all fail.
    - question:
        id: write-weighings
        type: code
        mode: write
        system: s2
        prompt: |
          One measurement has standard deviation `sd`, and measurements are independent. Write `readings_needed(sd, target)`, the smallest whole number $n \ge 1$ for which the average of $n$ measurements has standard deviation at most `target`. Both arguments are positive whole numbers. Compare squares, so that no square root is needed.
        starter: |
          def readings_needed(sd, target):
              return 1

          print(readings_needed(20, 5), readings_needed(20, 4), readings_needed(3, 2))
        solution: |
          def readings_needed(sd, target):
              n = 1
              while sd * sd > target * target * n:
                  n += 1
              return n

          print(readings_needed(20, 5), readings_needed(20, 4), readings_needed(3, 2))
        tests: |
          from fractions import Fraction
          for _sd in range(1, 41):
              for _t in range(1, 41):
                  _n = 1
                  while Fraction(_sd * _sd, _n) > _t * _t:
                      _n += 1
                  _got = readings_needed(_sd, _t)
                  assert _got == _n, "readings_needed(" + str(_sd) + ", " + str(_t) + ") should be " + str(_n) + ", not " + str(_got)
          assert output.strip() == "16 25 3", "The program should print 16 25 3"
        wrong:
          - |
            def readings_needed(sd, target):
                n = 1
                while sd > target * n:
                    n += 1
                return n

            print("16 25 3")
          - |
            def readings_needed(sd, target):
                return (sd * sd) // (target * target)

            print("16 25 3")
          - |
            def readings_needed(sd, target):
                n = 1
                while sd * sd >= target * target * n:
                    n += 1
                return n

            print("16 25 3")
        explanation: |
          The average of $n$ has standard deviation $\sigma/\sqrt{n}$, which is at most $t$ exactly when $\sigma^2 \le t^2 n$. So $n$ is the smallest whole number with $t^2 n \ge \sigma^2$, the ceiling of $\sigma^2/t^2$. Shrinking $\sigma$ by a factor of $n$, as in the shopkeeper's plan, is the error the puzzle warns about. Rounding $\sigma^2/t^2$ down can fall short, and can even give 0, and using $\ge$ in the loop asks for one measurement too many when $\sigma^2/t^2$ is a whole number.
    - question:
        id: work-rice
        type: numeric
        system: s2
        prompt: |
          Each weighing on the kirana scale has standard deviation 20 grams, independently. How many weighings must be averaged for the average to have standard deviation 5 grams?
        answer: "16"
        explanation: |
          $20/\sqrt{n} = 5$ gives $\sqrt{n} = 4$, so $n = 16$. Four weighings only halve the wobble, to 10 grams.
    - question:
        id: work-hundred-dice
        type: numeric
        system: s2
        tolerance: "0.05"
        prompt: |
          100 fair dice are thrown. What is the standard deviation of their total? Give a decimal to one place.
        answer: "17.1"
        explanation: |
          Each die has variance $35/12$, and the dice are independent, so the total has variance $100 \times 35/12 \approx 291.7$ and standard deviation about $17.1$. The total's mean is 350, so totals within about 17 of 350 are typical. The *average* of the 100 dice has standard deviation $17.1/100 \approx 0.17$.
    - question:
        id: work-two-shops
        type: choice
        system: s2
        prompt: |
          A family owns two shops in different towns. Each makes a daily profit with mean 10,000 rupees and standard deviation 3,000 rupees, and the two profits are independent. What is the standard deviation of the family's total daily profit?
        options:
          - "About 4,243 rupees, which is $3{,}000\\sqrt{2}$."
          - "6,000 rupees."
          - "3,000 rupees."
          - "18,000 rupees, which is $2 \\times 3{,}000^2 / 1{,}000$."
        answer: 0
        explanation: |
          Variances of independent variables add: $3{,}000^2 + 3{,}000^2 = 2 \times 3{,}000^2$, whose square root is $3{,}000\sqrt{2} \approx 4{,}243$. Standard deviations do not add; 6,000 would be right only if the shops always had good and bad days together, with correlation 1. Two independent shops are steadier, relative to their total, than one shop twice the size.
  connections:
    - text: |
        The shopkeeper needs 16 weighings, not 4. Averaging $n$ independent readings divides the variance by $n$ and so the standard deviation by $\sqrt{n}$; to divide a 20-gram wobble by 4 takes $4^2 = 16$ readings.

        Variance is the average squared distance from the mean, and the standard deviation, its square root, is a typical distance in the original units. Shifting leaves both alone; scaling by $a$ scales the standard deviation by $\lvert a \rvert$. The variance of a sum adds the variances and twice the covariance, and for independent variables the covariance vanishes, so variances, not standard deviations, add. Indicators have variance $p(1 - p)$, which gives the spread of any count of independent successes.

        Counts of independent successes, waiting times for a first success, and counts of rare events turn up so often that their distributions have names and formulas worked out once and for all. They are [[f4.common-discrete-distributions]], and each comes with its mean and variance, which you can now derive yourself.
