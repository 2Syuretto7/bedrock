concept: f4.variance
minutes: 90
claim: You can compute the variance and standard deviation of a random variable from its definition and from the shortcut E[X^2] - (E[X])^2, say how shifting and scaling change them, compute covariance and know that variances of independent variables add, find the variance of a sum of indicators, and use the square-root law for the spread of an average of independent measurements.
recalls: [f4.expectation-and-linearity]
uses: [f4.expectation-and-linearity, f4.random-variables, f4.independence, f1.exponents-and-exponential-growth, f1.summation-notation, s1.comprehensions-and-iterators, s1.modules-and-imports, s0.dictionaries-and-sets, s0.functions, s0.loops]
leads: [f4.common-discrete-distributions, f4.continuous-distributions-and-densities, f4.tail-bounds, f4.the-law-of-large-numbers-and-the-central-limit-theorem]
starter: |
  # Scratch space. The total of two dice: its mean, and how far it strays on average.
  import itertools

  totals = [a + b for a, b in itertools.product(range(1, 7), repeat=2)]
  mean = sum(totals) / len(totals)
  spread = sum((t - mean) ** 2 for t in totals) / len(totals)
  print(mean, spread, spread ** 0.5)
parts:
  recall:
    - text: |
        [[f4.expectation-and-linearity]] boiled a random variable down to its mean, and ended by noticing that two variables can share a mean and behave very differently. Three quick pulls first.
  puzzle:
    - text: |
        A kirana shop weighs rice on an old electronic scale. The scale is not biased, so on average it reads the true weight, but each reading wobbles: weigh the same bag again and the number changes, typically by about 20 grams either way. The wobble on one weighing has nothing to do with the wobble on the next.

        The shopkeeper wants a figure she can trust to within about 5 grams. Her plan is to weigh each bag several times and take the average. "The wobble is four times too big," she reasons, "so I will weigh four times and average."

        **How many weighings does she really need for the average to wobble by only about 5 grams?**
  intuition:
    - text: |
        Compare two games with the same expectation. In the first, you throw two dice and receive the total in rupees: expectation 7. In the second, a coin is tossed and you receive 0 or 14 rupees: expectation 7 again. The second game is far riskier. Its payout is always 7 away from the mean, while the dice total is often 6, 7 or 8.

        To measure how far a variable strays, look at its distance from the mean on each outcome and average it. Distances above and below would cancel if added as they are, since the mean is the balance point, so square them first. The coin game is 7 away on every toss, so its average squared distance is 49. The dice total is 0 away on 6 throws in 36, 1 away on 10, 2 away on 8, 3 away on 6, 4 away on 4 and 5 away on 2, giving

        $$\frac{6 \times 0 + 10 \times 1 + 8 \times 4 + 6 \times 9 + 4 \times 16 + 2 \times 25}{36} = \frac{210}{36} = \frac{35}{6} \approx 5.83.$$

        That average squared distance is the **variance**. Its square root, about $2.42$ for the dice and $7$ for the coin, is in rupees again and is called the **standard deviation**: a typical distance from the mean.

        In the figure, the bracket above the bars runs from one standard deviation below the mean to one above. For the dice total it covers 5 to 9 and two thirds of the probability. Switch to the other variables and watch the bracket grow and shrink with the spread of the bars.
    - figure: variable-bars
      props: { variable: total, marks: spread }
    - text: |
        For the prize game, the bracket is wide, about 9.3 rupees on either side of the mean, although most plays lose exactly 5 rupees. One rare big win far from the mean pulls the standard deviation up, because squaring makes large distances count for much more than small ones.
  derivation:
    - text: |
        **Variance.** For a random variable $X$ with mean $\mu = E[X]$, the **variance** is

        $$\operatorname{Var}(X) = E\bigl[(X - \mu)^2\bigr],$$

        often written $\sigma^2$, and the **standard deviation** is $\sigma = \sqrt{\operatorname{Var}(X)}$. The variance is never negative, and it is zero only when $X$ equals $\mu$ with probability 1.

        **The shortcut.** Expanding the square and using linearity, with $\mu$ a constant,

        $$E\bigl[(X - \mu)^2\bigr] = E[X^2] - 2\mu\,E[X] + \mu^2 = E[X^2] - \mu^2.$$

        So the variance is the mean of the square minus the square of the mean, the gap noticed in the last lesson. For one fair die, $E[X^2] = 91/6$ and $\mu^2 = 49/4$, so

        $$\operatorname{Var}(X) = \frac{91}{6} - \frac{49}{4} = \frac{182 - 147}{12} = \frac{35}{12} \approx 2.92.$$

        The shortcut is convenient on paper, but with floating-point numbers it can lose all its accuracy when the mean is large compared with the spread, because it subtracts two nearly equal large numbers. Computing $E[(X - \mu)^2]$ directly is safer.

        **Shifting and scaling.** For numbers $a$ and $b$,

        $$\operatorname{Var}(aX + b) = a^2 \operatorname{Var}(X), \qquad \sigma_{aX + b} = \lvert a \rvert\,\sigma_X.$$

        Adding $b$ moves every value and the mean together, so no distance changes. Multiplying by $a$ multiplies every distance by $a$, and every squared distance by $a^2$. A temperature in Fahrenheit, $1.8C + 32$, has a standard deviation 1.8 times the Celsius one.

        **Standardising.** It follows that $Z = (X - \mu)/\sigma$ has mean 0 and variance 1. $Z$ measures how many standard deviations $X$ lies from its mean, a scale that lets very different quantities be compared.
    - question:
        id: derivation-shortcut
        type: numeric
        system: s2
        prompt: |
          $X$ takes the values 1, 2 and 3 with chances $0.2$, $0.5$ and $0.3$. What is $\operatorname{Var}(X)$?
        answer: "0.49"
        explanation: |
          $E[X] = 0.2 + 1.0 + 0.9 = 2.1$ and $E[X^2] = 0.2 + 2.0 + 2.7 = 4.9$. So $\operatorname{Var}(X) = 4.9 - 2.1^2 = 4.9 - 4.41 = 0.49$, a standard deviation of $0.7$.
    - text: |
        **Sums and covariance.** Variance is not linear. Expanding $\bigl((X - \mu_X) + (Y - \mu_Y)\bigr)^2$ gives

        $$\operatorname{Var}(X + Y) = \operatorname{Var}(X) + \operatorname{Var}(Y) + 2\operatorname{Cov}(X, Y),$$

        where the **covariance** is

        $$\operatorname{Cov}(X, Y) = E\bigl[(X - \mu_X)(Y - \mu_Y)\bigr] = E[XY] - E[X]\,E[Y].$$

        Covariance is positive when $X$ and $Y$ tend to be above their means together, and negative when one tends to be high as the other is low. If $X$ and $Y$ are independent, then $E[XY] = E[X]\,E[Y]$, so the covariance is zero and

        $$\operatorname{Var}(X + Y) = \operatorname{Var}(X) + \operatorname{Var}(Y).$$

        For several pairwise independent variables, the variances simply add. The total of two dice has variance $35/12 + 35/12 = 35/6$, as counted above. And $\operatorname{Var}(X - Y) = \operatorname{Var}(X) + \operatorname{Var}(Y)$ too, since $-Y$ has the same variance as $Y$: subtracting independent noise *adds* uncertainty.

        Zero covariance does not mean independence. If $X$ is $-1$, 0 or 1 with equal chances, then $X$ and $X^2$ have covariance $E[X^3] - E[X]\,E[X^2] = 0 - 0 = 0$, yet $X^2$ is determined by $X$. Covariance measures only a straight-line tendency. Divided by both standard deviations it becomes the **correlation**, a number between $-1$ and $1$.
    - question:
        id: order-heads
        type: order
        system: s2
        prompt: |
          Put the steps for the variance of the number of heads in $n$ tosses of a coin that lands heads with chance $p$ in order.
        steps:
          - "Write the number of heads as a sum of $n$ indicators, one for each toss."
          - "An indicator with chance $p$ has $E[\\mathbf{1}^2] = E[\\mathbf{1}] = p$, so its variance is $p - p^2 = p(1 - p)$."
          - "The tosses are independent, so the covariance of any two indicators is zero."
          - "So the variance of the number of heads is $n\\,p(1 - p)$."
        explanation: |
          A 0 or 1 variable equals its own square, which makes its variance $p(1 - p)$, largest at $p = 1/2$. Independence lets the variances add. For 100 fair tosses the variance is 25 and the standard deviation 5: about 50 heads, give or take 5.
    - text: |
        **The square-root law.** Let $X_1, \dots, X_n$ be independent measurements, each with mean $\mu$ and variance $\sigma^2$, and let $\bar{X} = (X_1 + \cdots + X_n)/n$ be their average. By linearity $E[\bar{X}] = \mu$. The sum has variance $n\sigma^2$, since the variances add, and dividing by $n$ divides the variance by $n^2$:

        $$\operatorname{Var}(\bar{X}) = \frac{n\sigma^2}{n^2} = \frac{\sigma^2}{n}, \qquad \sigma_{\bar{X}} = \frac{\sigma}{\sqrt{n}}.$$

        Averaging shrinks the wobble, but only by the square root of the number of measurements. Four measurements halve it; to divide it by 4 takes 16, and to divide it by 10 takes 100.

        **The rice.** One weighing wobbles by $\sigma = 20$ grams, and the shopkeeper wants $\sigma/\sqrt{n} = 5$, so $\sqrt{n} = 4$ and $n = 16$ weighings, not 4. Four weighings bring the wobble down only to $20/2 = 10$ grams. The law needs the wobbles to be independent: if the scale drifts the same way all afternoon, averaging cannot remove the drift.

        The same law runs through engineering. Benchmark timings, survey estimates, A/B test results and the noise in sensor readings all shrink like $1/\sqrt{n}$, which is why halving an error bar costs four times the data.

        **In Python.** With a pmf as a dictionary, compute the mean first and then the average squared distance:

        ```python
        from fractions import Fraction

        pmf = {x: Fraction(1, 6) for x in range(1, 7)}
        mean = sum(x * p for x, p in pmf.items())
        var = sum((x - mean) ** 2 * p for x, p in pmf.items())
        print(mean, var)
        ```

        This prints `7/2 35/12`, one die's mean and variance.
  formal:
    - text: |
        **Variance.** $\operatorname{Var}(X) = E[(X - \mu)^2] = E[X^2] - \mu^2$, where $\mu = E[X]$. **Standard deviation.** $\sigma_X = \sqrt{\operatorname{Var}(X)}$.

        **Shift and scale.** $\operatorname{Var}(aX + b) = a^2 \operatorname{Var}(X)$. $Z = (X - \mu)/\sigma$ has mean 0 and variance 1.

        **Covariance.** $\operatorname{Cov}(X, Y) = E[(X - \mu_X)(Y - \mu_Y)] = E[XY] - E[X]\,E[Y]$. Independent variables have covariance 0; the converse is false. **Correlation.** $\rho = \operatorname{Cov}(X, Y)/(\sigma_X \sigma_Y) \in [-1, 1]$.

        **Sums.** $\operatorname{Var}(X + Y) = \operatorname{Var}(X) + \operatorname{Var}(Y) + 2\operatorname{Cov}(X, Y)$. For pairwise independent $X_1, \dots, X_n$, $\operatorname{Var}\bigl(\sum X_i\bigr) = \sum \operatorname{Var}(X_i)$.

        **Indicators.** $\operatorname{Var}(\mathbf{1}_A) = p(1 - p)$ where $p = P(A)$.

        **Averages.** If $X_1, \dots, X_n$ are independent with variance $\sigma^2$, then $\operatorname{Var}(\bar{X}) = \sigma^2/n$ and $\sigma_{\bar{X}} = \sigma/\sqrt{n}$.
