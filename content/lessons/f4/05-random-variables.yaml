    - question:
        id: predict-heads
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import itertools
          from fractions import Fraction

          pmf = {}
          for t in itertools.product("HT", repeat=3):
              k = t.count("H")
              pmf[k] = pmf.get(k, 0) + Fraction(1, 8)
          print(pmf[0], pmf[1], pmf[2], pmf[3])
