    - question:
        id: predict-cdf
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          from fractions import Fraction

          pmf = {1: Fraction(1, 4), 2: Fraction(1, 2), 3: Fraction(1, 4)}
          running = Fraction(0)
          cdf = []
          for x in sorted(pmf):
              running += pmf[x]
              cdf.append(str(running))
          print(" ".join(cdf))
        output: "1/4 3/4 1"
        explanation: The cdf adds up the pmf from the smallest value, reaching 1 at the largest.
  work:
    - text: Slower now. For each variable, say which outcomes give each value before you count, and check that your pmf adds to 1.
    - question:
        id: fix-distribution
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `distribution(outcomes, variable)` should return the pmf of a random variable as a dictionary from each value to its exact chance, where `outcomes` lists equally likely outcomes and `variable` is a function giving the value for each outcome. The program should print `1/36 1/12 5/36 7/36 1/4 11/36`, the pmf of the larger of two dice. It prints `1/36 1/36 1/36 1/36 1/36 1/36`. Find the fault and fix it.
        starter: |
          import itertools
          from fractions import Fraction

          def distribution(outcomes, variable):
              pmf = {}
              for o in outcomes:
                  pmf[variable(o)] = Fraction(1, len(outcomes))
              return pmf

          def larger(p):
              return max(p)

          pairs = list(itertools.product(range(1, 7), repeat=2))
          pmf = distribution(pairs, larger)
          print(" ".join(str(pmf[k]) for k in range(1, 7)))
        solution: |
          import itertools
          from fractions import Fraction

          def distribution(outcomes, variable):
              pmf = {}
              for o in outcomes:
                  value = variable(o)
                  pmf[value] = pmf.get(value, 0) + Fraction(1, len(outcomes))
              return pmf

          def larger(p):
              return max(p)

          pairs = list(itertools.product(range(1, 7), repeat=2))
          pmf = distribution(pairs, larger)
          print(" ".join(str(pmf[k]) for k in range(1, 7)))
        tests: |
          import random
          from fractions import Fraction
          random.seed(41)
          for _trial in range(300):
              _n = random.randint(1, 12)
              _vals = [random.randint(-3, 3) for _i in range(_n)]
              _want = {}
              for _v in _vals:
                  _want[_v] = _want.get(_v, Fraction(0)) + Fraction(1, _n)
              _got = distribution(list(range(_n)), lambda _o, _vs=_vals: _vs[_o])
              assert _got == _want, "With values " + str(_vals) + " on equally likely outcomes, the pmf is " + str({_k: str(_w) for _k, _w in sorted(_want.items())})
          assert output.strip() == "1/36 1/12 5/36 7/36 1/4 11/36", "The program should print 1/36 1/12 5/36 7/36 1/4 11/36"
        wrong:
          - |
            from fractions import Fraction

            def distribution(outcomes, variable):
                values = set(variable(o) for o in outcomes)
                return {v: Fraction(1, len(values)) for v in values}

            print("1/36 1/12 5/36 7/36 1/4 11/36")
          - |
            from fractions import Fraction

            def distribution(outcomes, variable):
                pmf = {}
                for o in outcomes:
                    value = variable(o)
                    pmf[value] = pmf.get(value, 0) + 1
                return pmf

            print("1/36 1/12 5/36 7/36 1/4 11/36")
        explanation: |
          Each outcome contributes its chance, $1/n$, to the value it gives, and several outcomes can give the same value, so the chances must be added, not overwritten. The faulty loop kept only the last outcome's $1/36$ for each value. Giving every value the same chance repeats the error of the eleven totals, and returning counts instead of chances gives a table that adds to $n$, not to 1.
    - question:
        id: write-function-of
        type: code
        mode: write
        system: s2
        prompt: |
          Write `pmf_of(pmf, g)`. `pmf` is a dictionary from each value of a random variable $X$ to its chance, and `g` is a function. Return the pmf of $Y = g(X)$ as a dictionary from each value of $Y$ to its chance, leaving out no value that has a positive chance.
        starter: |
          import itertools
          from fractions import Fraction

          def pmf_of(pmf, g):
              return {g(x): 0 for x in pmf}

          totals = {}
          for a, b in itertools.product(range(1, 7), repeat=2):
              totals[a + b] = totals.get(a + b, 0) + Fraction(1, 36)

          def parity(t):
              return t % 2

          def high(t):
              return t >= 10

          parities = pmf_of(totals, parity)
          highs = pmf_of(totals, high)
          print(parities[0], parities[1], highs[True], len(pmf_of(totals, abs)))
        solution: |
          import itertools
          from fractions import Fraction

          def pmf_of(pmf, g):
              result = {}
              for x, chance in pmf.items():
                  y = g(x)
                  result[y] = result.get(y, 0) + chance
              return result

          totals = {}
          for a, b in itertools.product(range(1, 7), repeat=2):
              totals[a + b] = totals.get(a + b, 0) + Fraction(1, 36)

          def parity(t):
              return t % 2

          def high(t):
              return t >= 10

          parities = pmf_of(totals, parity)
          highs = pmf_of(totals, high)
          print(parities[0], parities[1], highs[True], len(pmf_of(totals, abs)))
        tests: |
          import random
          from fractions import Fraction
          random.seed(43)
          for _trial in range(300):
              _k = random.randint(1, 8)
              _xs = random.sample(range(-6, 7), _k)
              _w = [random.randint(1, 9) for _i in range(_k)]
              _pmf = {_xs[_i]: Fraction(_w[_i], sum(_w)) for _i in range(_k)}
              _m = random.randint(1, 4)
              _want = {}
              for _x, _c in _pmf.items():
                  _want[_x * _x % (_m + 1)] = _want.get(_x * _x % (_m + 1), 0) + _c
              _got = pmf_of(dict(_pmf), lambda _x, _m=_m: _x * _x % (_m + 1))
              _clean = {_y: _c for _y, _c in _got.items() if _c != 0}
              assert _clean == _want, "For the pmf " + str({_x: str(_c) for _x, _c in _pmf.items()}) + " and g(x) = x * x % " + str(_m + 1) + ", the pmf of g(X) is " + str({_y: str(_c) for _y, _c in _want.items()})
          assert output.strip() == "1/2 1/2 1/6 11", "The program should print 1/2 1/2 1/6 11"
        wrong:
          - |
            def pmf_of(pmf, g):
                result = {}
                for x, chance in pmf.items():
                    result[g(x)] = chance
                return result

            print("1/2 1/2 1/6 11")
          - |
            from fractions import Fraction

            def pmf_of(pmf, g):
                ys = set(g(x) for x in pmf)
                return {y: Fraction(1, len(ys)) for y in ys}

            print("1/2 1/2 1/6 11")
          - |
            def pmf_of(pmf, g):
                result = {}
                for x, chance in pmf.items():
                    result[g(x)] = result.get(g(x), 0) + 1
                return result

            print("1/2 1/2 1/6 11")
        explanation: |
          $P(Y = y)$ is the sum of $P(X = x)$ over every $x$ with $g(x) = y$, so the chances must accumulate under the key $g(x)$. Assigning instead of adding keeps only the last $x$ for each $y$. Giving each value of $Y$ an equal share, or counting the values of $x$, ignores the chances of $X$ altogether.
    - question:
        id: write-joint
        type: code
        mode: write
        system: s2
        prompt: |
          `joint` is a dictionary from pairs `(x, y)` to the chance that $X = x$ and $Y = y$. Pairs with chance 0 may be missing. Write `independent(joint)`, which returns `True` exactly when $X$ and $Y$ are independent. Work out both marginal pmfs, then check every pair of values, including pairs that are missing from `joint`.
        starter: |
          import itertools
          from fractions import Fraction

          def independent(joint):
              return True

          dice = {}
          first_total = {}
          for a, b in itertools.product(range(1, 7), repeat=2):
              dice[(a, b)] = Fraction(1, 36)
              first_total[(a, a + b)] = first_total.get((a, a + b), 0) + Fraction(1, 36)
          print(independent(dice), independent(first_total))
        solution: |
          import itertools
          from fractions import Fraction

          def independent(joint):
              px = {}
              py = {}
              for (x, y), chance in joint.items():
                  px[x] = px.get(x, 0) + chance
                  py[y] = py.get(y, 0) + chance
              for x in px:
                  for y in py:
                      if joint.get((x, y), 0) != px[x] * py[y]:
                          return False
              return True

          dice = {}
          first_total = {}
          for a, b in itertools.product(range(1, 7), repeat=2):
              dice[(a, b)] = Fraction(1, 36)
              first_total[(a, a + b)] = first_total.get((a, a + b), 0) + Fraction(1, 36)
          print(independent(dice), independent(first_total))
        tests: |
          import random
          from fractions import Fraction
          random.seed(47)
          def _indep(_j):
              _px = {}
              _py = {}
              for (_x, _y), _c in _j.items():
                  _px[_x] = _px.get(_x, 0) + _c
                  _py[_y] = _py.get(_y, 0) + _c
              return all(_j.get((_x, _y), 0) == _px[_x] * _py[_y] for _x in _px for _y in _py)
          _kinds = set()
          for _trial in range(300):
              _xs = random.sample(range(5), random.randint(1, 3))
              _ys = random.sample(range(5), random.randint(1, 3))
              if random.random() < 0.5:
                  _a = [random.randint(1, 4) for _x in _xs]
                  _b = [random.randint(1, 4) for _y in _ys]
                  _j = {(_x, _y): Fraction(_a[_i] * _b[_k], sum(_a) * sum(_b)) for _i, _x in enumerate(_xs) for _k, _y in enumerate(_ys)}
              else:
                  _cells = [(_x, _y) for _x in _xs for _y in _ys if random.random() < 0.7]
                  if not _cells:
                      _cells = [(_xs[0], _ys[0])]
                  _w = [random.randint(1, 4) for _c in _cells]
                  _j = {_c: Fraction(_w[_i], sum(_w)) for _i, _c in enumerate(_cells)}
              _want = _indep(_j)
              _kinds.add(_want)
              _got = independent(dict(_j))
              assert _got == _want, "For the joint pmf " + str({_k: str(_v) for _k, _v in _j.items()}) + ", independent should be " + str(_want)
          _gap = {(0, 0): Fraction(1, 2), (1, 1): Fraction(1, 2)}
          assert independent(_gap) is False, "X = Y = a fair bit: the pairs (0, 1) and (1, 0) are missing, so X and Y are dependent"
          _diag = {(0, 0): Fraction(1, 4), (0, 1): Fraction(1, 4), (1, 0): Fraction(1, 4), (1, 1): Fraction(1, 4)}
          assert independent(_diag) is True, "Two fair bits with every pair 1/4 are independent"
          assert output.strip() == "True False", "The program should print True False"
        wrong:
          - |
            def independent(joint):
                xs = set(x for x, y in joint)
                ys = set(y for x, y in joint)
                return len(joint) == len(xs) * len(ys)

            print("True False")
          - |
            def independent(joint):
                px = {}
                py = {}
                for (x, y), chance in joint.items():
                    px[x] = chance
                    py[y] = chance
                for x in px:
                    for y in py:
                        if joint.get((x, y), 0) != px[x] * py[y]:
                            return False
                return True

            print("True False")
        explanation: |
          Independence requires $p_{X,Y}(x, y) = p_X(x)\,p_Y(y)$ for *every* pair of values, so find the marginals first, by adding along rows and down columns, then compare each cell with the product of its margins. A pair missing from the table has chance 0, which is right only if one of its marginals is 0. Checking that every pair is present is not enough, because a table with every cell filled can still differ from the product of its margins. Overwriting the marginals instead of adding gives the chance of one cell, not of a whole row.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Two fair dice are thrown. What is the probability that the gap between the two numbers is exactly 1? Give a fraction.
        answer: "5/18"
        explanation: |
          The pairs are $(k, k + 1)$ and $(k + 1, k)$ for $k = 1, \dots, 5$: ten throws, $10/36 = 5/18$. So Asha's bet, $11/36$, is best, Chitra's, $10/36$, is next, and Bilal's total of 7, $6/36$, is worst, although 7 is the total's most likely value.
    - question:
        id: work-four-heads
        type: numeric
        system: s2
        prompt: |
          A fair coin is tossed four times and $X$ is the number of heads. What is $P(X = 2)$? Give a fraction.
        answer: "3/8"
        explanation: |
          $\binom{4}{2} = 6$ of the 16 equally likely sequences have exactly two heads, so $6/16 = 3/8$.
    - question:
        id: work-underneath
        type: choice
        system: s2
        prompt: |
          A die is thrown. $X$ is the number on top and $Y = 7 - X$ is the number underneath. Which is true?
        options:
          - "$X$ and $Y$ have the same distribution, but they are different random variables and are never equal."
          - "$X$ and $Y$ are the same random variable, since they have the same distribution."
          - "$X$ and $Y$ are independent, since knowing $X$ does not change the distribution of numbers 1 to 6."
          - "$Y$ has a different distribution from $X$, since its values are counted backwards."
        answer: 0
        explanation: |
          Each takes the values 1 to 6 with chance $1/6$, so their distributions are identical. But as functions on the outcomes they differ at every outcome. And they are as dependent as can be: knowing $X$ fixes $Y$, so $P(X = 1, Y = 1) = 0 \ne \tfrac1{36}$.
  connections:
    - text: |
        Asha's bet wins with chance $11/36$, Chitra's with $10/36$ and Bilal's with $6/36$. Bilal knew that 7 is the most likely total, and it is, but a total has eleven values to spread over, while the larger number piles almost a third of its chance onto 6. Each friend had a different random variable on the same 36 throws, and only their distributions could compare the bets.

        A random variable attaches a number to every outcome. Its pmf collects the outcomes by value, and its cdf adds the pmf up; each gives the other, and the cdf is often easier to count, as for a maximum. Functions of random variables are random variables, with pmfs found by adding. Indicators turn events into 0s and 1s, and counts are sums of indicators. Two variables together have a joint pmf, with marginals in its margins, and they are independent when the table is the product of its margins.

        A whole distribution is a lot to carry around. The next lesson boils one down to a single number, its balance point, and finds a rule for it so powerful that it answers questions no table could: [[f4.expectation-and-linearity]].
