concept: f4.random-variables
minutes: 90
claim: You can define a random variable as a number attached to each outcome, find its probability mass function by adding the chances of the outcomes that give each value, build and read its cumulative distribution function, find the distribution of a function of a random variable, use indicator variables, work with a joint distribution and its marginals, and decide whether two random variables are independent.
recalls: [f4.independence]
uses: [f4.independence, f4.conditional-probability, f4.sample-spaces-and-events, f3.counting-with-products-and-sums, f2.relations-and-functions-between-sets, f1.functions-as-machines, s1.comprehensions-and-iterators, s1.modules-and-imports, s0.dictionaries-and-sets, s0.functions, s0.loops]
leads: [f4.expectation-and-linearity, f4.variance, f4.common-discrete-distributions, f4.continuous-distributions-and-densities]
starter: |
  # Scratch space. The larger of two dice: how often is it each of 1 to 6?
  import itertools

  counts = {}
  for a, b in itertools.product(range(1, 7), repeat=2):
      larger = max(a, b)
      counts[larger] = counts.get(larger, 0) + 1
  print(counts)
parts:
  recall:
    - text: |
        [[f4.independence]] ended by turning from events, which happen or do not, to numbers that depend on chance: how many requests fail, how long a page takes, how much a game pays. Three quick pulls first.
  puzzle:
    - text: |
        Three friends at a mela watch a stall where two dice are thrown, and each makes a bet with the stall owner on the next throw.

        Asha bets that the *larger* of the two numbers will be 6. Bilal bets that the *total* will be 7, "because 7 is the most likely total, everybody knows that". Chitra bets that the *gap* between the two numbers will be exactly 1.

        All three are paid the same amount if they win. **Rank the three bets from best to worst, with the exact chance of each.**
  intuition:
    - text: |
        Each friend is watching the same 36 equally likely results, but each attaches a different number to every result. For the throw (2, 5), Asha sees 5, Bilal sees 7 and Chitra sees 3. A rule that attaches a number to every outcome is called a **random variable**. The dice are random; the rule is not. Once the dice land, every random variable built on them has a definite value.

        To know how a random variable behaves, collect the outcomes by the value they give. Asha's larger number is 6 whenever either die shows 6: that is 11 outcomes, the ones you counted for "at least one six". It is 5 when the larger number is 5: either die shows 5 and the other at most 5, which is 9 outcomes. Working down, the counts are 11, 9, 7, 5, 3 and 1 for the values 6, 5, 4, 3, 2 and 1. They add to 36, as they must, because every outcome gives exactly one value.

        That list of values and chances is the variable's **distribution**. It is all you need to answer any question about the variable alone, and it is what the figure draws: one bar per value, as tall as the number of throws that give it. Use the first button to see Bilal's total and Chitra's gap on the same 36 throws.
    - figure: variable-bars
      props: { variable: max }
    - text: |
        The total has its tallest bar at 7, six throws, but the larger number has a bar of eleven at 6 and the gap a bar of ten at 1. A "most likely value" can still be quite unlikely, if the variable has many values to spread over. Now press "Add up the chances" on the larger number. Each bar now counts the throws where the larger number is *at most* that value: 1, 4, 9, 16, 25, 36. Those are square numbers, and that is a clue to a faster way of counting.
  derivation:
    - text: |
        **Random variables.** A random variable is a function $X : \Omega \to \mathbb{R}$, one of the functions between sets of [[f2.relations-and-functions-between-sets]]: it gives a number $X(\omega)$ for each outcome $\omega$. Capital letters name random variables and small letters their values. The statement "$X = x$" is the event $\{\omega : X(\omega) = x\}$, the set of outcomes giving the value $x$, and "$X \le x$" is similarly an event, so everything from the last four lessons applies to them.

        **The probability mass function.** For a random variable with a finite or listable set of values, its **probability mass function**, or pmf, is

        $$p_X(x) = P(X = x).$$

        The events $X = x$ for different $x$ are disjoint and together make $\Omega$, so the values of the pmf are at least 0 and add to 1. To find it, add the chances of the outcomes that give each value.

        **The cumulative distribution function.** The **cdf** of $X$ is

        $$F_X(x) = P(X \le x).$$

        It rises from 0 to 1, never decreases, and for a variable with whole-number values it jumps at each value $k$ by exactly $p_X(k)$. So each can be got from the other: add up the pmf to get the cdf, or take differences of the cdf to get the pmf,

        $$p_X(k) = F_X(k) - F_X(k - 1).$$

        The cdf is often the easier one to count. The larger of two dice is at most $k$ exactly when *both* dice are at most $k$, which happens in $k \times k = k^2$ of the 36 throws. So $F(k) = k^2/36$ and

        $$P(\text{larger} = k) = \frac{k^2 - (k - 1)^2}{36} = \frac{2k - 1}{36}.$$

        That is $11/36$ for $k = 6$, with no listing at all. The same trick works for the largest of many dice, of many measurements or of many server response times, which is why maxima are usually studied through cdfs.
    - question:
        id: derivation-max-three
        type: numeric
        system: s2
        prompt: |
          Three fair dice are thrown. What is the probability that the largest of the three numbers is 6? Give a fraction.
        answer: "91/216"
        explanation: |
          The largest is at most 5 exactly when all three are at most 5, in $5^3 = 125$ of the $216$ throws. So $P(\text{largest} = 6) = (216 - 125)/216 = 91/216$, about $0.42$.
    - text: |
        **Functions of a random variable.** If $X$ is a random variable and $g$ is a function, then $Y = g(X)$ is another random variable, the composition of [[f1.functions-as-machines]]. Its pmf comes from $X$'s by adding the chances of all the values of $x$ that $g$ sends to the same $y$:

        $$P(Y = y) = \sum_{x \,:\, g(x) = y} P(X = x).$$

        If $X$ is the total of two dice and $g(x) = x \bmod 2$, then $Y = 0$ for an even total, with chance $(1 + 3 + 5 + 5 + 3 + 1)/36 = 18/36$.

        **Indicators.** The simplest random variables take only the values 0 and 1. The **indicator** of an event $A$ is $1$ when $A$ happens and $0$ when it does not, and its pmf is $P(\mathbf{1}_A = 1) = P(A)$. Counting variables are sums of indicators: the number of sixes in two throws is the indicator of "first die is 6" plus the indicator of "second die is 6". This small fact is the key to [[f4.expectation-and-linearity]].
    - question:
        id: order-pmf
        type: order
        system: s2
        prompt: |
          Find the pmf of the number of heads in three tosses of a fair coin. Put the steps in order.
        steps:
          - "List the $2^3 = 8$ equally likely sequences of heads and tails."
          - "Attach to each sequence its number of heads, from 0 to 3."
          - "Collect the sequences by that number: 1, 3, 3 and 1 of them give 0, 1, 2 and 3 heads."
          - "Divide by 8: the pmf is $1/8, 3/8, 3/8, 1/8$, which adds to 1."
        explanation: |
          A pmf is always made this way: outcomes, the number each gives, then the outcomes grouped by number. The counts 1, 3, 3, 1 are the binomial coefficients $\binom{3}{k}$, a pattern the lesson on common distributions will use.
    - text: |
        **Joint distributions.** Two random variables on the same sample space have a **joint pmf**, $p_{X,Y}(x, y) = P(X = x \text{ and } Y = y)$, a table with a row for each value of $X$ and a column for each value of $Y$. Adding along a row gives $P(X = x)$, and adding down a column gives $P(Y = y)$; these are the **marginal** pmfs, so named because they used to be written in the margins of the table.

        **Independent random variables.** $X$ and $Y$ are independent when every pair of their events is:

        $$P(X = x \text{ and } Y = y) = P(X = x)\,P(Y = y) \quad \text{for all } x, y.$$

        The two dice are independent: each of the 36 cells has chance $1/36 = \tfrac16 \cdot \tfrac16$. The first die and the total are not: the first die 1 and a total of 12 have chance 0, while the product of their chances is $\tfrac16 \cdot \tfrac1{36}$. A single cell that is zero where both marginals are positive is enough to show dependence. Functions of independent random variables are independent too: if $X$ and $Y$ are independent, so are $g(X)$ and $h(Y)$.

        **Same distribution, different variables.** Let $X$ be the number a die shows and $Y = 7 - X$, the number on the face underneath. $X$ and $Y$ are never equal, yet they have the same distribution, each value 1 to 6 with chance $1/6$. A distribution describes how a variable behaves on its own, not which outcomes give which values. Any question about one variable alone depends only on its distribution, but questions about two variables together, such as "is $X$ bigger than $Y$?", need the joint distribution.

        **In Python.** A pmf is naturally a dictionary from values to exact chances:

        ```python
        import itertools
        from fractions import Fraction

        pmf = {}
        for a, b in itertools.product(range(1, 7), repeat=2):
            larger = max(a, b)
            pmf[larger] = pmf.get(larger, 0) + Fraction(1, 36)
        print(pmf[6], sum(pmf.values()))
        ```

        This prints `11/36 1`: Asha's chance, and a check that the pmf adds to 1.
  formal:
    - text: |
        **Random variable.** A function $X : \Omega \to \mathbb{R}$. "$X = x$" and "$X \le x$" denote the events $\{\omega : X(\omega) = x\}$ and $\{\omega : X(\omega) \le x\}$.

        **Pmf.** $p_X(x) = P(X = x)$, with $p_X(x) \ge 0$ and $\sum_x p_X(x) = 1$.

        **Cdf.** $F_X(x) = P(X \le x)$, non-decreasing, from 0 to 1. For whole-number values, $p_X(k) = F_X(k) - F_X(k - 1)$.

        **Functions.** For $Y = g(X)$, $p_Y(y) = \sum_{x : g(x) = y} p_X(x)$.

        **Indicator.** $\mathbf{1}_A(\omega) = 1$ if $\omega \in A$ and $0$ otherwise; $P(\mathbf{1}_A = 1) = P(A)$.

        **Joint and marginal.** $p_{X,Y}(x, y) = P(X = x, Y = y)$; $p_X(x) = \sum_y p_{X,Y}(x, y)$.

        **Independence.** $X$ and $Y$ are independent when $p_{X,Y}(x, y) = p_X(x)\,p_Y(y)$ for all $x$ and $y$. Then $g(X)$ and $h(Y)$ are independent for any functions $g$ and $h$.
  drill:
