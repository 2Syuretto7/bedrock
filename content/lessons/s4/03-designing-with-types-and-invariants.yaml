    - question:
        id: write-advance
        type: code
        mode: write
        system: s2
        prompt: |
          Change `advance` so that it returns the next status for the legal moves only, pay, pack, ship and deliver in that order, and cancel before the order ships, and raises `ValueError` for every other move. The program should print `['paid', 'paid', 'packed', 'shipped', 'shipped', 'delivered']`.
        starter: |
          from enum import Enum


          class Status(Enum):
              PLACED = "placed"
              PAID = "paid"
              PACKED = "packed"
              SHIPPED = "shipped"
              DELIVERED = "delivered"
              CANCELLED = "cancelled"


          def advance(status, event):
              if event == "cancel":
                  return Status.CANCELLED
              return {"pay": Status.PAID, "pack": Status.PACKED, "ship": Status.SHIPPED, "deliver": Status.DELIVERED}[event]


          history = []
          status = Status.PLACED
          for event in ["pay", "ship", "pack", "ship", "cancel", "deliver"]:
              try:
                  status = advance(status, event)
              except ValueError:
                  pass
              history.append(status.value)
          print(history)
        solution: |
          from enum import Enum


          class Status(Enum):
              PLACED = "placed"
              PAID = "paid"
              PACKED = "packed"
              SHIPPED = "shipped"
              DELIVERED = "delivered"
              CANCELLED = "cancelled"


          NEXT = {
              (Status.PLACED, "pay"): Status.PAID,
              (Status.PAID, "pack"): Status.PACKED,
              (Status.PACKED, "ship"): Status.SHIPPED,
              (Status.SHIPPED, "deliver"): Status.DELIVERED,
              (Status.PLACED, "cancel"): Status.CANCELLED,
              (Status.PAID, "cancel"): Status.CANCELLED,
              (Status.PACKED, "cancel"): Status.CANCELLED,
          }


          def advance(status, event):
              if (status, event) not in NEXT:
                  raise ValueError(f"cannot {event} an order that is {status.value}")
              return NEXT[(status, event)]


          history = []
          status = Status.PLACED
          for event in ["pay", "ship", "pack", "ship", "cancel", "deliver"]:
              try:
                  status = advance(status, event)
              except ValueError:
                  pass
              history.append(status.value)
          print(history)
        tests: |
          import random as _random

          _legal = {("placed", "pay"): "paid", ("paid", "pack"): "packed", ("packed", "ship"): "shipped", ("shipped", "deliver"): "delivered", ("placed", "cancel"): "cancelled", ("paid", "cancel"): "cancelled", ("packed", "cancel"): "cancelled"}
          for _st in Status:
              for _ev in ["pay", "pack", "ship", "deliver", "cancel"]:
                  _want = _legal.get((_st.value, _ev))
                  try:
                      _got = advance(_st, _ev)
                  except ValueError:
