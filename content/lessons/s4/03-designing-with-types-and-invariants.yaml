            from enum import Enum


            class Status(Enum):
                PLACED = "placed"
                PAID = "paid"
                PACKED = "packed"
                SHIPPED = "shipped"
                DELIVERED = "delivered"
                CANCELLED = "cancelled"


            ORDER = [Status.PLACED, Status.PAID, Status.PACKED, Status.SHIPPED, Status.DELIVERED]
            EVENTS = {"pay": Status.PAID, "pack": Status.PACKED, "ship": Status.SHIPPED, "deliver": Status.DELIVERED}


            def advance(status, event):
                if event == "cancel":
                    if status in (Status.PLACED, Status.PAID, Status.PACKED):
                        return Status.CANCELLED
                    raise ValueError(f"cannot cancel an order that is {status.value}")
                if status == Status.CANCELLED or ORDER.index(EVENTS[event]) <= ORDER.index(status):
                    raise ValueError(f"cannot {event} an order that is {status.value}")
                return EVENTS[event]


            history = []
            status = Status.PLACED
            for event in ["pay", "ship", "pack", "ship", "cancel", "deliver"]:
                try:
                    status = advance(status, event)
                except ValueError:
                    pass
                history.append(status.value)
            print(history)
        explanation: |
          A table of the seven legal moves, with everything else refused, states the rules once. Allowing cancel from any undelivered state cancels shipped orders; returning the old status for an illegal move hides the mistake from the caller; and allowing any forward jump lets an order be packed before it is paid for.
