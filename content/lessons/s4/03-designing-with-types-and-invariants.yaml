    - question:
        id: work-phone
        type: choice
        system: s2
        prompt: |
          Phone numbers reach a clinic's app from a form, a CSV import and a partner's API, in formats like "98450 12345", "+91-9845012345" and "09845012345". Many functions later send SMS reminders. Which design keeps them correct?
        options:
          - "Each entry point parses the text into a frozen Phone value of exactly ten digits or refuses it; later functions accept only Phone."
          - "Store the text as received and let each SMS function clean it up."
          - "Validate with a function that returns True or False, and pass the original text on."
          - "Strip spaces at each entry point and keep the rest as text."
        answer: 0
        explanation: |
          Parsing at every boundary into one checked type means the SMS functions never see a raw string. Cleaning in each sender repeats the work and lets them disagree; a true-or-false check leaves the original messy text flowing inward; and stripping spaces still leaves "+91-" and the leading zero.
  connections:
    - text: |
        10 impossible rides: of the 16 combinations, only requested, assigned, picked up, completed, cancelled without a driver and cancelled with one can happen. A `RideStatus` enum with those six values removes the other ten for good, along with every `if` that defended against them.

        Parsing at the boundary raises a new question: what happens when the input is bad? `parse_rupees` raised `ValueError`, `advance` refused an illegal move, and someone, somewhere, must decide what the user sees. Designing those failures as carefully as the successes is [[s4.errors-as-part-of-the-design]]. Types and invariants are also the raw material of good public interfaces, [[s4.designing-apis]], and of tests that check invariants on thousands of generated values, [[s6.oracles-and-invariants]].
