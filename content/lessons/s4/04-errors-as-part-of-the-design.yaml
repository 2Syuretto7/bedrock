    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          Out of the puzzle's 10,000 checkouts, about how many fail?
        answer: "585"
        tolerance: "10"
        explanation: |
          All six succeed with probability $0.99^6 \approx 0.9415$, so about $10{,}000 \times 0.0585 \approx 585$ checkouts fail, nearly one in seventeen.
    - question:
        id: work-retry-safe
        type: choice
        system: s2
        prompt: |
          A checkout's call to the payment service times out after the request was sent. The service may or may not have charged the card. What should the checkout do?
        options:
          - "Retry with the same idempotency key, so the service charges at most once."
          - "Retry with a new request; the first one probably failed."
          - "Tell the customer the payment failed and ask them to pay again."
          - "Record the order as paid, since most payments succeed."
        answer: 0
        explanation: |
          A timeout does not say whether the charge happened. Only a retry the service can recognise as the same request is safe; a fresh request or asking the customer to pay again risks charging twice, and assuming success risks never charging at all.
  connections:
    - text: |
        About 585 of 10,000: six steps at 99% each succeed together only $0.99^6 \approx 94.1\%$ of the time. Retrying each step's transient faults twice more turns each 1% into about one in a million, and the checkout's failures fall from hundreds to almost none, as long as every retried step is safe to repeat.

        Every handler in this lesson was tested with something fake: a gateway that played back a script of timeouts, a booking function with a fixed set of taken slots. That was possible only because the code received those collaborators instead of reaching for the real ones, and designing for that is [[s4.dependency-injection-and-testable-code]]. Errors as seen by other teams' code are part of [[s4.designing-apis]]; making repeated requests safe is [[d2.idempotency-and-retries]]; and choosing timeouts and backoff under real load is [[r4.timeouts-retries-and-backoff]].
