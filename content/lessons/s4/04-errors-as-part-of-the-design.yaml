        explanation: |
          `price` caught every exception and returned 0, so a missing item was billed as free. Catching only the `KeyError` and raising `UnknownItem(item)` translates it into the module's own error, naming the item. Raising the class without the item loses the name; catching `UnknownItem`, which a dictionary never raises, lets the raw `KeyError` escape; and returning `None` only moves the crash into the sum.
    - question:
        id: write-retries
        type: code
        mode: write
        system: s2
        prompt: |
          Change `with_retries` so that it calls `call` up to `attempts` times in all, returning the first success, trying again only after a `Timeout`, raising the last `Timeout` when every try times out, and letting any other exception, such as `CardDeclined`, through at once. The program should print `[('charged', 1), ('charged', 2), ('Timeout', 3), ('CardDeclined', 1)]`.
        starter: |
          class Timeout(Exception):
              pass


          class CardDeclined(Exception):
              pass


          class FakeGateway:
              # Plays back a script of outcomes: "ok", "timeout" or "declined".

              def __init__(self, script):
                  self.script = list(script)
                  self.calls = 0

              def charge(self):
                  outcome = self.script[self.calls]
                  self.calls += 1
                  if outcome == "timeout":
                      raise Timeout()
                  if outcome == "declined":
                      raise CardDeclined()
                  return "charged"


          def with_retries(call, attempts):
              return call()


          report = []
          for script in [["ok"], ["timeout", "ok"], ["timeout", "timeout", "timeout", "ok"], ["declined", "ok"]]:
              gateway = FakeGateway(script)
              try:
                  report.append((with_retries(gateway.charge, 3), gateway.calls))
              except (Timeout, CardDeclined) as error:
                  report.append((type(error).__name__, gateway.calls))
          print(report)
        solution: |
          class Timeout(Exception):
              pass


          class CardDeclined(Exception):
              pass


          class FakeGateway:
              # Plays back a script of outcomes: "ok", "timeout" or "declined".

              def __init__(self, script):
                  self.script = list(script)
                  self.calls = 0

              def charge(self):
                  outcome = self.script[self.calls]
                  self.calls += 1
                  if outcome == "timeout":
                      raise Timeout()
                  if outcome == "declined":
                      raise CardDeclined()
                  return "charged"


          def with_retries(call, attempts):
              for attempt in range(attempts):
                  try:
                      return call()
                  except Timeout:
                      if attempt == attempts - 1:
                          raise


          report = []
          for script in [["ok"], ["timeout", "ok"], ["timeout", "timeout", "timeout", "ok"], ["declined", "ok"]]:
              gateway = FakeGateway(script)
              try:
                  report.append((with_retries(gateway.charge, 3), gateway.calls))
              except (Timeout, CardDeclined) as error:
                  report.append((type(error).__name__, gateway.calls))
          print(report)
        tests: |
          import random as _random

          _rng = _random.Random(122)
          for _ in range(60):
              _n = _rng.randint(1, 4)
              _script = [_rng.choice(["timeout", "timeout", "declined", "ok"]) for _k in range(6)]
              _calls, _want = 0, None
              for _k in range(_n):
                  _calls += 1
                  if _script[_k] == "ok":
                      _want = ("charged", _calls)
                      break
                  if _script[_k] == "declined":
                      _want = ("CardDeclined", _calls)
                      break
              if _want is None:
                  _want = ("Timeout", _calls)
              _g = FakeGateway(_script)
              try:
                  _got = (with_retries(_g.charge, _n), _g.calls)
              except (Timeout, CardDeclined) as _e:
                  _got = (type(_e).__name__, _g.calls)
              assert _got == _want, "With the script " + str(_script) + " and " + str(_n) + " attempts, the result and number of calls should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "[('charged', 1), ('charged', 2), ('Timeout', 3), ('CardDeclined', 1)]", "The program should print [('charged', 1), ('charged', 2), ('Timeout', 3), ('CardDeclined', 1)]"
