concept: s4.errors-as-part-of-the-design
minutes: 80
claim: You can sort a failure into a bug, an expected outcome or a transient fault and handle each differently, make the errors a function raises part of its interface with a small hierarchy of exception types, translate low-level errors into ones that mean something at the boundary, catch an error only where something useful can be done, retry only what is transient and safe to repeat, and estimate how failures compound along a chain of calls.
recalls: [s4.designing-with-types-and-invariants]
uses: [s1.exceptions, s4.abstraction-and-interfaces, f4.independence, s1.classes-and-objects]
leads: [s4.dependency-injection-and-testable-code, s4.designing-apis, d2.idempotency-and-retries, r4.timeouts-retries-and-backoff]
starter: |
  # Scratch space. A small hierarchy of errors, and a handler that treats them differently.
  class BookingError(Exception):
      pass


  class SlotTaken(BookingError):
      pass


  def book(time):
      if time == 1000:
          raise SlotTaken(str(time))
      return f"booked {time}"


  for time in [900, 1000]:
      try:
          print(book(time))
      except SlotTaken as error:
          print("taken:", error)
parts:
  recall:
    - text: |
        [[s4.designing-with-types-and-invariants]] refused bad values at the boundary: `parse_rupees` raised `ValueError`, and `advance` refused an illegal move. Refusing is only half of the design. Someone has to decide what the refusal means, who hears about it and what happens next, and the same goes for every card that is declined, every slot already taken and every network call that never answers. Three quick pulls first.
  puzzle:
    - text: |
        A checkout calls six services one after another: stock, prices, coupons, payment, invoicing and notifications. Each succeeds 99% of the time, independently of the others, and a failure anywhere fails the checkout.

        **Out of 10,000 checkouts, about how many fail?**
  intuition:
    - text: |
        Think of the ways a cash withdrawal at an ATM can go wrong. Type the wrong PIN and the machine tells you, and lets you try again. Ask for more than your balance and it says so plainly; nothing is broken, that is simply the answer. If the link to the bank drops, the machine quietly tries again, and if it still cannot get through, it says "Unable to process. Your account has not been debited." And if the cash dispenser jams, the screen goes to "Temporarily out of service" while an alert reaches an engineer, because no customer can fix that.

        Four failures, four different designs, each decided in advance by someone who asked: what kind of failure is this, and who can do something about it? The figure follows an error raised deep inside a checkout as it travels up the chain of calls until some function handles it.
    - figure: error-unwind
      props: { error: declined }
    - text: |
        A declined card passes straight through the retry layer, which has no business retrying it, and is caught by `place_order`, which can tell the customer what to do. A single timeout never gets that far: the retry absorbs it. Three timeouts in a row exhaust the retries, and the customer is told plainly that nothing was charged. A bug passes every layer, because none of them can fix it, and lands in the top-level handler, which logs it for an engineer and shows a polite generic message.
  derivation:
    - text: |
        **Three kinds of failure.** Most failures fall into one of three kinds, and each wants a different design.

        - **Bugs**: a `KeyError` from a misspelt key, `None` where a value was expected, an index off by one. The program itself is wrong. Do not catch these near where they happen; let them travel to a top-level handler that records the full traceback, and then fix the code.
        - **Expected outcomes**: a declined card, a slot already taken, input that does not parse. Nothing is broken; this is one of the answers the operation can give. Give each its own exception type, or a result value, and let the caller choose what to do.
        - **Transient faults**: a timeout, a dropped connection, a service briefly overloaded. Trying again a little later may well succeed, so retry a few times, then report.
    - question:
        id: derivation-kinds
        type: choice
        system: s2
        prompt: |
          A delivery app calls a maps service to estimate travel time. Which failure should be retried automatically?
        options:
          - "The maps service did not answer within two seconds."
          - "The address the customer typed does not exist."
          - "The code passed latitude and longitude in the wrong order."
          - "The customer's location is outside the delivery area."
        answer: 0
        explanation: |
          Only the timeout is transient; another try may succeed. A nonexistent address and an out-of-area location are expected outcomes the customer must hear about, and swapped coordinates are a bug that retrying will repeat forever.
    - text: |
        **Errors are part of the interface.** Which errors a function can raise, and what each means, belong to its promise, just like its result, as in [[s4.abstraction-and-interfaces]]. In Python, from [[s1.exceptions]], define a small hierarchy for a module: `BookingError(Exception)`, with `SlotTaken(BookingError)` and `ClinicClosed(BookingError)` beneath it. A caller who cares about one case catches that subclass; a caller who only needs to know that booking failed catches the base class.

        **Translate at the boundary.** Inside a module, a missing menu item shows up as a `KeyError` from a dictionary. Outside, that word means nothing, and worse, it looks exactly like a bug. Catch the low-level error where it happens and raise the module's own: `raise UnknownItem(item) from None`, or `from error` to keep the original attached for debugging. What must never happen is `except Exception: return 0`. Catching everything and returning a harmless-looking value turns every bug in that block into a silently wrong answer: a bill that is ₹60 short, with no trace of why.
    - question:
        id: order-handlers
        type: order
        system: s2
        prompt: |
          A request handler catches `SlotTaken`, its base class `BookingError` and any other `Exception`. Python tries `except` clauses from top to bottom. Put the clauses in the order that lets each one be reached.
        steps:
          - "except SlotTaken"
          - "except BookingError"
          - "except Exception"
        explanation: |
          The first matching clause wins, and a subclass matches its base class's clause. Putting `BookingError` first would catch every `SlotTaken` and the specific clause would never run.
    - text: |
        **Handle where you can act.** Catch an error only where something useful can be done with it: try again, choose another path, or tell a person. Everywhere else, let it travel. When an exception is raised, Python abandons the current function and each caller in turn until it finds a matching `except`; this is called **unwinding** the stack. One handler at the very top of each request catches whatever is left, logs it with its traceback and an id, and shows the user a short message. The user should never see a traceback; the engineer should never be without one.

        **Retries.** Retry only transient faults, a fixed number of times, waiting longer between tries, an approach called exponential backoff, so that thousands of clients do not hammer a struggling service in step. And retry only what is safe to repeat. Asking for a price twice is harmless; charging a card twice is not, unless the payment service recognises the second request as a repeat of the first, which is the idea of an idempotency key in [[s4.designing-apis]]. If each try fails independently with probability $p$, as in [[f4.independence]], then $n$ tries all fail with probability $p^n$: three tries turn a 1% failure into one in a million.
    - question:
        id: derivation-retries
        type: numeric
        system: s2
        prompt: |
          A call fails 1% of the time, independently on each try. With up to 3 tries, how many of 10,00,000 calls fail every try?
        answer: "1"
        explanation: |
          $0.01^3 = 0.000001$, and $10{,}00{,}000 \times 0.000001 = 1$.
    - text: |
        **Failures compound.** A request that needs several steps to succeed succeeds only if all of them do. With independent steps each succeeding with probability $q$, a chain of $n$ steps succeeds with probability $q^n$, which shrinks faster than intuition expects: ten steps at 99.9% each still fail about one request in a hundred. This is why reliable systems retry transient faults at each step, and why removing a step can matter more than polishing one.

        **Messages are part of the design too.** A good message says what happened, why if it is known, and what to do next: "That slot was just taken. Please choose another." A message for the log says more: which request, which user, which ids, and the traceback. Keep the two apart. Raw error text and tracebacks shown to users confuse them and can reveal details about the system that attackers find useful.
  formal:
    - text: |
        **Kinds of failure.** Bugs: let them reach a top-level handler that logs them, then fix the code. Expected outcomes: specific exception types or result values for the caller to handle. Transient faults: bounded retries with backoff, then report.

        **Exception hierarchy.** A base class per module, `class BookingError(Exception)`, with a subclass per case. `except` clauses are tried in order, so specific ones come first.

        **Translation.** Catch low-level errors at a module boundary and raise the module's own, with `raise New(...) from error` or `from None`. Never catch everything and return a default.

        **Unwinding.** An exception leaves each function in turn until a matching `except` is found.

        **Retries.** Only for transient faults on operations safe to repeat; $n$ independent tries that each fail with probability $p$ all fail with probability $p^n$.

        **Compounding.** $n$ independent steps each succeeding with probability $q$ all succeed with probability $q^n$.
  drill:
    - text: Seconds each. For every failure, ask what kind it is and who can act on it.
    - question:
