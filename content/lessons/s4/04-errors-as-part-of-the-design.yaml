    - question:
        id: write-handle
        type: code
        mode: write
        system: s2
        prompt: |
          Change `handle` so that it returns `(200, result)` when booking succeeds, `(409, "that slot was just taken; please choose another")` for `SlotTaken`, `(422, "cannot book: " + message)` for any other `BookingError`, and `(500, "something went wrong")` for any other exception, appending `repr` of that exception to `log`. The program should print `[(200, 'booked monday 900'), (409, 'that slot was just taken; please choose another'), (422, 'cannot book: the clinic is closed on sunday'), (500, 'something went wrong')] 1`.
        starter: |
          class BookingError(Exception):
              pass


          class SlotTaken(BookingError):
              pass


          class ClinicClosed(BookingError):
              pass


          TAKEN = {1000, 1130}
          log = []


          def book(day, time):
              if day == "sunday":
                  raise ClinicClosed("the clinic is closed on " + day)
              if time in TAKEN:
                  raise SlotTaken(str(time))
              if time % 100 >= 60:
                  raise ValueError("not a time: " + str(time))
              TAKEN.add(time)
              return f"booked {day} {time}"


          def handle(day, time):
              return (200, book(day, time))


          print([handle(day, time) for day, time in [("monday", 900), ("monday", 1000), ("sunday", 900), ("monday", 975)]], len(log))
        solution: |
          class BookingError(Exception):
              pass


          class SlotTaken(BookingError):
              pass


          class ClinicClosed(BookingError):
              pass


          TAKEN = {1000, 1130}
          log = []


          def book(day, time):
              if day == "sunday":
                  raise ClinicClosed("the clinic is closed on " + day)
              if time in TAKEN:
                  raise SlotTaken(str(time))
              if time % 100 >= 60:
                  raise ValueError("not a time: " + str(time))
              TAKEN.add(time)
              return f"booked {day} {time}"


          def handle(day, time):
              try:
                  return (200, book(day, time))
              except SlotTaken:
                  return (409, "that slot was just taken; please choose another")
              except BookingError as error:
                  return (422, "cannot book: " + str(error))
              except Exception as error:
                  log.append(repr(error))
                  return (500, "something went wrong")


          print([handle(day, time) for day, time in [("monday", 900), ("monday", 1000), ("sunday", 900), ("monday", 975)]], len(log))
        tests: |
          import random as _random

          _rng = _random.Random(123)
          for _ in range(60):
