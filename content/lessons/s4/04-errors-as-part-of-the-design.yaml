        type: choice
        system: s1
        prompt: |
          `order["custmer"]` raises `KeyError`. What kind of failure is it?
        options:
          - "A bug"
          - "An expected outcome"
          - "A transient fault"
          - "Not a failure"
        answer: 0
        explanation: The key is misspelt; no retry or message to the user will fix the code.
    - question:
        id: drill-swallow
        type: choice
        system: s1
        prompt: |
          What is wrong with `except Exception: return 0` around a price lookup?
        options:
          - "Every bug inside becomes a silently wrong price."
          - "It is slower than a specific except."
          - "Python does not allow catching Exception."
          - "Nothing; returning 0 is a safe default."
        answer: 0
        explanation: Catching everything hides misspellings and other bugs behind a plausible answer.
    - question:
        id: drill-chain
        type: numeric
        system: s1
        prompt: |
          Two independent steps each succeed 90% of the time. In what percentage of requests do both succeed?
        answer: "81"
        explanation: $0.9 \times 0.9 = 0.81$.
    - question:
        id: drill-tries
        type: numeric
        system: s1
        prompt: |
          A call fails 10% of the time, independently on each try. With up to 2 tries, in what percentage of calls do both tries fail?
        answer: "1"
        explanation: $0.1 \times 0.1 = 0.01$.
    - question:
        id: predict-order
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          class BookingError(Exception):
              pass


          class SlotTaken(BookingError):
              pass


          try:
              raise SlotTaken("1000")
          except BookingError:
              print("booking error")
          except SlotTaken:
              print("slot taken")
        output: "booking error"
        explanation: The first clause matches, because a `SlotTaken` is a `BookingError`; the second clause can never run.
    - question:
        id: predict-unwind
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          steps = []


          def inner():
              steps.append("inner")
              raise ValueError("bad")


          def middle():
              inner()
              steps.append("middle")


          try:
              middle()
          except ValueError:
              steps.append("caught")
          print(steps)
        output: "['inner', 'caught']"
        explanation: The exception leaves `inner` and then `middle` before its next line runs, and is caught at the top.
  work:
    - text: Slower now. Each problem is about one kind of failure and where it belongs.
    - question:
        id: fix-swallowed
        type: code
        mode: find-bug
        system: s2
        prompt: |
          An order with an item not on the menu should be refused with `UnknownItem` naming that item, never billed short. The program should print `[10000, 'unknown: pongal', 3500]`. It prints `[10000, 6000, 3500]`. Find the fault and fix it.
        starter: |
          MENU = {"dosa": 6000, "idli": 4000, "vada": 3500}  # prices in paise


          class UnknownItem(Exception):
              pass


          def price(item):
              try:
                  return MENU[item]
              except Exception:
                  return 0


          def bill(items):
              return sum(price(item) for item in items)


          results = []
          for order in [["dosa", "idli"], ["dosa", "pongal"], ["vada"]]:
              try:
                  results.append(bill(order))
              except UnknownItem as error:
                  results.append(f"unknown: {error}")
          print(results)
        solution: |
          MENU = {"dosa": 6000, "idli": 4000, "vada": 3500}  # prices in paise


          class UnknownItem(Exception):
              pass


          def price(item):
              try:
                  return MENU[item]
              except KeyError:
                  raise UnknownItem(item) from None


          def bill(items):
              return sum(price(item) for item in items)


          results = []
          for order in [["dosa", "idli"], ["dosa", "pongal"], ["vada"]]:
              try:
                  results.append(bill(order))
              except UnknownItem as error:
                  results.append(f"unknown: {error}")
          print(results)
        tests: |
          import random as _random

          _rng = _random.Random(121)
          for _ in range(40):
              _order = [_rng.choice(["dosa", "idli", "vada", "dosa", "idli", "pongal", "upma"]) for _k in range(_rng.randint(1, 4))]
              _bad = [_i for _i in _order if _i not in MENU]
              try:
                  _got = bill(_order)
              except UnknownItem as _e:
                  assert _bad, "bill(" + str(_order) + ") should return " + str(sum(MENU[_i] for _i in _order)) + ", not raise UnknownItem"
                  assert str(_e) == _bad[0], "bill(" + str(_order) + ") should raise UnknownItem naming " + repr(_bad[0]) + ", not " + repr(str(_e))
                  continue
              except Exception as _e:
                  assert False, "bill(" + str(_order) + ") should raise UnknownItem for " + repr(_bad[0] if _bad else "") + ", not " + type(_e).__name__
              assert not _bad, "bill(" + str(_order) + ") should raise UnknownItem for " + repr(_bad[0]) + ", not return " + repr(_got)
              assert _got == sum(MENU[_i] for _i in _order), "bill(" + str(_order) + ") should be " + str(sum(MENU[_i] for _i in _order)) + ", not " + repr(_got)
          assert output.strip() == "[10000, 'unknown: pongal', 3500]", "The program should print [10000, 'unknown: pongal', 3500]"
