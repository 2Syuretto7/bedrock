        solution: |
          class SlotBook:
              # The interface: book(time) marks a time taken; free() returns the
              # free times, such as 1430 for 2:30 pm, as a list in no particular order.

              def __init__(self, times):
                  self._free = set(times)

              def book(self, time):
                  self._free.remove(time)

              def free(self):
                  return list(self._free)


          def earliest(book):
              return min(book.free())


          book = SlotBook([1700, 900, 1100, 1400, 1000])
          book.book(900)
          print(earliest(book))
        tests: |
          import random as _random


          class _ListBook:
              def __init__(self, times):
                  self._slots = [[_t, False] for _t in times]

              def book(self, time):
                  for _slot in self._slots:
                      if _slot[0] == time:
                          _slot[1] = True

              def free(self):
                  _out = [_h for _h, _taken in self._slots if not _taken]
                  _random.shuffle(_out)
                  return _out


          _rng = _random.Random(91)
          for _ in range(30):
              _hours = _rng.sample([_h * 100 + _m for _h in range(8, 21) for _m in (0, 30)], _rng.randint(2, 8))
              _taken = _rng.sample(_hours, _rng.randint(0, len(_hours) - 1))
              for _kind in (SlotBook, _ListBook):
                  _b = _kind(_hours)
                  for _h in _taken:
                      _b.book(_h)
                  _want = min(_h for _h in _hours if _h not in _taken)
                  _got = earliest(_b)
                  assert _got == _want, "With the times " + str(_hours) + " and " + str(_taken) + " booked, earliest should return " + str(_want) + ", not " + str(_got) + " (using " + _kind.__name__.strip("_") + ")"
          assert output.strip() == "1000", "The program should print 1000"
        wrong:
          - |
