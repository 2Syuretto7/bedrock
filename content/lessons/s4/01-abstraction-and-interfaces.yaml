        solution: |
          from typing import Protocol


          class Ledger(Protocol):
              def customers(self) -> list[str]: ...

              def balance(self, name: str) -> int: ...


          class NotebookLedger:
              # One entry per purchase on credit (positive) or payment (negative), in rupees.

              def __init__(self):
                  self._entries = []

              def record(self, name, amount):
                  self._entries.append((name, amount))

              def customers(self):
                  return sorted({name for name, amount in self._entries})

              def balance(self, name):
                  return sum(amount for who, amount in self._entries if who == name)


          def total_owed(ledger: Ledger) -> int:
              return sum(max(0, ledger.balance(name)) for name in ledger.customers())


          book = NotebookLedger()
          for name, amount in [("asha", 300), ("bilal", 120), ("asha", -200), ("chitra", 50), ("bilal", -170), ("asha", 40)]:
              book.record(name, amount)
          print(total_owed(book))
        tests: |
          import random as _random


          class _CounterLedger:
              def __init__(self, balances):
                  self._owing = dict(balances)

              def customers(self):
                  return list(self._owing)

              def balance(self, name):
                  return self._owing[name]


          _rng = _random.Random(92)
          for _ in range(30):
              _entries = [(_rng.choice(["asha", "bilal", "chitra", "dev"]), _rng.choice([1, 1, -1]) * _rng.randint(10, 300)) for _k in range(_rng.randint(1, 10))]
              _sums = {}
              for _n, _a in _entries:
                  _sums[_n] = _sums.get(_n, 0) + _a
              _want = sum(_v for _v in _sums.values() if _v > 0)
              _nb = NotebookLedger()
              for _n, _a in _entries:
                  _nb.record(_n, _a)
              for _led, _kind in [(_nb, "a notebook ledger"), (_CounterLedger(_sums), "a ledger that keeps only balances")]:
                  _got = total_owed(_led)
                  assert _got == _want, "For the balances " + str(_sums) + " in " + _kind + ", total_owed should be " + str(_want) + ", not " + str(_got)
          assert output.strip() == "190", "The program should print 190"
