    - question:
        id: work-promise
        type: choice
        system: s2
        prompt: |
          A route planner's `plan` method is documented as "returns the shortest route through the stops". The team wants to replace its slow exact algorithm with a fast greedy one behind the same method. What should they do?
        options:
          - "Change the promise to a route through every stop once, then check each caller that relied on shortest."
          - "Swap the algorithm; the signature is unchanged, so callers are safe."
          - "Keep the docstring and add a comment that the route is nearly shortest."
          - "Rename the method so nobody notices the change."
        answer: 0
        explanation: |
          The promise, not the signature, is the interface. The greedy planner cannot keep "shortest", so the promise must shrink, and callers that depended on it must be found before the swap. Renaming breaks every caller without fixing any.
  connections:
    - text: |
        8 new pieces: the seventh provider needs code in each of the 8 places, because the places and providers were wired directly, $8 \times 6 = 48$ pieces in all. With one `PaymentProvider` interface, the app would have had $8 + 6 = 14$ pieces, and the seventh provider would cost one adapter.

        An interface is one boundary. A real program has many, between modules that each hide decisions of their own, and the question becomes how to draw them so that a change in one place touches as few others as possible, which is [[s4.modules-coupling-and-cohesion]]. Swapping implementations behind an interface is also what makes code testable, since a test can supply a fake, which is [[s4.dependency-injection-and-testable-code]]. And when the callers are other teams or other companies, the interface becomes an API, with promises that are very hard to take back: [[s4.designing-apis]].
