            print(earliest(book))
          - |
            class SlotBook:
                # The interface: book(time) marks a time taken; free() returns the
                # free times, such as 1430 for 2:30 pm, as a list in no particular order.

                def __init__(self, times):
                    self._free = set(times)

                def book(self, time):
                    self._free.remove(time)

                def free(self):
                    return list(self._free)


            def earliest(book):
                return min(book._free)


            book = SlotBook([1700, 900, 1100, 1400, 1000])
            book.book(900)
            print(earliest(book))
          - |
            class SlotBook:
                # The interface: book(time) marks a time taken; free() returns the
                # free times, such as 1430 for 2:30 pm, as a list in no particular order.

                def __init__(self, times):
                    self._free = set(times)

                def book(self, time):
                    self._free.remove(time)

                def free(self):
                    return list(self._free)


            def earliest(book):
                slots = book.free()
                slots.sort()
                return slots[len(slots) - 1]


            book = SlotBook([1700, 900, 1100, 1400, 1000])
            book.book(900)
            print(earliest(book))
        explanation: |
          `free()` promises the free times in no particular order, so its first element is whatever the set's hashing put first. Asking for `min(book.free())` relies only on the promise. Taking the last element relies on order just as much; reading `book._free` works only for this one implementation; and sorting then taking the last element finds the latest time, not the earliest.
