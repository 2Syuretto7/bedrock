            import itertools


            def dist(a, b):
                return abs(a[0] - b[0]) + abs(a[1] - b[1])


            def length(depot, route):
                stops = [depot] + route
                return sum(dist(stops[i], stops[i + 1]) for i in range(len(route)))


            class ExactPlanner:
                # The interface: plan(depot, stops) returns every stop exactly once,
                # in the order to visit them, starting from the depot.

                def plan(self, depot, stops):
                    return list(min(itertools.permutations(stops), key=lambda r: length(depot, list(r))))


            class GreedyPlanner:
                def plan(self, depot, stops):
                    route = []
                    here = depot
                    left = stops
                    while left:
                        nearest = min(left, key=lambda s: dist(here, s))
                        route.append(nearest)
                        left.remove(nearest)
                        here = nearest
                    return route


            depot = (0, 0)
            stops = [(5, 1), (1, 1), (6, 4), (2, 3), (0, 5)]
            greedy = GreedyPlanner().plan(depot, stops)
            print(greedy, length(depot, greedy), length(depot, ExactPlanner().plan(depot, stops)))
        explanation: |
          The greedy route starts at the depot, takes the nearest stop not yet visited from wherever it is, and works on a copy of the stops. Sorting by distance from the depot is not the nearest stop from where you are; putting the depot in the route breaks the interface's promise of stops only; and removing from the caller's own list empties it, which the exact planner never did.
