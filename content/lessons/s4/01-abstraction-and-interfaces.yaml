          - |
            from typing import Protocol


            class Ledger(Protocol):
                def customers(self) -> list[str]: ...

                def balance(self, name: str) -> int: ...


            class NotebookLedger:
                # One entry per purchase on credit (positive) or payment (negative), in rupees.

                def __init__(self):
                    self._entries = []

                def record(self, name, amount):
                    self._entries.append((name, amount))

                def customers(self):
                    return sorted({name for name, amount in self._entries})

                def balance(self, name):
                    return sum(amount for who, amount in self._entries if who == name)


            def total_owed(ledger: Ledger) -> int:
                balances = {}
                for name, amount in ledger._entries:
                    balances[name] = balances.get(name, 0) + amount
                return sum(max(0, b) for b in balances.values())


            book = NotebookLedger()
            for name, amount in [("asha", 300), ("bilal", 120), ("asha", -200), ("chitra", 50), ("bilal", -170), ("asha", 40)]:
                book.record(name, amount)
            print(total_owed(book))
        explanation: |
          Through the interface, each customer's balance is asked for by name and only positive balances are added. Adding every balance lets money the shop owes Bilal cancel what Asha owes; clamping only the total does the same; and summing `_entries` yourself is right for the notebook but fails on any ledger that stores balances differently.
    - question:
        id: write-greedy-planner
        type: code
        mode: write
        system: s2
        prompt: |
          Change `GreedyPlanner.plan` so that it honours the same interface as `ExactPlanner`, returning every stop exactly once without the depot and without changing the list it is given, by always moving to the nearest stop not yet visited, starting from the depot. The program should print `[(1, 1), (2, 3), (0, 5), (6, 4), (5, 1)] 20 19`.
        starter: |
          import itertools


          def dist(a, b):
              return abs(a[0] - b[0]) + abs(a[1] - b[1])


          def length(depot, route):
              stops = [depot] + route
              return sum(dist(stops[i], stops[i + 1]) for i in range(len(route)))


          class ExactPlanner:
              # The interface: plan(depot, stops) returns every stop exactly once,
              # in the order to visit them, starting from the depot.

              def plan(self, depot, stops):
                  return list(min(itertools.permutations(stops), key=lambda r: length(depot, list(r))))


          class GreedyPlanner:
              def plan(self, depot, stops):
                  return list(stops)


          depot = (0, 0)
          stops = [(5, 1), (1, 1), (6, 4), (2, 3), (0, 5)]
          greedy = GreedyPlanner().plan(depot, stops)
          print(greedy, length(depot, greedy), length(depot, ExactPlanner().plan(depot, stops)))
        solution: |
          import itertools


          def dist(a, b):
              return abs(a[0] - b[0]) + abs(a[1] - b[1])


          def length(depot, route):
              stops = [depot] + route
              return sum(dist(stops[i], stops[i + 1]) for i in range(len(route)))


          class ExactPlanner:
              # The interface: plan(depot, stops) returns every stop exactly once,
              # in the order to visit them, starting from the depot.

              def plan(self, depot, stops):
                  return list(min(itertools.permutations(stops), key=lambda r: length(depot, list(r))))


          class GreedyPlanner:
              def plan(self, depot, stops):
                  route = []
                  here = depot
                  left = list(stops)
                  while left:
                      nearest = min(left, key=lambda s: dist(here, s))
                      route.append(nearest)
                      left.remove(nearest)
                      here = nearest
                  return route


          depot = (0, 0)
