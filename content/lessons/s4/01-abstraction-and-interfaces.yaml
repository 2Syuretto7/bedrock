concept: s4.abstraction-and-interfaces
minutes: 80
claim: You can say what an interface promises and what it hides, write callers that rely only on the promise, describe an interface in Python with a Protocol, recognise when a caller depends on behaviour nobody promised, judge whether a replacement implementation honours the whole promise, and explain why an interface turns many-to-many dependencies into many-plus-many.
recalls: [q1.schema-evolution-and-compatibility, s3.intractability-p-np-and-heuristics]
uses: [s1.classes-and-objects, s1.type-hints-and-dataclasses, s2.hash-tables]
leads: [s4.modules-coupling-and-cohesion, s4.dependency-injection-and-testable-code, s4.designing-apis]
bridges:
  q1.schema-evolution-and-compatibility: The data modelling cluster ended with records whose shape changes while old programs still read them. A change was safe when every reader still found what it relied on. Adding an optional field was fine, renaming one broke old readers, and code that rewrote a record had to keep fields it did not understand. The same thinking applies to code. A function's name, parameters, return value and behaviour form a shape that other code relies on, and changing that shape follows the same rules. Adding is usually safe, renaming or removing breaks callers, and a breaking change is made safely by adding the new form, moving callers over, then removing the old.
starter: |
  # Scratch space. Two implementations behind one interface.
  from typing import Protocol


  class Provider(Protocol):
      def charge(self, rupees: int) -> str: ...


  class Upi:
      def charge(self, rupees):
          return f"UPI collected {rupees}"


  class Card:
      def charge(self, rupees):
          return f"card charged {rupees + 2}, with a fee of 2"


  def checkout(provider: Provider, total: int) -> str:
      return provider.charge(total)


  print([checkout(p, 450) for p in [Upi(), Card()]])
parts:
  recall:
    - text: |
        [[s3.intractability-p-np-and-heuristics]] met problems where the exact answer costs too much, and replaced the exact solver with a heuristic that callers could use in the same way. [[q1.schema-evolution-and-compatibility]] changed the shape of data while old programs kept reading it. Both worked because something stayed fixed while what stood behind it changed. In code, that fixed thing is an interface, and this cluster is about drawing such boundaries well. Three quick pulls first.
  puzzle:
    - text: |
        A shopping app takes payments in 8 places: checkout, refunds, wallet top-ups, subscriptions, invoices, payouts, tips and gift cards. It supports 6 payment providers. Over the years, each of the 8 places grew its own code for each provider, written straight against that provider's library.

        The business signs up a seventh provider.

        **How many new pieces of provider-specific code must be written?**
  intuition:
    - text: |
        Every room in an Indian house has the same wall socket. A fan, a phone charger and a mixer-grinder all work in it, and none of them knows whether the electricity came from a coal plant, a dam or the solar panels on the roof. The electricity board can change its sources without anyone rewiring a fan, and a new appliance needs only the right plug, not a conversation with the power station. When a foreign laptop's plug does not fit, a small adapter fixes it at the edge, and nothing else changes.

        The socket is an **interface**: a fixed promise between two sides, two pins carrying 230 volts, that lets each side change freely behind it. The figure wires the places in an app that take payments to payment providers, first directly, then through one interface.
    - figure: interface-swap
      props: { callers: 4, providers: 3, mode: direct }
    - text: |
        Wired directly, every place knows every provider, so the pieces of code multiply: places times providers. Through an interface, each place knows only the interface, and each provider is wrapped once in an adapter that speaks it, so the pieces add: places plus providers. Raise both steppers and watch the direct wiring turn into a thicket while the interface version grows by one line at a time. The multiplication is the cost of not having a boundary.
  derivation:
    - text: |
        **An interface is a promise.** It says what callers may rely on: the names of the operations, their parameters, their results, and their behaviour, including what each needs before it is called, what it guarantees afterwards, which errors it raises and roughly how long it takes. Everything else is **implementation**, and the whole point is that the implementation may change without callers noticing. A good interface states its promise in its documentation, because the code alone shows what happens today, not what is promised for tomorrow.

        In Python, an interface is usually just a set of methods with agreed meanings. Any object with those methods can be used, which is called duck typing. A `Protocol` from the `typing` module writes the set down, so that readers and type checkers can see it:

        ```python
        class Ledger(Protocol):
            def customers(self) -> list[str]: ...
            def balance(self, name: str) -> int: ...
        ```

        A class need not mention `Ledger` to satisfy it; having the two methods with those meanings is enough. The `...` bodies say that the Protocol describes the methods and does not implement them. An abstract base class from the `abc` module is the other common way, where implementations inherit from the interface explicitly.
    - question:
        id: derivation-promise
        type: choice
        system: s2
        prompt: |
          A `Ledger` documents `balance(name)` as "the rupees the customer owes; negative when the shop owes them". Which of these may a caller rely on?
        options:
          - "That a customer who has paid more than they bought has a negative balance"
          - "That balances are stored in a list called _entries"
          - "That balance(name) adds up the entries one by one"
          - "That customers() returns names in alphabetical order"
        answer: 0
        explanation: |
          Only the documented meaning of the result is promised. How the ledger stores or computes balances is implementation, and the order of `customers()` was never promised, even if one implementation happens to sort.
    - text: |
        **Hiding a decision.** David Parnas argued in 1972 that a program should be split along the decisions most likely to change, each hidden behind an interface. How a clinic's free appointment slots are stored, in a set, a sorted list or a database table, is such a decision. Callers that use only `book(time)` and `free()` never learn the answer, so it can change. Python has no enforced privacy; a leading underscore, as in `_free`, marks an attribute private by agreement. A caller that reaches past the interface into `_free` has quietly tied itself to today's implementation, and breaks the day it changes.

        **What nobody promised.** Hyrum Wright, an engineer at Google, observed that with enough callers, every observable behaviour of an interface will be depended on by somebody, whether it was promised or not. A `free()` built on a set returns times in an order that comes from hashing, from [[s2.hash-tables]]; it often looks sorted for small numbers and is not. A caller that takes `free()[0]` as the earliest slot works in testing, works for months, and fails when the times or the implementation change. The defence on the caller's side is to rely only on the promise: if you need the earliest, ask for `min(book.free())`. The defence on the interface's side is to state the promise plainly, and sometimes to make unpromised behaviour vary on purpose; the Go language randomises the iteration order of its hash maps for exactly this reason.
    - question:
        id: derivation-pieces
        type: numeric
        system: s2
        prompt: |
          An app reads and writes files in 12 places and must support 5 storage services. With one interface and an adapter per service, how many pieces of code connect them?
        answer: "17"
        explanation: |
          $12 + 5 = 17$: each place uses the interface, and each service has one adapter. Wired directly, it would be $12 \times 5 = 60$.
    - text: |
        **Deep and shallow.** John Ousterhout calls a module **deep** when its interface is small compared with what it hides. Files are the classic example: `open`, `read`, `write` and `close` hide disks, caches, file systems and device drivers. A **shallow** module has an interface nearly as complicated as its implementation, such as a class whose methods each forward to one line of someone else's code; it adds names to learn and hides nothing. Shape an interface by what callers need to say, "charge this customer ₹450", not by how the implementation works, "open a session, get a token, post to an endpoint".

        **Honouring the whole promise.** An implementation can replace another only if it keeps every part of the promise, a rule known as the Liskov substitution principle: a replacement may accept more and guarantee more, never less. An exact route planner and a greedy one, from [[s3.intractability-p-np-and-heuristics]], can share the method `plan(depot, stops)`. If the interface promises "every stop exactly once, starting from the depot", both honour it. If it promises "the shortest route", the greedy planner breaks the promise, however similar its signature, and every caller that relied on shortest is wrong. An interface should promise only what every implementation will deliver.
    - question:
        id: derivation-substitute
        type: choice
        system: s2
        prompt: |
          A cache's `get(key)` is documented to return None for a key it does not hold. Which replacement implementation honours the interface?
        options:
          - "One that also returns None for keys that have expired, and is faster"
          - "One that raises KeyError for a missing key"
          - "One that returns an empty string for a missing key"
          - "One that returns None for a missing key but needs a second argument"
        answer: 0
        explanation: |
          Expiry is still "a key it does not hold", so callers see what was promised. Raising, returning a different value or demanding a new argument breaks callers that relied on the promise.
    - text: |
        **Changing an interface.** Interfaces change too, and the rules of [[q1.schema-evolution-and-compatibility]] carry over. Adding a method, or a parameter with a default, is safe. Renaming or removing breaks callers. A breaking change is made in steps: add the new form, move callers over, mark the old form deprecated, and remove it only when nothing uses it. The more callers an interface has, the more these steps cost, which is the best argument for keeping interfaces small and their promises modest.
  formal:
    - text: |
        **Interface.** The operations a component offers and the promise attached to each: parameters, results, behaviour, preconditions, guarantees, errors and cost. **Implementation**: everything behind it, free to change.

        **Protocol.** A `typing.Protocol` class lists the methods an object must have; any object with matching methods satisfies it, without inheriting from it.

        **Information hiding.** Split a program along decisions likely to change, and hide each behind an interface.

        **Hyrum's law.** With enough callers, every observable behaviour is depended on by someone. Callers should rely only on what is promised.

        **Substitution.** A replacement implementation must keep every promise of the interface; it may require less and guarantee more.

        **Wiring cost.** $n$ callers and $m$ implementations need $n \times m$ connections directly and $n + m$ through one interface.
