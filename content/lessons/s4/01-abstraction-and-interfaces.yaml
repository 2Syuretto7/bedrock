    - question:
        id: fix-earliest
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `earliest` should return the earliest free time in any slot book that offers `book(time)` and `free()` as documented. The program should print `1000`. It prints `1700`. Find the fault and fix it.
        starter: |
          class SlotBook:
              # The interface: book(time) marks a time taken; free() returns the
              # free times, such as 1430 for 2:30 pm, as a list in no particular order.

              def __init__(self, times):
                  self._free = set(times)

              def book(self, time):
