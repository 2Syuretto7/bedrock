    - question:
        id: work-when
        type: choice
        system: s2
        prompt: |
          A clinic app sends appointment confirmations by SMS only. A product manager says WhatsApp "might come later". What should the team do now?
        options:
          - "Call one plain send function from one place, and introduce an interface and a second adapter when WhatsApp is actually needed."
          - "Build a sender interface, a factory and an abstract base class now, so WhatsApp is easy later."
          - "Copy the SMS code into every place that confirms an appointment."
          - "Publish a confirmation event with a single SMS subscriber."
        answer: 0
        explanation: |
          Keeping sending behind one plain function makes the later change small, without paying for indirection that may never be used. Copying the code scatters it, and an interface, factory or event with a single user is ceremony for now.
  connections:
    - text: |
        114 definitions: 38 of the 40 functions never needed swapping, and each carried an interface, a factory and a separate implementation for nothing. Had the team waited, the 2 functions that did change could each have gained an interface in an afternoon, at the moment the second implementation appeared and its real shape was known.

        Waiting is safe only if changing code later is safe. Introducing a strategy table, extracting an adapter, or replacing a chain of conditions with a lookup are all changes to the structure of code that must not change what it does, made in small steps under tests, which is [[s4.refactoring]]. Patterns also shape the interfaces other teams call, where adding a strategy or an event is a promise that is hard to withdraw: [[s4.designing-apis]].
