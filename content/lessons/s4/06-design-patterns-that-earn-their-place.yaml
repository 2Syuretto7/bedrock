            print(sender.send("98450 12345", "Your tiffin is on its way"), sender.send("1234", "test"), client.delivered)
          - |
            class LegacySms:
                # A provider's library, which we cannot change. It wants the number as
                # "+91" followed by ten digits, and answers {"status": "OK"} or {"status": "FAIL", ...}.

                def __init__(self):
                    self.delivered = []

                def send_message(self, number, body):
                    if not (number.startswith("+91") and len(number) == 13 and number[1:].isdigit()):
                        return {"status": "FAIL", "reason": "bad number " + number}
                    self.delivered.append((number, body))
                    return {"status": "OK"}


            class LegacyAdapter:
                # Our interface: send(phone, text) -> True if delivered, False if not,
                # where phone is ten digits written as "98450 12345".

                def __init__(self, client):
                    self.client = client

                def send(self, phone, text):
                    number = "+91" + phone.replace(" ", "")
                    return self.client.send_message(number, text)


            client = LegacySms()
            sender = LegacyAdapter(client)
            print(sender.send("98450 12345", "Your tiffin is on its way"), sender.send("1234", "test"), client.delivered)
        explanation: |
          The adapter translates in both directions: the number on the way in, the status on the way out. Leaving the space in makes the library refuse every number; testing only that a dictionary came back reports refusals as success; and returning the dictionary itself hands callers the library's format instead of ours.
    - question:
        id: write-fee-table
        type: code
        mode: write
        system: s2
        prompt: |
          Replace the if-elif chain with a strategy table: write each plan as a function of `(km, total)`, add a `free_over_500` plan that charges nothing for orders of ₹500 or more and the distance fee otherwise, keep the functions in a dictionary named `PLANS`, and make `fee` look the plan up there and raise `ValueError` for an unknown plan. The program should print `[30, 42, 63, 0]`.
        starter: |
          def fee(plan, km, total):
              # Delivery fee in rupees for an order of `total` rupees delivered `km` away.
              if plan == "flat":
                  return 30
              elif plan == "distance":
                  return 10 + 8 * km
              elif plan == "busy":
                  return (10 + 8 * km) * 3 // 2
              else:
                  return 0


          print([fee(plan, 4, 650) for plan in ["flat", "distance", "busy", "free_over_500"]])
        solution: |
          def flat(km, total):
              return 30


          def by_distance(km, total):
              return 10 + 8 * km


          def busy(km, total):
              return by_distance(km, total) * 3 // 2


          def free_over_500(km, total):
              return 0 if total >= 500 else by_distance(km, total)


          PLANS = {"flat": flat, "distance": by_distance, "busy": busy, "free_over_500": free_over_500}


          def fee(plan, km, total):
              # Delivery fee in rupees for an order of `total` rupees delivered `km` away.
              if plan not in PLANS:
                  raise ValueError("no such delivery plan: " + plan)
              return PLANS[plan](km, total)


          print([fee(plan, 4, 650) for plan in ["flat", "distance", "busy", "free_over_500"]])
        tests: |
          import random as _random

          _rng = _random.Random(143)
          for _ in range(60):
              _km, _total = _rng.randint(1, 12), _rng.choice([200, 499, 500, 501, 650, 1200])
              _d = 10 + 8 * _km
