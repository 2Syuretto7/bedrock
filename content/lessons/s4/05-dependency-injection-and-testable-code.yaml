        explanation: |
          With `send` passed in, the decision of who gets a message is tested against a recording fake and the real gateway is never touched. Calling the real gateway as well as `send` still sends real messages from tests; dropping the cancelled check texts patients who cancelled; and `day >= today` reminds today's patients too.
    - question:
        id: write-seeded-seating
        type: code
        mode: write
        system: s2
        prompt: |
          Change `seat` so that it shuffles a copy of the guest list with the random generator it is given, not the module's own, and seats four guests per table in the shuffled order, so that two calls with generators made from the same seed give the same plan and the caller's list is left in order. The program should print `True asha [1, 1, 1, 1, 2, 2]`.
        starter: |
          import random


          def seat(guests, rng):
              order = list(guests)
              random.shuffle(order)
              return {guest: 1 + i // 4 for i, guest in enumerate(order)}


          guests = ["asha", "bilal", "chitra", "dev", "esha", "farhan"]
          first = seat(guests, random.Random(7))
          second = seat(guests, random.Random(7))
          print(first == second, guests[0], sorted(first.values()))
        solution: |
          import random


          def seat(guests, rng):
              order = list(guests)
              rng.shuffle(order)
              return {guest: 1 + i // 4 for i, guest in enumerate(order)}


          guests = ["asha", "bilal", "chitra", "dev", "esha", "farhan"]
          first = seat(guests, random.Random(7))
          second = seat(guests, random.Random(7))
          print(first == second, guests[0], sorted(first.values()))
        tests: |
          import random as _random

          _rng = _random.Random(132)
          for _ in range(30):
              _guests = ["g" + str(_k) for _k in range(_rng.randint(1, 11))]
              _given = list(_guests)
              _seed = _rng.randint(1, 10**6)
              _order = list(_guests)
              _random.Random(_seed).shuffle(_order)
              _want = {_g: 1 + _i // 4 for _i, _g in enumerate(_order)}
              _got = seat(_guests, _random.Random(_seed))
              assert _guests == _given, "seat should not reorder the guest list it is given"
              assert _got == _want, "With the guests " + str(_given) + " and random.Random(" + str(_seed) + "), seat should give " + str(_want) + ", not " + str(_got)
          assert output.strip() == "True asha [1, 1, 1, 1, 2, 2]", "The program should print True asha [1, 1, 1, 1, 2, 2]"
        wrong:
          - |
            import random


            def seat(guests, rng):
                rng.shuffle(guests)
                return {guest: 1 + i // 4 for i, guest in enumerate(guests)}


            guests = ["asha", "bilal", "chitra", "dev", "esha", "farhan"]
            first = seat(guests, random.Random(7))
            second = seat(guests, random.Random(7))
            print(first == second, guests[0], sorted(first.values()))
          - |
