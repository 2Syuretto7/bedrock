                order = list(guests)
                random.seed(7)
                random.shuffle(order)
                return {guest: 1 + i // 4 for i, guest in enumerate(order)}


            guests = ["asha", "bilal", "chitra", "dev", "esha", "farhan"]
            first = seat(guests, random.Random(7))
            second = seat(guests, random.Random(7))
            print(first == second, guests[0], sorted(first.values()))
          - |
            import random


            def seat(guests, rng):
                order = list(guests)
                rng.shuffle(order)
                return {guest: 1 + i // 5 for i, guest in enumerate(order)}


            guests = ["asha", "bilal", "chitra", "dev", "esha", "farhan"]
            first = seat(guests, random.Random(7))
            second = seat(guests, random.Random(7))
            print(first == second, guests[0], sorted(first.values()))
        explanation: |
          The starter received `rng` but shuffled with the module's global generator, so the seed the caller chose had no effect. Calling `rng.shuffle` on a copy uses the injected generator. Shuffling the caller's list in place reorders it; reseeding the global generator inside makes every plan the same whatever generator is passed; and five to a table changes the plan.
