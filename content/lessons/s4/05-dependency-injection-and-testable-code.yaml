        prompt: |
          A function decides whether to give a customer a festival discount: on Diwali day, for customers with at least 5 past orders, chosen at random for 1 in 10 of them, and it then sends an SMS. How should it be designed for testing?
        options:
          - "A pure function of today's date, the order count and a random draw, returning yes or no, with the date, a seeded generator and the SMS sender supplied by the caller"
          - "Read the date and the global random generator inside, and send the SMS inside, so callers need pass nothing"
          - "Test it only on Diwali, when the result is meaningful"
          - "Inject every helper it calls, including len and min"
        answer: 0
        explanation: |
          Passing in the date and the random source makes every case testable on any day, and keeping the SMS outside the decision lets the rule be tested without sending anything. Reading them inside makes the rule untestable for 364 days a year, and injecting pure helpers adds parameters that hide nothing.
  connections:
    - text: |
        26 failed runs a month: the test passes only when it happens to run during the 11 open hours, so it fails 13 times in every 24, and $48 \times \frac{13}{24} = 26$. Passing a clock in turns it into two tests that always pass, one at 10:00 expecting open and one at 13:30 expecting the lunch break.

        Passing behaviour in as a parameter, a `send` function or a `clock` object, is the simplest of a family of recurring designs with names: strategies, adapters, observers and factories. Knowing when each one earns its place, and when it is ceremony, is [[s4.design-patterns-that-earn-their-place]]. The fakes themselves, and how far to go with them, are [[s6.fakes-stubs-and-mocks]], and taming time, randomness and ordering in tests is [[s6.deterministic-tests-seeds-clocks-and-fakes]].
