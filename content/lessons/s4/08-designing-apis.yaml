        explanation: |
          Walk the old fields, since that is what existing clients read: a missing one is a removal, and a surviving one breaks clients if its type changed or it stopped being always present. Reporting added fields, or a field that became always present, flags safe changes; walking the new fields never notices what was removed.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          How many posts does the puzzle's reader see twice across the three pages?
        answer: "5"
        explanation: |
          The 3 new posts push everything down by 3 before page 2, so page 2 opens with the last 3 posts of page 1. The 2 more push everything down by 2 again before page 3, so page 3 opens with the last 2 posts of page 2. That is $3 + 2 = 5$ repeats.
    - question:
        id: work-rename
        type: choice
        system: s2
        prompt: |
          A delivery API's responses have a field `phone`, and the team wants to call it `mobile`. Old versions of the app, which read `phone`, stay on some customers' phones for months. What should the team do?
        options:
          - "Send both fields with the same value, mark phone as deprecated, and remove it only once no supported app version reads it."
          - "Rename it in the next release; the app store will update everyone."
          - "Rename it and return an error to old apps telling them to update."
          - "Keep phone for ever and never add mobile."
        answer: 0
        explanation: |
          Expand, then contract: the new name is added alongside the old, callers move over in their own time, and the old name goes once nothing reads it. A rename in place breaks every old app at once, and an error message does not make it less broken.
  connections:
    - text: |
        5 posts. The 3 posts published during page 1 pushed the old ones down by 3, so page 2 began with the last 3 posts of page 1; the 2 published during page 2 did the same to page 3. A cursor, "the 20 posts older than the last one you saw", would have shown no repeats at all. Nothing in the server was broken; the shape of the request was the bug.

        Decisions like these, offset or cursor, one field name or another, what counts as a retryable error, are cheap to change on paper and expensive once callers exist. That is why teams write them down and ask others to find the flaws before building: [[s4.writing-design-documents]].

        This lesson treated a call to an API as one function calling another. Across a real network, requests travel as messages with status codes and headers, [[d1.http]], over connections that can stall or drop, [[d1.sockets-and-rpc]]; and keeping idempotency keys correct when many servers share the work is the problem of [[d2.idempotency-and-retries]].
