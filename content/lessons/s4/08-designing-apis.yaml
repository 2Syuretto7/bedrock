        solution: |
          def breaking(old, new):
              found = []
              for name in old:
                  old_type, old_always = old[name]
                  if name not in new:
                      found.append(name + ": removed")
                  else:
                      new_type, new_always = new[name]
                      if new_type != old_type:
                          found.append(name + ": type " + old_type + " -> " + new_type)
                      if old_always and not new_always:
                          found.append(name + ": may now be missing")
              return sorted(found)


          old = {
