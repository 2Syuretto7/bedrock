        explanation: |
          The calculation moves into `summarise` unchanged and ends in a `return`, and `report` keeps only the printing. Writing `>=` hands ties to the later customer, a change in behaviour that the sample orders do not reveal; leaving the `print` inside `summarise` gives nothing back to test; and `max(totals)` picks the name that comes last alphabetically, not the customer who spent most.
    - question:
        id: write-differences
        type: code
        mode: write
        system: s2
        prompt: |
          Write `outcome(fn, x)`, which returns `("ok", result)` if `fn(x)` returns and `("raises", name)` with the name of the exception's type if it raises, and `differences(old, new, cases)`, which returns the cases, in their original order, where the two versions have different outcomes. The program should print `['7', '10:15:00']`.
        starter: |
          def outcome(fn, x):
              # Return ("ok", result) if fn(x) returns,
              # or ("raises", name of the exception's type) if it raises.
              return None


          def differences(old, new, cases):
              # Return the cases, in order, where old and new have different outcomes.
              return []


          def old_parse(text):
              parts = text.split(":")
              return int(parts[0]) * 60 + int(parts[1])


          def new_parse(text):
              hours, minutes = text.split(":")
              return int(hours) * 60 + int(minutes)


          print(differences(old_parse, new_parse, ["9:30", "18:05", "7", "10:15:00", "x:10"]))
        solution: |
          def outcome(fn, x):
              try:
                  return ("ok", fn(x))
              except Exception as error:
                  return ("raises", type(error).__name__)


          def differences(old, new, cases):
              return [x for x in cases if outcome(old, x) != outcome(new, x)]


          def old_parse(text):
              parts = text.split(":")
              return int(parts[0]) * 60 + int(parts[1])


          def new_parse(text):
              hours, minutes = text.split(":")
              return int(hours) * 60 + int(minutes)


          print(differences(old_parse, new_parse, ["9:30", "18:05", "7", "10:15:00", "x:10"]))
        tests: |
          assert outcome(lambda _x: _x * 2, 3) == ("ok", 6), "outcome(fn, 3) should be ('ok', 6) when fn doubles its argument, not " + str(outcome(lambda _x: _x * 2, 3))
          assert outcome(int, "q") == ("raises", "ValueError"), "outcome(int, 'q') should be ('raises', 'ValueError'), not " + str(outcome(int, "q"))
          assert outcome(lambda _x: {}[_x], "k") == ("raises", "KeyError"), "A function that raises KeyError should give ('raises', 'KeyError'), not " + str(outcome(lambda _x: {}[_x], "k"))
          assert outcome(lambda _x: None, 1) == ("ok", None), "A function that returns None should give ('ok', None), not " + str(outcome(lambda _x: None, 1))


          def _a(x):
              if x < 0:
                  raise ValueError("negative")
              return x // 10


          def _b(x):
              if x < 0:
                  raise KeyError("negative")
              if x == 25:
                  return 3
              return x // 10


          _got = differences(_a, _b, [5, 25, -1, 40, 25])
          assert _got == [25, -1, 25], "differences should return [25, -1, 25]: 25 gives a different value and -1 a different exception, in the order the cases came; got " + str(_got)
          _got = differences(_a, _a, [5, -3, 12])
          assert _got == [], "A function compared with itself has no differences, even on cases that raise; got " + str(_got)
          assert output.strip() == "['7', '10:15:00']", "The program should print ['7', '10:15:00']"
