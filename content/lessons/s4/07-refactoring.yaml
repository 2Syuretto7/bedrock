          - "Add UPI refunds to all four copies, then tidy up later."
          - "Rewrite the whole module with UPI refunds built in, then test it."
          - "Extract the copies and add UPI refunds in the same commit, to save time."
        answer: 0
        explanation: |
          Make the change easy, then make the easy change. Adding the feature to four copies multiplies the work and the differences; a rewrite tested at the end is the big-bang case of the puzzle; and mixing refactoring with new behaviour hides which change broke what.
  connections:
    - text: |
        About 36%: $0.95^{20} \approx 0.36$. Nearly two times in three, the developer's first test run fails, and any of the 20 changes could be the cause, some of them hours old and half forgotten. Run the tests after each change instead and the same slips still happen, but each is caught by the next run with one suspect, undone, and made again in a minute.

        Refactoring is safe when the only people affected by a change in structure are the people editing the code. Once other programs call your code across a network, its shape is part of what they see: the names of fields, the order of results, even the wording of an error message may be relied on, and changing them is no longer a private matter. Designing that outside shape so that it can grow without breaking its callers is [[s4.designing-apis]].

        Small refactoring commits, each kept apart from changes in behaviour, are also far easier for a colleague to check than one large mixed change, which is the subject of [[s5.code-review]]. And whether your characterisation tests are strong enough to catch a slip at all can itself be measured, by deliberately introducing slips and counting how many the tests notice: [[s6.coverage-and-mutation-testing]].
