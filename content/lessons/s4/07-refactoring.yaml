    - question:
        id: write-split
        type: code
        mode: write
        system: s2
        prompt: |
          Split `report` into two phases: write `summarise(orders)`, which returns a tuple of the number of customers, the top customer's name and their total without printing anything, and make `report` print its line from that tuple. Keep the behaviour on ties: the customer who reached the top total first stays on top. The program should print `customers: 3 top: Meera 400`.
        starter: |
          orders = [("Asha", 240), ("Ravi", 180), ("Asha", 90), ("Meera", 400), ("Ravi", 60)]


          def report(orders):
              totals = {}
              for name, amount in orders:
                  totals[name] = totals.get(name, 0) + amount
              best = ""
              for name in totals:
                  if best == "" or totals[name] > totals[best]:
                      best = name
              print("customers:", len(totals), "top:", best, totals[best])


          report(orders)
        solution: |
          orders = [("Asha", 240), ("Ravi", 180), ("Asha", 90), ("Meera", 400), ("Ravi", 60)]


          def summarise(orders):
              totals = {}
              for name, amount in orders:
                  totals[name] = totals.get(name, 0) + amount
              best = ""
              for name in totals:
                  if best == "" or totals[name] > totals[best]:
                      best = name
              return len(totals), best, totals[best]


          def report(orders):
              customers, best, top = summarise(orders)
              print("customers:", customers, "top:", best, top)


          report(orders)
        tests: |
          assert "summarise" in globals() and callable(summarise), "Write a function named summarise"
          _cases = [
              ([("Asha", 240), ("Ravi", 180), ("Asha", 90), ("Meera", 400), ("Ravi", 60)], (3, "Meera", 400), ""),
              ([("Kabir", 100)], (1, "Kabir", 100), ""),
              ([("Ira", 50), ("Om", 70), ("Ira", 30), ("Om", 5)], (2, "Ira", 80), ""),
              ([("Zoya", 300), ("Dev", 200), ("Dev", 100)], (2, "Zoya", 300), "; when two customers tie, the one who ordered first stays on top, as before"),
              ([("Dev", 150), ("Zoya", 300), ("Dev", 150)], (2, "Dev", 300), "; when two customers tie, the one who ordered first stays on top, as before"),
          ]
          for _orders, _want, _note in _cases:
              _got = summarise(list(_orders))
              assert _got is not None, "summarise should return its results rather than print them"
              assert tuple(_got) == _want, "summarise(" + str(_orders) + ") should return " + str(_want) + ", not " + str(_got) + _note
          assert output.strip() == "customers: 3 top: Meera 400", "The program should still print customers: 3 top: Meera 400"
