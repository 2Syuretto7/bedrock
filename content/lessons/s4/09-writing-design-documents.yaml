          - |
            REQUIRED = ["Context", "Goals", "Non-goals", "Design", "Alternatives", "Risks"]


            def missing_sections(text):
                headings = []
                for line in text.splitlines():
                    if line.startswith("## "):
                        headings.append(line[3:].strip())
                return [name for name in REQUIRED if name not in headings]


            doc = """# Photo storage for the festival app
            ## Context
            1 crore users, 20 photos each, about 2 MB a photo.
            ## Non-goals
            Video. Editing photos.
            ## Design
            Object storage, with thumbnails made on upload.
            ##  alternatives
            One database server; our own file servers.
            Risks are listed in the appendix.
            """
            print(missing_sections(doc))
        explanation: |
          Collect the heading lines, clean each one, and look up each required name among them. Searching the whole text for `"## " + name` is fooled by capitals and extra spaces; searching for the bare word finds "goals" inside "Non-goals" and "risks" in a sentence of the body; and comparing headings without lowering their capitals misses "alternatives".
