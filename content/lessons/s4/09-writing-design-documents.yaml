          - "Start building the sync for the first hospital and adjust for the others later."
          - "Write a 60-page specification covering every possible future feature before talking to anyone."
          - "Pick the most popular sync library and skip the discussion."
        answer: 0
        explanation: |
          The decision crosses companies, takes months and fixes a format others will depend on, so it is exactly the case for a design document. Building first commits everyone to a shape no one reviewed; a 60-page specification is too long to be read; and choosing a library is one of the alternatives to compare, not a substitute for the comparison.
  connections:
    - text: |
        400 terabytes: $10^7 \times 20 \times 2$ MB, a hundred times the disk in the first draft. One line of arithmetic in the document's context section ruled that plan out before any code was written, and it also changed the question: no longer "which server" but "which kind of storage grows to hundreds of terabytes", which is the comparison the decision matrix then made.

        This completes software design. Its decisions live on in documents, decision records and code, and all three are kept in version control, which records every version of every file so that any past state of a project can be recovered and compared. How it does that, by naming every piece of content by its hash, is [[s5.version-control-as-a-content-addressed-store]]. The review habits begun here continue in [[s5.code-review]]. For whole systems spread across many machines, the estimates grow into capacity plans, [[d10.requirements-and-estimates]], and the review of a design becomes a discipline of its own, [[d10.reviewing-a-design]].
