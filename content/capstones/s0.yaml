cluster: S0
title: Settling up after a Goa trip
minutes: 60
claim: You will have written the program a group of friends needs after a trip, one function at a time, turning a list of who paid for what into a short list of payments that leaves everyone square, and you will have found the bug that made it ask the wrong people to pay.
brief: |
  Every lesson in this cluster taught one part of programming. This project needs nearly all of them at once, and it is a program people really use: every expense-splitting app on a phone does what you are about to do.

  **The trip.** Five friends, Asha, Ravi, Meera, Kabir and Zoya, spent four days in Goa. Whoever was nearest the counter paid, and somebody wrote each expense down as a tuple of who paid, how much in rupees, and what it was for:

  ```python
  friends = ["Asha", "Ravi", "Meera", "Kabir", "Zoya"]
  expenses = [
      ("Asha", 6000, "villa"),
      ("Ravi", 2500, "scooters"),
      ("Meera", 1800, "seafood dinner"),
      ("Asha", 700, "petrol"),
      ("Kabir", 1500, "boat trip"),
      ("Ravi", 500, "chai and snacks"),
  ]
  ```

  Every expense is shared equally among all five. Zoya paid for nothing and owes the most. Now they want to settle up, and they want as few UPI payments as possible, because nobody enjoys a group chat full of payment requests.

  **The rules.** Every amount is a whole number of rupees, and in this project a trip's total always divides exactly among the friends, so every share is a whole number too. Only a friend who owes money ever pays, and only a friend who is owed money ever receives. When the payments are done, every friend has paid out exactly their share of the trip, no more and no less.

  You will build the program in four stages: who paid what, what each friend owes or is owed, the payments themselves, and the message for the group chat. Each stage's editor starts with the functions you need from earlier stages already written, so you can concentrate on the new one. When a check fails, do what the last lesson taught: read the message, try the smallest case that shows the problem, and trace it by hand before changing anything.
starter: |
  # Scratch space for the trip. Try a function on a small case here.
  expenses = [("Asha", 6000, "villa"), ("Ravi", 2500, "scooters"), ("Meera", 1800, "seafood dinner")]
  for name, amount, what in expenses:
      print(name, amount, what)
stages:
  - title: Who paid what
    blocks:
      - text: |
          The first question is how much each friend paid out in all. Asha paid twice and Ravi paid twice, so their amounts must be added up, and the program does not know in advance which names will appear. That is a tally, built with the counting pattern from the lesson on dictionaries, except that each entry grows by an amount instead of by 1.
      - question:
          id: paid-by
          type: code
          mode: write
          system: s2
          concepts: [s0.dictionaries-and-sets, s0.lists-and-tuples, s0.loops, s0.functions]
          prompt: |
            Write `paid_by(expenses)`. It takes a list of `(name, amount, what)` tuples and **returns** a dictionary from each name that paid for something to the total that person paid. A friend who paid for nothing does not appear. The list passed in must not be changed.
          starter: |
            def paid_by(expenses):
                totals = {}
                return totals
          solution: |
            def paid_by(expenses):
                totals = {}
                for name, amount, what in expenses:
                    totals[name] = totals.get(name, 0) + amount
                return totals
          tests: |
            _trip = [("Asha", 6000, "villa"), ("Ravi", 2500, "scooters"), ("Meera", 1800, "seafood dinner"), ("Asha", 700, "petrol"), ("Kabir", 1500, "boat trip"), ("Ravi", 500, "chai and snacks")]
            assert callable(paid_by), "Define a function named paid_by"
            assert paid_by(_trip) is not None, "paid_by should return the dictionary, not print it"
            assert paid_by([("Asha", 300, "lunch")]) == {"Asha": 300}, "One expense of 300 paid by Asha should give {'Asha': 300}"
            assert paid_by([]) == {}, "No expenses should give an empty dictionary"
            assert paid_by([("Ravi", 100, "chai"), ("Ravi", 250, "fuel")]) == {"Ravi": 350}, "When one person pays twice, the two amounts should be added together"
            assert paid_by(_trip) == {"Asha": 6700, "Ravi": 3000, "Meera": 1800, "Kabir": 1500}, "On the Goa trip Asha paid 6700, Ravi 3000, Meera 1800 and Kabir 1500"
            _copy = [("A", 1, "x"), ("B", 2, "y")]
            paid_by(_copy)
            assert _copy == [("A", 1, "x"), ("B", 2, "y")], "The list passed in should not be changed"
          wrong:
            - |
              def paid_by(expenses):
                  totals = {}
                  for name, amount, what in expenses:
                      totals[name] = amount
                  return totals
            - |
              def paid_by(expenses):
                  totals = {}
                  for name, amount, what in expenses:
                      totals[name] = totals.get(name, 0) + 1
                  return totals
            - |
              def paid_by(expenses):
                  totals = {}
                  for name, amount, what in expenses:
                      totals[name] = totals.get(name, 0) + amount
                  print(totals)
          explanation: |
            `totals.get(name, 0)` is what this person has paid so far, or 0 the first time their name appears, and the amount is added to it. Storing the amount alone would keep only each person's last payment. The tuple is taken apart in the `for` line, and `what` is simply not used.
  - title: Who owes and who is owed
    blocks:
      - text: |
          Each friend's **balance** is what they paid minus their share of the trip. A positive balance means the group owes them money. A negative balance means they owe the group. A friend who paid for nothing has a balance of minus their share.
      - question:
          id: balances
          type: code
          mode: write
          system: s2
          concepts: [s0.functions, s0.dictionaries-and-sets, s0.expressions, s0.loops, f0.negative-numbers]
          prompt: |
            Write `balances(friends, expenses)`. It **returns** a dictionary from **every** friend in `friends`, including any who paid for nothing, to their balance: what they paid minus their share, where the share is the trip's total divided equally among all the friends. Use `//` for the share: the total always divides exactly, and `//` keeps it a whole number. `paid_by` is already written for you.
          starter: |
            def paid_by(expenses):
                totals = {}
                for name, amount, what in expenses:
                    totals[name] = totals.get(name, 0) + amount
                return totals

            def balances(friends, expenses):
                result = {}
                return result
          solution: |
            def paid_by(expenses):
                totals = {}
                for name, amount, what in expenses:
                    totals[name] = totals.get(name, 0) + amount
                return totals

            def balances(friends, expenses):
                paid = paid_by(expenses)
                total = 0
                for name, amount, what in expenses:
                    total += amount
                share = total // len(friends)
                result = {}
                for name in friends:
                    result[name] = paid.get(name, 0) - share
                return result
          tests: |
            _friends = ["Asha", "Ravi", "Meera", "Kabir", "Zoya"]
            _trip = [("Asha", 6000, "villa"), ("Ravi", 2500, "scooters"), ("Meera", 1800, "seafood dinner"), ("Asha", 700, "petrol"), ("Kabir", 1500, "boat trip"), ("Ravi", 500, "chai and snacks")]
            assert callable(balances), "Define a function named balances"
            assert balances(["A", "B"], [("A", 100, "x")]) is not None, "balances should return the dictionary, not print it"
            assert balances(["A", "B", "C"], [("A", 300, "lunch")]) == {"A": 200, "B": -100, "C": -100}, "A paid 300 for three people, so the share is 100: A is owed 200, and B and C each owe 100"
            assert "Zoya" in balances(_friends, _trip), "Zoya paid for nothing but is on the trip, so she needs a balance too"
            assert balances(_friends, _trip) == {"Asha": 4100, "Ravi": 400, "Meera": -800, "Kabir": -1100, "Zoya": -2600}, "On the Goa trip the share is 2600: Asha should be owed 4100 and Zoya should owe 2600"
            assert balances(["P", "Q"], [("P", 500, "x"), ("Q", 500, "y")]) == {"P": 0, "Q": 0}, "Two friends who paid the same have balances of 0"
          wrong:
            - |
              def paid_by(expenses):
                  totals = {}
                  for name, amount, what in expenses:
                      totals[name] = totals.get(name, 0) + amount
                  return totals

              def balances(friends, expenses):
                  paid = paid_by(expenses)
                  total = 0
                  for name, amount, what in expenses:
                      total += amount
                  share = total // len(friends)
                  result = {}
                  for name, amount in paid.items():
                      result[name] = amount - share
                  return result
            - |
              def paid_by(expenses):
                  totals = {}
                  for name, amount, what in expenses:
                      totals[name] = totals.get(name, 0) + amount
                  return totals

              def balances(friends, expenses):
                  paid = paid_by(expenses)
                  total = 0
                  for name, amount, what in expenses:
                      total += amount
                  share = total // len(expenses)
                  result = {}
                  for name in friends:
                      result[name] = paid.get(name, 0) - share
                  return result
            - |
              def paid_by(expenses):
                  totals = {}
                  for name, amount, what in expenses:
                      totals[name] = totals.get(name, 0) + amount
                  return totals

              def balances(friends, expenses):
                  paid = paid_by(expenses)
                  total = 0
                  for name, amount, what in expenses:
                      total += amount
                  share = total // len(friends)
                  result = {}
                  for name in friends:
                      result[name] = share - paid.get(name, 0)
                  return result
          explanation: |
            The loop over `friends`, not over the dictionary of payers, is what gives Zoya a balance: `paid.get(name, 0)` supplies 0 for anyone who paid nothing. The share is the total divided by the number of **friends**, not the number of expenses. And the balance is paid minus share, so that a positive number means "owed".
      - question:
          id: zoya-balance
          type: numeric
          system: s1
          concepts: [s0.dictionaries-and-sets, f0.negative-numbers]
          prompt: The trip cost 13,000 rupees in all. What is Zoya's balance, in rupees?
          answer: "-2600"
          unit: rupees
          explanation: |
            The share is $13{,}000 \div 5 = 2{,}600$. Zoya paid nothing, so her balance is $0 - 2{,}600 = -2{,}600$.
      - question:
          id: balances-total
          type: numeric
          system: s2
          concepts: [s0.loops, s0.reading-errors-and-debugging, f0.negative-numbers]
          prompt: Add up the five balances on the Goa trip. What do they come to? Then ask yourself whether that would be true of any trip.
          answer: "0"
          unit: rupees
          explanation: |
            $4{,}100 + 400 - 800 - 1{,}100 - 2{,}600 = 0$. It is true of every trip. The balances add up to the total paid minus five shares, and five shares are exactly the total. That makes it an assertion worth keeping in the program: if the balances ever add up to anything but 0, there is a bug before the payments are even worked out.
  - title: As few payments as possible
    blocks:
      - text: |
          The obvious way to settle is expense by expense: for each one, every other friend pays the person who paid it their fifth.
      - question:
          id: naive-payments
          type: numeric
          system: s1
          concepts: [s0.lists-and-tuples, s0.loops]
          prompt: Settled expense by expense, with each of the other four friends paying for each of the six expenses, how many payments would there be?
          answer: "24"
          unit: payments
          explanation: |
            Six expenses, and four other friends for each: $6 \times 4 = 24$ payments, many of them flowing in both directions between the same two people.
      - text: |
          There is a far better method. Look only at the balances, never at the expenses again, and repeat one step until everybody is square: **the friend who owes the most pays the friend who is owed the most**, as much as can be paid without either of them going past zero. That is the smaller of the two amounts. After the payment, at least one of the two is square and drops out.

          Because every payment settles at least one person completely, and the last payment always settles two at once, a group in which $k$ people owe or are owed is settled in at most $k - 1$ payments.
      - question:
          id: first-payment
          type: choice
          system: s1
          concepts: [s0.dictionaries-and-sets, s0.booleans-and-conditionals]
          prompt: "With balances Asha 4100, Ravi 400, Meera -800, Kabir -1100 and Zoya -2600, what is the first payment?"
          options:
            - "Zoya pays Asha 2600 rupees."
            - "Zoya pays Ravi 400 rupees."
            - "Meera pays Ravi 400 rupees."
            - "Zoya pays Asha 4100 rupees."
          answer: 0
          explanation: |
            Zoya owes the most and Asha is owed the most. Zoya owes 2600 and Asha is owed 4100, so the payment is the smaller, 2600. Zoya is then square, and Asha is still owed 1500.
      - text: |
          Ravi wrote `settle(balances)` to carry out the method. It returns a list of payments, each a tuple of who pays, who receives and how much. It runs, and every balance does end at zero. But on the Goa trip it makes Asha pay Ravi, and Asha was owed money from the start.
      - question:
          id: settle
          type: code
          mode: find-bug
          system: s2
          concepts: [s0.reading-errors-and-debugging, s0.dictionaries-and-sets, s0.loops, s0.functions, s0.lists-and-tuples]
          prompt: |
            Find the bug in `settle` and fix it, so that only friends who owe ever pay, only friends who are owed ever receive, every balance ends at zero, and a group with $k$ people who owe or are owed needs at most $k - 1$ payments. The dictionary passed in must not be changed. Trace the Goa trip by hand, one payment at a time, and watch Asha's balance.
          starter: |
            def settle(balances):
                left = {}
                for name, amount in balances.items():
                    if amount != 0:
                        left[name] = amount
                payments = []
                while len(left) > 0:
                    debtor = ""
                    creditor = ""
                    for name, amount in left.items():
                        if debtor == "" or amount < left[debtor]:
                            debtor = name
                        if creditor == "" or amount > left[creditor]:
                            creditor = name
                    pay = -left[debtor]
                    payments.append((debtor, creditor, pay))
                    left[debtor] += pay
                    left[creditor] -= pay
                    remaining = {}
                    for name, amount in left.items():
                        if amount != 0:
                            remaining[name] = amount
                    left = remaining
                return payments

            print(settle({"Asha": 4100, "Ravi": 400, "Meera": -800, "Kabir": -1100, "Zoya": -2600}))
          solution: |
            def settle(balances):
                left = {}
                for name, amount in balances.items():
                    if amount != 0:
                        left[name] = amount
                payments = []
                while len(left) > 0:
                    debtor = ""
                    creditor = ""
                    for name, amount in left.items():
                        if debtor == "" or amount < left[debtor]:
                            debtor = name
                        if creditor == "" or amount > left[creditor]:
                            creditor = name
                    pay = min(-left[debtor], left[creditor])
                    payments.append((debtor, creditor, pay))
                    left[debtor] += pay
                    left[creditor] -= pay
                    remaining = {}
                    for name, amount in left.items():
                        if amount != 0:
                            remaining[name] = amount
                    left = remaining
                return payments

            print(settle({"Asha": 4100, "Ravi": 400, "Meera": -800, "Kabir": -1100, "Zoya": -2600}))
          tests: |
            def _check(_given, _what):
                _before = {}
                for _n, _a in _given.items():
                    _before[_n] = _a
                _pays = settle(_given)
                assert _pays is not None, "settle should return the list of payments"
                assert _given == _before, "settle changed the balances it was given. Work on a copy."
                _left = {}
                for _n, _a in _given.items():
                    _left[_n] = _a
                for _from, _to, _amount in _pays:
                    assert _amount > 0, "Every payment should be a positive amount (" + _what + ")"
                    assert _given[_from] < 0, _from + " was owed money, so should never have to pay anyone (" + _what + "). Can a payment give a creditor more than they are owed?"
                    assert _given[_to] > 0, _to + " owed money, so should never receive a payment (" + _what + ")"
                    _left[_from] += _amount
                    _left[_to] -= _amount
                for _n, _a in _left.items():
                    assert _a == 0, "After the payments " + _n + " is not square (" + _what + ")"
                _k = 0
                for _n, _a in _given.items():
                    if _a != 0:
                        _k += 1
                assert len(_pays) <= max(_k - 1, 0), "Too many payments (" + _what + "): with " + str(_k) + " people who owe or are owed, at most " + str(max(_k - 1, 0)) + " are needed"
            _check({"A": 300, "B": -300}, "one person owes another")
            _check({}, "nobody owes anything")
            _check({"A": 0, "B": 0}, "everyone is already square")
            _check({"Asha": 4100, "Ravi": 400, "Meera": -800, "Kabir": -1100, "Zoya": -2600}, "the Goa trip")
            _check({"P": -300, "Q": -200, "R": 100, "S": 400}, "two owe and two are owed")
            _check({"A": 900, "B": -100, "C": -200, "D": -300, "E": -300}, "one person paid for everything")
            _check({"A": -1000, "B": 250, "C": 250, "D": 250, "E": 250}, "one person paid for nothing")
            assert settle({"Asha": 4100, "Ravi": 400, "Meera": -800, "Kabir": -1100, "Zoya": -2600})[0] == ("Zoya", "Asha", 2600), "The first payment on the Goa trip should be Zoya paying Asha 2600"
          wrong:
            - |
              def settle(balances):
                  left = {}
                  for name, amount in balances.items():
                      if amount != 0:
                          left[name] = amount
                  payments = []
                  while len(left) > 0:
                      debtor = ""
                      creditor = ""
                      for name, amount in left.items():
                          if debtor == "" or amount < left[debtor]:
                              debtor = name
                          if creditor == "" or amount > left[creditor]:
                              creditor = name
                      pay = left[creditor]
                      payments.append((debtor, creditor, pay))
                      left[debtor] += pay
                      left[creditor] -= pay
                      remaining = {}
                      for name, amount in left.items():
                          if amount != 0:
                              remaining[name] = amount
                      left = remaining
                  return payments
            - |
              def settle(balances):
                  left = {}
                  for name, amount in balances.items():
                      if amount != 0:
                          left[name] = amount
                  payments = []
                  while len(left) > 0:
                      debtor = ""
                      creditor = ""
                      for name, amount in left.items():
                          if debtor == "" or amount < left[debtor]:
                              debtor = name
                          if creditor == "" or amount > left[creditor]:
                              creditor = name
                      pay = max(-left[debtor], left[creditor])
                      payments.append((debtor, creditor, pay))
                      left[debtor] += pay
                      left[creditor] -= pay
                      remaining = {}
                      for name, amount in left.items():
                          if amount != 0:
                              remaining[name] = amount
                      left = remaining
                  return payments
            - |
              def settle(balances):
                  left = balances
                  payments = []
                  while len(left) > 0:
                      debtor = ""
                      creditor = ""
                      for name, amount in left.items():
                          if debtor == "" or amount < left[debtor]:
                              debtor = name
                          if creditor == "" or amount > left[creditor]:
                              creditor = name
                      pay = min(-left[debtor], left[creditor])
                      payments.append((debtor, creditor, pay))
                      left[debtor] += pay
                      left[creditor] -= pay
                      remaining = {}
                      for name, amount in left.items():
                          if amount != 0:
                              remaining[name] = amount
                      left = remaining
                  return payments
          explanation: |
            The bug is `pay = -left[debtor]`: the debtor always paid off their whole debt, even when the creditor was owed less. On the Goa trip Meera paid Asha 800 when Asha was owed only 400, so Asha went to minus 400 and then had to pass 400 on to Ravi. The payment must be the smaller of what the debtor owes and what the creditor is owed, `min(-left[debtor], left[creditor])`, so that neither goes past zero. A trace of `left` after each payment shows the moment Asha's balance turns negative. Note also the first loop: it builds a copy, so the caller's balances are never changed.
      - question:
          id: fewer-still
          type: choice
          system: s2
          concepts: [s0.dictionaries-and-sets, s0.lists-and-tuples]
          prompt: "The method settles $k$ people in at most $k - 1$ payments. When can a group be settled in **fewer** than that?"
          options:
            - "Never. Every group of k people needs exactly k - 1 payments."
            - "When the group can be split into smaller groups whose balances each add up to 0, such as one friend who owes exactly what another is owed. Each smaller group then needs one payment fewer than its size."
            - "Whenever the total of the trip is large."
            - "When the friend who owes the most pays first."
          answer: 1
          explanation: |
            Each group whose balances add up to 0 can be settled on its own in one fewer payment than it has members, so splitting into two such groups saves a payment. With balances A 500, B -500, C 300 and D -300, two payments are enough instead of three. On the Goa trip no smaller group adds up to 0, so 4 payments is the fewest. Finding the best split in general turns out to be a genuinely hard problem, and it will come back much later in the course.
  - title: The message for the group chat
    blocks:
      - text: |
          The last step is to turn each payment into a line that a person can read and act on.
      - question:
          id: describe
          type: code
          mode: write
          system: s1
          concepts: [s0.strings, s0.lists-and-tuples, s0.functions]
          prompt: |
            Write `describe(payment)`. It takes one payment, a tuple of who pays, who receives and how much, and **returns** a line like this, with no space between the rupee sign and the amount:

            ```
            Zoya pays Asha ₹2600
            ```
          starter: |
            def describe(payment):
                return ""
          solution: |
            def describe(payment):
                payer, payee, amount = payment
                return f"{payer} pays {payee} ₹{amount}"
          tests: |
            assert callable(describe), "Define a function named describe"
            assert describe(("Zoya", "Asha", 2600)) is not None, "describe should return the line, not print it"
            assert describe(("Zoya", "Asha", 2600)) == "Zoya pays Asha ₹2600", "describe(('Zoya', 'Asha', 2600)) should be exactly: Zoya pays Asha ₹2600"
            assert describe(("Meera", "Ravi", 400)) == "Meera pays Ravi ₹400", "It should work for any payment. Check who pays and who receives."
          wrong:
            - |
              def describe(payment):
                  payer, payee, amount = payment
                  return f"{payee} pays {payer} ₹{amount}"
            - |
              def describe(payment):
                  payer, payee, amount = payment
                  return f"{payer} pays {payee} ₹ {amount}"
            - |
              def describe(payment):
                  return "Zoya pays Asha ₹2600"
          explanation: |
            Unpacking takes the tuple apart into three names, and an f-string drops each into its hole. With the four payments from `settle`, the group chat gets four lines: Zoya pays Asha ₹2600, Kabir pays Asha ₹1100, Meera pays Asha ₹400, and Meera pays Ravi ₹400. Twenty-four payments have become four.
review: |
  You started with a list of who paid for what on a trip and ended with four payments that leave five friends square, where the obvious method needed twenty-four. Every part of the program came from a lesson you have finished:

  - Each expense was a tuple taken apart in a `for` line, and the friends were a list, from [[s0.lists-and-tuples]], walked through with the loops of [[s0.loops]].
  - The totals each person paid were a tally, and the balances a dictionary from name to amount, from [[s0.dictionaries-and-sets]]. `get` with a fallback of 0 gave Zoya a balance though she paid for nothing.
  - The share used `//` from [[s0.expressions]], and balances below zero were the debts of [[f0.negative-numbers]].
  - Each stage was a function with one job, from [[s0.functions]], so that `balances` could call `paid_by` and every part could be checked on its own.
  - Choosing who pays whom was a pair of "best so far" comparisons with [[s0.booleans-and-conditionals]], and the payment was the smaller of two amounts.
  - The bug in `settle` ran without a murmur and still asked Asha to pay, a silent wrong answer of the kind [[s0.reading-errors-and-debugging]] taught you to hunt with a small case and a trace.
  - The message for the group chat was an f-string, from [[s0.strings]].

  Two habits are worth keeping. The balances of any trip add up to zero, and a check like that, written as an assertion, catches a whole family of bugs before they reach anyone's bank account. And the method you fixed is not the last word: it promises at most one payment fewer than the number of people, but finding the very fewest is a genuinely hard problem, and the course will return to why.
