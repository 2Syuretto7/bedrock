          solution: |
            from dataclasses import dataclass


            @dataclass
            class Transaction:
                date: str
                category: str
                paise: int

            def parse(line):
                parts = line.split(",")
                if len(parts) != 3:
                    raise ValueError(f"bad line: {line}")
                try:
                    paise = int(parts[2])
                except ValueError:
                    raise ValueError(f"bad line: {line}")
                return Transaction(parts[0].strip(), parts[1].strip().lower(), paise)

            def load(text):
                good = []
                bad = []
                for line in text.splitlines():
                    if line.strip():
                        try:
                            good.append(parse(line))
                        except ValueError:
                            bad.append(line)
                return good, bad

            def rupees(paise):
                sign = "-" if paise < 0 else ""
                paise = abs(paise)
                return f"{sign}₹{paise // 100}.{paise % 100:02d}"

            def running(transactions, opening):
                balance = opening
                for t in transactions:
                    balance += t.paise
                    yield balance

            def statement(text, opening):
                good, bad = load(text)
                lines = [f"{t.date} {t.category} {rupees(t.paise)} {rupees(b)}" for t, b in zip(good, running(good, opening))]
                lines.append(f"{len(bad)} skipped")
                return lines
          tests: |
            for _needed in ["parse", "load", "running"]:
                assert _needed in globals(), "paste your " + _needed + " function above statement"
            _text = "2024-03-01, Salary ,5200000\n\n2024-03-02, Groceries ,-45050\nthis line is broken\n2024-03-03,rent,many\n2024-03-04,chai,-2005\n"
            _lines = statement(_text, 100000)
            assert _lines is not None, "statement must return the list of lines, not print them"
            assert len(_lines) == 4, "three readable transactions need three lines, and then the line about skipped ones"
            assert _lines[0] == "2024-03-01 salary ₹52000.00 ₹53000.00", "the first line is not right: compare it character by character with the example"
            assert _lines[1] == "2024-03-02 groceries -₹450.50 ₹52549.50", "the balance on each line should build on the balance of the line before"
            assert _lines[2] == "2024-03-04 chai -₹20.05 ₹52529.45", "a bad line should leave the balance untouched and should not appear"
            assert _lines[3] == "2 skipped", "the last line counts the lines that could not be read"
            assert statement("", 500) == ["0 skipped"], "an empty export still gets its last line"
