review: |
  You have a program that takes untidy text and produces a statement, and it is made of pieces you can name:

  - `Transaction` was a data class with annotated fields, from [[s1.type-hints-and-dataclasses]].
  - `parse` refused bad input in one consistent way and `load` decided what to do about the refusal. Raising where the problem is found and catching where it can be dealt with is from [[s1.exceptions]], and turning lines of text into values and back is from [[s1.files-and-data-formats]].
  - `Ledger` was a class, from [[s1.classes-and-objects]], that answered `len`, `for` and `+` through special methods, from [[s1.special-methods]].
  - `running` produced balances only when asked, from [[s1.generators-and-context-managers]], and `statement` paired them with their transactions using `zip` inside a comprehension, from [[s1.comprehensions-and-iterators]].
  - Your test for `rupees` chose its cases at the boundaries, from [[s1.testing-with-pytest]], and the search for repeated lines came down to choosing a set over a list.

  Look at how the errors were handled, because it is the part most often done badly. The function that found the problem did not try to solve it, and the function that could solve it did not need to know how it was found. That separation is what lets each piece stay small.
