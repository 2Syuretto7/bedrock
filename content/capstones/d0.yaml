          explanation: |
            Keep a stack of schedules to try, starting with the empty one. Replay each from fresh state. If no thread is left it is complete: return broken if the check fails, otherwise count it. If threads are left but none can run, it is a deadlock. Otherwise push the schedule extended by each runnable thread, in reverse so that lower numbers are tried first. Running threads that are waiting for a lock lets two hold it at once; calling it a deadlock when only some threads are waiting flags every lock that is ever contended; and treating a stuck state as finished passes the very deadlock the test exists to find.
review: |
  Each incident at the stadium came from something this cluster taught:

  - The last seat sold twice in 4 of the 6 interleavings, because check-then-act across two steps is a race, as [[d0.interleavings-and-race-conditions]] showed.
  - A lock held across a 250 ms payment allows only 4 bookings a second; a critical section should cover the shared state and nothing more, the lesson of [[d0.locks-and-mutual-exclusion]].
  - Two seat swaps that took the same locks in opposite orders closed a cycle, which a single lock order prevents, from [[d0.deadlock]].
  - A semaphore of 20 permits keeps the service within the gateway's limit, the counting tool of [[d0.condition-variables-and-semaphores]].
  - Four threads racing on a compare-and-swap counter make up to 10 attempts, the cost of contention in [[d0.atomic-operations-and-compare-and-swap]].
  - The seat map looked empty because a plain flag gives no happens-before; a release store and an acquire load publish it safely, from [[d0.memory-models-and-happens-before]].
  - Work that computes a tenth of the time needs ten workers per core, 160 on 16 cores, as [[d0.thread-pools-and-work-queues]] sizes pools.
  - A blocking SMS call froze the notification loop, which must hand such work to a thread pool, from [[d0.event-loops-and-asynchronous-i-o]].
  - The seat-map actor fell 15 s behind when requests arrived faster than it could handle them, the mailbox arithmetic of [[d0.actors-and-message-passing]].
  - Exploring every schedule finds the oversell and the deadlock before the customers do, the method of [[d0.testing-concurrent-code-deterministically]].
