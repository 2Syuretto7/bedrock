          explanation: |
            Roads are two-way, so the shortest time from a rider to the store equals the shortest time from the store to the rider, and one run of Dijkstra's algorithm from the store answers for every rider at once. Storing each road in one direction only cuts the store off from riders; fixing a junction's time when it is first reached, as breadth-first search would, misses a later, faster route; and comparing a rider who cannot reach the store, whose time is `None`, with a number fails.
      - question:
          id: rider-once
          type: choice
          system: s1
          concepts: [s3.shortest-paths, s3.measuring-and-predicting-running-time]
          prompt: |
            There are 2,000 free riders. Why run Dijkstra's algorithm once from the store, rather than once from each rider?
          options:
            - "One run from the store finds the time to every junction, so it does the work of 2,000 runs from the riders."
            - "Dijkstra's algorithm only works when started from a store."
            - "Running from the riders gives wrong answers on two-way roads."
            - "It makes no difference to the running time."
          answer: 0
          explanation: |
            On two-way roads the times are the same in both directions. A single run costs about $(V + E) \log V$; 2,000 runs cost 2,000 times as much, for the same answer.
  - title: Fibre between the dark stores
    blocks:
      - text: |
          The company is joining its five dark stores, P, Q, R, S and T, with leased fibre so their stock systems can talk. Possible links and their yearly cost in lakh rupees are P–Q 4, P–R 3, Q–R 2, Q–S 5, R–S 7, R–T 6, S–T 1 and Q–T 8. Every store must be reachable from every other, directly or through others.
      - question:
          id: fibre-cost
          type: numeric
          system: s2
          concepts: [s3.minimum-spanning-trees, s3.greedy-algorithms]
          prompt: |
            What is the least total yearly cost, in lakh rupees?
          answer: "11"
          explanation: |
            Kruskal's method takes links cheapest first, skipping any that would close a loop: S–T 1, Q–R 2, P–R 3, then P–Q 4 is skipped because P and Q are already joined through R, and Q–S 5 joins the two groups. Four links join five stores, for $1 + 2 + 3 + 5 = 11$ lakh. The greedy choice is safe because the cheapest link across any division of the stores belongs to some cheapest network.
  - title: A rider's most valuable day
    blocks:
      - text: |
          Riders can also book delivery slots in advance: each slot has a start hour, an end hour and a fixed pay. A rider can work slots that do not overlap, and may start one at the moment another ends. The app should suggest the most valuable set.
      - question:
          id: best-earnings
          type: code
          mode: write
          system: s2
          concepts: [s3.dynamic-programming, s3.binary-search]
          prompt: |
            Write `best_earnings(slots)`, the largest total pay from slots that do not overlap. Each slot is `(start, end, pay)` with `start < end`. Sort the slots by end, and let `best[i]` be the most pay from the first `i` of them; for each slot, use `bisect.bisect_right` on the sorted ends to find how many earlier slots end by its start.
          starter: |
            import bisect


            def best_earnings(slots):
                # Each slot is (start, end, pay), with start < end. Return the largest total pay from slots that
                # do not overlap; a slot may start at the moment another ends.
                return 0


            slots = [(9, 12, 300), (11, 13, 150), (12, 15, 400), (14, 16, 250), (15, 18, 350), (8, 19, 900)]
            print(best_earnings(slots), best_earnings([]))
          solution: |
            import bisect


            def best_earnings(slots):
                # Each slot is (start, end, pay), with start < end. Return the largest total pay from slots that
                # do not overlap; a slot may start at the moment another ends.
                order = sorted((end, start, pay) for start, end, pay in slots)
                ends = [end for end, start, pay in order]
                best = [0] * (len(order) + 1)
                for i in range(len(order)):
                    end, start, pay = order[i]
                    fits = bisect.bisect_right(ends, start)
                    best[i + 1] = max(best[i], best[fits] + pay)
                return best[len(order)]


            slots = [(9, 12, 300), (11, 13, 150), (12, 15, 400), (14, 16, 250), (15, 18, 350), (8, 19, 900)]
            print(best_earnings(slots), best_earnings([]))
          tests: |
            import random as _random


            def _brute(slots):
                _best = 0
                for _mask in range(1 << len(slots)):
                    _pick = [slots[_k] for _k in range(len(slots)) if _mask >> _k & 1]
                    _ok = all(_a[1] <= _b[0] or _b[1] <= _a[0] for _x, _a in enumerate(_pick) for _b in _pick[_x + 1:])
                    if _ok:
                        _best = max(_best, sum(_p[2] for _p in _pick))
                return _best


            _rng = _random.Random(53)
            _cases = [[], [(1, 2, 5)], [(1, 3, 5), (3, 5, 5)], [(1, 4, 5), (3, 6, 7)], [(9, 12, 300), (11, 13, 150), (12, 15, 400), (14, 16, 250), (15, 18, 350), (8, 19, 900)], [(1, 10, 100), (1, 2, 30), (2, 3, 30), (3, 4, 30)]]
            for _ in range(40):
                _slots = []
                for _ in range(_rng.randint(1, 8)):
                    _s = _rng.randint(0, 12)
                    _slots.append((_s, _s + _rng.randint(1, 5), _rng.randint(1, 9) * 50))
                _cases.append(_slots)
            for _slots in _cases:
                _copy = list(_slots)
                _want = _brute(_copy)
                _got = best_earnings(_slots)
                assert _got == _want, "best_earnings(" + str(_copy) + ") should be " + str(_want) + ", not " + str(_got)
            _big = [(_k, _k + 2, 10 + _k % 7) for _k in range(20000)]
            _got = best_earnings(_big)
            assert _got == 130000, "On 20,000 slots, best_earnings should be 1,30,000, not " + str(_got)
            assert output.strip() == "1050 0", "The program should print 1050 0"
          wrong:
