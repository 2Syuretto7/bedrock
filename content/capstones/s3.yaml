cluster: S3
title: Running a city's delivery network
minutes: 100
claim: You will have taken a grocery-delivery service through a day of algorithmic decisions, predicting a slow search from its measurements and fixing it with sorting and binary search, choosing the rider who can reach a store soonest with one run of Dijkstra's algorithm, laying the cheapest fibre between dark stores, planning a rider's most valuable day by dynamic programming, keeping a log and a fair sample of orders cheaply, and judging how good a van's route is when the best one is out of reach.
brief: |
  This cluster was about choosing and judging algorithms: predicting running time from measurements, sorting and searching, divide and conquer, graphs and their paths and trees, greedy rules and dynamic programmes, amortised and randomised costs, and the problems for which no fast algorithm is known. Each lesson had its own neat examples. Real systems mix them, and the skill is to see which one a messy problem is.

  **The project.** A grocery-delivery service in Bengaluru runs dark stores, small warehouses that only serve online orders, with riders on scooters for single orders and vans for bulk ones. During one day, its engineering team meets six problems, from a search box that has become slow to a planning team that wants perfect van routes.

  Each stage below is one of those problems. Nothing here is new: each stage applies a lesson of this cluster, and often two at once. The task in every stage is the same: recognise the problem, choose the method, and know what it guarantees.
starter: |
  # Scratch space for the day's problems.
  import bisect

  ids = sorted([5821, 1093, 7740, 2604, 9918, 3357])
  at = bisect.bisect_left(ids, 7740)
  print(ids, at, ids[at] == 7740)
stages:
  - title: The slow search box
    blocks:
      - text: |
          Support staff type an order ID into a search box, and the service checks whether it is among the day's orders by scanning a list kept in the order they arrived. A nightly reconciliation job looks up every one of the day's orders the same way, and it has become painfully slow. The team timed it: 0.8 seconds with 10,000 orders, 3.2 seconds with 20,000.
      - question:
          id: search-predict
          type: numeric
          system: s2
          concepts: [s3.measuring-and-predicting-running-time]
          prompt: |
            If the pattern holds, how many seconds will the job take with 80,000 orders?
          answer: "51.2"
          tolerance: "0.1"
          explanation: |
            Doubling the orders multiplied the time by 4, the signature of quadratic growth. From 10,000 to 80,000 is three doublings, so the time grows by $4^3 = 64$: $0.8 \times 64 = 51.2$ seconds. Each of the $n$ lookups scans up to $n$ orders.
      - question:
          id: search-binary
          type: numeric
          system: s1
          concepts: [s3.binary-search, s3.sorting]
          prompt: |
            The team sorts the IDs once and switches to binary search. At most how many comparisons does one lookup need among 10,00,000 sorted IDs?
          answer: "20"
          explanation: |
            Each comparison halves the range, and $2^{20} = 10{,}48{,}576$ is the first power of 2 above 10 lakh, so 20 comparisons always suffice. Sorting costs $n \log n$ once, and every lookup after that is logarithmic, so the nightly job becomes $n \log n$ in all.
  - title: Which rider goes
    blocks:
      - text: |
          When an order is packed, the dispatcher must send the rider who can reach the dark store soonest. The city is a graph of junctions joined by two-way roads, each with its travel time in minutes, and each free rider waits at some junction.
      - question:
          id: nearest-rider
          type: code
          mode: write
          system: s2
          concepts: [s3.shortest-paths]
          prompt: |
            Write `nearest_rider(n, roads, riders, restaurant)`. Junctions are numbered 0 to `n - 1`; `roads` lists two-way roads `(a, b, minutes)`; `riders` maps each rider's name to a junction. Return `(minutes, name)` for the rider who can reach junction `restaurant` soonest, the name first in alphabetical order if two are equally close, or `None` if no rider can reach it. Run Dijkstra's algorithm once, from the restaurant.
          starter: |
            import heapq


            def nearest_rider(n, roads, riders, restaurant):
                # Roads are two-way (a, b, minutes) between junctions 0 to n - 1; riders maps each rider to a junction.
                # Return (minutes, rider) for the rider who can reach the restaurant soonest, or None if none can.
                return None


            roads = [(0, 1, 4), (1, 2, 3), (0, 3, 9), (3, 2, 2), (2, 4, 6), (5, 6, 1)]
            riders = {"Asha": 0, "Bilal": 3, "Chitra": 4, "Dev": 6}
            print(nearest_rider(7, roads, riders, 2), nearest_rider(7, roads, {"Dev": 6}, 2))
          solution: |
            import heapq


            def nearest_rider(n, roads, riders, restaurant):
                # Roads are two-way (a, b, minutes) between junctions 0 to n - 1; riders maps each rider to a junction.
                # Return (minutes, rider) for the rider who can reach the restaurant soonest, or None if none can.
                links = [[] for i in range(n)]
                for a, b, minutes in roads:
                    links[a].append((b, minutes))
                    links[b].append((a, minutes))
                best = [None] * n
                best[restaurant] = 0
                heap = [(0, restaurant)]
                while heap:
                    d, here = heapq.heappop(heap)
                    if d == best[here]:
                        for there, minutes in links[here]:
                            if best[there] is None or d + minutes < best[there]:
                                best[there] = d + minutes
                                heapq.heappush(heap, (d + minutes, there))
                found = None
                for rider in sorted(riders):
                    at = best[riders[rider]]
                    if at is not None and (found is None or at < found[0]):
                        found = (at, rider)
                return found


            roads = [(0, 1, 4), (1, 2, 3), (0, 3, 9), (3, 2, 2), (2, 4, 6), (5, 6, 1)]
            riders = {"Asha": 0, "Bilal": 3, "Chitra": 4, "Dev": 6}
            print(nearest_rider(7, roads, riders, 2), nearest_rider(7, roads, {"Dev": 6}, 2))
          tests: |
            import random as _random


