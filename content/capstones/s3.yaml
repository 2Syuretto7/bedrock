              import bisect


              def best_earnings(slots):
                  # Each slot is (start, end, pay), with start < end. Return the largest total pay from slots that
                  # do not overlap; a slot may start at the moment another ends.
                  total = 0
                  free = None
                  for end, start, pay in sorted((end, start, pay) for start, end, pay in slots):
                      if free is None or start >= free:
                          total += pay
                          free = end
                  return total


              slots = [(9, 12, 300), (11, 13, 150), (12, 15, 400), (14, 16, 250), (15, 18, 350), (8, 19, 900)]
              print(best_earnings(slots), best_earnings([]))
          explanation: |
            With the slots sorted by end, the best plan for the first $i + 1$ slots either skips slot $i$, keeping `best[i]`, or works it and adds its pay to the best plan among the slots that end by its start, which are exactly the first `bisect_right(ends, start)`. Sorting and the searches cost $n \log n$ in all. `bisect_left` refuses a slot that starts as another ends; always working the slot loses when skipping it pays more; and the earliest-finish greedy rule maximises the number of slots, not the pay.
      - question:
          id: greedy-fails
          type: choice
          system: s1
          concepts: [s3.greedy-algorithms, s3.dynamic-programming]
          prompt: |
            Earliest finish first was proved best for fitting in as many bookings as possible. Why is it not enough here?
          options:
            - "The goal is the most pay, not the most slots, and the exchange argument that proved the rule breaks when slots pay differently."
            - "Earliest finish first only works when slots are sorted by start."
            - "It is too slow for a full day's slots."
            - "It is enough; it always gives the most pay."
          answer: 0
          explanation: |
            Swapping the first slot of a best plan for the earliest-finishing one keeps the count the same, but can lower the pay. One long, well-paid slot can beat three short ones, so each choice must weigh both options, which is what the dynamic programme does.
  - title: The order log and a fair sample
    blocks:
      - text: |
          Every order is appended to an in-memory log, a list that starts with room for one item and doubles its room when full. Separately, the quality team wants 100 of the day's orders chosen uniformly at random for a check, but the number of orders is unknown until midnight and the service cannot keep them all.
      - question:
          id: log-copies
          type: numeric
          system: s1
          concepts: [s3.amortised-analysis]
          prompt: |
            How many items are copied in all while 1,000 orders are appended to the log?
          answer: "1023"
          explanation: |
            The list is full at 1, 2, 4, …, 512 items before the next append, and copies $1 + 2 + \cdots + 512 = 1{,}023$ items: about one copy per append, though the append that moves 512 items is a single slow one.
      - question:
          id: fair-sample
          type: choice
          system: s2
          concepts: [s3.randomised-algorithms]
          prompt: |
            How should the service choose the 100 orders?
          options:
            - "Keep the first 100; for the t-th order after that, keep it with probability 100/t in place of a randomly chosen kept order."
            - "Keep every 100th order."
            - "Keep each order with probability 1/100."
            - "Keep the last 100 orders before midnight."
          answer: 0
          explanation: |
            Reservoir sampling keeps exactly 100 orders, each with the same chance, $100/t$ after $t$ orders, whenever the day ends. Every 100th order is not random and can follow a pattern in the traffic; keeping each with probability $1/100$ gives a random number of orders, not 100; and the last 100 are all late-evening orders.
  - title: The vans' routes
    blocks:
      - text: |
          The planning team wants the provably shortest route each morning for every van, each with about 40 stops. The current planner builds routes by nearest neighbour and improves them with 2-opt. For one van, the cheapest spanning tree joining its 40 stops and the store is 52 km long, and the 2-opt route is 61 km.
      - question:
          id: route-bound
          type: numeric
          system: s2
          concepts: [s3.intractability-p-np-and-heuristics, s3.minimum-spanning-trees]
          prompt: |
            At most how many per cent longer than the best possible route can the 61 km route be? Give one decimal place.
          answer: "17.3"
          tolerance: "0.1"
          explanation: |
            Deleting one road from the best route leaves a spanning tree, so the best route is at least as long as the cheapest tree, 52 km. The 2-opt route is at most $61/52 = 1.173$ times the best, 17.3% longer at worst; it is probably much closer. A cheap lower bound turns a heuristic's answer into one with a known worst case.
      - question:
          id: route-proof
          type: choice
          system: s2
          concepts: [s3.intractability-p-np-and-heuristics]
          prompt: |
            What should the team say to the request for provably shortest routes?
          options:
            - "Finding the shortest route is NP-hard; keep the heuristic, report each route's gap above a lower bound, and use an exact solver only where a van's stops are few or the gap is large."
            - "Try every order of each van's 40 stops overnight."
            - "Ask for a faster computer, which will make the exact search practical."
            - "Promise the shortest routes, since nearest neighbour followed by 2-opt always finds them."
          answer: 0
          explanation: |
            With 40 stops and the store there are about $4 \times 10^{47}$ routes, and no fast exact method is known for every input. A faster computer moves the limit by only a few stops. 2-opt reaches a local minimum, not necessarily the best. Reporting the gap to a lower bound gives the planning team an honest guarantee, and exact methods remain worth running on small or troublesome cases.
review: |
  The day's six problems are handled, and each answer came from a lesson of this cluster:

  - The search box's slowdown was predicted from two measurements, as in [[s3.measuring-and-predicting-running-time]], and fixed by [[s3.sorting]] once and [[s3.binary-search]] for every lookup.
  - One run from the store, using [[s3.shortest-paths]], found the nearest rider among 2,000.
  - The fibre network came from [[s3.minimum-spanning-trees]], whose cut rule is one of the safe choices of [[s3.greedy-algorithms]].
  - The rider's best day needed [[s3.dynamic-programming]], because the greedy rule that maximises the number of slots ignores the pay.
  - The order log's appends cost a constant each over the day, by [[s3.amortised-analysis]], and the fair sample came from reservoir sampling in [[s3.randomised-algorithms]].
  - The vans' routes are NP-hard, by [[s3.intractability-p-np-and-heuristics]], so the honest answer was a good heuristic with a lower bound beside it.

  Notice the pattern. Hardly any problem arrived with its algorithm's name on it. A search box, a dispatcher, a fibre lease, a rider's diary and a van's morning each had to be recognised as a sorted-list lookup, a shortest-path tree, a spanning tree, a weighted scheduling programme and a travelling salesperson. Recognising the problem was most of the work. The next cluster turns to where the data for all of this lives: tables of rows and keys, and the language for asking them questions.
