                _d[restaurant] = 0
                for _ in range(n):
                    for _a, _b, _m in roads:
                        for _x, _y in [(_a, _b), (_b, _a)]:
                            if _d[_x] is not None and (_d[_y] is None or _d[_x] + _m < _d[_y]):
                                _d[_y] = _d[_x] + _m
                _found = None
                for _r in sorted(riders):
                    _at = _d[riders[_r]]
                    if _at is not None and (_found is None or _at < _found[0]):
                        _found = (_at, _r)
                return _found


            _rng = _random.Random(47)
            _cases = [
                (7, [(0, 1, 4), (1, 2, 3), (0, 3, 9), (3, 2, 2), (2, 4, 6), (5, 6, 1)], {"Asha": 0, "Bilal": 3, "Chitra": 4, "Dev": 6}, 2),
                (7, [(0, 1, 4), (1, 2, 3), (0, 3, 9), (3, 2, 2), (2, 4, 6), (5, 6, 1)], {"Dev": 6}, 2),
                (3, [(0, 1, 5), (1, 2, 5), (0, 2, 20)], {"Ravi": 0, "Meena": 2}, 1),
                (2, [], {"Uma": 1}, 1),
                (4, [(0, 1, 1), (1, 2, 1), (2, 3, 1), (0, 3, 10)], {"Kiran": 3, "Anil": 2}, 0),
            ]
            _names = ["Asha", "Bilal", "Chitra", "Dev", "Esha", "Farhan", "Gita", "Harish"]
            for _ in range(40):
                _n = _rng.randint(2, 9)
                _roads = [(_rng.randrange(_n), _rng.randrange(_n), _rng.randint(1, 20)) for _ in range(_rng.randint(0, 14))]
                _riders = {}
                for _name in _rng.sample(_names, _rng.randint(1, 5)):
                    _riders[_name] = _rng.randrange(_n)
                _cases.append((_n, _roads, _riders, _rng.randrange(_n)))
            for _n, _roads, _riders, _at in _cases:
                _want = _reference(_n, _roads, _riders, _at)
                _got = nearest_rider(_n, list(_roads), dict(_riders), _at)
                assert _got == _want, "nearest_rider(" + str(_n) + ", " + str(_roads) + ", " + str(_riders) + ", " + str(_at) + ") should be " + str(_want) + ", not " + str(_got)
            assert output.strip() == "(2, 'Bilal') None", "The program should print (2, 'Bilal') None"
