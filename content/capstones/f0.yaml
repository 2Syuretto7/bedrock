cluster: F0
title: Sizing a metro's card system
minutes: 50
claim: You will have sized a city metro's card system from a handful of facts, the taps it records in a day, the bytes it stores in a year and the rate it must handle at the morning rush, and caught a vendor's figure that was a hundred thousand times too large.
brief: |
  Every lesson in this cluster answered one kind of question about numbers. Real questions do not arrive sorted by lesson. This one needs most of the cluster at once.

  **The job.** A city of 80 lakh people is opening a metro. Riders pay by tapping a card on a gate when they enter a station and again when they leave. Before anyone writes a line of software or buys a single server, the city's engineers must answer three questions: how many taps happen in a day, how much storage the records of those taps need, and how many taps a second the system must handle at its busiest. A system sized for the wrong order of magnitude either falls over on its first Monday morning or wastes crores on machines that sit idle.

  You are given the facts below one stage at a time. Nothing here is new. Each step is something you already know how to do, and the work is in seeing which lesson each step belongs to and carrying one stage's result into the next. Keep your results on paper, because later stages use them.

  Some answers are exact. Others are estimates, and for those any answer within a sensible band around the true value is accepted, because the point of an estimate is the size, not the last digit.
stages:
  - title: Riders and taps
    blocks:
      - text: |
          Surveys suggest that on a working day, 1 in every 8 people in the city will ride the metro. Each rider makes two journeys, one there and one back.
      - question:
          id: riders
          type: numeric
          system: s2
          concepts: [f0.ratio-rate-and-proportion, f0.units-prefixes-and-orders-of-magnitude, f0.whole-numbers-and-place-value]
          prompt: How many people ride the metro on a working day? Give the number in full.
          answer: "1000000"
          unit: riders
          explanation: |
            80 lakh is $8 \times 10^6$. One in eight of them is $\frac{8 \times 10^6}{8} = 10^6$, which is ten lakh, or a million.
      - text: |
          Every journey takes two taps: one at the gate going in and one at the gate coming out.
      - question:
          id: taps-per-day
          type: numeric
          system: s1
          concepts: [f0.the-four-operations-and-order-of-operations, f0.units-prefixes-and-orders-of-magnitude]
          prompt: How many taps does the system record on a working day?
          answer: "4000000"
          unit: taps
          explanation: |
            $10^6$ riders $\times$ 2 journeys $\times$ 2 taps $= 4 \times 10^6$ taps, which is 40 lakh.
  - title: What a tap costs to store
    blocks:
      - text: |
          The city plans to issue 4 crore cards over the metro's lifetime, and each card must carry a different number. A computer stores that number in bits.
      - question:
          id: card-bits
          type: numeric
          system: s2
          concepts: [f0.powers-of-two, f0.units-prefixes-and-orders-of-magnitude]
          prompt: What is the smallest number of bits that can give each of 4 crore cards a different number?
          answer: "26"
          unit: bits
          explanation: |
            4 crore is $4 \times 10^7$. $2^{25} = 33{,}554{,}432$, which is too few, and $2^{26} = 67{,}108{,}864$, which is enough. Using $2^{10} \approx 10^3$: $2^{20} \approx 10^6$, and doubling six more times gives about $64 \times 10^6$.
      - text: |
          In practice the card number is given a full 8 bytes, which is far more than 26 bits, so that the city never runs out. With the station, the gate, the time and the fare added, each tap is saved as a record of exactly 64 bytes.
      - question:
          id: bytes-per-day
          type: numeric
          system: s2
          concepts: [f0.units-prefixes-and-orders-of-magnitude, f0.powers-and-roots]
          prompt: How many megabytes (SI, $10^6$ bytes) of tap records does one working day produce?
          answer: "256"
          unit: MB
          explanation: |
            $4 \times 10^6$ taps $\times$ 64 bytes $= 256 \times 10^6$ bytes. Dividing by $10^6$ bytes per megabyte leaves 256 MB.
      - text: |
          Assume, to be safe, that every day of the year is as busy as a working day.
      - question:
          id: gb-per-year
          type: numeric
          system: s2
          concepts: [f0.estimation-and-back-of-the-envelope-reasoning, f0.units-prefixes-and-orders-of-magnitude]
          prompt: About how many gigabytes (SI) of tap records does a year produce?
          answer: "93.44"
          tolerance: "10"
          unit: GB
          explanation: |
            $256 \text{ MB} \times 365 = 93{,}440$ MB, which is about 93 GB. An estimate of $250 \times 400 = 100{,}000$ MB, or 100 GB, is just as useful: either way, under a tenth of a terabyte a year.
      - question:
          id: dashboard-gib
          type: choice
          system: s2
          concepts: [f0.powers-of-two, f0.fractions-decimals-and-percentages]
          prompt: |
            The storage team's dashboard measures in GiB. Roughly what will it show for that year of records?
          options: ["87.0 GiB", "93.4 GiB", "100.3 GiB", "91.3 GiB"]
          answer: 0
          explanation: |
            A GiB is $2^{30} = 1{,}073{,}741{,}824$ bytes, about 7.4% more than a GB, so the same bytes make a smaller number of GiB: $93.44 \div 1.0737 \approx 87.0$. The answer 100.3 multiplies instead of dividing, and 91.3 divides by 1.024 only once.
  - title: The morning rush
    blocks:
      - text: |
          The metro runs for 18 hours a day.
      - question:
          id: average-rate
          type: numeric
          system: s2
          concepts: [f0.ratio-rate-and-proportion, f0.estimation-and-back-of-the-envelope-reasoning]
          prompt: Spread evenly over the 18 hours, about how many taps arrive each second?
          answer: "61.73"
          tolerance: "7"
          unit: taps a second
          explanation: |
            18 hours is $18 \times 3600 = 64{,}800$ seconds. $\frac{4 \times 10^6}{6.48 \times 10^4} \approx 0.62 \times 10^2 \approx 62$ taps a second.
      - text: |
          Nobody rides evenly. Ticket data from other cities shows that one sixth of a day's taps happen in the single hour from 8 to 9 in the morning.
      - question:
          id: peak-rate
          type: numeric
          system: s2
          concepts: [f0.fractions-decimals-and-percentages, f0.ratio-rate-and-proportion, f0.estimation-and-back-of-the-envelope-reasoning]
          prompt: About how many taps arrive each second during that peak hour?
          answer: "185.19"
          tolerance: "10"
          unit: taps a second
          explanation: |
            A sixth of $4 \times 10^6$ is about $6.67 \times 10^5$ taps in one hour, and an hour is 3,600 seconds: $\frac{6.67 \times 10^5}{3.6 \times 10^3} \approx 185$ taps a second.
      - question:
          id: peak-factor
          type: numeric
          system: s2
          concepts: [f0.ratio-rate-and-proportion, f0.fractions-decimals-and-percentages]
          prompt: What is the peak factor, the peak rate divided by the average rate?
          answer: "3"
          tolerance: "0.2"
          explanation: |
            $185 \div 62 \approx 3$. It is exactly 3, and you can see why without the rates: the peak hour carries $\frac{1}{6}$ of the taps in $\frac{1}{18}$ of the time, and $\frac{1}{6} \div \frac{1}{18} = \frac{18}{6} = 3$.
      - text: |
          The server that checks each tap spends 2 milliseconds on it and handles taps one at a time.
      - question:
          id: server-share
          type: numeric
          system: s2
          concepts: [f0.units-prefixes-and-orders-of-magnitude, f0.ratio-rate-and-proportion, f0.fractions-decimals-and-percentages]
          prompt: At the peak, what percentage of one server's capacity is in use?
          answer: "37.04"
          tolerance: "2"
          unit: "%"
          explanation: |
            At 2 ms a tap, one server handles $\frac{1 \text{ s}}{2 \times 10^{-3} \text{ s}} = 500$ taps a second. The peak needs about 185, and $\frac{185}{500} = 0.37$, which is 37%. One server copes, with room to spare; a second is still wise, so that the gates keep working if one fails.
  - title: Balances and a bad figure
    blocks:
      - text: |
          Cards may go into debt by up to ₹50, so that nobody is stuck at a gate. A card holds ₹40 when its rider taps out of a journey that costs ₹65.
      - question:
          id: card-balance
          type: numeric
          system: s1
          concepts: [f0.negative-numbers]
          prompt: What balance, with its sign, does the system record for the card, in rupees?
          answer: "-25"
          unit: rupees
          explanation: |
            $40 - 65 = -25$. The card owes ₹25, which is within the ₹50 limit, so the gate opens. One signed number records both the amount and the debt.
      - text: |
          A vendor bidding for the contract writes in its proposal that the city must buy storage for "25.6 TB of tap records a day".
      - question:
          id: vendor-figure
          type: choice
          system: s2
          concepts: [f0.estimation-and-back-of-the-envelope-reasoning, f0.units-prefixes-and-orders-of-magnitude]
          prompt: Which observation shows fastest that the vendor's figure cannot be right?
          options:
            - "It is 6.4 MB for each of the 40 lakh taps, the size of a phone photograph, when a tap's record is 64 bytes."
            - "It is a decimal, and storage is always bought in whole terabytes."
            - "It should be in GiB, because computers count in powers of two."
            - "It is too small, because a metro is a large system."
          answer: 0
          explanation: |
            $\frac{2.56 \times 10^{13} \text{ bytes}}{4 \times 10^6 \text{ taps}} = 6.4 \times 10^6$ bytes a tap. Your own figure is 256 MB a day, and the vendor's is $10^5$ times that. The digits 256 match, so the slip is five places of the decimal point, the kind of mistake that an estimate catches without redoing a single sum.
review: |
  You started with the size of a city and a few habits of its riders, and ended with a sized system: four million taps a day, about a quarter of a gigabyte of records a day and under a tenth of a terabyte a year, and a morning peak of about 185 taps a second, three times the average and well within one server's 500.

  Each step came from a lesson you have finished:

  - Turning 80 lakh into $8 \times 10^6$ and a day's bytes into megabytes was [[f0.units-prefixes-and-orders-of-magnitude]], resting on [[f0.whole-numbers-and-place-value]].
  - One rider in eight, taps per second and the server's capacity were rates, from [[f0.ratio-rate-and-proportion]], multiplied out with [[f0.the-four-operations-and-order-of-operations]].
  - The 26 bits for a card number and the dashboard's GiB came from [[f0.powers-of-two]], and multiplying powers of ten by adding exponents from [[f0.powers-and-roots]].
  - The sixth of a day in one hour, the peak factor and the server's 37% were [[f0.fractions-decimals-and-percentages]].
  - The card in debt was [[f0.negative-numbers]].
  - Estimating the year, the rates and the vendor's slip was [[f0.estimation-and-back-of-the-envelope-reasoning]].

  The habit worth keeping is the one the last stage used: before trusting any figure, yours or a vendor's, divide it by something you know and see whether what is left makes sense. Six megabytes for a single tap of a card does not.
