          explanation: |
            Keep a stack and a program counter, and loop while the counter is inside the code: fetch the instruction, move the counter on, then act on it. Jumps overwrite the counter, and `JUMP_IF_FALSE` pops its condition first. Popping the left operand first reverses `-` and `>`, so the test becomes `10 > km`; jumping when the condition is true runs the wrong branch; and stopping one instruction early skips `PUSH 25`, leaving the stack empty.
  - title: The rule that said free
    blocks:
      - text: |
          On a Friday someone saves `if km > 10 then 15 + 2 * km else "free"` for a short feeder route. It works for every long trip. On Sunday the first short trip reaches the payment step, which adds a toll to the fare, and the payment crashes with a TypeError, far from the rule that caused it.
      - question:
          id: rule-types
          type: choice
          system: s2
          concepts: [s7.static-and-dynamic-types]
          prompt: |
            What change stops a rule like this from reaching passengers?
          options:
            - "Type-check each rule when it is saved, giving every node of its tree a type and rejecting a conditional whose branches differ, so the person writing it sees the error."
            - "Catch the TypeError in the payment step and charge 0."
            - "Convert every fare with int() wherever it is used."
            - "Run each new rule once with a distance of 20 km before saving it."
          answer: 0
          explanation: |
            A static check looks at both branches whatever the distance, and reports the mistake at the moment and place it was made. Charging 0 silently guesses, as weak typing does; `int("free")` just moves the crash; and one sample distance takes only one branch, the one that works.
  - title: Every route at the same rate
    blocks:
      - text: |
          To make the simplest rules faster, a developer turns each flat per-kilometre rate into a Python function at start-up:

          ```python
          rules = {}
          for route, rate in [("101", 2), ("205", 3), ("330", 5)]:
              rules[route] = lambda km: rate * km
          ```
      - question:
          id: late-binding
          type: numeric
          system: s2
          concepts: [s7.scope-closures-and-higher-order-functions]
          prompt: |
            After the loop, what does `rules["101"](10)` return?
          answer: "50"
          explanation: |
            All three lambdas capture the same variable `rate`, and read it when they are called, after the loop has left it at 5. Route 101 charges 5 per km instead of 2. Writing `lambda km, rate=rate: rate * km` gives each function its own value.
  - title: Memory that never comes back
    blocks:
      - text: |
          The parser now builds trees in which every node refers to its children and also to its parent, so that error messages can show the surrounding rule. To cut pauses, someone added `gc.disable()` at start-up. The rule server's memory now grows by about 2 MB for every thousand rules it parses and never shrinks, although no list or dictionary keeps the old trees.
      - question:
          id: tree-cycles
          type: choice
          system: s2
          concepts: [s7.memory-management-and-garbage-collection]
          prompt: |
            What is happening, and what is the fix?
          options:
            - "Parent and child links make every tree a cycle, which reference counting cannot free and the disabled cycle collector never visits; turn the collector back on, or make the parent links weak references."
            - "Reference counts overflow after many rules; restart the server every night."
            - "Python never frees objects created inside a loop; move the parsing into a function."
            - "The trees are still named; call del on each tree's root when it is finished with."
          answer: 0
          explanation: |
            Once a tree is dropped, its nodes are unreachable but each still has a count above 0 from its parent or a child, so only a tracing pass can free them, and that pass was switched off. Reference counts do not overflow; objects made in loops are freed like any others; and `del` removes a name, which leaves the cycle exactly as it was.
review: |
  The fare rules now have a language of their own, and each step came from a lesson of this cluster:

  - The tokeniser turned `rate*km+toll>=150` into 7 tokens by taking the longest match, as in [[s7.tokenising]].
  - Route codes are checked with `fullmatch` and bounded repeats, a finite automaton from [[s7.regular-expressions-and-finite-automata]].
  - A two-level grammar from [[s7.grammars-and-parsing]] made `40 - 2 * km - 5` give 15 for 10 km, the tree that [[s7.syntax-trees-and-evaluation]] evaluates.
  - `eval` gave way to an evaluator whose only names are the fare variables, closing the route to the built-ins that the lookup rules of [[s7.scope-closures-and-higher-order-functions]] leave open.
  - Rules compile to instructions that a stack machine runs, the design of [[s7.how-python-runs-bytecode-and-the-interpreter-loop]].
  - A rule whose branches disagree is rejected when it is saved, a static check from [[s7.static-and-dynamic-types]].
  - The closures that all charged 5 per km now each keep their own rate.
  - The parse trees' cycles are freed again once the collector is back on, as [[s7.memory-management-and-garbage-collection]] explains.

  Notice what the wrong answers had in common: block a word, catch the error, convert the value, restart the server, test one example. Each treated a symptom where it appeared, far from its cause. The right answers decided, at the moment a rule is read, exactly what it is allowed to mean, and left nothing to be guessed later. The next cluster goes below the interpreter, to the machine itself: logic gates, arithmetic circuits, and a processor that fetches and runs instructions of its own.
