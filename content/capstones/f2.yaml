cluster: F2
title: Evidence is not proof
minutes: 75
claim: You will have taken claims about every whole number, tested them by machine, broken one with a counterexample your own program found, proved the others with a method chosen to fit each, and turned one of those proofs into a loop that checks its own invariant.
brief: |
  You can write programs, and a program can check a claim for a thousand numbers in a blink. It is tempting to think that settles things. This project is about what such checking is worth and what it is not, and about what you do instead.

  **The project.** A friend preparing for an olympiad has copied four claims into a notebook from a coaching-centre handout. Each is about every whole number of some kind:

  - **A.** For every $n \ge 1$, the sum of the first $n$ odd numbers is $n^2$. That is, $1 + 3 + \dots + (2n - 1) = n^2$.
  - **B.** For every $n \ge 0$, the number $n^2 + n + 41$ is prime.
  - **C.** For every integer $n$, if $n^2$ is even then $n$ is even.
  - **D.** For every integer $n$, the number $n^2 + n$ is even.

  For each one you must end up knowing whether it is true, and knowing why. Three are true and one is false, and checking the first few dozen cases would not tell you which. Your friend has checked the first twenty of each and written "all true" beside every one.

  Nothing here is new. Every tool comes from this cluster. The work is in choosing the tool that fits each claim, and in seeing that a proof and a correct loop are the same kind of argument.
starter: |
  # Scratch space. Try a claim on a few numbers here.
  for n in range(1, 6):
      odd = [2 * k - 1 for k in range(1, n + 1)]
      print(n, sum(odd), n * n)
stages:
  - title: What exactly is being claimed
    blocks:
      - text: |
          All four claims begin "for every". Before testing or proving anything, be exact about what it would mean for such a claim to be false. Take claim A, and write $S(n)$ for the sum of the first $n$ odd numbers.
      - question:
          id: negation
          type: choice
          system: s1
          concepts: [f2.quantifiers-and-their-negation]
          prompt: Which statement is the negation of claim A?
          options:
            - "There exists an $n \\ge 1$ with $S(n) \\ne n^2$."
            - "For every $n \\ge 1$, $S(n) \\ne n^2$."
            - "There exists an $n < 1$ with $S(n) = n^2$."
            - "For every $n < 1$, $S(n) \\ne n^2$."
          answer: 0
          explanation: |
            Negating "for every" gives "there exists", and the statement after it is negated. The domain being spoken about, the $n \ge 1$, does not change. So the claim fails exactly when some single $n \ge 1$ gives a sum different from $n^2$.
      - question:
          id: what-settles-it
          type: choice
          system: s2
          concepts: [f2.quantifiers-and-their-negation, f2.propositions-and-connectives]
          prompt: A program checks claim A for $n = 1$ up to $n = 1000$ and finds it true each time. What has been established?
          options:
            - That the claim holds for those thousand values, and nothing about any other. One failing value would refute the claim, but no number of passing values can prove it.
            - That the claim is true, since a thousand cases are more than enough to rule out coincidence.
            - That the claim is very probably true, and mathematics accepts a claim once it is probable enough.
            - Nothing at all, because checking by program is not a valid form of argument.
          answer: 0
          explanation: |
            A "for every" claim over infinitely many numbers is refuted by one counterexample and proved only by an argument that covers all of them at once. A thousand checks are honest evidence about a thousand numbers. They are worth having, since they would have exposed a false claim that fails early, but they say nothing about $n = 1001$. Your friend's twenty checks are in the same position, only weaker.
  - title: Let the machine look for trouble
    blocks:
      - text: |
          Checking is still the right first move. If a claim is false, a search may find the counterexample and save you from trying to prove something untrue.

          You will write the search once, for any claim. A claim about whole numbers can be given to Python as a function that takes $n$ and returns `True` or `False`, and the search is the negation from the last stage turned into a loop: look for an $n$ at which the claim is false.
      - question:
          id: first-failure
          type: code
          mode: write
          system: s2
          concepts: [f2.quantifiers-and-their-negation]
          prompt: |
            Write `first_failure(claim, limit)`. It tries `claim(n)` for $n = 0, 1, 2, \dots$ up to but not including `limit`, and returns the **smallest** $n$ for which the claim is false. If the claim holds for every one of those $n$, it returns `None`.

            `is_prime` is given, so that you can use your function on claim B afterwards.
          starter: |
            def is_prime(m):
                if m < 2:
                    return False
                d = 2
                while d * d <= m:
                    if m % d == 0:
                        return False
                    d += 1
                return True


            def first_failure(claim, limit):
                return None
          solution: |
            def is_prime(m):
                if m < 2:
                    return False
                d = 2
                while d * d <= m:
                    if m % d == 0:
                        return False
                    d += 1
                return True


            def first_failure(claim, limit):
                for n in range(limit):
                    if not claim(n):
                        return n
                return None
          tests: |
            assert first_failure(lambda n: n < 5, 10) == 5, "For a claim that first fails partway through, return the n at which it fails"
            assert first_failure(lambda n: n != 3 and n != 7, 10) == 3, "When a claim fails more than once, return the smallest failing n"
            assert first_failure(lambda n: False, 10) == 0, "The search should begin at n = 0"
            assert first_failure(lambda n: n < 5, 5) is None, "limit itself is not tried"
            assert first_failure(lambda n: n * n >= 0, 200) is None, "When the claim holds throughout, return None"
            assert first_failure(lambda n: n < 5, 10) is not True and first_failure(lambda n: n < 5, 10) is not False, "Return the failing number itself, not True or False"
          wrong:
            - |
              def first_failure(claim, limit):
                  failure = None
                  for n in range(limit):
                      if not claim(n):
                          failure = n
                  return failure
            - |
              def first_failure(claim, limit):
                  for n in range(1, limit + 1):
                      if not claim(n):
                          return n
                  return None
            - |
              def first_failure(claim, limit):
                  return not all(claim(n) for n in range(limit))
          explanation: |
            The function is "there exists an $n$ with not $P(n)$" made concrete: it looks for a witness to the negation and reports the first one. Returning as soon as one is found gives the smallest. Returning `None` at the end says only that no counterexample lies below `limit`, which is evidence and not proof.
      - text: |
          Now use it. Claim B, as a Python function, is `lambda n: is_prime(n * n + n + 41)`. Run your search in the editor with a limit of 100.
      - question:
          id: euler-fails
          type: numeric
          system: s1
          concepts: [f2.quantifiers-and-their-negation]
          prompt: What is the smallest $n \ge 0$ for which $n^2 + n + 41$ is not prime?
          answer: "40"
          explanation: |
            The claim holds for every $n$ from 0 to 39 and fails at the next one. Forty passing cases in a row, twice as many as your friend checked, and the claim is false. That single verified failure disproves claim B completely.
      - question:
          id: why-it-fails
          type: choice
          system: s2
          concepts: [f2.quantifiers-and-their-negation, f2.direct-proof]
          prompt: A counterexample should be verified, not just reported by a program. Which line shows by hand that the number at that $n$ is not prime?
          options:
            - "$n^2 + n + 41 = n(n + 1) + 41$, and when $n + 1 = 41$ this is $40 \\times 41 + 41 = 41 \\times 41$."
            - "$n^2 + n + 41$ is even at that $n$, because $n$ is even, so 2 divides it."
            - "$n^2 + n + 41$ is larger than 1000 at that $n$, and primes that large are rare."
            - "The program returned that $n$, and `is_prime` was given as correct."
          answer: 0
          explanation: |
            Factorising $n^2 + n$ as $n(n + 1)$ shows the trouble coming. When $n + 1 = 41$, both parts of $n(n + 1) + 41$ are multiples of 41, so the whole is $41 \times (40 + 1) = 41^2 = 1681$. A number with a divisor other than 1 and itself is not prime. The second option fails on its own terms: $n(n + 1)$ is always even, so $n^2 + n + 41$ is always odd.
  - title: A proof that covers every case
    blocks:
      - text: |
          Your search finds no counterexample to claim A, however high the limit. That is a reason to try to prove it. It concerns every $n \ge 1$, and each case leans on the one before: the sum for $n + 1$ is the sum for $n$ with one more odd number added. That is the shape induction is made for.
      - question:
          id: induction-order
          type: order
          system: s2
          concepts: [f2.induction-and-strong-induction, f2.direct-proof]
          prompt: Put the steps of the proof of claim A in order.
          steps:
            - "Base case. For $n = 1$ the sum is $1$, and $1^2 = 1$."
            - "Inductive hypothesis. Suppose that $1 + 3 + \\dots + (2k - 1) = k^2$ for some $k \\ge 1$."
            - "The next odd number after $2k - 1$ is $2k + 1$. Add it to both sides of the hypothesis."
            - "The right-hand side is now $k^2 + 2k + 1$."
            - "But $k^2 + 2k + 1 = (k + 1)^2$, so the sum of the first $k + 1$ odd numbers is $(k + 1)^2$."
            - "By induction, the claim holds for every $n \\ge 1$."
          explanation: |
            The base case starts the chain. The hypothesis assumes the claim at one unspecified $k$, and the middle steps, a short direct proof, show that the claim at $k + 1$ follows from it. Only once both parts are in hand may induction be invoked to conclude for every $n$.
      - text: |
          To see why both parts are needed, consider a false rival to claim A: "for every $n \ge 1$, the sum of the first $n$ odd numbers is $n^2 + 1$."
      - question:
          id: missing-base
          type: choice
          system: s2
          concepts: [f2.induction-and-strong-induction, f2.propositions-and-connectives]
          prompt: Try the inductive step on the rival claim. What happens, and what does it show?
          options:
            - The step goes through, since $k^2 + 1 + (2k + 1) = (k + 1)^2 + 1$. The base case fails, since the sum for $n = 1$ is 1 and not 2. A valid step with no true base case proves nothing.
            - The step fails, because adding $2k + 1$ to $k^2 + 1$ does not give $(k + 1)^2 + 1$. That is how induction detects a false claim.
            - Both the step and the base case go through, so the rival claim is true as well, and the sum has two formulas.
            - The step goes through and so the rival claim holds for every $n \ge 2$, failing only at $n = 1$.
          answer: 0
          explanation: |
            The inductive step says only "if the claim holds at $k$, it holds at $k + 1$". For the rival claim that implication is true at every $k$, yet the claim is false at every $n$: it is never true anywhere for the implication to start from. An implication with a false hypothesis is true whatever its conclusion, so it tells you nothing about the conclusion. The base case is what puts a true statement at the start of the chain.
  - title: The proof inside a program
    blocks:
      - text: |
          Claim A has a second life as a program. This loop builds $n^2$ by adding odd numbers, and it never multiplies:

          ```python
          def square_by_odds(n):
              total, k, odd = 0, 0, 1
              while k < n:
                  total += odd
                  odd += 2
                  k += 1
              return total
          ```

          The induction you have just finished is, almost word for word, the proof that this loop is right. What turns it into that proof is the invariant: the statement about `total`, `k` and `odd` that holds every time the loop reaches its test.
      - question:
          id: which-invariant
          type: choice
          system: s2
          concepts: [f2.loop-invariants, f2.induction-and-strong-induction]
          prompt: Which invariant proves that `square_by_odds(n)` returns $n^2$ for every whole number $n$?
          options:
            - "`total == k * k`, `odd == 2 * k + 1` and `k <= n`. They hold at the start, each pass keeps them, and at the exit `k <= n` with `not k < n` gives `k == n`, so `total` is $n^2$."
            - "`total == k * k` on its own. It is true at the top of every pass, and at the exit it gives $n^2$."
            - "`total == n * n`. It is what the function promises to return."
            - "`k <= n` on its own. It holds at the start, each pass keeps it, and the loop stops."
          answer: 0
          explanation: |
            An invariant must be strong enough to carry itself through a pass. From `total == k * k` alone you cannot show that `total + odd` is $(k + 1)^2$, because it says nothing about `odd`. That is why the second option fails, even though it is true at every pass. With `odd == 2 * k + 1` added, a pass gives $k^2 + (2k + 1) = (k + 1)^2$, the inductive step of claim A, and `odd` becomes $2k + 3 = 2(k + 1) + 1$. The third option is false until the very end. The fourth is true and needed for the exit, but says nothing about `total`. The variant $n - k$ falls by 1 on every pass and cannot go below 0, so the loop stops.
      - text: |
          A colleague tidied the loop, putting the invariant in as an `assert` and swapping two lines on the way. Now the program stops with an `AssertionError`. The invariant held at the first check, so the fault lies in the pass between the first check and the second.
      - question:
          id: fix-reordered-loop
          type: code
          mode: find-bug
          system: s2
          concepts: [f2.loop-invariants, f2.induction-and-strong-induction]
          prompt: |
            Use the invariant to find the line that breaks it, and fix `square_by_odds` so that the program prints 144. Keep the `assert`: it is the invariant, and it should hold on every pass of the corrected loop.
          starter: |
            def square_by_odds(n):
                total, k, odd = 0, 0, 1
                while k < n:
                    assert total == k * k and odd == 2 * k + 1, (k, total, odd)
                    odd += 2
                    total += odd
                    k += 1
                return total

            print(square_by_odds(12))
          solution: |
            def square_by_odds(n):
                total, k, odd = 0, 0, 1
                while k < n:
                    assert total == k * k and odd == 2 * k + 1, (k, total, odd)
                    total += odd
                    odd += 2
                    k += 1
                return total

            print(square_by_odds(12))
          tests: |
            assert "assert" in source, "Keep the invariant check in the loop"
            assert square_by_odds(0) == 0, "Adding no odd numbers gives 0"
            assert square_by_odds(1) == 1, "The first odd number is 1"
            assert square_by_odds(2) == 4, "1 + 3 is 4"
            for _n in range(30):
                assert square_by_odds(_n) == _n * _n, "square_by_odds(" + str(_n) + ") should be " + str(_n * _n)
            assert output.strip() == "144", "The program should print 144"
          wrong:
            - |
              def square_by_odds(n):
                  total, k, odd = 0, 0, 1
                  while k < n:
                      odd += 2
                      total += odd
                      k += 1
                  return total

              print(square_by_odds(12))
            - |
              def square_by_odds(n):
                  total, k, odd = 0, 0, 1
                  while k < n:
                      assert total == k * k + 2 * k and odd == 2 * k + 1, (k, total, odd)
                      odd += 2
                      total += odd
                      k += 1
                  return total

              print(square_by_odds(12))
            - |
              def square_by_odds(n):
                  total, k, odd = 0, 0, -1
                  while k < n:
                      odd += 2
                      total += odd
                      k += 1
                  return total

              print(square_by_odds(12))
          explanation: |
            The check that fails is the one at the top of the second pass, with `k` at 1, `total` at 3 and `odd` at 3. One pass ought to add the odd number that the invariant says `odd` holds, $2k + 1$, and only then move `odd` on. The swapped lines add $2k + 3$ instead, so after $k$ passes `total` is $k^2 + 2k$. Changing the `assert` to say so would silence it, but the function would still be wrong: an invariant states what the loop must do, and it is the code that has to be brought into line.
  - title: Choosing the method
    blocks:
      - text: |
          Claim C says that if $n^2$ is even then $n$ is even. A direct proof would begin "suppose $n^2$ is even" and then need to say something about $n$, which would mean taking a square root of an unknown even number. That is an awkward start. When the hypothesis is hard to use, look at the contrapositive.
      - question:
          id: contrapositive
          type: choice
          system: s1
          concepts: [f2.contrapositive-and-contradiction, f2.propositions-and-connectives]
          prompt: Which statement is the contrapositive of claim C?
          options:
            - "If $n$ is odd, then $n^2$ is odd."
            - "If $n$ is even, then $n^2$ is even."
            - "If $n^2$ is odd, then $n$ is odd."
            - "$n^2$ is even and $n$ is odd."
          answer: 0
          explanation: |
            The contrapositive of "if $P$ then $Q$" is "if not $Q$ then not $P$", and it is true exactly when the original is. For integers, not even means odd. The second option is the converse. The third negates both parts without turning them round, and it is equivalent to the converse, not to claim C. The fourth is the negation of claim C, the one situation that would make it false.
      - question:
          id: contrapositive-step
          type: choice
          system: s2
          concepts: [f2.direct-proof, f2.contrapositive-and-contradiction]
          prompt: The contrapositive can be proved directly. Which line is the heart of that proof?
          options:
            - "Write $n = 2k + 1$. Then $n^2 = 4k^2 + 4k + 1 = 2(2k^2 + 2k) + 1$, which is odd."
            - "Check $n = 1, 3, 5, 7$ and observe that the squares $1, 9, 25, 49$ are all odd."
            - "Write $n^2 = 2k$. Then $n = \\sqrt{2k}$, which is even."
            - "Suppose $n$ is odd and $n^2$ is even, and note that this cannot happen."
          answer: 0
          explanation: |
            A direct proof takes an arbitrary $n$ satisfying the hypothesis, unpacks the definition (odd means $2k + 1$ for some integer $k$), computes, and packs the result back into the definition of the conclusion (twice an integer, plus one). Checking four values is evidence, the third option assumes what is to be shown, and the fourth states the goal without proving it.
      - text: |
          Claim D says that $n^2 + n$ is even for every integer $n$, negative ones included. Induction climbs up from a starting number and would not reach the negative integers without a second argument. But every integer is either even or odd, and that suggests another method.
      - question:
          id: by-cases
          type: choice
          system: s2
          concepts: [f2.direct-proof, f2.equivalence-relations-and-partial-orders]
          prompt: Which argument proves claim D?
          options:
            - "Write $n^2 + n = n(n + 1)$. If $n$ is even, the product has the even factor $n$. If $n$ is odd, then $n + 1$ is even, and the product has that even factor. These two cases cover every integer."
            - "Write $n^2 + n = n(n + 1)$. If $n$ is even, the product has the even factor $n$, so the claim holds."
            - "If $n$ is positive, $n^2 + n$ is positive, and if $n$ is negative, $n^2 + n$ is not negative. These two cases cover every integer."
            - "Your search found no failure of the claim below one million, and negative $n$ behave like positive ones."
          answer: 0
          explanation: |
            A proof by cases must do two things: the cases together must cover every possibility, and the claim must be proved in each. Even and odd are the two classes of congruence modulo 2, and the classes of an equivalence relation split the integers with nothing left over, so these cases cover everything. In each, one of the two consecutive numbers $n$ and $n + 1$ is even. The second option proves one case and stops. The third splits by sign, which leaves out zero and says nothing about evenness.
review: |
  Four claims, four different endings:

  - Claim B was false. Your search, the negation of a "for every" statement turned into a loop, found a counterexample after forty passing cases, and you verified it by hand. Stating negations exactly is from [[f2.quantifiers-and-their-negation]], and the verification was a short [[f2.direct-proof]].
  - Claim A was proved by induction, from [[f2.induction-and-strong-induction]], and the rival claim showed why the base case cannot be left out: an implication with a false hypothesis, from [[f2.propositions-and-connectives]], proves nothing.
  - The same proof became a loop. Its invariant, from [[f2.loop-invariants]], had to say what `odd` holds as well as what `total` holds, and when two lines were swapped the `assert` caught the fault at the first pass that went wrong.
  - Claim C was awkward directly and easy through its contrapositive, from [[f2.contrapositive-and-contradiction]], which was itself proved by unpacking a definition.
  - Claim D was proved by splitting the integers into even and odd, the two classes of an equivalence relation from [[f2.equivalence-relations-and-partial-orders]].

  Keep the order of work as well as the methods. You stated the claim and its negation exactly, searched for a counterexample by machine, and attempted a proof only when the search came back empty. Then you picked the method by the shape of the claim. A program that passes its tests is in the position claim B was in at $n = 39$. When it matters that something is right for every input, tests are where you begin, and an argument, often an invariant, is where you finish. Your friend's notebook should now read "true, true, false, true", with a reason beside each.
