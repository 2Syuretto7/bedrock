          explanation: |
            The loop steps through the file 12 bytes at a time, and a slice that runs past the end simply comes back short, so a cut-off piece fails `valid` like any other damage. Stopping at the last whole record would hide that piece, stepping by 11 reads every record after the first from the wrong place, and breaking out at the first damaged record throws away every good record after it.
  - title: The day's report
    blocks:
      - text: |
          The station manager wants three lines: which station was busiest, counting taps in and out alike, how much was collected in fares, and how many damaged records were skipped. Fares stay in whole paise until the very end, and only the finished total is written as rupees and paise, with `//` and `%`, as in the lesson on floating point.
      - question:
          id: paise-not-floats
          type: choice
          system: s2
          concepts: [h0.floating-point-and-ieee-754]
          prompt: Why should the program add up the fares as whole paise instead of converting each one to rupees as a float first?
          options:
            - "Because floats cannot hold numbers as large as a day's fares."
            - "Because amounts like 18.90 have no exact binary float, and a sum of many such floats can drift away from the exact total, while whole numbers of paise add up exactly."
            - "Because the file stores the fares as text."
            - "Because Python cannot add floats in a loop."
          answer: 1
          explanation: |
            As in the lesson on floating point, 18.90 is stored as the nearest binary fraction, a tiny bit off. Integers in Python are exact at any size, so a ledger in paise never drifts.
      - question:
          id: report
          type: code
          mode: write
          system: s2
          concepts: [h0.floating-point-and-ieee-754, h0.alignment-and-the-size-of-things, s0.dictionaries-and-sets, s0.strings, s0.functions]
          prompt: |
            Write `report(data, names)`. It reads the file with `read_taps` and **returns** a string of three lines, with `"\n"` between them, like this:

            ```
            Busiest station: Central Station, 5 taps
            Fares collected: ₹109.80
            Damaged records skipped: 1
            ```

            The busiest station is the one with the most valid taps, in and out together. If two stations tie, name the one with the smaller number. The fares line always shows two digits of paise. `names` is a dictionary from station number to name, and every file has at least one valid record. `read_taps` and everything it uses are written for you.
          starter: |
            import struct

            def valid(record):
                if len(record) != 12:
                    return False
                check = 0
                for i in range(11):
                    check = check ^ record[i]
                return check == record[11]

            def decode(record):
                card, station, kind, fare, minute = struct.unpack("<IHcHH", record[:11])
                return (card, station, kind.decode(), fare, minute)

            def read_taps(data):
                taps = []
                damaged = 0
                for start in range(0, len(data), 12):
                    record = data[start:start + 12]
                    if valid(record):
                        taps.append(decode(record))
                    else:
                        damaged += 1
                return (taps, damaged)

            def report(data, names):
                return ""
          solution: |
            import struct

            def valid(record):
                if len(record) != 12:
                    return False
                check = 0
                for i in range(11):
                    check = check ^ record[i]
                return check == record[11]

            def decode(record):
                card, station, kind, fare, minute = struct.unpack("<IHcHH", record[:11])
                return (card, station, kind.decode(), fare, minute)

            def read_taps(data):
                taps = []
                damaged = 0
                for start in range(0, len(data), 12):
                    record = data[start:start + 12]
                    if valid(record):
                        taps.append(decode(record))
                    else:
                        damaged += 1
                return (taps, damaged)

            def report(data, names):
                taps, damaged = read_taps(data)
                counts = {}
                paise = 0
                for card, station, kind, fare, minute in taps:
                    counts[station] = counts.get(station, 0) + 1
                    paise += fare
                best = None
                for station in sorted(counts):
                    if best is None or counts[station] > counts[best]:
                        best = station
                busiest = f"Busiest station: {names[best]}, {counts[best]} taps"
                fares = f"Fares collected: ₹{paise // 100}.{paise % 100:02d}"
                skipped = f"Damaged records skipped: {damaged}"
                return busiest + "\n" + fares + "\n" + skipped
          tests: |
            import struct as _struct
            def _rec(card, station, kind, fare, minute):
                body = _struct.pack("<IHcHH", card, station, kind.encode(), fare, minute)
                check = 0
                for b in body:
                    check = check ^ b
                return body + bytes([check])
            _names = {1: "Airport", 2: "MG Road", 3: "Central Station", 4: "University", 5: "Old Market"}
            _taps = [(40001, 3, "I", 0, 485), (40002, 2, "I", 0, 490), (40001, 4, "O", 2700, 512), (40003, 3, "I", 0, 515), (40002, 3, "O", 1890, 520), (40004, 1, "I", 0, 530), (40003, 5, "O", 2250, 540), (40004, 3, "O", 4500, 575), (40005, 2, "I", 0, 600), (40005, 3, "O", 1890, 618)]
            _recs = []
            for _t in _taps:
                _recs.append(_rec(_t[0], _t[1], _t[2], _t[3], _t[4]))
            _r = _recs[6]
            _recs[6] = _r[:9] + bytes([_r[9] ^ 4]) + _r[10:]
            _day = bytes(0)
            for _x in _recs:
                _day = _day + _x
            assert report(_day, _names) == "Busiest station: Central Station, 5 taps\nFares collected: ₹109.80\nDamaged records skipped: 1", "The morning's file should report Central Station with 5 taps, ₹109.80 and 1 damaged record"
            _tie = _rec(1, 4, "I", 0, 600) + _rec(2, 2, "I", 0, 601) + _rec(1, 2, "O", 3005, 640) + _rec(2, 4, "O", 3000, 650)
            assert report(_tie, _names) == "Busiest station: MG Road, 2 taps\nFares collected: ₹60.05\nDamaged records skipped: 0", "A tie between stations 2 and 4 should name station 2, MG Road, and ₹60.05 needs two digits of paise"
