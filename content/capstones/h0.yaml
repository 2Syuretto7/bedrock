                      record = data[start:start + 12]
                      if valid(record):
                          taps.append(decode(record))
                      else:
                          damaged += 1
                  return (taps, damaged)
            - |
              import struct

              def valid(record):
                  if len(record) != 12:
                      return False
                  check = 0
                  for i in range(11):
                      check = check ^ record[i]
                  return check == record[11]

              def decode(record):
                  card, station, kind, fare, minute = struct.unpack("<IHcHH", record[:11])
                  return (card, station, kind.decode(), fare, minute)

              def read_taps(data):
